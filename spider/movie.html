<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화관람 🎬 | 을지로 1박 2일</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 영화관 네온 컬러 팔레트 (빨강 + 노랑) ===== */
        :root {
            --red:       #FF2C2C;   /* 네온 빨강 */
            --red-soft:  #FF7A7A;   /* 옅은 빨강 */
            --yellow:    #FFE600;   /* 네온 노랑 */
            --yellow-soft: #FFF38A;
            --gold:      #FFB800;
            --black:     #0A0A0F;
            --night:     #1A1322;
            --paper-dim: #1F1A1A;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: 'Gowun Batang', serif;
            background: var(--black);
            position: relative;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(255, 44, 44, 0.3);
            min-height: 100vh;
            padding-bottom: 30px;
            overflow-x: hidden;
            /* 밤하늘 그라데이션 + 빨간 빛 */
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(255, 44, 44, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 230, 0, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, var(--night) 0%, var(--black) 100%);
        }

        /* 별 점박이 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            max-width: 420px;
            left: 50%;
            transform: translateX(-50%);
            background-image:
                radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.5) 1px, transparent 1.5px),
                radial-gradient(circle at 25% 80%, rgba(255, 255, 255, 0.3) 1px, transparent 1.5px),
                radial-gradient(circle at 80% 25%, rgba(255, 255, 255, 0.4) 1px, transparent 1.5px),
                radial-gradient(circle at 45% 60%, rgba(255, 255, 255, 0.25) 1px, transparent 1.5px),
                radial-gradient(circle at 90% 70%, rgba(255, 255, 255, 0.4) 1px, transparent 1.5px);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 상단 바 ===== */
        .top-bar {
            background: var(--black);
            color: var(--yellow);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--red);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            color: var(--yellow);
            text-decoration: none;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--yellow);
        }

        .top-bar .page-title {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 16px;
            color: var(--red);
            letter-spacing: 4px;
            text-shadow: 0 0 8px var(--red);
        }

        .top-bar .placeholder { width: 50px; }

        /* ============================================
           네온 간판 (영화관)
           ============================================ */
        .neon-sign {
            margin: 36px 20px 0;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* 한자 (서브) */
        .neon-sign .han {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 24px;
            color: var(--yellow);
            letter-spacing: 12px;
            margin-bottom: 8px;
            text-shadow:
                0 0 6px var(--yellow),
                0 0 14px var(--yellow),
                0 0 24px rgba(255, 230, 0, 0.5);
            animation: yellowFlicker 4s infinite;
        }

        /* 메인 글자 */
        .neon-sign .name {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 56px;
            color: var(--red);
            letter-spacing: 4px;
            line-height: 1;
            text-shadow:
                0 0 8px var(--red),
                0 0 18px var(--red),
                0 0 32px var(--red),
                0 0 50px rgba(255, 44, 44, 0.5);
            animation: redFlicker 3.5s infinite;
        }

        /* 영문 */
        .neon-sign .en {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: var(--yellow);
            letter-spacing: 8px;
            margin-top: 14px;
            text-shadow:
                0 0 6px var(--yellow),
                0 0 14px var(--yellow);
            animation: yellowFlicker 5s infinite;
        }

        .neon-sign .emoji {
            font-size: 28px;
            margin-top: 14px;
            filter: drop-shadow(0 0 8px rgba(255, 44, 44, 0.6));
            animation: bob 3s ease-in-out infinite;
        }

        /* "上映中" 네온 표시 (상영중) */
        .now-showing {
            display: inline-block;
            margin-top: 22px;
            padding: 8px 18px;
            background: rgba(255, 44, 44, 0.12);
            border: 2px solid var(--red);
            color: var(--red);
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 18px;
            letter-spacing: 6px;
            box-shadow:
                0 0 12px rgba(255, 44, 44, 0.5),
                inset 0 0 12px rgba(255, 44, 44, 0.2);
            text-shadow: 0 0 6px var(--red);
            animation: redFlicker 2.5s infinite;
        }

        /* 깜빡임 애니메이션 */
        @keyframes redFlicker {
            0%, 100% { opacity: 1; }
            41% { opacity: 1; }
            42% { opacity: 0.85; }
            43% { opacity: 1; }
            45% { opacity: 0.6; }
            46% { opacity: 1; }
            93% { opacity: 1; }
            94% { opacity: 0.9; }
            95% { opacity: 1; }
        }

        @keyframes yellowFlicker {
            0%, 100% { opacity: 1; }
            70% { opacity: 1; }
            71% { opacity: 0.7; }
            72% { opacity: 1; }
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        /* ============================================
           영화 티켓 (네온 톤)
           ============================================ */
        .ticket-wrap {
            margin: 32px 16px 0;
            position: relative;
            z-index: 1;
        }

        .ticket {
            background: rgba(31, 26, 26, 0.85);
            border: 2px solid var(--red);
            position: relative;
            color: #fff;
            box-shadow:
                0 0 14px rgba(255, 44, 44, 0.5),
                inset 0 0 14px rgba(255, 44, 44, 0.06);
            backdrop-filter: blur(2px);
        }

        /* 티켓 상단 */
        .ticket-top {
            padding: 20px 22px 18px;
            border-bottom: 2px dashed var(--yellow);
            position: relative;
        }

        /* 절취선 양옆의 동그란 구멍 */
        .ticket-top::before, .ticket-top::after {
            content: '';
            position: absolute;
            bottom: -14px;
            width: 26px;
            height: 26px;
            background: var(--black);
            border: 2px solid var(--red);
            border-radius: 50%;
        }
        .ticket-top::before { left: -15px; }
        .ticket-top::after { right: -15px; }

        /* 상영관 로고 영역 */
        .cinema-logo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(255, 230, 0, 0.4);
            gap: 10px;
        }

        .cinema-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* CGV 로고 (실제 색상 유지) */
        .cgv-logo {
            background: #ED1D24;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            padding: 4px 6px 3px;
            line-height: 1;
            border-radius: 2px;
            box-shadow:
                0 0 8px rgba(237, 29, 36, 0.6),
                0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .cinema-name {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 14px;
            color: var(--yellow);
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: 0 0 5px var(--yellow);
        }

        .cinema-logo .ticket-no {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 11px;
            color: var(--yellow-soft);
            opacity: 0.85;
            text-align: right;
            letter-spacing: 1px;
        }

        /* 영화 제목 */
        .movie-han {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 18px;
            color: var(--yellow);
            letter-spacing: 4px;
            margin-bottom: 4px;
            text-shadow: 0 0 6px var(--yellow);
        }

        .movie-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 30px;
            color: var(--red);
            line-height: 1.05;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow:
                0 0 8px var(--red),
                0 0 16px rgba(255, 44, 44, 0.5);
        }

        .movie-eng {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 15px;
            color: var(--yellow);
            letter-spacing: 2px;
            margin-bottom: 16px;
            text-shadow: 0 0 5px var(--yellow);
        }

        /* 영화 정보 그리드 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 14px;
            margin-top: 10px;
        }

        .info-item {
            border-left: 3px solid var(--red);
            padding-left: 10px;
        }

        .info-item .label {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 11px;
            color: var(--yellow);
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-shadow: 0 0 4px rgba(255, 230, 0, 0.6);
        }

        .info-item .value {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 15px;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        .info-item .value .tentative {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 11px;
            color: var(--red-soft);
            letter-spacing: 0;
            margin-left: 2px;
            vertical-align: middle;
            text-shadow: 0 0 4px var(--red);
        }

        /* 티켓 하단 (좌석) */
        .ticket-bottom {
            padding: 18px 22px 22px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .seat-box {
            text-align: center;
        }

        .seat-box .seat-label {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 11px;
            color: var(--yellow);
            letter-spacing: 2px;
            text-shadow: 0 0 4px var(--yellow);
        }

        .seat-box .seat-num {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 36px;
            color: var(--red);
            line-height: 1;
            letter-spacing: 2px;
            text-shadow:
                0 0 8px var(--red),
                0 0 18px rgba(255, 44, 44, 0.6);
        }

        .seat-box .seat-han {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 12px;
            color: var(--yellow);
            letter-spacing: 2px;
            margin-top: 2px;
            text-shadow: 0 0 4px var(--yellow);
        }

        /* 도장 (네온 톤) */
        .stamp {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 56px;
            height: 56px;
            border: 2.5px solid var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 13px;
            color: var(--red);
            transform: rotate(-12deg);
            line-height: 1.1;
            text-align: center;
            letter-spacing: 1px;
            background: rgba(255, 44, 44, 0.08);
            text-shadow: 0 0 5px var(--red);
            box-shadow: 0 0 10px rgba(255, 44, 44, 0.4);
        }

        /* ===== 안내 문구 ===== */
        .notice {
            margin-top: 22px;
            padding: 14px 16px;
            background: rgba(31, 26, 26, 0.6);
            border: 1px dashed var(--yellow);
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 13px;
            color: var(--yellow-soft);
            text-align: center;
            line-height: 1.6;
            box-shadow: inset 0 0 8px rgba(255, 230, 0, 0.05);
        }

        .notice .han {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            color: var(--yellow);
            letter-spacing: 2px;
            display: block;
            margin-bottom: 4px;
            text-shadow: 0 0 5px var(--yellow);
        }
    </style>
</head>
<body>

    <!-- 상단 바 -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">◀ 뒤로</a>
        <div class="page-title">映 畵</div>
        <div class="placeholder"></div>
    </div>

    <!-- ============================================
         네온 간판 (영화관)
         ============================================ -->
    <div class="neon-sign">
        <div class="han">映 畵 館</div>
        <div class="name">영화관람</div>
        <div class="en">C I N E M A</div>
        <div class="emoji">🎬</div>

        <div class="now-showing">上 映 中</div>
    </div>

    <!-- ============================================
         영화 티켓 (네온 톤)
         ============================================ -->
    <div class="ticket-wrap">
        <div class="ticket">

            <!-- 옛 도장 -->
            <div class="stamp">映畵<br>第一</div>

            <!-- 티켓 상단 -->
            <div class="ticket-top">
                <div class="cinema-logo">
                    <div class="cinema-brand">
                        <span class="cgv-logo">CGV</span>
                        <span class="cinema-name">피카디리<br>1958</span>
                    </div>
                    <div class="ticket-no">NO. 2026<br>0807-1530</div>
                </div>

                <div class="movie-han">蜘 蛛 人</div>
                <div class="movie-title">스파이더맨:<br>브랜드 뉴 데이</div>
                <div class="movie-eng">SPIDER-MAN : BRAND NEW DAY</div>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="label">날짜 / DATE</div>
                        <div class="value">2026.08.07 (금)</div>
                    </div>
                    <div class="info-item">
                        <div class="label">시간 / TIME</div>
                        <div class="value">15 : 30 <span class="tentative">(잠정)</span></div>
                    </div>
                    <div class="info-item">
                        <div class="label">상영관 / HALL</div>
                        <div class="value">(미정)</div>
                    </div>
                    <div class="info-item">
                        <div class="label">관람가 / RATING</div>
                        <div class="value">12세</div>
                    </div>
                </div>
            </div>

            <!-- 티켓 하단 (좌석) -->
            <div class="ticket-bottom">
                <div class="seat-box">
                    <div class="seat-label">SEAT / 座席</div>
                    <div class="seat-num">미 정</div>
                    <div class="seat-han">行 / 列</div>
                </div>
            </div>

        </div>

        <!-- 안내 문구 -->
        <div class="notice">
            <span class="han">入 場 注 意 事 項</span>
            상영 10분 전 入場(입장) 부탁드립니다.<br>
            팝콘은 各自(각자) 부담.
        </div>
    </div>

</body>
</html>
