<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모텔 🏨 | 을지로 1박 2일</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --pink:      #FF3C8B;
            --pink-soft: #FF87B5;
            --cyan:      #00E5FF;
            --cyan-soft: #7AF0FF;
            --purple:    #6B1B9C;
            --black:     #0A0A0F;
            --night:     #1A1530;
            --yellow:    #FFD700;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: 'Gowun Batang', serif;
            background: var(--black);
            position: relative;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(255, 60, 139, 0.3);
            min-height: 100vh;
            padding-bottom: 30px;
            overflow-x: hidden;
            /* 밤하늘 그라데이션 */
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(107, 27, 156, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 229, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, var(--night) 0%, var(--black) 100%);
        }

        /* 별 (점박이) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            max-width: 420px;
            left: 50%;
            transform: translateX(-50%);
            background-image:
                radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.6) 1px, transparent 1.5px),
                radial-gradient(circle at 25% 80%, rgba(255, 255, 255, 0.4) 1px, transparent 1.5px),
                radial-gradient(circle at 80% 25%, rgba(255, 255, 255, 0.5) 1px, transparent 1.5px),
                radial-gradient(circle at 45% 60%, rgba(255, 255, 255, 0.3) 1px, transparent 1.5px),
                radial-gradient(circle at 90% 70%, rgba(255, 255, 255, 0.5) 1px, transparent 1.5px),
                radial-gradient(circle at 60% 10%, rgba(255, 255, 255, 0.4) 1px, transparent 1.5px);
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 상단 바 ===== */
        .top-bar {
            background: var(--black);
            color: var(--cyan);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--pink);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            color: var(--cyan);
            text-decoration: none;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--cyan);
        }

        .top-bar .page-title {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 16px;
            color: var(--pink);
            letter-spacing: 4px;
            text-shadow: 0 0 8px var(--pink);
        }

        .top-bar .placeholder { width: 50px; }

        /* ============================================
           네온 간판
           ============================================ */
        .neon-sign {
            margin: 40px 20px 0;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* 한자 */
        .neon-sign .han {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 26px;
            color: var(--cyan);
            letter-spacing: 12px;
            margin-bottom: 8px;
            text-shadow:
                0 0 6px var(--cyan),
                0 0 14px var(--cyan),
                0 0 24px rgba(0, 229, 255, 0.5);
            animation: cyanFlicker 4s infinite;
        }

        /* 메인 간판 글자 */
        .neon-sign .name {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 48px;
            color: var(--pink);
            letter-spacing: 4px;
            line-height: 1.05;
            text-shadow:
                0 0 8px var(--pink),
                0 0 18px var(--pink),
                0 0 32px var(--pink),
                0 0 50px rgba(255, 60, 139, 0.5);
            animation: pinkFlicker 3.5s infinite;
        }

        /* 영문 호텔명 (작은 글자) */
        .neon-sign .en {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 14px;
            color: var(--cyan);
            letter-spacing: 4px;
            margin-top: 14px;
            text-shadow:
                0 0 6px var(--cyan),
                0 0 14px var(--cyan);
            animation: cyanFlicker 5s infinite;
        }

        /* "잠" 한글 + 이모지 */
        .neon-sign .emoji {
            font-size: 28px;
            margin-top: 18px;
            filter: drop-shadow(0 0 8px rgba(255, 60, 139, 0.6));
            animation: bob 3s ease-in-out infinite;
        }

        /* 핑크 네온 깜빡임 (불규칙) */
        @keyframes pinkFlicker {
            0%, 100% { opacity: 1; }
            41% { opacity: 1; }
            42% { opacity: 0.85; }
            43% { opacity: 1; }
            45% { opacity: 0.6; }
            46% { opacity: 1; }
            93% { opacity: 1; }
            94% { opacity: 0.9; }
            95% { opacity: 1; }
        }

        /* 시안 네온 깜빡임 (더 미세하게) */
        @keyframes cyanFlicker {
            0%, 100% { opacity: 1; }
            70% { opacity: 1; }
            71% { opacity: 0.7; }
            72% { opacity: 1; }
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        /* "空 室" 빨간 표시 (객실 있음) */
        .vacancy {
            display: inline-block;
            margin-top: 24px;
            padding: 8px 18px;
            background: rgba(255, 60, 139, 0.15);
            border: 2px solid var(--pink);
            color: var(--pink);
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 18px;
            letter-spacing: 6px;
            box-shadow:
                0 0 12px rgba(255, 60, 139, 0.5),
                inset 0 0 12px rgba(255, 60, 139, 0.2);
            text-shadow: 0 0 6px var(--pink);
            animation: pinkFlicker 2.5s infinite;
        }

        /* ============================================
           정보 카드
           ============================================ */
        .info-wrap {
            margin: 36px 20px 0;
            position: relative;
            z-index: 1;
        }

        /* 카드 (정보 박스) */
        .info-card {
            background: rgba(26, 21, 48, 0.6);
            border: 2px solid var(--cyan);
            padding: 18px 18px 20px;
            margin-bottom: 14px;
            box-shadow:
                0 0 12px rgba(0, 229, 255, 0.3),
                inset 0 0 14px rgba(0, 229, 255, 0.05);
            backdrop-filter: blur(2px);
        }

        .info-card.pink {
            border-color: var(--pink);
            box-shadow:
                0 0 12px rgba(255, 60, 139, 0.3),
                inset 0 0 14px rgba(255, 60, 139, 0.05);
        }

        .info-card .card-title {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 16px;
            color: var(--cyan);
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-shadow: 0 0 6px var(--cyan);
            padding-bottom: 6px;
            border-bottom: 1px dashed rgba(0, 229, 255, 0.4);
        }

        .info-card.pink .card-title {
            color: var(--pink);
            text-shadow: 0 0 6px var(--pink);
            border-bottom-color: rgba(255, 60, 139, 0.4);
        }

        /* 정보 행 */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 14px;
            color: var(--cyan-soft);
            letter-spacing: 1px;
        }

        .info-row .label {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            color: var(--cyan);
            letter-spacing: 3px;
            font-size: 13px;
        }

        .info-card.pink .info-row {
            color: var(--pink-soft);
        }

        .info-card.pink .info-row .label {
            color: var(--pink);
        }

        .info-row .value {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 16px;
            color: #fff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        /* 예약처 배지 (NOL / 야놀자) */
        .booking-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 0;
        }

        .nol-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 22px;
            color: #fff;
            background: linear-gradient(135deg, #FF3C8B 0%, #FF6B9D 100%);
            padding: 6px 12px 5px;
            border-radius: 6px;
            letter-spacing: 2px;
            box-shadow:
                0 0 10px rgba(255, 60, 139, 0.6),
                0 0 20px rgba(255, 60, 139, 0.3);
            line-height: 1;
        }

        .booking-text {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
        }

        .booking-text .label {
            color: var(--pink-soft);
            font-size: 11px;
            display: block;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        /* 큰 숫자 (가격) */
        .price-display {
            text-align: center;
            margin: 8px 0;
        }

        .price-display .price-num {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 42px;
            color: var(--pink);
            line-height: 1;
            letter-spacing: 2px;
            text-shadow:
                0 0 8px var(--pink),
                0 0 18px rgba(255, 60, 139, 0.6);
        }

        .price-display .price-unit {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 14px;
            color: var(--pink-soft);
            margin-top: 4px;
            letter-spacing: 4px;
        }

        /* 가격 추가 안내 (추가 인원 요금) */
        .price-extra {
            text-align: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 60, 139, 0.3);
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 12px;
            color: var(--pink-soft);
            letter-spacing: 1px;
        }

        /* 주소처럼 글자 많은 value는 폰트 크기 살짝 줄임 */
        .info-row .value.addr {
            font-size: 14px;
            letter-spacing: 0;
        }

        /* 영문 객실명은 폰트 크기 살짝 줄임 */
        .info-row .value {
            text-align: right;
        }

        /* ===== 한 줄 카피 ===== */
        .copy-line {
            text-align: center;
            margin-top: 28px;
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 13px;
            color: var(--cyan-soft);
            letter-spacing: 3px;
            opacity: 0.7;
            position: relative;
            z-index: 1;
        }

        .copy-line::before, .copy-line::after {
            content: '◆';
            margin: 0 10px;
            color: var(--pink);
        }
    </style>
</head>
<body>

    <!-- 상단 바 -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">◀ 뒤로</a>
        <div class="page-title">旅 館</div>
        <div class="placeholder"></div>
    </div>

    <!-- ============================================
         네온 간판
         ============================================ -->
    <div class="neon-sign">
        <div class="han">旅 館</div>
        <div class="name">디자이너스<br>종로</div>
        <div class="en">T H E   D E S I G N E R S</div>
        <div class="emoji">🌙</div>

        <!-- "空 室" (객실 있음) 네온 표시 -->
        <div class="vacancy">空 室</div>
    </div>

    <!-- ============================================
         정보 카드들
         ============================================ -->
    <div class="info-wrap">

        <!-- 예약처 (NOL / 야놀자) -->
        <div class="info-card pink">
            <div class="card-title">豫 約 處</div>
            <div class="booking-badge">
                <span class="nol-logo">NOL</span>
                <span class="booking-text">
                    <span class="label">RESERVED VIA</span>
                    야놀자
                </span>
            </div>
        </div>

        <!-- 가게 정보 -->
        <div class="info-card">
            <div class="card-title">店 鋪 情 報</div>
            <div class="info-row">
                <span class="label">주 소</span>
                <span class="value addr">종로구 수표로 89-8</span>
            </div>
            <div class="info-row">
                <span class="label">전 화</span>
                <span class="value">02-2267-7474</span>
            </div>
            <div class="info-row">
                <span class="label">객 실</span>
                <span class="value">Deluxe Family Twin</span>
            </div>
        </div>

        <!-- 가격 -->
        <div class="info-card pink">
            <div class="card-title">宿 泊 料</div>
            <div class="price-display">
                <div class="price-num">140,000</div>
                <div class="price-unit">원 / 1박</div>
            </div>
            <div class="price-extra">
                ※ 추가 인원 1명당 +10,000원
            </div>
        </div>

        <!-- 체크인 / 아웃 -->
        <div class="info-card">
            <div class="card-title">入 / 退 時 間</div>
            <div class="info-row">
                <span class="label">체크인</span>
                <span class="value">16 : 00</span>
            </div>
            <div class="info-row">
                <span class="label">체크아웃</span>
                <span class="value">12 : 00</span>
            </div>
        </div>

    </div>

    <!-- 한 줄 카피 -->
    <div class="copy-line">하룻밤만 묵고 갑니다</div>

</body>
</html>
