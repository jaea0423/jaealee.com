<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>을지로 1박 2일 🏮</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Single+Day&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 을지로 밤거리 네온 팔레트 ===== */
        :root {
            /* 메인 메뉴 컬러 (각 페이지 톤과 일치) */
            --movie-red:     #FF2C2C;
            --movie-yellow:  #FFE600;
            --meat-red:      #FF3D3D;
            --meat-orange:   #FF7A00;
            --drink-yellow:  #FFE600;
            --drink-green:   #00FF7F;
            --motel-pink:    #FF3C8B;
            --motel-cyan:    #00E5FF;
            --hang-orange:   #FF7700;
            --hang-cyan:     #00E5C8;
            /* 공용 */
            --black:         #0A0A0F;
            --night:         #1A1530;
            --white:         #FFFFFF;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: 'Gowun Batang', serif;
            background: var(--black);
            position: relative;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(255, 60, 139, 0.25);
            min-height: 100vh;
            padding-bottom: 24px;
            overflow-x: hidden;
            /* 밤거리 그라데이션 (여러 네온 빛 섞임) */
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(255, 60, 139, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 25%, rgba(255, 230, 0, 0.10) 0%, transparent 40%),
                radial-gradient(ellipse at 30% 75%, rgba(0, 229, 255, 0.10) 0%, transparent 40%),
                radial-gradient(ellipse at 75% 85%, rgba(255, 119, 0, 0.10) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, var(--night) 0%, var(--black) 100%);
        }

        /* 별 (반짝이) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            max-width: 420px;
            left: 50%;
            transform: translateX(-50%);
            background-image:
                radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.5) 1px, transparent 1.5px),
                radial-gradient(circle at 25% 80%, rgba(255, 255, 255, 0.3) 1px, transparent 1.5px),
                radial-gradient(circle at 80% 25%, rgba(255, 255, 255, 0.4) 1px, transparent 1.5px),
                radial-gradient(circle at 45% 60%, rgba(255, 255, 255, 0.25) 1px, transparent 1.5px),
                radial-gradient(circle at 90% 70%, rgba(255, 255, 255, 0.4) 1px, transparent 1.5px),
                radial-gradient(circle at 60% 10%, rgba(255, 255, 255, 0.35) 1px, transparent 1.5px),
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.3) 1px, transparent 1.5px);
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================
           헤더 (네온 사인)
           ============================================ */
        .header {
            padding: 30px 20px 32px;
            position: relative;
            text-align: center;
            z-index: 1;
        }

        /* 우상단 D-Day 배지 */
        .dday-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 60, 139, 0.12);
            color: var(--motel-pink);
            padding: 8px 12px;
            border: 2px solid var(--motel-pink);
            font-family: 'Black Han Sans', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            z-index: 5;
            text-shadow: 0 0 6px var(--motel-pink);
            box-shadow:
                0 0 10px rgba(255, 60, 139, 0.5),
                inset 0 0 8px rgba(255, 60, 139, 0.15);
            animation: pinkFlicker 3.5s infinite;
        }

        /* 좌상단 한자 도장 */
        .stamp-corner {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 44px;
            height: 44px;
            background: rgba(255, 230, 0, 0.1);
            border: 2px solid var(--drink-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 22px;
            color: var(--drink-yellow);
            transform: rotate(-8deg);
            box-shadow:
                0 0 10px rgba(255, 230, 0, 0.5),
                inset 0 0 8px rgba(255, 230, 0, 0.15);
            text-shadow: 0 0 6px var(--drink-yellow);
            z-index: 2;
            animation: yellowFlicker 4.5s infinite;
        }

        /* 한자 서브 타이틀 */
        .title-han {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 22px;
            color: var(--motel-cyan);
            letter-spacing: 10px;
            margin-bottom: 10px;
            margin-top: 18px;
            position: relative;
            text-shadow:
                0 0 6px var(--motel-cyan),
                0 0 14px var(--motel-cyan);
            animation: cyanFlicker 5s infinite;
        }

        /* 한글 메인 (네온 큰 글씨) */
        .title-main {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 52px;
            color: var(--movie-red);
            letter-spacing: 3px;
            line-height: 1;
            text-shadow:
                0 0 8px var(--movie-red),
                0 0 18px var(--movie-red),
                0 0 32px var(--movie-red),
                0 0 50px rgba(255, 44, 44, 0.5);
            animation: redFlicker 3.5s infinite;
        }

        .title-sub {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 38px;
            color: var(--drink-yellow);
            letter-spacing: 4px;
            line-height: 1;
            margin-top: 6px;
            text-shadow:
                0 0 8px var(--drink-yellow),
                0 0 18px var(--drink-yellow),
                0 0 32px rgba(255, 230, 0, 0.5);
            animation: yellowFlicker 4s infinite;
        }

        /* SPIDER NIGHT 작은 영문 */
        .title-en {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 14px;
            color: var(--motel-pink);
            letter-spacing: 8px;
            margin-top: 14px;
            text-shadow:
                0 0 6px var(--motel-pink),
                0 0 14px var(--motel-pink);
            animation: pinkFlicker 5s infinite;
        }

        /* 날짜 박스 (네온 점선 박스) */
        .date-receipt {
            display: inline-block;
            margin-top: 18px;
            padding: 8px 16px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px dashed var(--motel-cyan);
            color: var(--motel-cyan);
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--motel-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .date-receipt .emoji {
            margin: 0 4px;
        }

        /* 깜빡임 애니메이션 */
        @keyframes redFlicker {
            0%, 100% { opacity: 1; }
            41% { opacity: 1; }
            42% { opacity: 0.85; }
            43% { opacity: 1; }
            45% { opacity: 0.6; }
            46% { opacity: 1; }
            93% { opacity: 1; }
            94% { opacity: 0.9; }
            95% { opacity: 1; }
        }

        @keyframes yellowFlicker {
            0%, 100% { opacity: 1; }
            70% { opacity: 1; }
            71% { opacity: 0.7; }
            72% { opacity: 1; }
        }

        @keyframes cyanFlicker {
            0%, 100% { opacity: 1; }
            60% { opacity: 1; }
            61% { opacity: 0.75; }
            62% { opacity: 1; }
        }

        @keyframes pinkFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 1; }
            51% { opacity: 0.8; }
            52% { opacity: 1; }
        }

        @keyframes greenFlicker {
            0%, 100% { opacity: 1; }
            66% { opacity: 1; }
            67% { opacity: 0.7; }
            68% { opacity: 1; }
        }

        @keyframes orangeFlicker {
            0%, 100% { opacity: 1; }
            55% { opacity: 1; }
            56% { opacity: 0.75; }
            57% { opacity: 1; }
        }

        /* ============================================
           메뉴 영역
           ============================================ */
        .menu-wrap {
            padding: 16px 18px 24px;
            position: relative;
            z-index: 1;
        }

        /* 카피 */
        .copy-line {
            text-align: center;
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            color: var(--drink-green);
            font-size: 13px;
            margin-bottom: 18px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--drink-green);
            animation: greenFlicker 6s infinite;
        }

        .copy-line::before, .copy-line::after {
            content: '★';
            margin: 0 8px;
            color: var(--drink-yellow);
            text-shadow: 0 0 5px var(--drink-yellow);
        }

        /* 카드 그리드 (2 x 3) */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        /* ===== 공통 카드 (네온) ===== */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(20, 16, 22, 0.85);
            border: 2px solid;
            padding: 18px 8px 14px;
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            aspect-ratio: 1 / 0.95;
            backdrop-filter: blur(2px);
        }

        .card:active {
            transform: translate(2px, 2px);
        }

        .card-han {
            font-family: 'Nanum Myeongjo', serif; font-weight: 800;
            font-size: 36px;
            line-height: 1;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .card-ko {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 4px;
            color: var(--white);
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
        }

        .card-en {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1.5px;
            opacity: 0.95;
        }

        /* ===== 카드별 네온 톤 ===== */
        /* 영화 - 빨강 + 노랑 */
        .card.movie {
            border-color: var(--movie-red);
            box-shadow:
                0 0 12px rgba(255, 44, 44, 0.5),
                inset 0 0 10px rgba(255, 44, 44, 0.08);
            transform: rotate(-1deg);
        }
        .card.movie .card-han { color: var(--movie-red); text-shadow: 0 0 6px var(--movie-red), 0 0 12px var(--movie-red); animation: redFlicker 4s infinite; }
        .card.movie .card-en { color: var(--movie-yellow); text-shadow: 0 0 4px var(--movie-yellow); }
        .card.movie:active { transform: rotate(-1deg) translate(2px, 2px); }

        /* 고기 - 빨강 + 주황 */
        .card.meat {
            border-color: var(--meat-orange);
            box-shadow:
                0 0 12px rgba(255, 122, 0, 0.5),
                inset 0 0 10px rgba(255, 122, 0, 0.08);
            transform: rotate(1deg);
        }
        .card.meat .card-han { color: var(--meat-red); text-shadow: 0 0 6px var(--meat-red), 0 0 12px var(--meat-red); animation: redFlicker 5s infinite; }
        .card.meat .card-en { color: var(--meat-orange); text-shadow: 0 0 4px var(--meat-orange); }
        .card.meat:active { transform: rotate(1deg) translate(2px, 2px); }

        /* 음주 - 노랑 + 초록 */
        .card.drink {
            border-color: var(--drink-yellow);
            box-shadow:
                0 0 12px rgba(255, 230, 0, 0.5),
                inset 0 0 10px rgba(255, 230, 0, 0.08);
            transform: rotate(1.2deg);
        }
        .card.drink .card-han {
            color: var(--drink-yellow);
            font-size: 30px; /* 두 글자 飮酒이므로 약간 작게 */
            text-shadow: 0 0 6px var(--drink-yellow), 0 0 12px var(--drink-yellow);
            animation: yellowFlicker 4s infinite;
        }
        .card.drink .card-en { color: var(--drink-green); text-shadow: 0 0 4px var(--drink-green); }
        .card.drink:active { transform: rotate(1.2deg) translate(2px, 2px); }

        /* 모텔 - 핑크 + 시안 */
        .card.motel {
            border-color: var(--motel-pink);
            box-shadow:
                0 0 12px rgba(255, 60, 139, 0.5),
                inset 0 0 10px rgba(255, 60, 139, 0.08);
            transform: rotate(-1.5deg);
        }
        .card.motel .card-han { color: var(--motel-pink); text-shadow: 0 0 6px var(--motel-pink), 0 0 12px var(--motel-pink); animation: pinkFlicker 4s infinite; }
        .card.motel .card-ko { color: var(--motel-cyan); text-shadow: 0 0 5px var(--motel-cyan); }
        .card.motel .card-en { color: var(--motel-pink); text-shadow: 0 0 4px var(--motel-pink); }
        .card.motel:active { transform: rotate(-1.5deg) translate(2px, 2px); }

        /* 해장 - 주황 + 청록 */
        .card.hangover {
            border-color: var(--hang-orange);
            box-shadow:
                0 0 12px rgba(255, 119, 0, 0.5),
                inset 0 0 10px rgba(255, 119, 0, 0.08);
            transform: rotate(-0.8deg);
        }
        .card.hangover .card-han { color: var(--hang-orange); text-shadow: 0 0 6px var(--hang-orange), 0 0 12px var(--hang-orange); animation: orangeFlicker 4s infinite; }
        .card.hangover .card-en { color: var(--hang-cyan); text-shadow: 0 0 4px var(--hang-cyan); }
        .card.hangover:active { transform: rotate(-0.8deg) translate(2px, 2px); }

        /* ===== D-Day 카드 (점선 네온) ===== */
        .dday-card {
            background: rgba(20, 16, 22, 0.85);
            border: 2px dashed var(--motel-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 8px 14px;
            aspect-ratio: 1 / 0.95;
            text-align: center;
            box-shadow:
                0 0 12px rgba(255, 60, 139, 0.4),
                inset 0 0 10px rgba(255, 60, 139, 0.05);
            transform: rotate(2deg);
        }

        .dday-card .dday-label {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 13px;
            color: var(--motel-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--motel-cyan);
        }

        .dday-card .dday-num {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 42px;
            color: var(--motel-pink);
            line-height: 1;
            margin: 6px 0;
            text-shadow:
                0 0 8px var(--motel-pink),
                0 0 18px var(--motel-pink);
            animation: pinkFlicker 3s infinite;
        }

        .dday-card .dday-when {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 12px;
            color: var(--motel-cyan);
            letter-spacing: 1px;
            text-shadow: 0 0 4px var(--motel-cyan);
        }

        /* ===== 푸터 ===== */
        .footer {
            text-align: center;
            padding: 16px 16px 20px;
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 12px;
            color: var(--drink-green);
            letter-spacing: 2px;
            text-shadow: 0 0 4px var(--drink-green);
            position: relative;
            z-index: 1;
        }

        .footer .members {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(20, 16, 22, 0.7);
            border: 1px dashed var(--drink-yellow);
            margin-top: 10px;
            color: var(--drink-yellow);
            text-shadow: 0 0 4px var(--drink-yellow);
            box-shadow: 0 0 8px rgba(255, 230, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- ============================================
         헤더 (네온 사인)
         ============================================ -->
    <header class="header">
        <!-- 좌상단 한자 도장 -->
        <div class="stamp-corner">乙</div>

        <!-- 우상단 D-Day -->
        <div class="dday-badge">D-○○</div>

        <!-- 한자 서브 타이틀 -->
        <div class="title-han">乙 支 路 一 泊</div>

        <!-- 메인 네온 타이틀 -->
        <div class="title-main">을지로</div>
        <div class="title-sub">1박 2일</div>
        <div class="title-en">S P I D E R   N I G H T</div>

        <!-- 날짜 -->
        <div class="date-receipt">
            <span class="emoji">📅</span>
            2026.08.07(금) ~ 08(토)
            <span class="emoji">🏮</span>
        </div>
    </header>

    <!-- ============================================
         메뉴 (네온 카드 그리드)
         ============================================ -->
    <div class="menu-wrap">

        <div class="copy-line">맛 좀 아는 사람만 옴</div>

        <nav class="menu-grid">

            <!-- 1. 영화 -->
            <a href="movie.html" class="card movie">
                <div class="card-han">映畵</div>
                <div class="card-ko">영화</div>
                <div class="card-en">MOVIE</div>
            </a>

            <!-- 2. 고기 -->
            <a href="meat.html" class="card meat">
                <div class="card-han">肉</div>
                <div class="card-ko">고기</div>
                <div class="card-en">MEAT</div>
            </a>

            <!-- 3. 음주 -->
            <a href="drink.html" class="card drink">
                <div class="card-han">飮酒</div>
                <div class="card-ko">음주</div>
                <div class="card-en">DRINK</div>
            </a>

            <!-- 4. 모텔 -->
            <a href="motel.html" class="card motel">
                <div class="card-han">旅館</div>
                <div class="card-ko">모텔</div>
                <div class="card-en">MOTEL</div>
            </a>

            <!-- 5. 해장 -->
            <a href="hangover.html" class="card hangover">
                <div class="card-han">解酒</div>
                <div class="card-ko">해장</div>
                <div class="card-en">HANGOVER</div>
            </a>

            <!-- 6. D-Day 카드 -->
            <div class="dday-card">
                <div class="dday-label">D-DAY</div>
                <div class="dday-num">76</div>
                <div class="dday-when">08.07까지</div>
            </div>

        </nav>
    </div>

    <!-- ============================================
         푸터
         ============================================ -->
    <footer class="footer">
        ─ 정연우 주량 검증의 밤 ─
        <div class="members">멤버 : 이재아 · 한태희 · 정연우</div>
    </footer>

    <!-- ============================================
         D-Day 자동 계산 스크립트
         ============================================ -->
    <script>
        // 약속 날짜 (2026년 8월 7일 00:00)
        // JavaScript Date의 month는 0부터 시작하므로 8월은 7로 입력
        const eventDate = new Date(2026, 7, 7);

        // 오늘 00:00 (시/분/초 무시하고 날짜만 비교하기 위함)
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        // 밀리초 차이를 일 단위로 변환 (1일 = 24*60*60*1000 밀리초)
        const diffMs = eventDate - today;
        const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

        // D-Day 텍스트 결정
        let ddayText, ddayNumText;
        if (diffDays > 0) {
            ddayText = `D-${diffDays}`;
            ddayNumText = String(diffDays);
        } else if (diffDays === 0) {
            ddayText = 'D-DAY';
            ddayNumText = '0';
        } else {
            ddayText = `D+${Math.abs(diffDays)}`;
            ddayNumText = String(Math.abs(diffDays));
        }

        // 우상단 배지와 카드 모두 갱신
        document.querySelector('.dday-badge').textContent = ddayText;
        document.querySelector('.dday-num').textContent = ddayNumText;
    </script>

</body>
</html>
