<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한옥반점 비상 예약지</title>
<style>
/* A4 한 장에 여섯 장(3행 × 2열). 시스템이 안 될 때 손으로 받는 예약지 — 마법사와 같은 순서(경로·날짜시각·인원·좌석·식사·예약자·요청).
   인쇄: 크롬에서 Ctrl+P → 여백 '없음' 또는 '최소', 배경 그래픽 켜기. 잘라서 카운터에 비치 */
@page{size:A4; margin:8mm}
*{box-sizing:border-box}
body{margin:0; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#222; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.sheet{width:194mm; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,88mm); gap:0}
.slip{border:1px dashed #999; padding:3mm 4mm; display:flex; flex-direction:column; gap:1.2mm; font-size:9pt; break-inside:avoid; height:88mm; overflow:hidden}
.slip h2{margin:0 0 1mm; font-size:11pt; display:flex; justify-content:space-between; align-items:baseline; border-bottom:1.5px solid #222; padding-bottom:1mm}
.slip h2 small{font-weight:400; font-size:8pt; color:#666}
.row{display:flex; align-items:center; gap:2mm; min-height:5.8mm}
.row .k{flex:none; width:19mm; font-weight:700; color:#444; white-space:nowrap}
.row .v{flex:1; border-bottom:1px solid #bbb; min-height:6mm}
.row .v.sm{flex:1 1 0; white-space:nowrap; font-size:8.5pt}
.opts{display:flex; gap:1.5mm; flex-wrap:wrap}
.opt{border:1px solid #888; border-radius:3mm; padding:0.4mm 2.2mm; font-size:8.5pt; white-space:nowrap}
.box{display:inline-block; width:4mm; height:4mm; border:1.2px solid #444; vertical-align:middle; margin-right:1mm}
.foot{margin-top:auto; border-top:1px solid #222; padding-top:1.2mm; display:flex; justify-content:space-between; gap:2mm; font-size:7.8pt; white-space:nowrap}
.foot b{color:#B0553F}
@media screen{ body{background:#eee; padding:10mm 0} .sheet{background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.15)} }
</style>
</head>
<body>
<div class="sheet">
<!-- 같은 전표 6장 -->
<script>
var slip = '<div class="slip">' +
  '<h2>한옥반점 예약지 <small>시스템이 안 될 때 · 받은 즉시 이대로 적기</small></h2>' +
  '<div class="row"><span class="k">경로</span><span class="opts"><span class="opt">전화</span><span class="opt">네이버</span><span class="opt">방문</span><span class="opt">기타(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span></span></div>' +
  '<div class="row"><span class="k">날짜·시각</span><span class="v sm">&nbsp;월 &nbsp;&nbsp;일 (&nbsp;&nbsp;)</span><span class="v sm">오전·오후 &nbsp;&nbsp;시 &nbsp;&nbsp;분</span></div>' +
  '<div class="row"><span class="k">인원</span><span class="v sm">총 &nbsp;&nbsp;&nbsp;명</span><span class="v sm">유아 &nbsp;&nbsp;명 · 의자 &nbsp;&nbsp;개</span></div>' +
  '<div class="row"><span class="k">좌석</span><span class="opts"><span class="opt">룸: 조조 유비 장비 관우 공명 주유 초선 동탁</span><span class="opt">1층 테이블</span><span class="opt">지하 테이블</span><span class="opt">미정</span></span></div>' +
  '<div class="row"><span class="k">식사</span><span class="opts"><span class="opt">코스 (&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span><span class="opt">미정</span><span class="opt">해당 없음</span></span></div>' +
  '<div class="row"><span class="k">예약자</span><span class="v"></span></div>' +
  '<div class="row"><span class="k">전화</span><span class="v"></span></div>' +
  '<div class="row"><span class="k">알러지·요청</span><span class="v"></span></div>' +
  '<div class="row"><span class="k">메모</span><span class="v"></span></div>' +
  '<div class="foot"><span>받은 사람 ______ · 시각 ___:___</span><span><span class="box"></span><b>시스템 입력 완료</b> (입력: ____)</span></div>' +
  '</div>';
document.write(slip + slip + slip + slip + slip + slip);
</script>
</div>
</body>
</html>
