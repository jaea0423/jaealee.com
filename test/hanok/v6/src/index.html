.bh-row i{margin-left:auto; font-style:normal; font-size:var(--fs-sub); color:var(--text-3); white-space:nowrap}
.bh-row:hover{border-color:var(--border-strong); background:var(--surface-2)}
.bh-more{font-size:var(--fs-sub); color:var(--text-3); margin:var(--s4) 0 var(--s8)}
.bh-s{font-size:var(--fs-sub); line-height:1.6; color:var(--text-2)}
.bh-s b{color:var(--rust)}
/* 디스플레이 주소 안내 상자 (설정 → 디스플레이) */
.urlbox{border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s12) var(--s16); margin-bottom:var(--s16); background:var(--surface-2)}
.ub-t{font-size:var(--fs-sub); font-weight:700; color:var(--text-3); margin-bottom:var(--s8)}
.ub-u{font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-sub); color:var(--text);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:var(--s8) var(--s12); word-break:break-all; margin-bottom:var(--s8)}
.ub-s{font-size:var(--fs-sub); color:var(--text-3); line-height:1.55; margin-bottom:var(--s12)}
.tbl-in{display:inline-flex; align-items:center; gap:var(--s8); font-size:var(--fs-sub); color:var(--text-3); font-weight:600}
.tbl-in input{width:62px; padding:var(--s8) var(--s8); font-size:var(--fs-body); text-align:center}
/* ---------- 옛 예약 카드 (.res) 와 그 부품 ----------
   카드형 목록(renderRes)은 지금 호출되지 않지만 .filters 등 일부 부품은 다른 화면에서 씁니다.
   화면을 안 바꾸는 원칙대로 두고, Phase 3 에서 실제로 쓰이는 것만 남길 것 */
.filters{display:flex; gap:var(--s8); overflow-x:auto; padding-bottom:var(--s4); margin-bottom:var(--s12); -webkit-overflow-scrolling:touch}
.filters button{white-space:nowrap; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:600; border-radius:var(--r-sm)}
.filters button.on{background:var(--text); border-color:var(--text); color:#fff}
.res-list{display:grid; gap:var(--s12); grid-template-columns:1fr !important}
.res{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden; display:flex}
.res .stripe{width:4px; flex:none; background:var(--pine)}
.res.s-방문 .stripe{background:var(--border-strong)}
.res.s-취소 .stripe{background:var(--border-strong)}
.res.s-노쇼 .stripe{background:var(--rust)}
.res.s-방문,.res.s-취소{opacity:.62}
.res .body{flex:1; min-width:0; padding:var(--s12) var(--s16)}
.res .l1{display:flex; align-items:baseline; gap:var(--s8); flex-wrap:wrap}
.res .tm{font-weight:700; letter-spacing:-.01em; font-size:var(--fs-title)}
.res .nm{font-weight:600; font-size:var(--fs-title)}
.res .pp{font-size:var(--fs-sub); color:var(--text-2)}
.res .rm{margin-left:auto}
.res .l2{color:var(--text-2); margin-top:var(--s4); word-break:break-word; font-size:var(--fs-body)}
.res .l3{display:flex; gap:var(--s8); margin-top:var(--s12); align-items:center; flex-wrap:wrap}
.res .l3 select{width:auto; padding:var(--s8) var(--s8); font-size:var(--fs-sub); border-radius:var(--r-sm)}
.res .l3 .btn{margin-left:auto}
.sbtns{display:flex; gap:var(--s4); flex-wrap:wrap}
.sbtn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:var(--r-sm); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:700}
.sbtn:hover{background:var(--surface-2); color:var(--text)}
.sbtn.on.ok{background:var(--pine); border-color:var(--pine); color:#fff}
.sbtn.on.done{background:var(--text-2); border-color:var(--text-2); color:#fff}
.sbtn.on.no{background:var(--rust); border-color:var(--rust); color:#fff}
.sbtn.on.cancel{background:#9C9482; border-color:#9C9482; color:#fff}
.l3-r{display:flex; gap:var(--s8); margin-left:auto}
.warn-txt{color:var(--rust); font-weight:700}
/* ---------- 확인창 (renderModal) — 경고는 제목이 벽돌색, 안내는 초록 ---------- */
.modal{width:100%; max-width:420px; background:var(--bg); overflow:hidden; box-shadow:0 12px 40px rgba(20,20,18,.28); margin:0 var(--s16); border-radius:var(--r-lg)}
.modal.warn .md-h{color:var(--rust); font-size:var(--fs-head)}
.modal.ok .md-h{color:var(--pine)}
.md-h{padding:var(--s24) var(--s24) 0; font-size:var(--fs-head); font-weight:700; line-height:1.4}
.md-b{padding:var(--s12) var(--s24) var(--s16); font-size:var(--fs-body); color:var(--text-2); line-height:1.65}
.md-l{white-space:pre-wrap}
.md-gap{height:9px}
/* 확인창 안의 가로선 (renderModal 의 '---' 줄) */
.md-rule{border-top:1px dashed var(--border-strong); margin:var(--s8) 0}
.md-f{display:flex; gap:var(--s8); padding:0 var(--s16) var(--s16); justify-content:flex-end}
.md-f .btn{min-width:96px; padding:var(--s12) var(--s16); font-size:var(--fs-body)}

/* ---------- 움직임 (Phase 6-1) — 딱 세 곳만 ----------
   시트는 아래에서 200ms 올라오고, 확인창은 150ms 떠오릅니다. '반응하는 도구' 느낌은 이 정도로 충분하고,
   전화 받으며 쓰는 화면이라 그 이상은 기다리게 만듭니다. transform 은 translate 만 (scale 은 배율 zoom 과 부딪혀 잘림) */
@keyframes sheet-in{from{transform:translateY(24px); opacity:0} to{transform:none; opacity:1}}
@keyframes modal-in{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}
@keyframes fade-in{from{opacity:0} to{opacity:1}}
.sheet, .calbox{animation:sheet-in .2s ease-out}
.modal{animation:modal-in .15s ease-out}
.overlay{animation:fade-in .15s ease-out}


/* ============================================================
   7. 설정
   ============================================================ */
/* ---------- 적용하기 바 ----------
   설정은 임시본(draft)에 쌓였다가 '적용하기'를 눌러야 반영됩니다. 바뀐 것이 있으면(.on) 호박색으로 알립니다.
   sticky 라 긴 설정 화면을 내려도 화면 아래에 붙어 있습니다 */
.applybar{position:sticky; bottom:12px; display:flex; align-items:center; gap:var(--s8); margin-top:var(--s24); background:var(--surface); border:1px solid var(--border); padding:var(--s12) var(--s16); box-shadow:0 4px 18px rgba(20,20,18,.12); border-radius:var(--r-md)}
.applybar.on{border-color:var(--amber); background:var(--amber-soft)}
.applybar.on .ab-t{color:var(--amber)}
.applybar .btn:disabled{opacity:.4}
.ab-t{flex:1; font-size:var(--fs-sub); font-weight:700; color:var(--text-2)}

/* ---------- 좌석 배정 순서 줄의 ▲▼ 버튼 (설정 → 좌석) ----------
   Phase 4-3 전까지 이 버튼에는 CSS 가 없어 브라우저 기본 버튼(28px)으로 나왔습니다. 손가락으로 누르므로 44px. */
.ordbtns{display:inline-flex; gap:var(--s4); flex:none}
.ordbtns button{min-width:44px; min-height:44px; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:var(--r-sm); font-size:var(--fs-sub); color:var(--text-2); cursor:pointer; -webkit-tap-highlight-color:transparent}
.ordbtns button:active{filter:brightness(.9)}
.ordbtns button:disabled{opacity:.3; cursor:default}
.ordnum{width:24px; text-align:center; font-weight:700; color:var(--text-3); flex:none}

/* ---------- 좌석·정원 설정 줄 (.tset) — 이름 · 정원 · 버튼이 한 줄 ---------- */
.tset{flex-wrap:wrap; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:var(--s8); padding:var(--s12) 0; border-radius:var(--r-sm)}
.tset:last-child{border-bottom:none}
.tset label{display:flex; align-items:center; gap:var(--s8)}
.tset label span{font-size:var(--fs-sub); color:var(--text-3); font-weight:600}
.tset input[type=number]{width:78px; padding:var(--s8) var(--s12); font-size:var(--fs-body)}
.tset .btn{margin-left:auto}
.tset label.chk{margin:0}
.tset .numbtn.sm{flex:1}
.tsum{margin-top:var(--s12); font-size:var(--fs-body); color:var(--text-2)}
.tsum b{color:var(--text); font-size:var(--fs-body)}

/* ---------- 운영시간 ---------- */
/* 적용 시작일별 운영시간 묶음. 지금 적용 중인 것(.cur)은 초록 바탕으로 카드 폭까지 넓혀 표시 */
.schrow{padding:var(--s12) 0; border-bottom:1px solid var(--border)}
.schrow:last-of-type{border-bottom:none}
.schrow.cur{background:var(--pine-soft); margin:0 -14px; padding:var(--s12) var(--s16); border-radius:var(--r-sm); border-bottom:none}
.sch-h{display:flex; align-items:center; gap:var(--s8); margin-bottom:var(--s8); font-size:var(--fs-body)}
.sch-days{display:grid; grid-template-columns:1fr; gap:var(--s4)}
.sch-d{font-size:var(--fs-sub); color:var(--text-2)}
/* 요일 한 글자에 맞춘 18px 이었는데 '공휴'는 두 글자라 시간과 붙어 버렸습니다.
   최소 너비만 주고 넘치면 늘어나게, 뒤에 여백을 둡니다. */
.sch-d b{display:inline-block; min-width:18px; margin-right:var(--s4); color:var(--text); font-weight:700}
/* 요일별 편집 줄 (운영시간 수정 시트) — 일요일은 벽돌색, 토요일은 파란색 글자 */
.dayrow{border:1px solid var(--border); padding:var(--s12) var(--s12); margin-bottom:var(--s8); background:var(--surface); border-radius:var(--r-md)}
.dayrow.sun .dr-h b{color:#B0553F}
.dayrow.sat .dr-h b{color:#3E6291}
.dr-h{display:flex; align-items:center; gap:var(--s12); margin-bottom:var(--s8)}
.dr-h b{font-size:var(--fs-body)}
.dr-h .btn{margin-left:auto}
.dr-in label{display:flex; align-items:center; gap:var(--s8); margin-bottom:var(--s8); flex-wrap:wrap}
.dr-in label span{font-size:var(--fs-sub); color:var(--text-3); font-weight:600; width:66px; flex:none}
.dr-in label em{font-style:normal; color:var(--text-3)}
.dr-in input{width:auto; flex:1 1 100px; min-width:96px; padding:var(--s8) var(--s12); font-size:var(--fs-body)}
.dr-in input:disabled{background:var(--surface-2); color:var(--text-3)}
/* 세션 표 (8차) — 요일 칸 안, 한 줄에 이름·시작·접수 마감·점유·끝 */
.sch-s{display:block; color:var(--text-3); font-size:var(--fs-label); margin-top:2px}
.sess{margin-top:var(--s8); border-top:1px dashed var(--border); padding-top:var(--s8)}
.sess-r{display:grid; grid-template-columns:1fr 1fr 1fr 34px; gap:var(--s4) var(--s8); align-items:end; padding:var(--s8); margin-bottom:var(--s8); background:var(--surface-2); border-radius:var(--r-sm)}
.sess-r > .sf{display:flex; flex-direction:column; gap:2px; min-width:0}
.sess-r > .sf > span:first-child{font-size:var(--fs-label); color:var(--text-3); font-weight:600}
/* 좌석 설정 줄 — 폰에서는 이름 줄 아래로 버튼들이 내려가게 (한 줄에 버튼 다섯 개가 안 들어감) */
.rowitem.seat{flex-wrap:wrap}
.rowitem.seat .grow{flex:1 1 160px}
@media (max-width:640px){
  .rowitem.seat{padding:var(--s12)}
  .rowitem.seat .grow{flex:1 1 100%; order:-1; padding-left:0}
  .rowitem.seat .ordbtns{order:1} .rowitem.seat .ordnum{display:none}
  .rowitem.seat .tbl-in{order:2}
  .rowitem.seat > .btn, .rowitem.seat > .numbtn{order:2}
}
.offline-card{padding:var(--s24); text-align:center}
.offline-card .oc-t{font-size:var(--fs-title); font-weight:700; margin-bottom:var(--s8)}
.offline-card .oc-s{font-size:var(--fs-sub); color:var(--text-2); max-width:560px; margin:0 auto var(--s16); line-height:1.6}
.offline-card .btn-row{justify-content:center}
.dr-in .sess-r label.chk{margin:0; flex-wrap:nowrap}
.dr-in .sess-r label.chk span{width:auto}
/* .dr-in input 의 padding·min-width 가 체크박스까지 키워 48px 네모가 됐습니다 (브레이크타임 없음 칸도 같은 문제) */
.dr-in label.chk input{padding:0; min-width:0; min-height:0; width:20px; height:20px; flex:none}
.sess-r > .sf:nth-child(5){grid-column:1 / span 2}
/* .dr-in input 의 flex:1 1 100px 이 세로 방향에서 높이 100px 로 늘어나므로 여기서는 끕니다 */
.dr-in .sess-r input:not([type=checkbox]){width:100%; min-width:0; flex:none; padding:var(--s4) var(--s8); font-size:var(--fs-sub); height:38px}
.sess-r input:disabled{background:var(--surface-2); color:var(--text-3)}
.sess-r > button{align-self:end; margin-bottom:2px}
.sess-stay{display:flex; align-items:center; gap:var(--s4); min-width:0; height:38px}
.sess-stay .chk{margin:0; white-space:nowrap}
.dr-in .sess-r .sess-stay input[type=number]{width:64px; flex:0 0 auto}
/* 폰: 두 칸으로 — 세션|시작 / 접수 마감|끝 / 점유|삭제 */
@media (max-width:640px){
  .sess-r{grid-template-columns:1fr 1fr}
  .sess-r > .sf:nth-child(1){grid-row:1; grid-column:1} .sess-r > .sf:nth-child(2){grid-row:1; grid-column:2}
  .sess-r > .sf:nth-child(3){grid-row:2; grid-column:1} .sess-r > .sf:nth-child(6){grid-row:2; grid-column:2}
  .sess-r > .sf:nth-child(5){grid-row:3; grid-column:1}
  .sess-r > button{grid-row:3; grid-column:2; justify-self:end; width:44px}
}
/* 체크박스 줄 — .dr-in label 과 우선순위가 같아 반드시 그 뒤에 와야 합니다 (같은 요소에 둘 다 걸림) */
label.chk{display:flex; align-items:center; gap:var(--s8); font-size:var(--fs-sub); color:var(--text-2); margin:var(--s4) 0 var(--s12)}
label.chk input{width:18px; height:18px; flex:none; accent-color:var(--pine)}
label.chk span{width:auto}

/* ---------- 디스플레이 배치 (손님용 TV 에 좌석을 어느 줄에 놓을지) ----------
   한 줄에 너무 많이 넣으면(.over) 벽돌색으로 알리되 막지 않습니다 */
.disprow{border:1px solid var(--border); padding:var(--s12) var(--s12); margin-bottom:var(--s8); background:var(--surface); border-radius:var(--r-md)}
.disprow.over{border-color:var(--rust); background:var(--rust-soft)}
.disprow.over .dr-title span{color:var(--rust); font-weight:700}
.dr-title{font-size:var(--fs-sub); font-weight:700; color:var(--text-2); margin-bottom:var(--s8)}
.dr-title span{font-weight:500; color:var(--text-3); margin-left:var(--s4)}
.dr-cells{display:flex; flex-wrap:wrap; gap:var(--s8)}
.dcell{display:inline-flex; align-items:center; gap:var(--s4); background:var(--surface-2); border:1px solid var(--border); padding:var(--s8) var(--s8) var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:600; border-radius:var(--r-sm)}
.dcell button{width:36px; height:36px; border:1px solid var(--border); background:var(--surface);
  border-radius:var(--r-sm); font-size:var(--fs-label); color:var(--text-3); padding:0}
.dcell button:disabled{opacity:.3}

/* ---------- 홀 테이블 구성 (구역 .zone) 과 구역 배치도 (.zmap) ---------- */
.zone{border:1px solid var(--border); padding:var(--s12) var(--s12); margin-bottom:var(--s12); background:var(--surface); border-radius:var(--r-md)}
.z-h{display:flex; align-items:center; gap:var(--s8); margin-bottom:var(--s12)}
.z-name{flex:1; padding:var(--s8) var(--s12); font-size:var(--fs-body); font-weight:700}
.z-join{display:flex; align-items:center; gap:var(--s12); flex-wrap:wrap; padding-top:var(--s12)}
.z-join .lbl{font-size:var(--fs-sub)}
.z-cap{display:block; margin-top:var(--s8); font-size:var(--fs-sub); color:var(--text-3)}
.z-cap b{color:var(--text)}
/* 배치도 — 테이블 한 칸(.zm-t) 38px, 붙일 수 있는 조합은 .zm-c.join 으로 초록 바탕 */
.zmap{margin-top:var(--s12); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s12)}
.zm-zone{padding:var(--s12) 0; border-bottom:1px dashed var(--border-strong)}
.zm-zone:last-of-type{border-bottom:none}
.zm-h{display:flex; align-items:baseline; gap:var(--s8); margin-bottom:var(--s8); flex-wrap:wrap}
.zm-h b{font-size:var(--fs-body)}
.zm-h span{font-size:var(--fs-sub); color:var(--text-3)}
.zm-tables{display:flex; flex-wrap:wrap; gap:var(--s8)}
.zm-t{width:38px; height:38px; display:grid; place-items:center; border-radius:var(--r-sm); border:1px solid var(--border-strong); font-size:var(--fs-body); font-weight:700; background:var(--surface); color:var(--text)}
.zm-t.joinable{background:var(--pine-soft); border-color:var(--text); color:var(--text)}
.zm-note{font-size:var(--fs-label); color:var(--text-3); margin-top:var(--s8)}
.zm-legend{font-size:var(--fs-label); color:var(--text-3); margin-top:var(--s12); padding-top:var(--s8)}
.zm-sub{font-size:var(--fs-label); font-weight:700; color:var(--text-3); margin:var(--s12) 0 var(--s8)}
.zm-combos{display:flex; flex-wrap:wrap; gap:var(--s8)}
.zm-c{display:inline-flex; flex-direction:column; align-items:center; gap:1px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:var(--s4) var(--s8)}
.zm-c.join{background:var(--pine-soft); border-color:var(--border-strong)}
.zm-c b{font-size:var(--fs-sub); font-weight:700}
.zm-c i{font-style:normal; font-size:var(--fs-label); color:var(--text-3)}

/* ---------- 코스 구성 편집 — 그룹마다 언제 파는지(.wbtn: 종일/평일점심…)를 고릅니다 ---------- */
.cgedit{padding:var(--s12) 0; border-bottom:1px solid var(--border)}
.cgedit:last-of-type{border-bottom:none}
.whenrow{display:flex; align-items:center; gap:var(--s8); flex-wrap:wrap; margin-top:var(--s4)}
.wbtn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:700; border-radius:var(--r-sm)}
.wbtn.on{background:var(--pine); border-color:var(--pine); color:#fff}

/* ---------- 접속 기록 — 고정폭 글꼴로 시각·IP 가 줄 맞춰 보이게 ---------- */
.logbox{max-height:52vh; overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:var(--s8) 0}
.logrow{display:flex; gap:var(--s12); padding:var(--s8) var(--s12); border-bottom:1px solid var(--border);
  font-size:var(--fs-sub); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap}
.logrow:last-child{border-bottom:none}
.lg-t{color:var(--text-3); flex:none}
.lg-ip{color:var(--text-2); width:120px; flex:none; overflow:hidden; text-overflow:ellipsis}
.lg-a{font-weight:700; width:96px; flex:none}
.lg-d{color:var(--text-2); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}


/* ============================================================
   8. 잠금 · 매장 선택
   ============================================================ */
/* ---------- 매장 선택 (사진 분할) ----------
   화면을 좌우로 갈라 두 매장 사진을 놓습니다. 배율(zoom)은 걸지 않습니다 — 사진이 화면을 꽉 채우는 구성이라서.
   마우스를 올리면 그쪽이 조금 넓어지고 사진이 커집니다(hover 미디어, 11구역) */
.split{display:flex; width:100%; height:100vh; height:100dvh; overflow:hidden; background:#15130F}
.split .panel + .panel{box-shadow:-1px 0 0 rgba(255,255,255,.22)}
.panel{
  position:relative; flex:1 1 50%; border:none; padding:0; margin:0;
  background:none; overflow:hidden; color:#fff;
  transition:flex-grow .6s cubic-bezier(.22,1,.36,1);
}
.panel .bg{
  position:absolute; top:0; right:0; bottom:0; left:0; background-size:cover; background-position:center;
  transform:scale(1.02); filter:saturate(.9) brightness(.6);
  transition:transform 1.1s cubic-bezier(.22,1,.36,1), filter .6s ease;
}
.panel[data-store="anjip"] .bg{background-image:var(--img-anjip)}
.panel[data-store="hanok"] .bg{background-image:var(--img-hanok)}
/* 사진 위 어두운 막 — 글자가 읽히게 */
.panel .veil{
  position:absolute; top:0; right:0; bottom:0; left:0;
  background:linear-gradient(180deg,rgba(15,19,16,.28) 0%,rgba(15,19,16,.12) 42%,rgba(15,19,16,.7) 100%);
  transition:opacity .6s ease;
}
.panel .label{position:absolute; top:0; right:0; bottom:0; left:0; z-index:2; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:var(--s16); padding:var(--s24); text-align:center}
/* 매장 이름은 명조 — 관리 화면에서 명조를 쓰는 유일한 곳(간판 역할) */
.panel .name{
  font-family:var(--serif); font-weight:700; font-size:clamp(30px,5.2vw,60px);
  letter-spacing:.22em; text-indent:.22em; text-shadow:0 2px 20px rgba(0,0,0,.55);
  transition:letter-spacing .6s cubic-bezier(.22,1,.36,1);
}
.panel .rule{width:24px; height:1px; background:rgba(255,255,255,.75);
  transition:width .6s cubic-bezier(.22,1,.36,1), background .4s}
.panel .meta{font-size:var(--fs-sub); letter-spacing:.06em; color:rgba(255,255,255,.8);
  opacity:0; transform:translateY(6px); transition:opacity .5s, transform .5s}
.panel .badge{
  display:inline-block; margin-top:var(--s4); padding:var(--s4) var(--s12); border-radius:999px;
  border:1px solid rgba(255,255,255,.4); color:rgba(255,255,255,.82);
  font-size:var(--fs-sub); letter-spacing:.1em;
}
/* 잠긴 매장(.locked) — 흑백 처리 + 잠금 표시. 지금은 안 쓰이고 아래 .soon 을 씁니다 */
.panel.locked{cursor:not-allowed}
.panel.locked .bg{filter:grayscale(1) brightness(.34)}
.panel.locked .name{color:rgba(255,255,255,.62)}
.panel.locked .rule{background:rgba(255,255,255,.35)}
/* 준비 중인 매장(.soon, 안집) — 눌리는 것처럼 보이지만 아무 일도 하지 않습니다.
   ※ .panel.soon:hover .bg 는 hover 미디어(1.08)와 우선순위가 같아서 11구역 끝에 한 번 더 있습니다 (그래야 1.03 이 이김) */
.panel.soon{filter:none; opacity:1; cursor:default}
.panel.soon .veil{background:rgba(15,14,12,.52)}
.panel.soon:hover .veil{background:rgba(15,14,12,.44)}
.panel.soon:hover .bg{transform:scale(1.03)}
.panel.soon .badge{background:rgba(244,242,238,.16); border-color:rgba(244,242,238,.34); color:#F4F2EE}

/* ---------- PIN 잠금 ----------
   .lock 자체(배율 포함)는 4구역에 있습니다. 새로 열 때마다 입력합니다 (자동 로그인 없음) */
.lockbox{width:100%; max-width:340px; text-align:center}
.lk-title{font-weight:700; font-family:var(--serif); font-size:var(--fs-head); letter-spacing:.06em}
.lk-sub{font-size:var(--fs-body); color:var(--text-2); margin-top:var(--s8)}
/* PIN 자리 — 작은 빈 원. 채울 때마다 매장 이름이 한 글자씩(f1~f4 는 글자마다 다른 글꼴) 색이 들어옵니다.
   처음엔 네모 칸이 튀어오르는 방식이었는데 산만해서 원 + 글자색만 바뀌게 줄였습니다 */
.pdots{display:flex; justify-content:center; align-items:center; margin:var(--s24) 0 var(--s8); gap:var(--s16); height:48px}
.pdot{width:40px; height:40px; border:1.5px solid var(--border-strong); background:transparent; display:grid; place-items:center; font-size:30px; line-height:1; color:transparent; transition:color .2s ease; box-shadow:none; border-radius:50%}   /* 40px 은 너무 컸음 → 30px */
/* 채워지면 원이 사라지고 그 자리에 큰 글자가 들어옵니다 (원 안의 작은 글자는 심심하다는 평 — 6차-F).
   글자마다 글꼴을 과할 만큼 다르게 — 내장 글꼴 두 벌(Pretendard·Noto Serif KR)만으로 기울임·외곽선·회전으로 변화를 줍니다 */
.pdot.on{border-color:transparent; color:var(--text)}
.pdot.f1{font-family:'Noto Serif KR',serif; font-weight:900}                                                  /* 한 — 굵은 명조 */
.pdot.f2{font-family:'Pretendard',sans-serif; font-weight:700; font-style:italic; letter-spacing:-.05em}      /* 옥 — 기울인 굵은 고딕(합성 이탤릭) */
.pdot.f3{font-family:'Noto Serif KR',serif; font-weight:900}                                                  /* 반 — 속이 빈 외곽선 명조 */
.pdot.f3.on, body.theme-hanok .pdot.f3.on{color:transparent; -webkit-text-stroke:1.6px var(--text)}
.pdot.f4{font-family:'Pretendard',sans-serif; font-weight:400; transform:rotate(-10deg)}                      /* 점 — 가는 고딕을 살짝 기울여 (회전은 배율과 무관) */
.lk-err{height:20px; font-size:var(--fs-sub); color:var(--rust); font-weight:600; margin-bottom:var(--s16)}
.lk-err.busy{color:var(--text-3)}   /* 서버 확인 중 — 오류가 아니라 회색 */
/* 숫자 키패드 — 64px 높이, 카운터에서 손가락으로 */
.pkeys{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s12)}
.pkey{height:64px; border:1px solid var(--border-strong); background:var(--surface); font-size:var(--fs-num); font-weight:700; color:var(--text); border-radius:var(--r-sm)}
.pkey:hover{background:var(--surface-2)}
.pkey.sub{color:var(--text-2); font-size:var(--fs-head); font-weight:400}
.lk-note{font-size:var(--fs-sub); color:var(--text-3); margin-top:var(--s24); line-height:1.6}
/* 서버 설정이 없는 빌드에서만 뜹니다. 들어갈 수 없다는 사실이 눈에 보여야
   "잠긴 줄 알았는데 아니었다" 는 오해가 안 생깁니다. 지우지 마세요 */
.lk-open{font-size:var(--fs-sub); color:#7A5C22; margin-top:var(--s12); line-height:1.6;
  background:#FBF1DC; border:1px dashed #D9BF87; border-radius:var(--r-sm); padding:var(--s8) var(--s12)}
.lk-open b{font-weight:700; color:#6A4E18}
.lk-back{margin-top:var(--s16); background:none; border:none; color:var(--text-3);
  font-size:var(--fs-sub); font-weight:600; text-decoration:underline}
.lk-back:hover{color:var(--text-2)}


/* ============================================================
   9. 테마 (한옥)
   ============================================================ */
/* ---------- 한옥 테마 (body.theme-hanok) ----------
   기본 테마입니다. 설정 → 테마에서 basic(1구역의 :root 값 그대로)으로 되돌릴 수 있습니다.
   이력: 한지+청록+단청(1차) → 종이색+청록+금선(2차) → 먹색+아이보리+각진 모서리(3차)
        → 팔레트 A '따뜻한 뉴트럴'(4차, 2026-09-05 재아 선택): 아이보리에서 노란기를 덜어낸 회색 바탕, 흰 카드, 먹색 액센트.
   ※ --blue 계열은 여기서 덮지 않습니다 — '당일 변동' 파란 펜은 테마와 무관하게 같은 색이어야 합니다 */
body.theme-hanok{
  /* v3 디자인 개편 — apple.com/kr 의 중성 회색. 이전(따뜻한 회색 #F3F2EF/#1C1B19)은 work/patch_v3d.py 에 남아 있습니다 */
  --bg:#F5F5F7;            /* 바탕 — 애플 회색. 흰 카드가 이 위에 놓입니다 */
  --surface:#FFFFFF;       /* 카드 */
  --surface-2:#F5F5F7;     /* 카드 안쪽 구역 = 바탕색 (한 단계만 씁니다) */
  --border:#E5E5EA;        /* 실선 — 거의 안 보이는 굵기 */
  --border-strong:#D2D2D7;
  --text:#1D1D1F;
  --text-2:#6E6E73;        /* 흰 바탕 대비 4.9:1 */
  --text-3:#808085;        /* 라벨 전용 (본문에 쓰지 않음) */
  --pine:#1D1D1F;          /* 주요 동작 = 검정 (이름은 청록 시절 것) */
  --pine-soft:#EDEDF0;
  --amber:#8A6512;         /* 주의 */
  --amber-soft:#FBF3DF;
  --rust:#A63B26;          /* 경고 — 벽돌. 회색 팔레트에서 유일한 '색'이라 더 잘 띕니다 */
  --rust-soft:#FAE9E4;
  --shadow:none;
  --topbar-bg:#FAFAFC;     /* 상단바 — 밝은 바탕 (apple.com 내비). 검은 띠는 하루 종일 보기에 무거웠습니다. 반투명은 blur(구형 TV 금지) 없이는 뒤가 비쳐 불투명으로 */
  --topbar-fg:#1D1D1F;
  --topbar-line:rgba(0,0,0,.08);
  --topbar-btn-line:rgba(0,0,0,.16);
  --topbar-hover:rgba(0,0,0,.05);
  background-image:none;   /* 1차 테마의 세로 결 무늬 제거 — 카드 대비로 충분 */
}
body.theme-hanok .topbar{box-shadow:none; border-bottom:1px solid var(--topbar-line)}
/* 앱 화면에서는 명조를 쓰지 않습니다 (손님용 디스플레이 모드만 예외). 1차 테마가 명조를 걸었던 곳들을 고딕으로 되돌림 */
body.theme-hanok .topbar .title{letter-spacing:.12em; font-family:var(--sans)}
body.theme-hanok .storename{font-family:var(--sans)}
body.theme-hanok .sect-title{letter-spacing:.04em; color:var(--text-2); font-family:var(--sans)}
body.theme-hanok .rh-d{letter-spacing:.02em; font-family:var(--sans)}
body.theme-hanok .metric .v{font-family:var(--sans)}
body.theme-hanok .lk-title{color:var(--text); font-family:var(--sans)}
body.theme-hanok .fh-t{font-family:var(--sans)}
/* 먹색 상단바 위의 영업 상태 배지 — 반투명 밝은 색 */
body.theme-hanok .topbar .state.open{background:rgba(244,243,240,.18); color:#EAF3EC; border-color:rgba(244,243,240,.34)}
body.theme-hanok .topbar .state.prep{background:rgba(244,243,240,.18); color:#F6E4BE; border-color:rgba(244,243,240,.34)}
body.theme-hanok .topbar .state.closed{background:rgba(0,0,0,.18); color:#E2D6C2; border-color:rgba(244,243,240,.24)}
body.theme-hanok .btn.primary{background:var(--pine); border-color:var(--pine)}
body.theme-hanok .btn.primary.warned{background:var(--rust); border-color:var(--rust)}
body.theme-hanok .btn.primary.warned:hover{background:#83301F}
body.theme-hanok .scell.on.warned,body.theme-hanok .hcell.on.warned,
body.theme-hanok .srccell.warned,body.theme-hanok .citem.warned{background:var(--rust); border-color:var(--rust)}
body.theme-hanok .sp-bars rect{fill:#CBD8D0}
body.theme-hanok .pdot.on{color:var(--pine)}


/* ============================================================
   10. 손님용 화면 (.tv / .dsec / .intro)
   ============================================================ */
/* ============================================================
   손님용 디스플레이 모드 (TV 전체화면) — 관리 화면과 다른 언어를 일부러 씁니다 (명조·한지색·창살)
   이 구역은 디자인 개편 대상이 아닙니다. 구조만 정리했습니다.

   [크기 단위 --tvu]
   머리글·날짜·바닥글은 예전에 `clamp(15px, 2.3vh, 30px)` 같은 식이었습니다.
   clamp 의 세 번째 값은 상한이라, TV 가 크거나 브라우저 배율을 낮춰 뷰포트가 커질수록
   글자는 30px 에 갇힌 채 화면만 커져 상대적으로 점점 작아 보였습니다.
   그래서 기준 단위 --tvu(화면 높이의 1%)를 하나 두고 모든 크기를 그 배수로 적었습니다.
   화면이 두 배 커지면 글자도 두 배 커지므로, 3m 떨어져서 보는 크기는 항상 같습니다.
   · 값 조절: 숫자만 바꾸면 됩니다. 머리글을 키우려면 `4.6` 을 `5.2` 로.
   · 예약 목록 글자는 여기가 아니라 자바스크립트의 TV_SIZES 첫 값입니다.
   · 세로 모니터(4:3 보다 세로가 길 때)는 --tvu 를 가로 기준으로 바꿉니다 (11구역 @media).
   · 세로로 든 휴대폰은 1280×720 판을 통째로 축소해 보여 주므로 --tvu 를 7.2px(720의 1%)로 고정합니다 (11구역).
   [화면 구조]  .tv > .tv-bgs(사진 7장 순환) + .tv-stage > .tv-inner(.tv-h 머리글 / .tv-grid 칸 / .tv-f 바닥글)
   ============================================================ */
/* 업장 TV는 어두운 계조를 뭉개므로(black crush) 글자색을 흰색에 가깝게 씁니다 */
.tv{position:fixed; top:0; right:0; bottom:0; left:0; z-index:80; overflow:hidden; background:#0E1218; color:#FDF9F2; display:flex; flex-direction:column; padding:0; --tvu:1vh}
/* 사진 위 어두운 막 — 카드를 거의 불투명하게 바꿨으므로(아래 .dsec) 사진을 덜 어둡게 덮습니다.
   글자 대비는 카드가 책임지고, 이 레이어는 분위기만 담당합니다. */
.tv::after{content:""; position:absolute; top:0; right:0; bottom:0; left:0; background:radial-gradient(130% 90% at 50% 0%, rgba(8,11,15,.06) 0%, rgba(8,11,15,.36) 72%), linear-gradient(180deg, rgba(8,11,15,.24) 0%, rgba(8,11,15,.14) 40%, rgba(8,11,15,.50) 100%); z-index:0}
/* 매장 사진 배경 — 12초마다 부드럽게 전환 (자바스크립트가 .on 을 옮깁니다) */
.tv-bgs{position:absolute; top:0; right:0; bottom:0; left:0; z-index:0; opacity:.92}
.tv-bg{
  position:absolute; top:0; right:0; bottom:0; left:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity 2.4s ease-in-out;
}
.tv-bg.on{opacity:1}
.tv-bg.b1{background-image:var(--bg1)}
.tv-bg.b2{background-image:var(--bg2)}
.tv-bg.b3{background-image:var(--bg3)}
.tv-bg.b4{background-image:var(--bg4)}
.tv-bg.b5{background-image:var(--bg5)}
.tv-bg.b6{background-image:var(--bg6)}
.tv-bg.b7{background-image:var(--bg7)}
.tv-stage{position:absolute; top:0; right:0; bottom:0; left:0; overflow:hidden}
.tv-inner{position:absolute; top:0; right:0; bottom:0; left:0; z-index:1; display:flex; flex-direction:column; padding:calc(var(--tvu)*3.4) calc(var(--tvu)*6.4) calc(var(--tvu)*2.6)}
/* 나가기 버튼 — 평소엔 숨기고, 우측 상단(.tv-hot)에 마우스를 올리거나 화면을 누르면(.tv-tap → .show) 나타납니다.
   위치는 그대로 두고 글자·여백만 --tvu 로 화면에 맞춰 키웁니다 */
.tv-hot{position:absolute; top:0; right:0; z-index:4; width:calc(var(--tvu)*18); height:calc(var(--tvu)*7.5)}
.tv-tap{position:absolute; top:0; right:0; bottom:0; left:0; z-index:2}
.tv-exit{position:absolute; top:14px; right:16px; z-index:5; opacity:0; pointer-events:none; background:rgba(243,234,218,.1); border:1px solid rgba(243,234,218,.25); color:rgba(243,234,218,.75); transition:opacity .25s ease; font-size:calc(var(--tvu)*1.5); padding:calc(var(--tvu)*.95) calc(var(--tvu)*1.8); border-radius:calc(var(--tvu)*.8)}
.tv-exit.show{opacity:1; pointer-events:auto}
/* 전환 버튼 — 종료 버튼 왼쪽. 같이 나타나고 같이 사라집니다 */
.tv-swap{position:absolute; top:14px; z-index:5; opacity:0; pointer-events:none;
  background:rgba(243,234,218,.1); border:1px solid rgba(243,234,218,.25);
  color:rgba(243,234,218,.75); transition:opacity .25s ease;
  font-size:calc(var(--tvu)*1.5); padding:calc(var(--tvu)*.95) calc(var(--tvu)*1.8);
  border-radius:calc(var(--tvu)*.8);
  /* 종료 버튼 폭 + 사이 간격만큼 왼쪽으로 */
  right:calc(16px + var(--tvu)*13.5)}
.tv-swap.show{opacity:1; pointer-events:auto}
.tv-swap:hover{color:#F3EADA; background:rgba(243,234,218,.2)}

/* ============================================================
   손님용 화면 · 목록형 — 왼쪽 영상, 오른쪽 예약

   입구에 걸어 두는 TV 기준입니다. 손님은 지나가면서 3~5초 봅니다.
   그래서 한 줄에 시각·이름·좌석·인원 네 가지만 두고 크게 씁니다.
   크기는 전부 --tvu(화면 높이의 1%) 배수라 TV가 커지면 같이 커집니다.
   ============================================================ */
.tvl{position:absolute; top:0; right:0; bottom:0; left:0; display:flex; z-index:1}

/* 왼쪽 — 영상. 16:9 화면에 16:9 영상을 68% 폭으로 넣으면 위아래가 남으므로
   object-fit:cover 로 높이를 채우고 좌우를 잘라냅니다.
   → 영상을 찍을 때 중요한 것이 가운데 몰려 있어야 합니다. */
.tvl-ad{flex:1 1 auto; position:relative; overflow:hidden; background:#0B0D11}
.tvl-ad video{position:absolute; top:0; left:0; width:100%; height:100%;
  object-fit:cover; display:block; z-index:2; background:#0B0D11}
/* 영상이 아직 없을 때 — 매장 사진을 천천히 넘깁니다 (12초마다, 기존 타이머 그대로) */
.tvl-bgs{position:absolute; top:0; right:0; bottom:0; left:0}
.tvl-veil{position:absolute; top:0; right:0; bottom:0; left:0;
  background:linear-gradient(90deg, rgba(8,11,15,.30) 0%, rgba(8,11,15,.10) 45%, rgba(8,11,15,.55) 100%)}

/* 오른쪽 — 날개. 폭 고정 */
.tvl-side{flex:0 0 32%; min-width:0; display:flex; flex-direction:column;
  background:linear-gradient(180deg,#221913 0%,#16100B 55%,#0D0907 100%);
  border-left:1px solid rgba(214,190,138,.22);
  /* 위 여백이 넉넉한 이유: 종료·전환 버튼이 우측 상단에 뜨는데,
     여백이 좁으면 그 버튼이 날짜 글자를 가립니다 */
  padding:calc(var(--tvu)*7) calc(var(--tvu)*2.4) calc(var(--tvu)*2)}

.tvl-head{flex:none; text-align:center; padding-bottom:calc(var(--tvu)*1.8);
  border-bottom:1px solid rgba(214,190,138,.28)}
.tvl-date{font-family:var(--serif-tv); font-size:calc(var(--tvu)*2);
  letter-spacing:.06em; color:#D6C4A2}
.tvl-head h1{font-family:var(--serif-tv); font-weight:800; margin:calc(var(--tvu)*.8) 0 0;
  font-size:calc(var(--tvu)*3.6); letter-spacing:.14em; text-indent:.14em; color:#FFFFFF;
  line-height:1.2}

.tvl-rows{flex:1 1 auto; min-height:0; list-style:none; margin:0; padding:0; overflow:hidden}
.tvl-r{padding:calc(var(--tvu)*1.3) 0 calc(var(--tvu)*1.5);
  border-bottom:1px solid rgba(214,190,138,.14)}
/* 시각이 가장 큽니다 — 손님이 제일 먼저 찾는 값입니다 */
/* 시각은 명조 — 붉은 칠기·금박의 인트로, 날개 제목과 같은 목소리로. 숫자는 폭이 같아야 줄이 맞습니다 */
.tvl-t{font-family:var(--serif-tv); font-size:calc(var(--tvu)*3.4); font-weight:900; color:#FFD98A;
  font-variant-numeric:tabular-nums; letter-spacing:.02em; line-height:1.15}
/* 같은 시각의 예약 한 건 — 이름 왼쪽, 좌석·인원 오른쪽 */
.tvl-g{display:flex; align-items:baseline; justify-content:space-between;
  gap:calc(var(--tvu)*1.2); white-space:nowrap; margin-top:calc(var(--tvu)*.55)}
.tvl-n{font-size:calc(var(--tvu)*2.5); font-weight:700; color:#FFFFFF; letter-spacing:-.005em;
  overflow:hidden; text-overflow:ellipsis; min-width:0}
/* 좌석은 차분하게, 인원은 금색으로 — 손님이 '내 방·내 인원'을 한눈에 찾습니다 */
.tvl-s{font-size:calc(var(--tvu)*2.1); font-weight:600; color:#C8B795; flex:none; display:inline-flex; align-items:baseline; gap:calc(var(--tvu)*1.1)}
.tvl-cnt{color:#FFD98A; font-weight:700; font-variant-numeric:tabular-nums; min-width:calc(var(--tvu)*4.2); text-align:right}
.tvl-cnt small{font-size:.78em; font-weight:600; color:#C8B795; margin-left:.12em}
.tvl-off{display:block; font-family:var(--sans); font-size:.7em; letter-spacing:.04em; text-indent:0; color:#8C7B62; margin-top:calc(var(--tvu)*.6)}
/* 영상 로딩 표시 — 영상(z-index 2) 위, 가운데 빙글이. 회전은 transform 이지만 배율(zoom 규칙)과 무관합니다 */
.tv-loading{position:absolute; top:0; right:0; bottom:0; left:0; z-index:3; display:flex; align-items:center; justify-content:center; pointer-events:none}
.tv-loading i{display:block; width:calc(var(--tvu)*5); height:calc(var(--tvu)*5); border-radius:50%;
  border:calc(var(--tvu)*.45) solid rgba(246,238,221,.25); border-top-color:rgba(246,238,221,.9); animation:tvspin .9s linear infinite}
@keyframes tvspin{to{transform:rotate(360deg)}}
/* 예약이 없을 때 광고만 — 날개 없이 영상이 화면 전체. 사진 위 어둡게 하는 막(veil)도 없음 */
.tvl-idle .tvl-ad{flex:1 1 100%}
.tv-idle .tv-swap{display:none}
.tvl-none{color:#9C8D76; font-size:calc(var(--tvu)*2.2); text-align:center;
  padding-top:calc(var(--tvu)*4)}
/* 자리가 모자라 접은 줄 수 */
.tvl-more{flex:none; color:#C3B49A; font-size:calc(var(--tvu)*1.8); font-weight:600;
  text-align:center; padding-top:calc(var(--tvu)*1)}
/* 비어 있어도 자리는 둡니다 — 접은 뒤에 이 줄이 나타나면 마지막 줄이 잘렸습니다(점검 T4) */
.tvl-more:empty{visibility:hidden}

.tvl-foot{flex:none; text-align:center; font-family:var(--serif-tv);
  font-size:calc(var(--tvu)*2); letter-spacing:.2em; text-indent:.2em; color:#B9A889;
  padding-top:calc(var(--tvu)*1.6); margin-top:calc(var(--tvu)*1.2);
  border-top:1px solid rgba(214,190,138,.2)}

/* 목록형은 화면을 꽉 채웁니다 — .tv-inner 의 여백을 쓰지 않습니다.
   ※ 이름을 tv-mode-* 로 둔 이유: .tv-grid 는 좌석표 안쪽 격자가 이미 쓰고 있습니다.
      바깥 .tv 에 같은 이름을 붙이면 그 규칙이 바깥에도 먹어 화면이 깨집니다. */
.tv.tv-mode-list .tv-stage{padding:0}

.tv-exit:hover{color:#F3EADA; background:rgba(243,234,218,.2)}
/* 머리글 — 날짜 · 매장 이름 · 금색 실선. 머리글·바닥글이 화면 높이의 1/4를 쓰던 것을 줄여 그만큼 목록 글자를 키웠습니다 */
.tv-h{flex:none; text-align:center; position:relative; z-index:1; padding-bottom:calc(var(--tvu)*1.6)}
.tv-h h1{font-family:var(--serif-tv); font-weight:800; margin:7px 0 0; letter-spacing:.18em; text-indent:.18em; line-height:1.2; color:#FFFFFF; text-shadow:0 2px 16px rgba(0,0,0,.75); font-size:calc(var(--tvu)*4.6); margin-top:calc(var(--tvu)*.7)}
.tv-date{font-family:var(--serif-tv); letter-spacing:.24em; color:#E3D3B2; text-shadow:0 2px 10px rgba(0,0,0,.7); font-size:calc(var(--tvu)*2.2)}
.tv-line{height:1px; margin:clamp(9px,1.5vh,18px) auto 0; background:linear-gradient(90deg, transparent, #C9AE79, transparent); width:calc(var(--tvu)*9); margin-top:calc(var(--tvu)*1.2)}
/* 칸 배치 — 칸 크기와 글자 크기를 고정합니다.
   예전에는 내용에 맞춰 늘였는데, 예약이 하나 늘고 줄 때마다 칸과 글자가 들썩여 화면이 산만했습니다.
   넘치는 만큼은 '외 N건' 으로 접습니다(capLists). --tv-li·--tv-h3 은 fitDisplay() 가 다시 정하며, 여기 값은 자바스크립트가 못 돌았을 때의 기본값입니다 */
.tv-grid{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; --tv-li:calc(var(--tvu, 1vh) * 2.2); --tv-h3:calc(var(--tvu, 1vh) * 2.09); position:relative; z-index:1; gap:calc(var(--tvu)*1.7)}
.tv-row{flex:1 1 0; min-height:0; display:flex; gap:calc(var(--tvu)*2.4)}
/* 좌석 카드 — 거의 불투명하게 둡니다.
   반투명이면 뒤 사진 밝기에 따라 글자 대비가 매 12초 달라져, 싸구려 TV에서 글자가 묻힙니다.
   사진은 카드 바깥 여백·머리글·바닥글에서 계속 보이므로 분위기는 유지됩니다. 홀 카드(.hall)는 조금 갈색. */
.dsec{flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; background:linear-gradient(180deg, rgba(9,12,17,.93), rgba(5,8,12,.95)); border:1px solid rgba(214,190,138,.42); box-shadow:0 6px 26px rgba(0,0,0,.45); padding:calc(var(--tvu)*1.3) calc(var(--tvu)*2.4) calc(var(--tvu)*1.1); border-radius:calc(var(--tvu)*1.5)}
.dsec.hall{background:linear-gradient(180deg, rgba(30,25,15,.94), rgba(18,15,9,.95)); border-color:rgba(214,182,120,.52)}
.dsec li .tn{font-size:.72em; color:#C8B795; margin-left:.4em; font-weight:500}   /* 테이블 칸에서 테이블 이름 */
/* 카드 머리 — [층] 룸 이름 [정원]. 룸 이름만 명조로 남겨 한옥 분위기를 지킵니다. 숫자·보조 정보는 고딕이 훨씬 잘 읽힙니다 */
.dsec h3{flex:none; display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; font-size:var(--tv-h3); font-weight:700; letter-spacing:.06em; border-bottom:1px solid rgba(214,190,138,.55); white-space:nowrap; color:#FFFFFF; margin:0 0 calc(var(--tvu)*.9); padding-bottom:calc(var(--tvu)*.8); gap:calc(var(--tvu)*1)}
.dsec h3 .nm{font-family:var(--serif-tv); text-align:center}
/* 좌석 이름 좌우의 보조 글씨(지하 / 4~6인) — 너무 작아서 키웠습니다. em 이라 좌석 이름 크기와 같이 커지고 작아집니다 */
.dsec h3 .fl{font-family:var(--sans); letter-spacing:.04em; text-align:left; font-size:.74em; font-weight:700; color:#E8DECA}
.dsec h3 .cap{font-family:var(--sans); text-align:right; font-size:.74em; font-weight:700; color:#E8DECA}
/* 예약 줄 — 시각(금색) · 이름 · 인원. 홀은 두 열(.two-col) */
.dsec ul{flex:1 1 auto; min-height:0; list-style:none; margin:0; padding:0; display:flex; flex-direction:column; overflow:hidden; gap:calc(var(--tvu)*.75)}
.dsec ul.two-col{display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(6,auto); align-content:start; gap:calc(var(--tvu)*.75) calc(var(--tvu)*3.5)}
.dsec li{flex:none; display:flex; align-items:baseline; font-family:var(--sans); font-weight:600; font-size:var(--tv-li); line-height:1.45; white-space:nowrap; gap:calc(var(--tvu)*1.05); padding:calc(var(--tvu)*.2) 0}
.dsec li .t{font-weight:800; color:#FFD98A; flex:none; letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.dsec li .n{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; color:#FFFFFF}
.dsec li .p{flex:none; color:#DCCDB2; font-size:.9em; font-weight:500}
/* 지난 예약은 흐리게 하되, TV에서 아예 사라지지 않을 만큼만 */
.dsec li.past{opacity:.58}
.dsec li.past .t{color:#C9B68F}
.dsec li.none{color:#A2947C; font-weight:500; font-size:calc(var(--tv-li) * .8); padding-top:calc(var(--tvu)*.8)}
/* 자리가 모자라 접은 줄 수 (fitDisplay → trimOverflow) */
.dsec li.more{color:#C3B49A; font-weight:600; font-size:calc(var(--tv-li) * .8)}
/* 바닥글 */
.tv-f{flex:none; text-align:center; border-top:1px solid rgba(243,234,218,.24); font-family:var(--serif-tv); color:#D3C2A2; text-shadow:0 2px 10px rgba(0,0,0,.7); letter-spacing:.26em; text-indent:.26em; position:relative; z-index:1; padding-top:calc(var(--tvu)*1.4); margin-top:calc(var(--tvu)*1.2); font-size:calc(var(--tvu)*2.5)}
/* 화면이 작으면(900px 이하 또는 높이 480 이하) 디스플레이 대신 '화면이 작습니다' 안내(.tv-small)를 띄웁니다 — 11구역 @media */
.tv-small{display:none}

/* ------------------------------------------------------------
   들어갈 때 인사 — 중식당에서 한옥으로

   歡迎光臨(붉은 칠·금박) → 어서오세요(한지·먹·창살).
   · 배경은 세 겹(붉은 칠 / 어두운 나무색 .intro-mid / 한지 .intro-ko)을 겹쳐 두고 글자 진행에 따라 위 두 겹의 불투명도를 올립니다.
     6차 전에는 빨강 → 한지 두 단계였는데 글자 5개가 1.3초에 걸쳐 바뀌므로 바탕도 중간 단계가 있어야 '단계'가 느껴집니다.
   · 글자는 먹이 종이에 스미듯 흐림(blur)에서 선명하게 나타납니다.
   · 양옆 띠살 창호와 한지 결(SVG 잡음)은 전부 CSS/데이터 URI — 이미지 파일 0개.
   · 6차에서 마지막 낙관(韓屋)·소제(한옥반점)는 조잡해서 뺐습니다. 마지막 장면은 어서오세요 + 창호만.
   ※ 한 번 그린 뒤 클래스만 바꿉니다. innerHTML 을 다시 쓰면 전환이 전혀 재생되지 않습니다.
   ------------------------------------------------------------ */
.intro{position:fixed; top:0; right:0; bottom:0; left:0; z-index:200;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:#6E1A10; color:#F6E7C8; cursor:pointer}
/* 바탕 전환은 글자 간격(200ms)보다 조금 길게 — 너무 길면 마지막 글자 뒤 600ms 에 끝나는 인트로보다 늦게 끝납니다 */
.intro-bg{position:absolute; top:0; right:0; bottom:0; left:0; transition:opacity .55s ease}
/* 중식당 — 칠기 붉은색. 가운데는 살짝 밝고 가장자리는 어둡게(조명 아래 칠기) */
.intro-cn{
  background:
    radial-gradient(ellipse at 50% 46%, rgba(255,190,120,.10) 0%, rgba(0,0,0,0) 40%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.02) 0%, rgba(0,0,0,.26) 56%, rgba(0,0,0,.62) 100%),
    repeating-linear-gradient(45deg,  rgba(255,213,150,.085) 0 2px, transparent 2px 30px),
    repeating-linear-gradient(-45deg, rgba(255,213,150,.085) 0 2px, transparent 2px 30px),
    linear-gradient(160deg, #8E2314 0%, #6E1A10 55%, #4E1109 100%);
}
/* 중간 — 어두운 나무색(대들보). 빨강에서 한지로 곧장 가면 두 장면이라, 사이에 한 장면을 더 둡니다.
   사라지는 한자를 나무색(#9A6A3A)으로 누르는 규칙과도 어울립니다 */
.intro-mid{opacity:0; background:
    radial-gradient(ellipse at 50% 46%, rgba(120,90,60,.22) 0%, rgba(0,0,0,0) 45%),
    linear-gradient(165deg, #46332A 0%, #3A2A1E 55%, #2C1F16 100%)}
/* 한옥 — 한지. 미색 바탕에 종이 결(SVG feTurbulence 를 아주 옅게 겹침) + 가운데 은은한 빛 */
.intro-ko{
  opacity:0;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 58%),
    radial-gradient(circle at 50% 50%, rgba(80,56,30,0) 52%, rgba(80,56,30,.16) 100%),
    url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .24 0 0 0 .09 0'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)'/%3E%3C/svg%3E"),
    linear-gradient(170deg, #F5EEE0 0%, #EFE5D2 60%, #E9DEC8 100%);
}
/* 띠살 창호 — 양옆에 한 짝씩. 세로살은 끝까지, 가로살은 위·가운데·아래 세 무리만(띠살의 특징).
   위→아래 순서: 세로살 / 가로살을 가리는 한지 띠 / 가로살 / 한지 바탕 */
.intro-sash{position:absolute; top:6vh; bottom:6vh; width:17vw; opacity:0; pointer-events:none;
  border:3px solid rgba(96,66,38,.78); box-shadow:0 0 0 1px rgba(96,66,38,.25), 0 18px 60px rgba(60,40,20,.18);
  background:
    repeating-linear-gradient(90deg, rgba(96,66,38,.72) 0 3px, transparent 3px 44px),
    linear-gradient(to bottom, transparent 0, transparent 21%, #F0E6D3 21%, #F0E6D3 44%, transparent 44%, transparent 56%, #F0E6D3 56%, #F0E6D3 79%, transparent 79%),
    repeating-linear-gradient(0deg, rgba(96,66,38,.72) 0 3px, transparent 3px 44px),
    #F0E6D3;
  transition:opacity 1.1s ease, transform 1.3s cubic-bezier(.2,.7,.2,1)}
.intro-sash.l{left:3vw;  transform:translateX(-6vw)}
.intro-sash.r{right:3vw; transform:translateX(6vw)}
.intro.turning .intro-sash{transform:translateX(0)}
/* 글자 — 두 낱말을 한 자리에 겹쳐 놓고 글자 단위로 바꿉니다 */
.intro-w{position:relative; font-family:var(--serif-tv); font-weight:900; line-height:1.1;
  font-size:clamp(36px,6.4vw,72px); letter-spacing:.16em; text-indent:.16em; width:100%; text-align:center}   /* 6차: 104px 는 너무 컸음 */
.intro-word{display:block}
.intro-word.ko{position:absolute; top:0; left:0; width:100%}
.intro .ic{display:inline-block; transition:opacity .55s ease, filter .55s ease, transform .55s ease, color .6s ease}   /* 글자 간격 200ms 에 맞춰 */
/* 한자: 금박. 바탕이 한지로 바뀌면 남은 한자는 나무색으로 눌러 두었다가 흐려지며 사라집니다 */
.intro-word.cn .ic{color:#F1C77C; text-shadow:0 2px 18px rgba(0,0,0,.5), 0 0 2px rgba(255,236,190,.35)}
.intro.turning .intro-word.cn .ic{color:#9A6A3A; text-shadow:none}
.intro-word.cn .ic.off{opacity:0; filter:blur(8px); transform:scale(1.08)}
/* 한글: 먹. 흐림에서 선명하게 — 먹이 종이에 스미는 느낌 */
.intro-word.ko .ic{color:#241E1A; opacity:0; filter:blur(10px); transform:translateY(.06em) scale(1.06);
  text-shadow:0 0 1px rgba(36,30,26,.5)}
.intro-word.ko .ic.on{opacity:1; filter:blur(0); transform:none}
/* 좁은 화면(폰): 창호는 접어 둡니다 */
@media (max-width:640px){ .intro-sash{display:none} }


/* ============================================================
   11. 반응형 — 정리한 구역의 @media 규칙
   원본에서의 앞뒤 순서를 그대로 지키고, 붙어 있는 같은 조건끼리만 한 블록으로 묶었습니다.
   (같은 조건을 한 덩어리로 합치면 다른 조건 블록과의 앞뒤가 바뀌어 화면이 바뀝니다 — 겹치는 조건은 뒤가 이깁니다)
   ============================================================ */
/* 블록 순서는 원본의 앞뒤 그대로입니다. 같은 조건이 여러 번 나오는 것은 그래서입니다.
   (예: (max-width:900px) 상단바 블록은 (max-width:767px) 블록보다 뒤에 있어야 모바일 상단바가 3줄로 나옵니다)
   ---- 매장 선택 화면: 마우스가 있는 큰 화면에서만 올리면 넓어지고 사진이 커집니다 ---- */
@media (hover:hover) and (min-width:900px){
  .panel:not(.locked):hover{flex-grow:1.22}
  .panel:not(.locked):hover .bg{transform:scale(1.08); filter:saturate(1) brightness(.76)}
  .panel:not(.locked):hover .veil{opacity:.6}
  .panel:not(.locked):hover .name{letter-spacing:.32em; text-indent:.32em}
  .panel:not(.locked):hover .rule{width:92px; background:#fff}
  .panel:not(.locked):hover .meta{opacity:1; transform:none}
}

/* 터치 기기(hover 없음)와 태블릿 폭에서는 설명 글(.meta)을 항상 보입니다 — 올려 볼 수 없으니까 */
@media (hover:none){
  .panel .meta{opacity:1; transform:none}
}

/* 폰에서는 두 매장을 위아래로 */
@media (max-width:767px){
  .split{flex-direction:column}
  .split .panel + .panel{box-shadow:0 -1px 0 rgba(255,255,255,.22)}
  .panel .name{font-size:clamp(28px,9vw,42px)}
}

@media (min-width:768px) and (max-width:899px){
  .panel .meta{opacity:1; transform:none}
}

@media (prefers-reduced-motion:reduce){
  .panel{transition:none !important}
  .panel *{transition:none !important}
}

/* ---- 본문 폭·여백: 태블릿(768) → 노트북(1024, 본문 최대 1720px) ---- */
@media (min-width:768px){
  .content{padding:var(--s24) var(--s24) 80px}

/* ---- 디스플레이 모드 ----
   세로로 든 휴대폰: 1280×720 판을 통째로 축소해 가운데에 가로 미리보기로 띄웁니다 (16:9) */
@media (orientation:portrait) and (max-width:820px){
  .tv{display:grid; place-items:center; background:#07090C}
  .tv-stage{position:relative; top:auto; right:auto; bottom:auto; left:auto; width:100vw; height:56.25vw; max-height:80vh; box-shadow:0 12px 44px rgba(0,0,0,.55); border:1px solid rgba(214,190,138,.18)}
  .tv-inner{top:auto; right:auto; bottom:auto; left:auto; top:0; left:0; width:1280px; height:720px; transform:scale(calc(100vw / 1280)); transform-origin:top left}
  .tv::after{top:0; right:0; bottom:0; left:0}
  .tv-exit{top:auto; bottom:18px; right:50%; transform:translateX(50%)}
}

/* 화면이 작으면 아예 표시하지 않고 '화면이 작습니다' 안내만 — 축소해서 보여줘 봐야 읽히지 않고 잘못된 인상만 줍니다.
   (세로 폰은 위 블록이 먼저 걸리지만 이 블록이 뒤라서 이깁니다 → 안내 화면) */
@media (max-width:900px), (max-height:480px){
  .tv{display:grid; place-items:center; background:#0C0E12; padding:24px}
  .tv-stage{display:none}
  .tv-hot{display:none}
  .tv-tap{display:none}
  .tv-exit,.tv-swap{display:none}
  .tv::after{display:none}
  .tv-small{display:grid; place-items:center; position:relative; z-index:2; width:100%; max-width:340px}
  .ts-box{text-align:center; padding:34px 26px; border:1px solid rgba(244,242,238,.16); border-radius:4px; background:rgba(244,242,238,.04)}
  .ts-box svg{width:38px; height:38px; stroke:#6F6A62; fill:none; stroke-width:1.4; margin-bottom:16px}
  .ts-t{color:#E4DFD5; font-size:15.5px; font-weight:700; margin-bottom:9px; letter-spacing:-.01em}
  .ts-s{color:#8A857C; font-size:12.5px; line-height:1.65; margin-bottom:20px}
  .ts-box .btn{width:100%; background:#F4F2EE; border-color:#F4F2EE; color:#1B1A18}
}

/* 화면이 4:3보다 세로로 길면(세로 모니터 등) 높이 기준으로는 너무 커집니다.
   그때는 가로 기준으로 바꿉니다. 4:3에서 1vh = 0.75vw 라 경계에서 튀지 않습니다. */
@media (max-aspect-ratio:4/3){
  .tv{--tvu:.75vw}
}

/* 세로 폰 미리보기는 1280×720 판을 통째로 축소하는 구조라, 그 안에서 vh 를 쓰면 실제 화면 높이를 따라가 크기가 어긋납니다. 720의 1% 로 고정 */
@media (orientation:portrait) and (max-width:820px){
  .tv{--tvu:7.2px}
}

/* ---- Phase 5: 폰에서는 마법사 요약 칩(전화 · 9/5 오후 6시 · 4명 · 관우 룸)을 둘째 줄로 — 한 줄에 두면 단계 점이 찌그러집니다 ---- */
@media (max-width:767px){
  .wz-sum{flex-basis:100%; margin-left:0; flex-wrap:wrap}
}

/* ---- Phase 4-1 대시보드: 태블릿 이상에서는 카드 안쪽을 24px 로 넓힙니다 ('여백이 정보'). 폰은 16px 그대로 ---- */
@media (min-width:768px){
  .card-b{padding:var(--s24)}
  .metric{padding:var(--s24) var(--s24)}
  .fold-h{padding:var(--s16) var(--s24)}
  .fold-b{padding:0 var(--s24) var(--s24)}
  .dash{gap:var(--s16)}
}

/* 움직임 줄이기(접근성 설정)면 시트·확인창 애니메이션을 끕니다 */
@media (prefers-reduced-motion:reduce){
  .sheet, .calbox, .modal, .overlay, .fold-b{animation:none}
}
/* 준비 중 매장(.panel.soon)의 hover 확대는 1.03 — 8구역에 있는 같은 규칙을 여기 한 번 더 둡니다.
   위의 hover 미디어(.panel:not(.locked):hover .bg → 1.08)와 우선순위가 같아, 원본처럼 이 규칙이 뒤에 와야 이깁니다 */
.panel.soon:hover .bg{transform:scale(1.03)}

/* ============================================================
   v3 1차 — 재아 요청 반영 (2026-09-07)
   원칙: "누르는 선택에 따라 화면 높이가 바뀌지 않게". 나타났다 사라지는 요소는 자리를 미리 잡아 두고(.hold / 슬롯)
   보이기만 바꿉니다. visibility:hidden 은 display:none 과 달리 자리를 그대로 차지합니다.
   ============================================================ */
/* 자리만 지키고 보이지 않는 요소 — 경로 입력창 · 직접 입력 스테퍼 · 코스 요약 줄 */
.hold{visibility:hidden; pointer-events:none}   /* ※ .ghost 는 버튼 스타일(.btn.ghost)이 이미 쓰는 이름이라 .hold 로 */
.src-detail{margin-top:18px}
/* 경고 자리: 항상 두 줄(40px)만큼 비워 둡니다. 경고가 생겨도 아래 본문이 밀리지 않습니다.
   세 줄 이상 걸리는 경우(지난 날짜 + 라스트오더 + 마감)는 드물어 그때만 조금 밀립니다 */
.wz-warn{min-height:40px; line-height:20px; margin-top:var(--s8)}
/* 경고 자리는 항상 3줄 높이. 경고가 1줄이든 3줄이든 아래가 움직이지 않습니다 */
.wz-warn{height:60px; min-height:60px; overflow:hidden}
/* 영업시간 한 줄도 요일에 따라(브레이크 유무) 길이가 달라 줄바꿈이 생기지 않게 */
.hours-line{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:36px; line-height:20px; box-sizing:border-box}
/* 노쇼 안내 자리 (전화번호 아래) */
.ns-slot{min-height:40px; margin-top:var(--s8)}
.ns-slot .ns-hint{margin-top:0}
/* 분 조절: 시각을 고르기 전에는 흐리게, 손잡이·채움만 숨김 (레일 높이는 그대로) */
.mwrap.idle{opacity:.5; pointer-events:none}
.mwrap.idle .mknob, .mwrap.idle .mfill{visibility:hidden}
.mwrap.idle .mhead .mnow{color:var(--text-3); font-size:var(--fs-sub); font-weight:600}
/* 달력이 시간 칸과 키를 맞춥니다 — 900px 이상에서 좌우로 놓일 때 날짜 칸이 남는 높이를 나눠 가집니다 */
.wz-cal{display:flex; flex-direction:column}
.wz-cal .bgrid:last-child{flex:1; grid-auto-rows:minmax(58px,96px)}   /* 시각 칸이 30분 단위로 길어져도 날짜 칸은 96px 까지만 */
@media (min-width:900px){
  .wz-step1{align-items:stretch}
}
/* 시각 글자까지 벽돌색 — 경고 걸리는 시각은 칸 아래 작은 글씨만으로는 멀리서 안 보입니다 */
.hcell .ap.rust, .hcell .hh.rust{color:var(--rust)}
.hcell.on .ap.rust, .hcell.on .hh.rust{color:#fff}
/* 같은 팝업을 고쳐 그린 것이면 등장 움직임 생략 — 코스를 누를 때마다 시트가 다시 열리는 것처럼 보이던 문제 */
body.same-pop .sheet, body.same-pop .calbox, body.same-pop .modal, body.same-pop .overlay{animation:none}

/* 질문 위 작은 표시 — 손님께 읽는 말인지, 직원이 확인할 것인지 */
.wz-eyebrow{font-size:var(--fs-label); font-weight:700; letter-spacing:.08em; color:var(--text-3); margin-bottom:var(--s8)}
/* 코스 칸 + 모서리 − (처음 누르면 성인 수만큼 채워지므로 줄이는 길이 필요합니다) */
.citem-w{position:relative; display:block}
.citem-w .citem{width:100%}
.cminus{position:absolute; left:-6px; top:-8px; width:26px; height:26px; border-radius:50%; border:2px solid var(--bg);
  background:var(--text-2); color:#fff; font-size:var(--fs-body); line-height:1; display:grid; place-items:center; padding:0; z-index:1}
/* 합계 칸은 경고 한 줄만큼 자리를 미리 — 경고가 생길 때 시트가 커지지 않게 */
.course-total{min-height:64px}

/* ---- 상단바: 맨 왼쪽 버튼을 없애고 매장 이름이 그 일을 합니다 (6차-K 부터 아이콘 없이 HANOK 글자만) ---- */
/* 날짜 화살표는 마우스가 그 줄에 갔을 때만 — 손가락 기기(hover 없음)에서는 늘 보입니다. 안 보이면 못 누르니까 */
@media (hover:hover) and (pointer:fine){
  .bnav, .bnav.mo{opacity:0; transition:opacity .15s}   /* .bnav.mo 가 더 세므로 같이 적어야 월 화살표도 숨습니다 */
  .bar-mid:hover .bnav, .bnav:focus-visible{opacity:.7}
  .bar-mid:hover .bnav.mo{opacity:.55}
  .bar-mid:hover .bnav:hover{opacity:1}
}
/* 더보기(⋮) 메뉴 — 예약률 추이 · 설정 · 디스플레이 모드 */
/* 설정 화면에는 가운데 날짜 칸이 없습니다 — 폰에서 빈 줄이 생기지 않게 아예 안 그리고, PC 에서는 오른쪽 묶음을 auto 여백으로 밉니다 */
.bar-right{margin-left:auto}
.more-wrap{position:relative; flex:none}
.more-menu{position:absolute; right:0; top:calc(100% + 6px); z-index:40; min-width:190px; padding:var(--s4);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  box-shadow:0 8px 24px rgba(20,20,18,.18); display:flex; flex-direction:column; animation:modal-in .15s ease-out}
.more-menu button{display:flex; align-items:center; gap:var(--s12); width:100%; min-height:44px; border:none; background:none;
  text-align:left; padding:var(--s8) var(--s12); font-size:var(--fs-body); font-weight:600; color:var(--text); border-radius:var(--r-sm); white-space:nowrap}
.more-menu button:hover{background:var(--surface-2)}
.more-menu button:active{filter:brightness(.9)}
.more-menu svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; flex:none; color:var(--text-2)}
/* 메뉴 바깥을 누르면 닫히게 하는 투명 막. 상단바(z30) 안에 있으므로 본문 전체를 덮습니다 */
.more-veil{position:fixed; top:0; left:0; right:0; bottom:0; z-index:29}
@media (max-width:900px){
  .more-wrap{order:6}
  /* 상단바를 3줄(매장명 / 버튼 / 날짜)에서 2줄로 — 매장명이 혼자 한 줄을 차지하던 것을 버튼 줄 왼쪽에 붙입니다.
     태블릿에서 상단바가 190px 이나 됐는데, 그만큼 타임라인이 밀려 내려갔습니다 */
  .storename{flex:0 1 auto; justify-content:flex-start; text-align:left; padding:var(--s4) var(--s8); height:36px}
  .bar-right{flex:1 1 auto}
}

/* ---- 대시보드 지표줄: 타임라인 아래로 내리고 칸을 낮춥니다 (전엔 너무 두꺼운 네모) ---- */
.metric{padding:var(--s8) var(--s12)}
.metric .v{font-size:var(--fs-head); line-height:24px; letter-spacing:-.02em}
.metric .u{font-size:var(--fs-sub)}
.metric .k{margin-top:0; font-size:var(--fs-label); line-height:18px}
.metric .s{font-size:var(--fs-label); line-height:18px}



/* ============================================================
   v3 디자인 개편 — apple.com/kr 을 기준으로 (2026-09-07)
   색은 9구역 팔레트에서, 모서리 계단은 1구역 토큰에서 바꿨고 여기에는 '구성' 규칙만 둡니다.
   원칙: 면은 회색 바탕 + 흰 카드 두 단계뿐, 선은 거의 안 보이게, 누르는 것은 알약, 고른 것은 살짝 떠 보이게.
   ============================================================ */
/* ---- 알약 — 누르는 것 전부. 타일(면이 넓은 것)은 12px 그대로 ---- */
.btn, .btn.sm, .btn.lg, .tvbtn, .topbar .tvbtn, .topbar .home, .bdate, .wz-back,
.seg button, .filters button, .nonebtn, .nonebtn.sm, .mfine button, .pmore, .undecided, .wbtn,
.tag, .pill, .wz-sum span, .avail, .scell .avail{border-radius:980px}
.btn.lg{padding:var(--s16) var(--s32)}
.btn.primary{box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* ---- 상단바: 44px 내비 느낌으로 얇게. 버튼은 36px 그대로(손가락) ---- */
.topbar-in{padding:var(--s8) var(--s24)}
.more-menu{border:none; box-shadow:0 12px 40px rgba(0,0,0,.16); border-radius:var(--r-md); padding:var(--s8)}
/* ---- 카드: 테두리·그림자 없이 흰 면 하나 ---- */
.card{border:none; box-shadow:none; border-radius:var(--r-lg)}
.card + .card{margin-top:var(--s16)}
.fold-h:hover{background:transparent}
/* 지표 칸은 카드 없이 회색 바탕 위에 흰 칸 다섯 개 — apple.com 의 회색 바탕 + 흰 상자 구성 */
.metrics-card{background:transparent; border-radius:0}
.metrics{gap:var(--s8); background:transparent}
.metric{border-radius:var(--r-md); padding:var(--s12) var(--s16)}
button.metric:hover{background:#FAFAFC}
.metric .v{letter-spacing:-.03em}
.metric .k{letter-spacing:.04em}
/* ---- 타일: 선은 실선 한 겹, 고르면 검정 + 살짝 떠 보이게 ---- */
.srccell, .ptile, .scell, .hcell, .citem, button.bday, .pmore, .bigstep button, .mfine button, .mo-h .nav,
.wbtn, .dcell, .zm-t, .pkey, .pdot, .wz-back, .btn, .seg button, .filters button, .nonebtn, .ordbtns button,
.res-head .nav, .datenav .nav{border-color:var(--border)}
.scell.busy{border-style:solid; background:var(--surface-2); opacity:.75}
.hcell.gone{opacity:.4}
.srccell.on, .ptile.on, .scell.on, .hcell.on, .citem.on, button.bday.sel{box-shadow:0 6px 16px rgba(0,0,0,.16)}
.ptile .pn, .bigstep .v, .tl-kpi b, .hcell .hh{letter-spacing:-.03em}
.lbl, .wz-eyebrow, .subhead, .metric .k, .hcell .ap{letter-spacing:.04em}
/* ---- 마법사: 질문은 더 크게·더 조여서 (큰 글자는 자간을 음수로 — 크기별 자간) ---- */
.wz-q h2{letter-spacing:-.02em; line-height:1.3}
@media (min-width:768px){ .wz-q h2{font-size:32px; letter-spacing:-.025em} }
.wz-top, .wz-foot{border-color:var(--border)}
.wz-sum span{background:var(--surface-2); border-color:transparent; color:var(--text-2)}
.wz-dot .n{background:var(--border-strong); color:#fff}
.hours-line, .seat-note, .course-sum, .infant{background:var(--surface-2); border:none}
/* ---- 입력 ---- */
input, select, textarea{border-color:var(--border-strong); border-radius:var(--r-sm)}
.f.big input{border-radius:var(--r-md)}
/* ---- 시트·확인창: 크고 부드러운 그림자로 '떠 있는 재질'을 (blur 는 구형 TV 금지) ---- */
.sheet{box-shadow:0 24px 64px rgba(0,0,0,.22)}
.modal{box-shadow:0 24px 64px rgba(0,0,0,.24); border-radius:var(--r-lg)}
.calbox{border-radius:var(--r-lg); box-shadow:0 24px 64px rgba(0,0,0,.22)}
.overlay{background:rgba(0,0,0,.4)}
.done-box{border:none; box-shadow:0 12px 40px rgba(0,0,0,.08)}
/* ---- 30분 단위 시각 칸: 칸이 두 배라 낮고 촘촘하게. 브레이크 칸은 지난 시간처럼 흐리게 (누를 수는 있음) ---- */
.hgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:var(--s8)}
.hcell{padding:var(--s8) var(--s4) var(--s8); gap:0; height:64px; min-height:64px}
/* 시각 칸 아래 안내(N건 · 브레이크 · 경고)는 한 줄로 고정 — 길면 잘라냅니다. 칸 높이가 변하면 안 됩니다 */
.hcell .hn{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
/* 고른 날 영업시간 밖 — 자리만 지키는 칸 */
.hcell.outside{opacity:.38; cursor:default; background:var(--surface-2)}
.hcell.outside:hover{background:var(--surface-2)}
/* 타일 설명을 뺀 뒤로 글자만 위에 붙어 아래가 비어 보입니다 — 세로 가운데로 */
.srccell{justify-content:center}
.srccell .s-l{margin:0}
.hcell .ap{line-height:16px}
.hcell .hh{font-size:var(--fs-title); line-height:24px; font-variant-numeric:tabular-nums}
.hcell .hn{line-height:16px; min-height:16px}
.hcell.brk{opacity:.45; background:var(--surface-2)}
.hcell.brk.on{opacity:1}
@media (min-width:900px){ .hgrid{grid-template-columns:repeat(4,1fr)} .hcell{padding:var(--s8) var(--s4)} .hcell .hh{font-size:var(--fs-title)} }
@media (min-width:1280px){ .hgrid{grid-template-columns:repeat(5,1fr)} }   /* 22칸 → 5줄 */
@media (max-height:820px) and (min-width:900px){ .hcell{min-height:56px} }
/* ---- 타임라인: 블록은 애플 진회색, 지난 것은 밝은 회색 ---- */
.tl-track{background:#FAFAFC; border-color:var(--border)}
.blk, .lgsw.ok{background-color:#2C2C2E}
.blk.past{background-color:#C7C7CC}
.blk.past.tent{background-color:#C7C7CC; background-image:repeating-linear-gradient(-45deg, rgba(0,0,0,.13) 0 4px, transparent 4px 10px)}

/* ---- 폰(640px 이하) 개편 (7차-M). PC 는 위 규칙 그대로 ---- */
/* 영업시간 시트 */
.hs-date{font-size:var(--fs-sub); color:var(--text-3); font-weight:600; margin:0 0 var(--s12)}
.hs-row{display:flex; justify-content:space-between; align-items:center; padding:var(--s12) 0; border-top:1px solid var(--border); font-size:var(--fs-body)}
.hs-row span{color:var(--text-2)} .hs-row b{font-weight:700}
@media (max-width:640px){
  /* 상단 한 줄 — 900px 규칙(3줄로 접기)을 되돌립니다 */
  .topbar.mobile .topbar-in{flex-wrap:nowrap; padding:var(--s8) var(--s12); gap:2px}
  .topbar.mobile .storename{order:0; flex:none; justify-content:flex-start; text-align:left; height:36px; padding:0 2px}
  .topbar.mobile .sn-brand{font-size:14px; letter-spacing:.12em}
  .topbar.mobile .bar-right{order:0; flex:1 1 auto; justify-content:flex-end; gap:3px; flex-wrap:nowrap; min-width:0}
  .topbar.mobile .tvbtn.icon{width:36px; height:36px; padding:0; justify-content:center; flex:none}
  .topbar.mobile .tvbtn.icon svg{width:18px; height:18px}
  .topbar.mobile .more-wrap{flex:none}
  /* 오늘이 아닐 때 달력 아이콘 오른쪽 위 점 */
  .topbar.mobile .b-cal{position:relative}
