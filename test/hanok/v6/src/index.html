/* 숫자만 남기고 010-0000-0000 형태로 자동 정리 */
/* 010 으로 시작할 때만 자동으로 - 를 넣습니다.
   직접 - 를 치는 분도 있어서, 사용자가 넣은 자리를 시스템이 다시 옮기면 오히려 방해가 됩니다.
   그래서 이미 - 가 들어 있으면 손대지 않습니다. */
/* ※ 예전에는 "값에 - 가 하나라도 있으면 손대지 않음" 이었는데, 시스템이 넣은 - 도 그 조건에 걸려
      010-1234 까지 만든 뒤로는 다시 정리하지 않아 010-12345678 이 됐습니다.
      이제 '사용자가 - 를 직접 쳤는지'(phoneManual)만 보고, 아니면 숫자만으로 매번 다시 만듭니다 */
function fmtPhone(el, ev){
  const raw = el.value;
  if(ev && ev.inputType==="insertText" && ev.data==="-") WZ.phoneManual = true;
  if(!raw.replace(/\D/g,"")) WZ.phoneManual = false;        /* 다 지우면 다시 자동으로 */
  if(WZ.phoneManual){ WZ.phone = raw; return; }
  const out = phoneFmt(raw.replace(/\D/g,"").slice(0,11));
  if(el.value !== out) el.value = out;
  WZ.phone = out;
}
/* 숫자열 → 하이픈 넣은 번호. 휴대폰(01x) 3-4-4, 서울(02) 2-3-4 / 2-4-4, 지역번호(033 등) 3-3-4 / 3-4-4, 1588 류 4-4.
   입력 중(자릿수가 다 안 찼을 때)에도 앞부분 하이픈은 미리 넣어 줍니다 */
/* 입력한 번호를 저장용 모양으로 — 숫자만 남기고 phoneFmt. 서버 왕복 뒤 모양이 달라져 충돌로 오인하던 것을 막습니다(점검 D10) */
function phoneNorm(v){ const d = String(v || "").replace(/\D/g, ""); return d ? phoneFmt(d) : ""; }
function phoneFmt(d){
  if(!d) return "";
  let a = 3;                                   /* 앞자리(지역·통신사) 길이 */
  if(d.indexOf("02") === 0) a = 2;
  else if(/^1[5-9]/.test(d)) a = 4;            /* 1588-0000 같은 대표번호 */
  if(d.length <= a) return d;
  const rest = d.slice(a);
  if(a === 4) return d.slice(0,4) + "-" + rest;
  /* 가운데 자리: 휴대폰은 4, 그 외는 전체 길이가 (a+8) 이면 4, 아니면 3 */
  const mobile = d.indexOf("01") === 0;
  const mid = mobile ? 4 : (d.length >= a+8 ? 4 : 3);
  if(rest.length <= mid) return d.slice(0,a) + "-" + rest;
  return d.slice(0,a) + "-" + rest.slice(0,mid) + "-" + rest.slice(mid);
}

/* 코스 선택 팝업은 마법사(WZ)와 예약 수정 시트(tmpRes) 두 곳에서 씁니다.
   어느 쪽 값을 고치는지 여기서 한 번만 정해 둡니다 — 함수를 두 벌 만들지 않으려고. */
function cTgt(){ return WZ ? WZ : tmpRes; }
/* 시트에서 쓸 때는 화면을 다시 그리기 전에 입력창 값을 옮겨 담아야 타이핑이 날아가지 않습니다 */
function cSync(){ if(!WZ && tmpRes) syncRes(); }
function courseCount(){
  const t = cTgt();
  return t ? Object.values(t.courses||{}).reduce((a,b)=>a+b,0) : 0;

    .map(([k,v])=>`${k.split("|")[1]}${v>1?`×${v}`:""}`);
  return items.join(", ");
}

        <button class="btn sm" style="margin-left:auto" onclick="openCourse()" ${WZ.menuType==="코스"?'':'tabindex="-1"'}>${n||WZ.courseUndecided?"수정":"선택"}</button>

/* 코스 팝업의 '완료' — 마법사에서는 코스 인원이 맞으면 바로 예약자 단계로 */
function doneCourse(){
  cSync(); const t=cTgt(); if(t) t.courseOpen = false;
  if(WZ) wzAutoNext(); else render();
}
function openCourse(){ cSync(); const t=cTgt(); if(t) t.courseOpen = true; render(); }
function closeCourse(){ cSync(); const t=cTgt(); if(t) t.courseOpen = false; render(); }
/* 한 테이블은 코스를 통일하는 것이 규칙이라, 처음 누르면 '아직 코스가 없는 성인 수'만큼 한 번에 채웁니다.
   (4명 테이블이면 탭 한 번에 4). 그 뒤로는 누를 때마다 1씩, 줄일 때는 모서리 − 로 */
function bumpCourse(key){
  cSync(); const t=cTgt(); if(!t) return;
  const cur = (t.courses||{})[key]||0;
  let add = 1;
  if(!cur){
    const adults = adultCount(t.people||0, t.infants||0);
    add = Math.max(1, adults - courseCount());
  }
  t.courses = {...t.courses, [key]:cur+add};
  t.courseUndecided = false;
  render();
}
function dropCourse(key){
  cSync(); const t=cTgt(); if(!t) return;
  const cur = (t.courses||{})[key]||0;
  const next = {...t.courses}; if(cur<=1) delete next[key]; else next[key] = cur-1;
  t.courses = next; render();
}
function resetCourse(){ cSync(); const t=cTgt(); if(!t) return; t.courses = {}; t.courseUndecided = false; render(); }
function toggleUndecided(){
  cSync(); const t=cTgt(); if(!t) return;
  t.courseUndecided = !t.courseUndecided;
  if(t.courseUndecided) t.courses = {};
  render();
}
/* 이 예약의 날짜·시각에 그 코스 그룹을 파는지 */
function courseGroupFits(g){
  const stx = store().settings, W = cTgt();
  /* 점심/저녁은 그 날 세션으로 판단 — 주말은 15:30 까지가 점심입니다(8차 세션) */
  const sess = W.date && W.time ? sessionAt(W.date, W.time) : null;
  const lunch = sess ? /점심/.test(sess.name||"") : (W.time && toMin(W.time) < toMin(stx.lunchUntil||"16:00"));
  const dow = W.date ? new Date(W.date+"T00:00:00").getDay() : 0;
  /* 공휴일을 주말로 볼지는 설정에서 정합니다 */
  const weekend = dow===0 || dow===6 || (stx.holidayAsWeekend!==false && isHoliday(W.date));
  const w = g.when||[];
  if(!w.length || w.includes("종일")) return true;
  const key = (weekend?"주말":"평일") + (lunch?"점심":"저녁");
  return w.includes(key);
}
/* 코스 구성에서 걸리는 것 — 코스 팝업 안과 '다음' 버튼 위 경고 자리 두 곳에 같이 씁니다.
   1) 그 시간대에 팔지 않는 코스가 들어감 (예: 저녁에 평일 점심 코스)
   2) 코스가 두 종류 이상 섞임 — 한 테이블은 코스를 통일하는 것이 가게 규칙입니다
   둘 다 막지 않습니다. 사장님이 예외를 둘 수 있으므로 빨갛게 알리기만 합니다 */
function courseWarns(){
  const W = cTgt(); if(!W || W.menuType!=="코스" || W.courseUndecided) return [];
  const gs = courseGroups(), out = [];
  const picked = Object.entries(W.courses||{}).filter(([k,v])=>v>0);
  const offNames = picked.filter(([k])=>{ const g = courseGroupById(gs, k.split("|")[0]); return g && !courseGroupFits(g); })
    .map(([k])=>k.split("|")[1]);
  if(offNames.length) out.push(`이 시간엔 없는 코스 - ${offNames.join(", ")}`);
  if(picked.length >= 2) out.push(`코스 ${picked.length}종류 - 한 테이블은 하나로`);
  return out;
}
function renderCourse(){
  const gs = courseGroups();
  const W = cTgt();
  const fits = courseGroupFits;
  const rows = gs.map((g,gi)=>`
    <div class="cgroup ${fits(g)?'':'off'}">
      <div class="cg-label">${esc(g.label)}${fits(g)?'':''}</div>
      <div class="cg-items">
        ${g.items.map(name=>{
          const key = `${g.id}|${name}`;
          const c = (W.courses||{})[key]||0;
          const off = !fits(g);
          return `<span class="citem-w"><button class="citem ${c?'on':''} ${off&&c?'warned':''}" onclick="bumpCourse('${jsq(key)}')">
            ${esc(name)}${c?`<i class="cnum">${c}</i>`:""}</button>${c?`<button class="cminus" onclick="dropCourse('${jsq(key)}')" aria-label="하나 줄이기">−</button>`:""}</span>`;
        }).join("")}
      </div>
    </div>`).join("");
  return `
    <div class="overlay" onclick="closeCourse()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-h"><h2>코스 선택</h2>
          <button class="x" onclick="closeCourse()" aria-label="닫기">×</button></div>
                ${rows}
        <button class="undecided ${W.courseUndecided?'on':''}" onclick="toggleUndecided()">
          코스 미정
        </button>
        ${(()=>{
          const n = courseCount(), ad = adultCount(W.people, W.infants);
          const short = n>0 && n<ad, over = n>ad;
          return `<div class="course-total ${short||over||courseWarns().length?'bad':''}">선택 합계 <b>${n}</b>명
            ${W.people?` / 성인 ${ad}명${W.infants?` (유아 ${W.infants}명)`:""}`:""}
            ${short?`<div class="ct-warn">코스 부족 - 성인보다 ${ad-n}명 적음</div>`:""}
            ${over?`<div class="ct-warn">코스 초과 - 성인보다 ${n-ad}명 많음</div>`:""}
            ${courseWarns().map(w=>`<div class="ct-warn">${esc(w)}</div>`).join("")}</div>`;
        })()}
        <div class="sheet-actions">

/* ---------- 새 예약 등록 — 마법사(wzSubmit)와 빠른 입력(saveRes)이 같은 길을 갑니다 ----------
   같은 번호 확인 → 노쇼 이력 확인(confirmNewRes) → 등록 기록·문자 흉내·목록에 넣기·로그·잠정 배정(createReservation).
   둘이 따로 있으면 데이터 모양(changes·updatedAt·source…)이 조금씩 달라집니다 */
async function confirmNewRes(date, phone){
  const s = store();
  /* 같은 번호로 같은 날 이미 예약이 있으면 확인 */
  if(phone){
    const dup = s.reservations.filter(r=>r.date===date && r.status==="확정" &&
      (r.phone||"").replace(/\D/g,"") === phone.replace(/\D/g,""));
    if(dup.length){
      const ok = await uiConfirm("같은 번호로 이미 예약이 있습니다",
        dup.map(r=>`${hm(r.time)} ${r.name} 손님 ${pplText(r)}`).join("\n") +
        "\n\n같은 팀이라면 기존 예약을 수정하는 편이 좋습니다.",
        {ok:"새로 등록", cancel:"취소"});
      if(!ok) return false;
    }
  }
  /* 노쇼 이력이 있으면 확정 전에 확인 */
  const ns = noshowOf(phone);
  if(ns && !await uiConfirm2(
      `이 번호로 노쇼 기록이 ${ns.count}건 있습니다.\n` +
      `(${ns.dates.slice(0,3).map(d=>d.slice(5).replace("-","월 ")+"일").join(", ")}${ns.dates.length>3?" 외":""})\n\n` +
      `예약을 확정할까요?`)) return false;
  return true;
}
function createReservation(rec){
  const s = store();
  addChange(rec, "등록", []);
  /* 접수 문자 — 등록 즉시 1회 (지금은 흉내) */
  if(smsCfg().on && rec.phone) smsSend(rec, "접수");
  s.reservations.push(rec);
  logEvent("예약 등록", `${rec.date} ${rec.time} ${rec.name} ${pplOf(rec)}명 ${rec.roomId?seatLabel(rec.roomId):(rec.tentativeRoomId?"잠정 "+seatLabel(rec.tentativeRoomId):"미배정")} 경로:${rec.source}${rec.sourceDetail?"/"+rec.sourceDetail:""}`);
  reflowTentatives(rec.date);
  return rec;
}

    createdAt:new Date().toISOString(),

/* ============================================================
   디스플레이 모드 — TV에 띄우는 오늘의 예약 안내
   (F11 전체화면으로 사용. 손님이 직접 조작하지 않음)
   ============================================================ */
let dispTimer = null;
let bgTimer = null;
/* ============================================================
   주소로 화면 구분
     /            → 관리 화면 (PIN 필요)
     /screen      → 디스플레이 모드 (TV용, 바로 진입)
     /screen/hanok → 매장을 지정해서 진입
   서버 설정 없이도 되도록 #/screen 도 함께 지원합니다.
   ============================================================ */
function readRoute(){
  /* v4 부터 손님용 화면은 screen/ 폴더의 index.html 입니다.
     .../screen  .../screen/  .../screen/index.html  .../screen/hanok  전부 같은 뜻으로 봅니다 */
  const path = (location.pathname || "").replace(/\/index\.html?$/i,"").replace(/\/+$/,"");
  const hash = (location.hash || "").replace(/^#/,"").replace(/\/+$/,"");
  const raw = /screen/.test(hash) ? hash : path;
  const m = raw.match(/\/?screen(?:\/([a-z]+))?$/i);
  if(!m) return null;
  return {screen:true, store:(m[1]||"hanok").toLowerCase()};
}
function applyRoute(){
  const r = readRoute();
  if(r && DATA && DATA[r.store]){
    view.storeKey = r.store;
    view.display = true;
    view.fromRoute = true;      /* 주소로 바로 들어온 경우 */
    startDisplayTimers();
    return true;
  }
  return false;
}
/* ---------- 관리 화면 주소 (6차-K) ----------
   #/hanok  #/hanok/settings  #/hanok/2026-09-20  — 새로고침해도 보던 자리로 돌아옵니다.
   폴더로 나누지 않고 해시로만 나눕니다: 파일 하나 원칙이 지켜지고, 화면 사이 이동이 페이지 이동이 되지 않으며,
   로그인 상태를 페이지 사이에 넘길 필요가 없습니다.
   방향은 '상태 → 주소' 한쪽뿐입니다(syncHash, 그릴 때마다). 주소를 사람이 고치거나 새로 열 때만 '주소 → 상태'(applyAdminRoute).
   history 항목은 늘리지 않습니다(replaceState) — 뒤로가기는 마법사 보호(popstate)만 씁니다 */
function adminHash(){
  if(!view.storeKey || view.display) return "";
  var h = "/" + view.storeKey;
  if(view.tab === "settings") h += "/settings";
  else if(view.date && view.date !== todayStr()) h += "/" + view.date;   /* 오늘이면 날짜를 안 적어 내일 열어도 '오늘' */
  return h;
}
function syncHash(){
  var want = adminHash();
  var cur = (location.hash || "").replace(/^#/, "");
  if(want === cur) return;
  try{
    if(location.protocol === "file:"){ location.hash = want; return; }   /* file: 에서는 replaceState 가 막힐 수 있음 */
    /* history.state 를 그대로 넘겨야 마법사 보호용 {wz:1} 이 지워지지 않습니다 */
    history.replaceState(history.state, "", location.pathname + location.search + (want ? "#" + want : ""));
  }catch(e){}
}
function applyAdminRoute(){
  var hash = (location.hash || "").replace(/^#/, "").replace(/\/+$/, "");
  var m = hash.match(/^\/([a-z]+)(?:\/(settings|\d{4}-\d{2}-\d{2}))?$/i);
  if(!m || !DATA || !DATA[m[1].toLowerCase()] || !DATA[m[1].toLowerCase()].enabled) return false;
  var key = m[1].toLowerCase(), sub = m[2] || "";
  var tab = sub === "settings" ? "settings" : "dash";
  var date = /^\d{4}-\d{2}-\d{2}$/.test(sub) ? sub : todayStr();
  if(view.storeKey === key && view.tab === tab && view.date === date && !view.display) return false;   /* 이미 그 자리 — hashchange 되풀이 방지 */
  view.storeKey = key; view.tab = tab; view.date = date; view.calMonth = date.slice(0,7);
  view.display = false; view.form = null; tmpRes = null;
  if(tab === "settings") view.draft = deepClone(DATA[key].settings);   /* 설정은 임시본 위에서 편집합니다(setTab 과 같게) */
  return true;
}
/* 주소를 바꿔 둡니다 (파일로 열었을 때는 조용히 실패해도 괜찮습니다) */
function setRoute(toScreen){
  try{
    if(location.protocol === "file:"){
      location.hash = toScreen ? `/screen/${view.storeKey}` : "";
      return;
    }
    /* 관리 화면에서 디스플레이를 열 때는 주소만 바꿔 둡니다 (뒤로 가기·새로고침 대비).
       screen/ 은 실제 폴더라 그 안의 /hanok 은 서버에 없으므로 폴더 주소로만 갑니다 */
    const base = appDir();
    history.replaceState(null, "", toScreen ? `${base}/screen/` : (base || "/"));
  }catch(e){ /* 주소를 바꿀 수 없으면 그냥 둡니다 */ }
}
/* 배경 순환·자동 갱신 타이머 */
function startDisplayTimers(){
  view.bgIndex = view.bgIndex || 1;
  clearInterval(bgTimer); clearInterval(dispTimer);
  bgTimer = setInterval(()=>{
    if(!view.display) return;
    view.bgIndex = (view.bgIndex % 7) + 1;
    document.querySelectorAll(".tv-bg").forEach((el,i)=> el.classList.toggle("on", i+1===view.bgIndex));
  }, 12000);
  dispTimer = setInterval(displayTick, 60000);
  startDailyReload();
}
/* 1분마다: 데이터를 다시 읽고 목록만 갈아 끼웁니다.
   render() 로 통째로 그리면 <video> 가 새로 만들어져 광고가 매분 처음부터 다시 시작합니다. */
var DISP_FAIL = 0;
async function displayTick(){
  if(!view.display) return;
  try{ await refreshData(); DISP_FAIL = 0; }
  catch(e){ DISP_FAIL++; console.warn("디스플레이 갱신 실패", DISP_FAIL, e); }   /* 마지막 데이터로 계속 보여 줍니다 */
  updateDisplayInPlace();
}
var TV_IDLE_SHOWN = null;
function updateDisplayInPlace(){
  if(!view.display) return;
  /* 광고만 ↔ 목록 이 바뀌는 순간에만 통째로 다시 그립니다 (영상이 처음부터 다시 시작되는 건 이때뿐) */
  var idle = tvIdle();
  if(idle !== TV_IDLE_SHOWN){ render(); return; }
  if(idle) return;
  var side = document.querySelector(".tvl-side");
  if(tvType() !== "grid" && side){
    side.innerHTML = tvSideHtml();
    fitTvList();
  } else {
    render();   /* 좌석표형은 영상이 없어 통째로 그려도 됩니다 */
    document.querySelectorAll(".tv-bg").forEach((el,i)=> el.classList.toggle("on", i+1===(view.bgIndex||1)));
  }
}
/* 하루 한 번(새벽 4시) 페이지를 새로 불러옵니다.
   TV 브라우저를 몇 주씩 켜 두면 메모리가 새서 느려지거나 멈춥니다. 영업 전 시간에 한 번 털어 줍니다.
   주소로 바로 들어온(방치용) 화면에서만 합니다 — 관리 화면에서 잠깐 연 디스플레이는 건드리지 않습니다. */
var dailyTimer = null;
function startDailyReload(){
  clearInterval(dailyTimer);
  if(!view.fromRoute) return;
  var lastDay = new Date().getDate();
  dailyTimer = setInterval(function(){
    var d = new Date();
    if(d.getHours() === 4 && d.getDate() !== lastDay){ lastDay = d.getDate(); location.reload(); }
  }, 60000);
}
function openDisplay(){
  logEvent("디스플레이 모드", "");
  view.display = true;
  view.fromRoute = false;
  setRoute(true);
  render();
  startDisplayTimers();
  setTimeout(()=>{ pokeExit(4000); }, 120);
  document.addEventListener("keydown", escDisplay);
}
function closeDisplay(){
  const wasRoute = view.fromRoute;
  view.display = false; view.fromRoute = false;
  setRoute(false);
  /* 주소로 바로 들어온 경우에는 관리 화면 대신 잠금 화면으로 */
  if(wasRoute && !AUTHED){ view.storeKey = null; }
  clearInterval(dispTimer); clearInterval(bgTimer);
  document.removeEventListener("keydown", escDisplay);
  render();
}
function escDisplay(e){ if(e.key==="Escape") closeDisplay(); }
/* 종료 버튼을 잠깐 보여줍니다 (터치 기기에는 호버가 없으므로) */
let exitTimer = null;
function pokeExit(ms){
  /* 종료와 전환을 같이 띄웁니다 — TV 에는 마우스가 없어 화면을 눌러야 나옵니다 */
  const els = document.querySelectorAll(".tv-exit, .tv-swap");
  if(!els.length) return;
  for(var i=0;i<els.length;i++) els[i].classList.add("show");
  clearTimeout(exitTimer);
  exitTimer = setTimeout(function(){
    var e2 = document.querySelectorAll(".tv-exit, .tv-swap");
    for(var j=0;j<e2.length;j++) e2[j].classList.remove("show");
  }, ms||5000);
}

/* 이름 가운데 글자를 * 로 가림 — 손님 이름이 TV에 그대로 노출되지 않도록 */
/* 디스플레이 모드에 쓸 좌석 배치 — 3행, 각 행 최대 6칸 */
const DISP_MAX = 6;
function displayRows(){
  const st = store().settings;
  /* 테이블은 개별이 아니라 층별 한 칸("tables:1층")으로 — TV 는 룸 8칸 + 테이블 층 2칸이면 충분 */
  const ids = st.rooms.filter(isRoom).map(r=>r.id).concat(tableFloors().map(f=>"tables:"+f));
  const saved = st.displayRows;
  if(saved && saved.length===3){
    /* 없어진 좌석은 빼고, 새로 생긴 좌석은 빈 칸이 있는 행에 넣습니다 */
    const rows = saved.map(row=>row.filter(id=>ids.includes(id)));
    const placed = new Set([].concat.apply([], rows));
    ids.filter(id=>!placed.has(id)).forEach(id=>{
      const row = rows.find(r=>r.length<DISP_MAX) || rows[2];
      row.push(id);
    });
    return rows;
  }
  /* 기본: 1행 테이블(층별), 2·3행 룸을 반씩 */
  const halls = tableFloors().map(f=>"tables:"+f);
  const rooms = st.rooms.filter(isRoom).map(r=>r.id);
  const half = Math.ceil(rooms.length/2);
  return [halls, rooms.slice(0,half), rooms.slice(half)];
}
function tableFloors(){
  const out = []; (store().settings.rooms||[]).filter(isTable).forEach(t=>{ if(out.indexOf(t.floor||"")<0) out.push(t.floor||""); }); return out;
}
/* 디스플레이 칸 하나의 정보 — 룸이면 그 룸, "tables:층" 이면 그 층 테이블 묶음 */
function dispCell(id){
  if(/^tables:/.test(id)){ const fl = id.slice(7); return {id, name:`${fl||""} 테이블`.trim(), floor:"", floorKey:fl, type:"tables", ids:store().settings.rooms.filter(t=>isTable(t) && (t.floor||"")===fl).map(t=>t.id)}; }
  const r = seatById(id); return r ? Object.assign({ids:[r.id]}, r) : null;
}
/* ---------- 디스플레이 모드 글자 크기 자동 맞춤 ----------
   TV는 3~5m 떨어져서 봅니다. 예약이 적은 날에도 글자가 작으면 그냥 안 보입니다.
   그래서 "잘리지 않는 한 가장 크게" 를 화면 전체에 한 값으로 적용합니다.
   칸마다 크기를 따로 정하면 옆 칸과 어긋나 지저분해 보이므로 한 값만 씁니다.
   구형 TV 브라우저를 고려해 CSS max()·clamp() 대신 변수 하나만 바꿉니다. */
/* vh 단위, 큰 것부터. 첫 값이 상한, 마지막이 하한입니다.
   **글자가 크거나 작다는 말이 나오면 첫 값만 바꾸면 됩니다.**
   하한보다 더 줄이면 TV에서 못 읽으므로, 그래도 안 들어가면 목록을 접습니다. */
var TV_SIZES = [2.2, 2.1, 2.0];
/* 목록형 — 날개에 들어가는 줄 수는 TV 높이에 따라 달라집니다.
   넘치는 줄은 숨기고 '외 N건' 으로 알립니다.
   글자를 줄이지 않는 이유: 입구 TV 는 멀리서 봅니다. 작아지면 있으나 마나입니다. */
function fitTvList(){
  var box = document.querySelector(".tvl-rows");
  var more = document.querySelector(".tvl-more");
  if(!box || !more) return;
  var items = box.querySelectorAll(".tvl-r");
  /* 접을 때 세는 단위는 '묶음' 이 아니라 '예약 건수' 입니다 */
  var cnt = function(el){ return el.querySelectorAll(".tvl-g").length || 1; };
  var i;
  for(i=0;i<items.length;i++) items[i].style.display = "";
  more.textContent = "";
  if(!items.length) return;
  /* 뒤에서부터 하나씩 숨기며 넘치지 않을 때까지 */
  var hiddenGroups = 0, hiddenRes = 0;
  while(box.scrollHeight > box.clientHeight + 1 && hiddenGroups < items.length){
    hiddenGroups++;
    var el = items[items.length - hiddenGroups];
    el.style.display = "none";
    hiddenRes += cnt(el);
  }
  if(hiddenRes) more.textContent = "외 " + hiddenRes + "건";
}
function fitDisplay(){
  fitTvList();
  var grid = document.querySelector(".tv-grid");
  if(!grid || !grid.querySelectorAll(".dsec").length) return;
  /* 글자 크기는 고정입니다. 칸 크기도 CSS 에서 고정입니다.
     넘치는 만큼만 목록을 접습니다 — 칸마다 몇 줄까지 보일지를 줄여 나갑니다. */
  setGridSize(grid, TV_SIZES[0]);
  var cap = 12;
  capLists(grid, cap);
  while(cap > 1 && overflowing(grid)){
    cap--;
    capLists(grid, cap);
  }
}
/* 칸 안의 목록이 칸 높이를 넘는지 */
function overflowing(grid){
  var uls = grid.querySelectorAll(".dsec ul"), i;
  for(i=0;i<uls.length;i++) if(uls[i].scrollHeight > uls[i].clientHeight + 1) return true;
  return false;
}
/* 크기 단위는 vh 가 아니라 --tvu 입니다. 세로 휴대폰 미리보기처럼
   판 전체를 축소하는 화면에서는 --tvu 가 px 로 바뀌기 때문입니다. */
function setGridSize(grid, s){
  grid.style.setProperty("--tv-li", "calc(var(--tvu, 1vh) * " + s + ")");
  grid.style.setProperty("--tv-h3", "calc(var(--tvu, 1vh) * " + (s * 0.95).toFixed(3) + ")");
}
/* 칸마다 최대 cap 줄까지만 남기고 접습니다.
   지난 예약부터 접는 이유: 손님이 이 화면에서 알고 싶은 건 '앞으로 언제 자리가 차는지'라
   이미 지나간 시각은 자리를 차지할 값어치가 가장 낮습니다. */
function capLists(grid, cap){
  var uls = grid.querySelectorAll(".dsec ul");
  for(var u=0; u<uls.length; u++){
    var ul = uls[u];
    var items = [], k;
    var all = ul.querySelectorAll("li");
    for(k=0; k<all.length; k++) if(all[k].className.indexOf("more") < 0) items.push(all[k]);
    var keep = ul.className.indexOf("two-col") >= 0 ? cap * 2 : cap;   /* 홀은 2열 */
    for(k=0; k<items.length; k++) items[k].style.display = "";
    var hide = items.length - keep;
    if(hide <= 0){ setMore(ul, 0); reflowTwoCol(ul); continue; }
    var done = 0;
    for(k=0; k<items.length && done<hide; k++)                 /* 먼저 지난 예약 */
      if(items[k].className.indexOf("past") >= 0){ items[k].style.display = "none"; done++; }
    for(k=items.length-1; k>=0 && done<hide; k--)              /* 그래도 넘치면 늦은 시각부터 */
      if(items[k].style.display !== "none"){ items[k].style.display = "none"; done++; }
    setMore(ul, done);
    reflowTwoCol(ul);
  }
}
function setMore(ul, n){
  var more = ul.querySelector("li.more");
  if(!n){ if(more) more.parentNode.removeChild(more); return; }
  if(!more){ more = document.createElement("li"); more.className = "more"; ul.appendChild(more); }
  more.textContent = "외 " + n + "건";
}
/* 홀은 2열 그리드라 줄 수를 남은 항목 수에 맞춰 다시 잡아야 높이가 실제로 줄어듭니다.
   (줄 수를 그대로 두면 뒤에서 지워도 열만 비고 높이는 그대로입니다) */
function reflowTwoCol(ul){
  if(ul.className.indexOf("two-col") < 0) return;
  var items = ul.children, vis = 0;
  for(var i=0; i<items.length; i++) if(items[i].style.display !== "none") vis++;
  ul.style.gridTemplateRows = "repeat(" + Math.max(1, Math.ceil(vis/2)) + ",auto)";
}

/* 가운데 글자를 가립니다. 이재아 → 이 * 아
   ○ 를 붙여 쓰면(이○아) TV에서 글자가 뭉쳐 보여 별표와 띄어쓰기로 바꿨습니다.
   글자 수는 그대로 지킵니다 — 네 글자면 '남 * * 수'. */
function maskName(n){
  const s = String(n||"").trim();
  if(s.indexOf("*") >= 0) return s;   /* 서버(mask_name)가 이미 가린 이름 */
  if(s.length<=1) return s;
  if(s.length===2) return s[0] + " *";
  var mid = "*";
  for(var i=1; i<s.length-2; i++) mid += " *";
  return s[0] + " " + mid + " " + s[s.length-1];
}

/* 손님용 화면은 두 가지입니다.
     list — 왼쪽 영상 + 오른쪽 시각순 예약 (기본). 입구 TV 기준
     grid — 좌석별 격자 (예전 방식, 보조)
   입구에서 손님은 지나가면서 3~5초 봅니다. 좌석별 격자는 '직원의 사고방식'이라
   손님은 자기 예약을 찾기 어렵습니다. 그래서 시각순을 기본으로 두었습니다. */
/* 목록형/좌석표 — 매장 설정(settings.tvType). TV 가 로그인 없이 공개 뷰로 읽는 값이라 기기 설정(_ui)이면 안 됩니다 (7차) */
function tvType(){
  if(view.tvTypeLocal) return view.tvTypeLocal;   /* TV 에서 리모컨으로 바꾼 것 — 저장은 못 하니 이 화면에서만 */
  var st = view.storeKey && DATA && DATA[view.storeKey] ? DATA[view.storeKey].settings : null;
  var t = st && st.tvType ? st.tvType : (DATA && DATA._ui ? DATA._ui.tvType : null);
  return t === "grid" ? "grid" : "list";
}
function setTvType(t){
  if(readonlyBlock()) return;
  t = (t === "grid" ? "grid" : "list");
  /* 설정 화면(임시본) 안의 버튼이라 임시본과 실제 설정에 같이 씁니다 — 아니면 '적용하기' 가 옛값으로 되돌립니다 */
  if(view.draft) view.draft.tvType = t;
  store().settings.tvType = t;
  saveData(); render();
}
/* TV 에는 마우스가 없을 수 있습니다. 전환 버튼은 보조이고,
   평소 쓸 방식은 설정에서 정해 둡니다. 고른 값은 새로고침해도 남습니다. */
function swapTvType(){
  var next = tvType() === "grid" ? "list" : "grid";
  if(DATA && DATA._readonly){ view.tvTypeLocal = next; render(); }   /* 공개 TV 는 저장이 안 되므로 막지 않고 화면만 바꿉니다(점검 T3) */
  else setTvType(next);
  setTimeout(function(){ pokeExit(4000); }, 60);
}

/* 광고 영상이 뜨기 전 빙글이 — 파일이 커서(29MB) 첫 프레임까지 몇 초 걸립니다. 재생이 시작되면(playing) 지웁니다.
   오류로 영상이 빠지면 사진이 드러나므로 그때도 지우고, 혹시 이벤트가 안 오면 15초 뒤에 지웁니다 */
function tvVideoReady(v){
  var box = v && v.parentNode, sp = box && box.querySelector(".tv-loading");
  if(sp && sp.parentNode) sp.parentNode.removeChild(sp);
}
setInterval(function(){
  document.querySelectorAll(".tv-loading").forEach(function(sp){
    var t = Number(sp.getAttribute("data-t") || 0) + 1; sp.setAttribute("data-t", t);
    if(t >= 15 && sp.parentNode) sp.parentNode.removeChild(sp);
  });
}, 1000);
/* 오늘 남은 예약이 없고 설정(tvIdleFull, 기본 켬)이 켜져 있으면 목록/좌석표 대신 광고만 전체 화면 */
function tvIdle(){
  var s = store() || DATA.hanok; if(!s) return false;
  if(s.settings.tvIdleFull === false) return false;
  var today = todayStr(), now = toMin(nowHM());
  return !s.reservations.some(function(r){ return r.date === today && (r.status === "확정" || r.status === "방문") && toMin(r.time) + 30 >= now; });
}
function renderTvIdle(){
  var st = (store() || DATA.hanok).settings, ad = (st.tvAd || "").trim();
  return `
    <div class="tvl tvl-idle">
      <div class="tvl-ad">
        <div class="tvl-bgs" aria-hidden="true">
          ${[1,2,3,4,5,6,7].map(i => `<div class="tv-bg b${i} ${i===(view.bgIndex||1)?'on':''}"></div>`).join("")}
        </div>
        ${ad ? `<video src="${esc(adUrl(ad))}" autoplay muted loop playsinline
                  onplaying="tvVideoReady(this)" onerror="tvVideoReady(this); this.parentNode.removeChild(this)"></video>
        <div class="tv-loading" aria-hidden="true"><i></i></div>` : ""}
      </div>
    </div>`;
}
function renderDisplay(){
  var idle = tvIdle(); TV_IDLE_SHOWN = idle;   /* 지금 그린 상태를 기억 — 1분 갱신이 이것과 비교해 바뀔 때만 통째로 다시 그립니다 */
  var inner = idle ? renderTvIdle() : (tvType() === "grid" ? renderTvGrid() : renderTvList());
  return `
  <div class="tv tv-mode-${idle ? "list" : tvType()} ${idle ? "tv-idle" : ""}">
    <div class="tv-stage">${inner}</div>
    <div class="tv-hot" aria-hidden="true"></div>
    <div class="tv-tap" aria-hidden="true" onclick="pokeExit(5000)" ontouchstart="pokeExit(5000)"></div>
    <button class="tv-swap" onclick="swapTvType()">${tvType()==="grid" ? "목록으로" : "좌석표로"}</button>
    <button class="tv-exit" onclick="closeDisplay()" title="Esc 로도 나갈 수 있습니다">디스플레이 종료</button>
    <div class="tv-small">
      <div class="ts-box">
        ${ICON.tv}
        <div class="ts-t">지원하지 않는 화면 크기입니다</div>
        <div class="ts-s">디스플레이 모드는 TV·모니터처럼<br>넓은 화면에서만 표시됩니다.</div>
        <button class="btn primary" onclick="closeDisplay()">돌아가기</button>
      </div>
    </div>
  </div>`;
}

/* ---------- 목록형 (기본) ----------
   왼쪽: 광고 영상. 아직 영상이 없으면 매장 사진을 천천히 넘깁니다.
   오른쪽: 오늘 예약을 시각 순으로. 좌석 이름을 줄마다 같이 답니다. */
function renderTvList(){
  const s = store() || DATA.hanok;
  const st = s.settings;
  /* 광고 영상 경로는 설정에서 넣습니다 (같은 폴더의 ad.mp4 등).
     base64 로 넣으면 안 됩니다 — 수십 MB가 되어 구형 TV 브라우저가 죽습니다. */
  const ad = (st.tvAd || "").trim();

  return `
    <div class="tvl">
      <div class="tvl-ad">
        <!-- 사진은 항상 깔아 둡니다. 영상이 있으면 그 위를 덮고,
             영상 파일이 없거나 형식이 안 맞으면(onerror) 영상만 치워 사진이 드러납니다.
             → ad.mp4 를 아직 안 올렸어도 화면이 검게 비지 않습니다. -->
        <div class="tvl-bgs" aria-hidden="true">
          ${[1,2,3,4,5,6,7].map(i => `<div class="tv-bg b${i} ${i===(view.bgIndex||1)?'on':''}"></div>`).join("")}
        </div>
        <div class="tvl-veil"></div>
        ${ad ? `<video src="${esc(adUrl(ad))}" autoplay muted loop playsinline
                  onplaying="tvVideoReady(this)" onerror="tvVideoReady(this); this.parentNode.removeChild(this)"></video>
        <div class="tv-loading" aria-hidden="true"><i></i></div>` : ""}
      </div>
      <aside class="tvl-side">${tvSideHtml()}</aside>
    </div>`;
}
/* 오른쪽 날개 속. 1분마다 이것만 갈아 끼웁니다 (영상은 그대로) */
function tvSideHtml(){
  const s = store() || DATA.hanok;
  const today = todayStr(), now = toMin(nowHM());
  /* 30분 넘게 지난 예약은 뺍니다 — 손님은 지나간 시각에 관심이 없습니다.
     저녁이 될수록 목록이 짧아져 여유가 생깁니다. */
  const live = s.reservations
    .filter(r => r.date === today && (r.status === "확정" || r.status === "방문") && toMin(r.time) + 30 >= now)
    .sort((a, b) => a.time.localeCompare(b.time));
  /* 같은 시각을 여러 번 쓰지 않고 묶습니다.
     한 줄에 한 건씩 시각을 반복하면 17:30 이 네 번 나와 자리만 먹고, 정작 손님이 찾는 이름은 적게 들어갑니다.
     시각으로 먼저 찾고 그 밑에서 이름을 찾는 것이 읽는 순서와도 맞습니다. */
  const groups = [];
  live.forEach(function(r){
    const g = groups.length ? groups[groups.length - 1] : null;
    if(g && g.time === r.time) g.items.push(r);
    else groups.push({ time:r.time, items:[r] });
  });
  const rows = groups.map(function(g){
    const items = g.items.map(function(r){
      const seat = r.roomId ? resSeatLabel(r) : "";
      return `<div class="tvl-g">
        <span class="tvl-n">${esc(maskName(r.name))} 님</span>
        <span class="tvl-s">${seat ? `<span class="tvl-seat">${esc(seat)}</span>` : ""}<span class="tvl-cnt">${pplOf(r)}<small>명</small></span></span>
      </div>`;
    }).join("");
    return `<li class="tvl-r"><div class="tvl-t">${esc(g.time)}</div>${items}</li>`;
  }).join("");
  const d = new Date();
  const dateTxt = `${d.getMonth() + 1}월 ${d.getDate()}일 ${["일","월","화","수","목","금","토"][d.getDay()]}요일`;
  return `
        <div class="tvl-head">
          <div class="tvl-date">${dateTxt}</div>
          <h1>오늘의 예약</h1>
        </div>
        <ul class="tvl-rows">${rows}</ul>
        <div class="tvl-more"></div>
        <div class="tvl-foot">찾아주셔서 감사합니다${DISP_FAIL >= 3 ? '<span class="tvl-off">연결 확인 중</span>' : ""}</div>`;
}

/* ---------- 좌석표형 (보조) ---------- */
function renderTvGrid(){
  const s = store() || DATA.hanok;
  const st = s.settings, today = todayStr();
  const now = nowHM();
  /* 좌석이 배정된 예약만 표시 — 당일에는 미배정이 없도록 운영한다는 전제 */
  /* 룸은 배정된 것만, 테이블은 층 희망(seatPref)까지 — 당일에는 룸 미배정이 없도록 운영한다는 전제 */
  const list = s.reservations.filter(r=>r.date===today && (r.status==="확정"||r.status==="방문") && (r.roomId || isTablePref(r.seatPref)));

  /* 설정에 정한 3행 배치대로 그립니다 */
  const rowIds = displayRows();
  const order = [].concat.apply([], rowIds).map(dispCell).filter(Boolean);
  const secN = [];   /* 칸마다 '한 열에 몇 줄이 들어가는지' — 행 높이를 나눌 때 씁니다 */
  const sec = order.map(room=>{
    const isT = room.type === "tables";
    /* 대표 좌석이 이 칸에 속하는 예약 (합친 예약은 한 번만) */
    const rows = list.filter(r=>isT ? (resFloor(r) !== undefined && (resFloor(r)||"") === (room.floorKey||"")) : room.ids.indexOf(r.roomId)>=0).sort((a,b)=>a.time.localeCompare(b.time));
    const items = rows.length ? rows.map(r=>{
      /* 흐림 기준은 타임라인 블록과 같은 함수(isBlockPast). 자리를 접어야 할 때 이런 건이 먼저 밀립니다 */
      const past = isBlockPast(r, toMin(r.time), today, toMin(now));
      const tn = "";   /* 손님에게 테이블 번호는 알리지 않습니다 — 층까지만(8차-H) */
      return `<li class="${past?'past':''}">
        <span class="t">${esc(r.time)}</span>
        <span class="n">${esc(maskName(r.name))} 님${tn?` <small class="tn">${esc(tn)}</small>`:""}</span>
        <span class="p">${pplOf(r)}명</span>
      </li>`;
    }).join("") : ``;
    /* 손님이 보는 화면이라 룸 정원만 안내하고 테이블 수는 적지 않습니다 */
    const capTxt = isT ? "" : `${roomMin(room)}~${room.capacity}인`;
    /* 테이블 칸은 2열이라 필요한 줄 수가 절반입니다 (아래에서 grid-template-rows 를 그 수로 맞춥니다) */
    secN.push(isT ? Math.max(1, Math.ceil(rows.length/2)) : rows.length);
    return `<section class="dsec ${isT?'hall':''}">
      <h3><span class="fl">${esc(room.floor||"")}</span>
        <span class="nm">${esc(room.name)}</span>
        <span class="cap">${capTxt}</span></h3>
      <ul class="${isT?"two-col":""}"${isT
        ? ` style="grid-template-rows:repeat(${Math.max(1,Math.ceil(rows.length/2))},auto)"` : ""}>${items}</ul>
    </section>`;
  });

  /* 행 높이는 CSS 에서 내용만큼만 쓰게 두고(flex:0 0 auto), 남는 높이는 위아래 여백으로 둡니다.
     예전에는 세 행이 화면 높이를 억지로 나눠 채워서, 예약이 1건인 칸도 큰 상자가 되고
     그 안에 글자만 덩그러니 떠 있었습니다. */
  let idx = 0;
  const rowsHtml = rowIds.map((ids,i)=>{
    const cells = ids.map(()=>sec[idx++]).filter(Boolean);
    if(!cells.length) return "";
    return `<div class="tv-row ${i===0?"halls":""}">${cells.join("")}</div>`;
  });

  const d = new Date();
  const dateTxt = `${d.getMonth()+1}월 ${d.getDate()}일 ${["일","월","화","수","목","금","토"][d.getDay()]}요일`;

  /* tv-stage 안에 실제 화면(tv-inner)을 넣습니다.
     세로로 든 휴대폰에서는 stage 가 16:9 로 고정되고 inner 가 통째로 축소됩니다. */
  return `
      <div class="tv-bgs" aria-hidden="true">
        ${[1,2,3,4,5,6,7].map(i=>`<div class="tv-bg b${i} ${i===(view.bgIndex||1)?'on':''}"></div>`).join("")}
      </div>
      <div class="tv-inner">
        <header class="tv-h">
          <div class="tv-date">${dateTxt}</div>
          <h1>오늘의 예약 안내</h1>
          <div class="tv-line"></div>
        </header>
        <div class="tv-grid">${rowsHtml.join("")}</div>
        <footer class="tv-f">찾아주셔서 감사합니다</footer>
      </div>`;
}

/* ============================================================
   예시 데이터 — 처음 실행할 때만 채웁니다 (설정에서 지울 수 있음)
   ============================================================ */
function seedDemo(d){
  const today = todayStr();
  const rooms = d.hanok.settings.rooms;
  const pick = function(n){ const r=rooms.find(function(x){return x.name===n;}); return r?r.id:null; };
  /* ---------- 예약 예시 ----------
     운영시간·룸 정원·코스 규칙을 지켜서 만듭니다 (경고 없는 정상 예약).
     요일별로 쓸 수 있는 시각만 골라 씁니다. */
  const ROOMS = [
    {n:"조조", min:2, max:4}, {n:"유비", min:2, max:4}, {n:"장비", min:2, max:4},
    {n:"관우", min:4, max:6}, {n:"공명", min:4, max:6}, {n:"주유", min:4, max:6},
    {n:"초선", min:6, max:8}, {n:"동탁", min:8, max:10}
  ];
  const HALLS = ["1층 홀","지하 홀"];
  /* 룸(체류 3h)·홀(2.5h) 모두 안전한 시각만 사용 */
  const SLOTS = {
    0: {lunch:["11:30","12:00","12:30","13:00"], dinner:["17:00","17:30"]},           /* 일 20:30 마감 */
    6: {lunch:["11:30","12:00","12:30","13:00"], dinner:["17:00","17:30","18:00","18:30","19:00"]},
    x: {lunch:["11:30","12:00","12:30","13:00"], dinner:["17:00","17:30","18:00","18:30","19:00"]}
  };
  /* 코스 구성 — 시간대에 맞는 줄에서 고릅니다 */
  const COURSE_BY = (lunch, weekend) =>
    lunch ? (weekend ? ["cg_welunch|요리사","cg_welunch|B","cg_welunch|A"] : ["cg_wdlunch|요리사","cg_wdlunch|동한","cg_wdlunch|서한"])
          : ["cg_dinner|오","cg_dinner|촉","cg_dinner|한","cg_dinner|위"];

  const names = ["김하람","이도현","박수빈","정우성","최유나","한서진","오지호","배소민",
                 "신태호","권나연","황준서","문가영","서동우","임하경","조성민","윤지완",
                 "남기범","홍세아","유정민","곽태영","심다혜","방준혁","노아린","전승우",
                 "박서준","이재아","조은결","최민서","윤소라","김도윤","정하늘","한지호"];
  const nsPool = ["010-3300-1188","010-9042-7761","010-8834-2205"];
  const nsNames = ["차민석","임세연","고은비"];

  let gi = 0;
  const mkRes = (ds, opt, used) => {
    const dow = new Date(ds+"T00:00:00").getDay();
    const weekend = dow===0 || dow===6;
    const slots = SLOTS[dow] || SLOTS.x;
    const lunch = opt.lunch;
    const time = (lunch ? slots.lunch : slots.dinner)[gi % (lunch?slots.lunch.length:slots.dinner.length)];
    const useRoom = opt.room;
    let people, roomName, courses = {}, menuType = "해당 없음", infants = 0;

    if(useRoom){
      /* 같은 시각에 이미 쓰는 룸은 건너뜁니다 */
      let rm = null;
      for(let i=0;i<ROOMS.length;i++){
        const cand = ROOMS[(gi*5 + i) % ROOMS.length];
        if(!used[time+"|"+cand.n]){ rm = cand; break; }
      }
      if(!rm) return null;                 /* 그 시각 룸이 다 찼으면 건너뜀 */
      used[time+"|"+rm.n] = true;
      roomName = rm.n;
      people = rm.min + ((gi*3) % (rm.max - rm.min + 1));
      if(gi % 11 === 0 && people >= rm.min + 2) infants = 1;   /* 유아가 있어도 성인이 최소 인원 이상 */
      const adults = people - infants;
      const pool = COURSE_BY(lunch, weekend);
      menuType = "코스";
      courses[pool[gi % pool.length]] = adults;                /* 코스 인원 = 성인 수 */
    }else{
      roomName = HALLS[gi % HALLS.length];
      people = [2,3,4,4,5,6,8][(gi*3) % 7];
      if(gi % 13 === 0 && people >= 3) infants = 1;
      menuType = "해당 없음";
    }
    return {
      id:"demo_"+(gi)+"_"+ds, date:ds, time,
      name: names[gi % names.length],
      phone:"010-"+pad(2000+((gi*37)%7999)).slice(0,4)+"-"+pad(1000+((gi*53)%8999)).slice(0,4),
      people, infants, chairs:infants,
      roomId: pick(roomName), seatPref:null, tentativeRoomId:null,
      source: gi%4===0 ? "네이버예약" : "전화", sourceDetail:"",
      createdAt: new Date(new Date(ds+"T00:00:00").getTime() - (3+(gi%9))*86400000).toISOString(),
      menuType, courses, courseUndecided:false,
      request: gi%17===0 ? "창가 자리 부탁드립니다" : "",
      allergy: gi%23===0 ? "땅콩 알러지" : "",
      status:"확정", demo:true
    };
  };

  const [yy] = today.split("-").map(Number);
  for(let mo=7; mo<=10; mo++){
    const lastDay = new Date(yy, mo, 0).getDate();
    for(let day=1; day<=lastDay; day++){
      const ds = `${yy}-${pad(mo)}-${pad(day)}`;
      if(mo===10 && day>12) continue;
      const dow = new Date(ds+"T00:00:00").getDay();
      let cnt = (dow===5||dow===6) ? 15 : (dow===0 ? 12 : 9);
      if(ds===today) cnt = 16;
      if(mo===10) cnt = Math.max(1, Math.round(cnt*0.45));
      const used = {};
      for(let k=0;k<cnt;k++,gi++){
        const rec = mkRes(ds, {lunch: k%2===0, room: k%5<3}, used);   /* 5건 중 3건은 룸, 2건은 홀 */
        if(!rec) continue;
        /* 지난 날짜는 대부분 방문, 가끔 노쇼·취소 (어제는 확정으로 남겨 자동 처리 확인) */
        if(ds < today && ds !== shiftDate(today,-1)){
          const rr = gi % 23;
          if(rr===0){
            rec.status = "노쇼";
            const ni = Math.floor(gi/7) % nsPool.length;   /* 세 사람에게 고르게 */
            rec.phone = nsPool[ni]; rec.name = nsNames[ni];
          }else if(rr===7){ rec.status = "취소"; }
          else rec.status = "방문";
        }
        d.hanok.reservations.push(rec);
      }
      /* 사장 판단으로 받은 '경고 예약'을 가끔 섞습니다 — 확인 필요 화면 테스트용 */
      if(ds === today || day % 5 === 0){   /* 5일에 한 번쯤 경고 예약이 섞이도록 */
        const kind = gi % 4;
        const w = mkRes(ds, {lunch:false, room:true}, used);
        if(w){
          w.id = "demo_w_"+gi+"_"+ds;
          if(kind===0){
            /* 라스트오더 이후 접수 */
            w.time = dow===0 ? "20:00" : "21:20";
          }else if(kind===1){
            /* 룸인데 코스가 아님 */
            w.menuType = "해당 없음"; w.courses = {};
          }else if(kind===2){
            /* 코스 인원이 성인보다 적음 */
            const keys = Object.keys(w.courses);
            if(keys.length) w.courses[keys[0]] = Math.max(1, w.people - 2);
          }else{
            /* 브레이크타임에 접수 (평일만) */
            if(dow>=1 && dow<=5) w.time = "16:00";
            else { w.menuType = "확인 필요"; w.courses = {}; }
          }
          if(ds < today && ds !== shiftDate(today,-1)) w.status = "방문";
          d.hanok.reservations.push(w);
          gi++;
        }
      }

      /* 좌석 미정 예약을 섞습니다 (오늘·내일은 꼭 몇 건) */
      const wantUn = ds===today ? 2 : (ds===shiftDate(today,1) ? 1 : (gi % 11 === 0 && ds > today ? 1 : 0));
      for(let u=0; u<wantUn; u++, gi++){
        const un = mkRes(ds, {lunch:u%2===0, room:false}, used);
        if(!un) continue;
        un.id = "demo_u_"+gi+"_"+ds; un.roomId = null;
        un.seatPref = u%2===0 ? "room-any" : "table-any";
        un.people = 4; un.infants = 0; un.chairs = 0;
        un.menuType = un.seatPref==="room-any" ? "확인 필요" : "해당 없음";
        un.courses = {};
        d.hanok.reservations.push(un);
      }
    }
  }

  /* 접속 기록 예시 — 형식 확인용 */
  const sampleIPs = ["121.174.22.9","121.174.22.9","203.234.11.87","172.30.1.44"];
  const acts = [
    ["로그인 성공",""],
    ["매장 진입","hanok"],
    ["예약 등록", `${today} 18:30 오세라 12명 동탁 룸 경로:전화`],
    ["상태 변경", `${shiftDate(today,-2)} 18:30 차민석 확정 → 노쇼`],
    ["좌석 배정", `${today} 19:00 이가은 → 관우`],
    ["로그인 실패","입력값 1111"],
    ["설정 변경","stayHours = 3"],
    ["예약 삭제", `${shiftDate(today,-6)} 20:00 김테스트 010-0000-0000`]
  ];
  d._logs = acts.map((a,i)=>({
    ts: new Date(Date.now() - (acts.length-i)*3600000*3).toISOString(),
    ip: sampleIPs[i%sampleIPs.length],
    store: "hanok", action:a[0], detail:a[1],
    ua: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
  }));
  return assignTentatives(d);
}
/* 좌석 미정 예약에 잠정 배정을 붙임 (예시 데이터용) */
function assignTentatives(d){
  const prev = view.storeKey; view.storeKey = "hanok";
  const saved = DATA; DATA = d;
  d.hanok.reservations.filter(r=>!r.roomId && !r.tentativeRoomId).forEach(r=>{
    r.tentativeRoomId = suggestSeat(r.date, r.time, pplOf(r), r.seatPref||"any", r.id);
  });
  DATA = saved; view.storeKey = prev;
  return d;
}
/* 예시 데이터 버튼(넣기·지우기)은 7차-M 에서 뺐습니다 — dev DB 는 work/seed_dev.py 로만 넣습니다 */

loadData();
