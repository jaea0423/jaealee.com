/* 화면 그리기는 innerHTML 을 통째로 바꾸는 방식이라, 도중에 예외가 나면
   대입 자체가 일어나지 않아 화면이 직전 상태로 굳습니다.
   그러면 이후 모든 클릭이 같은 예외로 죽는데 사용자 눈에는
   "버튼을 눌러도 아무 일도 안 남" 으로만 보입니다.
   그래서 여기서 잡아 새로고침 안내를 띄웁니다. */
function render(){
  try{ renderApp(); }
  catch(e){ showCrash(e); }
}
function showCrash(e){
  try{
    console.error("화면 오류", e);
    var old = document.getElementById("crashbar");
    if(old) old.parentNode.removeChild(old);
    var d = document.createElement("div");
    d.id = "crashbar";
    d.className = "crashbar";
    d.innerHTML = '<b>화면을 그리는 중 문제가 생겼습니다.</b>' +
      '<span>방금 한 조작은 저장되지 않았을 수 있습니다.</span>' +
      '<button onclick="location.reload()">새로고침</button>' +
      '<i>' + esc(String(e && e.message ? e.message : e).slice(0,120)) + '</i>';
    document.body.appendChild(d);
  }catch(_){ /* 안내조차 실패하면 조용히 넘어갑니다 */ }
}
/* 화면을 다시 그리면 innerHTML 이 통째로 바뀌므로 스크롤 위치가 0으로 돌아갑니다.
   마법사에서 분 단위를 조절할 때마다 화면이 맨 위로 튀던 원인이 이것이었습니다.
   그리기 직전에 위치를 적어 두고 그린 뒤에 되돌려 놓습니다.
   ※ 단계를 옮길 때는 맨 위로 가야 하므로 wzGo() 가 그린 다음 0으로 덮어씁니다. */
var KEEP_SCROLL = [".wz-mid", ".sheet", ".calbox"];
var scrollMemo = null;
/* '같은 화면을 다시 그린 것'인지 판별하는 열쇠.
   다른 단계·다른 팝업으로 넘어갔다면 위치를 물려받으면 안 됩니다
   (새로 연 팝업이 엉뚱하게 중간부터 보이는 일을 막습니다). */
function viewKey(){
  return (WZ ? "wz" + WZ.step : "-") + "|" +
         (view.form ? view.form.type + (view.form.id || "") : "-") + "|" +
         (view.calOpen ? "cal" : "-") + "|" + view.tab;
}
function saveScroll(){
  scrollMemo = { key: viewKey(), pos: [] };
  for(var i=0;i<KEEP_SCROLL.length;i++){
    var el = document.querySelector(KEEP_SCROLL[i]);
    if(el && el.scrollTop > 0) scrollMemo.pos.push([KEEP_SCROLL[i], el.scrollTop]);
  }
}
function restoreScroll(){
  if(!scrollMemo) return;
  var memo = scrollMemo; scrollMemo = null;
  if(memo.key !== viewKey()) return;      /* 화면이 바뀌었으면 맨 위에서 시작 */
  for(var i=0;i<memo.pos.length;i++){
    var el = document.querySelector(memo.pos[i][0]);
    if(el) el.scrollTop = memo.pos[i][1];
  }
}
var lastPopKey = "";
/* 어떤 팝업이 떠 있는지 열쇠. 직전 그리기와 같으면 '같은 팝업을 고쳐 그린 것' 이므로 등장 움직임을 생략합니다 */
function popKey(){
  const t = WZ ? WZ : tmpRes;
  return viewKey() + "|" + (t && t.courseOpen ? "course" : "-") + "|" + (MODAL ? "modal" : "-");
}
function renderLoadError(){
  if(view.display) return "";
  if(OFFLINE && AUTHED){
    var d = OFFLINE.at ? new Date(OFFLINE.at) : null;          /* 캐시 시각은 UTC 문자열 — 한국 시각으로 */
    var at = d && !isNaN(d) ? pad(d.getHours()) + ":" + pad(d.getMinutes()) : "-";
    return `<div class="crashbar offline">
      <b>오프라인</b><span>마지막 갱신 ${esc(at || "-")} · 지금은 볼 수만 있습니다. 30초마다 다시 연결해 봅니다.</span>
      <button onclick="reconnect()">다시 연결</button></div>`;
  }
  if(AUTHED && clockBad()){
    return `<div class="crashbar offline"><b>이 기기의 시계가 틀립니다</b><span>서버와 ${Math.round(Math.abs(CLOCK_SKEW)/3600000)}시간 이상 차이 — 날짜·시각 설정을 확인하세요. 자동 방문 처리는 멈춰 둡니다.</span></div>`;
  }
  if(!LOAD_ERROR) return "";
  return `<div class="crashbar loaderr">
    <b>예약 데이터를 불러오지 못했습니다.</b>
    <span>지금 보이는 화면은 비어 있는 상태이며, 저장이 막혀 있습니다. 인터넷을 확인하고 다시 시도하세요.</span>
    <button onclick="location.reload()">다시 불러오기</button>
    <i>${esc(LOAD_ERROR)}</i>
  </div>`;
}
function renderApp(){
  saveScroll();
  /* 다시 그리기 전에 타이핑 중인 값을 상태로 옮깁니다. 마법사 6단계에서 요청사항을 치다가 유아의자 ± 를 누르면 입력이 사라졌고,
     1분 갱신·폰 회전에도 같은 일이 났습니다(점검 R1). 입력칸이 없는 화면에서는 아무 일도 안 합니다 */
  try{ if(WZ) wzSyncInputs(); if(!WZ && tmpRes && view.form && view.form.type === "res") syncRes(); }catch(e){}
  applyTheme();
  /* 오늘이 아닌 날짜면 페이지 바탕도 검정 (applyTheme 이 className 을 통째로 다시 쓰므로 그 뒤에) */
  document.body.classList.toggle("notoday", notodayView());
  const pk = popKey();
  document.body.classList.toggle("same-pop", pk === lastPopKey);
  lastPopKey = pk;
  /* 팝업이 떠 있으면 뒤 화면이 스크롤되지 않게 */
  document.body.style.overflow =
    (MODAL || (view.form && !view.display) || view.calOpen || WZ) ? "hidden" : "";
  const app = document.getElementById("app");
  if(!DATA){ app.innerHTML="<p class='empty'>불러오는 중…</p>"; return; }
  /* 디스플레이 모드는 주소로 바로 열 수 있습니다 (TV 전용 화면) */
  if(view.display && view.storeKey){ app.innerHTML = renderDisplay() + renderModal(); afterRender(); return; }
  /* 매장을 고른 뒤에 PIN 을 입력합니다 */
  if(view.storeKey && !AUTHED){ app.innerHTML = renderLock() + renderModal(); syncHash(); afterRender(); return; }
  if(INTRO){ app.innerHTML = renderIntro(); return; }
  app.innerHTML = (view.display ? renderDisplay()
                  : (view.storeKey ? renderStore() : renderSelect())) + renderModal() + renderLoadError();
  syncHash();      /* 주소를 지금 화면에 맞춥니다 — 새로고침해도 그 자리로 */
  afterRender();   /* 화면을 그린 뒤 필요한 이벤트 연결 (분 조절 레일 등) */
}

/* ---------- 들어갈 때 인사 ----------
   PIN 을 맞히고 바로 화면이 튀어나오면 눌린 건지 아닌지 알기 어렵습니다.
   짧게(2초 안쪽) 인사를 띄워 '들어가는 중'이라는 감각을 줍니다.
   중식당이라 중국어(歡迎光臨)에서 한국어(어서오세요)로 글자가 하나씩 바뀌고,
   바탕은 붉은 칠기 → 어두운 나무색 → 한지·창살 세 단계로 따라갑니다.
   아무 데나 누르면 바로 건너뜁니다 — 바쁠 때 1초도 아깝습니다.
   ※ 글자가 바뀔 때마다 render() 로 화면을 다시 그리면 CSS 전환이 전혀 재생되지 않습니다
     (요소가 새로 만들어지니까). 처음 한 번만 그리고 그 뒤로는 클래스만 바꿉니다. */
var INTRO = null, introTimers = [];
var INTRO_FROM = "歡迎光臨";       /* 歡迎光臨 */
var INTRO_TO   = "어서오세요";  /* 어서오세요 */
function startIntro(){
  INTRO = { n:0 };
  clearIntro(true);
  render();                                   /* 한 번만 그립니다 */
  /* 글자 5개가 200ms 간격(1초) — 135ms 는 거의 동시라 단계가 안 느껴졌고, 260ms 는 붉은 첫 장면이 길었습니다(6차-F).
     첫 글자는 360ms, 마지막 글자 뒤 600ms 에 끝. 총 약 1.8초, 아무 데나 누르면 건너뜀 */
  var steps = INTRO_TO.length, t0 = 160, gap = 200;
  for(var i=1;i<=steps;i++){
    introTimers.push(setTimeout((function(k){ return function(){ introStep(k); }; })(i), t0 + i*gap));
  }
  introTimers.push(setTimeout(endIntro, t0 + steps*gap + 600));
}
/* 글자 진행 p(0~1)에 따른 바탕 두 겹의 불투명도 — 나무색은 앞 절반에서, 한지(와 창호)는 뒤 절반에서 올라옵니다 */
function introBg(n){
  var p = Math.min(1, n / Math.max(1, INTRO_TO.length - 1));
  return { mid: Math.min(1, p*2).toFixed(2), ko: Math.max(0, (p-.5)*2).toFixed(2) };
}
function clearIntro(keepState){
  for(var i=0;i<introTimers.length;i++) clearTimeout(introTimers[i]);
  introTimers = [];
  if(!keepState) INTRO = null;
}
function endIntro(){ clearIntro(); INTRO = null; render(); }
/* k 번째 글자까지 바꿉니다. 화면을 다시 그리지 않고 클래스만 붙입니다 */
function introStep(k){
  if(!INTRO) return;
  INTRO.n = k;
  var root = document.querySelector(".intro");
  if(!root) return;
  root.className = "intro turning";
  var cn = root.querySelectorAll(".intro-word.cn .ic"), ko = root.querySelectorAll(".intro-word.ko .ic"), i;
  for(i=0;i<cn.length;i++) cn[i].className = "ic" + (i < k ? " off" : "");
  for(i=0;i<ko.length;i++) ko[i].className = "ic" + (i < k ? " on"  : "");
  /* 첫 글자가 바뀌는 순간 바탕도 함께 움직이기 시작하도록 조금 앞서 갑니다 (k=1 에 나무색 절반, k=2 에 나무색 완성, k=3~4 에 한지) */
  var bg = introBg(k), mid = root.querySelector(".intro-mid"), kos = root.querySelectorAll(".intro-ko, .intro-sash");
  if(mid) mid.style.opacity = bg.mid;
  for(i=0;i<kos.length;i++) kos[i].style.opacity = bg.ko;
}
/* 다른 이유로 render() 가 도중에 불려도 진행 중인 단계(INTRO.n)를 그대로 그립니다 */
function renderIntro(){
  var i, cn = "", ko = "", n = INTRO.n || 0;
  for(i=0;i<INTRO_FROM.length;i++) cn += '<span class="ic' + (i < n ? ' off' : '') + '">' + INTRO_FROM.charAt(i) + '</span>';
  for(i=0;i<INTRO_TO.length;i++)   ko += '<span class="ic' + (i < n ? ' on'  : '') + '">' + INTRO_TO.charAt(i) + '</span>';
  var bg = introBg(n);
  var pm = n ? ' style="opacity:' + bg.mid + '"' : '', pk = n ? ' style="opacity:' + bg.ko + '"' : '';
  return '<div class="intro' + (n ? ' turning' : '') + '" onclick="endIntro()">' +
           '<div class="intro-bg intro-cn"></div>' +
           '<div class="intro-bg intro-mid"' + pm + '></div>' +
           '<div class="intro-bg intro-ko"' + pk + '></div>' +
           '<div class="intro-sash l"' + pk + '></div><div class="intro-sash r"' + pk + '></div>' +
           '<div class="intro-w">' +
             '<div class="intro-word cn">' + cn + '</div>' +
             '<div class="intro-word ko">' + ko + '</div>' +
           '</div>' +
         '</div>';
}


/* ============================================================
   PIN 잠금 — 새로 열 때마다 입력합니다 (자동 로그인 없음)
   ============================================================ */
let AUTHED = false;
let PIN_BUF = "";
let PIN_ERR = "";

function renderLock(){
  const s = view.storeKey ? DATA[view.storeKey] : null;
  /* 자리를 채울 때마다 매장 이름 한 글자씩 나타납니다 */
  const marks = (s && s.name.length>=4) ? s.name.split("").slice(0,4) : ["한","옥","반","점"];
  const dots = [0,1,2,3].map(i=>
    `<span class="pdot f${i+1} ${i<PIN_BUF.length?'on':''}">${i<PIN_BUF.length?marks[i]:""}</span>`).join("");
  const keys = [1,2,3,4,5,6,7,8,9,"clear",0,"back"].map(k=>{
    if(k==="clear") return `<button class="pkey sub" onclick="pinClear()" title="다시 입력">↻</button>`;
    if(k==="back")  return `<button class="pkey sub" onclick="pinBack()">←</button>`;
    return `<button class="pkey" onclick="pinPush('${k}')">${k}</button>`;
  }).join("");
  return `
    <div class="lock">
      <div class="lockbox">
        <div class="lk-title">${esc(s?s.name:"")} 예약 시스템</div>
        <div class="pdots">${dots}</div>
        <div class="lk-err ${LOCK_BUSY?'busy':''}">${LOCK_BUSY ? "서버 확인 중…" : (pinLockLeft() > 0 ? `${pinLockLeft()}초 뒤에 다시 입력할 수 있습니다` : esc(PIN_ERR))}</div>
        <div class="pkeys">${keys}</div>
        ${supaOn() ? "" : `<div class="lk-open"><b>서버 설정이 없는 빌드</b> — supabase.dev.json 또는 supabase.prod.json 을 넣고 다시 빌드하세요</div>`}
        <button class="lk-back" onclick="backToStores()">← 매장 다시 고르기</button>
      </div>
    </div>`;
}
function pinPush(n){
  if(!view.storeKey || view.display || AUTHED) return;   /* 잠금 화면일 때만. TV 리모컨 숫자키가 로그인 시도가 됐습니다(점검 U1) */
  if(PIN_BUF.length>=4 || LOCK_BUSY || pinLockLeft() > 0) return;
  PIN_BUF += n; PIN_ERR="";
  if(PIN_BUF.length===4) setTimeout(pinCheck, 120);
  render();
}
function pinBack(){ PIN_BUF = PIN_BUF.slice(0,-1); render(); }
function pinClear(){ PIN_BUF=""; PIN_ERR=""; render(); }
function backToStores(){ view.storeKey=null; PIN_BUF=""; PIN_ERR=""; render(); }
/* ============================================================
   PIN 확인
   서버 모드(SUPA_CFG 있음): PIN 4자리 + "00" 으로 staff 계정 로그인 — 진짜 검증. 틀림 5회 → 60초 잠금.
   서버 설정이 없는 빌드: 들어갈 수 없습니다(7차-H). build.py 가 prod 설정이 없으면 dev 설정을 쓰므로 사이트에 설정 없는 빌드가 올라갈 일은 없습니다.
   ============================================================ */
var PIN_FAILS = 0, PIN_LOCK_UNTIL = 0;   /* 틀린 횟수 · 잠금 해제 시각(ms) */
function pinLockLeft(){ return Math.max(0, Math.ceil((PIN_LOCK_UNTIL - Date.now()) / 1000)); }
var LOCK_BUSY = false;   /* 서버에 PIN 을 확인하는 중 — 잠금 화면에 '확인 중' 표시 */
async function pinCheck(){
  if(supaOn()) return pinCheckServer();
  /* 서버 설정이 없는 빌드 — PIN 을 확인할 곳이 없으므로 들어갈 수 없습니다 (재아 결정: 정해진 비밀번호로만).
     화면 확인용 스크린샷은 AUTHED 를 직접 켜서 찍습니다(work/shot.py) */
  PIN_BUF = ""; PIN_ERR = "서버 설정이 없는 빌드입니다. 들어갈 수 없습니다.";
  render();
}
/* 틀린 PIN 을 세고 5회면 60초 잠급니다. Supabase 에도 로그인 제한이 있지만 화면에서 먼저 막아 둡니다 */
function pinFailed(){
  PIN_FAILS++;
  if(PIN_FAILS >= 5){
    PIN_FAILS = 0; PIN_LOCK_UNTIL = Date.now() + 60000;
    logEvent("로그인 잠금", "PIN 5회 틀림 · 60초");
    var t = setInterval(function(){ if(pinLockLeft() <= 0){ clearInterval(t); PIN_ERR = ""; } render(); }, 1000);
  }
}
/* 서버 모드 — PIN 4자리를 staff 계정 비밀번호(PIN+"00")로 로그인. 맞으면 서버를 읽어 들어갑니다.
   연결이 없으면: 마지막으로 서버가 받아 준 PIN 과 같을 때만 캐시로 들어갑니다(읽기 전용) */
async function pinCheckServer(){
  var pin = PIN_BUF;
  LOCK_BUSY = true; PIN_ERR = ""; render();
  try{
    await sbLogin(SUPA_CFG.staffEmail, pinToPassword(pin));
    PIN_FAILS = 0; pinHashSave(pin);
    await enterStore();
    PIN_BUF = ""; PIN_ERR = "";
    logEvent("로그인 성공", "staff");
    LOCK_BUSY = false;
    startIntro();
    return;
  }catch(e){
    PIN_BUF = "";
    if(e.network){
      if(pinHashOk(pin) && enterOffline(pin)){ LOCK_BUSY = false; startIntro(); return; }
      PIN_ERR = "서버에 연결할 수 없습니다";
    }else if(e.status === 400){                      /* Supabase: 비밀번호 틀림 = 400 invalid_credentials. 401 은 API 키 문제라 따로 */
      PIN_ERR = "PIN 번호가 맞지 않습니다."; pinFailed();
    }else if(e.status === 429){
      PIN_ERR = "너무 여러 번 틀렸습니다. 잠시 뒤 다시 시도하세요.";
    }else{
      PIN_ERR = "로그인 실패: " + e.message;
    }
    console.warn("로그인 실패", e.status, e.message);
  }
  LOCK_BUSY = false; render();
}
/* 잠그기 전에 못 보낸 변경을 마저 보냅니다. 세션을 먼저 지우면 남은 PATCH 가 anon 으로 나가 401 이 났습니다(점검 D8) */
async function flushBeforeLeave(){
  if(!supaOn() || !SESSION) return true;
  if(FLUSHING || hasDirty()){ try{ await flush(); }catch(e){} }
  if(SAVE_FAIL || hasDirty()){
    return await uiConfirm("아직 서버에 저장되지 않은 변경이 있습니다", "지금 나가면 그 변경은 사라집니다. 그래도 나갈까요?", {ok:"버리고 나가기", cancel:"머무르기"});
  }
  return true;
}
/* 마법사·달력·더보기·확인창을 한 번에 접습니다. 세션 만료·주소 이동으로 화면이 바뀔 때 옛 마법사가 남거나
   body 의 overflow:hidden 이 남아 스크롤이 안 되던 것(점검 U3) */
function resetOverlays(){
  WZ = null; tmpRes = null; view.form = null; view.calOpen = false; view.moreOpen = false; view.pickSeat = null;
  if(typeof MODAL !== "undefined" && MODAL && MODAL.res){ try{ MODAL.res(false); }catch(e){} }
  MODAL = null;
  try{ document.body.style.overflow = ""; }catch(e){}
}
async function lockNow(){
  if(!await flushBeforeLeave()) return;
  resetOverlays();
  logEvent("잠금", "");
  AUTHED=false; PIN_BUF=""; PIN_ERR=""; view.storeKey=null; view.draft=null;
  DATA._session = {authed:false};
  sessionClear(); OFFLINE = null;
  saveData(); render();
}
/* PC에서 키보드로도 입력 */
function pinKeydown(e){
  if(AUTHED) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pinPush(e.key); }
  else if(e.key==="Backspace"){ e.preventDefault(); pinBack(); }
  else if(e.key==="Escape"){ e.preventDefault(); pinClear(); }
}
document.addEventListener("keydown", pinKeydown);

/* 첫 줄을 제목으로, 나머지를 본문으로 나눠 띄웁니다 */
function splitMsg(m){
  const s = String(m||"").split("\n");
  const title = s[0].replace(/[?!.]$/,"") || "확인";
  return [title, s.slice(1).join("\n").trim()];
}
async function uiConfirm2(msg, opt){
  const [t,b] = splitMsg(msg);
  return uiConfirm(t, b || t, opt);
}
async function uiAlert2(msg){
  const [t,b] = splitMsg(msg);
  return uiAlert(t, b || "");
}

/* ============================================================
   공통 팝업 — 브라우저 기본 alert/confirm 대신 같은 테마로
   uiAlert / uiConfirm 은 Promise 를 돌려주므로 await 로 씁니다.
   ============================================================ */
let MODAL = null;
/* 알림이 떠 있는데 새 알림이 오면 이전 것은 '취소' 로 닫습니다 — 안 그러면 이전 Promise 가 영원히 대기해
   그것을 기다리던 저장·단계 이동이 조용히 멈추고, 확인을 눌러도 다음 알림이 계속 뜹니다(7차 점검 U2) */
function modalReplace(next){
  var prev = MODAL; MODAL = next; render();
  if(prev && prev.res) prev.res(false);
}
function uiAlert(title, msg, tone){
  return new Promise(res => { modalReplace({mode:"alert", title, msg, tone:tone||"warn", res}); });
}
function uiConfirm(title, msg, opt){
  opt = opt || {};
  return new Promise(res => {
    modalReplace({mode:"confirm", title, msg, tone:opt.tone||"warn",
                  ok:opt.ok||"계속", cancel:opt.cancel||"취소", res});
  });
}
function modalAnswer(v){
  const m = MODAL; MODAL = null; render();
  if(m) m.res(v);
}
function renderModal(){
  if(!MODAL) return "";
  const m = MODAL;
  /* '---' 만 있는 줄은 가로선으로 그립니다.
     문자 미리보기에서 '어디부터 어디까지가 문자인지' 눈으로 끊어 주려고 만들었습니다.
     선은 화면에만 그려지고 실제 문자 내용에는 들어가지 않습니다. */
  const lines = String(m.msg||"").split("\n").map(l=>
    l.trim()==="---" ? `<div class="md-rule"></div>`
    : l.trim()==="" ? `<div class="md-gap"></div>`
    : `<div class="md-l">${esc(l)}</div>`).join("");
  return `
    <div class="overlay modal-ov" onclick="modalAnswer(false)">
      <div class="modal ${m.tone}" onclick="event.stopPropagation()">
        <div class="md-h">${esc(m.title)}</div>
        <div class="md-b">${lines}</div>
        <div class="md-f">
          ${m.mode==="confirm"?`<button class="btn" onclick="modalAnswer(false)">${esc(m.cancel)}</button>`:""}
          <button class="btn ${m.tone==="warn"?"danger-fill":"primary"}" onclick="modalAnswer(true)">
            ${m.mode==="confirm"?esc(m.ok):"확인"}</button>
        </div>
      </div>
    </div>`;
}

async function setTab(t){
  /* 다른 기기가 설정을 바꿨는데 이 기기에 옛 임시본이 남아 있으면 '저장 안 한 변경' 으로 오탐하고, 적용하면 되돌립니다(점검 C3).
     고친 것이 없으면 들어올 때마다 새로 뜹니다 */
  if(t === "settings" && view.draft && !settingsDirty()) view.draft = null;
  /* 설정에서 나갈 때 저장 안 한 변경이 있으면 물어봅니다 */
  if(view.tab==="settings" && t!=="settings" && settingsDirty()){
    const ok = await uiConfirm("저장하지 않은 변경이 있습니다",
      "변경 내용을 버리고 나갈까요?", {ok:"버리고 나가기", cancel:"계속 편집"});
    if(!ok) return;
    view.draft = null;
  }
  if(t==="settings" && !view.draft) view.draft = deepClone(store().settings);
  view.tab=t; render(); window.scrollTo(0,0);
}
/* 설정 화면에서는 임시본을 씁니다 — '적용하기'를 눌러야 반영됩니다 */
function draft(){
  if(!view.draft) view.draft = deepClone(store().settings);
  return view.draft;
}
function settingsDirty(){
  return !!view.draft && JSON.stringify(view.draft) !== JSON.stringify(store().settings);
}
/* 시트(운영시간·임시일정·노쇼 제외)는 '적용하기' 없이 바로 저장합니다. 그 값을 임시본에도 같이 써 둬야
   나중에 '적용하기' 를 눌렀을 때 옛 임시본이 방금 저장한 것을 되돌리지 않습니다(점검 D1) */
function mirrorDraft(key){ if(view.draft) view.draft[key] = deepClone(store().settings[key]); }
function applySettings(){
  if(!view.draft) return;
  if(readonlyBlock()) return;
  store().settings = deepClone(view.draft);
  logEvent("설정 변경", "적용");
  takeSnapshot();   /* 룸·테이블 수가 바뀌었을 수 있으니 오늘 스냅샷을 새로 (내일부터 오늘을 이 수로 계산) */
  saveData(); render();
}
async function revertSettings(){

/* ---------- 새로고침 · 갱신 시각 · 자동 갱신 ----------
   지금은 저장소가 없어 '새로고침'이 화면을 다시 그리는 것뿐입니다.
   Supabase 가 붙으면 여기서 loadData() 를 다시 불러 서버 값을 가져옵니다.
   갱신 시각은 "N분 전" 으로 보여 줍니다 — 시각보다 '얼마나 오래됐나' 가 판단에 쓸모 있습니다. */
var LAST_REFRESH = Date.now();
async function refreshData(){
  try{
    var changed = await reloadFromStore();
    LAST_REFRESH = Date.now();
    return changed !== false;   /* 서버 모드는 바뀐 것이 있는지 돌려줍니다. 그 밖(undefined)은 '모름' = 다시 그림 */
  }catch(e){
    console.error("갱신 실패", e.message);
    if(view.display) throw e;                                  /* TV 는 3번 연속 실패를 세어 '연결 확인 중' 을 띄웁니다 */
    if(e.network && !OFFLINE && SESSION){ enterOffline(); render(); }   /* 보던 중 연결이 끊김 → 캐시 읽기 전용으로 */
  }
}
async function manualRefresh(){
  var b = document.querySelector(".b-refresh");
  if(b) b.classList.add("spin");
  await refreshData();
  render();
}
/* 대시보드는 1분마다 스스로 갱신합니다 — 서버에서 바뀐 행만 받아 오고, 실제로 바뀐 것이 있을 때만 다시 그립니다.
   마법사·시트·확인창이 떠 있으면 건너뜁니다(입력 중에 화면이 바뀌면 안 되니까). '새로고침' 버튼은 즉시 + 무조건 다시 그림 */
setInterval(function(){
  /* 자정을 넘겼으면 새 날짜의 좌석 수를 남깁니다 (밤새 켜 둔 태블릿·TV). 6차 전에는 자정 처리가 따로 없었습니다 */
  if(SNAP_DAY && todayStr() !== SNAP_DAY){ takeSnapshot(); if(AUTHED && autoCloseDays()) saveData(); }   /* 어제 '확정' → '방문' 도 함께(점검 R7) */
  sessionTick();   /* 토큰 만료 5분 전 갱신 */
  if(SAVE_FAIL && !OFFLINE) flush();   /* 저장 못 한 것이 있으면 다시 */
  if(!AUTHED || view.display || WZ || view.form || MODAL) return;
  refreshData().then(function(changed){ if(changed) render(); });
}, 60000);

/* 오프라인이면 예약 목록·타임라인을 아예 감춥니다(재아 결정).
   캐시는 마지막으로 서버를 읽은 시점의 것이라, 그 사이 다른 기기에서 받은 예약이 없어 보입니다.
   비어 보이는 자리를 믿고 예약을 받으면 이중 예약이 나므로, '볼 수만 있음' 대신 '볼 수 없음' 으로 둡니다 */
function renderOfflineCard(){
  var d = OFFLINE.at ? new Date(OFFLINE.at) : null;
  var at = d && !isNaN(d) ? `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : "-";
  return `
    <section class="card offline-card">
      <div class="oc-t">서버에 연결되지 않아 예약을 보여 드리지 않습니다</div>
      <div class="oc-s">마지막으로 서버를 읽은 시각은 <b>${esc(at)}</b> 입니다. 그 뒤 다른 기기에서 받은 예약이 빠져 있어,
        빈자리로 보이는 곳이 실제로는 찼을 수 있습니다. 인터넷이 돌아오면 자동으로 다시 불러옵니다(30초마다 시도).</div>
      <div class="btn-row"><button class="btn primary" onclick="reconnect()">다시 연결</button></div>
    </section>`;
}
function renderDash(){
  const s = store(), st = s.settings, d = view.date;
  if(OFFLINE && AUTHED) return renderOfflineCard() + (view.calOpen ? renderCal() : "");
  const dayRes = s.reservations.filter(r=>r.date===d);
  const active = dayRes.filter(r=>r.status==="확정");
  const people = active.reduce((a,r)=>a+pplOf(r),0);
  const unassigned = active.filter(r=>isUnassigned(r) || (r.roomId && !seatById(r.roomId))).length;   /* 좌석이 삭제된 예약도(점검 C5) */
  const usedSeats = new Set(active.map(r=>effSeat(r)).filter(Boolean)).size;
  const stat = dayStat(d);

  /* 예약이 쓰는 좌석 수 — 룸 1개 = 1, 테이블 1개 = 1, 합치면 그만큼 */
  const seatUse = active.reduce((a,r)=>a + seatsOf(r).length, 0);
  const warnCnt = active.filter(r=>resWarn(r).length).length;
  const checkCnt = checkItems(d).length;

  /* 순서: 타임라인(오늘 상황이 한눈에) → 지표줄 → 예약 목록. 지표는 눌러서 여는 목록의 입구 역할이라 목록 바로 위가 맞습니다 */
  const metrics = `
    <section class="card metrics-card">
      <div class="metrics">
        <!-- 셋째 줄(부연·'눌러서 열기')은 7차-M 에서 뺐습니다 — 두 줄이면 충분하고 카드가 낮아집니다 -->
        <div class="metric"><div class="v">${active.length}<span class="u">건</span></div>
          <div class="k">확정 예약</div></div>
        <div class="metric"><div class="v">${stat.rate}<span class="u">%</span></div>
          <div class="k">예약률</div></div>
        <button class="metric tapm ${unassigned?'warn':''}" onclick="openUnassigned()">
          <div class="v">${unassigned}<span class="u">건</span></div>
          <div class="k">룸 미배정</div></button>
        <button class="metric tapm ${warnCnt?'warn':''}" onclick="openPick('warn')">
          <div class="v">${warnCnt}<span class="u">건</span></div>
          <div class="k">경고 예약</div></button>
        <button class="metric tapm ${checkCnt?'amber':''}" onclick="openCheck()">
          <div class="v">${checkCnt}<span class="u">건</span></div>
          <div class="k">확인 필요</div></button>
      </div>
    </section>`;

  if(isMobile()) return renderDashMobile(d, {active, unassigned, warnCnt, checkCnt, stat});
  return `
    <div class="card"><div class="card-b">${renderTimeline(d)}</div></div>
    <section class="card hours-card">${hoursLineHtml(hoursFor(d))}</section>
    ${metrics}
    ${foldCard("list", "예약 목록", `${dayRes.length}건`, renderResList(d))}
    ${view.calOpen ? renderCal() : ""}`;
}
/* ---------- 폰 대시보드 (7차-M) ----------
   폰에서 사장님이 보고 싶은 건 '지금부터 뭐가 오나' 라서 시간순 리스트가 기본이고, 그래프는 상단 스위치로.
   지표 다섯 칸과 그래프 위 지표줄은 내용이 겹쳐 한 줄 칩으로 합쳤습니다. 영업시간은 더보기 → 영업시간. */
function renderDashMobile(d, m){
  const chip = (n, label, cls, fn) => `<button class="mk ${n?cls:''} ${fn?'':'flat'}" ${fn?`onclick="${fn}"`:''}>${label} <b>${n}</b></button>`;
  const kpi = `<div class="mkpi">
    ${chip(m.active.length + "건", "확정", "", "")}
    ${chip(m.stat.rate + "%", "예약률", "", "")}
    ${chip(m.unassigned, "미배정", "warn", "openUnassigned()")}
    ${chip(m.warnCnt, "경고", "warn", "openPick('warn')")}
    ${chip(m.checkCnt, "확인", "amber", "openCheck()")}
  </div>`;
  const graph = view.mView === "graph";   /* 리스트|그래프 스위치는 상단바(HANOK 옆)에 있습니다 */
  const toggle = "";
  const body = graph
    ? `<section class="card mgraph"><div class="card-b">${renderTimeline(d, true)}</div></section>`
    : `<section class="card"><div class="card-b">${renderAgenda(d)}</div></section>`;
  return `${kpi}${toggle}${body}
    <button class="fab" onclick="openWizard('${d}')" aria-label="예약 등록">${ICON.plus}</button>
    ${view.calOpen ? renderCal() : ""}`;
}
/* 리스트 — 두 줄 행. 1줄 시각·이름·상태, 2줄 인원·좌석·전화·꼬리표. 한 줄 전체가 탭 영역 */
function renderAgenda(date){
  const s = store();
  let day = s.reservations.filter(r=>r.date===date).sort((a,b)=>a.time.localeCompare(b.time));
  const filters = ["전체",...STATUS].map(f=>{
    const n = f==="전체" ? day.length : day.filter(r=>r.status===f).length;
    return `<button class="${view.filter===f?'on':''}" onclick="setFilter('${f}')">${f} ${n}</button>`;
  }).join("");
  if(view.filter!=="전체") day = day.filter(r=>r.status===view.filter);
  const rows = day.length ? day.map(resRowMobile).join("") : `<div class="empty">해당 조건의 예약이 없습니다.</div>`;
  return `<div class="filters">${filters}</div><div class="mlist">${rows}</div>`;
}
function resRowMobile(r){
  const room = store().settings.rooms.find(x=>x.id===r.roomId);
  const seat = room ? resSeatLabel(r) : (r.tentativeRoomId ? `${resTentLabel(r)} 잠정` : "미배정");
  const late = r.status==="확정" && r.date<=todayStr() && (r.date<todayStr() || toMin(r.time)+60 < toMin(nowHM()));
  const warn = holdsSeat(r) && resWarn(r).length;
  const chg = changeTag(r);
  const pills = [
    r.menuType==="코스" ? (r.courseUndecided ? "코스 미정" : "코스") : r.menuType==="코스 상당" ? "코스상당" : r.menuType==="확인 필요" ? "메뉴확인" : "",
    r.allergy ? "알러지" : "", r.chairs ? `유아의자 ${r.chairs}` : "", r.request ? "요청" : "", r.memo ? "메모" : ""
  ].filter(Boolean).join(" · ");
  return `
    <button class="mrow s-${r.status} ${late?'late':''}" onclick="openMark('${r.id}')">
      <div class="mr-1">
        <span class="mr-t">${esc(r.time)}</span>
        <span class="mr-n">${esc(r.name)}</span>
        ${late?`<span class="mr-bang">!</span>`:""}
        ${r.status!=="확정"?`<span class="tag ${r.status==="노쇼"?"rust":""}">${r.status}</span>`:""}
        ${warn?`<span class="tag rust">경고</span>`:""}
        ${chg?`<span class="chg-tag ${chg.kind==="취소"||chg.kind==="노쇼"?"off":""}">${esc(chg.label)}</span>`:""}
      </div>
      <div class="mr-2">
        <span>${pplOf(r)}명${r.infants?`(유아${r.infants})`:""}</span>
        <span class="${room||r.tentativeRoomId?'':'none'}">${esc(seat)}</span>
        ${r.phone?`<span>${esc(r.phone)}</span>`:""}
        ${pills?`<span class="mr-p">${esc(pills)}</span>`:""}
      </div>
    </button>`;
}
/* 영업시간 시트 — 더보기에서. 폰은 카드가 없고 PC 는 카드가 있지만 항목은 양쪽에 둡니다 */

/* 설정 섹션은 한 번에 하나만 펼칩니다.
   여러 개가 열려 있으면 어디를 보고 있었는지 잃습니다 — 다른 걸 누르면 이전 것은 접힙니다. */
function toggleFold(k){
  var was = !!view.open[k];
  if(k.indexOf("s_") === 0){
    Object.keys(view.open).forEach(function(x){ if(x.indexOf("s_") === 0) view.open[x] = false; });
  }
  view.open[k] = !was;
  render();
}

/* 미리보기 — 값과 눈금 없이 막대와 선만 */
function ratePreview(endDate, days){
  const list = [];
  for(let i=days-1;i>=0;i--){
    const dd = shiftDate(endDate, -i);
    list.push(dayStat(dd).rate);
  }
  const W=300, H=64, bw=W/list.length;
  const y = v => H - (v/100)*(H-6) - 3;
  const bars = list.map((v,i)=>{
    const h = Math.max(1,(v/100)*(H-6));
    return `<rect x="${i*bw+bw*0.22}" y="${H-h-3}" width="${bw*0.56}" height="${h}" rx="1.5"/>`;
  }).join("");
  const pts = list.map((v,i)=>`${i*bw+bw/2},${y(v)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <g class="sp-bars">${bars}</g>
    <polyline class="sp-line" points="${pts}"/>
  </svg>`;
}

/* ---------- 예약률 추이 ----------
   막대는 아래가 룸, 위가 홀입니다. 둘을 더한 높이가 그날 전체 예약률입니다.
   꺾은선은 전체 예약률의 흐름입니다. */
function rateChart(endDate, days){
  const list = [];
  for(let i=days-1;i>=0;i--){
    const d = shiftDate(endDate, -i);
    const st = dayStat(d);
    list.push({date:d, rate:st.rate, room:st.roomShare, hall:st.hallShare,
               roomRate:st.roomRate, hallRate:st.hallRate, count:st.count});
  }
  const W=720, H=250, L=36, R=10, T=14, B=34;
  const iw=W-L-R, ih=H-T-B, bw=iw/list.length;
  const y = v => T + ih - (v/100)*ih;
  const cx = i => L + i*bw + bw/2;

  const grid = [0,20,40,60,80,100].map(v=>`
    <line class="gl" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>
    <line class="gl tick" x1="${L-5}" y1="${y(v)}" x2="${L}" y2="${y(v)}"/>
    <text class="tx ax" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`).join("");

  const bars = list.map((x,i)=>{
    const c = cx(i), w = Math.max(2, bw*0.56);
    const hr = (x.room/100)*ih, hh = (x.hall/100)*ih;
    return `
      <rect class="rb-room" x="${c-w/2}" y="${T+ih-hr}" width="${w}" height="${Math.max(0,hr)}" rx="1.5">
        <title>${x.date} 룸 ${Math.round(x.room)}%p (룸만 보면 ${x.roomRate}%)</title></rect>
      <rect class="rb-hall" x="${c-w/2}" y="${T+ih-hr-hh}" width="${w}" height="${Math.max(0,hh)}" rx="1.5">
        <title>${x.date} 테이블 ${Math.round(x.hall)}%p (테이블만 보면 ${x.hallRate}%)</title></rect>`;
  }).join("");

  const pts = list.map((x,i)=>`${cx(i)},${y(x.rate)}`).join(" ");
  const dots = list.map((x,i)=>`<circle class="line-total-d" cx="${cx(i)}" cy="${y(x.rate)}" r="2.4"/>`).join("");

  const labels = list.map((x,i)=>{
    const dt = new Date(x.date+"T00:00:00");
    const dow = ["일","월","화","수","목","금","토"][dt.getDay()];
    const on = x.date===view.date;
    return `<text class="tx ${on?'on':''}" x="${cx(i)}" y="${H-16}" text-anchor="middle">${dt.getDate()}</text>
            <text class="tx sm ${on?'on':''}" x="${cx(i)}" y="${H-4}" text-anchor="middle">${dow}</text>`;
  }).join("");

  const avg = Math.round(list.reduce((a,x)=>a+x.rate,0)/list.length);
  const peak = list.reduce((a,x)=>x.rate>a.rate?x:a, list[0]);
  const low  = list.reduce((a,x)=>x.rate<a.rate?x:a, list[0]);
  const st0 = dayStat(endDate);

  return `
    <div class="legend">
      <span><i class="sw rb-room"></i>룸 ${st0.roomSeats}개</span>
      <span><i class="sw rb-hall"></i>홀 ${st0.hallSeats}테이블</span>
      <span><i class="sw ln total"></i>전체 예약률</span>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="예약률 추이">
      ${grid}${bars}
      <polyline class="line-total" points="${pts}"/>${dots}
      ${labels}
    </svg>
    <div class="chart-sum">
      <span>평균 <b>${avg}%</b></span>
      <span>최고 <b>${peak.rate}%</b> (${dateLabel(peak.date)})</span>
      <span>최저 <b>${low.rate}%</b> (${dateLabel(low.date)})</span>
      <span class="muted">노쇼·취소는 빠진 값입니다</span>
    </div>`;
}

  /* 꼬리표 묶음 — 상태(취소/방문/노쇼)와 오늘 변동 표시까지 한 칸에. 비어 있으면 칸 자체를 안 그립니다(폰에서 빈 줄 방지) */
  const rest = pills
    + (r.status!=="확정"?`<span class="rr-st tag ${r.status==="노쇼"?"rust":""}">${r.status}</span>`:"")
    + (()=>{ const c=changeTag(r); return c?`<span class="chg-tag ${c.kind==="취소"||c.kind==="노쇼"?"off":""}">${esc(c.label)}</span>`:""; })();

      <span class="rr-n">${esc(r.name)}</span>
      <span class="rr-p">${pplOf(r)}명${r.infants?`(유아${r.infants})`:""}</span>
      <span class="rr-seat ${room||r.tentativeRoomId?'':'none'}">${esc(seat)}</span>
      <span class="rr-ph">${esc(r.phone||"-")}</span>
      ${rest?`<span class="rr-rest">${rest}</span>`:""}
    </button>`;
}

/* ============================================================
   변동 이력 — 사장님의 '파란 글씨' 습관을 옮긴 것

   수기 장부에서는 나중에 바뀐 예약을 파란 펜으로 표시했습니다.
   장부 원본을 고칠 수 없으니 "이 줄은 검정 그대로 믿지 마라"는 표시였습니다.
   화면은 항상 최신값을 보여주므로 그 문제 자체는 없지만,
   **아직 최신이 아닌 곳**이 남아 있습니다 — 주방에 구두로 넘긴 코스 수량,
   직원이 머리로 기억하는 자리 배치.
   그래서 "값"이 아니라 "무엇이 언제 바뀌었는지"를 남깁니다.

   표시 조건은 **방문일 당일에 일어난 변동**입니다.
   어제 미리 바꾼 것은 오늘 아침에 이미 반영돼 있으므로 제외합니다.
   날짜가 넘어가면 자연히 정리되므로 따로 지우는 동작이 필요 없습니다.
   ============================================================ */

/* 변동으로 볼 항목. 여기 없는 것(예약경로 등)은 기록하지 않습니다 —
   손님 응대나 자리 배치에 영향이 없어 표시하면 소음만 됩니다. */
var CHANGE_FIELDS = [
  {k:"date",     n:"날짜",   f:function(v){ return v ? dateLabel(v) : "-"; }},
  {k:"time",     n:"시간",   f:function(v){ return v ? hm(v) : "-"; }},
  {k:"people",   n:"인원",   f:function(v){ return (v||0)+"명"; }},
  {k:"infants",  n:"유아",   f:function(v){ return (v||0)+"명"; }},
  {k:"chairs",   n:"유아의자", f:function(v){ return (v||0)+"개"; }},
  {k:"roomId",   n:"좌석",   f:function(v){ return v ? seatLabel(v) : "미배정"; }},
  {k:"menuType", n:"식사",   f:function(v){ return v || "-"; }},
  {k:"request",  n:"요청",   f:function(v){ return v || "없음"; }},
  {k:"allergy",  n:"알러지", f:function(v){ return v || "없음"; }},
  {k:"memo",     n:"메모",   f:function(v){ return v || "없음"; }}
];

/* 두 예약을 비교해 바뀐 항목만 뽑습니다 */
function diffRes(a, b){
  var out = [], i;
  for(i=0;i<CHANGE_FIELDS.length;i++){
    var c = CHANGE_FIELDS[i];
    var x = a ? a[c.k] : undefined, y = b ? b[c.k] : undefined;
    if((x||"") === (y||"")) continue;
    if((x||0) === (y||0) && typeof x !== "string") continue;
    out.push({n:c.n, a:c.f(x), b:c.f(y)});
  }
  /* 코스는 개수 묶음이라 따로 비교합니다 */
  var ca = courseSummary(a && a.courses) || (a && a.courseUndecided ? "미정" : "");
  var cb = courseSummary(b && b.courses) || (b && b.courseUndecided ? "미정" : "");
  if(ca !== cb) out.push({n:"코스", a:ca||"없음", b:cb||"없음"});
  return out;
}

/* 이력 한 줄을 남깁니다. on 은 '그날 날짜'(현지 기준) — at 만 쓰면 시차 때문에 어긋납니다 */
function addChange(rec, kind, items){
  if(!rec) return rec;
  var log = (rec.changes || []).slice();
  log.push({ on: todayStr(), at: new Date().toISOString(), kind: kind, items: items || [] });
  if(log.length > 40) log = log.slice(-40);   /* 한 예약이 무한정 커지지 않게 */
  rec.changes = log;
  touch(rec);
  return rec;
}

/* 방문일 당일에 일어난 변동만. 등록은 '그날 받은 당일 예약'일 때만 포함합니다 */
function todayChanges(r){
  var log = r.changes || [], out = [], i;
  for(i=0;i<log.length;i++){
    if(log[i].on !== r.date) continue;
    out.push(log[i]);
  }
  return out;
}
/* 목록·타임라인에 붙일 짧은 표시. 없으면 null */
function changeTag(r){
  var cs = todayChanges(r);
  if(!cs.length) return null;
  var kinds = {}, items = {}, i, j;
  for(i=0;i<cs.length;i++){
    kinds[cs[i].kind] = 1;
    for(j=0;j<(cs[i].items||[]).length;j++) items[cs[i].items[j].n] = 1;
  }
  /* 취소·노쇼가 가장 중요합니다 — 자리를 비워야 하는 건이라. 단, 그 뒤에 다시 확정으로 되돌렸으면(상태 변경) 취소가 아닙니다 */
  var lastStatus = null;
  for(i=0;i<cs.length;i++){
    if(cs[i].kind==="취소" || cs[i].kind==="노쇼") lastStatus = cs[i].kind;
    else if(cs[i].kind==="변경" && (cs[i].items||[]).some(function(x){ return x.n==="상태"; })) lastStatus = null;
  }
  var kind = lastStatus ? lastStatus : kinds["등록"] ? "신규" : "변경";
  var names = Object.keys(items);
  /* 상태 태그(취소/노쇼)가 이미 옆에 붙으므로 '오늘' 을 넣어 구분합니다.
     지난주에 취소된 건과 오늘 취소된 건은 대응이 완전히 다릅니다. */
  var label = kind==="취소" ? "오늘 취소"
            : kind==="노쇼" ? "오늘 노쇼"
            : kind==="신규" ? "당일 접수"
            : "변경" + (names.length ? " · " + names.join("·") : "");
  return { kind: kind, fields: names, label: label };
}
/* 예약 상세에 펼쳐 보여줄 전체 이력 (그날 것만, 최근이 위로) */
function changeLines(r){
  var cs = todayChanges(r).slice().reverse(), out = [], i, j;
  for(i=0;i<cs.length;i++){
    /* at 은 UTC(ISO)라 그대로 잘라 쓰면 9시간이 어긋납니다.
       Date 로 되돌려 현지(한국) 시각으로 찍습니다. */
    var c = cs[i], d = c.at ? new Date(c.at) : null;
    var t = d && !isNaN(d) ? pad(d.getHours())+":"+pad(d.getMinutes()) : "";
    if(c.kind === "등록"){ out.push({t:t, s:"예약 접수"}); continue; }
    if(c.kind === "취소"){ out.push({t:t, s:"예약 취소"}); continue; }
    if(c.kind === "노쇼"){ out.push({t:t, s:"노쇼 처리"}); continue; }
    if(!(c.items||[]).length){ out.push({t:t, s:"수정"}); continue; }
    for(j=0;j<c.items.length;j++)
      out.push({t:t, s:c.items[j].n + " " + c.items[j].a + " → " + c.items[j].b});
  }
  return out;
}

/* ============================================================
   문자 안내 — ※ 지금은 흉내만 냅니다 (실제로 발송되지 않습니다)

   [왜 흉내로 두는가]
   문자를 실제로 보내려면 문자 발송 업체(알리고·솔라피 등)에 가입해서
   발신번호를 등록하고(통신사 사전등록 필요), 건당 요금을 내고, 그 업체 서버를
   호출해야 합니다. 브라우저에서 직접 못 보냅니다 — 열쇠(API 키)가 노출되니까요.
   그래서 **화면과 문안, 언제 나갈지를 먼저 확정**하고 발송만 나중에 붙입니다.
   실제로 붙일 때 고칠 곳은 smsSend() 한 곳뿐입니다.

   [언제 나가나]
   1. 접수 문자 — 예약을 등록한 즉시 1회
   2. 재안내 문자 — 설정한 시점에 1회 (기본: 전날 오후 5시)
      · 2일 전 / 1일 전 : 오전 9시 ~ 오후 7시, 1시간 단위
      · 당일          : 오전 9시 ~ 오전 11시, 1시간 단위
      · 재안내 시각이 **이미 지난 뒤에 접수된 예약은 재안내가 나가지 않습니다.**
        (전날 5시가 기준인데 당일 저녁 예약을 오후 6시에 받으면 보낼 시점이 없습니다)
      · 며칠 전이냐에 따라 문구가 달라집니다 — 모레 / 내일 / 오늘
   ============================================================ */
/* SMS_DEFAULT 는 DEFAULT_DATA 보다 위에 있습니다 (아래 주석 참고) */
/* st 를 넘기면 그 매장 기준으로 봅니다.
   생략하면 지금 보고 있는 매장 — 화면에서 부를 때는 이쪽입니다.
   ※ 매장을 고르기 전(앱 켜자마자)에는 store() 가 없으므로,
      smsTick() 처럼 매장 밖에서 도는 코드는 반드시 st 를 넘겨야 합니다. */
function smsCfg(st){
  var s = st || store();
  return { ...SMS_DEFAULT, ...((s && s.settings && s.settings.sms) || {}) };
}
/* 재안내 시점으로 고를 수 있는 시각. 당일은 오전만 — 저녁 예약 손님이
   오후에 "오늘 예약이십니다" 를 받아도 이미 늦습니다. */
function remindHours(offset){
  var out = [], h, last = (offset === 0) ? 11 : 19;
  for(h = 9; h <= last; h++) out.push(h);
  return out;
}
function offsetLabel(o){ return o === 2 ? "2일 전" : o === 1 ? "1일 전 (전날)" : "당일 아침"; }
/* 문자 안에 들어갈 말 — '설정값'이 아니라 '보내는 날과 예약일의 실제 차이'로 정합니다.
   앱이 꺼져 있어 뒤늦게 나가는 경우(전날 5시에 못 보내고 당일 아침에 나감)에
   설정값만 보면 "내일 예약입니다"라고 잘못 나갑니다. 손님이 날짜를 착각하게 됩니다. */
function smsGapWord(r){
  var d1 = new Date(r.date + "T00:00:00"), d0 = new Date(todayStr() + "T00:00:00");
  if(isNaN(d1)) return null;
  var g = Math.round((d1 - d0) / 86400000);
  return g < 0 ? null : g === 0 ? "오늘" : g === 1 ? "내일" : g === 2 ? "모레" : g + "일 뒤";
}

/* 재안내가 나갈 시각 (Date). 설정이 꺼져 있어도 계산은 합니다 — 미리보기에 씁니다 */
function remindAt(r, st){
  var c = smsCfg(st);
  if(!r || !r.date) return null;
  var d = new Date(shiftDate(r.date, -c.remindOffset) + "T00:00:00");
  if(isNaN(d)) return null;
  d.setHours(c.remindHour, 0, 0, 0);
  return d;
}
function smsFind(r, kind){
  var log = (r && r.sms) || [], i;
  for(i = log.length - 1; i >= 0; i--) if(log[i].kind === kind) return log[i];
  return null;
}
/* 재안내 문자의 현재 상태. state 하나로 화면·발송이 같은 판단을 쓰게 합니다 */
function remindState(r, st){
  var c = smsCfg(st), at = remindAt(r, st), sent = smsFind(r, "재안내");
  if(sent) return { state:"보냄", at:at, rec:sent };
  if(!c.on) return { state:"꺼짐", at:at };
  if(!(r.phone || "").trim()) return { state:"번호없음", at:at };
  if(r.status === "취소" || r.status === "노쇼") return { state:"제외", at:at };
  if(!at) return { state:"제외", at:null };
  /* 이미 오신 손님(방문)·시작 시각이 지난 예약에는 보내지 않습니다 — 지금은 흉내지만 실발송을 붙이면 그대로 나갑니다(점검 R6) */
  if(r.status === "방문") return { state:"제외", at:at };
  if(r.date < todayStr() || (r.date === todayStr() && toMin(r.time) < new Date().getHours()*60 + new Date().getMinutes())) return { state:"제외", at:at };
  /* 접수 시각이 재안내 시각보다 늦으면 보낼 시점이 이미 지났습니다 */
  var made = r.createdAt ? new Date(r.createdAt) : null;
  if(made && !isNaN(made) && made.getTime() > at.getTime())
    return { state:"늦은접수", at:at };
  return { state: at.getTime() <= Date.now() ? "발송대기" : "예정", at:at };
}
/* 상태를 사람이 읽는 한 줄로 */
function remindWhy(st){
  return st.state === "꺼짐"     ? "문자 안내가 꺼져 있습니다"
       : st.state === "번호없음" ? "전화번호가 없어 보낼 수 없습니다"
       : st.state === "제외"     ? "취소·노쇼·이미 오신 손님이거나 시각이 지나 보내지 않습니다"
       : st.state === "늦은접수" ? "재안내 시각이 지난 뒤에 접수돼 나가지 않습니다"
       : "";
}

/* ---------- 문안 ---------- */
function smsWhen(r){
  var d = new Date(r.date + "T00:00:00");
  var dow = ["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일(" + dow + ") " + hm(r.time);
}
/* seatLabel() 은 '지금 보고 있는 매장'(store())을 씁니다.
   문자는 매장을 고르기 전에도 만들어질 수 있어서(smsTick) 여기서는 직접 찾습니다. */
/* '4명' / 유아가 있으면 '4명(유아 1명 포함)'. 유아가 없으면 괄호를 아예 안 씁니다 */
function smsPpl(r){
  var inf = r.infants || 0;
  return pplOf(r) + "명" + (inf > 0 ? "(유아 " + inf + "명 포함)" : "");
}
function smsSeat(r, st){
  if(!r.roomId) return "";
  var rooms = ((st || store() || {}).settings || {}).rooms || [];
  var room = null, i;
  for(i = 0; i < rooms.length; i++) if(rooms[i].id === r.roomId) room = rooms[i];
  if(!room) return "";
  return room.type === "room" ? room.name + " 룸" : room.name;
}
/* kind: "접수" | "재안내". 재안내는 offset 을 넘겨 문구를 바꿉니다 */
function smsText(r, kind, offset, st){
  var c = smsCfg(st), s = st || store();
  var who = [ (r.name || "") + " 님", smsWhen(r), smsPpl(r) ];
  var lines;
  if(kind === "접수"){
    lines = [
      "[ 예약 완료 안내 ]", "",
      "안녕하세요, " + s.name + "입니다.",
      "예약확인 문자 드립니다.", ""
    ].concat(who).concat([ "", "예약해주셔서 감사합니다." ]);
  }else{
    /* '오늘 / 내일 / 모레' 는 설정값이 아니라 보내는 날과 예약일의 실제 차이로 정합니다 */
    var word = smsGapWord(r);
    lines = [
      "[ 예약 방문 안내 ]", "",
      (word ? word + " " : "") + "예약 방문 안내드립니다.", ""
    ].concat(who);
    var park = (c.parkingNote || "").trim();
    if(park) lines = lines.concat([ "", park ]);
    lines = lines.concat([
      "", "시간 변경이 필요하시면 미리 연락 주시기 바랍니다.",
      "", "감사합니다."
    ]);
  }
  return lines.join("\n");
}

/* ---------- 발송 (흉내) ----------
   실제로 붙일 때는 이 함수 안에서 발송 업체 API 를 부르면 됩니다.
   나머지 코드는 손댈 필요가 없습니다. */
function smsSend(r, kind, offset, resent, st){
  var c = smsCfg(st);
  if(!r) return null;
  var rec = {
    kind: kind,
    at: new Date().toISOString(),
    to: (r.phone || "").trim(),
    offset: kind === "재안내" ? (offset != null ? offset : c.remindOffset) : null,
    text: smsText(r, kind, offset, st),
    resent: !!resent,
    mock: true                    /* 진짜로 나간 게 아니라는 표시 */
  };
  r.sms = (r.sms || []).concat([rec]);
  if(r.sms.length > 30) r.sms = r.sms.slice(-30);
  touch(r);
  return rec;
}

/* 재안내 시각이 지난 예약을 훑어 '보냄'으로 바꿉니다.
   실제 서비스라면 서버가 할 일입니다. 여기서는 화면이 열려 있을 때만 돕니다.
   지난 날짜는 건드리지 않습니다 — 예시 데이터 수백 건에 기록이 쌓이면 지저분해집니다. */
function smsTick(){
  var today = todayStr(), n = 0, keys = DATA ? Object.keys(DATA) : [], k, i;
  for(k = 0; k < keys.length; k++){
    var s = DATA[keys[k]];
    /* _auth·_logs 같은 내부 항목은 매장이 아닙니다 */
    if(!s || !s.settings || !s.reservations) continue;
    var c = smsCfg(s);
    if(!c.on) continue;
    for(i = 0; i < s.reservations.length; i++){
      var r = s.reservations[i];
      if(r.date < today) continue;
      if(remindState(r, s).state !== "발송대기") continue;
      smsSend(r, "재안내", c.remindOffset, false, s);
      n++;
    }
  }
  if(n) saveData();
  return n;
}
/* 매장 전체의 보낸 문자 — 최근 것부터 */
function smsLog(){
  var s = store(), out = [], i, j;
  for(i = 0; i < s.reservations.length; i++){
    var r = s.reservations[i], log = r.sms || [];
    for(j = 0; j < log.length; j++) out.push({ r:r, m:log[j] });
  }
  out.sort(function(a, b){ return a.m.at < b.m.at ? 1 : a.m.at > b.m.at ? -1 : 0; });
  return out;
}

/* 예약 한 건의 경고 사유 — 지표와 목록에서 함께 씁니다 */
function resWarn(r){
  const st = store().settings;
  const out = [];
  const h = hoursFor(r.date);
  if(h.closed) out.push("휴무일 예약");
  else{
    if(inBreak(r.date, r.time)) out.push("브레이크타임");
    if(toMin(r.time) < toMin(h.open) || toMin(r.time) >= toMin(h.close)) out.push("영업시간 밖");
    else if(toMin(r.time) > lastBookMin(r.date, r.time)) out.push("접수 마감 이후");
    else if(h.lo && toMin(r.time) > toMin(h.lo)) out.push("라스트오더 이후");
    if(toMin(r.time) + stayOf(r) > toMin(h.close)) out.push("마감 넘김");
  }
  const seat = st.rooms.find(x=>x.id===r.roomId);
  const ids = r.roomId ? [r.roomId].concat(r.extraIds||[]) : [];
  if(seat && resBlocked(r)) out.push("사용 중지 좌석");
  if(seat){
    /* 룸·테이블 모두: 묶음(합침 포함)의 최대·최소로 판단. 테이블은 최소가 없고(여포만 4), 정원 초과만 봅니다 */
    if(pplOf(r) > seatsMax(ids)) out.push("정원 초과");
    else if(adultCount(pplOf(r), r.infants) < seatsMin(ids)) out.push("최소 인원 미달");
    if(ids.length > 1 && joinOf(ids) && /원탁/.test(joinOf(ids).note||"")) out.push("원탁 합침 · 손님 확인");
  }
  if((r.infants||0) >= pplOf(r) && pplOf(r)>0) out.push("성인 없음");
  /* 테이블 예약(층): 숨은 배정 결과로 — 자리가 아예 없으면, 붙일 수 없어 나눠 앉으면 */
  if(!seat && isTablePref(r.seatPref) && r.status!=="취소"){
    if(!r.tentativeRoomId) out.push("테이블 자리 없음");
    else if(r.tentativeSplit) out.push("나눠 앉음");
  }
  if(seat && seat.type==="room"){
    const cn = Object.values(r.courses||{}).reduce((a,b)=>a+b,0);
    const ad = adultCount(pplOf(r), r.infants);
    if(r.menuType==="해당 없음") out.push("룸·코스 아님");
    else if(r.menuType==="확인 필요") out.push("코스 미확정");
    else if(r.menuType==="코스" && !r.courseUndecided && cn>0 && cn<ad) out.push("코스 인원 부족");
  }
  if((r.chairs||0) > (r.infants||0)) out.push("유아의자 초과");
  /* 겹쳐 받은 룸은 접수 뒤에도 계속 보여야 합니다.
     막지 않고 받는 대신(설계 5.2), 취소를 깜빡한 예약이 남아 있는 경우를
     '확인 필요'에서 나중에라도 잡아낼 수 있게 합니다. */
  if(seat && r.roomId && r.status!=="취소"){
    if(ids.some(id=>roomStatus(r.date, r.time, id, r.id).hits.length)) out.push("좌석 겹침");
  }
  return out;
}

/* 손이 가야 할 것만 모읍니다. 각 줄은 눌러서 바로 처리할 수 있습니다. */
function checkItems(date){
  const s = store(), today = todayStr();
  const d = date || today;
  const list = s.reservations.filter(r=>r.date===d && r.status==="확정");
  const items = [];

  const un = list.filter(r=>!r.roomId);
  if(un.length) items.push(["amber", `좌석 미배정 ${un.length}건`,
    un.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openUnassigned()`]);

  const allergy = list.filter(r=>r.allergy);
  if(allergy.length) items.push(["rust", `알러지 확인 ${allergy.length}건`,
    allergy.slice(0,2).map(r=>`${r.time} ${r.name} · ${r.allergy}`).join(" / "), `openPick('allergy')`]);

  const chairs = list.filter(r=>r.chairs>0);
  const chairSum = chairs.reduce((a,r)=>a+(r.chairs||0),0);
  if(chairSum) items.push(["pine", `유아용 의자 ${chairSum}개 준비`,
    chairs.slice(0,3).map(r=>`${r.time} ${r.name} ${r.chairs}개`).join(", "), `openPick('chairs')`]);

  const gsize = s.settings.groupSize || 8;
  const group = list.filter(r=>pplOf(r) >= gsize);
  if(group.length) items.push(["pine", `단체 손님 ${group.length}건`,
    group.slice(0,3).map(r=>`${r.time} ${r.name} ${pplOf(r)}명`).join(", "), `openPick('group')`]);

  const menuChk = list.filter(r=>r.menuType==="확인 필요");
  if(menuChk.length) items.push(["amber", `메뉴 확인 필요 ${menuChk.length}건`,
    menuChk.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openPick('menu')`]);

  /* 취소·노쇼도 '자리를 비워야 하는 변동'이라 확정 목록이 아닌 그날 전체에서 셉니다 */
  const chg = s.reservations.filter(r=>r.date===d && changeTag(r));
  if(chg.length) items.push(["blue", `오늘 변동 ${chg.length}건`,
    chg.slice(0,3).map(r=>`${hm(r.time)} ${r.name} ${changeTag(r).kind}`).join(", "), `openPick('changed')`]);

  const ns = list.filter(r=>noshowOf(r.phone));
  if(ns.length) items.push(["rust", `노쇼 이력 손님 ${ns.length}건`,
    ns.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openPick('noshow')`]);

  if(d===today){
    const y = shiftDate(today,-1);
    const yAll = s.reservations.filter(r=>r.date===y && r.status!=="취소").length;
    const auto = autoClosedList(y);
    if(auto.length) items.push(["", `어제 예약 ${yAll}건 중 ${auto.length}건 자동 방문 처리`,
      "노쇼·취소가 있었다면 눌러서 수정하세요", `openPick('auto')`]);
  }

  return items;
}
function openCheck(){ view.form={type:"check"}; render(); }
function sheetCheck(){
  const items = checkItems(view.date);
  const body = items.length
    ? `<div class="alerts">${items.map(([c,t,sub,act])=>`
        <button class="alert ${c}" onclick="${act}">
          <span class="a-t">${esc(t)}</span>
          ${sub?`<span class="a-s">${esc(sub)}</span>`:""}
          <span class="a-go">&rsaquo;</span>
        </button>`).join("")}</div>`
    : `<div class="empty">지금 확인할 항목이 없습니다.</div>`;
  return `
    ${sheetHead(`확인 필요 · ${dateLabel(view.date)}`)}
    <div class="checkbox-scroll">${body}</div>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}

/* 확인 필요 항목을 눌렀을 때 뜨는 목록 */
function openPick(kind){ view.form={type:"pick", kind}; render(); }
function sheetPick(){
  const s = store(), d = view.date, today = todayStr();
  const kind = view.form.kind;
  const conf = {
    allergy:{title:"알러지 확인", pick:r=>r.allergy, note:"주방에 전달됐는지 확인하세요."},
    chairs:{title:"유아용 의자", pick:r=>r.chairs>0, note:"의자 개수를 미리 준비하세요."},
    menu:{title:"메뉴 확인 필요", pick:r=>r.menuType==="확인 필요", note:"방문 전 연락해 코스를 확정하세요."},
    noshow:{title:"노쇼 이력 손님", pick:r=>!!noshowOf(r.phone), note:"확인 전화를 돌리면 노쇼가 줄어듭니다."},
    warn:{title:"경고 예약", pick:r=>resWarn(r).length>0, note:"사장 판단으로 접수된 예약입니다. 문제가 없는지 확인하세요."},
    changed:{title:"오늘 변동", pick:r=>!!changeTag(r),
             note:"오늘 안에 바뀐 예약입니다. 주방에 이미 전달한 내용이 있다면 다시 알려주세요."},
    group:{title:"단체 손님", pick:r=>pplOf(r) >= (store().settings.groupSize||8),
           note:"상차림과 인력 배치를 미리 준비하세요. 기준 인원은 설정에서 바꿀 수 있습니다."},
    auto:{title:"어제 자동 방문 처리", pick:null, note:""}
  }[kind];
  const list = kind==="auto"
    ? autoClosedList(shiftDate(today,-1))
    : s.reservations.filter(r=>r.date===d && (kind==="changed" || r.status==="확정") && conf.pick(r))
        .sort((a,b)=>a.time.localeCompare(b.time));
  const rows = list.length ? list.map(r=>`
    <button class="rowitem tap" onclick="openMark('${r.id}')">
      <span class="time-col">${esc(r.time)}</span>
      <span class="grow"><span class="t">${esc(r.name)}</span>
        <span class="s">${pplText(r)}${r.phone?` · ${esc(r.phone)}`:""}${
          kind==="allergy"&&r.allergy?` · ${esc(r.allergy)}`:""}${
          kind==="chairs"?` · 의자 ${r.chairs}개`:""}${
          kind==="noshow"&&noshowOf(r.phone)?` · 노쇼 ${noshowOf(r.phone).count}회`:""}${
          kind==="warn"?` · ${resWarn(r).join(", ")}`:""}${
          kind==="group"&&r.menuType==="코스"?` · 코스`:""}</span></span>
      <span class="tag ${r.roomId?'pine':'rust'}">${r.roomId?esc(resSeatLabel(r)):"미배정"}</span>
    </button>`).join("") : `<div class="empty">해당 예약이 없습니다.</div>`;
  return `
    ${sheetHead(`${conf.title} · ${kind==="auto"?dateLabel(shiftDate(today,-1)):dateLabel(d)}`)}
    <div class="card" style="margin-bottom:12px">${rows}</div>
    <p class="f-note">${conf.note}</p>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}

/* ============================================================
   좌석 가동 타임라인
   룸: 한 줄에 예약 블록
   홀: 테이블 수만큼 층을 만들고, 먼저 온 팀부터 아래층에 배치
       (한 팀이 테이블 2개를 쓰면 두 층을 차지)
   ============================================================ */
function laneLayout(items, laneCount){
  /* 시간 순으로 훑으며 비어 있는 가장 아래 층에 배치 */
  const laneEnd = new Array(laneCount).fill(-1);
  const placed = [];
  for(const it of items){
    let start = -1;
    for(let i=0; i+it.need<=laneCount; i++){
      let ok = true;
      for(let k=i;k<i+it.need;k++) if(laneEnd[k] > it.s0){ ok=false; break; }
      if(ok){ start=i; break; }
    }
    if(start<0){ placed.push({...it, lane:null, over:true}); continue; }
    for(let k=start;k<start+it.need;k++) laneEnd[k] = it.e0;
    placed.push({...it, lane:start});
  }
  return placed;
}
function renderTimeline(date, compact){
  const s = store(), st = s.settings;
  const ax = axisRange();                       /* 가장 넓은 영업시간 = 가로축 */
  const o = ax.o, c = ax.c, span = c - o;
  const dh = hoursFor(date);                    /* 그날 실제 운영시간 */
  const dOpen = toMin(dh.open), dClose = toMin(dh.close);
  const list = s.reservations.filter(r=>r.date===date && holdsSeat(r));
  const pos = m => ((m-o)/span)*100;
  /* 영업 전·후, 브레이크타임을 덮는 층 */
  const shade = `
    ${dh.closed?`<span class="closed-band"></span>`:`
      ${dOpen>o?`<span class="offband" style="left:0; width:${pos(dOpen)}%"></span>`:""}
      ${dClose<c?`<span class="offband" style="left:${pos(dClose)}%; right:0"></span>`:""}
      ${dh.bs&&dh.be?`<span class="breakband" style="left:${pos(toMin(dh.bs))}%; width:${((toMin(dh.be)-toMin(dh.bs))/span)*100}%"></span>`:""}
    `}`;
  const LANE = compact ? 26 : 21;   /* 층 하나의 높이(px). 폰 압축판은 손가락 크기로 조금 높게 */
  const MAX_LANES = 4;   /* 룸 한 줄이 너무 두꺼워지지 않게. 넘치면 '초과 N' 으로 알림 */

  const ticks = [];
  for(let m=Math.ceil(o/60)*60; m<=c; m+=60)
    ticks.push(`<span class="tk" style="left:${pos(m)}%"><i></i><b>${Math.floor(m/60)}</b></span>`);
  const layers = ticks.join("") + shade;
  /* 현재 시각 선.
     예전에는 그래프 범위(o~c)를 벗어나면 선을 아예 안 그렸습니다.
     그러면 개점 전이나 마감 후에 선이 사라져서 "지금이 어디쯤인지" 감이 끊깁니다.
     범위를 벗어나면 가까운 쪽 끝에 붙여 두고, 붙어 있다는 걸 알 수 있게
     점선으로 바꿉니다(.edge). 선이 있는 편이 없는 것보다 읽기 쉽습니다. */
  const nowM = toMin(nowHM());
  const isToday = date===todayStr();
  const nowClamped = Math.min(c, Math.max(o, nowM));
  const nowLine = isToday
    ? `<span class="nowline ${nowM<o?'edge before':nowM>c?'edge after':''}"
             style="left:${pos(nowClamped)}%"
             title="${nowM<o?`아직 그래프 시작(${hm(minToHM(o))}) 전입니다`
                    :nowM>c?`그래프 끝(${hm(minToHM(c))})을 지났습니다`
                    :`지금 ${hm(nowHM())}`}"></span>` : "";

  const blockLabel = r =>
    `<b>${esc(r.time)}</b> ${esc(r.name)} ${pplOf(r)}명${r.infants?`(유아${r.infants})`:""}`;

  /* 좌석 이름 칸에 붙는 사용 중지 요약 — 빗금 위 글자가 예약에 가려도 여기서는 보입니다 */
  const blockTag = (seat)=>{
    const sp = blockSpans(seat, date);
    if(!sp.length) return "";
    /* 자세한 시각·사유는 그래프 위 빗금에 적혀 있으므로 여기는 짧게만 */
    const txt = sp.length>1 ? `중지 ${sp.length}구간`
              : (sp[0].allDay ? "하루 중지" : "일부 중지");
    const tip = sp.map(x=>spanLabel(x)+(x.note?` · ${x.note}`:"")).join(" / ");
    return `<span class="bk" title="사용 중지 · ${esc(tip)}">${esc(txt)}</span>`;
  };

  /* 좌석 사용 중지 구간을 그 줄에만 덮습니다.
     영업시간 밖(.offband)과 같은 빗금 계열이되, 사람이 일부러 잠근 것이므로 더 진하게. */
  /* 빗금만 그리고 글자는 넣지 않습니다 — 예약 블록과 겹쳐 서로 안 읽힙니다.
     무슨 사유인지는 좌석 이름 칸의 표시와 마우스를 올렸을 때 나옵니다. */
  const blockBands = (seat)=>blockSpans(seat, date).map(sp=>{
    const s = Math.max(o, sp.s), e = Math.min(c, sp.e);
    if(e <= s) return "";
    return `<span class="blockband" style="left:${pos(s)}%; width:${((e-s)/span)*100}%"
      title="사용 중지 · ${esc(spanLabel(sp))}${sp.note?` · ${esc(sp.note)}`:""}"></span>`;
  }).join("");

  /* ---------- 룸 ---------- */
  /* 룸이든 테이블이든 좌석 하나 = 한 줄. 합쳐 쓰는 예약은 관련된 줄마다 블록이 그려지고 '+' 표시가 붙습니다 */
  const roomRow = (room)=>{
    const items = list.filter(r=>usesSeat(r, room.id))
      .sort((a,b)=>a.time.localeCompare(b.time))
      .map(r=>({ r, need:1, s0:toMin(r.time), e0:Math.min(c, toMin(r.time)+stayOf(r)), joined:seatsOf(r).length>1 }));
    /* 사장 판단으로 겹치게 받은 경우가 있으므로 층을 유동적으로.
       ※ 예전에는 겹치기만 하면 무조건 2층이라, 같은 시간에 3건이 들어오면
          세 번째가 첫 번째 뒤에 완전히 가려져 화면에서 사라졌습니다.
          실제로 동시에 겹치는 최대 건수만큼 층을 만듭니다. */
    let lanes = 1;
    for(const a of items){
      let k = 0;
      for(const b of items) if(a.s0 < b.e0 && b.s0 < a.e0) k++;   /* 자기 자신 포함 */
      if(k > lanes) lanes = k;
    }
    if(lanes > MAX_LANES) lanes = MAX_LANES;   /* 그 이상은 '초과'로 알립니다 */
    const placed = laneLayout(items, lanes);
    const over = placed.filter(x=>x.lane===null).length;
    const blocks = placed.map(it=>{
      const w = ((it.e0-it.s0)/span)*100;
      const tent = !it.r.roomId;
      const past = isBlockPast(it.r, it.s0, date, nowM);
      const lane = it.lane===null?0:it.lane;
      const bad = resWarn(it.r).length>0;
      const chg = changeTag(it.r);
      return `<button class="blk ${tent?'tent':''} ${bad?'warned':''} ${past?'past':''} ${chg?'changed':''} ${it.joined?'joined':''}" onclick="openMark('${it.r.id}')"
        style="left:${pos(it.s0)}%; width:${w}%; bottom:${lane*LANE+1}px; height:${LANE-2}px"
        title="${esc(it.r.time)} ${esc(it.r.name)} ${pplText(it.r)}${it.joined?` · ${esc(it.r.roomId?resSeatLabel(it.r):resTentLabel(it.r))} 합침`:""}${tent?' · 잠정':''}${chg?` · 오늘 ${esc(chg.label)}`:""}${bad?` · 경고: ${esc(resWarn(it.r).join(", "))}`:""}">
        ${it.joined?'<i class="jn">⊕</i>':''}${chg?`<span class="chg-chip">${blockLabel(it.r)}</span>`:blockLabel(it.r)}</button>`;
    }).join("");
    const used = items.reduce((a,x)=>a+(x.e0-x.s0),0);
    const rate = Math.min(100, Math.round(used/span*100));
    const sub = isTable(room) ? `${roomMin(room)?roomMin(room)+"~":""}${seatMax(room)}인` : `${roomMin(room)}~${room.capacity}인`;
    return `<div class="tl-row ${isTable(room)?'tbl':''} ${blockedAllDay(room,date)?'off-seat':''}">
      <div class="tl-name"><b>${esc(room.name)}</b><small>${sub}</small>${blockTag(room)}</div>
      <div class="tl-track" style="height:${lanes*LANE}px">
        ${layers}${blockBands(room)}${blocks}${nowLine}
      </div>
      <div class="tl-rate" style="height:${lanes*LANE}px">${lanes>1
        ? `<span class="rb"><i></i><b>${rate}%</b><i></i></span>`
        : `<span class="rt">${rate}%</span>`}${over?`<small class="over">초과 ${over}</small>`:""}</div>
    </div>`;
  };

  const rooms = st.rooms.filter(isRoom);
  const groupRow = (label) => `<div class="tl-row group"><div class="tl-name"><b>${esc(label)}</b></div><div class="tl-track"></div><div class="tl-rate"></div></div>`;
  /* 테이블은 층 한 줄 — 겹치는 예약을 층(lane)으로 쌓고, 예약률은 손님 수 / 자리 수 (8차-H) */
  const floorRow = (fl)=>{
    /* 층 한 줄의 높이는 그 층 테이블 수만큼(테이블 하나 = 한 칸). 여러 테이블이 필요한 팀은 그만큼 칸을 병합해 그립니다 —
       재아 요청: 테이블이 다 보여야 직관적. 어느 테이블인지는 안 정하므로 칸의 순서에 뜻은 없고, 몇 자리 차지하는지만 보입니다 */
    const tbls = fl==null ? [] : floorTables(fl);
    /* 칸 수 = 숨은 배정(붙임·나눠 앉기 포함)이 쓰는 테이블 개수. 자리를 못 찾은 예약은 1칸 + 경고 */
    const needOf = r => Math.max(1, seatsOf(r).length);
    const items = list.filter(r=>resFloor(r) !== undefined && (resFloor(r)||"") === (fl||""))
      .sort((a,b)=>a.time.localeCompare(b.time))
      .map(r=>({ r, need:needOf(r), s0:toMin(r.time), e0:Math.min(c, toMin(r.time)+stayOf(r)) }));
    const lanes = Math.max(1, tbls.length);
    const placed = laneLayout(items.map(it=>Object.assign({}, it, {need:Math.min(it.need, lanes)})), lanes);
    const over = placed.filter(x=>x.lane===null).length;
    const seats = fl==null ? 0 : floorSeats(fl);
    const blocks = placed.map(it=>{
      const w = ((it.e0-it.s0)/span)*100, lane = it.lane===null?0:it.lane;
      const past = isBlockPast(it.r, it.s0, date, nowM);
      const bad = resWarn(it.r).length>0, chg = changeTag(it.r);
      const tn = it.r.roomId ? seatLabelIds(seatsOf(it.r)).replace(/ 테이블$/,"") : "";
      const h = (it.lane===null ? 1 : it.need) * LANE - 2;   /* 테이블 n개 → n칸 높이로 병합 */
      const split = !it.r.roomId && it.r.tentativeSplit, none = !it.r.roomId && !it.r.tentativeRoomId;
      return `<button class="blk ${bad?'warned':''} ${past?'past':''} ${chg?'changed':''} ${it.need>1?'multi':''} ${split?'split':''}" onclick="openMark('${it.r.id}')"
        style="left:${pos(it.s0)}%; width:${w}%; bottom:${lane*LANE+1}px; height:${h}px"
        title="${esc(it.r.time)} ${esc(it.r.name)} ${pplText(it.r)}${tn?` · ${esc(tn)} 테이블 지정`:""}${split?" · 나눠 앉음":""}${none?" · 자리 없음":""}${chg?` · 오늘 ${esc(chg.label)}`:""}">
        ${split?'<i class="jn">↔</i>':''}${chg?`<span class="chg-chip">${blockLabel(it.r)}</span>`:blockLabel(it.r)}${tn?` <small class="tn">${esc(tn)}</small>`:""}</button>`;
    }).join("");
    /* 예약률 = 손님·분 / 자리·분 (영업시간 안으로 자른 것) */
    const used = items.reduce((a,x)=>a+x.need*(x.e0-x.s0),0);
    const rate = tbls.length ? Math.min(100, Math.round(used/(tbls.length*span)*100)) : 0;
    const bands = fl==null ? "" : floorTables(fl).map(blockBands).join("");
    return `<div class="tl-row tbl floor">
      <div class="tl-name"><b>${fl==null?"층 미정":esc(floorLabel(fl))}</b><small>${fl==null?"":`테이블 ${tbls.length} · ${seats}석`}</small></div>
      <div class="tl-track" style="height:${lanes*LANE}px; background-image:repeating-linear-gradient(to top, transparent 0, transparent ${LANE-1}px, var(--border) ${LANE-1}px, var(--border) ${LANE}px)">${layers}${bands}${blocks}${nowLine}</div>
      <div class="tl-rate" style="height:${lanes*LANE}px">${lanes>1
        ? `<span class="rb"><i></i><b>${rate}%</b><i></i></span>` : `<span class="rt">${rate}%</span>`}${over?`<small class="over">초과 ${over}</small>`:""}</div>
    </div>`;
  };
  const unknownFloor = list.some(r=>resFloor(r) === null);
  const tableRows = groupRow("테이블") + tableFloors().map(floorRow).join("") + (unknownFloor ? floorRow(null) : "");

  /* 전체 가동률 */
  const st2 = dayStat(date);
  const roomRate = st2.roomRate, hallRate = st2.hallRate;
  const tentCount = list.filter(isUnassigned).length;

  return `
    <div class="tl-top">
      <div class="tl-kpis">
        <span class="tl-kpi">예약률 <b>${st2.rate}%</b></span>
        <span class="tl-kpi sub">룸 <b>${roomRate}%</b></span>
        <span class="tl-kpi sub">테이블 <b>${hallRate}%</b></span>
        ${(()=>{
          /* 그날 상황을 한 줄로 — 각자 뜻에 맞는 색으로 */
          const day = s.reservations.filter(x=>x.date===date);
          const live = day.filter(holdsSeat);
          const cnt = {
            미정: tentCount,
            경고: live.filter(x=>resWarn(x).length).length,
            변경: day.filter(x=>changeTag(x)).length,
            요청: live.filter(x=>(x.request||"").trim()).length,
            메모: live.filter(x=>(x.memo||"").trim()).length,
            노쇼: day.filter(x=>x.status==="노쇼").length,
            취소: day.filter(x=>x.status==="취소").length
          };
          /* 파랑 = 우리끼리 남긴 표시(변경·메모), 벽돌색 = 손이 가야 할 것 */
          const cls = {미정:"amber", 경고:"rust", 변경:"blue", 요청:"", 메모:"blue", 노쇼:"rust", 취소:""};
          const nm  = {미정:"좌석 미정", 요청:"요청사항"};
          return Object.keys(cnt).filter(k=>cnt[k])
            .map(k=>`<span class="tag ${cls[k]}">${nm[k]||k} ${cnt[k]}건</span>`).join("");
        })()}
      </div>
      <div class="tl-legends">
        <span class="tl-legend"><i class="lgsw ok"></i>확정</span>
        <span class="tl-legend"><i class="lgsw tent"></i>잠정</span>
        <span class="tl-legend"><i class="lgsw warn"></i>경고</span>
        <span class="tl-legend"><i class="lgsw chg"></i>변동</span>
      </div>
    </div>
    <div class="tl-scroll ${compact?'compact':''}" id="tl-scroll">
      <div class="tl">
        <div class="tl-row axis">
          <div class="tl-name"></div>
          <div class="tl-track">${ticks.join("")}</div>
          <div class="tl-rate"><span class="rt">예약률</span></div>
        </div>
        ${groupRow("룸")}
        ${rooms.map(roomRow).join("")}
        ${tableRows}
      </div>
    </div>`;
}

/* ============================================================
   예약
   ============================================================ */
function weekStart(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() - d.getDay());
  return todayStr(d);
}

/* 하루치 요약 — 달력 팝업과 예약 화면에서 함께 씁니다 */
function dayStat(date){
  const s = store(), st = s.settings;
  const h = hoursFor(date);
  const o = toMin(h.open), c = toMin(h.close), span = Math.max(60, c-o);
  /* 자리를 실제로 쓴 예약만 셉니다 (확정 + 방문).
     노쇼와 취소는 자리를 안 쓴 것이므로 예약률에서 빠집니다. */
  const list = s.reservations.filter(r=>r.date===date && holdsSeat(r));
  const people = list.reduce((a,r)=>a+pplOf(r),0);
  const rooms = st.rooms.filter(isRoom);
  const halls = st.rooms.filter(isTable);   /* 이름은 옛 것(hall) 그대로 — 스냅샷·호출부 호환. 뜻은 '테이블' */
  const hallT = halls.length;
  /* 지난 날짜는 그날의 좌석 수(스냅샷)로, 오늘·앞날은 현재 설정으로 (takeSnapshot 주석 참고).
     스냅샷이 없는 지난 날짜(1년 넘은 것)는 현재 설정으로 계산합니다 */
  const snap = date < todayStr() ? (s.snapshots||{})[date] : null;
  const roomN = snap ? snap.rooms : rooms.length;
  const hallN = snap ? snap.hallTables : hallT;
  /* 예약이 차지하는 시간을 영업시간 안으로 잘라서 계산합니다.
     (마감 이후 시각의 예약이 음수가 되던 문제를 막습니다) */
  const spanOf = r => {
    const s0 = Math.max(o, toMin(r.time));
    const e0 = Math.min(c, toMin(r.time) + stayOf(r));
    return Math.max(0, e0 - s0);
  };
  /* 스냅샷으로 계산하는 지난 날짜에서, 지금은 없는 룸(삭제됨)에 앉았던 예약도 룸 사용으로 셉니다 —
     현재 룸 목록에만 맞추면 그 예약이 분자에서 빠져 예약률이 낮게 나옵니다. 홀은 지우는 일이 없어 홀 목록 기준 */
  const isRoomSeat = id => rooms.some(x=>x.id===id) || (!!snap && !!id && !halls.some(x=>x.id===id));
  /* 좌석 하나 = 1 단위. 합쳐 쓰면 좌석 수만큼 */
  /* 자리를 아직 못 잡은 미정 예약(잠정도 없음)도 손님은 오므로 희망 쪽 좌석 1개로 셉니다 — 빠지면 예약률이 실제보다 낮게 보입니다(점검 R10) */
  const noSeat = r => !seatsOf(r).length && !r.roomId;
  const roomUsed = list.reduce((a,r)=>a + (noSeat(r) ? (r.seatPref==="room-any" ? 1 : 0) : seatsOf(r).filter(isRoomSeat).length) * spanOf(r), 0);
  const hallUsed = list.reduce((a,r)=>a + (noSeat(r) ? (r.seatPref==="room-any" ? 0 : 1) : seatsOf(r).filter(id=>halls.some(x=>x.id===id)).length) * spanOf(r), 0);
  /* 사용 중지(blocks)된 시간은 분모에서 뺍니다 — 룸을 잠가 둔 날 예약률이 억울하게 낮아지지 않게.
     분모가 '좌석 수 × 영업시간(분)' 이므로, 잠긴 좌석의 잠긴 시간(영업시간 안으로 자른 것)을 그만큼 뺍니다. 홀은 테이블 수만큼 */
  const blockedOf = seat => blockSpans(seat, date).reduce((a,sp)=>a+Math.max(0, Math.min(c, sp.e)-Math.max(o, sp.s)), 0);
  const roomDen = Math.max(0, roomN*span - rooms.reduce((a,r)=>a+blockedOf(r),0));
  const hallDen = Math.max(0, hallN*span - halls.reduce((a,h)=>a+blockedOf(h),0));
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const seatAll = roomN + hallN;        /* 룸 1개 = 좌석 1, 테이블 1개 = 좌석 1 */
  /* 룸만·홀만 놓고 본 비율 */
  const roomRate = roomDen ? clamp(roomUsed/roomDen*100) : 0;
  const hallRate = hallDen ? clamp(hallUsed/hallDen*100) : 0;
  /* 전체 예약률에서 각자가 차지하는 몫 — 둘을 더하면 전체가 됩니다 */
  const den = roomDen + hallDen;
  const roomShare = den ? roomUsed/den*100 : 0;
  const hallShare = den ? hallUsed/den*100 : 0;
  const total = clamp(roomShare + hallShare);
  return {count:list.length, people, roomRate, hallRate, rate:total,
          roomShare:Math.max(0,roomShare), hallShare:Math.max(0,hallShare),
          seatAll, roomSeats:roomN, hallSeats:hallN,
          unassigned:list.filter(isUnassigned).length};
}

/* ---------- 좌석 현황 (2층) ---------- */
function renderSeatBoard(date){
  const s = store(), st = s.settings;
  const list = s.reservations.filter(r=>r.date===date && r.status==="확정");
  const cell = (r)=>{
    const rows = list.filter(x=>effSeat(x)===r.id).sort((a,b)=>a.time.localeCompare(b.time));
    const tentOnly = rows.length && rows.every(x=>!x.roomId);
    const dh = hoursFor(date);
    const span = Math.max(60, toMin(dh.close)-toMin(dh.open));
    const used = rows.reduce((a,x)=>a+Math.min(stayOf(x), toMin(dh.close)-toMin(x.time)),0);
    const pct = Math.min(100,Math.round(used/span*100));
    return `<div class="sb-cell ${rows.length?(tentOnly?'tent':'used'):''}">
      <div class="sb-h"><span class="sb-n">${esc(r.name)}</span><span class="sb-r">${pct}%</span></div>
      <div class="sb-bar"><i style="width:${tentOnly?0:pct}%"></i><u style="width:${tentOnly?pct:0}%"></u></div>
      <div class="sb-s">${roomMin(r)}인~${r.capacity}인</div>
      <div class="sb-s">${rows.length?rows.map(x=>`${x.time}${x.roomId?"":"*"}`).join(", "):"예약 없음"}</div>
    </div>`;
  };
  const halls = st.rooms.filter(isTable);
  const rooms = st.rooms.filter(isRoom);
  return `
    <div class="sb-grid hall">${halls.map(cell).join("")}</div>
    <div class="sb-grid">${rooms.map(cell).join("")}</div>
    <div class="sb-note">* 표시는 좌석 미정 예약의 잠정 배정입니다.</div>`;
}

/* ---------- 달력 팝업 (월 단위) ---------- */
function openCal(){ view.calOpen = true; view.calMonth = view.date.slice(0,7); render(); }
function closeCal(){ view.calOpen = false; render(); }
function moveCalMonth(n){
  const [y,m] = view.calMonth.split("-").map(Number);
  const d = new Date(y, m-1+n, 1);
  view.calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1);
  render();
}
function pickCalDate(d, close){
  view.date = d;
  if(close) view.calOpen = false;
  render();
}
function renderCal(){
  const [y,m] = view.calMonth.split("-").map(Number);
  const lead = new Date(y,m-1,1).getDay();
  const lastDay = new Date(y,m,0).getDate();
  const today = todayStr();

  let cells = "";
  for(let i=0;i<lead;i++) cells += `<span class="cday blank"></span>`;
  for(let d=1; d<=lastDay; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    const st = dayStat(ds);
    const dow = new Date(ds+"T00:00:00").getDay();
    const cls = ["cday", ds===view.date?"sel":"", ds===today?"today":"",
                 dow===0?"sun":dow===6?"sat":""].join(" ");
    cells += `<button class="${cls}" onclick="pickCalDate('${ds}',true)">
      <span class="dn">${d}</span>
      ${st.count?`<span class="cn">${st.count}건</span>
        <span class="cbar"><i style="width:${st.rate}%"></i></span>
        <span class="cr">${st.rate}%</span>`:`<span class="cn none">-</span>`}
    </button>`;
  }
  /* 항상 6줄(42칸) — 5줄짜리 달과 6줄짜리 달을 오갈 때 높이가 바뀌어 손이 헛나갔습니다 */
  for(let i=lead+lastDay; i<42; i++) cells += `<span class="cday blank"></span>`;
  return `
    <div class="overlay" onclick="closeCal()">
      <div class="calbox" onclick="event.stopPropagation()">
        <div class="sheet-h">
          <h2>날짜 선택</h2>
          <button class="x" onclick="closeCal()" aria-label="닫기">×</button>
        </div>
        <div class="cal-nav">
          <button class="nav" onclick="moveCalMonth(-1)">◀</button>
          <div class="cal-m">${y}년 ${m}월</div>
          <button class="nav" onclick="moveCalMonth(1)">▶</button>
        </div>
        <div class="cgrid chead">${["일","월","화","수","목","금","토"].map((x,i)=>
          `<span class="chd ${i===0?'sun':i===6?'sat':''}">${x}</span>`).join("")}</div>
        <div class="cgrid">${cells}</div>
        <div class="sheet-actions">
          <button class="btn" onclick="pickCalDate('${todayStr()}',true)">오늘로</button>
          <button class="btn ghost" onclick="closeCal()">닫기</button>
        </div>
      </div>
    </div>`;
}

function setFilter(f){ view.filter=f; render(); }
function moveDate(d){ view.date=shiftDate(view.date,d); render(); }
/* 다른 날을 보다가 오늘로 한 번에 — 화살표를 여러 번 누르거나 달력을 열 필요가 없게 */
/* '오늘' 버튼 — 오늘이 아닐 때만 상단바 오른쪽(새로고침 왼쪽)에. 6차-F 에서 뺐다가 6차-K 에서 되살림, 7차-H 에서 자리·글자 조정 */
function goToday(){ view.date = todayStr(); view.calMonth = monthStr(); render(); }
/* '오늘이 아닌 날짜를 보는 중' — 상단바(.topbar.notoday)와 body.notoday 가 같은 조건을 써야 하므로 한 곳에.
   설정 탭은 날짜 개념이 없어 제외. 디스플레이·잠금·인트로는 renderApp 이 renderStore 전에 갈라져 나가므로 여기서도 빼 둡니다 */
function notodayView(){
  return !!view.storeKey && AUTHED && !view.display && !INTRO && view.tab!=="settings" && view.date!==todayStr();
}
/* 오늘 기준 가까운 날짜에 이름표 */
function dayBadge(d){
  const t = todayStr();
  if(d===t) return ' <span class="tag pine">오늘</span>';
  if(d===shiftDate(t,-1)) return ' <span class="tag near past">어제</span>';
  if(d===shiftDate(t,1)) return ' <span class="tag near">내일</span>';
  if(d===shiftDate(t,2)) return ' <span class="tag near">모레</span>';
  return "";
}
function moveMonthDate(n){
  const [y,m,dd] = view.date.split("-").map(Number);
  const last = new Date(y, m-1+n+1, 0).getDate();
  const dt = new Date(y, m-1+n, Math.min(dd,last));
  view.date = todayStr(dt); view.calMonth = view.date.slice(0,7);
  render();
}
function setDate(v){ if(v){ view.date=v; render(); } }
async function setStatus(id,status){
  const s=store();
  const rec = s.reservations.find(r=>r.id===id);
  if(status==="취소" && rec && rec.status!=="취소"){
    const ok = await uiConfirm("예약을 취소할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}`,
      {ok:"예약 취소", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(status==="노쇼" && rec && rec.status!=="노쇼"){
    const ok = await uiConfirm("노쇼로 처리할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n노쇼 관리 목록에 쌓입니다.`,
      {ok:"노쇼 처리", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(rec) logEvent("상태 변경", `${rec.date} ${rec.time} ${rec.name} ${rec.status} → ${status}`);
  /* 취소·노쇼는 화이트보드에서 지워야 하는 건이라 반드시 남깁니다.
     '방문'은 자동 처리라 변동으로 세지 않습니다 (매일 전부 표시되면 의미가 없어집니다) */
  s.reservations = s.reservations.map(function(r){
    if(r.id!==id) return r;
    const n = touch({...r, status});
    if(status==="취소" || status==="노쇼") addChange(n, status, []);
    else if(status==="확정" && (r.status==="취소" || r.status==="노쇼")) addChange(n, "변경", [{n:"상태", a:r.status, b:"확정"}]);   /* 되돌림도 남겨야 '오늘 취소' 태그가 풀립니다(점검 R3) */
    return n;
  });
  if(rec) reflowTentatives(rec.date);
  saveData(); render();
}

/* 광고 영상 주소.
   TV 는 .../v3/screen/hanok 주소로 엽니다. 그 상태에서 <video src="ad.mp4"> 를 쓰면
   브라우저가 .../v3/screen/ad.mp4 를 찾습니다 — 폴더가 한 칸 깊어져 영상이 안 나옵니다.
   (history.replaceState 로 주소를 바꾸면 상대 주소의 기준도 같이 바뀝니다)
   그래서 파일 이름만 적었을 때는 앱이 있는 폴더를 직접 붙여 줍니다. */
/* 앱이 놓인 폴더 경로(끝 슬래시 없음). /v4/, /v4/index.html, /v4/screen/, /v4/screen/index.html, /v4/screen/hanok 전부 → /v4 */
function appDir(){
  try{
    return location.pathname
      .replace(/\/[^\/]*\.html?$/i, "")            /* index.html 떼기 */
      .replace(/\/screen(\/[a-z]*)?\/?$/i, "")       /* screen 폴더(와 매장 이름) 떼기 */
      .replace(/\/+$/, "");
  }catch(e){ return ""; }
}
/* 광고 영상은 screen/ 폴더에 둡니다 (손님용 화면과 한 묶음). 파일 이름만 적으면 그 폴더를 붙입니다 */
function adUrl(name){
  var v = (name || "").trim();
  if(!v) return "";
  /* 전체 주소나 경로를 직접 적었으면 그대로 씁니다 */
  if(v.indexOf("://") >= 0 || v.charAt(0) === "/") return v;
  return appDir() + "/screen/" + v;
}
function screenUrl(){
  try{
    if(location.protocol === "file:") return location.href.split("#")[0] + `#/screen/${view.storeKey}`;
    return location.origin + appDir() + "/screen/";
  }catch(e){ return "/screen/"; }
}
function copyScreenUrl(){
  if(!navigator.clipboard) return uiAlert("복사 실패","주소를 직접 입력해 주세요.","warn");
  navigator.clipboard.writeText(screenUrl()).then(
    ()=>uiAlert("복사 완료","TV 브라우저 주소창에 붙여넣으세요.","ok"),
    ()=>uiAlert("복사 실패","주소를 직접 입력해 주세요.","warn"));
}

function moveSeat(id, d){
  const st = draft(), arr = st.rooms;
  const r = arr.find(x=>x.id===id); if(!r) return;
  const same = arr.filter(x=>x.type===r.type && (isRoom(r) || (x.floor||"")===(r.floor||"")));
  const k = same.indexOf(r), j = k + d;
  if(j < 0 || j >= same.length) return;
  const other = same[j];
  const i1 = arr.indexOf(r), i2 = arr.indexOf(other);
  arr[i1] = other; arr[i2] = r;
  render();
}

/* ---------- 토스트 ----------
   showToast(text, actionLabel, fn) — 같은 자리 하나뿐. 새로 부르면 앞 것을 교체합니다.
   구형 TV 브라우저에서도 죽지 않게 setTimeout 만 씁니다 */
var TOAST_T = null, TOAST_FN = null;
function showToast(text, actionLabel, fn){
  var el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  TOAST_FN = fn || null;
  el.innerHTML = '<span class="toast-t"></span>' + (actionLabel ? '<button class="toast-a" onclick="toastAction()"></button>' : '');
  el.querySelector(".toast-t").textContent = text;
  if(actionLabel) el.querySelector(".toast-a").textContent = actionLabel;
  el.className = "toast on";
  if(TOAST_T) clearTimeout(TOAST_T);
  TOAST_T = setTimeout(hideToast, 3000);
}
function hideToast(){ var el = document.getElementById("toast"); if(el) el.className = "toast"; TOAST_T = null; }
function toastAction(){ var fn = TOAST_FN; hideToast(); if(fn) fn(); }
/* 예약을 저장한 뒤 — 보고 있는 날짜의 예약이면 이미 보이니 '저장됨' 만, 다른 날짜면 '9/20(금) 예약 저장됨 · 보기' */
function toastSaved(rec){
  if(!rec) return;
  if(rec.date === view.date && view.tab !== "settings"){ showToast("저장됨"); return; }
  var d = new Date(rec.date + "T00:00:00");
  var label = (d.getMonth()+1) + "/" + d.getDate() + "(" + ["일","월","화","수","목","금","토"][d.getDay()] + ") 예약 저장됨";
  showToast(label, "보기", function(){ view.date = rec.date; view.tab = "dash"; render(); });
}

      : {__id:"new", date:(view.form.date||view.date), time:"", name:"", phone:"", people:0, infants:0,

    ((f.extraIds||[]).length && !curJoin ? `<optgroup label="현재">${opt("__keep", esc(seatLabelIds([f.roomId].concat(f.extraIds))) + " (붙임 유지)", true)}</optgroup>` : "");
  const srcs = [...new Set([...(st.sources||["전화 예약","네이버 예약","기타"]), f.source||"전화 예약"])];

  const isRoom = seatObj ? seatObj.type==="room" : false;
  const baseMenuOpts = isHall ? ["코스","해당 없음"] : ["코스","코스 상당","확인 필요","해당 없음"];
  /* 테이블로 옮긴 예약에 '확인 필요' 같은 값이 남아 있으면 버튼이 사라져 보이지 않게 되므로 살려 둡니다 */

  const cN = courseCount();

  /* 룸은 코스 주문을 전제로 받는 자리입니다 — 막지 않고 알리기만 합니다 */
  const menuWarn = isRoom && (

    f.menuType==="확인 필요" ? "" :
    (f.menuType==="코스" && !f.courseUndecided && cN>0 && cN<cAd)

  const menuSeg = menuOpts.map(x=>

  return `
    ${sheetHead(editing?"예약 내용 수정":"빠른 입력")}
    <div class="grid2">
      <label class="f"><div class="lb">날짜</div><input id="f-date" type="date" value="${f.date}"></label>
      <label class="f"><div class="lb">시간</div><input id="f-time" type="time" value="${f.time}"></label>

    <div class="grid2">
      <label class="f"><div class="lb">예약자</div><input id="f-name" value="${esc(f.name)}" placeholder="홍길동" autocomplete="off"></label>
      <label class="f"><div class="lb">전화번호</div><input id="f-phone" type="tel" inputmode="numeric" value="${esc(f.phone)}" placeholder="010-0000-0000"></label>
    </div>
    <div class="grid2">
      <label class="f"><div class="lb">총 인원 (유아 포함)</div>
