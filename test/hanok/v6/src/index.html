      <label class="f"><div class="lb">유아</div>
        <input id="f-infants" type="number" min="0" value="${f.infants||0}"></label>
    </div>
    <label class="f"><div class="lb">유아용 의자</div>
      <input id="f-chairs" type="number" min="0" value="${f.chairs||0}"></label>
    <label class="f"><div class="lb">좌석</div>
      <select id="f-room" onchange="pickRoom(this.value)"><option value="">미배정</option>${roomOpts}</select></label>
    <div class="f"><div class="lb">경로</div><div class="seg">${srcSeg}</div>
      <div id="src-detail" style="margin-top:8px; display:${f.source==="기타"?"block":"none"}">
        <input id="f-src-detail" value="${esc(f.sourceDetail||"")}" placeholder="예: 지인 소개">
      </div>
    </div>
    <div class="f"><div class="lb">식사</div>
      ${menuWarn?`<div class="menu-warn" style="margin:0 0 8px">${esc(menuWarn)}</div>`:""}
      <div class="seg">${menuSeg}</div>
      ${f.menuType==="코스"?`
        <div class="course-sum" style="margin-top:10px">
          <span>${f.courseUndecided ? "코스 미정 — 방문 전 확정"
            : (cN?`${esc(courseSummary(f.courses))}`:"구성을 고르세요")}</span>
          <button class="btn sm" style="margin-left:auto" onclick="openCourse()">${cN||f.courseUndecided?"수정":"선택"}</button>
        </div>`:""}
    </div>
    <label class="f"><div class="lb">알러지</div><input id="f-allergy" value="${esc(f.allergy||'')}" placeholder="예: 갑각류 알러지 1명"></label>
    <label class="f"><div class="lb">요청사항</div><input id="f-request" value="${esc(f.request||'')}" placeholder="예: 창가 자리"></label>
    <label class="f"><div class="lb">메모 <span class="lbl-note">선택</span></div>
      <input id="f-memo" value="${esc(f.memo||'')}" placeholder="예: 사장님 지인, 상석 준비"></label>
    <div class="f"><div class="lb">상태</div><div class="seg">${stSeg}</div></div>
    <div class="sheet-actions">
      ${editing?`<button class="btn danger" onclick="delRes('${editing.id}')">삭제</button>`:""}
      <button class="btn ghost" onclick="closeSheet()">닫기</button>
      <button class="btn primary" onclick="saveRes()">${editing?"저장":"등록"}</button>
    </div>`;
}
function step(id,d){
  const el=document.getElementById(id);
  el.value = Math.max(0,(parseInt(el.value)||0)+d);
}
function pickSource(x){ syncRes(); tmpRes = {...tmpRes, source:x}; render(); }
/* 좌석을 바꾸면 식사 선택지(홀은 2개·룸은 4개)와 경고가 달라져 바로 다시 그립니다 */
function pickRoom(v){
  syncRes();
  const j = (store().settings.joins||[]).find(g=>g.id===v);
  if(v === "__keep") return render();
  if(j) tmpRes = Object.assign({}, tmpRes, {roomId:j.ids[0], extraIds:j.ids.slice(1)});
  else if(/^table:/.test(v)) tmpRes = Object.assign({}, tmpRes, {roomId:null, extraIds:[], seatPref:v});   /* 층만 */
  else if(v === "") tmpRes = Object.assign({}, tmpRes, {roomId:null, extraIds:[], seatPref:"room-any"});
  else  tmpRes = Object.assign({}, tmpRes, {roomId:v, extraIds:[]});
  render();
}
/* 식사 종류를 바꿈. 코스가 아니면 코스 구성을 비웁니다 — 남겨 두면 저장될 때 섞입니다 */
function pickMenuType(v){
  syncRes();
  tmpRes = {...tmpRes, menuType:v};
  if(v==="코스"){ tmpRes.courseOpen = true; }
  else { tmpRes.courses = {}; tmpRes.courseUndecided = false; tmpRes.courseOpen = false; }
  render();
}
function pickStatus(x){ syncRes(); tmpRes = {...tmpRes, status:x}; render(); }
/* 버튼을 눌러 화면을 다시 그리기 전에, 입력창에 친 값을 임시 객체에 옮겨 담음 */
function syncRes(){
  const g=id=>{const el=document.getElementById(id); return el?el.value:undefined;};
  const v = {};
  [["date","f-date"],["time","f-time"],["name","f-name"],["phone","f-phone"],
   ["sourceDetail","f-src-detail"],["request","f-request"],["allergy","f-allergy"],
   ["memo","f-memo"]]
    .forEach(([k,id])=>{ const x=g(id); if(x!==undefined) v[k]=x; });
  [["people","f-people"],["infants","f-infants"],["chairs","f-chairs"]]
    .forEach(([k,id])=>{ const x=g(id); if(x!==undefined) v[k]=Math.max(0,parseInt(x)||0); });
  tmpRes = {...tmpRes, ...v};
}
/* 저장하기 전에 걸리는 문제를 모아 돌려줍니다.
   마법사는 단계마다 물어보지만 수정 화면은 한 번에 물어야 하므로 목록으로 만듭니다.
   ※ 예전에는 수정 화면에만 이 검사가 통째로 없었습니다. 손님이 시간을 바꿔 달라고 할 때
      이미 찬 방이어도 조용히 저장되어, 통화를 끊은 뒤에야 발견했습니다. */
function saveIssues(rec, excludeId){
  const st = store().settings, out = [];
  const w = timeBlock(rec.date, rec.time);
  if(w) out.push.apply(out, w.split("\n"));
  const ids = rec.roomId ? [rec.roomId].concat(rec.extraIds||[]) : [];
  if(ids.length){
    const ppl = pplOf(rec), ad = adultCount(ppl, rec.infants||0), label = seatLabelIds(ids);
    ids.forEach(id=>{
      const seat = seatById(id); if(!seat) return;
      const bk = blockedAt(seat, rec.date, rec.time);
      if(bk) out.push(`${seat.name}은 이 시각에 사용 중지입니다${bk.note?` — ${bk.note}`:""}`);
      const rs = roomStatus(rec.date, rec.time, id, excludeId);
      if(rs.hits.length)
        out.push(`${seat.name}에 겹치는 예약이 있습니다 — ` + rs.hits.map(x=>`${hm(x.time)} ${x.name} 손님`).join(", "));
    });
    if(ppl > seatsMax(ids)) out.push(`${label} 정원 ${seatsMax(ids)}명을 넘습니다 (지금 ${ppl}명)`);
    else if(ad < seatsMin(ids)) out.push(`${label} 최소 인원 ${seatsMin(ids)}명에 못 미칩니다 (지금 ${ad}명)`);
    const j = ids.length > 1 ? joinOf(ids) : null;
    if(j && j.note) out.push(`${label}: ${j.note}`);
  }
  /* 경고 판정(resWarn)과 같은 기준으로 — 여기서 안 물어본 것이 저장 뒤 '경고 예약'으로 뜨면 사장님이 놀랍니다.
     (재아 발견: 유아를 총 인원까지 올려 저장하니 경고는 붙는데 확인창이 없었음 — '성인 없음' 이 빠져 있었습니다)
     시각·좌석 겹침·정원은 위에서 자세한 문장으로 이미 넣었으므로 나머지만 옮깁니다 */
  const words = {
    "성인 없음": `유아 ${rec.infants||0}명이 총 인원 ${pplOf(rec)}명과 같습니다 — 성인이 없습니다`,
    "유아의자 초과": `유아용 의자 ${rec.chairs||0}개가 유아 ${rec.infants||0}명보다 많습니다`,
    "룸·코스 아님": `룸 예약인데 식사가 '해당 없음' 입니다`,
    "코스 미확정": `코스가 '확인 필요' 상태입니다`,
    "코스 인원 부족": `코스 인원이 성인 수보다 적습니다`,
    "테이블 자리 없음": `${seatLabel(rec.seatPref)}에 그 시간 ${pplOf(rec)}명이 앉을 자리가 없습니다 (한 자리 최대 ${floorMaxParty(prefFloor(rec.seatPref), rec.date, rec.time, excludeId)}명)`,
    "나눠 앉음": `${seatLabel(rec.seatPref)}에 붙일 수 있는 테이블이 없어 나눠 앉게 됩니다 (한 자리 최대 ${floorMaxParty(prefFloor(rec.seatPref), rec.date, rec.time, excludeId)}명)`
  };
  if(!rec.roomId && isTablePref(rec.seatPref)){
    /* 저장 전 객체라 잠정 배정이 아직 없습니다 — 즉석에서 계산해 넣고 경고를 뽑습니다 */
    const ff = floorFit(prefFloor(rec.seatPref), rec.date, rec.time, pplOf(rec), excludeId);
    rec.tentativeRoomId = ff.f ? ff.f.id : null; rec.tentativeExtra = ff.f ? ff.f.extra : []; rec.tentativeSplit = ff.state === "split";
  }
  resWarn(rec).forEach(k => { if(words[k]) out.push(words[k]); });
  if((rec.infants||0) > pplOf(rec)) out.push(`유아 ${rec.infants}명이 총 인원 ${pplOf(rec)}명보다 많습니다`);
  if(rec.menuType === "코스" && !rec.courseUndecided && !Object.keys(rec.courses||{}).some(k=>rec.courses[k] > 0))
    out.push("코스인데 구성이 비어 있습니다 — '코스 미정' 으로 두거나 구성을 넣으세요");
  return out;
}
async function saveRes(){
  syncRes();
  const s=store(), f=tmpRes;
  if(!(f.name||"").trim()) return uiAlert("예약자 성함을 입력하세요","","warn");
  /* 날짜 검사가 없어서, 날짜 칸을 비우고 저장하면 date:"" 가 저장되고
     화면 날짜가 'NaN월 NaN일' 이 되어 달력으로도 복구가 안 됐습니다. */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||"")) return uiAlert("날짜를 입력하세요","","warn");
  if(!f.time) return uiAlert("시간을 입력하세요","","warn");
  if(!(f.people > 0)) return uiAlert("인원을 입력하세요","1명 이상이어야 합니다","warn");
  /* 유아 > 총원은 마법사처럼 막지 않고 아래 saveIssues 에서 경고만 합니다(점검 R8 — 2-4 원칙) */
  const old = view.form.id ? s.reservations.find(r=>r.id===view.form.id) : null;
  const rec = {
    ...(old||{}),
    id: view.form.id || newId("res"),
    date:f.date, time:f.time, name:(f.name||"").trim(), phone:phoneNorm(f.phone),
    people: Math.max(1, f.people||1), infants: f.infants||0, chairs: f.chairs||0,
    roomId: f.roomId || null,
    extraIds: f.roomId ? (f.extraIds || []) : [],
    seatPref: f.roomId ? null : (f.seatPref || (old ? old.seatPref : "room-any")),
    tentativeRoomId: f.roomId ? null : (old ? old.tentativeRoomId : null),
    tentativeExtra: f.roomId ? [] : (old ? (old.tentativeExtra || []) : []),
    tentativeSplit: f.roomId ? false : (old ? !!old.tentativeSplit : false),
    source:f.source || "전화 예약", sourceDetail:f.source==="기타"?(f.sourceDetail||"").trim():"",
    request:(f.request||"").trim(), allergy:(f.allergy||"").trim(), memo:(f.memo||"").trim(),
    allergyChecked: old ? old.allergyChecked : true,   /* 마법사와 같은 모양 */
    menuType: f.menuType || "해당 없음",
    /* 코스가 아니면 구성은 비워 둡니다 — '해당 없음'인데 코스 인원이 남는 일을 막습니다 */
    courses: f.menuType==="코스" ? {...(f.courses||{})} : {},
    courseUndecided: f.menuType==="코스" ? !!f.courseUndecided : false,
    status:f.status,
    createdAt: old ? old.createdAt : new Date().toISOString()
  };
  delete rec.__id; delete rec.adults; delete rec.courseOpen;
  if(old && old.date !== rec.date) delete rec.auto;   /* 자동 방문 표시는 그 날짜의 것 — 옮기면 지웁니다(점검 R10) */

  /* 막지 않고 알리기만 합니다 (설계 5.2). 그대로 저장하면 경고 예약으로 남습니다. */
  const issues = saveIssues(rec, view.form.id);
  if(issues.length){
    const ok = await uiConfirm("이대로 저장할까요?",
      issues.map(x=>`· ${x}`).join("\n") +
      "\n\n저장해도 됩니다. 대신 '경고 예약'으로 남아 확인 필요에 뜹니다.",
      {ok:"그래도 저장", cancel:"다시 고치기"});
    if(!ok) return;
  }

  if(old){
    /* 무엇이 바뀌었는지 남깁니다 (사장님의 '파란 글씨' — 변동 이력 참고) */
    const d = diffRes(old, rec);
    if(d.length) addChange(rec, "변경", d);
    if(old.status !== rec.status && (rec.status==="취소" || rec.status==="노쇼"))
      addChange(rec, rec.status, []);
    s.reservations = s.reservations.map(r=>r.id===rec.id?rec:r);
    logEvent("예약 수정", `${rec.date} ${rec.time} ${rec.name} ${pplOf(rec)}명`);
    /* 날짜를 옮겼으면 원래 날짜의 잠정 배정도 다시 계산해야 합니다 —
       안 그러면 비어 버린 자리를 계속 피한 채로 남습니다 */
    if(old.date !== rec.date) reflowTentatives(old.date);
    reflowTentatives(rec.date);
  }else{
    /* 빠른 입력 — 마법사와 같은 등록 경로 (같은 번호·노쇼 확인 포함) */
    if(!await confirmNewRes(rec.date, rec.phone)) return;
    createReservation(rec);
  }
  /* 6차 전에는 여기서 view.date = rec.date 로 그 날짜로 점프했습니다 — 다음 주 예약을 받다가 화면이 다음 주로 가 버려서
     '오늘' 을 놓치는 일이 있었습니다. 화면은 그대로 두고 토스트의 '보기' 로만 갑니다 */
  view.form=null; tmpRes=null;
  saveData(); render(); histPop();
  toastSaved(rec);
}
async function delRes(id){
  if(readonlyBlock()) return;
  const s=store();
  const rec = s.reservations.find(r=>r.id===id);
  /* 무엇을 지우는지 한 줄 — 목록에서 옆 줄을 잘못 누른 경우를 여기서 잡습니다 */
  const who = rec ? `${resLine(rec)}\n` : "";
  if(!await uiConfirm2(`이 예약을 삭제할까요? 기록이 완전히 사라집니다.\n${who}손님이 취소한 경우라면 '예약 취소'를 쓰는 편이 좋습니다.`)) return;
  if(rec) logEvent("예약 삭제", `${rec.date} ${rec.time} ${rec.name} ${rec.phone ? "…" + rec.phone.replace(/\D/g,"").slice(-4) : ""}`);
  /* 진짜로 지우지 않습니다. 삭제 표시를 붙여 trash 로 옮깁니다.
     여러 기기가 같은 DB 를 쓸 때, 지웠다는 사실 자체가 전달돼야 다른 기기에서 되살아나지 않습니다.
     화면 코드는 s.reservations 만 보므로 동작은 전과 같습니다. */
  if(rec){
    rec.deletedAt = new Date().toISOString(); touch(rec);
    s.trash = (s.trash || []).concat([rec]);
    /* 휴지통은 500건까지만 들고 있되, 아직 서버에 못 보낸 삭제는 버리지 않습니다 — 버리면 서버에서 되살아납니다(점검 D12) */
    if(s.trash.length > 500){
      const keep = s.trash.filter(x=>SYNC && SYNC.res && SYNC.res[x.id] && JSON.stringify(x) !== SYNC.res[x.id]);
      s.trash = keep.concat(s.trash.filter(x=>keep.indexOf(x) < 0).slice(-(500 - keep.length)));
    }
  }
  s.reservations=s.reservations.filter(r=>r.id!==id);
  if(rec) reflowTentatives(rec.date);
  view.form=null; tmpRes=null; saveData(); render(); histPop();
}

/* 예약 상세에 붙는 문자 칸 — 나갔는지, 언제 나가는지, 왜 안 나가는지 */
function smsBox(r){
  const c = smsCfg();
  const sent = smsFind(r, "접수");
  const rs = remindState(r);
  const stamp = m => {
    const d = new Date(m.at);
    return isNaN(d) ? "" : `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const planTxt = rs.at
    ? `${rs.at.getMonth()+1}/${rs.at.getDate()} ${pad(rs.at.getHours())}:00`
    : "-";
  /* 안 나가는 이유가 있으면 그것부터 보여줍니다 — 사장님이 직접 전화하실 수 있게 */
  const why = remindWhy(rs);
  const row = (label, right, cls) =>
    `<div class="sms-row ${cls||""}"><span class="sm-l">${label}</span><span class="sm-r">${right}</span></div>`;
  return `
    <div class="sms-box">
      <div class="sb-t">문자 안내 <span class="sb-mock">흉내 · 실제로 나가지 않습니다</span></div>
      ${row("접수 문자",
        sent ? `<b>보냄</b> ${esc(stamp(sent))}${sent.resent?" · 재발송":""}`
             : (r.phone ? `<i>기록 없음</i>` : `<i>번호 없음</i>`))}
      ${row("재안내 문자",
        rs.state==="보냄"     ? `<b>보냄</b> ${esc(stamp(rs.rec))}${rs.rec.resent?" · 재발송":""}`
      : rs.state==="예정"     ? `${esc(planTxt)} 예정`
      : rs.state==="발송대기" ? `${esc(planTxt)} · 곧 나감`
      : `<i>안 나감</i>`,
        (rs.state!=="보냄" && rs.state!=="예정" && rs.state!=="발송대기") ? "bad" : "")}
      ${why ? `<div class="sb-why">${esc(why)}</div>` : ""}
      <div class="sb-btns">
        <button class="btn sm" onclick="smsPreview('${r.id}','접수')">접수 문자 보기</button>
        <button class="btn sm" onclick="smsPreview('${r.id}','재안내')">재안내 문자 보기</button>
      </div>
      <p class="sb-note">문안을 열면 그 자리에서 다시 보낼 수 있습니다.</p>
    </div>`;
}
/* 문안을 보여주고, 그 자리에서 다시 보낼 수 있게 합니다.
   미리보기와 재발송을 한 창에 둔 이유: 사장님이 보내기 전에 내용을 반드시 보게 하려고요.
   내용을 안 보고 보내는 버튼은 실수를 부릅니다. */
async function smsPreview(id, kind){
  const r = store().reservations.find(x=>x.id===id);
  if(!r) return;
  /* '---' 줄은 화면에서 가로선으로 그려집니다 — 어디부터 어디까지가 문자인지 끊어 줍니다 */
  const body = "---\n" + smsText(r, kind, smsCfg().remindOffset) +
    "\n---\n지금은 흉내만 냅니다. 실제로 나가지 않습니다.";
  if(!(r.phone||"").trim())
    return await uiAlert(kind + " 문자", body + "\n\n전화번호가 없어 보낼 수 없습니다.", "warn");
  const ok = await uiConfirm(kind + " 문자", r.phone + "\n\n" + body,
    { ok:"이 문자 보내기", cancel:"닫기" });
  if(!ok) return;
  smsSend(r, kind, smsCfg().remindOffset, true);
  logEvent("문자 재발송", r.date + " " + r.time + " " + r.name + " " + kind);
  saveData(); render();
}

/* ---------- 예약 상세 · 처리 ---------- */
function sheetMark(){
  const s = store(), st = s.settings;
  const r = s.reservations.find(x=>x.id===view.form.id);
  if(!r) return `${sheetHead("예약")}<div class="empty">예약을 찾을 수 없습니다.</div>`;

  const seat = r.roomId ? resSeatLabel(r)
             : isTablePref(r.seatPref) ? resSeatLabel(r)
             : (r.tentativeRoomId ? `미배정 (${resTentLabel(r)} 잠정)` : "미배정");
  const srcTxt = r.source==="기타" && r.sourceDetail ? `기타 · ${r.sourceDetail}` : (r.source||"전화");
  const made = r.createdAt ? new Date(r.createdAt) : null;
  const madeTxt = made
    ? `${made.getFullYear()}. ${made.getMonth()+1}. ${made.getDate()}. ${pad(made.getHours())}:${pad(made.getMinutes())}`
    : "기록 없음";

  const btn = (v,label,cls) =>
    `<button class="markbtn ${cls} ${r.status===v?'on':''}" onclick="markRes('${r.id}','${v}')">${label}</button>`;

  /* 좌석 미정이면 배정 후보를 바로 고를 수 있게 */
  let seatPick = "";
  if(!r.roomId && isTablePref(r.seatPref)){
    /* 테이블 예약은 층이 곧 자리입니다. 특정 테이블을 꼭 잡아야 하면 '수정' 에서 */
    const fl = prefFloor(r.seatPref);
    const st8 = !r.tentativeRoomId ? `<b style="color:var(--rust)">자리 없음</b> — 한 자리 최대 ${floorMaxParty(fl, r.date, r.time, r.id)}명`
              : r.tentativeSplit ? `<b style="color:var(--rust)">나눠 앉음</b> — 테이블 ${seatsOf(r).length}개, 붙일 수 없음`
              : `자리 있음 — 테이블 ${seatsOf(r).length}개`;
    seatPick = `<div class="lbl" style="margin:16px 0 8px">테이블 자리</div>
      <p class="f-note">${esc(floorLabel(fl))} · ${st8}. 어느 테이블에 앉을지는 당일 현장에서 정합니다. 특정 테이블(파셜룸 등)을 잡으려면 '수정' 에서 고르세요.</p>`;
  }else if(!r.roomId){
    const kind = r.seatPref==="hall-any" ? "table-any" : (r.seatPref||"any");
    const ppl = pplOf(r);
    /* 후보: 룸 또는 테이블(희망 종류) + 인원에 맞는 룸 합침 그룹. 붙일 테이블은 잠정 배정이 이미 골라 둔 것(tentativeExtra)만 */
    let cand = st.rooms.filter(x=>{
      if(kind==="table-any" && !isTable(x)) return false;
      if(kind==="room-any" && !isRoom(x)) return false;
      return ppl <= seatMax(x);
    }).map(x=>{
      const ok = roomStatus(r.date,r.time,x.id,r.id).state==="free";
      const first = x.id===r.tentativeRoomId && !(r.tentativeExtra||[]).length;
      const waste = (ppl <= 2 && isTable(x) && (x.seats||4) >= 4) ? -1 : (seatMax(x) - ppl);
      return {x, ok, first, waste, ids:[x.id]};
    });
    if(kind!=="table-any") (st.joins||[]).filter(j=>ppl>=j.min && ppl<=j.max).forEach(j=>{
      const ok = j.ids.every(id=>roomStatus(r.date,r.time,id,r.id).state==="free");
      cand.push({x:{id:j.id, name:seatLabel(j.id).replace(/ 룸$/,""), type:"join", note:j.note}, ok, first:false, waste:j.max-ppl, ids:j.ids});
    });
    if((r.tentativeExtra||[]).length && r.tentativeRoomId){
      const ids = [r.tentativeRoomId].concat(r.tentativeExtra);
      cand.unshift({x:{id:"__tent", name:seatLabelIds(ids).replace(/ 테이블$/,""), type:"tables"}, ok:ids.every(id=>roomStatus(r.date,r.time,id,r.id).state==="free"), first:true, waste:seatsMax(ids)-ppl, ids});
    }
    cand = cand.sort((a,b)=> (b.first-a.first) || (b.ok-a.ok) || (a.waste-b.waste));
    /* 쓸 수 있는 자리 중 앞에서 세 개까지 순위를 붙입니다.
       예전에는 잠정 배정된 1순위만 표시돼, 그다음으로 좋은 자리가 뭔지 알 수 없었습니다. */
    let rank = 0;
    const ranked = cand.map(c=>{
      if(c.ok && rank < 3) return {...c, rank: ++rank};
      return {...c, rank: 0};
    });
    const pickedIds = view.pickSeat ? (view.pickSeat==="__tent" ? [r.tentativeRoomId].concat(r.tentativeExtra||[]) : ((st.joins||[]).find(j=>j.id===view.pickSeat)||{ids:[view.pickSeat]}).ids) : null;
    seatPick = `
      <div class="lbl" style="margin:16px 0 8px">좌석 배정 ${r.tentativeRoomId?`<span class="tag amber">${esc(resTentLabel(r))} 잠정</span>`:""}</div>
      <div class="seatpick">${ranked.map(({x,ok,rank,ids})=>`
        <button class="spick ${ok?'':'busy'} ${rank===1?'first':''} ${view.pickSeat===x.id?'picked':''} ${x.type==="join"?'join':''}"
          onclick="pickSeatCand('${r.id}','${x.id}')" ${x.note?`title="${esc(x.note)}"`:""}>
          ${esc(x.name)} <small>${seatsMin(ids)?seatsMin(ids)+"~":""}${seatsMax(ids)}</small>
          ${rank?`<i>${rank}순위</i>`:""}
        </button>`).join("")}</div>
      ${view.pickSeat?`
        <div class="seatconfirm">
          <span><b>${esc(seatLabelIds(pickedIds))}</b> 으로 배정합니다</span>
          <button class="btn ghost sm" onclick="pickSeatCand('${r.id}','')">취소</button>
          <button class="btn primary" onclick="assignSeat('${r.id}','${esc(view.pickSeat)}')">좌석 확정하기</button>
        </div>`:`<p class="f-note" style="margin-top:8px">자리를 고른 뒤 '좌석 확정하기'를 눌러야 배정됩니다.</p>`}`;
  }

  return `
    ${sheetHead("예약 상세")}
    <div class="mark-info">
      <div class="mi-t">${esc(r.time)} · ${esc(r.name)} 손님</div>
      <div class="mi-s">${pplText(r)} · ${esc(seat)}</div>
      ${r.phone?`<div class="mi-s">${esc(r.phone)}</div>`:""}
      <div class="mi-s">식사 · <b>${esc(r.menuType||"해당 없음")}</b>${
        r.courseUndecided?" (구성 미정)":(r.courses&&Object.keys(r.courses).length?` (${esc(courseSummary(r.courses))})`:"")}</div>
      ${r.assignedLater?`<div class="mi-s">좌석 미정으로 접수 → ${esc(resSeatLabel(r))} 배정 완료</div>`:""}
      ${resWarn(r).length?`<div class="mi-s warn-txt">경고 · ${esc(resWarn(r).join(", "))}</div>`:""}
      ${r.chairs?`<div class="mi-s">유아용 의자 ${r.chairs}개</div>`:""}
      ${r.allergy?`<div class="mi-s warn-txt">알러지: ${esc(r.allergy)}</div>`:""}
      ${r.request?`<div class="mi-s">요청: ${esc(r.request)}</div>`:""}
      ${r.memo?`<div class="mi-s memo-line">메모: ${esc(r.memo)}</div>`:""}
      <div class="mi-meta">
        <span>경로 ${esc(srcTxt)}</span><span>등록 ${madeTxt}</span>
      </div>
    </div>
    ${(()=>{
      const lines = changeLines(r);
      if(!lines.length) return "";
      return `<div class="chg-box">
        <div class="cb-t">오늘 바뀐 내용</div>
        ${lines.map(l=>`<div class="cb-l"><span class="cb-tm">${esc(l.t)}</span>${esc(l.s)}</div>`).join("")}
        <div class="cb-s">주방에 이미 전달한 내용이 있다면 다시 알려주세요.</div>
      </div>`;
    })()}
    ${smsBox(r)}
    ${seatPick}
    <div class="lbl" style="margin:16px 0 8px">상태 · ${esc(r.status)}</div>
    <div class="markgrid">
      ${btn("확정","확정","back")}
      ${btn("방문","방문","ok")}
      ${btn("노쇼","노쇼","no")}
      ${btn("취소","예약 취소","cancel")}
    </div>
    <div class="sheet-actions">
      <button class="btn danger" onclick="delRes('${r.id}')">삭제</button>
      <button class="btn primary" onclick="openRes('${r.id}')">예약 내용 수정</button>
    </div>
    <p class="f-note" style="margin-top:10px">‘예약 취소’는 기록을 남기고, ‘삭제’는 기록까지 지웁니다. 보통은 취소를 쓰세요.</p>`;
}
async function markRes(id, status){
  if(readonlyBlock()) return;
  const s = store();
  const rec = s.reservations.find(r=>r.id===id);
  if(status==="취소" && rec && rec.status!=="취소"){
    const ok = await uiConfirm("예약을 취소할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n좌석이 비고, 기록에는 ‘취소’로 남습니다.`,
      {ok:"예약 취소", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(status==="노쇼" && rec && rec.status!=="노쇼"){
    const ok = await uiConfirm("노쇼로 처리할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n` +
      `이 번호는 노쇼 관리 목록에 쌓이고, 다음 예약 때 안내가 뜹니다.`,
      {ok:"노쇼 처리", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(rec) logEvent("상태 변경", `${rec.date} ${rec.time} ${rec.name} ${rec.status} → ${status}`);
  /* 취소·노쇼는 화이트보드에서 지워야 하는 건이라 반드시 남깁니다.
     '방문'은 자동 처리라 변동으로 세지 않습니다 (매일 전부 표시되면 의미가 없어집니다) */
  s.reservations = s.reservations.map(function(r){
    if(r.id!==id) return r;
    const n = touch({...r, status});
    if(status==="취소" || status==="노쇼") addChange(n, status, []);
    else if(status==="확정" && (r.status==="취소" || r.status==="노쇼")) addChange(n, "변경", [{n:"상태", a:r.status, b:"확정"}]);   /* 되돌림도 남겨야 '오늘 취소' 태그가 풀립니다(점검 R3) */
    return n;
  });
  if(rec) reflowTentatives(rec.date);
  view.form = null; saveData(); render();
}
/* 좌석 확정 — seatId 는 좌석 id / 합침 그룹 id / "__tent"(잠정으로 골라 둔 테이블 묶음). 막지 않고 확인만 (설계 5.2) */
async function assignSeat(id, seatId){
  const s = store();
  const r = s.reservations.find(x=>x.id===id);
  if(!r) return;
  const j = (s.settings.joins||[]).find(g=>g.id===seatId);
  const ids = seatId==="__tent" ? [r.tentativeRoomId].concat(r.tentativeExtra||[]) : (j ? j.ids.slice() : [seatId]);
  if(!ids[0] || !seatById(ids[0])) return;
  const label = seatLabelIds(ids), ppl = pplOf(r);
  for(let k=0;k<ids.length;k++){
    const seat = seatById(ids[k]);
    const bk = blockedAt(seat, r.date, r.time);
    if(bk && !await uiConfirm(`${seat.name}은 이 시각에 사용 중지입니다`, `${spanLabel(bk)}${bk.note?`\n사유: ${bk.note}`:""}\n\n그래도 배정할까요?`, {ok:"그래도 배정", cancel:"다시 고르기"})) return;
    const rs = roomStatus(r.date, r.time, ids[k], id);
    if(rs.state==="blocked"){
      const lines = rs.hits.map(x=>`· ${hm(x.time)} ${x.name} 손님 ${pplText(x)}`).join("\n");
      if(!await uiConfirm(`${seat.name}에 1시간 안에 확정 예약이 있습니다`, lines, {ok:"그래도 배정", cancel:"다시 고르기"})) return;
    }else if(rs.state==="warn" && !await uiConfirm2(`${seat.name}에 겹치는 예약이 있습니다. 그래도 배정할까요?`)) return;
  }
  if(ppl > seatsMax(ids) && !await uiConfirm2(`${label} 정원(${seatsMax(ids)}명)을 넘습니다. 배정할까요?`)) return;
  if(adultCount(ppl, r.infants||0) < seatsMin(ids) && !await uiConfirm2(`${label}은 최소 ${seatsMin(ids)}명부터입니다. 지금 ${adultCount(ppl, r.infants||0)}명입니다. 배정할까요?`)) return;
  if(j && j.note && !await uiConfirm(`${label} — ${j.note}`, "손님께 확인하셨나요?", {ok:"확인했음 · 배정", cancel:"다시 고르기"})) return;
  logEvent("좌석 배정", `${r.date} ${r.time} ${r.name} → ${label}`);
  if(!r.roomId) r.assignedLater = {from:r.seatPref||"any", at:new Date().toISOString()};
  addChange(r, "변경", [{n:"좌석", a:resSeatLabel(r), b:label}]);
  r.roomId = ids[0]; r.extraIds = ids.slice(1); r.tentativeRoomId = null; r.tentativeExtra = []; r.tentativeSplit = false; r.seatPref = null;
  view.pickSeat = null;
  reflowTentatives(r.date);
  view.form = null; saveData(); render();
}


/* ---------- 룸 미배정 목록 ---------- */

  const rows = list.length ? list.map(r=>`
    <button class="rowitem tap" onclick="openMark('${r.id}')">

        <span class="s">${pplText(r)} · 희망 ${esc(seatLabel(r.seatPref||"any"))}${r.phone?` · ${esc(r.phone)}`:""}</span></span>
      <span class="tag ${r.tentativeRoomId?'amber':'rust'}">${r.tentativeRoomId?`잠정 ${esc(resTentLabel(r))}`:"자리 없음"}</span>
    </button>`).join("") : `<div class="empty">배정할 예약이 없습니다.</div>`;
  return `
    ${sheetHead(`룸 미배정 · ${dateLabel(d)}`)}
    <div class="card" style="margin-bottom:12px">${rows}</div>
    <p class="f-note">예약을 누르면 좌석을 배정할 수 있습니다. ‘잠정’은 시스템이 잡아둔 1순위 자리입니다.</p>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}

/* ---------- 숫자 입력 팝업 ---------- */
function numValue(){
  const f = view.form;
  if(f.val != null) return f.val;
  const st = draft();
  if(f.ctx && f.ctx.room){
    const r = st.rooms.find(x=>x.id===f.ctx.room);
    return r ? (f.key==="minCapacity" ? roomMin(r) : (r[f.key] != null ? r[f.key] : (f.key==="capacity" ? seatMax(r) : f.min))) : f.min;
  }
  if(f.ctx && f.ctx.join){
    const j = (st.joins||[]).find(x=>x.id===f.ctx.join);
    return j ? j[f.key] : f.min;
  }
  return st[f.key] != null ? st[f.key] : f.min;
}
function sheetNum(){
  const f = view.form;
  const v = numValue();
  const step = (f.ctx && f.ctx.step) || 1;
  const quick = [];
  for(let i=f.min; i<=f.max && quick.length<12; i+=step) quick.push(+i.toFixed(1));
  return `
    ${sheetHead(f.title)}
    <div class="numbig">
      <button onclick="numAdj(-1)" ${v<=f.min?"disabled":""}>−</button>
      <div class="nv">${v}</div>
      <button onclick="numAdj(1)" ${v>=f.max?"disabled":""}>＋</button>
    </div>
    <div class="numgrid">
      ${quick.map(n=>`<button class="${v===n?'on':''}" onclick="numSet(${n})">${n}</button>`).join("")}
    </div>
    <p class="f-note">${f.min} ~ ${f.max} 사이로 정할 수 있습니다.${step!==1?` (${step} 단위)`:""}</p>
    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeSheet()">취소</button>
      <button class="btn primary" onclick="numSave()">확인</button>
    </div>`;
}
function numAdj(d){
  const f = view.form;
  const step = (f.ctx && f.ctx.step) || 1;
  f.val = +Math.max(f.min, Math.min(f.max, numValue()+d*step)).toFixed(1);
  render();
}
function numSet(n){ view.form.val = n; render(); }
function numSave(){
  const f = view.form, v = numValue();
  const st = draft();
  if(f.ctx && f.ctx.room){
    st.rooms = st.rooms.map(r=>{
      if(r.id!==f.ctx.room) return r;
      const n = Object.assign({}, r, {[f.key]:v, tuned:true});
      /* 최소가 최대보다 크면 그 좌석은 어떤 인원에도 안 맞아 배정 후보에서 영영 빠집니다(점검 C4) — 맞춰 줍니다 */
      if(f.key==="minCapacity" && n.capacity != null && v > seatMax(n)) n.capacity = v;
      if(f.key==="capacity" && n.minCapacity != null && n.minCapacity > v) n.minCapacity = v;
      return n;
    });
  }else if(f.ctx && f.ctx.join){
    st.joins = (st.joins||[]).map(j=>j.id===f.ctx.join?Object.assign({}, j, {[f.key]:v}):j);
  }else{
    st[f.key] = v;
  }
  view.form = null; render();
}

/* ---------- 홀 테이블 구성 ---------- */
/* 이 구역에서 실제로 만들 수 있는 자리 크기를 모두 구합니다.
   (같은 구역 안이면 어떤 테이블이든 붙임 한도까지 붙일 수 있습니다) */

/* 구역 배치를 그림으로 — 테이블 구성과 만들 수 있는 자리 크기를 함께 보여줍니다 */

/* ---------- 예약 검색 ----------
   전화 응대 중 "지난주에 예약한 OOO인데요"를 찾기 위한 화면입니다. */
function sheetSearch(){
  const q = (view.searchQ||"").trim();
  const s = store();
  /* 한글은 2자 이상, 숫자는 4자 이상부터 찾습니다.
     앞자리 010 은 빼고 비교해서 엉뚱한 결과가 나오지 않게 합니다. */
  const digits = q.replace(/\D/g,"").replace(/^010/,"");
  const text = q.replace(/[0-9\-\s]/g,"").trim();
  const okNum = digits.length >= 4;
  const okTxt = text.length >= 2;
  let rows = `<div class="empty">이름은 2자, 전화번호는 4자리부터 찾습니다.</div>`;
  if(okNum || okTxt){
    const hits = s.reservations.filter(r=>{
      if(okNum && (r.phone||"").replace(/\D/g,"").replace(/^010/,"").includes(digits)) return true;
      if(okTxt){
        const bag = `${r.name} ${r.request||""} ${r.allergy||""} ${r.sourceDetail||""}`;
        if(bag.includes(text)) return true;
      }
      return false;
    }).sort((a,b)=> b.date.localeCompare(a.date) || b.time.localeCompare(a.time)).slice(0,60);
    rows = hits.length ? hits.map(r=>`
      <button class="rowitem tap" onclick="goRes('${r.id}','${r.date}')">
        <span class="grow"><span class="t">${esc(r.name)}
          ${r.status!=="확정"?`<span class="tag ${r.status==="노쇼"?"rust":""}">${r.status}</span>`:""}</span>
          <span class="s">${dateLabel(r.date)} ${esc(r.time)} · ${pplText(r)} · ${esc(r.phone||"연락처 없음")}${
          r.request?` · ${esc(r.request)}`:""}${r.allergy?` · 알러지 ${esc(r.allergy)}`:""}</span></span>
        <span class="tag ${r.roomId?'pine':'amber'}">${r.roomId?esc(resSeatLabel(r)):"미배정"}</span>
      </button>`).join("")
      : `<div class="empty">찾은 예약이 없습니다.</div>`;
  }
  const hintTxt = okNum||okTxt ? "" :
    (q ? `<p class="f-note" style="margin:-6px 0 10px">더 입력하세요 — 한글 2자 이상, 숫자 4자리 이상</p>` : "");
  return `
    ${sheetHead("예약 검색")}
    <input id="search-q" value="${esc(q)}" placeholder="이름 또는 전화번호 (예: 재아 / 1188 / 010-1234-5678)"
           oninput="setSearchQ(this.value)" autocomplete="off" style="margin-bottom:10px">
    ${hintTxt}
    <div class="card searchbox">${rows}</div>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}
function setSearchQ(v){
  view.searchQ = v;
  const box = document.querySelector(".searchbox");
  if(box) box.innerHTML = sheetSearch().split('<div class="card searchbox">')[1].split('</div>\n    <div class="sheet-actions"')[0];
}
function goRes(id, date){
  view.date = date; view.calMonth = date.slice(0,7);
  view.form = {type:"mark", id};
  render();
}

/* ---------- 노쇼 관리 ----------
   따로 저장하지 않고 예약 기록에서 전화번호 기준으로 모읍니다. */
function noshowList(){
  const s = store();
  const excluded = s.settings.noshowExcluded || [];
  const map = new Map();
  s.reservations.filter(r=>r.status==="노쇼" && r.phone).forEach(r=>{
    const key = r.phone.replace(/\D/g,"");
    if(!key || excluded.includes(key)) return;
    if(!map.has(key)) map.set(key, {phone:r.phone, key, name:r.name, count:0, dates:[]});
    const v = map.get(key);
    v.count++; v.dates.push(r.date); v.name = r.name;
  });
  return [...map.values()].sort((a,b)=>b.count-a.count);
}
function noshowOf(phone){
  if(!phone) return null;
  const key = String(phone).replace(/\D/g,"");
  if(!key) return null;
  return noshowList().find(x=>x.key===key) || null;
}
function sheetNoshow(){
  const list = noshowList();
  const excluded = store().settings.noshowExcluded || [];
  const rows = list.length ? list.map(x=>`
    <div class="rowitem">
      <span class="grow"><span class="t">${esc(x.name)} <span class="tag rust">노쇼 ${x.count}회</span></span>
        <span class="s">${esc(x.phone)} · ${x.dates.slice(0,4).map(d=>d.slice(5).replace("-","/")).join(", ")}${x.dates.length>4?" 외":""}</span></span>
      <button class="btn sm" onclick="clearNoshow('${x.key}')">기록 제외</button>
    </div>`).join("") : `<div class="empty">노쇼 기록이 없습니다.</div>`;
  return `
    ${sheetHead("노쇼 관리")}
    <div class="card" style="margin-bottom:12px">${rows}</div>
    <p class="f-note">예약 상태를 ‘노쇼’로 바꾸면 자동으로 여기에 쌓입니다.
      새 예약을 등록할 때 같은 번호가 있으면 확정 전에 알려드립니다.
      ${excluded.length?`<br>제외된 번호 ${excluded.length}건 · <button class="linkbtn" onclick="restoreNoshow()">되돌리기</button>`:""}
    </p>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}
async function clearNoshow(key){
  if(!await uiConfirm2("이 고객의 노쇼 기록을 목록에서 제외할까요?\n예약 기록 자체는 남습니다.")) return;
  const st = store().settings;
  logEvent("노쇼 기록 제외", key);
  st.noshowExcluded = [...(st.noshowExcluded||[]), key];
  mirrorDraft("noshowExcluded");
  saveData(); render();
}
function restoreNoshow(){ store().settings.noshowExcluded = []; mirrorDraft("noshowExcluded"); saveData(); render(); }

/* ---------- 운영시간 수정 ---------- */
const DOW = ["일","월","화","수","목","금","토"];
/* 운영시간 요약 한 줄에 붙는 세션 요약 — "점심 접수 ~14:00 · 저녁 접수 ~19:30" */
function sessSummary(d){
  const ss = d.sessions || []; if(!ss.length) return "";
  return `<span class="sch-s">${ss.map(se=>`${esc(se.name)} 접수 ~${esc(se.lastBook)}${se.stay==="end"?"":` · ${se.stay}분`}`).join(" · ")}</span>`;
}
/* 세션 표 한 줄 — 이름 · 시작 · 접수 마감 · 점유(끝까지 / 분) · 끝 */
function sessRows(x, key){
  const ss = x.sessions || [];
  /* 시간 입력은 한글 로캘에서 '오전 11:00' 처럼 넓어 한 줄에 다섯 칸을 못 넣습니다 — 세션 하나를 두 줄 카드로 */
  return `<div class="sess">
    ${ss.map((se,si)=>`<div class="sess-r">
      <div class="sf"><span>세션</span><input value="${esc(se.name||"")}" onchange="setSess('${key}',${si},'name',this.value)"></div>
      <div class="sf"><span>시작</span><input type="time" value="${se.from||""}" onchange="setSess('${key}',${si},'from',this.value)"></div>
      <div class="sf"><span>접수 마감</span><input type="time" value="${se.lastBook||""}" onchange="setSess('${key}',${si},'lastBook',this.value)"></div>
      <button class="btn sm danger" onclick="delSess('${key}',${si})" title="세션 삭제">×</button>
      <div class="sf"><span>점유</span><span class="sess-stay"><label class="chk"><input type="checkbox" ${se.stay==="end"?"checked":""} onchange="setSess('${key}',${si},'stay',this.checked?'end':110)"><span>끝까지</span></label>
        <input type="number" min="30" step="10" value="${se.stay==="end"?"":(se.stay||110)}" ${se.stay==="end"?"disabled":""} onchange="setSess('${key}',${si},'stay',parseInt(this.value)||110)"><small>분</small></span></div>
      <div class="sf"><span>끝</span><input type="time" value="${se.until||""}" onchange="setSess('${key}',${si},'until',this.value)"></div>
    </div>`).join("")}
    <button class="btn sm" onclick="addSess('${key}')">＋ 세션</button>
  </div>`;
}
function sessTarget(key){ const d = view.schedDraft; return key==="h" ? d.holiday : d.days[Number(key)]; }
function setSess(key, si, k, v){ const t = sessTarget(key); if(!t.sessions) t.sessions = []; t.sessions[si][k] = v; render(); }
function addSess(key){ const t = sessTarget(key); if(!t.sessions) t.sessions = []; t.sessions.push({name:"세션", from:t.open||"11:00", lastBook:t.close||"20:00", stay:"end", until:t.close||"22:00"}); render(); }
function delSess(key, si){ const t = sessTarget(key); (t.sessions||[]).splice(si,1); render(); }
function sheetSchedule(){
  const d = view.schedDraft;
  const dayBlock = (x, i, key, label, cls) => `
    <div class="dayrow ${cls||''}">
      <div class="dr-h"><b>${label}</b></div>
      <div class="dr-in">
        <label><span>영업</span>
          <input type="time" value="${x.open}" onchange="setDay(${i},'open',this.value)">
          <em>~</em>
          <input type="time" value="${x.close}" onchange="setDay(${i},'close',this.value)"></label>
        <label><span>브레이크</span>
          <input type="time" value="${x.bs||""}" ${x.bs?"":"disabled"} onchange="setDay(${i},'bs',this.value)">
          <em>~</em>
          <input type="time" value="${x.be||""}" ${x.bs?"":"disabled"} onchange="setDay(${i},'be',this.value)"></label>
        <label class="chk"><input type="checkbox" ${x.bs?"":"checked"} onchange="toggleBreakDay(${i})">
          <span>브레이크타임 없음</span></label>
        <label><span>라스트오더</span>
          <input type="time" value="${x.lo||""}" ${x.lo?"":"disabled"} onchange="setDay(${i},'lo',this.value)">
          ${x.lo?`<button class="btn sm" onclick="autoLO(${i})">마감 1시간 20분 전</button>`:""}</label>
        <label class="chk"><input type="checkbox" ${x.lo?"":"checked"} onchange="toggleLoDay(${i})">
          <span>라스트오더 없음</span></label>
        ${sessRows(x, key)}
      </div>
    </div>`;
  const rows = d.days.map((x,i)=>dayBlock(x, i, String(i), DOW[i], i===0?'sun':i===6?'sat':'')).join("")
             + dayBlock(d.holiday, 7, "h", "공휴일", "sun");
  return `
    ${sheetHead(d.isNew?"운영시간 수정":"운영시간 편집")}
    <p class="f-note" style="margin:-6px 0 12px">세션 = 손님을 받는 시간대. <b>접수 마감</b>은 마지막으로 입장을 받는 시각(식사 시간 보장), <b>점유 '끝까지'</b>는 그 세션 끝까지 한 자리에 한 팀만.
      라스트오더는 주방 마감이라 별개입니다.</p>
    <label class="f"><div class="lb">적용 시작일</div>
      <input type="date" value="${d.from}" onchange="setSchedFrom(this.value)">
      <div class="f-note">이 날짜부터 새 시간이 적용됩니다. 그 전 날짜는 이전 설정을 그대로 씁니다.</div>
    </label>
    ${rows}
    <div class="sheet-actions">
      ${!d.isNew && d.from!=="2000-01-01" ? `<button class="btn danger" onclick="delSchedule('${d.from}')">삭제</button>`:""}
      <button class="btn ghost" onclick="closeSheet()">닫기</button>
      <button class="btn primary" onclick="saveSchedule()">저장</button>
    </div>`;
}
function dayOf(i){ return i===7 ? view.schedDraft.holiday : view.schedDraft.days[i]; }
function setDay(i,k,v){ dayOf(i)[k]=v; render(); }
function toggleBreakDay(i){
  const d = dayOf(i);
  if(d.bs){ d.bs=""; d.be=""; } else { d.bs="15:30"; d.be="17:00"; }
  render();
}
function toggleLoDay(i){
  const d = dayOf(i);
  d.lo = d.lo ? "" : minToHM(Math.max(0, toMin(d.close)-80));
  render();
}
function autoLO(i){
  const d = dayOf(i);
  d.lo = minToHM(Math.max(0, toMin(d.close) - 80));
  render();
}
function setSchedFrom(v){ view.schedDraft.from = v; render(); }
async function saveSchedule(){
  const st = store().settings, d = view.schedDraft;
  if(!d.from) return uiAlert("적용 시작일을 정해주세요","","warn");
  st.schedules = (st.schedules||[]).filter(s=>s.from!==d.from && s.from!==d.origFrom);   /* 시작일을 바꿨으면 옛 항목도 정리 */
  st.schedules.push({from:d.from, days:deepClone(d.days), holiday:deepClone(d.holiday)});
  st.schedules.sort((a,b)=>a.from.localeCompare(b.from));
  mirrorDraft("schedules");   /* 안 그러면 '적용하기'가 방금 저장한 것을 되돌립니다(점검 D1) */
  logEvent("설정 변경", `운영시간 ${d.from}부터`);
  view.form=null; view.schedDraft=null; saveData(); render();
}
async function delSchedule(from){
  if(!await uiConfirm("이 운영시간을 삭제할까요?", `${from}부터 적용되던 설정이 사라지고 이전 설정이 이어집니다.`, {ok:"삭제"})) return;
  const st = store().settings;
  st.schedules = st.schedules.filter(s=>s.from!==from);
  mirrorDraft("schedules");
  logEvent("설정 변경", `운영시간 삭제 ${from}`);
  view.form=null; saveData(); render();
}

/* 입력 중인 기간에 걸리는 확정 예약 (체류 시간까지 봅니다) */
function blockHits(room, d){
  if(!d.from) return [];
  const s = store();
  const to = d.openEnded ? "9999-12-31" : (d.to || d.from);
  return s.reservations.filter(function(r){
    if(r.roomId !== room.id || r.status !== "확정") return false;
    if(r.date < d.from || r.date > to) return false;
    if(d.allDay) return true;
    const rs0 = toMin(r.time), re0 = rs0 + stayOf(r);
    const bs = (r.date === d.from && d.fromTime) ? toMin(d.fromTime) : 0;
    const be = (!d.openEnded && r.date === to && d.toTime) ? toMin(d.toTime) : 24*60;
    return rs0 < be && bs < re0;
  }).sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
}
/* 걸리는 예약으로 바로 이동 — 그 날짜로 옮기고 예약 상세를 엽니다.
   설정에 임시본이 있으면 먼저 반영해야 대시보드가 같은 상태를 보여줍니다. */
async function gotoRes(id){
  const r = store().reservations.find(x=>x.id===id);
  if(!r) return;
  if(view.draft && !await uiConfirm("설정을 저장하고 예약으로 이동할까요?",
      "아직 '적용하기'를 누르지 않은 설정 변경이 있습니다.", {ok:"저장하고 이동"})) return;
  if(view.draft) applySettings(true);
  view.date = r.date;
  view.tab = "dash";
  openMark(id);
}
async function saveBlock(){
  const st = draft();
  const room = st.rooms.find(x=>x.id===view.form.id);
  const d = blkDraft();
  if(!room) return;
  if(!d.from) return uiAlert("시작 날짜를 정해주세요","","warn");
  if(!d.openEnded && d.to && d.to < d.from)
    return uiAlert("종료 날짜가 시작 날짜보다 빠릅니다","","warn");
  if(!d.allDay && d.fromTime && d.toTime && (d.openEnded || (d.to||d.from) === d.from) && d.toTime <= d.fromTime)
    return uiAlert("종료 시각이 시작 시각보다 빠릅니다","","warn");

  const hits = blockHits(room, d);
  if(hits.length){
    const lines = hits.slice(0,6).map(function(r){
      return `· ${dateLabel(r.date)} ${hm(r.time)} ${r.name} 손님 ${pplOf(r)}명`; }).join("\n");
    const ok = await uiConfirm(`${room.name}에 이 기간 예약 ${hits.length}건이 있습니다`,
      `${lines}${hits.length>6?`\n외 ${hits.length-6}건`:""}\n\n` +
      "사용 중지해도 예약은 지워지지 않습니다.\n대신 '경고 예약'으로 남아 확인 필요에 뜹니다.",
      {ok:"그래도 중지", cancel:"취소"});
    if(!ok) return;
  }
  const rec = {
    id:"blk_"+Date.now(),
    from:d.from,
    to:d.openEnded ? "" : (d.to || d.from),
    fromTime:d.allDay ? "" : (d.fromTime||""),
    toTime:d.allDay ? "" : (d.toTime||""),
    openEnded:!!d.openEnded,
    note:(d.note||"").trim()
  };
  st.rooms = st.rooms.map(function(x){
    return x.id===room.id ? {...x, blocks:(x.blocks||[]).concat([rec])} : x; });
  logEvent("좌석 사용 중지", `${room.name} ${rec.from}${rec.to?`~${rec.to}`:"~"}${rec.note?` (${rec.note})`:""}`);
  view.blkDraft = null;
  render();
}
async function delBlock(bid){
  const st = draft();
  const room = st.rooms.find(x=>x.id===view.form.id);
  if(!room) return;
  if(!await uiConfirm2("이 사용 중지 기간을 해제할까요?")) return;
  st.rooms = st.rooms.map(function(x){
    return x.id===room.id ? {...x, blocks:(x.blocks||[]).filter(b=>b.id!==bid)} : x; });
  logEvent("좌석 사용 중지 해제", room.name);
  render();
}

/* PIN = staff 계정 비밀번호. admin 토큰으로는 남(staff)의 비밀번호를 못 바꾸므로:
   관리자 비밀번호로 admin 로그인(권한 확인) → 현재 PIN 으로 staff 로그인 → 그 토큰으로 PUT /auth/v1/user.
   지금 세션(SESSION)은 건드리지 않습니다 — 임시 토큰만 씁니다 */
async function authToken(email, password){
  var j = await sb("/auth/v1/token?grant_type=password", { method:"POST", anon:true, body:{ email:email, password:password } });
  return j.access_token;
}
async function setPassword(token, password){
  var res = await fetch(SUPA_CFG.url + "/auth/v1/user", { method:"PUT",
    headers:{ "apikey":SUPA_CFG.anonKey, "Authorization":"Bearer " + token, "Content-Type":"application/json" },
    body: JSON.stringify({ password:password }) });
  if(!res.ok){ var j = null; try{ j = await res.json(); }catch(e){} var err = new Error((j && (j.msg || j.message || j.error_description)) || ("HTTP " + res.status)); err.status = res.status; throw err; }
}
async function savePin(){
  const g = id => document.getElementById(id).value;
  const adminPw = g("pin-admin"), cur = g("pin-cur"), a = g("pin-new"), b = g("pin-new2");
  if(!/^\d{4}$/.test(a)){ await uiAlert2("PIN은 숫자 4자리여야 합니다."); return; }
  if(a !== b){ await uiAlert2("새 PIN이 서로 다릅니다."); return; }
  if(!/^\d{4}$/.test(cur)){ await uiAlert2("현재 PIN을 입력하세요."); return; }
  try{
    try{ await authToken(SUPA_CFG.adminEmail, adminPw); }
    catch(e){ if(e.status === 400){ logEvent("PIN 변경 실패", "관리자 비밀번호 불일치"); await uiAlert2("관리자 비밀번호가 맞지 않습니다."); return; } throw e; }
    var staffTok;
    try{ staffTok = await authToken(SUPA_CFG.staffEmail, pinToPassword(cur)); }
    catch(e){ if(e.status === 400){ logEvent("PIN 변경 실패", "현재 PIN 불일치"); await uiAlert2("현재 PIN이 맞지 않습니다."); return; } throw e; }
    await setPassword(staffTok, pinToPassword(a));
  }catch(e){
    await uiAlert("PIN을 바꾸지 못했습니다", e.network ? "서버에 연결할 수 없습니다." : e.message, "warn"); return;
  }
  pinHashSave(a);
  logEvent("PIN 변경", "성공");
  view.form = null; render();
  await uiAlert2("PIN이 변경되었습니다.\n다른 기기는 다음 로그인부터 새 PIN 을 씁니다.");
}

/* ============================================================
   예약 등록 마법사 (5단계) — 전화 응대 순서대로 진행
   직원 누구나 화면에 뜬 질문을 그대로 읽으면 되도록 구성
   ============================================================ */
let WZ = null;   /* 진행 중인 예약 입력 상태. null이면 닫힘 */

/* 손님께 그대로 읽어 드리는 말은 큰따옴표로 묶습니다 —
   직원이 화면을 보고 읽을 때 어디까지가 손님께 할 말인지 바로 보이게 */
const WZ_STEPS = [
  "어떤 경로로 온 예약인가요?",
  "\u201C날짜와 시간은 언제로 해 드릴까요?\u201D",
  "\u201C몇 분이서 오세요?\u201D",
  "\u201C룸과 테이블 중 어디로 해 드릴까요?\u201D",
  "\u201C식사는 코스로 준비해 드릴까요?\u201D",
  "\u201C예약자 성함과 연락처 부탁드립니다.\u201D",
  "\u201C알러지나 따로 요청하실 사항 있으세요?\u201D"
];
const WZ_LABELS = ["경로","날짜·시간","인원","좌석","메뉴","예약자","요청사항"];
const LAST_STEP = 6;

/* 코스 구성 기본값 — 실제 값은 설정(settings.courseGroups)에서 관리합니다 */
const DEFAULT_COURSE_GROUPS = [
  { id:"cg_dinner",  label:"저녁 (종일)", items:["오","촉","한","위"],     when:["종일"] },
  { id:"cg_wdlunch", label:"평일 점심",   items:["요리사","동한","서한"],  when:["평일점심"] },
  { id:"cg_welunch", label:"주말 점심",   items:["요리사","B","A"],        when:["주말점심"] }
];
const WHEN_OPTS = ["종일","평일점심","평일저녁","주말점심","주말저녁"];
function courseGroups(){ return store().settings.courseGroups || DEFAULT_COURSE_GROUPS; }
/* 코스 키의 앞부분(cg_xxx)으로 묶음을 찾습니다.
   ※ 예전 키는 앞부분이 '순서 번호'(0, 1, 2) 였습니다. 설정에서 순서만 바꿔도
      저장된 예약이 전부 다른 묶음을 가리키게 되는 구조라 고정 id 로 바꿨습니다.
      옛 키는 migrate() 가 옮겨 주지만, 혹시 남아 있으면 번호로도 찾아 줍니다. */
function courseGroupById(gs, id){
  var i;
  for(i = 0; i < gs.length; i++) if(gs[i].id === id) return gs[i];
  if(/^\d+$/.test(id)) return gs[+id] || null;
  return null;
}

/* ---------- 뒤로가기 보호 ----------
   앱은 주소를 history.replaceState 로만 바꾸므로 브라우저 뒤로가기가 눌리면 사이트 밖으로 나가 입력이 날아갔습니다.
   마법사·수정 시트를 열 때 history 에 한 칸(pushState) 넣어 두면 뒤로가기는 '닫기' 가 됩니다 —
   닫을지 한 번 묻고, 취소하면 그 칸을 다시 넣습니다. 정상으로 닫을 때는 그 칸을 도로 빼서(histPop) 뒤로가기가 헛돌지 않게 합니다.
   새로고침·탭 닫기는 beforeunload 로 브라우저 기본 확인창 — 문구는 브라우저가 정하고 우리 문구는 못 넣습니다.
   디스플레이(view.display)에서는 둘 다 걸지 않습니다 (TV 는 방치용) */
function isEditingRes(){ return !view.display && (!!WZ || !!(view.form && view.form.type === "res")); }
/* history.back() 은 비동기라, 처리되기 전에 다시 열고 닫으면 back() 이 두 번 나가 사이트 밖으로 나갑니다.
   되돌리는 중(HIST_PENDING)에는 push/pop 을 하지 않고, 그 back() 의 popstate 가 왔을 때 상황에 맞게 정리합니다 */
var HIST_PENDING = false;
function histPush(){
  if(view.display || HIST_PENDING) return;   /* 되돌리는 중이면 popstate 가 칸을 다시 넣어 줍니다 */
  try{ if(!(history.state && history.state.wz)) history.pushState({wz:1}, ""); }catch(e){}
}
function histPop(){
  if(HIST_PENDING) return;
  try{ if(history.state && history.state.wz){ HIST_PENDING = true; history.back(); } }catch(e){}
}
window.addEventListener("popstate", async function(){
  if(HIST_PENDING){
    HIST_PENDING = false;
    /* 닫는 사이에 다른 입력이 열렸으면(마법사 완료 → 새 예약 등) 칸을 도로 넣어 보호를 이어 갑니다 */
    if(isEditingRes()){ try{ history.pushState({wz:1}, ""); }catch(e){} }
    return;
  }
  if(!isEditingRes()) return;
  if(!await uiConfirm2("입력 중인 예약이 있습니다. 나갈까요?")){
    try{ history.pushState({wz:1}, ""); }catch(e){}
    return;
  }
  WZ = null; view.form = null; tmpRes = null; render();
});
window.addEventListener("beforeunload", function(e){
  if(!isEditingRes()) return;
  e.preventDefault(); e.returnValue = "";
});
function openWizard(date){
  if(readonlyBlock()) return;
  histPush();
  WZ = {
    step:0, source:null, sourceDetail:"",
    calMonth:(date||view.date).slice(0,7),
    date:date||view.date, time:null,
    people:null, infants:0, chairs:0, customPeople:false, phoneNone:false,
    menuType:null, courses:{}, courseOpen:false,
    seat:null, seatExtra:[], seatKind:null,   /* 좌석 id | 'room-any' | 'table-any'. seatExtra = 합친 나머지 좌석 */
    name:"", phone:"", allergy:"", request:"", memo:"",
    done:null               /* 등록 완료 후 확인 메시지용 */
  };
  render();
}
async function closeWizard(){
  if(WZ && !WZ.done && (WZ.name || WZ.time)){
    if(!await uiConfirm2("입력 중인 예약이 있습니다. 닫을까요?")) return;
  }
  WZ = null; render(); histPop();
}
async function wzGo(n){
  wzSyncInputs();                       /* 먼저 입력값을 상태로 옮긴 뒤 */
  /* 두 단계 이상 앞으로 뛰면(단계 점) 한 단계씩 검사하며 갑니다 — 좌석·메뉴·알러지 확인을 건너뛰고 등록되던 것(점검 R2) */
  if(n > WZ.step + 1){
    while(WZ.step < n){ const was = WZ.step; await wzGo(was + 1); if(WZ.step !== was + 1) return; }
    return;
  }
  if(n > WZ.step && !wzCanNext()) return; /* 통과 여부를 검사 */
  /* 마지막 예약 가능 시각을 넘겼는지 확인 */
  if(n===2 && WZ.time){
    const reason = timeBlock(WZ.date, WZ.time);
    if(reason){
      const dh = hoursFor(WZ.date);
      const ok = await uiConfirm(reason,
        `${dateLabel(WZ.date)} ${hm(WZ.time)}\n` +
        (dh.closed ? "" : `영업 ${dh.open} ~ ${dh.close}${dh.bs?` · 브레이크 ${dh.bs} ~ ${dh.be}`:""}${dh.lo?` · 라스트오더 ${dh.lo}`:""}\n`) +
        `\n손님께 안내하신 뒤 진행하세요.`,
        {ok:"안내했습니다", cancel:"시간 다시 고르기"});
      if(!ok) return;
    }
  }
  /* 전화번호 없이 넘어가려 할 때 — 막지는 않되 한 번 되묻습니다.
     번호가 없으면 예약 확인 전화도, 늦으실 때 연락도 못 합니다.
     '해당 없음'을 손이 미끄러져 누른 경우를 여기서 잡아 줍니다. */
  if(n > 5 && WZ.step === 5 && WZ.phoneNone){
    const ok = await uiConfirm("전화번호 없이 접수합니다",
      `${WZ.name || "이 손님"}은 연락처가 없습니다.\n` +
      `예약 확인이나 변경 안내를 드릴 수 없고, 노쇼 이력도 남지 않습니다.\n\n` +
      `현장에서 직접 받으신 예약이라면 그대로 진행하세요.`,
      {ok:"이대로 접수", cancel:"번호 입력하기"});
    if(!ok) return;
  }
  WZ.step = Math.max(0, Math.min(LAST_STEP, n));
  WZ.maxStep = Math.max(WZ.maxStep || 0, WZ.step);
  render();
  /* 단계를 옮길 때만 맨 위로 */
  const mid = document.querySelector(".wz-mid");
  if(mid) mid.scrollTop = 0;
}
/* 고르는 순간 다음 단계로 — 단, 경고가 걸리면 이 화면에 멈춰서 빨갛게 보여 줍니다.
   (넘어가 버리면 경고를 아무도 못 봅니다. 확인 팝업이 이미 뜬 것도 여기서 한 번 더 걸립니다) */
function wzAutoNext(){
  if(WZ.step < LAST_STEP && wzCanNext() && !wzWarnReason()) wzGo(WZ.step + 1);
  else render();
}
/* 다음으로 넘어갈 수 있는지 검사 */
function wzCanNext(){
  if(WZ.step===0) return !!WZ.source;
  if(WZ.step===1) return !!(WZ.date && WZ.time);
  if(WZ.step===2) return WZ.people>0;
  if(WZ.step===3) return !!WZ.seat;
  if(WZ.step===4){
    if(!WZ.menuType) return false;
    /* 코스를 골라 놓고 구성을 비운 채 넘어가면 나중에 아무도 안 채웁니다.
       '코스 미정' 을 누르면 통과됩니다. */
    if(WZ.menuType==="코스" && !WZ.courseUndecided && courseCount()===0) return false;
    return true;
  }
  /* 한 글자라도 들어가면 됩니다 — 가명·이니셜·외국 이름도 받습니다 */
  if(WZ.step===5) return WZ.name.trim().length>0 &&
    (WZ.phoneNone || WZ.phone.trim().length>0);
  /* 알러지는 확인했다는 표시가 있어야 넘어갑니다 */
  if(WZ.step===6) return WZ.allergyNone || (WZ.allergy||"").trim().length>0;
  return true;
}
/* 화면을 다시 그리기 전에 입력창 값을 상태로 옮김.
   ※ 예전에는 입력창이 없을 때 g() 가 빈 문자열을 돌려주고, 그 빈 값을 그대로 WZ 에 넣었습니다.
      6단계(요청사항)에는 wz-name 이 없으므로 거기서 이 함수가 불릴 때마다 성함이 지워졌고,
      등록 버튼(wzSubmit)이 맨 먼저 이 함수를 부르는 탓에 매번 "성함을 입력하세요"가 떴습니다.
      이제 화면에 있는 입력창만 옮겨 담습니다. */
function wzSyncInputs(){
  const g=function(id){ const el=document.getElementById(id); return el?el.value:null; };
  const set=function(key,id){ const v=g(id); if(v!==null) WZ[key]=v; };
  set("name","wz-name");
  set("phone","wz-phone");
  set("allergy","wz-allergy");
  set("request","wz-request");
  set("memo","wz-memo");
  set("sourceDetail","wz-src-detail");
}

function renderWizard(){
  if(WZ.done) return wzDone();
  const bodies = [wzStepSource, wzStepDate, wzStepPeople, wzStepSeat, wzStepMenu, wzStepGuest, wzStepExtra];
  const dots = WZ_LABELS.map((l,i)=>
    `<button class="wz-dot ${i===WZ.step?'on':''} ${i<WZ.step?'past':''}" onclick="wzGo(${i})" ${i > (WZ.maxStep||0) + 1 ? "disabled" : ""}>
       <span class="n">${i+1}</span><span class="l">${l}</span></button>`).join("");
  const canNext = wzCanNext();
  const warn = wzWarnReason();
  const last = WZ.step===LAST_STEP;

  return `
  <div class="wz">
    <header class="wz-top">
      <button class="wz-back" onclick="${WZ.step===0?'closeWizard()':`wzGo(${WZ.step-1})`}">
        ${WZ.step===0?"✕ 닫기":"← 이전"}

      <div class="wz-sum">${wzSummary()}</div>

    <div class="wz-mid">
      <div class="wz-q">
        <h2>${WZ_STEPS[WZ.step]}</h2>
        <div class="wz-warn" id="wz-warn">${
        String(warn||"").split("\n").map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>
      <div class="wz-body">${bodies[WZ.step]()}</div>
    </div>
    <footer class="wz-foot">
      ${last?`<button class="btn ghost lg" onclick="wzSubmit()">바로 등록</button>`:""}
      <button id="wz-next" class="btn primary lg grow ${canNext?'':'off'} ${warn?'warned':''}"
        onclick="${last?'wzSubmit()':`wzGo(${WZ.step+1})`}" ${canNext?"":"disabled"}>

/* 이 날짜·시각에 예약을 잡으면 생기는 문제 (없으면 빈 문자열) */
/* 그 시각에 예약하면 생기는 문제를 **전부** 돌려줍니다.
   예전에는 첫 번째 하나만 돌려줘서, 라스트오더와 마감이 같이 걸려도 하나만 보였습니다.
   또 라스트오더는 '이미 넘김'만 알렸는데, 그보다 필요한 건
   "식사 중에 라스트오더가 다가온다"는 사전 안내입니다. */
function timeWarns(date, time){
  const dh = hoursFor(date), out = [];
  if(dh.closed) return [`휴무일${dh.note?` - ${dh.note}`:""}`];
  if(inBreak(date, time)) return ["브레이크입니다"];
  if(toMin(time) < toMin(dh.open) || toMin(time) >= toMin(dh.close)) return ["영업시간 아님"];

  const stx = store().settings;
  const t = toMin(time);
  const end = t + stayMinAt(date, time);
  /* 접수 마감(세션의 lastBook) — 식사 시간을 보장하려고 정한 마지막 입장 시각. 라스트오더(주방 마감)와 다릅니다 */
  const sess = sessionAt(date, time);
  const lb = lastBookMin(date, time);
  if(t > lb) out.push(`접수 마감 이후입니다 - ${sess?sess.name+" ":""}${hm(minToHM(lb))}까지`);
  /* 라스트오더까지 남은 주문 시간 — 직원이 손님께 "주문 가능 시간이 40분입니다" 라고 바로 말할 수 있게 */
  if(dh.lo){
    const lo = toMin(dh.lo);
    if(t > lo) out.push("라스트오더 이후입니다.");
    else { const soon = stx.loSoon != null ? stx.loSoon : 120; if(lo - t <= soon) out.push(`라스트오더 임박 - 주문시간 ${hmDur(lo - t)}`); }
  }
  if(dh.bs && t < toMin(dh.bs)){
    if((stx.breakMode||"leave")==="leave"){
      if(end > toMin(dh.bs)) out.push(`식사 중 브레이크가 시작됩니다 - 식사시간 ${hmDur(toMin(dh.bs) - t)}`);
    }else{
      const buf = stx.breakEntryBuffer != null ? stx.breakEntryBuffer : 60;
      if(t > toMin(dh.bs) - buf) out.push(`브레이크 임박 - ${buf}분 전 이후 입장`);
    }
  }
  if(end > toMin(dh.close)) out.push(`마감 임박 - 식사시간 ${hmDur(toMin(dh.close) - t)}`);
  return out;
}
/* 분 → "1시간 05분" 꼴. 한 시간이 안 돼도 "0시간 40분" 으로 자리를 맞춥니다 (문구 길이가 흔들리지 않게) */
function hmDur(m){
  m = Math.max(0, m);
  return `${Math.floor(m/60)}시간 ${pad(m%60)}분`;
}
function timeWarn(date, time){ return timeWarns(date, time).join("\n"); }
/* 확인 팝업을 띄울 만큼 심각한 것만.
   '라스트오더 임박' 은 저녁 예약이면 거의 매번 걸리므로 화면 표시로만 두고
   여기서는 뺍니다 — 팝업이 자주 뜨면 안 읽고 누르게 됩니다 (설계 5.2 주의). */
function timeBlock(date, time){
  return timeWarns(date, time).filter(function(x){ return x.indexOf("라스트오더 임박") < 0; }).join("\n");   /* 임박은 알림만, 확인창은 안 띄움 */
}
/* 시간 칸에 붙는 짧은 말. 여러 개가 걸리면 가장 중한 것 하나만 */
function shortWarn(msg){
  if(msg.indexOf("휴무") >= 0) return "휴무";
  if(msg.indexOf("영업시간") >= 0) return "영업 외";
  if(msg.indexOf("지난 날짜") >= 0) return "확인";
  if(msg.indexOf("브레이크입니다") >= 0) return "브레이크";
  if(msg.indexOf("접수 마감") >= 0) return "접수 마감";
  if(msg.indexOf("라스트오더 이후") >= 0) return "라스트오더 지남";
  if(msg.indexOf("마감") >= 0) return "마감 넘김";
  if(msg.indexOf("라스트오더") >= 0) return "라스트오더 임박";
  if(msg.indexOf("브레이크") >= 0) return "브레이크 임박";
  return "확인";
}

/* 지금 단계에서 걸리는 문제 — 있으면 '다음' 버튼이 빨갛게 바뀝니다 */
/* 걸리는 것을 **전부** 돌려줍니다. 여러 개면 줄바꿈으로 이어 붙습니다 —
   예전에는 첫 번째 하나만 보여서, 겹침과 최소 인원이 같이 걸려도 하나만 알려줬습니다. */
function wzWarnReason(){
  const st = store().settings;
  const out = [];
  if(WZ.step===1){
    const dh = hoursFor(WZ.date);
    if(WZ.date < todayStr()) out.push("지난 날짜");
    if(WZ.time) out.push.apply(out, timeWarns(WZ.date, WZ.time));
    else if(dh.closed) out.push(`휴무일${dh.note?` - ${dh.note}`:""}`);
  }
  if(WZ.step===3 && WZ.seat){
    const room = st.rooms.find(x=>x.id===WZ.seat);
    if(room && room.type==="room"){
      const rs = roomStatus(WZ.date, WZ.time, WZ.seat);
      const who = rs.hits.map(x=>`${hm(x.time)} ${x.name} ${pplText(x)}`).join(", ");
      if(rs.state==="blocked") out.push(`1시간 안에 다른 예약${who?` - ${who}`:""}`);
      else if(rs.state==="warn") out.push(`식사 시간이 겹침${who?` - ${who}`:""}`);
      const cnt = seatCountsInfants() ? WZ.people : adultCount(WZ.people, WZ.infants);
      if(cnt > room.capacity) out.push(`정원 초과 - ${seatLabel(room.id)} 최대 ${room.capacity}명`);
      if(cnt < roomMin(room)) out.push(`최소 인원 미달 - ${seatLabel(room.id)} ${roomMin(room)}명부터`);
      const bk = blockedAt(room, WZ.date, WZ.time);
      if(bk) out.push(`사용 중지 - ${seatLabel(room.id)}${bk.note?` · ${bk.note}`:""}`);
    }
    /* 테이블(층): 같은 시간대 손님 수가 자리 수를 넘으면 — 막지 않고 이 화면에 빨갛게 */
    const fl = prefFloor(WZ.seat);
    if(fl != null && WZ.time){
      const fit = floorFit(fl, WZ.date, WZ.time, WZ.people||0);
      if(fit.state === "none") out.push(`테이블 자리 없음 - ${floorLabel(fl)} 한 자리 최대 ${floorMaxParty(fl, WZ.date, WZ.time)}명 (지금 ${WZ.people}명)`);
      else if(fit.state === "split") out.push(`나눠 앉음 - ${floorLabel(fl)}에 붙일 테이블이 없어 옆 테이블에 나눠 앉습니다`);
    }
  }
  if(WZ.step===2 && WZ.people && (WZ.infants||0) >= WZ.people) out.push(`성인이 없음 - 유아만 ${WZ.infants}명`);
  if(WZ.step===5){
    if(WZ.phoneNone) out.push("전화번호 없음");
    else if(WZ.phone && WZ.phone.replace(/\D/g,"").length < 9)
      out.push("전화번호가 짧음");
    const ns = WZ.phone ? noshowOf(WZ.phone) : null;
    if(ns) out.push(`노쇼 이력 - ${ns.count}회`);
  }
  if(WZ.step===4){
    const seat = st.rooms.find(x=>x.id===WZ.seat);
    if(seat && seat.type==="room"){
      const adults = adultCount(WZ.people, WZ.infants);
      const n = courseCount();
      if(WZ.menuType==="해당 없음") out.push("룸인데 코스가 아님");
      if(WZ.menuType==="확인 필요") out.push("룸인데 코스 여부 미확인");
      if(WZ.menuType==="코스" && !WZ.courseUndecided && n>0 && n<adults)
        out.push(`코스 부족 - ${n}인분 / 성인 ${adults}명`);
      if(WZ.menuType==="코스" && !WZ.courseUndecided && n>adults)
        out.push(`코스 초과 - ${n}인분 / 성인 ${adults}명`);
    }
    out.push.apply(out, courseWarns());
  }
  if(WZ.step===6){
    if((WZ.chairs||0) > (WZ.infants||0)) out.push(`의자가 유아보다 많음 - 의자 ${WZ.chairs||0} / 유아 ${WZ.infants||0}`);
    if((WZ.chairs||0) < (WZ.infants||0)) out.push(`의자가 유아보다 적음 - 의자 ${WZ.chairs||0} / 유아 ${WZ.infants||0}`);
  }
  return out.join("\n");
}

/* 상단에 지금까지 고른 값 요약 */
function wzSummary(){
  const p=[];
  if(WZ.source) p.push(WZ.source==="기타" && WZ.sourceDetail ? WZ.sourceDetail : WZ.source);
  if(WZ.date && WZ.time) p.push(`${(+WZ.date.slice(5,7))}/${(+WZ.date.slice(8))} ${hm(WZ.time)}`);
  if(WZ.people) p.push(`${WZ.people}명${WZ.infants?`(유아${WZ.infants})`:""}`);
  if(WZ.seat) p.push(WZ.seatExtra && WZ.seatExtra.length ? seatLabelIds([WZ.seat].concat(WZ.seatExtra)) : seatLabel(WZ.seat));
  return p.map(x=>`<span>${esc(x)}</span>`).join("");
}
function hm(t){
  const [h,m]=t.split(":").map(Number);
  const ap = h<12?"오전":"오후";
  const h12 = h%12===0?12:h%12;
  return `${ap} ${h12}시${m?` ${m}분`:""}`;
}
function seatLabel(seat){
  const st = store().settings;
  if(seat==="any") return "좌석 상관없음";
  if(seat==="hall-any" || seat==="table-any") return "테이블";
  if(/^table:/.test(seat||"")) return floorLabel(seat.slice(6));
  if(seat==="room-any") return "룸 중 아무곳";
  const j = (st.joins||[]).find(g=>g.id===seat);
  if(j) return j.ids.map(id=>{ const x = seatById(id); return x ? x.name : "?"; }).join("+") + " 룸";
  const r = seatById(seat);
  if(!r) return "미배정";
  /* 이름 뒤에 종류를 붙여 직원이 바로 알게 — '조조 룸', '21 테이블' */
  return r.type==="room" ? `${r.name} 룸` : `${r.name} 테이블`;
}
/* 여러 좌석(합침) 라벨 — '장비+관우 룸', '하후돈+하후상-1 테이블' */
function seatLabelIds(ids){
  if(!ids || !ids.length) return "미배정";
  if(ids.length===1) return seatLabel(ids[0]);
  const xs = ids.map(seatById).filter(Boolean);
  const kind = xs.length && xs[0].type==="room" ? " 룸" : " 테이블";
  return xs.map(x=>x.name).join("+") + kind;
}
/* 예약의 확정 좌석 라벨 / 잠정 좌석 라벨 */
function resSeatLabel(r){
  if(r.roomId) return seatLabelIds([r.roomId].concat(r.extraIds||[]));
  if(isTablePref(r.seatPref)) return seatLabel(r.seatPref);   /* 테이블 예약은 층까지만 — 미배정이 아닙니다 */
  return "미배정";
}
/* 룸 미배정(잠정 포함) 여부 — 테이블 예약은 층이 자리이므로 미배정으로 세지 않습니다 */
function isUnassigned(r){ return !r.roomId && !isTablePref(r.seatPref); }
function resTentLabel(r){
  if(isTablePref(r.seatPref)) return "";   /* 테이블 예약의 숨은 배정은 이름을 보여 주지 않습니다 — 층까지만 */
  return r.tentativeRoomId ? seatLabelIds([r.tentativeRoomId].concat(r.tentativeExtra||[])) : "";
}

/* ---------- 1단계: 날짜 + 시간 ---------- */
function wzStepDate(){
  const s = store(), st = s.settings;
  const [y,m] = WZ.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1), lastDay = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const today = todayStr();

  let cells = "";
  /* 달력은 항상 6줄(42칸)로 그립니다.
     5주짜리 달과 6주짜리 달이 번갈아 나오면 아래 시각 칸이 한 줄씩 오르내립니다.
     빈 칸이 한 줄 생기는 것이 화면이 들썩이는 것보다 낫습니다. */
  for(let i=0;i<lead;i++) cells += `<span class="bday"></span>`;
  for(let d=1; d<=lastDay; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    const list = s.reservations.filter(r=>r.date===ds && r.status==="확정");
    const dow = new Date(ds+"T00:00:00").getDay();
    const cls = ["bday","btn-day", WZ.date===ds?"sel":"", ds===today?"today":"",
                 ds<today?"past":"", dow===0?"sun":dow===6?"sat":""].join(" ");
    cells += `<button class="${cls}" onclick="wzPickDate('${ds}')">
        <span class="d">${d}</span>
        ${list.length?`<span class="b">${list.length}건</span>`:""}
      </button>`;
  }
  for(let i=lead+lastDay; i<42; i++) cells += `<span class="bday"></span>`;

  /* 영업시간 안에서 30분 단위 시각 후보 생성 (11:00, 11:30, … 마감 전까지).
     1시간 칸이면 7:00 과 7:30 의 사정(라스트오더·브레이크)이 한 칸에 섞여 어느 쪽이 안 되는지 안 보였습니다 */
  const dh = hoursFor(WZ.date);
  /* 칸 수는 '이번 주 중 가장 이른 개점 ~ 가장 늦은 마감' 으로 고정합니다.
     일요일(20:30 마감)을 누르면 칸이 세 개 줄어 아래가 올라오던 것이 원인이었습니다.
     오늘 영업시간 밖인 칸은 그대로 두고 '영업 전 / 영업 종료' 로 흐리게만 표시합니다. */
  const range = weekHourRange(WZ.date);
  const slots = [];
  for(let t = range.open; t < range.close; t += 30) slots.push(t);
  const todayOpen = dh.closed ? null : toMin(dh.open), todayClose = dh.closed ? null : toMin(dh.close);
  const curT = WZ.time ? toMin(WZ.time) : null;
  const curSlot = curT===null ? null : Math.floor(curT/30)*30;   /* 고른 시각이 속한 30분 칸 */
  const base = curSlot===null ? 0 : curSlot%60;                  /* 분 레일의 시작(0 또는 30) */
  const off = curT===null ? 0 : curT - curSlot;                  /* 칸 안에서의 분 (0~25) */

  const isToday = WZ.date===todayStr();
  const isPastDate = WZ.date < todayStr();
  const nowM = toMin(nowHM());
  const slotCells = slots.map(t=>{
    const h = Math.floor(t/60), m = t%60;
    const n = s.reservations.filter(r=>r.date===WZ.date && r.status==="확정" && Math.floor(toMin(r.time)/30)*30===t).length;
    /* 이 칸을 고르면 경고가 생기는지 미리 확인합니다 */
    const probe = timeWarn(WZ.date, minToHM(t));
    /* 지난 시각도 누를 수는 있게 — 예약 누락을 나중에 입력하는 경우가 있습니다 */
    const gone = isPastDate || (isToday && t+30 <= nowM);
    /* 오늘(고른 날) 영업시간 밖 — 칸은 자리를 지키되 누를 수 없게 */
    const outside = dh.closed || t < todayOpen || t >= todayClose;
    /* 브레이크타임에 걸리는 칸은 따로 표시 */
    const brk = dh.bs && dh.be && t >= toMin(dh.bs) && t < toMin(dh.be);
    const bad = !!probe;
    /* 경고가 걸리는 시각은 작은 표시만이 아니라 시각 글자까지 벽돌색 — 눈이 먼저 가야 하는 칸입니다 */
    const red = (bad || brk) ? " rust" : "";
    return `<button class="hcell ${curSlot===t?'on':''} ${bad?'late warned':''} ${gone?'gone':''} ${brk?'brk':''} ${outside?'outside':''}" ${outside?'disabled':`onclick="wzPickSlot(${t})"`}>
      <span class="ap${red}">${h<12?"오전":"오후"}</span>
      <span class="hh${red}">${h%12===0?12:h%12}:${pad(m)}</span>
      ${outside?`<span class="hn muted2">${dh.closed?"휴무":(t<todayOpen?"영업 전":"영업 종료")}</span>`
           :brk?`<span class="hn rust">브레이크</span>`
           :bad?`<span class="hn rust">${esc(shortWarn(probe))}</span>`
           :gone?`<span class="hn muted2">지난 시간</span>`
           :(n?`<span class="hn">${n}건</span>`:`<span class="hn">&nbsp;</span>`)}
    </button>`;
  }).join("");

  /* 분 조절은 고른 30분 칸 안에서만 움직입니다 — 정각 칸이면 00~25, 30분 칸이면 30~55.
     시각을 고르기 전에도 자리를 지킵니다(.idle) — 누르는 순간 레일이 생기며 화면이 내려앉지 않게 */
  const pct = v => (v/25)*100;
  const minuteRail = `
    <div class="mwrap ${curSlot===null?'idle':''}">
      <div class="mhead"><span class="lbl">분</span><span class="mnow">${curSlot===null?"시각을 먼저 고르세요":hm(WZ.time)}</span></div>
      <div class="mrail" id="mrail">
        <div class="mtrack"></div>
        <div class="mfill" style="width:${pct(off)}%"></div>
        ${[0,5,10,15,20,25].map(v=>
          `<span class="mnotch ${v%10===0?'big':''}" style="left:${pct(v)}%"></span>`).join("")}
        <div class="mknob" style="left:${pct(off)}%">${pad(base+off)}</div>
        ${[0,5,10,15,20,25].map(v=>
          `<button class="mtick ${off===v?'on':''}" style="left:${pct(v)}%" onclick="wzPickMin(${v})">${pad(base+v)}</button>`).join("")}
      </div>
      <div class="mfine">
        <button ${off<=0?"disabled":""} onclick="wzNudge(-5)">− 5분</button>
        <button ${off>=25?"disabled":""} onclick="wzNudge(5)">＋ 5분</button>
      </div>
    </div>`;

  return `
    <div class="wz-step1">
    <div class="wz-cal">
      <div class="mo-h">
        <button class="nav" onclick="wzMonth(-1)" aria-label="이전 달">◀</button>
        <div class="mo">${y}년 ${m}월</div>
        <button class="nav" onclick="wzMonth(1)" aria-label="다음 달">▶</button>
      </div>
      <div class="bgrid bhead">${["일","월","화","수","목","금","토"].map((x,i)=>`<span class="${i===0?'sun':i===6?'sat':''}">${x}</span>`).join("")}</div>
      <div class="bgrid">${cells}</div>
    </div>
    <div class="wz-time">
      ${hoursLineHtml(dh)}
      <div class="lbl" style="margin-bottom:8px">${WZ.date?dateLabel(WZ.date):"날짜를 먼저 고르세요"} · 시각</div>
      <div class="hgrid">${slotCells}</div>
      ${minuteRail}
    </div>
    </div>`;
}
/* 그 날짜가 속한 주(일~토) 7일의 영업시간을 모아 가장 이른 개점·가장 늦은 마감을 돌려줍니다.
   시각 칸 수를 요일에 따라 바뀌지 않게 고정하는 데 씁니다. 휴무일은 건너뜁니다. */
function weekHourRange(dateStr){
  var d0 = new Date(dateStr + "T00:00:00");
  d0.setDate(d0.getDate() - d0.getDay());
  var open = 24*60, close = 0, i;
  for(i=0;i<7;i++){
    var d = new Date(d0); d.setDate(d0.getDate()+i);
    var h = hoursFor(todayStr(d));
    if(h.closed) continue;
    open = Math.min(open, Math.floor(toMin(h.open)/30)*30);
    close = Math.max(close, Math.ceil(toMin(h.close)/30)*30);
  }
  if(open >= close){ open = 11*60; close = 22*60; }   /* 전부 휴무인 주 — 기본 범위 */
  return { open:open, close:close };
}
function wzPickDate(d){ WZ.date=d; render(); }
function wzMonth(n){
  const [y,m]=WZ.calMonth.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  WZ.calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1);
  render();
}
/* 30분 칸을 고르면 그 칸의 시작 시각(정각 또는 30분)이 됩니다. 세부 분은 아래 레일에서 */
function wzPickSlot(t){ WZ.time = minToHM(t); render(); }
/* 레일의 분(0~25)을 칸 시작에 더한 시각 */
function wzSlotBase(){ return WZ.time ? Math.floor(toMin(WZ.time)/30)*30 : 18*60; }
function wzPickMin(v){
  WZ.time = minToHM(wzSlotBase() + Math.min(25, Math.max(0, v))); render();
}
function wzNudge(d){
  if(!WZ.time) return;
  const base = wzSlotBase(), off = toMin(WZ.time) - base;
  /* 칸 안(0~25분)에서만 — 칸을 바꾸는 것은 위 타일에서 */
  const next = Math.min(25, Math.max(0, off + d));
  if(next===off) return;
  WZ.time = minToHM(base + next); render();
}
/* 분 레일을 손가락으로 끌어서 조절 */
function wzRefreshNext(){
  const b = document.getElementById("wz-next");
  if(!b) return;
  const ok = wzCanNext();
  b.disabled = !ok;
  b.classList.toggle("off", !ok);
  /* 경고 문구도 함께 갱신 */
  const warn = wzWarnReason();
  b.classList.toggle("warned", !!warn);
  const bar = document.getElementById("wz-warn");
  if(bar){ bar.innerHTML = String(warn||"").split("\n").map(l=>`<div>${esc(l)}</div>`).join(""); }
}
/* 창 크기나 브라우저 배율이 바뀌면 칸 높이도 바뀝니다.
   글자 크기는 CSS 가 알아서 따라가지만, '몇 줄까지 보일지'는 자바스크립트가 정하므로
   여기서 다시 계산해 줍니다. 연달아 들어오는 resize 는 마지막 것만 처리합니다. */
var fitTimer = null;
window.onresize = function(){
  if(fitTimer) clearTimeout(fitTimer);
  fitTimer = setTimeout(function(){ fitTimer = null; if(view.display) fitDisplay(); }, 180);
};
/* 폰 압축 그래프는 11시간을 가로로 늘려 스크롤합니다 — 그린 직후 현재 시각 1시간 전이 왼쪽에 오게 */
function scrollTlToNow(){
  var sc = document.querySelector(".tl-scroll.compact"); if(!sc) return;
  var track = sc.querySelector(".tl-track"); if(!track) return;
  var line = sc.querySelector(".nowline"); if(!line || /edge/.test(line.className)) return;
  var x = line.offsetLeft - track.clientWidth / 11;   /* 한 시간 폭만큼 앞에 */
  sc.scrollLeft = Math.max(0, track.offsetLeft + x - 88);
}
function afterRender(){
  scrollTlToNow();
  restoreScroll();   /* 다시 그리기 전 스크롤 위치로 되돌립니다 */
  fitDisplay();   /* 디스플레이 모드 글자 크기를 화면에 맞게 키움 */
  /* 타임라인은 좁은 화면에서 가로로 스크롤됩니다 — 현재 시각이 보이도록 맞춰 둡니다 */
  const tls = document.getElementById("tl-scroll");
  if(tls && tls.scrollWidth > tls.clientWidth){
    const line = tls.querySelector(".nowline");
    if(line){
      const x = line.offsetLeft - tls.clientWidth*0.35;
      tls.scrollLeft = Math.max(0, x);
    }
  }
  /* 예약자 이름·전화는 글자를 칠 때마다 상태에 반영해서 '다음' 버튼을 바로 켬 */
  /* 성함·전화 어느 쪽을 먼저 쳐도 '다음' 상태가 바로 갱신되게 합니다.
     자동 포커스는 아직 아무것도 입력하지 않았을 때만 겁니다. */
  const nameEl = document.getElementById("wz-name");
  const phoneEl = document.getElementById("wz-phone");
  if(nameEl){
    nameEl.oninput = ()=>{ WZ.name = nameEl.value; wzRefreshNext(); };
    if(!nameEl.value && !(WZ && WZ.phone)) setTimeout(()=>{
      if(document.activeElement === document.body) nameEl.focus();
    }, 60);
  }
  if(phoneEl){
    phoneEl.oninput = (ev)=>{ fmtPhone(phoneEl, ev); wzRefreshNext(); };
  }

  const rail = document.getElementById("mrail");
  if(!rail) return;
  const set = (e)=>{
    const r = rail.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    const v = Math.min(25, Math.max(0, Math.round((x/r.width)*25/5)*5));   /* 5분 단위, 칸 안 0~25분 */
    const nt = minToHM(wzSlotBase() + v);
    if(nt!==WZ.time){ WZ.time = nt; render(); }
  };
  rail.addEventListener("pointerdown", e=>{
    if(e.target.tagName==="BUTTON") return;   /* 눈금 버튼은 따로 처리 */
    rail.setPointerCapture(e.pointerId); set(e);
    const mv = ev=>set(ev);
    const up = ()=>{ rail.removeEventListener("pointermove",mv); rail.removeEventListener("pointerup",up); };
    rail.addEventListener("pointermove",mv); rail.addEventListener("pointerup",up);
  });
}

/* ---------- 2단계: 인원 (유아 포함 총원) ---------- */
function wzStepPeople(){
  const tiles = [1,2,3,4,5,6].map(n=>
    `<button class="ptile ${WZ.people===n&&!WZ.customPeople?'on':''}" onclick="wzPeople(${n})">
      <span class="pn">${n}</span><span class="pu">명</span></button>`).join("");
  const cur = WZ.people||0;
  return `
    <div class="pgrid">${tiles}</div>
    <button class="pmore ${WZ.customPeople?'on':''}" onclick="wzCustom()">7명 이상</button>
      <div class="bigstep ${WZ.customPeople?'':'hold'}">
        <button onclick="wzAdj('people',-1)" ${WZ.customPeople?'':'tabindex="-1"'}>−</button>
        <div class="v"><span>${WZ.people||7}</span><small>명</small></div>
        <button onclick="wzAdj('people',1)" ${WZ.customPeople?'':'tabindex="-1"'}>＋</button>
      </div>
    <div class="infant ${WZ.infants>=(WZ.people||99)&&WZ.people?'bad':''}">
      <div><div class="t">유아</div>
        <div class="s">${WZ.infants>=(WZ.people||99)&&WZ.people
          ? "성인이 없습니다"
          : "총 인원에 포함"}</div></div>
      <div class="bigstep sm">
        <button onclick="wzAdj('infants',-1)">−</button>
        <div class="v"><span>${WZ.infants}</span><small>명</small></div>
        <button onclick="wzAdj('infants',1)">＋</button>
      </div>
    </div>
    <div class="ptotal">${cur ? `총 <b>${cur}명</b>${WZ.infants?` (유아 ${WZ.infants}명 포함)`:""}` : ""}</div>`;
}
function wzPeople(n){
  WZ.people=n; WZ.customPeople=false;
  WZ.chairs = chairDefaultInfants() ? WZ.infants : 0;   /* 기본값은 설정에서 (유아 수 / 0개) */
  render();
}
function wzCustom(){ WZ.customPeople=true; if(!WZ.people) WZ.people=7; render(); }
function wzAdj(k,d){
  /* 막지 않습니다 — 이상한 값은 빨갛게 보여 주고 사장이 판단합니다 */
  if(k==="infants"){
    WZ.infants = Math.max(0,(WZ.infants||0)+d);
    WZ.chairs = chairDefaultInfants() ? WZ.infants : 0;
  }else{
    WZ.people = Math.max(1,(WZ.people||0)+d);
    /* 직접 입력 상태는 유지합니다 — 1명까지 내려도 됩니다 */
  }
  render();
}

/* ---------- 3단계: 좌석 ---------- */
/* ---------- 3단계: 좌석 (8차) ----------
   룸 | 테이블 두 갈래(가게에서 '룸 예약 / 테이블 예약' 이라 부름). 고른 갈래의 좌석 + '미정'.
   룸 쪽에는 인원이 맞는 합침 그룹(중문 탈거)도 나옵니다 — 자동 배정은 안 하고 사람이 고를 때만, 원탁은 확인창 */
function wzStepSeat(){
  const s=store(), st=s.settings;
  const total = WZ.people||0;
  const adults = adultCount(total, WZ.infants);
  if(!WZ.seatKind){
    /* 이미 고른 좌석이 있으면 그 종류, 없으면 인원으로 추정(룸 최소 4 이상이면 룸) */
    const cur = seatById(WZ.seat) || (st.joins||[]).find(j=>j.id===WZ.seat);
    WZ.seatKind = cur ? (isTable(cur) ? "table" : "room") : (isTablePref(WZ.seat) ? "table" : "room");
  }
  const kind = WZ.seatKind;

  const cell = (ids, x, extraCls) => {
    const label = ids.length > 1 ? seatLabelIds(ids).replace(/ (룸|테이블)$/,"") : esc(x.name);
    let statuses = ids.map(id=>roomStatus(WZ.date, WZ.time, id));
    const state = statuses.some(r=>r.state==="blocked") ? "blocked" : statuses.some(r=>r.state==="warn") ? "warn" : "free";
    const blocked = ids.some(id=>blockedAt(seatById(id), WZ.date, WZ.time));
    const over = total > seatsMax(ids), under = adults < seatsMin(ids);
    const txt = blocked ? "사용 중지" : state==="free" ? (over?"인원 초과":under?"인원 부족":"이용 가능") : "이용 불가";
    const cls = blocked ? "blocked" : state!=="free" ? state : (over||under ? "warn" : "free");
    const bad = blocked || state!=="free" || over || under;
    const mv = statuses.reduce((a,r)=>a+(r.movable?r.movable.length:0),0);
    const key = ids.length > 1 ? x.id : ids[0];
    const sub = isTable(x) ? `${roomMin(x)?roomMin(x)+"~":""}${seatMax(x)}인${x.note?` · ${esc(x.note)}`:""}` : `${seatsMin(ids)}~${seatsMax(ids)}인`;
    return `<button class="scell ${WZ.seat===key?'on':''} ${bad?'warned busy':''} ${extraCls||''}" onclick="wzSeat('${key}')" ${x.note&&ids.length>1?`title="${esc(x.note)}"`:""}>
      <span class="sn">${label}</span>
      <span class="sc">${sub}</span>
      <span class="avail ${cls}">${txt}</span>
      ${mv?`<span class="movable">미정 ${mv}건 이동 가능</span>`:""}
    </button>`;
  };

  let body = "";
  if(kind === "room"){
    const rooms = st.rooms.filter(isRoom);
    const joins = (st.joins||[]).filter(j=>total >= j.min && total <= j.max);
    body = `<div class="sgrid">${rooms.map(r=>cell([r.id], r)).join("")}</div>` +
      (joins.length ? `<div class="lbl" style="margin-top:16px">룸 합침 <span class="lbl-note">중문 탈거 · 자동 배정 안 됨</span></div>
        <div class="sgrid">${joins.map(j=>cell(j.ids, {id:j.id, name:"", note:j.note}, "join")).join("")}</div>` : "");
  }else{
    /* 테이블은 층만 고릅니다 — 어느 테이블에 앉을지는 그날 현장에서. 남은 자리는 같은 시간대 겹치는 손님 수로 */
    const floors = tableFloors();
    body = `<div class="sgrid floors">${floors.map(fl=>{
      const key = "table:" + fl, tb = floorTables(fl);
      const fit = WZ.time ? floorFit(fl, WZ.date, WZ.time, total) : null;
      const bad = fit && fit.state !== "ok";
      const txt = !fit ? "시간을 먼저" : fit.state === "ok" ? "자리 있음"
                : fit.state === "split" ? `붙일 테이블 없음 · 나눠 앉기 (한 자리 최대 ${floorMaxParty(fl, WZ.date, WZ.time)}명)`
                : `자리 없음 (한 자리 최대 ${floorMaxParty(fl, WZ.date, WZ.time)}명)`;
      return `<button class="scell ${WZ.seat===key?'on':''} ${bad?'warned busy':''}" onclick="wzSeat('${key}')">
        <span class="sn">${esc(floorLabel(fl))}</span>
        <span class="sc">테이블 ${tb.length} · ${tb.reduce((a,t)=>a+(t.seats||4),0)}석</span>
        <span class="avail ${bad?'warn':'free'}">${txt}</span>
      </button>`; }).join("")}</div>`;
  }
  const sess = WZ.time ? sessionAt(WZ.date, WZ.time) : null;
  const stayTxt = WZ.time ? (sess && sess.stay==="end" ? `${sess.name} 세션 끝(${hm(minToHM(sessionEnd(WZ.date, sess)))})까지 한 팀` : `${hmDur(stayMinAt(WZ.date, WZ.time))} 머무는 기준`) : "";
  return `
    <div class="seat-note">${WZ.time?`<b>${hm(WZ.time)}</b> 입장 · ${stayTxt}`:"시간을 먼저 선택하세요"}</div>
    <div class="seg seatkind">
      <button class="${kind==='room'?'on':''}" onclick="wzSeatKind('room')">룸 예약</button>
      <button class="${kind==='table'?'on':''}" onclick="wzSeatKind('table')">테이블 예약</button>
    </div>
    <div class="lbl-note" style="margin:6px 0 10px">${kind==='room' ? `정원은 ${seatCountsInfants()?"유아 포함":"유아 제외 성인"} 기준 · 순서는 사장님이 정한 배정 우선순위` : "그 시간에 비는 테이블(붙임 포함)로 앉힐 수 있는지 봅니다. 어느 테이블인지는 당일 현장에서"}</div>
    ${body}
    ${kind==='room' ? `<div class="lbl" style="margin-top:18px">좌석 미정으로 접수</div>
    <div class="sgrid any">
      <button class="scell any ${WZ.seat==='room-any'?'on':''}" onclick="wzSeat('room-any')">
        <span class="sn">룸 중 아무곳</span><span class="sc">비어 있는 방에 잠정 배정</span></button>
    </div>` : `<p class="f-note" style="margin-top:12px">어느 테이블에 앉을지는 당일 현장에서 정합니다. 자리가 부족해도 접수는 됩니다(경고만).</p>`}`;
}
function wzSeatKind(k){ WZ.seatKind = k; if(WZ.seat && !seatById(WZ.seat)) { /* 다른 갈래의 '미정'·층 은 지움 */ if(/-any$/.test(WZ.seat) || /^table:/.test(WZ.seat)) WZ.seat = null; } render(); }
function wzChair(d){ WZ.chairs = Math.max(0,(WZ.chairs||0)+d); render(); }

/* 좌석 선택 — 막을 것은 막고, 판단이 필요한 것은 물어봅니다 */
/* 좌석 선택 — 막을 것은 막고, 판단이 필요한 것은 물어봅니다. v = 좌석 id / 합침 그룹 id / room-any / table-any */
async function wzSeat(v){
  const st = store().settings;
  const people = WZ.people||0;
  WZ.seatExtra = []; WZ.tentative = null; WZ.tentativeExtra = [];
  /* 테이블(층) — 테이블 단위로 앉힐 수 있는지 계산하되 이름은 안 보여 줍니다. 없거나 나눠 앉아도 알리기만 */
  if(/^table:/.test(v)){
    const fl = v.slice(6), fit = floorFit(fl, WZ.date, WZ.time, people);
    if(fit.state === "none" && !await uiConfirm(`${floorLabel(fl)}에 ${people}명 자리가 없습니다`,
      `${hm(WZ.time)} 기준으로 비는 테이블을 붙여도 한 자리 최대 ${floorMaxParty(fl, WZ.date, WZ.time)}명입니다.\n\n회전·합석으로 감당 가능하면 접수하세요. '테이블 자리 없음' 경고로 남습니다.`,
      {ok:"그래도 접수", cancel:"다시 고르기"})) return;
    if(fit.state === "split" && !await uiConfirm(`${floorLabel(fl)}에서는 나눠 앉게 됩니다`,
      `붙일 수 있는 테이블이 없습니다 (한 자리 최대 ${floorMaxParty(fl, WZ.date, WZ.time)}명). 옆 테이블에 나눠 앉는 것으로 접수합니다.\n손님께 안내하셨나요?`,
      {ok:"안내했음 · 접수", cancel:"다시 고르기"})) return;
    WZ.tentative = fit.f ? fit.f.id : null; WZ.tentativeExtra = fit.f ? fit.f.extra : []; WZ.tentativeSplit = fit.state === "split";
    WZ.seat = v; wzAutoNext();
    return;
  }
  if(!["any","hall-any","table-any","room-any"].includes(v)){
    const j = (st.joins||[]).find(g=>g.id===v);
    const ids = j ? j.ids.slice() : [v];
    if(!seatById(ids[0])) return;
    const label = seatLabelIds(ids);
    for(let k=0;k<ids.length;k++){
      const room = seatById(ids[k]);
      const bk = blockedAt(room, WZ.date, WZ.time);
      if(bk && !await uiConfirm(`${room.name}은 이 시각에 사용 중지입니다`,
        `${dateLabel(WZ.date)} ${spanLabel(bk)}${bk.note?`\n사유: ${bk.note}`:""}\n\n그래도 이 자리로 배정할까요?`,
        {ok:"그래도 배정", cancel:"다시 고르기"})) return;
      const rs = roomStatus(WZ.date, WZ.time, ids[k]);
      if(rs.state==="blocked"){
        const lines = rs.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)}`).join("\n");
        if(!await uiConfirm(`${room.name}에 1시간 안에 확정 예약이 있습니다`, lines, {ok:"그래도 배정", cancel:"다시 고르기"})) return;
      }
      if(rs.state==="warn"){
        const a = rs.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)}`);
        const b = rs.tentative.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)} (좌석 미정 · 잠정 배정)`);
        if(!await uiConfirm2(`${room.name}에 겹치는 예약이 있습니다.\n\n${[...a,...b].join("\n")}\n\n그래도 배정할까요?`)) return;
      }
    }
    if(people > seatsMax(ids)){
      if(!await uiConfirm2(`${label}은 최대 ${seatsMax(ids)}명입니다. 지금 ${people}명입니다.\n간이 의자 등으로 감당 가능한 경우에만 배정하세요.`)) return;
    }else{
      const adults = adultCount(people, WZ.infants);
      if(adults < seatsMin(ids)){
        const basis = store().settings.minCountAdultsOnly===false ? "총 인원" : "성인";
        if(!await uiConfirm(`${label} 최소 인원 미달`, `최소 ${seatsMin(ids)}명부터 받습니다.\n지금 ${basis} ${adults}명입니다${WZ.infants?` (유아 ${WZ.infants}명 제외)`:""}.`, {ok:"그래도 배정", cancel:"다시 고르기"})) return;
      }
    }
    /* 한 테이블에 안 들어가는 인원이 테이블 하나를 고르면 붙일 테이블을 함께 제안 */
    const one = seatById(v);
    if(!j && isTable(one) && people > seatMax(one)){
      const f = findSeat({date:WZ.date, time:WZ.time, people:people, kind:"table-any"});
      if(f && f.id === v && f.extra.length){
        if(!await uiConfirm2(`${one.name} 하나로는 ${people}명이 안 됩니다.\n${seatLabelIds([f.id].concat(f.extra))}로 붙여서 받을까요?`)) return;
        WZ.seatExtra = f.extra;
      }
    }
    if(j && j.note && !await uiConfirm(`${label} — ${j.note}`, "손님께 확인하셨나요?", {ok:"확인했음", cancel:"다시 고르기"})) return;
    if(j) WZ.seatExtra = ids.slice(1);
    WZ.seat = j ? ids[0] : v; WZ.seatJoin = j ? j.id : null; wzAutoNext();
    return;
  }
  /* 좌석 미정 — 잠정 배정 가능 여부를 먼저 확인 */
  const f = suggestSeatFull(WZ.date, WZ.time, people, v);
  if(!f){
    if(!await uiConfirm2(`지금 ${hm(WZ.time)} 기준으로 ${people}명이 들어갈 빈 자리가 없습니다.\n먼저 접수한 좌석 미정 예약까지 계산한 결과입니다.\n\n자리 없이 접수할까요?`)) return;
  }
  WZ.tentative = f ? f.id : null; WZ.tentativeExtra = f ? f.extra : [];
  WZ.seat = v; wzAutoNext();
}
