/* 저장된 옛 데이터에 새 항목이 없을 때 채워 넣기 */
function migrate(d){
  d._auth = d._auth || {...DEFAULT_AUTH};
  d._logs = d._logs || [];
  for(const k of Object.keys(DEFAULT_DATA)){
    d[k] = { ...deepClone(DEFAULT_DATA[k]), ...(d[k]||{}) };
    d[k].settings = { ...DEFAULT_DATA[k].settings, ...(d[k].settings||{}) };
    for(const arr of ["reservations","staff","attendance","sales"]) d[k][arr] = d[k][arr] || [];
    /* 옛 기록 정리: 인원을 유아 포함 총원으로, 상태 이름 변경 */
    d[k].reservations = d[k].reservations.map(r=>({
      ...r,
      people: r.people != null ? r.people : pplOf(r),
      chairs: r.chairs != null ? r.chairs : (r.infants||0),
      status: (r.status==="완료"||r.status==="식사완료") ? "방문" : r.status
    }));
  }
  return d;
}

function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(d = new Date()){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthStr(d = new Date()){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function shiftDate(s, days){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+days); return todayStr(d); }
function dateLabel(s){
  const d=new Date(s+"T00:00:00");
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+["일","월","화","수","목","금","토"][d.getDay()]+")";
}
function nowHM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function won(n){ return (n||0).toLocaleString("ko-KR"); }
/* 입력값을 화면에 넣기 전 반드시 통과 — 스크립트 주입(XSS) 방지 */
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* 구형 스마트TV 브라우저에는 structuredClone 이 없어 직접 복사합니다 */
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- 지난 예약 자동 정리 ----------

}

/* 총 인원 — 유아를 포함한 값. 옛 기록(성인+유아 분리)도 함께 처리 */
/* 총 인원. 옛 데이터는 people 없이 adults+infants 로 저장돼 있어 그때만 더해 씁니다.
   (예전에는 자기 자신을 다시 부르게 돼 있어 people 이 없으면 무한 재귀로 멈췄습니다) */
function pplOf(r){ return r.people != null ? r.people : ((r.adults||0) + (r.infants||0)); }
/* 인원 표기 — "6명 (유아 1명 포함)" */
function pplText(r){
  const n = pplOf(r), i = r.infants||0;
  return i ? `${n}명(유아${i})` : `${n}명`;
}

/* ---------- 좌석 판정 (체류시간 기준) ---------- */
function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function minToHM(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
/* 그 시각의 체류 시간(분) — 점심과 저녁을 다르게 잡습니다 */
/* ---------- 운영시간 ----------
   요일별 기본값 + 적용 시작일 + 그날만의 예외(임시 휴무·단축 영업) */
function scheduleFor(date){
  const st = store().settings;
  const list = (st.schedules||[]).filter(s=>s.from<=date).sort((a,b)=>a.from.localeCompare(b.from));
  return list.length ? list[list.length-1] : null;
}
function isHoliday(date){
  const st = store().settings;
  return st.holidayMode !== false && (st.holidays||[]).includes(date);
}
function hoursFor(date){
  const st = store().settings;
  const sch = scheduleFor(date);
  const dow = new Date(date+"T00:00:00").getDay();
  /* 공휴일이면 공휴일 운영시간을 먼저 봅니다 */
  const dayDef = (isHoliday(date) && sch && sch.holiday) ? sch.holiday
               : (sch && sch.days && sch.days[dow]);
  const base = dayDef ? {...dayDef}
    : {open:st.open||"11:00", close:st.close||"22:00", lo:st.lastOrder||"20:40", bs:"", be:""};
  base.closed = false; base.note = "";
  const ov = (st.overrides||[]).find(o=>o.date===date);
  if(ov){
    if(ov.closed) return {...base, closed:true, note:ov.note||"임시 휴무"};
    ["open","close","lo","bs","be"].forEach(k=>{ if(ov[k]!==undefined) base[k]=ov[k]; });
    base.note = ov.note||"임시 운영시간";
    base.custom = true;
  }
  return base;
}
/* 타임라인 가로축 — 어느 날이든 같은 폭으로 보이도록 가장 넓은 영업시간을 씁니다 */
function axisRange(){
  const st = store().settings;
  let o = 24*60, c = 0;
  (st.schedules||[]).forEach(s=>(s.days||[]).forEach(d=>{
    o = Math.min(o, toMin(d.open)); c = Math.max(c, toMin(d.close));
  }));
  (st.overrides||[]).forEach(v=>{
    if(v.open) o = Math.min(o, toMin(v.open));
    if(v.close) c = Math.max(c, toMin(v.close));
  });
  if(o>=c){ o = toMin(st.open||"11:00"); c = toMin(st.close||"22:00"); }
  return {o, c};
}
/* 그 시각이 브레이크타임인지 */
function inBreak(date, time){
  const h = hoursFor(date);
  if(!h.bs || !h.be || !time) return false;
  const t = toMin(time);
  return t >= toMin(h.bs) && t < toMin(h.be);
}
function stayMinAt(time, seatId){
  const st = store().settings;
  const seat = seatId ? st.rooms.find(r=>r.id===seatId) : null;
  const isHall = seat && seat.type==="hall";
  const lunch = time && toMin(time) < toMin(st.lunchUntil||"16:00");
  const h = isHall
    ? (lunch ? (st.hallLunchStayHours||2) : (st.hallStayHours||2.5))
    : (lunch ? (st.lunchStayHours||2.5)   : (st.stayHours||3));
  return Math.round(h*60);
}
/* 예약 한 건의 체류 시간 — 배정된(또는 잠정) 좌석 종류에 따라 달라집니다 */
function stayOf(r){ return stayMinAt(r.time, effSeat(r)); }
function stayMin(){ return stayMinAt("19:00"); }
/* ---------- 홀 테이블 ----------
   홀마다 2인석·4인석·6인석 등을 섞어 둘 수 있고, 붙일 수 있는지도 따로 정합니다. */
function hallZones(hall){
  if(hall.zones && hall.zones.length) return hall.zones;
  /* 옛 형식도 읽을 수 있게 */
  if(hall.tableSets) return [{name:"홀", sets:hall.tableSets, maxJoin:hall.tableSets.some(s=>s.join)?4:1}];
  const n = hall.tables || 0;
  return [{name:"홀", sets:[{seats:4,count:n}], maxJoin:hall.joinable? Math.max(1,Math.floor(hall.joinable/1)) : 1}];
}
function hallTables(hall){
  const out = [];
  hallZones(hall).forEach((z,zi)=>{
    (z.sets||[]).forEach((s,si)=>{
      for(let i=0;i<(s.count||0);i++)
        out.push({key:zi+"-"+si+"-"+i, seats:s.seats||4, zone:zi, zoneName:z.name, maxJoin:z.maxJoin||1});
    });
  });
  return out;
}
function hallSeatTotal(hall){ return hallTables(hall).reduce((a,t)=>a+t.seats,0); }

/* 남은 테이블로 이 인원을 앉힐 수 있는지
   - 같은 존 안에서만 붙일 수 있고, 존마다 정한 최대 개수를 넘지 못합니다.
   - 남는 자리가 가장 적은 조합을 고릅니다. */
function pickTables(free, people){
  if(people<=0) return null;
  const byZone = {};
  free.forEach(t=>{ (byZone[t.zone] = byZone[t.zone]||[]).push(t); });
  let best = null;
  Object.values(byZone).forEach(list=>{
    const maxJoin = list[0].maxJoin || 1;
    const sorted = [...list].sort((a,b)=>a.seats-b.seats);
    /* 1) 한 테이블로 해결되는 가장 작은 자리 */
    const single = sorted.find(t=>t.seats>=people);
    if(single){
      const waste = single.seats - people;
      if(!best || waste < best.waste || (waste===best.waste && best.use.length>1))
        best = {use:[single], waste};
      return;
    }
    /* 2) 큰 것부터 붙여 봅니다 (최대 개수 안에서) */
    if(maxJoin < 2) return;
    const desc = [...list].sort((a,b)=>b.seats-a.seats);
    const use = []; let sum = 0;
    for(const t of desc){
      if(use.length >= maxJoin) break;
      use.push(t); sum += t.seats;
      if(sum >= people) break;
    }
    if(sum >= people){
      const waste = sum - people;
      if(!best || waste < best.waste) best = {use:[...use], waste};
    }
  });
  return best ? best.use : null;
}
/* 예약 한 건이 쓰는 테이블 수 (표시용) */
function tablesFor(people){
  const st = store().settings;
  return Math.max(1, Math.ceil(people/(st.tableSeats||4)));
}
/* 룸 최소 인원 — 지정이 없으면 정원에서 2명 뺀 값 */
function roomMin(r){ return r.minCapacity != null ? r.minCapacity : Math.max(2,(r.capacity||2)-2); }
/* 수리·고장 등으로 잠시 쓰지 않는 좌석 */
function isBlocked(r){ return !!(r && r.blocked); }
/* 최소 인원 판정에 쓸 인원 — 설정에 따라 성인만 셉니다 */
function adultCount(people, infants){
  return store().settings.minCountAdultsOnly === false
    ? (people||0) : Math.max(0,(people||0)-(infants||0));
}
/* 마지막으로 예약을 받을 수 있는 시각 */
function lastBookMin(date){
  const st = store().settings;
  const h = hoursFor(date || view.date || todayStr());
  /* 라스트오더가 지정돼 있으면 그 시각, 없으면 마감 기준 */
  return h.lo ? toMin(h.lo) : toMin(h.close) - (st.lastBookingBuffer != null ? st.lastBookingBuffer : 60);
}
/* 확정 배정이 없으면 잠정 배정을 좌석으로 간주 */
function effSeat(r){ return r.roomId || r.tentativeRoomId || null; }

/* 룸을 그 시각에 쓸 수 있는지 판정
   blocked: 앞뒤 1시간 안에 확정 예약 → 배정 불가
   warn   : 체류시간 안에 확정 예약, 또는 잠정 배정이 걸려 있음 → 사장 판단
   free   : 여유 있음                                                     */
function roomStatus(date, time, roomId, excludeId){
  const s = store();
  if(!time || !roomId) return {state:"free", hits:[], tentative:[], movable:[]};
  const t = toMin(time);
  const all = s.reservations.filter(r =>
    r.date===date && r.status==="확정" && r.id!==excludeId &&
    (r.roomId===roomId || r.tentativeRoomId===roomId));
  let state="free"; const near=[], tent=[], movable=[];
  for(const r of all){
    const gap = Math.abs(toMin(r.time)-t);
    if(gap >= stayMinAt(time, roomId)) continue;
    if(r.roomId===roomId){
      /* 확정 배정 — 실제로 자리를 막습니다 */
      if(gap < 60){ state="blocked"; }
      else if(state!=="blocked"){ state="warn"; }
      near.push(r);
    }else{
      /* 잠정 배정 — 다른 자리로 옮길 수 있으면 막지 않습니다 */
      if(canRelocate(r, roomId)){ movable.push(r); }
      else{
        if(state==="free") state="warn";
        tent.push(r);
      }
    }
  }
  near.sort((a,b)=>a.time.localeCompare(b.time));
  return {state, hits:near, tentative:tent, movable};
}
/* 좌석 미정 예약을 지금 자리 말고 다른 곳으로 옮길 수 있는지 */
function canRelocate(r, excludeRoomId){
  const s = store(), st = s.settings;
  const kind = r.seatPref || "any";
  const people = pplOf(r);
  const cand = st.rooms.filter(x=>
    x.id!==excludeRoomId &&
    (kind==="hall-any" ? x.type==="hall" : kind==="room-any" ? x.type==="room" : true));
  for(const x of cand){
    if(x.type==="room"){
      if(people>x.capacity || people<roomMin(x)) continue;
      /* 확정 예약만 따져서 비어 있는지 확인 (잠정끼리는 서로 비켜줄 수 있음) */
      const conflict = s.reservations.some(o =>
        o.date===r.date && o.status==="확정" && o.id!==r.id && o.roomId===x.id &&
        Math.abs(toMin(o.time)-toMin(r.time)) < stayMinAt(r.time, x.id));
      if(!conflict) return true;
    }else{
      /* 홀은 확정 예약만 놓고 자리가 남는지 봅니다 */
      let free = hallTables(x);
      s.reservations.filter(o =>
        o.date===r.date && o.status!=="취소" && o.id!==r.id && o.roomId===x.id &&
        Math.abs(toMin(o.time)-toMin(r.time)) < stayMinAt(r.time, x.id))
        .sort((a,b)=>a.time.localeCompare(b.time))
        .forEach(o=>{
          const use = pickTables(free, pplOf(o));
          if(use) free = free.filter(z=>!use.includes(z));
        });
      if(pickTables(free, people)) return true;
    }
  }
  return false;
}
/* 좌석 미정 예약들의 잠정 배정을 다시 계산 — 예약이 추가·변경될 때 호출 */
function reflowTentatives(date){
  const s = store();
  const targets = s.reservations.filter(r=>r.date===date && r.status==="확정" && !r.roomId);
  targets.forEach(r=>{ r.tentativeRoomId = null; });
  targets.sort((a,b)=>a.time.localeCompare(b.time)).forEach(r=>{
    r.tentativeRoomId = suggestSeat(r.date, r.time, pplOf(r), r.seatPref||"any", r.id);
  });
}
/* 홀의 그 시간대 테이블 사용 현황 (잠정 배정 포함)
   실제 테이블 목록을 놓고 먼저 온 팀부터 앉혀 봅니다. */
function hallStatus(date, time, hallId, excludeId){
  const s = store();
  const hall = s.settings.rooms.find(r=>r.id===hallId) || {};
  const all = hallTables(hall);
  const total = all.length, seatTotal = all.reduce((a,t)=>a+t.seats,0);
  if(!time) return {total, seatTotal, tables:all, free:all, used:0, tentUsed:0,
                    left:total, hits:[], tentative:[], movable:[]};
  const t = toMin(time);
  const inWindow = r => r.date===date && r.status!=="취소" && r.id!==excludeId &&
                        Math.abs(toMin(r.time)-t) < stayMinAt(time, hallId);
  const hits = s.reservations.filter(r=>inWindow(r) && r.roomId===hallId);
  const tentAll = s.reservations.filter(r=>inWindow(r) && !r.roomId && r.tentativeRoomId===hallId);
  const tent = tentAll.filter(r=>!canRelocate(r, hallId));
  const movable = tentAll.filter(r=>canRelocate(r, hallId));

  /* 먼저 온 순서대로 테이블을 채웁니다 */
  let free = [...all];
  let used = 0, tentUsed = 0;
  const seat = (list, isTent) => {
    list.slice().sort((a,b)=>a.time.localeCompare(b.time)).forEach(r=>{
      const use = pickTables(free, pplOf(r));
      if(use){
        free = free.filter(x=>!use.includes(x));
        if(isTent) tentUsed += use.length; else used += use.length;
      }
    });
  };
  seat(hits,false); seat(tent,true);
  return {total, seatTotal, tables:all, free, used, tentUsed,
          left:free.length, hits, tentative:tent, movable};
}
/* 이 인원이 홀에 들어갈 수 있는지 */
function hallFits(h, people){ return !!pickTables(h.free||[], people); }
/* 이 인원이 쓰게 될 테이블 (표시용) */
function hallPlan(h, people){
  const use = pickTables(h.free||[], people);
  if(!use) return null;
  const zone = use[0].zoneName ? `${use[0].zoneName} · ` : "";
  return zone + use.map(t=>`${t.seats}인석`).join(" + ");
}

/* 좌석 미정 예약에 붙일 '잠정 배정' 좌석을 고름
   - 룸: 인원이 맞는 가장 작은 빈 방
   - 홀: 남은 테이블이 충분한 홀
   자리가 없으면 null (예약은 받되 안내가 필요한 상황)                    */
function suggestSeat(date, time, people, kind, excludeId){
  const st = store().settings;
  const cand = st.rooms.filter(r=>
    kind==="hall-any" ? r.type==="hall" :
    kind==="room-any" ? r.type==="room" : true);
  const rooms = cand.filter(r=>r.type==="room")
    .filter(r=>!isBlocked(r))
    .filter(r=>people<=r.capacity && people>=roomMin(r))   /* 잠정 배정은 총 인원 기준으로 넉넉히 */
    .sort((a,b)=>a.capacity-b.capacity);
  for(const r of rooms){
    if(roomStatus(date,time,r.id,excludeId).state==="free") return r.id;
  }
  const halls = cand.filter(r=>r.type==="hall" && !isBlocked(r)).sort((a,b)=>hallSeatTotal(b)-hallSeatTotal(a));
  for(const h of halls){
    if(hallFits(hallStatus(date,time,h.id,excludeId), people)) return h.id;
  }
  return null;
}

function shopState(st){
  if(st.tempClosed) return {cls:"closed", txt:"임시 휴무"};
  const today = todayStr();
  const h = hoursFor(today);
  if(h.closed) return {cls:"closed", txt:esc(h.note||"휴무")};
  const n = nowHM();
  if(n < h.open)   return {cls:"prep",   txt:"영업 준비 중"};
  if(n >= h.close) return {cls:"closed", txt:"영업 종료"};
  if(h.bs && h.be && n>=h.bs && n<h.be) return {cls:"prep", txt:"브레이크타임"};
  if(h.lo && n >= h.lo) return {cls:"open", txt:"영업 중 · 라스트오더 지남"};
  return {cls:"open", txt:"영업 중"};
}

let AUTHED = false;
let PIN_BUF = "";
let PIN_ERR = "";

function renderLock(){
  const s = view.storeKey ? DATA[view.storeKey] : null;

  const dots = [0,1,2,3].map(i=>
    `<span class="pdot f${i+1} ${i<PIN_BUF.length?'on':''}">${i<PIN_BUF.length?marks[i]:""}</span>`).join("");
  const keys = [1,2,3,4,5,6,7,8,9,"clear",0,"back"].map(k=>{
    if(k==="clear") return `<button class="pkey sub" onclick="pinClear()" title="다시 입력">↻</button>`;
    if(k==="back")  return `<button class="pkey sub" onclick="pinBack()">←</button>`;
    return `<button class="pkey" onclick="pinPush('${k}')">${k}</button>`;
  }).join("");
  return `
    <div class="lock">
      <div class="lockbox">
        <div class="lk-title">${esc(s?s.name:"")} 예약 시스템</div>

        <div class="lk-err">${esc(PIN_ERR)}</div>
        <div class="pkeys">${keys}</div>
        <p class="lk-note">숫자 키보드로도 입력할 수 있습니다.</p>
        <button class="lk-back" onclick="backToStores()">← 매장 다시 고르기</button>
      </div>
    </div>`;
}
function pinPush(n){
  if(PIN_BUF.length>=4) return;
  PIN_BUF += n; PIN_ERR="";
  if(PIN_BUF.length===4) setTimeout(pinCheck, 120);
  render();
}
function pinBack(){ PIN_BUF = PIN_BUF.slice(0,-1); render(); }
function pinClear(){ PIN_BUF=""; PIN_ERR=""; render(); }
function backToStores(){ view.storeKey=null; PIN_BUF=""; PIN_ERR=""; render(); }
function pinCheck(){
  const ok = PIN_BUF === ((DATA._auth && DATA._auth.pin) || DEFAULT_AUTH.pin);
  logEvent(ok ? "로그인 성공" : "로그인 실패", ok ? "" : `입력값 ${PIN_BUF}`);
  if(ok){
    AUTHED = true; PIN_BUF=""; PIN_ERR="";
    DATA._session = {authed:true, since:new Date().toISOString()};
    saveData();
  }
  else { PIN_BUF=""; PIN_ERR="PIN 번호가 맞지 않습니다."; }
  render();
}
function lockNow(){
  logEvent("잠금", "");
  AUTHED=false; PIN_BUF=""; PIN_ERR=""; view.storeKey=null;
  DATA._session = {authed:false};
  saveData(); render();
}
/* PC에서 키보드로도 입력 */
function pinKeydown(e){
  if(AUTHED) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pinPush(e.key); }
  else if(e.key==="Backspace"){ e.preventDefault(); pinBack(); }
  else if(e.key==="Escape"){ e.preventDefault(); pinClear(); }
}
document.addEventListener("keydown", pinKeydown);

/* 첫 줄을 제목으로, 나머지를 본문으로 나눠 띄웁니다 */
function splitMsg(m){
  const s = String(m||"").split("\n");
  const title = s[0].replace(/[?!.]$/,"") || "확인";
  return [title, s.slice(1).join("\n").trim()];
}
async function uiConfirm2(msg, opt){
  const [t,b] = splitMsg(msg);
  return uiConfirm(t, b || t, opt);
}
async function uiAlert2(msg){
  const [t,b] = splitMsg(msg);
  return uiAlert(t, b || "");
}

/* ============================================================
   공통 팝업 — 브라우저 기본 alert/confirm 대신 같은 테마로
   uiAlert / uiConfirm 은 Promise 를 돌려주므로 await 로 씁니다.
   ============================================================ */
let MODAL = null;
function uiAlert(title, msg, tone){
  return new Promise(res => { MODAL = {mode:"alert", title, msg, tone:tone||"warn", res}; render(); });
}
function uiConfirm(title, msg, opt){
  opt = opt || {};
  return new Promise(res => {
    MODAL = {mode:"confirm", title, msg, tone:opt.tone||"warn",
             ok:opt.ok||"계속", cancel:opt.cancel||"취소", res};
    render();
  });
}
function modalAnswer(v){
  const m = MODAL; MODAL = null; render();
  if(m) m.res(v);
}
function renderModal(){
  if(!MODAL) return "";
  const m = MODAL;
  const lines = String(m.msg||"").split("\n").map(l=>
    l.trim()==="" ? `<div class="md-gap"></div>` : `<div class="md-l">${esc(l)}</div>`).join("");
  return `
    <div class="overlay modal-ov" onclick="modalAnswer(false)">
      <div class="modal ${m.tone}" onclick="event.stopPropagation()">
        <div class="md-h">${esc(m.title)}</div>
        <div class="md-b">${lines}</div>
        <div class="md-f">
          ${m.mode==="confirm"?`<button class="btn" onclick="modalAnswer(false)">${esc(m.cancel)}</button>`:""}
          <button class="btn ${m.tone==="warn"?"danger-fill":"primary"}" onclick="modalAnswer(true)">
            ${m.mode==="confirm"?esc(m.ok):"확인"}</button>
        </div>
      </div>
    </div>`;
}

        <button class="metric tapm ${warnCnt?'warn':''}" onclick="openPick('warn')">
          <div class="v">${warnCnt}<span class="u">건</span></div>
          <div class="k">경고 예약</div><div class="s">${warnCnt?"눌러서 확인":"이상 없음"}</div></button>
        <button class="metric tapm ${checkCnt?'amber':''}" onclick="openCheck()">

/* 미리보기 — 값과 눈금 없이 막대와 선만 */
function ratePreview(endDate, days){
  const list = [];
  for(let i=days-1;i>=0;i--){
    const dd = shiftDate(endDate, -i);
    list.push(dayStat(dd).rate);
  }
  const W=300, H=64, bw=W/list.length;
  const y = v => H - (v/100)*(H-6) - 3;
  const bars = list.map((v,i)=>{
    const h = Math.max(1,(v/100)*(H-6));
    return `<rect x="${i*bw+bw*0.22}" y="${H-h-3}" width="${bw*0.56}" height="${h}" rx="1.5"/>`;
  }).join("");
  const pts = list.map((v,i)=>`${i*bw+bw/2},${y(v)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <g class="sp-bars">${bars}</g>
    <polyline class="sp-line" points="${pts}"/>
  </svg>`;
}

/* ---------- 예약률 추이 ----------
   막대는 아래가 룸, 위가 홀입니다. 둘을 더한 높이가 그날 전체 예약률입니다.
   꺾은선은 전체 예약률의 흐름입니다. */
function rateChart(endDate, days){
  const list = [];
  for(let i=days-1;i>=0;i--){
    const d = shiftDate(endDate, -i);
    const st = dayStat(d);
    list.push({date:d, rate:st.rate, room:st.roomShare, hall:st.hallShare,
               roomRate:st.roomRate, hallRate:st.hallRate, count:st.count});
  }
  const W=720, H=250, L=36, R=10, T=14, B=34;
  const iw=W-L-R, ih=H-T-B, bw=iw/list.length;
  const y = v => T + ih - (v/100)*ih;
  const cx = i => L + i*bw + bw/2;

  const grid = [0,20,40,60,80,100].map(v=>`
    <line class="gl" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>
    <line class="gl tick" x1="${L-5}" y1="${y(v)}" x2="${L}" y2="${y(v)}"/>
    <text class="tx ax" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`).join("");

  const bars = list.map((x,i)=>{
    const c = cx(i), w = Math.max(2, bw*0.56);
    const hr = (x.room/100)*ih, hh = (x.hall/100)*ih;
    return `
      <rect class="rb-room" x="${c-w/2}" y="${T+ih-hr}" width="${w}" height="${Math.max(0,hr)}" rx="1.5">
        <title>${x.date} 룸 ${Math.round(x.room)}%p (룸만 보면 ${x.roomRate}%)</title></rect>
      <rect class="rb-hall" x="${c-w/2}" y="${T+ih-hr-hh}" width="${w}" height="${Math.max(0,hh)}" rx="1.5">
        <title>${x.date} 홀 ${Math.round(x.hall)}%p (홀만 보면 ${x.hallRate}%)</title></rect>`;
  }).join("");

  const pts = list.map((x,i)=>`${cx(i)},${y(x.rate)}`).join(" ");
  const dots = list.map((x,i)=>`<circle class="line-total-d" cx="${cx(i)}" cy="${y(x.rate)}" r="2.4"/>`).join("");

  const labels = list.map((x,i)=>{
    const dt = new Date(x.date+"T00:00:00");
    const dow = ["일","월","화","수","목","금","토"][dt.getDay()];
    const on = x.date===view.date;
    return `<text class="tx ${on?'on':''}" x="${cx(i)}" y="${H-16}" text-anchor="middle">${dt.getDate()}</text>
            <text class="tx sm ${on?'on':''}" x="${cx(i)}" y="${H-4}" text-anchor="middle">${dow}</text>`;
  }).join("");

  const avg = Math.round(list.reduce((a,x)=>a+x.rate,0)/list.length);
  const peak = list.reduce((a,x)=>x.rate>a.rate?x:a, list[0]);
  const st0 = dayStat(endDate);

  return `
    <div class="legend">
      <span><i class="sw rb-room"></i>룸 ${st0.roomSeats}개</span>
      <span><i class="sw rb-hall"></i>홀 ${st0.hallSeats}테이블</span>
      <span><i class="sw ln total"></i>전체 예약률</span>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="예약률 추이">
      ${grid}${bars}
      <polyline class="line-total" points="${pts}"/>${dots}
      ${labels}
    </svg>
    <div class="chart-sum">
      <span>평균 <b>${avg}%</b></span>
      <span>최고 <b>${peak.rate}%</b> (${+peak.date.slice(5,7)}/${+peak.date.slice(8)})</span>
      <span class="muted">막대를 쌓은 높이가 전체 예약률입니다 (아래 룸 + 위 홀)</span>
    </div>`;
}

/* ---------- 예약 목록 (한 줄) ---------- */
function renderResList(date){
  const s = store();
  let day = s.reservations.filter(r=>r.date===date).sort((a,b)=>a.time.localeCompare(b.time));
  const filters = ["전체",...STATUS].map(f=>{
    const n = f==="전체" ? s.reservations.filter(r=>r.date===date).length
                         : s.reservations.filter(r=>r.date===date && r.status===f).length;
    return `<button class="${view.filter===f?'on':''}" onclick="setFilter('${f}')">${f} ${n}</button>`;
  }).join("");
  if(view.filter!=="전체") day = day.filter(r=>r.status===view.filter);
  const rows = day.length ? day.map(resRow).join("")
    : `<div class="empty">해당 조건의 예약이 없습니다.</div>`;
  return `<div class="filters">${filters}</div><div class="rlist">${rows}</div>`;
}
function resRow(r){
  const room = store().settings.rooms.find(x=>x.id===r.roomId);
  const seat = room ? seatLabel(r.roomId)
             : (r.tentativeRoomId ? `${seatLabel(r.tentativeRoomId)}(잠정)` : "미배정");
  /* 시간이 지났는데 아직 처리하지 않은 예약 */
  const late = r.status==="확정" && r.date<=todayStr() &&
    (r.date<todayStr() || toMin(r.time)+60 < toMin(nowHM()));
  const pills = [
    r.assignedLater ? `<span class="pill" title="접수 때는 좌석 미정이었습니다">배정 완료</span>` : "",
    r.menuType==="코스" ? (r.courseUndecided
      ? `<span class="pill amber">코스 미정</span>`
      : `<span class="pill pine" title="${esc(courseSummary(r.courses))}">코스</span>`) :
    r.menuType==="코스 상당" ? `<span class="pill pine">코스상당</span>` :
    r.menuType==="확인 필요" ? `<span class="pill amber">메뉴확인</span>` : "",
    r.allergy ? `<span class="pill rust" title="${esc(r.allergy)}">알러지</span>` : "",
    r.chairs ? `<span class="pill pine">유아의자 ${r.chairs}</span>` : "",
    r.request ? `<span class="pill" title="${esc(r.request)}">요청</span>` : ""
  ].join("");
  return `
    <button class="rrow s-${r.status} ${late?'late':''}" onclick="openMark('${r.id}')">
      <span class="rr-bang">${late?"!":""}</span>
      <span class="rr-t">${esc(r.time)}</span>
      <span class="rr-n">${esc(r.name)}</span>
      <span class="rr-p">${pplOf(r)}명${r.infants?`(유아${r.infants})`:""}</span>
      <span class="rr-seat tag ${room?'pine':(r.tentativeRoomId?'amber':'rust')}">${esc(seat)}</span>
      <span class="rr-ph">${esc(r.phone||"-")}</span>
      <span class="rr-pills">${pills}</span>
      ${r.status!=="확정"?`<span class="rr-st tag ${r.status==="노쇼"?"rust":""}">${r.status}</span>`:""}
    </button>`;
}

/* 예약 한 건의 경고 사유 — 지표와 목록에서 함께 씁니다 */
function resWarn(r){
  const st = store().settings;
  const out = [];
  const h = hoursFor(r.date);
  if(h.closed) out.push("휴무일 예약");
  else{
    if(inBreak(r.date, r.time)) out.push("브레이크타임");
    if(toMin(r.time) < toMin(h.open) || toMin(r.time) >= toMin(h.close)) out.push("영업시간 밖");
    else if(h.lo && toMin(r.time) > toMin(h.lo)) out.push("라스트오더 이후");
    if(toMin(r.time) + stayOf(r) > toMin(h.close)) out.push("마감 넘김");
  }
  const seat = st.rooms.find(x=>x.id===r.roomId);
  if(seat && isBlocked(seat)) out.push("사용 중지 좌석");
  if(seat && seat.type==="room"){
    if(pplOf(r) > seat.capacity) out.push("정원 초과");
    else if(adultCount(pplOf(r), r.infants) < roomMin(seat)) out.push("최소 인원 미달");
  }
  if((r.infants||0) >= pplOf(r) && pplOf(r)>0) out.push("성인 없음");
  if(seat && seat.type==="room"){
    const cn = Object.values(r.courses||{}).reduce((a,b)=>a+b,0);
    const ad = adultCount(pplOf(r), r.infants);
    if(r.menuType==="해당 없음") out.push("룸·코스 아님");
    else if(r.menuType==="확인 필요") out.push("코스 미확정");
    else if(r.menuType==="코스" && !r.courseUndecided && cn>0 && cn<ad) out.push("코스 인원 부족");
  }
  if((r.chairs||0) > (r.infants||0)) out.push("유아의자 초과");
  return out;
}

/* 손이 가야 할 것만 모읍니다. 각 줄은 눌러서 바로 처리할 수 있습니다. */
function checkItems(date){
  const s = store(), today = todayStr();
  const d = date || today;
  const list = s.reservations.filter(r=>r.date===d && r.status==="확정");
  const items = [];

  const un = list.filter(r=>!r.roomId);
  if(un.length) items.push(["amber", `좌석 미배정 ${un.length}건`,
    un.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openUnassigned()`]);

  const allergy = list.filter(r=>r.allergy);
  if(allergy.length) items.push(["rust", `알러지 확인 ${allergy.length}건`,
    allergy.slice(0,2).map(r=>`${r.time} ${r.name} · ${r.allergy}`).join(" / "), `openPick('allergy')`]);

  const chairs = list.filter(r=>r.chairs>0);
  const chairSum = chairs.reduce((a,r)=>a+(r.chairs||0),0);
  if(chairSum) items.push(["pine", `유아용 의자 ${chairSum}개 준비`,
    chairs.slice(0,3).map(r=>`${r.time} ${r.name} ${r.chairs}개`).join(", "), `openPick('chairs')`]);

  const gsize = s.settings.groupSize || 8;
  const group = list.filter(r=>pplOf(r) >= gsize);
  if(group.length) items.push(["pine", `단체 손님 ${group.length}건`,
    group.slice(0,3).map(r=>`${r.time} ${r.name} ${pplOf(r)}명`).join(", "), `openPick('group')`]);

  const menuChk = list.filter(r=>r.menuType==="확인 필요");
  if(menuChk.length) items.push(["amber", `메뉴 확인 필요 ${menuChk.length}건`,
    menuChk.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openPick('menu')`]);

  const ns = list.filter(r=>noshowOf(r.phone));
  if(ns.length) items.push(["rust", `노쇼 이력 손님 ${ns.length}건`,
    ns.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openPick('noshow')`]);

  if(d===today){
    const y = shiftDate(today,-1);
    const yAll = s.reservations.filter(r=>r.date===y && r.status!=="취소").length;
    const auto = autoClosedList(y);
    if(auto.length) items.push(["", `어제 예약 ${yAll}건 중 ${auto.length}건 자동 방문 처리`,
      "노쇼·취소가 있었다면 눌러서 수정하세요", `openPick('auto')`]);
  }

  return items;
}
function openCheck(){ view.form={type:"check"}; render(); }
function sheetCheck(){
  const items = checkItems(view.date);
  const body = items.length
    ? `<div class="alerts">${items.map(([c,t,sub,act])=>`
        <button class="alert ${c}" onclick="${act}">
          <span class="a-t">${esc(t)}</span>
          ${sub?`<span class="a-s">${esc(sub)}</span>`:""}
          <span class="a-go">&rsaquo;</span>

    : `<div class="empty">지금 확인할 항목이 없습니다.</div>`;
  return `
    ${sheetHead(`확인 필요 · ${dateLabel(view.date)}`)}
    <div class="checkbox-scroll">${body}</div>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;

function openPick(kind){ view.form={type:"pick", kind}; render(); }
function sheetPick(){
  const s = store(), d = view.date, today = todayStr();
  const kind = view.form.kind;
  const conf = {
    allergy:{title:"알러지 확인", pick:r=>r.allergy, note:"주방에 전달됐는지 확인하세요."},
    chairs:{title:"유아용 의자", pick:r=>r.chairs>0, note:"의자 개수를 미리 준비하세요."},
    menu:{title:"메뉴 확인 필요", pick:r=>r.menuType==="확인 필요", note:"방문 전 연락해 코스를 확정하세요."},
    noshow:{title:"노쇼 이력 손님", pick:r=>!!noshowOf(r.phone), note:"확인 전화를 돌리면 노쇼가 줄어듭니다."},
    warn:{title:"경고 예약", pick:r=>resWarn(r).length>0, note:"사장 판단으로 접수된 예약입니다. 문제가 없는지 확인하세요."},
    group:{title:"단체 손님", pick:r=>pplOf(r) >= (store().settings.groupSize||8),
           note:"상차림과 인력 배치를 미리 준비하세요. 기준 인원은 설정에서 바꿀 수 있습니다."},
    auto:{title:"어제 자동 방문 처리", pick:null, note:"실제로 오지 않은 손님이 있으면 노쇼로 바꿔주세요."}
  }[kind];
  const list = kind==="auto"
    ? autoClosedList(shiftDate(today,-1))
    : s.reservations.filter(r=>r.date===d && r.status==="확정" && conf.pick(r))
        .sort((a,b)=>a.time.localeCompare(b.time));
  const rows = list.length ? list.map(r=>`
    <button class="rowitem tap" onclick="openMark('${r.id}')">
      <span class="time-col">${esc(r.time)}</span>
      <span class="grow"><span class="t">${esc(r.name)}</span>
        <span class="s">${pplText(r)}${r.phone?` · ${esc(r.phone)}`:""}${
          kind==="allergy"&&r.allergy?` · ${esc(r.allergy)}`:""}${
          kind==="chairs"?` · 의자 ${r.chairs}개`:""}${
          kind==="noshow"&&noshowOf(r.phone)?` · 노쇼 ${noshowOf(r.phone).count}회`:""}${
          kind==="warn"?` · ${resWarn(r).join(", ")}`:""}${
          kind==="group"&&r.menuType==="코스"?` · 코스`:""}</span></span>
      <span class="tag ${r.roomId?'pine':'rust'}">${r.roomId?esc(seatLabel(r.roomId)):"미배정"}</span>
    </button>`).join("") : `<div class="empty">해당 예약이 없습니다.</div>`;
  return `
    ${sheetHead(`${conf.title} · ${kind==="auto"?dateLabel(shiftDate(today,-1)):dateLabel(d)}`)}
    <div class="card" style="margin-bottom:12px">${rows}</div>
    <p class="f-note">${conf.note}</p>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}

/* ============================================================
   좌석 가동 타임라인
   룸: 한 줄에 예약 블록
   홀: 테이블 수만큼 층을 만들고, 먼저 온 팀부터 아래층에 배치
       (한 팀이 테이블 2개를 쓰면 두 층을 차지)
   ============================================================ */
function laneLayout(items, laneCount){
  /* 시간 순으로 훑으며 비어 있는 가장 아래 층에 배치 */
  const laneEnd = new Array(laneCount).fill(-1);
  const placed = [];
  for(const it of items){
    let start = -1;
    for(let i=0; i+it.need<=laneCount; i++){
      let ok = true;
      for(let k=i;k<i+it.need;k++) if(laneEnd[k] > it.s0){ ok=false; break; }
      if(ok){ start=i; break; }
    }
    if(start<0){ placed.push({...it, lane:null, over:true}); continue; }
    for(let k=start;k<start+it.need;k++) laneEnd[k] = it.e0;
    placed.push({...it, lane:start});
  }
  return placed;
}
function renderTimeline(date){
  const s = store(), st = s.settings;
  const ax = axisRange();                       /* 가장 넓은 영업시간 = 가로축 */
  const o = ax.o, c = ax.c, span = c - o;
  const dh = hoursFor(date);                    /* 그날 실제 운영시간 */
  const dOpen = toMin(dh.open), dClose = toMin(dh.close);
  const list = s.reservations.filter(r=>r.date===date && r.status!=="취소");
  const pos = m => ((m-o)/span)*100;
  /* 영업 전·후, 브레이크타임을 덮는 층 */
  const shade = `
    ${dh.closed?`<span class="closed-band"></span>`:`
      ${dOpen>o?`<span class="offband" style="left:0; width:${pos(dOpen)}%"></span>`:""}
      ${dClose<c?`<span class="offband" style="left:${pos(dClose)}%; right:0"></span>`:""}
      ${dh.bs&&dh.be?`<span class="breakband" style="left:${pos(toMin(dh.bs))}%; width:${((toMin(dh.be)-toMin(dh.bs))/span)*100}%"></span>`:""}
    `}`;
  const LANE = 21;   /* 층 하나의 높이(px) */

  const ticks = [];
  for(let m=Math.ceil(o/60)*60; m<=c; m+=60)
    ticks.push(`<span class="tk" style="left:${pos(m)}%"><i></i><b>${Math.floor(m/60)}</b></span>`);
  const layers = ticks.join("") + shade;
  const nowM = toMin(nowHM());
  const nowLine = (date===todayStr() && nowM>=o && nowM<=c)
    ? `<span class="nowline" style="left:${pos(nowM)}%"></span>` : "";

  const blockLabel = r =>
    `<b>${esc(r.time)}</b> ${esc(r.name)} ${pplOf(r)}명${r.infants?`(유아${r.infants})`:""}`;

  /* ---------- 홀 ---------- */
  const hallRow = (hall)=>{
    const tbl = hallTables(hall);
    const total = tbl.length;
    const items = list.filter(r=>effSeat(r)===hall.id)
      .sort((a,b)=>a.time.localeCompare(b.time))
      .map(r=>({ r, need:Math.min(total, tablesFor(pplOf(r))), s0:toMin(r.time), e0:Math.min(c, toMin(r.time)+stayOf(r)) }));
    const placed = laneLayout(items, total);
    const blocks = placed.map(it=>{
      if(it.lane===null) return "";
      const w = ((it.e0-it.s0)/span)*100;
      const tent = !it.r.roomId;
      const past = date<todayStr() || (date===todayStr() && it.e0 < nowM);
      const bad = resWarn(it.r).length>0;
      return `<button class="blk ${tent?'tent':''} ${bad?'warned':''} ${past?'past':''}" onclick="openMark('${it.r.id}')"
        style="left:${pos(it.s0)}%; width:${w}%; bottom:${it.lane*LANE+1}px; height:${it.need*LANE-2}px"
        title="${esc(it.r.time)} ${esc(it.r.name)} ${pplText(it.r)}${tent?' · 잠정':''}">
        ${blockLabel(it.r)}${tent?' <i class="tt">잠정</i>':''}</button>`;
    }).join("");
    /* 가동률 = 사용 테이블-시간 / (테이블 수 × 영업시간) */
    const tblMin = items.reduce((a,x)=>a+x.need*(x.e0-x.s0),0);
    const rate = total ? Math.min(100, Math.round(tblMin/(total*span)*100)) : 0;
    const over = placed.filter(x=>x.lane===null).length;
    return `<div class="tl-row hall ${isBlocked(hall)?'off-seat':''}" style="--lanes:${total}">
      <div class="tl-name"><b>${esc(hall.name)}</b><small>${total}테이블</small></div>
      <div class="tl-track" style="height:${total*LANE}px">
        ${layers}
        ${Array.from({length:total},(_,i)=>`<span class="lane" style="bottom:${i*LANE}px; height:${LANE}px"></span>`).join("")}
        ${blocks}${nowLine}
      </div>
      <div class="tl-rate" style="height:${total*LANE}px">${total>1
        ? `<span class="rb"><i></i><b>${rate}%</b><i></i></span>`
        : `<span class="rt">${rate}%</span>`}${over?`<small class="over">초과 ${over}</small>`:""}</div>
    </div>`;
  };

  /* ---------- 룸 ---------- */
  const roomRow = (room)=>{
    const items = list.filter(r=>effSeat(r)===room.id)
      .sort((a,b)=>a.time.localeCompare(b.time))
      .map(r=>({ r, need:1, s0:toMin(r.time), e0:Math.min(c, toMin(r.time)+stayOf(r)) }));
    /* 사장 판단으로 겹치게 받은 경우가 있으므로 층을 유동적으로 */
    let lanes = 1;
    for(const a of items) for(const b of items)
      if(a!==b && a.s0 < b.e0 && b.s0 < a.e0) lanes = 2;
    const placed = laneLayout(items, lanes);
    const blocks = placed.map(it=>{
      const w = ((it.e0-it.s0)/span)*100;
      const tent = !it.r.roomId;
      const past = date<todayStr() || (date===todayStr() && it.e0 < nowM);
      const lane = it.lane===null?0:it.lane;
      const bad = resWarn(it.r).length>0;
      return `<button class="blk ${tent?'tent':''} ${bad?'warned':''} ${past?'past':''}" onclick="openMark('${it.r.id}')"
        style="left:${pos(it.s0)}%; width:${w}%; bottom:${lane*LANE+1}px; height:${LANE-2}px"
        title="${esc(it.r.time)} ${esc(it.r.name)} ${pplText(it.r)}${tent?' · 잠정':''}">
        ${blockLabel(it.r)}${tent?' <i class="tt">잠정</i>':''}</button>`;
    }).join("");
    const used = items.reduce((a,x)=>a+(x.e0-x.s0),0);
    const rate = Math.min(100, Math.round(used/span*100));
    return `<div class="tl-row ${isBlocked(room)?'off-seat':''}">
      <div class="tl-name"><b>${esc(room.name)}</b><small>${isBlocked(room)?"사용 중지":`${roomMin(room)}~${room.capacity}인`}</small></div>
      <div class="tl-track" style="height:${lanes*LANE}px">
        ${layers}${blocks}${nowLine}
      </div>
      <div class="tl-rate" style="height:${lanes*LANE}px">${lanes>1
        ? `<span class="rb"><i></i><b>${rate}%</b><i></i></span>`
        : `<span class="rt">${rate}%</span>`}</div>
    </div>`;
  };

  const halls = st.rooms.filter(r=>r.type==="hall");
  const rooms = st.rooms.filter(r=>r.type==="room");

  /* 전체 가동률 */
  const st2 = dayStat(date);
  const roomRate = st2.roomRate, hallRate = st2.hallRate;
  const tentCount = list.filter(r=>!r.roomId).length;

  return `
    <div class="tl-top">
      <div class="tl-kpis">
        <span class="tl-kpi">예약률 <b>${st2.rate}%</b></span>
        <span class="tl-kpi sub">룸 <b>${roomRate}%</b></span>
        <span class="tl-kpi sub">홀 <b>${hallRate}%</b></span>
        <span class="tl-note">룸 ${st2.roomSeats}개 + 홀 ${st2.hallSeats}테이블 = ${st2.seatAll}자리 기준</span>
        ${tentCount?`<span class="tag amber">좌석 미정 ${tentCount}건</span>`:""}
      </div>
      <span class="tl-hours">${dh.closed
        ? `휴무 · ${esc(dh.note||"")}`
        : `영업시간 ${esc(dh.open)} ~ ${esc(dh.close)}${dh.bs?` · 브레이크 ${esc(dh.bs)} ~ ${esc(dh.be)}`:""}${dh.lo?` · 라스트오더 ${esc(dh.lo)}`:""}`}</span>
      <div class="tl-legends">
        <span class="tl-legend"><i class="lgsw ok"></i>확정</span>
        <span class="tl-legend"><i class="lgsw tent"></i>잠정</span>
        <span class="tl-legend"><i class="lgsw warn"></i>경고</span>
      </div>
    </div>
    <div class="tl-scroll" id="tl-scroll">
      <div class="tl">
        <div class="tl-row axis">
          <div class="tl-name"></div>
          <div class="tl-track">${ticks.join("")}</div>
          <div class="tl-rate"><span class="rt">예약률</span></div>
        </div>
        ${halls.map(hallRow).join("")}
        ${rooms.map(roomRow).join("")}
      </div>
    </div>`;
}

/* ============================================================
   예약
   ============================================================ */
function weekStart(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() - d.getDay());
  return todayStr(d);
}

/* 하루치 요약 — 달력 팝업과 예약 화면에서 함께 씁니다 */
function dayStat(date){
  const s = store(), st = s.settings;
  const h = hoursFor(date);
  const o = toMin(h.open), c = toMin(h.close), span = Math.max(60, c-o);
  /* 취소만 빼고 셉니다 — 지난 날짜는 '방문'으로 바뀌어 있습니다 */
  const list = s.reservations.filter(r=>r.date===date && r.status!=="취소");
  const people = list.reduce((a,r)=>a+pplOf(r),0);
  const rooms = st.rooms.filter(r=>r.type==="room");
  const halls = st.rooms.filter(r=>r.type==="hall");
  const hallT = halls.reduce((a,h)=>a+hallTables(h).length,0);
  /* 예약이 차지하는 시간을 영업시간 안으로 잘라서 계산합니다.
     (마감 이후 시각의 예약이 음수가 되던 문제를 막습니다) */
  const spanOf = r => {
    const s0 = Math.max(o, toMin(r.time));
    const e0 = Math.min(c, toMin(r.time) + stayOf(r));
    return Math.max(0, e0 - s0);
  };
  const roomUsed = list.filter(r=>rooms.some(x=>x.id===effSeat(r)))
    .reduce((a,r)=>a+spanOf(r),0);
  const hallUsed = list.filter(r=>halls.some(x=>x.id===effSeat(r)))
    .reduce((a,r)=>a+tablesFor(pplOf(r))*spanOf(r),0);
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const seatAll = rooms.length + hallT;        /* 룸 1개 = 좌석 1, 홀은 테이블 1개 = 좌석 1 */
  /* 룸만·홀만 놓고 본 비율 */
  const roomRate = rooms.length ? clamp(roomUsed/(rooms.length*span)*100) : 0;
  const hallRate = hallT ? clamp(hallUsed/(hallT*span)*100) : 0;
  /* 전체 예약률에서 각자가 차지하는 몫 — 둘을 더하면 전체가 됩니다 */
  const roomShare = seatAll ? roomUsed/(seatAll*span)*100 : 0;
  const hallShare = seatAll ? hallUsed/(seatAll*span)*100 : 0;
  const total = clamp(roomShare + hallShare);
  return {count:list.length, people, roomRate, hallRate, rate:total,
          roomShare:Math.max(0,roomShare), hallShare:Math.max(0,hallShare),
          seatAll, roomSeats:rooms.length, hallSeats:hallT,
          unassigned:list.filter(r=>!r.roomId).length};
}

/* ---------- 좌석 현황 (2층) ---------- */
function renderSeatBoard(date){
  const s = store(), st = s.settings;
  const list = s.reservations.filter(r=>r.date===date && r.status==="확정");
  const cell = (r)=>{
    if(r.type==="hall"){
      const rows = list.filter(x=>effSeat(x)===r.id);
      const total = hallTables(r).length;
      /* 그날 가장 많이 쓰인 시점의 테이블 수 */
      let peak = 0, peakTent = 0;
      const dh = hoursFor(date);
      for(let m=toMin(dh.open); m<toMin(dh.close); m+=30){
        const inWin = x => toMin(x.time)<=m && m<toMin(x.time)+stayOf(x);
        const u = rows.filter(x=>x.roomId===r.id && inWin(x)).reduce((a,x)=>a+tablesFor(pplOf(x)),0);
        const t = rows.filter(x=>!x.roomId && inWin(x)).reduce((a,x)=>a+tablesFor(pplOf(x)),0);
        if(u+t > peak+peakTent){ peak=u; peakTent=t; }
      }
      const pct = total ? Math.round((peak+peakTent)/total*100) : 0;
      return `<div class="sb-cell hall ${peak+peakTent>=total?'full':''}">
        <div class="sb-h"><span class="sb-n">${esc(r.name)}</span><span class="sb-r">${pct}%</span></div>
        <div class="sb-bar"><i style="width:${total?peak/total*100:0}%"></i><u style="width:${total?peakTent/total*100:0}%"></u></div>
        <div class="sb-s">${total}테이블</div>
        <div class="sb-s">최다 사용 ${peak+peakTent}${peakTent?` (잠정 ${peakTent})`:""}</div>
        <div class="sb-s">${rows.length}팀 예약</div>
      </div>`;
    }
    const rows = list.filter(x=>effSeat(x)===r.id).sort((a,b)=>a.time.localeCompare(b.time));
    const tentOnly = rows.length && rows.every(x=>!x.roomId);
    const dh = hoursFor(date);
    const span = Math.max(60, toMin(dh.close)-toMin(dh.open));
    const used = rows.reduce((a,x)=>a+Math.min(stayOf(x), toMin(dh.close)-toMin(x.time)),0);
    const pct = Math.min(100,Math.round(used/span*100));
    return `<div class="sb-cell ${rows.length?(tentOnly?'tent':'used'):''}">
      <div class="sb-h"><span class="sb-n">${esc(r.name)}</span><span class="sb-r">${pct}%</span></div>
      <div class="sb-bar"><i style="width:${tentOnly?0:pct}%"></i><u style="width:${tentOnly?pct:0}%"></u></div>
      <div class="sb-s">${roomMin(r)}인~${r.capacity}인</div>
      <div class="sb-s">${rows.length?rows.map(x=>`${x.time}${x.roomId?"":"*"}`).join(", "):"예약 없음"}</div>
    </div>`;
  };
  const halls = st.rooms.filter(r=>r.type==="hall");
  const rooms = st.rooms.filter(r=>r.type==="room");
  return `
    <div class="sb-grid hall">${halls.map(cell).join("")}</div>
    <div class="sb-grid">${rooms.map(cell).join("")}</div>
    <div class="sb-note">* 표시는 좌석 미정 예약의 잠정 배정입니다.</div>`;
}

function openCal(){ view.calOpen = true; view.calMonth = view.date.slice(0,7); render(); }
function closeCal(){ view.calOpen = false; render(); }
function moveCalMonth(n){
  const [y,m] = view.calMonth.split("-").map(Number);
  const d = new Date(y, m-1+n, 1);
  view.calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1);
  render();
}
function pickCalDate(d, close){
  view.date = d;
  if(close) view.calOpen = false;
  render();
}
function renderCal(){
  const [y,m] = view.calMonth.split("-").map(Number);
  const lead = new Date(y,m-1,1).getDay();
  const lastDay = new Date(y,m,0).getDate();
  const today = todayStr();

  let cells = "";
  for(let i=0;i<lead;i++) cells += `<span class="cday blank"></span>`;
  for(let d=1; d<=lastDay; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    const st = dayStat(ds);
    const dow = new Date(ds+"T00:00:00").getDay();
    const cls = ["cday", ds===view.date?"sel":"", ds===today?"today":"",
                 dow===0?"sun":dow===6?"sat":""].join(" ");
    cells += `<button class="${cls}" onclick="pickCalDate('${ds}',true)">
      <span class="dn">${d}</span>
      ${st.count?`<span class="cn">${st.count}건</span>
        <span class="cbar"><i style="width:${st.rate}%"></i></span>
        <span class="cr">${st.rate}%</span>`:`<span class="cn none">-</span>`}
    </button>`;
  }
  return `
    <div class="overlay" onclick="closeCal()">
      <div class="calbox" onclick="event.stopPropagation()">
        <div class="sheet-h">
          <h2>날짜 선택</h2>
          <button class="x" onclick="closeCal()" aria-label="닫기">×</button>
        </div>
        <div class="cal-nav">
          <button class="nav" onclick="moveCalMonth(-1)">◀</button>
          <div class="cal-m">${y}년 ${m}월</div>
          <button class="nav" onclick="moveCalMonth(1)">▶</button>
        </div>
        <div class="cgrid chead">${["일","월","화","수","목","금","토"].map((x,i)=>
          `<span class="chd ${i===0?'sun':i===6?'sat':''}">${x}</span>`).join("")}</div>
        <div class="cgrid">${cells}</div>
        <div class="cal-legend">숫자는 확정 예약 건수, 막대는 좌석 예약률입니다.</div>
        <div class="sheet-actions">
          <button class="btn" onclick="pickCalDate('${todayStr()}',true)">오늘로</button>
          <button class="btn ghost" onclick="closeCal()">닫기</button>
        </div>
      </div>
    </div>`;
}

function moveDate(d){ view.date=shiftDate(view.date,d); render(); }
/* 오늘 기준 가까운 날짜에 이름표 */
function dayBadge(d){
  const t = todayStr();
  if(d===t) return ' <span class="tag pine">오늘</span>';
  if(d===shiftDate(t,-1)) return ' <span class="tag near past">어제</span>';
  if(d===shiftDate(t,1)) return ' <span class="tag near">내일</span>';
  if(d===shiftDate(t,2)) return ' <span class="tag near">모레</span>';
  return "";
}
function moveMonthDate(n){
  const [y,m,dd] = view.date.split("-").map(Number);
  const last = new Date(y, m-1+n+1, 0).getDate();
  const dt = new Date(y, m-1+n, Math.min(dd,last));
  view.date = todayStr(dt); view.calMonth = view.date.slice(0,7);
  render();
}
function setDate(v){ if(v){ view.date=v; render(); } }
async function setStatus(id,status){
  const s=store();
  const rec = s.reservations.find(r=>r.id===id);
  if(status==="취소" && rec && rec.status!=="취소"){
    const ok = await uiConfirm("예약을 취소할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}`,
      {ok:"예약 취소", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(status==="노쇼" && rec && rec.status!=="노쇼"){
    const ok = await uiConfirm("노쇼로 처리할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n노쇼 관리 목록에 쌓입니다.`,
      {ok:"노쇼 처리", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(rec) logEvent("상태 변경", `${rec.date} ${rec.time} ${rec.name} ${rec.status} → ${status}`);
  s.reservations = s.reservations.map(r=>r.id===id?{...r,status}:r);
  if(rec) reflowTentatives(rec.date);
  saveData(); render();
}

/* 디스플레이 배치에서 좌석을 다른 줄로 옮깁니다 */
function screenUrl(){
  try{
    const base = location.origin + location.pathname.replace(/\/screen(\/[a-z]+)?$/i,"").replace(/\/+$/,"");
    if(location.protocol === "file:") return location.href.split("#")[0] + `#/screen/${view.storeKey}`;
    return `${base}/screen/${view.storeKey}`;
  }catch(e){ return `/screen/${view.storeKey}`; }
}
function copyScreenUrl(){
  if(!navigator.clipboard) return uiAlert("복사 실패","주소를 직접 입력해 주세요.","warn");
  navigator.clipboard.writeText(screenUrl()).then(
    ()=>uiAlert("복사 완료","TV 브라우저 주소창에 붙여넣으세요.","ok"),
    ()=>uiAlert("복사 실패","주소를 직접 입력해 주세요.","warn"));
}
function moveDisp(id, dir){
  const st = draft();
  const rows = (st.displayRows && st.displayRows.length===3)
    ? st.displayRows.map(r=>[...r]) : displayRows().map(r=>[...r]);
  const from = rows.findIndex(r=>r.includes(id));
  const to = from + dir;
  if(from<0 || to<0 || to>2) return;
  rows[from] = rows[from].filter(x=>x!==id);
  rows[to].push(id);
  st.displayRows = rows;
  render();
}
function setSetting(k,v){ draft()[k]=v; render(); }
function setSettingNum(k,v){ draft()[k]=parseFloat(v)||1; render(); }
function toggleAdultOnly(){
  const st = draft();
  st.minCountAdultsOnly = st.minCountAdultsOnly===false;
  render();
}
function toggleHoliday(){
  const st = draft();
  st.holidayMode = st.holidayMode===false;
  render();
}
function addHoliday(){
  const v = document.getElementById("hol-date").value;
  if(!v) return;
  const st = draft();
  st.holidays = [...new Set([...(st.holidays||[]), v])];
  render();
}
function delHoliday(d){
  const st = draft();
  st.holidays = (st.holidays||[]).filter(x=>x!==d);
  render();
}
/* 숫자 값을 팝업으로 고칩니다 (키패드 대신 큰 버튼) */
function openNum(key, title, min, max, ctx){
  view.form = {type:"num", key, title, min, max, ctx, val:null};
  render();
}
function toggleHolidayWeekend(){
  const st = draft();
  st.holidayAsWeekend = st.holidayAsWeekend===false;
  render();
}
function courseSet(){ const st=draft(); if(!st.courseGroups) st.courseGroups=deepClone(DEFAULT_COURSE_GROUPS); return st.courseGroups; }
function setCourseField(i,f,v){ courseSet()[i][f]=v; render(); }
function setCourseItems(i,v){
  courseSet()[i].items = v.split(",").map(x=>x.trim()).filter(Boolean); render();
}
function toggleWhen(i,w){
  const g=courseSet(); const cur = g[i].when||[];
  g[i].when = cur.includes(w) ? cur.filter(x=>x!==w) : [...cur, w];
  render();
}
function addCourseRow(){ courseSet().push({label:"새 행", items:[], when:[]}); render(); }
async function delCourseRow(i){
  const g=courseSet();
  if(!await uiConfirm("행을 삭제할까요?", `${g[i].label} — 항목 ${(g[i].items||[]).length}개`, {ok:"삭제"})) return;
  g.splice(i,1); render();
}
async function toggleBlock(id){
  const st = draft();
  const r = st.rooms.find(x=>x.id===id);
  if(!r) return;
  if(r.blocked){
    st.rooms = st.rooms.map(x=>x.id===id?{...x, blocked:false, blockNote:""}:x);
    render(); return;
  }
  const ok = await uiConfirm(`${r.name}을 사용 중지할까요?`,
    "수리·고장 등으로 잠시 쓰지 않는 자리로 표시합니다.\n" +
    "예약 화면에서 흐리게 보이고 자동 배정에서 빠지지만, 필요하면 그대로 배정할 수 있습니다.",
    {ok:"사용 중지"});
  if(!ok) return;
  st.rooms = st.rooms.map(x=>x.id===id?{...x, blocked:true, blockNote:""}:x);
  render();
}
function moveRoom(i,d){
  const st = draft();
  const j = i+d;
  if(j<0 || j>=st.rooms.length) return;
  const arr = st.rooms;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  render();
}
function setRoomText(id,field,v){
  const st=draft();
  st.rooms = st.rooms.map(r=>r.id===id?{...r,[field]:v}:r);
  render();
}
function setRoomField(id,field,v){
  const st=draft();
  st.rooms = st.rooms.map(r=>r.id===id?{...r,[field]:Math.max(1,parseInt(v)||1)}:r);
  render();
}
async function addRoom(){
  const el = document.getElementById("nr-name");
  const name = (el?el.value:"").trim();
  if(!name) return uiAlert("좌석 이름을 입력하세요","","warn");
  const cap = parseInt(document.getElementById("nr-cap").value)||4;
  const type = document.getElementById("nr-type").value;
  const min = parseInt(document.getElementById("nr-min").value)||1;
  const st = draft();
  const rec = {id:"r_"+Date.now(), name, type, floor:""};
  if(type==="hall") rec.zones = [{name:"홀", sets:[{seats:4,count:Math.max(1,Math.floor(cap/4))}], maxJoin:2}];
  else { rec.capacity = cap; rec.minCapacity = Math.min(min,cap); }
  st.rooms.push(rec);
  render();
}
async function delRoom(id){
  const st = draft();
  const r = st.rooms.find(x=>x.id===id);
  if(!await uiConfirm("이 좌석을 삭제할까요?", `${r?r.name:""} — 기존 예약은 ‘미배정’으로 표시됩니다.`, {ok:"삭제"})) return;
  st.rooms = st.rooms.filter(x=>x.id!==id);
  render();
}
async function addSource(){
  const el = document.getElementById("ns");
  const v = (el?el.value:"").trim();
  const st = draft();
  if(!v || (st.sources||[]).includes(v)) return;
  st.sources = [...(st.sources||[]), v];
  render();
}
function delSource(x){ const st=draft(); st.sources=(st.sources||[]).filter(s=>s!==x); render(); }
async function addRole(){
  const v=document.getElementById("nrole").value.trim(); const st=store().settings;
  if(!v||st.roles.includes(v)) return;
  st.roles.push(v); saveData(); render();
}
function delRole(x){ const st=store().settings; st.roles=st.roles.filter(s=>s!==x); saveData(); render(); }

}
function sheetHead(title){
  return `<div class="sheet-h"><h2>${title}</h2><button class="x" onclick="closeSheet()" aria-label="닫기">×</button></div>`;
}

/* ---------- 예약 ---------- */
let tmpRes = null;   // 시트가 열려 있는 동안의 임시 값 (경로·상태 버튼 선택용)
function sheetRes(){
  const s=store(), st=s.settings;
  const editing = view.form.id ? s.reservations.find(r=>r.id===view.form.id) : null;
  if(!tmpRes || tmpRes.__id !== (view.form.id||"new")){
    tmpRes = editing
      ? {...editing, __id:editing.id}
      : {__id:"new", date:view.date, time:"18:00", name:"", phone:"", people:2, infants:0,
         chairs:0, roomId:"", source:"전화", sourceDetail:"", request:"", allergy:"", status:"확정",
         menuType:"해당 없음", courses:{}, courseUndecided:false};
  }
  const f = tmpRes;
  const roomOpts = st.rooms.map(r=>`<option value="${r.id}" ${f.roomId===r.id?'selected':''}>${
    r.type==="hall"?"[홀] ":""}${esc(r.name)}${r.type==="room"?` · ${roomMin(r)}~${r.capacity}인`:""}</option>`).join("");
  const srcs = [...new Set([...(st.sources||["전화","네이버예약","기타"]), f.source||"전화"])];
  const srcSeg = srcs.map(x=>`<button class="${f.source===x?'on':''}" onclick="pickSource('${esc(x)}')">${esc(x)}</button>`).join("");
  const stSeg = STATUS.map(x=>`<button class="${f.status===x?'on':''}" onclick="pickStatus('${x}')">${x}</button>`).join("");

  /* 식사 — 마법사 5단계와 같은 규칙을 씁니다.
     홀은 보통 메뉴를 정하지 않고 받으므로 선택지를 줄입니다. */
  const seatObj = st.rooms.find(x=>x.id===f.roomId);
  const isHall = seatObj ? seatObj.type==="hall" : false;
  const isRoom = seatObj ? seatObj.type==="room" : false;
  const baseMenuOpts = isHall ? ["코스","해당 없음"] : ["코스","코스 상당","확인 필요","해당 없음"];
  /* 홀로 옮긴 예약에 '확인 필요' 같은 값이 남아 있으면 버튼이 사라져 보이지 않게 되므로 살려 둡니다 */
  const menuOpts = f.menuType && baseMenuOpts.indexOf(f.menuType)<0
    ? baseMenuOpts.concat([f.menuType]) : baseMenuOpts;
  const cN = courseCount();
  const cAd = adultCount(pplOf(f), f.infants||0);
  /* 룸은 코스 주문을 전제로 받는 자리입니다 — 막지 않고 알리기만 합니다 */
  const menuWarn = isRoom && (
    f.menuType==="해당 없음" ? "룸은 보통 코스 손님을 받습니다" :
    f.menuType==="확인 필요" ? "방문 전 코스를 확정해야 합니다" :
    (f.menuType==="코스" && !f.courseUndecided && cN>0 && cN<cAd)
      ? `코스 ${cN}인분 · 성인 ${cAd}명보다 적습니다` : "");
  const menuSeg = menuOpts.map(x=>
    `<button class="${f.menuType===x?'on':''}" onclick="pickMenuType('${x}')">${x}</button>`).join("");

  return `
    ${sheetHead(editing?"예약 내용 수정":"새 예약")}
    <div class="grid2">
      <label class="f"><div class="lb">날짜</div><input id="f-date" type="date" value="${f.date}"></label>
      <label class="f"><div class="lb">시간</div><input id="f-time" type="time" value="${f.time}"></label>
    </div>
    <div class="grid2">
      <label class="f"><div class="lb">예약자명</div><input id="f-name" value="${esc(f.name)}" placeholder="홍길동" autocomplete="off"></label>
      <label class="f"><div class="lb">전화번호</div><input id="f-phone" type="tel" inputmode="numeric" value="${esc(f.phone)}" placeholder="010-0000-0000"></label>
    </div>
    <div class="grid2">
      <label class="f"><div class="lb">총 인원 (유아 포함)</div>
        <input id="f-people" type="number" min="1" value="${pplOf(f)}"></label>
      <label class="f"><div class="lb">유아</div>
        <input id="f-infants" type="number" min="0" value="${f.infants||0}"></label>
    </div>
    <label class="f"><div class="lb">유아용 의자</div>
      <input id="f-chairs" type="number" min="0" value="${f.chairs||0}"></label>
    <label class="f"><div class="lb">좌석</div>
      <select id="f-room" onchange="pickRoom(this.value)"><option value="">미배정</option>${roomOpts}</select></label>
    <div class="f"><div class="lb">예약경로</div><div class="seg">${srcSeg}</div>
      <div id="src-detail" style="margin-top:8px; display:${f.source==="기타"?"block":"none"}">
        <input id="f-src-detail" value="${esc(f.sourceDetail||"")}" placeholder="예: 지인 소개">
      </div>
    </div>
    <div class="f"><div class="lb">식사</div>
      ${menuWarn?`<div class="menu-warn" style="margin:0 0 8px">${esc(menuWarn)}</div>`:""}
      <div class="seg">${menuSeg}</div>
      ${f.menuType==="코스"?`
        <div class="course-sum" style="margin-top:10px">
          <span>${f.courseUndecided ? "코스 미정 — 방문 전 확정"
            : (cN?`선택: ${esc(courseSummary(f.courses))}`:"코스 구성을 선택하세요")}</span>
          <button class="btn sm" style="margin-left:auto" onclick="openCourse()">${cN||f.courseUndecided?"수정":"선택"}</button>
        </div>`:""}
    </div>
    <label class="f"><div class="lb">알러지</div><input id="f-allergy" value="${esc(f.allergy||'')}" placeholder="예: 갑각류 알러지 1명"></label>
    <label class="f"><div class="lb">요청사항</div><input id="f-request" value="${esc(f.request||'')}" placeholder="예: 창가 자리"></label>
    <div class="f"><div class="lb">상태</div><div class="seg">${stSeg}</div></div>
    <div class="sheet-actions">
      ${editing?`<button class="btn danger" onclick="delRes('${editing.id}')">삭제</button>`:""}
      <button class="btn ghost" onclick="closeSheet()">닫기</button>
      <button class="btn primary" onclick="saveRes()">저장</button>
    </div>`;
}
function step(id,d){
  const el=document.getElementById(id);
  el.value = Math.max(0,(parseInt(el.value)||0)+d);
}
function pickSource(x){ syncRes(); tmpRes = {...tmpRes, source:x}; render(); }
/* 좌석을 바꾸면 식사 선택지(홀은 2개·룸은 4개)와 경고가 달라져 바로 다시 그립니다 */
function pickRoom(v){ syncRes(); tmpRes = {...tmpRes, roomId:v}; render(); }
/* 식사 종류를 바꿈. 코스가 아니면 코스 구성을 비웁니다 — 남겨 두면 저장될 때 섞입니다 */
function pickMenuType(v){
  syncRes();
  tmpRes = {...tmpRes, menuType:v};
  if(v==="코스"){ tmpRes.courseOpen = true; }
  else { tmpRes.courses = {}; tmpRes.courseUndecided = false; tmpRes.courseOpen = false; }
  render();
}
function pickStatus(x){ syncRes(); tmpRes = {...tmpRes, status:x}; render(); }
/* 버튼을 눌러 화면을 다시 그리기 전에, 입력창에 친 값을 임시 객체에 옮겨 담음 */
function syncRes(){
  const g=id=>{const el=document.getElementById(id); return el?el.value:undefined;};
  const v = {};
  [["date","f-date"],["time","f-time"],["name","f-name"],["phone","f-phone"],
   ["roomId","f-room"],["sourceDetail","f-src-detail"],["request","f-request"],["allergy","f-allergy"]]
    .forEach(([k,id])=>{ const x=g(id); if(x!==undefined) v[k]=x; });
  [["people","f-people"],["infants","f-infants"],["chairs","f-chairs"]]
    .forEach(([k,id])=>{ const x=g(id); if(x!==undefined) v[k]=Math.max(0,parseInt(x)||0); });
  tmpRes = {...tmpRes, ...v};
}
async function saveRes(){
  syncRes();
  const s=store(), f=tmpRes;
  if(!(f.name||"").trim()) return uiAlert("예약자명을 입력하세요","","warn");
  if(!f.time) return uiAlert("시간을 입력하세요","","warn");
  const old = view.form.id ? s.reservations.find(r=>r.id===view.form.id) : null;
  const rec = {
    ...(old||{}),
    id: view.form.id || "res_"+Date.now(),
    date:f.date, time:f.time, name:(f.name||"").trim(), phone:(f.phone||"").trim(),
    people: Math.max(1, f.people||1), infants: f.infants||0, chairs: f.chairs||0,
    roomId: f.roomId || null,
    seatPref: f.roomId ? null : (old ? old.seatPref : "any"),
    tentativeRoomId: f.roomId ? null : (old ? old.tentativeRoomId : null),
    source:f.source, sourceDetail:f.source==="기타"?(f.sourceDetail||"").trim():"",
    request:(f.request||"").trim(), allergy:(f.allergy||"").trim(),
    menuType: f.menuType || "해당 없음",
    /* 코스가 아니면 구성은 비워 둡니다 — '해당 없음'인데 코스 인원이 남는 일을 막습니다 */
    courses: f.menuType==="코스" ? {...(f.courses||{})} : {},
    courseUndecided: f.menuType==="코스" ? !!f.courseUndecided : false,
    status:f.status,
    createdAt: old ? old.createdAt : new Date().toISOString()
  };
  delete rec.__id; delete rec.adults; delete rec.courseOpen;
  s.reservations = view.form.id ? s.reservations.map(r=>r.id===rec.id?rec:r) : [...s.reservations, rec];
  logEvent(view.form.id?"예약 수정":"예약 등록", `${rec.date} ${rec.time} ${rec.name} ${pplOf(rec)}명`);
  reflowTentatives(rec.date);
  view.date = rec.date; view.form=null; tmpRes=null;
  saveData(); render();
}
async function delRes(id){
  if(!await uiConfirm2("이 예약을 삭제할까요? 기록이 완전히 사라집니다.\n손님이 취소한 경우라면 '예약 취소'를 쓰는 편이 좋습니다.")) return;
  const s=store();
  const rec = s.reservations.find(r=>r.id===id);
  if(rec) logEvent("예약 삭제", `${rec.date} ${rec.time} ${rec.name} ${rec.phone||""}`);
  s.reservations=s.reservations.filter(r=>r.id!==id);
  if(rec) reflowTentatives(rec.date);
  view.form=null; tmpRes=null; saveData(); render();
}

/* ---------- 예약 상세 · 처리 ---------- */
function sheetMark(){
  const s = store(), st = s.settings;
  const r = s.reservations.find(x=>x.id===view.form.id);
  if(!r) return `${sheetHead("예약")}<div class="empty">예약을 찾을 수 없습니다.</div>`;

  const seat = r.roomId ? seatLabel(r.roomId)
             : (r.tentativeRoomId ? `미배정 (잠정 ${seatLabel(r.tentativeRoomId)})` : "미배정");
  const srcTxt = r.source==="기타" && r.sourceDetail ? `기타 · ${r.sourceDetail}` : (r.source||"전화");
  const made = r.createdAt ? new Date(r.createdAt) : null;
  const madeTxt = made
    ? `${made.getFullYear()}. ${made.getMonth()+1}. ${made.getDate()}. ${pad(made.getHours())}:${pad(made.getMinutes())}`
    : "기록 없음";

  const btn = (v,label,cls) =>
    `<button class="markbtn ${cls} ${r.status===v?'on':''}" onclick="markRes('${r.id}','${v}')">${label}</button>`;

  /* 좌석 미정이면 배정 후보를 바로 고를 수 있게 */
  let seatPick = "";
  if(!r.roomId){
    const cand = st.rooms.filter(x=>{
      const kind = r.seatPref||"any";
      if(kind==="hall-any" && x.type!=="hall") return false;
      if(kind==="room-any" && x.type!=="room") return false;
      if(x.type==="room") return pplOf(r)<=x.capacity;
      return true;
    }).map(x=>{
      const ok = x.type==="room"
        ? roomStatus(r.date,r.time,x.id,r.id).state==="free"
        : hallFits(hallStatus(r.date,r.time,x.id,r.id), pplOf(r));
      const first = x.id===r.tentativeRoomId;
      return {x, ok, first};
    }).sort((a,b)=> (b.first-a.first) || (b.ok-a.ok));
    seatPick = `
      <div class="lbl" style="margin:16px 0 8px">좌석 배정 ${r.tentativeRoomId?`<span class="tag amber">잠정 ${esc(seatLabel(r.tentativeRoomId))}</span>`:""}</div>
      <div class="seatpick">${cand.map(({x,ok,first})=>`
        <button class="spick ${ok?'':'busy'} ${first?'first':''}" onclick="assignSeat('${r.id}','${x.id}')">
          ${esc(x.name)}${x.type==="room"?` <small>${roomMin(x)}~${x.capacity}</small>`:""}
          ${first?`<i>1순위</i>`:""}
        </button>`).join("")}</div>`;
  }

  return `
    ${sheetHead("예약 상세")}
    <div class="mark-info">
      <div class="mi-t">${esc(r.time)} · ${esc(r.name)} 손님</div>
      <div class="mi-s">${pplText(r)} · ${esc(seat)}</div>
      ${r.phone?`<div class="mi-s">${esc(r.phone)}</div>`:""}
      <div class="mi-s">식사 · <b>${esc(r.menuType||"해당 없음")}</b>${
        r.courseUndecided?" (구성 미정)":(r.courses&&Object.keys(r.courses).length?` (${esc(courseSummary(r.courses))})`:"")}</div>
      ${r.assignedLater?`<div class="mi-s">좌석 미정으로 접수 → ${esc(seatLabel(r.roomId))} 배정 완료</div>`:""}
      ${resWarn(r).length?`<div class="mi-s warn-txt">경고 · ${esc(resWarn(r).join(", "))}</div>`:""}
      ${r.chairs?`<div class="mi-s">유아용 의자 ${r.chairs}개</div>`:""}
      ${r.allergy?`<div class="mi-s warn-txt">알러지: ${esc(r.allergy)}</div>`:""}
      ${r.request?`<div class="mi-s">요청: ${esc(r.request)}</div>`:""}
      <div class="mi-meta">
        <span>경로 ${esc(srcTxt)}</span><span>등록 ${madeTxt}</span>
      </div>
    </div>
    ${seatPick}
    <div class="lbl" style="margin:16px 0 8px">상태 · ${esc(r.status)}</div>
    <div class="markgrid">
      ${btn("확정","확정","back")}
      ${btn("방문","방문","ok")}
      ${btn("노쇼","노쇼","no")}
      ${btn("취소","예약 취소","cancel")}
    </div>
    <div class="sheet-actions">
      <button class="btn danger" onclick="delRes('${r.id}')">삭제</button>
      <button class="btn primary" onclick="openRes('${r.id}')">예약 내용 수정</button>
    </div>
    <p class="f-note" style="margin-top:10px">‘예약 취소’는 기록을 남기고, ‘삭제’는 기록까지 지웁니다. 보통은 취소를 쓰세요.</p>`;
}
async function markRes(id, status){
  const s = store();
  const rec = s.reservations.find(r=>r.id===id);
  if(status==="취소" && rec && rec.status!=="취소"){
    const ok = await uiConfirm("예약을 취소할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n좌석이 비고, 기록에는 ‘취소’로 남습니다.`,
      {ok:"예약 취소", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(status==="노쇼" && rec && rec.status!=="노쇼"){
    const ok = await uiConfirm("노쇼로 처리할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n` +
      `이 번호는 노쇼 관리 목록에 쌓이고, 다음 예약 때 안내가 뜹니다.`,
      {ok:"노쇼 처리", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(rec) logEvent("상태 변경", `${rec.date} ${rec.time} ${rec.name} ${rec.status} → ${status}`);
  s.reservations = s.reservations.map(r=>r.id===id?{...r,status}:r);
  if(rec) reflowTentatives(rec.date);
  view.form = null; saveData(); render();
}
async function assignSeat(id, roomId){
  const s = store();
  const r = s.reservations.find(x=>x.id===id);
  if(!r) return;
  const room = s.settings.rooms.find(x=>x.id===roomId);
  if(room.type==="room"){
    const rs = roomStatus(r.date, r.time, roomId, id);
    if(rs.state==="blocked"){
      await uiAlert2(`${room.name} 룸은 앞뒤 1시간 안에 확정 예약이 있어 배정할 수 없습니다.`);
      return;
    }
    if(rs.state==="warn" && !await uiConfirm2(`${room.name} 룸에 겹치는 예약이 있습니다. 그래도 배정할까요?`)) return;
    if(pplOf(r) > room.capacity && !await uiConfirm2(`${room.name} 룸 정원(${room.capacity}명)을 넘습니다. 배정할까요?`)) return;
  }else{
    const h = hallStatus(r.date, r.time, roomId, id);
    if(!hallFits(h, pplOf(r)) && !await uiConfirm2(`${room.name} 남은 테이블이 부족합니다. 배정할까요?`)) return;
  }
  logEvent("좌석 배정", `${r.date} ${r.time} ${r.name} → ${room.name}`);
  /* 원래 미배정이었다는 기록을 남깁니다 — 나중에 자리를 바꿀 때 참고합니다 */
  if(!r.roomId) r.assignedLater = {from:r.seatPref||"any", at:new Date().toISOString()};
  r.roomId = roomId; r.tentativeRoomId = null; r.seatPref = null;
  reflowTentatives(r.date);
  view.form = null; saveData(); render();
}


/* ---------- 룸 미배정 목록 ---------- */
function sheetUnassigned(){
  const s = store(), d = view.date;
  const list = s.reservations.filter(r=>r.date===d && r.status==="확정" && !r.roomId)
    .sort((a,b)=>a.time.localeCompare(b.time));
  const rows = list.length ? list.map(r=>`
    <button class="rowitem tap" onclick="openMark('${r.id}')">
      <span class="time-col">${esc(r.time)}</span>
      <span class="grow"><span class="t">${esc(r.name)}</span>
        <span class="s">${pplText(r)} · 희망 ${esc(seatLabel(r.seatPref||"any"))}${r.phone?` · ${esc(r.phone)}`:""}</span></span>
      <span class="tag ${r.tentativeRoomId?'amber':'rust'}">${r.tentativeRoomId?`잠정 ${esc(seatLabel(r.tentativeRoomId))}`:"자리 없음"}</span>
    </button>`).join("") : `<div class="empty">배정할 예약이 없습니다.</div>`;
  return `
    ${sheetHead(`룸 미배정 · ${dateLabel(d)}`)}
    <div class="card" style="margin-bottom:12px">${rows}</div>
    <p class="f-note">예약을 누르면 좌석을 배정할 수 있습니다. ‘잠정’은 시스템이 잡아둔 1순위 자리입니다.</p>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}

/* ---------- 숫자 입력 팝업 ---------- */
function numValue(){
  const f = view.form;
  if(f.val != null) return f.val;
  const st = draft();
  if(f.ctx && f.ctx.room){
    const r = st.rooms.find(x=>x.id===f.ctx.room);
    return r ? (f.key==="minCapacity" ? roomMin(r) : (r[f.key]||f.min)) : f.min;
  }
  if(f.ctx && f.ctx.tset != null){
    const hall = st.rooms.find(x=>x.id===f.ctx.hall);
    const zone = (hall.zones||[])[f.ctx.zone];
    if(f.key==="maxJoin") return zone.maxJoin||1;
    const s = zone.sets[f.ctx.tset];
    return s ? s[f.key] : f.min;
  }
  return st[f.key] != null ? st[f.key] : f.min;
}
function sheetNum(){
  const f = view.form;
  const v = numValue();
  const step = (f.ctx && f.ctx.step) || 1;
  const quick = [];
  for(let i=f.min; i<=f.max && quick.length<12; i+=step) quick.push(+i.toFixed(1));
  return `
    ${sheetHead(f.title)}
    <div class="numbig">
      <button onclick="numAdj(-1)" ${v<=f.min?"disabled":""}>−</button>
      <div class="nv">${v}</div>
      <button onclick="numAdj(1)" ${v>=f.max?"disabled":""}>＋</button>
    </div>
    <div class="numgrid">
      ${quick.map(n=>`<button class="${v===n?'on':''}" onclick="numSet(${n})">${n}</button>`).join("")}
    </div>

    <div class="sheet-actions">

/* 이 구역에서 실제로 만들 수 있는 자리 크기를 모두 구합니다.
   (같은 구역 안이면 어떤 테이블이든 붙임 한도까지 붙일 수 있습니다) */
function zoneCombos(zone){
  const tables = [];
  (zone.sets||[]).forEach(s=>{ for(let i=0;i<(s.count||0);i++) tables.push(s.seats||4); });
  const maxJoin = Math.max(1, zone.maxJoin||1);
  const out = new Map();          /* 좌석수 → 조합 예시 */
  const seen = new Set();
  const walk = (start, used, sum) => {
    if(used.length){
      const key = used.join("+");
      if(!out.has(sum) || out.get(sum).length > used.length) out.set(sum, [...used]);
    }
    if(used.length >= maxJoin) return;
    for(let i=start;i<tables.length;i++){
      const sig = used.concat(tables[i]).slice().sort().join(",") + "|" + i;
      if(seen.has(sig)) continue;
      seen.add(sig);
      walk(i+1, [...used, tables[i]], sum + tables[i]);
    }
  };
  walk(0, [], 0);
  return [...out.entries()].sort((a,b)=>a[0]-b[0]);   /* [[좌석수, [조합]], ...] */
}

/* 구역 배치를 그림으로 — 테이블 구성과 만들 수 있는 자리 크기를 함께 보여줍니다 */
function zoneMap(hall){
  const zones = hall.zones || [];
  return `
    <div class="zmap">
      ${zones.map(z=>{
        const tables = [];
        (z.sets||[]).forEach(s=>{ for(let i=0;i<(s.count||0);i++) tables.push(s.seats||4); });
        const maxJoin = Math.max(1, z.maxJoin||1);
        const combos = zoneCombos(z);
        const joined = combos.filter(([n,c])=>c.length>1);
        return `
          <div class="zm-zone">
            <div class="zm-h"><b>${esc(z.name||"구역")}</b>
              <span>테이블 ${tables.length}개 · ${maxJoin>1?`최대 ${maxJoin}개까지 붙임`:"붙이지 않음"}</span></div>
            <div class="zm-tables">
              ${tables.map(s=>`<span class="zm-t">${s}</span>`).join("")
                || `<span class="muted" style="font-size:12px">테이블 없음</span>`}
            </div>
            ${combos.length?`
              <div class="zm-sub">이 구역에서 앉힐 수 있는 인원</div>
              <div class="zm-combos">
                ${combos.map(([n,c])=>`
                  <span class="zm-c ${c.length>1?'join':''}">
                    <b>${n}명</b><i>${c.join(" + ")}</i>
                  </span>`).join("")}
              </div>`:""}
            ${maxJoin>1
              ? `<div class="zm-note">같은 구역이면 <b>어떤 테이블이든</b> ${maxJoin}개까지 붙일 수 있습니다.
                  ${joined.length?`붙여서 만들 수 있는 자리는 ${joined.map(([n])=>n+"명").join(", ")} 입니다.`:""}</div>`
              : `<div class="zm-note">이 구역은 테이블을 붙이지 않습니다. 테이블 하나에 앉는 인원까지만 받습니다.</div>`}
          </div>`;
      }).join("") || `<div class="empty">구역이 없습니다.</div>`}
      <div class="zm-legend">
        네모 안 숫자는 그 테이블의 좌석 수입니다.
        붙임은 <b>같은 구역 안에서만</b> 가능하며, 다른 구역끼리는 붙일 수 없습니다.
      </div>
    </div>`;
}

  const hall = draft().rooms.find(r=>r.id===view.form.id);

function sheetSearch(){
  const q = (view.searchQ||"").trim();

     앞자리 010 은 빼고 비교해서 엉뚱한 결과가 나오지 않게 합니다. */
  const digits = q.replace(/\D/g,"").replace(/^010/,"");

      if(okTxt){
        const bag = `${r.name} ${r.request||""} ${r.allergy||""} ${r.sourceDetail||""}`;
        if(bag.includes(text)) return true;
      }
      return false;

          r.request?` · ${esc(r.request)}`:""}${r.allergy?` · 알러지 ${esc(r.allergy)}`:""}</span></span>
        <span class="tag ${r.roomId?'pine':'amber'}">${r.roomId?esc(seatLabel(r.roomId)):"미배정"}</span>
      </button>`).join("")
      : `<div class="empty">찾은 예약이 없습니다.</div>`;
  }
  const hintTxt = okNum||okTxt ? "" :
    (q ? `<p class="f-note" style="margin:-6px 0 10px">더 입력하세요 — 한글 2자 이상, 숫자 4자리 이상</p>` : "");
  return `

/* ---------- 노쇼 관리 ----------
   따로 저장하지 않고 예약 기록에서 전화번호 기준으로 모읍니다. */
function noshowList(){
  const s = store();
  const excluded = s.settings.noshowExcluded || [];
  const map = new Map();
  s.reservations.filter(r=>r.status==="노쇼" && r.phone).forEach(r=>{
    const key = r.phone.replace(/\D/g,"");
    if(!key || excluded.includes(key)) return;
    if(!map.has(key)) map.set(key, {phone:r.phone, key, name:r.name, count:0, dates:[]});
    const v = map.get(key);
    v.count++; v.dates.push(r.date); v.name = r.name;
  });
  return [...map.values()].sort((a,b)=>b.count-a.count);
}
function noshowOf(phone){
  if(!phone) return null;
  const key = String(phone).replace(/\D/g,"");
  if(!key) return null;
  return noshowList().find(x=>x.key===key) || null;
}

  const list = noshowList();
  const excluded = store().settings.noshowExcluded || [];
  const rows = list.length ? list.map(x=>`

  return `

      ${excluded.length?`<br>제외된 번호 ${excluded.length}건 · <button class="linkbtn" onclick="restoreNoshow()">되돌리기</button>`:""}
    </p>

          <input type="time" value="${d.noBreak?"":(d.bs!==undefined&&d.bs!==""?d.bs:base.bs)}" ${d.noBreak?"disabled":""} onchange="setOvr('bs',this.value)"></label>
        <label class="f"><div class="lb">브레이크 종료</div>
          <input type="time" value="${d.noBreak?"":(d.be!==undefined&&d.be!==""?d.be:base.be)}" ${d.noBreak?"disabled":""} onchange="setOvr('be',this.value)"></label>
      </div>
      <label class="chk"><input type="checkbox" ${d.noBreak?"checked":""} onchange="setOvr('noBreak',this.checked)">
        <span>브레이크타임 없음</span></label>
      <label class="f"><div class="lb">라스트오더</div>
        <input type="time" value="${d.noLo?"":(d.lo||base.lo)}" ${d.noLo?"disabled":""} onchange="setOvr('lo',this.value)"></label>
      <label class="chk"><input type="checkbox" ${d.noLo?"checked":""} onchange="setOvr('noLo',this.checked)">
        <span>라스트오더 없음</span></label>`}
    <label class="f"><div class="lb">메모</div>
      <input value="${esc(d.note||"")}" placeholder="예: 창립기념일 단축 영업" onchange="setOvr('note',this.value)"></label>
    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeSheet()">닫기</button>
      <button class="btn primary" onclick="saveOverride()">추가</button>
    </div>`;
}
function setOvr(k,v){
  view.ovrDraft = {...(view.ovrDraft||{date:todayStr(),closed:true}), [k]:v};
  render();
}
async function saveOverride(){
  const st = store().settings;
  const d = view.ovrDraft || {date:todayStr(), closed:true};
  if(!d.date) return uiAlert("날짜를 정해주세요","","warn");
  const base = hoursFor(d.date);
  const rec = d.closed
    ? {date:d.date, closed:true, note:d.note||"임시 휴무"}
    : {date:d.date, closed:false, open:d.open||base.open, close:d.close||base.close,
       bs:d.noBreak?"":(d.bs!==undefined?d.bs:base.bs), be:d.noBreak?"":(d.be!==undefined?d.be:base.be),
       lo:d.noLo?"":(d.lo||base.lo), note:d.note||"임시 운영시간"};
  st.overrides = [...(st.overrides||[]).filter(o=>o.date!==d.date), rec];
  logEvent("설정 변경", `임시 일정 ${rec.date} ${rec.closed?"휴무":"시간변경"}`);
  view.ovrDraft = null; saveData(); render();
}
async function delOverride(date){
  if(!await uiConfirm("임시 일정을 삭제할까요?", dateLabel(date), {ok:"삭제"})) return;
  const st = store().settings;
  st.overrides = st.overrides.filter(o=>o.date!==date);
  logEvent("설정 변경", `임시 일정 삭제 ${date}`);
  saveData(); render();
}

async function savePin(){
  const g = id => document.getElementById(id).value;
  if(g("pin-admin") !== ((DATA._auth && DATA._auth.admin) || DEFAULT_AUTH.admin)){
    logEvent("PIN 변경 실패", "관리자 비밀번호 불일치");
    await uiAlert2("관리자 비밀번호가 맞지 않습니다."); return;
  }
  const a = g("pin-new"), b = g("pin-new2");
  if(!/^\d{4}$/.test(a)){ await uiAlert2("PIN은 숫자 4자리여야 합니다."); return; }
  if(a !== b){ await uiAlert2("새 PIN이 서로 다릅니다."); return; }
  DATA._auth.pin = a;
  logEvent("PIN 변경", "성공");
  DATA._session = {authed:true, since:new Date().toISOString()};
  view.form = null; saveData(); render();
  await uiAlert2("PIN이 변경되었습니다.");
}

/* ---------- 접속 기록 ---------- */
function sheetLogs(){
  const logs = (DATA._logs||[]).slice().reverse();
  const q = (view.logQuery||"").trim();
  const filtered = q ? logs.filter(l =>
    (l.action+" "+l.detail+" "+l.ip+" "+l.ts).toLowerCase().includes(q.toLowerCase())) : logs;
  const rows = filtered.slice(0,400).map(l=>{
    const t = l.ts.replace("T"," ").slice(0,19);
    return `<div class="logrow">
      <span class="lg-t">${esc(t)}</span>
      <span class="lg-ip">${esc(l.ip)}</span>
      <span class="lg-a">${esc(l.action)}</span>
      <span class="lg-d">${esc(l.detail)}</span>
    </div>`;
  }).join("");
  return `
    ${sheetHead("접속 기록")}
    <div class="row" style="margin-bottom:10px">
      <input id="log-q" value="${esc(q)}" placeholder="검색 (동작·IP·날짜)" oninput="setLogQuery(this.value)" style="flex:1">
      <button class="btn" onclick="copyLogs()">전체 복사</button>
    </div>
    <div class="logbox">${rows || `<div class="empty">기록이 없습니다.</div>`}</div>
    <p class="f-note">전체 ${logs.length}건 중 ${Math.min(filtered.length,400)}건 표시.
      로그인·예약 등록·상태 변경·좌석 배정·설정 변경이 IP와 함께 쌓입니다.</p>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}
function setLogQuery(v){
  view.logQuery = v;
  const box = document.querySelector(".logbox");
  if(box) box.innerHTML = sheetLogs().split('<div class="logbox">')[1].split("</div>\n    <p")[0];
}
async function copyLogs(){
  const txt = (DATA._logs||[]).map(l=>`${l.ts}\t${l.ip}\t${l.store}\t${l.action}\t${l.detail}\t${l.ua}`).join("\n");
  if(!navigator.clipboard) return uiAlert("복사 실패","클립보드를 쓸 수 없습니다.","warn");
  navigator.clipboard.writeText(txt).then(
    ()=>uiAlert("복사 완료","접속 기록을 클립보드에 복사했습니다.","ok"),
    ()=>uiAlert("복사 실패","클립보드에 접근할 수 없습니다.","warn"));
}

/* ============================================================
   예약 등록 마법사 (5단계) — 전화 응대 순서대로 진행
   직원 누구나 화면에 뜬 질문을 그대로 읽으면 되도록 구성
   ============================================================ */
let WZ = null;   /* 진행 중인 예약 입력 상태. null이면 닫힘 */

const WZ_STEPS = [
  "어떤 경로로 들어온 예약인가요?",
  "예약 원하시는 날짜와 시간 말씀해 주시겠습니까?",
  "총 방문 인원수 말씀해 주시겠습니까?",
  "원하시는 좌석 있으신가요?",
  "식사는 어떻게 준비할까요?",
  "예약자 성함과 전화번호 말씀해 주시겠습니까?",
  "추가로 요청하실 사항 있으신가요?"
];
const WZ_LABELS = ["경로","날짜·시간","인원","좌석","메뉴","예약자","요청사항"];
const LAST_STEP = 6;

/* 코스 구성 기본값 — 실제 값은 설정(settings.courseGroups)에서 관리합니다 */
const DEFAULT_COURSE_GROUPS = [
  { label:"저녁 (종일)", items:["오","촉","한","위"],     when:["종일"] },
  { label:"평일 점심",   items:["요리사","동한","서한"],  when:["평일점심"] },
  { label:"주말 점심",   items:["요리사","B","A"],        when:["주말점심"] }
];
const WHEN_OPTS = ["종일","평일점심","평일저녁","주말점심","주말저녁"];
function courseGroups(){ return store().settings.courseGroups || DEFAULT_COURSE_GROUPS; }

function openWizard(date){
  WZ = {
    step:0, source:null, sourceDetail:"",
    calMonth:(date||view.date).slice(0,7),
    date:date||view.date, time:null,
    people:null, infants:0, chairs:0, customPeople:false, phoneNone:false,
    menuType:null, courses:{}, courseOpen:false,
    seat:null,              /* 룸 id | 'hall-any' | 'room-any' | 'any' */
    name:"", phone:"", allergy:"", request:"",
    done:null               /* 등록 완료 후 확인 메시지용 */
  };
  render();
}
async function closeWizard(){
  if(WZ && !WZ.done && (WZ.name || WZ.time)){
    if(!await uiConfirm2("입력 중인 예약이 있습니다. 닫을까요?")) return;
  }
  WZ = null; render();
}
async function wzGo(n){
  wzSyncInputs();                       /* 먼저 입력값을 상태로 옮긴 뒤 */
  if(n > WZ.step && !wzCanNext()) return; /* 통과 여부를 검사 */
  /* 마지막 예약 가능 시각을 넘겼는지 확인 */
  if(n===2 && WZ.time){
    const reason = wzWarnReason();
    if(reason){
      const dh = hoursFor(WZ.date);
      const ok = await uiConfirm(reason,
        `${dateLabel(WZ.date)} ${hm(WZ.time)}\n` +
        (dh.closed ? "" : `영업 ${dh.open}–${dh.close}${dh.bs?` · 브레이크 ${dh.bs}–${dh.be}`:""}${dh.lo?` · 라스트오더 ${dh.lo}`:""}\n`) +
        `\n손님께 안내하신 뒤 진행하세요.`,
        {ok:"안내했습니다", cancel:"시간 다시 고르기"});
      if(!ok) return;
    }
  }
  WZ.step = Math.max(0, Math.min(LAST_STEP, n));
  render();
  /* 단계를 옮길 때만 맨 위로 */
  const mid = document.querySelector(".wz-mid");
  if(mid) mid.scrollTop = 0;
}
/* 다음으로 넘어갈 수 있는지 검사 */
function wzCanNext(){
  if(WZ.step===0) return !!WZ.source;
  if(WZ.step===1) return !!(WZ.date && WZ.time);
  if(WZ.step===2) return WZ.people>0;
  if(WZ.step===3) return !!WZ.seat;
  if(WZ.step===4) return !!WZ.menuType;
  /* 한 글자라도 들어가면 됩니다 — 가명·이니셜·외국 이름도 받습니다 */
  if(WZ.step===5) return WZ.name.trim().length>0 &&
    (WZ.phoneNone || WZ.phone.trim().length>0);
  /* 알러지는 확인했다는 표시가 있어야 넘어갑니다 */
  if(WZ.step===6) return WZ.allergyNone || (WZ.allergy||"").trim().length>0;
  return true;
}
