/* 이 날짜·시각에 예약을 잡으면 생기는 문제 (없으면 빈 문자열) */
function timeWarn(date, time){
  const dh = hoursFor(date);
  if(dh.closed) return `휴무일입니다 (${dh.note||""})`;
  if(inBreak(date, time)) return `브레이크타임(${dh.bs}–${dh.be})입니다`;
  if(toMin(time) < toMin(dh.open) || toMin(time) >= toMin(dh.close)) return "영업시간이 아닙니다";
  if(toMin(time) > lastBookMin(date)) return `라스트오더(${dh.lo||minToHM(lastBookMin(date))})를 넘겼습니다`;
  const stx = store().settings;
  const end = toMin(time) + stayMinAt(time);
  if(dh.bs && toMin(time) < toMin(dh.bs)){
    if((stx.breakMode||"leave")==="leave"){
      if(end > toMin(dh.bs)) return "식사 중 브레이크타임이 시작됩니다";
    }else{
      /* 음식 주문만 중단 — 브레이크 직전 입장은 주문 시간이 모자랍니다 */
      const buf = stx.breakEntryBuffer != null ? stx.breakEntryBuffer : 60;
      if(toMin(time) > toMin(dh.bs) - buf)
        return `브레이크 ${buf}분 전 이후 입장입니다`;
    }
  }
  if(end > toMin(dh.close)) return "식사 시간이 마감을 넘깁니다";
  return "";
}
function shortWarn(msg){
  if(msg.includes("브레이크")) return "브레이크 걸림";
  if(msg.includes("라스트오더")) return "LO 지남";
  if(msg.includes("마감")) return "마감 넘김";
  if(msg.includes("영업시간")) return "영업 외";
  if(msg.includes("휴무")) return "휴무";
  return "확인";
}

/* 지금 단계에서 걸리는 문제 — 있으면 '다음' 버튼이 빨갛게 바뀝니다 */
function wzWarnReason(){
  const st = store().settings;
  if(WZ.step===1 && WZ.time){
    if(WZ.date < todayStr()) return "이미 지난 날짜입니다";
    const w = timeWarn(WZ.date, WZ.time);
    if(w) return w;
  }
  if(WZ.step===3 && WZ.seat){
    const room = st.rooms.find(x=>x.id===WZ.seat);
    if(room && room.type==="room"){
      const rs = roomStatus(WZ.date, WZ.time, WZ.seat);
      if(rs.state==="blocked") return "다른 예약과 1시간 안에 겹칩니다";
      if(rs.state==="warn") return "다른 예약과 체류 시간이 겹칩니다";
      const adults = adultCount(WZ.people, WZ.infants);
      if(WZ.people > room.capacity) return `정원(${room.capacity}명)을 넘습니다`;
      if(adults < roomMin(room)) return `최소 인원(${roomMin(room)}명)에 못 미칩니다`;
    }
    if(room && room.type==="hall"){
      const h = hallStatus(WZ.date, WZ.time, WZ.seat);
      if(!hallFits(h, WZ.people)) return "홀에 남은 자리가 부족합니다";
    }
  }
  if(WZ.step===2 && WZ.people && (WZ.infants||0) >= WZ.people) return "성인 없이 유아만 있습니다";
  if(WZ.step===5 && WZ.phone && !WZ.phoneNone && WZ.phone.replace(/\D/g,"").length < 9)
    return "전화번호 자릿수가 모자랍니다";
  if(WZ.step===4){
    const seat = st.rooms.find(x=>x.id===WZ.seat);
    if(seat && seat.type==="room"){
      const adults = adultCount(WZ.people, WZ.infants);
      const n = courseCount();
      if(WZ.menuType==="해당 없음") return "룸인데 코스 주문이 아닙니다";
      if(WZ.menuType==="확인 필요") return "룸 코스가 아직 확정되지 않았습니다";
      if(WZ.menuType==="코스" && !WZ.courseUndecided && n>0 && n<adults)
        return `코스 ${n}인분이 성인 ${adults}명보다 적습니다`;
    }
  }
  if(WZ.step===6 && (WZ.chairs||0) > (WZ.infants||0)) return "유아용 의자가 유아 수보다 많습니다";
  return "";
}

/* 상단에 지금까지 고른 값 요약 */
function wzSummary(){
  const p=[];
  if(WZ.source) p.push(WZ.source==="기타" && WZ.sourceDetail ? WZ.sourceDetail : WZ.source);
  if(WZ.date && WZ.time) p.push(`${(+WZ.date.slice(5,7))}/${(+WZ.date.slice(8))} ${hm(WZ.time)}`);
  if(WZ.people) p.push(`${WZ.people}명${WZ.infants?`(유아${WZ.infants})`:""}`);
  if(WZ.seat) p.push(seatLabel(WZ.seat));
  return p.map(x=>`<span>${esc(x)}</span>`).join("");
}
function hm(t){
  const [h,m]=t.split(":").map(Number);
  const ap = h<12?"오전":"오후";
  const h12 = h%12===0?12:h%12;
  return `${ap} ${h12}시${m?` ${m}분`:""}`;
}
function seatLabel(seat){
  const st = store().settings;
  if(seat==="any") return "좌석 상관없음";
  if(seat==="hall-any") return "홀 중 아무곳";
  if(seat==="room-any") return "룸 중 아무곳";
  const r = st.rooms.find(x=>x.id===seat);
  if(!r) return "미배정";
  /* 룸은 이름 뒤에 '룸'을 붙여 직원이 좌석 종류를 바로 알 수 있게 (홀은 이름에 이미 포함) */
  return r.type==="room" ? `${r.name} 룸` : r.name;
}

/* ---------- 1단계: 날짜 + 시간 ---------- */
function wzStepDate(){
  const s = store(), st = s.settings;
  const [y,m] = WZ.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1), lastDay = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const today = todayStr();

  let cells = "";
  for(let i=0;i<lead;i++) cells += `<span class="bday"></span>`;
  for(let d=1; d<=lastDay; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    const list = s.reservations.filter(r=>r.date===ds && r.status==="확정");
    const dow = new Date(ds+"T00:00:00").getDay();
    const cls = ["bday","btn-day", WZ.date===ds?"sel":"", ds===today?"today":"",
                 ds<today?"past":"", dow===0?"sun":dow===6?"sat":""].join(" ");
    cells += `<button class="${cls}" onclick="wzPickDate('${ds}')">
        <span class="d">${d}</span>
        ${list.length?`<span class="b">${list.length}건</span>`:""}
      </button>`;
  }

  /* 영업시간 안에서 시각 후보 생성 */
  const dh = hoursFor(WZ.date);
  const oh = parseInt(dh.open.split(":")[0]), ch = Math.ceil(toMin(dh.close)/60);
  const hours = [];
  for(let h=oh; h<ch; h++) hours.push(h);
  const curH = WZ.time ? parseInt(WZ.time.split(":")[0]) : null;
  const curM = WZ.time ? parseInt(WZ.time.split(":")[1]) : 0;

  const lastBook = lastBookMin(WZ.date);
  const isToday = WZ.date===todayStr();
  const isPastDate = WZ.date < todayStr();
  const nowM = toMin(nowHM());
  const hourCells = hours.map(h=>{
    const n = s.reservations.filter(r=>r.date===WZ.date && r.status==="확정" && parseInt(r.time)===h).length;
    const late = h*60 > lastBook;
    /* 이 시각을 고르면 경고가 생기는지 미리 확인합니다 */
    const probe = timeWarn(WZ.date, pad(h)+":00");
    /* 지난 시각도 누를 수는 있게 — 예약 누락을 나중에 입력하는 경우가 있습니다 */
    const gone = isPastDate || (isToday && (h+1)*60 <= nowM);
    /* 브레이크타임에 걸리는 시각은 따로 표시 */
    const brk = dh.bs && dh.be && h*60 >= toMin(dh.bs) && h*60 < toMin(dh.be);
    const bad = !!probe;
    return `<button class="hcell ${curH===h?'on':''} ${bad?'late warned':''} ${gone?'gone':''}" onclick="wzPickHour(${h})">
      <span class="ap">${h<12?"오전":"오후"}</span>
      <span class="hh">${h%12===0?12:h%12}시</span>
      ${brk?`<span class="hn rust">브레이크</span>`
           :bad?`<span class="hn rust">${esc(shortWarn(probe))}</span>`
           :gone?`<span class="hn muted2">지난 시간</span>`
           :(n?`<span class="hn">${n}건</span>`:"")}
    </button>`;
  }).join("");

  const minuteRail = curH===null ? "" : `
    <div class="mwrap">
      <div class="mhead"><span class="lbl">분 단위 조절</span><span class="mnow">${hm(WZ.time)}</span></div>
      <div class="mrail" id="mrail">
        <div class="mtrack"></div>
        <div class="mfill" style="width:${(curM/55)*100}%"></div>
        ${[0,5,10,15,20,25,30,35,40,45,50,55].map(v=>
          `<span class="mnotch ${v%10===0?'big':''}" style="left:${(v/55)*100}%"></span>`).join("")}
        <div class="mknob" style="left:${(curM/55)*100}%">${pad(curM)}</div>
        ${[0,10,20,30,40,50].map(v=>
          `<button class="mtick ${curM===v?'on':''}" style="left:${(v/55)*100}%" onclick="wzPickMin(${v})">${pad(v)}</button>`).join("")}
      </div>
      <div class="mfine">
        <button ${curM<=0?"disabled":""} onclick="wzNudge(-5)">− 5분</button>
        <button ${curM>=55?"disabled":""} onclick="wzNudge(5)">＋ 5분</button>
      </div>
      <div class="f-note" style="margin-top:6px">시(時)는 위에서 선택하세요. 분은 0~55분까지 조절됩니다.</div>
    </div>`;

  return `
    <div class="wz-step1">
    <div class="wz-cal">
      <div class="mo-h">
        <button class="nav" onclick="wzMonth(-1)" aria-label="이전 달">◀</button>
        <div class="mo">${y}년 ${m}월</div>
        <button class="nav" onclick="wzMonth(1)" aria-label="다음 달">▶</button>
      </div>
      <div class="bgrid bhead">${["일","월","화","수","목","금","토"].map((x,i)=>`<span class="${i===0?'sun':i===6?'sat':''}">${x}</span>`).join("")}</div>
      <div class="bgrid">${cells}</div>
    </div>
    <div class="wz-time">
      ${dh.closed?`<div class="warnbar">${dateLabel(WZ.date)}은 휴무일입니다 (${esc(dh.note||"")}). 그래도 접수하려면 시간을 선택하세요.</div>`:""}
      ${isPastDate?`<div class="warnbar">이미 지난 날짜입니다 — ${dateLabel(WZ.date)}. 누락된 예약을 입력하는 경우가 아니라면 날짜를 다시 확인하세요.</div>`:""}
      <div class="hours-line">${dh.closed?"휴무":`영업 ${esc(dh.open)}–${esc(dh.close)}${dh.bs?` · 브레이크 ${esc(dh.bs)}–${esc(dh.be)}`:""}${dh.lo?` · 라스트오더 ${esc(dh.lo)}`:""}`}</div>
      <div class="lbl" style="margin-bottom:8px">${WZ.date?dateLabel(WZ.date):"날짜를 먼저 선택하세요"} · 시간 선택</div>
      <div class="hgrid">${hourCells}</div>
      ${minuteRail}
    </div>
    </div>`;
}
function wzPickDate(d){ WZ.date=d; render(); }
function wzMonth(n){
  const [y,m]=WZ.calMonth.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  WZ.calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1);
  render();
}
function wzPickHour(h){
  const cur = WZ.time ? parseInt(WZ.time.split(":")[1]) : 0;
  WZ.time = pad(h)+":"+pad(cur); render();
}
function wzPickMin(m){
  const h = WZ.time ? parseInt(WZ.time.split(":")[0]) : 18;
  WZ.time = pad(h)+":"+pad(m); render();
}
function wzNudge(d){
  if(!WZ.time) return;
  const [h,m]=WZ.time.split(":").map(Number);
  /* 분만 조절 — 시(時)는 위 타일에서 바꾸도록 0~55분으로 묶습니다 */
  const next = Math.min(55, Math.max(0, m + d));
  if(next===m) return;
  WZ.time = pad(h)+":"+pad(next); render();
}
/* 분 레일을 손가락으로 끌어서 조절 */
function wzRefreshNext(){
  const b = document.getElementById("wz-next");
  if(!b) return;
  const ok = wzCanNext();
  b.disabled = !ok;
  b.classList.toggle("off", !ok);
  /* 경고 문구도 함께 갱신 */
  const warn = wzWarnReason();
  b.classList.toggle("warned", !!warn);
  const bar = document.getElementById("wz-warn");
  if(bar){ bar.textContent = warn; bar.style.display = warn ? "" : "none"; }
}
function afterRender(){
  /* 타임라인은 좁은 화면에서 가로로 스크롤됩니다 — 현재 시각이 보이도록 맞춰 둡니다 */
  const tls = document.getElementById("tl-scroll");
  if(tls && tls.scrollWidth > tls.clientWidth){
    const line = tls.querySelector(".nowline");
    if(line){
      const x = line.offsetLeft - tls.clientWidth*0.35;
      tls.scrollLeft = Math.max(0, x);
    }
  }
  /* 예약자 이름·전화는 글자를 칠 때마다 상태에 반영해서 '다음' 버튼을 바로 켬 */
  /* 성함·전화 어느 쪽을 먼저 쳐도 '다음' 상태가 바로 갱신되게 합니다.
     자동 포커스는 아직 아무것도 입력하지 않았을 때만 겁니다. */
  const nameEl = document.getElementById("wz-name");
  const phoneEl = document.getElementById("wz-phone");
  if(nameEl){
    nameEl.oninput = ()=>{ WZ.name = nameEl.value; wzRefreshNext(); };
    if(!nameEl.value && !(WZ && WZ.phone)) setTimeout(()=>{
      if(document.activeElement === document.body) nameEl.focus();
    }, 60);
  }
  if(phoneEl){
    phoneEl.oninput = ()=>{ fmtPhone(phoneEl); wzRefreshNext(); };
  }

  const rail = document.getElementById("mrail");
  if(!rail) return;
  const set = (e)=>{
    const r = rail.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    const v = Math.min(55, Math.max(0, Math.round((x/r.width)*55/5)*5));   /* 5분 단위, 0~55분 */
    const h = WZ.time ? parseInt(WZ.time.split(":")[0]) : 18;
    const nt = pad(h)+":"+pad(v);
    if(nt!==WZ.time){ WZ.time = nt; render(); }
  };
  rail.addEventListener("pointerdown", e=>{
    if(e.target.tagName==="BUTTON") return;   /* 눈금 버튼은 따로 처리 */
    rail.setPointerCapture(e.pointerId); set(e);
    const mv = ev=>set(ev);
    const up = ()=>{ rail.removeEventListener("pointermove",mv); rail.removeEventListener("pointerup",up); };
    rail.addEventListener("pointermove",mv); rail.addEventListener("pointerup",up);
  });
}

  WZ.chairs = WZ.infants;         /* 유아 수를 의자 기본값으로 */
  render();
}
function wzCustom(){ WZ.customPeople=true; if(!WZ.people) WZ.people=7; render(); }
function wzAdj(k,d){
  /* 막지 않습니다 — 이상한 값은 빨갛게 보여 주고 사장이 판단합니다 */
  if(k==="infants"){
    WZ.infants = Math.max(0,(WZ.infants||0)+d);
    WZ.chairs = WZ.infants;
  }else{
    WZ.people = Math.max(1,(WZ.people||0)+d);
    /* 직접 입력 상태는 유지합니다 — 1명까지 내려도 됩니다 */
  }
  render();
}

/* ---------- 3단계: 좌석 ---------- */
function wzStepSeat(){
  const s=store(), st=s.settings;
  const total = WZ.people||0;
  const adults = adultCount(total, WZ.infants);
  const need = tablesFor(total);

  /* 홀 — 테이블 단위 가동률 */
  const hallCell = (r)=>{
    const h = hallStatus(WZ.date, WZ.time, r.id);
    const fits = hallFits(h, total);
    const plan = hallPlan(h, total);
    const pct = h.total ? Math.round((h.used+h.tentUsed)/h.total*100) : 0;
    const blocked = isBlocked(r);
    return `<button class="scell hall ${WZ.seat===r.id?'on':''} ${(fits&&!blocked)?'':'full warned'}" onclick="wzSeat('${r.id}')">
      <span class="sn">${esc(r.name)}${blocked?` <span class="sb rust">사용 중지</span>`:""}</span>
      <span class="gauge"><i style="width:${Math.min(100,pct)}%"></i></span>
      <span class="sc">${h.total}테이블 중 <b>${h.used+h.tentUsed}</b> 사용 · 남은 ${h.left}</span>
      <span class="sc2">${plan?`${total}명 → ${plan}`:`${total}명 앉힐 자리 없음`}</span>
      ${!fits?`<span class="sb rust">자리 부족</span>`:""}
    </button>`;
  };

  /* 룸 — 이용 가능 / 이용 불가만 표시, 상세는 눌렀을 때 */
  const roomCell = (r)=>{
    const rs = roomStatus(WZ.date, WZ.time, r.id);
    const over = total > r.capacity, under = adults < roomMin(r);
    const label = rs.state==="free" ? (over?"인원 초과":under?"인원 부족":"이용 가능") : "이용 불가";
    const cls = rs.state!=="free" ? rs.state : (over||under ? "warn" : "free");
    const mv = rs.movable && rs.movable.length;
    const blocked = isBlocked(r);
    const bad = blocked || rs.state!=="free" || over || under;
    return `<button class="scell ${WZ.seat===r.id?'on':''} ${bad?'warned':''} ${(rs.state!=='free'||blocked)?'busy':''}" onclick="wzSeat('${r.id}')">
      <span class="sn">${esc(r.name)}</span>
      <span class="sc">${roomMin(r)}인~${r.capacity}인</span>
      <span class="avail ${blocked?'blocked':cls}">${blocked?"사용 중지":label}</span>
      ${mv?`<span class="movable">미정 ${mv}건 이동 가능</span>`:""}
    </button>`;
  };

  const halls = st.rooms.filter(r=>r.type==="hall");
  const rooms = st.rooms.filter(r=>r.type==="room");

  return `
    <div class="seat-note">
      ${WZ.time?`<b>${hm(WZ.time)}</b> 기준 · 체류 ${st.stayHours||3}시간으로 계산`:"시간을 먼저 선택하세요"}
    </div>
    ${halls.length?`<div class="lbl">홀</div><div class="sgrid hall">${halls.map(hallCell).join("")}</div>`:""}
    <div class="lbl" style="margin-top:16px">룸</div>
    <div class="sgrid">${rooms.map(roomCell).join("")}</div>
    <div class="lbl" style="margin-top:18px">정하지 않고 접수</div>
    <div class="sgrid any">
      <button class="scell any ${WZ.seat==='hall-any'?'on':''}" onclick="wzSeat('hall-any')"><span class="sn">홀 중 상관없음</span></button>
      <button class="scell any ${WZ.seat==='room-any'?'on':''}" onclick="wzSeat('room-any')"><span class="sn">룸 중 상관없음</span></button>
      <button class="scell any ${WZ.seat==='any'?'on':''}" onclick="wzSeat('any')"><span class="sn">상관없음</span></button>
    </div>
    <p class="wz-note">‘이용 불가’ 룸도 눌러 보면 어떤 예약이 걸려 있는지 확인하고 사장 판단으로 배정할 수 있습니다.
       다만 앞뒤 1시간 안에 다른 예약이 있으면 배정되지 않습니다.</p>`;
}
function wzChair(d){ WZ.chairs = Math.max(0,(WZ.chairs||0)+d); render(); }

/* 좌석 선택 — 막을 것은 막고, 판단이 필요한 것은 물어봅니다 */
async function wzSeat(v){
  const st = store().settings;
  const people = WZ.people||0;

  if(!["any","hall-any","room-any"].includes(v)){
    const room = st.rooms.find(x=>x.id===v);
    if(!room) return;

    if(isBlocked(room)){
      const ok = await uiConfirm(`${room.name}은 지금 사용 중지 상태입니다`,
        `${room.blockNote||"사용 중지"}\n\n그래도 이 자리로 배정할까요?`,
        {ok:"그래도 배정", cancel:"다시 고르기"});
      if(!ok) return;
    }

    if(room.type==="room"){
      const rs = roomStatus(WZ.date, WZ.time, v);
      /* 1) 확정 예약과 1시간 미만 → 배정 불가 */
      if(rs.state==="blocked"){
        const lines = rs.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)}`).join("\n");
        await uiAlert2(`${room.name} 룸은 배정할 수 없습니다.\n앞뒤 1시간 안에 예약이 있습니다.\n\n${lines}`);
        return;
      }
      /* 2) 체류시간 겹침 / 잠정 배정 → 확인 */
      if(rs.state==="warn"){
        const a = rs.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)}`);
        const b = rs.tentative.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)} (좌석 미정 · 잠정 배정)`);
        if(!await uiConfirm2(`${room.name} 룸에 겹치는 예약이 있습니다.\n\n${[...a,...b].join("\n")}\n\n그래도 이 룸으로 배정할까요?`)) return;
      }
      /* 3) 정원 초과 */
      if(people > room.capacity){
        if(!await uiConfirm2(`${room.name} 룸은 최대 ${room.capacity}명입니다. 지금 ${people}명입니다.\n간이 의자 등으로 감당 가능한 경우에만 배정하세요.\n\n그래도 배정할까요?`)) return;
      }
      /* 4) 최소 인원 미달 (설정에 따라 성인 기준) */
      else {
        const adults = adultCount(people, WZ.infants);
        if(adults < roomMin(room)){
          const basis = store().settings.minCountAdultsOnly===false ? "총 인원" : "성인";
          const ok = await uiConfirm(`${room.name} 룸 최소 인원 미달`,
            `이 방은 최소 ${roomMin(room)}명부터 받습니다.\n지금 ${basis} ${adults}명입니다${WZ.infants?` (유아 ${WZ.infants}명 제외)`:""}.`,
            {ok:"그래도 배정", cancel:"다시 고르기"});
          if(!ok) return;
        }
      }
    }

    if(room.type==="hall"){
      const h = hallStatus(WZ.date, WZ.time, v);
      const need = tablesFor(people);
      if(!hallFits(h, people)){
        const a = h.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)} (테이블 ${tablesFor(pplOf(r))})`);
        const b = h.tentative.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)} (좌석 미정 · 잠정)`);
        const why = `남은 테이블 ${h.left}개로는 ${people}명을 앉힐 수 없습니다.`;
        if(!await uiConfirm2(`${room.name} — ${why}\n\n${[...a,...b].join("\n")}\n\n그래도 이 홀로 배정할까요?`)) return;
      }
    }
  }else{
    /* 좌석 미정 — 잠정 배정 가능 여부를 먼저 확인 */
    const sug = suggestSeat(WZ.date, WZ.time, people, v);
    if(!sug){
      if(!await uiConfirm2(`지금 ${hm(WZ.time)} 기준으로 ${people}명이 들어갈 빈 자리가 없습니다.\n먼저 접수한 좌석 미정 예약까지 계산한 결과입니다.\n\n그래도 예약을 받을까요? (좌석은 나중에 조정해야 합니다)`)) return;
    }
    WZ.tentative = sug;
  }
  WZ.seat = v; render();
}

/* 숫자만 남기고 010-0000-0000 형태로 자동 정리 */
function fmtPhone(el){
  const d = el.value.replace(/\D/g,"").slice(0,11);
  let out = d;
  if(d.length>=4 && d.length<8) out = d.slice(0,3)+"-"+d.slice(3);
  else if(d.length>=8) out = d.slice(0,3)+"-"+d.slice(3,d.length-4)+"-"+d.slice(d.length-4);
  el.value = out; WZ.phone = out;
}

/* ---------- 5단계: 메뉴 ---------- */
/* 코스 선택 팝업은 마법사(WZ)와 예약 수정 시트(tmpRes) 두 곳에서 씁니다.
   어느 쪽 값을 고치는지 여기서 한 번만 정해 둡니다 — 함수를 두 벌 만들지 않으려고. */
function cTgt(){ return WZ ? WZ : tmpRes; }
/* 시트에서 쓸 때는 화면을 다시 그리기 전에 입력창 값을 옮겨 담아야 타이핑이 날아가지 않습니다 */
function cSync(){ if(!WZ && tmpRes) syncRes(); }
function courseCount(){
  const t = cTgt();
  return t ? Object.values(t.courses||{}).reduce((a,b)=>a+b,0) : 0;
}
function courseSummary(courses){
  const items = Object.entries(courses||{}).filter(([k,v])=>v>0)
    .map(([k,v])=>`${k.split("|")[1]}${v>1?`×${v}`:""}`);
  return items.join(", ");
}
function wzStepMenu(){
  const st = store().settings;
  const seat = st.rooms.find(x=>x.id===WZ.seat);
  const isHall = seat ? seat.type==="hall" : (WZ.seat==="hall-any");
  /* 홀은 보통 메뉴를 정하지 않고 받습니다 — 선택지를 줄입니다 */
  const opts = isHall
    ? [["코스","코스","코스 구성을 선택합니다"],
       ["해당 없음","해당 없음","일반 주문"]]
    : [["코스","코스","코스 구성을 선택합니다"],
       ["코스 상당","코스 상당 식사","코스에 준하는 주문"],
       ["확인 필요","확인 필요","코스인지도 미정"],
       ["해당 없음","해당 없음","일반 주문"]];
  const n = courseCount();
  const adults = adultCount(WZ.people, WZ.infants);
  const isRoom = seat && seat.type==="room";
  /* 룸은 코스 주문을 전제로 받는 자리입니다 */
  const roomWarn = isRoom && (
    WZ.menuType==="해당 없음" ? "룸은 보통 코스 손님을 받습니다" :
    WZ.menuType==="확인 필요" ? "방문 전 코스를 확정해야 합니다" :
    (WZ.menuType==="코스" && !WZ.courseUndecided && n>0 && n<adults)
      ? `코스 ${n}인분 · 성인 ${adults}명보다 적습니다` : "");
  return `
    ${roomWarn?`<div class="menu-warn">${esc(roomWarn)}</div>`:""}
    <div class="srcgrid menu4 ${opts.length===2?'menu2':''}">
      ${opts.map(([v,label,desc])=>`
        <button class="srccell ${WZ.menuType===v?'on':''} ${WZ.menuType===v&&roomWarn?'warned':''}" onclick="wzMenu('${v}')">
          <span class="s-l">${label}</span>
          <span class="s-d">${desc}</span>
          ${v==="코스"&&n?`<span class="s-n">${n}</span>`:""}
        </button>`).join("")}
    </div>
    ${WZ.menuType==="코스"?`
      <div class="course-sum">
        ${WZ.courseUndecided ? "코스 미정 — 방문 전 확정" : (n?`선택: ${esc(courseSummary(WZ.courses))}`:"코스 구성을 선택하세요")}
        <button class="btn sm" style="margin-left:auto" onclick="openCourse()">${n||WZ.courseUndecided?"수정":"선택"}</button>
      </div>`:""}
    ${WZ.courseOpen?renderCourse():""}`;
}
function wzMenu(v){
  WZ.menuType = v;
  if(v==="코스"){ WZ.courseOpen = true; }
  else { WZ.courses = {}; WZ.courseOpen = false; }
  render();
}
function openCourse(){ cSync(); const t=cTgt(); if(t) t.courseOpen = true; render(); }
function closeCourse(){ cSync(); const t=cTgt(); if(t) t.courseOpen = false; render(); }
function bumpCourse(key){
  cSync(); const t=cTgt(); if(!t) return;
  t.courses = {...t.courses, [key]:((t.courses||{})[key]||0)+1};
  render();
}
function resetCourse(){ cSync(); const t=cTgt(); if(!t) return; t.courses = {}; t.courseUndecided = false; render(); }
function toggleUndecided(){
  cSync(); const t=cTgt(); if(!t) return;
  t.courseUndecided = !t.courseUndecided;
  if(t.courseUndecided) t.courses = {};
  render();
}
function renderCourse(){
  const gs = courseGroups();
  const stx = store().settings;
  const W = cTgt();
  const lunch = W.time && toMin(W.time) < toMin(stx.lunchUntil||"16:00");
  const dow = W.date ? new Date(W.date+"T00:00:00").getDay() : 0;
  /* 공휴일을 주말로 볼지는 설정에서 정합니다 */
  const weekend = dow===0 || dow===6 || (stx.holidayAsWeekend!==false && isHoliday(W.date));
  const fits = (g)=>{
    const w = g.when||[];
    if(!w.length || w.includes("종일")) return true;
    const key = (weekend?"주말":"평일") + (lunch?"점심":"저녁");
    return w.includes(key);
  };
  const rows = gs.map((g,gi)=>`
    <div class="cgroup ${fits(g)?'':'off'}">
      <div class="cg-label">${esc(g.label)}${fits(g)?'':' <span class="cg-off">이 시간대 아님 · 선택은 가능</span>'}</div>
      <div class="cg-items">
        ${g.items.map(name=>{
          const key = `${gi}|${name}`;
          const c = W.courses[key]||0;
          const off = !fits(g);
          return `<button class="citem ${c?'on':''} ${off&&c?'warned':''}" onclick="bumpCourse('${key}')">
            ${esc(name)}${c?`<i class="cnum">${c}</i>`:""}</button>`;
        }).join("")}
      </div>
    </div>`).join("");
  return `
    <div class="overlay" onclick="closeCourse()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-h"><h2>코스 선택</h2>
          <button class="x" onclick="closeCourse()" aria-label="닫기">×</button></div>
        <p class="f-note" style="margin:-6px 0 14px">한 번 누를 때마다 인원이 하나씩 늘어납니다. 여러 코스를 섞어도 됩니다.</p>
        ${rows}
        <button class="undecided ${W.courseUndecided?'on':''}" onclick="toggleUndecided()">
          코스 미정 — 코스는 하지만 아직 못 정함
        </button>
        ${(()=>{
          const n = courseCount(), ad = adultCount(W.people, W.infants);
          const short = n>0 && n<ad;
          return `<div class="course-total ${short?'bad':''}">선택 합계 <b>${n}</b>명
            ${W.people?` / 성인 ${ad}명${W.infants?` (총 ${W.people}명 중 유아 ${W.infants}명)`:""}`:""}
            ${short?`<div class="ct-warn">성인 ${ad}명보다 ${ad-n}명 적습니다</div>`:""}</div>`;
        })()}
        <div class="sheet-actions">
          <button class="btn danger" onclick="resetCourse()">초기화</button>
          <button class="btn primary" onclick="closeCourse()">완료</button>
        </div>
      </div>
    </div>`;
}

/* ---------- 등록 ---------- */
async function wzSubmit(){
  wzSyncInputs();
  if(!WZ.date || !WZ.time) return await uiAlert2("날짜와 시간을 선택하세요.");
  if(!WZ.people) return await uiAlert2("인원을 선택하세요.");
  if(!WZ.name.trim()) return await uiAlert2("예약자 성함을 입력하세요.");
  const s = store();
  /* 같은 번호로 같은 날 이미 예약이 있으면 확인 */
  if(WZ.phone){
    const dup = s.reservations.filter(r=>r.date===WZ.date && r.status==="확정" &&
      (r.phone||"").replace(/\D/g,"") === WZ.phone.replace(/\D/g,""));
    if(dup.length){
      const ok = await uiConfirm("같은 번호로 이미 예약이 있습니다",
        dup.map(r=>`${hm(r.time)} ${r.name} 손님 ${pplText(r)}`).join("\n") +
        "\n\n같은 팀이라면 기존 예약을 수정하는 편이 좋습니다.",
        {ok:"새로 등록", cancel:"취소"});
      if(!ok) return;
    }
  }
  /* 노쇼 이력이 있으면 확정 전에 확인 */
  const ns = noshowOf(WZ.phone);
  if(ns && !await uiConfirm2(
      `이 번호로 노쇼 기록이 ${ns.count}건 있습니다.\n` +
      `(${ns.dates.slice(0,3).map(d=>d.slice(5).replace("-","월 ")+"일").join(", ")}${ns.dates.length>3?" 외":""})\n\n` +
      `예약을 확정할까요?`)) return;
  const isRoom = WZ.seat && !["any","hall-any","room-any"].includes(WZ.seat);
  const rec = {
    id:"res_"+Date.now(), date:WZ.date, time:WZ.time,
    name:WZ.name.trim(), phone:WZ.phone.trim(),
    people:WZ.people, infants:WZ.infants, chairs:WZ.chairs||0,
    roomId: isRoom ? WZ.seat : null,
    seatPref: isRoom ? null : WZ.seat,     /* 미배정일 때 희망 좌석 종류를 기억 */
    tentativeRoomId: isRoom ? null : (WZ.tentative || null),  /* 나중에 확정할 때 1순위로 뜨는 자리 */
    source:WZ.source||"전화",
    sourceDetail:WZ.source==="기타" ? (WZ.sourceDetail||"").trim() : "",
    createdAt:new Date().toISOString(),
    menuType:WZ.menuType||"해당 없음", courses:{...(WZ.courses||{})},
    courseUndecided: !!WZ.courseUndecided,
    allergy:WZ.allergyNone?"":WZ.allergy.trim(), allergyChecked:true, request:WZ.request.trim(),
    status:"확정"
  };
  s.reservations.push(rec);
  logEvent("예약 등록", `${rec.date} ${rec.time} ${rec.name} ${pplOf(rec)}명 ${rec.roomId?seatLabel(rec.roomId):(rec.tentativeRoomId?"잠정 "+seatLabel(rec.tentativeRoomId):"미배정")} 경로:${rec.source}${rec.sourceDetail?"/"+rec.sourceDetail:""}`);
  reflowTentatives(rec.date);
  view.date = rec.date; view.tab = "res"; view.calMonth = rec.date.slice(0,7);
  WZ.done = rec;
  saveData(); render();
}
/* 등록 완료 화면 — 손님에게 그대로 읽어주면 되는 문장 */
function wzDone(){
  const r = WZ.done;
  const d = new Date(r.date+"T00:00:00");
  const dow = ["일","월","화","수","목","금","토"][d.getDay()];
  const [h,m] = r.time.split(":").map(Number);
  const ap = h<12?"오전":"오후", h12 = h%12===0?12:h%12;
  const seat = r.roomId ? seatLabel(r.roomId)
             : (r.tentativeRoomId ? `${seatLabel(r.tentativeRoomId)} (잠정)` : seatLabel(r.seatPref||"any"));
  return `
    <div class="wz done">
      <div class="done-box">
        <div class="check">✓</div>
        <p class="done-msg">
          <b>${d.getMonth()+1}월 ${d.getDate()}일 ${dow}요일, ${ap} ${h12}시</b>
          <b>${m}분</b>,
          <b>${esc(seat)}</b> 좌석,
          <b>${esc(r.name)}</b> 손님<br>예약 접수되었습니다.
        </p>
        <div class="done-sub">${pplText(r)}${r.phone?` · ${esc(r.phone)}`:""}
          ${r.menuType?`<br>식사: ${esc(r.menuType)}${r.courses&&Object.keys(r.courses).length?` (${esc(courseSummary(r.courses))})`:""}`:""}
          ${r.chairs?`<br>유아용 의자 ${r.chairs}개`:""}
          ${r.allergy?`<br>알러지: ${esc(r.allergy)}`:""}${r.request?`<br>요청: ${esc(r.request)}`:""}</div>
        <div class="done-btns">
          <button class="btn lg" onclick="openWizard('${r.date}')">추가 예약</button>
          <button class="btn primary lg" onclick="closeWizardDone()">확인</button>
        </div>
      </div>
    </div>`;
}
function closeWizardDone(){ WZ=null; render(); }



/* ============================================================
   디스플레이 모드 — TV에 띄우는 오늘의 예약 안내
   (F11 전체화면으로 사용. 손님이 직접 조작하지 않음)
   ============================================================ */
let dispTimer = null;
let bgTimer = null;
/* ============================================================
   주소로 화면 구분
     /            → 관리 화면 (PIN 필요)
     /screen      → 디스플레이 모드 (TV용, 바로 진입)
     /screen/hanok → 매장을 지정해서 진입
   서버 설정 없이도 되도록 #/screen 도 함께 지원합니다.
   ============================================================ */
function readRoute(){
  const path = (location.pathname || "").replace(/\/+$/,"");
  const hash = (location.hash || "").replace(/^#/,"").replace(/\/+$/,"");
  const raw = /screen/.test(hash) ? hash : path;
  const m = raw.match(/\/?screen(?:\/([a-z]+))?$/i);
  if(!m) return null;
  return {screen:true, store:(m[1]||"hanok").toLowerCase()};
}
function applyRoute(){
  const r = readRoute();
  if(r && DATA && DATA[r.store]){
    view.storeKey = r.store;
    view.display = true;
    view.fromRoute = true;      /* 주소로 바로 들어온 경우 */
    startDisplayTimers();
    return true;
  }
  return false;
}
/* 주소를 바꿔 둡니다 (파일로 열었을 때는 조용히 실패해도 괜찮습니다) */
function setRoute(toScreen){
  try{
    if(location.protocol === "file:"){
      location.hash = toScreen ? `/screen/${view.storeKey}` : "";
      return;
    }
    const base = location.pathname.replace(/\/screen(\/[a-z]+)?$/i, "").replace(/\/+$/,"");
    history.replaceState(null, "", toScreen ? `${base}/screen/${view.storeKey}` : (base || "/"));
  }catch(e){ /* 주소를 바꿀 수 없으면 그냥 둡니다 */ }
}
/* 배경 순환·자동 갱신 타이머 */
function startDisplayTimers(){
  view.bgIndex = view.bgIndex || 1;
  clearInterval(bgTimer); clearInterval(dispTimer);
  bgTimer = setInterval(()=>{
    if(!view.display) return;
    view.bgIndex = (view.bgIndex % 7) + 1;
    document.querySelectorAll(".tv-bg").forEach((el,i)=> el.classList.toggle("on", i+1===view.bgIndex));
  }, 12000);
  dispTimer = setInterval(()=>{
    if(!view.display) return;
    render();
    document.querySelectorAll(".tv-bg").forEach((el,i)=> el.classList.toggle("on", i+1===(view.bgIndex||1)));
  }, 60000);
}
function openDisplay(){
  logEvent("디스플레이 모드", "");
  view.display = true;
  view.fromRoute = false;
  setRoute(true);
  render();
  startDisplayTimers();
  setTimeout(()=>{ pokeExit(4000); }, 120);
  document.addEventListener("keydown", escDisplay);
}
function closeDisplay(){
  const wasRoute = view.fromRoute;
  view.display = false; view.fromRoute = false;
  setRoute(false);
  /* 주소로 바로 들어온 경우에는 관리 화면 대신 잠금 화면으로 */
  if(wasRoute && !AUTHED){ view.storeKey = null; }
  clearInterval(dispTimer); clearInterval(bgTimer);
  document.removeEventListener("keydown", escDisplay);
  render();
}
function escDisplay(e){ if(e.key==="Escape") closeDisplay(); }
/* 종료 버튼을 잠깐 보여줍니다 (터치 기기에는 호버가 없으므로) */
let exitTimer = null;
function pokeExit(ms){
  const el = document.querySelector(".tv-exit");
  if(!el) return;
  el.classList.add("show");
  clearTimeout(exitTimer);
  exitTimer = setTimeout(()=>el.classList.remove("show"), ms||5000);
}

/* 이름 가운데 글자를 * 로 가림 — 손님 이름이 TV에 그대로 노출되지 않도록 */
/* 디스플레이 모드에 쓸 좌석 배치 — 3행, 각 행 최대 6칸 */
const DISP_MAX = 6;
function displayRows(){
  const st = store().settings;
  const ids = st.rooms.map(r=>r.id);
  const saved = st.displayRows;
  if(saved && saved.length===3){
    /* 없어진 좌석은 빼고, 새로 생긴 좌석은 빈 칸이 있는 행에 넣습니다 */
    const rows = saved.map(row=>row.filter(id=>ids.includes(id)));
    const placed = new Set([].concat.apply([], rows));
    ids.filter(id=>!placed.has(id)).forEach(id=>{
      const row = rows.find(r=>r.length<DISP_MAX) || rows[2];
      row.push(id);
    });
    return rows;
  }
  /* 기본: 1행 홀, 2·3행 룸을 반씩 */
  const halls = st.rooms.filter(r=>r.type==="hall").map(r=>r.id);
  const rooms = st.rooms.filter(r=>r.type==="room").map(r=>r.id);
  const half = Math.ceil(rooms.length/2);
  return [halls, rooms.slice(0,half), rooms.slice(half)];
}
function maskName(n){
  const s = String(n||"").trim();
  if(s.length<=1) return s;
  if(s.length===2) return s[0]+"○";
  return s[0] + "○".repeat(s.length-2) + s[s.length-1];
}

function renderDisplay(){
  const s = store() || DATA.hanok;
  const st = s.settings, today = todayStr();
  const now = nowHM();
  /* 좌석이 배정된 예약만 표시 — 당일에는 미배정이 없도록 운영한다는 전제 */
  const list = s.reservations.filter(r=>r.date===today && (r.status==="확정"||r.status==="방문") && r.roomId);

  /* 설정에 정한 3행 배치대로 그립니다 */
  const rowIds = displayRows();
  const order = [].concat.apply([], rowIds).map(function(id){ return st.rooms.find(function(r){return r.id===id;}); }).filter(Boolean);
  const sec = order.map(room=>{
    const rows = list.filter(r=>r.roomId===room.id).sort((a,b)=>a.time.localeCompare(b.time));
    const items = rows.length ? rows.map(r=>{
      const past = r.time < now || r.status==="방문";
      return `<li class="${past?'past':''}">
        <span class="t">${esc(r.time)}</span>
        <span class="n">${esc(maskName(r.name))} 님</span>
        <span class="p">${pplOf(r)}명</span>
      </li>`;
    }).join("") : `<li class="none">예약 없음</li>`;
    /* 손님이 보는 화면이라 룸 정원만 안내하고 홀 테이블 수는 적지 않습니다 */
    const capTxt = room.type==="hall" ? "" : `${roomMin(room)}~${room.capacity}인`;
    return `<section class="dsec ${room.type==='hall'?'hall':''}">
      <h3><span class="fl">${esc(room.floor||"")}</span>
        <span class="nm">${esc(room.name)}</span>
        <span class="cap">${capTxt}</span></h3>
      <ul class="${room.type==="hall"?"two-col":""}">${items}</ul>
    </section>`;
  });

  let idx = 0;
  const rowsHtml = rowIds.map((ids,i)=>{
    const cells = ids.map(()=>sec[idx++]).filter(Boolean);
    return cells.length ? `<div class="tv-row ${i===0?"halls":""}">${cells.join("")}</div>` : "";
  });

  const d = new Date();
  const dateTxt = `${d.getMonth()+1}월 ${d.getDate()}일 ${["일","월","화","수","목","금","토"][d.getDay()]}요일`;

  /* tv-stage 안에 실제 화면(tv-inner)을 넣습니다.
     세로로 든 휴대폰에서는 stage 가 16:9 로 고정되고 inner 가 통째로 축소됩니다. */
  return `
  <div class="tv">
    <div class="tv-stage">
      <div class="tv-bgs" aria-hidden="true">
        ${[1,2,3,4,5,6,7].map(i=>`<div class="tv-bg b${i} ${i===(view.bgIndex||1)?'on':''}"></div>`).join("")}
      </div>
      <div class="tv-inner">
        <header class="tv-h">
          <div class="tv-date">${dateTxt}</div>
          <h1>오늘의 예약 안내</h1>
          <div class="tv-line"></div>
        </header>
        <div class="tv-grid">${rowsHtml.join("")}</div>
        <footer class="tv-f">찾아주셔서 감사합니다</footer>
      </div>
    </div>
    <div class="tv-hot" aria-hidden="true"></div>
    <div class="tv-tap" aria-hidden="true" onclick="pokeExit(5000)" ontouchstart="pokeExit(5000)"></div>
    <button class="tv-exit" onclick="closeDisplay()" title="Esc 로도 나갈 수 있습니다">디스플레이 종료</button>
    <div class="tv-small">
      <div class="ts-box">
        ${ICON.tv}
        <div class="ts-t">지원하지 않는 화면 크기입니다</div>
        <div class="ts-s">디스플레이 모드는 TV·모니터처럼<br>넓은 화면에서만 표시됩니다.</div>
        <button class="btn primary" onclick="closeDisplay()">돌아가기</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   예시 데이터 — 처음 실행할 때만 채웁니다 (설정에서 지울 수 있음)
   ============================================================ */
function seedDemo(d){
  const today = todayStr();
  const rooms = d.hanok.settings.rooms;
  const pick = function(n){ const r=rooms.find(function(x){return x.name===n;}); return r?r.id:null; };
  /* ---------- 예약 예시 ----------
     운영시간·룸 정원·코스 규칙을 지켜서 만듭니다 (경고 없는 정상 예약).
     요일별로 쓸 수 있는 시각만 골라 씁니다. */
  const ROOMS = [
    {n:"조조", min:2, max:4}, {n:"유비", min:2, max:4}, {n:"장비", min:2, max:4},
    {n:"관우", min:4, max:6}, {n:"공명", min:4, max:6}, {n:"주유", min:4, max:6},
    {n:"초선", min:6, max:8}, {n:"동탁", min:8, max:10}
  ];
  const HALLS = ["1층 홀","지하 홀"];
  /* 룸(체류 3h)·홀(2.5h) 모두 안전한 시각만 사용 */
  const SLOTS = {
    0: {lunch:["11:30","12:00","12:30","13:00"], dinner:["17:00","17:30"]},           /* 일 20:30 마감 */
    6: {lunch:["11:30","12:00","12:30","13:00"], dinner:["17:00","17:30","18:00","18:30","19:00"]},
    x: {lunch:["11:30","12:00","12:30","13:00"], dinner:["17:00","17:30","18:00","18:30","19:00"]}
  };
  /* 코스 구성 — 시간대에 맞는 줄에서 고릅니다 */
  const COURSE_BY = (lunch, weekend) =>
    lunch ? (weekend ? ["2|요리사","2|B","2|A"] : ["1|요리사","1|동한","1|서한"])
          : ["0|오","0|촉","0|한","0|위"];

  const names = ["김하람","이도현","박수빈","정우성","최유나","한서진","오지호","배소민",
                 "신태호","권나연","황준서","문가영","서동우","임하경","조성민","윤지완",
                 "남기범","홍세아","유정민","곽태영","심다혜","방준혁","노아린","전승우",
                 "박서준","이재아","조은결","최민서","윤소라","김도윤","정하늘","한지호"];
  const nsPool = ["010-3300-1188","010-9042-7761","010-8834-2205"];
  const nsNames = ["차민석","임세연","고은비"];

  let gi = 0;
  const mkRes = (ds, opt, used) => {
    const dow = new Date(ds+"T00:00:00").getDay();
    const weekend = dow===0 || dow===6;
    const slots = SLOTS[dow] || SLOTS.x;
    const lunch = opt.lunch;
    const time = (lunch ? slots.lunch : slots.dinner)[gi % (lunch?slots.lunch.length:slots.dinner.length)];
    const useRoom = opt.room;
    let people, roomName, courses = {}, menuType = "해당 없음", infants = 0;

    if(useRoom){
      /* 같은 시각에 이미 쓰는 룸은 건너뜁니다 */
      let rm = null;
      for(let i=0;i<ROOMS.length;i++){
        const cand = ROOMS[(gi*5 + i) % ROOMS.length];
        if(!used[time+"|"+cand.n]){ rm = cand; break; }
      }
      if(!rm) return null;                 /* 그 시각 룸이 다 찼으면 건너뜀 */
      used[time+"|"+rm.n] = true;
      roomName = rm.n;
      people = rm.min + ((gi*3) % (rm.max - rm.min + 1));
      if(gi % 11 === 0 && people >= rm.min + 2) infants = 1;   /* 유아가 있어도 성인이 최소 인원 이상 */
      const adults = people - infants;
      const pool = COURSE_BY(lunch, weekend);
      menuType = "코스";
      courses[pool[gi % pool.length]] = adults;                /* 코스 인원 = 성인 수 */
    }else{
      roomName = HALLS[gi % HALLS.length];
      people = [2,3,4,4,5,6,8][(gi*3) % 7];
      if(gi % 13 === 0 && people >= 3) infants = 1;
      menuType = "해당 없음";
    }
    return {
      id:"demo_"+(gi)+"_"+ds, date:ds, time,
      name: names[gi % names.length],
      phone:"010-"+pad(2000+((gi*37)%7999)).slice(0,4)+"-"+pad(1000+((gi*53)%8999)).slice(0,4),
      people, infants, chairs:infants,
      roomId: pick(roomName), seatPref:null, tentativeRoomId:null,
      source: gi%4===0 ? "네이버예약" : "전화", sourceDetail:"",
      createdAt: new Date(new Date(ds+"T00:00:00").getTime() - (3+(gi%9))*86400000).toISOString(),
      menuType, courses, courseUndecided:false,
      request: gi%17===0 ? "창가 자리 부탁드립니다" : "",
      allergy: gi%23===0 ? "땅콩 알러지" : "",
      status:"확정", demo:true
    };
  };

  const [yy] = today.split("-").map(Number);
  for(let mo=7; mo<=10; mo++){
    const lastDay = new Date(yy, mo, 0).getDate();
    for(let day=1; day<=lastDay; day++){
      const ds = `${yy}-${pad(mo)}-${pad(day)}`;
      if(mo===10 && day>12) continue;
      const dow = new Date(ds+"T00:00:00").getDay();
      let cnt = (dow===5||dow===6) ? 15 : (dow===0 ? 12 : 9);
      if(ds===today) cnt = 16;
      if(mo===10) cnt = Math.max(1, Math.round(cnt*0.45));
      const used = {};
      for(let k=0;k<cnt;k++,gi++){
        const rec = mkRes(ds, {lunch: k%2===0, room: k%5<3}, used);   /* 5건 중 3건은 룸, 2건은 홀 */
        if(!rec) continue;
        /* 지난 날짜는 대부분 방문, 가끔 노쇼·취소 (어제는 확정으로 남겨 자동 처리 확인) */
        if(ds < today && ds !== shiftDate(today,-1)){
          const rr = gi % 23;
          if(rr===0){
            rec.status = "노쇼";
            const ni = Math.floor(gi/7) % nsPool.length;   /* 세 사람에게 고르게 */
            rec.phone = nsPool[ni]; rec.name = nsNames[ni];
          }else if(rr===7){ rec.status = "취소"; }
          else rec.status = "방문";
        }
        d.hanok.reservations.push(rec);
      }
      /* 사장 판단으로 받은 '경고 예약'을 가끔 섞습니다 — 확인 필요 화면 테스트용 */
      if(ds === today || day % 5 === 0){   /* 5일에 한 번쯤 경고 예약이 섞이도록 */
        const kind = gi % 4;
        const w = mkRes(ds, {lunch:false, room:true}, used);
        if(w){
          w.id = "demo_w_"+gi+"_"+ds;
          if(kind===0){
            /* 라스트오더 이후 접수 */
            w.time = dow===0 ? "20:00" : "21:20";
          }else if(kind===1){
            /* 룸인데 코스가 아님 */
            w.menuType = "해당 없음"; w.courses = {};
          }else if(kind===2){
            /* 코스 인원이 성인보다 적음 */
            const keys = Object.keys(w.courses);
            if(keys.length) w.courses[keys[0]] = Math.max(1, w.people - 2);
          }else{
            /* 브레이크타임에 접수 (평일만) */
            if(dow>=1 && dow<=5) w.time = "16:00";
            else { w.menuType = "확인 필요"; w.courses = {}; }
          }
          if(ds < today && ds !== shiftDate(today,-1)) w.status = "방문";
          d.hanok.reservations.push(w);
          gi++;
        }
      }

      /* 좌석 미정 예약을 섞습니다 (오늘·내일은 꼭 몇 건) */
      const wantUn = ds===today ? 2 : (ds===shiftDate(today,1) ? 1 : (gi % 11 === 0 && ds > today ? 1 : 0));
      for(let u=0; u<wantUn; u++, gi++){
        const un = mkRes(ds, {lunch:u%2===0, room:false}, used);
        if(!un) continue;
        un.id = "demo_u_"+gi+"_"+ds; un.roomId = null;
        un.seatPref = u%2===0 ? "room-any" : "hall-any";
        un.people = 4; un.infants = 0; un.chairs = 0;
        un.menuType = un.seatPref==="room-any" ? "확인 필요" : "해당 없음";
        un.courses = {};
        d.hanok.reservations.push(un);
      }
    }
  }

  /* 접속 기록 예시 — 형식 확인용 */
  const sampleIPs = ["121.174.22.9","121.174.22.9","203.234.11.87","172.30.1.44"];
  const acts = [
    ["로그인 성공",""],
    ["매장 진입","hanok"],
    ["예약 등록", `${today} 18:30 오세라 12명 동탁 룸 경로:전화`],
    ["상태 변경", `${shiftDate(today,-2)} 18:30 차민석 확정 → 노쇼`],
    ["좌석 배정", `${today} 19:00 이가은 → 관우`],
    ["로그인 실패","입력값 1111"],
    ["설정 변경","stayHours = 3"],
    ["예약 삭제", `${shiftDate(today,-6)} 20:00 김테스트 010-0000-0000`]
  ];
  d._logs = acts.map((a,i)=>({
    ts: new Date(Date.now() - (acts.length-i)*3600000*3).toISOString(),
    ip: sampleIPs[i%sampleIPs.length],
    store: "hanok", action:a[0], detail:a[1],
    ua: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
  }));
  d._auth = {...DEFAULT_AUTH};

  return assignTentatives(d);
}
/* 좌석 미정 예약에 잠정 배정을 붙임 (예시 데이터용) */
function assignTentatives(d){
  const prev = view.storeKey; view.storeKey = "hanok";
  const saved = DATA; DATA = d;
  d.hanok.reservations.filter(r=>!r.roomId && !r.tentativeRoomId).forEach(r=>{
    r.tentativeRoomId = suggestSeat(r.date, r.time, pplOf(r), r.seatPref||"any", r.id);
  });
  DATA = saved; view.storeKey = prev;
  return d;
}
async function clearDemo(){
  if(!await uiConfirm2("예시 데이터를 모두 지울까요? 직접 등록한 예약·직원 기록은 그대로 남습니다.")) return;
  const s = store();
  s.reservations = s.reservations.filter(r=>!r.demo);
  s.sales = s.sales.filter(x=>!x.demo);
  s.staff = s.staff.filter(x=>!x.demo);
  s.attendance = s.attendance.filter(x=>!x.demo);
  saveData(); render();
}


loadData();
</script>
