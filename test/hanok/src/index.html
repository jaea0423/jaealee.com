<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한옥반점 · 안집 통합 관리</title>
<!-- 본문: Pretendard / 제목: Noto Serif KR — 기기에 설치돼 있지 않아도 같은 글꼴로 보이게 불러옵니다 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* ============================================================
   디자인 토큰 — 색/간격을 바꾸려면 여기만 수정
   방향: "온종일 보는 업무 도구". 장식 최소화, 대비와 정렬로 읽히게.
   ============================================================ */
:root{
  --bg:#F4F4F1;          /* 화면 바탕 (중성 회색) */
  --surface:#FFFFFF;     /* 카드 */
  --surface-2:#FAFAF8;   /* 카드 안쪽 구역 */
  --border:#E3E2DC;      /* 실선 */
  --border-strong:#CFCDC4;
  --text:#1B1B19;        /* 본문 */
  --text-2:#5F5E58;      /* 보조 */
  --text-3:#8E8C84;      /* 라벨 */
  --pine:#1E4A3C;        /* 강조 — 확정/주요 버튼 */
  --pine-soft:#E8F0EC;
  --amber:#8A6114;       /* 주의 */
  --amber-soft:#FAF1DC;
  --rust:#9C3B27;        /* 경고 */
  --rust-soft:#FAE9E5;
  /* 상단바 (테마별로 바뀝니다) */
  --topbar-bg:var(--surface); --topbar-fg:var(--text); --topbar-line:var(--border);
  --topbar-btn-line:var(--border-strong); --topbar-hover:var(--surface-2);
  --sans:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  /* 디스플레이 모드 전용 — 손님이 보는 화면이라 더 고풍스러운 명조를 씁니다 */
  --serif-tv:'Nanum Myeongjo','Noto Serif KR',serif;
  --r:10px;              /* 모서리 반경 */
  --shadow:0 1px 2px rgba(27,27,25,.05);

  --img-anjip:url('data:image/jpeg;base64,__ANJIP_B64__');
  --img-hanok:url('data:image/jpeg;base64,__HANOK_B64__');
  --bg1:url('data:image/jpeg;base64,__BG1_B64__');
  --bg2:url('data:image/jpeg;base64,__BG2_B64__');
  --bg3:url('data:image/jpeg;base64,__BG3_B64__');
  --bg4:url('data:image/jpeg;base64,__BG4_B64__');
  --bg5:url('data:image/jpeg;base64,__BG5_B64__');
  --bg6:url('data:image/jpeg;base64,__BG6_B64__');
  --bg7:url('data:image/jpeg;base64,__BG7_B64__');
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
  /* 맥·윈도우에서 글자 두께가 다르게 보이는 문제 완화 */
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.012em; word-break:keep-all;
  font-feature-settings:"tnum" 1,"case" 1;
  /* 숫자 폭을 고르게 — 표에서 자릿수가 흔들리지 않음 */
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--border-strong);
  border-radius:8px; padding:10px 12px;
  font-size:16px; /* 16px 미만이면 iOS에서 입력 시 화면이 확대됨 */
  color:var(--text); font-family:inherit;
}
input:focus,select:focus{outline:2px solid var(--pine); outline-offset:-1px; border-color:transparent}
:focus-visible{outline:2px solid var(--pine); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ============================================================
   1. 매장 선택 (사진 분할)
   ============================================================ */
.split{display:flex; width:100%; height:100vh; height:100dvh; overflow:hidden; background:#15130F}
.panel{
  position:relative; flex:1 1 50%; border:none; padding:0; margin:0;
  background:none; overflow:hidden; color:#fff;
  transition:flex-grow .6s cubic-bezier(.22,1,.36,1);
}
.panel .bg{
  position:absolute; inset:0; background-size:cover; background-position:center;
  transform:scale(1.02); filter:saturate(.9) brightness(.6);
  transition:transform 1.1s cubic-bezier(.22,1,.36,1), filter .6s ease;
}
.panel[data-store="anjip"] .bg{background-image:var(--img-anjip)}
.panel[data-store="hanok"] .bg{background-image:var(--img-hanok)}
.panel .veil{
  position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(15,19,16,.28) 0%,rgba(15,19,16,.12) 42%,rgba(15,19,16,.7) 100%);
  transition:opacity .6s ease;
}
.panel .label{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center}
.panel .name{
  font-family:var(--serif); font-weight:700; font-size:clamp(30px,5.2vw,60px);
  letter-spacing:.22em; text-indent:.22em; text-shadow:0 2px 20px rgba(0,0,0,.55);
  transition:letter-spacing .6s cubic-bezier(.22,1,.36,1);
}
.panel .rule{width:24px; height:1px; background:rgba(255,255,255,.75);
  transition:width .6s cubic-bezier(.22,1,.36,1), background .4s}
.panel .meta{font-size:13px; letter-spacing:.06em; color:rgba(255,255,255,.8);
  opacity:0; transform:translateY(6px); transition:opacity .5s, transform .5s}
.split .panel + .panel{box-shadow:-1px 0 0 rgba(255,255,255,.22)}

/* 준비 중인 매장 — 흑백 처리 + 잠금 표시 */
.panel.locked{cursor:not-allowed}
.panel.locked .bg{filter:grayscale(1) brightness(.34)}
.panel.locked .name{color:rgba(255,255,255,.62)}
.panel.locked .rule{background:rgba(255,255,255,.35)}
.panel .badge{
  display:inline-block; margin-top:2px; padding:5px 13px; border-radius:999px;
  border:1px solid rgba(255,255,255,.4); color:rgba(255,255,255,.82);
  font-size:12px; letter-spacing:.1em;
}
@media (hover:hover) and (min-width:900px){
  .panel:not(.locked):hover{flex-grow:1.22}
  .panel:not(.locked):hover .bg{transform:scale(1.08); filter:saturate(1) brightness(.76)}
  .panel:not(.locked):hover .veil{opacity:.6}
  .panel:not(.locked):hover .name{letter-spacing:.32em; text-indent:.32em}
  .panel:not(.locked):hover .rule{width:92px; background:#fff}
  .panel:not(.locked):hover .meta{opacity:1; transform:none}
}
@media (hover:none){ .panel .meta{opacity:1; transform:none} }
@media (max-width:767px){
  .split{flex-direction:column}
  .split .panel + .panel{box-shadow:0 -1px 0 rgba(255,255,255,.22)}
  .panel .name{font-size:clamp(28px,9vw,42px)}
}
@media (min-width:768px) and (max-width:899px){ .panel .meta{opacity:1; transform:none} }
@media (prefers-reduced-motion:reduce){ .panel,.panel *{transition:none !important} }

/* ============================================================
   2. 관리 화면 레이아웃
   PC: 왼쪽 고정 메뉴 + 본문 / 모바일: 상단 바 + 하단 탭
   ============================================================ */
.shell{min-height:100vh}
.topbar{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:12px 16px;
}
.topbar .home{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:8px; padding:7px 10px; font-size:13px; line-height:1;
}
.topbar .title{font-family:var(--serif); font-size:18px; font-weight:700; letter-spacing:.06em}
.topbar .right{margin-left:auto; display:flex; align-items:center; gap:8px}

/* 영업 상태 배지 */
.state{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
  font-size:13px; font-weight:600; border:1px solid transparent}
.state .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
.state.open{background:var(--pine-soft); color:var(--pine); border-color:#C9DED5}
.state.prep{background:var(--amber-soft); color:var(--amber); border-color:#EBDCB6}
.state.closed{background:#F0EFEB; color:var(--text-2); border-color:var(--border)}

.layout{display:block}
.content{padding:18px 14px 90px; max-width:none; margin:0}

/* ---------- 카드 / 공통 요소 ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.card-h{display:flex; align-items:center; gap:8px; padding:14px 16px 0}
.card-h h2{margin:0; font-size:14px; font-weight:700; letter-spacing:.02em; color:var(--text)}
.card-h .more{margin-left:auto; background:none; border:none; color:var(--pine); font-size:13px; font-weight:600; padding:0}
.card-b{padding:14px 16px 16px}
.lbl{font-size:12px; color:var(--text-3); font-weight:600; letter-spacing:.03em}
.sect-title{font-size:13px; font-weight:700; color:var(--text-3); letter-spacing:.06em; margin:22px 2px 8px}
.sect-title:first-child{margin-top:0}
.muted{color:var(--text-2)}
.empty{text-align:center; color:var(--text-3); padding:34px 12px; font-size:14px}

/* 큰 숫자 지표 */
.metrics{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border)}
.metric{background:var(--surface); padding:14px 16px}
.metric .v{font-size:26px; font-weight:700; line-height:1.15; letter-spacing:-.02em}
.metric .k{font-size:12px; color:var(--text-3); margin-top:2px; font-weight:600}
.metric .s{font-size:12px; color:var(--text-2); margin-top:3px}
.metric.warn .v{color:var(--rust)}

/* 버튼 */
.btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  border-radius:8px; padding:10px 14px; font-size:14px; font-weight:600}
.btn.primary{background:var(--pine); border-color:var(--pine); color:#fff}
.btn.ghost{border-color:transparent; background:var(--surface-2); color:var(--text-2)}
.btn.danger{border-color:var(--rust); color:var(--rust); background:var(--surface)}
.btn.sm{padding:7px 11px; font-size:13px}
.btn.block{width:100%}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}

/* 배지·칩 */
.tag{display:inline-block; padding:3px 9px; border-radius:6px; font-size:12px; font-weight:600;
  background:var(--surface-2); color:var(--text-2); border:1px solid var(--border)}
.tag.pine{background:var(--pine-soft); color:var(--pine); border-color:#CDDFD8}
.tag.rust{background:var(--rust-soft); color:var(--rust); border-color:#EFD3CC}
.tag.amber{background:var(--amber-soft); color:var(--amber); border-color:#EDDFBC}

/* 목록 행 */
.rowitem{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--border)}
.rowitem:first-child{border-top:none}
.rowitem .grow{flex:1; min-width:0}
.rowitem .t{font-weight:600}
.rowitem .s{font-size:13px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.time-col{font-size:15px; font-weight:700; width:52px; flex:none; color:var(--text)}

/* ---------- 예약 화면 ---------- */
.datebar{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.datebar .nav{width:44px; height:44px; flex:none; border:1px solid var(--border-strong);
  background:var(--surface); border-radius:8px; color:var(--text-2); font-size:14px}
.datebar .mid{flex:1; text-align:center}
.datebar .d{font-size:17px; font-weight:700}
.datebar input{margin-top:4px; max-width:190px; text-align:center; padding:7px 10px; font-size:14px}
.filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; -webkit-overflow-scrolling:touch}
.filters button{white-space:nowrap; border:1px solid var(--border-strong); background:var(--surface);
  color:var(--text-2); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600}
.filters button.on{background:var(--text); border-color:var(--text); color:#fff}

.roomgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:6px}
.roomcell{border:1px solid var(--border); border-radius:8px; padding:8px 6px; text-align:center; background:var(--surface-2)}
.roomcell .n{font-size:13px; font-weight:700}
.roomcell .c{font-size:11px; color:var(--text-3); margin-top:1px}
.roomcell.used{background:var(--pine); border-color:var(--pine); color:#fff}
.roomcell.used .c{color:rgba(255,255,255,.75)}

.res-list{display:grid; gap:10px; grid-template-columns:1fr !important}
.res{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden; display:flex}
.res .stripe{width:4px; flex:none; background:var(--pine)}
.res.s-방문 .stripe{background:var(--border-strong)}
.res.s-취소 .stripe{background:var(--border-strong)}
.res.s-노쇼 .stripe{background:var(--rust)}
.res.s-방문,.res.s-취소{opacity:.62}
.res .body{flex:1; min-width:0; padding:12px 14px}
.res .l1{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.res .tm{font-size:17px; font-weight:700; letter-spacing:-.01em}
.res .nm{font-size:15px; font-weight:600}
.res .pp{font-size:13px; color:var(--text-2)}
.res .rm{margin-left:auto}
.res .l2{font-size:13px; color:var(--text-2); margin-top:5px; word-break:break-word}
.res .l3{display:flex; align-items:center; gap:6px; margin-top:10px}
.res .l3 select{width:auto; padding:6px 9px; font-size:13px; border-radius:7px}
.res .l3 .btn{margin-left:auto}

.fab{position:fixed; right:16px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:25;
  height:52px; padding:0 20px; border:none; border-radius:26px; background:var(--pine); color:#fff;
  font-size:15px; font-weight:700; box-shadow:0 4px 14px rgba(30,74,60,.34);
  display:inline-flex; align-items:center; gap:7px}
.fab svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.2}

/* ---------- 차트 (라이브러리 없이 SVG로 직접 그림) ---------- */
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart .gl{stroke:var(--border); stroke-width:1}
.chart .bar-total{fill:#BFD3CA}
.chart .bar-empty{fill:none; stroke:var(--border-strong); stroke-width:1; stroke-dasharray:3 3}
.chart .bar-res{fill:var(--pine)}
.chart .line-total{fill:none; stroke:#5F5E58; stroke-width:2; stroke-linejoin:round}
.chart .line-total-d{fill:#5F5E58}
.chart .line-res{fill:none; stroke:#9C3B27; stroke-width:2; stroke-dasharray:5 4; stroke-linejoin:round}
.chart .line-res-d{fill:#9C3B27}
.chart .tx{fill:var(--text-3); font-size:11px; font-family:var(--sans); font-weight:600}
.chart .tx.sm{font-size:9.5px; font-weight:500}
.chart .tx.on{fill:var(--text)}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:10px; font-size:12.5px; color:var(--text-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend .sw{width:11px; height:11px; border-radius:3px; display:inline-block}
.legend .sw.bar-total{background:#BFD3CA}
.legend .sw.bar-res{background:var(--pine)}
.legend .sw.ln{height:3px; border-radius:2px; width:14px}
.legend .sw.ln.total{background:#5F5E58}
.legend .sw.ln.res{background:#9C3B27}
.chart-sum{display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-size:13px; color:var(--text-2)}
.chart-sum b{color:var(--text)}

/* ---------- 표 ---------- */
.table{width:100%; border-collapse:collapse; font-size:14px}
.table th{text-align:left; font-size:12px; color:var(--text-3); font-weight:600;
  padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap}
.table td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle}
.table td.r,.table th.r{text-align:right}
.table tr:last-child td{border-bottom:none}

/* ---------- 입력 시트 ---------- */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(20,20,18,.45);
  display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:560px; max-height:90vh; overflow-y:auto; background:var(--bg);
  border-radius:16px 16px 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet-h{display:flex; align-items:center; margin-bottom:14px}
.sheet-h h2{margin:0; font-size:18px; font-weight:700}
.sheet-h .x{margin-left:auto; background:none; border:none; font-size:22px; color:var(--text-3); line-height:1; padding:0 4px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.f{display:block; margin-bottom:12px}
.f .lb{font-size:12.5px; color:var(--text-3); font-weight:600; margin-bottom:5px}
.f-note{font-size:12px; color:var(--text-3); margin-top:5px}
.sheet-actions{display:flex; gap:8px; margin-top:6px; padding-top:14px; border-top:1px solid var(--border)}
.sheet-actions .btn.primary{flex:1}

/* 선택형 버튼 그룹 (예약경로·상태) */
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:8px; padding:9px 13px; font-size:14px; font-weight:600}
.seg button.on{background:var(--text); border-color:var(--text); color:#fff}
.stepper{display:flex; align-items:center; gap:0; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; background:var(--surface)}
.stepper button{width:44px; height:44px; border:none; background:var(--surface-2); font-size:19px; color:var(--text-2)}
.stepper input{border:none; text-align:center; border-radius:0; height:44px; padding:0}
.stepper input:focus{outline:none}

/* ============================================================
   3. 화면 크기별 최적화
   ============================================================ */
@media (min-width:768px){
  .content{padding:22px 20px 80px}
  .metrics{grid-template-columns:repeat(4,1fr)}
  .dash{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start}
  .dash .card{margin-top:0}
  .dash .span2{grid-column:1 / -1}
  .sheet{border-radius:14px; max-width:600px}
  .overlay{align-items:center}
}
@media (min-width:1024px){
  .content{padding:26px 26px 60px; max-width:1720px; margin:0 auto}
  .fab{display:none}          /* PC에서는 상단 "예약 등록" 버튼 사용 */
  .dash{grid-template-columns:repeat(3,1fr)}
  .dash .span2{grid-column:span 2}
  .dash .span3{grid-column:1 / -1}
}

/* ============================================================
   4. 예약 화면 — 왼쪽 3주 달력 + 오른쪽 날짜 상세
   ============================================================ */
.res-split{display:block}
.cal{margin-bottom:14px}
.cal-h{display:flex; align-items:center; gap:8px; padding:12px 12px 0}
.cal-h .rng{flex:1; text-align:center; font-weight:700; font-size:14px}
.cal-h .nav{width:36px; height:36px; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:8px; color:var(--text-2); font-size:12px}
.cal-b{padding:10px 10px 4px}
.cgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.chead{margin-bottom:4px}
.chd{text-align:center; font-size:11px; font-weight:700; color:var(--text-3); padding:2px 0}
.chd.sun,.cday.sun .dn{color:#B0553F}
.chd.sat,.cday.sat .dn{color:#3E6291}
.cday{
  border:1px solid var(--border); background:var(--surface); border-radius:8px;
  min-height:56px; padding:5px 3px 4px; display:flex; flex-direction:column; align-items:center; gap:3px;
}
.cday .dn{font-size:13px; font-weight:700; color:var(--text); line-height:1}
.cday .dots{display:flex; gap:2px}
.cday .dots i{width:4px; height:4px; border-radius:50%; background:var(--pine); display:block}
.cday .cnt{font-size:10px; font-weight:700; color:var(--pine); background:var(--pine-soft);
  border-radius:4px; padding:1px 4px; line-height:1.4}
.cday .pp{font-size:10px; color:var(--text-3); line-height:1}
.cday.today{border-color:var(--text); border-width:1.5px}
.cday.sel{background:var(--pine); border-color:var(--pine)}
.cday.sel .dn,.cday.sel .pp,.cday.sel .cnt{color:#fff; background:transparent}
.cday.sel .dots i{background:rgba(255,255,255,.9)}
.cal-f{display:flex; gap:8px; align-items:center; padding:10px 12px 12px; border-top:1px solid var(--border)}
.cal-f input{padding:7px 10px; font-size:14px; max-width:170px}

.daypanel .day-h{display:flex; align-items:flex-start; gap:10px; margin-bottom:4px}
.daypanel .day-d{font-size:19px; font-weight:700}
.daypanel .day-s{font-size:13.5px; color:var(--text-2); margin-top:2px}
.daypanel .add{margin-left:auto; flex:none}

@media (min-width:900px){
  .res-split{display:grid; grid-template-columns:minmax(300px,360px) 1fr; gap:20px; align-items:start}
  .cal{margin-bottom:0; position:sticky; top:74px}
  .cday{min-height:62px}
  .res-list{grid-template-columns:1fr}
}
@media (min-width:1280px){ .res-list{grid-template-columns:repeat(2,1fr)} }

/* ============================================================
   5. 예약 등록 마법사 — 카운터 태블릿 기준 (큰 터치 영역)
   ============================================================ */
.wz{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column}
.wz-top{background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:10px 14px; flex-wrap:wrap}
.wz-back{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:8px; padding:9px 14px; font-size:14px; font-weight:600; flex:none}
.wz-steps{display:flex; gap:4px; flex:1; min-width:0; overflow-x:auto}
.wz-dot{display:flex; align-items:center; gap:6px; border:none; background:none; padding:6px 8px;
  border-radius:8px; color:var(--text-3); font-size:13px; font-weight:600; white-space:nowrap}
.wz-dot .n{width:21px; height:21px; border-radius:50%; background:var(--border);
  color:var(--surface); font-size:12px; display:grid; place-items:center; flex:none}
.wz-dot.past .n{background:var(--pine); color:#fff}
.wz-dot.on{color:var(--text)} .wz-dot.on .n{background:var(--text); color:#fff}
.wz-dot .l{display:none}
.wz-sum{display:flex; gap:6px; margin-left:auto}
.wz-sum span{font-size:12.5px; font-weight:600; color:var(--pine); background:var(--pine-soft);
  border:1px solid #CDDFD8; border-radius:6px; padding:4px 9px}
.wz-q{padding:20px 18px 6px; text-align:center}
.wz-q h2{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; line-height:1.4}
.wz-body{flex:1; overflow-y:auto; padding:14px 16px 20px; max-width:940px; width:100%; margin:0 auto}
.wz-foot{background:var(--surface); border-top:1px solid var(--border); display:flex; gap:10px;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.btn.lg{padding:16px 22px; font-size:16.5px; border-radius:10px}
.btn.grow{flex:1}
.btn.off{opacity:.4}
.wz-note{font-size:13px; color:var(--text-3); margin-top:16px; line-height:1.6}

/* 1단계 달력 */
.wz-cal{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 12px 14px}
.mo-h{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.mo-h .mo{flex:1; text-align:center; font-size:17px; font-weight:700}
.mo-h .nav{width:42px; height:42px; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:9px; color:var(--text-2)}
.bgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.bhead span{text-align:center; font-size:12px; font-weight:700; color:var(--text-3); padding-bottom:3px}
.bhead .sun{color:#B0553F} .bhead .sat{color:#3E6291}
.bday{min-height:56px}
button.bday{border:1px solid var(--border); background:var(--surface); border-radius:9px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px}
button.bday .d{font-size:17px; font-weight:600}
button.bday .b{font-size:10.5px; font-weight:700; color:var(--pine); background:var(--pine-soft); border-radius:4px; padding:1px 5px}
button.bday.sun .d{color:#B0553F} button.bday.sat .d{color:#3E6291}
button.bday.today{border-color:var(--text); border-width:1.5px}
button.bday.past{opacity:.42}
button.bday.sel{background:var(--pine); border-color:var(--pine)}
button.bday.sel .d{color:#fff} button.bday.sel .b{background:rgba(255,255,255,.22); color:#fff}

/* 1단계 시간 */
.wz-time{margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px}
.hgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:7px}
.hcell{border:1px solid var(--border-strong); background:var(--surface); border-radius:10px;
  padding:11px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:1px}
.hcell .ap{font-size:11px; color:var(--text-3); font-weight:600}
.hcell .hh{font-size:19px; font-weight:700; letter-spacing:-.02em}
.hcell .hn{font-size:10.5px; color:var(--amber); font-weight:700}
.hcell.on{background:var(--pine); border-color:var(--pine)}
.hcell.on .ap,.hcell.on .hh,.hcell.on .hn{color:#fff}

.mwrap{margin-top:18px; padding-top:16px; border-top:1px solid var(--border)}
.mhead{display:flex; align-items:baseline; margin-bottom:14px}
.mhead .mnow{margin-left:auto; font-size:20px; font-weight:700; color:var(--pine)}
.mrail{position:relative; height:70px; touch-action:none; user-select:none; margin:0 22px}
.mtrack{position:absolute; left:0; right:0; top:15px; height:12px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:99px}
.mfill{position:absolute; left:0; top:15px; height:12px; background:var(--pine); border-radius:99px; opacity:.28}
.mnotch{position:absolute; top:18px; width:1px; height:6px; background:var(--border-strong); margin-left:-0.5px}
.mnotch.big{top:16px; height:10px; background:var(--text-3)}
.mknob{position:absolute; top:0; width:44px; height:44px; margin-left:-22px; border-radius:50%;
  background:var(--pine); color:#fff; font-size:14px; font-weight:700;
  display:grid; place-items:center; box-shadow:0 2px 8px rgba(30,74,60,.35); pointer-events:none}
.mtick{position:absolute; bottom:0; transform:translateX(-50%); width:34px;
  background:none; border:none; font-size:12.5px; font-weight:600; color:var(--text-3); padding:4px 0}
.mtick.on{color:var(--pine); font-weight:800}
.mfine{display:flex; gap:8px; margin-top:10px}
.mfine button{flex:1; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:9px; padding:11px 0; font-size:14px; font-weight:600; color:var(--text-2)}

/* 2단계 인원 */
.pgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.ptile{border:1px solid var(--border-strong); background:var(--surface); border-radius:12px;
  padding:20px 0 16px; display:flex; flex-direction:column; align-items:center; gap:1px}
.ptile .pn{font-size:32px; font-weight:700; letter-spacing:-.03em; line-height:1}
.ptile .pu{font-size:13px; color:var(--text-3); font-weight:600}
.ptile.on{background:var(--pine); border-color:var(--pine)}
.ptile.on .pn,.ptile.on .pu{color:#fff}
.pmore{width:100%; margin-top:10px; border:1px dashed var(--border-strong); background:var(--surface-2);
  border-radius:12px; padding:16px; font-size:15px; font-weight:600; color:var(--text-2)}
.pmore.on{border-style:solid; border-color:var(--pine); color:var(--pine); background:var(--pine-soft)}
.bigstep{display:flex; align-items:center; gap:10px; margin-top:12px; justify-content:center}
.bigstep button{width:62px; height:62px; border-radius:14px; border:1px solid var(--border-strong);
  background:var(--surface); font-size:26px; color:var(--text-2)}
.bigstep .v{min-width:96px; text-align:center; font-size:30px; font-weight:700}
.bigstep .v small{font-size:14px; color:var(--text-3); font-weight:600; margin-left:3px}
.bigstep.sm button{width:50px; height:50px; font-size:22px; border-radius:12px}
.bigstep.sm .v{min-width:74px; font-size:24px}
.infant{display:flex; align-items:center; gap:12px; margin-top:22px; padding:14px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px; flex-wrap:wrap}
.infant .t{font-weight:700} .infant .s{font-size:13px; color:var(--text-3)}
.infant .bigstep{margin-top:0; margin-left:auto}

/* 3단계 좌석 */
.sgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:9px; margin-top:8px}
.sgrid.hall{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sgrid.any{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.scell{position:relative; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:12px; padding:16px 8px; display:flex; flex-direction:column; align-items:center; gap:3px}
.scell .sn{font-size:16px; font-weight:700}
.scell .sc{font-size:12px; color:var(--text-3)}
.scell .sb{position:absolute; top:6px; right:6px; font-size:10px; font-weight:700;
  color:var(--amber); background:var(--amber-soft); border-radius:5px; padding:2px 5px}
.scell.busy{background:var(--surface-2); border-style:dashed}
.scell.on{background:var(--pine); border-color:var(--pine)}
.scell.on .sn,.scell.on .sc{color:#fff}
.scell.on .sb{background:rgba(255,255,255,.25); color:#fff}
.scell.any{padding:18px 8px}

/* 4·5단계 입력 */
.f.big .lb{font-size:14px; color:var(--text-2); margin-bottom:8px}
.f.big input{padding:16px 14px; font-size:18px; border-radius:10px}
.wz-review{margin-top:22px; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px}
.rv{display:flex; gap:12px; padding:7px 0; font-size:14.5px}
.rv span{color:var(--text-3); width:56px; flex:none; font-weight:600}
.rv b{font-weight:700}

/* 등록 완료 */
.wz.done{align-items:center; justify-content:center; padding:20px}
.done-box{background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:34px 26px 24px; max-width:520px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(20,20,18,.1)}
.done-box .check{width:60px; height:60px; margin:0 auto 18px; border-radius:50%;
  background:var(--pine-soft); color:var(--pine); font-size:30px; display:grid; place-items:center}
.done-msg{font-size:19px; line-height:1.7; margin:0 0 12px; font-weight:500}
.done-msg b{font-weight:800}
.done-sub{font-size:14px; color:var(--text-2); line-height:1.7}
.done-btns{display:flex; gap:10px; margin-top:24px}
.done-btns .btn{flex:1}

@media (min-width:768px){
  .wz-dot .l{display:inline}
  .wz-q h2{font-size:24px}
  .wz-q{padding:26px 18px 10px}
  .pgrid{grid-template-columns:repeat(6,1fr)}
  .ptile{padding:26px 0 20px}
  .ptile .pn{font-size:38px}
  .bday,button.bday{min-height:68px}
  button.bday .d{font-size:19px}
  .hgrid{grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
  .wz-body{padding:18px 24px 24px}
  .wz-foot{padding:14px 24px calc(16px + env(safe-area-inset-bottom))}
}
@media (min-width:1024px){
  .wz-cal{display:grid; grid-template-columns:1fr; gap:0}
  .bday,button.bday{min-height:76px}
}


/* 1단계를 한 화면에 담기 — 달력과 시간을 좌우로 나눠 스크롤을 없앰 */
.wz-step1{display:block}
.wz-time{margin-top:14px}
@media (min-width:900px){
  .wz-step1{display:grid; grid-template-columns:minmax(360px,1.05fr) 1fr; gap:16px; align-items:start}
  .wz-time{margin-top:0}
  .wz-body{max-width:1120px}
  .bday,button.bday{min-height:58px}
  button.bday .d{font-size:17px}
  .hgrid{grid-template-columns:repeat(3,1fr)}
  .hcell{padding:10px 4px 8px}
  .hcell .hh{font-size:18px}
}
@media (min-width:1280px){
  .hgrid{grid-template-columns:repeat(4,1fr)}
  .bday,button.bday{min-height:64px}
}
/* 세로 공간이 좁은 태블릿 가로 모드 대응 */
@media (max-height:820px) and (min-width:900px){
  .wz-q{padding:14px 18px 4px}
  .wz-q h2{font-size:20px}
  .bday,button.bday{min-height:48px}
  button.bday .d{font-size:15px}
  .hcell{padding:8px 4px 7px}
  .mrail{height:60px}
}


/* ============================================================
   6. 디스플레이 모드 (TV 전체화면)
   높이를 flex 로 나눠 어떤 화면 비율에서도 두 줄이 유지되게 합니다.
   ============================================================ */
.tv{
  position:fixed; inset:0; z-index:80; overflow:hidden;
  background:#0E1218; color:#F3EADA;
  display:flex; flex-direction:column;
  padding:clamp(14px,2.2vh,30px) clamp(16px,2vw,40px) clamp(10px,1.6vh,22px);
}
/* 매장 사진 배경 — 12초마다 부드럽게 전환 */
.tv-bgs{position:absolute; inset:0; z-index:0}
.tv-bg{
  position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity 2.4s ease-in-out;
}
.tv-bgs{opacity:.92}
.tv-bg.on{opacity:1}
.tv-bg.b1{background-image:var(--bg1)} .tv-bg.b2{background-image:var(--bg2)}
.tv-bg.b3{background-image:var(--bg3)} .tv-bg.b4{background-image:var(--bg4)}
.tv-bg.b5{background-image:var(--bg5)} .tv-bg.b6{background-image:var(--bg6)}
.tv-bg.b7{background-image:var(--bg7)}
.tv::after{
  content:""; position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(130% 90% at 50% 0%, rgba(8,11,15,.10) 0%, rgba(8,11,15,.46) 72%),
    linear-gradient(180deg, rgba(8,11,15,.30) 0%, rgba(8,11,15,.20) 40%, rgba(8,11,15,.58) 100%);
}
.tv-h, .tv-grid, .tv-f, .tv-exit, .tv-hot{position:relative; z-index:1}
.tv-exit{position:absolute}

/* 나가기 버튼 — 평소엔 숨기고, 우측 상단에 마우스를 올리면 나타남 */
.tv-hot{position:absolute; top:0; right:0; width:190px; height:80px; z-index:4}
.tv-tap{position:absolute; inset:0; z-index:2}
.tv-exit{
  position:absolute; top:14px; right:16px; z-index:5; opacity:0; pointer-events:none;
  background:rgba(243,234,218,.1); border:1px solid rgba(243,234,218,.25);
  color:rgba(243,234,218,.75); border-radius:8px; padding:8px 15px; font-size:13px;
  transition:opacity .25s ease;
}
.tv-exit.show{opacity:1; pointer-events:auto}
@media (hover:hover) and (pointer:fine){
  .tv-hot:hover ~ .tv-exit, .tv-exit:hover{opacity:1; pointer-events:auto}
}
.tv-exit:hover{color:#F3EADA; background:rgba(243,234,218,.2)}

.tv-h{flex:none; text-align:center; padding-bottom:clamp(8px,1.4vh,18px)}
.tv-date{font-family:var(--serif-tv); font-size:clamp(12px,1.6vh,21px); letter-spacing:.24em; color:#BBA684}
.tv-h h1{
  font-family:var(--serif-tv); font-weight:800; margin:7px 0 0;
  font-size:clamp(25px,4.4vh,56px); letter-spacing:.2em; text-indent:.2em; line-height:1.2;
  color:#F8F1E2; text-shadow:0 2px 14px rgba(0,0,0,.55);
}
.tv-line{width:96px; height:1px; margin:clamp(9px,1.5vh,18px) auto 0;
  background:linear-gradient(90deg, transparent, #C9AE79, transparent)}

.tv-grid{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:clamp(6px,1vh,14px)}
.tv-row{flex:1 1 0; min-height:0; display:flex; gap:clamp(6px,.8vw,14px)}
.tv-row.halls{flex:1.25 1 0}                    /* 홀은 예약이 많아 조금 더 높게 */
.dsec ul.two-col{display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column;
  grid-template-rows:repeat(6,auto); gap:clamp(2px,.4vh,6px) clamp(8px,1vw,18px); align-content:start}
.dsec{
  flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:column;
  background:linear-gradient(180deg, rgba(10,13,18,.80), rgba(6,9,13,.86));
  border:1px solid rgba(214,190,138,.26);
  border-radius:12px; padding:clamp(9px,1.3vh,17px) clamp(9px,.9vw,15px);
  backdrop-filter:blur(3px); box-shadow:0 4px 18px rgba(0,0,0,.28);
}
.dsec.hall{background:rgba(30,26,16,.55); border-color:rgba(200,168,110,.34)}
.dsec h3{
  flex:none; margin:0 0 clamp(6px,.9vh,12px); display:grid;
  grid-template-columns:1fr auto 1fr; align-items:baseline; gap:6px;
  font-family:var(--serif-tv); font-size:clamp(14px,2.15vh,26px); font-weight:700; letter-spacing:.08em;
  padding-bottom:clamp(6px,.8vh,10px); border-bottom:1px solid rgba(214,190,138,.32);
  white-space:nowrap; color:#F6EEDD;
}
.dsec h3 .fl{font-size:.5em; font-weight:500; color:#9E9078; letter-spacing:.06em; text-align:left}
.dsec h3 .nm{text-align:center}
.dsec h3 .cap{font-size:.5em; font-weight:500; color:#9E9078; text-align:right}
.dsec ul{
  flex:1 1 auto; min-height:0; list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:clamp(2px,.4vh,6px); overflow:hidden;
}
.dsec li{
  flex:none; display:flex; align-items:baseline; gap:clamp(5px,.6vw,12px);
  font-size:clamp(13px,1.95vh,23px); line-height:1.5; white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.dsec li .t{font-weight:800; color:#EBCE86; flex:none; letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.dsec li .n{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
.dsec li .p{flex:none; color:#A9967A; font-size:.85em}
.dsec li.past{opacity:.36}
.dsec li.past .t{color:#8E7F68}
.dsec li.none{color:#6E6252; font-size:clamp(11px,1.5vh,17px)}

.tv-f{
  flex:none; text-align:center; padding-top:clamp(8px,1.4vh,16px); margin-top:clamp(6px,1vh,12px);
  border-top:1px solid rgba(243,234,218,.14);
  font-family:var(--serif-tv); font-size:clamp(14px,2.1vh,24px);
  letter-spacing:.2em; text-indent:.2em; color:#A9967A;
}
}


/* ---------- 좌석 가동 타임라인 ---------- */
.tl-top{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:12px; font-size:12.5px; color:var(--text-2)}
.tl-kpi{font-size:14px; color:var(--text)} .tl-kpi b{font-size:18px; color:var(--pine)}
.tl-legend{display:inline-flex; align-items:center; gap:5px}
.tl-legend i{width:14px; height:10px; border-radius:3px; display:inline-block; background:var(--pine)}
.tl-legend i.tent{background:repeating-linear-gradient(45deg,#C9BBA0 0 3px,#E2D9C6 3px 6px); border:1px dashed #A8977A}
.tl{display:flex; flex-direction:column; gap:4px}
.tl-row{display:flex; align-items:center; gap:8px}
.tl-name{width:94px; flex:none; font-size:12.5px; font-weight:700; display:flex; flex-direction:column; justify-content:center; line-height:1.25}
.tl-name small{font-size:10.5px; font-weight:500; color:var(--text-3)}
.tl-rate{width:46px; flex:none; display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  font-size:12.5px; font-weight:700; color:var(--text-2)}
.tl-rate .over{font-size:10px; color:var(--rust); font-weight:700}
.tl-track{position:relative; flex:1; min-width:0; height:30px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:6px; overflow:hidden}
.tl-row.axis .tl-track{height:18px; background:none; border:none}
.tl-row.axis .tl-name,.tl-row.axis .tl-rate{font-size:10.5px; color:var(--text-3); font-weight:600}

/* 좌석 선택 단계 보강 */

/* 예약 처리 시트 */
.mark-info{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:16px}
.mark-info .mi-t{font-size:17px; font-weight:700}
.mark-info .mi-s{font-size:13.5px; color:var(--text-2); margin-top:3px}
.markgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* ---------- 상단 헤더 / 가로 네비게이션 ---------- */
.topbar{position:sticky; top:0; z-index:30; background:var(--topbar-bg); border-bottom:1px solid var(--topbar-line);
  display:flex; align-items:center; gap:10px; padding:11px 14px; color:var(--topbar-fg)}

  display:inline-flex; align-items:center}

  background:none; border:none; padding:4px 8px; border-radius:8px}

  border-radius:8px; padding:8px 13px; font-size:13px; font-weight:600; white-space:nowrap; opacity:.9}

  background:none; border:none; padding:13px 4px; font-size:15px; font-weight:600;

.dash-actions{display:flex; gap:8px; padding:14px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap}

/* ---------- 예약 화면 헤더 ---------- */

/* ---------- 좌석 현황 보드 ---------- */
.sb-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:8px}

/* ---------- 달력 팝업 ---------- */
.calbox{width:100%; max-width:520px; max-height:92vh; overflow-y:auto; background:var(--bg);

  border-radius:9px; padding:11px 13px; display:flex; flex-direction:column; gap:2px}

.ratecard{text-align:left; font:inherit; color:inherit; cursor:pointer; padding:0}
.ratecard:hover{background:var(--surface-2)}
.ratecard .card-h{padding:14px 16px 0}
.rc-v{margin-left:auto; font-size:22px; font-weight:800; color:var(--pine)}
.rc-body{flex:1; min-height:0; display:flex; align-items:center; padding:8px 16px}
.rc-foot{padding:0 16px 14px; font-size:12.5px; color:var(--text-3)}
.spark{width:100%; height:100%; max-height:120px}
.sp-bars rect{fill:#C6D6CE}
.sp-line{fill:none; stroke:var(--pine); stroke-width:2; stroke-linejoin:round; vector-effect:non-scaling-stroke}

/* ---------- 접속 기록 ---------- */
.logbox{max-height:52vh; overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:6px 0}
.logrow{display:flex; gap:10px; padding:7px 12px; border-bottom:1px solid var(--border);
  font-size:12.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap}
.logrow:last-child{border-bottom:none}
.lg-t{color:var(--text-3); flex:none}
.lg-ip{color:var(--text-2); width:120px; flex:none; overflow:hidden; text-overflow:ellipsis}
.lg-a{font-weight:700; width:96px; flex:none}
.lg-d{color:var(--text-2); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}
@media (max-width:700px){
  .logrow{flex-wrap:wrap; white-space:normal}
  .lg-ip,.lg-a{width:auto}
  .lg-d{flex-basis:100%}
}


/* 메뉴 선택 */
.srcgrid.menu4{grid-template-columns:1fr 1fr}
@media (min-width:768px){ .srcgrid.menu4{grid-template-columns:repeat(4,1fr)} }
.srccell{position:relative}
.srccell .s-n{position:absolute; top:10px; right:12px; min-width:24px; height:24px; border-radius:12px;
  background:var(--pine); color:#fff; font-size:13px; font-weight:800; display:grid; place-items:center; padding:0 6px}
.srccell.on .s-n{background:#fff; color:var(--pine)}
.course-sum{display:flex; align-items:center; gap:10px; margin-top:16px; padding:13px 15px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; font-size:14px}

/* 코스 팝업 */
.cgroup{margin-bottom:16px}
.cg-label{font-size:12px; font-weight:700; color:var(--text-3); margin-bottom:7px}
.cg-items{display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:8px}
.citem{position:relative; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:10px; padding:18px 6px; font-size:16px; font-weight:700; color:var(--text)}
.citem.on{background:var(--pine); border-color:var(--pine); color:#fff}
.cnum{position:absolute; top:-8px; right:-6px; min-width:22px; height:22px; border-radius:11px;
  background:var(--rust); color:#fff; font-size:12px; font-weight:800; font-style:normal;
  display:grid; place-items:center; padding:0 5px; border:2px solid var(--bg)}
.course-total{text-align:center; font-size:14px; color:var(--text-2); padding:10px 0 2px}
.course-total b{font-size:18px; color:var(--text)}
.pill.amber{background:var(--amber-soft); border-color:#EDDFBC; color:var(--amber)}


/* ---------- 공통 팝업 ---------- */
.modal-ov{align-items:center; z-index:70}
.modal{width:100%; max-width:420px; background:var(--bg); border-radius:14px; overflow:hidden;
  box-shadow:0 12px 40px rgba(20,20,18,.28); margin:0 16px}
.md-h{padding:20px 20px 0; font-size:18.5px; font-weight:800; line-height:1.4}
.modal.warn .md-h{color:var(--rust)}
.modal.ok .md-h{color:var(--pine)}
.md-b{padding:10px 20px 18px; font-size:14.5px; color:var(--text-2); line-height:1.65}
.md-l{white-space:pre-wrap}
.md-gap{height:9px}
.md-f{display:flex; gap:8px; padding:0 16px 16px; justify-content:flex-end}
.md-f .btn{min-width:96px; padding:13px 18px; font-size:15px}
.btn.danger-fill{background:var(--rust); border-color:var(--rust); color:#fff}
.btn.danger-fill:hover{background:#8A3324}

/* 경고 상태의 다음 버튼 */
.btn.primary.warned{background:var(--rust); border-color:var(--rust)}
.btn.primary.warned:hover{background:#8A3324}
.scell.on.warned{background:var(--rust); border-color:var(--rust)}
.scell.on.warned .avail{background:rgba(255,255,255,.24); color:#fff}
.hcell.on.warned{background:var(--rust); border-color:var(--rust)}
.wz-warnbar{background:var(--rust-soft); border:1px solid #EFD3CC; color:var(--rust);
  border-radius:9px; padding:11px 14px; font-size:13.5px; font-weight:700; margin-bottom:12px}


.req{font-size:11px; font-weight:800; color:var(--rust); background:var(--rust-soft);
  border:1px solid #EFD3CC; border-radius:5px; padding:2px 6px; margin-left:5px; vertical-align:2px}
.nonebtn{width:100%; border:1px dashed var(--border-strong); background:var(--surface-2);
  border-radius:10px; padding:15px; font-size:15px; font-weight:600; color:var(--text-2)}
.nonebtn.on{border-style:solid; border-color:var(--pine); background:var(--pine-soft); color:var(--pine)}
.togglebtn{width:100%; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:9px; padding:12px; font-size:14.5px; font-weight:700; color:var(--text-2)}
.togglebtn.on{background:var(--pine-soft); border-color:var(--pine); color:var(--pine)}
.cgedit{padding:12px 0; border-bottom:1px solid var(--border)}
.cgedit:last-of-type{border-bottom:none}
.whenrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:2px}
.wbtn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:7px; padding:7px 11px; font-size:12.5px; font-weight:700}
.wbtn.on{background:var(--pine); border-color:var(--pine); color:#fff}
.cgroup.off{opacity:.5}
.cg-off{font-weight:500; color:var(--text-3)}


/* 운영시간 음영 */
.offband{position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg,
  rgba(27,27,25,.10) 0 5px, rgba(27,27,25,.05) 5px 10px); z-index:1; pointer-events:none}
.breakband{position:absolute; top:0; bottom:0; background:rgba(156,59,39,.13);
  border-left:1px dashed rgba(156,59,39,.45); border-right:1px dashed rgba(156,59,39,.45);
  z-index:1; pointer-events:none}
.closed-band{position:absolute; inset:0; background:repeating-linear-gradient(45deg,
  rgba(27,27,25,.14) 0 6px, rgba(27,27,25,.06) 6px 12px); z-index:1; pointer-events:none}
.tl-hours{font-size:12.5px; color:var(--text-2); font-weight:600}
.hours-line{font-size:13px; color:var(--text-2); background:var(--surface-2);
  border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin-bottom:10px}
.hcell.late .hn.rust{color:var(--rust)}


/* 운영시간 설정 */
.schrow{padding:12px 0; border-bottom:1px solid var(--border)}
.schrow:last-of-type{border-bottom:none}
.schrow.cur{background:var(--pine-soft); margin:0 -14px; padding:12px 14px; border-radius:8px; border-bottom:none}
.sch-h{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:14.5px}
.sch-days{display:grid; grid-template-columns:1fr; gap:3px}
@media (min-width:700px){ .sch-days{grid-template-columns:1fr 1fr} }
.sch-d{font-size:12.5px; color:var(--text-2)}
.sch-d b{display:inline-block; width:18px; color:var(--text); font-weight:700}
.dayrow{border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:8px; background:var(--surface)}
.dayrow.sun .dr-h b{color:#B0553F} .dayrow.sat .dr-h b{color:#3E6291}
.dr-h{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.dr-h b{font-size:15px}
.dr-h .btn{margin-left:auto}
.dr-in label{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap}
.dr-in label span{font-size:12px; color:var(--text-3); font-weight:600; width:66px; flex:none}
.dr-in label em{font-style:normal; color:var(--text-3)}
.dr-in input{width:auto; flex:1 1 100px; min-width:96px; padding:8px 10px; font-size:14px}


/* 날짜 헤더 */
.res-head{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap}
.head-left{flex:1 1 120px; display:flex}
.head-actions{flex:1 1 120px; display:flex; justify-content:flex-end}
.datenav{flex:0 1 auto; justify-content:center; min-width:auto}
.datenav .rh-mid{background:none; border:none; padding:4px 10px; border-radius:9px; text-align:center;
  font:inherit; color:inherit; cursor:pointer; min-width:210px}
.datenav .rh-mid:hover{background:var(--surface-2)}
.today-btn{white-space:nowrap}
.tag.near{background:#EAF0F6; border-color:#CBDAE8; color:#3E6291}
.tag.near.past{background:#F1EFEA; border-color:#DDD6C8; color:#7A7263}
@media (max-width:820px){
  .res-head{gap:8px}
  .head-left,.head-actions{flex:1 1 100%}
  .head-actions{justify-content:stretch}
  .head-actions .btn{flex:1}
  .datenav{flex:1 1 100%}
}


/* 영업 외 시간 음영 — 더 진하게 */
.offband{background:repeating-linear-gradient(45deg,
  rgba(27,27,25,.24) 0 5px, rgba(27,27,25,.13) 5px 10px)}
.closed-band{background:repeating-linear-gradient(45deg,
  rgba(27,27,25,.30) 0 6px, rgba(27,27,25,.17) 6px 12px)}
.breakband{background:rgba(156,59,39,.20)}

/* 예약률 그래프 */
.chart .rb-base{fill:#EDECE7}
.chart .rb-all{fill:#C3D4CB}
.chart .rb-room{fill:var(--pine)}
.chart .rb-hall{fill:#8A6114}
.chart .tx.ax{fill:var(--text-3); font-size:10px; font-weight:600}
.chart .gl.tick{stroke:var(--border-strong)}
.chart .line-total{stroke:#173C31} .chart .line-total-d{fill:#173C31}
.chart .line-res{stroke:#6E4A0F} .chart .line-res-d{fill:#6E4A0F}
.legend .sw.rb-base{background:#EDECE7; border:1px solid var(--border)}
.legend .sw.rb-all{background:#C3D4CB}
.legend .sw.rb-room{background:var(--pine)}
.legend .sw.rb-hall{background:#8A6114}

/* 확인 필요 / 예약률 스트립 */
.alertcard{display:flex; flex-direction:column; max-height:320px}
.alertcard .card-b{flex:1; min-height:0; overflow-y:auto}
.alert{position:relative; padding-right:28px}
.a-go{position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:18px; color:var(--text-3)}
.ratestrip{display:flex; align-items:center; gap:16px; width:100%; margin-top:12px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:12px 16px; text-align:left; font:inherit; color:inherit}
.ratestrip:hover{background:var(--surface-2)}
.rs-t{font-size:14.5px; font-weight:700; flex:none}
.rs-v{font-size:19px; font-weight:800; color:var(--pine); flex:none}
.rs-g{flex:1; min-width:80px; height:38px; display:block}
.rs-g .spark{height:38px}
.rs-m{font-size:12.5px; color:var(--text-3); flex:none}
@media (max-width:700px){ .rs-m{display:none} }

/* 체크박스 줄 */
label.chk{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-2); margin:2px 0 10px}
label.chk input{width:18px; height:18px; flex:none; accent-color:var(--pine)}
label.chk span{width:auto}
.dr-in input:disabled{background:var(--surface-2); color:var(--text-3)}
.searchbox{max-height:56vh; overflow:auto}


/* ============================================================
   한옥 테마 — 설정에서 기본 테마로 되돌릴 수 있습니다
   ============================================================ */
body.theme-hanok{
  --bg:#F4EFE4;          /* 한지 */
  --surface:#FCF9F2;
  --surface-2:#F5EFE2;
  --border:#E3D9C6;
  --border-strong:#CDBFA5;
  --text:#241E16;        /* 먹 */
  --text-2:#5E5343;
  --text-3:#8B8070;
  --pine:#2E5A46;        /* 청록 */
  --pine-soft:#E6EEE9;
  --amber:#8A6114;
  --amber-soft:#F8EFD9;
  --rust:#9B3524;        /* 단청 적 */
  --rust-soft:#F8E7E2;
  --shadow:0 1px 2px rgba(70,52,30,.07);
  --topbar-bg:linear-gradient(180deg,#7A5A38,#5C4227);
  --topbar-fg:#F5EBD9;
  --topbar-line:#4A3520;
  --topbar-btn-line:rgba(245,235,217,.38);
  --topbar-hover:rgba(245,235,217,.16);
}
body.theme-hanok{
  background-image:repeating-linear-gradient(90deg, rgba(120,100,70,.022) 0 1px, transparent 1px 7px);
}
body.theme-hanok .topbar{box-shadow:0 2px 10px rgba(70,52,30,.22)}
body.theme-hanok .topbar .title{font-family:var(--serif); letter-spacing:.12em}
body.theme-hanok .topbar .state.open{background:rgba(245,235,217,.18); color:#EAF3EC; border-color:rgba(245,235,217,.34)}
body.theme-hanok .topbar .state.prep{background:rgba(245,235,217,.18); color:#F6E4BE; border-color:rgba(245,235,217,.34)}
body.theme-hanok .topbar .state.closed{background:rgba(0,0,0,.18); color:#E2D6C2; border-color:rgba(245,235,217,.24)}
body.theme-hanok .sect-title{font-family:var(--serif); letter-spacing:.04em; color:var(--text-2)}
body.theme-hanok .card-h h2{font-family:var(--serif); letter-spacing:.03em}
body.theme-hanok .rh-d{font-family:var(--serif); letter-spacing:.02em}
body.theme-hanok .card{border-color:#E0D5C0}
body.theme-hanok .metric .v{font-family:var(--serif)}
body.theme-hanok .btn.primary{background:var(--pine); border-color:var(--pine)}
body.theme-hanok .btn.primary.warned{background:var(--rust); border-color:var(--rust)}
body.theme-hanok .btn.primary.warned:hover{background:#83301F}
body.theme-hanok .scell.on.warned,body.theme-hanok .hcell.on.warned,
body.theme-hanok .srccell.warned,body.theme-hanok .citem.warned{background:var(--rust); border-color:var(--rust)}
body.theme-hanok .lk-title{color:var(--text)}
body.theme-hanok .chart .rb-base{fill:#EDE5D5}
body.theme-hanok .chart .rb-all{fill:#C7D6CD}
body.theme-hanok .sp-bars rect{fill:#CBD8D0}


.tset{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--border)}
.tset:last-child{border-bottom:none}
.tset label{display:flex; align-items:center; gap:6px}
.tset label span{font-size:12.5px; color:var(--text-3); font-weight:600}
.tset input[type=number]{width:78px; padding:8px 10px; font-size:15px}
.tset .btn{margin-left:auto}
.tset label.chk{margin:0}
.tsum{margin-top:12px; font-size:14px; color:var(--text-2)}
.tsum b{color:var(--text); font-size:15.5px}


/* 타임라인 예약률 칸 — 행의 범위를 선으로 표시 */
.tl-rate{width:56px; align-items:stretch; justify-content:center}
.tl-rate .rb{display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:3px}
.tl-rate .rb i{flex:1; width:1px; background:var(--border-strong); min-height:4px}
.tl-rate .rb b{font-size:12.5px; font-weight:700; color:var(--text-2); line-height:1}
.tl-row.axis .tl-rate{align-items:center}
button.blk{border:1px solid rgba(255,255,255,.3); cursor:pointer; font:inherit; text-align:left}
button.blk:hover{filter:brightness(1.15)}

/* 지표 단위 */
.metric .u{font-size:15px; font-weight:600; margin-left:2px}
.metric.tapm .s{color:var(--text-2)}


.infant.bad{border-color:var(--rust); background:var(--rust-soft)}
.infant.bad .t{color:var(--rust)}
.bigstep.bad .v{color:var(--rust)}
.bigstep.bad button{border-color:var(--rust); color:var(--rust)}
.citem.warned{background:var(--rust); border-color:var(--rust); color:#fff}
.undecided{width:100%; margin:6px 0 4px; border:1px dashed var(--border-strong);
  background:var(--surface-2); border-radius:10px; padding:14px; font-size:14.5px;
  font-weight:600; color:var(--text-2)}
.undecided.on{border-style:solid; border-color:var(--pine); background:var(--pine-soft); color:var(--pine)}

/* 마법사 세로 중앙 정렬 */
.wz-mid{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; justify-content:center}
.wz-q{padding:8px 18px 4px}
.wz-warn{margin-top:10px; font-size:13.5px; font-weight:700; color:var(--rust)}
.wz-body{flex:0 1 auto; overflow:visible}
@media (max-height:760px){ .wz-mid{justify-content:flex-start} }


/* ---------- 타임라인 가로 스크롤 (모바일) ---------- */
.tl-scroll{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  margin:0 -14px; padding:0 14px}
.tl{min-width:660px}
.tl-name{position:sticky; left:0; z-index:3; background:var(--surface);
  box-shadow:2px 0 0 var(--surface)}
.tl-rate{position:sticky; right:0; z-index:3; background:var(--surface);
  box-shadow:-2px 0 0 var(--surface)}
.tl-row.axis .tl-name,.tl-row.axis .tl-rate{background:var(--surface)}
@media (min-width:900px){
  .tl-scroll{margin:0; padding:0; overflow:visible}
  .tl{min-width:0}
  .tl-name,.tl-rate{position:static; box-shadow:none}
}

/* 예약률 칸 정렬 */
.tl-rate{width:58px; flex:none; display:flex; align-items:center; justify-content:flex-end; gap:2px}
.tl-rate .rt{font-size:12.5px; font-weight:700; color:var(--text-2); line-height:1}
.tl-rate .rb{display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; width:100%; gap:3px}
.tl-rate .rb i{flex:1; width:1px; background:var(--border-strong); min-height:5px}
.tl-rate .rb b{font-size:12.5px; font-weight:700; color:var(--text-2); line-height:1}
.tl-row{align-items:center}
.tl-row.axis .tl-rate .rt{font-size:10.5px; color:var(--text-3); font-weight:600}

/* 타임라인 블록 글자 */
button.blk{font-family:inherit; font-size:10.5px; line-height:1; padding:0 5px;
  letter-spacing:-.01em; text-align:left; overflow:hidden; text-overflow:clip}
button.blk b{font-weight:800; font-size:10.5px}
.blk .tt{font-size:9px}
@media (max-width:900px){
  button.blk, button.blk b{font-size:10px}
  .tl-name{width:78px; font-size:11.5px}
  .tl-name small{font-size:10px}
}

/* 상단바 폭을 본문과 맞춤 */
.topbar{padding:0}
.topbar-in{display:flex; align-items:center; gap:10px; width:100%;
  max-width:1720px; margin:0 auto; padding:11px 26px}
@media (max-width:1023px){ .topbar-in{padding:11px 20px} }
@media (max-width:767px){ .topbar-in{padding:10px 14px; gap:8px} }


/* ---------- 모바일 정리 ---------- */
@media (max-width:767px){
  body{font-size:15px}
  .content{padding:14px 12px 80px}
  .res-head{gap:8px; margin-bottom:14px}
  .datenav{order:1; flex:1 1 100%; gap:4px}
  .datenav .nav{width:36px; height:40px; font-size:14px}
  .datenav .rh-mid{min-width:0; flex:1; padding:2px 4px}
  .rh-d{font-size:16px}
  .head-left{order:2; flex:0 0 auto}
  .head-actions{order:3; flex:1; gap:6px}
  .head-actions .btn{flex:1; padding:11px 8px; font-size:14px}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{padding:12px 13px}
  .metric .v{font-size:24px}
  .metric .k{font-size:12px}
  .metric .s{font-size:11.5px}
  .card-b{padding:12px 12px 14px}
  .card-h{padding:12px 12px 0}
  .alertcard{max-height:none}
  .alert .a-t{font-size:13.5px}
  .alert .a-s{font-size:12px}
  .ratestrip{gap:10px; padding:11px 12px}
  .rs-t{font-size:13.5px} .rs-v{font-size:17px}
  .tl-top{gap:6px; margin-bottom:10px}
  .tl-kpi{font-size:13px} .tl-kpi b{font-size:16px}
  .tl-hours{font-size:11.5px}
  .tl-legend{font-size:11.5px}
  .tl-legends{gap:10px; padding-top:6px}
  .sect-title{margin:16px 2px 7px}
  .fold-h{padding:14px 12px}
  .topbar .title{font-size:17px}
  .topbar .state{padding:5px 9px; font-size:12px}
  .topbar .tvbtn.icon{padding:7px 9px}
  .sheet{padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
  .markgrid{grid-template-columns:1fr 1fr}
  .seatpick{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
}
@media (max-width:400px){
  .topbar .title{font-size:15.5px}
  .topbar .state .dot{display:none}
  .metric .v{font-size:22px}
}


.menu-warn{background:var(--rust-soft); border:1px solid #EFD3CC; color:var(--rust);
  border-radius:9px; padding:11px 14px; font-size:13.5px; font-weight:700; margin-bottom:14px}
.srccell.warned{background:var(--rust); border-color:var(--rust)}
.srccell.warned .s-l,.srccell.warned .s-d{color:#fff}
.srcgrid.menu2{grid-template-columns:1fr 1fr}
@media (min-width:768px){ .srcgrid.menu2{grid-template-columns:1fr 1fr; max-width:640px; margin:0 auto} }
/* 확정 / 잠정 / 경고를 구분해서 보여줍니다
   잠정 = 빗금 테두리, 경고 = 붉은색, 둘 다면 붉은색 + 빗금 테두리 */
button.blk.warned{background:var(--rust); border-color:rgba(255,255,255,.45)}
button.blk.warned.past{background:#C08476}
button.blk.tent.warned{background:var(--rust); border:1px dashed #FFE2DA}
button.blk.tent{background:#8C8067; border:1px dashed #EFE7D5}
.tl-legend i.blk.warned{background:var(--rust)}
.rrow.s-방문{opacity:.42}
.rrow.s-취소{opacity:.38}


.sheet-wide{max-width:1040px}
@media (min-width:768px){ .sheet-wide{max-width:1040px} }
.sheet-wide .chart{max-height:none}


/* ---------- 상단바 재구성 ---------- */
.topbar-in{gap:8px}
.storename{background:none; border:none; color:var(--topbar-fg); font-family:var(--serif);
  font-size:17px; font-weight:700; letter-spacing:.08em; padding:6px 8px; border-radius:8px;
  white-space:nowrap; flex:none; opacity:.95}
.storename:hover{background:var(--topbar-hover); opacity:1}
.bar-mid{flex:1; display:flex; align-items:center; justify-content:center; gap:3px; min-width:0}
.bar-title{font-family:var(--serif); font-size:17px; font-weight:700; letter-spacing:.1em; color:var(--topbar-fg)}
.bnav{background:none; border:1px solid transparent; color:var(--topbar-fg); opacity:.7;
  border-radius:7px; width:32px; height:34px; font-size:15px; font-weight:700; flex:none}
.bnav.mo{font-size:14px; opacity:.55}
.bnav:hover{background:var(--topbar-hover); opacity:1}
.bdate{background:none; border:1px solid var(--topbar-btn-line); color:var(--topbar-fg);
  border-radius:9px; padding:7px 14px; font-size:15.5px; font-weight:700; white-space:nowrap;
  min-width:0; overflow:hidden; text-overflow:ellipsis}
.bdate:hover{background:var(--topbar-hover)}
.bdate .tag{vertical-align:1px; margin-left:5px}
.bar-right{display:flex; align-items:center; gap:6px; flex:none}
.topbar .tvbtn.accent{background:rgba(245,235,217,.94); border-color:transparent; color:#4A3520; opacity:1}
.topbar .tvbtn.accent:hover{background:#fff}
.backtoday{margin-bottom:12px}
@media (max-width:1100px){
  .storename{font-size:15.5px; padding:6px}
  .topbar .tvbtn{padding:7px 10px; font-size:12.5px}
}
@media (max-width:900px){
  .topbar-in{flex-wrap:wrap; row-gap:8px}
  .bar-mid{order:3; flex:1 1 100%; justify-content:space-between}
  .bar-right{margin-left:auto}
  .bdate{flex:1; text-align:center}
}
@media (max-width:520px){
  .topbar .tvbtn:not(.icon){padding:7px 9px; font-size:12px}
  .storename{font-size:14.5px; letter-spacing:.04em}
  .bnav.mo{display:none}
}


/* 숫자 입력 버튼·팝업 */
.numbtn{width:100%; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:9px; padding:12px; font-size:17px; font-weight:700; color:var(--text)}
.numbtn small{font-size:13px; color:var(--text-3); font-weight:600; margin-left:3px}
.numbtn:hover{background:var(--surface-2)}
.numbtn.sm{width:auto; padding:8px 12px; font-size:13.5px; font-weight:700}
.numbig{display:flex; align-items:center; justify-content:center; gap:16px; margin:6px 0 18px}
.numbig button{width:66px; height:66px; border-radius:16px; border:1px solid var(--border-strong);
  background:var(--surface); font-size:28px; color:var(--text-2)}
.numbig button:disabled{opacity:.35}
.numbig .nv{min-width:100px; text-align:center; font-size:40px; font-weight:800}
.numgrid{display:grid; grid-template-columns:repeat(6,1fr); gap:7px}
.numgrid button{border:1px solid var(--border-strong); background:var(--surface); border-radius:9px;
  padding:13px 0; font-size:15.5px; font-weight:700; color:var(--text)}
.numgrid button.on{background:var(--pine); border-color:var(--pine); color:#fff}

/* 적용하기 바 */
.applybar{position:sticky; bottom:12px; display:flex; align-items:center; gap:8px; margin-top:20px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; box-shadow:0 4px 18px rgba(20,20,18,.12)}
.applybar.on{border-color:var(--amber); background:var(--amber-soft)}
.ab-t{flex:1; font-size:13.5px; font-weight:700; color:var(--text-2)}
.applybar.on .ab-t{color:var(--amber)}
.applybar .btn:disabled{opacity:.4}


.zone{border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:12px; background:var(--surface)}
.z-h{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.z-name{flex:1; padding:9px 11px; font-size:15px; font-weight:700}
.z-join{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-top:10px; border-top:1px solid var(--border)}
.z-cap{font-size:12.5px; color:var(--text-3)}
.z-cap b{color:var(--text)}
.tset{display:flex; align-items:center; gap:8px; padding:6px 0}
.tset .numbtn.sm{flex:1}


/* PIN 자리 — 채울 때마다 매장 이름이 한 글자씩 */
.pdots{gap:12px}
.pdot{width:52px; height:52px; border-radius:14px; border:1.5px solid var(--border-strong);
  background:var(--surface); display:grid; place-items:center;
  font-size:24px; font-weight:700; color:transparent; transition:all .18s ease}
.pdot.on{background:var(--pine); border-color:var(--pine); color:#fff;
  transform:translateY(-2px); box-shadow:0 4px 12px rgba(30,74,60,.28)}
.pdot.f1{font-family:'Nanum Myeongjo',serif}
.pdot.f2{font-family:'Noto Serif KR',serif; font-weight:800}
.pdot.f3{font-family:'Pretendard','Noto Sans KR',sans-serif; font-weight:800}
.pdot.f4{font-family:'Nanum Myeongjo',serif; font-weight:800; font-style:italic}
.lk-title{font-family:var(--serif); font-size:23px; letter-spacing:.06em}
.lk-back{margin-top:14px; background:none; border:none; color:var(--text-3);
  font-size:13px; font-weight:600; text-decoration:underline}
.lk-back:hover{color:var(--text-2)}
@media (max-width:380px){ .pdot{width:46px; height:46px; font-size:21px} .pdots{gap:9px} }


/* 예약 목록 — 지난 예약 표시 */
.rr-bang{width:12px; flex:none; font-weight:900; color:var(--rust); font-size:15px; text-align:center}
.rrow.late{opacity:.55}
.rrow.late .rr-bang{opacity:1}
.rrow.s-방문,.rrow.s-취소,.rrow.s-노쇼{opacity:.4}
.rrow.s-노쇼{opacity:.55}
.rr-seat{max-width:150px; overflow:hidden; text-overflow:ellipsis}

/* PIN 자리 — 작은 빈 원, 채우면 글자만 색이 들어옴 */
.pdots{gap:16px}
.pdot{width:38px; height:38px; border-radius:50%; border:1.5px solid var(--border-strong);
  background:transparent; display:grid; place-items:center;
  font-size:21px; font-weight:700; color:transparent; transition:all .2s ease; box-shadow:none}
.pdot.on{background:transparent; border-color:transparent; color:var(--pine); transform:none; box-shadow:none}
body.theme-hanok .pdot.on{color:var(--pine)}


/* 지표 5개 배치 */
@media (min-width:768px){ .metrics{grid-template-columns:repeat(5,1fr)} }
@media (max-width:767px){
  .metrics{grid-template-columns:1fr 1fr}
  .metric:nth-child(5){grid-column:1 / -1}
}
.metric.amber .v{color:var(--amber)}
.metric.amber{background:var(--amber-soft)}
.metric.warn{background:var(--rust-soft)}


.checkbox-scroll{max-height:58vh; overflow-y:auto; padding-right:2px}
.pkey.sub{font-size:20px; font-weight:400}


/* ---------- 타임라인 정렬 바로잡기 ----------
   좌석 이름이 두 줄이라 행 높이보다 커지면서 그래프와 어긋났습니다.
   이름을 한 줄로 두고, 행 높이는 그래프 높이가 정하도록 합니다. */
.tl-row{align-items:center; min-height:30px}
.tl-name{
  width:104px; flex:none; height:auto;
  display:flex; align-items:baseline; gap:5px;
  font-size:12.5px; line-height:1.2; white-space:nowrap; overflow:hidden;
}
.tl-name b{font-weight:700; color:var(--text)}
.tl-name small{font-size:10.5px; font-weight:500; color:var(--text-3)}
/* flex-direction 을 명시하지 않으면 앞선 규칙의 column 이 남아
   justify-content:flex-end 가 '아래쪽 정렬'로 작동합니다 */
.tl-rate{display:flex; flex-direction:row; align-items:center; justify-content:flex-end}
.tl-rate .rb{flex-direction:column}
.tl-rate .rb{height:100%}
@media (max-width:900px){
  .tl-name{width:92px; font-size:11.5px}
  .tl-name small{font-size:9.5px}
}

/* 상단 매장명 세로 정렬 */
.topbar-in{align-items:center}
.storename{display:inline-flex; align-items:center; line-height:1.15; height:36px}
.topbar .home{height:36px}
.bdate{display:inline-flex; align-items:center; height:38px; line-height:1}
.bnav{display:inline-flex; align-items:center; justify-content:center; line-height:1}
.topbar .tvbtn{display:inline-flex; align-items:center; height:36px; line-height:1}
.bar-title{display:inline-flex; align-items:center; height:36px; line-height:1}


/* ============================================================
   디스플레이 모드 — 여백 정리
   바깥 여백을 넓히고, 카드 안쪽도 숨 쉴 공간을 줍니다.
   ============================================================ */
.tv{
  padding:clamp(20px,3.4vh,46px) clamp(26px,3.6vw,72px) clamp(18px,2.6vh,38px);
}
.tv-h{padding-bottom:clamp(14px,2.6vh,32px)}
.tv-h h1{margin-top:clamp(8px,1.4vh,16px)}
.tv-line{margin-top:clamp(12px,2.2vh,26px)}

.tv-grid{gap:clamp(10px,1.7vh,22px)}
.tv-row{gap:clamp(10px,1.5vw,26px)}

.dsec{
  border-radius:16px;
  padding:clamp(14px,2vh,26px) clamp(14px,1.5vw,26px) clamp(12px,1.8vh,22px);
  background:linear-gradient(180deg, rgba(10,13,18,.74), rgba(6,9,13,.84));
  border:1px solid rgba(214,190,138,.22);
  box-shadow:0 6px 26px rgba(0,0,0,.30);
}
.dsec.hall{background:linear-gradient(180deg, rgba(32,27,17,.72), rgba(18,15,10,.84));
  border-color:rgba(200,168,110,.30)}

.dsec h3{
  margin:0 0 clamp(10px,1.6vh,20px);
  padding-bottom:clamp(9px,1.3vh,16px);
  gap:10px;
}
.dsec ul{gap:clamp(4px,.75vh,11px)}
.dsec ul.two-col{gap:clamp(4px,.75vh,11px) clamp(16px,2vw,38px)}
.dsec li{padding:clamp(1px,.2vh,3px) 0}
.dsec li.none{padding-top:clamp(4px,.8vh,10px)}

.tv-f{
  padding-top:clamp(14px,2.4vh,28px);
  margin-top:clamp(12px,2vh,24px);
  letter-spacing:.26em; text-indent:.26em;
}

/* 좁은 화면에서는 여백을 줄여 잘리지 않게 */
@media (max-width:900px){
  .tv{padding:18px 16px 14px}
  .tv-grid{gap:10px}
  .tv-row{gap:10px}
  .dsec{padding:12px 12px 10px; border-radius:12px}
}


/* 설정 소제목 */
.subhead{font-size:13px; font-weight:800; color:var(--text-2); margin:18px 0 10px;
  padding-bottom:6px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:8px}
.subhead:first-child{margin-top:0}
.subhead span{font-size:11.5px; font-weight:500; color:var(--text-3)}

/* 디스플레이 배치 */
.disprow{border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:9px; background:var(--surface)}
.disprow.over{border-color:var(--rust); background:var(--rust-soft)}
.dr-title{font-size:12.5px; font-weight:700; color:var(--text-2); margin-bottom:8px}
.dr-title span{font-weight:500; color:var(--text-3); margin-left:5px}
.disprow.over .dr-title span{color:var(--rust); font-weight:700}
.dr-cells{display:flex; flex-wrap:wrap; gap:6px}
.dcell{display:inline-flex; align-items:center; gap:3px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:8px; padding:6px 6px 6px 10px; font-size:13px; font-weight:600}
.dcell button{width:22px; height:22px; border:1px solid var(--border); background:var(--surface);
  border-radius:5px; font-size:9px; color:var(--text-3); padding:0}
.dcell button:disabled{opacity:.3}


/* 범례 색 견본 — 타임라인 블록(.blk)은 absolute 라 그대로 쓰면 글자와 겹칩니다 */
.lgsw{display:inline-block; position:static; width:15px; height:11px; border-radius:3px;
  vertical-align:-1px; flex:none}
.lgsw.ok{background:var(--pine)}
.lgsw.tent{background:#8C8067; border:1px dashed #EFE7D5}
.lgsw.warn{background:var(--rust)}
.tl-legend{display:inline-flex; align-items:center; gap:6px}

/* 예약률 칸 — 기준선이 있는 행과 없는 행의 좌우 위치를 맞춥니다 */
.tl-rate{justify-content:center}
.tl-rate .rb{width:auto; min-width:34px}
.tl-rate .rt{width:100%; text-align:center}

/* 모바일: 좌석 이름·예약률도 같이 스크롤 */
@media (max-width:899px){
  .tl-name,.tl-rate{position:static; box-shadow:none}
  .tl-row.axis .tl-name,.tl-row.axis .tl-rate{background:transparent}
}


/* ============================================================
   디자인 정리 — 오래 봐도 편한 톤으로
   1) 배경은 따뜻한 종이색, 카드는 흰색으로 대비를 준다
   2) 색은 세 가지만 쓴다: 청록(주요) · 금(강조선) · 벽돌(경고)
   3) 그림자는 얇게, 테두리는 한 겹만
   ============================================================ */
body.theme-hanok{
  --bg:#F7F4ED;            /* 한지 — 이전보다 밝고 노란기 절제 */
  --surface:#FFFFFF;       /* 카드는 흰색 (대비를 만들어 정보가 또렷해짐) */
  --surface-2:#F5F2EA;
  --border:#E7E1D5;
  --border-strong:#D2C9B8;
  --text:#1F1B15;
  --text-2:#5A5245;
  --text-3:#8D8577;
  --pine:#2F5D4E;          /* 청록 — 주요 동작 */
  --pine-soft:#E9F0EC;
  --gold:#B08D57;          /* 금 — 얇은 강조선에만 */
  --amber:#8A6114;
  --amber-soft:#FAF2E1;
  --rust:#A8442E;          /* 벽돌 — 경고 */
  --rust-soft:#FBEAE5;
  --shadow:0 1px 2px rgba(60,48,30,.06);
  --topbar-bg:linear-gradient(180deg,#5F4B33,#4A3826);
  --topbar-fg:#F6EEDF;
  --topbar-line:#3A2B1C;
  --topbar-btn-line:rgba(246,238,223,.34);
  --topbar-hover:rgba(246,238,223,.14);
  background-image:none;   /* 세로 결 무늬 제거 — 카드 대비로 충분 */
}

/* 상단바 아래 금색 실선 한 겹 */
body.theme-hanok .topbar{box-shadow:0 1px 0 var(--gold), 0 3px 14px rgba(60,48,30,.16)}

/* 구역 제목 앞에 짧은 금색 표식 */
.sect-title{display:flex; align-items:center; gap:7px}
.sect-title::before{content:""; width:3px; height:12px; background:var(--gold); border-radius:2px; flex:none}

/* 카드 — 테두리 한 겹 + 얇은 그림자 */
.card{border-radius:12px; border-color:var(--border)}
.metrics{gap:1px; background:var(--border)}
.metric{padding:15px 16px}
.metric .v{letter-spacing:-.03em}
.metric .k{color:var(--text-3); letter-spacing:.01em}

/* 접이식 카드 머리 */
.fold-h{padding:15px 16px}
.fh-t{font-size:15px; letter-spacing:.01em}

/* 버튼 — 모서리와 두께를 통일 */
.btn{border-radius:9px; padding:10px 15px}
.btn.primary{box-shadow:0 1px 2px rgba(47,93,78,.22)}
.btn.sm{border-radius:8px}
.topbar .tvbtn{border-radius:9px}
.topbar .tvbtn.accent{background:#F6EEDF; color:#4A3826; font-weight:700}

/* 타임라인 — 선은 얇게, 블록은 부드럽게 */
.tl-track{border-radius:8px; background:#FAF8F3}
.blk{border-radius:5px}
.tl-kpi{font-size:13.5px; color:var(--text-2)}
.tl-kpi b{font-size:17px; color:var(--pine)}
.tl-kpi.sub b{font-size:14.5px; color:var(--text-2); font-weight:700}
.tl-note{font-size:11.5px; color:var(--text-3)}
.tl-kpis{gap:14px}

/* 목록 행 */
.rrow{padding:12px 8px}
.rr-t{color:var(--text)}
.tag{border-radius:7px}
.pill{border-radius:7px}

/* 시트·팝업 */
.sheet{border-radius:16px 16px 0 0}
@media (min-width:768px){ .sheet{border-radius:14px} }
.modal{border-radius:14px}
.sheet-h h2{letter-spacing:-.01em}

/* 입력 요소 */
input,select,textarea{border-radius:9px; border-color:var(--border-strong)}
input:focus,select:focus{outline-color:var(--pine)}


/* ============================================================
   디자인 개편 — 먹색 + 아이보리, 각진 모서리
   앱 화면은 고딕만 씁니다. 명조는 디스플레이 모드에만 남깁니다.
   ============================================================ */
body.theme-hanok{
  --bg:#F2F0EB;            /* 아이보리 */
  --surface:#FFFFFF;
  --surface-2:#F6F4F0;
  --border:#E3E0D9;
  --border-strong:#C7C3BA;
  --text:#171614;          /* 먹 */
  --text-2:#57544D;
  --text-3:#8E8A82;
  --pine:#1F1E1B;          /* 주요 동작 = 먹색 */
  --pine-soft:#EFEDE8;
  --gold:#1F1E1B;
  --amber:#8A6A12;
  --amber-soft:#F8F1DE;
  --rust:#A63B26;
  --rust-soft:#FAE9E4;
  --shadow:0 1px 0 rgba(23,22,20,.04);
  --topbar-bg:#1B1A18;
  --topbar-fg:#F4F2EE;
  --topbar-line:#000;
  --topbar-btn-line:rgba(244,242,238,.26);
  --topbar-hover:rgba(244,242,238,.12);
  background-image:none;
}
/* 앱 화면에서는 명조를 쓰지 않습니다 (디스플레이 모드만 예외) */
body.theme-hanok .topbar .title,
body.theme-hanok .storename,
body.theme-hanok .bar-title,
body.theme-hanok .sect-title,
body.theme-hanok .card-h h2,
body.theme-hanok .rh-d,
body.theme-hanok .metric .v,
body.theme-hanok .lk-title,
body.theme-hanok .fh-t,
.serif, h1, h2{font-family:var(--sans)}
.storename,.bar-title{letter-spacing:-.01em; font-weight:800}

/* 각진 모서리 */
.card,.sheet,.modal,.calbox,.zone,.disprow,.dayrow{border-radius:4px}
.btn,.tvbtn,.numbtn,.togglebtn,.nav,.bnav,.bdate,input,select,textarea,
.seg button,.filters button,.markbtn,.spick,.citem,.ptile,.scell,.srccell,
.hcell,.pkey,.roomcell,.sb-cell,.alert,.tl-track,.blk,.tag,.pill,.tset,
.mtrack,.mfill,.numgrid button,.wbtn,.dcell,.applybar,.pmore,.nonebtn{border-radius:3px}
.tl-track{border-radius:2px}
.blk{border-radius:2px}
.pdot{border-radius:3px}
.mknob{border-radius:3px}
.bigstep button,.numbig button{border-radius:4px}
.sheet{border-radius:4px 4px 0 0}

/* ============================================================

   모바일에서 아래로 내려갈수록 어느 좌석인지 놓치지 않게 합니다.
   ============================================================ */
.tl-name{
  position:sticky; left:0; z-index:4;
  background:var(--surface);
  justify-content:flex-end;      /* 오른쪽 정렬 — 그래프와 붙어 읽기 쉽게 */
  text-align:right;

}

@media (min-width:900px){
  .tl-name{position:static; box-shadow:none; padding-right:0}
}


/* ============================================================
   타임라인 고정 열 — 가운데 정렬 + 스크롤될 때 그래프가 비치지 않게
   ============================================================ */
.tl-scroll{position:relative}
.tl-name{
  position:sticky; left:0; z-index:5;
  width:88px; flex:none;
  display:flex; align-items:center; justify-content:center;   /* 가운데 정렬 */
  text-align:center; padding:0 8px 0 0;
  background:var(--surface);
  box-shadow:6px 0 6px -4px rgba(23,22,20,.10), 1px 0 0 var(--border);
}
/* 고정 열이 스크롤 영역 전체 높이를 덮도록 */
.tl-name::before{
  content:""; position:absolute; top:-3px; bottom:-3px; left:-14px; right:0;
  background:var(--surface); z-index:-1;
}
.tl-row.axis .tl-name{background:var(--surface)}
.tl-row.axis .tl-name::before{background:var(--surface)}
.tl-name b{font-weight:700}
.tl-name small{margin-left:4px}
@media (max-width:900px){
  .tl-name{width:80px; font-size:11.5px}
  .tl-name small{font-size:9.5px}
}
@media (min-width:900px){
  .tl-name{position:static; box-shadow:none; padding-right:9px;
    justify-content:flex-end; text-align:right; width:104px}
  .tl-name::before{display:none}
}


/* 고정된 좌석 이름 칸 — 뒤로 그래프가 비치지 않게 완전히 덮습니다 */
.tl-name{background:transparent; box-shadow:none}
.tl-name::before{
  content:""; position:absolute; z-index:0;
  top:-4px; bottom:-4px; left:-20px; right:0;
  background:var(--surface);
  box-shadow:7px 0 7px -5px rgba(23,22,20,.14), 1px 0 0 var(--border);
}
.tl-name b,.tl-name small{position:relative; z-index:1}
.tl-row.axis .tl-name::before{box-shadow:1px 0 0 transparent}
@media (min-width:900px){
  .tl-name::before{display:none}
  .tl-name{background:transparent}

/* ============================================================
   디스플레이 모드 — 세로 화면에서는 가로 미리보기로 축소
   TV 비율(16:9)을 유지한 축소판을 화면 가운데 띄웁니다.
   ============================================================ */
@media (orientation:portrait) and (max-width:820px){
  .tv{
    display:grid; place-items:center;
    padding:0; background:#0B0D11;
  }
  .tv-stage{
    width:100vw; height:56.25vw;          /* 16:9 */
    max-height:100vh; position:relative; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  /* 안쪽 내용을 TV 크기(1280x720)로 그린 뒤 통째로 줄입니다 */
  .tv-inner{
    position:absolute; top:0; left:0;
    width:1280px; height:720px;
    transform:scale(calc(100vw / 1280));
    transform-origin:top left;
    display:flex; flex-direction:column;
    padding:26px 34px 22px;
  }
  .tv-note{
    position:absolute; left:0; right:0; bottom:calc(50% - 56.25vw / 2 - 42px);
    text-align:center; color:#8E8A80; font-size:12px; letter-spacing:.04em;
  }
}


/* ---------- 디스플레이 기본 구조 ---------- */
.tv{padding:0}
.tv-stage{position:absolute; inset:0; overflow:hidden}
.tv-inner{
  position:absolute; inset:0; z-index:1;
  display:flex; flex-direction:column;
  padding:clamp(20px,3.4vh,46px) clamp(26px,3.6vw,72px) clamp(18px,2.6vh,38px);
}
.tv::after{z-index:0}
.tv-note{display:none}
.tv-h, .tv-grid, .tv-f{position:relative; z-index:1}

/* 세로로 든 휴대폰 — 가운데에 가로 미리보기 */
@media (orientation:portrait) and (max-width:820px){
  .tv{display:grid; place-items:center; background:#07090C}
  .tv-stage{
    position:relative; inset:auto;
    width:100vw; height:56.25vw; max-height:80vh;
    box-shadow:0 12px 44px rgba(0,0,0,.55);
    border:1px solid rgba(214,190,138,.18);
  }
  .tv-inner{
    inset:auto; top:0; left:0;
    width:1280px; height:720px;
    transform:scale(calc(100vw / 1280)); transform-origin:top left;
    padding:26px 34px 22px;
  }
  .tv::after{inset:0}
  .tv-note{
    display:block; position:absolute; left:0; right:0;
    top:calc(50% + 28.125vw + 18px);
    text-align:center; color:#7E7A72; font-size:12px; letter-spacing:.03em;
  }
  .tv-exit{top:auto; bottom:18px; right:50%; transform:translateX(50%)}
}


/* ---------- 세로 화면: 미리보기 / 크게 보기 ---------- */
@media (orientation:portrait) and (max-width:820px){
  .tv-note{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    position:absolute; left:0; right:0; top:calc(50% + 28.125vw + 16px);
    padding:0 20px; text-align:center;
  }
  .tv-note b{color:#D8D2C6; font-size:13.5px; font-weight:700; letter-spacing:.02em}
  .tv-note span{color:#8A857C; font-size:11.5px; line-height:1.5}
  .tv-zoom{
    margin-top:6px; background:rgba(244,242,238,.10); border:1px solid rgba(244,242,238,.28);
    color:#E4DFD5; border-radius:3px; padding:9px 18px; font-size:12.5px; font-weight:600;
  }
  .tv-zoom:active{background:rgba(244,242,238,.2)}

  /* 크게 보기 — 실제 크기(1280x720)로 두고 손가락으로 밀어서 봅니다 */
  .tv.zoomed{place-items:stretch; padding:0}
  .tv.zoomed .tv-stage{
    width:100vw; height:100vh; max-height:none;
    overflow:auto; -webkit-overflow-scrolling:touch;
    border:none; box-shadow:none;
  }
  .tv.zoomed .tv-inner{
    position:relative; width:1280px; height:720px; transform:none;
  }
  .tv.zoomed .tv-bgs{position:absolute; width:1280px; height:720px}
  .tv.zoomed::after{position:absolute; width:1280px; height:720px; inset:auto}
  .tv.zoomed .tv-note{
    position:fixed; top:auto; bottom:14px; left:0; right:0; z-index:6;
    background:rgba(7,9,12,.86); padding:10px 20px;
  }
  .tv.zoomed .tv-note span{display:none}
  .tv.zoomed .tv-exit{position:fixed; top:12px; right:12px; bottom:auto; transform:none}
}

<div id="app"></div>

<script>
/* 오래된 브라우저에서 스크립트가 멈추면 흰 화면 대신 안내를 띄웁니다 */
window.onerror = function(msg){
  var app = document.getElementById("app");
  if(app && !app.getAttribute("data-ok")){
    app.innerHTML = '<div style="max-width:420px;margin:14vh auto;padding:28px;text-align:center;'+
      'font-family:sans-serif;color:#333;border:1px solid #ddd;border-radius:4px">'+

      'TV 브라우저를 최신으로 업데이트하거나,<br>크롬캐스트·미니PC·스틱PC를 연결해 사용해 주세요.</div>'+
      '<div style="font-size:11px;color:#aaa;margin-top:16px;word-break:break-all">'+String(msg)+'</div></div>';
  }
  return false;
};
/* ============================================================
   데이터 정의
   ============================================================ */
const STORAGE_KEY = "hanok-admin-v2";

const DEFAULT_DATA = {

        holiday:{open:"11:00", close:"22:00", lo:"20:40", bs:"", be:""}
      }],
