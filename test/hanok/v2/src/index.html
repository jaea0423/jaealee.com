<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한옥반점 · 안집 통합 관리 [v2]</title>
<!-- 본문: Pretendard / 제목: Noto Serif KR — 기기에 설치돼 있지 않아도 같은 글꼴로 보이게 불러옵니다 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* ============================================================
   CSS 구조 안내 — 고치기 전에 읽으세요

   예전에는 요청이 올 때마다 파일 끝에 덮어쓰기 블록을 붙였습니다.
   그래서 .tl-name 하나가 13군데에 흩어져 있었고, 앞의 값을 고쳐도
   뒤의 블록이 덮어써서 화면이 안 바뀌는 일이 반복됐습니다.
   (파일 끝에 둔 clamp 폴백이 모든 브라우저에서 앞의 clamp 를 덮어써
    디스플레이 글자가 한 달 가까이 19px 고정이었던 사고가 그 예입니다)

   지금은 이렇게 나눠 둡니다. 새 규칙은 반드시 해당 구역에 넣으세요.
     1. 토큰 (:root)                 색·글꼴·반경 변수
     2. 리셋 · 기본 타이포             body, 입력 요소
     3. 공통 부품                     버튼 / 태그 / 카드 / 접기 / 목록 행 / 입력 / 표 / 차트 / 안내 띠
     4. 레이아웃                      상단바 / shell / content / 날짜 이동 / 화면 배율(zoom)
     5. 대시보드                      지표 / 타임라인 / 예약 목록 / 좌석 보드
     6. 예약                          시트 / 달력 팝업 / 등록 마법사 7단계 / 문자 / 확인창
     7. 설정                          폴드 안의 표·편집 부품
     8. 잠금 · 매장 선택
     9. 테마 (body.theme-hanok)       기본 테마 — 설정에서 basic 으로 바꿀 수 있음
    10. 손님용 화면                    .tv / .dsec / .intro — 관리 화면과 다른 언어(명조·한지색)를 일부러 씁니다
    11. 반응형                        @media 규칙. 원본의 앞뒤 순서를 지킵니다 (겹치는 조건은 뒤가 이기므로 폭 순으로 재배열하면 화면이 바뀝니다)
    12. 구형 브라우저 폴백              반드시 @supports 안에. 밖에 두면 모든 브라우저에서 앞의 값을 덮어씁니다

   규칙
   - 같은 셀렉터는 한 곳에만 씁니다. 이미 있으면 그 블록을 고치세요. 끝에 새로 붙이지 마세요.
   - CSS 는 우선순위가 같으면 뒤에 온 것이 이깁니다. 블록 순서를 옮길 때는 같은 요소에 같이 걸리는
     다른 규칙(예: .tl-name 과 .tl-row.axis .tl-name)이 앞뒤로 바뀌지 않는지 확인하세요.
   - 손님용 TV(2018~2020년 크롬)에서 죽는 문법은 쓰지 않습니다: inset 단축, backdrop-filter,
     color-mix(), :has(), @container. 새로 쓸 때는 top/right/bottom/left 로 풀어 쓰세요.
   - 배율은 zoom 입니다(.shell .lock .modal-ov). transform:scale 은 자리를 그대로 차지해 화면이 잘립니다.
   ============================================================ */



/* ============================================================
   1. 토큰
   ============================================================ */
/* ============================================================
   디자인 토큰 — 색/간격/글자/반경을 바꾸려면 여기만 수정
   방향: "온종일 보는 업무 도구". 장식 최소화, 대비와 정렬로 읽히게.
   ============================================================ */
:root{
  /* ---- 색 (basic 테마 값. 기본 테마인 한옥은 9구역 body.theme-hanok 이 덮어씁니다) ---- */
  --bg:#F4F4F1;          /* 화면 바탕 (중성 회색) */
  --surface:#FFFFFF;     /* 카드 */
  --surface-2:#FAFAF8;   /* 카드 안쪽 구역 */
  --border:#E3E2DC;      /* 실선 */
  --border-strong:#CFCDC4;
  --text:#1B1B19;        /* 본문 */
  --text-2:#5F5E58;      /* 보조 */
  --text-3:#8E8C84;      /* 라벨 */
  --pine:#1E4A3C;        /* 강조 — 확정/주요 버튼 */
  --pine-soft:#E8F0EC;
  --amber:#8A6114;       /* 주의 */
  --amber-soft:#FAF1DC;
  --rust:#9C3B27;        /* 경고 */
  --rust-soft:#FAE9E5;
  /* 상단바 (테마별로 바뀝니다) */
  --topbar-bg:var(--surface); --topbar-fg:var(--text); --topbar-line:var(--border);
  --topbar-btn-line:var(--border-strong); --topbar-hover:var(--surface-2);
  /* 변동 표시 — 사장님의 파란 펜. 아이보리 배경에서 먹색·벽돌색과 확실히 갈립니다.
     테마가 바뀌어도 같은 색입니다 (당일 변동 전용 뜻 — 액센트로 쓰지 마세요) */
  --blue:#1F4E79; --blue-soft:#EAF1F8; --blue-line:#C6D9EA; --blue-mark:#3A7BB8;

  /* ---- 글꼴 ---- */
  --sans:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  /* 디스플레이 모드 전용 — 손님이 보는 화면이라 더 고풍스러운 명조를 씁니다 */
  --serif-tv:'Nanum Myeongjo','Noto Serif KR',serif;

  /* ---- 간격 계단 (Phase 1) — 4의 배수만 씁니다. 6·7·9·11·13px 같은 어중간한 값은 계단으로 맞춰 갑니다 ----
     안쪽 여백·요소 사이 간격·바깥 여백 전부 이 일곱 개로. 손가락으로 쓰는 화면이라 4px 아래 차이는 뜻이 없습니다 */
  --s4:4px;   --s8:8px;   --s12:12px;  --s16:16px;  --s24:24px;  --s32:32px;  --s48:48px;

  /* ---- 글자 크기 계단 (Phase 1) — 여섯 단. 한글은 라틴보다 작아 보이므로 영문 기준보다 한 단 큽니다 ----
     라벨 11 / 보조 13 / 본문 15 / 제목 17 / 큰 제목 20 / 지표 숫자 28.
     이 밖의 크기(12·12.5·13.5·14·16·18…)는 계단으로 맞춰 갑니다. TV 화면은 --tvu 배수라 여기 해당 없음 */
  --fs-label:11px;  --fs-sub:13px;  --fs-body:15px;  --fs-title:17px;  --fs-head:20px;  --fs-num:28px;
  --fs-big:40px;   /* 인원 타일·숫자 팝업의 큰 숫자 전용 (28 로 눌리면 카운터에서 안 읽힘) */

  /* ---- 모서리 반경 계단 (Phase 1) — 세 단. 작은 것(배지·입력) / 보통(버튼·카드) / 큰 것(시트·완료 상자) ----
     지금 화면은 '각진 모서리' 개편 때의 3px 이 대부분이라 아직 이 값을 쓰는 곳이 거의 없습니다.
     Phase 1-B 에서 3→6 으로 옮길지 결정합니다. --r 은 옛 이름(카드 10px)으로 남겨 둔 것 */
  --r-sm:6px;  --r-md:10px;  --r-lg:16px;
  --r:10px;
  --shadow:0 1px 2px rgba(27,27,25,.05);

  /* ---- 사진 (build.py 가 base64 로 채웁니다 — 자리표시자를 지우거나 바꾸지 마세요) ---- */
  --img-anjip:url('data:image/jpeg;base64,__ANJIP_B64__');
  --img-hanok:url('data:image/jpeg;base64,__HANOK_B64__');
  --bg1:url('data:image/jpeg;base64,__BG1_B64__');
  --bg2:url('data:image/jpeg;base64,__BG2_B64__');
  --bg3:url('data:image/jpeg;base64,__BG3_B64__');
  --bg4:url('data:image/jpeg;base64,__BG4_B64__');
  --bg5:url('data:image/jpeg;base64,__BG5_B64__');
  --bg6:url('data:image/jpeg;base64,__BG6_B64__');
  --bg7:url('data:image/jpeg;base64,__BG7_B64__');
}


/* ============================================================
   2. 리셋 · 기본 타이포
   ============================================================ */
*{box-sizing:border-box}
html, body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:var(--fs-title); line-height:1.6;
  -webkit-text-size-adjust:100%;
  /* 맥·윈도우에서 글자 두께가 다르게 보이는 문제 완화 */
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.012em; word-break:keep-all;
  font-feature-settings:"tnum" 1,"case" 1;
  /* 숫자 폭을 고르게 — 표에서 자릿수가 흔들리지 않음 */
  font-variant-numeric:tabular-nums;
}
/* 관리 화면은 고딕만 씁니다. 명조는 손님용 디스플레이 모드(.tv)에만 남깁니다 */
h1, h2{font-family:var(--sans)}
button{font-family:inherit; cursor:pointer}

/* 입력 요소 */
input, select, textarea{
  width:100%; background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--r-sm); padding:var(--s12) var(--s12);
  font-size:var(--fs-title); /* 16px 미만이면 iOS에서 입력 시 화면이 확대됨 */
  color:var(--text); font-family:inherit;
}
/* 입력창도 손가락으로 누르므로 44px 이상 (textarea 는 여러 줄이라 제외) */
input, select{min-height:44px}
input:focus, select:focus{outline:2px solid var(--pine); outline-offset:-1px; border-color:transparent}
:focus-visible{outline:2px solid var(--pine); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}


/* ============================================================
   3. 공통 부품
   ============================================================ */
/* ---------- 누르는 것 공통 (Phase 3-1) ----------
   카운터에서 손가락으로 쓰는 화면이라, 누를 수 있는 것은 전부 높이 44px 이상으로 둡니다 (애플 HIG 최소 터치 크기).
   누르는 순간 살짝 어두워져 '눌렸다'가 바로 보이게 합니다 — 지금까지는 :active 가 한 군데뿐이라 두 번 누르는 일이 생겼습니다.
   transform:scale 은 배율(zoom)과 부딪혀 화면이 잘리므로 쓰지 않고 filter 로만 합니다.
   ※ 타임라인 블록(button.blk)은 그래프 행 높이를 따르므로 44px 규칙에서 뺍니다. 작은 ± 버튼(.dcell button)은 36px. */
.btn, .topbar .tvbtn, .topbar .home, .storename, .bnav, .bdate,
.seg button, .filters button, .hourpick button, .wbtn, .numbtn, .numgrid button, .mfine button,
.markbtn, .sbtn, .spick, .nonebtn, .togglebtn, .pkey, .wz-back, .wz-dot,
.mo-h .nav, .datenav .nav, .res-head .nav, .cal-nav .nav, .sheet-h .x, .linkbtn, .lk-back{
  min-height:44px;
}
.bnav{min-width:36px}
.sheet-h .x{min-width:44px; display:inline-flex; align-items:center; justify-content:center}
.linkbtn, .lk-back{display:inline-flex; align-items:center}
.btn, .topbar .tvbtn, .topbar .home, .storename, .bnav, .bdate,
.seg button, .filters button, .hourpick button, .wbtn, .numbtn, .numgrid button, .numbig button, .bigstep button, .mfine button,
.markbtn, .sbtn, .spick, .nonebtn, .togglebtn, .pkey, .wz-back, .wz-dot,
.mo-h .nav, .datenav .nav, .res-head .nav, .cal-nav .nav, .sheet-h .x, .linkbtn, .lk-back, .dcell button,
.undecided, .pmore, .ptile, .scell, .hcell, .srccell, .citem, button.bday,
.rrow, .alert, button.metric, .fold-h, .tapzone, .bh-row, .smsrow, button.blk{
  -webkit-tap-highlight-color:transparent;
  transition:filter .08s ease-out;
}
.btn:active, .topbar .tvbtn:active, .topbar .home:active, .storename:active, .bnav:active, .bdate:active,
.seg button:active, .filters button:active, .hourpick button:active, .wbtn:active, .numbtn:active, .numgrid button:active, .numbig button:active, .bigstep button:active, .mfine button:active,
.markbtn:active, .sbtn:active, .spick:active, .nonebtn:active, .togglebtn:active, .pkey:active, .wz-back:active, .wz-dot:active,
.mo-h .nav:active, .datenav .nav:active, .res-head .nav:active, .cal-nav .nav:active, .sheet-h .x:active, .linkbtn:active, .lk-back:active, .dcell button:active,
.undecided:active, .pmore:active, .ptile:active, .scell:active, .hcell:active, .srccell:active, .citem:active, button.bday:active,
.rrow:active, .alert:active, button.metric:active, .fold-h:active, .tapzone:active, .bh-row:active, .smsrow:active, button.blk:active{
  filter:brightness(.9);
}

/* ---------- 버튼 ----------
   기본은 흰 바탕 + 회색 테두리, primary 는 먹색. 모서리는 버튼류 전부 --r-sm(6px) 으로 통일했습니다 (Phase 3-1).
   높이는 위 '누르는 것 공통' 의 min-height 44px 이 정하고, .sm 은 글자만 작습니다 */
.btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text); font-size:var(--fs-body); font-weight:600; padding:var(--s12) var(--s16); border-radius:var(--r-sm); line-height:20px}
.btn.primary{color:#fff; background:var(--text); border-color:var(--text); box-shadow:none}
.btn.ghost{border-color:transparent; background:var(--surface-2); color:var(--text-2)}
.btn.danger{border-color:var(--rust); color:var(--rust); background:var(--surface)}
.btn.danger-fill{background:var(--rust); border-color:var(--rust); color:#fff}
.btn.danger-fill:hover{background:#8A3324}
/* 경고가 걸린 채로 진행하는 '다음' 버튼 — 막지는 않되 붉게 알립니다 */
.btn.primary.warned{background:var(--rust); border-color:var(--rust)}
.btn.primary.warned:hover{background:#8A3324}
/* ※ .btn.primary:hover 는 .warned 와 우선순위가 같아 반드시 그 뒤에 와야 합니다 (원본 순서 그대로).
   앞에 두면 경고 버튼에 마우스를 올렸을 때 먹색으로 돌아갑니다 */
.btn.primary:hover{background:#2B2926}
.btn.sm{padding:var(--s8) var(--s12); font-size:var(--fs-sub); border-radius:var(--r-sm)}
.btn.lg{padding:var(--s16) var(--s24); font-size:var(--fs-title); border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn.grow{flex:1}
.btn.off{opacity:.4}
.btn-row{display:flex; gap:var(--s8); flex-wrap:wrap}
.linkbtn{background:none; border:none; color:var(--pine); font-weight:700; padding:0; text-decoration:underline}

/* 선택형 버튼 그룹 (예약경로·상태) — 고른 것은 먹색으로 뒤집힘 */
.seg{display:flex; gap:var(--s8); flex-wrap:wrap}
.seg button{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2); padding:var(--s8) var(--s12); font-size:var(--fs-body); font-weight:600; border-radius:var(--r-sm)}
.seg button.on{background:var(--text); border-color:var(--text); color:#fff}

/* '해당 없음' 버튼 — 점선 테두리라 '비워 둔 상태'로 읽힙니다 */
.nonebtn{width:100%; border:1px dashed var(--border-strong); background:var(--surface-2); padding:var(--s16); font-size:var(--fs-body); font-weight:600; color:var(--text-2); border-radius:var(--r-sm)}
.nonebtn.on{border-style:solid; border-color:var(--pine); background:var(--pine-soft); color:var(--pine)}
/* '해당 없음'을 고르는 것이 정상인 항목(알러지)은 초록,
   비워 두면 나중에 연락할 방법이 없는 항목(전화번호)은 빨강으로 구분합니다. */
.nonebtn.warn.on{border-color:var(--rust); background:var(--rust-soft); color:var(--rust)}
.nonebtn.sm{flex:none; width:auto; padding:0 var(--s16); font-size:var(--fs-sub); white-space:nowrap}
.togglebtn{width:100%; border:1px solid var(--border-strong); background:var(--surface); padding:var(--s12); font-size:var(--fs-body); font-weight:700; color:var(--text-2); border-radius:var(--r-sm)}
.togglebtn.on{background:var(--pine-soft); border-color:var(--pine); color:var(--pine)}

/* 숫자 입력 버튼·팝업 — 키패드 대신 큰 버튼으로 고릅니다 (카운터에서 손가락으로) */
.numbtn{width:100%; border:1px solid var(--border-strong); background:var(--surface); padding:var(--s12); font-size:var(--fs-title); font-weight:700; color:var(--text); border-radius:var(--r-sm)}
.numbtn small{font-size:var(--fs-sub); color:var(--text-3); font-weight:600; margin-left:var(--s4)}
.numbtn:hover{background:var(--surface-2)}
.numbtn.sm{width:auto; padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:700}
.numbig{display:flex; align-items:center; justify-content:center; gap:var(--s16); margin:var(--s8) 0 var(--s16)}
.numbig button{width:66px; height:66px; border:1px solid var(--border-strong); background:var(--surface); font-size:var(--fs-num); color:var(--text-2); border-radius:var(--r-sm)}
.numbig button:disabled{opacity:.35}
.numbig .nv{min-width:100px; text-align:center; font-size:var(--fs-big); font-weight:700}
.numgrid{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--s8)}
.numgrid button{border:1px solid var(--border-strong); background:var(--surface); padding:var(--s12) 0; font-size:var(--fs-body); font-weight:700; color:var(--text); border-radius:var(--r-sm)}
.numgrid button.on{background:var(--pine); border-color:var(--pine); color:#fff}

/* ---------- 배지 · 칩 ---------- */
/* 영업 상태 배지 (영업 중 / 준비 중 / 종료) */
.state{display:inline-flex; align-items:center; gap:var(--s8); padding:var(--s8) var(--s12); border-radius:999px;
  font-size:var(--fs-sub); font-weight:600; border:1px solid transparent}
.state.open{background:var(--pine-soft); color:var(--pine); border-color:#C9DED5}
.state.prep{background:var(--amber-soft); color:var(--amber); border-color:#EBDCB6}
.state.closed{background:#F0EFEB; color:var(--text-2); border-color:var(--border)}
.tag{display:inline-block; padding:var(--s4) var(--s8); font-size:var(--fs-sub); font-weight:600; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); border-radius:var(--r-sm)}
.tag.pine{background:var(--pine-soft); color:var(--text); border-color:var(--border-strong)}
.tag.rust{background:var(--rust-soft); color:var(--rust); border-color:#EFD3CC}
.tag.amber{background:var(--amber-soft); color:var(--amber); border-color:#EDDFBC}
.tag.near{background:#EAF0F6; border-color:#CBDAE8; color:#3E6291}
.tag.near.past{background:#F1EFEA; border-color:#DDD6C8; color:#7A7263}
/* 파란 태그는 '당일 변동' 뜻으로만 씁니다 (아래 .chg-tag 참고) */
.tag.blue{background:var(--blue-soft); color:var(--blue); border-color:var(--blue-line)}
.pill{font-size:var(--fs-sub); font-weight:600; padding:var(--s4) var(--s8); background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); border-radius:var(--r-sm)}
.pill.rust{background:var(--rust-soft); border-color:#EFD3CC; color:var(--rust)}
.pill.pine{background:var(--pine-soft); color:var(--text); border-color:var(--border-strong)}
.pill.amber{background:var(--amber-soft); border-color:#EDDFBC; color:var(--amber)}
.pill.blue{color:var(--blue); background:var(--blue-soft); border-color:var(--blue-line)}
/* ---------- 변동 표시 ----------
   사장님이 수기 장부에서 바뀐 예약을 파란 펜으로 적던 습관을 옮긴 것입니다.
   색만으로 구분하면 태블릿·색맹에서 안 보이므로 무엇이 바뀌었는지 글자도 함께 넣습니다. */
.chg-tag{display:inline-flex; align-items:center; font-size:var(--fs-sub); font-weight:700;
  color:var(--blue); background:var(--blue-soft); border:1px solid var(--blue-line);
  border-radius:var(--r-sm); padding:1px var(--s8); margin-left:var(--s4); white-space:nowrap}
.chg-tag.off{color:var(--rust); background:var(--rust-soft); border-color:#EFD3CC}
/* 필수 입력 표시 */
.req{font-size:var(--fs-label); font-weight:700; color:var(--rust); background:var(--rust-soft);
  border:1px solid #EFD3CC; border-radius:var(--r-sm); padding:var(--s4) var(--s8); margin-left:var(--s4); vertical-align:2px}
.lbl{font-size:var(--fs-sub); color:var(--text-3); font-weight:600; letter-spacing:.03em}
/* 라벨 옆 작은 설명 */
.lbl-note{font-size:var(--fs-label); font-weight:500; color:var(--text-3); margin-left:var(--s8)}
.muted{color:var(--text-2)}
.empty{text-align:center; color:var(--text-2); padding:var(--s32) var(--s16); font-size:var(--fs-body); background:var(--surface-2); border-radius:var(--r-md)}

/* ---------- 카드 · 접기 · 구역 제목 ---------- */
/* 카드 경계는 테두리 한 겹 + 얇은 그림자로 충분합니다 */
.card{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:var(--r-md)}
.card + .card{margin-top:var(--s16)}
.card-b{padding:var(--s16) var(--s16) var(--s16)}
/* 구역 제목 — 앞에 3px 짜리 먹색 표식. 처음엔 금색 둥근 막대였는데 '각진 모서리' 개편 때 먹색·각짐으로 바꿨습니다 */
.sect-title{font-weight:700; color:var(--text-3); letter-spacing:.06em; margin:var(--s24) var(--s4) var(--s8); font-size:var(--fs-body); display:flex; align-items:center; gap:var(--s8)}
.sect-title:first-child{margin-top:0}
.sect-title::before{content:""; flex:none; width:3px; height:11px; border-radius:0; background:var(--text)}
/* 설정 소제목 */
.subhead{font-size:var(--fs-sub); font-weight:700; color:var(--text-2); margin:var(--s16) 0 var(--s12); display:flex; align-items:baseline; gap:var(--s8)}
.subhead:first-child{margin-top:0}
.subhead span{font-size:var(--fs-label); font-weight:500; color:var(--text-3)}
/* 접기 카드 — 머리(.fold-h)를 누르면 몸통(.fold-b)이 열립니다 */
.fold{overflow:hidden}
.fold + .fold{margin-top:var(--s16)}
.fold-h{width:100%; display:flex; align-items:center; gap:var(--s12); background:none; border:none; text-align:left; padding:var(--s16) var(--s16)}
.fold-h:hover{background:var(--surface-2)}
.fh-t{font-weight:700; font-size:var(--fs-body); letter-spacing:.01em; line-height:24px}
.fh-x{margin-left:auto; font-size:var(--fs-sub); color:var(--text-2)}
.fh-i{font-size:var(--fs-label); color:var(--text-3)}
.fold-b{padding:0 var(--s16) var(--s16); padding-top:0; animation:fade-in .15s ease-out}

/* ---------- 목록 행 · 확인 필요 ---------- */
.rowitem{display:flex; align-items:center; gap:var(--s12); border-top:1px solid var(--border); padding:var(--s16) var(--s16)}
.rowitem:first-child{border-top:none}
.rowitem .grow{flex:1; min-width:0}
.rowitem .t{font-weight:600; font-size:var(--fs-body)}
.rowitem .s{color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-sub)}
.rowitem.past{opacity:.45}
.rowitem.past .t{color:var(--text-2)}
/* 오늘의 예약 — 행 자체가 버튼이라 눌러서 처리합니다 */
button.rowitem{width:100%; background:none; border:none; border-top:1px solid var(--border); text-align:left; font:inherit; color:inherit}
button.rowitem:first-child{border-top:none}
button.rowitem:hover{background:var(--surface-2)}
.rowitem.late{background:var(--amber-soft)}
.rowitem.late:hover{background:#F5E9CE}
.rowitem.tap{width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--border); font:inherit; color:inherit}
.rowitem.tap:hover{background:var(--surface-2)}
.time-col{font-size:var(--fs-body); font-weight:700; width:52px; flex:none; color:var(--text)}
/* 확인 필요 목록 — 색(경고 빨강 / 주의 호박 / 안내 초록)에 글자도 같이 달라집니다 */
.alerts{display:flex; flex-direction:column; gap:var(--s8)}
.alert{width:100%; text-align:left; border:1px solid var(--border); background:var(--surface-2); padding:var(--s12) var(--s12); display:flex; flex-direction:column; gap:var(--s4); position:relative; padding-right:var(--s32); border-radius:var(--r-sm)}
.alert:hover{background:#F2F1ED}
.alert .a-t{font-size:var(--fs-body); font-weight:700}
.alert .a-s{font-size:var(--fs-sub); color:var(--text-3)}
.alert.rust{background:var(--rust-soft); border-color:#EFD3CC}
.alert.rust .a-t{color:var(--rust)}
.alert.amber{background:var(--amber-soft); border-color:#EDDFBC}
.alert.amber .a-t{color:var(--amber)}
.alert.pine{background:var(--pine-soft); border-color:#CDDFD8}
.alert.pine .a-t{color:var(--pine)}
.alert.blue .ic{background:var(--blue)}
.a-go{position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:var(--fs-title); color:var(--text-3)}
/* 예약 카드 — 상세 열기 영역 */
.tapzone{cursor:pointer; border-radius:var(--r-sm); margin:-4px -4px 0; padding:var(--s4)}
.tapzone:hover{background:var(--surface-2)}

/* ---------- 입력 묶음 ---------- */
.f{display:block; margin-bottom:var(--s16)}
.f .lb{font-size:var(--fs-sub); color:var(--text-3); font-weight:600; margin-bottom:var(--s4)}
/* 마법사 4·5단계 입력 — 태블릿에서 손가락으로 치므로 크게 */
.f.big .lb{font-size:var(--fs-body); color:var(--text-2); margin-bottom:var(--s8)}
.f.big input{padding:var(--s16) var(--s16); font-size:var(--fs-title); border-radius:var(--r-sm)}
.f-note{font-size:var(--fs-sub); color:var(--text-3); margin-top:var(--s4)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:var(--s12)}
/* 입력창 + '해당 없음' 버튼을 한 줄에 */
.inrow{display:flex; gap:var(--s8); align-items:stretch}
.inrow input{flex:1 1 auto; min-width:0}
.searchbox{max-height:56vh; overflow:auto}
.checkbox-scroll{max-height:58vh; overflow-y:auto; padding-right:var(--s4)}

/* ---------- 표 ---------- */
.table{width:100%; border-collapse:collapse; font-size:var(--fs-body)}
.table th{text-align:left; font-size:var(--fs-sub); color:var(--text-3); font-weight:600;
  padding:var(--s8) var(--s12); border-bottom:1px solid var(--border); white-space:nowrap}
.table td{padding:var(--s12) var(--s12); border-bottom:1px solid var(--border); vertical-align:middle}
.table td.r,.table th.r{text-align:right}
.table tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}
.table-wrap .table{min-width:560px}

/* ---------- 차트 (라이브러리 없이 SVG로 직접 그림) ---------- */
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart .gl{stroke:var(--border); stroke-width:1}
.chart .gl.tick{stroke:var(--border-strong)}
.chart .bar-total{fill:#BFD3CA}
.chart .bar-empty{fill:none; stroke:var(--border-strong); stroke-width:1; stroke-dasharray:3 3}
.chart .bar-res{fill:var(--pine)}
.chart .line-total{fill:none; stroke-width:2; stroke-linejoin:round; stroke:#A63B26}
.chart .line-total-d{fill:#A63B26}
.chart .line-res{fill:none; stroke-width:2; stroke-dasharray:5 4; stroke-linejoin:round; stroke:#6E4A0F}
.chart .tx{fill:var(--text-3); font-size:var(--fs-label); font-family:var(--sans); font-weight:600}
.chart .tx.sm{font-size:var(--fs-label); font-weight:500}
.chart .tx.on{fill:var(--text)}
.chart .tx.ax{fill:var(--text-3); font-size:var(--fs-label); font-weight:600}
/* 예약률 그래프 — 룸은 먹색, 홀은 회갈색 */
.chart .rb-room{fill:#3A3833}
.chart .rb-hall{fill:#B3AA93}
.legend{display:flex; flex-wrap:wrap; gap:var(--s12); margin-bottom:var(--s12); font-size:var(--fs-sub); color:var(--text-2)}
.legend span{display:inline-flex; align-items:center; gap:var(--s4)}
.legend .sw{width:11px; height:11px; border-radius:var(--r-sm); display:inline-block}
.legend .sw.bar-total{background:#BFD3CA}
.legend .sw.bar-res{background:var(--pine)}
.legend .sw.ln{height:3px; border-radius:var(--r-sm); width:14px}
.legend .sw.ln.total{background:#A63B26}
.legend .sw.ln.res{background:#9C3B27}
.legend .sw.rb-room{background:#3A3833}
.legend .sw.rb-hall{background:#B3AA93}
.chart-sum{display:flex; flex-wrap:wrap; gap:var(--s16); margin-top:var(--s12); font-size:var(--fs-sub); color:var(--text-2)}
.chart-sum b{color:var(--text)}
.chart-nav{display:flex; align-items:center; gap:var(--s8); margin-bottom:var(--s12)}
/* 대시보드의 작은 예약률 추이 그래프 */
.spark{width:100%; height:100%; max-height:120px}
.sp-bars rect{fill:#C9C5BC}
.sp-line{fill:none; stroke-width:2; stroke-linejoin:round; vector-effect:non-scaling-stroke; stroke:#3A3833}

/* ---------- 안내 띠 ---------- */
.warnbar{background:var(--amber-soft); border:1px solid #EBDCB6; color:var(--amber);
  border-radius:var(--r-sm); padding:var(--s12) var(--s12); font-size:var(--fs-sub); font-weight:600; margin-bottom:var(--s12); line-height:1.5}
.menu-warn{background:var(--rust-soft); border:1px solid #EFD3CC; color:var(--rust);
  border-radius:var(--r-md); padding:var(--s12) var(--s16); font-size:var(--fs-sub); font-weight:700; margin-bottom:var(--s16)}
/* ============================================================
   문자 안내 — 흉내 표시가 늘 보이게

   실제로 나가지 않는다는 것을 화면에서 절대 놓치면 안 됩니다.
   "보냈다"고 믿고 손님한테 확인 전화를 안 하시면 그게 사고입니다.
   그래서 설정·내역·예약 상세 세 군데 모두에 표시를 답니다.
   ============================================================ */
.mockbar{
  background:var(--amber-soft, #FBF1DC); border:1px dashed #D9BF87;
  color:#7A5C22; border-radius:var(--r-sm); padding:var(--s12) var(--s12); margin-bottom:var(--s16);
  font-size:var(--fs-sub); line-height:1.55;
}
.mockbar b{font-weight:700}
/* 화면 오류 안내 띠 (showCrash) — 어떤 화면 위에도 보이도록 최상단 */
.crashbar{position:fixed; left:0; right:0; bottom:0; z-index:9999;
  display:flex; align-items:center; gap:var(--s12); flex-wrap:wrap;
  background:#A63B26; color:#fff; padding:var(--s12) var(--s16);
  font-family:var(--sans); font-size:var(--fs-sub); line-height:1.5;
  box-shadow:0 -2px 14px rgba(0,0,0,.3)}
.crashbar b{font-weight:700}
.crashbar span{opacity:.9}
.crashbar i{font-style:normal; font-size:var(--fs-label); opacity:.75; word-break:break-all}
.crashbar button{margin-left:auto; background:#fff; color:#A63B26; border:none;
  border-radius:var(--r-sm); padding:var(--s8) var(--s16); font-weight:700; font-size:var(--fs-sub)}
/* 예전 3주 달력(.cal 카드)의 잔재. 지금은 날짜 이동의 달력 버튼(<button class="nav cal">)에도 걸려
   그 버튼 아래 여백이 됩니다. 화면을 안 바꾸려고 남겨 둡니다 — Phase 3 에서 정리 */
.cal{margin-bottom:var(--s16)}


/* ============================================================
   4. 레이아웃 (상단바 / shell / content)
   ============================================================ */
/* ---------- 화면 배율 ----------
   앱 화면(.shell)과 PIN 화면(.lock)에만 걸고, 손님용 디스플레이 모드(.tv)에는 걸지 않습니다.
   zoom 은 브라우저 확대와 같아서 레이아웃이 그대로 커집니다.
   (transform:scale 은 원래 자리를 그대로 차지해 화면이 잘립니다)
   확인창(.modal-ov)은 .shell 밖에 그려지므로 6구역에서 따로 겁니다.
   매장 선택 화면은 배경 사진이 화면을 꽉 채우는 구성이라 배율을 걸지 않습니다. */
.shell{min-height:100vh; zoom:var(--ui-zoom, 1.1)}
.lock{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--s24); background:var(--bg); zoom:var(--ui-zoom, 1.1)}
.zoomseg button{min-width:64px; justify-content:center}
.layout{display:block}
.content{padding:var(--s16) var(--s16) 90px; max-width:none; margin:0}

/* ---------- 상단바 ----------
   .topbar 는 화면 폭 전체, .topbar-in 이 본문(.content 의 max-width 1720px)과 폭을 맞춥니다.
   색은 테마 변수(--topbar-*)로 받습니다. 한옥 테마에서는 먹색 바탕 + 아이보리 글자입니다. */
.topbar{position:sticky; top:0; z-index:30; background:var(--topbar-bg); border-bottom:1px solid var(--topbar-line); display:flex; align-items:center; gap:var(--s12); color:var(--topbar-fg); padding:0}
.topbar-in{display:flex; width:100%; max-width:1720px; margin:0 auto; padding:var(--s12) var(--s24); gap:var(--s8); align-items:center}
/* 맨 왼쪽 매장 선택 버튼 (설정 화면에서는 ← 로 바뀝니다) */
.topbar .home{border:1px solid var(--topbar-btn-line); background:transparent; color:var(--topbar-fg); border-radius:var(--r-sm); padding:var(--s8) var(--s12); font-size:var(--fs-body); line-height:1; flex:none; opacity:.85; display:inline-flex; align-items:center; height:36px}
.topbar .home svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7}
.topbar .home:hover{opacity:1}
/* 매장 이름 — 누르면 대시보드로. 세로 가운데를 다른 버튼(36px)과 맞춥니다 */
.storename{background:none; border:none; color:var(--topbar-fg); font-family:var(--serif); font-size:var(--fs-title); padding:var(--s8) var(--s8); border-radius:var(--r-sm); white-space:nowrap; flex:none; opacity:.95; display:inline-flex; align-items:center; line-height:1.15; height:36px; letter-spacing:-.01em; font-weight:700}
.storename:hover{background:var(--topbar-hover); opacity:1}
/* 가운데 날짜 이동: « ‹ [날짜] › » */
.bar-mid{flex:1; display:flex; align-items:center; justify-content:center; min-width:0; gap:var(--s4)}
.bnav{background:none; border:1px solid transparent; color:var(--topbar-fg); opacity:.7; font-weight:700; flex:none; display:inline-flex; align-items:center; justify-content:center; line-height:1; border-radius:var(--r-sm); width:28px; height:34px; font-size:var(--fs-body)}
.bnav.mo{opacity:.55; width:26px; font-size:var(--fs-sub)}
.bnav:hover{background:var(--topbar-hover); opacity:1}
/* 날짜 버튼 — 다른 버튼과 높이(34px)를 맞춥니다 */
.bdate{background:none; border:1px solid var(--topbar-btn-line); color:var(--topbar-fg); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; display:inline-flex; align-items:center; line-height:1; border-radius:var(--r-sm); height:34px; padding:0 var(--s12); font-size:var(--fs-sub); font-weight:700; letter-spacing:-.01em}
.bdate:hover{background:var(--topbar-hover)}
.bdate .tag{vertical-align:1px; margin-left:var(--s4)}
/* 상단바 안에서는 날짜 버튼의 네모를 없앱니다.
   ※ .topbar .bdate 는 .bdate:hover 와 우선순위가 같아 반드시 그 뒤에 와야 합니다 — 원본이 그랬고,
     그래서 마우스를 올려도 배경이 안 생깁니다. 앞으로 옮기면 hover 배경이 살아나 화면이 바뀝니다 */
.topbar .bdate{border-color:transparent; background:transparent}
.topbar .bdate:hover{border-color:rgba(243,234,218,.28)}
/* 오른쪽 버튼 묶음: 차트 · 설정 · 디스플레이 · 예약 검색 · 예약 등록 */
.bar-right{display:flex; align-items:center; gap:var(--s8); flex:none}
.topbar .tvbtn{flex:none; border:1px solid var(--topbar-btn-line); background:transparent; color:var(--topbar-fg); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:600; white-space:nowrap; opacity:.9; display:inline-flex; align-items:center; height:36px; line-height:1; border-radius:var(--r-sm)}
.topbar .tvbtn:hover{background:var(--topbar-hover); opacity:1}
.topbar .tvbtn.icon{padding:var(--s8) var(--s12); display:inline-flex; align-items:center}
.topbar .tvbtn.icon svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7}
.topbar .tvbtn.icon.on{background:var(--pine); border-color:var(--pine); color:#fff}
/* '예약 등록'만 밝은 바탕으로 튀게 — 이 화면의 주요 동작입니다 */
.topbar .tvbtn.accent{border-color:transparent; opacity:1; background:#F4F2EE; color:#1B1A18; font-weight:700}
.topbar .tvbtn.accent:hover{background:#fff}
/* .tvbtn 단독 규칙은 '각진 모서리' 개편 때 붙은 것인데 .topbar .tvbtn(9px)이 더 세서 효력이 없습니다.
   화면을 안 바꾸려고 남겨 둡니다 — Phase 3 에서 반경 계단을 정할 때 같이 정리 */
.tvbtn{border-radius:var(--r-sm)}
/* 예전 상단바 부품 — 지금 HTML 에는 없거나 거의 안 쓰입니다. Phase 3 에서 확인 후 정리 */
.topbar .title{color:var(--topbar-fg); font-family:var(--serif); font-size:var(--fs-head); font-weight:700; letter-spacing:.08em; white-space:nowrap}
.topbar .right{margin-left:auto; display:flex; align-items:center; gap:var(--s8)}
.topbar .center{flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:var(--s12);
  background:none; border:none; padding:var(--s4) var(--s8); border-radius:var(--r-sm)}
.topbar .center:hover{background:var(--topbar-hover)}

/* ---------- 본문 안의 날짜 이동 줄 (.res-head / .datenav) ----------
   상단바에 날짜 이동이 들어가기 전에 쓰던 줄입니다. 예약 목록 카드 머리 등에 아직 쓰입니다 */
.res-head{display:flex; align-items:center; gap:var(--s12); margin-bottom:var(--s16); flex-wrap:wrap}
.res-head .nav{width:42px; height:42px; flex:none; border:1px solid var(--border-strong);
  background:var(--surface); border-radius:var(--r-sm); color:var(--text-2); font-size:var(--fs-body)}
.res-head .nav.cal{font-size:var(--fs-title); display:inline-flex; align-items:center; justify-content:center}
.res-head .nav.cal svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7}
.res-head .add{flex:none}
.datenav{display:flex; align-items:center; gap:var(--s8); flex:0 1 auto; justify-content:center; min-width:auto}
.datenav .nav{width:40px; height:44px; flex:none; border:1px solid var(--border-strong);
  background:var(--surface); border-radius:var(--r-sm); color:var(--text-2); font-size:var(--fs-title); font-weight:700}
.datenav .nav.mo{font-size:var(--fs-body); color:var(--text-3)}
.datenav .nav:hover{background:var(--surface-2); color:var(--text)}
.datenav .nav.cal{margin-left:var(--s4)}
.datenav .rh-mid{flex:1; background:none; border:none; padding:var(--s4) var(--s12); border-radius:var(--r-md); text-align:center; font:inherit; color:inherit; cursor:pointer; min-width:210px}
.datenav .rh-mid:hover{background:var(--surface-2)}
.rh-mid{flex:1; min-width:180px; text-align:center}
.rh-d{font-size:var(--fs-title); font-weight:700}
.rh-s{font-size:var(--fs-sub); color:var(--text-2); margin-top:var(--s4)}
/* .nav 단독 규칙 — 위의 .res-head .nav / .datenav .nav 등이 더 세서 효력이 없습니다. .tvbtn 과 같은 이유로 남겨 둠 */
.nav{border-radius:var(--r-sm)}


/* ============================================================
   5. 대시보드
   ============================================================ */
/* ---------- 지표줄 (확정 예약 / 예약률 / 룸 미배정 / 경고 / 확인 필요) ----------
   칸 사이 1px 틈에 --border 색이 비쳐 구분선이 됩니다. 눌러서 여는 칸은 button 입니다 */
.metrics{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border)}
.metric{background:var(--surface); padding:var(--s16) var(--s16)}
.metric .v{font-weight:700; line-height:32px; font-size:var(--fs-num); letter-spacing:-.03em; color:var(--text)}
.metric .u{font-size:var(--fs-body); font-weight:600; margin-left:var(--s4)}
.metric .k{margin-top:var(--s4); font-weight:700; font-size:var(--fs-sub); color:var(--text-2); letter-spacing:.01em; line-height:20px}
.metric .s{font-size:var(--fs-sub); color:var(--text-3); margin-top:0; line-height:20px}
.metric.tapm .s{color:var(--text-2)}
/* 경고는 벽돌색, 확인 필요는 호박색 — 색뿐 아니라 칸 바탕까지 칠해 멀리서도 보이게 */
.metric.warn{background:var(--rust-soft)}
.metric.warn .v{color:var(--rust)}
.metric.amber{background:var(--amber-soft)}
.metric.amber .v{color:var(--amber)}
button.metric{border:none; text-align:left; font:inherit; color:inherit; cursor:pointer}
button.metric:hover{background:var(--surface-2)}

/* ---------- 타임라인 상단 (예약률 · 영업시간 · 범례) ---------- */
.tl-top{display:flex; flex-direction:column; gap:var(--s12); margin-bottom:var(--s16)}
.tl-kpis{display:flex; align-items:baseline; flex-wrap:wrap; row-gap:var(--s8); gap:var(--s16)}
.tl-kpi{font-size:var(--fs-sub); color:var(--text-3)}
.tl-kpi b{font-size:var(--fs-head); color:var(--text); line-height:28px}
.tl-kpi.sub b{font-size:var(--fs-body); color:var(--text-2); font-weight:600}
.tl-hours{font-size:var(--fs-sub); color:var(--text-2); font-weight:600}
.hours-line{font-size:var(--fs-sub); color:var(--text-2); background:var(--surface-2);
  border:none; border-radius:var(--r-md); padding:var(--s8) var(--s12); margin-bottom:var(--s12)}
.tl-legends{display:flex; gap:var(--s16); align-items:center; flex-wrap:wrap; row-gap:var(--s8);
  padding-top:var(--s4)}
.tl-legend{font-size:var(--fs-sub); color:var(--text-2); display:inline-flex; align-items:center; gap:var(--s8)}
.tl-legend i{width:14px; height:10px; border-radius:var(--r-sm); display:inline-block; background:var(--pine)}
.tl-legend i.tent{background:repeating-linear-gradient(45deg,#C9BBA0 0 3px,#E2D9C6 3px 6px); border:1px dashed #A8977A}
.tl-legend i.blk.warned{background:var(--rust)}
/* 범례 색 견본 — 타임라인 블록(.blk)은 absolute 라 그대로 쓰면 글자와 겹칩니다 */
.lgsw{display:inline-block; position:static; width:15px; height:11px; border-radius:var(--r-sm);
  vertical-align:-1px; flex:none}
.lgsw.ok{background:#3A3833}
.lgsw.tent{background:#8E8A80; border:1px dashed #E7E3DA}
.lgsw.warn{background:var(--rust)}

/* ---------- 좌석 가동 타임라인 ----------
   행(.tl-row) = 좌석 이름(.tl-name) + 그래프(.tl-track) + 예약률(.tl-rate).
   좁은 화면에서는 .tl-scroll 이 가로로 스크롤되고, 이름 열만 왼쪽에 고정됩니다 (900px 이상에서는 고정 해제 — 11구역).
   .tl-scroll 은 카드 안쪽 여백 14px 만큼 좌우로 삐져나가 그래프가 카드 끝까지 닿습니다. */
.tl-scroll{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; margin:0 -14px; padding:0 var(--s16); position:relative}
.tl{display:flex; flex-direction:column; gap:var(--s4); min-width:660px}
/* 좌석 이름이 두 줄이면 행이 그래프보다 커져 어긋납니다. 이름은 한 줄(nowrap)로, 행 높이는 그래프(30px)가 정합니다 */
.tl-row{display:flex; gap:var(--s8); align-items:center; min-height:30px}
/* 고정된 좌석 이름 칸 — 가로 스크롤해도 '흰 열'로 보이게
   1) 이름 칸 높이가 글자 높이만큼밖에 안 되면, 테이블이 여러 개인 홀처럼 줄이 높은 좌석에서
      흰 배경이 글자 주변에만 생기고 위아래로 그래프가 비쳤습니다. → align-self:stretch 로 행 높이 전체를 채웁니다.
   2) .tl-scroll 이 좌우로 14px 삐져나와 있어 이름 칸 왼쪽에 14px 틈이 남고 그리로 그래프가 보였습니다.
      → 모바일에서는 .tl-scroll 의 왼쪽 padding 을 없애고(11구역), 남는 틈은 box-shadow 로 왼쪽을 한 번 더 칠합니다.
        (가상요소 대신 box-shadow 를 쓰는 이유: 위치 계산 없이 요소 배경색 그대로 왼쪽으로 복사돼서 어긋날 일이 없습니다)
   box-shadow 세 겹 = 왼쪽 여백 칠하기 / 그래프와 나누는 세로선 / 스크롤됐음을 알리는 옅은 그림자 */
.tl-name{
  position:sticky; left:0; z-index:5; align-self:stretch;
  width:88px; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--s4); padding:0 var(--s8) 0 0; text-align:center; white-space:nowrap; overflow:hidden;
  font-size:var(--fs-sub); font-weight:700; line-height:1.2; height:auto;
  background:var(--surface);
  box-shadow:-26px 0 0 var(--surface), 1px 0 0 var(--border), 8px 0 8px -6px rgba(23,22,20,.16);
}
.tl-name b{color:var(--text); font-weight:700}
.tl-name small{font-size:var(--fs-label); font-weight:500; color:var(--text-3); margin-left:var(--s4)}
/* 좌석 이름 옆 사용 중지 표시 — 예약 블록에 가려도 여기서는 항상 읽힙니다 */
.tl-name .bk{display:block; font-size:var(--fs-label); font-weight:700; color:var(--rust);
  margin-top:var(--s4); line-height:1.25; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:100%}
/* 예전에 흰 열을 만들던 가상요소 방식 — 좌표가 계속 어긋나 box-shadow 로 바꾸고 껐습니다 */
.tl-name::before{display:none}
/* 시각 눈금 행(.axis) — 이름·예약률 칸은 작은 회색 글씨 */
.tl-row.axis .tl-name{font-size:var(--fs-label); color:var(--text-3); font-weight:600; background:var(--surface); box-shadow:-26px 0 0 var(--surface)}
.tl-row.axis .tl-rate{font-size:var(--fs-label); color:var(--text-3); font-weight:600; align-items:center; background:var(--surface)}
.tl-row.axis .tl-rate .rt{font-size:var(--fs-label); color:var(--text-3); font-weight:600}
.tl-row.axis .tl-track{height:18px; background:none; border:none}
.tl-row.axis .tk b{display:block}
/* 사용 중지 좌석 — 행 전체가 아니라 그래프만 흐리게 합니다.
   행 전체에 opacity 를 주면 왼쪽에 고정된 이름 열까지 반투명해져서
   모바일에서 가로 스크롤할 때 그 줄만 흰 열이 끊겨 보입니다. */
.tl-row.off-seat .tl-track{opacity:.42; background:repeating-linear-gradient(45deg, rgba(23,22,20,.06) 0 5px, transparent 5px 10px)}
.tl-row.off-seat .tl-rate{opacity:.42}
.tl-row.off-seat .tl-name{color:var(--text-3)}
.tl-row.off-seat .tl-name b{color:var(--text-3)}
/* 예약률 칸 — 오른쪽 끝. 기준선(.rb)이 있는 행과 없는 행의 좌우 위치를 맞추려고 가운데 정렬.
   flex-direction 을 row 로 명시하는 이유: 예전 규칙의 column 이 남으면 justify-content 가 위아래 정렬로 작동합니다.
   z-index 는 flex 항목이라 position:static 이어도 먹습니다 (그래프 위로) */
.tl-rate{position:static; z-index:3; width:58px; flex:none; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:var(--s4);
  font-size:var(--fs-sub); font-weight:700; color:var(--text-2); box-shadow:none; background:transparent}
.tl-rate .over{font-size:var(--fs-label); color:var(--rust); font-weight:700}
.tl-rate .rb{display:flex; align-items:center; justify-content:center; gap:var(--s4); flex-direction:column; height:100%; width:auto; min-width:34px}
.tl-rate .rb i{flex:1; width:1px; background:var(--border-strong); min-height:5px}
.tl-rate .rb b{font-size:var(--fs-sub); font-weight:700; color:var(--text-2); line-height:1}
.tl-rate .rt{font-size:var(--fs-sub); font-weight:700; color:var(--text-2); line-height:1; width:100%; text-align:center}
/* 그래프 — 시각 눈금(.tk), 테이블 줄(.lane), 예약 블록(.blk), 현재 시각 선(.nowline), 음영 띠 */
.tl-track{position:relative; flex:1; min-width:0; height:30px; border:1px solid var(--border); overflow:hidden; background:#FAF8F3; border-radius:var(--r-sm)}
.tk{position:absolute; top:0; bottom:0; width:0}
.tk i{position:absolute; top:0; bottom:0; width:1px; background:var(--border)}
.tk b{display:none; position:absolute; top:2px; left:2px; font-size:var(--fs-label); color:var(--text-3); font-weight:600}
.lane{position:absolute; left:0; right:0; border-top:1px solid var(--border)}
/* 예약 블록 — 확정은 먹색(#3A3833), 지난 것은 회색, 잠정은 빗금 테두리, 경고는 벽돌색 */
.blk{position:absolute; color:#fff; font-size:var(--fs-label); padding:0 var(--s4); display:flex; align-items:center; gap:var(--s4); overflow:hidden; white-space:nowrap; border:1px solid rgba(255,255,255,.3); line-height:1; border-radius:var(--r-sm); background:#3A3833}
.blk b{font-weight:700}
.blk .tt{font-style:normal; background:rgba(255,255,255,.28); border-radius:var(--r-sm); padding:1px var(--s4); font-size:var(--fs-label)}
.blk.tent{background:#8C8067; border:1px dashed #EFE7D5}
.blk.past{background:#B9B5AC}
.blk.past.tent{background:#BDB6A6}
/* 누를 수 있는 블록은 button 입니다 — 글자 크기·여백을 .blk 과 같게 다시 적어 button 기본 스타일을 지웁니다 */
button.blk{border:1px solid rgba(255,255,255,.3); cursor:pointer; font:inherit; font-family:inherit; font-size:var(--fs-label); line-height:1; padding:0 var(--s4); letter-spacing:-.01em; text-align:left; overflow:hidden; text-overflow:clip}
button.blk:hover{filter:brightness(1.15)}
button.blk b{font-weight:700; font-size:var(--fs-label)}
/* 확정 / 잠정 / 경고를 구분해서 보여줍니다
   잠정 = 빗금 테두리, 경고 = 붉은색, 둘 다면 붉은색 + 빗금 테두리 */
button.blk.warned{border-color:rgba(255,255,255,.45); background:var(--rust)}
button.blk.warned.past{background:#C08476}
button.blk.tent.warned{background:var(--rust); border:1px dashed #FFE2DA}
button.blk.tent{background:#8E8A80; border:1px dashed #E7E3DA}
/* 변동 예약(당일 변경) — 왼쪽 파란 띠만으로는 눈에 안 들어와 글씨까지 하늘색으로.
   어두운 블록 위라서 옅은 파랑은 회색으로 보입니다. 채도를 확실히 올립니다.
   띠에 글자가 물리지 않도록 왼쪽 여백도 띠 두께만큼 밉니다. */
.blk.changed{box-shadow:inset 4px 0 0 #4FA8F0; padding-left:var(--s12); color:#6EC2FF}
.blk.changed b{color:#9FD8FF}
.blk.changed .tt{background:rgba(110,194,255,.25)}
.nowline{position:absolute; top:0; bottom:0; width:2px; background:var(--rust); z-index:3}
/* 그래프 범위를 벗어난 시각 — 끝에 붙여 두되 '실제 위치가 아님'을 점선으로 알립니다 */
.nowline.edge{background:repeating-linear-gradient(180deg,
  var(--rust) 0 4px, transparent 4px 8px)}
.nowline.edge.before{margin-left:1px}
.nowline.edge.after{margin-left:-3px}
/* 영업 외 시간(.offband) · 휴무(.closed-band) 는 회색 빗금, 브레이크타임(.breakband) 은 옅은 벽돌색 */
.offband{position:absolute; top:0; bottom:0; z-index:1; pointer-events:none; background:repeating-linear-gradient(45deg, rgba(27,27,25,.24) 0 5px, rgba(27,27,25,.13) 5px 10px)}
.breakband{position:absolute; top:0; bottom:0; border-left:1px dashed rgba(156,59,39,.45); border-right:1px dashed rgba(156,59,39,.45); z-index:1; pointer-events:none; background:rgba(156,59,39,.20)}
.closed-band{position:absolute; inset:0; z-index:1; pointer-events:none; background:repeating-linear-gradient(45deg, rgba(27,27,25,.30) 0 6px, rgba(27,27,25,.17) 6px 12px)}
/* 좌석 사용 중지 구간 — 영업시간 밖과 같은 빗금이되, 사람이 일부러 잠근 것이라
   더 진하고 벽돌색 테두리를 둡니다. 사유는 구간이 넓을 때만 적습니다. */
.blockband{position:absolute; top:0; bottom:0; z-index:1; pointer-events:none;
  display:flex; align-items:center; justify-content:flex-start; padding-left:var(--s4); overflow:hidden;
  background:repeating-linear-gradient(45deg,
    rgba(166,59,38,.26) 0 6px, rgba(166,59,38,.11) 6px 12px);
  border-left:1px dashed rgba(166,59,38,.65); border-right:1px dashed rgba(166,59,38,.65)}
.blockband i{font-style:normal; font-size:var(--fs-label); font-weight:700; color:var(--rust);
  background:rgba(255,253,250,.9); border:1px solid rgba(166,59,38,.3); border-radius:var(--r-sm);
  padding:1px var(--s4); line-height:1.4;
  white-space:nowrap; max-width:96%; overflow:hidden; text-overflow:ellipsis}

/* ---------- 예약 목록 — 한 줄에 시각 · 이름 · 인원 · 전화 · 좌석/상태 알약 ---------- */
.rlist{display:flex; flex-direction:column}
.rrow{display:flex; align-items:center; gap:var(--s12); width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--border); font:inherit; color:inherit; white-space:nowrap; overflow:hidden; padding:var(--s12) var(--s8)}
.rrow:first-child{border-top:none}
.rrow:hover{background:var(--surface-2)}
/* 끝난 예약은 흐리게 — 노쇼는 확인할 일이 남아 조금 덜 흐리게 */
.rrow.s-취소{opacity:.4}
.rrow.s-방문{opacity:.4}
.rrow.s-노쇼{opacity:.55}
/* 예약 시각이 지났는데 아직 확정인 것 — 느낌표(.rr-bang)만 또렷하게 */
.rrow.late{opacity:.55}
.rrow.late .rr-bang{opacity:1}
.rr-bang{width:12px; flex:none; font-weight:700; color:var(--rust); font-size:var(--fs-body); text-align:center}
.rr-t{font-size:var(--fs-body); font-weight:700; width:52px; flex:none; color:var(--text)}
.rr-n{font-size:var(--fs-body); font-weight:600; width:84px; flex:none; overflow:hidden; text-overflow:ellipsis}
.rr-p{font-size:var(--fs-sub); color:var(--text-2); width:100px; flex:none}
.rr-ph{font-size:var(--fs-sub); color:var(--text-3); width:126px; flex:none; overflow:hidden; text-overflow:ellipsis}
.rr-pills{display:flex; gap:var(--s4); flex:1; min-width:0; overflow:hidden}
.rr-seat{flex:none; max-width:150px; overflow:hidden; text-overflow:ellipsis}
.rr-st{flex:none}

/* ---------- 좌석 현황 보드 ---------- */
.sb-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:var(--s8)}
.sb-grid.hall{grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:var(--s12)}
.sb-cell{border:1px solid var(--border); padding:var(--s12) var(--s12); background:var(--surface-2); border-radius:var(--r-sm)}
.sb-cell.used{border-color:#BFD3CA; background:var(--pine-soft)}
.sb-cell.tent{border-color:#DCCBA8; background:#FAF4E7}
.sb-cell.hall{background:var(--surface); border-color:var(--border-strong)}
.sb-cell.full{border-color:var(--rust)}
.sb-h{display:flex; align-items:baseline; gap:var(--s8)}
.sb-n{font-size:var(--fs-body); font-weight:700}
.sb-r{margin-left:auto; font-size:var(--fs-sub); font-weight:700; color:var(--text-2)}
.sb-bar{height:6px; background:var(--border); border-radius:var(--r-sm); margin:var(--s8) 0 var(--s8); overflow:hidden; display:flex}
.sb-bar i{background:var(--pine); height:100%}
.sb-bar u{background:repeating-linear-gradient(45deg,#C9AE79 0 3px,#E4D3AE 3px 6px); height:100%}
.sb-s{font-size:var(--fs-label); color:var(--text-3); line-height:1.5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* ※ .sb-note 는 좌석 보드와 예약 상세의 문자 칸(.sb-t .sb-mock …)이 같은 접두사를 써서 두 곳에서 정의돼 있었습니다.
   최종값은 같으니 여기 한 번만 둡니다 */
.sb-note{font-size:var(--fs-label); color:var(--text-3); margin-top:var(--s8)}


/* ============================================================
   6. 예약 — 시트 / 달력 / 마법사 / 모달
   ============================================================ */
/* ---------- 시트(팝업) 공통 ----------
   .overlay 가 화면을 덮고, 그 안에 .sheet(아래에서 올라오는 판) 또는 .modal(가운데 확인창)이 놓입니다.
   폰에서는 시트가 화면 아래에 붙고(align-items:flex-end), 768px 이상에서는 가운데로 옵니다(11구역). */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(20,20,18,.45);
  display:flex; align-items:flex-end; justify-content:center}
/* 확인창은 .shell 밖(app 바로 아래)에 그려지므로 배율(zoom)을 따로 걸어 줍니다.
   시트·마법사·달력은 .shell 안에 있어 여기서 또 걸면 배율이 두 번 곱해집니다.
   ※ .overlay 와 같은 요소에 같이 붙으므로(class="overlay modal-ov") 반드시 .overlay 뒤에 있어야 합니다 */
.modal-ov{align-items:center; z-index:70; zoom:var(--ui-zoom, 1.1)}
.sheet{width:100%; max-width:560px; max-height:90vh; overflow-y:auto; background:var(--bg); padding:var(--s16) var(--s16) calc(var(--s24) + env(safe-area-inset-bottom)); border-radius:var(--r-lg) var(--r-lg) 0 0}
.sheet-h{display:flex; align-items:center; margin-bottom:var(--s24)}
.sheet-h h2{margin:0; font-size:var(--fs-head); font-weight:700; letter-spacing:-.01em}
.sheet-h .x{margin-left:auto; background:none; border:none; font-size:var(--fs-head); color:var(--text-3); line-height:1; padding:0 var(--s4)}
.sheet-actions{display:flex; gap:var(--s8); margin-top:var(--s8); padding-top:var(--s16); border-top:1px solid var(--border)}
.sheet-actions .btn.primary{flex:1}
/* 예약률 추이 시트는 넓게. 768px 이상에서 .sheet 가 max-width:600px 로 좁아지므로
   11구역에 .sheet-wide{max-width:1040px} 를 그 뒤에 한 번 더 둡니다 — 지우면 넓은 시트가 600px 로 줄어듭니다 */
.sheet-wide{max-width:1040px}
.sheet-wide .chart{max-height:none}
/* ---------- 달력 팝업 ---------- */
.calbox{width:100%; max-width:520px; max-height:92vh; overflow-y:auto; background:var(--bg); padding:var(--s16) var(--s16) calc(var(--s24) + env(safe-area-inset-bottom)); border-radius:var(--r-md)}
.cal-nav{display:flex; align-items:center; gap:var(--s12); margin-bottom:var(--s12)}
.cal-nav .nav{width:40px; height:40px; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:var(--r-sm); color:var(--text-2)}
.cal-m{flex:1; text-align:center; font-size:var(--fs-title); font-weight:700}
.cgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:var(--s4)}
.chead{margin-bottom:var(--s4)}
.chd{text-align:center; font-size:var(--fs-label); font-weight:700; color:var(--text-3); padding:var(--s4) 0}
.chd.sun{color:#B0553F}
.chd.sat{color:#3E6291}
.cday.sun .dn{color:#B0553F}
.cday.sat .dn{color:#3E6291}
.cday{min-height:62px; border:1px solid var(--border); background:var(--surface); border-radius:var(--r-md); padding:var(--s4) var(--s4); display:flex; flex-direction:column; align-items:center; gap:var(--s4)}
.cday .dn{color:var(--text); line-height:1; font-size:var(--fs-sub); font-weight:700}
.cday .dots{display:flex; gap:var(--s4)}
.cday .dots i{width:4px; height:4px; border-radius:50%; background:var(--pine); display:block}
.cday .cnt{font-size:var(--fs-label); font-weight:700; color:var(--pine); background:var(--pine-soft);
  border-radius:var(--r-sm); padding:1px var(--s4); line-height:1.4}
.cday .pp{font-size:var(--fs-label); color:var(--text-3); line-height:1}
.cday.today{border-color:var(--text); border-width:1.5px}
.cday.sel{background:var(--pine); border-color:var(--pine)}
.cday.sel .dn{background:transparent; color:#fff}
.cday.sel .pp{color:#fff; background:transparent}
.cday.sel .cnt{color:#fff; background:transparent}
.cday.sel .dots i{background:rgba(255,255,255,.9)}
.cday.blank{border:none; background:none; min-height:0}
.cday .cn{font-size:var(--fs-label); font-weight:700; color:var(--pine)}
.cday .cn.none{color:var(--text-3); font-weight:400}
.cday .cbar{width:76%; height:4px; background:var(--border); border-radius:var(--r-sm); overflow:hidden}
.cday .cbar i{display:block; height:100%; background:var(--pine)}
.cday .cr{font-size:var(--fs-label); color:var(--text-3)}
.cday.sel .cn{color:#fff}
.cday.sel .cr{color:#fff}
.cday.sel .cbar{background:rgba(255,255,255,.35)}
.cday.sel .cbar i{background:#fff}
/* ---------- 예약 등록 마법사 — 카운터 태블릿 기준 (큰 터치 영역) ----------
   7단계: 경로(.srccell) → 날짜·시간(.bday .hcell .mrail) → 인원(.ptile) → 좌석(.scell) → 메뉴/코스(.srccell .citem)
          → 예약자(.f.big) → 요청사항. 완료 화면은 .wz.done + .done-box.
   골격: .wz-top(단계 점) / .wz-mid(질문 + 본문, 세로 가운데) / .wz-foot(이전·다음) */
.wz{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column}
.wz.done{align-items:center; justify-content:center; padding:var(--s24)}
.wz-top{background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:var(--s12); padding:var(--s12) var(--s16); flex-wrap:wrap}
.wz-back{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:var(--r-sm); padding:var(--s8) var(--s16); font-size:var(--fs-body); font-weight:600; flex:none}
.wz-steps{display:flex; gap:var(--s4); flex:1; min-width:0; overflow-x:auto}
.wz-dot{display:flex; align-items:center; gap:var(--s8); border:none; background:none; padding:var(--s8) var(--s8);
  border-radius:var(--r-sm); color:var(--text-3); font-size:var(--fs-sub); font-weight:600; white-space:nowrap}
.wz-dot .n{width:21px; height:21px; border-radius:50%; background:var(--border);
  color:var(--surface); font-size:var(--fs-sub); display:grid; place-items:center; flex:none}
.wz-dot.past .n{background:var(--pine); color:#fff}
.wz-dot.on{color:var(--text)}
.wz-dot.on .n{background:var(--text); color:#fff}
.wz-dot .l{display:none}
.wz-sum{display:flex; gap:var(--s8); margin-left:auto}
.wz-sum span{font-size:var(--fs-sub); font-weight:600; color:var(--pine); background:var(--pine-soft);
  border:1px solid #CDDFD8; border-radius:var(--r-sm); padding:var(--s4) var(--s8)}
/* 질문과 본문을 세로 가운데에 — 태블릿에서 눈높이에 오게. 세로가 760px 이하이면 위부터 채웁니다(11구역) */
.wz-mid{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; justify-content:center}
.wz-q{text-align:center; padding:var(--s8) var(--s16) var(--s4)}
.wz-q h2{margin:0; font-size:var(--fs-head); font-weight:700; letter-spacing:-.01em; line-height:1.4}
.wz-warn{margin-top:var(--s12); font-size:var(--fs-sub); font-weight:700; color:var(--rust)}
.wz-body{overflow-y:auto; padding:var(--s16) var(--s16) var(--s24); max-width:940px; width:100%; margin:0 auto; flex:0 1 auto; overflow:visible}
.wz-foot{background:var(--surface); border-top:1px solid var(--border); display:flex; gap:var(--s12);
  padding:var(--s12) var(--s16) calc(var(--s16) + env(safe-area-inset-bottom))}
.wz-note{font-size:var(--fs-sub); color:var(--text-3); margin-top:var(--s16); line-height:1.6}
/* 1단계 날짜·시간 — 900px 이상에서는 달력과 시간을 좌우로 나눠 스크롤 없이 한 화면에 담습니다(11구역) */
.wz-step1{display:block}
.wz-cal{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s12) var(--s12) var(--s16)}
.mo-h{display:flex; align-items:center; gap:var(--s12); margin-bottom:var(--s12)}
.mo-h .mo{flex:1; text-align:center; font-size:var(--fs-title); font-weight:700}
.mo-h .nav{width:42px; height:42px; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:var(--r-sm); color:var(--text-2)}
.bgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:var(--s4)}
.bhead span{text-align:center; font-size:var(--fs-sub); font-weight:700; color:var(--text-3); padding-bottom:var(--s4)}
.bhead .sun{color:#B0553F}
.bhead .sat{color:#3E6291}
.bday{min-height:56px}
button.bday{border:1px solid var(--border); background:var(--surface); border-radius:var(--r-md);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--s4); padding:var(--s4)}
button.bday .d{font-size:var(--fs-title); font-weight:600}
button.bday .b{font-size:var(--fs-label); font-weight:700; color:var(--pine); background:var(--pine-soft); border-radius:var(--r-sm); padding:1px var(--s4)}
button.bday.sun .d{color:#B0553F}
button.bday.sat .d{color:#3E6291}
button.bday.today{border-color:var(--text); border-width:1.5px}
button.bday.past{opacity:.5}
button.bday.sel{background:var(--pine); border-color:var(--pine)}
button.bday.sel .d{color:#fff}
button.bday.sel .b{background:rgba(255,255,255,.22); color:#fff}
/* 시간 칸 — 고른 칸은 초록, 라스트오더·마감이 걸리면 벽돌색(.warned) */
.wz-time{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s16); margin-top:var(--s16)}
.hgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:var(--s8)}
.hcell{border:1px solid var(--border-strong); background:var(--surface); padding:var(--s12) var(--s4) var(--s8); display:flex; flex-direction:column; align-items:center; gap:1px; border-radius:var(--r-md)}
.hcell .ap{font-size:var(--fs-label); color:var(--text-3); font-weight:600}
.hcell .hh{font-size:var(--fs-head); font-weight:700; letter-spacing:-.02em}
.hcell .hn{font-size:var(--fs-label); color:var(--amber); font-weight:700}
.hcell.on{background:var(--pine); border-color:var(--pine)}
.hcell.on .ap,.hcell.on .hh,.hcell.on .hn{color:#fff}
/* 지난 시간 / 지난 날짜 */
.hcell.gone{opacity:.45; background:var(--surface-2)}
.hcell.gone .hn.muted2{color:var(--text-3)}
.hcell.gone.on{opacity:1}
.hcell.on.warned{background:var(--rust); border-color:var(--rust)}
.hcell.late .hn.rust{color:var(--rust)}
/* 시간·분 경고를 글자 색으로 */
.hcell .ap.rust,.hcell .hh.rust{color:var(--rust)}
/* 분 조절 레일 — 손가락으로 끌어서 정합니다 (touch-action:none 으로 화면 스크롤과 안 겹치게).
   손잡이(.mknob)는 44px, 눈금(.mnotch) 은 10분마다 큰 눈금 */
.mwrap{margin-top:var(--s16); padding-top:var(--s16)}
.mhead{display:flex; align-items:baseline; margin-bottom:var(--s16)}
.mhead .mnow{margin-left:auto; font-size:var(--fs-head); font-weight:700; color:var(--pine)}
.mnow.rust{color:var(--rust)}
.mrail{position:relative; height:70px; touch-action:none; user-select:none; margin:0 var(--s24)}
.mtrack{position:absolute; left:0; right:0; top:15px; height:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm)}
.mfill{position:absolute; left:0; top:15px; height:12px; background:var(--pine); opacity:.28; border-radius:var(--r-sm)}
.mnotch{position:absolute; top:18px; width:1px; height:6px; background:var(--border-strong); margin-left:-0.5px}
.mnotch.big{top:16px; height:10px; background:var(--text-3)}
.mknob{position:absolute; top:0; width:44px; height:44px; margin-left:-22px; background:var(--pine); color:#fff; font-size:var(--fs-body); font-weight:700; display:grid; place-items:center; box-shadow:0 2px 8px rgba(30,74,60,.35); pointer-events:none; border-radius:var(--r-sm)}
.mknob.warned{background:var(--rust); border-color:var(--rust)}
.mtick{position:absolute; bottom:0; transform:translateX(-50%); width:34px;
  background:none; border:none; font-size:var(--fs-sub); font-weight:600; color:var(--text-3); padding:var(--s4) 0}
.mtick.on{color:var(--pine); font-weight:700}
.mtick.warned{border-color:var(--rust); color:var(--rust)}
.mfine{display:flex; gap:var(--s8); margin-top:var(--s12)}
.mfine button{flex:1; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:var(--r-md); padding:var(--s12) 0; font-size:var(--fs-body); font-weight:600; color:var(--text-2)}
.mfine button:disabled{opacity:.35}
/* 2단계 인원 — 큰 숫자 타일. 6명 넘으면 .pmore 로 직접 입력, 유아·의자는 .infant 안의 작은 스테퍼 */
.pgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s12)}
.ptile{border:1px solid var(--border-strong); background:var(--surface); padding:var(--s24) 0 var(--s16); display:flex; flex-direction:column; align-items:center; gap:1px; border-radius:var(--r-md)}
.ptile .pn{font-size:var(--fs-num); font-weight:700; letter-spacing:-.03em; line-height:1}
.ptile .pu{font-size:var(--fs-sub); color:var(--text-3); font-weight:600}
.ptile.on{background:var(--pine); border-color:var(--pine)}
.ptile.on .pn,.ptile.on .pu{color:#fff}
.pmore{width:100%; margin-top:var(--s12); border:1px dashed var(--border-strong); background:var(--surface-2); padding:var(--s16); font-size:var(--fs-body); font-weight:600; color:var(--text-2); border-radius:var(--r-sm)}
.pmore.on{border-style:solid; border-color:var(--pine); color:var(--pine); background:var(--pine-soft)}
.bigstep{display:flex; align-items:center; gap:var(--s12); margin-top:var(--s12); justify-content:center}
.bigstep button{width:62px; height:62px; border:1px solid var(--border-strong); background:var(--surface); font-size:var(--fs-num); color:var(--text-2); border-radius:var(--r-sm)}
.bigstep .v{min-width:96px; text-align:center; font-size:var(--fs-num); font-weight:700}
.bigstep .v small{font-size:var(--fs-body); color:var(--text-3); font-weight:600; margin-left:var(--s4)}
.bigstep.sm button{width:50px; height:50px; font-size:var(--fs-head); border-radius:var(--r-md)}
.bigstep.sm .v{min-width:74px; font-size:var(--fs-num)}
.bigstep.bad .v{color:var(--rust)}
.bigstep.bad button{border-color:var(--rust); color:var(--rust)}
.infant{display:flex; align-items:center; gap:var(--s12); margin-top:var(--s24); padding:var(--s16);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); flex-wrap:wrap}
.infant .t{font-weight:700}
.infant .s{font-size:var(--fs-sub); color:var(--text-3)}
.infant .bigstep{margin-top:0; margin-left:auto}
.infant.bad{border-color:var(--rust); background:var(--rust-soft)}
.infant.bad .t{color:var(--rust)}
/* 3단계 좌석 — 룸/홀 칸(.scell). 남은 자리는 .avail 배지와 .gauge 막대로, 겹치면 .warned(벽돌색)로 알리되 막지 않습니다 */
.seat-note{font-size:var(--fs-sub); color:var(--text-2); background:var(--surface-2); border:none;
  border-radius:var(--r-md); padding:var(--s8) var(--s12); margin-bottom:var(--s16)}
.sgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:var(--s8); margin-top:var(--s8)}
.sgrid.hall{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sgrid.any{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.scell{position:relative; border:1px solid var(--border-strong); background:var(--surface); padding:var(--s16) var(--s8); display:flex; flex-direction:column; align-items:center; gap:var(--s4); border-radius:var(--r-md)}
.scell .sn{font-size:var(--fs-title); font-weight:700}
.scell .sc{font-size:var(--fs-sub); color:var(--text-3)}
.scell .sb{position:absolute; top:6px; right:6px; font-size:var(--fs-label); font-weight:700;
  color:var(--amber); background:var(--amber-soft); border-radius:var(--r-sm); padding:var(--s4) var(--s4)}
.scell.busy{background:var(--surface-2); border-style:dashed}
.scell.on{background:var(--pine); border-color:var(--pine)}
.scell.on .sn,.scell.on .sc{color:#fff}
.scell.on .sb{background:rgba(255,255,255,.25); color:#fff}
.scell.any{padding:var(--s16) var(--s8)}
.scell .avail{margin-top:var(--s4); font-size:var(--fs-label); font-weight:700; padding:var(--s4) var(--s8); border-radius:var(--r-sm)}
.scell .avail.free{background:var(--pine-soft); color:var(--pine)}
.scell .avail.warn{background:var(--amber-soft); color:var(--amber)}
.scell .avail.blocked{background:var(--rust-soft); color:var(--rust)}
.scell.on .avail{background:rgba(255,255,255,.22); color:#fff}
.scell .sc2{font-size:var(--fs-label); color:var(--text-3)}
.scell .gauge{width:100%; height:7px; background:var(--border); border-radius:var(--r-sm); margin:var(--s8) 0 var(--s4); overflow:hidden}
.scell .gauge i{display:block; height:100%; background:var(--pine); border-radius:var(--r-sm)}
.scell.full .gauge i{background:var(--rust)}
.scell .sb.rust{color:var(--rust); background:var(--rust-soft)}
.scell.on .gauge{background:rgba(255,255,255,.3)}
.scell.on .gauge i{background:#fff}
/* 좌석 셀 이동 가능 안내 */
.scell .movable{margin-top:var(--s4); font-size:var(--fs-label); font-weight:700; color:var(--amber)}
.scell.on .movable{color:rgba(255,255,255,.85)}
.scell.on.warned{background:var(--rust); border-color:var(--rust)}
.scell.on.warned .avail{background:rgba(255,255,255,.24); color:#fff}
/* 0단계 예약 경로 · 4단계 메뉴 — 같은 큰 카드(.srccell)를 씁니다. 메뉴는 .menu4/.menu2 로 칸 수만 다름 */
.srcgrid{display:grid; grid-template-columns:1fr; gap:var(--s12)}
.srcgrid.menu4{grid-template-columns:1fr 1fr}
.srcgrid.menu2{grid-template-columns:1fr 1fr}
.srccell{border:1px solid var(--border-strong); background:var(--surface); padding:var(--s24) var(--s16); display:flex; flex-direction:column; gap:var(--s4); text-align:left; position:relative; border-radius:var(--r-md)}
.srccell .s-l{font-size:var(--fs-head); font-weight:700}
.srccell .s-d{font-size:var(--fs-sub); color:var(--text-3)}
.srccell.on{background:var(--pine); border-color:var(--pine)}
.srccell.on .s-l,.srccell.on .s-d{color:#fff}
.srccell .s-n{position:absolute; top:10px; right:12px; min-width:24px; height:24px; border-radius:var(--r-md);
  background:var(--pine); color:#fff; font-size:var(--fs-sub); font-weight:700; display:grid; place-items:center; padding:0 var(--s8)}
.srccell.on .s-n{background:#fff; color:var(--pine)}
.srccell.warned{background:var(--rust); border-color:var(--rust)}
.srccell.warned .s-l,.srccell.warned .s-d{color:#fff}
.course-sum{display:flex; align-items:center; gap:var(--s12); margin-top:var(--s16); padding:var(--s12) var(--s16);
  background:var(--surface-2); border:none; border-radius:var(--r-md); font-size:var(--fs-body)}
/* 코스 고르기 팝업 — 그룹(.cgroup)마다 코스 칸(.citem), 인원은 오른쪽 위 붉은 숫자(.cnum) */
.cgroup{margin-bottom:var(--s16)}
.cgroup.off{opacity:.5}
.cg-label{font-size:var(--fs-sub); font-weight:700; color:var(--text-3); margin-bottom:var(--s8)}
.cg-items{display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:var(--s8)}
.citem{position:relative; border:1px solid var(--border-strong); background:var(--surface); padding:var(--s16) var(--s8); font-size:var(--fs-title); font-weight:700; color:var(--text); border-radius:var(--r-md)}
.citem.on{background:var(--pine); border-color:var(--pine); color:#fff}
.citem.warned{background:var(--rust); border-color:var(--rust); color:#fff}
.cnum{position:absolute; top:-8px; right:-6px; min-width:22px; height:22px; border-radius:var(--r-md);
  background:var(--rust); color:#fff; font-size:var(--fs-sub); font-weight:700; font-style:normal;
  display:grid; place-items:center; padding:0 var(--s4); border:2px solid var(--bg)}
.course-total{text-align:center; font-size:var(--fs-body); color:var(--text-2); padding:var(--s12) 0 var(--s4)}
.course-total b{font-size:var(--fs-title); color:var(--text)}
/* 코스 인원 경고 */
.course-total.bad{color:var(--rust)}
.course-total.bad b{color:var(--rust)}
.ct-warn{font-size:var(--fs-sub); font-weight:700; color:var(--rust); margin-top:var(--s4)}
.undecided{width:100%; margin:var(--s8) 0 var(--s4); border:1px dashed var(--border-strong);
  background:var(--surface-2); border-radius:var(--r-md); padding:var(--s16); font-size:var(--fs-body);
  font-weight:600; color:var(--text-2)}
.undecided.on{border-style:solid; border-color:var(--pine); background:var(--pine-soft); color:var(--pine)}
/* 마지막 단계의 입력 요약(.rv) 과 등록 완료 상자 */
.wz-review{margin-top:var(--s24); background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:var(--s16) var(--s16)}
.rv{display:flex; gap:var(--s12); padding:var(--s8) 0; font-size:var(--fs-body)}
.rv span{color:var(--text-3); width:56px; flex:none; font-weight:600}
.rv b{font-weight:700}
.done-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--s32) var(--s24) var(--s24); max-width:520px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(20,20,18,.1)}
.done-box .check{width:60px; height:60px; margin:0 auto var(--s16); border-radius:50%;
  background:var(--pine-soft); color:var(--pine); font-size:var(--fs-num); display:grid; place-items:center}
.done-msg{font-size:var(--fs-head); line-height:1.7; margin:0 0 var(--s12); font-weight:500}
.done-msg b{font-weight:700}
.done-sub{font-size:var(--fs-body); color:var(--text-2); line-height:1.7}
.done-btns{display:flex; gap:var(--s12); margin-top:var(--s24)}
.done-btns .btn{flex:1}
/* ---------- 예약 처리(방문·노쇼·취소) 시트 · 예약 상세 시트 ----------
   .markbtn 은 눌러서 상태를 바꾸는 큰 버튼, .spick 은 상세에서 좌석을 다시 고르는 칸 */
.mark-info{background:var(--surface-2); border:none; border-radius:var(--r-md); padding:var(--s16) var(--s16); margin-bottom:var(--s16)}
.mark-info .mi-t{font-size:var(--fs-title); font-weight:700}
.mark-info .mi-s{font-size:var(--fs-sub); color:var(--text-2); margin-top:var(--s4)}
/* 예약 상세의 경고 줄 — .mi-s 가 회색이라 덮이고 있었습니다 */
.mark-info .mi-s.warn-txt{color:var(--rust); font-weight:700}
.mi-meta{display:flex; flex-wrap:wrap; gap:var(--s8) var(--s16); margin-top:var(--s12); padding-top:var(--s8);
  border-top:1px solid var(--border); font-size:var(--fs-sub); color:var(--text-3)}
.markgrid{display:grid; gap:var(--s8); grid-template-columns:repeat(2,1fr)}
.markbtn{border:1px solid var(--border-strong); background:var(--surface); padding:var(--s16) var(--s12); font-size:var(--fs-body); font-weight:700; color:var(--text); border-radius:var(--r-sm)}
.markbtn.ok.on,.markbtn.ok:hover{background:var(--pine); border-color:var(--pine); color:#fff}
.markbtn.no.on,.markbtn.no:hover{background:var(--rust); border-color:var(--rust); color:#fff}
.markbtn.cancel.on,.markbtn.cancel:hover{background:var(--text-2); border-color:var(--text-2); color:#fff}
.markbtn.back{color:var(--text-2); grid-column:auto; font-size:var(--fs-body); font-weight:700; padding:var(--s16) var(--s12)}
.markbtn.back.on{background:var(--pine-soft); border-color:var(--pine); color:var(--pine)}
.ptotal{margin-top:var(--s24); text-align:center; font-size:var(--fs-title); color:var(--text-2)}
.ptotal b{font-size:var(--fs-head); color:var(--text)}
.seatpick{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:var(--s8)}
.spick{position:relative; border:1px solid var(--border-strong); background:var(--surface); padding:var(--s12) var(--s8); font-size:var(--fs-body); font-weight:700; color:var(--text); border-radius:var(--r-sm)}
.spick small{font-weight:500; color:var(--text-3); font-size:var(--fs-label)}
.spick.busy{opacity:.48; background:var(--surface-2)}
.spick.first{border-color:var(--pine); background:var(--pine-soft); color:var(--pine)}
.spick i{position:absolute; top:-7px; right:6px; font-style:normal; font-size:var(--fs-label); font-weight:700;
  background:var(--pine); color:#fff; border-radius:var(--r-sm); padding:var(--s4) var(--s4)}
/* 좌석 확정 */
.spick.picked{border-color:var(--text); background:var(--text); color:#fff}
.seatconfirm{display:flex; align-items:center; gap:var(--s8); flex-wrap:wrap;
  margin-top:var(--s12); padding:var(--s12) var(--s12); border:1px solid var(--border-strong);
  border-radius:var(--r-sm); background:var(--surface-2); font-size:var(--fs-sub)}
.seatconfirm span{margin-right:auto}
/* ---------- 문자 안내 (예약 상세의 문자 칸 · 보낸 문자 목록) ----------
   지금은 흉내만 냅니다. .sb-mock 표시는 지우지 마세요 — 3구역 .mockbar 주석 참고 */
.sms-box{border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s12) var(--s12); margin-top:var(--s16);
  background:var(--surface)}
.sb-t{font-size:var(--fs-sub); font-weight:700; color:var(--text-2); margin-bottom:var(--s8);
  display:flex; align-items:baseline; gap:var(--s8); flex-wrap:wrap}
.sb-mock{font-size:var(--fs-label); font-weight:600; color:#8A6A2A; background:#FBF1DC;
  border:1px dashed #D9BF87; border-radius:var(--r-sm); padding:var(--s4) var(--s8)}
.sms-row{display:flex; justify-content:space-between; gap:var(--s12); padding:var(--s4) 0; font-size:var(--fs-sub)}
.sms-row .sm-l{color:var(--text-3); font-weight:600; flex:none}
.sms-row .sm-r{color:var(--text); text-align:right}
.sms-row .sm-r i{font-style:normal; color:var(--text-3)}
.sms-row.bad .sm-r i{color:var(--rust); font-weight:700}
.sb-why{font-size:var(--fs-sub); color:var(--rust); font-weight:600; margin-top:var(--s8); line-height:1.5}
.sb-btns{display:flex; flex-wrap:wrap; gap:var(--s8); margin-top:var(--s12)}
/* 재안내 시각 고르기 */
.hourpick{display:flex; flex-wrap:wrap; gap:var(--s8); margin-top:var(--s8)}
.hourpick button{
  border:1px solid var(--border-strong); background:var(--surface); border-radius:var(--r-sm);
  padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:600; color:var(--text-2);
}
.hourpick button.on{background:var(--pine); border-color:var(--pine); color:#fff}
/* 문안 미리보기 — 실제 문자처럼 보이게 */
.smsprev{border:1px solid var(--border); border-radius:var(--r-md); margin-top:var(--s12); overflow:hidden}
.smsprev .smsmsg{margin:0 var(--s12); padding:var(--s12) 0}
.sp-h{background:var(--surface-2); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:700; color:var(--text-2);
  display:flex; justify-content:space-between; gap:var(--s8)}
.sp-h span{font-weight:500; color:var(--text-3)}
/* 문자 내용 — 위아래 점선으로 '여기부터 여기까지가 손님께 가는 글'임을 끊어 줍니다.
   점선은 화면에만 그려집니다. 실제 문자에는 들어가지 않습니다. */
.smsmsg{
  display:block; white-space:pre-wrap;
  border-top:1px dashed var(--border-strong);
  border-bottom:1px dashed var(--border-strong);
  padding:var(--s12) 0; margin:var(--s4) 0;
  font-size:var(--fs-sub); line-height:1.75; color:var(--text);
}
/* 보낸 문자 목록 */
.smsbox{max-height:52vh; overflow-y:auto; border:1px solid var(--border); border-radius:var(--r-sm)}
.smsrow{display:block; width:100%; text-align:left; background:var(--surface);
  border:none; border-bottom:1px solid var(--border); padding:var(--s12) var(--s12)}
.smsrow:last-child{border-bottom:none}
.smsrow .smsmsg{font-size:var(--fs-sub); line-height:1.65; color:var(--text-2); padding:var(--s8) 0}
.sr-top{display:flex; align-items:center; gap:var(--s8); flex-wrap:wrap; margin-bottom:var(--s4)}
.sr-t{font-size:var(--fs-label); color:var(--text-3); font-variant-numeric:tabular-nums}
.sr-k{font-size:var(--fs-label); font-weight:700; border-radius:var(--r-sm); padding:1px var(--s8)}
.sr-k.new{background:var(--pine-soft); color:var(--pine)}
.sr-k.rem{background:var(--blue-soft); color:var(--blue)}
.sr-n{font-size:var(--fs-sub); font-weight:700; color:var(--text)}
.sr-p{font-size:var(--fs-label); color:var(--text-3)}
/* 당일 변동 상자 — 파란 펜 (3구역 .chg-tag 참고) */
.chg-box{border:1px solid var(--blue-line); background:var(--blue-soft);
  border-radius:var(--r-md); padding:var(--s12) var(--s12); margin-top:var(--s12)}
.cb-t{font-size:var(--fs-sub); font-weight:700; color:var(--blue); margin-bottom:var(--s8)}
.cb-l{font-size:var(--fs-sub); color:var(--text); line-height:1.7}
.cb-tm{display:inline-block; min-width:52px; font-weight:700; color:var(--text-3)}
.cb-s{font-size:var(--fs-label); color:var(--text-2); margin-top:var(--s8)}
/* 메모 — 요청사항과 구분되게 */
.memo-line{color:var(--blue)}
/* 노쇼 이력 안내 */
.ns-hint{margin-top:var(--s8); font-size:var(--fs-sub); font-weight:700; color:var(--rust);
  background:var(--rust-soft); border:1px solid #EFD3CC; border-radius:var(--r-sm); padding:var(--s8) var(--s12)}
/* 사용 중지 기간에 걸리는 예약 목록 — 누르면 그 예약으로 바로 갑니다 */
.blk-hits{border:1px solid #EFD3CC; background:var(--rust-soft); border-radius:var(--r-md);
  padding:var(--s12) var(--s12); margin:var(--s4) 0 var(--s16)}
.bh-t{font-size:var(--fs-sub); font-weight:700; color:var(--rust); margin-bottom:var(--s8)}
.bh-row{display:flex; align-items:center; gap:var(--s8); width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:var(--s8) var(--s12); margin-bottom:var(--s8); font-size:var(--fs-sub); color:var(--text)}
.bh-row b{font-weight:700; white-space:nowrap}
.bh-row i{margin-left:auto; font-style:normal; font-size:var(--fs-sub); color:var(--text-3); white-space:nowrap}
.bh-row:hover{border-color:var(--border-strong); background:var(--surface-2)}
.bh-more{font-size:var(--fs-sub); color:var(--text-3); margin:var(--s4) 0 var(--s8)}
.bh-s{font-size:var(--fs-sub); line-height:1.6; color:var(--text-2)}
.bh-s b{color:var(--rust)}
/* 디스플레이 주소 안내 상자 (설정 → 디스플레이) */
.urlbox{border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s12) var(--s16); margin-bottom:var(--s16); background:var(--surface-2)}
.ub-t{font-size:var(--fs-sub); font-weight:700; color:var(--text-3); margin-bottom:var(--s8)}
.ub-u{font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-sub); color:var(--text);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:var(--s8) var(--s12); word-break:break-all; margin-bottom:var(--s8)}
.ub-s{font-size:var(--fs-sub); color:var(--text-3); line-height:1.55; margin-bottom:var(--s12)}
.tbl-in{display:inline-flex; align-items:center; gap:var(--s8); font-size:var(--fs-sub); color:var(--text-3); font-weight:600}
.tbl-in input{width:62px; padding:var(--s8) var(--s8); font-size:var(--fs-body); text-align:center}
/* ---------- 옛 예약 카드 (.res) 와 그 부품 ----------
   카드형 목록(renderRes)은 지금 호출되지 않지만 .filters 등 일부 부품은 다른 화면에서 씁니다.
   화면을 안 바꾸는 원칙대로 두고, Phase 3 에서 실제로 쓰이는 것만 남길 것 */
.filters{display:flex; gap:var(--s8); overflow-x:auto; padding-bottom:var(--s4); margin-bottom:var(--s12); -webkit-overflow-scrolling:touch}
.filters button{white-space:nowrap; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:600; border-radius:var(--r-sm)}
.filters button.on{background:var(--text); border-color:var(--text); color:#fff}
.res-list{display:grid; gap:var(--s12); grid-template-columns:1fr !important}
.res{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden; display:flex}
.res .stripe{width:4px; flex:none; background:var(--pine)}
.res.s-방문 .stripe{background:var(--border-strong)}
.res.s-취소 .stripe{background:var(--border-strong)}
.res.s-노쇼 .stripe{background:var(--rust)}
.res.s-방문,.res.s-취소{opacity:.62}
.res .body{flex:1; min-width:0; padding:var(--s12) var(--s16)}
.res .l1{display:flex; align-items:baseline; gap:var(--s8); flex-wrap:wrap}
.res .tm{font-weight:700; letter-spacing:-.01em; font-size:var(--fs-title)}
.res .nm{font-weight:600; font-size:var(--fs-title)}
.res .pp{font-size:var(--fs-sub); color:var(--text-2)}
.res .rm{margin-left:auto}
.res .l2{color:var(--text-2); margin-top:var(--s4); word-break:break-word; font-size:var(--fs-body)}
.res .l3{display:flex; gap:var(--s8); margin-top:var(--s12); align-items:center; flex-wrap:wrap}
.res .l3 select{width:auto; padding:var(--s8) var(--s8); font-size:var(--fs-sub); border-radius:var(--r-sm)}
.res .l3 .btn{margin-left:auto}
.sbtns{display:flex; gap:var(--s4); flex-wrap:wrap}
.sbtn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:var(--r-sm); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:700}
.sbtn:hover{background:var(--surface-2); color:var(--text)}
.sbtn.on.ok{background:var(--pine); border-color:var(--pine); color:#fff}
.sbtn.on.done{background:var(--text-2); border-color:var(--text-2); color:#fff}
.sbtn.on.no{background:var(--rust); border-color:var(--rust); color:#fff}
.sbtn.on.cancel{background:#9C9482; border-color:#9C9482; color:#fff}
.l3-r{display:flex; gap:var(--s8); margin-left:auto}
.warn-txt{color:var(--rust); font-weight:700}
/* ---------- 확인창 (renderModal) — 경고는 제목이 벽돌색, 안내는 초록 ---------- */
.modal{width:100%; max-width:420px; background:var(--bg); overflow:hidden; box-shadow:0 12px 40px rgba(20,20,18,.28); margin:0 var(--s16); border-radius:var(--r-lg)}
.modal.warn .md-h{color:var(--rust); font-size:var(--fs-head)}
.modal.ok .md-h{color:var(--pine)}
.md-h{padding:var(--s24) var(--s24) 0; font-size:var(--fs-head); font-weight:700; line-height:1.4}
.md-b{padding:var(--s12) var(--s24) var(--s16); font-size:var(--fs-body); color:var(--text-2); line-height:1.65}
.md-l{white-space:pre-wrap}
.md-gap{height:9px}
/* 확인창 안의 가로선 (renderModal 의 '---' 줄) */
.md-rule{border-top:1px dashed var(--border-strong); margin:var(--s8) 0}
.md-f{display:flex; gap:var(--s8); padding:0 var(--s16) var(--s16); justify-content:flex-end}
.md-f .btn{min-width:96px; padding:var(--s12) var(--s16); font-size:var(--fs-body)}

/* ---------- 움직임 (Phase 6-1) — 딱 세 곳만 ----------
   시트는 아래에서 200ms 올라오고, 확인창은 150ms 떠오릅니다. '반응하는 도구' 느낌은 이 정도로 충분하고,
   전화 받으며 쓰는 화면이라 그 이상은 기다리게 만듭니다. transform 은 translate 만 (scale 은 배율 zoom 과 부딪혀 잘림) */
@keyframes sheet-in{from{transform:translateY(24px); opacity:0} to{transform:none; opacity:1}}
@keyframes modal-in{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}
@keyframes fade-in{from{opacity:0} to{opacity:1}}
.sheet, .calbox{animation:sheet-in .2s ease-out}
.modal{animation:modal-in .15s ease-out}
.overlay{animation:fade-in .15s ease-out}


/* ============================================================
   7. 설정
   ============================================================ */
/* ---------- 적용하기 바 ----------
   설정은 임시본(draft)에 쌓였다가 '적용하기'를 눌러야 반영됩니다. 바뀐 것이 있으면(.on) 호박색으로 알립니다.
   sticky 라 긴 설정 화면을 내려도 화면 아래에 붙어 있습니다 */
.applybar{position:sticky; bottom:12px; display:flex; align-items:center; gap:var(--s8); margin-top:var(--s24); background:var(--surface); border:1px solid var(--border); padding:var(--s12) var(--s16); box-shadow:0 4px 18px rgba(20,20,18,.12); border-radius:var(--r-md)}
.applybar.on{border-color:var(--amber); background:var(--amber-soft)}
.applybar.on .ab-t{color:var(--amber)}
.applybar .btn:disabled{opacity:.4}
.ab-t{flex:1; font-size:var(--fs-sub); font-weight:700; color:var(--text-2)}

/* ---------- 좌석 배정 순서 줄의 ▲▼ 버튼 (설정 → 좌석) ----------
   Phase 4-3 전까지 이 버튼에는 CSS 가 없어 브라우저 기본 버튼(28px)으로 나왔습니다. 손가락으로 누르므로 44px. */
.ordbtns{display:inline-flex; gap:var(--s4); flex:none}
.ordbtns button{min-width:44px; min-height:44px; border:1px solid var(--border-strong); background:var(--surface);
  border-radius:var(--r-sm); font-size:var(--fs-sub); color:var(--text-2); cursor:pointer; -webkit-tap-highlight-color:transparent}
.ordbtns button:active{filter:brightness(.9)}
.ordbtns button:disabled{opacity:.3; cursor:default}
.ordnum{width:24px; text-align:center; font-weight:700; color:var(--text-3); flex:none}

/* ---------- 좌석·정원 설정 줄 (.tset) — 이름 · 정원 · 버튼이 한 줄 ---------- */
.tset{flex-wrap:wrap; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:var(--s8); padding:var(--s12) 0; border-radius:var(--r-sm)}
.tset:last-child{border-bottom:none}
.tset label{display:flex; align-items:center; gap:var(--s8)}
.tset label span{font-size:var(--fs-sub); color:var(--text-3); font-weight:600}
.tset input[type=number]{width:78px; padding:var(--s8) var(--s12); font-size:var(--fs-body)}
.tset .btn{margin-left:auto}
.tset label.chk{margin:0}
.tset .numbtn.sm{flex:1}
