.tsum{margin-top:var(--s12); font-size:var(--fs-body); color:var(--text-2)}
.tsum b{color:var(--text); font-size:var(--fs-body)}

/* ---------- 운영시간 ---------- */
/* 적용 시작일별 운영시간 묶음. 지금 적용 중인 것(.cur)은 초록 바탕으로 카드 폭까지 넓혀 표시 */
.schrow{padding:var(--s12) 0; border-bottom:1px solid var(--border)}
.schrow:last-of-type{border-bottom:none}
.schrow.cur{background:var(--pine-soft); margin:0 -14px; padding:var(--s12) var(--s16); border-radius:var(--r-sm); border-bottom:none}
.sch-h{display:flex; align-items:center; gap:var(--s8); margin-bottom:var(--s8); font-size:var(--fs-body)}
.sch-days{display:grid; grid-template-columns:1fr; gap:var(--s4)}
.sch-d{font-size:var(--fs-sub); color:var(--text-2)}
/* 요일 한 글자에 맞춘 18px 이었는데 '공휴'는 두 글자라 시간과 붙어 버렸습니다.
   최소 너비만 주고 넘치면 늘어나게, 뒤에 여백을 둡니다. */
.sch-d b{display:inline-block; min-width:18px; margin-right:var(--s4); color:var(--text); font-weight:700}
/* 요일별 편집 줄 (운영시간 수정 시트) — 일요일은 벽돌색, 토요일은 파란색 글자 */
.dayrow{border:1px solid var(--border); padding:var(--s12) var(--s12); margin-bottom:var(--s8); background:var(--surface); border-radius:var(--r-md)}
.dayrow.sun .dr-h b{color:#B0553F}
.dayrow.sat .dr-h b{color:#3E6291}
.dr-h{display:flex; align-items:center; gap:var(--s12); margin-bottom:var(--s8)}
.dr-h b{font-size:var(--fs-body)}
.dr-h .btn{margin-left:auto}
.dr-in label{display:flex; align-items:center; gap:var(--s8); margin-bottom:var(--s8); flex-wrap:wrap}
.dr-in label span{font-size:var(--fs-sub); color:var(--text-3); font-weight:600; width:66px; flex:none}
.dr-in label em{font-style:normal; color:var(--text-3)}
.dr-in input{width:auto; flex:1 1 100px; min-width:96px; padding:var(--s8) var(--s12); font-size:var(--fs-body)}
.dr-in input:disabled{background:var(--surface-2); color:var(--text-3)}
/* 체크박스 줄 — .dr-in label 과 우선순위가 같아 반드시 그 뒤에 와야 합니다 (같은 요소에 둘 다 걸림) */
label.chk{display:flex; align-items:center; gap:var(--s8); font-size:var(--fs-sub); color:var(--text-2); margin:var(--s4) 0 var(--s12)}
label.chk input{width:18px; height:18px; flex:none; accent-color:var(--pine)}
label.chk span{width:auto}

/* ---------- 디스플레이 배치 (손님용 TV 에 좌석을 어느 줄에 놓을지) ----------
   한 줄에 너무 많이 넣으면(.over) 벽돌색으로 알리되 막지 않습니다 */
.disprow{border:1px solid var(--border); padding:var(--s12) var(--s12); margin-bottom:var(--s8); background:var(--surface); border-radius:var(--r-md)}
.disprow.over{border-color:var(--rust); background:var(--rust-soft)}
.disprow.over .dr-title span{color:var(--rust); font-weight:700}
.dr-title{font-size:var(--fs-sub); font-weight:700; color:var(--text-2); margin-bottom:var(--s8)}
.dr-title span{font-weight:500; color:var(--text-3); margin-left:var(--s4)}
.dr-cells{display:flex; flex-wrap:wrap; gap:var(--s8)}
.dcell{display:inline-flex; align-items:center; gap:var(--s4); background:var(--surface-2); border:1px solid var(--border); padding:var(--s8) var(--s8) var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:600; border-radius:var(--r-sm)}
.dcell button{width:36px; height:36px; border:1px solid var(--border); background:var(--surface);
  border-radius:var(--r-sm); font-size:var(--fs-label); color:var(--text-3); padding:0}
.dcell button:disabled{opacity:.3}

/* ---------- 홀 테이블 구성 (구역 .zone) 과 구역 배치도 (.zmap) ---------- */
.zone{border:1px solid var(--border); padding:var(--s12) var(--s12); margin-bottom:var(--s12); background:var(--surface); border-radius:var(--r-md)}
.z-h{display:flex; align-items:center; gap:var(--s8); margin-bottom:var(--s12)}
.z-name{flex:1; padding:var(--s8) var(--s12); font-size:var(--fs-body); font-weight:700}
.z-join{display:flex; align-items:center; gap:var(--s12); flex-wrap:wrap; padding-top:var(--s12)}
.z-join .lbl{font-size:var(--fs-sub)}
.z-cap{display:block; margin-top:var(--s8); font-size:var(--fs-sub); color:var(--text-3)}
.z-cap b{color:var(--text)}
/* 배치도 — 테이블 한 칸(.zm-t) 38px, 붙일 수 있는 조합은 .zm-c.join 으로 초록 바탕 */
.zmap{margin-top:var(--s12); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s12)}
.zm-zone{padding:var(--s12) 0; border-bottom:1px dashed var(--border-strong)}
.zm-zone:last-of-type{border-bottom:none}
.zm-h{display:flex; align-items:baseline; gap:var(--s8); margin-bottom:var(--s8); flex-wrap:wrap}
.zm-h b{font-size:var(--fs-body)}
.zm-h span{font-size:var(--fs-sub); color:var(--text-3)}
.zm-tables{display:flex; flex-wrap:wrap; gap:var(--s8)}
.zm-t{width:38px; height:38px; display:grid; place-items:center; border-radius:var(--r-sm); border:1px solid var(--border-strong); font-size:var(--fs-body); font-weight:700; background:var(--surface); color:var(--text)}
.zm-t.joinable{background:var(--pine-soft); border-color:var(--text); color:var(--text)}
.zm-note{font-size:var(--fs-label); color:var(--text-3); margin-top:var(--s8)}
.zm-legend{font-size:var(--fs-label); color:var(--text-3); margin-top:var(--s12); padding-top:var(--s8)}
.zm-sub{font-size:var(--fs-label); font-weight:700; color:var(--text-3); margin:var(--s12) 0 var(--s8)}
.zm-combos{display:flex; flex-wrap:wrap; gap:var(--s8)}
.zm-c{display:inline-flex; flex-direction:column; align-items:center; gap:1px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:var(--s4) var(--s8)}
.zm-c.join{background:var(--pine-soft); border-color:var(--border-strong)}
.zm-c b{font-size:var(--fs-sub); font-weight:700}
.zm-c i{font-style:normal; font-size:var(--fs-label); color:var(--text-3)}

/* ---------- 코스 구성 편집 — 그룹마다 언제 파는지(.wbtn: 종일/평일점심…)를 고릅니다 ---------- */
.cgedit{padding:var(--s12) 0; border-bottom:1px solid var(--border)}
.cgedit:last-of-type{border-bottom:none}
.whenrow{display:flex; align-items:center; gap:var(--s8); flex-wrap:wrap; margin-top:var(--s4)}
.wbtn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2); padding:var(--s8) var(--s12); font-size:var(--fs-sub); font-weight:700; border-radius:var(--r-sm)}
.wbtn.on{background:var(--pine); border-color:var(--pine); color:#fff}

/* ---------- 접속 기록 — 고정폭 글꼴로 시각·IP 가 줄 맞춰 보이게 ---------- */
.logbox{max-height:52vh; overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:var(--s8) 0}
.logrow{display:flex; gap:var(--s12); padding:var(--s8) var(--s12); border-bottom:1px solid var(--border);
  font-size:var(--fs-sub); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap}
.logrow:last-child{border-bottom:none}
.lg-t{color:var(--text-3); flex:none}
.lg-ip{color:var(--text-2); width:120px; flex:none; overflow:hidden; text-overflow:ellipsis}
.lg-a{font-weight:700; width:96px; flex:none}
.lg-d{color:var(--text-2); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}


/* ============================================================
   8. 잠금 · 매장 선택
   ============================================================ */
/* ---------- 매장 선택 (사진 분할) ----------
   화면을 좌우로 갈라 두 매장 사진을 놓습니다. 배율(zoom)은 걸지 않습니다 — 사진이 화면을 꽉 채우는 구성이라서.
   마우스를 올리면 그쪽이 조금 넓어지고 사진이 커집니다(hover 미디어, 11구역) */
.split{display:flex; width:100%; height:100vh; height:100dvh; overflow:hidden; background:#15130F}
.split .panel + .panel{box-shadow:-1px 0 0 rgba(255,255,255,.22)}
.panel{
  position:relative; flex:1 1 50%; border:none; padding:0; margin:0;
  background:none; overflow:hidden; color:#fff;
  transition:flex-grow .6s cubic-bezier(.22,1,.36,1);
}
.panel .bg{
  position:absolute; inset:0; background-size:cover; background-position:center;
  transform:scale(1.02); filter:saturate(.9) brightness(.6);
  transition:transform 1.1s cubic-bezier(.22,1,.36,1), filter .6s ease;
}
.panel[data-store="anjip"] .bg{background-image:var(--img-anjip)}
.panel[data-store="hanok"] .bg{background-image:var(--img-hanok)}
/* 사진 위 어두운 막 — 글자가 읽히게 */
.panel .veil{
  position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(15,19,16,.28) 0%,rgba(15,19,16,.12) 42%,rgba(15,19,16,.7) 100%);
  transition:opacity .6s ease;
}
.panel .label{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:var(--s16); padding:var(--s24); text-align:center}
/* 매장 이름은 명조 — 관리 화면에서 명조를 쓰는 유일한 곳(간판 역할) */
.panel .name{
  font-family:var(--serif); font-weight:700; font-size:clamp(30px,5.2vw,60px);
  letter-spacing:.22em; text-indent:.22em; text-shadow:0 2px 20px rgba(0,0,0,.55);
  transition:letter-spacing .6s cubic-bezier(.22,1,.36,1);
}
.panel .rule{width:24px; height:1px; background:rgba(255,255,255,.75);
  transition:width .6s cubic-bezier(.22,1,.36,1), background .4s}
.panel .meta{font-size:var(--fs-sub); letter-spacing:.06em; color:rgba(255,255,255,.8);
  opacity:0; transform:translateY(6px); transition:opacity .5s, transform .5s}
.panel .badge{
  display:inline-block; margin-top:var(--s4); padding:var(--s4) var(--s12); border-radius:999px;
  border:1px solid rgba(255,255,255,.4); color:rgba(255,255,255,.82);
  font-size:var(--fs-sub); letter-spacing:.1em;
}
/* 잠긴 매장(.locked) — 흑백 처리 + 잠금 표시. 지금은 안 쓰이고 아래 .soon 을 씁니다 */
.panel.locked{cursor:not-allowed}
.panel.locked .bg{filter:grayscale(1) brightness(.34)}
.panel.locked .name{color:rgba(255,255,255,.62)}
.panel.locked .rule{background:rgba(255,255,255,.35)}
/* 준비 중인 매장(.soon, 안집) — 눌리는 것처럼 보이지만 아무 일도 하지 않습니다.
   ※ .panel.soon:hover .bg 는 hover 미디어(1.08)와 우선순위가 같아서 11구역 끝에 한 번 더 있습니다 (그래야 1.03 이 이김) */
.panel.soon{filter:none; opacity:1; cursor:default}
.panel.soon .veil{background:rgba(15,14,12,.52)}
.panel.soon:hover .veil{background:rgba(15,14,12,.44)}
.panel.soon:hover .bg{transform:scale(1.03)}
.panel.soon .badge{background:rgba(244,242,238,.16); border-color:rgba(244,242,238,.34); color:#F4F2EE}

/* ---------- PIN 잠금 ----------
   .lock 자체(배율 포함)는 4구역에 있습니다. 새로 열 때마다 입력합니다 (자동 로그인 없음) */
.lockbox{width:100%; max-width:340px; text-align:center}
.lk-title{font-weight:700; font-family:var(--serif); font-size:var(--fs-head); letter-spacing:.06em}
.lk-sub{font-size:var(--fs-body); color:var(--text-2); margin-top:var(--s8)}
/* PIN 자리 — 작은 빈 원. 채울 때마다 매장 이름이 한 글자씩(f1~f4 는 글자마다 다른 글꼴) 색이 들어옵니다.
   처음엔 네모 칸이 튀어오르는 방식이었는데 산만해서 원 + 글자색만 바뀌게 줄였습니다 */
.pdots{display:flex; justify-content:center; margin:var(--s24) 0 var(--s8); gap:var(--s16)}
.pdot{width:38px; height:38px; border:1.5px solid var(--border-strong); background:transparent; display:grid; place-items:center; font-size:var(--fs-head); font-weight:700; color:transparent; transition:all .2s ease; box-shadow:none; border-radius:var(--r-sm)}
.pdot.on{background:transparent; border-color:transparent; transform:none; box-shadow:none; color:var(--text)}
.pdot.f1{font-family:'Nanum Myeongjo',serif}
.pdot.f2{font-family:'Noto Serif KR',serif; font-weight:700}
.pdot.f3{font-family:'Pretendard','Noto Sans KR',sans-serif; font-weight:700}
.pdot.f4{font-family:'Nanum Myeongjo',serif; font-weight:700; font-style:italic}
.lk-err{height:20px; font-size:var(--fs-sub); color:var(--rust); font-weight:600; margin-bottom:var(--s16)}
/* 숫자 키패드 — 64px 높이, 카운터에서 손가락으로 */
.pkeys{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s12)}
.pkey{height:64px; border:1px solid var(--border-strong); background:var(--surface); font-size:var(--fs-num); font-weight:700; color:var(--text); border-radius:var(--r-sm)}
.pkey:hover{background:var(--surface-2)}
.pkey.sub{color:var(--text-2); font-size:var(--fs-head); font-weight:400}
.lk-note{font-size:var(--fs-sub); color:var(--text-3); margin-top:var(--s24); line-height:1.6}
/* PIN_ANY 가 켜져 있을 때만 뜹니다. 잠금이 풀려 있다는 사실이 눈에 보여야
   "잠긴 줄 알았는데 아니었다" 는 오해가 안 생깁니다. 지우지 마세요 */
.lk-open{font-size:var(--fs-sub); color:#7A5C22; margin-top:var(--s12); line-height:1.6;
  background:#FBF1DC; border:1px dashed #D9BF87; border-radius:var(--r-sm); padding:var(--s8) var(--s12)}
.lk-open b{font-weight:700; color:#6A4E18}
.lk-back{margin-top:var(--s16); background:none; border:none; color:var(--text-3);
  font-size:var(--fs-sub); font-weight:600; text-decoration:underline}
.lk-back:hover{color:var(--text-2)}


/* ============================================================
   9. 테마 (한옥)
   ============================================================ */
/* ---------- 한옥 테마 (body.theme-hanok) ----------
   기본 테마입니다. 설정 → 테마에서 basic(1구역의 :root 값 그대로)으로 되돌릴 수 있습니다.
   이력: 한지+청록+단청(1차) → 종이색+청록+금선(2차) → 먹색+아이보리+각진 모서리(3차)
        → 팔레트 A '따뜻한 뉴트럴'(4차, 2026-09-05 재아 선택): 아이보리에서 노란기를 덜어낸 회색 바탕, 흰 카드, 먹색 액센트.
   ※ --blue 계열은 여기서 덮지 않습니다 — '당일 변동' 파란 펜은 테마와 무관하게 같은 색이어야 합니다 */
body.theme-hanok{
  --bg:#F3F2EF;            /* 바탕 — 따뜻한 회색 */
  --surface:#FFFFFF;       /* 카드는 흰색 — 바탕과 대비를 만들어 정보가 또렷해짐 */
  --surface-2:#F7F6F3;     /* 카드 안쪽 구역 */
  --border:#E4E2DD;
  --border-strong:#C9C6BF;
  --text:#1C1B19;          /* 먹 */
  --text-2:#5B5954;
  --text-3:#8A8781;
  --pine:#1C1B19;          /* 주요 동작 = 먹색 (이름은 청록 시절 것) */
  --pine-soft:#EDECE8;
  --amber:#8A6512;         /* 주의 */
  --amber-soft:#F8F1DE;
  --rust:#A63B26;          /* 경고 — 벽돌 */
  --rust-soft:#FAE9E4;
  --shadow:0 1px 0 rgba(23,22,20,.04);
  --topbar-bg:#1C1B19;     /* 상단바는 먹색 바탕 + 밝은 글자 */
  --topbar-fg:#F4F3F0;
  --topbar-line:#000;
  --topbar-btn-line:rgba(244,243,240,.26);
  --topbar-hover:rgba(244,243,240,.12);
  background-image:none;   /* 1차 테마의 세로 결 무늬 제거 — 카드 대비로 충분 */
}
body.theme-hanok .topbar{box-shadow:none; border-bottom:1px solid #000}
/* 앱 화면에서는 명조를 쓰지 않습니다 (손님용 디스플레이 모드만 예외). 1차 테마가 명조를 걸었던 곳들을 고딕으로 되돌림 */
body.theme-hanok .topbar .title{letter-spacing:.12em; font-family:var(--sans)}
body.theme-hanok .storename{font-family:var(--sans)}
body.theme-hanok .sect-title{letter-spacing:.04em; color:var(--text-2); font-family:var(--sans)}
body.theme-hanok .rh-d{letter-spacing:.02em; font-family:var(--sans)}
body.theme-hanok .metric .v{font-family:var(--sans)}
body.theme-hanok .lk-title{color:var(--text); font-family:var(--sans)}
body.theme-hanok .fh-t{font-family:var(--sans)}
/* 먹색 상단바 위의 영업 상태 배지 — 반투명 밝은 색 */
body.theme-hanok .topbar .state.open{background:rgba(244,243,240,.18); color:#EAF3EC; border-color:rgba(244,243,240,.34)}
body.theme-hanok .topbar .state.prep{background:rgba(244,243,240,.18); color:#F6E4BE; border-color:rgba(244,243,240,.34)}
body.theme-hanok .topbar .state.closed{background:rgba(0,0,0,.18); color:#E2D6C2; border-color:rgba(244,243,240,.24)}
body.theme-hanok .btn.primary{background:var(--pine); border-color:var(--pine)}
body.theme-hanok .btn.primary.warned{background:var(--rust); border-color:var(--rust)}
body.theme-hanok .btn.primary.warned:hover{background:#83301F}
body.theme-hanok .scell.on.warned,body.theme-hanok .hcell.on.warned,
body.theme-hanok .srccell.warned,body.theme-hanok .citem.warned{background:var(--rust); border-color:var(--rust)}
body.theme-hanok .sp-bars rect{fill:#CBD8D0}
body.theme-hanok .pdot.on{color:var(--pine)}


/* ============================================================
   10. 손님용 화면 (.tv / .dsec / .intro)
   ============================================================ */
/* ============================================================
   손님용 디스플레이 모드 (TV 전체화면) — 관리 화면과 다른 언어를 일부러 씁니다 (명조·한지색·창살)
   이 구역은 디자인 개편 대상이 아닙니다. 구조만 정리했습니다.

   [크기 단위 --tvu]
   머리글·날짜·바닥글은 예전에 `clamp(15px, 2.3vh, 30px)` 같은 식이었습니다.
   clamp 의 세 번째 값은 상한이라, TV 가 크거나 브라우저 배율을 낮춰 뷰포트가 커질수록
   글자는 30px 에 갇힌 채 화면만 커져 상대적으로 점점 작아 보였습니다.
   그래서 기준 단위 --tvu(화면 높이의 1%)를 하나 두고 모든 크기를 그 배수로 적었습니다.
   화면이 두 배 커지면 글자도 두 배 커지므로, 3m 떨어져서 보는 크기는 항상 같습니다.
   · 값 조절: 숫자만 바꾸면 됩니다. 머리글을 키우려면 `4.6` 을 `5.2` 로.
   · 예약 목록 글자는 여기가 아니라 자바스크립트의 TV_SIZES 첫 값입니다.
   · 세로 모니터(4:3 보다 세로가 길 때)는 --tvu 를 가로 기준으로 바꿉니다 (11구역 @media).
   · 세로로 든 휴대폰은 1280×720 판을 통째로 축소해 보여 주므로 --tvu 를 7.2px(720의 1%)로 고정합니다 (11구역).
   [화면 구조]  .tv > .tv-bgs(사진 7장 순환) + .tv-stage > .tv-inner(.tv-h 머리글 / .tv-grid 칸 / .tv-f 바닥글)
   ============================================================ */
/* 업장 TV는 어두운 계조를 뭉개므로(black crush) 글자색을 흰색에 가깝게 씁니다 */
.tv{position:fixed; inset:0; z-index:80; overflow:hidden; background:#0E1218; color:#FDF9F2; display:flex; flex-direction:column; padding:0; --tvu:1vh}
/* 사진 위 어두운 막 — 카드를 거의 불투명하게 바꿨으므로(아래 .dsec) 사진을 덜 어둡게 덮습니다.
   글자 대비는 카드가 책임지고, 이 레이어는 분위기만 담당합니다. */
.tv::after{content:""; position:absolute; inset:0; background:radial-gradient(130% 90% at 50% 0%, rgba(8,11,15,.06) 0%, rgba(8,11,15,.36) 72%), linear-gradient(180deg, rgba(8,11,15,.24) 0%, rgba(8,11,15,.14) 40%, rgba(8,11,15,.50) 100%); z-index:0}
/* 매장 사진 배경 — 12초마다 부드럽게 전환 (자바스크립트가 .on 을 옮깁니다) */
.tv-bgs{position:absolute; inset:0; z-index:0; opacity:.92}
.tv-bg{
  position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity 2.4s ease-in-out;
}
.tv-bg.on{opacity:1}
.tv-bg.b1{background-image:var(--bg1)}
.tv-bg.b2{background-image:var(--bg2)}
.tv-bg.b3{background-image:var(--bg3)}
.tv-bg.b4{background-image:var(--bg4)}
.tv-bg.b5{background-image:var(--bg5)}
.tv-bg.b6{background-image:var(--bg6)}
.tv-bg.b7{background-image:var(--bg7)}
.tv-stage{position:absolute; inset:0; overflow:hidden}
.tv-inner{position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; padding:calc(var(--tvu)*3.4) calc(var(--tvu)*6.4) calc(var(--tvu)*2.6)}
/* 나가기 버튼 — 평소엔 숨기고, 우측 상단(.tv-hot)에 마우스를 올리거나 화면을 누르면(.tv-tap → .show) 나타납니다.
   위치는 그대로 두고 글자·여백만 --tvu 로 화면에 맞춰 키웁니다 */
.tv-hot{position:absolute; top:0; right:0; z-index:4; width:calc(var(--tvu)*18); height:calc(var(--tvu)*7.5)}
.tv-tap{position:absolute; inset:0; z-index:2}
.tv-exit{position:absolute; top:14px; right:16px; z-index:5; opacity:0; pointer-events:none; background:rgba(243,234,218,.1); border:1px solid rgba(243,234,218,.25); color:rgba(243,234,218,.75); transition:opacity .25s ease; font-size:calc(var(--tvu)*1.5); padding:calc(var(--tvu)*.95) calc(var(--tvu)*1.8); border-radius:calc(var(--tvu)*.8)}
.tv-exit.show{opacity:1; pointer-events:auto}
.tv-exit:hover{color:#F3EADA; background:rgba(243,234,218,.2)}
/* 머리글 — 날짜 · 매장 이름 · 금색 실선. 머리글·바닥글이 화면 높이의 1/4를 쓰던 것을 줄여 그만큼 목록 글자를 키웠습니다 */
.tv-h{flex:none; text-align:center; position:relative; z-index:1; padding-bottom:calc(var(--tvu)*1.6)}
.tv-h h1{font-family:var(--serif-tv); font-weight:800; margin:7px 0 0; letter-spacing:.18em; text-indent:.18em; line-height:1.2; color:#FFFFFF; text-shadow:0 2px 16px rgba(0,0,0,.75); font-size:calc(var(--tvu)*4.6); margin-top:calc(var(--tvu)*.7)}
.tv-date{font-family:var(--serif-tv); letter-spacing:.24em; color:#E3D3B2; text-shadow:0 2px 10px rgba(0,0,0,.7); font-size:calc(var(--tvu)*2.2)}
.tv-line{height:1px; margin:clamp(9px,1.5vh,18px) auto 0; background:linear-gradient(90deg, transparent, #C9AE79, transparent); width:calc(var(--tvu)*9); margin-top:calc(var(--tvu)*1.2)}
/* 칸 배치 — 칸 크기와 글자 크기를 고정합니다.
   예전에는 내용에 맞춰 늘였는데, 예약이 하나 늘고 줄 때마다 칸과 글자가 들썩여 화면이 산만했습니다.
   넘치는 만큼은 '외 N건' 으로 접습니다(capLists). --tv-li·--tv-h3 은 fitDisplay() 가 다시 정하며, 여기 값은 자바스크립트가 못 돌았을 때의 기본값입니다 */
.tv-grid{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; --tv-li:calc(var(--tvu, 1vh) * 2.2); --tv-h3:calc(var(--tvu, 1vh) * 2.09); position:relative; z-index:1; gap:calc(var(--tvu)*1.7)}
.tv-row{flex:1 1 0; min-height:0; display:flex; gap:calc(var(--tvu)*2.4)}
/* 좌석 카드 — 거의 불투명하게 둡니다.
   반투명이면 뒤 사진 밝기에 따라 글자 대비가 매 12초 달라져, 싸구려 TV에서 글자가 묻힙니다.
   사진은 카드 바깥 여백·머리글·바닥글에서 계속 보이므로 분위기는 유지됩니다. 홀 카드(.hall)는 조금 갈색. */
.dsec{flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; background:linear-gradient(180deg, rgba(9,12,17,.93), rgba(5,8,12,.95)); border:1px solid rgba(214,190,138,.42); box-shadow:0 6px 26px rgba(0,0,0,.45); padding:calc(var(--tvu)*1.3) calc(var(--tvu)*2.4) calc(var(--tvu)*1.1); border-radius:calc(var(--tvu)*1.5)}
.dsec.hall{background:linear-gradient(180deg, rgba(30,25,15,.94), rgba(18,15,9,.95)); border-color:rgba(214,182,120,.52)}
/* 카드 머리 — [층] 룸 이름 [정원]. 룸 이름만 명조로 남겨 한옥 분위기를 지킵니다. 숫자·보조 정보는 고딕이 훨씬 잘 읽힙니다 */
.dsec h3{flex:none; display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; font-size:var(--tv-h3); font-weight:700; letter-spacing:.06em; border-bottom:1px solid rgba(214,190,138,.55); white-space:nowrap; color:#FFFFFF; margin:0 0 calc(var(--tvu)*.9); padding-bottom:calc(var(--tvu)*.8); gap:calc(var(--tvu)*1)}
.dsec h3 .nm{font-family:var(--serif-tv); text-align:center}
/* 좌석 이름 좌우의 보조 글씨(지하 / 4~6인) — 너무 작아서 키웠습니다. em 이라 좌석 이름 크기와 같이 커지고 작아집니다 */
.dsec h3 .fl{font-family:var(--sans); letter-spacing:.04em; text-align:left; font-size:.74em; font-weight:700; color:#E8DECA}
.dsec h3 .cap{font-family:var(--sans); text-align:right; font-size:.74em; font-weight:700; color:#E8DECA}
/* 예약 줄 — 시각(금색) · 이름 · 인원. 홀은 두 열(.two-col) */
.dsec ul{flex:1 1 auto; min-height:0; list-style:none; margin:0; padding:0; display:flex; flex-direction:column; overflow:hidden; gap:calc(var(--tvu)*.75)}
.dsec ul.two-col{display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(6,auto); align-content:start; gap:calc(var(--tvu)*.75) calc(var(--tvu)*3.5)}
.dsec li{flex:none; display:flex; align-items:baseline; font-family:var(--sans); font-weight:600; font-size:var(--tv-li); line-height:1.45; white-space:nowrap; gap:calc(var(--tvu)*1.05); padding:calc(var(--tvu)*.2) 0}
.dsec li .t{font-weight:800; color:#FFD98A; flex:none; letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.dsec li .n{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; color:#FFFFFF}
.dsec li .p{flex:none; color:#DCCDB2; font-size:.9em; font-weight:500}
/* 지난 예약은 흐리게 하되, TV에서 아예 사라지지 않을 만큼만 */
.dsec li.past{opacity:.58}
.dsec li.past .t{color:#C9B68F}
.dsec li.none{color:#A2947C; font-weight:500; font-size:calc(var(--tv-li) * .8); padding-top:calc(var(--tvu)*.8)}
/* 자리가 모자라 접은 줄 수 (fitDisplay → trimOverflow) */
.dsec li.more{color:#C3B49A; font-weight:600; font-size:calc(var(--tv-li) * .8)}
/* 바닥글 */
.tv-f{flex:none; text-align:center; border-top:1px solid rgba(243,234,218,.24); font-family:var(--serif-tv); color:#D3C2A2; text-shadow:0 2px 10px rgba(0,0,0,.7); letter-spacing:.26em; text-indent:.26em; position:relative; z-index:1; padding-top:calc(var(--tvu)*1.4); margin-top:calc(var(--tvu)*1.2); font-size:calc(var(--tvu)*2.5)}
/* 화면이 작으면(900px 이하 또는 높이 480 이하) 디스플레이 대신 '화면이 작습니다' 안내(.tv-small)를 띄웁니다 — 11구역 @media */
.tv-small{display:none}

/* ------------------------------------------------------------
   들어갈 때 인사 — 중식당에서 한옥으로

   歡迎光臨 → 어서오세요 로 글자가 바뀌는 동안 배경도 같이 넘어갑니다.
   중국집 붉은색 + 사선 격자 → 한옥 나무색 + 창살(井) 무늬.
   무늬는 전부 CSS 그라디언트라 이미지 파일이 없습니다(파일 크기 0).
   ------------------------------------------------------------ */
.intro{position:fixed; top:0; right:0; bottom:0; left:0; z-index:200;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:#6E1A10; color:#F6E7C8; cursor:pointer}
/* 한자는 금색, 한글은 한지색. 색까지 같이 넘어가야 '바뀌었다'가 읽힙니다 */
.intro .ic{display:inline-block; color:#F4CE87; opacity:.62;
  text-shadow:0 2px 14px rgba(0,0,0,.55);
  transition:opacity .5s ease, color .5s ease, transform .5s ease}
.intro .ic.ko{opacity:1; color:#F6EEDD; transform:translateY(-2px)}
.intro-bg{position:absolute; top:0; right:0; bottom:0; left:0;
  transition:opacity .9s ease}
/* 중식당 — 붉은 바탕에 금색 사선 격자 */
.intro-cn{
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.05) 0%, rgba(0,0,0,.22) 52%, rgba(0,0,0,.58) 100%),
    repeating-linear-gradient(45deg,  rgba(255,213,150,.11) 0 2px, transparent 2px 26px),
    repeating-linear-gradient(-45deg, rgba(255,213,150,.11) 0 2px, transparent 2px 26px),
    linear-gradient(160deg, #8A2113 0%, #6E1A10 55%, #55130B 100%);
}
/* 한옥 — 나무색 바탕에 창살(가로세로) 무늬. 굵은 살 사이에 가는 살을 넣어 井 모양을 냅니다 */
.intro-ko{
  opacity:0;
  background:
    /* 창호지 뒤에 등이 켜진 느낌 — 가운데만 살짝 따뜻하게 */
    radial-gradient(circle at 50% 44%, rgba(255,226,172,.12) 0%, rgba(255,226,172,0) 48%),
    radial-gradient(circle at 50% 46%, rgba(0,0,0,.02) 0%, rgba(0,0,0,.20) 54%, rgba(0,0,0,.56) 100%),
    repeating-linear-gradient(0deg,  rgba(233,205,158,.09) 0 2px, transparent 2px 62px),
    repeating-linear-gradient(90deg, rgba(233,205,158,.09) 0 2px, transparent 2px 46px),
    repeating-linear-gradient(0deg,  rgba(233,205,158,.17) 0 4px, transparent 4px 186px),
    repeating-linear-gradient(90deg, rgba(233,205,158,.17) 0 4px, transparent 4px 184px),
    linear-gradient(160deg, #4A3524 0%, #33241A 58%, #241912 100%);
}
/* 문틀 — 한옥으로 넘어가면서 얇은 테두리가 떠오릅니다 */
.intro-frame{
  position:absolute; top:3.2vh; right:3.2vw; bottom:3.2vh; left:3.2vw;
  border:1px solid rgba(226,196,142,.34); transition:opacity .9s ease; pointer-events:none;
}
.intro-w{position:relative; display:flex; gap:.26em; font-family:var(--serif);
  font-size:clamp(32px,7.4vw,68px); font-weight:800; letter-spacing:.14em; text-indent:.14em}


/* ============================================================
   11. 반응형 — 정리한 구역의 @media 규칙
   원본에서의 앞뒤 순서를 그대로 지키고, 붙어 있는 같은 조건끼리만 한 블록으로 묶었습니다.
   (같은 조건을 한 덩어리로 합치면 다른 조건 블록과의 앞뒤가 바뀌어 화면이 바뀝니다 — 겹치는 조건은 뒤가 이깁니다)
   ============================================================ */
/* 블록 순서는 원본의 앞뒤 그대로입니다. 같은 조건이 여러 번 나오는 것은 그래서입니다.
   (예: (max-width:900px) 상단바 블록은 (max-width:767px) 블록보다 뒤에 있어야 모바일 상단바가 3줄로 나옵니다)
   ---- 매장 선택 화면: 마우스가 있는 큰 화면에서만 올리면 넓어지고 사진이 커집니다 ---- */
@media (hover:hover) and (min-width:900px){
  .panel:not(.locked):hover{flex-grow:1.22}
  .panel:not(.locked):hover .bg{transform:scale(1.08); filter:saturate(1) brightness(.76)}
  .panel:not(.locked):hover .veil{opacity:.6}
  .panel:not(.locked):hover .name{letter-spacing:.32em; text-indent:.32em}
  .panel:not(.locked):hover .rule{width:92px; background:#fff}
  .panel:not(.locked):hover .meta{opacity:1; transform:none}
}

/* 터치 기기(hover 없음)와 태블릿 폭에서는 설명 글(.meta)을 항상 보입니다 — 올려 볼 수 없으니까 */
@media (hover:none){
  .panel .meta{opacity:1; transform:none}
}

/* 폰에서는 두 매장을 위아래로 */
@media (max-width:767px){
  .split{flex-direction:column}
  .split .panel + .panel{box-shadow:0 -1px 0 rgba(255,255,255,.22)}
  .panel .name{font-size:clamp(28px,9vw,42px)}
}

@media (min-width:768px) and (max-width:899px){
  .panel .meta{opacity:1; transform:none}
}

@media (prefers-reduced-motion:reduce){
  .panel{transition:none !important}
  .panel *{transition:none !important}
}

/* ---- 본문 폭·여백: 태블릿(768) → 노트북(1024, 본문 최대 1720px) ---- */
@media (min-width:768px){
  .content{padding:var(--s24) var(--s24) 80px}
  .dash{display:grid; grid-template-columns:1fr 1fr; gap:var(--s12); align-items:start}
  .dash .card{margin-top:0}
  .sheet{max-width:600px}
  .overlay{align-items:center}
}

@media (min-width:1024px){
  .content{padding:var(--s24) var(--s24) 60px; max-width:1720px; margin:0 auto}
  .dash{grid-template-columns:repeat(3,1fr)}
}

/* .cal / .res-list 는 옛 예약 화면 부품 — 6구역 '옛 예약 카드' 참고 */
@media (min-width:900px){
  .cal{margin-bottom:0; position:sticky; top:74px}
  .res-list{grid-template-columns:1fr}
}

@media (min-width:1280px){
  .res-list{grid-template-columns:repeat(2,1fr)}
}

/* ---- 예약 등록 마법사: 태블릿부터 단계 이름을 글자로, 인원 타일 6칸, 달력 칸을 키움 ---- */
@media (min-width:768px){
  .wz-dot .l{display:inline}
  .wz-q h2{font-size:var(--fs-num)}
  .pgrid{grid-template-columns:repeat(6,1fr)}
  .ptile{padding:var(--s24) 0 var(--s24)}
  .ptile .pn{font-size:var(--fs-big)}
  .bday{min-height:68px}
  button.bday{min-height:68px}
  button.bday .d{font-size:var(--fs-head)}
  .hgrid{grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
  .wz-body{padding:var(--s16) var(--s24) var(--s24)}
  .wz-foot{padding:var(--s16) var(--s24) calc(var(--s16) + env(safe-area-inset-bottom))}
}

@media (min-width:1024px){
  .wz-cal{display:grid; grid-template-columns:1fr; gap:0}
  .bday{min-height:76px}
  button.bday{min-height:76px}
}

/* 1단계를 한 화면에 담기 — 달력과 시간을 좌우로 나눠 스크롤을 없앰. 달력 칸은 그만큼 조금 낮게(58px) */
@media (min-width:900px){
  .wz-step1{display:grid; grid-template-columns:minmax(360px,1.05fr) 1fr; gap:var(--s16); align-items:start}
  .wz-time{margin-top:0}
  .wz-body{max-width:1120px}
  .bday{min-height:58px}
  button.bday{min-height:58px}
  button.bday .d{font-size:var(--fs-title)}
  .hgrid{grid-template-columns:repeat(3,1fr)}
  .hcell{padding:var(--s12) var(--s4) var(--s8)}
  .hcell .hh{font-size:var(--fs-title)}
}

@media (min-width:1280px){
  .hgrid{grid-template-columns:repeat(4,1fr)}
  .bday{min-height:64px}
  button.bday{min-height:64px}
}

/* 세로 공간이 좁은 태블릿 가로 모드 — 질문·달력·시간 칸을 낮춰 한 화면에 들어가게 */
@media (max-height:820px) and (min-width:900px){
  .wz-q h2{font-size:var(--fs-head)}
  .bday{min-height:48px}
  button.bday{min-height:48px}

/* 저장된 옛 데이터에 새 항목이 없을 때 채워 넣기 */
function migrate(d){
  d._auth = d._auth || {...DEFAULT_AUTH};
  d._logs = d._logs || [];
  for(const k of Object.keys(DEFAULT_DATA)){
    d[k] = { ...deepClone(DEFAULT_DATA[k]), ...(d[k]||{}) };
    d[k].settings = { ...DEFAULT_DATA[k].settings, ...(d[k].settings||{}) };
    for(const arr of ["reservations","staff","attendance","sales"]) d[k][arr] = d[k][arr] || [];
    /* 옛 기록 정리: 인원을 유아 포함 총원으로, 상태 이름 변경 */
    d[k].reservations = d[k].reservations.map(r=>({
      ...r,
      people: r.people != null ? r.people : pplOf(r),
      chairs: r.chairs != null ? r.chairs : (r.infants||0),
      status: (r.status==="완료"||r.status==="식사완료") ? "방문" : r.status,
      sms: r.sms || [],       /* 보낸 문자 기록 (흉내) */
      /* 경로 이름을 풀네임으로 통일 ("전화" → "전화 예약") */
      source: r.source==="전화" ? "전화 예약" : (r.source==="네이버예약" ? "네이버 예약" : r.source)
    }));
    /* 문자 설정이 없던 기록에도 기본값을 채웁니다 */
    d[k].settings.sms = { ...SMS_DEFAULT, ...(d[k].settings.sms||{}) };
    d[k].settings.sources = (d[k].settings.sources||[]).map(function(x){
      return x==="전화" ? "전화 예약" : (x==="네이버예약" ? "네이버 예약" : x);
    });
    /* 옛 '사용 중지'(켜짐/꺼짐 하나)를 기간제로 옮깁니다.
       끝나는 날을 모르는 상태였으므로 '해제할 때까지'로 봅니다. */
    d[k].settings.rooms = (d[k].settings.rooms||[]).map(function(r){
      var out = {...r};
      if(!out.blocks) out.blocks = [];
      if(out.blocked){
        out.blocks = out.blocks.concat([{
          id:"blk_"+out.id, from:todayStr(), to:"", fromTime:"", toTime:"",
          openEnded:true, note:out.blockNote||""
        }]);
      }
      delete out.blocked; delete out.blockNote;
      return out;
    });
  }
  return d;
}

function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(d = new Date()){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthStr(d = new Date()){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function shiftDate(s, days){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+days); return todayStr(d); }
function dateLabel(s){
  const d=new Date(s+"T00:00:00");
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+["일","월","화","수","목","금","토"][d.getDay()]+")";
}
function nowHM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function won(n){ return (n||0).toLocaleString("ko-KR"); }
/* 입력값을 화면에 넣기 전 반드시 통과 — 스크립트 주입(XSS) 방지 */
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* 구형 스마트TV 브라우저에는 structuredClone 이 없어 직접 복사합니다 */
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

   손님이 왔다는 것을 기본으로 두고, 직원은 예외(노쇼·취소)만 누릅니다. */
function autoCloseDays(){

  const today = todayStr();

      if(r.date < today && r.status==="확정"){ r.status="방문"; r.auto=true; n++; }
    });

  if(n) saveData();
  return n;
}

/* 총 인원 — 유아를 포함한 값. 옛 기록(성인+유아 분리)도 함께 처리 */

   (예전에는 자기 자신을 다시 부르게 돼 있어 people 이 없으면 무한 재귀로 멈췄습니다) */

/* ---------- 좌석 판정 (체류시간 기준) ---------- */
function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function minToHM(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
/* 그 시각의 체류 시간(분) — 점심과 저녁을 다르게 잡습니다 */
/* ---------- 운영시간 ----------
   요일별 기본값 + 적용 시작일 + 그날만의 예외(임시 휴무·단축 영업) */
function scheduleFor(date){
  const st = store().settings;
  const list = (st.schedules||[]).filter(s=>s.from<=date).sort((a,b)=>a.from.localeCompare(b.from));
  return list.length ? list[list.length-1] : null;
}
function isHoliday(date){
  const st = store().settings;
  return st.holidayMode !== false && (st.holidays||[]).includes(date);
}
function hoursFor(date){
  const st = store().settings;
  const sch = scheduleFor(date);
  const dow = new Date(date+"T00:00:00").getDay();
  /* 공휴일이면 공휴일 운영시간을 먼저 봅니다 */
  const dayDef = (isHoliday(date) && sch && sch.holiday) ? sch.holiday
               : (sch && sch.days && sch.days[dow]);
  const base = dayDef ? {...dayDef}
    : {open:st.open||"11:00", close:st.close||"22:00", lo:st.lastOrder||"20:40", bs:"", be:""};
  base.closed = false; base.note = "";
  const ov = (st.overrides||[]).find(o=>o.date===date);
  if(ov){
    if(ov.closed) return {...base, closed:true, note:ov.note||"임시 휴무"};
    ["open","close","lo","bs","be"].forEach(k=>{ if(ov[k]!==undefined) base[k]=ov[k]; });
    base.note = ov.note||"임시 운영시간";
    base.custom = true;
  }
  return base;
}
/* 타임라인 가로축 — 어느 날이든 같은 폭으로 보이도록 가장 넓은 영업시간을 씁니다 */
function axisRange(){
  const st = store().settings;
  let o = 24*60, c = 0;
  (st.schedules||[]).forEach(s=>(s.days||[]).forEach(d=>{
    o = Math.min(o, toMin(d.open)); c = Math.max(c, toMin(d.close));
  }));
  (st.overrides||[]).forEach(v=>{
    if(v.open) o = Math.min(o, toMin(v.open));
    if(v.close) c = Math.max(c, toMin(v.close));
  });
  if(o>=c){ o = toMin(st.open||"11:00"); c = toMin(st.close||"22:00"); }
  return {o, c};
}
/* 그 시각이 브레이크타임인지 */
function inBreak(date, time){
  const h = hoursFor(date);
  if(!h.bs || !h.be || !time) return false;
  const t = toMin(time);
  return t >= toMin(h.bs) && t < toMin(h.be);
}
function stayMinAt(time, seatId){
  const st = store().settings;
  const seat = seatId ? st.rooms.find(r=>r.id===seatId) : null;
  const isHall = seat && seat.type==="hall";
  const lunch = time && toMin(time) < toMin(st.lunchUntil||"16:00");
  const h = isHall
    ? (lunch ? (st.hallLunchStayHours||2) : (st.hallStayHours||2.5))
    : (lunch ? (st.lunchStayHours||2.5)   : (st.stayHours||3));
  return Math.round(h*60);
}
/* 예약 한 건의 체류 시간 — 배정된(또는 잠정) 좌석 종류에 따라 달라집니다 */
function stayOf(r){ return stayMinAt(r.time, effSeat(r)); }
function stayMin(){ return stayMinAt("19:00"); }
/* ---------- 홀 테이블 ----------
   홀마다 2인석·4인석·6인석 등을 섞어 둘 수 있고, 붙일 수 있는지도 따로 정합니다. */
function hallZones(hall){
  if(hall.zones && hall.zones.length) return hall.zones;
  /* 옛 형식도 읽을 수 있게 */
  if(hall.tableSets) return [{name:"홀", sets:hall.tableSets, maxJoin:hall.tableSets.some(s=>s.join)?4:1}];
  const n = hall.tables || 0;
  return [{name:"홀", sets:[{seats:4,count:n}], maxJoin:hall.joinable? Math.max(1,Math.floor(hall.joinable/1)) : 1}];
}
function hallTables(hall){
  const out = [];
  hallZones(hall).forEach((z,zi)=>{
    (z.sets||[]).forEach((s,si)=>{
      for(let i=0;i<(s.count||0);i++)
        out.push({key:zi+"-"+si+"-"+i, seats:s.seats||4, zone:zi, zoneName:z.name, maxJoin:z.maxJoin||1});
    });
  });
  return out;
}
function hallSeatTotal(hall){ return hallTables(hall).reduce((a,t)=>a+t.seats,0); }

/* 남은 테이블로 이 인원을 앉힐 수 있는지
   - 같은 존 안에서만 붙일 수 있고, 존마다 정한 최대 개수를 넘지 못합니다.
   - 남는 자리가 가장 적은 조합을 고릅니다. */
function pickTables(free, people){
  if(people<=0) return null;
  const byZone = {};
  free.forEach(t=>{ (byZone[t.zone] = byZone[t.zone]||[]).push(t); });
  let best = null;
  Object.values(byZone).forEach(list=>{
    const maxJoin = list[0].maxJoin || 1;
    const sorted = [...list].sort((a,b)=>a.seats-b.seats);
    /* 1) 한 테이블로 해결되는 가장 작은 자리 */
    const single = sorted.find(t=>t.seats>=people);
    if(single){
      const waste = single.seats - people;
      if(!best || waste < best.waste || (waste===best.waste && best.use.length>1))
        best = {use:[single], waste};
      return;
    }
    /* 2) 큰 것부터 붙여 봅니다 (최대 개수 안에서) */
    if(maxJoin < 2) return;
    const desc = [...list].sort((a,b)=>b.seats-a.seats);
    const use = []; let sum = 0;
    for(const t of desc){
      if(use.length >= maxJoin) break;
      use.push(t); sum += t.seats;
      if(sum >= people) break;
    }
    if(sum >= people){
      const waste = sum - people;
      if(!best || waste < best.waste) best = {use:[...use], waste};
    }
  });
  return best ? best.use : null;
}
/* 예약 한 건이 쓰는 테이블 수 (표시용) */
function tablesFor(people){
  const st = store().settings;
  return Math.max(1, Math.ceil(people/(st.tableSeats||4)));
}
/* 룸 최소 인원 — 지정이 없으면 정원에서 2명 뺀 값 */
function roomMin(r){ return r.minCapacity != null ? r.minCapacity : Math.max(2,(r.capacity||2)-2); }
/* 수리·고장 등으로 잠시 쓰지 않는 좌석 */
/* ---------- 좌석 사용 중지 (기간제) ----------
   room.blocks = [{id, from, to, fromTime, toTime, openEnded, note}]
     from~to      : 날짜 범위. openEnded 면 to 는 무시하고 '해제할 때까지'
     fromTime~toTime : 비우면 그 날 하루 종일.
                       기간이 여러 날이면 첫날은 fromTime 부터, 마지막 날은 toTime 까지,
                       가운데 날들은 하루 종일 잠급니다.
   막지는 않고 경고만 합니다(설계 5.2) — 판단은 사장님 몫입니다. */
function roomBlocks(r){ return (r && r.blocks) ? r.blocks : []; }

/* 그 좌석이 그 날짜에 잠기는 구간들을 '분' 단위로 돌려줍니다. 없으면 빈 배열 */
function blockSpans(room, date){
  const out = [];
  const list = roomBlocks(room);
  for(let i=0;i<list.length;i++){
    const b = list[i];
    if(!b.from || date < b.from) continue;
    if(!b.openEnded && b.to && date > b.to) continue;
    const last = b.openEnded ? null : (b.to || b.from);
    /* 첫날·마지막날만 시각을 적용하고, 사이에 낀 날은 하루 종일 */
    const s = (date === b.from && b.fromTime) ? toMin(b.fromTime) : 0;
    const e = (last && date === last && b.toTime) ? toMin(b.toTime) : 24*60;
    if(e <= s) continue;
    out.push({s, e, note:b.note||"", id:b.id, allDay:(s===0 && e===24*60)});
  }
  return out;
}
/* 그 날짜(·시각)에 사용 중지인지. time 을 주면 그 시각만, 안 주면 그 날 하루 중 일부라도 */
function blockedAt(room, date, time){
  const spans = blockSpans(room, date);
  if(!spans.length) return null;
  if(!time) return spans[0];
  const t = toMin(time);
  for(let i=0;i<spans.length;i++) if(t >= spans[i].s && t < spans[i].e) return spans[i];
  return null;
}
/* "하루 종일" 또는 "11:00 ~ 16:00" 처럼 사람이 읽는 구간 표기 */
function spanLabel(sp){
  if(!sp) return "";
  if(sp.allDay) return "하루 종일";
  return hm(minToHM(sp.s)) + " ~ " + hm(minToHM(sp.e));
}
function minToHM(m){ return pad(Math.floor(m/60)%24) + ":" + pad(m%60); }
/* 그 날 하루가 통째로 잠겼는지 (타임라인 줄 전체를 흐리게 할지 판단) */
function blockedAllDay(room, date){
  const spans = blockSpans(room, date);
  for(let i=0;i<spans.length;i++) if(spans[i].allDay) return true;
  return false;
}
/* 예약 한 건이 사용 중지 구간에 걸리는지 — 체류 시간까지 봅니다 */
function resBlocked(r){
  if(!r.roomId) return null;
  const room = store().settings.rooms.find(x=>x.id===r.roomId);
  if(!room) return null;
  const spans = blockSpans(room, r.date);
  const s = toMin(r.time), e = s + stayOf(r);
  for(let i=0;i<spans.length;i++) if(s < spans[i].e && spans[i].s < e) return spans[i];
  return null;
}
/* 최소 인원 판정에 쓸 인원 — 설정에 따라 성인만 셉니다 */
function adultCount(people, infants){
  return store().settings.minCountAdultsOnly === false
    ? (people||0) : Math.max(0,(people||0)-(infants||0));
}
/* 마지막으로 예약을 받을 수 있는 시각 */
/* 유아용 의자 기본값을 유아 수로 채울지(true) 0개로 둘지(false). 설정에서 바꿉니다 */
function chairDefaultInfants(){ return store().settings.chairDefault !== "zero"; }
/* 자리 기준을 성인만으로 볼지, 유아를 포함해 볼지 */
function seatCountsInfants(){ return store().settings.minCountAdultsOnly === false; }

function lastBookMin(date){
  const st = store().settings;
  const h = hoursFor(date || view.date || todayStr());
  /* 라스트오더가 지정돼 있으면 그 시각, 없으면 마감 기준 */
  return h.lo ? toMin(h.lo) : toMin(h.close) - (st.lastBookingBuffer != null ? st.lastBookingBuffer : 60);
}
/* 확정 배정이 없으면 잠정 배정을 좌석으로 간주 */
function effSeat(r){ return r.roomId || r.tentativeRoomId || null; }

/* 룸을 그 시각에 쓸 수 있는지 판정
   blocked: 앞뒤 1시간 안에 확정 예약 → 배정 불가
   warn   : 체류시간 안에 확정 예약, 또는 잠정 배정이 걸려 있음 → 사장 판단
   free   : 여유 있음                                                     */
/* 이 예약이 지금 좌석을 잡고 있는가 —
   '확정'은 앞으로 올 손님, '방문'은 지금 앉아 있는 손님. 둘 다 자리를 씁니다.
   '취소'와 '노쇼'는 자리를 비웁니다.

   ※ 예전에는 이 판단이 파일 안에서 다섯 갈래로 갈려 있었습니다.
      룸은 '확정'만 봐서 손님이 도착해 '방문'을 누르는 순간 빈 방이 되었고(이중 예약),
      홀은 '취소'만 빼서 노쇼 처리해도 테이블이 안 풀렸습니다.
      같은 버튼이 좌석 종류에 따라 정반대로 동작했습니다.
      새 판정을 넣을 때는 반드시 이 함수를 쓰세요. */
function holdsSeat(r){ return r.status==="확정" || r.status==="방문"; }

function roomStatus(date, time, roomId, excludeId){
  const s = store();
  if(!time || !roomId) return {state:"free", hits:[], tentative:[], movable:[]};
  const t = toMin(time);
  const all = s.reservations.filter(r =>
    r.date===date && holdsSeat(r) && r.id!==excludeId &&
    (r.roomId===roomId || r.tentativeRoomId===roomId));
  let state="free"; const near=[], tent=[], movable=[];
  for(const r of all){
    const gap = Math.abs(toMin(r.time)-t);
    if(gap >= stayMinAt(time, roomId)) continue;
    if(r.roomId===roomId){
      /* 확정 배정 — 실제로 자리를 막습니다 */
      if(gap < 60){ state="blocked"; }
      else if(state!=="blocked"){ state="warn"; }
      near.push(r);
    }else{
      /* 잠정 배정 — 다른 자리로 옮길 수 있으면 막지 않습니다 */
      if(canRelocate(r, roomId)){ movable.push(r); }
      else{
        if(state==="free") state="warn";
        tent.push(r);
      }
    }
  }
  near.sort((a,b)=>a.time.localeCompare(b.time));
  return {state, hits:near, tentative:tent, movable};
}
/* 좌석 미정 예약을 지금 자리 말고 다른 곳으로 옮길 수 있는지 */
function canRelocate(r, excludeRoomId){
  const s = store(), st = s.settings;
  const kind = r.seatPref || "any";
  const people = pplOf(r);
  const cand = st.rooms.filter(x=>
    x.id!==excludeRoomId &&
    (kind==="hall-any" ? x.type==="hall" : kind==="room-any" ? x.type==="room" : true));
  for(const x of cand){
    if(x.type==="room"){
      if(people>x.capacity || people<roomMin(x)) continue;
      /* 확정 예약만 따져서 비어 있는지 확인 (잠정끼리는 서로 비켜줄 수 있음) */
      const conflict = s.reservations.some(o =>
        o.date===r.date && holdsSeat(o) && o.id!==r.id && o.roomId===x.id &&
        Math.abs(toMin(o.time)-toMin(r.time)) < stayMinAt(r.time, x.id));
      if(!conflict) return true;
    }else{
      /* 홀은 확정 예약만 놓고 자리가 남는지 봅니다 */
      let free = hallTables(x);
      s.reservations.filter(o =>
        o.date===r.date && holdsSeat(o) && o.id!==r.id && o.roomId===x.id &&
        Math.abs(toMin(o.time)-toMin(r.time)) < stayMinAt(r.time, x.id))
        .sort((a,b)=>a.time.localeCompare(b.time))
        .forEach(o=>{
          const use = pickTables(free, pplOf(o));
          if(use) free = free.filter(z=>!use.includes(z));
        });
      if(pickTables(free, people)) return true;
    }
  }
  return false;
}
/* 좌석 미정 예약들의 잠정 배정을 다시 계산 — 예약이 추가·변경될 때 호출 */
function reflowTentatives(date){
  const s = store();
  const targets = s.reservations.filter(r=>r.date===date && holdsSeat(r) && !r.roomId);
  targets.forEach(r=>{ r.tentativeRoomId = null; });
  targets.sort((a,b)=>a.time.localeCompare(b.time)).forEach(r=>{
    r.tentativeRoomId = suggestSeat(r.date, r.time, pplOf(r), r.seatPref||"any", r.id);
  });
}
/* 홀의 그 시간대 테이블 사용 현황 (잠정 배정 포함)
   실제 테이블 목록을 놓고 먼저 온 팀부터 앉혀 봅니다. */
function hallStatus(date, time, hallId, excludeId){
  const s = store();
  const hall = s.settings.rooms.find(r=>r.id===hallId) || {};
  const all = hallTables(hall);
  const total = all.length, seatTotal = all.reduce((a,t)=>a+t.seats,0);
  if(!time) return {total, seatTotal, tables:all, free:all, used:0, tentUsed:0,
                    left:total, hits:[], tentative:[], movable:[]};
  const t = toMin(time);
  const inWindow = r => r.date===date && holdsSeat(r) && r.id!==excludeId &&
                        Math.abs(toMin(r.time)-t) < stayMinAt(time, hallId);
  const hits = s.reservations.filter(r=>inWindow(r) && r.roomId===hallId);
  const tentAll = s.reservations.filter(r=>inWindow(r) && !r.roomId && r.tentativeRoomId===hallId);
  const tent = tentAll.filter(r=>!canRelocate(r, hallId));
  const movable = tentAll.filter(r=>canRelocate(r, hallId));

  /* 먼저 온 순서대로 테이블을 채웁니다 */
  let free = [...all];
  let used = 0, tentUsed = 0;
  const seat = (list, isTent) => {
    list.slice().sort((a,b)=>a.time.localeCompare(b.time)).forEach(r=>{
      const use = pickTables(free, pplOf(r));
      if(use){
        free = free.filter(x=>!use.includes(x));
        if(isTent) tentUsed += use.length; else used += use.length;
      }
    });
  };
  seat(hits,false); seat(tent,true);
  return {total, seatTotal, tables:all, free, used, tentUsed,
          left:free.length, hits, tentative:tent, movable};
}
/* 이 인원이 홀에 들어갈 수 있는지 */
function hallFits(h, people){ return !!pickTables(h.free||[], people); }
/* 이 인원이 쓰게 될 테이블 (표시용) */
function hallPlan(h, people){
  const use = pickTables(h.free||[], people);
  if(!use) return null;
  const zone = use[0].zoneName ? `${use[0].zoneName} · ` : "";
  return zone + use.map(t=>`${t.seats}인석`).join(" + ");
}

/* 좌석 미정 예약에 붙일 '잠정 배정' 좌석을 고름
   - 룸: 인원이 맞는 가장 작은 빈 방
   - 홀: 남은 테이블이 충분한 홀
   자리가 없으면 null (예약은 받되 안내가 필요한 상황)                    */
function suggestSeat(date, time, people, kind, excludeId){
  const st = store().settings;
  const cand = st.rooms.filter(r=>
    kind==="hall-any" ? r.type==="hall" :
    kind==="room-any" ? r.type==="room" : true);
  const rooms = cand.filter(r=>r.type==="room")
    .filter(r=>!blockedAt(r, date, time))
    .filter(r=>people<=r.capacity && people>=roomMin(r))   /* 잠정 배정은 총 인원 기준으로 넉넉히 */
    .sort((a,b)=>a.capacity-b.capacity);
  for(const r of rooms){
    if(roomStatus(date,time,r.id,excludeId).state==="free") return r.id;
  }
  const halls = cand.filter(r=>r.type==="hall" && !blockedAt(r, date, time)).sort((a,b)=>hallSeatTotal(b)-hallSeatTotal(a));
  for(const h of halls){
    if(hallFits(hallStatus(date,time,h.id,excludeId), people)) return h.id;
  }
  return null;
}

/* 영업 상태를 현재 시각으로 계산 */
function shopState(st){
  if(st.tempClosed) return {cls:"closed", txt:"임시 휴무"};
  const today = todayStr();
  const h = hoursFor(today);
  if(h.closed) return {cls:"closed", txt:esc(h.note||"휴무")};
  const n = nowHM();
  if(n < h.open)   return {cls:"prep",   txt:"영업 준비 중"};
  if(n >= h.close) return {cls:"closed", txt:"영업 종료"};
  if(h.bs && h.be && n>=h.bs && n<h.be) return {cls:"prep", txt:"브레이크타임"};
  if(h.lo && n >= h.lo) return {cls:"open", txt:"영업 중 · 라스트오더 지남"};
  return {cls:"open", txt:"영업 중"};
}

/* ============================================================

function applyTheme(){
  const t = (DATA && DATA._ui && DATA._ui.theme) || "hanok";
  document.body.className = t==="hanok" ? "theme-hanok" : "";
  /* 화면 배율. 브라우저 확대와 같은 방식이라 레이아웃이 그대로 커집니다.
     transform:scale 은 자리를 그대로 차지해 화면이 잘리므로 쓰지 않습니다. */
  document.documentElement.style.setProperty("--ui-zoom", (uiZoom()/100));
}
/* 기본 110%. 100%는 태블릿·모니터 모두 조금 작고, 125%는 브라우저 확대와 겹치면 너무 커집니다.
   기기마다 다르므로 설정 → 화면 크기에서 바꿉니다. */
const ZOOM_STEPS = [100, 105, 110, 120, 135];
function uiZoom(){
  const z = DATA && DATA._ui ? DATA._ui.zoom : null;
  return ZOOM_STEPS.indexOf(z) >= 0 ? z : 110;
}
function setPolicy(k,v){ const st=draft(); st[k]=v; render(); }

/* 화면 그리기는 innerHTML 을 통째로 바꾸는 방식이라, 도중에 예외가 나면

   "버튼을 눌러도 아무 일도 안 남" 으로만 보입니다.
   그래서 여기서 잡아 새로고침 안내를 띄웁니다. */
function render(){

function showCrash(e){

    if(old) old.parentNode.removeChild(old);
    var d = document.createElement("div");

    d.className = "crashbar";

      '<span>방금 한 조작은 저장되지 않았을 수 있습니다.</span>' +
      '<button onclick="location.reload()">새로고침</button>' +
      '<i>' + String(e && e.message ? e.message : e).slice(0,120) + '</i>';
    document.body.appendChild(d);
  }catch(_){ /* 안내조차 실패하면 조용히 넘어갑니다 */ }
}
/* 화면을 다시 그리면 innerHTML 이 통째로 바뀌므로 스크롤 위치가 0으로 돌아갑니다.
   마법사에서 분 단위를 조절할 때마다 화면이 맨 위로 튀던 원인이 이것이었습니다.
   그리기 직전에 위치를 적어 두고 그린 뒤에 되돌려 놓습니다.
   ※ 단계를 옮길 때는 맨 위로 가야 하므로 wzGo() 가 그린 다음 0으로 덮어씁니다. */
var KEEP_SCROLL = [".wz-mid", ".sheet", ".calbox"];
var scrollMemo = null;
/* '같은 화면을 다시 그린 것'인지 판별하는 열쇠.
   다른 단계·다른 팝업으로 넘어갔다면 위치를 물려받으면 안 됩니다
   (새로 연 팝업이 엉뚱하게 중간부터 보이는 일을 막습니다). */
function viewKey(){
  return (WZ ? "wz" + WZ.step : "-") + "|" +
         (view.form ? view.form.type + (view.form.id || "") : "-") + "|" +
         (view.calOpen ? "cal" : "-") + "|" + view.tab;
}
function saveScroll(){
  scrollMemo = { key: viewKey(), pos: [] };
  for(var i=0;i<KEEP_SCROLL.length;i++){
    var el = document.querySelector(KEEP_SCROLL[i]);
    if(el && el.scrollTop > 0) scrollMemo.pos.push([KEEP_SCROLL[i], el.scrollTop]);
  }
}
function restoreScroll(){
  if(!scrollMemo) return;
  var memo = scrollMemo; scrollMemo = null;
  if(memo.key !== viewKey()) return;      /* 화면이 바뀌었으면 맨 위에서 시작 */
  for(var i=0;i<memo.pos.length;i++){
    var el = document.querySelector(memo.pos[i][0]);
    if(el) el.scrollTop = memo.pos[i][1];
  }
}
function renderApp(){
  saveScroll();
  applyTheme();
  /* 팝업이 떠 있으면 뒤 화면이 스크롤되지 않게 */
  document.body.style.overflow =
    (MODAL || (view.form && !view.display) || view.calOpen || WZ) ? "hidden" : "";
  const app = document.getElementById("app");
  if(!DATA){ app.innerHTML="<p class='empty'>불러오는 중…</p>"; return; }
  /* 디스플레이 모드는 주소로 바로 열 수 있습니다 (TV 전용 화면) */
  if(view.display && view.storeKey){ app.innerHTML = renderDisplay() + renderModal(); afterRender(); return; }
  /* 매장을 고른 뒤에 PIN 을 입력합니다 */
  if(view.storeKey && !AUTHED){ app.innerHTML = renderLock() + renderModal(); afterRender(); return; }
  if(INTRO){ app.innerHTML = renderIntro(); return; }
  app.innerHTML = (view.display ? renderDisplay()
                  : (view.storeKey ? renderStore() : renderSelect())) + renderModal();
  afterRender();   /* 화면을 그린 뒤 필요한 이벤트 연결 (분 조절 레일 등) */
}

/* ---------- 들어갈 때 인사 ----------
   PIN 을 맞히고 바로 화면이 튀어나오면 눌린 건지 아닌지 알기 어렵습니다.
   짧게(1.2초) 인사를 띄워 '들어가는 중'이라는 감각을 줍니다.
   중식당이라 중국어에서 한국어로 글자가 하나씩 바뀝니다.
   아무 데나 누르면 바로 건너뜁니다 — 바쁠 때 1초도 아깝습니다. */
var INTRO = null, introTimers = [];
function startIntro(){
  var from = "\u6B61\u8FCE\u5149\u81E8";      /* 歡迎光臨 */
  var to   = "\uC5B4\uC11C\uC624\uC138\uC694";  /* 어서오세요 */
  INTRO = { from:from, to:to, n:0 };
  clearIntro(true);
  var steps = Math.max(from.length, to.length);
  for(var i=1;i<=steps;i++){
    introTimers.push(setTimeout((function(k){ return function(){
      if(!INTRO) return; INTRO.n = k; render();
    };})(i), 180 + i*110));
  }
  introTimers.push(setTimeout(endIntro, 180 + steps*110 + 520));
}
function clearIntro(keepState){
  for(var i=0;i<introTimers.length;i++) clearTimeout(introTimers[i]);
  introTimers = [];
  if(!keepState) INTRO = null;
}
function endIntro(){ clearIntro(); INTRO = null; render(); }
/* 글자가 歡迎光臨 → 어서오세요 로 바뀌는 동안
   배경도 중식당(붉은색·격자 무늬)에서 한옥(나무색·창살 무늬)으로 함께 넘어갑니다.
   두 무늬를 겹쳐 두고 위쪽(한옥)의 불투명도만 진행률만큼 올립니다. */
function renderIntro(){
  var f = INTRO.from, t = INTRO.to, n = INTRO.n, i;
  var len = Math.max(f.length, t.length), out = "";
  for(i=0;i<len;i++){
    var ch = i < n ? (t.charAt(i)||"") : (f.charAt(i)||"");
    out += '<span class="ic' + (i < n ? ' ko' : '') + '">' + esc(ch) + '</span>';
  }
  /* 첫 글자가 바뀌는 순간 배경도 같이 움직이기 시작하도록 조금 앞서 갑니다 */
  var p = Math.min(1, n / Math.max(1, len - 1));
  return '<div class="intro' + (n>0 ? ' turning' : '') + '" onclick="endIntro()">' +
           '<div class="intro-bg intro-cn"></div>' +
           '<div class="intro-bg intro-ko" style="opacity:' + p.toFixed(2) + '"></div>' +
           '<div class="intro-frame" style="opacity:' + p.toFixed(2) + '"></div>' +
           '<div class="intro-w">' + out + '</div>' +
         '</div>';
}

/* ============================================================
   PIN 잠금 — 새로 열 때마다 입력합니다 (자동 로그인 없음)
   ============================================================ */
let AUTHED = false;
let PIN_BUF = "";
let PIN_ERR = "";

function renderLock(){
  const s = view.storeKey ? DATA[view.storeKey] : null;
  /* 자리를 채울 때마다 매장 이름 한 글자씩 나타납니다 */
  const marks = (s && s.name.length>=4) ? s.name.split("").slice(0,4) : ["한","옥","반","점"];
  const dots = [0,1,2,3].map(i=>
    `<span class="pdot f${i+1} ${i<PIN_BUF.length?'on':''}">${i<PIN_BUF.length?marks[i]:""}</span>`).join("");
  const keys = [1,2,3,4,5,6,7,8,9,"clear",0,"back"].map(k=>{
    if(k==="clear") return `<button class="pkey sub" onclick="pinClear()" title="다시 입력">↻</button>`;
    if(k==="back")  return `<button class="pkey sub" onclick="pinBack()">←</button>`;
    return `<button class="pkey" onclick="pinPush('${k}')">${k}</button>`;
  }).join("");
  return `
    <div class="lock">
      <div class="lockbox">
        <div class="lk-title">${esc(s?s.name:"")} 예약 시스템</div>
        <div class="lk-sub">PIN 번호를 입력하세요</div>
        <div class="pdots">${dots}</div>
        <div class="lk-err">${esc(PIN_ERR)}</div>
        <div class="pkeys">${keys}</div>
        <p class="lk-note">숫자 키보드로도 입력할 수 있습니다.</p>
        ${PIN_ANY?`<p class="lk-open">제작 중이라 <b>아무 번호나</b> 눌러도 들어갑니다.</p>`:""}
        <button class="lk-back" onclick="backToStores()">← 매장 다시 고르기</button>
      </div>
    </div>`;
}
function pinPush(n){
  if(PIN_BUF.length>=4) return;
  PIN_BUF += n; PIN_ERR="";
  if(PIN_BUF.length===4) setTimeout(pinCheck, 120);
  render();
}
function pinBack(){ PIN_BUF = PIN_BUF.slice(0,-1); render(); }
function pinClear(){ PIN_BUF=""; PIN_ERR=""; render(); }
function backToStores(){ view.storeKey=null; PIN_BUF=""; PIN_ERR=""; render(); }
/* ============================================================
   제작 중 — 아무 번호나 통과시킵니다

   고모께 링크를 보여드리는 동안 PIN 을 기억하실 필요가 없게 열어 둔 것입니다.
   ★ 실제로 쓰기 시작하기 전에 반드시 false 로 바꾸세요. ★
   여기가 true 인 동안에는 잠금 화면에 안내가 뜨고 접속 기록에도 표시가 남습니다.
   ============================================================ */
var PIN_ANY = true;
function pinCheck(){
  const real = PIN_BUF === ((DATA._auth && DATA._auth.pin) || DEFAULT_AUTH.pin);
  const ok = real || PIN_ANY;
  logEvent(ok ? "로그인 성공" : "로그인 실패",
    ok ? (real ? "" : "제작 중 · PIN 확인 안 함") : `입력값 ${PIN_BUF}`);
  if(ok){
    AUTHED = true; PIN_BUF=""; PIN_ERR="";
    DATA._session = {authed:true, since:new Date().toISOString()};
    saveData();
    startIntro();
  }
  else { PIN_BUF=""; PIN_ERR="PIN 번호가 맞지 않습니다."; }
  render();
}
function lockNow(){
  logEvent("잠금", "");
  AUTHED=false; PIN_BUF=""; PIN_ERR=""; view.storeKey=null;
  DATA._session = {authed:false};
  saveData(); render();
}
/* PC에서 키보드로도 입력 */
function pinKeydown(e){
  if(AUTHED) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pinPush(e.key); }
  else if(e.key==="Backspace"){ e.preventDefault(); pinBack(); }
  else if(e.key==="Escape"){ e.preventDefault(); pinClear(); }
}
document.addEventListener("keydown", pinKeydown);

/* 첫 줄을 제목으로, 나머지를 본문으로 나눠 띄웁니다 */
function splitMsg(m){
  const s = String(m||"").split("\n");
  const title = s[0].replace(/[?!.]$/,"") || "확인";
  return [title, s.slice(1).join("\n").trim()];
}
async function uiConfirm2(msg, opt){
  const [t,b] = splitMsg(msg);
  return uiConfirm(t, b || t, opt);
}
async function uiAlert2(msg){
  const [t,b] = splitMsg(msg);
  return uiAlert(t, b || "");
}

/* ============================================================
   공통 팝업 — 브라우저 기본 alert/confirm 대신 같은 테마로
   uiAlert / uiConfirm 은 Promise 를 돌려주므로 await 로 씁니다.
   ============================================================ */
let MODAL = null;
function uiAlert(title, msg, tone){
  return new Promise(res => { MODAL = {mode:"alert", title, msg, tone:tone||"warn", res}; render(); });
}
function uiConfirm(title, msg, opt){
  opt = opt || {};
  return new Promise(res => {
    MODAL = {mode:"confirm", title, msg, tone:opt.tone||"warn",
             ok:opt.ok||"계속", cancel:opt.cancel||"취소", res};
    render();
  });
}
function modalAnswer(v){
  const m = MODAL; MODAL = null; render();
  if(m) m.res(v);
}
function renderModal(){
  if(!MODAL) return "";
  const m = MODAL;
  /* '---' 만 있는 줄은 가로선으로 그립니다.
     문자 미리보기에서 '어디부터 어디까지가 문자인지' 눈으로 끊어 주려고 만들었습니다.
     선은 화면에만 그려지고 실제 문자 내용에는 들어가지 않습니다. */
  const lines = String(m.msg||"").split("\n").map(l=>
    l.trim()==="---" ? `<div class="md-rule"></div>`
    : l.trim()==="" ? `<div class="md-gap"></div>`
    : `<div class="md-l">${esc(l)}</div>`).join("");
  return `
    <div class="overlay modal-ov" onclick="modalAnswer(false)">
      <div class="modal ${m.tone}" onclick="event.stopPropagation()">
        <div class="md-h">${esc(m.title)}</div>
        <div class="md-b">${lines}</div>
        <div class="md-f">
          ${m.mode==="confirm"?`<button class="btn" onclick="modalAnswer(false)">${esc(m.cancel)}</button>`:""}
          <button class="btn ${m.tone==="warn"?"danger-fill":"primary"}" onclick="modalAnswer(true)">
            ${m.mode==="confirm"?esc(m.ok):"확인"}</button>
        </div>
      </div>
    </div>`;
}

/* 미리보기 — 값과 눈금 없이 막대와 선만 */
function ratePreview(endDate, days){
  const list = [];
  for(let i=days-1;i>=0;i--){
    const dd = shiftDate(endDate, -i);
    list.push(dayStat(dd).rate);
  }
  const W=300, H=64, bw=W/list.length;
  const y = v => H - (v/100)*(H-6) - 3;
  const bars = list.map((v,i)=>{
    const h = Math.max(1,(v/100)*(H-6));
    return `<rect x="${i*bw+bw*0.22}" y="${H-h-3}" width="${bw*0.56}" height="${h}" rx="1.5"/>`;
  }).join("");
  const pts = list.map((v,i)=>`${i*bw+bw/2},${y(v)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <g class="sp-bars">${bars}</g>
    <polyline class="sp-line" points="${pts}"/>
  </svg>`;
}

/* ---------- 예약률 추이 ----------
   막대는 아래가 룸, 위가 홀입니다. 둘을 더한 높이가 그날 전체 예약률입니다.
   꺾은선은 전체 예약률의 흐름입니다. */
function rateChart(endDate, days){
  const list = [];
  for(let i=days-1;i>=0;i--){
    const d = shiftDate(endDate, -i);
    const st = dayStat(d);
    list.push({date:d, rate:st.rate, room:st.roomShare, hall:st.hallShare,
               roomRate:st.roomRate, hallRate:st.hallRate, count:st.count});
  }
  const W=720, H=250, L=36, R=10, T=14, B=34;
  const iw=W-L-R, ih=H-T-B, bw=iw/list.length;
  const y = v => T + ih - (v/100)*ih;
  const cx = i => L + i*bw + bw/2;

  const grid = [0,20,40,60,80,100].map(v=>`
    <line class="gl" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>
    <line class="gl tick" x1="${L-5}" y1="${y(v)}" x2="${L}" y2="${y(v)}"/>
    <text class="tx ax" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`).join("");

  const bars = list.map((x,i)=>{
    const c = cx(i), w = Math.max(2, bw*0.56);
    const hr = (x.room/100)*ih, hh = (x.hall/100)*ih;
    return `
      <rect class="rb-room" x="${c-w/2}" y="${T+ih-hr}" width="${w}" height="${Math.max(0,hr)}" rx="1.5">
        <title>${x.date} 룸 ${Math.round(x.room)}%p (룸만 보면 ${x.roomRate}%)</title></rect>
      <rect class="rb-hall" x="${c-w/2}" y="${T+ih-hr-hh}" width="${w}" height="${Math.max(0,hh)}" rx="1.5">
        <title>${x.date} 홀 ${Math.round(x.hall)}%p (홀만 보면 ${x.hallRate}%)</title></rect>`;
  }).join("");

  const pts = list.map((x,i)=>`${cx(i)},${y(x.rate)}`).join(" ");
  const dots = list.map((x,i)=>`<circle class="line-total-d" cx="${cx(i)}" cy="${y(x.rate)}" r="2.4"/>`).join("");

  const labels = list.map((x,i)=>{
    const dt = new Date(x.date+"T00:00:00");
    const dow = ["일","월","화","수","목","금","토"][dt.getDay()];
    const on = x.date===view.date;
    return `<text class="tx ${on?'on':''}" x="${cx(i)}" y="${H-16}" text-anchor="middle">${dt.getDate()}</text>
            <text class="tx sm ${on?'on':''}" x="${cx(i)}" y="${H-4}" text-anchor="middle">${dow}</text>`;
  }).join("");

  const avg = Math.round(list.reduce((a,x)=>a+x.rate,0)/list.length);
  const peak = list.reduce((a,x)=>x.rate>a.rate?x:a, list[0]);
  const low  = list.reduce((a,x)=>x.rate<a.rate?x:a, list[0]);
  const st0 = dayStat(endDate);

  return `
    <div class="legend">
      <span><i class="sw rb-room"></i>룸 ${st0.roomSeats}개</span>
      <span><i class="sw rb-hall"></i>홀 ${st0.hallSeats}테이블</span>
      <span><i class="sw ln total"></i>전체 예약률</span>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="예약률 추이">
      ${grid}${bars}
      <polyline class="line-total" points="${pts}"/>${dots}
      ${labels}
    </svg>
    <div class="chart-sum">
      <span>평균 <b>${avg}%</b></span>
      <span>최고 <b>${peak.rate}%</b> (${dateLabel(peak.date)})</span>
      <span>최저 <b>${low.rate}%</b> (${dateLabel(low.date)})</span>
      <span class="muted">노쇼·취소는 빠진 값입니다</span>
    </div>`;
}

/* ---------- 예약 목록 (한 줄) ---------- */
function renderResList(date){
  const s = store();
  let day = s.reservations.filter(r=>r.date===date).sort((a,b)=>a.time.localeCompare(b.time));
  const filters = ["전체",...STATUS].map(f=>{
    const n = f==="전체" ? s.reservations.filter(r=>r.date===date).length
                         : s.reservations.filter(r=>r.date===date && r.status===f).length;
    return `<button class="${view.filter===f?'on':''}" onclick="setFilter('${f}')">${f} ${n}</button>`;
  }).join("");
  if(view.filter!=="전체") day = day.filter(r=>r.status===view.filter);
  const rows = day.length ? day.map(resRow).join("")
    : `<div class="empty">해당 조건의 예약이 없습니다.</div>`;
  return `<div class="filters">${filters}</div><div class="rlist">${rows}</div>`;
}
function resRow(r){
  const room = store().settings.rooms.find(x=>x.id===r.roomId);
  const seat = room ? seatLabel(r.roomId)
             : (r.tentativeRoomId ? `${seatLabel(r.tentativeRoomId)}(잠정)` : "미배정");
  /* 시간이 지났는데 아직 처리하지 않은 예약 */
  const late = r.status==="확정" && r.date<=todayStr() &&
    (r.date<todayStr() || toMin(r.time)+60 < toMin(nowHM()));
  const pills = [
    r.assignedLater ? `<span class="pill" title="접수 때는 좌석 미정이었습니다">배정 완료</span>` : "",
    r.menuType==="코스" ? (r.courseUndecided
      ? `<span class="pill amber">코스 미정</span>`
      : `<span class="pill pine" title="${esc(courseSummary(r.courses))}">코스</span>`) :
    r.menuType==="코스 상당" ? `<span class="pill pine">코스상당</span>` :
    r.menuType==="확인 필요" ? `<span class="pill amber">메뉴확인</span>` : "",
    r.allergy ? `<span class="pill rust" title="${esc(r.allergy)}">알러지</span>` : "",
    r.chairs ? `<span class="pill pine">유아의자 ${r.chairs}</span>` : "",
    r.request ? `<span class="pill" title="${esc(r.request)}">요청</span>` : "",
    r.memo ? `<span class="pill blue" title="${esc(r.memo)}">메모</span>` : ""
  ].join("");
  return `
    <button class="rrow s-${r.status} ${late?'late':''}" onclick="openMark('${r.id}')">
      <span class="rr-bang">${late?"!":""}</span>
      <span class="rr-t">${esc(r.time)}</span>
      <span class="rr-n">${esc(r.name)}</span>
      <span class="rr-p">${pplOf(r)}명${r.infants?`(유아${r.infants})`:""}</span>
      <span class="rr-seat tag ${room?'pine':(r.tentativeRoomId?'amber':'rust')}">${esc(seat)}</span>
      <span class="rr-ph">${esc(r.phone||"-")}</span>
      <span class="rr-pills">${pills}</span>
      ${r.status!=="확정"?`<span class="rr-st tag ${r.status==="노쇼"?"rust":""}">${r.status}</span>`:""}
      ${(()=>{ const c=changeTag(r); return c?`<span class="chg-tag ${c.kind==="취소"||c.kind==="노쇼"?"off":""}">${esc(c.label)}</span>`:""; })()}
    </button>`;
}

/* ============================================================
   변동 이력 — 사장님의 '파란 글씨' 습관을 옮긴 것

   수기 장부에서는 나중에 바뀐 예약을 파란 펜으로 표시했습니다.
   장부 원본을 고칠 수 없으니 "이 줄은 검정 그대로 믿지 마라"는 표시였습니다.
   화면은 항상 최신값을 보여주므로 그 문제 자체는 없지만,
   **아직 최신이 아닌 곳**이 남아 있습니다 — 주방에 구두로 넘긴 코스 수량,
   직원이 머리로 기억하는 자리 배치.
   그래서 "값"이 아니라 "무엇이 언제 바뀌었는지"를 남깁니다.

   표시 조건은 **방문일 당일에 일어난 변동**입니다.
   어제 미리 바꾼 것은 오늘 아침에 이미 반영돼 있으므로 제외합니다.
   날짜가 넘어가면 자연히 정리되므로 따로 지우는 동작이 필요 없습니다.
   ============================================================ */

/* 변동으로 볼 항목. 여기 없는 것(예약경로 등)은 기록하지 않습니다 —
   손님 응대나 자리 배치에 영향이 없어 표시하면 소음만 됩니다. */
var CHANGE_FIELDS = [
  {k:"date",     n:"날짜",   f:function(v){ return v ? dateLabel(v) : "-"; }},
  {k:"time",     n:"시간",   f:function(v){ return v ? hm(v) : "-"; }},
  {k:"people",   n:"인원",   f:function(v){ return (v||0)+"명"; }},
  {k:"infants",  n:"유아",   f:function(v){ return (v||0)+"명"; }},
  {k:"chairs",   n:"유아의자", f:function(v){ return (v||0)+"개"; }},
  {k:"roomId",   n:"좌석",   f:function(v){ return v ? seatLabel(v) : "미배정"; }},
  {k:"menuType", n:"식사",   f:function(v){ return v || "-"; }},
  {k:"request",  n:"요청",   f:function(v){ return v || "없음"; }},
  {k:"allergy",  n:"알러지", f:function(v){ return v || "없음"; }},
  {k:"memo",     n:"메모",   f:function(v){ return v || "없음"; }}
];

/* 두 예약을 비교해 바뀐 항목만 뽑습니다 */
function diffRes(a, b){
  var out = [], i;
  for(i=0;i<CHANGE_FIELDS.length;i++){
    var c = CHANGE_FIELDS[i];
    var x = a ? a[c.k] : undefined, y = b ? b[c.k] : undefined;
    if((x||"") === (y||"")) continue;
    if((x||0) === (y||0) && typeof x !== "string") continue;
    out.push({n:c.n, a:c.f(x), b:c.f(y)});
  }
  /* 코스는 개수 묶음이라 따로 비교합니다 */
  var ca = courseSummary(a && a.courses) || (a && a.courseUndecided ? "미정" : "");
  var cb = courseSummary(b && b.courses) || (b && b.courseUndecided ? "미정" : "");
  if(ca !== cb) out.push({n:"코스", a:ca||"없음", b:cb||"없음"});
  return out;
}

/* 이력 한 줄을 남깁니다. on 은 '그날 날짜'(현지 기준) — at 만 쓰면 시차 때문에 어긋납니다 */
function addChange(rec, kind, items){
  if(!rec) return rec;
  var log = (rec.changes || []).slice();
  log.push({ on: todayStr(), at: new Date().toISOString(), kind: kind, items: items || [] });
  if(log.length > 40) log = log.slice(-40);   /* 한 예약이 무한정 커지지 않게 */
  rec.changes = log;
  return rec;
}

/* 방문일 당일에 일어난 변동만. 등록은 '그날 받은 당일 예약'일 때만 포함합니다 */
function todayChanges(r){
  var log = r.changes || [], out = [], i;
  for(i=0;i<log.length;i++){
    if(log[i].on !== r.date) continue;
    out.push(log[i]);
  }
  return out;
}
/* 목록·타임라인에 붙일 짧은 표시. 없으면 null */
function changeTag(r){
  var cs = todayChanges(r);
  if(!cs.length) return null;
  var kinds = {}, items = {}, i, j;
  for(i=0;i<cs.length;i++){
    kinds[cs[i].kind] = 1;
    for(j=0;j<(cs[i].items||[]).length;j++) items[cs[i].items[j].n] = 1;
  }
  /* 취소·노쇼가 가장 중요합니다 — 자리를 비워야 하는 건이라 */
  var kind = kinds["취소"] ? "취소" : kinds["노쇼"] ? "노쇼"
           : kinds["등록"] ? "신규" : "변경";
  var names = Object.keys(items);
  /* 상태 태그(취소/노쇼)가 이미 옆에 붙으므로 '오늘' 을 넣어 구분합니다.
     지난주에 취소된 건과 오늘 취소된 건은 대응이 완전히 다릅니다. */
  var label = kind==="취소" ? "오늘 취소"
            : kind==="노쇼" ? "오늘 노쇼"
            : kind==="신규" ? "당일 접수"
            : "변경" + (names.length ? " · " + names.join("·") : "");
  return { kind: kind, fields: names, label: label };
}
/* 예약 상세에 펼쳐 보여줄 전체 이력 (그날 것만, 최근이 위로) */
function changeLines(r){
  var cs = todayChanges(r).slice().reverse(), out = [], i, j;
  for(i=0;i<cs.length;i++){
    /* at 은 UTC(ISO)라 그대로 잘라 쓰면 9시간이 어긋납니다.
       Date 로 되돌려 현지(한국) 시각으로 찍습니다. */
    var c = cs[i], d = c.at ? new Date(c.at) : null;
    var t = d && !isNaN(d) ? pad(d.getHours())+":"+pad(d.getMinutes()) : "";
    if(c.kind === "등록"){ out.push({t:t, s:"예약 접수"}); continue; }
    if(c.kind === "취소"){ out.push({t:t, s:"예약 취소"}); continue; }
    if(c.kind === "노쇼"){ out.push({t:t, s:"노쇼 처리"}); continue; }
    if(!(c.items||[]).length){ out.push({t:t, s:"수정"}); continue; }
    for(j=0;j<c.items.length;j++)
      out.push({t:t, s:c.items[j].n + " " + c.items[j].a + " → " + c.items[j].b});
  }
  return out;
}

/* ============================================================
   문자 안내 — ※ 지금은 흉내만 냅니다 (실제로 발송되지 않습니다)

   [왜 흉내로 두는가]
   문자를 실제로 보내려면 문자 발송 업체(알리고·솔라피 등)에 가입해서
   발신번호를 등록하고(통신사 사전등록 필요), 건당 요금을 내고, 그 업체 서버를
   호출해야 합니다. 브라우저에서 직접 못 보냅니다 — 열쇠(API 키)가 노출되니까요.
   그래서 **화면과 문안, 언제 나갈지를 먼저 확정**하고 발송만 나중에 붙입니다.
   실제로 붙일 때 고칠 곳은 smsSend() 한 곳뿐입니다.

   [언제 나가나]
   1. 접수 문자 — 예약을 등록한 즉시 1회
   2. 재안내 문자 — 설정한 시점에 1회 (기본: 전날 오후 5시)
      · 2일 전 / 1일 전 : 오전 9시 ~ 오후 7시, 1시간 단위
      · 당일          : 오전 9시 ~ 오전 11시, 1시간 단위
      · 재안내 시각이 **이미 지난 뒤에 접수된 예약은 재안내가 나가지 않습니다.**
        (전날 5시가 기준인데 당일 저녁 예약을 오후 6시에 받으면 보낼 시점이 없습니다)
      · 며칠 전이냐에 따라 문구가 달라집니다 — 모레 / 내일 / 오늘
   ============================================================ */
/* SMS_DEFAULT 는 DEFAULT_DATA 보다 위에 있습니다 (아래 주석 참고) */
/* st 를 넘기면 그 매장 기준으로 봅니다.
   생략하면 지금 보고 있는 매장 — 화면에서 부를 때는 이쪽입니다.
   ※ 매장을 고르기 전(앱 켜자마자)에는 store() 가 없으므로,
      smsTick() 처럼 매장 밖에서 도는 코드는 반드시 st 를 넘겨야 합니다. */
function smsCfg(st){
  var s = st || store();
  return { ...SMS_DEFAULT, ...((s && s.settings && s.settings.sms) || {}) };
}
/* 재안내 시점으로 고를 수 있는 시각. 당일은 오전만 — 저녁 예약 손님이
   오후에 "오늘 예약이십니다" 를 받아도 이미 늦습니다. */
function remindHours(offset){
  var out = [], h, last = (offset === 0) ? 11 : 19;
  for(h = 9; h <= last; h++) out.push(h);
  return out;
}
function offsetLabel(o){ return o === 2 ? "2일 전" : o === 1 ? "1일 전 (전날)" : "당일 아침"; }
/* 문자 안에 들어갈 말 — '설정값'이 아니라 '보내는 날과 예약일의 실제 차이'로 정합니다.
   앱이 꺼져 있어 뒤늦게 나가는 경우(전날 5시에 못 보내고 당일 아침에 나감)에
   설정값만 보면 "내일 예약입니다"라고 잘못 나갑니다. 손님이 날짜를 착각하게 됩니다. */
function smsGapWord(r){
  var d1 = new Date(r.date + "T00:00:00"), d0 = new Date(todayStr() + "T00:00:00");
  if(isNaN(d1)) return null;
  var g = Math.round((d1 - d0) / 86400000);
  return g < 0 ? null : g === 0 ? "오늘" : g === 1 ? "내일" : g === 2 ? "모레" : g + "일 뒤";
}

/* 재안내가 나갈 시각 (Date). 설정이 꺼져 있어도 계산은 합니다 — 미리보기에 씁니다 */
function remindAt(r, st){
  var c = smsCfg(st);
  if(!r || !r.date) return null;
  var d = new Date(shiftDate(r.date, -c.remindOffset) + "T00:00:00");
  if(isNaN(d)) return null;
  d.setHours(c.remindHour, 0, 0, 0);
  return d;
}
function smsFind(r, kind){
  var log = (r && r.sms) || [], i;
  for(i = log.length - 1; i >= 0; i--) if(log[i].kind === kind) return log[i];
  return null;
}
/* 재안내 문자의 현재 상태. state 하나로 화면·발송이 같은 판단을 쓰게 합니다 */
function remindState(r, st){
  var c = smsCfg(st), at = remindAt(r, st), sent = smsFind(r, "재안내");
  if(sent) return { state:"보냄", at:at, rec:sent };
  if(!c.on) return { state:"꺼짐", at:at };
  if(!(r.phone || "").trim()) return { state:"번호없음", at:at };
  if(r.status === "취소" || r.status === "노쇼") return { state:"제외", at:at };
  if(!at) return { state:"제외", at:null };
  /* 접수 시각이 재안내 시각보다 늦으면 보낼 시점이 이미 지났습니다 */
  var made = r.createdAt ? new Date(r.createdAt) : null;
  if(made && !isNaN(made) && made.getTime() > at.getTime())
    return { state:"늦은접수", at:at };
  return { state: at.getTime() <= Date.now() ? "발송대기" : "예정", at:at };
}
/* 상태를 사람이 읽는 한 줄로 */
function remindWhy(st){
  return st.state === "꺼짐"     ? "문자 안내가 꺼져 있습니다"
       : st.state === "번호없음" ? "전화번호가 없어 보낼 수 없습니다"
       : st.state === "제외"     ? "취소·노쇼 예약이라 보내지 않습니다"
       : st.state === "늦은접수" ? "재안내 시각이 지난 뒤에 접수돼 나가지 않습니다"
       : "";
}

/* ---------- 문안 ---------- */
function smsWhen(r){
  var d = new Date(r.date + "T00:00:00");
  var dow = ["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일(" + dow + ") " + hm(r.time);
}
/* seatLabel() 은 '지금 보고 있는 매장'(store())을 씁니다.
   문자는 매장을 고르기 전에도 만들어질 수 있어서(smsTick) 여기서는 직접 찾습니다. */
/* '4명' / 유아가 있으면 '4명(유아 1명 포함)'. 유아가 없으면 괄호를 아예 안 씁니다 */
function smsPpl(r){
  var inf = r.infants || 0;
  return pplOf(r) + "명" + (inf > 0 ? "(유아 " + inf + "명 포함)" : "");
}
function smsSeat(r, st){
  if(!r.roomId) return "";
  var rooms = ((st || store() || {}).settings || {}).rooms || [];
  var room = null, i;
  for(i = 0; i < rooms.length; i++) if(rooms[i].id === r.roomId) room = rooms[i];
  if(!room) return "";
  return room.type === "room" ? room.name + " 룸" : room.name;
}
/* kind: "접수" | "재안내". 재안내는 offset 을 넘겨 문구를 바꿉니다 */
function smsText(r, kind, offset, st){
  var c = smsCfg(st), s = st || store();
  var who = [ (r.name || "") + " 님", smsWhen(r), smsPpl(r) ];
  var lines;
  if(kind === "접수"){
    lines = [
      "[ 예약 완료 안내 ]", "",
      "안녕하세요, " + s.name + "입니다.",
      "예약확인 문자 드립니다.", ""
    ].concat(who).concat([ "", "예약해주셔서 감사합니다." ]);
  }else{
    /* '오늘 / 내일 / 모레' 는 설정값이 아니라 보내는 날과 예약일의 실제 차이로 정합니다 */
    var word = smsGapWord(r);
    lines = [
      "[ 예약 방문 안내 ]", "",
      (word ? word + " " : "") + "예약 방문 안내드립니다.", ""
    ].concat(who);
    var park = (c.parkingNote || "").trim();
    if(park) lines = lines.concat([ "", park ]);
    lines = lines.concat([
      "", "시간 변경이 필요하시면 미리 연락 주시기 바랍니다.",
      "", "감사합니다."
    ]);
  }
  return lines.join("\n");
}

/* ---------- 발송 (흉내) ----------
   실제로 붙일 때는 이 함수 안에서 발송 업체 API 를 부르면 됩니다.
   나머지 코드는 손댈 필요가 없습니다. */
function smsSend(r, kind, offset, resent, st){
  var c = smsCfg(st);
  if(!r) return null;
  var rec = {
    kind: kind,
    at: new Date().toISOString(),
    to: (r.phone || "").trim(),
    offset: kind === "재안내" ? (offset != null ? offset : c.remindOffset) : null,
    text: smsText(r, kind, offset, st),
    resent: !!resent,
    mock: true                    /* 진짜로 나간 게 아니라는 표시 */
  };
  r.sms = (r.sms || []).concat([rec]);
  if(r.sms.length > 30) r.sms = r.sms.slice(-30);
  return rec;
}

/* 재안내 시각이 지난 예약을 훑어 '보냄'으로 바꿉니다.
   실제 서비스라면 서버가 할 일입니다. 여기서는 화면이 열려 있을 때만 돕니다.
   지난 날짜는 건드리지 않습니다 — 예시 데이터 수백 건에 기록이 쌓이면 지저분해집니다. */
function smsTick(){
  var today = todayStr(), n = 0, keys = DATA ? Object.keys(DATA) : [], k, i;
  for(k = 0; k < keys.length; k++){
    var s = DATA[keys[k]];
    /* _auth·_logs 같은 내부 항목은 매장이 아닙니다 */
    if(!s || !s.settings || !s.reservations) continue;
    var c = smsCfg(s);
    if(!c.on) continue;
    for(i = 0; i < s.reservations.length; i++){
      var r = s.reservations[i];
      if(r.date < today) continue;
      if(remindState(r, s).state !== "발송대기") continue;
      smsSend(r, "재안내", c.remindOffset, false, s);
      n++;
    }
  }
  if(n) saveData();
  return n;
}
/* 매장 전체의 보낸 문자 — 최근 것부터 */
function smsLog(){
  var s = store(), out = [], i, j;
  for(i = 0; i < s.reservations.length; i++){
    var r = s.reservations[i], log = r.sms || [];
    for(j = 0; j < log.length; j++) out.push({ r:r, m:log[j] });
  }
  out.sort(function(a, b){ return a.m.at < b.m.at ? 1 : a.m.at > b.m.at ? -1 : 0; });
  return out;
}

/* 예약 한 건의 경고 사유 — 지표와 목록에서 함께 씁니다 */
function resWarn(r){
  const st = store().settings;
  const out = [];
  const h = hoursFor(r.date);
  if(h.closed) out.push("휴무일 예약");
  else{
    if(inBreak(r.date, r.time)) out.push("브레이크타임");
    if(toMin(r.time) < toMin(h.open) || toMin(r.time) >= toMin(h.close)) out.push("영업시간 밖");
    else if(h.lo && toMin(r.time) > toMin(h.lo)) out.push("라스트오더 이후");
    if(toMin(r.time) + stayOf(r) > toMin(h.close)) out.push("마감 넘김");
  }
  const seat = st.rooms.find(x=>x.id===r.roomId);
  if(seat && resBlocked(r)) out.push("사용 중지 좌석");
  if(seat && seat.type==="room"){
    if(pplOf(r) > seat.capacity) out.push("정원 초과");
    else if(adultCount(pplOf(r), r.infants) < roomMin(seat)) out.push("최소 인원 미달");
  }
  if((r.infants||0) >= pplOf(r) && pplOf(r)>0) out.push("성인 없음");
  if(seat && seat.type==="room"){
    const cn = Object.values(r.courses||{}).reduce((a,b)=>a+b,0);
    const ad = adultCount(pplOf(r), r.infants);
    if(r.menuType==="해당 없음") out.push("룸·코스 아님");
    else if(r.menuType==="확인 필요") out.push("코스 미확정");
    else if(r.menuType==="코스" && !r.courseUndecided && cn>0 && cn<ad) out.push("코스 인원 부족");
  }
  if((r.chairs||0) > (r.infants||0)) out.push("유아의자 초과");
  /* 겹쳐 받은 룸은 접수 뒤에도 계속 보여야 합니다.
     막지 않고 받는 대신(설계 5.2), 취소를 깜빡한 예약이 남아 있는 경우를
     '확인 필요'에서 나중에라도 잡아낼 수 있게 합니다. */
  if(seat && seat.type==="room" && r.roomId && r.status!=="취소"){
    const rs = roomStatus(r.date, r.time, r.roomId, r.id);
    if(rs.hits.length) out.push("좌석 겹침");
  }
  return out;
}

/* 손이 가야 할 것만 모읍니다. 각 줄은 눌러서 바로 처리할 수 있습니다. */
function checkItems(date){
  const s = store(), today = todayStr();
  const d = date || today;
  const list = s.reservations.filter(r=>r.date===d && r.status==="확정");
  const items = [];

  const un = list.filter(r=>!r.roomId);
  if(un.length) items.push(["amber", `좌석 미배정 ${un.length}건`,
    un.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openUnassigned()`]);

  const allergy = list.filter(r=>r.allergy);
  if(allergy.length) items.push(["rust", `알러지 확인 ${allergy.length}건`,
    allergy.slice(0,2).map(r=>`${r.time} ${r.name} · ${r.allergy}`).join(" / "), `openPick('allergy')`]);

  const chairs = list.filter(r=>r.chairs>0);
  const chairSum = chairs.reduce((a,r)=>a+(r.chairs||0),0);
  if(chairSum) items.push(["pine", `유아용 의자 ${chairSum}개 준비`,
    chairs.slice(0,3).map(r=>`${r.time} ${r.name} ${r.chairs}개`).join(", "), `openPick('chairs')`]);

  const gsize = s.settings.groupSize || 8;
  const group = list.filter(r=>pplOf(r) >= gsize);
  if(group.length) items.push(["pine", `단체 손님 ${group.length}건`,
    group.slice(0,3).map(r=>`${r.time} ${r.name} ${pplOf(r)}명`).join(", "), `openPick('group')`]);

  const menuChk = list.filter(r=>r.menuType==="확인 필요");
  if(menuChk.length) items.push(["amber", `메뉴 확인 필요 ${menuChk.length}건`,
    menuChk.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openPick('menu')`]);

  /* 취소·노쇼도 '자리를 비워야 하는 변동'이라 확정 목록이 아닌 그날 전체에서 셉니다 */
  const chg = s.reservations.filter(r=>r.date===d && changeTag(r));
  if(chg.length) items.push(["blue", `오늘 변동 ${chg.length}건`,
    chg.slice(0,3).map(r=>`${hm(r.time)} ${r.name} ${changeTag(r).kind}`).join(", "), `openPick('changed')`]);

  const ns = list.filter(r=>noshowOf(r.phone));
  if(ns.length) items.push(["rust", `노쇼 이력 손님 ${ns.length}건`,
    ns.slice(0,3).map(r=>`${r.time} ${r.name}`).join(", "), `openPick('noshow')`]);

  if(d===today){
    const y = shiftDate(today,-1);
    const yAll = s.reservations.filter(r=>r.date===y && r.status!=="취소").length;
    const auto = autoClosedList(y);
    if(auto.length) items.push(["", `어제 예약 ${yAll}건 중 ${auto.length}건 자동 방문 처리`,
      "노쇼·취소가 있었다면 눌러서 수정하세요", `openPick('auto')`]);
  }

  return items;
}

    chairs:{title:"유아용 의자", pick:r=>r.chairs>0, note:"의자 개수를 미리 준비하세요."},

    changed:{title:"오늘 변동", pick:r=>!!changeTag(r),

    group:{title:"단체 손님", pick:r=>pplOf(r) >= (store().settings.groupSize||8),

    auto:{title:"어제 자동 방문 처리", pick:null, note:""}
  }[kind];
  const list = kind==="auto"

          kind==="allergy"&&r.allergy?` · ${esc(r.allergy)}`:""}${
          kind==="chairs"?` · 의자 ${r.chairs}개`:""}${
          kind==="noshow"&&noshowOf(r.phone)?` · 노쇼 ${noshowOf(r.phone).count}회`:""}${
          kind==="warn"?` · ${resWarn(r).join(", ")}`:""}${
          kind==="group"&&r.menuType==="코스"?` · 코스`:""}</span></span>
      <span class="tag ${r.roomId?'pine':'rust'}">${r.roomId?esc(seatLabel(r.roomId)):"미배정"}</span>
    </button>`).join("") : `<div class="empty">해당 예약이 없습니다.</div>`;
  return `
    ${sheetHead(`${conf.title} · ${kind==="auto"?dateLabel(shiftDate(today,-1)):dateLabel(d)}`)}
    <div class="card" style="margin-bottom:12px">${rows}</div>
    <p class="f-note">${conf.note}</p>
    <div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">닫기</button></div>`;
}
