/* ============================================================
   좌석 가동 타임라인
   룸: 한 줄에 예약 블록
   홀: 테이블 수만큼 층을 만들고, 먼저 온 팀부터 아래층에 배치
       (한 팀이 테이블 2개를 쓰면 두 층을 차지)
   ============================================================ */
function laneLayout(items, laneCount){
  /* 시간 순으로 훑으며 비어 있는 가장 아래 층에 배치 */
  const laneEnd = new Array(laneCount).fill(-1);
  const placed = [];
  for(const it of items){
    let start = -1;
    for(let i=0; i+it.need<=laneCount; i++){
      let ok = true;
      for(let k=i;k<i+it.need;k++) if(laneEnd[k] > it.s0){ ok=false; break; }
      if(ok){ start=i; break; }
    }
    if(start<0){ placed.push({...it, lane:null, over:true}); continue; }
    for(let k=start;k<start+it.need;k++) laneEnd[k] = it.e0;
    placed.push({...it, lane:start});
  }
  return placed;
}
function renderTimeline(date){
  const s = store(), st = s.settings;
  const ax = axisRange();                       /* 가장 넓은 영업시간 = 가로축 */
  const o = ax.o, c = ax.c, span = c - o;
  const dh = hoursFor(date);                    /* 그날 실제 운영시간 */
  const dOpen = toMin(dh.open), dClose = toMin(dh.close);
  const list = s.reservations.filter(r=>r.date===date && holdsSeat(r));
  const pos = m => ((m-o)/span)*100;
  /* 영업 전·후, 브레이크타임을 덮는 층 */
  const shade = `
    ${dh.closed?`<span class="closed-band"></span>`:`
      ${dOpen>o?`<span class="offband" style="left:0; width:${pos(dOpen)}%"></span>`:""}
      ${dClose<c?`<span class="offband" style="left:${pos(dClose)}%; right:0"></span>`:""}
      ${dh.bs&&dh.be?`<span class="breakband" style="left:${pos(toMin(dh.bs))}%; width:${((toMin(dh.be)-toMin(dh.bs))/span)*100}%"></span>`:""}
    `}`;
  const LANE = 21;   /* 층 하나의 높이(px) */
  const MAX_LANES = 4;   /* 룸 한 줄이 너무 두꺼워지지 않게. 넘치면 '초과 N' 으로 알림 */

  const ticks = [];
  for(let m=Math.ceil(o/60)*60; m<=c; m+=60)
    ticks.push(`<span class="tk" style="left:${pos(m)}%"><i></i><b>${Math.floor(m/60)}</b></span>`);
  const layers = ticks.join("") + shade;
  /* 현재 시각 선.
     예전에는 그래프 범위(o~c)를 벗어나면 선을 아예 안 그렸습니다.
     그러면 개점 전이나 마감 후에 선이 사라져서 "지금이 어디쯤인지" 감이 끊깁니다.
     범위를 벗어나면 가까운 쪽 끝에 붙여 두고, 붙어 있다는 걸 알 수 있게
     점선으로 바꿉니다(.edge). 선이 있는 편이 없는 것보다 읽기 쉽습니다. */
  const nowM = toMin(nowHM());
  const isToday = date===todayStr();
  const nowClamped = Math.min(c, Math.max(o, nowM));
  const nowLine = isToday
    ? `<span class="nowline ${nowM<o?'edge before':nowM>c?'edge after':''}"
             style="left:${pos(nowClamped)}%"
             title="${nowM<o?`아직 그래프 시작(${hm(minToHM(o))}) 전입니다`
                    :nowM>c?`그래프 끝(${hm(minToHM(c))})을 지났습니다`
                    :`지금 ${hm(nowHM())}`}"></span>` : "";

  const blockLabel = r =>
    `<b>${esc(r.time)}</b> ${esc(r.name)} ${pplOf(r)}명${r.infants?`(유아${r.infants})`:""}`;

  /* 좌석 이름 칸에 붙는 사용 중지 요약 — 빗금 위 글자가 예약에 가려도 여기서는 보입니다 */
  const blockTag = (seat)=>{
    const sp = blockSpans(seat, date);
    if(!sp.length) return "";
    /* 자세한 시각·사유는 그래프 위 빗금에 적혀 있으므로 여기는 짧게만 */
    const txt = sp.length>1 ? `중지 ${sp.length}구간`
              : (sp[0].allDay ? "하루 중지" : "일부 중지");
    const tip = sp.map(x=>spanLabel(x)+(x.note?` · ${x.note}`:"")).join(" / ");
    return `<span class="bk" title="사용 중지 · ${esc(tip)}">${esc(txt)}</span>`;
  };

  /* 좌석 사용 중지 구간을 그 줄에만 덮습니다.
     영업시간 밖(.offband)과 같은 빗금 계열이되, 사람이 일부러 잠근 것이므로 더 진하게. */
  /* 빗금만 그리고 글자는 넣지 않습니다 — 예약 블록과 겹쳐 서로 안 읽힙니다.
     무슨 사유인지는 좌석 이름 칸의 표시와 마우스를 올렸을 때 나옵니다. */
  const blockBands = (seat)=>blockSpans(seat, date).map(sp=>{
    const s = Math.max(o, sp.s), e = Math.min(c, sp.e);
    if(e <= s) return "";
    return `<span class="blockband" style="left:${pos(s)}%; width:${((e-s)/span)*100}%"
      title="사용 중지 · ${esc(spanLabel(sp))}${sp.note?` · ${esc(sp.note)}`:""}"></span>`;
  }).join("");

  /* ---------- 홀 ---------- */
  const hallRow = (hall)=>{
    const tbl = hallTables(hall);
    const total = tbl.length;
    const items = list.filter(r=>effSeat(r)===hall.id)
      .sort((a,b)=>a.time.localeCompare(b.time))
      .map(r=>({ r, need:Math.min(total, tablesFor(pplOf(r))), s0:toMin(r.time), e0:Math.min(c, toMin(r.time)+stayOf(r)) }));
    const placed = laneLayout(items, total);
    const blocks = placed.map(it=>{
      if(it.lane===null) return "";
      const w = ((it.e0-it.s0)/span)*100;
      const tent = !it.r.roomId;
      const past = date<todayStr() || (date===todayStr() && it.e0 < nowM);
      const bad = resWarn(it.r).length>0;
      const chg = changeTag(it.r);
      return `<button class="blk ${tent?'tent':''} ${bad?'warned':''} ${past?'past':''} ${chg?'changed':''}" onclick="openMark('${it.r.id}')"
        style="left:${pos(it.s0)}%; width:${w}%; bottom:${it.lane*LANE+1}px; height:${it.need*LANE-2}px"
        title="${esc(it.r.time)} ${esc(it.r.name)} ${pplText(it.r)}${tent?' · 잠정':''}${chg?` · 오늘 ${esc(chg.label)}`:""}${bad?` · 경고: ${esc(resWarn(it.r).join(", "))}`:""}">
        ${blockLabel(it.r)}${tent?' <i class="tt">잠정</i>':''}</button>`;
    }).join("");
    /* 가동률 = 사용 테이블-시간 / (테이블 수 × 영업시간) */
    const tblMin = items.reduce((a,x)=>a+x.need*(x.e0-x.s0),0);
    const rate = total ? Math.min(100, Math.round(tblMin/(total*span)*100)) : 0;
    const over = placed.filter(x=>x.lane===null).length;
    return `<div class="tl-row hall ${blockedAllDay(hall,date)?'off-seat':''}" style="--lanes:${total}">
      <div class="tl-name"><b>${esc(hall.name)}</b><small>${total}테이블</small>${blockTag(hall)}</div>
      <div class="tl-track" style="height:${total*LANE}px">
        ${layers}
        ${Array.from({length:total},(_,i)=>`<span class="lane" style="bottom:${i*LANE}px; height:${LANE}px"></span>`).join("")}
        ${blockBands(hall)}${blocks}${nowLine}
      </div>
      <div class="tl-rate" style="height:${total*LANE}px">${total>1
        ? `<span class="rb"><i></i><b>${rate}%</b><i></i></span>`
        : `<span class="rt">${rate}%</span>`}${over?`<small class="over">초과 ${over}</small>`:""}</div>
    </div>`;
  };

  /* ---------- 룸 ---------- */
  const roomRow = (room)=>{
    const items = list.filter(r=>effSeat(r)===room.id)
      .sort((a,b)=>a.time.localeCompare(b.time))
      .map(r=>({ r, need:1, s0:toMin(r.time), e0:Math.min(c, toMin(r.time)+stayOf(r)) }));
    /* 사장 판단으로 겹치게 받은 경우가 있으므로 층을 유동적으로.
       ※ 예전에는 겹치기만 하면 무조건 2층이라, 같은 시간에 3건이 들어오면
          세 번째가 첫 번째 뒤에 완전히 가려져 화면에서 사라졌습니다.
          실제로 동시에 겹치는 최대 건수만큼 층을 만듭니다. */
    let lanes = 1;
    for(const a of items){
      let k = 0;
      for(const b of items) if(a.s0 < b.e0 && b.s0 < a.e0) k++;   /* 자기 자신 포함 */
      if(k > lanes) lanes = k;
    }
    if(lanes > MAX_LANES) lanes = MAX_LANES;   /* 그 이상은 '초과'로 알립니다 */
    const placed = laneLayout(items, lanes);
    const over = placed.filter(x=>x.lane===null).length;
    const blocks = placed.map(it=>{
      const w = ((it.e0-it.s0)/span)*100;
      const tent = !it.r.roomId;
      const past = date<todayStr() || (date===todayStr() && it.e0 < nowM);
      const lane = it.lane===null?0:it.lane;
      const bad = resWarn(it.r).length>0;
      const chg = changeTag(it.r);
      return `<button class="blk ${tent?'tent':''} ${bad?'warned':''} ${past?'past':''} ${chg?'changed':''}" onclick="openMark('${it.r.id}')"
        style="left:${pos(it.s0)}%; width:${w}%; bottom:${lane*LANE+1}px; height:${LANE-2}px"
        title="${esc(it.r.time)} ${esc(it.r.name)} ${pplText(it.r)}${tent?' · 잠정':''}${chg?` · 오늘 ${esc(chg.label)}`:""}${bad?` · 경고: ${esc(resWarn(it.r).join(", "))}`:""}">
        ${blockLabel(it.r)}${tent?' <i class="tt">잠정</i>':''}</button>`;
    }).join("");
    const used = items.reduce((a,x)=>a+(x.e0-x.s0),0);
    const rate = Math.min(100, Math.round(used/span*100));
    return `<div class="tl-row ${blockedAllDay(room,date)?'off-seat':''}">
      <div class="tl-name"><b>${esc(room.name)}</b><small>${roomMin(room)}~${room.capacity}인</small>${blockTag(room)}</div>
      <div class="tl-track" style="height:${lanes*LANE}px">
        ${layers}${blockBands(room)}${blocks}${nowLine}
      </div>
      <div class="tl-rate" style="height:${lanes*LANE}px">${lanes>1
        ? `<span class="rb"><i></i><b>${rate}%</b><i></i></span>`
        : `<span class="rt">${rate}%</span>`}${over?`<small class="over">초과 ${over}</small>`:""}</div>
    </div>`;
  };

  const halls = st.rooms.filter(r=>r.type==="hall");
  const rooms = st.rooms.filter(r=>r.type==="room");

  /* 전체 가동률 */
  const st2 = dayStat(date);
  const roomRate = st2.roomRate, hallRate = st2.hallRate;
  const tentCount = list.filter(r=>!r.roomId).length;

  return `
    <div class="tl-top">
      <div class="tl-kpis">
        <span class="tl-kpi">예약률 <b>${st2.rate}%</b></span>
        <span class="tl-kpi sub">룸 <b>${roomRate}%</b></span>
        <span class="tl-kpi sub">홀 <b>${hallRate}%</b></span>
        ${(()=>{
          /* 그날 상황을 한 줄로 — 각자 뜻에 맞는 색으로 */
          const day = s.reservations.filter(x=>x.date===date);
          const live = day.filter(holdsSeat);
          const cnt = {
            미정: tentCount,
            경고: live.filter(x=>resWarn(x).length).length,
            변경: day.filter(x=>changeTag(x)).length,
            요청: live.filter(x=>(x.request||"").trim()).length,
            메모: live.filter(x=>(x.memo||"").trim()).length,
            노쇼: day.filter(x=>x.status==="노쇼").length,
            취소: day.filter(x=>x.status==="취소").length
          };
          /* 파랑 = 우리끼리 남긴 표시(변경·메모), 벽돌색 = 손이 가야 할 것 */
          const cls = {미정:"amber", 경고:"rust", 변경:"blue", 요청:"", 메모:"blue", 노쇼:"rust", 취소:""};
          const nm  = {미정:"좌석 미정", 요청:"요청사항"};
          return Object.keys(cnt).filter(k=>cnt[k])
            .map(k=>`<span class="tag ${cls[k]}">${nm[k]||k} ${cnt[k]}건</span>`).join("");
        })()}
      </div>
      <span class="tl-hours">${dh.closed
        ? `휴무 · ${esc(dh.note||"")}`
        : `영업시간 ${esc(dh.open)} ~ ${esc(dh.close)}${dh.bs?` · 브레이크 ${esc(dh.bs)} ~ ${esc(dh.be)}`:""}${dh.lo?` · 라스트오더 ${esc(dh.lo)}`:""}`}</span>
      <div class="tl-legends">
        <span class="tl-legend"><i class="lgsw ok"></i>확정</span>
        <span class="tl-legend"><i class="lgsw tent"></i>잠정</span>
        <span class="tl-legend"><i class="lgsw warn"></i>경고</span>
      </div>
    </div>
    <div class="tl-scroll" id="tl-scroll">
      <div class="tl">
        <div class="tl-row axis">
          <div class="tl-name"></div>
          <div class="tl-track">${ticks.join("")}</div>
          <div class="tl-rate"><span class="rt">예약률</span></div>
        </div>
        ${halls.map(hallRow).join("")}
        ${rooms.map(roomRow).join("")}
      </div>
    </div>`;
}

/* ============================================================
   예약
   ============================================================ */
function weekStart(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() - d.getDay());
  return todayStr(d);
}

/* 하루치 요약 — 달력 팝업과 예약 화면에서 함께 씁니다 */
function dayStat(date){
  const s = store(), st = s.settings;
  const h = hoursFor(date);
  const o = toMin(h.open), c = toMin(h.close), span = Math.max(60, c-o);
  /* 자리를 실제로 쓴 예약만 셉니다 (확정 + 방문).
     노쇼와 취소는 자리를 안 쓴 것이므로 예약률에서 빠집니다. */
  const list = s.reservations.filter(r=>r.date===date && holdsSeat(r));
  const people = list.reduce((a,r)=>a+pplOf(r),0);
  const rooms = st.rooms.filter(r=>r.type==="room");
  const halls = st.rooms.filter(r=>r.type==="hall");
  const hallT = halls.reduce((a,h)=>a+hallTables(h).length,0);
  /* 예약이 차지하는 시간을 영업시간 안으로 잘라서 계산합니다.
     (마감 이후 시각의 예약이 음수가 되던 문제를 막습니다) */
  const spanOf = r => {
    const s0 = Math.max(o, toMin(r.time));
    const e0 = Math.min(c, toMin(r.time) + stayOf(r));
    return Math.max(0, e0 - s0);
  };
  const roomUsed = list.filter(r=>rooms.some(x=>x.id===effSeat(r)))
    .reduce((a,r)=>a+spanOf(r),0);
  const hallUsed = list.filter(r=>halls.some(x=>x.id===effSeat(r)))
    .reduce((a,r)=>a+tablesFor(pplOf(r))*spanOf(r),0);
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const seatAll = rooms.length + hallT;        /* 룸 1개 = 좌석 1, 홀은 테이블 1개 = 좌석 1 */
  /* 룸만·홀만 놓고 본 비율 */
  const roomRate = rooms.length ? clamp(roomUsed/(rooms.length*span)*100) : 0;
  const hallRate = hallT ? clamp(hallUsed/(hallT*span)*100) : 0;
  /* 전체 예약률에서 각자가 차지하는 몫 — 둘을 더하면 전체가 됩니다 */
  const roomShare = seatAll ? roomUsed/(seatAll*span)*100 : 0;
  const hallShare = seatAll ? hallUsed/(seatAll*span)*100 : 0;
  const total = clamp(roomShare + hallShare);
  return {count:list.length, people, roomRate, hallRate, rate:total,
          roomShare:Math.max(0,roomShare), hallShare:Math.max(0,hallShare),
          seatAll, roomSeats:rooms.length, hallSeats:hallT,
          unassigned:list.filter(r=>!r.roomId).length};
}

/* ---------- 좌석 현황 (2층) ---------- */
function renderSeatBoard(date){
  const s = store(), st = s.settings;
  const list = s.reservations.filter(r=>r.date===date && r.status==="확정");
  const cell = (r)=>{
    if(r.type==="hall"){
      const rows = list.filter(x=>effSeat(x)===r.id);
      const total = hallTables(r).length;
      /* 그날 가장 많이 쓰인 시점의 테이블 수 */
      let peak = 0, peakTent = 0;
      const dh = hoursFor(date);
      for(let m=toMin(dh.open); m<toMin(dh.close); m+=30){
        const inWin = x => toMin(x.time)<=m && m<toMin(x.time)+stayOf(x);
        const u = rows.filter(x=>x.roomId===r.id && inWin(x)).reduce((a,x)=>a+tablesFor(pplOf(x)),0);
        const t = rows.filter(x=>!x.roomId && inWin(x)).reduce((a,x)=>a+tablesFor(pplOf(x)),0);
        if(u+t > peak+peakTent){ peak=u; peakTent=t; }
      }
      const pct = total ? Math.round((peak+peakTent)/total*100) : 0;
      return `<div class="sb-cell hall ${peak+peakTent>=total?'full':''}">
        <div class="sb-h"><span class="sb-n">${esc(r.name)}</span><span class="sb-r">${pct}%</span></div>
        <div class="sb-bar"><i style="width:${total?peak/total*100:0}%"></i><u style="width:${total?peakTent/total*100:0}%"></u></div>
        <div class="sb-s">${total}테이블</div>
        <div class="sb-s">최다 사용 ${peak+peakTent}${peakTent?` (잠정 ${peakTent})`:""}</div>
        <div class="sb-s">${rows.length}팀 예약</div>
      </div>`;
    }
    const rows = list.filter(x=>effSeat(x)===r.id).sort((a,b)=>a.time.localeCompare(b.time));
    const tentOnly = rows.length && rows.every(x=>!x.roomId);
    const dh = hoursFor(date);
    const span = Math.max(60, toMin(dh.close)-toMin(dh.open));
    const used = rows.reduce((a,x)=>a+Math.min(stayOf(x), toMin(dh.close)-toMin(x.time)),0);
    const pct = Math.min(100,Math.round(used/span*100));
    return `<div class="sb-cell ${rows.length?(tentOnly?'tent':'used'):''}">
      <div class="sb-h"><span class="sb-n">${esc(r.name)}</span><span class="sb-r">${pct}%</span></div>
      <div class="sb-bar"><i style="width:${tentOnly?0:pct}%"></i><u style="width:${tentOnly?pct:0}%"></u></div>
      <div class="sb-s">${roomMin(r)}인~${r.capacity}인</div>
      <div class="sb-s">${rows.length?rows.map(x=>`${x.time}${x.roomId?"":"*"}`).join(", "):"예약 없음"}</div>
    </div>`;
  };
  const halls = st.rooms.filter(r=>r.type==="hall");
  const rooms = st.rooms.filter(r=>r.type==="room");
  return `
    <div class="sb-grid hall">${halls.map(cell).join("")}</div>
    <div class="sb-grid">${rooms.map(cell).join("")}</div>
    <div class="sb-note">* 표시는 좌석 미정 예약의 잠정 배정입니다.</div>`;
}

/* ---------- 예약 화면 ---------- */
function renderRes(){
  const s = store(), st = s.settings;
  let day = s.reservations.filter(r=>r.date===view.date).sort((a,b)=>a.time.localeCompare(b.time));
  const active = day.filter(r=>r.status==="확정");
  if(view.filter!=="전체") day = day.filter(r=>r.status===view.filter);
  const stat = dayStat(view.date);

  const filters = ["전체",...STATUS].map(f=>{
    const n = f==="전체" ? s.reservations.filter(r=>r.date===view.date).length
                         : s.reservations.filter(r=>r.date===view.date && r.status===f).length;
    return `<button class="${view.filter===f?'on':''}" onclick="setFilter('${f}')">${f} ${n}</button>`;
  }).join("");

  const cards = day.length ? `<div class="res-list">${day.map(resCard).join("")}</div>`
    : `<div class="card"><div class="empty">해당 조건의 예약이 없습니다.</div></div>`;

  return `
    <div class="res-head">
      <div class="datenav">
        <button class="nav mo" onclick="moveMonthDate(-1)" title="이전 달">«</button>
        <button class="nav" onclick="moveDate(-1)" title="어제">‹</button>
        <div class="rh-mid">
          <div class="rh-d">${dateLabel(view.date)}${view.date===todayStr()?' <span class="tag pine">오늘</span>':''}</div>
          <div class="rh-s">확정 ${stat.count}건 · ${stat.people}명 · 룸 ${stat.roomRate}% · 홀 ${stat.hallRate}%${stat.unassigned?` · <b style="color:var(--rust)">미배정 ${stat.unassigned}</b>`:""}</div>
        </div>
        <button class="nav" onclick="moveDate(1)" title="내일">›</button>
        <button class="nav mo" onclick="moveMonthDate(1)" title="다음 달">»</button>
        <button class="nav cal" onclick="openCal()" aria-label="달력 열기">${ICON.cal}</button>
      </div>
      <button class="btn primary add" onclick="openWizard('${view.date}')">＋ 예약 등록</button>
    </div>

    <div class="sect-title">가동 현황</div>
    <div class="card"><div class="card-b">${renderTimeline(view.date)}</div></div>

    <div class="sect-title">좌석 현황</div>
    <div class="card"><div class="card-b">${renderSeatBoard(view.date)}</div></div>

    <div class="sect-title">예약 목록</div>
    <div class="filters">${filters}</div>
    ${cards}
    ${view.calOpen ? renderCal() : ""}`;
}

/* ---------- 달력 팝업 (월 단위) ---------- */
function openCal(){ view.calOpen = true; view.calMonth = view.date.slice(0,7); render(); }
function closeCal(){ view.calOpen = false; render(); }
function moveCalMonth(n){
  const [y,m] = view.calMonth.split("-").map(Number);
  const d = new Date(y, m-1+n, 1);
  view.calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1);
  render();
}
function pickCalDate(d, close){
  view.date = d;
  if(close) view.calOpen = false;
  render();
}
function renderCal(){
  const [y,m] = view.calMonth.split("-").map(Number);
  const lead = new Date(y,m-1,1).getDay();
  const lastDay = new Date(y,m,0).getDate();
  const today = todayStr();

  let cells = "";
  for(let i=0;i<lead;i++) cells += `<span class="cday blank"></span>`;
  for(let d=1; d<=lastDay; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    const st = dayStat(ds);
    const dow = new Date(ds+"T00:00:00").getDay();
    const cls = ["cday", ds===view.date?"sel":"", ds===today?"today":"",
                 dow===0?"sun":dow===6?"sat":""].join(" ");
    cells += `<button class="${cls}" onclick="pickCalDate('${ds}',true)">
      <span class="dn">${d}</span>
      ${st.count?`<span class="cn">${st.count}건</span>
        <span class="cbar"><i style="width:${st.rate}%"></i></span>
        <span class="cr">${st.rate}%</span>`:`<span class="cn none">-</span>`}
    </button>`;
  }
  return `
    <div class="overlay" onclick="closeCal()">
      <div class="calbox" onclick="event.stopPropagation()">
        <div class="sheet-h">
          <h2>날짜 선택</h2>
          <button class="x" onclick="closeCal()" aria-label="닫기">×</button>
        </div>
        <div class="cal-nav">
          <button class="nav" onclick="moveCalMonth(-1)">◀</button>
          <div class="cal-m">${y}년 ${m}월</div>
          <button class="nav" onclick="moveCalMonth(1)">▶</button>
        </div>
        <div class="cgrid chead">${["일","월","화","수","목","금","토"].map((x,i)=>
          `<span class="chd ${i===0?'sun':i===6?'sat':''}">${x}</span>`).join("")}</div>
        <div class="cgrid">${cells}</div>
        <div class="sheet-actions">
          <button class="btn" onclick="pickCalDate('${todayStr()}',true)">오늘로</button>
          <button class="btn ghost" onclick="closeCal()">닫기</button>
        </div>
      </div>
    </div>`;
}

function setFilter(f){ view.filter=f; render(); }
function moveDate(d){ view.date=shiftDate(view.date,d); render(); }
/* 오늘 기준 가까운 날짜에 이름표 */
function dayBadge(d){
  const t = todayStr();
  if(d===t) return ' <span class="tag pine">오늘</span>';
  if(d===shiftDate(t,-1)) return ' <span class="tag near past">어제</span>';
  if(d===shiftDate(t,1)) return ' <span class="tag near">내일</span>';
  if(d===shiftDate(t,2)) return ' <span class="tag near">모레</span>';
  return "";
}
function moveMonthDate(n){
  const [y,m,dd] = view.date.split("-").map(Number);
  const last = new Date(y, m-1+n+1, 0).getDate();
  const dt = new Date(y, m-1+n, Math.min(dd,last));
  view.date = todayStr(dt); view.calMonth = view.date.slice(0,7);
  render();
}
function setDate(v){ if(v){ view.date=v; render(); } }
async function setStatus(id,status){
  const s=store();
  const rec = s.reservations.find(r=>r.id===id);
  if(status==="취소" && rec && rec.status!=="취소"){
    const ok = await uiConfirm("예약을 취소할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}`,
      {ok:"예약 취소", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(status==="노쇼" && rec && rec.status!=="노쇼"){
    const ok = await uiConfirm("노쇼로 처리할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n노쇼 관리 목록에 쌓입니다.`,
      {ok:"노쇼 처리", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(rec) logEvent("상태 변경", `${rec.date} ${rec.time} ${rec.name} ${rec.status} → ${status}`);
  /* 취소·노쇼는 화이트보드에서 지워야 하는 건이라 반드시 남깁니다.
     '방문'은 자동 처리라 변동으로 세지 않습니다 (매일 전부 표시되면 의미가 없어집니다) */
  s.reservations = s.reservations.map(function(r){
    if(r.id!==id) return r;
    const n = {...r, status};
    if(status==="취소" || status==="노쇼") addChange(n, status, []);
    return n;
  });
  if(rec) reflowTentatives(rec.date);
  saveData(); render();
}

      </button>
      ${open?`<div class="fold-b">${inner}</div>`:""}
    </section>`;
}

function screenUrl(){
  try{
    const base = location.origin + location.pathname.replace(/\/screen(\/[a-z]+)?$/i,"").replace(/\/+$/,"");
    if(location.protocol === "file:") return location.href.split("#")[0] + `#/screen/${view.storeKey}`;
    return `${base}/screen/${view.storeKey}`;
  }catch(e){ return `/screen/${view.storeKey}`; }
}
function copyScreenUrl(){
  if(!navigator.clipboard) return uiAlert("복사 실패","주소를 직접 입력해 주세요.","warn");
  navigator.clipboard.writeText(screenUrl()).then(
    ()=>uiAlert("복사 완료","TV 브라우저 주소창에 붙여넣으세요.","ok"),
    ()=>uiAlert("복사 실패","주소를 직접 입력해 주세요.","warn"));
}

  const st = draft();
  const rows = (st.displayRows && st.displayRows.length===3)
    ? st.displayRows.map(r=>[...r]) : displayRows().map(r=>[...r]);
  const from = rows.findIndex(r=>r.includes(id));
  const to = from + dir;
  if(from<0 || to<0 || to>2) return;
  rows[from] = rows[from].filter(x=>x!==id);
  rows[to].push(id);
  st.displayRows = rows;
  render();
}

function syncRes(){
  const g=id=>{const el=document.getElementById(id); return el?el.value:undefined;};
  const v = {};
  [["date","f-date"],["time","f-time"],["name","f-name"],["phone","f-phone"],
   ["roomId","f-room"],["sourceDetail","f-src-detail"],["request","f-request"],["allergy","f-allergy"],
   ["memo","f-memo"]]
    .forEach(([k,id])=>{ const x=g(id); if(x!==undefined) v[k]=x; });
  [["people","f-people"],["infants","f-infants"],["chairs","f-chairs"]]
    .forEach(([k,id])=>{ const x=g(id); if(x!==undefined) v[k]=Math.max(0,parseInt(x)||0); });
  tmpRes = {...tmpRes, ...v};
}
/* 저장하기 전에 걸리는 문제를 모아 돌려줍니다.
   마법사는 단계마다 물어보지만 수정 화면은 한 번에 물어야 하므로 목록으로 만듭니다.
   ※ 예전에는 수정 화면에만 이 검사가 통째로 없었습니다. 손님이 시간을 바꿔 달라고 할 때
      이미 찬 방이어도 조용히 저장되어, 통화를 끊은 뒤에야 발견했습니다. */
function saveIssues(rec, excludeId){
  const st = store().settings, out = [];
  const w = timeBlock(rec.date, rec.time);
  if(w) out.push.apply(out, w.split("\n"));
  const seat = st.rooms.find(x=>x.id===rec.roomId);
  if(seat){
    const bk = blockedAt(seat, rec.date, rec.time);
    if(bk) out.push(`${seat.name}은 이 시각에 사용 중지입니다${bk.note?` — ${bk.note}`:""}`);
    const ppl = pplOf(rec), ad = adultCount(ppl, rec.infants||0);
    if(seat.type==="room"){
      const rs = roomStatus(rec.date, rec.time, seat.id, excludeId);
      if(rs.hits.length)
        out.push(`${seat.name}에 겹치는 예약이 있습니다 — ` +
          rs.hits.map(x=>`${hm(x.time)} ${x.name} 손님`).join(", "));
      if(ppl > seat.capacity) out.push(`${seat.name} 정원 ${seat.capacity}명을 넘습니다 (지금 ${ppl}명)`);
      else if(ad < roomMin(seat)) out.push(`${seat.name} 최소 인원 ${roomMin(seat)}명에 못 미칩니다 (지금 ${ad}명)`);
    }else{
      const h = hallStatus(rec.date, rec.time, seat.id, excludeId);
      if(!hallFits(h, ppl)) out.push(`${seat.name}에 ${ppl}명 앉힐 자리가 부족합니다`);
    }
  }
  return out;
}
async function saveRes(){
  syncRes();
  const s=store(), f=tmpRes;
  if(!(f.name||"").trim()) return uiAlert("예약자명을 입력하세요","","warn");
  /* 날짜 검사가 없어서, 날짜 칸을 비우고 저장하면 date:"" 가 저장되고
     화면 날짜가 'NaN월 NaN일' 이 되어 달력으로도 복구가 안 됐습니다. */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||"")) return uiAlert("날짜를 입력하세요","","warn");
  if(!f.time) return uiAlert("시간을 입력하세요","","warn");
  if(!(f.people > 0)) return uiAlert("인원을 입력하세요","1명 이상이어야 합니다","warn");
  if((f.infants||0) > f.people)
    return uiAlert("유아 수가 총 인원보다 많습니다", `총 ${f.people}명 중 유아 ${f.infants}명`, "warn");
  const old = view.form.id ? s.reservations.find(r=>r.id===view.form.id) : null;
  const rec = {
    ...(old||{}),
    id: view.form.id || "res_"+Date.now(),
    date:f.date, time:f.time, name:(f.name||"").trim(), phone:(f.phone||"").trim(),
    people: Math.max(1, f.people||1), infants: f.infants||0, chairs: f.chairs||0,
    roomId: f.roomId || null,
    seatPref: f.roomId ? null : (old ? old.seatPref : "any"),
    tentativeRoomId: f.roomId ? null : (old ? old.tentativeRoomId : null),
    source:f.source, sourceDetail:f.source==="기타"?(f.sourceDetail||"").trim():"",
    request:(f.request||"").trim(), allergy:(f.allergy||"").trim(), memo:(f.memo||"").trim(),
    menuType: f.menuType || "해당 없음",
    /* 코스가 아니면 구성은 비워 둡니다 — '해당 없음'인데 코스 인원이 남는 일을 막습니다 */
    courses: f.menuType==="코스" ? {...(f.courses||{})} : {},
    courseUndecided: f.menuType==="코스" ? !!f.courseUndecided : false,
    status:f.status,
    createdAt: old ? old.createdAt : new Date().toISOString()
  };
  delete rec.__id; delete rec.adults; delete rec.courseOpen;

  /* 막지 않고 알리기만 합니다 (설계 5.2). 그대로 저장하면 경고 예약으로 남습니다. */
  const issues = saveIssues(rec, view.form.id);
  if(issues.length){
    const ok = await uiConfirm("이대로 저장할까요?",
      issues.map(x=>`· ${x}`).join("\n") +
      "\n\n저장해도 됩니다. 대신 '경고 예약'으로 남아 확인 필요에 뜹니다.",
      {ok:"그래도 저장", cancel:"다시 고치기"});
    if(!ok) return;
  }

  /* 무엇이 바뀌었는지 남깁니다 (사장님의 '파란 글씨' — 변동 이력 참고) */
  if(old){
    const d = diffRes(old, rec);
    if(d.length) addChange(rec, "변경", d);
    if(old.status !== rec.status && (rec.status==="취소" || rec.status==="노쇼"))
      addChange(rec, rec.status, []);
  }else{
    addChange(rec, "등록", []);
    /* 접수 문자 — 새 예약일 때만 1회 (수정으로는 다시 나가지 않습니다) */
    if(smsCfg().on && rec.phone) smsSend(rec, "접수");
  }

  s.reservations = view.form.id ? s.reservations.map(r=>r.id===rec.id?rec:r) : [...s.reservations, rec];
  logEvent(view.form.id?"예약 수정":"예약 등록", `${rec.date} ${rec.time} ${rec.name} ${pplOf(rec)}명`);
  /* 날짜를 옮겼으면 원래 날짜의 잠정 배정도 다시 계산해야 합니다 —
     안 그러면 비어 버린 자리를 계속 피한 채로 남습니다 */
  if(old && old.date !== rec.date) reflowTentatives(old.date);
  reflowTentatives(rec.date);
  view.date = rec.date; view.form=null; tmpRes=null;
  saveData(); render();
}
async function delRes(id){
  if(!await uiConfirm2("이 예약을 삭제할까요? 기록이 완전히 사라집니다.\n손님이 취소한 경우라면 '예약 취소'를 쓰는 편이 좋습니다.")) return;
  const s=store();
  const rec = s.reservations.find(r=>r.id===id);
  if(rec) logEvent("예약 삭제", `${rec.date} ${rec.time} ${rec.name} ${rec.phone||""}`);
  s.reservations=s.reservations.filter(r=>r.id!==id);
  if(rec) reflowTentatives(rec.date);
  view.form=null; tmpRes=null; saveData(); render();
}

/* 예약 상세에 붙는 문자 칸 — 나갔는지, 언제 나가는지, 왜 안 나가는지 */
function smsBox(r){
  const c = smsCfg();
  const sent = smsFind(r, "접수");
  const rs = remindState(r);
  const stamp = m => {
    const d = new Date(m.at);
    return isNaN(d) ? "" : `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const planTxt = rs.at
    ? `${rs.at.getMonth()+1}/${rs.at.getDate()} ${pad(rs.at.getHours())}:00`
    : "-";
  /* 안 나가는 이유가 있으면 그것부터 보여줍니다 — 사장님이 직접 전화하실 수 있게 */
  const why = remindWhy(rs);
  const row = (label, right, cls) =>
    `<div class="sms-row ${cls||""}"><span class="sm-l">${label}</span><span class="sm-r">${right}</span></div>`;
  return `
    <div class="sms-box">
      <div class="sb-t">문자 안내 <span class="sb-mock">흉내 · 실제로 나가지 않습니다</span></div>
      ${row("접수 문자",
        sent ? `<b>보냄</b> ${esc(stamp(sent))}${sent.resent?" · 재발송":""}`
             : (r.phone ? `<i>기록 없음</i>` : `<i>번호 없음</i>`))}
      ${row("재안내 문자",
        rs.state==="보냄"     ? `<b>보냄</b> ${esc(stamp(rs.rec))}${rs.rec.resent?" · 재발송":""}`
      : rs.state==="예정"     ? `${esc(planTxt)} 예정`
      : rs.state==="발송대기" ? `${esc(planTxt)} · 곧 나감`
      : `<i>안 나감</i>`,
        (rs.state!=="보냄" && rs.state!=="예정" && rs.state!=="발송대기") ? "bad" : "")}
      ${why ? `<div class="sb-why">${esc(why)}</div>` : ""}
      <div class="sb-btns">
        <button class="btn sm" onclick="smsPreview('${r.id}','접수')">접수 문자 보기</button>
        <button class="btn sm" onclick="smsPreview('${r.id}','재안내')">재안내 문자 보기</button>
      </div>
      <p class="sb-note">문안을 열면 그 자리에서 다시 보낼 수 있습니다.</p>
    </div>`;
}
/* 문안을 보여주고, 그 자리에서 다시 보낼 수 있게 합니다.
   미리보기와 재발송을 한 창에 둔 이유: 사장님이 보내기 전에 내용을 반드시 보게 하려고요.
   내용을 안 보고 보내는 버튼은 실수를 부릅니다. */
async function smsPreview(id, kind){
  const r = store().reservations.find(x=>x.id===id);
  if(!r) return;
  /* '---' 줄은 화면에서 가로선으로 그려집니다 — 어디부터 어디까지가 문자인지 끊어 줍니다 */
  const body = "---\n" + smsText(r, kind, smsCfg().remindOffset) +
    "\n---\n지금은 흉내만 냅니다. 실제로 나가지 않습니다.";
  if(!(r.phone||"").trim())
    return await uiAlert(kind + " 문자", body + "\n\n전화번호가 없어 보낼 수 없습니다.", "warn");
  const ok = await uiConfirm(kind + " 문자", r.phone + "\n\n" + body,
    { ok:"이 문자 보내기", cancel:"닫기" });
  if(!ok) return;
  smsSend(r, kind, smsCfg().remindOffset, true);
  logEvent("문자 재발송", r.date + " " + r.time + " " + r.name + " " + kind);
  saveData(); render();
}

/* ---------- 예약 상세 · 처리 ---------- */
function sheetMark(){
  const s = store(), st = s.settings;
  const r = s.reservations.find(x=>x.id===view.form.id);
  if(!r) return `${sheetHead("예약")}<div class="empty">예약을 찾을 수 없습니다.</div>`;

  const seat = r.roomId ? seatLabel(r.roomId)
             : (r.tentativeRoomId ? `미배정 (${seatLabel(r.tentativeRoomId)} 잠정)` : "미배정");
  const srcTxt = r.source==="기타" && r.sourceDetail ? `기타 · ${r.sourceDetail}` : (r.source||"전화");
  const made = r.createdAt ? new Date(r.createdAt) : null;
  const madeTxt = made
    ? `${made.getFullYear()}. ${made.getMonth()+1}. ${made.getDate()}. ${pad(made.getHours())}:${pad(made.getMinutes())}`
    : "기록 없음";

  const btn = (v,label,cls) =>
    `<button class="markbtn ${cls} ${r.status===v?'on':''}" onclick="markRes('${r.id}','${v}')">${label}</button>`;

  /* 좌석 미정이면 배정 후보를 바로 고를 수 있게 */
  let seatPick = "";
  if(!r.roomId){
    const cand = st.rooms.filter(x=>{
      const kind = r.seatPref||"any";
      if(kind==="hall-any" && x.type!=="hall") return false;
      if(kind==="room-any" && x.type!=="room") return false;
      if(x.type==="room") return pplOf(r)<=x.capacity;
      return true;
    }).map(x=>{
      const ok = x.type==="room"
        ? roomStatus(r.date,r.time,x.id,r.id).state==="free"
        : hallFits(hallStatus(r.date,r.time,x.id,r.id), pplOf(r));
      const first = x.id===r.tentativeRoomId;
      /* 남는 자리가 적을수록 좋은 자리 — 4명을 6인 룸에 넣지 않기 위해 */
      const waste = x.type==="room" ? (x.capacity - pplOf(r)) : 99;
      return {x, ok, first, waste};
    }).sort((a,b)=> (b.first-a.first) || (b.ok-a.ok) || (a.waste-b.waste));
    /* 쓸 수 있는 자리 중 앞에서 세 개까지 순위를 붙입니다.
       예전에는 잠정 배정된 1순위만 표시돼, 그다음으로 좋은 자리가 뭔지 알 수 없었습니다. */
    let rank = 0;
    const ranked = cand.map(c=>{
      if(c.ok && rank < 3) return {...c, rank: ++rank};
      return {...c, rank: 0};
    });
    seatPick = `
      <div class="lbl" style="margin:16px 0 8px">좌석 배정 ${r.tentativeRoomId?`<span class="tag amber">${esc(seatLabel(r.tentativeRoomId))} 잠정</span>`:""}</div>
      <div class="seatpick">${ranked.map(({x,ok,rank})=>`
        <button class="spick ${ok?'':'busy'} ${rank===1?'first':''} ${view.pickSeat===x.id?'picked':''}"
          onclick="pickSeatCand('${r.id}','${x.id}')">
          ${esc(x.name)}${x.type==="room"?` <small>${roomMin(x)}~${x.capacity}</small>`:""}
          ${rank?`<i>${rank}순위</i>`:""}
        </button>`).join("")}</div>
      ${view.pickSeat?`
        <div class="seatconfirm">
          <span><b>${esc(seatLabel(view.pickSeat))}</b> 으로 배정합니다</span>
          <button class="btn ghost sm" onclick="pickSeatCand('${r.id}','')">취소</button>
          <button class="btn primary" onclick="assignSeat('${r.id}','${esc(view.pickSeat)}')">좌석 확정하기</button>
        </div>`:`<p class="f-note" style="margin-top:8px">자리를 고른 뒤 '좌석 확정하기'를 눌러야 배정됩니다.</p>`}`;
  }

  return `
    ${sheetHead("예약 상세")}
    <div class="mark-info">
      <div class="mi-t">${esc(r.time)} · ${esc(r.name)} 손님</div>
      <div class="mi-s">${pplText(r)} · ${esc(seat)}</div>
      ${r.phone?`<div class="mi-s">${esc(r.phone)}</div>`:""}
      <div class="mi-s">식사 · <b>${esc(r.menuType||"해당 없음")}</b>${
        r.courseUndecided?" (구성 미정)":(r.courses&&Object.keys(r.courses).length?` (${esc(courseSummary(r.courses))})`:"")}</div>
      ${r.assignedLater?`<div class="mi-s">좌석 미정으로 접수 → ${esc(seatLabel(r.roomId))} 배정 완료</div>`:""}
      ${resWarn(r).length?`<div class="mi-s warn-txt">경고 · ${esc(resWarn(r).join(", "))}</div>`:""}
      ${r.chairs?`<div class="mi-s">유아용 의자 ${r.chairs}개</div>`:""}
      ${r.allergy?`<div class="mi-s warn-txt">알러지: ${esc(r.allergy)}</div>`:""}
      ${r.request?`<div class="mi-s">요청: ${esc(r.request)}</div>`:""}
      ${r.memo?`<div class="mi-s memo-line">메모: ${esc(r.memo)}</div>`:""}
      <div class="mi-meta">
        <span>경로 ${esc(srcTxt)}</span><span>등록 ${madeTxt}</span>
      </div>
    </div>
    ${(()=>{
      const lines = changeLines(r);
      if(!lines.length) return "";
      return `<div class="chg-box">
        <div class="cb-t">오늘 바뀐 내용</div>
        ${lines.map(l=>`<div class="cb-l"><span class="cb-tm">${esc(l.t)}</span>${esc(l.s)}</div>`).join("")}
        <div class="cb-s">주방에 이미 전달한 내용이 있다면 다시 알려주세요.</div>
      </div>`;
    })()}
    ${smsBox(r)}
    ${seatPick}
    <div class="lbl" style="margin:16px 0 8px">상태 · ${esc(r.status)}</div>
    <div class="markgrid">
      ${btn("확정","확정","back")}
      ${btn("방문","방문","ok")}
      ${btn("노쇼","노쇼","no")}
      ${btn("취소","예약 취소","cancel")}
    </div>
    <div class="sheet-actions">
      <button class="btn danger" onclick="delRes('${r.id}')">삭제</button>
      <button class="btn primary" onclick="openRes('${r.id}')">예약 내용 수정</button>
    </div>
    <p class="f-note" style="margin-top:10px">‘예약 취소’는 기록을 남기고, ‘삭제’는 기록까지 지웁니다. 보통은 취소를 쓰세요.</p>`;
}
async function markRes(id, status){
  const s = store();
  const rec = s.reservations.find(r=>r.id===id);
  if(status==="취소" && rec && rec.status!=="취소"){
    const ok = await uiConfirm("예약을 취소할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n좌석이 비고, 기록에는 ‘취소’로 남습니다.`,
      {ok:"예약 취소", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(status==="노쇼" && rec && rec.status!=="노쇼"){
    const ok = await uiConfirm("노쇼로 처리할까요?",
      `${rec.time} ${rec.name} 손님 · ${pplText(rec)}\n` +
      `이 번호는 노쇼 관리 목록에 쌓이고, 다음 예약 때 안내가 뜹니다.`,
      {ok:"노쇼 처리", cancel:"그대로 두기"});
    if(!ok) return;
  }
  if(rec) logEvent("상태 변경", `${rec.date} ${rec.time} ${rec.name} ${rec.status} → ${status}`);
  /* 취소·노쇼는 화이트보드에서 지워야 하는 건이라 반드시 남깁니다.
     '방문'은 자동 처리라 변동으로 세지 않습니다 (매일 전부 표시되면 의미가 없어집니다) */
  s.reservations = s.reservations.map(function(r){
    if(r.id!==id) return r;
    const n = {...r, status};
    if(status==="취소" || status==="노쇼") addChange(n, status, []);
    return n;
  });
  if(rec) reflowTentatives(rec.date);
  view.form = null; saveData(); render();
}
async function assignSeat(id, roomId){
  const s = store();
  const r = s.reservations.find(x=>x.id===id);
  if(!r) return;
  const room = s.settings.rooms.find(x=>x.id===roomId);
  if(room.type==="room"){
    const rs = roomStatus(r.date, r.time, roomId, id);
    /* 막지 않고 경고만 합니다 (설계 5.2) — 취소를 깜빡한 예약이 남아 있을 수 있습니다 */
    if(rs.state==="blocked"){
      const lines = rs.hits.map(x=>`· ${hm(x.time)} ${x.name} 손님 ${pplText(x)}`).join("\n");
      const ok = await uiConfirm(`${room.name} 룸에 1시간 안에 확정 예약이 있습니다`,
        `${lines}`,
        {ok:"그래도 배정", cancel:"다시 고르기"});
      if(!ok) return;
    }
    if(rs.state==="warn" && !await uiConfirm2(`${room.name} 룸에 겹치는 예약이 있습니다. 그래도 배정할까요?`)) return;
    if(pplOf(r) > room.capacity && !await uiConfirm2(`${room.name} 룸 정원(${room.capacity}명)을 넘습니다. 배정할까요?`)) return;
  }else{
    const h = hallStatus(r.date, r.time, roomId, id);
    if(!hallFits(h, pplOf(r)) && !await uiConfirm2(`${room.name} 남은 테이블이 부족합니다. 배정할까요?`)) return;
  }
  logEvent("좌석 배정", `${r.date} ${r.time} ${r.name} → ${room.name}`);
  /* 원래 미배정이었다는 기록을 남깁니다 — 나중에 자리를 바꿀 때 참고합니다 */
  if(!r.roomId) r.assignedLater = {from:r.seatPref||"any", at:new Date().toISOString()};
  addChange(r, "변경", [{n:"좌석", a:(r.roomId?seatLabel(r.roomId):"미배정"), b:seatLabel(roomId)}]);
  r.roomId = roomId; r.tentativeRoomId = null; r.seatPref = null;
  view.pickSeat = null;
  reflowTentatives(r.date);
  view.form = null; saveData(); render();
}

/* ---------- 숫자 입력 팝업 ---------- */
function numValue(){
  const f = view.form;
  if(f.val != null) return f.val;
  const st = draft();
  if(f.ctx && f.ctx.room){
    const r = st.rooms.find(x=>x.id===f.ctx.room);
    return r ? (f.key==="minCapacity" ? roomMin(r) : (r[f.key]||f.min)) : f.min;
  }
  if(f.ctx && f.ctx.tset != null){
    const hall = st.rooms.find(x=>x.id===f.ctx.hall);
    const zone = (hall.zones||[])[f.ctx.zone];
    if(f.key==="maxJoin") return zone.maxJoin||1;
    const s = zone.sets[f.ctx.tset];
    return s ? s[f.key] : f.min;
  }
  return st[f.key] != null ? st[f.key] : f.min;
}
function sheetNum(){
  const f = view.form;
  const v = numValue();
  const step = (f.ctx && f.ctx.step) || 1;
  const quick = [];
  for(let i=f.min; i<=f.max && quick.length<12; i+=step) quick.push(+i.toFixed(1));
  return `
    ${sheetHead(f.title)}
    <div class="numbig">
      <button onclick="numAdj(-1)" ${v<=f.min?"disabled":""}>−</button>
      <div class="nv">${v}</div>
      <button onclick="numAdj(1)" ${v>=f.max?"disabled":""}>＋</button>
    </div>
    <div class="numgrid">
      ${quick.map(n=>`<button class="${v===n?'on':''}" onclick="numSet(${n})">${n}</button>`).join("")}
    </div>
    <p class="f-note">${f.min} ~ ${f.max} 사이로 정할 수 있습니다.${step!==1?` (${step} 단위)`:""}</p>

/* 이 구역에서 실제로 만들 수 있는 자리 크기를 모두 구합니다.
   (같은 구역 안이면 어떤 테이블이든 붙임 한도까지 붙일 수 있습니다) */
function zoneCombos(zone){
  const tables = [];
  (zone.sets||[]).forEach(s=>{ for(let i=0;i<(s.count||0);i++) tables.push(s.seats||4); });
  const maxJoin = Math.max(1, zone.maxJoin||1);
  const out = new Map();          /* 좌석수 → 조합 예시 */
  const seen = new Set();
  const walk = (start, used, sum) => {
    if(used.length){
      const key = used.join("+");
      if(!out.has(sum) || out.get(sum).length > used.length) out.set(sum, [...used]);
    }
    if(used.length >= maxJoin) return;
    for(let i=start;i<tables.length;i++){
      const sig = used.concat(tables[i]).slice().sort().join(",") + "|" + i;
      if(seen.has(sig)) continue;
      seen.add(sig);
      walk(i+1, [...used, tables[i]], sum + tables[i]);
    }
  };
  walk(0, [], 0);
  return [...out.entries()].sort((a,b)=>a[0]-b[0]);   /* [[좌석수, [조합]], ...] */
}

/* 구역 배치를 그림으로 — 테이블 구성과 만들 수 있는 자리 크기를 함께 보여줍니다 */
function zoneMap(hall){
  const zones = hall.zones || [];
  return `
    <div class="zmap">
      ${zones.map(z=>{
        const tables = [];
        (z.sets||[]).forEach(s=>{ for(let i=0;i<(s.count||0);i++) tables.push(s.seats||4); });
        const maxJoin = Math.max(1, z.maxJoin||1);
        const combos = zoneCombos(z);
        const joined = combos.filter(([n,c])=>c.length>1);
        return `
          <div class="zm-zone">
            <div class="zm-h"><b>${esc(z.name||"구역")}</b>
              <span>테이블 ${tables.length}개 · ${maxJoin>1?`최대 ${maxJoin}개까지 붙임`:"붙이지 않음"}</span></div>
            <div class="zm-tables">
              ${tables.map(s=>`<span class="zm-t">${s}</span>`).join("")
                || `<span class="muted" style="font-size:12px">테이블 없음</span>`}
            </div>
            ${combos.length?`
              <div class="zm-sub">이 구역에서 앉힐 수 있는 인원</div>
              <div class="zm-combos">
                ${combos.map(([n,c])=>`
                  <span class="zm-c ${c.length>1?'join':''}">
                    <b>${n}명</b><i>${c.join(" + ")}</i>
                  </span>`).join("")}
              </div>`:""}
            ${maxJoin>1
              ? `<div class="zm-note">같은 구역이면 <b>어떤 테이블이든</b> ${maxJoin}개까지 붙일 수 있습니다.
                  ${joined.length?`붙여서 만들 수 있는 자리는 ${joined.map(([n])=>n+"명").join(", ")} 입니다.`:""}</div>`
              : `<div class="zm-note">이 구역은 테이블을 붙이지 않습니다. 테이블 하나에 앉는 인원까지만 받습니다.</div>`}
          </div>`;
      }).join("") || `<div class="empty">구역이 없습니다.</div>`}
      <div class="zm-legend">
        네모 안 숫자는 그 테이블의 좌석 수입니다.
        붙임은 <b>같은 구역 안에서만</b> 가능하며, 다른 구역끼리는 붙일 수 없습니다.
      </div>
    </div>`;
}

function sheetSearch(){

      if(okTxt){

      </button>`).join("")
      : `<div class="empty">찾은 예약이 없습니다.</div>`;
  }
  const hintTxt = okNum||okTxt ? "" :
    (q ? `<p class="f-note" style="margin:-6px 0 10px">더 입력하세요 — 한글 2자 이상, 숫자 4자리 이상</p>` : "");

/* ---------- 노쇼 관리 ----------
   따로 저장하지 않고 예약 기록에서 전화번호 기준으로 모읍니다. */
function noshowList(){
  const s = store();
  const excluded = s.settings.noshowExcluded || [];
  const map = new Map();
  s.reservations.filter(r=>r.status==="노쇼" && r.phone).forEach(r=>{
    const key = r.phone.replace(/\D/g,"");
    if(!key || excluded.includes(key)) return;
    if(!map.has(key)) map.set(key, {phone:r.phone, key, name:r.name, count:0, dates:[]});
    const v = map.get(key);
    v.count++; v.dates.push(r.date); v.name = r.name;
  });
  return [...map.values()].sort((a,b)=>b.count-a.count);
}
function noshowOf(phone){
  if(!phone) return null;
  const key = String(phone).replace(/\D/g,"");
  if(!key) return null;
  return noshowList().find(x=>x.key===key) || null;
}

  const list = noshowList();

  const rows = list.length ? list.map(x=>`

  return `

function setBlk(k,v){ view.blkDraft = {...blkDraft(), [k]:v}; render(); }

          <b>${dateLabel(r.date)} ${esc(hm(r.time))}</b> ${esc(r.name)} 손님 ${pplOf(r)}명
          <i>보기 ›</i></button>`).join("")}
        ${hits.length>8?`<div class="bh-more">외 ${hits.length-8}건</div>`:""}

      <button class="btn ghost" onclick="closeSheet()">닫기</button>

    </div>`;
}
/* 입력 중인 기간에 걸리는 확정 예약 (체류 시간까지 봅니다) */
function blockHits(room, d){
  if(!d.from) return [];
  const s = store();
  const to = d.openEnded ? "9999-12-31" : (d.to || d.from);
  return s.reservations.filter(function(r){
    if(r.roomId !== room.id || r.status !== "확정") return false;
    if(r.date < d.from || r.date > to) return false;
    if(d.allDay) return true;
    const rs0 = toMin(r.time), re0 = rs0 + stayOf(r);
    const bs = (r.date === d.from && d.fromTime) ? toMin(d.fromTime) : 0;
    const be = (!d.openEnded && r.date === to && d.toTime) ? toMin(d.toTime) : 24*60;
    return rs0 < be && bs < re0;
  }).sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
}
/* 걸리는 예약으로 바로 이동 — 그 날짜로 옮기고 예약 상세를 엽니다.
   설정에 임시본이 있으면 먼저 반영해야 대시보드가 같은 상태를 보여줍니다. */
async function gotoRes(id){
  const r = store().reservations.find(x=>x.id===id);
  if(!r) return;
  if(view.draft && !await uiConfirm("설정을 저장하고 예약으로 이동할까요?",
      "아직 '적용하기'를 누르지 않은 설정 변경이 있습니다.", {ok:"저장하고 이동"})) return;
  if(view.draft) applySettings(true);
  view.date = r.date;
  view.tab = "dash";
  openMark(id);
}
async function saveBlock(){
  const st = draft();
  const room = st.rooms.find(x=>x.id===view.form.id);
  const d = blkDraft();
  if(!room) return;
  if(!d.from) return uiAlert("시작 날짜를 정해주세요","","warn");
  if(!d.openEnded && d.to && d.to < d.from)
    return uiAlert("종료 날짜가 시작 날짜보다 빠릅니다","","warn");
  if(!d.allDay && d.fromTime && d.toTime && (d.openEnded || (d.to||d.from) === d.from) && d.toTime <= d.fromTime)
    return uiAlert("종료 시각이 시작 시각보다 빠릅니다","","warn");

  const hits = blockHits(room, d);
  if(hits.length){
    const lines = hits.slice(0,6).map(function(r){
      return `· ${dateLabel(r.date)} ${hm(r.time)} ${r.name} 손님 ${pplOf(r)}명`; }).join("\n");
    const ok = await uiConfirm(`${room.name}에 이 기간 예약 ${hits.length}건이 있습니다`,
      `${lines}${hits.length>6?`\n외 ${hits.length-6}건`:""}\n\n` +
      "사용 중지해도 예약은 지워지지 않습니다.\n대신 '경고 예약'으로 남아 확인 필요에 뜹니다.",
      {ok:"그래도 중지", cancel:"취소"});
    if(!ok) return;
  }
  const rec = {
    id:"blk_"+Date.now(),
    from:d.from,
    to:d.openEnded ? "" : (d.to || d.from),
    fromTime:d.allDay ? "" : (d.fromTime||""),
    toTime:d.allDay ? "" : (d.toTime||""),
    openEnded:!!d.openEnded,
    note:(d.note||"").trim()
  };
  st.rooms = st.rooms.map(function(x){
    return x.id===room.id ? {...x, blocks:(x.blocks||[]).concat([rec])} : x; });
  logEvent("좌석 사용 중지", `${room.name} ${rec.from}${rec.to?`~${rec.to}`:"~"}${rec.note?` (${rec.note})`:""}`);
  view.blkDraft = null;
  render();
}
async function delBlock(bid){
  const st = draft();
  const room = st.rooms.find(x=>x.id===view.form.id);
  if(!room) return;
  if(!await uiConfirm2("이 사용 중지 기간을 해제할까요?")) return;
  st.rooms = st.rooms.map(function(x){
    return x.id===room.id ? {...x, blocks:(x.blocks||[]).filter(b=>b.id!==bid)} : x; });
  logEvent("좌석 사용 중지 해제", room.name);
  render();
}
function setOvr(k,v){
  view.ovrDraft = {...(view.ovrDraft||{date:todayStr(),closed:true}), [k]:v};
  render();
}
async function saveOverride(){
  const st = store().settings;
  const d = view.ovrDraft || {date:todayStr(), closed:true};
  if(!d.date) return uiAlert("날짜를 정해주세요","","warn");
  const base = hoursFor(d.date);
  const rec = d.closed
    ? {date:d.date, closed:true, note:d.note||"임시 휴무"}
    : {date:d.date, closed:false, open:d.open||base.open, close:d.close||base.close,
       bs:d.noBreak?"":(d.bs!==undefined?d.bs:base.bs), be:d.noBreak?"":(d.be!==undefined?d.be:base.be),
       lo:d.noLo?"":(d.lo||base.lo), note:d.note||"임시 운영시간"};
  st.overrides = [...(st.overrides||[]).filter(o=>o.date!==d.date), rec];
  logEvent("설정 변경", `임시 일정 ${rec.date} ${rec.closed?"휴무":"시간변경"}`);
  view.ovrDraft = null; saveData(); render();
}
async function delOverride(date){
  if(!await uiConfirm("임시 일정을 삭제할까요?", dateLabel(date), {ok:"삭제"})) return;
  const st = store().settings;
  st.overrides = st.overrides.filter(o=>o.date!==date);
  logEvent("설정 변경", `임시 일정 삭제 ${date}`);
  saveData(); render();
}

/* ============================================================
   예약 등록 마법사 (5단계) — 전화 응대 순서대로 진행
   직원 누구나 화면에 뜬 질문을 그대로 읽으면 되도록 구성
   ============================================================ */
let WZ = null;   /* 진행 중인 예약 입력 상태. null이면 닫힘 */

/* 손님께 그대로 읽어 드리는 말은 큰따옴표로 묶습니다 —
   직원이 화면을 보고 읽을 때 어디까지가 손님께 할 말인지 바로 보이게 */
const WZ_STEPS = [
  "어떤 경로로 들어온 예약인가요?",
  "\u201C예약 원하시는 날짜와 시간 말씀해 주시겠습니까?\u201D",
  "\u201C총 방문 인원수 말씀해 주시겠습니까?\u201D",
  "\u201C원하시는 좌석 있으신가요?\u201D",
  "\u201C식사는 어떻게 준비할까요?\u201D",
  "\u201C예약자 성함과 전화번호 말씀해 주시겠습니까?\u201D",
  "\u201C추가로 요청하실 사항 있으신가요?\u201D"
];
const WZ_LABELS = ["경로","날짜·시간","인원","좌석","메뉴","예약자","요청사항"];
const LAST_STEP = 6;

/* 코스 구성 기본값 — 실제 값은 설정(settings.courseGroups)에서 관리합니다 */
const DEFAULT_COURSE_GROUPS = [
  { label:"저녁 (종일)", items:["오","촉","한","위"],     when:["종일"] },
  { label:"평일 점심",   items:["요리사","동한","서한"],  when:["평일점심"] },
  { label:"주말 점심",   items:["요리사","B","A"],        when:["주말점심"] }
];
const WHEN_OPTS = ["종일","평일점심","평일저녁","주말점심","주말저녁"];
function courseGroups(){ return store().settings.courseGroups || DEFAULT_COURSE_GROUPS; }

function openWizard(date){
  WZ = {
    step:0, source:null, sourceDetail:"",
    calMonth:(date||view.date).slice(0,7),
    date:date||view.date, time:null,
    people:null, infants:0, chairs:0, customPeople:false, phoneNone:false,
    menuType:null, courses:{}, courseOpen:false,
    seat:null,              /* 룸 id | 'hall-any' | 'room-any' | 'any' */
    name:"", phone:"", allergy:"", request:"", memo:"",
    done:null               /* 등록 완료 후 확인 메시지용 */
  };
  render();
}
async function closeWizard(){
  if(WZ && !WZ.done && (WZ.name || WZ.time)){
    if(!await uiConfirm2("입력 중인 예약이 있습니다. 닫을까요?")) return;
  }
  WZ = null; render();
}
async function wzGo(n){
  wzSyncInputs();                       /* 먼저 입력값을 상태로 옮긴 뒤 */
  if(n > WZ.step && !wzCanNext()) return; /* 통과 여부를 검사 */
  /* 마지막 예약 가능 시각을 넘겼는지 확인 */
  if(n===2 && WZ.time){
    const reason = timeBlock(WZ.date, WZ.time);
    if(reason){
      const dh = hoursFor(WZ.date);
      const ok = await uiConfirm(reason,
        `${dateLabel(WZ.date)} ${hm(WZ.time)}\n` +
        (dh.closed ? "" : `영업 ${dh.open} ~ ${dh.close}${dh.bs?` · 브레이크 ${dh.bs} ~ ${dh.be}`:""}${dh.lo?` · 라스트오더 ${dh.lo}`:""}\n`) +
        `\n손님께 안내하신 뒤 진행하세요.`,
        {ok:"안내했습니다", cancel:"시간 다시 고르기"});
      if(!ok) return;
    }
  }
  /* 전화번호 없이 넘어가려 할 때 — 막지는 않되 한 번 되묻습니다.
     번호가 없으면 예약 확인 전화도, 늦으실 때 연락도 못 합니다.
     '해당 없음'을 손이 미끄러져 누른 경우를 여기서 잡아 줍니다. */
  if(n > 5 && WZ.step === 5 && WZ.phoneNone){
    const ok = await uiConfirm("전화번호 없이 접수합니다",
      `${WZ.name || "이 손님"}은 연락처가 없습니다.\n` +
      `예약 확인이나 변경 안내를 드릴 수 없고, 노쇼 이력도 남지 않습니다.\n\n` +
      `현장에서 직접 받으신 예약이라면 그대로 진행하세요.`,
      {ok:"이대로 접수", cancel:"번호 입력하기"});
    if(!ok) return;
  }
  WZ.step = Math.max(0, Math.min(LAST_STEP, n));
  render();
  /* 단계를 옮길 때만 맨 위로 */
  const mid = document.querySelector(".wz-mid");
  if(mid) mid.scrollTop = 0;
}
/* 다음으로 넘어갈 수 있는지 검사 */
function wzCanNext(){
  if(WZ.step===0) return !!WZ.source;
  if(WZ.step===1) return !!(WZ.date && WZ.time);
  if(WZ.step===2) return WZ.people>0;
  if(WZ.step===3) return !!WZ.seat;
  if(WZ.step===4){
    if(!WZ.menuType) return false;
    /* 코스를 골라 놓고 구성을 비운 채 넘어가면 나중에 아무도 안 채웁니다.
       '코스 미정' 을 누르면 통과됩니다. */
    if(WZ.menuType==="코스" && !WZ.courseUndecided && courseCount()===0) return false;
    return true;
  }
  /* 한 글자라도 들어가면 됩니다 — 가명·이니셜·외국 이름도 받습니다 */
  if(WZ.step===5) return WZ.name.trim().length>0 &&
    (WZ.phoneNone || WZ.phone.trim().length>0);
  /* 알러지는 확인했다는 표시가 있어야 넘어갑니다 */
  if(WZ.step===6) return WZ.allergyNone || (WZ.allergy||"").trim().length>0;
  return true;
}
/* 화면을 다시 그리기 전에 입력창 값을 상태로 옮김.
   ※ 예전에는 입력창이 없을 때 g() 가 빈 문자열을 돌려주고, 그 빈 값을 그대로 WZ 에 넣었습니다.
      6단계(요청사항)에는 wz-name 이 없으므로 거기서 이 함수가 불릴 때마다 성함이 지워졌고,
      등록 버튼(wzSubmit)이 맨 먼저 이 함수를 부르는 탓에 매번 "성함을 입력하세요"가 떴습니다.
      이제 화면에 있는 입력창만 옮겨 담습니다. */
function wzSyncInputs(){
  const g=function(id){ const el=document.getElementById(id); return el?el.value:null; };
  const set=function(key,id){ const v=g(id); if(v!==null) WZ[key]=v; };
  set("name","wz-name");
  set("phone","wz-phone");
  set("allergy","wz-allergy");
  set("request","wz-request");
  set("memo","wz-memo");
  set("sourceDetail","wz-src-detail");
}

function renderWizard(){
  if(WZ.done) return wzDone();
  const bodies = [wzStepSource, wzStepDate, wzStepPeople, wzStepSeat, wzStepMenu, wzStepGuest, wzStepExtra];
  const dots = WZ_LABELS.map((l,i)=>
    `<button class="wz-dot ${i===WZ.step?'on':''} ${i<WZ.step?'past':''}" onclick="wzGo(${i})">
       <span class="n">${i+1}</span><span class="l">${l}</span></button>`).join("");
  const canNext = wzCanNext();
  const warn = wzWarnReason();
  const last = WZ.step===LAST_STEP;

  return `
  <div class="wz">
    <header class="wz-top">
      <button class="wz-back" onclick="${WZ.step===0?'closeWizard()':`wzGo(${WZ.step-1})`}">
        ${WZ.step===0?"✕ 닫기":"← 이전"}
      </button>
      <div class="wz-steps">${dots}</div>
      <div class="wz-sum">${wzSummary()}</div>
    </header>
    <div class="wz-mid">
      <div class="wz-q"><h2>${WZ_STEPS[WZ.step]}</h2>
        <div class="wz-warn" id="wz-warn" style="display:${warn?"":"none"}">${
        String(warn||"").split("\n").map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>
      <div class="wz-body">${bodies[WZ.step]()}</div>
    </div>
    <footer class="wz-foot">
      ${last?`<button class="btn ghost lg" onclick="wzSubmit()">건너뛰기 · 바로 등록</button>`:""}
      <button id="wz-next" class="btn primary lg grow ${canNext?'':'off'} ${warn?'warned':''}"
        onclick="${last?'wzSubmit()':`wzGo(${WZ.step+1})`}" ${canNext?"":"disabled"}>
        ${last?"예약 등록하기":(warn?"다음 (확인 필요)":"다음")}
      </button>
    </footer>
  </div>`;
}
/* 이 날짜·시각에 예약을 잡으면 생기는 문제 (없으면 빈 문자열) */
/* 그 시각에 예약하면 생기는 문제를 **전부** 돌려줍니다.
   예전에는 첫 번째 하나만 돌려줘서, 라스트오더와 마감이 같이 걸려도 하나만 보였습니다.
   또 라스트오더는 '이미 넘김'만 알렸는데, 그보다 필요한 건
   "식사 중에 라스트오더가 다가온다"는 사전 안내입니다. */
function timeWarns(date, time){
  const dh = hoursFor(date), out = [];
  if(dh.closed) return [`휴무일입니다 (${dh.note||""})`];
  if(inBreak(date, time)) return [`브레이크타임(${hm(dh.bs)} ~ ${hm(dh.be)})입니다`];
  if(toMin(time) < toMin(dh.open) || toMin(time) >= toMin(dh.close)) return ["영업시간이 아닙니다"];

  const stx = store().settings;
  const lo = lastBookMin(date);
  const loTxt = hm(dh.lo || minToHM(lo));
  const t = toMin(time);
  const end = t + stayMinAt(time);

  if(t > lo) out.push(`라스트오더(${loTxt}) 이후 시각입니다`);
  else {
    /* 임박 기준 분은 설정에서 바꿉니다 (설정 → 운영 판단 기준) */
    const soon = stx.loSoon != null ? stx.loSoon : 120;
    if(lo - t <= soon) out.push(`라스트오더(${loTxt}) 임박 — ${lo - t}분 전 입장입니다`);
  }
  if(dh.bs && t < toMin(dh.bs)){
    if((stx.breakMode||"leave")==="leave"){
      if(end > toMin(dh.bs)) out.push("식사 중 브레이크타임이 시작됩니다");
    }else{
      const buf = stx.breakEntryBuffer != null ? stx.breakEntryBuffer : 60;
      if(t > toMin(dh.bs) - buf) out.push(`브레이크 ${buf}분 전 이후 입장입니다`);
    }
  }
  if(end > toMin(dh.close)) out.push(`식사 시간이 마감(${hm(dh.close)}) 이후까지 이어집니다`);
  return out;
}
function timeWarn(date, time){ return timeWarns(date, time).join("\n"); }
/* 확인 팝업을 띄울 만큼 심각한 것만.
   '라스트오더 임박' 은 저녁 예약이면 거의 매번 걸리므로 화면 표시로만 두고
   여기서는 뺍니다 — 팝업이 자주 뜨면 안 읽고 누르게 됩니다 (설계 5.2 주의). */
function timeBlock(date, time){
  return timeWarns(date, time).filter(function(x){ return x.indexOf("임박") < 0; }).join("\n");
}
/* 시간 칸에 붙는 짧은 말. 여러 개가 걸리면 가장 중한 것 하나만 */
function shortWarn(msg){
  if(msg.indexOf("휴무") >= 0) return "휴무";
  if(msg.indexOf("영업시간") >= 0) return "영업 외";
  if(msg.indexOf("브레이크타임(") >= 0) return "브레이크";
  if(msg.indexOf("이후 시각") >= 0) return "라스트오더 지남";
  if(msg.indexOf("마감") >= 0) return "마감 넘김";
  if(msg.indexOf("라스트오더") >= 0) return "라스트오더 임박";
  if(msg.indexOf("브레이크") >= 0) return "브레이크 임박";
  return "확인";
}

/* 지금 단계에서 걸리는 문제 — 있으면 '다음' 버튼이 빨갛게 바뀝니다 */
/* 걸리는 것을 **전부** 돌려줍니다. 여러 개면 줄바꿈으로 이어 붙습니다 —
   예전에는 첫 번째 하나만 보여서, 겹침과 최소 인원이 같이 걸려도 하나만 알려줬습니다. */
function wzWarnReason(){
  const st = store().settings;
  const out = [];
  if(WZ.step===1 && WZ.time){
    if(WZ.date < todayStr()) out.push("이미 지난 날짜입니다");
    out.push.apply(out, timeWarns(WZ.date, WZ.time));
  }
  if(WZ.step===3 && WZ.seat){
    const room = st.rooms.find(x=>x.id===WZ.seat);
    if(room && room.type==="room"){
      const rs = roomStatus(WZ.date, WZ.time, WZ.seat);
      const who = rs.hits.map(x=>`${hm(x.time)} ${x.name} 손님 ${pplText(x)}`).join(", ");
      if(rs.state==="blocked") out.push(`다른 예약과 1시간 안에 겹칩니다${who?` (${who})`:""}`);
      else if(rs.state==="warn") out.push(`다른 예약과 체류 시간이 겹칩니다${who?` (${who})`:""}`);
      const cnt = seatCountsInfants() ? WZ.people : adultCount(WZ.people, WZ.infants);
      if(cnt > room.capacity) out.push(`${seatLabel(room.id)} 정원 ${room.capacity}명을 넘습니다`);
      if(cnt < roomMin(room)) out.push(`${seatLabel(room.id)} 최소 인원 ${roomMin(room)}명에 못 미칩니다`);
      const bk = blockedAt(room, WZ.date, WZ.time);
      if(bk) out.push(`${seatLabel(room.id)}은 이 시각에 사용 중지입니다${bk.note?` — ${bk.note}`:""}`);
    }
    if(room && room.type==="hall"){
      const h = hallStatus(WZ.date, WZ.time, WZ.seat);
      if(!hallFits(h, WZ.people)) out.push("홀에 남은 자리가 부족합니다");
    }
  }
  if(WZ.step===2 && WZ.people && (WZ.infants||0) >= WZ.people) out.push("성인 없이 유아만 있습니다");
  if(WZ.step===5){
    if(WZ.phoneNone) out.push("전화번호가 입력되지 않았습니다");
    else if(WZ.phone && WZ.phone.replace(/\D/g,"").length < 9)
      out.push("올바른 전화번호가 입력되지 않았습니다");
    const ns = WZ.phone ? noshowOf(WZ.phone) : null;
    if(ns) out.push(`이 번호로 노쇼 ${ns.count}회 기록이 있습니다`);
  }
  if(WZ.step===4){
    const seat = st.rooms.find(x=>x.id===WZ.seat);
    if(seat && seat.type==="room"){
      const adults = adultCount(WZ.people, WZ.infants);
      const n = courseCount();
      if(WZ.menuType==="해당 없음") out.push("룸 예약에 코스 이용 예정 손님이 아닙니다");
      if(WZ.menuType==="확인 필요") out.push("룸 손님 코스 이용 여부가 아직 확인되지 않았습니다");
      if(WZ.menuType==="코스" && !WZ.courseUndecided && n>0 && n<adults)
        out.push(`코스 ${n}인분이 성인 ${adults}명보다 적습니다`);
      if(WZ.menuType==="코스" && !WZ.courseUndecided && n>adults)
        out.push(`코스 ${n}인분이 성인 ${adults}명보다 많습니다`);
    }
  }
  if(WZ.step===6){
    if((WZ.chairs||0) > (WZ.infants||0)) out.push("유아용 의자가 유아 수보다 많습니다");
    if((WZ.chairs||0) < (WZ.infants||0)) out.push("유아용 의자가 유아 수보다 적습니다");
  }
  return out.join("\n");
}

/* 상단에 지금까지 고른 값 요약 */
function wzSummary(){
  const p=[];
  if(WZ.source) p.push(WZ.source==="기타" && WZ.sourceDetail ? WZ.sourceDetail : WZ.source);
  if(WZ.date && WZ.time) p.push(`${(+WZ.date.slice(5,7))}/${(+WZ.date.slice(8))} ${hm(WZ.time)}`);
  if(WZ.people) p.push(`${WZ.people}명${WZ.infants?`(유아${WZ.infants})`:""}`);
  if(WZ.seat) p.push(seatLabel(WZ.seat));
  return p.map(x=>`<span>${esc(x)}</span>`).join("");
}
function hm(t){
  const [h,m]=t.split(":").map(Number);
  const ap = h<12?"오전":"오후";
  const h12 = h%12===0?12:h%12;
  return `${ap} ${h12}시${m?` ${m}분`:""}`;
}
function seatLabel(seat){
  const st = store().settings;
  if(seat==="any") return "좌석 상관없음";
  if(seat==="hall-any") return "홀 중 아무곳";
  if(seat==="room-any") return "룸 중 아무곳";
  const r = st.rooms.find(x=>x.id===seat);
  if(!r) return "미배정";
  /* 룸은 이름 뒤에 '룸'을 붙여 직원이 좌석 종류를 바로 알 수 있게 (홀은 이름에 이미 포함) */
  return r.type==="room" ? `${r.name} 룸` : r.name;
}

/* ---------- 1단계: 날짜 + 시간 ---------- */
function wzStepDate(){
  const s = store(), st = s.settings;
  const [y,m] = WZ.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1), lastDay = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const today = todayStr();

  let cells = "";
  for(let i=0;i<lead;i++) cells += `<span class="bday"></span>`;
  for(let d=1; d<=lastDay; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`;
    const list = s.reservations.filter(r=>r.date===ds && r.status==="확정");
    const dow = new Date(ds+"T00:00:00").getDay();
    const cls = ["bday","btn-day", WZ.date===ds?"sel":"", ds===today?"today":"",
                 ds<today?"past":"", dow===0?"sun":dow===6?"sat":""].join(" ");
    cells += `<button class="${cls}" onclick="wzPickDate('${ds}')">
        <span class="d">${d}</span>
        ${list.length?`<span class="b">${list.length}건</span>`:""}
      </button>`;
  }

  /* 영업시간 안에서 시각 후보 생성 */
  const dh = hoursFor(WZ.date);
  const oh = parseInt(dh.open.split(":")[0]), ch = Math.ceil(toMin(dh.close)/60);
  const hours = [];
  for(let h=oh; h<ch; h++) hours.push(h);
  const curH = WZ.time ? parseInt(WZ.time.split(":")[0]) : null;
  const curM = WZ.time ? parseInt(WZ.time.split(":")[1]) : 0;

  const lastBook = lastBookMin(WZ.date);
  const isToday = WZ.date===todayStr();
  const isPastDate = WZ.date < todayStr();
  const nowM = toMin(nowHM());
  const hourCells = hours.map(h=>{
    const n = s.reservations.filter(r=>r.date===WZ.date && r.status==="확정" && parseInt(r.time)===h).length;
    const late = h*60 > lastBook;
    /* 이 시각을 고르면 경고가 생기는지 미리 확인합니다 */
    const probe = timeWarn(WZ.date, pad(h)+":00");
    /* 지난 시각도 누를 수는 있게 — 예약 누락을 나중에 입력하는 경우가 있습니다 */
    const gone = isPastDate || (isToday && (h+1)*60 <= nowM);
    /* 브레이크타임에 걸리는 시각은 따로 표시 */
    const brk = dh.bs && dh.be && h*60 >= toMin(dh.bs) && h*60 < toMin(dh.be);
    const bad = !!probe;
    return `<button class="hcell ${curH===h?'on':''} ${bad?'late warned':''} ${gone?'gone':''}" onclick="wzPickHour(${h})">
      <span class="ap">${h<12?"오전":"오후"}</span>
      <span class="hh">${h%12===0?12:h%12}시</span>
      ${brk?`<span class="hn rust">브레이크</span>`
           :bad?`<span class="hn rust">${esc(shortWarn(probe))}</span>`
           :gone?`<span class="hn muted2">지난 시간</span>`
           :(n?`<span class="hn">${n}건</span>`:"")}
    </button>`;
  }).join("");

  const minuteRail = curH===null ? "" : `
    <div class="mwrap">
      <div class="mhead"><span class="lbl">분 단위 조절</span><span class="mnow">${hm(WZ.time)}</span></div>
      <div class="mrail" id="mrail">
        <div class="mtrack"></div>
        <div class="mfill" style="width:${(curM/55)*100}%"></div>
        ${[0,5,10,15,20,25,30,35,40,45,50,55].map(v=>
          `<span class="mnotch ${v%10===0?'big':''}" style="left:${(v/55)*100}%"></span>`).join("")}
        <div class="mknob" style="left:${(curM/55)*100}%">${pad(curM)}</div>
        ${[0,10,20,30,40,50].map(v=>
          `<button class="mtick ${curM===v?'on':''}" style="left:${(v/55)*100}%" onclick="wzPickMin(${v})">${pad(v)}</button>`).join("")}
      </div>
      <div class="mfine">
        <button ${curM<=0?"disabled":""} onclick="wzNudge(-5)">− 5분</button>
        <button ${curM>=55?"disabled":""} onclick="wzNudge(5)">＋ 5분</button>
      </div>
    </div>`;

  return `
    <div class="wz-step1">
    <div class="wz-cal">
      <div class="mo-h">
        <button class="nav" onclick="wzMonth(-1)" aria-label="이전 달">◀</button>
        <div class="mo">${y}년 ${m}월</div>
        <button class="nav" onclick="wzMonth(1)" aria-label="다음 달">▶</button>
      </div>
      <div class="bgrid bhead">${["일","월","화","수","목","금","토"].map((x,i)=>`<span class="${i===0?'sun':i===6?'sat':''}">${x}</span>`).join("")}</div>
      <div class="bgrid">${cells}</div>
    </div>
    <div class="wz-time">
      ${dh.closed?`<div class="warnbar">${dateLabel(WZ.date)}은 휴무일입니다 (${esc(dh.note||"")}). 그래도 접수하려면 시간을 선택하세요.</div>`:""}
      ${isPastDate?`<div class="warnbar">이미 지난 날짜입니다 — ${dateLabel(WZ.date)}. 누락된 예약을 입력하는 경우가 아니라면 날짜를 다시 확인하세요.</div>`:""}
      <div class="hours-line">${dh.closed?"휴무":`영업 ${esc(dh.open)} ~ ${esc(dh.close)}${dh.bs?` · 브레이크 ${esc(dh.bs)} ~ ${esc(dh.be)}`:""}${dh.lo?` · 라스트오더 ${esc(dh.lo)}`:""}`}</div>
      <div class="lbl" style="margin-bottom:8px">${WZ.date?dateLabel(WZ.date):"날짜를 먼저 선택하세요"} · 시간 선택</div>
      <div class="hgrid">${hourCells}</div>
      ${minuteRail}
    </div>
    </div>`;
}
function wzPickDate(d){ WZ.date=d; render(); }
function wzMonth(n){
  const [y,m]=WZ.calMonth.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  WZ.calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1);
  render();
}
function wzPickHour(h){
  const cur = WZ.time ? parseInt(WZ.time.split(":")[1]) : 0;
  WZ.time = pad(h)+":"+pad(cur); render();
}
function wzPickMin(m){
  const h = WZ.time ? parseInt(WZ.time.split(":")[0]) : 18;
  WZ.time = pad(h)+":"+pad(m); render();
}
function wzNudge(d){
  if(!WZ.time) return;
  const [h,m]=WZ.time.split(":").map(Number);
  /* 분만 조절 — 시(時)는 위 타일에서 바꾸도록 0~55분으로 묶습니다 */
  const next = Math.min(55, Math.max(0, m + d));
  if(next===m) return;
  WZ.time = pad(h)+":"+pad(next); render();
}
/* 분 레일을 손가락으로 끌어서 조절 */
function wzRefreshNext(){
  const b = document.getElementById("wz-next");
  if(!b) return;
  const ok = wzCanNext();
  b.disabled = !ok;
  b.classList.toggle("off", !ok);
  /* 경고 문구도 함께 갱신 */
  const warn = wzWarnReason();
  b.classList.toggle("warned", !!warn);
  const bar = document.getElementById("wz-warn");
  if(bar){ bar.textContent = warn; bar.style.display = warn ? "" : "none"; }
}
/* 창 크기나 브라우저 배율이 바뀌면 칸 높이도 바뀝니다.
   글자 크기는 CSS 가 알아서 따라가지만, '몇 줄까지 보일지'는 자바스크립트가 정하므로
   여기서 다시 계산해 줍니다. 연달아 들어오는 resize 는 마지막 것만 처리합니다. */
var fitTimer = null;
window.onresize = function(){
  if(fitTimer) clearTimeout(fitTimer);
  fitTimer = setTimeout(function(){ fitTimer = null; if(view.display) fitDisplay(); }, 180);
};
function afterRender(){
  restoreScroll();   /* 다시 그리기 전 스크롤 위치로 되돌립니다 */
  fitDisplay();   /* 디스플레이 모드 글자 크기를 화면에 맞게 키움 */
  /* 타임라인은 좁은 화면에서 가로로 스크롤됩니다 — 현재 시각이 보이도록 맞춰 둡니다 */
  const tls = document.getElementById("tl-scroll");
  if(tls && tls.scrollWidth > tls.clientWidth){
    const line = tls.querySelector(".nowline");
    if(line){
      const x = line.offsetLeft - tls.clientWidth*0.35;
      tls.scrollLeft = Math.max(0, x);
    }
  }
  /* 예약자 이름·전화는 글자를 칠 때마다 상태에 반영해서 '다음' 버튼을 바로 켬 */
  /* 성함·전화 어느 쪽을 먼저 쳐도 '다음' 상태가 바로 갱신되게 합니다.
     자동 포커스는 아직 아무것도 입력하지 않았을 때만 겁니다. */
  const nameEl = document.getElementById("wz-name");
  const phoneEl = document.getElementById("wz-phone");
  if(nameEl){
    nameEl.oninput = ()=>{ WZ.name = nameEl.value; wzRefreshNext(); };
    if(!nameEl.value && !(WZ && WZ.phone)) setTimeout(()=>{
      if(document.activeElement === document.body) nameEl.focus();
    }, 60);
  }
  if(phoneEl){
    phoneEl.oninput = ()=>{ fmtPhone(phoneEl); wzRefreshNext(); };
  }

  const rail = document.getElementById("mrail");
  if(!rail) return;
  const set = (e)=>{
    const r = rail.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    const v = Math.min(55, Math.max(0, Math.round((x/r.width)*55/5)*5));   /* 5분 단위, 0~55분 */
    const h = WZ.time ? parseInt(WZ.time.split(":")[0]) : 18;
    const nt = pad(h)+":"+pad(v);
    if(nt!==WZ.time){ WZ.time = nt; render(); }
  };
  rail.addEventListener("pointerdown", e=>{
    if(e.target.tagName==="BUTTON") return;   /* 눈금 버튼은 따로 처리 */
    rail.setPointerCapture(e.pointerId); set(e);
    const mv = ev=>set(ev);
    const up = ()=>{ rail.removeEventListener("pointermove",mv); rail.removeEventListener("pointerup",up); };
    rail.addEventListener("pointermove",mv); rail.addEventListener("pointerup",up);
  });
}

function wzPeople(n){

function wzCustom(){ WZ.customPeople=true; if(!WZ.people) WZ.people=7; render(); }
function wzAdj(k,d){
  /* 막지 않습니다 — 이상한 값은 빨갛게 보여 주고 사장이 판단합니다 */

/* ---------- 3단계: 좌석 ---------- */
function wzStepSeat(){
  const s=store(), st=s.settings;
  const total = WZ.people||0;
  const adults = adultCount(total, WZ.infants);
  const need = tablesFor(total);

  /* 홀 — 테이블 단위 가동률 */
  const hallCell = (r)=>{
    const h = hallStatus(WZ.date, WZ.time, r.id);
    const fits = hallFits(h, total);
    const plan = hallPlan(h, total);
    const pct = h.total ? Math.round((h.used+h.tentUsed)/h.total*100) : 0;
    const blocked = blockedAt(r, WZ.date, WZ.time);
    return `<button class="scell hall ${WZ.seat===r.id?'on':''} ${(fits&&!blocked)?'':'full warned'}" onclick="wzSeat('${r.id}')">
      <span class="sn">${esc(r.name)}${blocked?` <span class="sb rust">사용 중지</span>`:""}</span>
      <span class="gauge"><i style="width:${Math.min(100,pct)}%"></i></span>
      <span class="sc">${h.total}테이블 중 <b>${h.used+h.tentUsed}</b> 사용 · 남은 ${h.left}</span>
      <span class="sc2">${plan?`${total}명 → ${plan}`:`${total}명 앉힐 자리 없음`}</span>
      ${!fits?`<span class="sb rust">자리 부족</span>`:""}
    </button>`;
  };

  /* 룸 — 이용 가능 / 이용 불가만 표시, 상세는 눌렀을 때 */
  const roomCell = (r)=>{
    const rs = roomStatus(WZ.date, WZ.time, r.id);
    const over = total > r.capacity, under = adults < roomMin(r);
    const label = rs.state==="free" ? (over?"인원 초과":under?"인원 부족":"이용 가능") : "이용 불가";
    const cls = rs.state!=="free" ? rs.state : (over||under ? "warn" : "free");
    const mv = rs.movable && rs.movable.length;
    const blocked = blockedAt(r, WZ.date, WZ.time);
    /* 인원 초과·부족도 '고르면 경고가 뜨는 자리'이므로 이용 불가와 같은 흐린 모양으로 둡니다.
       색(경고/사용중지)은 그대로 두어 왜 흐린지는 구분됩니다. */
    const bad = blocked || rs.state!=="free" || over || under;
    return `<button class="scell ${WZ.seat===r.id?'on':''} ${bad?'warned':''} ${bad?'busy':''}" onclick="wzSeat('${r.id}')">
      <span class="sn">${esc(r.name)}</span>
      <span class="sc">${roomMin(r)}인~${r.capacity}인</span>
      <span class="avail ${blocked?'blocked':cls}">${blocked?"사용 중지":label}</span>
      ${mv?`<span class="movable">미정 ${mv}건 이동 가능</span>`:""}
    </button>`;
  };

  const halls = st.rooms.filter(r=>r.type==="hall");
  const rooms = st.rooms.filter(r=>r.type==="room");

  return `
    <div class="seat-note">
      ${WZ.time?(()=>{
        const lunch = toMin(WZ.time) < toMin(st.lunchUntil||"16:00");

/* 좌석 선택 — 막을 것은 막고, 판단이 필요한 것은 물어봅니다 */
async function wzSeat(v){
  const st = store().settings;
  const people = WZ.people||0;

  if(!["any","hall-any","room-any"].includes(v)){
    const room = st.rooms.find(x=>x.id===v);
    if(!room) return;

    const bk = blockedAt(room, WZ.date, WZ.time);
    if(bk){
      const ok = await uiConfirm(`${room.name}은 이 시각에 사용 중지입니다`,
        `${dateLabel(WZ.date)} ${spanLabel(bk)}${bk.note?`\n사유: ${bk.note}`:""}\n\n그래도 이 자리로 배정할까요?`,
        {ok:"그래도 배정", cancel:"다시 고르기"});
      if(!ok) return;
    }

    if(room.type==="room"){
      const rs = roomStatus(WZ.date, WZ.time, v);
      /* 1) 확정 예약과 1시간 미만 → 강하게 경고하되 막지는 않습니다 (설계 5.2).
            취소를 깜빡한 예약이 남아 있는 경우가 실제로 있어, 판단은 사장님 몫입니다. */
      if(rs.state==="blocked"){
        const lines = rs.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)}`).join("\n");
        const ok = await uiConfirm(`${room.name} 룸에 1시간 안에 확정 예약이 있습니다`,
          `${lines}`,
          {ok:"그래도 배정", cancel:"다시 고르기"});
        if(!ok) return;
      }
      /* 2) 체류시간 겹침 / 잠정 배정 → 확인 */
      if(rs.state==="warn"){
        const a = rs.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)}`);
        const b = rs.tentative.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)} (좌석 미정 · 잠정 배정)`);
        if(!await uiConfirm2(`${room.name} 룸에 겹치는 예약이 있습니다.\n\n${[...a,...b].join("\n")}\n\n그래도 이 룸으로 배정할까요?`)) return;
      }
      /* 3) 정원 초과 */
      if(people > room.capacity){
        if(!await uiConfirm2(`${room.name} 룸은 최대 ${room.capacity}명입니다. 지금 ${people}명입니다.\n간이 의자 등으로 감당 가능한 경우에만 배정하세요.\n\n그래도 배정할까요?`)) return;
      }
      /* 4) 최소 인원 미달 (설정에 따라 성인 기준) */
      else {
        const adults = adultCount(people, WZ.infants);
        if(adults < roomMin(room)){
          const basis = store().settings.minCountAdultsOnly===false ? "총 인원" : "성인";
          const ok = await uiConfirm(`${room.name} 룸 최소 인원 미달`,
            `이 방은 최소 ${roomMin(room)}명부터 받습니다.\n지금 ${basis} ${adults}명입니다${WZ.infants?` (유아 ${WZ.infants}명 제외)`:""}.`,
            {ok:"그래도 배정", cancel:"다시 고르기"});
          if(!ok) return;
        }
      }
    }

    if(room.type==="hall"){
      const h = hallStatus(WZ.date, WZ.time, v);
      const need = tablesFor(people);
      if(!hallFits(h, people)){
        const a = h.hits.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)} (테이블 ${tablesFor(pplOf(r))})`);
        const b = h.tentative.map(r=>`· ${hm(r.time)} ${r.name} 손님 ${pplText(r)} (좌석 미정 · 잠정)`);
        const why = `남은 테이블 ${h.left}개로는 ${people}명을 앉힐 수 없습니다.`;
        if(!await uiConfirm2(`${room.name} — ${why}\n\n${[...a,...b].join("\n")}\n\n그래도 이 홀로 배정할까요?`)) return;
      }
    }
  }else{
    /* 좌석 미정 — 잠정 배정 가능 여부를 먼저 확인 */
    const sug = suggestSeat(WZ.date, WZ.time, people, v);
    if(!sug){
      if(!await uiConfirm2(`지금 ${hm(WZ.time)} 기준으로 ${people}명이 들어갈 빈 자리가 없습니다.\n먼저 접수한 좌석 미정 예약까지 계산한 결과입니다.\n\n그래도 예약을 받을까요? (좌석은 나중에 조정해야 합니다)`)) return;
    }
    WZ.tentative = sug;
  }
  WZ.seat = v; render();
}

/* 인자 없이 부르면 토글, false 를 주면 해제만 (입력칸을 누르면 자동 해제) */
function wzPhoneNone(v){

  WZ.phoneNone = next;
  if(next) WZ.phone = "";

}
/* 숫자만 남기고 010-0000-0000 형태로 자동 정리 */
/* 010 으로 시작할 때만 자동으로 - 를 넣습니다.
   직접 - 를 치는 분도 있어서, 사용자가 넣은 자리를 시스템이 다시 옮기면 오히려 방해가 됩니다.
   그래서 이미 - 가 들어 있으면 손대지 않습니다. */
function fmtPhone(el){
  const raw = el.value;
  if(raw.indexOf("-") >= 0){ WZ.phone = raw; return; }
  const d = raw.replace(/\D/g,"").slice(0,11);
  let out = d;
  if(d.indexOf("010") === 0){
    if(d.length>3 && d.length<8) out = d.slice(0,3)+"-"+d.slice(3);
    else if(d.length>=8) out = d.slice(0,3)+"-"+d.slice(3,d.length-4)+"-"+d.slice(d.length-4);
  }
  el.value = out; WZ.phone = out;
}

/* 코스 선택 팝업은 마법사(WZ)와 예약 수정 시트(tmpRes) 두 곳에서 씁니다.
   어느 쪽 값을 고치는지 여기서 한 번만 정해 둡니다 — 함수를 두 벌 만들지 않으려고. */
function cTgt(){ return WZ ? WZ : tmpRes; }
/* 시트에서 쓸 때는 화면을 다시 그리기 전에 입력창 값을 옮겨 담아야 타이핑이 날아가지 않습니다 */
function cSync(){ if(!WZ && tmpRes) syncRes(); }
function courseCount(){
  const t = cTgt();
  return t ? Object.values(t.courses||{}).reduce((a,b)=>a+b,0) : 0;
}
function courseSummary(courses){
  const items = Object.entries(courses||{}).filter(([k,v])=>v>0)
    .map(([k,v])=>`${k.split("|")[1]}${v>1?`×${v}`:""}`);
  return items.join(", ");
}
function wzStepMenu(){
  const st = store().settings;
  const seat = st.rooms.find(x=>x.id===WZ.seat);
  const isHall = seat ? seat.type==="hall" : (WZ.seat==="hall-any");
  /* 홀은 보통 메뉴를 정하지 않고 받습니다 — 선택지를 줄입니다 */
  const opts = isHall
    ? [["코스","코스","코스 구성을 선택합니다"],
       ["해당 없음","해당 없음","일반 주문"]]
    : [["코스","코스","코스 구성을 선택합니다"],
       ["코스 상당","코스 상당 식사","코스에 준하는 주문"],
       ["확인 필요","확인 필요","코스 이용 여부 확인 필요"],
       ["해당 없음","해당 없음","일반 주문"]];
  const n = courseCount();
  const adults = adultCount(WZ.people, WZ.infants);
  const isRoom = seat && seat.type==="room";
  /* 룸은 코스 주문을 전제로 받는 자리입니다 */
  const roomWarn = isRoom && (
    WZ.menuType==="해당 없음" ? "룸 예약에 코스 이용 예정 손님이 아닙니다" :
    WZ.menuType==="확인 필요" ? "" :
    (WZ.menuType==="코스" && !WZ.courseUndecided && n>0 && n<adults)
      ? `코스 ${n}인분 · 성인 ${adults}명보다 적습니다` : "");
  return `
    ${roomWarn?`<div class="menu-warn">${esc(roomWarn)}</div>`:""}
    <div class="srcgrid menu4 ${opts.length===2?'menu2':''}">
      ${opts.map(([v,label,desc])=>`
        <button class="srccell ${WZ.menuType===v?'on':''} ${WZ.menuType===v&&roomWarn?'warned':''}" onclick="wzMenu('${v}')">
          <span class="s-l">${label}</span>
          <span class="s-d">${desc}</span>
          ${v==="코스"&&n?`<span class="s-n">${n}</span>`:""}
        </button>`).join("")}
    </div>
    ${WZ.menuType==="코스"?`
      <div class="course-sum">
        ${WZ.courseUndecided ? "코스 미정 — 방문 전 확정" : (n?`선택: ${esc(courseSummary(WZ.courses))}`:"코스 구성을 선택하세요")}
        <button class="btn sm" style="margin-left:auto" onclick="openCourse()">${n||WZ.courseUndecided?"수정":"선택"}</button>
      </div>`:""}
    ${WZ.courseOpen?renderCourse():""}`;
}
function wzMenu(v){
  WZ.menuType = v;
  if(v==="코스"){ WZ.courseOpen = true; }
  else { WZ.courses = {}; WZ.courseOpen = false; }
  render();
}
function openCourse(){ cSync(); const t=cTgt(); if(t) t.courseOpen = true; render(); }
function closeCourse(){ cSync(); const t=cTgt(); if(t) t.courseOpen = false; render(); }
function bumpCourse(key){
  cSync(); const t=cTgt(); if(!t) return;
  t.courses = {...t.courses, [key]:((t.courses||{})[key]||0)+1};
  render();
}
function resetCourse(){ cSync(); const t=cTgt(); if(!t) return; t.courses = {}; t.courseUndecided = false; render(); }
function toggleUndecided(){
  cSync(); const t=cTgt(); if(!t) return;
  t.courseUndecided = !t.courseUndecided;
  if(t.courseUndecided) t.courses = {};
  render();
}
function renderCourse(){
  const gs = courseGroups();
  const stx = store().settings;
  const W = cTgt();
  const lunch = W.time && toMin(W.time) < toMin(stx.lunchUntil||"16:00");
  const dow = W.date ? new Date(W.date+"T00:00:00").getDay() : 0;
  /* 공휴일을 주말로 볼지는 설정에서 정합니다 */
  const weekend = dow===0 || dow===6 || (stx.holidayAsWeekend!==false && isHoliday(W.date));
  const fits = (g)=>{
    const w = g.when||[];
    if(!w.length || w.includes("종일")) return true;
    const key = (weekend?"주말":"평일") + (lunch?"점심":"저녁");
    return w.includes(key);
  };
  const rows = gs.map((g,gi)=>`
    <div class="cgroup ${fits(g)?'':'off'}">
      <div class="cg-label">${esc(g.label)}${fits(g)?'':''}</div>
      <div class="cg-items">
        ${g.items.map(name=>{
          const key = `${gi}|${name}`;
          const c = (W.courses||{})[key]||0;
          const off = !fits(g);
          return `<button class="citem ${c?'on':''} ${off&&c?'warned':''}" onclick="bumpCourse('${key}')">
            ${esc(name)}${c?`<i class="cnum">${c}</i>`:""}</button>`;
        }).join("")}
      </div>
    </div>`).join("");
  return `
    <div class="overlay" onclick="closeCourse()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-h"><h2>코스 선택</h2>
          <button class="x" onclick="closeCourse()" aria-label="닫기">×</button></div>
                ${rows}
        <button class="undecided ${W.courseUndecided?'on':''}" onclick="toggleUndecided()">
          코스 미정 — 코스는 이용하지만 아직 정하지 못함
        </button>
        ${(()=>{
          const n = courseCount(), ad = adultCount(W.people, W.infants);
          const short = n>0 && n<ad, over = n>ad;
          return `<div class="course-total ${short||over?'bad':''}">선택 합계 <b>${n}</b>명
            ${W.people?` / 성인 ${ad}명${W.infants?` (유아 ${W.infants}명)`:""}`:""}
            ${short?`<div class="ct-warn">성인 ${ad}명보다 ${ad-n}명 적습니다</div>`:""}
            ${over?`<div class="ct-warn">성인 ${ad}명보다 ${n-ad}명 많습니다</div>`:""}</div>`;
        })()}
        <div class="sheet-actions">
          <button class="btn danger" onclick="resetCourse()">초기화</button>
          <button class="btn primary" onclick="closeCourse()">완료</button>
        </div>
      </div>
    </div>`;
}

async function wzSubmit(){
  wzSyncInputs();
  if(!WZ.date || !WZ.time) return await uiAlert2("날짜와 시간을 선택하세요.");
  if(!WZ.people) return await uiAlert2("인원을 선택하세요.");
  if(!WZ.name.trim()) return await uiAlert2("예약자 성함을 입력하세요.");
  const s = store();
  /* 같은 번호로 같은 날 이미 예약이 있으면 확인 */
  if(WZ.phone){
    const dup = s.reservations.filter(r=>r.date===WZ.date && r.status==="확정" &&
      (r.phone||"").replace(/\D/g,"") === WZ.phone.replace(/\D/g,""));
    if(dup.length){
      const ok = await uiConfirm("같은 번호로 이미 예약이 있습니다",
        dup.map(r=>`${hm(r.time)} ${r.name} 손님 ${pplText(r)}`).join("\n") +
        "\n\n같은 팀이라면 기존 예약을 수정하는 편이 좋습니다.",
        {ok:"새로 등록", cancel:"취소"});
      if(!ok) return;
    }
  }
  /* 노쇼 이력이 있으면 확정 전에 확인 */
  const ns = noshowOf(WZ.phone);
  if(ns && !await uiConfirm2(
      `이 번호로 노쇼 기록이 ${ns.count}건 있습니다.\n` +
      `(${ns.dates.slice(0,3).map(d=>d.slice(5).replace("-","월 ")+"일").join(", ")}${ns.dates.length>3?" 외":""})\n\n` +
      `예약을 확정할까요?`)) return;
  const isRoom = WZ.seat && !["any","hall-any","room-any"].includes(WZ.seat);
  const rec = {
    id:"res_"+Date.now(), date:WZ.date, time:WZ.time,
    name:WZ.name.trim(), phone:WZ.phone.trim(),
    people:WZ.people, infants:WZ.infants, chairs:WZ.chairs||0,
    roomId: isRoom ? WZ.seat : null,
    seatPref: isRoom ? null : WZ.seat,     /* 미배정일 때 희망 좌석 종류를 기억 */
    tentativeRoomId: isRoom ? null : (WZ.tentative || null),  /* 나중에 확정할 때 1순위로 뜨는 자리 */
    source:WZ.source||"전화 예약",
    sourceDetail:WZ.source==="기타" ? (WZ.sourceDetail||"").trim() : "",
    createdAt:new Date().toISOString(),
    menuType:WZ.menuType||"해당 없음", courses:{...(WZ.courses||{})},
    courseUndecided: !!WZ.courseUndecided,
    allergy:WZ.allergyNone?"":WZ.allergy.trim(), allergyChecked:true, request:WZ.request.trim(),
    memo:(WZ.memo||"").trim(),
    status:"확정"
  };
  addChange(rec, "등록", []);
  /* 접수 문자 — 등록 즉시 1회 (지금은 흉내) */
  if(smsCfg().on && rec.phone) smsSend(rec, "접수");
  s.reservations.push(rec);
  logEvent("예약 등록", `${rec.date} ${rec.time} ${rec.name} ${pplOf(rec)}명 ${rec.roomId?seatLabel(rec.roomId):(rec.tentativeRoomId?"잠정 "+seatLabel(rec.tentativeRoomId):"미배정")} 경로:${rec.source}${rec.sourceDetail?"/"+rec.sourceDetail:""}`);
  reflowTentatives(rec.date);
  view.date = rec.date; view.tab = "res"; view.calMonth = rec.date.slice(0,7);
  WZ.done = rec;
  saveData(); render();
}
