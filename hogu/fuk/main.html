<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호구는 못말려 🎬</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Han+Sans&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ===== 기본 리셋 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            background: #1A1A1A;
            position: relative;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
            font-family: 'Jua', sans-serif;
        }

        /* ============================================
           플립 카드 (3D 뒤집기 컨테이너)
           ============================================ */
        .flip-scene {
            width: 100%;
            height: 100vh;
            perspective: 1500px;
            position: relative;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            /* 부드럽지만 살짝 탄력 있는 곡선 */
            transition: transform 0.9s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
        }

        .flip-card.flipped {
            transform: rotateY(180deg);
        }

        .flip-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        .flip-back {
            transform: rotateY(180deg);
        }

        /* ============================================
           앞면: 영화 포스터
           ============================================ */
        .poster-img {
            width: 100%;
            height: 100%;
            /* contain으로 포스터 전체 보이게 (잘림 방지) */
            object-fit: contain;
            display: block;
            background: #1A1A1A;
        }

        /* 탭 안내 배지 (포스터 하단에 깜빡임) */
        .tap-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.88);
            color: #FFD700;
            padding: 10px 20px;
            border: 2px solid #FFD700;
            border-radius: 30px;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            z-index: 5;
            animation: tap-pulse 1.5s ease-in-out infinite;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 깜빡이며 커지는 파동 효과 */
        @keyframes tap-pulse {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.6);
            }
            50% {
                transform: translateX(-50%) scale(1.08);
                box-shadow: 0 0 0 14px rgba(255, 215, 0, 0);
            }
        }

        .tap-hint .finger {
            font-size: 16px;
            animation: tap-finger 1s ease-in-out infinite;
        }

        @keyframes tap-finger {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-3px); }
        }

        /* ============================================
           뒷면: 만화 페이지 (메뉴)
           ============================================ */
        .flip-back {
            background:
                radial-gradient(circle at center, #FFE066 0%, #F4B942 60%, #E68A20 100%);
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
        }

        /* 액션 라인 (방사선 패턴 - 만화 효과) */
        .flip-back::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(
                from 0deg at 50% 50%,
                rgba(255, 255, 255, 0.18) 0deg 2deg,
                transparent 2deg 8deg
            );
            pointer-events: none;
            z-index: 0;
        }

        /* 만화 점박이 (도트 패턴) */
        .flip-back::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(
                circle,
                rgba(0, 0, 0, 0.18) 1.5px,
                transparent 2px);
            background-size: 12px 12px;
            pointer-events: none;
            opacity: 0.35;
            z-index: 0;
        }

        /* ===== 영화 제목 띠 (상단) ===== */
        .movie-title-bar {
            background: linear-gradient(180deg, #E74C3C 0%, #C0392B 100%);
            color: #FFD700;
            padding: 10px 14px;
            border: 3px solid #1A1A1A;
            box-shadow:
                4px 4px 0 #1A1A1A,
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 19px;
            letter-spacing: 3px;
            transform: rotate(-1.5deg);
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 0 #1A1A1A;
        }

        .movie-title-bar .small {
            font-family: 'Bangers', cursive;
            font-size: 11px;
            letter-spacing: 3px;
            display: block;
            color: #fff;
            margin-bottom: 2px;
            text-shadow: 1px 1px 0 #1A1A1A;
        }

        /* ===== 만화 컷 그리드 (2x3) ===== */
        .comic-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        /* 만화 패널 (각 메뉴 카드) */
        .panel {
            background: #fff;
            border: 4px solid #1A1A1A;
            box-shadow: 4px 4px 0 #1A1A1A;
            text-decoration: none;
            color: #1A1A1A;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s;
            padding: 8px 6px;
        }

        /* 누를 때 도장 찍히는 느낌 */
        .panel:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 #1A1A1A;
        }

        /* 패널별 컬러 배경 + 살짝 기울어진 각도 (만화 컷 느낌) */
        .panel-1 { background: #FFE066; transform: rotate(-1.5deg); }
        .panel-2 { background: #5DADE2; transform: rotate(1.5deg); }
        .panel-3 { background: #FF8FAB; transform: rotate(-1deg); }
        .panel-4 { background: #FF6B5B; transform: rotate(1deg); }
        .panel-5 { background: #82E0AA; transform: rotate(-1.5deg); }
        .panel-6 { background: #F8B739; transform: rotate(1.5deg); }

        /* 패널 누를 때는 회전 풀고 도장 효과만 */
        .panel-1:active { transform: rotate(-1.5deg) translate(3px, 3px); }
        .panel-2:active { transform: rotate(1.5deg) translate(3px, 3px); }
        .panel-3:active { transform: rotate(-1deg) translate(3px, 3px); }
        .panel-4:active { transform: rotate(1deg) translate(3px, 3px); }
        .panel-5:active { transform: rotate(-1.5deg) translate(3px, 3px); }
        .panel-6:active { transform: rotate(1.5deg) translate(3px, 3px); }

        /* 패널 내 액션 라인 (각 패널마다 각도 다르게) */
        .panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(
                from var(--angle, 0deg) at 50% 50%,
                rgba(255, 255, 255, 0.35) 0deg 3deg,
                transparent 3deg 12deg);
            opacity: 0.5;
            pointer-events: none;
        }

        .panel-1 { --angle: 0deg; }
        .panel-2 { --angle: 30deg; }
        .panel-3 { --angle: 60deg; }
        .panel-4 { --angle: 90deg; }
        .panel-5 { --angle: 120deg; }
        .panel-6 { --angle: 150deg; }

        .panel-icon {
            font-size: 32px;
            margin-bottom: 4px;
            line-height: 1;
            position: relative;
            z-index: 2;
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.3));
        }

        .panel-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 16px;
            color: #1A1A1A;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.6);
            line-height: 1;
            margin-bottom: 3px;
        }

        .panel-en {
            font-family: 'Bangers', cursive;
            font-size: 12px;
            color: #1A1A1A;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            opacity: 0.75;
            line-height: 1;
        }

        /* 패널 모서리 효과음 (BANG!, POW! 등) */
        .sfx {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #1A1A1A;
            color: #FFD700;
            font-family: 'Bangers', cursive;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 1px;
            transform: rotate(8deg);
            z-index: 3;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
        }

        /* ===== 포스터로 돌아가기 버튼 ===== */
        .back-to-poster {
            background: #1A1A1A;
            color: #FFD700;
            border: 3px solid #FFD700;
            padding: 9px 22px;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 12px;
            align-self: center;
            position: relative;
            z-index: 3;
            cursor: pointer;
            box-shadow: 3px 3px 0 #1A1A1A;
            transition: all 0.15s;
        }

        .back-to-poster:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #1A1A1A;
        }
    </style>
</head>
<body>

    <!-- ============================================
         플립 카드 컨테이너
         ============================================ -->
    <div class="flip-scene">
        <div class="flip-card" id="flipCard">

            <!-- ===== 앞면: 영화 포스터 ===== -->
            <div class="flip-face flip-front">
                <img src="poster.png" alt="호구는 못말려 - 온천! 부글부글 대작전" class="poster-img">

                <!-- 탭 안내 (깜빡이는 배지) -->
                <div class="tap-hint">
                    <span class="finger">👆</span>
                    탭하면 메뉴
                </div>
            </div>

            <!-- ===== 뒷면: 만화 페이지 메뉴 ===== -->
            <div class="flip-face flip-back">

                <!-- 영화 제목 띠 -->
                <div class="movie-title-bar">
                    <span class="small">EPISODE MENU</span>
                    호구는 못말려
                </div>

                <!-- 만화 컷 6개 (메뉴) -->
                <div class="comic-panels">

                    <!-- 일정표 (노랑) -->
                    <a href="schedule.html" class="panel panel-1" onclick="event.stopPropagation()">
                        <span class="sfx">BANG!</span>
                        <span class="panel-icon">📅</span>
                        <div class="panel-title">일정표</div>
                        <div class="panel-en">SCENARIO</div>
                    </a>

                    <!-- 항공 (파랑) -->
                    <a href="flight.html" class="panel panel-2" onclick="event.stopPropagation()">
                        <span class="sfx">WHOOSH</span>
                        <span class="panel-icon">✈️</span>
                        <div class="panel-title">항공</div>
                        <div class="panel-en">TAKE OFF</div>
                    </a>

                    <!-- 숙소 (분홍) -->
                    <a href="stay.html" class="panel panel-3" onclick="event.stopPropagation()">
                        <span class="sfx">ZZZ!</span>
                        <span class="panel-icon">🏨</span>
                        <div class="panel-title">숙소</div>
                        <div class="panel-en">BASE CAMP</div>
                    </a>

                    <!-- 맛집 (빨강) -->
                    <a href="food.html" class="panel panel-4" onclick="event.stopPropagation()">
                        <span class="sfx">YUM!</span>
                        <span class="panel-icon">🍜</span>
                        <div class="panel-title">맛집</div>
                        <div class="panel-en">EAT SCENE</div>
                    </a>

                    <!-- 준비물 (녹색) -->
                    <a href="checklist.html" class="panel panel-5" onclick="event.stopPropagation()">
                        <span class="sfx">POW!</span>
                        <span class="panel-icon">🎒</span>
                        <div class="panel-title">준비물</div>
                        <div class="panel-en">GEAR</div>
                    </a>

                    <!-- 예산 (주황) -->
                    <a href="budget.html" class="panel panel-6" onclick="event.stopPropagation()">
                        <span class="sfx">CASH!</span>
                        <span class="panel-icon">💴</span>
                        <div class="panel-title">예산</div>
                        <div class="panel-en">BUDGET</div>
                    </a>

                </div>

                <!-- 포스터로 돌아가기 -->
                <button class="back-to-poster" onclick="event.stopPropagation(); document.getElementById('flipCard').classList.remove('flipped');">
                    ◁ 포스터로
                </button>

            </div>

        </div>
    </div>

    <!-- ===== 플립 토글 스크립트 ===== -->
    <script>
        // 카드 전체 클릭 시 뒤집기 (단, 메뉴 카드/버튼 클릭은 stopPropagation으로 제외됨)
        document.getElementById('flipCard').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });
    </script>

</body>
</html>
