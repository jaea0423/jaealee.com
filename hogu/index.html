<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공사중 🚧</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ===== 기본 리셋 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;       /* 화면 전체 높이 고정 */
            overflow: hidden;    /* 스크롤 방지 */
        }

        body {
            font-family: 'Black Han Sans', sans-serif;
            background: #FFD93D;    /* 공사장 노랑 */
            position: relative;
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* ===== 위/아래 공사장 줄무늬 (노랑+검정 사선) ===== */
        body::before,
        body::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 48px;
            background: repeating-linear-gradient(
                45deg,
                #FFD93D 0px,
                #FFD93D 22px,
                #1A1A1A 22px,
                #1A1A1A 44px
            );
            z-index: 1;
        }
        body::before { top: 0; }
        body::after  { bottom: 0; }

        /* ===== 공사중 팻말 (흰 보드) ===== */
        .sign {
            background: #fff;
            border: 4px solid #1A1A1A;
            padding: 32px 26px 28px;
            margin: 0 26px;
            text-align: center;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.35);
            transform: rotate(-2deg);
            animation: wobble 4s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        /* 팻말 좌우로 살짝 흔들림 */
        @keyframes wobble {
            0%, 100% { transform: rotate(-2deg); }
            50%      { transform: rotate(2deg); }
        }

        /* 팻말 위 빨간 테이프 */
        .sign-tape {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            background: #E74C3C;
            color: #fff;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 11px;
            padding: 4px 16px;
            letter-spacing: 3px;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        /* 공사 이모지 (튀어오르는 애니메이션) */
        .sign-icon {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 12px;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        .sign-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 46px;
            color: #1A1A1A;
            letter-spacing: 6px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .sign-divider {
            width: 50px;
            height: 3px;
            background: #1A1A1A;
            margin: 14px auto 12px;
        }

        .sign-sub {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }

        .sign-sub .small {
            font-size: 12px;
            color: #888;
            display: block;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- 공사중 팻말 -->
    <div class="sign">
        <!-- 위쪽 빨간 테이프 -->
        <div class="sign-tape">UNDER CONSTRUCTION</div>

        <!-- 공사 이모지 -->
        <div class="sign-icon">🚧</div>

        <!-- "공사중" 큰 글씨 -->
        <div class="sign-title">공사중</div>
        <div class="sign-divider"></div>

        <!-- 설명 -->
        <div class="sign-sub">
            아직 준비 중이에요<br>
            조금만 기다려주세요
            <span class="small">- 작업자 -</span>
        </div>
    </div>

</body>
</html>
