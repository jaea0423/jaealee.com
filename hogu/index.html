<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호구 넷의 제주 투어 🌊✨</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">

    <style>
        /* ===== 기본 리셋 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;       /* 화면 전체 높이 고정 */
            overflow: hidden;    /* 스크롤 방지 */
        }

        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg,
                #FF6B9D 0%, #FFB347 15%, #FFD93D 30%,
                #6EE7B7 45%, #00C9D7 60%, #87CEEB 75%, #A78BFA 100%);
            background-size: 400% 400%;
            animation: rainbowMove 8s ease infinite;
            position: relative;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column; /* 세로로 쌓되, 자식이 화면 다 채움 */
        }

        @keyframes rainbowMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 반짝이 별가루 ===== */
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
            animation: twinkle 2s infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50%      { opacity: 1; transform: scale(1); }
        }

        .sparkle:nth-child(1)  { top: 5%;  left: 15%; animation-delay: 0s; }
        .sparkle:nth-child(2)  { top: 12%; left: 80%; animation-delay: 0.3s; }
        .sparkle:nth-child(3)  { top: 25%; left: 25%; animation-delay: 0.6s; }
        .sparkle:nth-child(4)  { top: 35%; left: 90%; animation-delay: 0.9s; }
        .sparkle:nth-child(5)  { top: 45%; left: 8%;  animation-delay: 1.2s; }
        .sparkle:nth-child(6)  { top: 18%; left: 50%; animation-delay: 1.4s; }
        .sparkle:nth-child(7)  { top: 30%; left: 60%; animation-delay: 0.2s; }
        .sparkle:nth-child(8)  { top: 8%;  left: 60%; animation-delay: 0.5s; }
        .sparkle:nth-child(9)  { top: 40%; left: 40%; animation-delay: 0.8s; }
        .sparkle:nth-child(10) { top: 22%; left: 5%;  animation-delay: 1.1s; }

        /* ===== 둥둥 떠다니는 이모지 (헤더 영역에만 배치) ===== */
        .deco {
            position: absolute;
            opacity: 0.7;
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        .deco:nth-child(11) { top: 6%;  left: 6%;  animation-delay: 0s;   font-size: 34px; }
        .deco:nth-child(12) { top: 10%; right: 18%; animation-delay: 1s;   font-size: 26px; }
        .deco:nth-child(13) { top: 38%; left: 5%;  animation-delay: 2s;   font-size: 26px; }
        .deco:nth-child(14) { top: 42%; right: 6%; animation-delay: 0.5s; font-size: 28px; }
        .deco:nth-child(15) { top: 22%; right: 4%; animation-delay: 1.5s; font-size: 22px; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(-10px) rotate(5deg); }
            50%      { transform: translateY(-18px) rotate(-5deg); }
            75%      { transform: translateY(-10px) rotate(8deg); }
        }

        /* ===== 헤더 (화면 절반 차지) ===== */
        .header {
            flex: 0 0 50%;       /* 세로 50% 고정 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 20px 10px;
            position: relative;
            z-index: 2;
        }

        /* "호구 넷의" 작은 글씨 (위쪽) */
        .title-small {
            font-family: 'Black Han Sans', sans-serif; /* 더 두꺼운 폰트로 변경 */
            font-size: 38px;
            color: #fff;
            display: block;
            text-shadow:
                3px 3px 0 #FF6B9D,
                6px 6px 0 rgba(0,0,0,0.2);
            transform: rotate(-3deg);
            margin-bottom: 12px;
            animation: wiggle 3s ease-in-out infinite;
            -webkit-text-stroke: 1px #fff;
            letter-spacing: 1px;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }

        /* "제주 투어" 메인 타이틀 - 아주 큼직하게 */
        .title-big {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 88px;          /* 64px → 88px 더 키움 */
            line-height: 0.95;
            display: inline-block;
            background: linear-gradient(90deg,
                #FF6B9D, #FFD93D, #6EE7B7, #00C9D7, #A78BFA, #FF6B9D);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s linear infinite;
            -webkit-text-stroke: 4px #fff;  /* 외곽선 더 두껍게 (3 → 4) */
            filter:
                drop-shadow(5px 5px 0 rgba(0,0,0,0.25))
                drop-shadow(0 0 20px rgba(255,255,255,0.5)); /* 빛나는 효과 */
            letter-spacing: 3px;
            transform: rotate(-2deg);
            font-weight: 900;
        }

        @keyframes rainbow {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .title-emoji {
            display: block;
            font-size: 38px;
            margin-top: 14px;
            animation: bounce-big 2s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        @keyframes bounce-big {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-8px) scale(1.1); }
        }

        /* 날짜 박스 */
        .date {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 20px;
            background: #fff;
            border-radius: 30px;
            font-family: 'Jua', sans-serif;
            font-size: 14px;
            color: #FF6B9D;
            font-weight: bold;
            box-shadow:
                0 0 0 3px #FFD93D,
                0 0 0 6px #6EE7B7,
                0 0 0 9px #00C9D7,
                0 6px 15px rgba(0,0,0,0.2);
            animation: pulse 2s ease-in-out infinite;
            white-space: nowrap;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.04); }
        }

        .date .emoji { margin: 0 4px; }

        /* ===== D-Day 배지 ===== */
        .dday-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, #FF6B9D, #FFD93D);
            color: #fff;
            padding: 10px 14px;
            border-radius: 50%;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            transform: rotate(15deg);
            animation: shake 2s ease-in-out infinite;
            z-index: 5;
            border: 3px solid #fff;
            min-width: 54px;
            text-align: center;
            line-height: 1;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(15deg) scale(1); }
            25%      { transform: rotate(20deg) scale(1.05); }
            75%      { transform: rotate(10deg) scale(1.05); }
        }

        .dday-badge .small-text {
            display: block;
            font-size: 9px;
            margin-bottom: 2px;
        }

        /* ===== 파도 ===== */
        .wave {
            display: block;
            width: 100%;
            height: 30px;
            position: relative;
            z-index: 2;
            flex-shrink: 0; /* 줄어들지 않게 */
        }

        /* ===== 메뉴 영역 (나머지 50%) ===== */
        .menu-wrap {
            flex: 1;             /* 남은 공간 다 채움 */
            display: flex;
            align-items: center; /* 세로 가운데 */
            padding: 0 16px 20px;
            position: relative;
            z-index: 2;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* 3열로 변경 (2x3 → 3x2) */
            gap: 12px;
            width: 100%;
        }

        /* 카드 */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: #fff;
            border-radius: 22px;
            padding: 14px 6px 12px;
            text-align: center;
            box-shadow:
                0 8px 20px rgba(0,0,0,0.15),
                inset 0 -3px 0 rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            border: 3px solid #fff;
            aspect-ratio: 1 / 1.05; /* 정사각형에 가깝게 */
        }

        /* 카드 위로 빛이 지나감 */
        .card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg,
                transparent 30%,
                rgba(255,255,255,0.4) 50%,
                transparent 70%);
            animation: shine 3s linear infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0%   { transform: translate(-100%, -100%); }
            100% { transform: translate(100%, 100%); }
        }

        .card:active {
            transform: scale(0.92) rotate(-2deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 카드 위 컬러 띠 */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--card-color);
            box-shadow: 0 0 12px var(--card-color);
        }

        .card-icon {
            font-size: 38px;
            margin-bottom: 4px;
            display: block;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.2));
            position: relative;
            z-index: 2;
            line-height: 1;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-6px) scale(1.1); }
        }

        .card-title {
            font-family: 'Jua', sans-serif;
            font-size: 16px;
            color: #333;
            margin-bottom: 2px;
            position: relative;
            z-index: 2;
        }

        .card-en {
            font-family: 'Gaegu', cursive;
            font-size: 11px;
            color: var(--card-color);
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        /* 카드별 컬러 */
        .card.schedule  { --card-color: #00C9D7; }
        .card.flight    { --card-color: #6EE7B7; }
        .card.stay      { --card-color: #FF6B9D; }
        .card.food      { --card-color: #FFB347; }
        .card.checklist { --card-color: #FFD93D; }
        .card.budget    { --card-color: #A78BFA; }

        /* 시간차 애니메이션 */
        .card:nth-child(1) .card-icon { animation-delay: 0s; }
        .card:nth-child(2) .card-icon { animation-delay: 0.2s; }
        .card:nth-child(3) .card-icon { animation-delay: 0.4s; }
        .card:nth-child(4) .card-icon { animation-delay: 0.6s; }
        .card:nth-child(5) .card-icon { animation-delay: 0.8s; }
        .card:nth-child(6) .card-icon { animation-delay: 1.0s; }
    </style>
</head>
<body>

    <!-- 반짝이 별가루 10개 (헤더 영역에 분포) -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- 떠다니는 이모지 5개 -->
    <div class="deco">🌴</div>
    <div class="deco">☀️</div>
    <div class="deco">🐚</div>
    <div class="deco">🌺</div>
    <div class="deco">🍹</div>

    <!-- D-Day 배지 -->
    <div class="dday-badge">
        <span class="small-text">JEJU</span>
        GO!
    </div>

    <!-- ===== 헤더 (화면 절반) ===== -->
    <header class="header">
        <h1>
            <span class="title-small">호구 넷의</span>
            <span class="title-big">제주<br>투어</span>
            <span class="title-emoji">🌊✨🏝️</span>
        </h1>

        <div class="date">
            <span class="emoji">📅</span>
            2026.07.15(수) ~ 17(금)
            <span class="emoji">✈️</span>
        </div>
    </header>

    <!-- 파도 -->
    <svg class="wave" viewBox="0 0 420 30" preserveAspectRatio="none">
        <path d="M0,15 Q105,3 210,15 T420,15 L420,30 L0,30 Z"
              fill="rgba(255,255,255,0.4)"/>
        <path d="M0,18 Q105,6 210,18 T420,18 L420,30 L0,30 Z"
              fill="rgba(255,255,255,0.6)"/>
    </svg>

    <!-- ===== 메뉴 (3x2 그리드) ===== -->
    <div class="menu-wrap">
        <nav class="menu-grid">
            <a href="schedule.html" class="card schedule">
                <span class="card-icon">📅</span>
                <div class="card-title">일정표</div>
                <div class="card-en">Schedule</div>
            </a>

            <a href="flight.html" class="card flight">
                <span class="card-icon">✈️</span>
                <div class="card-title">항공</div>
                <div class="card-en">Flight</div>
            </a>

            <a href="stay.html" class="card stay">
                <span class="card-icon">🏖️</span>
                <div class="card-title">숙소</div>
                <div class="card-en">Stay</div>
            </a>

            <a href="food.html" class="card food">
                <span class="card-icon">🍜</span>
                <div class="card-title">맛집</div>
                <div class="card-en">Food</div>
            </a>

            <a href="checklist.html" class="card checklist">
                <span class="card-icon">🎒</span>
                <div class="card-title">준비물</div>
                <div class="card-en">Checklist</div>
            </a>

            <a href="budget.html" class="card budget">
                <span class="card-icon">💰</span>
                <div class="card-title">예산</div>
                <div class="card-en">Budget</div>
            </a>
        </nav>
    </div>

</body>
</html>
