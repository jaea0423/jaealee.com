<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>매장 TV — 짚불태백 광교점</title>
<link rel="icon" href="../img/icon-192.png">
<!-- 매장 TV 화면 시안(11-11). 홀 TV·대기 공간 화면에 전체화면으로 띄움.
     왼쪽: 광고 영상 자리(영상을 받기 전이라 매장 사진을 천천히 넘김) · 오른쪽: 지금 부르는 번호, 대기 팀·예상 시간, 곧 오는 예약.
     ★ 누구나 보는 화면이라 예약자 이름은 가리고(김*수) 전화번호는 띄우지 않음.
     자료는 ../manage/store.js 의 ZB — 매장 화면에서 호출하면 바로 바뀜(같은 브라우저의 다른 탭, 실제 서비스에서는 실시간). -->
<style>
:root{--bg:#000; --panel:#111113; --card:#1C1C1E; --line:rgba(255,255,255,.1); --ink:#F5F5F7; --sub:#98989D; --gold:#FF9F0A;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); letter-spacing:-.01em; word-break:keep-all; -webkit-font-smoothing:antialiased; overflow:hidden}
.tv{display:grid; grid-template-columns:1fr minmax(380px, 34vw); height:100vh; height:100svh}
/* 왼쪽 — 광고 영상 자리 */
.ad{position:relative; overflow:hidden; background:#000}
.ad img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.04); transition:opacity 1.6s ease, transform 9s linear}
.ad img.on{opacity:1; transform:scale(1.12)}
.ad::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(0,0,0,.72), transparent 40%)}
.ad .cap{position:absolute; left:4vw; bottom:4vh; z-index:2; display:flex; align-items:center; gap:1.4vw}
.ad .cap img{position:static; opacity:1; transform:none; transition:none; width:auto; height:6vh; min-height:36px}
.ad .cap b{display:block; font-size:clamp(20px, 2.6vw, 44px); font-weight:700}
.ad .cap span{font-size:clamp(14px, 1.3vw, 22px); color:#D1D1D6}
.ad .tag{position:absolute; top:3vh; left:4vw; z-index:2; padding:6px 12px; border-radius:8px; background:rgba(0,0,0,.45); font-size:clamp(12px, 1vw, 16px); color:#D1D1D6}
/* 오른쪽 — 안내 */
.side{display:flex; flex-direction:column; gap:2vh; padding:3.2vh 2.2vw; background:var(--panel); border-left:1px solid var(--line); min-height:0}
.clock{display:flex; justify-content:space-between; align-items:baseline; color:var(--sub); font-size:clamp(14px, 1.2vw, 20px)}
.clock b{font-size:clamp(22px, 2vw, 34px); color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.box{background:var(--card); border-radius:22px; padding:2.4vh 1.8vw}
.box h2{margin:0; font-size:clamp(14px, 1.15vw, 20px); font-weight:600; color:var(--sub)}
.call .nos{display:flex; flex-wrap:wrap; gap:1vw; margin-top:1.2vh}
.call .no{font-size:clamp(64px, 8.5vw, 150px); font-weight:800; line-height:1; letter-spacing:-.04em; color:var(--gold); font-variant-numeric:tabular-nums}
.call .no.flash{animation:flash 1s ease 3}
@keyframes flash{50%{color:#fff; text-shadow:0 0 40px rgba(255,159,10,.8)}}
.call p{margin:1.2vh 0 0; font-size:clamp(15px, 1.25vw, 22px); color:#D1D1D6}
.call .idle{font-size:clamp(28px, 3vw, 52px); font-weight:700; margin-top:1vh}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:1vw}
.pair b{display:block; margin-top:.6vh; font-size:clamp(28px, 2.8vw, 50px); font-weight:700; font-variant-numeric:tabular-nums}
.pair small{display:block; font-size:clamp(12px, .9vw, 15px); color:var(--sub); margin-top:.4vh}
.res{flex:1; min-height:0; overflow:hidden}
.res ul{list-style:none; margin:1.2vh 0 0; padding:0}
.res li{display:grid; grid-template-columns:5.2em 1fr auto; gap:1vw; align-items:center; padding:1.1vh 0; border-top:1px solid var(--line); font-size:clamp(16px, 1.35vw, 24px)}
.res li b{font-weight:700; font-variant-numeric:tabular-nums}
.res li span:last-child{color:var(--sub)}
.res li.now b{color:var(--gold)}
.res .empty{margin-top:1.4vh; color:var(--sub); font-size:clamp(15px, 1.2vw, 20px)}
.foot{font-size:clamp(13px, 1vw, 17px); color:var(--sub); text-align:center}
.full{position:fixed; right:14px; bottom:14px; z-index:5; padding:8px 14px; border:0; border-radius:10px; background:rgba(255,255,255,.12); color:#fff; font:inherit; font-size:14px; cursor:pointer; opacity:.5}
.full:hover{opacity:1}
@media (max-width:900px), (orientation:portrait){
  html,body{overflow:auto}
  .tv{grid-template-columns:1fr; grid-template-rows:42vh auto; height:auto; min-height:100svh}
  .side{border-left:0}
}
@media (prefers-reduced-motion:reduce){ .ad img{transition:opacity .4s} .ad img.on{transform:none} .call .no.flash{animation:none} }
</style>
</head>
<body>
<div class="tv">
  <section class="ad" aria-label="광고 영상 자리">
    <span class="tag">광고 영상 자리 · 영상을 받으면 바꿉니다</span>
    <img src="../img/grill-fire.webp" alt="" class="on">
    <img src="../img/hero-hall.webp" alt="">
    <img src="../img/straw-plate.webp" alt="">
    <img src="../img/grill-table.webp" alt="">
    <img src="../img/hero-exterior.webp" alt="">
    <div class="cap"><img src="../img/logo.png" alt="짚불태백"><div><b>짚불에 굽는 태백 한우</b><span>광교점 · 단체 회식 예약 받습니다</span></div></div>
  </section>
  <aside class="side" id="side" aria-live="polite"></aside>
</div>
<button class="full" type="button" id="full">전체화면</button>
<script src="../manage/store.js"></script>
<script>
(function(){
  ZB.setDevice("매장 TV");
  const side = document.getElementById("side");
  const pad = n => String(n).padStart(2, "0");
  /* 이름 가리기 — 김민수 → 김*수, 이서 → 이*, 남궁민수 → 남**수 */
  const mask = s => { s = String(s || ""); return s.length <= 1 ? s : s.length === 2 ? s[0] + "*" : s[0] + "*".repeat(s.length - 2) + s[s.length - 1]; };
  let lastCalls = "";

  function render(){
    ZB.reload();
    const d = new Date(), nowM = d.getHours() * 60 + d.getMinutes();
    const live = ZB.waitLive(), calls = live.filter(x => x.status === "call"), waiting = live.filter(x => x.status === "wait");
    const rg = ZB.waitRange(waiting.length), cl = ZB.waitClose();
    const key = calls.map(x => x.no).join(","), fresh = key && key !== lastCalls; lastCalls = key;
    const soon = ZB.byDate(ZB.today()).filter(r => (r.status === "ok" || r.status === "req") && ZB.mins(r.time) >= nowM - 15).slice(0, 6);
    side.innerHTML = `
      <div class="clock"><span>${d.getMonth() + 1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일</span><b>${pad(d.getHours())}:${pad(d.getMinutes())}</b></div>
      <div class="box call">
        <h2>지금 입장해 주세요</h2>
        ${calls.length ? `<div class="nos">${calls.map(x => `<span class="no${fresh ? " flash" : ""}">${x.no}</span>`).join("")}</div><p>번호를 부르면 입구에서 대기번호를 말씀해 주세요.</p>`
          : `<div class="idle">${waiting.length ? "다음 순서 " + waiting[0].no + "번" : "바로 입장하실 수 있습니다"}</div>`}
      </div>
      <div class="box pair">
        <div><h2>지금 대기</h2><b>${waiting.length}팀</b></div>
        <div><h2>예상 대기</h2><b>${rg ? rg.lo + "~" + rg.hi + "분" : "바로"}</b><small>${ZB.wait.on && !cl.closed ? cl.at + " 접수 마감" : "오늘 접수 마감"}</small></div>
      </div>
      <div class="box res">
        <h2>곧 오시는 예약 손님</h2>
        ${soon.length ? `<ul>${soon.map(r => { const now = ZB.mins(r.time) <= nowM + 10; return `<li class="${now ? "now" : ""}"><b>${r.time}</b><span>${mask(r.name)} 님</span><span>${r.people}명</span></li>`; }).join("")}</ul>` : `<p class="empty">오늘 남은 예약이 없습니다.</p>`}
      </div>
      <div class="foot">웨이팅은 입구 화면에서 접수해 주세요 · 순서가 되면 카카오 알림톡으로 알려 드립니다</div>`;
  }

  /* 사진 천천히 넘기기 — 영상을 받으면 <video autoplay muted loop playsinline> 로 바꿈(기기에 저장해 두고 재생) */
  const imgs = [].slice.call(document.querySelectorAll(".ad > img")); let i = 0;
  setInterval(() => { imgs[i].classList.remove("on"); i = (i + 1) % imgs.length; imgs[i].classList.add("on"); }, 7000);

  document.getElementById("full").addEventListener("click", () => { const el = document.documentElement; if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen(); else if(document.exitFullscreen) document.exitFullscreen(); });
  window.addEventListener("storage", e => { if(e.key === ZB.KEY) render(); });
  setInterval(render, 15000);
  render();
})();
</script>
</body>
</html>
