<section class="page-head">

  </div>
</section>

<section class="chef-band">
  <div class="wrap">
    <div class="t"><span data-t="menuPage.chefBand.who">차별화된 조리 방식 · 짚불 초벌 구이</span><b data-t="menuPage.chefBand.quote">"순간 화력 1000도, 육즙은 가두고 향은 입힙니다."</b></div>
