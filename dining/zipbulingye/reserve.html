<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0C">
<meta name="robots" content="noindex, nofollow"><!-- 제안용 시안 — 실제 짚불태백 홈페이지가 아니라 검색에 잡히지 않게 -->
<title>예약 — 짚불태백 인계점</title>
<meta name="description" content="짚불태백 인계점 온라인 예약.">
<meta property="og:type" content="website">
<meta property="og:title" content="예약 — 짚불태백 인계점">
<meta property="og:description" content="짚불태백 인계점 온라인 예약.">
<link rel="icon" href="img/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="css/site.css">
<style>
  /* 이 장에만 쓰는 모양 — 사진 한 장 위에 가운데 카드 */
  .rz{min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
      background:linear-gradient(rgba(14,13,12,.72), rgba(14,13,12,.86)), url(img/hall-green.webp) center/cover no-repeat, var(--bg)}
  .rz-in{width:100%; max-width:420px; text-align:center}
  .rz-in img{width:230px; height:auto; margin:0 auto 6px; display:block}
  .rz-in h1{font:600 18px/1.2 var(--sans); color:var(--sub); letter-spacing:.3em; margin:0 0 22px}
  .rz-in p{color:var(--text); font-size:15px; line-height:1.6; margin:0 0 28px}
  .rz-in .btn{width:100%; height:58px; font-size:16px}
  .rz-links{display:flex; justify-content:center; gap:20px; margin-top:22px; font-size:14px}
  .rz-links a{color:var(--text); text-decoration:underline; text-underline-offset:4px}
  .rz-demo{margin-top:26px; font-size:12.5px; color:var(--sub)}
</style>
<script>document.documentElement.className += " pending";</script><!-- 내용이 정해질 때까지 잠깐 숨김(js/content.js 가 풂) -->
</head>
<body>
<!-- '바로 예약' 주소(네이버 지도·인스타그램에 거는 용도). 들어오자마자 예약 창이 열리고, 닫으면 이 장이 남습니다 -->
<main class="rz">
  <div class="rz-in">
    <img src="img/logo.png" alt="짚불태백">
    <h1>INGYE</h1>
    <p>날짜·시간·인원을 고르시면<br>가게에서 확인한 뒤 연락드려 확정합니다.</p>
    <button type="button" class="btn fill" data-reserve>예약하기</button>
    <div class="rz-links"><a id="rz-tel" href="tel:031-000-0000">전화 문의</a><a href="home.html">홈페이지</a></div>
  </div>
</main>

<script src="data/site.js"></script>
<script src="js/content.js"></script>
<script src="manage/store.js"></script><!-- 예약 자료(테이블 개수) — 매장 화면 시안과 같이 씀 -->
<script src="js/reserve.js"></script>
<script>
  /* 내용이 정해지면 전화번호를 맞추고 예약 창을 바로 엽니다 */
  (window.SITE_READY || Promise.resolve()).then(function(){
    var t = document.getElementById("rz-tel");
    if(window.INFO && INFO.tel){ t.href = "tel:" + INFO.tel; }
    if(window.openReserve) openReserve();
  });
</script>
</body>
</html>
