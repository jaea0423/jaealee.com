<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="약도: 수원시청역 9번 출구에서 인계로를 따라 걷다 인계로124번길로 들어서면 오른쪽에 짚불태백 인계점">
  <!-- 오시는 길 약도(더미, 11-10) — 실제 위치가 아닙니다. 인계점 주소를 받으면 다시 그립니다. 사이트 색(검정·타일·주황)에 맞춤 -->
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif; letter-spacing:-.2px}
      .rd{fill:#3A3A3C} .rd2{fill:#2C2C2E} .blk{fill:#1C1C1E} .park{fill:#16301F}
      .lab{fill:#98989D; font-size:13px} .rdl{fill:#C7C7CC; font-size:14px; font-weight:600}
      .me{fill:#F5F5F7; font-size:16px; font-weight:700}
    </style>
  </defs>
  <rect width="640" height="400" fill="#111113"/>
  <!-- 블록 -->
  <rect class="blk" x="24" y="24" width="150" height="110" rx="10"/>
  <rect class="blk" x="214" y="24" width="190" height="110" rx="10"/>
  <rect class="blk" x="444" y="24" width="172" height="110" rx="10"/>
  <rect class="blk" x="24" y="196" width="150" height="180" rx="10"/>
  <rect class="blk" x="214" y="196" width="120" height="180" rx="10"/>
  <rect class="blk" x="374" y="270" width="242" height="106" rx="10"/>
  <rect class="park" x="444" y="196" width="172" height="44" rx="10"/>
  <!-- 큰길: 인계로(가로), 효원로(세로) / 골목: 인계로124번길 -->
  <rect class="rd" x="0" y="146" width="640" height="38"/>
  <rect class="rd" x="186" y="0" width="16" height="400"/>
  <rect class="rd2" x="346" y="184" width="16" height="216"/>
  <rect class="rd2" x="362" y="246" width="278" height="12"/>
  <text class="rdl" x="430" y="170">인계로</text>
  <text class="rdl" x="196" y="388" transform="rotate(-90 196 388)" dx="0">효원로</text>
  <text class="lab" x="372" y="238">인계로124번길</text>
  <!-- 지하철 출구 -->
  <circle cx="110" cy="165" r="14" fill="#0A84FF"/>
  <text x="110" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">9</text>
  <text class="lab" x="40" y="118">수원시청역 9번 출구</text>
  <path d="M110 151 L110 128" stroke="#0A84FF" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- 걷는 길 -->
  <path d="M124 165 H354 V252 H470" fill="none" stroke="#FF9F0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7"/>
  <text class="lab" x="230" y="140">걸어서 8분</text>
  <!-- 이웃 -->
  <text class="lab" x="232" y="292">인계동 먹자골목</text>
  <text class="lab" x="456" y="223" fill="#7BD88F">전용 주차장 12대</text>
  <text class="lab" x="458" y="80">인계동 주민센터</text>
  <!-- 매장 -->
  <circle cx="490" cy="300" r="34" fill="#FF9F0A" opacity=".18"/>
  <path d="M490 318 c-15-17-22-27-22-37 a22 22 0 0 1 44 0 c0 10-7 20-22 37z" fill="#FF9F0A"/>
  <circle cx="490" cy="281" r="8" fill="#111113"/>
  <text class="me" x="490" y="350" text-anchor="middle">짚불태백 인계점</text>
  <text class="lab" x="490" y="368" text-anchor="middle">1층</text>
</svg>
