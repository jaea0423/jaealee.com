<body data-page="about">

<main id="main-content">

<section class="page-head"><img class="pic" src="img/hero-exterior.webp" alt="" data-img="about.head.img"><div class="wrap"><h1 data-t="about.head.title">이야기</h1><p data-t="about.head.sub">醫食同源 — 입으로 먹는 음식은 몸에 약이 된다.</p></div></section>

<!-- 브랜드의 마음가짐을 먼저, 그 다음에 조리 방식·다른 점 -->
<section class="sec" id="greeting">
  <div class="wrap ed">
    <div class="eh"><h2 data-t="about.greeting.title">의식동원<br>醫食同源</h2><p data-t="about.greeting.by">짚불태백</p></div>
    <div class="prose">
      <div data-paras="about.greeting.paras"><p>'입으로 먹는 음식은 몸에 약이 된다.' 짚불태백이 음식을 대하는 마음입니다.</p></div>
      <p class="sign" data-t="about.greeting.sign">짚불태백 인계점 드림</p>
      <div class="sns"><a class="more insta" target="_blank" rel="noopener">인스타그램</a></div>

  </div>
</section>

  <div class="wrap chef wide-pic">
    <figure><img src="img/grill-fire.webp" alt="짚불 위에서 초벌하는 우대갈비" data-img="about.chef.img"></figure>
    <div class="t">
      <p class="who" data-t="about.chef.who">차별화된 조리 방식</p>
      <h2 data-t="about.chef.name">짚불 초벌 구이</h2>
      <p class="quote" data-t="about.chef.quote">"순간 화력 1000도.<br>육즙은 가두고 짚 향은 입힙니다."</p>
      <p data-t="about.chef.para">숯으로 먼저 초벌한 뒤 볏짚으로 훈연합니다.</p>
    </div>
  </div>
</section>

<section class="sec" id="story">
  <div class="wrap ed">
    <div class="eh"><h2 data-t="about.story.title">짚불태백은<br>다릅니다</h2><p data-t="about.story.sub"></p></div>

      <div data-paras="about.story.paras"><p>소갈비 가운데 가장 맛있다는 6~8번대 꽃갈비살만 씁니다.</p></div>
      <div class="pics" id="story-pics"></div>
    </div>
  </div>
