<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0C">
<meta name="robots" content="noindex, nofollow"><!-- 제안용 시안 — 실제 짚불태백 홈페이지가 아니라 검색에 잡히지 않게 -->
<title>오시는 길 — 짚불태백 인계점</title>
<meta name="description" content="짚불태백 인계점 오시는 길·영업시간·주차 안내.">
<meta property="og:type" content="website">
<meta property="og:title" content="오시는 길 — 짚불태백 인계점">
<meta property="og:description" content="짚불태백 인계점 오시는 길·영업시간·주차 안내.">
<link rel="icon" href="img/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className += " pending";</script><!-- 내용이 정해질 때까지 잠깐 숨김(js/content.js 가 풂) -->
</head>
<body data-page="visit">

<main id="main-content">

<section class="page-head"><img class="pic" src="img/exterior-2.webp" alt="" data-img="visit.head.img"><div class="wrap"><h1 data-t="visit.head.title">오시는 길</h1><p data-t="visit.head.sub">수원 인계동에 있습니다. 정확한 주소와 약도는 준비 중입니다.</p></div></section>

<section class="sec">
  <div class="wrap visit">
    <div class="visit-l">
      <address><b data-t="info.addr2">경기 수원시 팔달구<br>인계동 (주소 예시)</b>전화 <a href="tel:031-000-0000" class="num" data-tel>031-000-0000</a></address>
      <div class="map-links"><a class="btn" id="lnk-naver" target="_blank" rel="noopener">네이버 지도</a><a class="btn" id="lnk-kakao" target="_blank" rel="noopener">카카오맵</a></div>

      <h3 data-t="visit.hoursTitle">영업시간</h3>
      <div class="hours" id="hours"></div>

    </div>
    <div class="sketch">
      <!-- 약도 자리: 한옥반점은 직접 그린 약도(img/map.png)를 둠. 인계점 주소를 받으면 약도나 지도 사진을 여기에 -->
      <div class="map-ph">약도 준비 중<small>인계점 주소를 받으면 약도와 지도 링크가 여기에 들어갑니다</small></div>

      <h3 data-t="visit.parkingTitle">주차</h3>
      <div class="prose-s" data-paras="visit.parking">
        <p>매장 앞 주차 공간을 이용하실 수 있습니다. (예시)</p>
      </div>

      <h3>이용 안내</h3>
      <ul class="facts" data-list="info.services"></ul>

      <h3 data-t="visit.transitTitle">대중교통</h3>
      <ul class="plain" data-list="visit.transit">
        <li>지하철 — 수인분당선 수원시청역 (예시)</li>
      </ul>
    </div>
  </div>
</section>

</main>

<script src="data/site.js"></script>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
<script src="manage/store.js"></script><!-- 예약 자료(테이블 개수) — 매장 화면 시안과 같이 씀 -->
<script src="js/reserve.js"></script>
</body>
</html>
