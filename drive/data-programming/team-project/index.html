<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 프로젝트 · 데이터분석프로그래밍</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0F1217; --surface:#161B22; --line:#2A313C; --ink:#E9ECF1; --ink-2:#9BA5B4; --acc:#1B6FD1; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Pretendard',system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6;
        display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .box{ max-width:460px; text-align:center; }
  .eyebrow{ font-family:'Space Grotesk',monospace; font-size:12px; letter-spacing:.16em; text-transform:uppercase;
            color:var(--acc); margin-bottom:12px; }
  h1{ font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:32px; letter-spacing:-.01em; color:#fff; }
  p{ margin-top:10px; color:var(--ink-2); font-size:14px; }
  a.back{ display:inline-block; margin-top:26px; font-family:'Space Grotesk',monospace; font-size:13px; font-weight:500;
          color:var(--acc); text-decoration:none; border:1px solid var(--line); background:var(--surface);
          border-radius:8px; padding:9px 18px; }
  a.back:hover{ border-color:var(--acc); }
</style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">데이터분석프로그래밍 · Team Project</div>
    <h1>팀 프로젝트</h1>
    <p>준비 중입니다. 팀 프로젝트 자료가 정리되면 이곳에 올라옵니다.</p>
    <a class="back" href="../">← 데이터분석프로그래밍</a>
  </div>
</body>
</html>
