{"type": "essay", "lv": "상", "unit": "보조 명제 2", "pts": 7, "q": "<p>수업 예시에서 묶을 때 생긴 대표 빈도는 16, 25, 32, 57, 100 이고 그 합은 230 = cost(T) 이다. 허프만 트리의 cost 가 항상 \"묶을 때 생긴 대표 빈도의 합\"과 같은 이유를 보조 명제 2 로 설명하시오.</p>", "model": "보조 명제 2: 가장 깊은 형제 u, v 를 부모 w 로 합치면 cost 가 정확히 f(u) + f(v) = f(w) 만큼 줄어든다. 허프만은 처음 묶은 두 개가 가장 깊은 형제가 되므로, 트리를 <b>묶은 순서의 반대로 하나씩 합치면</b> 매번 그 대표 빈도만큼 cost 가 줄고, 마지막에 루트 하나만 남으면 cost 는 0 이다. → cost(T) = 대표 빈도들의 합. (확인: 16 + 25 + 32 + 57 + 100 = 230)", "rubric": [["합칠 때마다 cost 가 f(w) (= 대표 빈도) 만큼 줄어듦", 3], ["반복하면 루트만 남아 cost 0 → 합과 같다", 3], ["230 확인", 1]], "src": [["10-2", "s9", "보조 명제 2"], ["10-1", "s13", "두 개씩 묶기"]]},
