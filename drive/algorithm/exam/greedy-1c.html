{"type": "essay", "lv": "상", "unit": "보조 명제 1", "pts": 14, "q": "<p>보조 명제 1 을 증명하시오. 빈도가 가장 작은 두 문자를 m, n 이라 하고, 최적 트리 H 에서 가장 깊은 곳의 형제를 s, t 라 하자. (수업의 x, y, a, b, T 가 각각 m, n, s, t, H 로 바뀌었다.)</p><p>명제: m, n 을 가장 깊은 곳에 형제로 갖는 최적 트리가 항상 존재한다.</p>", "model": "<b>가정</b>: 그런 최적 트리는 하나도 없다 → 최적 트리 H 의 가장 깊은 형제 s, t 는 m, n 이 아니다.<br><b>교환</b>: H 에서 m 과 s 의 자리를 바꾼 트리 H′. 달라진 것은 m, s 뿐.<br>cost(H) − cost(H′) = w(m)d<sub>H</sub>(m) + w(s)d<sub>H</sub>(s) − w(m)d<sub>H</sub>(s) − w(s)d<sub>H</sub>(m) = <b>(w(m) − w(s))(d<sub>H</sub>(m) − d<sub>H</sub>(s))</b><br>w(m) − w(s) ≤ 0 (m 의 빈도가 가장 작음), d<sub>H</sub>(m) − d<sub>H</sub>(s) ≤ 0 (s 가 가장 깊음) → 곱 ≥ 0 → cost(H) ≥ cost(H′) → <b>H′ 도 최적</b>.<br>같은 방법으로 n 과 t 를 바꾼 H″ 도 최적.<br><b>모순</b>: H″ 은 m, n 을 가장 깊은 형제로 갖는 최적 트리 ↔ 가정 → 명제가 참.", "rubric": [["가정 (명제의 부정)", 2], ["교환 트리 H′ 과 cost 차이 식", 4], ["(w(m) − w(s))(d(m) − d(s)) 로 묶음", 3], ["두 인수의 부호와 이유 → H′ 도 최적", 3], ["n ↔ t 교환 후 모순 · 결론", 2]], "src": [["10-2", "s7", "보조 명제 1"]]},
