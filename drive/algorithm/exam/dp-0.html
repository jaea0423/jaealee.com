{ type:'ox',

   q:`<p>동적 계획법(DP)에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`DP 는 과정에서 얻은 답을 리스트·배열에 저장해 두고 재사용한다.`,true],[`분할정복은 답을 저장하지 않고 필요할 때마다 함수를 다시 호출한다.`,true],[`DP 로 푸는 순서는 ① 작은 문제로 나누기 ② 점화식 ③ DP 테이블을 순서대로 채우기 ④ 정확성 판별이다.`,true],[`4단계 정확성 판별은 따로 증명해야 하는 가장 중요한 단계이다.`,false],[`DP 는 메모리를 조금 더 쓰는 대신 수행시간을 줄인다.`,true],[`DP 를 쓰면 어떤 문제든 O(n) 이 된다.`,false],[`DP 테이블은 어떤 순서로 채워도 결과가 같다.`,false]],
   exp:`<b>ㄱ (O)</b> 저장해 둔 표 = DP 테이블.<br><b>ㄴ (O)</b> 그래서 같은 값을 여러 번 계산할 수 있다.<br><b>ㄷ (O)</b> 수업의 4단계.<br><b>ㄹ (X)</b> 1 ~ 3단계를 제대로 하면 해결되므로 신경 쓸 필요 없다.<br><b>ㅁ (O)</b> 지그재그: 리스트 2개(O(n))로 O(n²).<br><b>ㅂ (X)</b> LCS O(nm), 지그재그 O(n²) 처럼 문제마다 다르다.<br><b>ㅅ (X)</b> 점화식이 참조하는 칸이 먼저 채워져 있어야 한다. 그래서 "순서대로" 채운다.`,

{ type:'ox',

   q:`<p>피보나치 수와 계단 오르기에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`피보나치 수의 바닥 조건은 F<sub>0</sub> = 0, F<sub>1</sub> = 1 이다.`,true],[`피보나치를 DP 로 구해도 분할정복과 같은 O(1.6ⁿ) 이다.`,false],[`DP 피보나치에서 F[i] = F[i − 1] + F[i − 2] 한 칸을 채우는 데 O(n) 이 걸린다.`,false],[`한 번에 1칸 또는 2칸 오를 때 계단 경우의 수는 A[n] = A[n − 1] + A[n − 2] 이다.`,true],[`A[1] = A[2] = 1 일 때 A[3] = 1 이다.`,false],[`A[1] = A[2] = 1 일 때 A[6] = 8 이다.`,true],[`계단 오르기를 DP 로 풀면 O(n²) 이다.`,false]],
   exp:`<b>ㄱ (O)</b> 0, 1, 1, 2, 3, 5, 8, …<br><b>ㄴ (X)</b> DP 는 O(n) (반복 n 번 × O(1)). O(1.6ⁿ) 은 분할정복.<br><b>ㄷ (X)</b> O(1). 함수를 다시 부르지 않고 저장된 두 값을 더하기만 한다.<br><b>ㄹ (O)</b> n 층에 오는 마지막 한 걸음은 1칸 또는 2칸 두 가지뿐.<br><b>ㅁ (X)</b> 1-2-3, 1-3 두 가지라 A[3] = 2.<br><b>ㅂ (O)</b> 1, 1, 2, 3, 5, 8.<br><b>ㅅ (X)</b> O(n). 칸 n 개 × O(1).`,
   src:[["07-1", "s2", "피보나치"], ["07-1", "s3", "계단 오르기"]] },

{ type:'ox',
   lv:'기초',
   unit:"최대 구간 합",
   pts:21,
   q:`<p>최대 구간 합 문제에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`모든 구간을 직접 더하는 단순한 방법은 O(n³) 이다.`,true],[`prefix sum 을 쓰면 구간 합 하나는 P[j] − P[i − 1] 로 O(1) 이므로 최대 구간 합 전체도 O(n) 이다.`,false],[`분할정복 방법의 점화식은 2T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + Cn 이고 O(n log n) 이다.`,true],[`분할정복의 max(L, R, M) 에서 M 은 가운데를 걸치는 구간의 최대 합이다.`,true],[`DP 의 S[k] 는 A[0] ~ A[k] 범위 안의 최대 구간 합이다.`,false],[`점화식은 S[k] = max(S[k − 1] + A[k], A[k]) 이다.`,true],[`S[k − 1] 이 음수면 앞을 버리고 A[k] 부터 새로 시작하는 쪽이 크다.`,true],[`최종 답은 S[n − 1] 이다.`,false],[`A = [−1, 1, 3, −4, 5, −4, 6, −2] 이면 S = [−1, 1, 4, 0, 5, 1, 7, 5] 이고 답은 7 이다.`,true],[`최대 구간 합을 DP 로 풀면 O(n) 이다.`,true]],
   exp:`<b>ㄱ (O)</b> 모든 (i, j) × 더하기.<br><b>ㄴ (X)</b> 구간 (i, j) 가 약 n² 개라 O(n²). P 는 P[i] = P[i − 1] + A[i] 로 한 번 훑어 구한다.<br><b>ㄷ (O)</b> 왼쪽 · 오른쪽 재귀 + 가운데 걸치는 구간 Cn.<br><b>ㄹ (O)</b> m 과 m + 1 을 모두 포함하는 구간.<br><b>ㅁ (X)</b> A[k] 로 "끝나는" 최대 구간 합. 그래야 S[k − 1] 뒤에 A[k] 를 이어 붙일 수 있다.<br><b>ㅂ (O)</b> 이어 붙이기 vs 새로 시작.<br><b>ㅅ (O)</b> 음수를 붙이면 손해.<br><b>ㅇ (X)</b> 답 = max(S). 최대 구간이 마지막 원소로 끝난다는 보장이 없다.<br><b>ㅈ (O)</b> 7 = 5 − 4 + 6.<br><b>ㅊ (O)</b> 네 방법 중 가장 빠르다.`,
   src:[["07-1", "s5", "prefix sum"], ["07-1", "s6", "분할정복"], ["07-1", "s7", "동적 계획법"], ["07-1", "s8", "4가지 비교"]] },

{ type:'ox',
   lv:'기초',
   unit:"LCS",
   pts:21,
   q:`<p>LCS(최장 공통 부문자열)에 대한 설명이다. (X 길이 n, Y 길이 m) 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`부문자열은 반드시 연속된 글자여야 한다.`,false],[`LCS(i, j) 는 X 의 앞 i 글자와 Y 의 앞 j 글자의 LCS 길이이다.`,true],[`x<sub>i</sub> = y<sub>j</sub> 이면 LCS(i, j) = LCS(i − 1, j − 1) + 1 이다.`,true],[`x<sub>i</sub> ≠ y<sub>j</sub> 이면 LCS(i, j) = LCS(i − 1, j − 1) 이다.`,false],[`LCS(0, j) = LCS(i, 0) = 0 이다.`,true],[`표의 한 칸은 왼쪽, 위, 왼쪽 위 칸만 보고 채운다.`,true],[`LCS 는 항상 하나뿐이다.`,false],[`"ABCBDAB" 와 "BDCABA" 의 LCS 길이는 4 이다.`,true],[`LCS 표를 채우는 수행시간은 O(n + m) 이다.`,false],[`화살표를 거꾸로 따라가 실제 부문자열을 찾으면 전체가 O(n²m) 이 된다.`,false]],
   exp:`<b>ㄱ (X)</b> subsequence. 순서만 지키면 중간 글자를 건너뛸 수 있다.<br><b>ㄴ (O)</b> 구하려는 답은 LCS(n, m).<br><b>ㄷ (O)</b> 같은 끝 글자를 LCS 의 마지막 글자로 쓴다.<br><b>ㄹ (X)</b> max(LCS(i, j − 1), LCS(i − 1, j)).<br><b>ㅁ (O)</b> 한쪽이 빈 문자열이면 공통 글자가 없다.<br><b>ㅂ (O)</b> 그래서 위에서 아래, 왼쪽에서 오른쪽 순서로 채우면 된다.<br><b>ㅅ (X)</b> 길이가 같은 LCS 가 여러 개일 수 있다.<br><b>ㅇ (O)</b> 예: BCBA.<br><b>ㅈ (X)</b> O(nm). 칸 n × m 개 × O(1). n 과 m 이 비슷하면 O(n²).<br><b>ㅊ (X)</b> 거꾸로 따라가기는 O(n + m) 이라 O(nm) 에 묻힌다.`,
   src:[["07-2", "s2", "LCS 문제"], ["07-2", "s3", "LCS 점화식"], ["07-2", "s6", "부문자열 찾기"], ["07-2", "s7", "O(nm)"]] },

{ type:'ox',
   lv:'기초',
   unit:"지그재그",
   pts:19,
   q:`<p>지그재그 수열 문제에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`low[k] 는 A[k] 로 끝나고, A[k] 가 내려오며 끝나는 가장 긴 지그재그의 길이이다.`,true],[`A[j] &gt; A[k] (j &lt; k) 이면 low[k] 후보는 high[j] + 1 이다.`,true],[`A[j] &lt; A[k] (j &lt; k) 이면 high[k] 후보는 high[j] + 1 이다.`,false],[`low 와 high 의 초깃값은 0 이다.`,false],[`low[k] = max(low[k], high[j] + 1) 은 for j 반복 동안 low[k] 를 더 큰 값으로 계속 갱신한다.`,true],[`최종 답은 max(low[n − 1], high[n − 1]) 이다.`,false],[`지그재그의 DP 테이블은 1차원 리스트 두 개, LCS 의 DP 테이블은 2차원 표 하나이다.`,true],[`지그재그 DP 는 O(n²) 이다.`,true],[`모든 부분수열을 다 만들어 보는 방법은 부분수열이 2ⁿ 개라 지수 시간이다.`,true]],
   exp:`<b>ㄱ (O)</b> high[k] 는 올라가며 끝나는 길이.<br><b>ㄴ (O)</b> A[k] 가 내려오려면 A[j] 는 올라가며 끝났어야 한다.<br><b>ㄷ (X)</b> low[j] + 1. A[k] 가 올라가며 끝나려면 A[j] 는 내려오며 끝났어야 한다.<br><b>ㄹ (X)</b> 1. A[k] 하나만으로도 길이 1 인 지그재그다.<br><b>ㅁ (O)</b> 모든 j 중 최댓값이 남는다.<br><b>ㅂ (X)</b> 모든 k 에 대해 max(low[k], high[k]) 의 최댓값. 어느 A[k] 에서든 끝날 수 있다.<br><b>ㅅ (O)</b> low · high vs LCS 표.<br><b>ㅇ (O)</b> 바깥 n 번 × 안쪽 최대 n 번. 정확히 <span class="frac"><span class="num">(n − 1)n</span><span class="den">2</span></span>.<br><b>ㅈ (O)</b> DP 로 다항 시간이 된다.`,
   src:[["07-2", "s9", "작은 문제"], ["07-2", "s10", "코드와 DP 테이블"], ["07-2", "s11", "O(n²)"]] },

{ type:'ox',
   lv:'기초',
   unit:"DP 설계",
   pts:10,
   q:`<p>DP 를 설계하는 방법에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`최대 구간 합, LCS, 지그재그는 모두 "마지막 원소(글자)" 를 기준으로 작은 문제를 정했다.`,true],[`큰 문제의 최적 해 안에 들어 있는 부분도 그 부분 문제의 최적 해여야 한다.`,true],[`수행시간은 (채울 칸 수) × (한 칸 채우는 시간) 으로 구한다.`,true],[`작은 문제의 답을 모두 구한 뒤 그중 최댓값이 답인 문제도 있다.`,true],[`행렬 곱셈 순서 문제 자체는 중간고사에 직접 출제된다.`,false]],
   exp:`<b>ㄱ (O)</b> A[k] 로 끝나는, 맨 끝 글자 x<sub>i</sub> · y<sub>j</sub>, A[k] 로 끝나는.<br><b>ㄴ (O)</b> 예: A[6] 으로 끝나는 최대 구간에서 A[6] 을 빼면 A[5] 로 끝나는 최대 구간.<br><b>ㄷ (O)</b> LCS: nm × O(1), 지그재그: n × O(n).<br><b>ㄹ (O)</b> 최대 구간 합 max(S), 지그재그.<br><b>ㅁ (X)</b> 교수님: 직접 출제하지 않음. DP 설계 순서는 범위.`,
   src:[["07-1", "s7", "DP 설계 단계"], ["08-1", "s4", "마지막 곱셈에서 자르기"], ["08-1", "s7", "시험 범위"]] }
];
