 { type:'essay', lv:'상', unit:'두 번째 값', pts:9,
   q:`<p>토너먼트로 <b>최댓값</b>을 찾은 뒤, 그 결과를 이용해 <b>두 번째로 큰 값</b>을 찾으려 한다. (1) 두 번째로 큰 값의 후보가 어떤 원소들인지 쓰고, 반드시 그 안에 있는 이유를 설명하시오. (2) n = 40 일 때 최댓값과 두 번째로 큰 값을 모두 찾는 데 필요한 비교 횟수를 구하시오.</p>`,
   model:`(1) 최댓값과 직접 맞붙어 진 원소들. 두 번째로 큰 값이 최댓값이 아닌 x 에게 졌다면 x 가 그보다 크다는 뜻이고, 최댓값까지 더해 그보다 큰 원소가 둘이 되어 ‘두 번째’ 에 모순이다. 따라서 두 번째로 큰 값은 최댓값에게만 질 수 있다. 후보 수는 최댓값이 거친 라운드 수로, 많아야 ⌈log₂n⌉ 개다.<br>(2) 최댓값 n − 1 = 39 번. ⌈log₂40⌉ = 6 이므로 후보 6개 중 최댓값 5 번. 합 39 + 5 = <b>44</b> (= n + ⌈log₂n⌉ − 2).`,

 { type:'line', lv:'상', unit:'Quick Select', pts:8,
   q:`<p>수업의 quick_select 를 고쳐 <b>k 번째로 큰 값</b>을 찾는 함수를 만들었다. A 에는 P 보다 큰 값, B 에는 P 보다 작은 값을 담는다. 그런데 <b>한 줄</b>을 잘못 적어 quick_select_max([4, 9, 1, 6], 3) 이 3번째로 큰 값 4 를 돌려주지 못하고 IndexError 로 끝난다. 잘못 적은 줄을 고르시오.</p>`,
   code:`
def quick_select_max(L, k):
    P = L[0]
    A, B, M = [], [], []
    for x in L:
        if P < x:
            A.append(x)
        elif P > x:
            B.append(x)
        else:
            M.append(x)
    if len(A) >= k:
        return quick_select_max(A, k)
    elif len(A) + len(M) <= k:
        return quick_select_max(B, k - len(A) - len(M))
    else:
        return P`,
   answer:[13],
   exp:`13번 줄은 len(A) + len(M) &lt; k 여야 한다. P = 4 : A = [9, 6], M = [4], B = [1]. |A| + |M| = 3 = k 이면 답은 M 의 값 4 인데, &lt;= 때문에 B 로 k − 3 = 0 을 넘긴다. [1] 에서는 len(A) = 0 ≥ 0 이 참이라 빈 리스트 A 로 재귀해 L[0] 에서 오류가 난다. 5·7번 줄은 '큰 값을 A 로' 바꾼 것이라 맞고, 14번 줄의 k − |A| − |M| 도 그대로 맞다.`,

 { type:'essay', lv:'상', unit:'MoM', pts:10,
   q:`<p>MoM 에서 원소를 5개가 아니라 <b>3개씩</b> 묶는다고 하자. (3개의 median 은 3번 비교로 찾고, 분할에는 n 번 비교한다고 본다) (1) 수업의 구조도 방법으로 |A| 의 상한을 구하시오. (2) 이때 MoM 의 점화식을 세우시오. (3) T(n) ≤ Cn 을 귀납 단계에 대입했을 때 증명이 닫히는지 판단하고, 그 이유를 쓰시오.</p>`,
   model:`(1) 그룹 ${F('n','3')} 개 중 절반인 ${F('n','6')} 개 그룹의 median 이 m* 이하. 그룹마다 median 본인과 그 위 1개, 즉 2개가 X 에 든다 → |X| ≥ ${F('n','3')}. W 도 대칭으로 ${F('n','3')} 이상 → |A| ≤ n − ${F('n','3')} = ${F('2n','3')}.<br>(2) 1단계 0, 2단계 3 × ${F('n','3')} = n, 3단계 T(${F('n','3')}), 4단계 n + T(${F('2n','3')}) → T(n) = T(${F('2n','3')}) + T(${F('n','3')}) + 2n.<br>(3) 닫히지 않는다. C·${F('2n','3')} + C·${F('n','3')} + 2n = Cn + 2n 이 되어 어떤 C 를 잡아도 Cn 을 2n 만큼 넘는다. 두 재귀 항의 크기 합이 ${F('2','3')} + ${F('1','3')} = 1 이라 줄어드는 여유가 없기 때문이다. (5개씩일 때는 ${F('3','4')} + ${F('1','5')} = ${F('19','20')} &lt; 1)`,
   rubric:[`|X| ≥ ${F('n','3')} 에서 |A| ≤ ${F('2n','3')} 을 유도`,`점화식 T(n) = T(${F('2n','3')}) + T(${F('n','3')}) + 2n`,'대입 결과가 Cn + 2n 이라 닫히지 않는다고 판단','근거: 두 재귀 항의 비율 합이 1 이라 여유가 없음'],
   src:[['02-2','s6','MoM 점화식'],['02-2','s7','c 구하기'],['02-2','s9','이게 되는 진짜 이유']] },

 { type:'short', lv:'상', unit:'MoM', pts:8,
   q:`<p>a, b, c, d, e 다섯 개의 median 을 수업의 방법으로 찾는다. ① a &lt; b ② c &lt; d ③ a &lt; c 까지는 수업과 같았지만, ④ b 와 e 를 비교했더니 수업과 달리 <b>e &lt; b</b> 였다. (가) {b, c, d, e} 중 가장 작은 값을 확정하려면 ⑤ 에서 어느 두 원소를 비교해야 하는가? (나) ⑤ 의 결과가 c &lt; e 일 때, median 을 확정하는 ⑥ 에서 비교할 두 원소는?</p>`,

   src:[['02-2','s5','5개의 median']] },

 { type:'essay', lv:'상', unit:'Quick Select', pts:9,
   q:`<p>1 ~ 5 를 한 번씩 써서 만든 리스트 L 로 수업의 quick_select(L, 3) 을 호출한다. quick_select 가 <b>처음 호출을 포함해 모두 5번</b> 호출되는 L 을 하나 만들고, 각 호출의 (L, k) 를 차례로 쓰시오. 또 분할 한 번에 (리스트 크기 − 1) 번 비교한다고 할 때 전체 비교 횟수를 구하시오.</p>`,
   model:`예 : L = [5, 1, 4, 2, 3]<br>([5, 1, 4, 2, 3], 3) : P = 5, A = [1, 4, 2, 3] → |A| ≥ 3 → ([1, 4, 2, 3], 3) : P = 1, A = [], M = [1] → B 로, k = 2 → ([4, 2, 3], 2) : P = 4, A = [2, 3] → ([2, 3], 2) : P = 2, M = [2] → B 로, k = 1 → ([3], 1) : 3 반환.<br>매 호출에서 피벗이 현재 리스트의 가장 크거나 가장 작은 값이라 크기가 1씩만 준다(최악의 경우). 비교 4 + 3 + 2 + 1 + 0 = <b>10</b>.<br>(다른 답 예 : [1, 5, 2, 4, 3], [5, 1, 2, 4, 3] — 마지막까지 남는 값은 답인 3 이어야 한다)`,
   rubric:['5번 호출되는 L 을 제시 (실제로 추적해 맞음)','각 호출의 (L, k) 를 바르게 씀','피벗이 매번 가장 크거나 작은 값이라 1개씩만 준다는 설명','전체 비교 10'],
   src:[['02-1','s5','최악의 경우']] },

 { type:'short', lv:'상', unit:'좋은 피벗', pts:8,
   q:`<p>피벗이 언제나 |A|, |B| ≤ ${F('n','c')} 를 보장하지만, 그 피벗을 고르는 데 비교가 a = n<sup>2</sup> 번 든다고 하자. 수업에서 ‘한 단계의 최대 비용 × 단계 수’ 로 상한을 구한 방법을 그대로 쓸 때, 전체 비교 횟수의 상한을 Big-O 로 쓰시오.</p>`,
   show:'O(n<sup>2</sup> log n)', alt:['O(n^2 log n)','O(n² log n)'],
   exp:`한 단계 비용은 a + n = n<sup>2</sup> + n ≤ 2n<sup>2</sup>, 단계 수는 log<sub>c</sub> n. 곱하면 2n<sup>2</sup>·log<sub>c</sub> n → O(n<sup>2</sup> log n). 수업의 O(n log n) 은 a ≤ n 이라는 가정 아래의 결과라 여기서는 쓸 수 없다. 단계 수를 곱하지 않은 O(n<sup>2</sup>) 도 틀린다.`,
   src:[['02-2','s3','전체 비교 횟수']] },
];
