 { type:'line', lv:'중', unit:'거듭제곱', pts:7,
   q:`<p>power3 를 옮겨 적다가 <b>한 줄</b>을 잘못 적어, power3(2, 6) 이 64 가 아니라 32 를 반환한다. 잘못 적은 줄을 고르시오.</p>`,
   code:`
def power3(a, n):
    if n == 1:
        return a
    x = power3(a, n//2)
    if n % 2 == 1:
        return x * x
    else:
        return x * x * a`,
   answer:[5],
   exp:`5번 줄은 n % 2 == 0 이어야 한다. 지금은 짝수일 때 a 를 한 번 더 곱하고 홀수일 때 빠뜨린다. power3(2, 3) : x = 2, 홀수라 x * x = 4. power3(2, 6) : x = 4, 짝수라 4 * 4 * 2 = 32. 6번 줄이나 8번 줄 하나만 고치면 두 경우가 같은 식이 되어 여전히 틀린다.`,

   model:`두 갈래 나무. i 번째 층(i = 0, 1, …, k − 1)에는 갈래가 2<sup>i</sup> 개이고, 갈래 하나의 연산은 크기와 상관없이 C 이다.<br>층의 합 : C, 2C, 2<sup>2</sup>C, …, 2<sup>k−1</sup>C → 초항 C, 공비 2, k 개 등비수열 → C(2<sup>k</sup> − 1) = C(n − 1)<br>맨 아래 크기 1 인 칸 : 2<sup>k</sup> = n 개 × T(1) = C → Cn<br>T(n) = C(n − 1) + Cn = 2Cn − C &nbsp;⇒&nbsp; <b>O(n)</b><br>(정렬의 2T(${F('n','2')}) + Cn 은 층의 합이 Cn 으로 일정해 O(n log n) 이었지만, 여기는 갈래 하나의 연산이 C 라서 층의 합이 2배씩 늘어난다.)`,
