 { type:'short', lv:'상', unit:'분할 정복', pts:8,
   q:`<p>max(A) 를 반씩이 아니라 <b>네 묶음</b>으로 나누어 구한다. 각 묶음의 최댓값을 재귀로 구한 뒤, 네 값 중 가장 큰 값을 '두 수 비교' 3번으로 고른다. 점화식이 T(n) = 4T(${F('n','4')}) + 3C, T(1) = C 일 때, n = 4<sup>k</sup> 이면 T(n) 을 n 과 C 의 식으로 쓰시오.</p>`,
   show:'2Cn − C', alt:['2Cn-C','2nC-C','C(2n-1)','-C+2Cn','2*C*n-C'],
   exp:`층마다 묶음 수 4<sup>i</sup> × 3C → 층의 합 3C, 12C, 48C, … (공비 4, k 개) → 3C·${F('4<sup>k</sup> − 1','4 − 1')} = C(n − 1). 맨 아래 4<sup>k</sup> = n 개 × C = Cn. T(n) = C(n − 1) + Cn = 2Cn − C → O(n). 반씩 나눈 2T(${F('n','2')}) + C 와 똑같은 결과라 쪼개는 개수를 바꿔도 O(n) 이다. 공비를 4 가 아니라 2 로 두면 틀린다.`,

 { type:'essay', lv:'상', unit:'카라츠바', pts:10,
   q:`<p>카라츠바 알고리즘의 가운데 항 x·z + y·w 를 <b>(x − y)(w − z)</b> 를 이용해 구하도록 바꾸려 한다. (1) x·z + y·w = x·w + y·z − (x − y)(w − z) 가 성립함을 보이고, (2) 이 식을 쓰면 u·v 하나에 재귀 곱셈이 몇 번 필요한지, (3) 그때의 점화식과 시간복잡도를 쓰시오. (뺄셈 결과가 음수일 때의 부호 처리 비용은 Cn 에 포함된다고 본다)</p>`,
   model:`(1) (x − y)(w − z) = x·w − x·z − y·w + y·z 이므로 x·w + y·z − (x − y)(w − z) = x·z + y·w.<br>(2) x·w 와 y·z 는 맨 앞·맨 뒤 항에 어차피 필요하므로 재활용한다. 새로 하는 곱셈은 (x − y)(w − z) 하나 → 모두 <b>3번</b> (x·w, y·z, (x − y)(w − z)).<br>(3) 세 곱셈 모두 ${F('n','2')}자리 크기(뺄셈은 자릿수가 늘지 않음)이고, 덧셈·뺄셈·자리 밀기는 Cn → T(n) = 3T(${F('n','2')}) + Cn → <b>O(n<sup>log₂3</sup>)</b>.`,

   src:[['03-2','s9','카라츠바'],['03-2','s10','새 점화식'],['03-2','s11','O(n^log₂3)']] },

 { type:'line', lv:'상', unit:'거듭제곱', pts:7,
   q:`<p>다음은 power3 에서 <b>한 줄</b>을 바꾼 것이다. 결과(a<sup>n</sup>)는 언제나 맞게 나오지만, n = 2<sup>k</sup> 일 때 호출 횟수가 2n − 1 번이 되어 power3 의 장점을 잃는다. 바뀐 줄을 고르시오.</p>`,
   code:`
def power3(a, n):
    if n == 1:
        return a
    x = power3(a, n//2)
    if n % 2 == 0:
        return x * power3(a, n//2)
    else:
        return x * x * a`,
   answer:[6],
   exp:`6번 줄은 return x * x 여야 한다. 이미 구한 x 를 다시 쓰지 않고 power3(a, n//2) 를 한 번 더 부르면, n 이 짝수일 때 재귀 호출이 두 번 → 2T(${F('n','2')}) + C 가 되어 power2 처럼 O(n). n = 2<sup>k</sup> 이면 모든 단계가 짝수라 호출 수가 1 + 2 + … + n = 2n − 1. 4번 줄은 원래 power3 와 같다.`,

 { type:'essay', lv:'상', unit:'거듭제곱', pts:9,
   q:`<p>다음 power4 가 a<sup>n</sup> 을 바르게 구하는지, 그리고 시간복잡도가 O(log n) 인지 판정하고 이유를 쓰시오. (n 이 홀수일 때 다음 호출의 n 이 어떻게 되는지를 이용할 것)</p>
<pre>def power4(a, n):
    if n == 1:
        return a
    if n % 2 == 0:
        x = power4(a, n//2)
        return x * x
    else:
