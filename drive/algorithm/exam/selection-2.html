 { type:'line', lv:'중', unit:'Quick Select', pts:8,
   q:`<p>다음은 수업의 quick_select 에서 <b>한 줄</b>이 바뀐 코드이다. quick_select([6, 2, 9, 4, 7], 2) 를 실행하면 4 가 아니라 6 을 반환한다. 바뀐 줄의 번호를 고르시오.</p>`,
   code:`
def quick_select(L, k):
    P = L[0]
    A, B, M = [], [], []
    for x in L:
        if P > x:
            A.append(x)
        elif P < x:
            B.append(x)
        else:
            M.append(x)
    if len(A) > k:
        return quick_select(A, k)
    elif len(A) + len(M) < k:
        return quick_select(B, k - len(A) - len(M))
    else:
        return P`,
   answer:[11],
   exp:`11번 줄은 if len(A) &gt;= k 여야 한다. P = 6 이면 A = [2, 4] 로 |A| = 2 = k 인데, &gt; 로는 A 로 가지 못하고 |A| + |M| = 3 ≥ 2 라 else 로 빠져 피벗 6 을 반환한다. |A| = k 이면 답은 A 안(가장 큰 값)에 있으므로 A 로 재귀해야 한다. 5·7번 줄(P &gt; x, P &lt; x)은 수업 코드와 같다.`,
   src:[['02-1','s5','quick_select 코드·경계 조건']] },

 { type:'short', lv:'중', unit:'귀납법', pts:8,
