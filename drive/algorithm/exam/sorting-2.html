 { type:'short', lv:'중', unit:'퀵 정렬', pts:7,
   q:`<p>다음은 수업의 퀵 정렬 코드이다.</p>
<pre>def quick_sort(A):
    if len(A) &lt;= 1:
        return A
    P = A[0]
    S, M, L = [], [], []
    for x in A:
        if P &gt; x: S.append(x)
        elif P &lt; x: L.append(x)
        else: M.append(x)
    return quick_sort(S) + M + quick_sort(L)</pre>
<p>quick_sort([1, 2, 3, 4, 5, 6]) 을 실행할 때, 모든 재귀 호출을 통틀어 <b>for x in A 의 몸체가 실행되는 횟수</b>를 쓰시오.</p>`,

 { type:'line', lv:'중', unit:'병합 정렬', pts:9,
   q:`<p>merge_sort 는 수업 코드 그대로이고, merge_two_sorted_lists 를 옮겨 적다 <b>한 줄</b>이 바뀌었다. 이 코드로 merge_sort(A, 0, 4) 를 실행하면 A = [7, 3, 6, 2, 5] 가 [2, 7, 3, 6, 5] 가 된다. 바뀐 줄을 고르시오.</p>`,
   code:`
def merge_two_sorted_lists(A, first, last):
    m = (first + last) // 2
    i, j = first, m + 1
    B = []
    while i <= m and j < last:
        if A[i] <= A[j]:
            B.append(A[i])
            i = i + 1
        else:
            B.append(A[j])
            j = j + 1
    for k in range(i, m + 1):
        B.append(A[k])
    for k in range(j, last + 1):
        B.append(A[k])
    for i in range(first, last + 1):
        A[i] = B[i - first]`,
   answer:[5],
   exp:`5번 줄은 j &lt;= last 여야 한다. j &lt; last 이면 뒤 그룹의 마지막 값이 비교에 들어가지 못한다. 길이 2 구간은 j = last 라 비교 없이 그대로 붙어 [7, 3] 이 정렬되지 않고, 마지막 병합도 7·2 만 비교한 뒤 남은 값을 그대로 붙여 [2, 7, 3, 6, 5]. 마지막 줄이 틀렸다면 값이 사라지거나 범위를 벗어난다. (코드는 정리본의 들여쓰기·문법만 고친 형태)`,
   src:[['06-1','s6','병합 정렬 코드']] },

 { type:'short', lv:'중', unit:'제자리 퀵', pts:9,
   q:`<p>교수님의 제자리 퀵 정렬 코드이다.</p>
<pre>def quick_sort(A, first, last):
    if first &gt;= last:
        return
    p = A[first]
    left = first + 1
    right = last
    while left &lt;= right:
        while left &lt;= last and A[left] &lt; p:
            left += 1
        while right &gt; first and A[right] &gt; p:
            right -= 1
        if left &lt;= right:
            A[left], A[right] = A[right], A[left]
    A[first], A[right] = A[right], A[first]
    quick_sort(A, first, right-1)
    quick_sort(A, left, last)</pre>
<p>quick_sort(A, 0, 6) 으로 A = [6, 9, 2, 7, 1, 8, 3] 을 정렬할 때, <b>첫 분할의 피벗 교환까지 끝난 직후</b>(재귀 호출 전)의 A 를 쓰시오.</p>`,
