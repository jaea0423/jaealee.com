{ type:'essay',
   lv:'중',

   q:`<p>power3(a, n) (x = power3(a, n//2) 를 한 번만 호출하고 짝수면 x × x, 홀수면 x × x × a) 에 대해</p><p>(1) power3(2, 13) 을 계산할 때 power3 가 호출되는 횟수와 곱셈 횟수를 쓰시오.<br>(2) T(n) = T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + C 를 전개해 Big-O 를 구하시오.</p>`,
   model:`(1) n = 13 → 6 → 3 → 1 : 호출 <b>4 번</b>. 곱셈: 13 (홀수) 2번, 6 (짝수) 1번, 3 (홀수) 2번 → <b>5 번</b><br>(2) T(n) = T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + C = T(<span class="frac"><span class="num">n</span><span class="den">4</span></span>) + 2C = ⋯ = T(<span class="frac"><span class="num">n</span><span class="den">2<sup>k</sup></span></span>) + kC, n = 2<sup>k</sup> → T(1) + C·log₂ n = C + C log₂ n → <b>O(log n)</b>`,

{ type:'essay',

   model:`(1) <b>[1, 4, 2, 5, 3, 8]</b>, 비교 <b>5 번</b>, 교환 <b>4 번</b> (5↔1, 5↔4, 5↔2, 8↔3)<br>(2) 정렬 결과(값의 순서)는 같지만, 같은 값끼리도 교환해 원래 순서가 뒤집힐 수 있어 <b>stable X</b> 가 된다.`,
   rubric:[[`1라운드 결과`,3],[`비교 5 · 교환 4`,3],[`&gt;= 면 같은 값도 교환 → stable X`,4]],
   src:[["05-1", "s2", "버블 정렬"]] },

{ type:'essay',

   model:`<b>stable 이 깨진다.</b> 두 그룹의 맨 앞 값이 같을 때 &lt; 이면 조건이 거짓이라 뒤 그룹 값이 먼저 B 에 들어간다. 예: 앞 그룹 [3<sub>a</sub>, 5], 뒤 그룹 [1, 3<sub>b</sub>] → 1, 그다음 3<sub>a</sub> vs 3<sub>b</sub> 에서 3<sub>b</sub> 가 먼저 → [1, 3<sub>b</sub>, 3<sub>a</sub>, 5]. 원래 앞에 있던 3<sub>a</sub> 가 뒤로 감. (정렬 결과 값 순서와 시간 O(n log n) 은 그대로)`,

{ type:'essay',

   model:`D[n] = D[n − 1] + D[n − 2], D[1] = 1, D[2] = 1. 5층은 밟을 수 없으므로 <b>D[5] = 0</b> 으로 두면, 5층을 거쳐 오는 경로가 자동으로 빠진다.<br>D = 1, 1, 2, 3, <b>0</b>, 3, 3, <b>6</b> → <b>6 가지</b> (D[6] = D[5] + D[4] = 3, D[7] = D[6] + D[5] = 3, D[8] = D[7] + D[6] = 6)`,
   rubric:[[`점화식 · 바닥 조건`,3],[`D[5] = 0 처리와 이유`,4],[`D[8] = 6 (중간값 맞으면 부분 2점)`,5]],

   head:[`인덱스`,`0`,`1`,`2`,`3`,`4`,`5`],
   rows:[
     [`결과`,{a:`9`,alt:[]},{a:`7`,alt:[]},{a:`8`,alt:[]},{a:`5`,alt:[]},{a:`2`,alt:[]},{a:`6`,alt:[]}]],

   src:[["06-1", "s5", "힙"]] },

{ type:'essay',
   lv:'중',
   unit:"정렬 하한",
   pts:10,
   q:`<p>병합 정렬과 힙 정렬을 "비교 정렬 중 최적" 이라고 하는 이유를 쓰시오. 퀵 정렬이 여기에 들지 않는 이유도 쓰시오.</p>`,
   model:`어떤 비교 정렬이든 최악의 경우 비교가 Ω(n log n) 필요하다 (결정 트리: 리프 n! 개, h ≥ log₂ n! ≥ C·n log n — <b>하한</b>). 병합 · 힙 정렬은 최악에도 O(n log n) (<b>상한</b>) 이라 상한 = 하한 → 차수를 더 줄일 수 없어 최적. 퀵 정렬은 최악이 O(n²) 이라 상한이 하한과 같지 않다.`,

];
