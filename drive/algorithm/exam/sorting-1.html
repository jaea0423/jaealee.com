 { type:'mc', lv:'하', unit:'병합 정렬', pts:6,
   q:`<p>다음은 수업의 merge_two_sorted_lists 이다. 마지막 줄의 빈칸에 알맞은 것은?</p>
<pre>def merge_two_sorted_lists(A, first, last):
    m = (first + last) // 2
    i, j = first, m + 1
    B = []
    while i &lt;= m and j &lt;= last:
        if A[i] &lt;= A[j]:
            B.append(A[i])
            i = i + 1
        else:
            B.append(A[j])
            j = j + 1
    for k in range(i, m + 1):
        B.append(A[k])
    for k in range(j, last + 1):
        B.append(A[k])
    for i in range(first, last + 1):
        A[i] = B[______]</pre>`,
   choices:['i','i − m','i + first','i − first'], answer:[4],
   exp:`B 는 이번 호출에서 새로 만든 배열이라 0 번부터, 되돌려 놓을 A 의 구간은 first 번부터 시작한다 → A[first] ← B[0], A[first + 1] ← B[1], … ① 맨 바깥 호출(first = 0)에서만 맞고, 재귀 중 A[4..6] 같은 구간에서는 B 의 범위를 벗어난다. ② m 은 두 그룹의 경계다. ③ 빼야 할 것을 더했다.`,
