 { type:'line', lv:'상', unit:'제자리 퀵', pts:8,
   q:`<p>교수님의 제자리 퀵 정렬을 옮겨 적다 <b>한 줄</b>을 잘못 적었다. quick_sort(A, 0, 7) 에 A = [5, 8, 1, 9, 3, 7, 2, 6] 을 넣으면, 첫 분할이 끝난 직후(재귀 호출 전) A 가 [9, 2, 1, 3, 5, 7, 8, 6] 이 된다. 잘못 적은 줄을 고르시오.</p>`,
   code:`
def quick_sort(A, first, last):
    if first >= last:
        return
    p = A[first]
    left = first + 1
    right = last
    while left <= right:
        while left <= last and A[left] < p:
            left += 1
        while right > first and A[right] > p:
            right -= 1
        if left <= right:
            A[left], A[right] = A[right], A[left]
    A[first], A[left] = A[left], A[first]
    quick_sort(A, first, right-1)
    quick_sort(A, left, last)`,
   answer:[14],
   exp:`8 ↔ 2, 9 ↔ 3 교환 뒤 [5, 2, 1, 3, 9, 7, 8, 6] 에서 left = 4 (값 9), right = 3 (값 3) 으로 끝난다. 피벗은 작은 쪽의 끝인 <b>right</b> 자리와 바꿔야 [3, 2, 1, 5, 9, 7, 8, 6] 이 된다. left 와 바꾸면 큰 쪽의 첫 값 9 가 맨 앞으로 온다. 8 · 10번 줄의 &lt; · &gt; 는 맞다. (교수님 정리 글의 코드에서 left·right 대입을 두 줄로 나누고, 실행되도록 2 · 3번 줄 기저 조건을 넣었다.)`,
   src:[['05-1','s14','제자리 퀵 코드']] },
