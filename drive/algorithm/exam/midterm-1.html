 { type:'line', lv:'중', unit:'이진탐색', pts:6,
   q:`<p>다음 bs 는 수업 코드에서 <b>한 줄</b>이 바뀌어, k 가 A 에 없을 때 재귀가 끝나지 않는 경우가 생긴다. 바뀐 줄의 번호를 고르시오.</p>`,
   code:`
def bs(A, a, b, k):
    if a > b:
        return -1
    m = (a + b) // 2
    if A[m] == k:
        return m
    elif A[m] > k:
        return bs(A, a, m, k)
    else:
        return bs(A, m+1, b, k)`,
   answer:[8],
   exp:`8번 줄은 bs(A, a, m-1, k) 여야 한다. a = b = m 이고 A[m] &gt; k 이면 bs(A, a, m, k) 는 <b>같은 인자</b>로 다시 호출된다. 예: A = [3, 8, 12, 17, 25, 31, 40], k = 20 → (0,6) → (4,6) → (4,5) → (4,4) → (4,4) → … 10번 줄은 m+1 이라 구간이 반드시 줄어든다.`,

   rubric:['n = 2<sup>k</sup> 가정을 명시함','2~3단계 전개 후 일반항(등비수열 꼴)을 씀','등비수열 합을 바르게 계산함','로그·지수 성질로 n 의 식으로 바꿈','결론 O(n<sup>log₂3</sup>)'],
   src:[['04-2','s4','카라츠바 점화식'],['03-2','s11','O(n^log₂3) 전개']] },

 { type:'short', lv:'중', unit:'분할 정복', pts:5,

<pre>def power3(a, n):

    if n % 2 == 0:
        return x * x
    else:

   choices:['xw, yz, (x + y)(w + z)','xw, yz, xz + yw','xw, xz, (x + y)(w + z)','xz, yw, (x − y)(w − z)'], answer:[1],

 { type:'short', lv:'상', unit:'정렬', pts:8,
   q:`<p>수업의 제자리 퀵 정렬로 A = [5, 3, 8, 1, 9, 2, 7] 을 정렬할 때, <b>첫 번째 분할에서 피벗 교환까지 끝난 직후</b>의 A 를 쓰시오.</p>`,
   show:'[1, 3, 2, 5, 9, 8, 7]', alt:['1 3 2 5 9 8 7'],
   exp:`P = 5. left 는 3 을 지나 8 에서, right 는 7 을 지나 2 에서 멈춤 → 8 ↔ 2 → [5, 3, 2, 1, 9, 8, 7], left = 3, right = 4. left 는 1 을 지나 9 에서, right 는 9 를 지나 1 에서 멈춤 → left &gt; right 라 끝. 피벗 ↔ A[right = 3] → [1, 3, 2, 5, 9, 8, 7].`,
   src:[['05-1','s13','한 단계씩 예시'],['05-1','s14','제자리 퀵 코드']] },

 { type:'line', lv:'상', unit:'정렬', pts:8,
   q:`<p>제자리 퀵 정렬의 분할 부분을 옮겨 적다 <b>한 줄</b>을 잘못 적었다. 이 코드로 [5, 3, 8, 1, 9, 2, 7] 을 분할하면 [1, 3, 7, 5, 9, 2, 8] 이 되어 피벗 5 의 왼쪽에 7, 오른쪽에 2 가 남는다. 잘못 적은 줄을 고르시오.</p>`,
   code:`
P = A[first]
left = first + 1
right = last
while left <= right:
    while left <= last and A[left] < P:
        left += 1
    while right > first and A[right] < P:
        right -= 1
    if left <= right:
        A[left], A[right] = A[right], A[left]
        left += 1
        right -= 1
A[first], A[right] = A[right], A[first]`,
   answer:[7],
   exp:`right 는 'P 보다 큰 값'을 지나가고 P 이하에서 멈춰야 하므로 A[right] &gt; P 가 맞다. &lt; 로 쓰면 오른쪽 끝의 작은 값(2)을 지나쳐 버리고, 큰 값(7)에서 멈춰 엉뚱한 교환이 일어난다. 5번 줄(A[left] &lt; P)은 맞는 줄이다.`,
   src:[['05-1','s14','제자리 퀵 코드']] },

   rubric:['기저 단계 (n = 1)','귀납 가정을 n 보다 작은 모든 k 로 세움','가정을 대입해 44n 까지 정확히 계산','결론 O(n)'],
