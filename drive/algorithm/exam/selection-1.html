 { type:'short', lv:'하', unit:'Quick Select', pts:8,
   q:`<p>다음은 수업의 quick_select 이다. 빈칸에 들어갈 식을 쓰시오.</p>
<pre>def quick_select(L, k):
    P = L[0]
    A, B, M = [], [], []
    for x in L:
        if P &gt; x:
            A.append(x)
        elif P &lt; x:
            B.append(x)
        else:
            M.append(x)
    if len(A) &gt;= k:
        return quick_select(A, k)
    elif len(A) + len(M) &lt; k:
        return quick_select(B, ________)
    else:
        return P</pre>`,
   show:'k - len(A) - len(M)', alt:['k - (len(A) + len(M))','k - len(M) - len(A)'],
   exp:`A 와 M 의 값은 모두 B 의 값보다 작아, 전체 1등부터 |A| + |M| 등까지를 이미 차지한다. 그래서 B 안에서는 (k − |A| − |M|) 번째가 전체의 k 번째다. k 를 그대로 넘기거나 len(A) 만 빼면 M 의 원소 수만큼 순위가 어긋난다.`,
   src:[['02-1','s5','quick_select 코드']] },

 { type:'mc', lv:'하', unit:'MoM', pts:7,
