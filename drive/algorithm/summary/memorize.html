<div class="blk sh"><h2><span class="sn">Ⅰ</span>수행시간</h2><p class=lead>빠른 순서: O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n<sup>1.585</sup>) &lt; O(n²) &lt; O(n³) &lt; 지수</p></div>
<div class="blk"><div class="unit">A 선택 문제</div><table class="mt "><tr><th>알고리즘</th><th>시간</th></tr><tr><td class="nm">최댓값 찾기 (토너먼트도)</td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">Quick Select</td><td class="res"><span class="a">최선 O(n) · 최악 O(n²)</span></td></tr><tr><td class="nm">좋은 피벗 + a ≤ n 가정</td><td class="res"><span class="a">O(n log n)</span></td></tr><tr><td class="nm">MoM</td><td class="res"><span class="a">최악도 O(n)</span></td></tr></table></div>
<div class="blk"><div class="unit">B 분할 정복</div><table class="mt "><tr><th>알고리즘</th><th>시간</th></tr><tr><td class="nm">max 하나 vs 나머지 · 반씩</td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">power1 · power2</td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">power3</td><td class="res"><span class="a">O(log n)</span></td></tr><tr><td class="nm">피보나치 재귀 fibo1</td><td class="res"><span class="a">O(γ<sup>n</sup>), γ ≈ 1.618</span></td></tr><tr><td class="nm">피보나치 행렬 + power3</td><td class="res"><span class="a">O(log n)</span></td></tr><tr><td class="nm">큰 수 곱셈 세로식 · 단순 분할</td><td class="res"><span class="a">O(n²)</span></td></tr><tr><td class="nm">카라츠바</td><td class="res"><span class="a">O(n<sup>log₂ 3</sup>) ≈ O(n<sup>1.585</sup>)</span></td></tr><tr><td class="nm">이진 탐색</td><td class="res"><span class="a">O(log n)</span></td></tr></table></div>
<div class="blk"><div class="unit">C 정렬</div><table class="mt "><tr><th>알고리즘</th><th>시간</th></tr><tr><td class="nm">선택 · 버블 · 삽입</td><td class="res"><span class="a">O(n²)</span></td></tr><tr><td class="nm">퀵 (S/M/L · 제자리)</td><td class="res"><span class="a">평균 O(n log n) · 최악 O(n²)</span></td></tr><tr><td class="nm">병합 정렬</td><td class="res"><span class="a">O(n log n) — 항상</span></td></tr><tr><td class="nm">make_heap (수업 기준)</td><td class="res"><span class="a">O(n log n)</span></td></tr><tr><td class="nm">힙 정렬</td><td class="res"><span class="a">O(n log n) — 항상</span></td></tr><tr><td class="nm">비교 정렬의 하한</td><td class="res"><span class="a">Ω(n log n)</span></td></tr></table></div>
<div class="blk"><div class="unit">D 동적 계획법</div><table class="mt "><tr><th>알고리즘</th><th>시간</th></tr><tr><td class="nm">피보나치 DP · 계단</td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">최대 구간 합 — 단순</td><td class="res"><span class="a">O(n³)</span></td></tr><tr><td class="nm">최대 구간 합 — prefix sum</td><td class="res"><span class="a">O(n²)</span></td></tr><tr><td class="nm">최대 구간 합 — 분할 정복</td><td class="res"><span class="a">O(n log n)</span></td></tr><tr><td class="nm">최대 구간 합 — DP</td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">LCS</td><td class="res"><span class="a">O(nm), n ≈ m 이면 O(n²)</span></td></tr><tr><td class="nm">지그재그</td><td class="res"><span class="a">O(n²)</span></td></tr><tr><td class="nm">행렬 곱셈 순서 (출제 X)</td><td class="res"><span class="a">모든 순서 O(4<sup>n</sup>) → DP O(n³)</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅱ</span>점화식 → Big-O</h2><p class=lead>T(1) = C. 결과만이 아니라 전개 과정을 쓸 수 있어야 함</p></div>
<div class="blk"><table class="mt "><tr><th>점화식</th><th>결과</th><th>어디서</th></tr><tr><td class="eq">T(n − 1) + C</td><td class="res"><span class="a">O(n)</span></td><td class="src">max 하나 vs 나머지 · power1</td></tr><tr><td class="eq">2T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + C</td><td class="res"><span class="a">O(n)</span></td><td class="src">max 반씩 · power2</td></tr><tr><td class="eq">T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + C</td><td class="res"><span class="a">O(log n)</span></td><td class="src">power3 · 이진 탐색</td></tr><tr><td class="eq">T(n − 1) + Cn</td><td class="res"><span class="a">O(n²)</span></td><td class="src">퀵 최악 · Quick Select 최악</td></tr><tr><td class="eq">T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + Cn</td><td class="res"><span class="a">O(n)</span></td><td class="src">Quick Select 최선</td></tr></table></div>
<div class="blk"><table class="mt "><tr><th>점화식</th><th>결과</th><th>어디서</th></tr><tr><td class="eq">2T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + Cn</td><td class="res"><span class="a">O(n log n)</span></td><td class="src">병합 · 퀵 평균 · 구간 합 분할</td></tr><tr><td class="eq">3T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + Cn</td><td class="res"><span class="a">O(n<sup>log₂ 3</sup>)</span></td><td class="src">카라츠바</td></tr><tr><td class="eq">4T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + Cn</td><td class="res"><span class="a">O(n²)</span></td><td class="src">큰 수 단순 분할</td></tr><tr><td class="eq">T(n − 1) + T(n − 2) + C</td><td class="res"><span class="a">O(γ<sup>n</sup>)</span></td><td class="src">fibo1</td></tr><tr><td class="eq">T(<span class="frac"><span class="num">3n</span><span class="den">4</span></span>) + T(<span class="frac"><span class="num">n</span><span class="den">5</span></span>) + <span class="frac"><span class="num">11n</span><span class="den">5</span></span></td><td class="res"><span class="a">O(n)</span></td><td class="src">MoM (T(n) ≤ 44n)</td></tr></table></div>
<div class="blk"><div class="box"><b>전개 순서</b><ol><li>T( ) 안을 같은 식으로 2 ~ 3번 대입해 펼침</li><li>k 번 펼친 일반항을 씀</li><li>n = 2<sup>k</sup> 가정 → <span class="frac"><span class="num">n</span><span class="den">2<sup>k</sup></span></span> = 1, T(1) = C</li><li>남은 합 계산 (C 가 k 개 · 등비수열) → k = log₂ n 대입 → 최고차항만</li></ol>
<b>쓰는 공식</b><ul><li>등비수열 합 (초항 a, 공비 r &gt; 1, k 개) = <span class="frac"><span class="num">a(r<sup>k</sup> − 1)</span><span class="den">r − 1</span></span></li><li>1 + <span class="frac"><span class="num">1</span><span class="den">2</span></span> + <span class="frac"><span class="num">1</span><span class="den">4</span></span> + ⋯ &lt; 2</li><li>4<sup>k</sup> = (2<sup>k</sup>)² = n² · 3<sup>log₂ n</sup> = n<sup>log₂ 3</sup></li><li>n = c<sup>k</sup> ⟺ k = log<sub>c</sub> n (재귀 횟수)</li></ul></div></div>
<div class="blk sh"><h2><span class="sn">Ⅲ</span>비교 횟수 · 숫자</h2></div>
<div class="blk"><table class="mt "><tr><th>무엇</th><th>값</th></tr><tr><td class="nm">최댓값 (토너먼트도 같음)</td><td class="res"><span class="a">n − 1</span></td></tr><tr><td class="nm">최대 + 최소 동시에</td><td class="res"><span class="a"><span class="frac"><span class="num">3</span><span class="den">2</span></span>n − 2</span></td></tr><tr><td class="nm">최소 + 두 번째로 작은 값</td><td class="res"><span class="a">n + ⌈log₂ n⌉ − 2</span></td></tr><tr><td class="nm">선택 정렬 비교 · 교환</td><td class="res"><span class="a"><span class="frac"><span class="num">(n − 1)n</span><span class="den">2</span></span> · 항상 n − 1</span></td></tr><tr><td class="nm">버블 정렬 비교 · 교환</td><td class="res"><span class="a"><span class="frac"><span class="num">(n − 1)n</span><span class="den">2</span></span> · 최악 <span class="frac"><span class="num">(n − 1)n</span><span class="den">2</span></span></span></td></tr><tr><td class="nm">삽입 정렬 비교</td><td class="res"><span class="a">최악 <span class="frac"><span class="num">(n − 1)n</span><span class="den">2</span></span> · 정렬된 입력 n − 1</span></td></tr></table></div>
<div class="blk"><table class="mt "><tr><th>무엇</th><th>값</th></tr><tr><td class="nm">정렬된 두 그룹 병합 (p, q 개)</td><td class="res"><span class="a">최대 p + q − 1</span></td></tr><tr><td class="nm">비교 정렬 최악의 비교 수 하한</td><td class="res"><span class="a">⌈log₂ n!⌉ (n = 3 → 3, 4 → 5, 5 → 7)</span></td></tr><tr><td class="nm">MoM 5 개의 median</td><td class="res"><span class="a">비교 6 번 · 2단계 합 <span class="frac"><span class="num">6n</span><span class="den">5</span></span></span></td></tr><tr><td class="nm">MoM 분할 후 크기</td><td class="res"><span class="a">|A|, |B| ≤ <span class="frac"><span class="num">3n</span><span class="den">4</span></span> (c = <span class="frac"><span class="num">4</span><span class="den">3</span></span>)</span></td></tr><tr><td class="nm">힙 인덱스 (A[k])</td><td class="res"><span class="a">자식 2k + 1, 2k + 2 · 부모 (k − 1) // 2</span></td></tr><tr><td class="nm">행렬 p × q 곱하기 q × r</td><td class="res"><span class="a">O(pqr)</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅳ</span>정렬 성질</h2><p class=lead>in-place = 새 리스트 · 배열을 만드는가 · stable = 같은 값의 원래 순서 보장</p></div>
<div class="blk"><table class="mt "><tr><th>정렬</th><th>in-place</th><th>stable</th><th>근거</th></tr><tr><td class="nm">선택</td><td class="c"><span class="a">O</span></td><td class="c"><span class="a">X</span></td><td class="why"><span class="a">최댓값을 멀리 떨어진 끝 칸과 교환</span></td></tr><tr><td class="nm">버블</td><td class="c"><span class="a">O</span></td><td class="c"><span class="a">O</span></td><td class="why"><span class="a">이웃끼리, 클 때만 (&gt;) — &gt;= 면 X</span></td></tr><tr><td class="nm">삽입</td><td class="c"><span class="a">O</span></td><td class="c"><span class="a">O</span></td><td class="why"><span class="a">같은 값에서 멈춤 (&gt;) — &gt;= 면 X</span></td></tr><tr><td class="nm">퀵 S/M/L</td><td class="c"><span class="a">X</span></td><td class="c"><span class="a">O</span></td><td class="why"><span class="a">새 리스트 S, M, L · for x in A 순서대로</span></td></tr><tr><td class="nm">제자리 퀵</td><td class="c"><span class="a">O</span></td><td class="c"><span class="a">X</span></td><td class="why"><span class="a">A 안에서 교환 · 멀리 떨어진 교환</span></td></tr><tr><td class="nm">병합</td><td class="c"><span class="a">X</span></td><td class="c"><span class="a">O</span></td><td class="why"><span class="a">새 배열 B · 같으면 앞 그룹 먼저 (&lt;=)</span></td></tr><tr><td class="nm">힙 정렬</td><td class="c"><span class="a">O</span></td><td class="c"><span class="a">X</span></td><td class="why"><span class="a">A[0] ↔ A[i] 먼 교환</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅴ</span>설명 보고 알고리즘 맞히기</h2><p class=lead>가리기 모드에서 왼쪽 이름을 떠올려 보세요</p></div>
<div class="blk"><table class="mt "><tr><th>이름</th><th>설명</th></tr><tr><td class="nm"><span class="a">토너먼트</span></td><td class="">둘씩 붙여 이긴 쪽만 올라감. 두 번째로 작은 값은 최솟값에게 직접 진 원소 중에</td></tr><tr><td class="nm"><span class="a">Quick Select</span></td><td class="">피벗으로 A · M · B 로 나누고 k 번째가 있는 한쪽만 재귀. B 로 가면 k − |A| − |M|</td></tr><tr><td class="nm"><span class="a">MoM</span></td><td class="">5개씩 묶어 median → median 들의 median 을 피벗으로</td></tr><tr><td class="nm"><span class="a">power3</span></td><td class="">a<sup>n//2</sup> 를 한 번만 구해 x 에 담고 x · x (홀수면 · a)</td></tr><tr><td class="nm"><span class="a">카라츠바</span></td><td class="">곱셈 4번 → 3번: xz + yw = (x + y)(w + z) − xw − yz</td></tr><tr><td class="nm"><span class="a">이진 탐색</span></td><td class="">정렬된 리스트에서 가운데와 비교해 절반을 버림. 없으면 −1</td></tr><tr><td class="nm"><span class="a">선택 정렬</span></td><td class="">남은 구간의 최댓값을 그 구간 끝 칸과 교환</td></tr><tr><td class="nm"><span class="a">버블 정렬</span></td><td class="">이웃 둘을 비교해 앞이 크면 교환 → 최댓값이 끝으로</td></tr></table></div>
<div class="blk"><table class="mt "><tr><th>이름</th><th>설명</th></tr><tr><td class="nm"><span class="a">삽입 정렬</span></td><td class="">새 값을 정렬된 앞부분에 뒤에서부터 비교하며 끼워 넣음</td></tr><tr><td class="nm"><span class="a">퀵 정렬</span></td><td class="">피벗보다 작은 · 같은 · 큰 값으로 나누고 양쪽 재귀</td></tr><tr><td class="nm"><span class="a">병합 정렬</span></td><td class="">강제로 반반 → 각각 정렬 → 맨 앞끼리 비교해 B 에 채움</td></tr><tr><td class="nm"><span class="a">힙 정렬</span></td><td class="">make_heap → A[0] ↔ 구간 끝 → heapify_down 반복</td></tr><tr><td class="nm"><span class="a">최대 구간 합 DP</span></td><td class="">S[k] = A[k] 로 끝나는 최대 합. 앞이 음수면 새로 시작</td></tr><tr><td class="nm"><span class="a">LCS</span></td><td class="">같으면 좌상 + 1, 다르면 max(좌, 상). 화살표 거꾸로 → 문자열</td></tr><tr><td class="nm"><span class="a">지그재그</span></td><td class="">A[k] 로 끝나는 길이를 low (내려옴) · high (올라감) 에</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅵ</span>DP 점화식</h2><p class=lead>① 작은 문제로 나누기 ② 점화식 ③ DP 테이블을 순서대로 채우기 (④ 검증은 신경 쓰지 않음)</p></div>
<div class="blk"><table class="mt dp"><tr><th>문제</th><th>바닥</th><th>점화식</th><th>시간</th></tr><tr><td class="nm">피보나치</td><td class=""><span class="a">F[0] = 0, F[1] = 1</span></td><td class=""><span class="a">F[i] = F[i − 1] + F[i − 2]</span></td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">계단 (1칸 · 2칸)</td><td class=""><span class="a">A[1] = A[2] = 1</span></td><td class=""><span class="a">A[n] = A[n − 1] + A[n − 2]</span></td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">최대 구간 합</td><td class=""><span class="a">S[0] = A[0]</span></td><td class=""><span class="a">S[k] = max(S[k − 1] + A[k], A[k]) · 답 max(S)</span></td><td class="res"><span class="a">O(n)</span></td></tr><tr><td class="nm">prefix sum</td><td class=""><span class="a">P[0] = A[0]</span></td><td class=""><span class="a">P[i] = P[i − 1] + A[i] · 구간 합 P[j] − P[i − 1]</span></td><td class="res"><span class="a">O(n)</span></td></tr></table></div>
<div class="blk"><table class="mt dp"><tr><th>문제</th><th>바닥</th><th>점화식</th><th>시간</th></tr><tr><td class="nm">LCS</td><td class=""><span class="a">0 행 · 0 열 = 0</span></td><td class=""><span class="a">같으면 [i − 1][j − 1] + 1 · 다르면 max([i][j − 1], [i − 1][j])</span></td><td class="res"><span class="a">O(nm)</span></td></tr><tr><td class="nm">지그재그</td><td class=""><span class="a">low = high = 1</span></td><td class=""><span class="a">A[j] &gt; A[k] → low[k] = high[j] + 1 · A[j] &lt; A[k] → high[k] = low[j] + 1</span></td><td class="res"><span class="a">O(n²)</span></td></tr><tr><td class="nm">행렬 곱셈 순서 (출제 X)</td><td class=""><span class="a">DP[i][i] = 0</span></td><td class=""><span class="a">min<sub>k</sub>(DP[i][k] + DP[k + 1][j] + P[i] · P[k + 1] · P[j + 1])</span></td><td class="res"><span class="a">O(n³)</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅶ</span>자주 틀리는 것</h2></div>
<div class="blk"><table class="mt traps"><tr><th>✗ 틀린 생각</th><th>✓ 바른 답</th></tr><tr><td class="x">2T(<span class="frac"><span class="num">n</span><span class="den">2</span></span>) + C = O(n log n)</td><td class=""><span class="a">O(n). n log n 은 + Cn 일 때</span></td></tr><tr><td class="x">반씩 쪼개면 무조건 빨라진다</td><td class=""><span class="a">power2 처럼 같은 값을 2번 부르면 O(n)</span></td></tr><tr><td class="x">Quick Select 최악 O(n log n)</td><td class=""><span class="a">O(n²). n log n 은 좋은 피벗 + a ≤ n</span></td></tr><tr><td class="x">MoM 의 X 원소 &lt; m*</td><td class=""><span class="a">≤ m* (m* 자신 포함)</span></td></tr><tr><td class="x">선택 정렬 교환은 최악 n − 1</td><td class=""><span class="a">항상 n − 1 (조건 없이 교환)</span></td></tr><tr><td class="x">버블 · 삽입은 무조건 stable</td><td class=""><span class="a">부등호가 &gt;= 면 stable X</span></td></tr><tr><td class="x">병합 정렬 최악 O(n²)</td><td class=""><span class="a">항상 반반 → 항상 O(n log n)</span></td></tr></table></div>
<div class="blk"><table class="mt traps"><tr><th>✗ 틀린 생각</th><th>✓ 바른 답</th></tr><tr><td class="x">A[i] = B[i]</td><td class=""><span class="a">A[i] = B[i − first]</span></td></tr><tr><td class="x">heapify_down 은 작은 자식과</td><td class=""><span class="a">큰 자식과 교환</span></td></tr><tr><td class="x">n! ≤ (<span class="frac"><span class="num">n</span><span class="den">2</span></span>)<sup><span class="frac"><span class="num">n</span><span class="den">2</span></span></sup></td><td class=""><span class="a">n! ≥ (<span class="frac"><span class="num">n</span><span class="den">2</span></span>)<sup><span class="frac"><span class="num">n</span><span class="den">2</span></span></sup> — 작게 바꿔 받침</span></td></tr><tr><td class="x">하한 3 = 모든 입력에서 3번</td><td class=""><span class="a">최악의 경우 3번 (트리 높이)</span></td></tr><tr><td class="x">S[n − 1] 이 최대 구간 합</td><td class=""><span class="a">S 전체의 최댓값 max(S)</span></td></tr><tr><td class="x">low · high 를 0 으로 시작</td><td class=""><span class="a">1 로 시작 (수 하나도 길이 1)</span></td></tr><tr><td class="x">LCS 같으면 max(좌, 상) + 1</td><td class=""><span class="a">같으면 좌상 + 1</span></td></tr></table></div>
</template>
<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const masthead=`<header class="masthead">
  <div class="mh-top"><span class="org">Kangwon National University CSE</span><span class="subj">알고리즘</span></div>
  <div class="mh-title"><div class="y">중간고사 10/26 (월) 대비</div><h1>암기노트</h1></div>
  <div class="scope"><span class="h">범 위</span><div class="b"><b>2주차 1차시 ~ 8주차 1차시</b> — 선택 문제 · 분할 정복 · 정렬 · 동적 계획법 (행렬 곱셈 순서 문제는 출제 제외)<br>「답 가리기」를 켜면 굵은 답 칸이 가려지고, 누르면 하나씩 보입니다.</div></div></header>`;
const running=`<div class="running"><span>알고리즘 암기노트</span><span><b>알고리즘</b></span></div>`;
const blocks=[...$('#src').content.children].map(e=>e.outerHTML);
function paginate(){
  const PAGE_H=1180, PAD=40+70;
  const m=document.createElement('section'); m.className='page measure';
  m.innerHTML=masthead+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  document.body.appendChild(m);
  const capFirst=PAGE_H-PAD-m.querySelector('.masthead').offsetHeight-18-4;
  m.innerHTML=running+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  const capRest=PAGE_H-PAD-m.querySelector('.running').offsetHeight-18-4;
  const els=$$('#mcol>.blk',m), hs=els.map(e=>e.offsetHeight), sh=els.map(e=>e.classList.contains('sh'));
  m.remove();
  // 제목 블록은 바로 다음 블록과 묶어서 배치
  const units=[]; for(let i=0;i<blocks.length;i++){ if(sh[i]&&i+1<blocks.length){units.push({ids:[i,i+1],h:hs[i]+hs[i+1]});i++;} else units.push({ids:[i],h:hs[i]}); }
  const pages=[]; let p=null, side='R', used=0;
  const cap=()=>pages.length===1?capFirst:capRest;
  units.forEach(u=>{
    if(!p||used+u.h>cap()&&used>0){ if(!p||side==='R'){p={L:[],R:[]};pages.push(p);side='L';} else side='R'; used=0; }
    p[side].push(...u.ids); used+=u.h;
  });
  return pages;
}
function render(){
  const P=paginate(), total=P.length;
  $('#book').innerHTML=P.map((pg,i)=>`<section class="page">${i===0?masthead:running}<div class="cols"><div class="col">${pg.L.map(k=>blocks[k]).join('')}</div><div class="col">${pg.R.map(k=>blocks[k]).join('')}</div></div><div class="pno">${i+1} / ${total}</div></section>`).join('');
}
const A4W=793.7, A4H=1122.5, PW=860;
function preparePrint(){
  document.body.classList.add('printing');
  const pages=$$('#book .page'); const base=A4W/PW, sheet=A4H/base;
  pages.forEach(p=>{p.style.zoom='';p.style.height='';});
  pages.forEach(p=>{const h=p.scrollHeight; if(h<=sheet){p.style.zoom=base;p.style.height=sheet+'px';} else {p.style.zoom=A4H/h-0.0005;p.style.height=h+'px';}});
  if(pages.length) pages[pages.length-1].classList.add('lastprint');
}
function afterPrint(){ document.body.classList.remove('printing'); $$('#book .page').forEach(p=>{p.style.zoom='';p.style.height='';p.classList.remove('lastprint');}); }
window.addEventListener('beforeprint',preparePrint); window.addEventListener('afterprint',afterPrint);
window.__memoPrint={prepare:preparePrint,done:afterPrint};
function setQuiz(on){ document.body.classList.toggle('quiz',on); $('#quizBtn').classList.toggle('on',on); $('#quizBtn').textContent=on?'답 보이기':'답 가리기'; $$('.a.show').forEach(e=>e.classList.remove('show')); }
function boot(){
  render();
  $('#quizBtn').onclick=()=>setQuiz(!document.body.classList.contains('quiz'));
  document.addEventListener('click',e=>{const a=e.target.closest('.a'); if(a&&document.body.classList.contains('quiz')) a.classList.toggle('show');});
  $('#printBtn').onclick=()=>{ const q=document.body.classList.contains('quiz'); setQuiz(false); window.print(); if(q) setQuiz(true); };
  $('#printBlank').onclick=()=>{ setQuiz(true); document.body.classList.add('printblank'); window.print(); document.body.classList.remove('printblank'); };
}
const fams=['400 16px "Nanum Myeongjo"','800 16px "Nanum Myeongjo"','400 16px "Nanum Gothic"','700 16px "Nanum Gothic"'];
const wait=document.fonts?Promise.all(fams.map(f=>document.fonts.load(f,'가A1').catch(()=>{}))):Promise.resolve();
const start=()=>Promise.race([wait,new Promise(r=>setTimeout(r,2000))]).then(boot);
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
</body>
</html>
