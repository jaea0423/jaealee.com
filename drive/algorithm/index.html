<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알고리즘 · Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F4F6F9; --surface:#FFFFFF; --border:#E2E7ED; --text:#1B2430; --text-2:#5C6675; --accent:#2F6FED; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); line-height:1.6;
        display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .box{ max-width:440px; text-align:center; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
            color:var(--accent); margin-bottom:10px; }
  h1{ font-size:26px; font-weight:700; letter-spacing:-.01em; }
  p{ margin-top:10px; color:var(--text-2); font-size:14px; }
  a.back{ display:inline-block; margin-top:24px; font-family:'JetBrains Mono',monospace; font-size:13px;
          color:var(--accent); text-decoration:none; border:1px solid var(--border); background:var(--surface);
          border-radius:8px; padding:8px 16px; }
  a.back:hover{ border-color:var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">2026 2학기</div>
    <h1>알고리즘</h1>
    <p>준비 중입니다. 자료가 정리되면 이곳에 올라옵니다.</p>
    <a class="back" href="/drive/">← Drive</a>
  </div>
</body>
</html>
