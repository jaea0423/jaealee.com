<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive · jaealee</title>
<!-- 폰트: 본문은 Noto Sans KR(한글 가독성), 라벨/개수는 JetBrains Mono(사무적 느낌) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== 색상/간격 토큰 (light theme) ===== */
  :root{
    --bg:        #F4F6F9;   /* 페이지 배경 (밝은 쿨 그레이) */
    --surface:   #FFFFFF;   /* 카드 표면 */
    --surface-2: #FBFCFD;   /* 빈 영역 표면 */
    --border:    #E2E7ED;   /* 기본 테두리 */
    --border-2:  #D3DAE3;   /* 진한 테두리(호버 등) */
    --text:      #1B2430;   /* 본문 글자 (거의 검정) */
    --text-2:    #5C6675;   /* 보조 글자 */
    --text-3:    #8A93A1;   /* 흐린 글자(메타) */
    --accent:    #2F6FED;   /* 포인트 파랑 */
    --accent-bg: #EAF1FE;   /* 포인트 연한 배경 */
    --radius:    12px;
    --gap:       14px;
    --maxw:      980px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Noto Sans KR', sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:0 20px 80px;
  }
  /* 고정폭 글꼴을 쓰는 라벨/숫자 공통 클래스 */
  .mono{ font-family:'JetBrains Mono', monospace; }
  .wrap{ max-width:var(--maxw); margin:0 auto; }
  /* ===== 상단 헤더 ===== */
  .page-head{
    padding:48px 0 28px;
    border-bottom:1px solid var(--border);
    margin-bottom:32px;
  }
  .page-head .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  .page-head h1{
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .page-head p{
    margin-top:6px;
    color:var(--text-2);
    font-size:14px;
  }
  /* ===== 섹션 ===== */
  .section{ margin-bottom:24px; }
  /* 섹션별 폴더 색상 테마 (--c-body=폴더 면, --c-tab=탭, --c-accent=글자, --c-dot=점) */
  .section.summer{ --c-body:#FCEFC9; --c-tab:#F7D277; --c-accent:#8F6300; --c-dot:#F2B12A; }
  .section.fall  { --c-body:#DEE9FD; --c-tab:#B2CDFA; --c-accent:#1E4FD6; --c-dot:#3B82F6; }
  .section.drive { --c-body:#D6F0E1; --c-tab:#A4DCBE; --c-accent:#0F7A40; --c-dot:#1FA563; }
  .section.past  { --c-body:#E6E9EF; --c-tab:#CCD3DD; --c-accent:#566273; --c-dot:#96A0AE; }
  /* 섹션 제목 앞 색상 점(폴더 색과 매칭) */
  .sec-dot{
    flex:0 0 auto;
    width:11px; height:11px;
    border-radius:3px;
    background:var(--c-dot, var(--border-2));
  }
  /* 섹션 헤더 = 펼침/접힘 버튼 */
  .sec-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    border-bottom:1px solid var(--border);
    padding:12px 4px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    transition:border-color .15s ease;
  }
  .sec-head:hover{ border-color:var(--border-2); }
  .sec-head:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-radius:6px;
  }
  /* 펼침/접힘 화살표 */
  .chevron{
    flex:0 0 auto;
    width:16px; height:16px;
    color:var(--text-3);
    transition:transform .2s ease;
  }
  .sec-head[aria-expanded="true"] .chevron{ transform:rotate(90deg); }
  .sec-title{
    font-size:17px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  /* 항목 개수 배지 */
  .sec-count{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-3);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:2px 9px;
    margin-left:auto;
  }
  /* 섹션 본문: grid-rows 트릭으로 부드럽게 펼침/접힘 */
  .sec-body{
    display:grid;
    grid-template-rows:1fr;
    transition:grid-template-rows .25s ease;
  }
  .sec-body[hidden]{ display:grid; }          /* hidden이어도 grid 유지 */
  .sec-head[aria-expanded="false"] + .sec-body{ grid-template-rows:0fr; }
  .sec-body > .sec-inner{
    overflow:hidden;
    min-height:0;
    padding-top:16px;
  }
  /* ===== 카드 그리드 ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(158px, 1fr)); /* 한 줄에 더 많이 → 폴더 좁게 */
    gap:var(--gap);
  }
  /* ===== 폴더 모양 카드(링크) ===== */
  /* 색은 섹션별 변수(--c-body / --c-tab / --c-accent)에서 받아온다 */
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:12px;                  /* 위쪽 탭(돌출부) 자리 확보 */
    background:var(--c-body, var(--surface));
    border:1px solid rgba(27,36,48,.10);
    border-radius:3px 12px 12px 12px; /* 왼쪽 위만 각지게 → 탭과 연결되는 폴더 모양 */
    padding:16px 16px 14px;
    text-decoration:none;
    color:var(--text);
    min-height:92px;
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  /* 폴더 탭: 카드 왼쪽 위의 돌출부 */
  .card::before{
    content:'';
    position:absolute;
    top:-11px; left:0;
    width:44%; height:13px;
    background:var(--c-tab, var(--border));
    border-radius:6px 6px 0 0;
    clip-path:polygon(0 0, 76% 0, 100% 100%, 0 100%); /* 오른쪽을 비스듬히 깎아 폴더 느낌 */
  }
  .card:hover{
    border-color:rgba(27,36,48,.20);
    box-shadow:0 6px 16px rgba(27,36,48,.13);
    transform:translateY(-2px);
  }
  .card:focus-visible{
    outline:2px solid var(--c-accent, var(--accent));
    outline-offset:2px;
  }
  .card-kicker{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--c-accent, var(--accent));
  }
  .card-title{
    font-size:15px;
    font-weight:700;
    margin-top:auto;                  /* 제목을 카드 하단으로 정렬 */
  }
  .card-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:rgba(27,36,48,.50);
  }
  /* ===== 빈 영역 안내(폴더 모양 유지) ===== */
  .empty{
    position:relative;
    margin-top:12px;
    border:1px dashed rgba(27,36,48,.22);
    border-radius:3px 12px 12px 12px;
    background:var(--c-body, var(--surface-2));
    padding:30px 20px;
    text-align:center;
    color:var(--text-2);
    font-size:14px;
  }
  .empty::before{
    content:'';
    position:absolute;
    top:-11px; left:0;
    width:30%; height:13px;
    background:var(--c-tab, var(--border));
    border-radius:6px 6px 0 0;
    clip-path:polygon(0 0, 76% 0, 100% 100%, 0 100%);
  }
  .empty .mono{ color:rgba(27,36,48,.48); font-size:12px; display:block; margin-top:4px; }
  /* ===== 모바일 ===== */
  @media (max-width:520px){
    .page-head{ padding:36px 0 22px; }
    .page-head h1{ font-size:25px; }
    .grid{ grid-template-columns:repeat(2, 1fr); } /* 모바일은 2칸 유지 */
  }
  /* 모션 최소화 설정 존중 */
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- ===== 상단 헤더 ===== -->
  <header class="page-head">
    <div class="eyebrow">jaealee.com / drive</div>
    <h1>Drive</h1>
    <p>학기 자료와 문서를 모아두는 공간입니다.</p>
  </header>
  <!-- ===========================================================
       섹션 1 · 2026 여름학기  (기본 펼침, 카드 1개)
       =========================================================== -->
  <section class="section summer">
    <button class="sec-head" aria-expanded="true" aria-controls="sec-summer">
      <!-- 화살표 아이콘 -->
      <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sec-dot"></span>
      <span class="sec-title">2026 여름학기</span>
      <span class="sec-count">1개</span>
    </button>
    <div class="sec-body" id="sec-summer">
      <div class="sec-inner">
        <div class="grid">
          <a class="card" href="/drive/data-intro/">
            <span class="card-kicker">여름학기</span>
            <span class="card-title">데이터활용개론</span>
            <span class="card-meta">data-intro</span>
          </a>
        </div>
      </div>
    </div>
  </section>
  <!-- ===========================================================
       섹션 2 · 2026 2학기  (기본 펼침, 카드 7개)
       =========================================================== -->
  <section class="section fall">
    <button class="sec-head" aria-expanded="true" aria-controls="sec-fall">
      <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sec-dot"></span>
      <span class="sec-title">2026 2학기</span>
      <span class="sec-count">7개</span>
    </button>
    <div class="sec-body" id="sec-fall">
      <div class="sec-inner">
        <div class="grid">
          <a class="card" href="/drive/datastructure/"><span class="card-kicker">2학기</span><span class="card-title">자료구조</span><span class="card-meta">datastructure</span></a>
          <a class="card" href="/drive/web/"><span class="card-kicker">2학기</span><span class="card-title">웹프로그래밍</span><span class="card-meta">web</span></a>
          <a class="card" href="/drive/linux/"><span class="card-kicker">2학기</span><span class="card-title">리눅스프로그래밍</span><span class="card-meta">linux</span></a>
          <a class="card" href="/drive/discrete/"><span class="card-kicker">2학기</span><span class="card-title">AI이산구조</span><span class="card-meta">discrete</span></a>
          <a class="card" href="/drive/ai-intro/"><span class="card-kicker">2학기</span><span class="card-title">모두의인공지능</span><span class="card-meta">ai-intro</span></a>
          <a class="card" href="/drive/ai-ethics/"><span class="card-kicker">2학기</span><span class="card-title">인공지능시대의윤리</span><span class="card-meta">ai-ethics</span></a>
          <a class="card" href="/drive/disease-history/"><span class="card-kicker">2학기</span><span class="card-title">전염병과인류의역사</span><span class="card-meta">disease-history</span></a>
        </div>
      </div>
    </div>
  </section>
  <!-- ===========================================================
       섹션 3 · 드라이브  (기본 펼침, 개수 제한 없음 / 현재 비어있음)
       항목이 생기면 아래 .empty 블록을 <div class="grid"> + 카드들로 교체하세요.
       =========================================================== -->
  <section class="section drive">
    <button class="sec-head" aria-expanded="true" aria-controls="sec-drive">
      <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sec-dot"></span>
      <span class="sec-title">드라이브</span>
      <span class="sec-count">0개</span>
    </button>
    <div class="sec-body" id="sec-drive">
      <div class="sec-inner">
        <div class="empty">
          아직 항목이 없습니다.
          <span class="mono">// 카드를 추가하면 여기에 쌓입니다</span>
        </div>
      </div>
    </div>
  </section>
  <!-- ===========================================================
       섹션 4 · 지난 도큐멘트  (기본 접힘, 개수 제한 없음 / 현재 비어있음)
       끝난 학기 자료를 여기로 내려 보관하세요.
       =========================================================== -->
  <section class="section past">
    <button class="sec-head" aria-expanded="false" aria-controls="sec-past">
      <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sec-dot"></span>
      <span class="sec-title">지난 도큐멘트</span>
      <span class="sec-count">0개</span>
    </button>
    <div class="sec-body" id="sec-past">
      <div class="sec-inner">
        <div class="empty">
          아직 보관된 문서가 없습니다.
          <span class="mono">// 끝난 학기 자료를 여기로 옮겨 보관합니다</span>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
  // 섹션 헤더 클릭 시 펼침/접힘 토글
  document.querySelectorAll('.sec-head').forEach(function(btn){
    btn.addEventListener('click', function(){
      // 현재 상태 반전 (aria-expanded 값으로 CSS가 알아서 애니메이션 처리)
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
    });
  });
</script>
</body>
</html>
