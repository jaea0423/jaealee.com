const EXAM = [
{ type:'ox',
   lv:'기초',
   unit:"진리값 계산",
   pts:12,
   q:`<p>p = T, q = F일 때의 진리값과 조건 명제에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`~p → q 의 진리값은 T이다.`,true],[`(p ∨ q) → (p ∧ q) 의 진리값은 F이다.`,true],[`p ∧ q 가 F이므로 p ∨ q 도 F이다.`,false],[`p → q 의 진리값은 F이다.`,true],[`일반적으로 p → q 가 T이면 p는 반드시 T이다.`,false],[`일반적으로 p = F, q = F일 때 p → q 와 ~p → q 의 진리값은 같다.`,false]],
   exp:`<b>ㄱ (T)</b> ~p = F이므로 F → F = T입니다. 가정이 F이면 조건 명제는 항상 T입니다.<br><b>ㄴ (T)</b> p ∨ q = T, p ∧ q = F이므로 T → F = F입니다.<br><b>ㄷ (F)</b> p ∨ q 는 둘 중 하나만 T여도 T입니다. p = T이므로 <b>T</b>입니다.<br><b>ㄹ (T)</b> 가정 T, 결론 F인 유일한 F 경우입니다(6장 교안 10쪽).<br><b>ㅁ (F)</b> p = F이면 q와 관계없이 p → q 는 T입니다. 그래서 p → q 가 T라도 p가 F일 수 있습니다.<br><b>ㅂ (F)</b> p → q = F → F = T, ~p → q = T → F = F로 <b>다릅니다</b>. 교수님이 교안 〈표 6.4〉 머리글 "~p → q"는 오류이고 p → q가 맞다고 짚으신 이유입니다.`,
   src:[["04-2", "s2", "명제와 논리 연산"]] },

{ type:'ox',
   lv:'기초',
   unit:"명제 · 술어 구분",
   pts:10,
   q:`<p>Proposition(명제)과 Predicate logic(술어 논리)을 구분하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`참이 아닌 문장은 명제가 될 수 없다.`,false],[`"영철이는 남자다."와 "민수는 남자다."를 명제 논리로 각각 p, q로 쓰면 두 문장이 같은 성질을 말한다는 점이 드러나지 않는다.`,true],[`남자(영철)에서 괄호 안의 "영철"이 술어이다.`,false],[`아버지(김춘추, 영철)처럼 대상이 둘인 술어로는 두 대상 사이의 관계를 나타낼 수 있다.`,true],[`남자(x)는 x에 어떤 대상이 들어가느냐에 따라 T 또는 F가 달라진다.`,true]],
   exp:`<b>ㄱ (F)</b> 거짓으로 명확히 정해지는 문장도 명제입니다. 기준은 참·거짓이 하나로 정해지는가입니다.<br><b>ㄴ (T)</b> 술어 논리로 남자(영철), 남자(민수)라고 쓰면 같은 술어 "남자"로 공통점이 드러납니다.<br><b>ㄷ (F)</b> 괄호 밖 "남자"가 <b>술어</b>(성질)이고, 괄호 안 "영철"은 <b>대상</b>입니다.<br><b>ㄹ (T)</b> 술어 논리에서는 대상들 간의 관계도 나타낼 수 있습니다(6장 교안 11쪽). 대상이 하나인 남자(영철)는 성질입니다.<br><b>ㅁ (T)</b> 술어 논리는 변수의 값에 따라 T 또는 F가 결정됩니다(6장 교안 11쪽).`,
   src:[["04-2", "s2", "명제와 논리 연산"], ["04-2", "s3", "술어 논리"]] },

{ type:'ox',
   lv:'기초',
   unit:"추론 종류 구분",
   pts:12,
   q:`<p>추론의 종류를 구분하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`"관찰한 백조 100마리가 모두 하얗다. 따라서 모든 백조는 하얗다."는 연역 추론이다.`,false],[`"사람은 모두 죽는다."와 "소크라테스는 사람이다."에서 "소크라테스는 죽는다."를 끌어내는 것은 연역 추론이다.`,true],[`연역 추론은 확장성이 장점이고, 귀납 추론은 논리의 일관성이 장점이다.`,false],[`"양말이 발에 신는 것이듯, 장갑은 손에 끼는 것이다."는 유비 추론이다.`,true],[`연역 추론에서 결론을 이끌어내는 가장 중요한 근거는 최초의 대전제이다.`,true],[`기계학습의 학습(Induction)은 일반 규칙에서 개별 결론을 끌어내는 연역 방향이다.`,false]],
   exp:`<b>ㄱ (F)</b> 개별 사실들에서 일반적인 결론을 이끌어냈으므로 <b>귀납 추론</b>입니다. 101번째 백조가 하얗다는 보장이 없어 결론이 틀릴 수 있습니다.<br><b>ㄴ (T)</b> 삼단논법으로, 연역 추론의 대표적인 예입니다(6장 교안 15쪽).<br><b>ㄷ (F)</b> 바뀌었습니다. 연역 = 확장성은 부족하나 <b>논리의 일관성</b>, 귀납 = 필연성은 적지만 새 지식의 <b>발견과 확장</b>입니다.<br><b>ㄹ (T)</b> 이미 아는 관계를 비슷한 새 대상에 옮겨 적용하는 유비(유추) 추론입니다.<br><b>ㅁ (T)</b> 6장 교안 15쪽입니다.<br><b>ㅂ (F)</b> Induction은 특정한 예시들에서 <b>일반적인 규칙</b>을 뽑아내는 귀납 방향입니다(ML 교안 7쪽). 일반 규칙 → 개별 결론은 규칙기반 AI의 연역입니다.`,
   src:[["04-2", "s4", "추론"], ["04-2", "s12", "학습 = Induction"]] },

{ type:'ox',
   lv:'기초',
   unit:"탐색 방향 · 순서",
   pts:12,
   q:`<p>루트 A의 자식이 B, C이고, B의 자식이 D, E, C의 자식이 F인 트리(자식은 앞에 쓴 것부터 방문)와 탐색 기법에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`이 트리를 DFS(깊이 우선 탐색)로 방문하면 순서는 A, B, C, D, E, F이다.`,false],[`이 트리를 BFS(너비 우선 탐색)로 방문하면 순서는 A, B, C, D, E, F이다.`,true],[`증명하려는 목표에서 출발해 그 목표가 참이려면 무엇이 참이어야 하는지를 거슬러 확인하는 것은 역방향 추론이다.`,true],[`순방향 추론과 역방향 추론을 접합한 것을 양방향 추론이라고 한다.`,true],[`A* 알고리즘은 무정보 탐색에 속한다.`,false],[`최소최대 탐색에서 Pruning(전지 작업)은 탐색이 필요 없는 경로를 잘라내는 작업이다.`,true]],
   exp:`<b>ㄱ (F)</b> A, B, C, D, E, F는 <b>BFS</b> 순서입니다. DFS는 한 갈래를 끝까지 내려간 뒤 되돌아오므로 <b>A, B, D, E, C, F</b>입니다.<br><b>ㄴ (T)</b> level 0(A) → level 1(B, C) → level 2(D, E, F) 순서입니다.<br><b>ㄷ (T)</b> 역방향 추론은 목표 상태 → 출발 상태로 진행합니다(6장 교안 17쪽).<br><b>ㄹ (T)</b> 6장 교안 17쪽입니다.<br><b>ㅁ (F)</b> A*는 최상 우선 탐색으로, 경험적 지식을 활용하는 <b>휴리스틱 탐색</b>입니다. 무정보 탐색은 DFS, BFS입니다.<br><b>ㅂ (T)</b> 6장 교안 21쪽입니다. 탐색할 경로를 줄입니다.`,
   src:[["04-2", "s5", "탐색"]] },

{ type:'ox',
   lv:'기초',
   unit:"휴리스틱 · 8-Queens",
   pts:10,
   q:`<p>휴리스틱과 8-Queens 문제에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`휴리스틱은 최적을 보장하지 않는 대신 만족할 만한 해결책을 비교적 빠르게 찾는다.`,true],[`"해답을 얻었다고 가정하고 반대 방향으로 유도해 보기"는 휴리스틱의 예이다.`,true],[`휴리스틱은 인공지능 분야에서만 쓰이고 심리학이나 경제학에서는 쓰이지 않는다.`,false],[`8-Queens 문제에서 퀸은 수평·수직 방향으로만 공격하므로 같은 대각선에는 퀸 두 개가 있어도 된다.`,false],[`8-Queens 문제는 경우의 수가 매우 많아 보통 인공지능 방법으로 프로그램하여 해답을 구한다.`,true]],
   exp:`<b>ㄱ (T)</b> 6장 교안 26쪽입니다.<br><b>ㄴ (T)</b> 폴리아의 『How to Solve It』에 나오는 휴리스틱 예입니다(6장 교안 27쪽). 반드시 답이 나온다는 보장은 없습니다.<br><b>ㄷ (F)</b> 인공지능, <b>심리학, 경제학</b> 분야에서 많이 사용합니다(6장 교안 26쪽).<br><b>ㄹ (F)</b> 퀸은 수평, 수직, <b>대각선</b> 방향으로 몇 칸이든 이동할 수 있으므로 같은 대각선에도 두 개가 있으면 안 됩니다(6장 교안 29쪽).<br><b>ㅁ (T)</b> 약 44억 가지이며 통상 인공지능 방법으로 해답을 구합니다(6장 교안 30쪽).`,
   src:[["04-2", "s6", "알고리즘과 휴리스틱"], ["04-2", "s7", "A* 알고리즘 · 8-Queens"]] },

{ type:'ox',
   lv:'기초',
   unit:"규칙기반 시스템 동작",
   pts:8,
   q:`<p>다음 지식베이스와 추론규칙을 가진 규칙기반 시스템에 대한 설명이다. 사실: Socrates is a human, Daesukim is a human, Wurry is an animal / 규칙: If X is a human, then X dies, If X is an animal then X dies. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`"Is Socrates die?"에 대한 Yes라는 답은 사실 Socrates is a human과 규칙 If X is a human, then X dies가 결합해 나온다.`,true],[`"Tell me what dies?"에 대한 답은 Socrates, Daesukim 두 개뿐이다.`,false],[`"Daesukim dies"는 지식베이스에 직접 저장된 사실이다.`,false],[`이 시스템은 판단 규칙을 사람이 적어 넣었으므로 인공지능이지만 기계학습은 아니다.`,true]],
   exp:`<b>ㄱ (T)</b> 6장 교안 34쪽입니다.<br><b>ㄴ (F)</b> Wurry는 animal이고 If X is an animal then X dies 규칙이 있으므로 <b>Socrates, Daesukim, wurry</b> 세 개입니다(6장 교안 34쪽).<br><b>ㄷ (F)</b> 지식베이스에는 Daesukim is a human만 있습니다. "Daesukim dies"는 규칙으로 <b>추론해 새로 만든</b> 사실입니다.<br><b>ㄹ (T)</b> 기계학습은 규칙을 명시적으로 프로그래밍하지 않고 데이터에서 패턴을 학습하는 것입니다(ML 교안 1쪽). 규칙을 사람이 쓴 시스템은 기계학습이 아닙니다.`,
   src:[["04-2", "s8", "전문가 시스템"], ["04-2", "s9", "AI · 기계학습 · 딥러닝"]] },

{ type:'ox',
   lv:'기초',
   unit:"기계학습의 의미",
   pts:12,
   q:`<p>기계학습의 정의와 의미를 구분하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`생성형 AI는 기계학습에도 포함된다.`,true],[`Mitchell의 정의에 따르면, 경험 E가 늘어도 성능 지표 P로 잰 작업 T의 성능이 그대로라면 그 프로그램은 학습한다고 말할 수 없다.`,true],[`전통적 방식과 ML 방식의 차이는, 전통적 방식은 사람이 규칙을 작성하고 ML 방식은 데이터로 ML 알고리즘을 학습한다는 것이다.`,true],[`전통적 방식에는 평가 결과가 나쁠 때 오류를 분석하고 다시 반복하는 과정이 없다.`,false],[`학습 데이터를 빠짐없이 완벽하게 맞히는 것을 기계학습의 일반화라고 한다.`,false],[`학습으로 만드는 모델은 데이터에 대한 approximation(근사)이므로, 모든 것을 설명하지 못하더라도 데이터의 일부를 설명할 수 있으면 된다.`,true]],
   exp:`<b>ㄱ (T)</b> AI ⊃ ML ⊃ DL ⊃ 생성형 AI(교수님)이므로 생성형 AI는 기계학습 안에도 들어갑니다.<br><b>ㄴ (T)</b> "its performance on T, as measured by P, improves with experience E"일 때 학습한다고 말합니다(ML 교안 2쪽).<br><b>ㄷ (T)</b> Write rules ↔ Train ML algorithm (ML 교안 4쪽).<br><b>ㄹ (F)</b> 평가 → 오류 분석 → 반복하는 구조는 <b>두 방식 모두</b> 있습니다. 다른 것은 규칙을 사람이 쓰는가, 데이터로 학습하는가입니다.<br><b>ㅁ (F)</b> 일반화는 <b>새로 들어오는 데이터</b>를 처리할 수 있게 하는 것입니다(교수님). 학습 데이터만 잘 맞히는 것과는 다릅니다.<br><b>ㅂ (T)</b> ML 교안 7쪽 "May not explain everything, but may still be able to account for some part of the data."`,
   src:[["04-2", "s9", "AI · 기계학습 · 딥러닝"], ["04-2", "s10", "기계학습의 정의"], ["04-2", "s11", "전통 방식 vs ML · 일반화"], ["04-2", "s12", "학습 = Induction"]] },

{ type:'ox',
   lv:'기초',
   unit:"학습 유형 적용",
   pts:14,
   q:`<p>학습 유형을 상황에 적용한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`집의 면적과 방 개수로 집값(원)을 예측하는 것은 Regression(회귀)이다.`,true],[`메일을 스팸 또는 정상으로 판정하는 것은 회귀이다.`,false],[`강화 학습의 보상은 행동 직후에 항상 즉시 주어진다.`,false],[`Dimension reduction(차원 축소)은 고차원 데이터를 데이터의 본질을 담는 더 낮은 차원의 부분공간으로 투영하여 차원을 줄이는 것이다.`,true],[`t-SNE는 데이터의 국소 구조를 보존하면서 고차원 데이터를 2차원이나 3차원으로 줄여 시각화하는 데 쓰인다.`,true],[`준지도(semi-supervised) 학습은 "사람의 감독을 받으며 학습하는가"라는 기준에 따른 유형 중 하나이다.`,true],[`온라인 학습과 배치 학습은 "사람의 감독을 받으며 학습하는가"에 따라 나눈 것이다.`,false]],
   exp:`<b>ㄱ (T)</b> 출력이 연속적인 수이므로 회귀입니다.<br><b>ㄴ (F)</b> 출력이 스팸/정상이라는 이산적인 라벨이므로 <b>Classification(분류)</b>입니다.<br><b>ㄷ (F)</b> 강화 학습의 보상은 <b>지연된 보상(delayed reward)</b>입니다. 여러 행동이 끝난 뒤에야 좋았는지 알게 되는 경우가 많습니다.<br><b>ㄹ (T)</b> ML 교안 16쪽입니다.<br><b>ㅁ (T)</b> 비지도 학습의 시각화(Visualization) 작업입니다(ML 교안 15쪽).<br><b>ㅂ (T)</b> 이 기준으로 supervised, unsupervised, semi-supervised, Reinforcement Learning으로 나눕니다(ML 교안 8쪽).<br><b>ㅅ (F)</b> 온라인/배치는 <b>실시간으로 점진적 학습이 가능한가</b>에 따라 나눈 것입니다(ML 교안 8쪽).`,
   src:[["04-2", "s13", "학습 유형"], ["04-2", "s14", "지도 학습"], ["04-2", "s15", "비지도 학습"], ["04-2", "s16", "강화 학습"]] },

   items:[[`배치 학습에 비해 온라인 학습이 좋은 이유는 학습 단계 하나하나가 더 빠르고 저렴하다는 것이다.`,true],[`온라인 학습이 빠른 이유는 새 데이터가 올 때마다 전체 데이터로 처음부터 다시 학습하기 때문이다.`,false],[`배치 학습은 시간과 컴퓨팅 자원이 많이 들어 보통 오프라인에서 수행한다.`,true],[`온라인 학습은 데이터가 연속적으로 흘러들어오고 변화에 빠르게 적응해야 하는 시스템에 좋다.`,true],[`외부 메모리 학습은 데이터 전체를 주기억장치에 한 번에 올려 배치 학습으로 학습하는 방법이다.`,false]],
