   answer:[2],
   exp:`추가 무작위성으로 트리 다양성이 커지고(greater tree diversity), "trades a higher bias for a lower variance" — 편향을 조금 내주고 분산을 낮춥니다(교안 10쪽). ④는 AdaBoost입니다.`,
   src:[["08-1", "s9", "랜덤 포레스트"]] },

{ type:'ox',
   lv:'상',
   unit:"A · B · C",
   pts:6,
   q:`<p>규칙기반 AI, 회귀, SVM에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Predicate logic(술어 논리)은 아버지(김춘추, 영철)처럼 대상들 사이의 관계도 나타낼 수 있다.`,true],[`Heuristic(휴리스틱)은 최적의 해를 보장하지는 않지만 만족할 만한 해를 비교적 빠르게 찾는다.`,true],[`다중 회귀에서 β<sub>j</sub>는 다른 예측변수를 모두 고정했을 때 X<sub>j</sub>가 1 늘면 Y가 평균적으로 변하는 양이다.`,true],[`예측변수끼리 상관이 클수록 회귀계수의 분산이 작아져 해석이 쉬워진다.`,false],[`∑ε<sub>i</sub> ≤ C 처럼 C를 위반 총량의 상한으로 정의하면, C = 0일 때 소프트 마진 SVM은 하드 마진(최대 마진 분류기)과 같아진다.`,true],[`소프트 마진 SVM의 서포트 벡터는 마진 경계 위에 정확히 놓인 점뿐이다.`,false]],
   exp:`<b>ㄱ (T)</b> 술어 논리는 문장을 주어(대상)와 술어로 나누며, 대상이 둘이면 관계를 나타냅니다.<br><b>ㄴ (T)</b> 과거 경험에 기반한 직관적 판단으로, 최적을 보장하지 않습니다.<br><b>ㄷ (T)</b> "holding all other predictors fixed"(교안 14쪽).<br><b>ㄹ (F)</b> 상관이 있으면 모든 계수의 분산이 <b>커지고</b>(때로는 매우 크게) 해석이 위험해집니다. 해석이 쉬운 것은 상관이 없는 균형 설계입니다.<br><b>ㅁ (T)</b> 위반을 전혀 허용하지 않으므로 최대 마진 분류기입니다(교안 18쪽). 이 정의에서는 C가 클수록 마진이 넓어져, 벌점 C와 방향이 반대입니다.<br><b>ㅂ (F)</b> 마진 위의 점과, 자기 클래스 기준으로 마진의 반대쪽에 있는 점(마진 위반·오분류)도 모두 서포트 벡터입니다(교안 15쪽).`,
   src:[["04-2", "s3", "술어 논리"], ["04-2", "s6", "알고리즘과 휴리스틱"], ["06-1", "s8", "다중 선형 회귀"], ["06-1", "s10", "회귀계수 해석"], ["06-2", "s10", "소프트 마진 SVM과 서포트 벡터"], ["06-2", "s12", "★ 벌점 매개변수 C"]] },

{ type:'ox',
   lv:'상',
   unit:"D · E · F",
   pts:6,
   q:`<p>군집화, 결정 트리, 앙상블에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Density-connected(밀도 연결)는 대칭 관계이다.`,true],[`K-평균의 결과는 초기 군집 배정과 관계없이 항상 같다.`,false],[`ID3는 정보 이득이 가장 큰 속성을 분할 속성으로 고르고, 그 속성의 범주 수만큼 가지를 나눈다.`,true],[`결정 트리는 데이터에 대한 가정이 거의 없어, 제약이 없으면 학습 데이터에 맞춰 자라 과대적합하기 쉽다.`,true],[`AdaBoost에서 α<sub>j</sub> &gt; 0인 예측기가 틀린 샘플의 가중치에 exp(α<sub>j</sub>)를 곱하고 정규화하면 맞힌 샘플의 상대적 비중은 커진다.`,false],[`Gradient Boosting 앙상블의 예측은 각 트리 예측의 평균이다.`,false]],
   exp:`<b>ㄱ (T)</b> "p와 q 모두 어떤 o로부터 밀도 도달 가능"은 p, q를 바꿔도 같은 조건입니다. 밀도 도달은 방향이 있습니다.<br><b>ㄴ (F)</b> 교수님 말씀: centroid를 처음에 어떻게 잡느냐에 따라 결과가 달라지며, 이를 개선한 것이 K-means++입니다.<br><b>ㄷ (T)</b> CART가 이진 분할인 것과 다릅니다.<br><b>ㄹ (T)</b> 그래서 max_depth ↓, min_samples_split · min_samples_leaf ↑ 같은 사전 가지치기(규제)가 필요합니다.<br><b>ㅁ (F)</b> α<sub>j</sub> &gt; 0이면 exp(α<sub>j</sub>) &gt; 1이라 틀린 샘플만 커지고, 합이 1이 되게 정규화하므로 맞힌 샘플의 비중은 <b>줄어듭니다</b>(교안 19쪽).<br><b>ㅂ (F)</b> 평균이 아니라 <b>합</b>(h<sub>1</sub> + h<sub>2</sub> + h<sub>3</sub> + ⋯)입니다.`,
   src:[["07-1", "s8", "K-평균 알고리즘"], ["07-1", "s19", "DBSCAN ③ 밀도 도달·연결"], ["07-2", "s10", "ID3와 정보 이득"], ["07-2", "s2", "장단점"], ["08-1", "s16", "가중치 갱신과 최종 예측"], ["08-1", "s17", "그래디언트 부스팅"]] },

{ type:'short',
   lv:'상',
   unit:"A 4-2 규칙·기계학습",
   pts:4,
   q:`<p>온라인 학습 알고리즘을 이용해, 한 컴퓨터의 주기억장치에 들어가지 않는 거대한 데이터셋을 일부씩 불러와 훈련 단계를 반복하는 학습을 무엇이라 하는가? (영어 또는 한글)</p>`,
   show:`외부 메모리 학습(Out-of-core learning)`,
   alt:["외부 메모리 학습", "Out-of-core learning", "out-of-core", "점진적 학습", "Incremental learning"],
   exp:`데이터 일부를 불러와 훈련 단계를 수행하고 전체를 다 돌 때까지 반복합니다(incremental learning). 온라인 학습은 학습 단계 하나가 빠르고 저렴하기 때문에 가능합니다.`,
   src:[["04-2", "s17", "배치 학습 vs 온라인 학습"]] },

{ type:'short',
   lv:'상',
   unit:"D 7-1 군집화",
   pts:4,
   q:`<p>1차원 점 1, 2, 6, 10, 11을 K = 2인 K-평균으로 군집화한다. 처음에 각 점을 두 중심 1과 6 중 가까운 쪽에 배정하는 것에서 시작해 군집 배정이 바뀌지 않을 때까지 반복하였다. 최종 두 군집의 중심을 쓰시오.</p>`,
   show:`1.5와 9`,
   alt:["1.5, 9", "<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">2</span></span>와 9"],
   exp:`처음 배정: {1, 2} / {6, 10, 11} → 중심 <span class="frac"><span class="num">1 + 2</span><span class="den">2</span></span> = 1.5, <span class="frac"><span class="num">6 + 10 + 11</span><span class="den">3</span></span> = 9.<br>재배정: 6은 1.5까지 4.5, 9까지 3 → 그대로. 다른 점도 바뀌지 않으므로 종료합니다. 중심 = 군집의 특징별 평균(K-means의 이름).`,
   src:[["07-1", "s8", "K-평균 알고리즘"]] },

{ type:'short',
   lv:'상',
   unit:"E 7-2 결정 트리",
   pts:4,
   q:`<p>회귀 트리용 CART로 데이터 (x, y) = (1, 1), (2, 3), (3, 9), (4, 11)을 x ≤ 2.5에서 한 번 나눈다. 비용함수와 리프의 MSE는 다음과 같다.</p><p style="text-align:center">J = <span class="frac"><span class="num">m<sub>left</sub></span><span class="den">m</span></span>MSE<sub>left</sub> + <span class="frac"><span class="num">m<sub>right</sub></span><span class="den">m</span></span>MSE<sub>right</sub>,&nbsp;&nbsp; MSE<sub>node</sub> = 리프 안 (ŷ<sub>node</sub> − y)<sup>2</sup>의 평균</p><p>(가) 왼쪽·오른쪽 리프의 예측값 (나) J 를 쓰시오.</p>`,
   show:`(가) 2, 10  (나) 1`,
   alt:["2, 10, 1"],
   exp:`리프 예측값 = 리프 샘플 y의 평균: 왼쪽 <span class="frac"><span class="num">1 + 3</span><span class="den">2</span></span> = 2, 오른쪽 <span class="frac"><span class="num">9 + 11</span><span class="den">2</span></span> = 10.<br>MSE<sub>left</sub> = <span class="frac"><span class="num">1 + 1</span><span class="den">2</span></span> = 1, MSE<sub>right</sub> = <span class="frac"><span class="num">1 + 1</span><span class="den">2</span></span> = 1 → J = <span class="frac"><span class="num">2</span><span class="den">4</span></span> × 1 + <span class="frac"><span class="num">2</span><span class="den">4</span></span> × 1 = 1. 회귀용 CART는 J가 가장 작은 분할을 고릅니다(교안 29–30쪽).`,
   src:[["07-2", "s11", "회귀 트리"], ["07-2", "s12", "회귀용 CART"]] },

{ type:'short',
   lv:'상',
   unit:"F 8-1 앙상블",
   pts:4,
   q:`<p>정확도가 각각 0.6이고 서로 독립인 분류기 3개로 하드 투표(다수결)를 할 때, 앙상블의 정확도를 소수로 쓰시오.</p>`,
   show:`0.648`,
   alt:[],
   exp:`다수결이 맞으려면 3개 중 2개 이상이 맞아야 합니다: 0.6<sup>3</sup> + 3 × 0.6<sup>2</sup> × 0.4 = 0.216 + 0.432 = 0.648. 개별 정확도 0.6보다 높아집니다. 단, 분류기들이 완전히 독립(오류가 서로 상관없음)일 때만 성립하며, 같은 데이터로 학습한 실제 분류기들은 그렇지 않습니다(교안 4쪽).`,
   src:[["08-1", "s3", "다수결이 정확해지는 이유"]] },

{ type:'table',
   lv:'상',
   unit:"B 6-1 회귀",
   pts:8,
   q:`<p>어떤 데이터에 단순 선형 회귀 ŷ = β̂<sub>0</sub> + β̂<sub>1</sub>x를 최소제곱법으로 적합한다. 최소제곱 추정 알고리즘의 Step 1(오차 제곱합) 식이 다음과 같다.</p><p style="text-align:center">∑<sub>i=1</sub><sup>n</sup>{y<sub>i</sub> − (β<sub>0</sub> + β<sub>1</sub>x<sub>i</sub>)}<sup>2</sup> = (0 − β<sub>0</sub>)<sup>2</sup> + (6 − β<sub>0</sub> − 2β<sub>1</sub>)<sup>2</sup> + (10 − β<sub>0</sub> − 4β<sub>1</sub>)<sup>2</sup> + (12 − β<sub>0</sub> − 6β<sub>1</sub>)<sup>2</sup></p><p>이 식에서 데이터를 읽어 표를 채우시오. (x̄, ȳ는 평균)</p>`,
   head:[`항목`,`값`],
   rows:[
     [`x̄, ȳ`,{a:`3, 7`,alt:["x̄ = 3, ȳ = 7"]}],
     [`∑(x<sub>i</sub> − x̄)(y<sub>i</sub> − ȳ)`,{a:`40`,alt:[]}],
     [`∑(x<sub>i</sub> − x̄)<sup>2</sup>`,{a:`20`,alt:[]}],
     [`β̂<sub>1</sub>`,{a:`2`,alt:[]}],
     [`β̂<sub>0</sub>`,{a:`1`,alt:[]}],
     [`x = 5일 때 ŷ`,{a:`11`,alt:[]}]],
   exp:`Step 1 식의 각 항 (y<sub>i</sub> − β<sub>0</sub> − β<sub>1</sub>x<sub>i</sub>)에서 데이터 (x, y) = (0, 0), (2, 6), (4, 10), (6, 12)를 읽습니다. x̄ = <span class="frac"><span class="num">12</span><span class="den">4</span></span> = 3, ȳ = <span class="frac"><span class="num">28</span><span class="den">4</span></span> = 7.<br>x − x̄ = −3, −1, 1, 3, y − ȳ = −7, −1, 3, 5 → ∑(x − x̄)(y − ȳ) = 21 + 1 + 3 + 15 = 40, ∑(x − x̄)<sup>2</sup> = 9 + 1 + 1 + 9 = 20.<br>β̂<sub>1</sub> = <span class="frac"><span class="num">40</span><span class="den">20</span></span> = 2, β̂<sub>0</sub> = ȳ − β̂<sub>1</sub>x̄ = 7 − 2 × 3 = 1 → ŷ = 1 + 2x, x = 5이면 11.<br>확인: 잔차 −1, 1, 1, −1의 합 = 0(<span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>0</sub></span></span> = 0), 잔차 × x의 합 = 0 × (−1) + 2 × 1 + 4 × 1 + 6 × (−1) = 0(<span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>1</sub></span></span> = 0). 공식을 몰라도 두 편미분 식 ∑(y<sub>i</sub> − β<sub>0</sub> − β<sub>1</sub>x<sub>i</sub>) = 0, ∑(y<sub>i</sub> − β<sub>0</sub> − β<sub>1</sub>x<sub>i</sub>)x<sub>i</sub> = 0을 연립하면(28 = 4β<sub>0</sub> + 12β<sub>1</sub>, 124 = 12β<sub>0</sub> + 56β<sub>1</sub>) 같은 답이 나옵니다.`,
   src:[["06-1", "s6", "최소제곱법으로 계수 추정"]] },

{ type:'essay',
   lv:'상',
   unit:"B 6-1 회귀",
   pts:8,
   q:`<p>단순 선형 회귀 Y = β<sub>0</sub> + β<sub>1</sub>X + ε의 회귀계수를 최소제곱법으로 추정하는 과정을 ① 오차 제곱합(RSS) 식 ② 최소화 문제의 정의 ③ 편미분 식 ④ 연립하여 β̂<sub>0</sub>, β̂<sub>1</sub>을 구하는 과정의 순서로 서술하시오.</p>`,
   model:`① 데이터 (x<sub>i</sub>, y<sub>i</sub>), i = 1, …, n에 대해 오차 제곱합을 C(β<sub>0</sub>, β<sub>1</sub>) = ∑{y<sub>i</sub> − (β<sub>0</sub> + β<sub>1</sub>x<sub>i</sub>)}<sup>2</sup>로 쓴다. ② 이 값을 최소로 하는 계수를 찾는 문제 (β̂<sub>0</sub>, β̂<sub>1</sub>) = arg min C(β<sub>0</sub>, β<sub>1</sub>)로 정의한다. ③ C를 각 계수로 편미분해 0으로 놓는다: <span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>0</sub></span></span> = −2∑(y<sub>i</sub> − β<sub>0</sub> − β<sub>1</sub>x<sub>i</sub>) = 0, <span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>1</sub></span></span> = −2∑(y<sub>i</sub> − β<sub>0</sub> − β<sub>1</sub>x<sub>i</sub>)x<sub>i</sub> = 0. ④ 첫 식을 n으로 나누면 ȳ − β<sub>0</sub> − β<sub>1</sub>x̄ = 0이므로 β̂<sub>0</sub> = ȳ − β̂<sub>1</sub>x̄이다. 이를 둘째 식에 넣으면 ∑x<sub>i</sub>{(y<sub>i</sub> − ȳ) − β<sub>1</sub>(x<sub>i</sub> − x̄)} = 0이고, ∑x̄(y<sub>i</sub> − ȳ) = 0, ∑x̄(x<sub>i</sub> − x̄) = 0을 이용해 정리하면 β̂<sub>1</sub> = <span class="frac"><span class="num">∑(x<sub>i</sub> − x̄)(y<sub>i</sub> − ȳ)</span><span class="den">∑(x<sub>i</sub> − x̄)<sup>2</sup></span></span>을 얻는다.`,
   rubric:[[`① RSS 식 ∑{y<sub>i</sub> − (β<sub>0</sub> + β<sub>1</sub>x<sub>i</sub>)}<sup>2</sup>`,2],[`② arg min으로 최소화 문제 정의`,1],[`③ β<sub>0</sub>, β<sub>1</sub> 편미분 = 0 두 식(−2, x<sub>i</sub> 포함)`,2],[`④ β̂<sub>0</sub> = ȳ − β̂<sub>1</sub>x̄ 유도`,1],[`④ β̂<sub>1</sub> 식까지 정리`,2]],
   src:[["06-1", "s6", "최소제곱법으로 계수 추정"]] },

{ type:'essay',
   lv:'상',
   unit:"C 6-2 SVM",
   pts:6,
   q:`<p>하드 마진 SVM(최대 마진 분류기)의 한계 두 가지를 쓰고, 소프트 마진 SVM이 슬랙 변수 ε<sub>i</sub>로 이를 어떻게 보완하는지 ε<sub>i</sub> 값의 범위(0, 0 초과 1 이하, 1 초과)가 뜻하는 점의 위치를 포함하여 서술하시오.</p>`,
