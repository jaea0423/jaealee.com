const EXAM = [
{ type:'ox',
   lv:'기초',
   unit:"용어 구분",
   pts:14,
   q:`<p>용어를 구분하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`TV, Radio, Newspaper 광고비 3개로 판매량 1개를 예측하는 회귀는 multivariable(다변수) 회귀이다.`,true],[`판매량과 고객 수 두 값을 동시에 예측하는 회귀는 multivariate(다변량) 회귀이다.`,true],[`광고비 3개로 판매량 1개를 예측하는 회귀는 univariate(단변량)가 아니다.`,false],[`통계학의 "독립변수·종속변수"와 기계학습의 "특징·라벨"은 서로 다른 대상을 가리킨다.`,false],[`광고 데이터에서 Sales(판매량)는 response(반응변수), TV 광고비는 predictor(예측변수)이다.`,true],[`단순 회귀의 입력은 스칼라 x 하나이고, 다중 회귀의 입력은 벡터 <b>x</b> = [x<sub>1</sub>, x<sub>2</sub>, …, x<sub>N</sub>]이다.`,true]],
   exp:`<b>ㄱ (T)</b> 입력 x가 3개이므로 multivariable입니다. Variable은 x의 개수를 셉니다.<br><b>ㄴ (T)</b> 출력 y가 2개이므로 multivariate입니다.<br><b>ㄷ (F)</b> Univariate는 y가 1개라는 뜻이므로 이 회귀는 univariate(단변량)이면서 multivariable(다변수)입니다.<br><b>ㄹ (F)</b> 분야마다 이름만 다를 뿐 <b>같은 대상</b>입니다. 독립변수 = 특징(입력), 종속변수 = 라벨(출력).<br><b>ㅁ (T)</b> 광고비는 우리가 주는 입력, 판매량은 그에 따라 정해지는 출력입니다.<br><b>ㅂ (T)</b> 교수님이 짚은 입력의 모양입니다.`,
   src:[["06-1", "s2", "x → 모델 → y"], ["06-1", "s3", "회귀란 · 회귀의 분류"], ["06-1", "s4", "Variate와 Variable"]] },

{ type:'ox',
   lv:'기초',
   unit:"모델 식 읽기",
   pts:14,
   q:`<p>단순 선형 회귀 식을 읽는 방법에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Y = β<sub>0</sub> + β<sub>1</sub>X + ε를 y = ax + b와 맞춰 보면 β<sub>1</sub>이 a, β<sub>0</sub>이 b에 해당한다.`,true],[`β<sub>0</sub>, β<sub>1</sub>은 parameter, learnable parameter, weight(가중치)라고도 부른다.`,true],[`β̂<sub>1</sub>은 진짜 기울기이고, β<sub>1</sub>은 데이터로 계산한 기울기이다.`,false],[`잔차는 예측값에서 실제 값을 뺀 ŷ<sub>i</sub> − y<sub>i</sub>이다.`,false],[`현재 데이터에 완벽하게 맞는 회귀선을 구하면 새로운 데이터에서도 100% 맞는다.`,false],[`최소제곱 직선 그래프에서 각 점과 직선 사이의 세로 거리는 잔차(에러텀)를 나타낸다.`,true]],
   exp:`<b>ㄱ (T)</b> 교수님: β₁ = a(기울기), β₀ = b(절편)로 매치해서 생각해도 됩니다.<br><b>ㄴ (T)</b> 교수님: 표기법이 다양할 뿐 모두 같은 것입니다.<br><b>ㄷ (F)</b> 반대입니다. β<sub>1</sub>은 모르는 진짜 값, 햇이 붙은 β̂<sub>1</sub>이 데이터로 구한 추정값입니다.<br><b>ㄹ (F)</b> 잔차 e<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>(실제 − 예측)입니다.<br><b>ㅁ (F)</b> 교수님: 회귀는 어디까지나 최적·최선을 찾는 것이라, 새 데이터가 들어오면 100% 맞지 않을 수 있습니다.<br><b>ㅂ (T)</b> 교수님: 예시 그래프의 회색선은 에러텀(오차)입니다(교안 11쪽).`,
   src:[["06-1", "s5", "단순 선형 회귀"], ["06-1", "s6", "잔차 제곱합 · 최소제곱법"]] },

{ type:'ox',
   lv:'기초',
   unit:"최소제곱 절차",
   pts:19,
   q:`<p>최소제곱 추정 과정에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`RSS는 β̂<sub>0</sub>, β̂<sub>1</sub>을 무엇으로 고르느냐에 따라 값이 바뀐다.`,true],[`잔차가 +2, −2인 두 점의 잔차를 그대로 더하면 0이 되어 오차가 없는 것처럼 보인다.`,true],[`잔차를 양수로 만드는 방법으로 제곱 말고도 절댓값을 쓰거나 제곱합에 루트를 씌우기도 한다.`,true],[`최소제곱 추정은 "편미분 = 0" → "오차 제곱합 식 작성" → "arg min 문제 정의" 순서로 진행한다.`,false],[`Step 3의 두 식 <span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>0</sub></span></span> = 0, <span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>1</sub></span></span> = 0을 연립해서 풀면 β̂<sub>0</sub>, β̂<sub>1</sub>을 얻는다.`,true],[`β̂<sub>1</sub>의 분자는 Σ(x<sub>i</sub> − <span style="text-decoration:overline">x</span>)(y<sub>i</sub> − <span style="text-decoration:overline">y</span>), 분모는 Σ(x<sub>i</sub> − <span style="text-decoration:overline">x</span>)<sup>2</sup>이다.`,true],[`β̂<sub>0</sub> = <span style="text-decoration:overline">x</span> − β̂<sub>1</sub><span style="text-decoration:overline">y</span>이다.`,false],[`최소제곱 추정에서 Step 2의 cost function(비용함수)은 Step 1의 오차 제곱합과 전혀 다른 함수이다.`,false]],
   exp:`<b>ㄱ (T)</b> RSS = Σ(y<sub>i</sub> − β̂<sub>0</sub> − β̂<sub>1</sub>x<sub>i</sub>)<sup>2</sup>이므로 계수가 바뀌면 값이 바뀝니다.<br><b>ㄴ (T)</b> 교수님이 든 예입니다. 그래서 양수로 만들어 더합니다.<br><b>ㄷ (T)</b> 교수님 말씀입니다. 공통점은 양수로 만든다는 것입니다.<br><b>ㄹ (F)</b> 순서는 Step 1 오차 제곱합 식 작성 → Step 2 arg min 문제 정의 → Step 3 편미분 = 0입니다(교안 9쪽).<br><b>ㅁ (T)</b> 그 해가 교안 10쪽 Solution입니다.<br><b>ㅂ (T)</b> β̂<sub>1</sub> = <span class="frac"><span class="num">Σ(x<sub>i</sub> − <span style="text-decoration:overline">x</span>)(y<sub>i</sub> − <span style="text-decoration:overline">y</span>)</span><span class="den">Σ(x<sub>i</sub> − <span style="text-decoration:overline">x</span>)<sup>2</sup></span></span> (교안 10쪽).<br><b>ㅅ (F)</b> β̂<sub>0</sub> = <span style="text-decoration:overline">y</span> − β̂<sub>1</sub><span style="text-decoration:overline">x</span>입니다. <span style="text-decoration:overline">x</span>와 <span style="text-decoration:overline">y</span>의 자리가 바뀌었습니다.<br><b>ㅇ (F)</b> Step 2의 C(β<sub>0</sub>, β<sub>1</sub>)는 Step 1의 오차 제곱합 그 자체를 β<sub>0</sub>, β<sub>1</sub>의 함수로 본 것입니다.`,
   src:[["06-1", "s6", "잔차 제곱합 · 최소제곱법"]] },

{ type:'ox',
   lv:'기초',
   unit:"R² 함정",
   pts:17,
   q:`<p>R<sup>2</sup>와 Adjusted R<sup>2</sup>의 헷갈리는 지점이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`R<sup>2</sup> = 0.8이면 y 변동의 80%를 모델이 설명한다는 뜻이다.`,true],[`R<sup>2</sup> = <span class="frac"><span class="num">SSE</span><span class="den">SST</span></span>이다.`,false],[`R<sup>2</sup>는 모델이 매우 나쁘면 음수가 나올 수도 있다.`,true],[`SST는 실제 값 y<sub>i</sub>와 예측값 ŷ<sub>i</sub>의 차이를 제곱해서 더한 것이다.`,false],[`다중 회귀에서 쓸모없는 변수를 하나 더 넣으면 R<sup>2</sup>는 내려간다.`,false],[`Adjusted R<sup>2</sup>는 예측변수를 더 넣었을 때 모델의 적합도가 과대평가되는 것을 막는다.`,true],[`조정 항 <span class="frac"><span class="num">n − 1</span><span class="den">n − p − 1</span></span>은 예측변수 개수 p가 커질수록 커진다.`,true]],
   exp:`<b>ㄱ (T)</b> R<sup>2</sup>는 y의 전체 변동 중 모델이 설명하는 비율입니다.<br><b>ㄴ (F)</b> R<sup>2</sup> = 1 − <span class="frac"><span class="num">SSE</span><span class="den">SST</span></span> = <span class="frac"><span class="num">SSR</span><span class="den">SST</span></span>입니다. SSE는 설명하지 못한 변동입니다.<br><b>ㄷ (T)</b> 교안 12쪽 "sometimes negative if the model is very poor".<br><b>ㄹ (F)</b> 그것은 <b>SSE</b>입니다. SST = Σ(y<sub>i</sub> − <span style="text-decoration:overline">y</span>)<sup>2</sup>, 평균과의 차이입니다.<br><b>ㅁ (F)</b> R<sup>2</sup>는 변수를 넣어도 <b>내려가지 않습니다</b>. 그래서 적합도가 과대평가되고, 이를 막는 것이 Adjusted R<sup>2</sup>입니다.<br><b>ㅂ (T)</b> 교안 18쪽 "Prevents overestimation of model fit when more predictors are added".<br><b>ㅅ (T)</b> p가 커지면 분모 n − p − 1이 작아지므로 조정 항은 커지고, 그만큼 벌점이 커집니다.`,
   src:[["06-1", "s7", "결정계수 R²"], ["06-1", "s9", "수정된 결정계수"]] },

{ type:'ox',
   lv:'기초',
   unit:"다중 회귀 해석",
   pts:17,
   q:`<p>다중 회귀와 회귀계수 해석에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`sales = β<sub>0</sub> + β<sub>1</sub> × TV + β<sub>2</sub> × radio + β<sub>3</sub> × newspaper + ε에서 β<sub>1</sub>은 radio와 newspaper 광고비를 고정했을 때 TV 광고비가 1 늘면 판매량이 평균적으로 변하는 양이다.`,true],[`다중 회귀 식의 x<sub>ij</sub>는 i번째 변수의 j번째 데이터를 뜻한다.`,false],[`observational data(관찰 데이터)로 얻은 회귀계수로 인과관계를 주장하는 것은 피해야 한다.`,true],[`x → g(x) → y 형태라서 x가 y의 원인처럼 보이지만, 회귀계수는 x와 y의 상관관계로 해석해야 한다.`,true],[`예측변수끼리 상관이 있으면 X<sub>j</sub>가 변할 때 다른 변수도 함께 변하므로 계수 해석이 위험해진다.`,true],[`개별 회귀계수가 쓸모 있는지는 F-검정으로, 모델 전체가 쓸모 있는지는 t-검정으로 본다.`,false],[`모든 예측변수가 필요한지, 일부만 쓸모 있는지는 Forward selection · Backward selection(전진·후진 선택)으로 알아본다.`,true]],
   exp:`<b>ㄱ (T)</b> 교안 14–15쪽: 다른 예측변수를 모두 고정한 채의 평균 효과입니다.<br><b>ㄴ (F)</b> x<sub>ij</sub>는 <b>i번째 데이터의 j번째 변수</b>입니다(행 = 데이터, 열 = 변수).<br><b>ㄷ (T)</b> 교안 19쪽 "Claims of causality should be avoided for observational data."<br><b>ㄹ (T)</b> 교수님이 짚으신 함정입니다.<br><b>ㅁ (T)</b> 교안 19쪽 "when X<sub>j</sub> changes, everything else changes".<br><b>ㅂ (F)</b> 반대입니다. 개별 계수는 <b>t-test</b>, 모델 전체는 <b>F-test</b>입니다(교안 21쪽).<br><b>ㅅ (T)</b> 교안 21쪽 질문 2입니다.`,
   src:[["06-1", "s8", "다중 선형 회귀"], ["06-1", "s10", "회귀계수 해석"], ["06-1", "s12", "회귀의 중요한 질문 4가지"]] },

{ type:'ox',
   lv:'기초',
   unit:"로지스틱 함정",
   pts:19,
   q:`<p>로지스틱 회귀의 헷갈리는 지점이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Y가 0 또는 1이면 E(Y | X = x) = Pr(Y = 1 | X = x)이므로 회귀가 확률을 예측하는 것처럼 보인다.`,true],[`로지스틱 회귀식 p(X) = <span class="frac"><span class="num">1</span><span class="den">1 + e<sup>−(β<sub>0</sub> + β<sub>1</sub>X)</sup></span></span>의 지수 안 β<sub>0</sub> + β<sub>1</sub>X는 선형 회귀와 같은 직선 식이다.`,true],[`로지스틱 회귀에서 직선 β<sub>0</sub> + β<sub>1</sub>X와 같다고 놓는 것은 확률 p(X) 자체이다.`,false],[`오즈 <span class="frac"><span class="num">p(x)</span><span class="den">1 − p(x)</span></span>는 y가 1일 확률을 y가 0일 확률로 나눈 값이다.`,true],[`로그 오즈가 0이면 p(x) = 0.5이다.`,true],[`최대우도에서는 실제로 Yes(y<sub>i</sub> = 1)인 샘플에는 p(x<sub>i</sub>)를, No(y<sub>i</sub> = 0)인 샘플에는 1 − p(x<sub>i</sub>)를 곱한다.`,true],[`선형 회귀는 우도를 최대로, 로지스틱 회귀는 RSS를 최소로 하는 계수를 찾는다.`,false],[`p̂(X) = 0.5인 샘플은 Y = 1(Yes)로 분류한다.`,false]],
   exp:`<b>ㄱ (T)</b> 교안 22쪽입니다. 그러나 선형 회귀는 0~1 밖의 값을 낼 수 있어 부적절합니다.<br><b>ㄴ (T)</b> 직선 값을 시그모이드에 넣어 0~1로 바꾼 것이 로지스틱 회귀입니다.<br><b>ㄷ (F)</b> 직선과 같은 것은 <b>로그 오즈</b> log <span class="frac"><span class="num">p(X)</span><span class="den">1 − p(X)</span></span>입니다(교안 24쪽).<br><b>ㄹ (T)</b> 교수님: p(x) = y가 1일 확률, 1 − p(x) = y가 0일 확률.<br><b>ㅁ (T)</b> log(오즈) = 0이면 오즈 = 1, 즉 p(x) = 1 − p(x)이므로 p(x) = 0.5입니다.<br><b>ㅂ (T)</b> 교안 26쪽 ℓ(β<sub>0</sub>, β<sub>1</sub>) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) Π<sub>y<sub>i</sub>=0</sub> (1 − p(x<sub>i</sub>)).<br><b>ㅅ (F)</b> 반대입니다. 선형 회귀 = RSS 최소(최소제곱), 로지스틱 회귀 = 우도 최대(최대우도).<br><b>ㅇ (F)</b> p̂(X) ≤ 0.5이면 Y = 0(No)입니다. 0.5와 같으면 No로 분류합니다(교안 27쪽).`,
   src:[["06-1", "s13", "y가 Yes/No일 때"], ["06-1", "s15", "시그모이드 · 로그 오즈"], ["06-1", "s16", "최대우도"], ["06-1", "s17", "0.5 기준 분류"]] }
];
</script>
