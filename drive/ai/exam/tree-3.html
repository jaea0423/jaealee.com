{ type:'essay',

   unit:"CART · ID3",
   pts:15,

   model:`① CART는 지니 지수, ID3는 엔트로피로 노드의 불순도를 잰다. ② CART는 지니 감소량 ΔG(부모 지니 − 자식 지니의 가중평균)가 가장 큰 분할을, ID3는 정보 이득(부모 엔트로피 − 나눈 뒤 엔트로피의 가중평균)이 가장 큰 특징을 고른다. ③ CART는 항상 두 갈래로 나누는 이진 분할이고, ID3는 특징의 범주 수만큼 가지를 나눈다. ④ 둘 다 나누기 전 불순도를 구하고, 후보마다 나눈 뒤 불순도를 샘플 수 비율로 가중평균해 감소량을 비교한 뒤 가장 많이 줄이는 것을 고르며, 순수하지 않은 자식에서 같은 과정을 반복하고 순수해지면 리프로 멈춘다.`,
