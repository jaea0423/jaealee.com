{ type:'ox',
   lv:'기초',
   unit:"Ensemble(앙상블) 개요",
   pts:10,
   q:`<p>Ensemble learning(앙상블 학습)의 정의와 종류에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Ensemble learning(앙상블 학습)은 여러 개별 모델을 결합해 generalization(일반화) 성능이 더 좋은 하나의 모델을 만드는 방법이다.`,true],[`대표적인 앙상블 방법에는 Voting(투표), Bagging(배깅), Boosting(부스팅), Stacking(스태킹)이 있다.`,true],[`Random Forest(랜덤 포레스트)는 Boosting(부스팅) 방법의 예이다.`,false],[`AdaBoost와 XGBoost는 Boosting(부스팅) 방법의 예이다.`,true],[`앙상블에서 결합되는 각각의 개별 모델을 predictor(예측기)라고 부른다.`,true]],
   exp:`<b>ㄱ (T)</b> 교안 1쪽 정의 그대로입니다.<br><b>ㄴ (T)</b> 교안 1쪽 목록입니다.<br><b>ㄷ (F)</b> Random Forest는 <b>Bagging</b>의 예입니다. Boosting의 예는 AdaBoost, XGBoost입니다.<br><b>ㄹ (T)</b> 교안 1쪽 "Boosting (AdaBoost, XGBoost)".<br><b>ㅁ (T)</b> 교안 그림의 "Diverse predictors", "Predictors (e.g., classifiers)"가 개별 모델입니다.`,
   src:[["08-1", "s1", "앙상블 학습이란"]] },

{ type:'ox',
   lv:'기초',
   unit:"Voting(투표)",
   pts:15,
   q:`<p>Voting classifier(투표 분류기)에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Voting classifier(투표 분류기)는 같은 training data(학습 데이터)로 서로 다른 알고리즘의 분류기들을 학습시켜 만든다.`,true],[`Voting classifier에 쓰는 분류기들은 모두 같은 알고리즘이어야 한다.`,false],[`Hard voting(하드 투표)은 각 분류기의 예측을 모아 가장 많은 표를 받은 class(클래스)를 예측한다.`,true],[`Hard voting은 앙상블 안에서 가장 좋은 분류기보다 정확도가 높은 경우가 많다.`,true],[`네 예측기가 한 샘플을 각각 클래스 1, 1, 2, 1로 예측하면 Hard voting 결과는 2이다.`,false],[`Soft voting(소프트 투표)은 각 분류기가 예측한 class probability(클래스 확률)를 평균해 평균 확률이 가장 높은 클래스를 고른다.`,true],[`Soft voting은 각 분류기의 확률 출력을 이용하므로 Hard voting보다 더 정교한(refined) 방법이다.`,true],[`Soft voting은 각 분류기가 고른 클래스의 개수를 세어 가장 많은 것을 고른다.`,false]],
   exp:`<b>ㄱ (T)</b> 교안 2쪽 그림: 학습 데이터 하나 → Logistic Regression, SVM, Random Forest, Other.<br><b>ㄴ (F)</b> Logistic Regression, SVM, Random Forest처럼 <b>서로 다른 알고리즘</b>의 분류기를 씁니다(diverse classifiers, 교안 2쪽).<br><b>ㄷ (T)</b> 교안 3쪽 정의입니다.<br><b>ㄹ (T)</b> 교안 3쪽 "Often achieves a higher accuracy than the best classifier in the ensemble."<br><b>ㅁ (F)</b> 1이 3표, 2가 1표이므로 다수결 결과는 <b>1</b>입니다(교안 3쪽 그림).<br><b>ㅂ (T)</b> 교안 5쪽 정의입니다.<br><b>ㅅ (T)</b> 교안 5쪽 "a more refined approach than hard voting".<br><b>ㅇ (F)</b> 그것은 <b>Hard voting</b>입니다. Soft voting은 클래스 확률을 평균합니다.`,
   src:[["08-1", "s2", "하드 투표"], ["08-1", "s4", "소프트 투표"]] },

{ type:'ox',
   lv:'기초',
   unit:"다수결 정확도",
   pts:12,
   q:`<p>majority voting(다수결 투표)의 정확도에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`정확도가 각각 70%인 독립 분류기 5개로 다수결 투표를 하면, 앙상블의 정확도는 70%보다 낮아진다.`,false],[`정확도가 각각 70%인 독립 분류기 5개로 다수결 투표를 하면 정확도는 약 0.8369이다.`,true],[`정확도 70%인 독립 분류기가 101개이면 다수결 투표 정확도는 약 0.99이다.`,true],[`다수결 투표로 정확도가 이렇게 높아지는 것은 분류기들이 완전히 독립이고 오류가 서로 상관이 없을(uncorrelated) 때만 성립한다.`,true],[`같은 데이터로 학습한 분류기들은 서로 완전히 독립이라고 볼 수 있다.`,false],[`각 분류기가 weak learner(약한 학습기)라도, 수가 충분하고 충분히 다양하면 앙상블은 strong learner(강한 학습기)가 될 수 있다.`,true]],
   exp:`<b>ㄱ (F)</b> 3개 이상 맞힐 확률을 더하면 약 <b>0.8369</b>로, 개별 정확도 70%보다 <b>높아집니다</b>(교안 4쪽).<br><b>ㄴ (T)</b> 교안 4쪽 계산 결과입니다.<br><b>ㄷ (T)</b> 교안 4쪽 문장입니다.<br><b>ㄹ (T)</b> 교안 4쪽 파란 글씨 경고입니다.<br><b>ㅁ (F)</b> 반대입니다. 같은 데이터로 학습하므로 독립이 <b>아닌 것이 분명하다(clearly not the case)</b>고 했습니다.<br><b>ㅂ (T)</b> 교안 4쪽 첫 문장입니다.`,
   src:[["08-1", "s3", "다수결이 정확해지는 이유"]] },

{ type:'ox',
   lv:'기초',
   unit:"Bagging(배깅) · Pasting(페이스팅)",
   pts:13,
   q:`<p>Bagging과 Pasting에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Bagging과 Pasting은 예측기마다 서로 다른 학습 알고리즘을 쓴다.`,false],[`Bagging은 sampling with replacement(복원 추출)를 한다.`,true],[`Pasting은 sampling with replacement(복원 추출)를 한다.`,false],[`bootstrap(부트스트랩)은 sampling without replacement(비복원 추출)를 뜻한다.`,false],[`Bagging 앙상블은 원래 학습 세트로 학습한 단일 예측기와 비교해 bias(편향)는 비슷하고 variance(분산)는 더 낮다.`,true],[`분산이 σ<sup>2</sup>인 값을 독립으로 K번 측정해 평균하면 그 평균의 분산은 <span class="frac"><span class="num">σ<sup>2</sup></span><span class="den">K</span></span>가 되며, 이것이 배깅이 분산을 줄이는 이유이다.`,true],[`기댓값이 μ인 값을 K번 측정해 평균하면 그 평균의 기댓값은 <span class="frac"><span class="num">μ</span><span class="den">K</span></span>이다.`,false]],
   exp:`<b>ㄱ (F)</b> 모든 예측기에 <b>같은 학습 알고리즘</b>을 쓰고, 학습 세트의 서로 다른 무작위 부분집합으로 학습시킵니다(교안 6쪽).<br><b>ㄴ (T)</b> 교안 6쪽 "Bagging (Bootstrapping): sampling with replacement".<br><b>ㄷ (F)</b> Pasting은 sampling <b>without</b> replacement(비복원 추출)입니다.<br><b>ㄹ (F)</b> <b>복원 추출(with replacement)</b> = bootstrap입니다(교안 6쪽 그림).<br><b>ㅁ (T)</b> 교안 7쪽 첫 문장입니다.<br><b>ㅂ (T)</b> 교안 7쪽: Var = <span class="frac"><span class="num">Kσ<sup>2</sup></span><span class="den">K<sup>2</sup></span></span> = <span class="frac"><span class="num">σ<sup>2</sup></span><span class="den">K</span></span>.<br><b>ㅅ (F)</b> 평균의 기댓값은 그대로 <b>μ</b>입니다. 줄어드는 것은 분산입니다.`,
   src:[["08-1", "s5", "배깅과 페이스팅"], ["08-1", "s6", "배깅이 분산을 줄이는 이유"]] },

{ type:'ox',
   lv:'기초',
   unit:"Random Forest(랜덤 포레스트)",
   pts:15,
   q:`<p>Random Forest와 변수 중요도에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Random Forest는 decision tree(결정 트리)들의 앙상블이며, 보통 bagging 방법으로 학습한다.`,true],[`Random Forest는 노드를 나눌 때 가장 좋은 feature(특징)를 전체 특징 중에서 찾는다.`,false],[`Random Forest는 이 추가 무작위성 때문에 트리가 더 다양해진다.`,true],[`Random Forest는 각 특징(feature)의 상대적 중요도를 측정하기 어렵다는 단점이 있다.`,false],[`Random Forest 회귀(regression)는 모든 트리의 예측 중 가장 큰 값을 최종 예측으로 쓴다.`,false],[`OOB(Out-of-Bag) 샘플은 bootstrap sampling(부트스트랩 추출)에서 선택되지 않은 학습 샘플이다.`,true],[`OOB 순열 변수 중요도는 특징 x<sub>i</sub>를 섞었을(permute) 때의 OOB 오차와 원래 OOB 오차의 차이로 계산한다.`,true],[`OOB 데이터에서 특징을 무작위로 섞었을 때 예측 오차가 일관되게 커지면 그 특징은 중요하다.`,true]],
   exp:`<b>ㄱ (T)</b> 교안 10쪽 정의(가끔 pasting).<br><b>ㄴ (F)</b> 전체가 아니라 <b>무작위로 고른 특징 부분집합(random subset of features)</b> 중에서 가장 좋은 특징을 찾습니다.<br><b>ㄷ (T)</b> 교안 10쪽 "greater tree diversity".<br><b>ㄹ (F)</b> 반대로 <b>측정하기 쉬운 것</b>이 장점이라고 했습니다(교안 10쪽 "easy to measure the relative importance of each feature").<br><b>ㅁ (F)</b> 모든 트리의 예측을 <b>평균(Average All Predictions)</b>해 최종 예측을 냅니다(교안 11쪽).<br><b>ㅂ (T)</b> 교안 12쪽 정의입니다.<br><b>ㅅ (T)</b> 교안 12–13쪽: d = p − e.<br><b>ㅇ (T)</b> 교안 13쪽 첫 문장입니다.`,
   src:[["08-1", "s9", "랜덤 포레스트"], ["08-1", "s10", "랜덤 포레스트의 예측"], ["08-1", "s11", "OOB 순열 변수 중요도"]] },

{ type:'ox',
   lv:'기초',
   unit:"Boosting(부스팅) · AdaBoost",
   pts:15,
   q:`<p>Boosting과 AdaBoost에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Boosting은 여러 weak learner(약한 학습기)를 결합해 strong learner(강한 학습기)를 만들 수 있는 앙상블 방법을 말한다.`,true],[`대부분의 Boosting은 예측기를 sequentially(순차적으로) 학습하며, 각 예측기는 앞 예측기를 바로잡으려 한다.`,true],[`AdaBoost는 잘못 분류된 샘플의 weight(가중치)를 줄인다.`,false],[`AdaBoost에서 새 예측기는 점점 더 어려운 샘플(hard cases)에 집중한다.`,true],[`AdaBoost에서 각 샘플의 초기 가중치는 모두 1이다.`,false],[`AdaBoost에서 예측기가 정확할수록 예측기 가중치 α<sub>j</sub>는 작다.`,false],[`AdaBoost에서 예측기가 무작위 추측보다 못하면 α<sub>j</sub>는 음수가 된다.`,true],[`AdaBoost의 최종 예측은 예측기 가중치 α<sub>j</sub>를 쓰는 weighted majority vote(가중 다수결)이다.`,true]],
   exp:`<b>ㄱ (T)</b> 교안 14쪽 정의입니다.<br><b>ㄴ (T)</b> 교안 14쪽입니다.<br><b>ㄷ (F)</b> 잘못 분류된 샘플의 가중치를 <b>늘립니다(increase)</b>.<br><b>ㄹ (T)</b> 교안 15쪽입니다.<br><b>ㅁ (F)</b> 초기 가중치는 <span class="frac"><span class="num">1</span><span class="den">m</span></span>입니다(m = 학습 샘플 수, 교안 18쪽).<br><b>ㅂ (F)</b> 정확할수록 α<sub>j</sub>는 <b>큽니다</b>(교안 18쪽 "If the predictor is accurate, α<sub>j</sub> is high.").<br><b>ㅅ (T)</b> 교안 18쪽입니다.<br><b>ㅇ (T)</b> 교안 19쪽입니다.`,
   src:[["08-1", "s12", "부스팅"], ["08-1", "s13", "AdaBoost 과정"], ["08-1", "s15", "가중 오차율과 예측기 가중치"], ["08-1", "s16", "가중치 갱신과 최종 예측"]] },

{ type:'ox',
   lv:'기초',
   unit:"Gradient Boosting · XGBoost",
   pts:12,
   q:`<p>Gradient Boosting(그래디언트 부스팅)과 XGBoost에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Gradient Boosting은 AdaBoost처럼 예측기를 순차적으로 더해 앙상블을 만든다.`,true],[`Gradient Boosting은 샘플 가중치를 조정하는 대신, 앞 예측기가 만든 residual error(잔차)에 새 예측기를 맞춘다.`,true],[`Gradient Boosting은 regression(회귀) 문제에만 쓸 수 있다.`,false],[`XGBoost(Extreme Gradient Boosting)는 bagging 알고리즘이다.`,false],[`XGBoost는 regularization(규제)을 이용해 overfitting(과적합)을 줄인다.`,true],[`XGBoost의 장점에는 missing data(결측 데이터)를 효율적으로 처리한다는 것이 있다.`,true]],
   exp:`<b>ㄱ (T)</b> 교안 20쪽입니다.<br><b>ㄴ (T)</b> 교안 20쪽입니다.<br><b>ㄷ (F)</b> regression, classification(분류), ranking(순위) 등 여러 문제에 쓸 수 있다고 했습니다.<br><b>ㄹ (F)</b> XGBoost는 <b>gradient boosting</b> 알고리즘입니다(교안 23쪽).<br><b>ㅁ (T)</b> 교안 23쪽 정의와 장점 그림입니다.<br><b>ㅂ (T)</b> 교안 23쪽 그림입니다.`,
   src:[["08-1", "s17", "그래디언트 부스팅"], ["08-1", "s20", "XGBoost"], ["08-1", "s21", "결정 트리에서 XGBoost까지"]] },

{ type:'ox',
   lv:'기초',
   unit:"Stacking(스태킹)",
   pts:8,
   q:`<p>Stacking과 방법 비교에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Stacking은 예측을 단순한 함수로 합치는 대신, 합치는 일을 하는 모델을 학습시킨다.`,true],[`Stacking에서 예측들을 합치도록 학습하는 모델을 Blender(블렌더)라고 한다.`,true],[`Stacking에서 학습 세트를 Subset 1, 2로 나누면, 첫 번째 층(first layer)의 예측기는 Subset 2로 학습한다.`,false],[`Boosting은 병렬 학습(parallel training)을 효율적으로 지원한다는 장점이 있다.`,false]],
   exp:`<b>ㄱ (T)</b> 교안 25쪽입니다.<br><b>ㄴ (T)</b> 교안 25쪽 그림 "Blending", "Blender".<br><b>ㄷ (F)</b> 첫 번째 층은 <b>Subset 1</b>로 학습합니다. Subset 2는 블렌더 학습 데이터를 만드는 데 씁니다.<br><b>ㄹ (F)</b> 병렬 학습 지원은 <b>Bagging</b>의 장점입니다(교안 26쪽). Boosting은 순차 학습입니다.`,
   src:[["08-1", "s22", "스태킹"], ["08-1", "s23", "방법 비교"]] }
];
