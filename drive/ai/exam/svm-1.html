{ type:'ox',
   lv:'기초',
   unit:"초평면과 부호",
   pts:12,
   q:`<p>초평면 1 + 2X<sub>1</sub> + 3X<sub>2</sub> = 0과 분리 초평면에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`4차원 공간의 초평면은 3차원이다.`,true],[`점 (1, −1)을 식에 넣으면 값이 0이므로 이 점은 초평면 위에 있다.`,true],[`점 (−1, 0)은 식의 값이 양수인 영역에 있다.`,false],[`새 점 x*는 f(x*) = β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub>* + ⋯ + β<sub>p</sub>x<sub>p</sub>*의 부호로 클래스를 정한다.`,true],[`분리 초평면으로 분류하는 방법의 핵심 가정은 두 클래스가 선형 결정 경계로 나뉠 수 있다는 것이다.`,true],[`학습 데이터를 100% 맞게 나누는 초평면은 모두 최대 마진 초평면이다.`,false]],
   exp:`<b>ㄱ (T)</b> p차원 공간의 초평면은 (p − 1)차원입니다. 4차원 이상은 그릴 수 없을 뿐 정의는 같습니다.<br><b>ㄴ (T)</b> 1 + 2(1) + 3(−1) = 0. 식 값이 0인 점이 초평면 위의 점입니다.<br><b>ㄷ (F)</b> 1 + 2(−1) + 0 = <b>−1 &lt; 0</b>이므로 음수 영역(교안 5쪽의 보라 영역)입니다.<br><b>ㄹ (T)</b> 양수면 한 클래스, 음수면 다른 클래스입니다. 초평면이 결정 경계 역할을 합니다.<br><b>ㅁ (T)</b> 교안 6쪽 Key assumption.<br><b>ㅂ (F)</b> 학습 데이터를 모두 맞게 나누는 분리 초평면은 무한히 많고, 그중 학습 데이터에서 <b>가장 멀리 떨어진 하나</b>만 최대 마진 초평면입니다.`,
   src:[["06-2", "s2", "초평면"], ["06-2", "s3", "분리 초평면 예시"], ["06-2", "s4", "분리 초평면으로 분류"]] },

{ type:'ox',
   lv:'기초',
   unit:"하드 마진 제약 읽기",
   pts:15,
   q:`<p>하드 마진 SVM 문제 max M, subject to ∑β<sub>j</sub><sup>2</sup> = 1, y<sup>(i)</sup>(β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub><sup>(i)</sup> + ⋯ + β<sub>p</sub>x<sub>p</sub><sup>(i)</sup>) ≥ M (모든 i)에 대한 설명이다. 여기서 f(x) = β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub> + ⋯ + β<sub>p</sub>x<sub>p</sub>이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`y = +1인 점은 f(x) ≥ M이어야 한다.`,true],[`y = −1인 점은 f(x) ≥ −M이어야 한다.`,false],[`레이블을 0과 1이 아니라 −1과 +1로 쓰기 때문에 두 클래스의 조건을 y·f(x) ≥ M 한 줄로 쓸 수 있다.`,true],[`점이 올바르게 분류되면 y·f(x)는 음수이다.`,false],[`이 문제의 목적은 마진 M을 가장 작게 만드는 β를 찾는 것이다.`,false],[`y<sup>(i)</sup>·f(x<sup>(i)</sup>) = M으로 등호가 성립하는 점이 서포트 벡터이다.`,true],[`M을 계속 키우면 어느 순간 두 클래스의 어떤 점이 제약을 어기게 되며, 그 직전에 마진 경계에 닿은 점들이 서포트 벡터가 된다.`,true]],
   exp:`<b>ㄱ (T)</b> 수업 중 교수님 설명: y가 1일 때는 M보다 커야 합니다.<br><b>ㄴ (F)</b> y = −1인 점은 f(x) <b>≤ −M</b>(−M보다 작아야)입니다. y = −1을 곱해 부등호가 뒤집힌 결과가 y·f(x) ≥ M입니다.<br><b>ㄷ (T)</b> y = −1인 경우 f(x) ≤ −M의 양변에 −1을 곱하면 −f(x) ≥ M, 즉 y·f(x) ≥ M이 됩니다. y = +1이면 f(x) ≥ M 그대로 y·f(x) ≥ M입니다.<br><b>ㄹ (F)</b> 올바르게 분류되면 y와 f(x)의 부호가 같아 y·f(x)는 <b>양수</b>입니다. 틀리면 음수입니다.<br><b>ㅁ (F)</b> max M — 마진을 <b>가장 크게</b> 만드는 β를 찾습니다.<br><b>ㅂ (T)</b> 등호가 성립하는 점 = 초평면까지의 거리가 정확히 마진인 점 = 서포트 벡터입니다.<br><b>ㅅ (T)</b> 서포트 벡터가 "선정되는" 과정입니다. 사람이 고르지 않고 최적화의 결과로 정해집니다.`,
   src:[["06-2", "s6", "하드 마진 SVM"]] },

{ type:'ox',
   lv:'기초',
   unit:"단위벡터 · 스케일링 함정",
   pts:15,
   q:`<p>단위벡터 조건과 특징 스케일링에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`∑β<sub>j</sub><sup>2</sup> = 1 조건이 없으면 β와 b에 같은 상수를 곱해, 초평면은 그대로인데 y(β<sup>⊤</sup>x + b) 값만 상수배로 바꿀 수 있다.`,true],[`같은 초평면 x<sub>1</sub> + x<sub>2</sub> − 5 = 0과 2x<sub>1</sub> + 2x<sub>2</sub> − 10 = 0에 점 (2, 2), y = +1을 넣으면 y(β<sup>⊤</sup>x + b) 값은 둘 다 −1이다.`,false],[`단위벡터 조건은 같은 초평면인데 마진 값이 달라지는 문제를 없애기 위한 것이다.`,true],[`특징마다 범위가 다르면 normal vector(법선벡터)가 왜곡되어 마진이 잘못 정해진다.`,true],[`범위가 0~80인 특징과 0~6인 특징을 그대로 쓰면 범위가 작은 특징이 거리를 지배한다.`,false],[`표준화한 값은 항상 0과 1 사이에 있다.`,false],[`최소-최대 정규화는 학습 데이터 값을 [0, 1]로 옮기며, 학습 범위 안에서 상대적 위치를 유지한다.`,true]],
   exp:`<b>ㄱ (T)</b> 교안 10쪽: 같은 초평면인데 값이 달라지는 불일치(inconsistency). 그래서 β의 길이를 1로 고정합니다.<br><b>ㄴ (F)</b> Case 1은 (+1)(2 + 2 − 5) = −1, Case 2는 (+1)(4 + 4 − 10) = <b>−2</b>로 다릅니다(교안 10쪽). 이 불일치 때문에 단위벡터 조건이 필요합니다.<br><b>ㄷ (T)</b> β의 길이를 1로 맞추면 y·f(x)가 점과 초평면 사이의 실제 거리가 되어 값이 하나로 정해집니다.<br><b>ㄹ (T)</b> 교안 11쪽 "Different feature ranges distort the normal vector".<br><b>ㅁ (F)</b> 범위가 <b>큰</b> 특징(0~80)의 차이가 거리를 거의 다 차지합니다. 그래서 경계가 한쪽으로 쏠립니다.<br><b>ㅂ (F)</b> 표준화는 평균 0, 분산 1로 만들 뿐 <b>범위를 고정하지 않습니다</b>(Does not restrict values to a fixed range). [0, 1]로 옮기는 것은 최소-최대 정규화입니다.<br><b>ㅅ (T)</b> 교안 12쪽 "Preserves relative positions within the training range".`,
   src:[["06-2", "s7", "법선벡터·단위벡터"], ["06-2", "s8", "데이터 스케일"]] },

{ type:'ox',
   lv:'기초',
   unit:"하드 마진 vs 소프트 마진",
   pts:15,
   q:`<p>하드 마진과 소프트 마진을 구분하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`하드 마진 SVM은 점 하나가 추가되어도 경계가 크게 기울고 마진이 좁아질 수 있다.`,true],[`소프트 마진 SVM은 오분류를 일부 허용하는 대신 개별 점 하나에 경계가 덜 흔들린다.`,true],[`소프트 마진 SVM의 서포트 벡터는 마진 경계 위에 정확히 있는 점뿐이다.`,false],[`소프트 마진 SVM에서 초평면 반대편에 있는 오분류 점도 서포트 벡터이다.`,true],[`소프트 마진 제약 y·f(x) ≥ M(1 − ε<sub>i</sub>)에서 ε<sub>i</sub> = 0이면 하드 마진과 같은 조건이 된다.`,true],[`같은 제약에서 ε<sub>i</sub> = 1이면 우변이 0이 되므로, ε<sub>i</sub>가 1을 넘을 때부터 오분류(y·f(x) &lt; 0)가 허용된다.`,true],[`자기 클래스 편 마진 바깥에 있는 점은 ε<sub>i</sub> &gt; 0이다.`,false]],
   exp:`<b>ㄱ (T)</b> 교안 13쪽 그림: 모든 점을 맞게 두어야 하므로 그 한 점에 맞추려고 경계 전체가 움직입니다.<br><b>ㄴ (T)</b> 하드 마진의 단점(개별 관측값에 민감)을 푸는 방법이 소프트 마진입니다.<br><b>ㄷ (F)</b> 마진 위의 점에 더해 <b>자기 클래스 기준 마진의 반대편에 있는 점</b>(마진 위반·오분류 점)도 서포트 벡터입니다(교안 15쪽).<br><b>ㄹ (T)</b> 교안 15쪽 그림의 11, 12번 점(오분류)도 서포트 벡터입니다.<br><b>ㅁ (T)</b> M(1 − 0) = M이므로 y·f(x) ≥ M, 하드 마진 조건과 같습니다.<br><b>ㅂ (T)</b> ε<sub>i</sub> = 1이면 y·f(x) ≥ 0(초평면 위 또는 올바른 편). 1을 넘으면 y·f(x)가 음수여도 되므로 오분류입니다. 그래서 1이 기준입니다.<br><b>ㅅ (F)</b> 마진 바깥 올바른 편에 있는 점은 위반이 없으므로 <b>ε<sub>i</sub> = 0</b>이고, 서포트 벡터도 아닙니다.`,
   src:[["06-2", "s9", "최대 마진 분류기의 단점"], ["06-2", "s10", "소프트 마진"], ["06-2", "s11", "슬랙 변수"]] },

{ type:'ox',
   lv:'기초',
   unit:"★ 벌점 매개변수 C 함정",
   pts:21,
   q:`<p>Penalty parameter C(벌점 매개변수 C)와 C의 정의에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`벌점 매개변수 C를 작은 값에서 큰 값으로 바꾸면 편향은 커지고 분산은 작아진다.`,false],[`벌점 매개변수 C가 작을수록 분류 오류를 줄이는 것을 더 중요하게 여긴다.`,false],[`벌점 매개변수 C가 작아 마진이 넓으면 마진 안에 들어오는 점이 많아 서포트 벡터가 대체로 많아진다.`,true],[`벌점 매개변수 C를 크게 하면 학습 데이터의 오류는 줄 수 있지만 새 데이터에서는 성능이 나빠질 수 있다.`,true],[`과적합된 SVM은 벌점 매개변수 C를 더 크게 해서 고친다.`,false],[`과소적합된 SVM이라면 벌점 매개변수 C를 크게 해 보는 것이 맞는 방향이다.`,true],[`벌점 매개변수 C는 test data(테스트 데이터) 정확도가 가장 높게 나오는 값으로 고른다.`,false],[`벌점 매개변수 C가 클수록 학습 데이터가 조금만 바뀌어도 결정 경계가 크게 흔들린다.`,true],[`제약 ∑ε<sub>i</sub> ≤ C로 정의된 C(위반 허용 총량)를 크게 하면 위반을 더 많이 허용하므로 마진이 넓어진다.`,true],[`제약 ∑ε<sub>i</sub> ≤ C로 정의된 C가 0이면 위반이 전혀 허용되지 않아, 해가 있다면 최대 마진 분류기가 된다.`,true]],
   exp:`<b>ㄱ (F)</b> 반대입니다. C가 커지면 편향은 <b>작아지고</b> 분산은 <b>커집니다</b>(Small C: high bias, low variance → Large C: low bias, high variance, 교안 19쪽). 이것이 C에 따른 편향-분산 트레이드오프입니다(교안 18쪽).<br><b>ㄴ (F)</b> 작은 C는 오류를 <b>어느 정도 허용</b>하고 넓은 마진을 택합니다. 오류를 줄이는 데 집중하는 것은 큰 C입니다(교안 19쪽).<br><b>ㄷ (T)</b> 소프트 마진에서는 마진 안의 점도 서포트 벡터이므로, 넓은 마진(작은 벌점 C)일수록 서포트 벡터가 많습니다.<br><b>ㄹ (T)</b> 큰 C는 학습 데이터를 빡빡하게 나누므로 과적합(overfitting) 위험이 있습니다.<br><b>ㅁ (F)</b> 과적합이면 C를 <b>작게</b> 해 마진을 넓히고 오류를 어느 정도 허용해야 합니다.<br><b>ㅂ (T)</b> 작은 C = 과소적합이므로, C를 키우면 오류를 더 엄격히 벌해 모델이 데이터를 더 따라갑니다.<br><b>ㅅ (F)</b> C는 <b>교차 검증(cross-validation)</b>으로 고릅니다(교안 18쪽). 테스트 데이터로 고르면 테스트 정보가 모델 선택에 섞입니다.<br><b>ㅇ (T)</b> 큰 C = 저편향·<b>고분산</b>. 분산이 높다는 것이 데이터에 따라 크게 흔들린다는 뜻입니다.<br><b>ㅈ (T)</b> 이 C는 위반의 <b>예산(상한)</b>입니다(교안 16쪽 식). 예산이 크면 위반을 많이 허용해 마진이 넓어집니다. 벌점 C와 방향이 반대인 것에 주의합니다.<br><b>ㅊ (T)</b> 모든 ε<sub>i</sub> = 0이 되어 하드 마진과 같습니다(교안 18쪽 "If C = 0, we recover the maximal margin classifier"). 이 문장은 예산 정의에서 성립합니다. 벌점 정의에서는 C → ∞일 때 하드 마진에 가까워집니다.`,
   src:[["06-2", "s12", "벌점 매개변수 C"], ["06-2", "s13", "편향-분산 트레이드오프"]] },

{ type:'ox',
   lv:'기초',
   unit:"편향-분산 · 비선형",
   pts:12,
   q:`<p>편향-분산과 비선형 데이터에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`같은 모델을 학습 데이터만 바꿔 여러 번 학습했을 때 예측들이 정답에서 벗어난 곳에 촘촘히 모여 있으면 편향이 높고 분산이 낮다.`,true],[`복잡도가 가장 낮은 모델이 total error(전체 오차)도 가장 작다.`,false],[`과소적합된 모델은 편향이 낮고 분산이 높다.`,false],[`곡선 모양 데이터에 직선을 맞춘 모델은 과소적합에 해당한다.`,true],[`XOR처럼 배치된 데이터에 새 특징 x<sub>1</sub>x<sub>2</sub>를 세 번째 축으로 추가하면 평면 하나로 두 클래스를 나눌 수 있다.`,true],[`가운데와 바깥 원으로 나뉜 데이터를 높이 축을 더해 평면으로 나눈 뒤 원래 2차원에서 보면, 경계는 직선이 된다.`,false]],
   exp:`<b>ㄱ (T)</b> 중심이 정답에서 벗어남 = 높은 편향, 촘촘함 = 낮은 분산입니다(교안 20쪽 과녁 그림의 왼쪽 아래).<br><b>ㄴ (F)</b> 복잡도가 낮으면 Bias<sup>2</sup>가 커서 전체 오차가 큽니다. 전체 오차는 U자라서 <b>가운데</b>에서 가장 작습니다.<br><b>ㄷ (F)</b> 과소적합은 <b>편향 높음, 분산 낮음</b>입니다. 편향 낮음·분산 높음은 과적합입니다.<br><b>ㄹ (T)</b> 교안 20쪽 Underfit 그림: 모델이 너무 단순해 패턴을 못 잡습니다.<br><b>ㅁ (T)</b> 부호가 같은 점은 x<sub>1</sub>x<sub>2</sub> &gt; 0, 다른 점은 x<sub>1</sub>x<sub>2</sub> &lt; 0이므로 평면 x<sub>1</sub>x<sub>2</sub> = 0으로 나뉩니다(교안 26쪽 그림).<br><b>ㅂ (F)</b> 원래 2차원에서 보면 경계는 <b>원(곡선)</b>입니다. 확장 공간의 선형 경계가 원래 공간에서는 비선형 경계가 됩니다.`,
   src:[["06-2", "s13", "편향-분산 트레이드오프"], ["06-2", "s15", "특징 공간 확장"]] },

{ type:'ox',
   lv:'기초',
   unit:"영어 정의 구분",
   pts:10,
   q:`<p>영어 문장과 개념을 짝지은 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`"training observations whose distance to the hyperplane is equal to the margin"은 support vectors(서포트 벡터)의 정의이다.`,true],[`"the largest distance between any training observation and the hyperplane"은 margin(마진)의 올바른 정의이다.`,false],[`Maximal margin classifier(최대 마진 분류기)는 Soft Margin SVM의 다른 이름이다.`,false],[`"Small C: large margin, high bias, low variance"는 벌점 매개변수 C에 대한 올바른 설명이다.`,true],[`"training samples are allowed to be on the wrong side of the margin or hyperplane"은 Hard Margin SVM에 대한 설명이다.`,false]],
   exp:`<b>ㄱ (T)</b> 교안 7쪽 정의 그대로입니다.<br><b>ㄴ (F)</b> 마진은 <b>smallest</b> distance(가장 작은 거리)입니다.<br><b>ㄷ (F)</b> Maximal margin classifier = <b>Hard Margin SVM</b>입니다(교안 2쪽). Soft Margin SVM은 Linear SVM이라고도 적혀 있습니다.<br><b>ㄹ (T)</b> 교안 19쪽 Small C 항목입니다.<br><b>ㅁ (F)</b> 마진·초평면 반대편을 허용하는 것은 <b>Soft Margin SVM</b>입니다(교안 14쪽). 하드 마진은 위반을 전혀 허용하지 않습니다.`,
   src:[["06-2", "s5", "최대 마진·서포트 벡터"], ["06-2", "s10", "소프트 마진"], ["06-2", "s12", "벌점 매개변수 C"], ["06-2", "s1", "서포트 벡터 머신"]] }
