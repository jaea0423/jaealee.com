   model:`① 각 관측치에 1부터 K까지 번호를 무작위로 배정한다. ② 배정이 더 이상 바뀌지 않을 때까지, 군집마다 특징별 평균으로 중심(centroid)을 계산하고 각 관측치를 유클리드 거리로 가장 가까운 중심의 군집에 다시 배정하는 것을 반복한다. 중심을 군집 점들의 평균으로 옮기기 때문에 K-means라 한다. 결과는 처음 중심(초기 배정)에 따라 달라지고, 나쁜 시작점이면 나쁜 국소 최솟값에 수렴할 수 있다. K-means++는 1단계(초기화)만 바꿔, 첫 중심은 무작위로 고르고 다음 중심은 가장 가까운 기존 중심까지 거리의 제곱에 비례하는 확률로 뽑아 중심이 고르게 퍼지게 하며 나머지 단계는 그대로 둔다.`,
   rubric:[[`무작위 배정 → (중심 계산 ↔ 재배정) 반복, 배정이 안 바뀌면 종료`,3],[`중심 = 군집의 평균이라 K-means`,2],[`초기 중심 의존·국소 최솟값`,2],[`K-means++: 초기화만 변경, 거리 제곱에 비례하는 확률`,3]],

   model:`① K-평균은 중심까지의 거리로 묶는 거리 기반 방법이고, DBSCAN은 ε-이웃에 MinPts개 이상 점이 모인 빽빽한 영역을 군집으로 보는 밀도 기반 방법이다. ② K-평균은 군집 수 K를 미리 정해야 하지만, DBSCAN은 ε과 MinPts만 정하면 군집 수가 저절로 정해진다. ③ K-평균은 모든 점이 반드시 한 군집에 속하므로 외딴 고객도 가장 가까운 군집에 억지로 들어가 중심을 끌어당긴다. DBSCAN은 핵심점의 이웃에도 들지 못한 외딴 고객을 잡음(noise)으로 남긴다. 따라서 고밀도 지역을 찾고 외딴 고객을 따로 가려내려는 이 데이터에는 DBSCAN이 더 알맞다.`,
