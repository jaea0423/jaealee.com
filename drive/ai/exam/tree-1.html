const EXAM = [
{ type:'ox',
   lv:'하',
   unit:"해석 · 노드 읽기",
   pts:13,
   q:`<p>결정 트리의 해석과 노드 읽기에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`트리를 여러 개 합치면 예측 정확도와 해석력이 모두 좋아진다.`,false],[`특징의 단위를 cm에서 mm로 바꿔 다시 학습해도 기준값의 숫자만 바뀔 뿐 데이터가 나뉘는 방식은 같다.`,true],[`결정 트리는 특징 scaling(스케일링)은 필요 없지만 centering(중심화)은 필요하다.`,false],[`노드의 value가 [0, 49, 5]이면 그 노드의 class는 세 번째 클래스이다.`,false],[`노드의 samples 값은 그 노드 value에 적힌 클래스별 샘플 수를 모두 더한 값과 같다.`,true],[`리프가 아닌 노드에도 class가 표시되며, 이는 그 노드에서 멈춘다면 낼 예측이다.`,true]],
   exp:`<b>ㄱ (F)</b> 정확도는 좋아지지만 해석력은 <b>일부 잃습니다</b>(at the expense of some loss of interpretation).<br><b>ㄴ (T)</b> "특징 ≤ 기준값"만 묻기 때문입니다. 그래서 스케일링이 필요 없습니다.<br><b>ㄷ (F)</b> 결정 트리는 스케일링과 중심화가 <b>모두</b> 필요 없습니다(교안 3쪽 "don’t require feature scaling or centering at all").<br><b>ㄹ (F)</b> class는 가장 많은 클래스이므로 49개인 <b>두 번째 클래스</b>입니다.<br><b>ㅁ (T)</b> 예: value = [50, 50, 50]이면 samples = 150입니다.<br><b>ㅂ (T)</b> 모든 노드에 class(가장 많은 클래스)가 있고, 최종 예측은 리프의 class입니다.`,
   src:[["07-2", "s2", "장단점"], ["07-2", "s3", "용어 — 트리 읽기"]] },

{ type:'ox',
   lv:'하',
   unit:"결정 경계 · 한계",
   pts:13,
   q:`<p>결정 경계와 결정 트리의 한계에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`결정 트리의 경계가 축에 평행한 것은 한 번에 특징 하나만 보고 나누기 때문이다.`,true],[`결정 트리의 깊이를 늘리면 결정 경계가 곡선으로 바뀐다.`,false],[`실제 경계가 축에 평행한 직사각형이면 선형 모델이 직선 하나로 이를 정확히 나눌 수 있다.`,false],[`선형 모델과 트리 모델 중 어느 것이 나은지는 데이터의 실제 구조가 어떤 모양이냐에 달려 있다.`,true],[`결정 트리가 학습 데이터의 회전에 민감한 이유는 모든 분할이 축에 수직이기 때문이다.`,true],[`결정 트리가 작은 변화에 민감하다는 것은 학습 데이터가 조금만 바뀌어도 트리 구조가 크게 바뀔 수 있다는 뜻이다.`,true]],
   exp:`<b>ㄱ (T)</b> 분할 규칙이 "x<sub>k</sub> ≤ 기준값" 꼴이라 경계가 항상 축에 평행합니다.<br><b>ㄴ (F)</b> 깊이를 늘리면 축에 평행한 분할이 <b>더 많아질</b> 뿐, 경계는 여전히 축에 평행한 선분들입니다.<br><b>ㄷ (F)</b> 선형 모델은 대각선 하나로밖에 못 나눠 잘 맞지 않고, <b>트리</b>가 분할 두 번으로 잘 맞습니다(교안 34쪽 아래 줄).<br><b>ㄹ (T)</b> 교안 34쪽의 결론입니다.<br><b>ㅁ (T)</b> "all splits are perpendicular to an axis, which makes them sensitive to training set rotation".<br><b>ㅂ (T)</b> 위쪽(루트)에서 고른 특징이 바뀌면 그 아래 전체가 바뀌기 때문입니다.`,
   src:[["07-2", "s4", "결정 경계"], ["07-2", "s16", "선형 vs 트리"], ["07-2", "s17", "결정 트리의 한계"]] },

{ type:'ox',
   lv:'하',
   unit:"지니 함정",
   pts:13,
   q:`<p>지니 지수 G = 1 − ∑<sub>k</sub> p<sub>k</sub><sup>2</sup> 에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`지니 지수는 클수록 순수한 노드이다.`,false],[`지니 지수의 최댓값은 클래스 수와 관계없이 0.5이다.`,false],[`클래스가 4개일 때 지니 지수의 최댓값은 <span class="frac"><span class="num">3</span><span class="den">4</span></span>이다.`,true],[`클래스별 샘플 수가 [3, 1]인 노드의 지니 지수는 <span class="frac"><span class="num">3</span><span class="den">8</span></span>이다.`,true],[`클래스별 샘플 수가 [1, 3]인 노드와 [3, 1]인 노드는 지니 지수가 다르다.`,false],[`p<sub>i,k</sub>는 노드 i에 있는 클래스 k의 샘플 수를 노드 i의 전체 샘플 수로 나눈 값이다.`,true]],
   exp:`<b>ㄱ (F)</b> 지니는 <b>작을수록</b> 순수합니다. 0 = 한 클래스뿐.<br><b>ㄴ (F)</b> 최댓값은 1 − <span class="frac"><span class="num">1</span><span class="den">클래스 수</span></span>로 클래스 수에 따라 다릅니다. 2클래스 0.5, 3클래스 <span class="frac"><span class="num">2</span><span class="den">3</span></span>.<br><b>ㄷ (T)</b> 1 − <span class="frac"><span class="num">1</span><span class="den">4</span></span> = <span class="frac"><span class="num">3</span><span class="den">4</span></span>. 네 클래스가 <span class="frac"><span class="num">1</span><span class="den">4</span></span>씩 있을 때입니다.<br><b>ㄹ (T)</b> 1 − (<span class="frac"><span class="num">3</span><span class="den">4</span></span>)<sup>2</sup> − (<span class="frac"><span class="num">1</span><span class="den">4</span></span>)<sup>2</sup> = 1 − <span class="frac"><span class="num">9</span><span class="den">16</span></span> − <span class="frac"><span class="num">1</span><span class="den">16</span></span> = <span class="frac"><span class="num">6</span><span class="den">16</span></span> = <span class="frac"><span class="num">3</span><span class="den">8</span></span>.<br><b>ㅁ (F)</b> 지니는 비율의 제곱을 더하므로 어느 클래스가 많은지와 관계없이 <b>같습니다</b>(둘 다 <span class="frac"><span class="num">3</span><span class="den">8</span></span>).<br><b>ㅂ (T)</b> p<sub>i,k</sub> = <span class="frac"><span class="num"><span style="display:inline-block;padding-bottom:.32em">N<sub>k,i</sub></span></span><span class="den">N<sub>i</sub></span></span> (교안 6쪽).`,
   src:[["07-2", "s5", "좋은 분할과 지니"], ["07-2", "s9", "지니 예제 — CART"]] },

{ type:'ox',
   lv:'하',
   unit:"엔트로피 · 지니 구분",
   pts:13,
   q:`<p>엔트로피와 지니 지수를 구분하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`엔트로피 식 앞에 마이너스(−)가 붙는 것은 0 ≤ p ≤ 1이면 log p ≤ 0이므로 엔트로피를 0 이상으로 만들기 위해서이다.`,true],[`이진 분류에서 두 클래스가 반반이면 지니 지수는 1, 엔트로피(log<sub>2</sub>)는 0.5이다.`,false],[`지니 지수와 엔트로피는 둘 다 한 클래스만 있는 순수 노드에서 0이다.`,true],[`지니 지수는 엔트로피보다 소수 클래스에 더 민감하게 반응한다.`,false],[`엔트로피 합에서 비율이 0인 클래스를 빼는 것은 log 0이 정의되지 않기 때문이다.`,true],[`지니 지수와 엔트로피 중 어느 것으로 불순도를 잴지는 criterion 하이퍼파라미터로 정한다.`,true]],
   exp:`<b>ㄱ (T)</b> p가 1 이하라 log p가 0 이하이므로 −를 붙여 양수로 만듭니다.<br><b>ㄴ (F)</b> 반대입니다. 반반일 때 지니는 <b>0.5</b>, 엔트로피는 <b>1</b>입니다. 둘 다 이때 최대입니다(교안 8쪽).<br><b>ㄷ (T)</b> 둘 다 순수 노드에서 0, 고르게 섞일수록 커집니다.<br><b>ㄹ (F)</b> 소수 클래스에 더 민감할 수 있는 것은 <b>엔트로피</b>입니다. 지니는 약간 더 빠른 기본값입니다.<br><b>ㅁ (T)</b> 식의 합 조건 p<sub>i,k</sub> ≠ 0 (교안 7쪽).<br><b>ㅂ (T)</b> 교안 5쪽 "setting the criterion hyperparameter to entropy".`,
   src:[["07-2", "s6", "엔트로피"], ["07-2", "s7", "지니 vs 엔트로피"]] },

{ type:'ox',
   lv:'하',
   unit:"규제 방향",
   pts:12,
   q:`<p>결정 트리 규제의 방향에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`max_depth와 min_samples_leaf를 모두 늘리면 규제가 강해진다.`,false],[`min_samples_split(노드를 나누기 위한 최소 샘플 수)을 늘리면 규제가 강해진다.`,true],[`min_samples_leaf로 규제하면 결정 경계가 단순해지며, 학습 데이터 몇 개를 틀리더라도 새 데이터에는 더 잘 맞을 가능성이 크다.`,true],[`규제 없이 자란 트리의 좁은 띠와 작은 상자가 많은 복잡한 경계는 underfitting(과소적합)의 모습이다.`,false],[`결정 트리가 과대적합하기 쉬운 것은 학습 데이터에 대한 가정이 거의 없기 때문이다.`,true],[`회귀 트리를 규제 없이 끝까지 키우면 예측선이 학습 데이터의 거의 모든 점을 지나며 들쭉날쭉해진다.`,true]],
   exp:`<b>ㄱ (F)</b> min_samples_leaf를 늘리는 것은 규제 ↑이지만, max_depth를 <b>늘리면</b> 규제가 약해집니다. max_ 는 줄이고 min_ 은 늘려야 합니다.<br><b>ㄴ (T)</b> 샘플이 많은 노드만 나눌 수 있으므로 트리가 덜 자랍니다.<br><b>ㄷ (T)</b> 교안 10쪽 규제 없음 vs min_samples_leaf = 4 비교입니다.<br><b>ㄹ (F)</b> 점 하나하나에 맞춘 복잡한 경계는 <b>overfitting(과대적합)</b>의 모습입니다.<br><b>ㅁ (T)</b> 가정이 거의 없으니 제약하지 않으면 학습 데이터에 맞춰 계속 자랍니다(교안 9쪽).<br><b>ㅂ (T)</b> 리프가 샘플마다 하나가 되기 때문입니다(교안 32쪽 왼쪽).`,
   src:[["07-2", "s8", "규제 하이퍼파라미터"], ["07-2", "s14", "회귀 트리의 규제"]] },

{ type:'ox',
   lv:'하',
   unit:"CART 분할 선택",
   pts:12,
   q:`<p>CART가 지니 감소량 ΔG(D, s) = G(D) − (<span class="frac"><span class="num"><span style="display:inline-block;padding-bottom:.32em">|D<sub>L</sub>|</span></span><span class="den">|D|</span></span>G(D<sub>L</sub>) + <span class="frac"><span class="num"><span style="display:inline-block;padding-bottom:.32em">|D<sub>R</sub>|</span></span><span class="den">|D|</span></span>G(D<sub>R</sub>)) 로 분할을 고르는 과정에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`ΔG는 클수록, 괄호 안의 나눈 뒤 가중 지니는 작을수록 좋은 분할이다.`,true],[`괄호 안은 두 자식 노드 지니의 단순 평균이다.`,false],[`부모 7개를 왼쪽 2개(구매 0, 비구매 2), 오른쪽 5개로 나누면 나눈 뒤 가중 지니는 <span class="frac"><span class="num">2</span><span class="den">7</span></span> × 0 + <span class="frac"><span class="num">5</span><span class="den">7</span></span> × G(D<sub>R</sub>)이다.`,true],[`나눈 뒤 두 자식이 모두 거의 반반으로 섞여 있으면 ΔG는 0에 가깝다.`,true],[`부모 노드의 지니 G(D)는 후보 분할마다 다른 값이 된다.`,false],[`CART는 지니가 0인 노드도 ΔG가 가장 큰 분할을 찾아 계속 나눈다.`,false]],
   exp:`<b>ㄱ (T)</b> 부모 지니에서 뺀 값이므로 가중 지니가 작을수록 ΔG가 큽니다.<br><b>ㄴ (F)</b> 각 자식의 샘플 수 비율 <span class="frac"><span class="num"><span style="display:inline-block;padding-bottom:.32em">|D<sub>L</sub>|</span></span><span class="den">|D|</span></span>, <span class="frac"><span class="num"><span style="display:inline-block;padding-bottom:.32em">|D<sub>R</sub>|</span></span><span class="den">|D|</span></span>로 <b>가중평균</b>합니다.<br><b>ㄷ (T)</b> 왼쪽은 비구매만 있어 G(D<sub>L</sub>) = 0입니다(교안 13쪽).<br><b>ㄹ (T)</b> 불순도가 거의 줄지 않았기 때문입니다. 교안 14쪽 s<sub>2</sub>는 ΔG ≈ 0.014입니다.<br><b>ㅁ (F)</b> G(D)는 나누기 전 부모 노드의 값이라 후보 분할과 관계없이 <b>같습니다</b>. 후보끼리는 나눈 뒤 가중 지니만 달라집니다.<br><b>ㅂ (F)</b> 지니 0인 순수 노드는 더 나누지 않고 <b>리프</b>가 됩니다.`,
   src:[["07-2", "s9", "지니 예제 — CART"]] },

{ type:'ox',
   lv:'하',
   unit:"ID3 · CART 비교",
   pts:12,
   q:`<p>ID3와 CART를 비교하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`ID3에서 범주가 3개인 특징으로 나누면 가지가 3개 생긴다.`,true],[`CART와 ID3는 불순도 척도와 가지 수는 다르지만, 나누기 전 불순도에서 나눈 뒤 가중평균 불순도를 뺀 값이 가장 큰 것을 고른다는 점은 같다.`,true],[`정보 이득은 작을수록 좋은 특징이다.`,false],[`정보 이득을 구할 때 그룹마다 샘플 수가 다르므로, 샘플이 많은 그룹의 엔트로피를 더 크게 반영한다.`,true],[`부모 엔트로피가 0.940이고, 특징 A로 나눈 뒤 가중 엔트로피가 0.694, 특징 B로 나눈 뒤가 0.789이면 ID3는 B를 고른다.`,false],[`나눈 뒤 가중 엔트로피가 가장 작은 특징이 정보 이득이 가장 큰 특징이다.`,true]],
   exp:`<b>ㄱ (T)</b> 교안 23쪽: Age(youth, young adult, middle-aged) → 세 갈래.<br><b>ㄴ (T)</b> ΔG와 정보 이득은 같은 구조입니다(지니 ↔ 엔트로피).<br><b>ㄷ (F)</b> 정보 이득은 줄어든 불확실성이므로 <b>클수록</b> 좋습니다. 작을수록 좋은 것은 불순도(지니·엔트로피)입니다.<br><b>ㄹ (T)</b> <span class="frac"><span class="num"><span style="display:inline-block;padding-bottom:.32em">|D<sub>v</sub>|</span></span><span class="den">|D|</span></span>로 가중평균하기 때문입니다.<br><b>ㅁ (F)</b> 정보 이득은 A: 0.940 − 0.694 = 0.246, B: 0.940 − 0.789 = 0.151이므로 이득이 큰 <b>A</b>를 고릅니다.<br><b>ㅂ (T)</b> 부모 엔트로피는 모든 특징에 같으므로, 빼는 값이 작을수록 이득이 큽니다.`,
   src:[["07-2", "s10", "ID3와 정보 이득"]] },

{ type:'ox',
   lv:'하',
   unit:"회귀 트리 구분",
   pts:12,
   q:`<p>회귀 트리를 분류 트리와 구분하는 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`회귀 트리 노드의 mse는 분류 트리 노드의 gini 자리에 해당한다.`,true],[`회귀용 CART는 비용함수 J가 가장 큰 분할을 고른다.`,false],[`회귀 트리에서 부모 노드의 value는 두 자식 value의 단순 평균이다.`,false],[`어떤 리프에 y = 2, 4, 6인 학습 샘플 세 개가 있으면 그 리프의 예측값은 4이다.`,true],[`깊이 2인 회귀 트리(리프 4개)의 예측은 서로 다른 값을 최대 4개만 가진다.`,true],[`J(k, t<sub>k</sub>)에서 k는 나눌 특징, t<sub>k</sub>는 그 특징의 기준값이다.`,true]],
   exp:`<b>ㄱ (T)</b> mse는 노드 y값이 평균에서 흩어진 정도, 즉 회귀에서의 불순도입니다(교안 29쪽).<br><b>ㄴ (F)</b> J(두 자식 MSE의 가중평균)가 <b>가장 작은</b> 분할을 고릅니다.<br><b>ㄷ (F)</b> 부모 value는 자식 value의 <b>샘플 수 가중평균</b>입니다(부모 학습 샘플 y 전체의 평균이므로).<br><b>ㄹ (T)</b> <span class="frac"><span class="num">2 + 4 + 6</span><span class="den">3</span></span> = 4. 리프 예측값 = y의 평균.<br><b>ㅁ (T)</b> 리프마다 값 하나이므로 4단 계단입니다(교안 31쪽).<br><b>ㅂ (T)</b> "x<sub>k</sub> ≤ t<sub>k</sub>?"로 나눕니다(교안 30쪽).`,
   src:[["07-2", "s11", "회귀 트리"], ["07-2", "s12", "회귀용 CART"], ["07-2", "s13", "회귀 트리의 예측"], ["07-2", "s15", "야구 선수 연봉 예제"]] }
];
