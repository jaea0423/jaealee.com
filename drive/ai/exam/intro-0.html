const EXAM = [
{ type:'ox',
   lv:'기초',
   unit:"명제 · 논리 연산",
   pts:13,
   q:`<p>Proposition(명제)과 논리 연산에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Proposition(명제)은 참(T)인지 거짓(F)인지 명확하게 구분할 수 있는 문장이나 식이다.`,true],[`"2 × 7의 값은 홀수다."는 거짓인 문장이므로 명제가 아니다.`,false],[`"사과는 맛있다."는 참·거짓을 명확하게 구분할 수 없으므로 명제가 아니다.`,true],[`p ∨ q(Disjunction, 논리합)는 두 명제가 모두 F인 경우에만 F이다.`,true],[`p ∧ q(Conjunction, 논리곱)는 두 명제 중 하나만 T여도 T이다.`,false],[`p → q(Implication, 조건)는 p가 T이고 q가 F일 때만 F이다.`,true]],
   exp:`<b>ㄱ (T)</b> 6장 교안 6쪽 정의입니다.<br><b>ㄴ (F)</b> 참·거짓이 명확히 정해지면 <b>거짓이어도 명제</b>입니다. 이 문장은 거짓인 명제입니다(6장 교안 6쪽).<br><b>ㄷ (T)</b> 사람마다 판단이 달라 참·거짓이 하나로 정해지지 않습니다(6장 교안 6쪽).<br><b>ㄹ (T)</b> 하나라도 T이면 T입니다(6장 교안 8쪽).<br><b>ㅁ (F)</b> 논리곱은 두 명제가 <b>모두 T인 경우에만 T</b>이고, 그 외에는 F입니다. 하나만 T여도 T인 것은 논리합입니다(6장 교안 9쪽).<br><b>ㅂ (T)</b> 그 외 세 경우는 모두 T입니다(6장 교안 10쪽). 교수님이 〈표 6.4〉 머리글 "~p → q"는 오류이고 p → q가 맞다고 짚으셨습니다.`,
   src:[["04-2", "s2", "명제와 논리 연산"]] },

{ type:'ox',
   lv:'기초',
   unit:"예문 · 술어 논리",
   pts:10,
   q:`<p>예문의 진리값과 Predicate logic(술어 논리)에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`"서울은 대한민국의 수도이고, 3 × 2 = 5이다."의 진리값은 T이다.`,false],[`"유채꽃이 노랗다면, 바다가 육지이다."의 진리값은 F이다.`,true],[`조건 명제에서 가정이 F이면 결론의 참·거짓과 관계없이 조건 명제는 T이다.`,true],[`Propositional logic(명제 논리)은 문장을 주어와 술어로 구분하여 참·거짓을 다룬다.`,false],[`술어 논리에서 x<sup>2</sup> + 5x + 6 = 0 처럼 변수가 있는 식은 변수의 값과 관계없이 항상 T이다.`,false]],
   exp:`<b>ㄱ (F)</b> T ∧ F 이므로 <b>F</b>입니다. 논리곱은 둘 다 T여야 T입니다(6장 교안 9쪽).<br><b>ㄴ (T)</b> T → F 이므로 F입니다. 조건은 가정이 T, 결론이 F일 때만 F입니다(6장 교안 10쪽).<br><b>ㄷ (T)</b> 6장 교안 10쪽 "조건 명제에서는 가정이 F이면 결론은 항상 T". 예: "3 × 2 = 5라면, 런던은 미국의 수도이다."는 F → F = T.<br><b>ㄹ (F)</b> 주어와 술어로 구분하는 것은 <b>술어 논리</b>입니다. 명제 논리는 문장 전체의 참·거짓을 판별하는 법칙을 다룹니다(6장 교안 6쪽).<br><b>ㅁ (F)</b> 변수의 값에 따라 T 또는 F가 정해집니다. 이 식은 x = −2 또는 −3일 때만 T입니다(6장 교안 11쪽).`,
   src:[["04-2", "s2", "명제와 논리 연산"], ["04-2", "s3", "술어 논리"]] },

{ type:'ox',
   lv:'기초',
   unit:"Inference(추론)",
   pts:10,
   q:`<p>Inference(추론)와 그 종류에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Inference(추론)는 알려진 사실이나 명제를 근거로 삼아 미지의 사실에 대한 판단이나 결론을 이끌어내는 사고 과정이다.`,true],[`추론에 주로 쓰이는 프로그래밍 언어는 Prolog(프롤로그)이다.`,true],[`Induction(귀납 추론)은 개별적인 사실들로부터 일반적인 결론을 이끌어내는 방법이다.`,true],[`귀납 추론은 연역 추론보다 논리적 필연성이 크다.`,false],[`Analogy(유비 추론)는 '유추'라고도 하며, 기존에 모르던 새로운 영역을 이해하는 데 도움이 된다.`,true]],
   exp:`<b>ㄱ (T)</b> 6장 교안 12쪽 정의입니다.<br><b>ㄴ (T)</b> 6장 교안 12쪽입니다. 규칙기반 시스템도 Prolog로 편리하게 프로그래밍할 수 있습니다(34쪽).<br><b>ㄷ (T)</b> 예: 까마귀 1, 2, …, n이 까맣다 → "모든 까마귀는 까맣다"(6장 교안 13쪽).<br><b>ㄹ (F)</b> 귀납 추론은 연역 추론과 같은 논리적 필연성이 <b>적습니다</b>. 대신 새로운 지식이나 이론의 발견과 확장에 쓰입니다(6장 교안 13쪽).<br><b>ㅁ (T)</b> 두 대상에서 어떤 현상이 유사·일치하므로 다른 현상도 유사·일치할 것이라고 추론합니다(6장 교안 16쪽).`,
   src:[["04-2", "s4", "추론"]] },

{ type:'ox',
   lv:'기초',
   unit:"Search(탐색)",
   pts:10,
   q:`<p>추론을 통한 탐색과 탐색 기법에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Forward chaining(순방향 추론)은 출발 상태에서 목표 상태로 진행한다.`,true],[`Backward chaining(역방향 추론)은 출발 상태에서 목표 상태로 진행한다.`,false],[`BFS(Breadth-First Search, 너비 우선 탐색)는 시작 정점을 방문한 뒤 level 0, level 1, level 2, … 의 순서로 탐색한다.`,true],[`DFS(깊이 우선 탐색)와 BFS(너비 우선 탐색)는 Heuristic search(휴리스틱 탐색)에 속한다.`,false],[`Minimax search(최소최대 탐색)는 주로 상대가 있는 2인용 게임에서 나의 가능성은 최대, 상대방의 가능성은 최소로 하는 전략을 탐색한다.`,true]],
   exp:`<b>ㄱ (T)</b> 6장 교안 17쪽입니다.<br><b>ㄴ (F)</b> 역방향 추론은 <b>목표 상태에서 출발 상태로</b> 진행합니다. 출발 → 목표는 순방향입니다(6장 교안 17쪽).<br><b>ㄷ (T)</b> 6장 교안 19쪽입니다.<br><b>ㄹ (F)</b> DFS와 BFS는 사전 정보 없이 일정한 순서대로만 탐색하는 <b>Uninformed search(무정보 탐색)</b>입니다(6장 교안 20쪽).<br><b>ㅁ (T)</b> 예: 틱택토(6장 교안 21쪽).`,
   src:[["04-2", "s5", "탐색"]] },

{ type:'ox',
   lv:'기초',
   unit:"알고리즘 · 휴리스틱 · A*",
   pts:12,
   q:`<p>Algorithm(알고리즘), Heuristic(휴리스틱), A* 알고리즘에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`한 문제를 해결하는 Algorithm(알고리즘)은 단 하나만 존재한다.`,false],[`Heuristic(휴리스틱)은 비슷한 문제에 대한 과거의 경험들을 바탕으로 직관적으로 판단하여 선택하는 의사결정 방식이다.`,true],[`휴리스틱은 논리적이거나 최적인 방법을 보장한다.`,false],[`A* 알고리즘은 Best-first search(최상 우선 탐색) 중 가장 잘 알려진 방법으로, 평가 함수 f를 사용하여 다음에 이동할 경로를 결정한다.`,true],[`A* 알고리즘은 출발점에서 목표지점까지 가장 비용이 크거나 긴 경로를 찾는다.`,false],[`8-Queens 문제의 해답은 오직 하나뿐이다.`,false]],
   exp:`<b>ㄱ (F)</b> 알고리즘은 <b>단 하나만 있는 것이 아닙니다</b>(6장 교안 22쪽). 같은 문제를 여러 방법으로 풀 수 있습니다.<br><b>ㄴ (T)</b> 6장 교안 26쪽 정의입니다.<br><b>ㄷ (F)</b> 최적을 <b>보장하지 않습니다</b>. 대신 만족할 만한 해결책을 비교적 빠르게 찾는 실용적인 방법입니다(6장 교안 26쪽).<br><b>ㄹ (T)</b> 6장 교안 28쪽입니다.<br><b>ㅁ (F)</b> <b>가장 비용이 적거나 짧은</b> 최적 경로를 찾습니다(6장 교안 28쪽).<br><b>ㅂ (F)</b> 경우의 수는 약 44억 가지이고, 해답은 <b>여러 개</b> 나옵니다(6장 교안 30쪽).`,
   src:[["04-2", "s6", "알고리즘과 휴리스틱"], ["04-2", "s7", "A* 알고리즘 · 8-Queens"]] },

{ type:'ox',
   lv:'기초',
   unit:"전문가 시스템",
   pts:8,
   q:`<p>규칙기반 시스템과 Expert System(전문가 시스템)에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Semantic network(의미 네트워크)는 개념 간의 관계를 링크로 연결하며, 지식을 체계화시켜 표현하기에 적합하다.`,true],[`규칙기반 시스템은 사실(fact)을 나타내는 지식베이스와 If–then 형태의 추론규칙으로 이루어진다.`,true],[`Expert System(전문가 시스템)에서 사용자가 질문하면 지식베이스가 추론기구를 이용하여 추론한다.`,false],[`A* 알고리즘 이후 새로운 알고리즘 발견이 어려웠던 점은 규칙기반 AI가 전문가 시스템으로 향한 이유 중 하나이다.`,true]],
   exp:`<b>ㄱ (T)</b> 예: 개와 세퍼드, 개와 진돗개를 링크로 연결(6장 교안 31쪽).<br><b>ㄴ (T)</b> 질의에 대해 둘을 이용하여 추론한 뒤 결과를 알려 줍니다(6장 교안 32쪽).<br><b>ㄷ (F)</b> 주체가 바뀌었습니다. <b>추론기구(inference engine)가 지식베이스를 이용하여</b> 추론하고 결과를 사용자에게 전해 줍니다(6장 교안 35쪽).<br><b>ㄹ (T)</b> 6장 교안 36쪽 "전문가 시스템으로 향한 이유"입니다.`,
   src:[["04-2", "s8", "전문가 시스템"]] },

{ type:'ox',
   lv:'기초',
   unit:"AI · ML · DL과 정의",
   pts:15,
   q:`<p>인공지능, Machine Learning(기계학습), Deep Learning(딥러닝)의 정의에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Generative AI(생성형 AI)는 딥러닝을 포함하는 더 넓은 영역이다.`,false],[`Machine Learning(기계학습)은 규칙을 명시적으로 프로그래밍하지 않아도 기계가 데이터에서 의사결정용 패턴을 학습하는 것이다.`,true],[`Deep Learning(딥러닝)은 신경망 기반 모델로, 비정형 데이터에서 특징 추출과 의사결정을 end to end로 수행한다.`,true],[`Tom Mitchell의 정의에서 E는 성능을 평가하는 기준(evaluation)을 뜻한다.`,false],[`새로 들어오는 데이터를 처리할 수 있게 하는 것을 기계학습의 generalization(일반화)이라고 한다.`,true],[`기계학습에서 Induction(추론)은 특정한 예시들의 집합에서 일반적인 규칙을 뽑아내는 과정이다.`,true],[`대부분의 경우 데이터는 비싸고 부족하지만, 지식은 싸고 풍부하다.`,false]],
   exp:`<b>ㄱ (F)</b> 반대입니다. 교수님 설명: <b>생성형 AI가 딥러닝 안에</b> 들어갑니다 → AI ⊃ ML ⊃ DL ⊃ 생성형 AI.<br><b>ㄴ (T)</b> ML 교안 1쪽 정의입니다.<br><b>ㄷ (T)</b> ML 교안 1쪽 정의입니다.<br><b>ㄹ (F)</b> E는 <b>experience(경험)</b>입니다. 성능을 재는 기준은 P(performance measure), 작업은 T(task)입니다(ML 교안 2쪽).<br><b>ㅁ (T)</b> 교수님이 기계학습을 쓰는 이유 ③ 변화하는 환경(Fluctuating environments)을 설명하시며 언급하신 내용입니다.<br><b>ㅂ (T)</b> ML 교안 7쪽입니다. 교수님은 Induction을 "추론"이라고 부르셨고, 6장의 귀납 추론과 같은 개념입니다.<br><b>ㅅ (F)</b> 반대입니다. <b>데이터는 싸고 풍부하지만, 지식은 비싸고 부족합니다</b>(ML 교안 7쪽). 그래서 데이터에서 지식을 자동으로 뽑아내는 학습이 필요합니다.`,
   src:[["04-2", "s9", "AI · 기계학습 · 딥러닝"], ["04-2", "s10", "기계학습의 정의"], ["04-2", "s11", "전통 방식 vs ML · 일반화"], ["04-2", "s12", "학습 = Induction"]] },

{ type:'ox',
   lv:'기초',
   unit:"학습 유형",
   pts:12,
   q:`<p>Supervised(지도) · Unsupervised(비지도) · Reinforcement(강화) 학습에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Supervised learning(지도 학습)에서는 관측값과 함께 목표 출력이 주어지므로 학습 데이터는 {(x<sup>t</sup>, y<sup>t</sup>)} 형태이다.`,true],[`Unsupervised learning(비지도 학습)의 훈련 데이터에는 원하는 답인 label(라벨)이 포함된다.`,false],[`Classification(분류)은 이산적인 라벨을, Regression(회귀)은 연속적인 수를 예측한다.`,true],[`Reinforcement learning(강화 학습)에는 지도 출력이 없고 delayed reward(지연된 보상)가 있다.`,true],[`Outlier detection(이상치 탐지)은 대다수 데이터와 가장 비슷한 데이터 포인트를 찾아내는 과정이다.`,false],[`강화 학습에서 학습하는 시스템을 agent(에이전트)라 하고, 시간에 따라 보상을 최대화하는 최선의 전략을 policy(정책)라 한다.`,true]],
   exp:`<b>ㄱ (T)</b> ML 교안 9쪽입니다.<br><b>ㄴ (F)</b> 비지도 학습의 훈련 데이터에는 <b>라벨이 없고</b>({x<sup>t</sup>}), 시스템은 교사나 감독 없이 학습하려고 합니다(ML 교안 13쪽). 라벨이 포함되는 것은 지도 학습입니다.<br><b>ㄷ (T)</b> ML 교안 9쪽 discrete label / continuous number.<br><b>ㄹ (T)</b> ML 교안 9쪽입니다.<br><b>ㅁ (F)</b> 대다수 데이터에서 <b>크게 벗어난(significantly deviate)</b> 관측값이나 데이터 포인트를 찾아내는 과정입니다(ML 교안 17쪽).<br><b>ㅂ (T)</b> ML 교안 18쪽입니다.`,
   src:[["04-2", "s13", "학습 유형"], ["04-2", "s14", "지도 학습"], ["04-2", "s15", "비지도 학습"], ["04-2", "s16", "강화 학습"]] },

{ type:'ox',
   lv:'기초',
   unit:"배치 · 온라인 학습",
   pts:10,
   q:`<p>Batch learning(배치 학습)과 Online learning(온라인 학습)에 대한 설명이다. 각 문장이 맞으면 T, 틀리면 F 를 고르시오.</p>`,
   items:[[`Batch learning(배치 학습)은 점진적으로 학습할 수 없어 가용한 데이터 전부를 사용해 학습해야 한다.`,true],[`배치 학습 시스템은 운영(production)에 투입된 뒤에도 새 데이터로 계속 학습한다.`,false],[`Online learning(온라인 학습)은 데이터를 mini batch(미니배치)로 나눠 순차적으로 모델에 공급한다.`,true],[`온라인 학습은 학습 단계 하나하나가 배치 학습보다 느리고 비싸다.`,false],[`Out-of-core learning(외부 메모리 학습)은 온라인 학습 알고리즘으로 한 컴퓨터의 주기억장치에 들어가지 않는 거대한 데이터셋을 학습하는 것이다.`,true]],
   exp:`<b>ㄱ (T)</b> ML 교안 19쪽입니다.<br><b>ㄴ (F)</b> 운영에 투입되면 <b>더 학습하지 않고 배운 것만 적용</b>합니다. 이를 offline learning(오프라인 학습)이라고 합니다(ML 교안 19쪽).<br><b>ㄷ (T)</b> ML 교안 20쪽입니다.<br><b>ㄹ (F)</b> 반대로 <b>더 빠르고 저렴합니다</b>(Each learning step is faster and cheaper, ML 교안 20쪽). 교수님: 배치 학습에 비해 온라인 학습이 좋은 이유는 더 빠르다는 것.<br><b>ㅁ (T)</b> ML 교안 21쪽입니다.`,
   src:[["04-2", "s17", "배치 · 온라인 학습"]] }
