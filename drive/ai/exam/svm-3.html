   model:`① C가 커질수록 분류 오류(마진 위반)에 매기는 벌점이 커지므로, 오류를 줄이려고 마진이 좁아진다. ② C가 작으면 오류를 어느 정도 허용하는 단순한 모델이 되어 과소적합 경향이 있고, C가 크면 학습 데이터를 빡빡하게 나누어 과적합 경향이 있다. ③ 따라서 작은 C는 편향이 높고 분산이 낮으며, 큰 C는 편향이 낮고 분산이 높다(편향-분산 트레이드오프). ④ C는 학습으로 정해지지 않는 음수가 아닌 하이퍼파라미터이므로, 교차 검증으로 검증 성능이 가장 좋은 값을 고른다.`,

   src:[["06-2", "s12", "벌점 매개변수 C"], ["06-2", "s13", "편향-분산 트레이드오프"]] },

{ type:'essay',

   q:`<p>하드 마진 SVM은 다음 문제를 푼다: max M, subject to ∑β<sub>j</sub><sup>2</sup> = 1, y<sup>(i)</sup>(β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub><sup>(i)</sup> + ⋯ + β<sub>p</sub>x<sub>p</sub><sup>(i)</sup>) ≥ M (모든 i), y<sup>(i)</sup> ∈ {−1, +1}. ① 마지막 제약이 뜻하는 바를 y = +1일 때와 y = −1일 때로 나누어 설명하고, ② 이 문제를 풀 때 서포트 벡터가 어떻게 정해지는지, ③ 왜 서포트 벡터만 경계를 결정하는지 서술하시오.</p>`,
   model:`① f(x) = β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub> + ⋯ + β<sub>p</sub>x<sub>p</sub>라 하면 y = +1인 점은 f(x) ≥ M, y = −1인 점은 f(x) ≤ −M이어야 한다. 즉 모든 점이 자기 클래스 편에 있으면서 초평면에서 M 이상 떨어져 있어야 하며, 레이블이 −1과 +1이라 두 조건을 y·f(x) ≥ M 하나로 쓴다. ② M을 키우면 경계 양쪽의 띠가 넓어지다가 어떤 점에 닿으면 더 넓힐 수 없다. 이때 등호 y·f(x) = M이 성립하는 점, 즉 초평면까지의 거리가 마진과 같은 점이 서포트 벡터로 정해진다(사람이 고르지 않는다). ③ 나머지 점은 y·f(x) &gt; M으로 마진 바깥에 있어 제약에 여유가 있으므로 조금 움직이거나 지워도 최적 경계가 바뀌지 않는다.`,
