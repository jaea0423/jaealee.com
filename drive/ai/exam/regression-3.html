   model:`Step 1: 잔차(실제 값 − 예측값)를 제곱해서 더한 오차 제곱합 Σ<sub>i=1</sub><sup>n</sup> {y<sub>i</sub> − (β<sub>0</sub> + β<sub>1</sub>x<sub>i</sub>)}<sup>2</sup>을 식으로 쓴다. 제곱하는 것은 + 오차와 − 오차가 상쇄되지 않게 하기 위해서이다. Step 2: 이 값을 β<sub>0</sub>, β<sub>1</sub>의 함수(비용함수) C(β<sub>0</sub>, β<sub>1</sub>)로 두고, 이를 최소로 하는 문제로 정의한다. 구하려는 추정값은 (β̂<sub>0</sub>, β̂<sub>1</sub>) = arg min C(β<sub>0</sub>, β<sub>1</sub>), 즉 C를 최소로 만드는 변수 값이다. Step 3: C를 β<sub>0</sub>와 β<sub>1</sub>로 각각 편미분해서 0으로 놓는다: −2Σ(y<sub>i</sub> − (β<sub>0</sub> + β<sub>1</sub>x<sub>i</sub>)) = 0, −2Σ(y<sub>i</sub> − (β<sub>0</sub> + β<sub>1</sub>x<sub>i</sub>))x<sub>i</sub> = 0. 두 식을 연립해서 풀면 β̂<sub>1</sub> = Σ(x<sub>i</sub> − <span style="text-decoration:overline">x</span>)(y<sub>i</sub> − <span style="text-decoration:overline">y</span>) ÷ Σ(x<sub>i</sub> − <span style="text-decoration:overline">x</span>)<sup>2</sup>, β̂<sub>0</sub> = <span style="text-decoration:overline">y</span> − β̂<sub>1</sub><span style="text-decoration:overline">x</span>를 얻는다(<span style="text-decoration:overline">x</span>, <span style="text-decoration:overline">y</span>는 평균).`,
   rubric:[[`Step 1: 오차(잔차) 제곱합 식`,4],[`Step 2: C를 최소로 하는 문제 · arg min = 최소로 만드는 변수 값`,4],[`Step 3: β<sub>0</sub>, β<sub>1</sub>로 각각 편미분 = 0, 두 식 연립`,4],[`해: β̂<sub>1</sub>의 분자·분모와 β̂<sub>0</sub>의 식(평균 사용)`,3]],
   src:[["06-1", "s6", "잔차 제곱합 · 최소제곱법"]] },

{ type:'essay',
   lv:'상',
   unit:"로지스틱 회귀",
   pts:15,
   q:`<p>카드 사용자의 채무불이행 여부(Yes = 1, No = 0)를 Balance로 예측하려 한다. ① 선형 회귀로 예측하고 Ŷ &gt; 0.5이면 Yes로 분류하는 방법이 부적절한 이유, ② 로지스틱 회귀가 이 문제를 해결하는 방식(식의 구조), ③ 로지스틱 회귀의 계수 추정 기준과 분류 규칙을 서술하시오.</p>`,
   model:`① Y가 0 또는 1이면 E(Y | X = x) = Pr(Y = 1 | X = x)라서 회귀가 확률을 예측하는 것처럼 보이지만, 선형 회귀는 직선이라 0보다 작거나 1보다 큰 값을 낼 수 있어 확률로 쓸 수 없다. ② 로지스틱 회귀는 p(X) = <span class="frac"><span class="num">1</span><span class="den">1 + e<sup>−(β<sub>0</sub> + β<sub>1</sub>X)</sup></span></span>처럼 직선 β<sub>0</sub> + β<sub>1</sub>X를 시그모이드 함수에 넣어 출력을 항상 0~1로 만든다. 정리하면 로그 오즈 log <span class="frac"><span class="num">p(X)</span><span class="den">1 − p(X)</span></span> = β<sub>0</sub> + β<sub>1</sub>X이고, p(X)는 y가 1일 확률, 1 − p(X)는 y가 0일 확률이다. ③ 계수는 최소제곱이 아니라 우도(관찰된 결과가 나올 확률)를 최대로 하는 최대우도로 추정하고, p̂(X) &gt; 0.5이면 1(Default), p̂(X) ≤ 0.5이면 0(No Default)으로 분류한다.`,
   rubric:[[`① 선형 회귀는 0 미만·1 초과 값이 나와 확률이 될 수 없음`,5],[`② 직선을 시그모이드에 넣어 0~1 / 로그 오즈 = 직선, p(x) = y가 1일 확률`,5],[`③ 최대우도 추정 + 0.5 기준 분류(같으면 0)`,5]],
   src:[["06-1", "s13", "y가 Yes/No일 때"], ["06-1", "s14", "선형 vs 로지스틱"], ["06-1", "s15", "시그모이드 · 로그 오즈"], ["06-1", "s16", "최대우도"], ["06-1", "s17", "0.5 기준 분류"]] }
