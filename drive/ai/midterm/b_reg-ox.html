{ type:'ox',
   lv:'기초',
   unit:"회귀의 정의와 분류",
   pts:45,
   q:`<p>회귀의 정의, 분류, 단순 선형 회귀에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Linear Regression Model(선형 회귀 모델)은 출력 변수 Y를 입력 변수 X들의 linear combination(선형 결합)으로 나타낸다.`,true],[`Linear combination(선형 결합)은 입력 변수들을 서로 곱한 값을 더한 형태이다.`,false],[`회귀에서 입력 x는 Independent variable(독립변수), 출력 y는 Dependent variable(종속변수)이라고 부른다.`,true],[`Simple regression(단순 회귀)은 독립변수가 하나인 회귀이다.`,true],[`Simple regression과 Multiple regression(다중 회귀)은 맞추는 모양이 곧은지 휘었는지로 나눈다.`,false],[`Simple regression과 Multiple regression은 각각 Linear(선형)와 Nonlinear(비선형)로 다시 나뉜다.`,true],[`단순 선형 회귀 모델 Y = β<sub>0</sub> + β<sub>1</sub>X + ε에서 β<sub>0</sub>은 slope(기울기), β<sub>1</sub>은 intercept(절편)이다.`,false],[`β<sub>0</sub>과 β<sub>1</sub>은 모르는 두 상수로, coefficients(계수) 또는 parameters(파라미터)라고도 부른다.`,true],[`β̂<sub>0</sub>, ŷ처럼 문자 위에 붙은 hat(^) 기호는 실제로 관측한 값을 뜻한다.`,false]],
   exp:`<b>ㄱ (O)</b> 교안 4쪽 회귀의 정의입니다. 교수님 10/26: "X와 Y의 관계를 선형으로 나타낸다 — 회귀의 정의를 봐 둘 것."<br><b>ㄴ (X)</b> 선형 결합은 각 변수에 <b>계수(coefficient)</b>를 곱한 뒤 더한 형태입니다(교안 4쪽). 변수끼리 곱하는 것이 아닙니다.<br><b>ㄷ (O)</b> 교안 3쪽 용어입니다. x는 Input·Feature·Predictor, y는 Output·Target·Response라고도 부릅니다.<br><b>ㄹ (O)</b> 교안 5쪽 "regression with a single independent variable"입니다. 교수님 10/26: 단순·다중 회귀의 정의는 알아 둘 것.<br><b>ㅁ (X)</b> 단순·다중은 <b>독립변수 x의 개수</b>(1개 / 2개 이상)로 나눕니다. 모양이 곧은지 휘었는지는 <b>선형·비선형</b>을 나누는 기준입니다(교안 5쪽).<br><b>ㅂ (O)</b> 교안 5쪽: 단순 회귀와 다중 회귀 아래에 각각 Linear, Nonlinear가 있습니다. 그림의 네 칸은 단순 선형 = 직선, 단순 비선형 = 곡선(다항 모델), 다중 선형 = 평면, 다중 비선형 = 곡면입니다.<br><b>ㅅ (X)</b> 반대입니다. β<sub>0</sub>이 <b>절편</b>(X = 0일 때 Y), β<sub>1</sub>이 <b>기울기</b>(X가 1 늘 때 Y의 변화)입니다. ε는 오차항입니다(교안 7쪽).<br><b>ㅇ (O)</b> 교안 7쪽 "two unknown constants … also known as coefficients or parameters"입니다. 선형 회귀를 학습한다는 것은 이 값을 데이터로 찾는 것입니다.<br><b>ㅈ (X)</b> hat 기호는 <b>추정한 값(estimated value)</b>을 뜻합니다(교안 7쪽). y는 실제값, ŷ는 모델의 예측값입니다.`,
   src:[["B", "B2", "회귀의 정의"], ["B", "B3", "회귀의 분류"], ["B", "B4", "단순 선형 회귀"]] },

{ type:'ox',
   lv:'기초',
   unit:"결정계수 R²",
   pts:35,
   q:`<p>결정계수 R²에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`R²(Coefficient of Determination, 결정계수)는 회귀 모델이 데이터의 variation(변동)을 얼마나 잘 설명하는지 나타내는 척도이다.`,true],[`R²는 0에 가까울수록 데이터를 잘 설명하는 모델이다.`,false],[`R²는 y의 전체 변동 중 모델이 설명하는 변동의 비율이다.`,true],[`R² = 1이면 SSE가 0이고, 모든 점이 회귀선 위에 있다.`,true],[`모델이 매우 나쁘면 R²가 음수가 될 수 있으며, 이는 평균 ȳ로 예측하는 것보다도 못하다는 뜻이다.`,true],[`SST는 모델의 예측값 ŷ에 따라 값이 달라진다.`,false],[`R²는 전체 변동(SST) 중 모델이 설명하지 못한 변동(SSE)이 차지하는 비율이다.`,false]],
   exp:`<b>ㄱ (O)</b> 교안 12쪽 정의입니다. 교수님 10/26: "결정계수는 잘 봐야 한다."<br><b>ㄴ (X)</b> R²는 <b>1</b>에 가까울수록 좋습니다. R² = 1은 Good fit, R² = 0은 Poor fit입니다(교안 12쪽, 교수님 10/26).<br><b>ㄷ (O)</b> 교안 12쪽 "the proportion of the total variance in y explained by the model"입니다. 그래서 R² = SSR ÷ SST로 볼 수 있습니다.<br><b>ㄹ (O)</b> 예측이 틀린 정도(SSE)가 0이므로 실제값과 예측값이 모두 같습니다. 즉 회귀선이 모든 점을 지납니다.<br><b>ㅁ (O)</b> 교안 12쪽 "sometimes negative if the model is very poor"입니다. 음수는 SSE가 SST보다 커서, 모든 샘플을 평균으로 예측하는 것보다 틀린 정도가 크다는 뜻입니다.<br><b>ㅂ (X)</b> SST는 실제값 y<sub>i</sub>와 평균 ȳ의 차이로만 만들므로 <b>데이터가 정하는 고정값</b>입니다. 모델이 바뀌면 SST 안에서 SSR과 SSE의 몫이 바뀝니다.<br><b>ㅅ (X)</b> R²는 모델이 <b>설명한</b> 변동(SSR)의 비율입니다. 설명하지 못한 비율 SSE ÷ SST를 1에서 뺀 값이 R²입니다(교안 12쪽).`,
   src:[["B", "B5", "결정계수 R²"]] },

{ type:'ox',
   lv:'기초',
   unit:"로지스틱 회귀",
   pts:20,
   q:`<p>로지스틱 회귀에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`선형 회귀는 연속적인 실수값을 예측하고, Logistic regression(로지스틱 회귀)은 이를 분류 문제로 가져간다.`,true],[`로지스틱 회귀는 선형 회귀의 β<sub>0</sub> + β<sub>1</sub>X를 Sigmoid function(시그모이드 함수)에 넣어 0과 1 사이 값으로 바꾼다.`,true],[`시그모이드 함수는 입력 z가 커질수록 출력이 0에 가까워진다.`,false],[`로지스틱 회귀의 출력 p(X)는 Y = 0일 확률이다.`,false]],
   exp:`<b>ㄱ (O)</b> 교수님 10/26: "선형 회귀는 값(실수값, 연속적인 값)을 예측하고, 로지스틱 회귀는 이를 분류 문제로 가져간다."(교안 23쪽)<br><b>ㄴ (O)</b> 교안 24–25쪽입니다. 교수님 10/26: "선형 회귀에서 본 β0 + β1x를 함수에 넣은 것이 시그모이드 함수이다."<br><b>ㄷ (X)</b> z가 커질수록 출력은 <b>1</b>에 가까워지고, 작아질수록 0에 가까워집니다. z = 0이면 정확히 0.5입니다(교안 25쪽).<br><b>ㄹ (X)</b> p(X) = Pr(Y = 1 | X), 즉 <b>Y = 1</b>일 확률입니다(교안 24쪽). Y = 0일 확률은 1 − p(X)입니다.`,
   src:[["B", "B6", "로지스틱 회귀"]] }
];
</script>
