<div class="blk sh"><h2><span class="sn">A</span>기계학습 입문</h2><p class=lead>Introduction to Machine Learning · 나오는 쪽: 1, 4, 9, 12, 14, 24, 25, 26, 27</p></div>
<div class="blk"><div class="key"><div class="h">한눈에 보기</div><ul class="pt"><li>포함 관계: AI ⊃ <span class="a">기계학습</span> ⊃ <span class="a">딥러닝</span>. 기계학습은 규칙 대신 데이터에서 패턴을 배웁니다.</li><li>전통적 방식은 사람이 <span class="a">규칙을 작성</span>하고, 기계학습 방식은 데이터로 <span class="a">알고리즘을 학습</span>시킵니다.</li><li>학습은 x → 모델 g(x) → y입니다. 정답 y가 있으면 <span class="a">지도 학습</span>, 없으면 <span class="a">비지도 학습</span>입니다.</li><li>지도 학습은 <span class="a">분류</span>(이산 라벨)와 <span class="a">회귀</span>(연속 수)를 풀고, 비지도 학습의 대표는 <span class="a">군집화</span>입니다.</li><li>학습이 어려운 이유는 데이터의 양·대표성·품질과 관련 없는 특징입니다.</li><li>모델이 너무 복잡하면 <span class="a">Overfitting</span>(과적합), 너무 단순하면 <span class="a">Underfitting</span>(과소적합)입니다.</li><li>손실(loss)은 실제값과 예측값의 차이입니다. <span class="a">테스트 손실</span>이 다시 커지면 과적합입니다.</li></ul><p style="margin:3px 0 0;font-size:12px">안 나옴: 16쪽 차원 축소, 강화 학습, 규칙기반 AI 교재 교안(명제논리·탐색·전문가 시스템).</p></div></div>
<div class="blk sh"><h2><span class="sn">A1</span>AI ⊃ ML ⊃ DL <span class="pg">p.1</span></h2></div>
<div class="blk"><div class="box"><p>세 원은 <span class="a">포함 관계</span>입니다. 딥러닝은 모두 기계학습이고, 기계학습은 모두 인공지능입니다. 거꾸로는 성립하지 않습니다.</p></div></div>
<div class="blk"><div class="unit">그림 오른쪽의 세 정의</div><table class="mt "><tr><th>영역</th><th>정의</th></tr><tr><td class="nm">인공지능<span class="en">AI</span></td><td>사람이 하던 일을 기계가 수행하는 <span class="a">모든 자동화</span></td></tr><tr><td class="nm">기계학습<span class="en">ML</span></td><td>규칙을 <span class="a">명시적으로 프로그래밍하지 않아도</span> 데이터에서 의사결정용 패턴을 학습</td></tr><tr><td class="nm">딥러닝<span class="en">DL</span></td><td><span class="a">신경망</span> 기반. 비정형 데이터에서 특징 추출과 의사결정을 <span class="a">end to end</span>로 수행</td></tr></table></div>
<div class="blk"><div class="box"><p>생성형 AI는 <span class="a">딥러닝</span> 안에 들어갑니다(수업 중 말씀).</p></div></div>
<div class="blk sh"><h2><span class="sn">A2</span>전통적 방식 vs 기계학습 방식 <span class="pg">p.4</span></h2></div>
<div class="blk"><div class="box"><p>두 순서도는 모양이 같고 <span class="a">가운데 칸 하나</span>만 다릅니다. 기계학습 방식에만 위에서 데이터<span class="en">Data</span>가 들어옵니다.</p></div></div>
<div class="blk"><div class="unit">순서도 칸별 비교</div><table class="mt "><tr><th>단계</th><th>전통적 방식</th><th>ML 방식</th></tr><tr><td>① 문제 연구</td><td>같음</td><td>같음</td></tr><tr><td>② 가운데</td><td><span class="a">규칙 작성</span><span class="en">Write rules</span></td><td><span class="a">ML 알고리즘 학습</span><span class="en">Train ML algorithm</span></td></tr><tr><td>③ 평가</td><td>규칙 평가</td><td>해법 평가</td></tr><tr><td>④ 좋으면</td><td>출시<span class="en">Launch</span></td><td>출시<span class="en">Launch</span></td></tr><tr><td>⑤ 나쁘면</td><td>오류 분석 → ①</td><td>오류 분석 → ①</td></tr></table></div>
<div class="blk"><div class="box"><p>규칙(패턴)을 만드는 주체가 사람에서 <span class="a">학습 알고리즘</span>으로 바뀌었습니다. 찾은 패턴으로 분류나 회귀를 합니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">A3</span>학습 유형 Types of Learning <span class="pg">p.9</span></h2></div>
<div class="blk"><table class="mt "><tr><th>유형</th><th>학습 데이터</th><th>하는 일</th></tr><tr><td class="nm">지도 학습<span class="en">Supervised</span></td><td>{(x<sup>t</sup>, y<sup>t</sup>)}<br>x와 정답 y</td><td>분류: <span class="a">이산</span> 라벨<br>회귀: <span class="a">연속</span> 수</td></tr><tr><td class="nm">비지도 학습<span class="en">Unsupervised</span></td><td>{x<sup>t</sup>}<br>x만 있음</td><td>데이터 구조 찾기<br>(k-means, DBSCAN)</td></tr><tr><td class="nm">강화 학습</td><td>정답 없음 + 지연된 보상</td><td>수업에서 다루지 않음</td></tr></table></div>
<div class="blk"><div class="box"><p>관측값 x가 모델 g(x)를 거쳐 출력 y가 나옵니다. 유형을 가르는 기준은 <span class="a">정답 y가 주어지는가</span>입니다.</p><p>t는 "t번째 데이터"라는 번호입니다. 이산<span class="en">discrete</span>은 0, 1처럼 떨어진 값, 연속<span class="en">continuous</span>은 실수값입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">A4</span>지도 학습 알고리즘 · 군집화 <span class="pg">p.12, 14</span></h2></div>
<div class="blk"><div class="unit">모두 정답 y가 있는 데이터로 학습 <span class="pg">p.12</span></div><table class="mt "><tr><th>지도 학습 알고리즘</th><th>다시 나오는 장</th></tr><tr><td>선형 회귀<span class="en">Linear regression</span></td><td>B 회귀</td></tr><tr><td><span class="a">로지스틱 회귀</span><span class="en">Logistic regression</span></td><td>B 회귀 (분류에 씀)</td></tr><tr><td>k-최근접 이웃<span class="en">k-NN</span></td><td>—</td></tr><tr><td>결정 트리 · 랜덤 포레스트</td><td>E 결정 트리, F 앙상블</td></tr><tr><td><span class="a">서포트 벡터 머신</span><span class="en">SVM</span></td><td>C SVM</td></tr><tr><td>신경망 등</td><td>—</td></tr></table></div>
<div class="blk"><div class="box"><p><b>군집</b><span class="en">cluster</span>: 서로 "<span class="a">비슷한</span>" 객체들의 모임이며, 다른 군집의 객체와는 "<span class="a">비슷하지 않은</span>" 모임입니다. 라벨 없이 특징 공간의 위치(거리)만 보고 무리를 나눕니다. 자세한 방법은 D 군집화에서 봅니다. <span class="pg">p.14</span></p></div></div>
<div class="blk sh"><h2><span class="sn">A5</span>기계학습의 주요 어려움 <span class="pg">p.24</span></h2></div>
<div class="blk"><table class="mt "><tr><th>어려움</th><th>뜻</th></tr><tr><td>데이터 <span class="a">양</span> 부족<span class="en">Insufficient quantity</span></td><td>데이터가 적으면 의미 있는 패턴을 찾기 어려움</td></tr><tr><td><span class="a">대표성</span> 없는 데이터<span class="en">Nonrepresentative</span></td><td>예측할 실제 데이터를 잘 대표하지 못함 (sampling noise, sampling bias)</td></tr><tr><td>낮은 <span class="a">품질</span><span class="en">Poor quality</span></td><td>오류·이상치·잡음이 많음</td></tr><tr><td>관련 없는 특징<span class="en">Irrelevant features</span></td><td><span class="a">특징 선택</span>: 기여하는 특징만 고름<br><span class="a">특징 추출</span>: 특징을 결합해 새로 만듦</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">A6</span>Overfitting(과적합) <span class="pg">p.25</span></h2></div>
<div class="blk"><div class="box"><p>과적합은 모델이 학습 데이터의 <span class="a">양과 잡음</span>에 비해 <span class="a">너무 복잡</span>할 때 일어납니다.</p><p>학습은 학습 데이터<span class="en">training data</span>로 합니다. 복잡한 모델은 잡음까지 외워서, 학습 데이터는 잘 맞히지만 테스트 데이터<span class="en">test data</span>에서는 성능이 떨어집니다.</p><p>어떤 데이터가 들어와도 잘 맞으면 <span class="a">Generalization</span>(일반화)이 잘 된다, 또는 모델이 <span class="a">Robust</span>(강건)하다고 합니다.</p></div></div>
<div class="blk"><div class="unit">과적합 해결</div><table class="mt "><tr><th>해결 방향</th><th>방법</th></tr><tr><td>모델 단순화</td><td>파라미터가 <span class="a">적은</span> 모델, 속성 수 줄이기, <span class="a">규제</span><span class="en">regularization</span></td></tr><tr><td>데이터 늘리기</td><td>학습 데이터를 <span class="a">더 모음</span></td></tr><tr><td>잡음 줄이기</td><td>학습 데이터의 잡음 감소</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">A7</span>Underfitting(과소적합) <span class="pg">p.26</span></h2></div>
<div class="blk"><div class="box"><p>과소적합은 과적합의 <span class="a">반대</span>입니다. 모델이 <span class="a">너무 단순</span>해서 데이터에 깔린 구조를 학습하지 못합니다. 파라미터가 충분하지 않으면 학습을 아무리 해도 복잡한 것을 배우지 못하므로, 모델을 더 <span class="a">깊게</span> 또는 더 <span class="a">크게</span> 만들어야 합니다.</p><p>해결: 파라미터가 <span class="a">많은</span> 모델 · 더 좋은 특징(특징 공학<span class="en">feature engineering</span>) · 모델의 제약 <span class="a">줄이기</span></p></div></div>
<div class="blk"><div class="unit">한 표로 비교</div><table class="mt "><tr><th></th><th>과적합</th><th>과소적합</th></tr><tr><td>모델</td><td>너무 복잡</td><td>너무 단순</td></tr><tr><td>학습 데이터</td><td>잘 맞음</td><td>못 맞춤</td></tr><tr><td>테스트 데이터</td><td>못 맞춤</td><td>못 맞춤</td></tr><tr><td>제약(규제)</td><td><span class="a">늘린다</span></td><td><span class="a">줄인다</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">A8</span>손실 그래프 <span class="pg">p.27</span></h2></div>
<div class="blk"><div class="box"><p>가로축은 학습 시간, 세로축은 <span class="a">손실</span><span class="en">loss</span>입니다. 손실은 <span class="a">실제값과 예측값의 차이</span>이며 작을수록 좋습니다. 손실이 줄면 성능이 높아지고 학습이 잘 되고 있는 것입니다.</p><p>학습 손실은 계속 줄어듭니다. 테스트 손실은 같이 줄다가 어느 지점부터 다시 올라갑니다. 테스트 손실이 가장 낮은 지점의 왼쪽이 과소적합, 오른쪽이 과적합입니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>구간</th><th>학습 손실</th><th>테스트 손실</th></tr><tr><td>과소적합 (왼쪽)</td><td>높음, 줄어드는 중</td><td>높음, 줄어드는 중</td></tr><tr><td>경계</td><td>낮음</td><td><span class="a">가장 낮음</span></td></tr><tr><td>과적합 (오른쪽)</td><td><span class="a">계속 줄어듦</span></td><td><span class="a">다시 커짐</span></td></tr></table></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li><b>1쪽 그림</b>이 나올 것 같습니다. 세 영역의 <span class="a">관계성</span>과 <span class="a">포함 범위</span>(AI ⊃ ML ⊃ DL)를 알아 두세요.</li><li><b>4쪽 그림</b>도 나올 것 같습니다. 전통적 방식은 <span class="a">규칙 기반</span>이고, 기계학습은 데이터를 주고 학습을 통해 <span class="a">패턴</span>을 찾습니다.</li></ul></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p>기계학습이 딥러닝에 포함되는 것이 아닙니다. <span class="a">딥러닝 ⊂ 기계학습</span> ⊂ AI입니다.</p><p>회귀는 정답 y(실수값)가 있으므로 <span class="a">지도</span> 학습입니다. 로지스틱 회귀는 <span class="a">분류</span>에 씁니다. k-means·DBSCAN은 <span class="a">비지도</span>입니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p>"제약 줄이기"는 <span class="a">과소적합</span>, "규제·데이터 더 모으기"는 <span class="a">과적합</span>의 해결책입니다.</p><p>학습 손실이 계속 줄어도 과적합일 수 있습니다. <span class="a">테스트 손실</span>이 다시 커지는지 봅니다. 철자: <span class="a">training</span> data (필기의 "tranning"은 오기).</p></div></div>
<div class="blk"><div class="unit">셀프 체크</div><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>AI, ML, DL의 포함 관계는?</td><td><span class="a">AI ⊃ ML ⊃ DL</span></td></tr><tr><td>전통적 방식과 ML 방식에서 다른 단계는?</td><td><span class="a">규칙 작성 ↔ 알고리즘 학습</span></td></tr><tr><td>정답 y 없이 x만으로 학습하는 유형은?</td><td><span class="a">비지도 학습</span></td></tr><tr><td>이산 라벨을 예측하는 지도 학습 작업은?</td><td><span class="a">분류</span><span class="en">Classification</span></td></tr><tr><td>k-means는 지도 학습이다. (OX)</td><td><span class="a">X</span></td></tr><tr><td>학습 데이터에만 잘 맞고 새 데이터에서 성능이 떨어지는 현상(영어)?</td><td><span class="a">Overfitting</span></td></tr><tr><td>과소적합을 줄이려면 모델의 제약을?</td><td><span class="a">줄인다</span></td></tr><tr><td>학습 손실은 줄고 테스트 손실이 커지는 구간은?</td><td><span class="a">과적합</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">B</span>회귀 <span class="en">Regression</span></h2><p class=lead>교안 Regression · 나오는 쪽: 3, 4, 5, 7, 12, 13, 23, 24, 25</p></div>
<div class="blk"><div class="key"><p><b>한눈에 보기</b></p><ul class="pt"><li>회귀는 출력 Y를 입력 X들의 <span class="a">선형 결합</span><span class="en">linear combination</span>으로 나타냅니다.</li><li>독립변수 x가 1개면 <span class="a">단순 회귀</span>, 2개 이상이면 <span class="a">다중 회귀</span>입니다. 모양이 곧으면 선형, 휘면 비선형입니다.</li><li>단순 선형 회귀는 Y = β<sub>0</sub> + β<sub>1</sub>X + ε입니다. 학습은 β<sub>0</sub>, β<sub>1</sub>을 찾는 일입니다.</li><li>결정계수 <span class="a">R²</span>는 모델이 데이터의 <span class="a">변동</span>을 얼마나 설명하는지 나타냅니다.</li><li>SST(전체) = <span class="a">SSR</span>(설명함) + <span class="a">SSE</span>(틀림). R²는 <span class="a">1</span>에 가까울수록 좋습니다.</li><li>선형 회귀는 실수값을 예측하고, 로지스틱 회귀는 이를 <span class="a">분류</span> 문제로 가져갑니다.</li><li>β<sub>0</sub> + β<sub>1</sub>x를 <span class="a">시그모이드</span> 함수에 넣어 0~1 값으로 바꾸고, 보통 <span class="a">0.5</span> 기준으로 나눕니다.</li></ul><p style="font-size:12px">안 나오는 쪽: 18쪽 Adjusted R² · 19쪽 계수 해석 · 최소제곱(LSE) 유도·계산.</p></div></div>
<div class="blk sh"><h2><span class="sn">B1</span>용어와 회귀의 정의 <span class="pg">p.3–4</span></h2></div>
<div class="blk"><div class="box"><p>회귀는 x → 모델 → y 형식의 <span class="a">지도학습</span>입니다(A 기계학습 입문). 같은 x, y를 분야마다 다른 이름으로 부릅니다.</p></div></div>
<div class="blk"><div class="unit">같은 대상의 여러 이름 <span class="pg">p.3</span></div><table class="mt "><tr><th>입력 x (독립변수)</th><th>출력 y (종속변수)</th></tr><tr><td>Input 입력</td><td>Output 출력</td></tr><tr><td>Feature 특징</td><td>Target 타깃</td></tr><tr><td>Attribute 속성</td><td>Label 라벨</td></tr><tr><td>Predictor 예측변수</td><td>Response 반응변수</td></tr><tr><td>Risk factor 위험 요인</td><td>Class 클래스 · Outcome 결과</td></tr></table></div>
<div class="blk"><div class="box"><p><b>Linear Regression Model</b>(선형 회귀 모델)은 출력 변수 Y를 입력 변수 X들의 <span class="a">선형 결합</span><span class="en">linear combination</span>으로 나타냅니다. <span class="pg">p.4</span></p><p>선형 결합은 여러 변수에 각각 <span class="a">계수</span><span class="en">coefficient</span>를 곱한 뒤 더한 형태입니다.</p><p>목적은 두 가지입니다. ① X와 Y의 관계를 수학식으로 <span class="a">설명</span>합니다. ② 반응 변수 Y의 미래 값을 <span class="a">예측</span>합니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">B2</span>회귀의 분류 <span class="pg">p.5</span></h2></div>
<div class="blk"><div class="unit">단순 ↔ 다중: x의 개수</div><table class="mt "><tr><th>이름</th><th>정의</th></tr><tr><td>Simple regression<br>단순 회귀</td><td>독립변수 x가 <span class="a">1개</span></td></tr><tr><td>Multiple regression<br>다중 회귀</td><td>독립변수 x가 <span class="a">2개 이상</span></td></tr></table></div>
<div class="blk"><div class="unit">선형 ↔ 비선형: 맞추는 모양이 곧은가, 휘었는가</div><table class="mt "><tr><th></th><th>선형 Linear</th><th>비선형 Nonlinear</th></tr><tr><td>단순 (x 1개)</td><td><span class="a">직선</span></td><td><span class="a">곡선</span> (다항 모델)</td></tr><tr><td>다중 (x 2개 이상)</td><td><span class="a">평면</span></td><td><span class="a">곡면</span></td></tr></table></div>
<div class="blk"><div class="box"><p>다항 모델 y = b<sub>0</sub> + b<sub>1</sub>x + b<sub>2</sub>x<sup>2</sup>은 항이 셋이어도 x가 <span class="a">하나</span>이므로 <span class="a">단순</span> 회귀입니다. 곡선이므로 비선형입니다.</p><p>x가 3개 이상이면 맞추는 대상은 <span class="a">초평면</span><span class="en">hyperplane</span>입니다. 수업은 선형만 다룹니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">B3</span>단순 선형 회귀 <span class="pg">p.7</span></h2></div>
<div class="blk"><div class="box"><div class="fx">Y = β<sub>0</sub> + β<sub>1</sub>X + ε</div><p>단순 회귀이므로 x가 <span class="a">하나</span> 들어옵니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>기호</th><th>뜻</th></tr><tr><td>β<sub>0</sub></td><td><span class="a">절편</span><span class="en">intercept</span>: X = 0일 때 Y</td></tr><tr><td>β<sub>1</sub></td><td><span class="a">기울기</span><span class="en">slope</span>: X가 1 늘 때 Y의 변화</td></tr><tr><td>ε</td><td><span class="a">오차항</span><span class="en">error term</span>: 직선으로 설명되지 않는 나머지</td></tr></table></div>
<div class="blk"><div class="box"><p>β<sub>0</sub>, β<sub>1</sub>은 모르는 두 상수이며 <span class="a">계수</span> 또는 <span class="a">파라미터</span><span class="en">parameter</span>라고도 부릅니다. 선형 회귀를 만든다는 것은 데이터로 β<sub>0</sub>, β<sub>1</sub>을 찾는 것입니다.</p><p>찾은 추정값으로 예측합니다. 햇(^) 기호는 <span class="a">추정값</span>을 뜻합니다.</p><div class="fx">ŷ = β̂<sub>0</sub> + β̂<sub>1</sub>x</div><p>y는 실제값, ŷ는 모델의 <span class="a">예측값</span>입니다(B5에서 씀).</p></div></div>
<div class="blk sh"><h2><span class="sn">B4</span>결정계수 R² <span class="pg">p.12</span></h2></div>
<div class="blk"><div class="box"><p><b>Coefficient of Determination</b>(결정계수, R²): 회귀 모델이 데이터의 <span class="a">변동</span><span class="en">variation</span>을 얼마나 잘 설명하는지 나타내는 척도입니다.</p><p>y의 전체 분산 중 모델이 <span class="a">설명하는 비율</span>입니다.</p><div class="fx">R<sup>2</sup> = 1 − <span class="frac"><span class="num">SSE</span><span class="den">SST</span></span> = <span class="frac"><span class="num">SSR</span><span class="den">SST</span></span></div><p>뜻: 전체 변동(SST) 중 설명한 몫(SSR)의 비율입니다.</p><p>교안 범위: 0 ≤ R² ≤ 1. R² = 1은 Good fit, 0은 Poor fit입니다. 모델이 매우 나쁘면 <span class="a">음수</span>도 나옵니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">B5</span>SST · SSR · SSE 그래프 <span class="pg">p.13</span></h2></div>
<div class="blk"><div class="box"><p>그래프에는 가로선 ȳ(y의 <span class="a">평균</span>), 기울어진 선 ŷ(내가 만든 선형 회귀 모델의 <span class="a">예측</span>), 점 y<sub>i</sub>(실제값, 정답)가 있습니다. 점 하나마다 세 거리를 봅니다.</p></div></div>
<div class="blk"><div class="unit">세 구간을 모든 점에 대해 제곱해 더한 값</div><table class="mt "><tr><th>이름</th><th>구간</th><th>뜻</th></tr><tr><td>SST <span class="en">Total</span></td><td>ȳ → y<sub>i</sub></td><td>전체 변동 (평균→정답)</td></tr><tr><td>SSR <span class="en">Regression</span></td><td>ȳ → ŷ<sub>i</sub></td><td><span class="a">설명한</span> 변동 (평균→예측)</td></tr><tr><td>SSE <span class="en">Error</span></td><td>ŷ<sub>i</sub> → y<sub>i</sub></td><td><span class="a">틀린</span> 정도 (예측→정답)</td></tr></table></div>
<div class="blk"><div class="box"><div class="fx">SST = SSR + SSE</div><p>SST는 데이터가 정하므로 <span class="a">고정</span>입니다. 좋은 모델일수록 SSR 몫이 커지고 SSE 몫이 작아집니다. 그래서 <span class="a">SSR</span>이 높아져야 하고, R²는 1에 가까워집니다.</p></div></div>
<div class="blk"><div class="unit">R² 값 읽기</div><table class="mt "><tr><th>R²</th><th>그래프에서</th><th>뜻</th></tr><tr><td>1</td><td>SSE = 0</td><td><span class="a">다 맞춤</span></td></tr><tr><td>1에 가까움</td><td>SSE 작고 SSR 큼</td><td>좋음</td></tr><tr><td>0</td><td>SSR = 0, ŷ = ȳ</td><td><span class="a">평균</span>으로 맞추는 수준</td></tr><tr><td>음수</td><td>SSE &gt; SST</td><td>평균보다 <span class="a">못함</span></td></tr></table></div>
<div class="blk"><div class="box"><p>(보충) SST = SSR + SSE와 0 ≤ R² ≤ 1은 학습 데이터에 최소제곱으로 맞춘 선형 회귀(절편 포함)에서 성립합니다. 음수는 평균보다 나쁜 모델(예: 새 데이터에 적용)에서 나옵니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">B6</span>선형 회귀 vs 로지스틱 회귀 <span class="pg">p.23</span></h2></div>
<div class="blk"><table class="mt "><tr><th></th><th>선형 회귀</th><th>로지스틱 회귀</th></tr><tr><td>하는 일</td><td><span class="a">실수값</span> 예측</td><td><span class="a">분류</span></td></tr><tr><td>출력</td><td>연속값 (범위 없음)</td><td>Y = 1일 확률, <span class="a">0과 1 사이</span></td></tr><tr><td>그림 모양</td><td>직선</td><td><span class="a">S자</span> 곡선</td></tr></table></div>
<div class="blk"><div class="box"><p>그림(잔액 → 채무불이행 확률, 관측은 0 또는 1): 직선은 0 아래로 내려가고 1에 닿지 못합니다. S자 곡선은 항상 0과 1 사이에 있습니다. 그래서 0/1 분류에는 로지스틱 회귀를 씁니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">B7</span>로지스틱 회귀 <span class="pg">p.24</span></h2></div>
<div class="blk"><div class="box"><p>p(X) = Pr(Y = 1 | X)로 줄여 씁니다. p(X)는 <span class="a">Y = 1</span>일 확률입니다. 예: 잔액(balance)으로 채무불이행(default)을 예측합니다.</p><div class="fx">p(X) = <span class="frac"><span class="num">1</span><span class="den">1 + e<sup>−(β<sub>0</sub> + β<sub>1</sub>X)</sup></span></span></div><p>뜻: 지수 자리의 β<sub>0</sub> + β<sub>1</sub>X는 선형 회귀와 <span class="a">같은 직선</span>입니다. 그 값을 함수에 넣어 0과 1 사이 값으로 바꿉니다. 이 함수가 시그모이드입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">B8</span>시그모이드 함수와 0.5 기준 <span class="pg">p.25</span></h2></div>
<div class="blk"><div class="box"><div class="fx">φ(z) = <span class="frac"><span class="num">1</span><span class="den">1 + e<sup>−z</sup></span></span></div><p><b>Sigmoid function</b>(시그모이드 함수)은 어떤 실수든 <span class="a">0과 1 사이</span>로 바꾸는 S자 곡선입니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>z</th><th>φ(z)</th></tr><tr><td>z = 0</td><td>정확히 <span class="a">0.5</span></td></tr><tr><td>z가 커짐</td><td><span class="a">1</span>에 가까워짐</td></tr><tr><td>z가 작아짐</td><td><span class="a">0</span>에 가까워짐</td></tr></table></div>
<div class="blk"><div class="box"><p>로지스틱 회귀는 z 자리에 β<sub>0</sub> + β<sub>1</sub>X를 넣습니다. 나온 값이 가까운 쪽으로 0 또는 1로 분류합니다.</p><p>기준은 일반적으로 <span class="a">0.5</span>입니다. 규정에 따라 <span class="a">바꿀 수 있습니다</span>. 예: 병원에서 환자 분류의 <span class="a">민감도</span>를 높이는 경우입니다.</p></div></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><div class="blk"><ul class="pt"><li>회귀의 정의를 봐 둡니다. 출력 Y와 X의 관계를 <span class="a">선형</span>으로 나타냅니다.</li><li>단순 회귀(x <span class="a">1개</span>)와 다중 회귀(x <span class="a">2개 이상</span>)의 정의를 알아 둡니다. 푸는 수식은 내지 않습니다.</li><li>결정계수는 잘 봐야 합니다. 식을 외우기보다 SST·SSR·SSE <span class="a">그래프</span>로 이해합니다.</li><li>ȳ = 평균, ŷ = 내 예측. <span class="a">SSR</span>이 높아져야 하고, R²는 <span class="a">1</span>에 가까울수록 좋습니다.</li></ul></div></div></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><div class="blk"><ul class="pt"><li>로지스틱 회귀는 β<sub>0</sub> + β<sub>1</sub>x를 <span class="a">시그모이드</span>에 넣어 분류합니다.</li><li>특별한 말이 없으면 기준은 <span class="a">0.5</span>이고, 규정에 따라 바꾸기도 합니다(병원 민감도 예).</li></ul></div></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p>R²가 <b>−1이면</b> 평균보다 못하다? → 정확히는 R²가 <span class="a">음수</span>이면 평균보다 못한 것입니다. −1이 하한이 <span class="a">아니며</span> 더 작아질 수 있습니다. R² = 0은 평균 <span class="a">수준</span>이지 평균보다 못한 것이 아닙니다.</p><p>SSE는 예측→<span class="a">정답</span>, SSR은 평균→<span class="a">예측</span>입니다. 둘을 바꿔 쓴 문장에 주의합니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p>y = b<sub>0</sub> + b<sub>1</sub>x + b<sub>2</sub>x<sup>2</sup>은 항이 셋이라도 x가 하나이므로 <span class="a">단순</span> 회귀입니다. 단순·다중은 항 수가 아니라 <span class="a">x의 개수</span>로 나눕니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p>로지스틱 회귀는 이름에 회귀가 있지만 <span class="a">분류</span>에 씁니다. 0.5 기준은 <span class="a">고정이 아닙니다</span>.</p><p>주관식 철자: "회기"가 아니라 <span class="a">회귀</span>(Regression)입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">B</span>셀프 체크</h2></div>
<div class="blk"><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>X들에 계수를 곱해 더한 형태는?</td><td><span class="a">선형 결합</span></td></tr><tr><td>독립변수가 2개 이상인 회귀는?</td><td><span class="a">Multiple regression</span> (다중 회귀)</td></tr><tr><td>y = b<sub>0</sub> + b<sub>1</sub>x + b<sub>2</sub>x<sup>2</sup>은 다중 회귀이다. (OX)</td><td><span class="a">X</span> — x 하나, 단순 회귀</td></tr><tr><td>Y = β<sub>0</sub> + β<sub>1</sub>X + ε에서 β<sub>1</sub>은?</td><td><span class="a">기울기</span> (slope)</td></tr><tr><td>데이터의 변동을 얼마나 설명하는지 재는 척도는?</td><td><span class="a">결정계수</span> (R²)</td></tr><tr><td>ȳ → ŷ 거리의 제곱합은?</td><td><span class="a">SSR</span></td></tr><tr><td>R²의 가장 작은 값은 −1이다. (OX)</td><td><span class="a">X</span> — 하한 없음</td></tr><tr><td>로지스틱 회귀의 S자 함수와 보통의 기준값은?</td><td><span class="a">시그모이드</span>, <span class="a">0.5</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">C</span>SVM <span class="en">Support Vector Machine</span></h2><p class=lead>Classification: Support Vector Machine · 나오는 쪽: 2, 7, 14, 15, 18, 19, 25, 28, 32</p></div>
<div class="blk"><div class="key"><div class="blk"><ul class="pt"><li>SVM은 <span class="a">지도학습</span> 분류 모델입니다. 클래스 사이의 <span class="a">Margin(마진)</span>을 최대로 하는 결정 경계를 만듭니다.</li><li>경계를 정하는 샘플은 <span class="a">Support vector(서포트 벡터)</span>입니다. 나머지 샘플은 경계에 영향을 주지 않습니다.</li><li>Hard margin은 오류를 <span class="a">허용하지 않고</span>, Soft margin은 오류를 <span class="a">어느 정도 허용</span>합니다. 보통 소프트 마진을 씁니다.</li><li>★ 오류 허용 정도는 하이퍼파라미터 <span class="a">C</span>가 정합니다. 작은 C → 마진 <span class="a">넓음</span> → 과소적합, 큰 C → 마진 <span class="a">좁음</span> → 과적합.</li><li>직선으로 안 나뉘면 특징 공간을 <span class="a">고차원</span>으로 늘려 선형으로 나눕니다. <span class="a">Kernel function(커널 함수)</span>이 이것을 효율적으로 합니다.</li><li>클래스가 3개 이상이면 <span class="a">One vs All</span> 또는 <span class="a">One vs One</span>으로 이진 SVM을 조합합니다.</li></ul></div><p style="font-size:12px;margin-top:4px"><b>안 나오는 쪽</b>: 8 하드 마진 수식 · 11 스케일링 · 29 커널 식 · 33 SVR</p></div></div>
<div class="blk sh"><h2><span class="sn">C1</span>SVM의 정의와 종류 <span class="pg">p.2</span></h2></div>
<div class="blk"><div class="box"><p><b>SVM</b>은 <span class="a">지도학습</span><span class="en">supervised learning</span> 모델로, 클래스 사이의 <span class="a">마진을 최대화</span>하여 <span class="a">결정 경계</span><span class="en">decision boundary</span>를 만듭니다. 이때 <span class="a">서포트 벡터</span>를 사용하고, <span class="a">커널 트릭</span><span class="en">kernel trick</span>으로 비선형 경계까지 확장됩니다.</p></div></div>
<div class="blk"><div class="unit">SVM의 종류</div><table class="mt "><tr><th>경계</th><th>이름</th><th>오류</th></tr><tr><td>선형</td><td>Hard Margin SVM<span class="en">= Maximal margin classifier</span></td><td><span class="a">허용 안 함</span></td></tr><tr><td>선형</td><td>Soft Margin SVM<span class="en">= Linear SVM</span></td><td><span class="a">어느 정도 허용</span></td></tr><tr><td>비선형</td><td>Kernel SVM</td><td><span class="a">커널</span>로 곡선 경계</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">C2</span>최대 마진 초평면과 서포트 벡터 <span class="pg">p.7</span></h2></div>
<div class="blk"><div class="box"><p>두 클래스를 나누는 직선(분리 초평면)은 무수히 많습니다. SVM은 그중 학습 샘플에서 <span class="a">가장 멀리</span> 떨어진 것, 즉 <b>최대 마진 초평면</b><span class="en">maximal margin hyperplane</span>을 고릅니다.</p><p><b>Margin(마진)</b>: 학습 샘플과 초평면 사이 거리 중 <span class="a">가장 작은</span> 거리입니다.</p><p><b>Support vector(서포트 벡터)</b>: 초평면까지의 거리가 <span class="a">마진과 같은</span> 학습 샘플입니다. 경계를 정하는 것은 서포트 벡터뿐이고, 나머지 점은 조금 움직여도 경계가 <span class="a">그대로</span>입니다.</p></div></div>
<div class="blk"><div class="unit">그림 읽기</div><table class="mt "><tr><th>그림 요소</th><th>뜻</th></tr><tr><td>가운데 실선</td><td><span class="a">결정 경계</span>(최대 마진 초평면)</td></tr><tr><td>양쪽 점선</td><td>마진 경계. 실선은 두 점선의 가운데</td></tr><tr><td>실선 ↔ 점선 간격</td><td><span class="a">마진</span>의 크기</td></tr><tr><td>점선 위의 점</td><td><span class="a">서포트 벡터</span> — 마진을 만드는 점</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">C3</span>소프트 마진 SVM <span class="pg">p.14</span></h2></div>
<div class="blk"><div class="box"><p><b>Soft Margin SVM</b>: 초평면으로 분류하되, 학습 샘플이 <span class="a">마진이나 초평면의 반대쪽</span>에 놓이는 것을 허용합니다. 클래스를 "거의" 나눕니다.</p><p>그림의 빨간 원 3개가 초평면 반대쪽에 놓인 점입니다. 허용 정도는 <span class="a">C</span>로 조절합니다(C5).</p></div></div>
<div class="blk"><div class="unit">하드 마진 vs 소프트 마진</div><table class="mt "><tr><th></th><th>Hard Margin</th><th>Soft Margin</th></tr><tr><td>오류</td><td><span class="a">허용 안 함</span></td><td><span class="a">어느 정도 허용</span></td></tr><tr><td>데이터</td><td>선형 분리 <span class="a">가능할 때만</span></td><td>조금 섞여도 가능</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">C4</span>소프트 마진의 서포트 벡터 <span class="pg">p.15</span></h2></div>
<div class="blk"><div class="box"><p>소프트 마진의 서포트 벡터 = 마진 <span class="a">위에</span> 정확히 놓인 점 + 자기 클래스 기준으로 마진의 <span class="a">반대쪽</span>에 놓인 점(마진 침범·오분류)입니다. 하드 마진은 마진 위의 점만 서포트 벡터입니다.</p></div></div>
<div class="blk"><div class="unit">그림의 점 1~12</div><table class="mt "><tr><th>점의 위치</th><th>SV?</th></tr><tr><td>마진 경계(점선) 위 · 7, 9, 2</td><td><span class="a">예</span></td></tr><tr><td>마진 안쪽, 초평면은 맞는 쪽 · 1, 8</td><td><span class="a">예</span></td></tr><tr><td>초평면 반대쪽(오분류) · 11, 12</td><td><span class="a">예</span></td></tr><tr><td>자기 쪽 마진 바깥 · 3–6, 10</td><td><span class="a">아니오</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">C5</span>★ 벌점 매개변수 C <span class="pg">p.18</span></h2></div>
<div class="blk"><div class="box"><p><b>Penalty parameter C(벌점 매개변수)</b>는 마진 폭과 분류 오류 허용 정도 사이의 <span class="a">균형(trade-off)</span>을 조절합니다.</p><ul class="pt"><li>C는 <span class="a">하이퍼파라미터</span><span class="en">hyperparameter</span>입니다. 학습으로 정해지지 않고 학습 <span class="a">전에</span> 사람이 정하는 설정값입니다. <span class="a">교차 검증</span><span class="en">cross-validation</span>으로 조정합니다.</li><li>C는 <span class="a">음수가 될 수 없습니다</span><span class="en">non-negative</span>.</li><li>C를 작은 값에서 큰 값으로 바꾸면 <span class="a">편향-분산 트레이드오프</span>가 생깁니다.</li><li>"C = 0이면 최대 마진 분류기" 문장 → 함정 상자 참고.</li></ul></div></div>
<div class="blk sh"><h2><span class="sn">C6</span>★ C와 마진 · 적합 — 외우기 <span class="pg">p.19</span></h2></div>
<div class="blk"><div class="unit">C의 크기에 따른 변화</div><table class="mt "><tr><th></th><th>Small C</th><th>Large C</th></tr><tr><td>마진</td><td><span class="a">넓음</span><span class="en">Large margin</span></td><td><span class="a">좁음</span><span class="en">Small margin</span></td></tr><tr><td>오류</td><td><span class="a">많이</span> 허용</td><td><span class="a">적게</span> 허용(최소화)</td></tr><tr><td>모델</td><td><span class="a">단순</span></td><td><span class="a">빡빡하게</span> 나눔</td></tr><tr><td>위험</td><td><span class="a">Underfitting</span><span class="en">과소적합</span></td><td><span class="a">Overfitting</span><span class="en">과적합</span></td></tr><tr><td>편향</td><td><span class="a">높음</span></td><td><span class="a">낮음</span></td></tr><tr><td>분산</td><td><span class="a">낮음</span></td><td><span class="a">높음</span></td></tr></table></div>
<div class="blk"><div class="box"><p><b>이유</b>: C는 오류에 주는 벌점입니다. C가 크면 오류가 비싸므로 마진을 좁혀서라도 덜 틀리려 합니다. C가 작으면 몇 개 틀리더라도 넓은 마진을 택합니다.</p><p>순서: C ↑ → 오류 벌점 ↑ → 마진 <span class="a">↓</span> → <span class="a">과적합</span>. C ↓는 전부 반대입니다.</p><p>그림 4개는 마진(점선 간격)이 좁아지는 순서 = C가 <span class="a">커지는</span> 순서입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">C7</span>특징 공간 확장 <span class="pg">p.25</span></h2></div>
<div class="blk"><div class="box"><p>어떤 데이터는 <span class="a">선형 분리가 불가능</span>하지만, 더 <span class="a">높은 차원</span>의 공간으로 변환하면 선형 분리가 가능해집니다.</p></div></div>
<div class="blk"><div class="unit">그림: 왼쪽 → 오른쪽</div><table class="mt "><tr><th></th><th>원래 특징 공간</th><th>새 특징 공간</th></tr><tr><td>변수</td><td>x<sub>1</sub>, x<sub>2</sub> (<span class="a">2D</span>)</td><td>x<sub>1</sub>, x<sub>2</sub>, x<sub>1</sub>x<sub>2</sub> (<span class="a">3D</span>)</td></tr><tr><td>경계</td><td><span class="a">비선형</span>(곡선)</td><td><span class="a">선형</span>(평면)</td></tr></table></div>
<div class="blk"><div class="box"><p>왼쪽은 대각선 방향으로 같은 클래스가 놓여 직선으로 나눌 수 없습니다. 새 축 x<sub>1</sub>x<sub>2</sub>를 더하면 두 클래스가 위아래로 갈라져 평면 하나로 나뉩니다. 이 평면은 원래 공간에서 <span class="a">비선형</span> 경계입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">C8</span>비선형 SVM과 커널 함수 <span class="pg">p.28</span></h2></div>
<div class="blk"><div class="box"><p><b>비선형 SVM</b>은 서포트 벡터 분류기에 <span class="a">커널 함수</span><span class="en">kernel function</span>를 써서 <span class="a">비선형 결정 경계</span>를 얻도록 확장한 것입니다.</p><ul class="pt"><li>커널 함수 K는 <span class="a">내적</span><span class="en">inner product</span>을 일반화한 것입니다.</li><li>두 입력을 받아 어떤 특징 공간에서의 내적을 <span class="a">암묵적으로</span><span class="en">implicitly</span> 계산합니다.</li><li>데이터를 고차원으로 옮긴 뒤, 그 공간에서 <span class="a">선형</span> 경계(초평면)로 SVM을 적용합니다.</li></ul><p>커널은 고차원 특징을 직접 만들지 않고 내적만 계산하므로 <span class="a">효율적</span>입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">C9</span>다중 클래스 SVM <span class="pg">p.32</span></h2></div>
<div class="blk"><div class="box"><p>SVM은 원래 <span class="a">이진</span> 분류기입니다. 클래스가 3개 이상이면 이진 SVM 여러 개를 조합합니다.</p></div></div>
<div class="blk"><div class="unit">K = 클래스 수 · OvR = One-versus-Rest</div><table class="mt "><tr><th></th><th>One vs All</th><th>One vs One</th></tr><tr><td>뜻</td><td>하나 vs <span class="a">나머지</span></td><td>하나 vs <span class="a">하나</span></td></tr><tr><td>방법</td><td>클래스마다 그 클래스 vs 나머지 전부</td><td>클래스를 <span class="a">두 개씩</span> 짝지음</td></tr><tr><td>분류기 수 (보충)</td><td><span class="a">K개</span></td><td><span class="a"><span class="frac"><span class="num">K(K − 1)</span><span class="den">2</span></span>개</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">★</span>교수님 강조 · 10/26 복습</h2></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>"19쪽은 외우자."</b> 수식은 어려우니 표로 외우라고 하셨습니다.</p><p>C를 <span class="a">작게</span> 하면 마진이 커지고(에러를 많이 허용), <span class="a">과소적합</span>이 될 수 있습니다. C를 <span class="a">크게</span> 하면 마진이 작아지고 허용되는 오류가 적어져 <span class="a">과적합</span>이 될 수 있습니다.</p><p>18쪽: <b>C에 따라 결과가 어떻게 바뀌는지는 잘 알아 둬야 합니다.</b></p></div></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p>하드·소프트 마진 중 <span class="a">보통 소프트 마진</span>을 씁니다. 시험은 <span class="a">개념 위주</span>로 묻고 수식은 내지 않습니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">!</span>함정 · 헷갈리는 것</h2></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>큰 C가 과적합입니다.</b> 필기에 "C를 작게 잡으면 마진이 작아짐 … 오버피팅"이라고 적혔지만 받아 적기 오기입니다. 마진이 작아지고 과적합이 되는 쪽은 C를 <span class="a">크게</span> 잡을 때입니다.</p><p>"작은 C는 편향이 낮다" → X. 편향 <span class="a">높음</span>·분산 낮음입니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>18쪽 "C = 0이면 최대 마진 분류기"</b>: C를 위반 총량의 상한(예산)으로 정의할 때의 문장입니다. 19쪽 표의 벌점 C로는 하드 마진이 C → <span class="a">∞</span>입니다.</p><p>교수님은 <span class="a">19쪽 기준</span>으로 외우라고 하셨습니다. 다만 이 문장이 그대로 OX로 나오면 교안 문장이라 O로 처리될 가능성이 있습니다(추측).</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>소프트벡터 → <span class="a">서포트 벡터(Support vector)</span></b>. 필기 오기입니다. "소프트"는 소프트 마진의 소프트입니다. 주관식 철자 주의.</p><p><b>마진은 평균 거리가 아닙니다.</b> 초평면에 <span class="a">가장 가까운</span> 샘플까지의 거리입니다.</p><p><b>소프트 마진의 서포트 벡터</b>는 마진 위의 점만이 아닙니다. 마진을 침범한 점과 <span class="a">오분류된 점</span>도 포함합니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">✓</span>셀프 체크</h2></div>
<div class="blk"><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>SVM의 학습 유형은?</td><td><span class="a">지도학습</span></td></tr><tr><td>SVM이 최대로 하는 것은?</td><td><span class="a">Margin(마진)</span></td></tr><tr><td>결정 경계를 정하는 샘플은? (영어)</td><td><span class="a">Support vector</span></td></tr><tr><td>오류를 허용하지 않는 SVM은?</td><td><span class="a">Hard Margin SVM</span></td></tr><tr><td>★ C를 크게 하면 마진과 위험은?</td><td><span class="a">좁음 · Overfitting</span></td></tr><tr><td>★ C를 작게 하면 편향과 분산은?</td><td><span class="a">편향 높음 · 분산 낮음</span></td></tr><tr><td>C를 고르는 방법은?</td><td><span class="a">교차 검증</span></td></tr><tr><td>내적을 일반화한 함수는?</td><td><span class="a">Kernel function</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">D</span>군집화 Clustering</h2><p class=lead>교안 Clustering · 나오는 쪽: 2–4, 6, 8, 10–16, 18–20, 22, 23, 25, 26</p></div>
<div class="blk"><div class="key"><div class="h">한눈에 보기</div><ul class="pt"><li>군집화는 <span class="a">라벨이 없는</span> 데이터에서 비슷한 샘플끼리 묶어 라벨을 만들어 가는 <span class="a">비지도 학습</span>입니다.</li><li>종류는 "비슷하다·다르다"의 기준으로 나뉩니다. K-평균·계층적 = <span class="a">거리</span>, DBSCAN = <span class="a">밀도</span>.</li><li>K-평균은 K를 <span class="a">미리 정하고</span>, 모든 샘플을 <span class="a">정확히 한</span> 군집에 넣어 군집 내 변동(WCV)의 합을 줄입니다.</li><li>순서: 무작위 초기화 → (중심 = 군집 <span class="a">평균</span> 계산 ↔ <span class="a">가장 가까운</span> 중심에 재배정) 반복. K-means++는 <span class="a">초기화</span>만 바꿉니다.</li><li>K-평균의 한계: 크기·밀도가 다른 군집, 휘어진 모양, K 정하기. 그래서 다른 방법이 나왔습니다.</li><li>K는 실루엣 점수가 <span class="a">가장 높은</span> 값으로 고릅니다.</li><li>계층적(병합): 샘플마다 군집 하나로 시작해 합쳐 가고, <span class="a">덴드로그램</span>을 끊는 위치로 군집 수를 정합니다.</li><li>DBSCAN: <span class="a">ε</span>과 <span class="a">MinPts</span>로 고밀도를 정하고, 밖의 점은 <span class="a">Noise</span>로 둡니다.</li></ul><p style="font-size:12px">안 나오는 쪽: 24쪽 연결 방식(“볼 필요 없음”), 5·7·9·17·21·27–35쪽.</p></div></div>
<div class="blk sh"><h2><span class="sn">D1</span>비지도 학습과 군집화 <span class="pg">p.2–3</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Unsupervised Learning</span>(비지도 학습)은 라벨이 없는 데이터에서 패턴과 구조를 배웁니다. 정답 라벨<span class="en">ground truth labels</span>이 없고, 모델이 숨은 구조를 스스로 찾습니다. <span class="pg">p.2</span></p><p><span class="a">Clustering</span>(군집화)은 데이터 안의 부분 집단(cluster)을 찾는 기법들을 통틀어 부르는 말입니다. 데이터를 서로 다른 집단으로 나누되<span class="en">partition</span>, 같은 집단 안의 샘플끼리는 매우 비슷하게 나눕니다. <span class="pg">p.3</span></p><p>그러려면 먼저 "비슷하다·다르다"의 뜻을 정해야 합니다. 이것은 분야 지식<span class="en">domain-specific</span>으로 정합니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">D2</span>군집화 방법 세 가지 <span class="pg">p.4</span></h2></div>
<div class="blk"><table class="mt "><tr><th>방법</th><th>무엇을 하나</th><th>기준</th></tr><tr><td>K-means<br>(K-평균)</td><td>샘플을 <span class="a">미리 정한 K개</span> 군집으로 나눔</td><td><span class="a">거리</span></td></tr><tr><td>Hierarchical<br>(계층적)</td><td>군집 수를 미리 정하지 않음. <span class="a">덴드로그램</span> 하나로 1개~n개 결과를 한꺼번에</td><td><span class="a">거리</span> + 나무 구조</td></tr><tr><td>DBSCAN</td><td><span class="a">빽빽한 영역</span>을 군집으로, 밀도 낮은 영역으로 구분</td><td><span class="a">밀도</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">D3</span>K-평균의 정의: 분할 <span class="pg">p.6</span></h2></div>
<div class="blk"><table class="mt "><tr><th>성질</th><th>뜻</th></tr><tr><td><span style="white-space:nowrap">C<sub>1</sub> ∪ ⋯ ∪ C<sub>K</sub></span><br><span style="white-space:nowrap">= {1, …, n}</span></td><td>모든 샘플은 <span class="a">적어도 하나</span>의 군집에 속함</td></tr><tr><td><span style="white-space:nowrap">C<sub>k</sub> ∩ C<sub>k′</sub> = ∅</span><br>(k ≠ k′)</td><td>군집끼리 <span class="a">겹치지 않음</span></td></tr></table></div>
<div class="blk"><div class="box"><p>C<sub>k</sub>는 k번째 군집에 속한 샘플 번호의 집합입니다. 두 성질을 합치면 모든 샘플이 <span class="a">정확히 한</span> 군집에만 속합니다. 이산수학의 집합의 분할과 같습니다.</p><p>K는 <span class="a">하이퍼파라미터</span><span class="en">hyperparameter</span>입니다. 학습 전에 사람이 미리 정하는 설정값입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">D4</span>군집 내 변동 <span class="pg">p.8</span></h2></div>
<div class="blk"><div class="box"><div class="fx">WCV(C<sub>k</sub>) = <span class="frac"><span class="num">1</span><span class="den">|C<sub>k</sub>|</span></span> Σ<sub>i, i′∈C<sub>k</sub></sub> Σ<sub>j=1</sub><sup>p</sup> (x<sub>ij</sub> − x<sub>i′j</sub>)<sup>2</sup></div><p>뜻: 한 군집 안 샘플 두 개씩의 거리(제곱, 보통 <span class="a">유클리드</span> 거리)를 모두 더해 군집 크기로 나눈 값입니다.</p><p><span class="a">Within-cluster variation</span>(군집 내 변동)은 샘플이 뭉쳐 있을수록 <span class="a">작습니다</span>. K-평균은 모든 군집의 WCV <span class="a">합을 최소</span>로 만드는 분할을 찾습니다. 군집 안의 분산을 줄인다는 뜻입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">D5</span>K-평균 알고리즘의 순서 <span class="pg">p.10–11</span></h2></div>
<div class="blk"><ol class="pt"><li><b>무작위 배정</b>: 각 샘플에 1~K 번호를 <span class="a">무작위</span>로 붙입니다(처음 배정).</li><li><b>중심 계산</b>: 군집마다 중심<span class="en">centroid</span>을 구합니다. 중심 = 그 군집 샘플들의 <span class="a">평균</span>.</li><li><b>재배정</b>: 각 샘플을 중심이 <span class="a">가장 가까운</span> 군집에 배정합니다.</li><li><b>반복</b>: 2–3을 배정이 <span class="a">바뀌지 않을</span> 때까지(수렴) 반복합니다.</li></ol></div>
<div class="blk"><div class="box"><p>11쪽 그림은 Initialize → Assign → Update → Reassign으로 보여 줍니다. 중심을 군집의 평균으로 옮기기 때문에 이름이 K-means입니다. 처음이 무작위라서 <span class="a">초기값</span>에 따라 결과가 달라질 수 있습니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">D6</span>K-평균++ <span class="pg">p.12</span></h2></div>
<div class="blk"><div class="box"><p>무작위 초기화는 시작이 나쁘면 나쁜 국소 최솟값<span class="en">poor local minima</span>으로 수렴합니다. <span class="a">K-means++</span>는 처음 중심을 더 잘 고릅니다.</p><ol class="pt"><li>첫 중심: 샘플 중에서 균등하게 무작위로 고릅니다.</li><li>다음 중심: 가장 가까운 기존 중심까지 거리의 제곱에 비례하는 확률로 고릅니다. <span class="a">멀리 있는</span> 샘플일수록 뽑히기 쉽습니다.</li><li>K개가 될 때까지 반복하고, 그 뒤는 K-평균과 같습니다.</li></ol><p>바뀌는 것은 <span class="a">초기화 단계</span>뿐이고, 여전히 <span class="a">무작위</span>입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">D7</span>K-평균의 한계 <span class="pg">p.13–16</span></h2></div>
<div class="blk"><table class="mt "><tr><th>쪽</th><th>한계</th><th>K-평균이 하는 일</th></tr><tr><td>13</td><td><span class="a">크기</span>가 다른 군집</td><td>큰 무리를 쪼개고 작은 무리를 그 조각과 합침</td></tr><tr><td>14</td><td><span class="a">밀도</span>가 다른 군집</td><td>성긴 무리는 쪼개고 촘촘한 두 무리는 합침</td></tr><tr><td>15</td><td><span class="a">국소 패턴</span>(휘어진 모양)</td><td>맞물린 초승달을 거의 직선으로 자름</td></tr><tr><td>16</td><td><span class="a">K</span> 정하기</td><td>K가 작으면 덩어리가 합쳐지고, 크면 쪼개짐</td></tr></table></div>
<div class="blk"><div class="box"><p>원인은 K-평균이 <span class="a">거리 기반</span>이라는 점입니다. 샘플을 가까운 중심에 붙이므로, 중심 주변에 둥글게 모인 덩어리가 아니면 잘 맞지 않습니다. 이 한계 때문에 계층적 군집화와 DBSCAN 같은 다른 방법이 나왔습니다.</p><p>K를 고르는 방법 1번은 엘보(WCV 합이 꺾이는 점)입니다(범위 밖).</p></div></div>
<div class="blk sh"><h2><span class="sn">D8</span>K 고르기: 실루엣 점수 <span class="pg">p.18–19</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Silhouette score</span>(실루엣 점수) = 모든 샘플의 실루엣 계수의 <span class="a">평균</span>입니다. K를 고르는 방법 2번입니다.</p><div class="fx">s = <span class="frac"><span class="num">b − a</span><span class="den">max(a, b)</span></span></div><p>뜻: a보다 b가 클수록 s가 1에 가까워집니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>기호</th><th>뜻</th><th>방향</th></tr><tr><td>a</td><td>같은 군집 다른 샘플까지의 평균 거리(응집도)</td><td><span class="a">작게</span></td></tr><tr><td>b</td><td><span class="a">가장 가까운 다른 군집</span> 샘플까지의 평균 거리</td><td><span class="a">크게</span></td></tr></table></div>
<div class="blk"><table class="mt "><tr><th>s 값</th><th>뜻</th></tr><tr><td>+1에 가까움</td><td>자기 군집 안쪽에 <span class="a">잘 묶임</span></td></tr><tr><td>0 근처</td><td>군집 <span class="a">경계</span> 근처</td></tr><tr><td>−1에 가까움</td><td><span class="a">잘못 묶였을</span> 가능성</td></tr></table></div>
<div class="blk"><div class="box"><p>k를 2, 3, 4…로 바꿔 가며 실루엣 점수를 구하고, 점수가 <span class="a">가장 높은</span> k를 고릅니다. 19쪽 그래프는 k = <span class="a">4</span>에서 가장 높습니다(약 0.69).</p></div></div>
<div class="blk sh"><h2><span class="sn">D9</span>계층적(병합) 군집화 <span class="pg">p.20, 22</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Hierarchical clustering</span>(계층적 군집화)은 K를 <span class="a">미리 정하지 않아도</span> 되는 방법입니다. 교안이 다루는 것은 상향식<span class="en">bottom-up</span> = <span class="a">Agglomerative</span>(병합) 군집화입니다.</p><p>덴드로그램을 잎(아래)에서 시작해 군집을 합쳐 가며 줄기(위)까지 쌓습니다.</p></div></div>
<div class="blk"><div class="unit">알고리즘 <span class="pg">p.22</span></div><ol class="pt"><li>각 샘플을 <span class="a">자기만의 군집</span>으로 시작합니다.</li><li><span class="a">가장 가까운 두 군집</span>을 찾아 합칩니다.</li><li>반복합니다.</li><li>모든 샘플이 <span class="a">하나의 군집</span>이 되면 끝납니다.</li></ol></div>
<div class="blk sh"><h2><span class="sn">D10</span>덴드로그램을 끊는 위치 <span class="pg">p.22–23</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Dendrogram</span>(덴드로그램)의 아래 끝(잎)은 샘플이고, 세로 높이는 합칠 때의 거리입니다. 낮은 곳에서 합쳐진 쌍일수록 비슷합니다.</p><p>어디서 끊느냐에 따라 군집 수가 달라집니다. 가로로 자른 선이 지나는 세로선 수가 군집 수입니다. 그래서 K를 미리 줄 필요가 없습니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>자르는 높이</th><th>군집 수</th></tr><tr><td>높게 (23쪽: 9)</td><td><span class="a">적음</span> (2개)</td></tr><tr><td>낮게 (23쪽: 5)</td><td><span class="a">많음</span> (3개)</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">D11</span>DBSCAN <span class="pg">p.25</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">DBSCAN</span> = Density-Based Spatial Clustering of Applications with Noise. <span class="a">밀도 기반</span> 군집화입니다. D는 Density입니다.</p><ul class="pt"><li>빽빽하게 모인 점들(고밀도 영역<span class="en">high-density regions</span>)을 하나의 군집으로 묶습니다.</li><li>밀도가 낮은 곳의 점은 <span class="a">Noise</span>(잡음, 이상치)로 둡니다. 억지로 군집에 넣지 않습니다.</li><li>"가깝다"의 기준을 "<span class="a">밀도가 높다</span>"로 잡습니다.</li></ul></div></div>
<div class="blk"><table class="mt "><tr><th>K-평균과 다른 점</th><th>영어</th></tr><tr><td>군집 수를 <span class="a">미리 정하지 않음</span></td><td>No need to pre-specify</td></tr><tr><td><span class="a">임의의 모양</span>의 군집도 찾음</td><td>arbitrary shape</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">D12</span>ε-이웃과 MinPts <span class="pg">p.26</span></h2></div>
<div class="blk"><div class="box"><div class="fx">N<sub>ε</sub>(p) = { q ∈ D | dist(p, q) ≤ ε }</div><p>뜻: <span class="a">ε-neighborhood</span>(ε-이웃)는 점 p에서 거리가 <span class="a">ε 이하</span>인 점들, 즉 반지름 ε인 원 안의 점들입니다.</p><p><span class="a">MinPts</span>: ε-이웃 안에 있어야 하는 <span class="a">최소 점 개수</span>입니다. 이 이상이면 "빽빽하다"고 봅니다.</p><p>ε 안에 들어가지 못하거나 샘플이 충분하지 않으면 군집이 끊깁니다.</p></div></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>세 방법의 기준</b>: 군집화 방법은 세 가지이고, 각각의 기준을 알아 둬야 합니다. K-평균·계층적은 <span class="a">거리</span>, DBSCAN은 <span class="a">밀도</span>입니다. <span class="pg">p.4</span></p><p><b>K-평균 순서</b>: 순서를 알아 둬야 합니다. 센트로이드는 <span class="a">랜덤</span>으로 배정되므로 처음 설정에 따라 결과가 바뀔 수 있고, 중심을 계속 업데이트하는 과정을 반복합니다. K-means++도 결국 랜덤입니다. <span class="pg">p.10–12</span></p><p><b>실루엣</b>: b는 <span class="a">키우고</span> a는 <span class="a">줄여야</span> 합니다. 점수가 높을수록 좋고, k를 바꿔 가며 구해 가장 높은 k(그래프에서 <span class="a">4</span>)를 고릅니다. <span class="pg">p.18–19</span></p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>병합 군집화의 시작</b>: 시작할 때 샘플마다 군집 <span class="a">하나</span>입니다. 전체가 하나가 되는 것은 <span class="a">마지막</span>입니다(잎 → 줄기). "처음에 모두 한 군집"은 X입니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>14쪽 한계</b>: "밀도가 높으면 한계"가 아니라, 밀도가 <span class="a">서로 다른</span><span class="en">different densities</span> 군집을 잘 못 찾는 것입니다.</p><p><b>K-means++</b>: 초기 중심을 고르게 퍼뜨리지만 <span class="a">무작위성은 남습니다</span>. "항상 같은 결과"는 X입니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>실루엣 방향</b>: a는 작게, b는 크게. 점수가 가장 <span class="a">높은</span> k를 고릅니다. −1에 가까우면 잘 묶인 것이 아니라 잘못 묶였을 가능성입니다.</p><p><b>18쪽 "(아마)"</b>: 필기의 추측이 아니라 확실합니다. 교안 제목이 "Finding the Optimal Number of Clusters 2: Silhouette Score"입니다.</p><p><b>K를 미리 정하는 방법</b>은 <span class="a">K-평균뿐</span>입니다. 계층적·DBSCAN은 정하지 않습니다.</p></div></div>
<div class="blk"><div class="unit">셀프 체크</div><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>K-평균에서 한 샘플은 두 군집에 속할 수 있다. (OX)</td><td><span class="a">X</span> — 정확히 한 군집</td></tr><tr><td>K처럼 학습 전에 사람이 정하는 값은?</td><td><span class="a">하이퍼파라미터</span></td></tr><tr><td>K-평균의 중심(centroid)은 군집 샘플의?</td><td><span class="a">평균</span></td></tr><tr><td>K-means++가 바꾸는 단계는?</td><td><span class="a">초기화</span>(처음 중심 고르기)</td></tr><tr><td>실루엣 점수가 가장 낮은 k를 고른다. (OX)</td><td><span class="a">X</span> — 가장 높은 k</td></tr><tr><td>병합 군집화는 처음에 전체가 한 군집이다. (OX)</td><td><span class="a">X</span> — 샘플마다 군집 하나</td></tr><tr><td>군집이 합쳐지는 과정의 나무 모양 그림은?</td><td><span class="a">Dendrogram</span>(덴드로그램)</td></tr><tr><td>DBSCAN의 고밀도를 정하는 두 파라미터는?</td><td><span class="a">ε</span>(eps), <span class="a">MinPts</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">E</span>결정 트리</h2><p class=lead>교안 Decision Tree · 나오는 쪽: 3, 5, 6, 7, 16, 17, 28, 29, 33</p></div>
<div class="blk"><div class="key"><ul class="pt"><li>트리는 <span class="a">루트 노드</span>(깊이 0)에서 시작해 자식 노드로 나뉘고, 자식이 없는 <span class="a">리프 노드</span>에서 예측을 냅니다.</li><li>노드를 어떻게 나눌지 정하는 기준은 3가지입니다. <span class="a">지니 · 엔트로피</span>는 분류, <span class="a">분산(MSE)</span>은 회귀에 씁니다.</li><li><span class="a">불순도</span>는 노드 안에 클래스가 섞인 정도입니다. 트리는 불순도가 <span class="a">낮은</span> 노드를 만들려고 합니다.</li><li><span class="a">엔트로피</span>는 노드의 <span class="a">불확실성</span>입니다. 한 클래스뿐이면 0입니다.</li><li>ID3는 <span class="a">정보 이득</span>(나누기 전 엔트로피 − 나눈 뒤 엔트로피)이 가장 <span class="a">큰</span> 속성으로 나눕니다.</li><li>완성된 트리에 새 데이터를 넣으면 루트부터 질문에 답하며 내려가 <span class="a">리프</span>의 클래스로 분류합니다.</li><li>회귀 트리는 <span class="a">MSE</span>를 줄이는 방향으로 나누고, 리프 값은 그 리프 샘플의 <span class="a">평균</span>입니다.</li></ul><p><b>안 나오는 것:</b> 지니·엔트로피·정보 이득 계산, 말하지 않은 쪽(4, 8–15, 18–27, 30–32, 34–35 등).</p></div></div>
<div class="blk sh"><h2><span class="sn">E1</span>결정 트리의 용어 <span class="pg">p.3</span></h2></div>
<div class="blk"><table class="mt "><tr><th>용어</th><th>뜻</th></tr><tr><td class="nm">Root node<span class="en">루트 노드</span></td><td>맨 위 노드. 깊이(Depth) <span class="a">0</span></td></tr><tr><td class="nm">Child node<span class="en">자식 노드</span></td><td>다른 노드(부모) 바로 <span class="a">아래</span>에 연결된 노드</td></tr><tr><td class="nm">Leaf node<span class="en">리프 노드</span></td><td>자식이 <span class="a">없는</span> 끝 노드. 여기서 <span class="a">예측</span>을 냄</td></tr></table></div>
<div class="blk"><table class="mt "><tr><th>깊이</th><th>붓꽃 트리의 노드</th></tr><tr><td class="nm">0</td><td>루트: 꽃잎 길이 ≤ 2.45? (150송이)</td></tr><tr><td class="nm">1</td><td>왼쪽 리프 setosa / 오른쪽 자식: 꽃잎 너비 ≤ 1.75?</td></tr><tr><td class="nm">2</td><td>리프 두 개: versicolor, virginica</td></tr></table></div>
<div class="blk"><div class="box"><p>가장 깊은 리프가 깊이 2이므로 이 트리의 깊이는 <span class="a">2</span>(0, 1, 2)입니다. 자료구조의 트리 용어와 같습니다.</p><p>왼쪽 화살표는 조건이 <span class="a">참</span><span class="en">True</span>, 오른쪽은 거짓입니다.</p><p>결정 트리는 특징 스케일링<span class="en">feature scaling</span>이 <span class="a">필요 없습니다</span>. 노드는 "특징 하나 ≤ 기준값?"만 묻기 때문입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">E2</span>좋은 분할의 기준 3가지 <span class="pg">p.5</span></h2></div>
<div class="blk"><div class="box"><p>트리는 노드마다 "어떤 특징을, 어느 기준값으로 나눌까"를 정하며 아래로 자랍니다. 그 기준이 3가지입니다.<span class="en">Good split</span></p></div></div>
<div class="blk"><table class="mt "><tr><th>기준</th><th>쓰는 곳</th></tr><tr><td class="nm">지니 다양성 지수<span class="en">Gini's diversity index</span></td><td><span class="a">분류</span></td></tr><tr><td class="nm">Entropy(엔트로피)</td><td><span class="a">분류</span></td></tr><tr><td class="nm">분산 · MSE<span class="en">Variance</span></td><td><span class="a">회귀</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">E3</span>Impurity(불순도) <span class="pg">p.6</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">불순도</span><span class="en">Impurity</span>는 노드에 들어온 샘플들의 클래스가 섞인 정도입니다.</p><p>여러 클래스가 섞일수록 불순도가 <span class="a">높고</span>, 한 클래스뿐이면 <span class="a">0</span>(순수)입니다.</p><p>트리의 목표는 불순도가 <span class="a">낮은</span> 노드를 만드는 것입니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>3클래스 노드의 비율</th><th>불순도</th></tr><tr><td>⅓ · ⅓ · ⅓</td><td><span class="a">가장 높음</span></td></tr><tr><td>80% · 10% · 10%</td><td><span class="a">더 낮음</span></td></tr><tr><td>100% · 0 · 0</td><td><span class="a">0</span> (순수)</td></tr></table></div>
<div class="blk"><div class="box"><div class="fx">G<sub>i</sub> = 1 − ∑<sub>k</sub> p<sub>i,k</sub><sup>2</sup></div><p>뜻: p<sub>i,k</sub>는 노드 i에서 클래스 k의 비율입니다. 비율을 제곱해 더한 값을 1에서 빼므로, 한 클래스뿐이면 <span class="a">0</span>이고 고르게 섞일수록 커집니다. 계산은 나오지 않습니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">E4</span>Entropy(엔트로피) <span class="pg">p.7</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">엔트로피</span>는 노드의 <span class="a">불확실성</span><span class="en">uncertainty</span>을 잽니다.</p><p>모든 클래스가 같은 비율일 때 <span class="a">최대</span>이고, 노드에 한 클래스만 있으면 <span class="a">0</span>입니다.</p><div class="fx">H<sub>i</sub> = − ∑<sub>k</sub> p<sub>i,k</sub> log(p<sub>i,k</sub>)</div><p>뜻: 클래스 비율로 불확실성을 잰 값입니다. 식은 뜻만 알면 됩니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>노드 상태</th><th>지니</th><th>엔트로피</th></tr><tr><td class="nm">한 클래스뿐</td><td><span class="a">0</span></td><td><span class="a">0</span></td></tr><tr><td class="nm">고르게 섞임</td><td><span class="a">최대</span></td><td><span class="a">최대</span></td></tr><tr><td class="nm">좋은 것</td><td>낮을수록</td><td>낮을수록</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">E5</span>ID3와 정보 이득 <span class="pg">p.16–17</span></h2></div>
<div class="blk"><div class="box"><p>ID3는 엔트로피로 <span class="a">정보 이득</span><span class="en">Information Gain</span>을 계산하고, 정보 이득이 가장 <span class="a">큰</span> 속성(특징)을 골라 나눕니다. <span class="pg">p.16</span></p><p>예제는 고객 14명, 입력 특징 4개(나이·소득·학생 여부·신용 등급), 라벨은 구매 여부입니다.</p></div></div>
<div class="blk"><div class="box"><p>정보 이득은 엔트로피가 얼마나 <span class="a">줄었는지</span>를 잽니다. <span class="pg">p.17</span></p><div class="fx">Gain(D, A) = H(D) − ∑<sub>v</sub> <span class="frac"><span class="num">|D<sub>v</sub>|</span><span class="den">|D|</span></span> H(D<sub>v</sub>)</div><p>뜻: <span class="a">나누기 전</span> 엔트로피에서, 속성 A로 <span class="a">나눈 뒤</span> 각 그룹 엔트로피를 그룹 크기 비율로 평균낸 값을 뺍니다.</p><p>나눈 뒤 그룹들이 순수해질수록 뺄 값이 작아져 정보 이득이 커집니다. 이 예제의 첫 분할 속성은 <span class="a">나이</span><span class="en">Age</span>입니다.</p></div></div>
<div class="blk"><div class="unit">낮출 것과 높일 것</div><table class="mt "><tr><th>값</th><th>방향</th></tr><tr><td class="nm">불순도 (지니 · 엔트로피)</td><td><span class="a">낮춘다 ↓</span></td></tr><tr><td class="nm">불순도 감소량</td><td><span class="a">큰 것</span>을 고른다 ↑</td></tr><tr><td class="nm">Information Gain(정보 이득)</td><td><span class="a">높인다 ↑</span></td></tr><tr><td class="nm">회귀 트리의 MSE</td><td><span class="a">낮춘다 ↓</span></td></tr></table></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>불순도는 낮추고, 감소량은 큰 것을 찾습니다(주의).</b> 정보 이득은 원래 데이터의 불확실성에서 그 속성으로 나눈 뒤의 불확실성을 빼서 구하며, <span class="a">높여야</span> 합니다. 엔트로피는 <span class="a">낮춰야</span> 합니다. <b>지니와 엔트로피 계산은 나오지 않습니다.</b></p></div></div>
<div class="blk sh"><h2><span class="sn">E6</span>완성된 트리로 새 데이터 분류 <span class="pg">p.28</span></h2></div>
<div class="blk"><div class="box"><p><b>완성된 ID3 트리</b></p><ul class="pt"><li>루트: <span class="a">나이 그룹</span>?</li><li>청소년(왼쪽) → 학생 여부? → 예: 구매 / 아니오: 비구매</li><li>청년(가운데) → 바로 리프: <span class="a">구매</span></li><li>중년(오른쪽) → <span class="a">신용 등급</span>? → 보통(Fair): 구매 / 우수(Excellent): 비구매</li></ul><p>새 샘플은 루트에서 시작해 노드의 질문에 답하며 <span class="a">리프</span>에 닿을 때까지 내려갑니다. 닿은 리프의 클래스가 예측입니다.</p></div></div>
<div class="blk"><table class="mt "><tr><th>새 고객</th><th>예측</th></tr><tr><td>청년 (나이 → 가운데 리프)</td><td><span class="a">구매</span></td></tr><tr><td>중년 · 신용 보통</td><td><span class="a">구매</span></td></tr><tr><td>중년 · 신용 우수</td><td><span class="a">비구매</span></td></tr><tr><td>청소년 · 학생 아님</td><td><span class="a">비구매</span></td></tr></table></div>
<div class="blk"><div class="box"><p>리프에 여러 클래스가 섞여 있으면 그 리프에서 가장 <span class="a">많은</span> 클래스로 예측합니다. 예: 붓꽃 트리의 리프 value = [0, 49, 5]는 class = versicolor입니다.</p></div></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>새 테스트 데이터는 이미 만든 트리를 탐색하며 분류합니다.</b> 청년이면 바로 가운데 클래스로, 중년이면 오른쪽으로 가서 신용 등급을 봅니다. 애매하면 <span class="a">다수</span> 쪽으로 결론 냅니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">E7</span>회귀 트리 <span class="pg">p.29</span></h2></div>
<div class="blk"><div class="unit">결정 트리는 <span class="a">회귀</span>도 합니다. 리프가 <span class="a">실수값</span>을 예측합니다.</div><table class="mt "><tr><th>노드 줄</th><th>뜻</th></tr><tr><td class="nm">x1 ≤ 0.197</td><td>분할 규칙 (참 → 왼쪽)</td></tr><tr><td class="nm">mse</td><td>실제값과 예측값의 차이. <span class="a">낮을수록</span> 좋음</td></tr><tr><td class="nm">samples</td><td>노드에 온 학습 샘플 수</td></tr><tr><td class="nm">value</td><td>예측값 = 노드 샘플 y값의 <span class="a">평균</span></td></tr></table></div>
<div class="blk"><div class="unit">분류 트리와 회귀 트리</div><table class="mt "><tr><th></th><th>분류 트리</th><th>회귀 트리</th></tr><tr><td class="nm">예측</td><td>클래스</td><td><span class="a">실수값</span></td></tr><tr><td class="nm">분할 기준</td><td>지니 · 엔트로피</td><td><span class="a">분산 · MSE</span></td></tr><tr><td class="nm">방향</td><td>불순도 ↓, 정보 이득 ↑</td><td>MSE <span class="a">↓</span></td></tr><tr><td class="nm">리프 출력</td><td><span class="a">다수</span> 클래스</td><td>샘플 y값의 <span class="a">평균</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">E8</span>회귀 트리 예제: 야구 선수 연봉 <span class="pg">p.33</span></h2></div>
<div class="blk"><div class="unit">회귀용 CART로 경력 연수 · 안타 수에서 연봉 예측</div><table class="mt "><tr><th>단계</th><th>나누는 방법</th></tr><tr><td class="nm">분할 1</td><td>경력 ≤ <span class="a">11년</span>? 아니오 → 리프 55M</td></tr><tr><td class="nm">분할 2</td><td>11년 이하만 안타 ≤ <span class="a">65개</span>? 예 → 25M, 아니오 → 45M</td></tr><tr><td class="nm">결과</td><td>영역 3개 = 리프 3개</td></tr></table></div>
<div class="blk"><div class="box"><p>한 번에 <span class="a">특징 하나</span>와 기준값 하나로 나눕니다. 11년 초과 쪽은 더 나누지 않았습니다.</p><p>각 영역의 예측값은 그 영역 선수 연봉의 <span class="a">평균</span><span class="en">Region Mean</span>입니다. 경계는 모두 축에 <span class="a">평행</span>한 직선이고, 평면이 직사각형 영역으로 나뉩니다.</p><p>예: 경력 5년 · 안타 40개 → 분할 1 예 → 분할 2 예 → 25M.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>루트 노드의 깊이는 1이 아니라 <span class="a">0</span>입니다.</b> 루트 → 자식 → 그 아래 순으로 0, 1, 2입니다.</p><p><b>⅓ · ⅓ · ⅓ 노드가 80 · 10 · 10 노드보다 불순도가 <span class="a">높습니다</span>.</b> 고르게 섞일수록 불순도와 엔트로피가 큽니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>"낮춘다"와 "크게"를 섞지 않습니다.</b> 불순도·엔트로피·MSE는 <span class="a">낮추고</span>, 감소량·정보 이득은 <span class="a">높입니다</span>. ID3는 정보 이득이 가장 <span class="a">큰</span> 속성을 고릅니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>회귀 트리의 리프는 다수 클래스가 아니라 샘플 값의 <span class="a">평균</span>을 예측합니다.</b> 다수 클래스로 예측하는 것은 분류 트리입니다.</p><p>필기의 "가지치며 나가는데"는 노드를 나누는 분할<span class="en">split</span>입니다. 가지치기<span class="en">pruning</span>는 트리 성장을 제한하는 것(범위 밖)으로 다른 말입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">E9</span>셀프 체크</h2></div>
<div class="blk"><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>루트 노드의 깊이는?</td><td><span class="a">0</span></td></tr><tr><td>자식이 없는 끝 노드의 이름은?</td><td><span class="a">Leaf node(리프 노드)</span></td></tr><tr><td>좋은 분할 기준 중 회귀에 쓰는 것은?</td><td><span class="a">분산(MSE)</span></td></tr><tr><td>한 클래스만 있는 노드의 엔트로피는?</td><td><span class="a">0</span></td></tr><tr><td>엔트로피는 노드의 무엇을 재는가?</td><td><span class="a">불확실성</span></td></tr><tr><td>ID3가 분할 속성을 고르는 기준은?</td><td><span class="a">정보 이득이 가장 큰 속성</span></td></tr><tr><td>정보 이득은 높이는가, 낮추는가?</td><td><span class="a">높인다</span></td></tr><tr><td>회귀 트리 리프의 value는 어떻게 정하는가?</td><td><span class="a">리프 샘플 값의 평균</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">F</span>앙상블</h2><p class=lead>교안 Ensemble Learning · 나오는 쪽: 1, 2, 3, 5, 6, 7, 10, 11, 12, 14</p></div>
<div class="blk"><div class="key"><ul class="pt"><li>Ensemble(앙상블) = 여러 모델을 <span class="a">결합</span>해 <span class="a">일반화</span> 성능이 더 좋은 모델을 만듭니다. 방법은 4가지입니다.</li><li>Voting(투표): 서로 다른 분류기의 예측을 합칩니다. 하드 = <span class="a">다수결</span>, 소프트 = <span class="a">확률 평균</span>.</li><li>Bagging(배깅): <span class="a">같은</span> 알고리즘을 <span class="a">복원 추출</span>한 서로 다른 데이터로 학습해 합칩니다 → 분산 <span class="a">↓</span>.</li><li>Random Forest(랜덤 포레스트): 결정 트리의 배깅 + 노드마다 <span class="a">특징 일부</span>만 후보로 씁니다.</li><li>OOB 샘플로 특징을 섞어 보면 어떤 특징이 <span class="a">중요</span>한지 알 수 있습니다.</li><li>Boosting(부스팅): 약한 학습기를 <span class="a">순차적</span>으로 보정해 강한 학습기로 만듭니다.</li></ul><p><b>안 나옴</b>: 페이스팅, 25쪽 스태킹, 15쪽 이후 AdaBoost·그래디언트 부스팅·XGBoost 세부, 4쪽 다수결 정확도 계산, 8·9·13쪽.</p></div></div>
<div class="blk sh"><h2><span class="sn">F1</span>앙상블 학습이란 <span class="pg">p.1</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Ensemble learning</span>(앙상블 학습)은 여러 개별 모델을 결합해 <span class="a">일반화</span><span class="en">generalization</span> 성능이 더 좋은 최적의 모델을 만드는 방법입니다.</p><p>일반화는 학습에 쓰지 않은 새 데이터에서도 잘 맞히는 것입니다(A의 과적합·일반화). 결합되는 모델 하나하나를 예측기<span class="en">predictor</span>, 분류에서는 분류기<span class="en">classifier</span>라고 합니다.</p><p>대표 방법 4가지: <span class="a">Voting</span>(투표) · <span class="a">Bagging</span>(배깅, 예: 랜덤 포레스트) · <span class="a">Boosting</span>(부스팅) · Stacking(스태킹, 안 나옴).</p></div></div>
<div class="blk sh"><h2><span class="sn">F2</span>투표 분류기 · 하드와 소프트 <span class="pg">p.2–5</span></h2></div>
<div class="blk"><div class="box"><p>Voting classifier(투표 분류기)는 <span class="a">같은</span> 학습 데이터로 <span class="a">서로 다른</span> 알고리즘의 분류기(로지스틱 회귀, SVM 등)를 각각 학습시키고, 그 예측을 투표로 합칩니다. <span class="pg">p.2</span></p><p>알고리즘이 다르면 틀리는 샘플도 달라지기 쉬워, 하드 투표만으로도 가장 좋은 분류기보다 정확도가 높은 경우가 많습니다. <span class="pg">p.3</span></p></div></div>
<div class="blk"><div class="unit">하드 투표 vs 소프트 투표 <span class="pg">p.3, 5</span></div><table class="mt "><tr><th></th><th>Hard Voting</th><th>Soft Voting</th></tr><tr><td class="nm">내는 것</td><td><span class="a">클래스</span> 하나(한 표)</td><td>클래스별 <span class="a">확률</span></td></tr><tr><td class="nm">합치는 방법</td><td><span class="a">다수결</span></td><td><span class="a">확률 평균</span>이 가장 높은 클래스</td></tr><tr><td class="nm">확신 정도</td><td>반영 안 됨</td><td>반영됨 → 더 <span class="a">정교</span><span class="en">more refined</span></td></tr></table></div>
<div class="blk"><div class="box"><p>예: 예측이 1, 1, 2, 1이면 하드 투표 결과는 <span class="a">1</span>(3표)입니다. <span class="pg">p.3</span></p><p>(보충) A일 확률이 0.9, 0.4, 0.4이면 하드는 <span class="a">B</span>(A·B·B), 소프트는 평균이 0.5보다 커서 <span class="a">A</span>입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">F3</span>Bagging(배깅) <span class="pg">p.6–7</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Bagging</span> = <span class="a">Bootstrap</span> + <span class="a">Aggregating</span>. 투표와 달리 모든 예측기에 <span class="a">같은</span> 학습 알고리즘을 쓰고, 학습 세트에서 무작위로 뽑은 <span class="a">서로 다른</span> 부분 집합으로 각각 학습시킵니다. <span class="pg">p.6</span></p></div></div>
<div class="blk"><div class="box"><ul class="pt"><li>부트스트랩 샘플링: <span class="a">복원 추출</span><span class="en">sampling with replacement</span>로 부분 집합을 여러 개 만듭니다. 뽑은 것을 다시 넣고 뽑으므로 같은 샘플이 여러 번 나오고, 한 번도 안 뽑히는 샘플도 생깁니다.</li><li>예측기는 서로 독립이라 <span class="a">병렬</span>로 학습할 수 있습니다.</li><li>Aggregating(집계): 예측을 하드 투표나 소프트 투표(회귀는 평균)로 합칩니다.</li></ul><p>비복원 추출은 Pasting(페이스팅)이며 나오지 않습니다.</p></div></div>
<div class="blk"><div class="box"><p>배깅한 앙상블은 원래 학습 세트로 학습한 예측기 하나보다 편향<span class="en">bias</span>은 <span class="a">비슷</span>하고 분산<span class="en">variance</span>은 <span class="a">더 낮습니다</span>. <span class="pg">p.7</span></p><p>분산은 학습 데이터가 조금 바뀌어도 예측이 크게 흔들리는 정도이고, 크면 과적합되기 쉽습니다.</p><p>식의 뜻: 독립인 예측 K개를 평균하면 기댓값은 그대로, 분산은 σ<sup>2</sup>에서 <span class="frac"><span class="num">σ<sup>2</sup></span><span class="den">K</span></span>로 줄어듭니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">F4</span>Random Forest <span class="pg">p.10–11</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Random Forest</span>(랜덤 포레스트)는 <span class="a">결정 트리</span>의 앙상블이고, 보통 <span class="a">배깅</span>으로 학습합니다. <span class="pg">p.10</span></p><p>여기에 <span class="a">extra randomness</span>(추가 무작위성)를 넣습니다. 노드를 나눌 때 모든 특징 중 최선을 찾지 않고, <span class="a">무작위로 고른 특징 일부</span> 중에서 최선을 찾습니다.</p><p>결과: 트리가 더 다양해지고, 편향이 조금 <span class="a">높아지는</span> 대신 분산이 <span class="a">낮아져</span> 대체로 더 좋은 모델이 됩니다.</p></div></div>
<div class="blk"><div class="unit">"랜덤"이 두 군데 <span class="pg">p.10</span></div><table class="mt "><tr><th>무작위성</th><th>무엇을</th><th>언제</th></tr><tr><td class="nm">① 데이터</td><td><span class="a">부트스트랩</span>(복원 추출)으로 트리마다 다른 데이터</td><td>트리마다</td></tr><tr><td class="nm">② 특징</td><td><span class="a">특징 일부</span>만 분할 후보로 씀</td><td><span class="a">노드</span>를 나눌 때마다</td></tr></table></div>
<div class="blk"><div class="box"><p>예측 과정 <span class="pg">p.11</span>: 테스트 샘플 하나를 모든 트리에 넣습니다. 트리마다 루트에서 조건을 따라 리프까지 내려가고, 리프 값이 그 트리의 예측입니다. 모든 예측을 <span class="a">합쳐</span> 최종 예측을 냅니다.</p><p>회귀는 평균, 분류는 투표로 합칩니다(보충).</p></div></div>
<div class="blk sh"><h2><span class="sn">F5</span>OOB와 변수 중요도 <span class="pg">p.12</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">OOB</span><span class="en">Out-of-Bag</span> 샘플은 부트스트랩 추출에서 <span class="a">한 번도 뽑히지 않은</span> 학습 샘플입니다. 그 트리는 이 샘플로 학습하지 않았으므로 <span class="a">테스트</span>에 쓸 수 있습니다.</p></div></div>
<div class="blk"><div class="box"><p>Variable importance(변수 중요도)는 <span class="a">permutation</span>(순열, 섞기)으로 봅니다.</p><ol class="pt"><li>원래 데이터로 OOB 오차를 구합니다.</li><li>특징 x<sub>i</sub>의 값만 샘플끼리 무작위로 섞은 데이터로 OOB 오차를 구합니다.</li><li>두 오차를 비교합니다. 오차가 <span class="a">크게 늘면</span> x<sub>i</sub>는 <span class="a">중요한</span> 특징입니다.</li></ol><p>이유: 한 특징만 섞으면 값은 그대로이고 정답과의 관계만 끊겨, 그 특징에 기대던 트리의 예측이 나빠집니다. 13쪽 중요도 식은 범위 밖입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">F6</span>Boosting(부스팅) — 개념만 <span class="pg">p.14</span></h2></div>
<div class="blk"><div class="box"><p><span class="a">Boosting</span>은 여러 <span class="a">weak learners</span>(약한 학습기)를 결합해 <span class="a">strong learner</span>(강한 학습기)를 만드는 앙상블 방법을 통틀어 부르는 이름입니다.</p><p>예측기를 <span class="a">순차적</span><span class="en">sequentially</span>으로 학습시키고, 각 예측기는 <span class="a">앞 예측기</span><span class="en">predecessor</span>의 잘못을 고치려고 합니다. 앞 결과가 있어야 다음을 학습하므로 병렬 학습이 <span class="a">안 됩니다</span>.</p></div></div>
<div class="blk"><div class="unit">배깅 vs 부스팅 <span class="pg">p.6–7, 14</span></div><table class="mt "><tr><th></th><th>Bagging</th><th>Boosting</th></tr><tr><td class="nm">학습 순서</td><td>서로 독립 → <span class="a">병렬</span> 가능</td><td><span class="a">순차</span> → 병렬 불가</td></tr><tr><td class="nm">데이터</td><td>복원 추출한 부분 집합</td><td>앞 예측기의 잘못을 보정</td></tr><tr><td class="nm">교안의 효과</td><td>편향 비슷, <span class="a">분산 ↓</span></td><td>약한 → <span class="a">강한</span> 학습기</td></tr></table></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>배깅을 봐야 합니다.</b> 배깅은 <span class="a">Bootstrap</span> 샘플링(복원 추출)과 <span class="a">Aggregation</span>(집계)이 합쳐진 말입니다. 복원 추출한 데이터로 학습하고 하드·소프트 투표로 합치는 전체 과정이 배깅이며, <span class="a">분산</span>을 낮춥니다.</p><p><b>부스팅은 개념만</b> 알아 두면 됩니다. 약한 학습기 여러 개를 <span class="a">순차적</span>으로 보정해 가며 강한 학습기로 만듭니다. 배깅은 병렬 처리가 가능하고 부스팅은 안 됩니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>철자는 <span class="a">Bagging</span>입니다. "begging"이 아닙니다(Bootstrap + Aggregating).</li><li>병렬 처리가 가능한 쪽은 <span class="a">배깅</span>입니다. 부스팅은 순차라서 병렬이 안 됩니다. "부스팅의 예측기는 서로 독립이다"는 X입니다.</li><li>확률을 평균하는 것은 <span class="a">소프트</span> 투표입니다. 하드 투표는 예측 클래스의 다수결입니다. 투표는 서로 다른 알고리즘, 배깅은 같은 알고리즘입니다.</li><li>랜덤 포레스트의 특징 무작위 선택은 트리마다 한 번이 아니라 <span class="a">노드를 나눌 때마다</span>입니다. 또 특징을 섞었을 때 오차가 <span class="a">커져야</span> 중요한 특징입니다.</li></ul></div></div>
<div class="blk"><div class="unit">셀프 체크</div><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>앙상블 학습이 개선하려는 성능은?</td><td><span class="a">일반화</span> 성능</td></tr><tr><td>예측 클래스의 다수결로 합치는 투표는?</td><td><span class="a">Hard Voting</span></td></tr><tr><td>소프트 투표는 하드 투표보다 정교하다. (O/X)</td><td><span class="a">O</span> — 확률을 씀</td></tr><tr><td>Bagging은 어떤 두 말을 합친 것인가?</td><td><span class="a">Bootstrap + Aggregating</span></td></tr><tr><td>배깅은 예측기 하나보다 무엇을 낮추는가?</td><td><span class="a">분산</span>(편향은 비슷)</td></tr><tr><td>랜덤 포레스트는 노드마다 모든 특징 중 최선을 찾는다. (O/X)</td><td><span class="a">X</span> — 무작위 일부 중 최선</td></tr><tr><td>부트스트랩에서 한 번도 뽑히지 않은 샘플은?</td><td><span class="a">OOB</span>(Out-of-Bag)</td></tr><tr><td>약한 학습기를 순차적으로 보정해 강한 학습기로 만드는 방법은?</td><td><span class="a">Boosting</span></td></tr></table></div>
</template>
<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const masthead=`<header class="masthead"><div class="mh-top"><span class="org">Kangwon National University CSE</span><span class="subj">인공지능</span></div><div class="mh-title"><div class="y">중간고사 10/29 (목) 15:00 · 복습용</div><h1>정리노트</h1></div><div class="scope"><span class="h">범 위</span><div class="b">10/26 복습 수업에서 교수님이 말한 쪽만 — A 기계학습 입문 · B 회귀 · C SVM · D 군집화 · E 결정 트리 · F 앙상블. 쪽 표시는 교안 하단 번호입니다. 「답 가리기」로 핵심어를 가리고 떠올려 보세요.</div></div></header>`;
const running=`<div class="running"><span>인공지능 정리노트 · 중간고사</span><span><b>인공지능</b></span></div>`;
const blocks=[...$('#src').content.children].map(e=>e.outerHTML);
function paginate(){
  const PAGE_H=1180, PAD=40+70;
  const m=document.createElement('section'); m.className='page measure';
  m.innerHTML=masthead+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  document.body.appendChild(m);
  const capFirst=PAGE_H-PAD-m.querySelector('.masthead').offsetHeight-18-4;
  m.innerHTML=running+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  const capRest=PAGE_H-PAD-m.querySelector('.running').offsetHeight-18-4;
  const els=$$('#mcol>.blk',m), hs=els.map(e=>e.offsetHeight), sh=els.map(e=>e.classList.contains('sh'));
  m.remove();
  // 제목 블록은 바로 다음 블록과 묶어서 배치
  const units=[]; for(let i=0;i<blocks.length;i++){ if(sh[i]&&i+1<blocks.length){units.push({ids:[i,i+1],h:hs[i]+hs[i+1]});i++;} else units.push({ids:[i],h:hs[i]}); }
  const pages=[]; let p=null, side='R', used=0;
  const cap=()=>pages.length===1?capFirst:capRest;
  units.forEach(u=>{
    if(!p||used+u.h>cap()&&used>0){ if(!p||side==='R'){p={L:[],R:[]};pages.push(p);side='L';} else side='R'; used=0; }
    p[side].push(...u.ids); used+=u.h;
  });
  return pages;
}
function render(){
  const P=paginate(), total=P.length;
  $('#book').innerHTML=P.map((pg,i)=>`<section class="page">${i===0?masthead:running}<div class="cols"><div class="col">${pg.L.map(k=>blocks[k]).join('')}</div><div class="col">${pg.R.map(k=>blocks[k]).join('')}</div></div><div class="pno">${i+1} / ${total}</div></section>`).join('');
}
const A4W=793.7, A4H=1122.5, PW=860;
function preparePrint(){
  document.body.classList.add('printing');
  const pages=$$('#book .page'); const base=A4W/PW, sheet=A4H/base;
  pages.forEach(p=>{p.style.zoom='';p.style.height='';});
  pages.forEach(p=>{const h=p.scrollHeight; if(h<=sheet){p.style.zoom=base;p.style.height=sheet+'px';} else {p.style.zoom=A4H/h-0.0005;p.style.height=h+'px';}});
  if(pages.length) pages[pages.length-1].classList.add('lastprint');
}
function afterPrint(){ document.body.classList.remove('printing'); $$('#book .page').forEach(p=>{p.style.zoom='';p.style.height='';p.classList.remove('lastprint');}); }
window.addEventListener('beforeprint',preparePrint); window.addEventListener('afterprint',afterPrint);
window.__memoPrint={prepare:preparePrint,done:afterPrint};
function setQuiz(on){ document.body.classList.toggle('quiz',on); $('#quizBtn').classList.toggle('on',on); $('#quizBtn').textContent=on?'답 보이기':'답 가리기'; $$('.a.show').forEach(e=>e.classList.remove('show')); }
function boot(){
  render();
  $('#quizBtn').onclick=()=>setQuiz(!document.body.classList.contains('quiz'));
  document.addEventListener('click',e=>{const a=e.target.closest('.a'); if(a&&document.body.classList.contains('quiz')) a.classList.toggle('show');});
  $('#printBtn').onclick=()=>{ const q=document.body.classList.contains('quiz'); setQuiz(false); window.print(); if(q) setQuiz(true); };
  $('#printBlank').onclick=()=>{ setQuiz(true); document.body.classList.add('printblank'); window.print(); document.body.classList.remove('printblank'); };
}
const fams=['400 16px "Nanum Myeongjo"','800 16px "Nanum Myeongjo"','400 16px "Nanum Gothic"','700 16px "Nanum Gothic"'];
const wait=document.fonts?Promise.all(fams.map(f=>document.fonts.load(f,'가A1').catch(()=>{}))):Promise.resolve();
const start=()=>Promise.race([wait,new Promise(r=>setTimeout(r,2000))]).then(boot);
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
</body>
</html>
