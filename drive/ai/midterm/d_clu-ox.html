{ type:'ox',

   q:`<p>Clustering(군집화)과 군집화 방법에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Clustering(군집화)은 정답 라벨이 없는 데이터에서 부분 집단(cluster)을 찾는 Unsupervised learning(비지도 학습) 기법이다.`,true],[`두 샘플이 "비슷하다"는 것의 뜻은 데이터와 상관없이 모든 문제에서 하나로 정해져 있다.`,false],[`K-means(K-평균)는 샘플을 미리 정한 개수의 군집으로 나눈다.`,true],[`DBSCAN은 거리 기반 방법이며, 군집 수를 미리 정해야 한다.`,false],[`Hierarchical clustering(계층적 군집화)은 Dendrogram(덴드로그램) 하나로 군집 수가 1개부터 n개까지인 결과를 한꺼번에 볼 수 있다.`,true]],
   exp:`<b>ㄱ (O)</b> 교안 2–3쪽입니다. 정답 라벨(ground truth labels)이 주어지지 않으므로 비지도 학습이고, 교수님 10/26 말씀대로 "라벨을 직접 만들어 가는 과정"입니다.<br><b>ㄴ (X)</b> 비슷하다·다르다의 뜻은 직접 정해야 하며, 다루는 데이터에 대한 분야 지식으로 정합니다(domain-specific, 교안 3쪽). 이 기준을 어떻게 잡느냐에 따라 군집화 방법이 나뉩니다.<br><b>ㄷ (O)</b> 교안 4쪽 "partition the observations into a pre-specified number of clusters"입니다. 세 방법 중 군집 수를 미리 정하는 것은 K-평균뿐입니다.<br><b>ㄹ (X)</b> DBSCAN은 <b>밀도</b> 기반입니다. 점이 빽빽한 영역을 군집으로 보고, 군집 수를 미리 정하지 <b>않습니다</b>(교안 4쪽 "without requiring the number of clusters in advance").<br><b>ㅁ (O)</b> 교안 4쪽 "allows us to view at once the clusterings obtained for each possible number of clusters, from 1 to n"입니다. 그래서 군집 수를 미리 정하지 않습니다.`,

{ type:'ox',
   lv:'기초',
   unit:"K-평균",
   pts:40,
   q:`<p>K-means(K-평균) 군집화에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`K-means(K-평균)에서 K는 학습 과정에서 데이터로부터 자동으로 정해지는 값이다.`,false],[`K-평균에서 모든 샘플은 정확히 하나의 군집에 속한다.`,true],[`Within-cluster variation(군집 내 변동)은 군집 안 샘플들이 서로 뭉쳐 있을수록 커진다.`,false],[`K-평균의 Centroid(중심)는 그 군집에서 가운데에 가장 가까운 실제 샘플 하나이다.`,false],[`K-평균은 처음 군집 배정이 무작위이므로 같은 데이터라도 실행할 때마다 결과가 달라질 수 있다.`,true],[`K-means++는 처음 중심을 고르는 초기화 단계만 바꾸며, 무작위성은 그대로 남아 있다.`,true],[`K-means++는 이미 고른 중심에서 가까운 샘플일수록 다음 중심으로 뽑힐 확률이 높다.`,false],[`K-평균은 거리 기반이므로 크기나 밀도가 서로 다른 군집을 잘 찾지 못한다.`,true]],
   exp:`<b>ㄱ (X)</b> K는 <b>Hyperparameter(하이퍼파라미터)</b>입니다. 학습 전에 사람이 미리 정해 주는 설정값입니다(교수님 10/26).<br><b>ㄴ (O)</b> 교안 6쪽 두 성질 때문입니다. 합집합이 전체 샘플이므로 적어도 하나에 속하고, 군집끼리 겹치지 않으므로(non-overlapping) 두 군집 이상에 속하지 않습니다.<br><b>ㄷ (X)</b> 뭉쳐 있을수록 <b>작아집니다</b>. 군집 안 샘플 두 개씩의 거리(제곱)를 더한 값이기 때문입니다. K-평균은 이 값의 합이 가장 작아지게 나눕니다(교안 8쪽, 교수님 10/26 "군집 안 분산을 줄인다").<br><b>ㄹ (X)</b> 중심은 실제 샘플이 아니라 그 군집 샘플들의 <b>특징별 평균 벡터</b>입니다(교안 10쪽 "the vector of the p feature means"). 그래서 이름이 K-means입니다.<br><b>ㅁ (O)</b> 교안 10쪽 1단계가 무작위 배정입니다. 교수님 10/26: "어떻게 설정됐느냐에 따라 클러스터링 결과가 바뀔 수밖에 없다."<br><b>ㅂ (O)</b> 첫 중심은 무작위로, 다음 중심은 확률로 뽑습니다(교안 12쪽). 교수님 10/26: "결국 이것도 랜덤." 초기화 뒤의 과정은 K-평균과 같습니다.<br><b>ㅅ (X)</b> 반대입니다. 가장 가까운 중심까지 거리의 제곱에 비례하는 확률로 뽑으므로 <b>멀리 있는</b> 샘플일수록 뽑히기 쉽습니다. 그래서 처음 중심이 고르게 퍼집니다(교안 12쪽).<br><b>ㅇ (O)</b> 교안 13쪽 "different sizes", 14쪽 "different densities"입니다. 각 샘플을 가까운 중심에 붙이기 때문에 생기는 한계입니다(교수님 10/26 "거리 기반이다 보니까").`,
   src:[["D", "D4", "K-평균의 정의"], ["D", "D5", "K-평균 알고리즘"], ["D", "D6", "K-평균의 한계"]] },

{ type:'ox',
   lv:'기초',

   q:`<p>K 고르기, 계층적 군집화, DBSCAN에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Silhouette coefficient(실루엣 계수)에서 a(같은 군집 안 다른 샘플까지의 평균 거리)는 작을수록, b(가장 가까운 다른 군집 샘플까지의 평균 거리)는 클수록 좋다.`,true],[`실루엣 계수가 0에 가까운 샘플은 군집 경계 근처에 있다.`,true],[`k를 바꿔 가며 Silhouette score(실루엣 점수)를 구한 뒤, 점수가 가장 높은 k를 군집 수로 고른다.`,true],[`Agglomerative(병합) 군집화는 처음에 모든 샘플을 하나의 군집으로 두고 시작한다.`,false],[`Dendrogram(덴드로그램)을 낮은 높이에서 자를수록 군집 수가 적어진다.`,false],[`DBSCAN은 어느 고밀도 영역에도 속하지 않는 점을 군집에 억지로 넣지 않고 Noise(잡음)로 표시한다.`,true],[`DBSCAN에서 ε은 한 점의 이웃 안에 있어야 하는 최소 점 개수이다.`,false]],
   exp:`<b>ㄱ (O)</b> 교수님 10/26: a는 응집도라 줄이고, b는 다른 군집과의 거리라 키웁니다. 그러면 s가 +1에 가까워집니다(교안 18쪽).<br><b>ㄴ (O)</b> 교안 18쪽 "s ≈ 0: close to a cluster boundary"입니다. +1은 자기 군집 안쪽에 잘 묶임, −1은 잘못 묶였을 가능성입니다.<br><b>ㄷ (O)</b> 교안 18–19쪽입니다. 실루엣 점수는 모든 샘플의 실루엣 계수의 평균이고, 높을수록 좋습니다. 교안 그래프에서는 k = 4가 가장 높습니다.<br><b>ㄹ (X)</b> 처음에는 <b>샘플마다 각자 하나의 군집</b>입니다. 가장 가까운 두 군집을 합쳐 가다가 <b>마지막에</b> 하나가 됩니다(교안 20쪽 "starting from the leaves … up to the trunk", 22쪽 1단계).<br><b>ㅁ (X)</b> 낮게 자를수록 아직 합쳐지지 않은 군집이 많으므로 군집 수가 <b>많아집니다</b>. 높게 자를수록 적어집니다(교안 23쪽). 어디서 끊느냐에 따라 군집 수가 달라지므로 K를 미리 줄 필요가 없습니다.<br><b>ㅂ (O)</b> 교안 25쪽 "Marks points in low-density regions as outliers (noise)"입니다. 모든 샘플이 한 군집에 속하는 K-평균과 다른 점입니다.<br><b>ㅅ (X)</b> ε은 이웃의 <b>반지름</b>(거리 ε 이하인 점들이 ε-이웃)입니다. 이웃 안 최소 점 개수는 <b>MinPts</b>입니다(교안 26쪽). 두 값이 "밀도가 높다"를 정합니다.`,
   src:[["D", "D7", "K 정하기"], ["D", "D8", "계층적 군집화"], ["D", "D9", "DBSCAN"]] }
