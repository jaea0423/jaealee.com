<div class="blk sh"><h2><span class="sn">Ⅰ</span>A. 기계학습 입문</h2><p class=lead>Introduction to ML · p.1, 4, 9, 12, 14, 24–27 · 안 나옴: 16쪽 차원 축소, 강화학습, 규칙기반 AI 교안</p></div>
<div class="blk"><div class="unit">핵심 용어 <span class="pg">p.1, 9</span></div><table class="mt "><tr><th>용어</th><th>한 줄 정의</th></tr><tr><td class="nm">AI ⊃ ML ⊃ DL</td><td><span class="a">포함 관계</span> (DL은 모두 ML, ML은 모두 AI)</td></tr><tr><td class="nm">인공지능 <span class="en">AI</span></td><td>사람이 하던 일을 기계가 하는 <span class="a">모든 자동화</span></td></tr><tr><td class="nm">기계학습 <span class="en">ML</span></td><td><span class="a">명시적 프로그래밍 없이</span> 데이터에서 패턴 학습</td></tr><tr><td class="nm">딥러닝 <span class="en">DL</span></td><td><span class="a">신경망</span> 기반, 특징 추출 + 결정을 <span class="a">end to end</span></td></tr><tr><td class="nm">생성형 AI</td><td><span class="a">딥러닝</span> 안에 포함 (수업 중 말씀)</td></tr><tr><td class="nm">지도 학습</td><td>정답 <span class="a">y가 있음</span> · {(x, y)}</td></tr><tr><td class="nm">비지도 학습</td><td><span class="a">y가 없음</span> · {x} · k-means, DBSCAN</td></tr><tr><td class="nm">분류 · 회귀</td><td><span class="a">이산</span> 라벨 · <span class="a">연속</span>(실수)값</td></tr><tr><td class="nm">손실 <span class="en">Loss</span></td><td><span class="a">실제값과 예측값의 차이</span>, 작을수록 좋음</td></tr></table></div>
<div class="blk"><div class="unit">4쪽 순서도 — 다른 칸은 하나</div><table class="mt "><tr><th>단계</th><th>전통적 방식</th><th>ML 방식</th></tr><tr><td class="nm">입력</td><td>사람이 만든 규칙</td><td>위에서 <span class="a">데이터</span> 들어옴</td></tr><tr><td class="nm">가운데 칸</td><td><span class="a">규칙 작성</span><span class="en">Write rules</span></td><td><span class="a">ML 알고리즘 학습</span><span class="en">Train</span></td></tr><tr><td class="nm">나머지</td><td>문제 연구 → 평가 → 출시 / 오류 분석</td><td>같음</td></tr></table></div>
<div class="blk"><div class="unit">기계학습의 주요 어려움 <span class="pg">p.24</span></div><table class="mt "><tr><th>어려움</th><th>뜻 · 대응</th></tr><tr><td class="nm">데이터 <span class="a">양</span> 부족</td><td>의미 있는 결과가 안 나옴</td></tr><tr><td class="nm"><span class="a">대표성</span> 없음</td><td>실제 데이터를 대표 못 함 (sampling bias)</td></tr><tr><td class="nm">낮은 <span class="a">품질</span></td><td>오류 · 이상치 · 잡음</td></tr><tr><td class="nm">관련 없는 특징</td><td><span class="a">특징 선택</span>(골라 씀) · <span class="a">특징 추출</span>(결합해 새로 만듦)</td></tr></table></div>
<div class="blk"><div class="unit">방향 · 조건 <span class="pg">p.25–26</span></div><table class="mt "><tr><th></th><th>과적합 Overfitting</th><th>과소적합 Underfitting</th></tr><tr><td class="nm">모델</td><td>너무 <span class="a">복잡</span></td><td>너무 <span class="a">단순</span></td></tr><tr><td class="nm">학습 데이터</td><td><span class="a">잘 맞음</span></td><td>못 맞춤</td></tr><tr><td class="nm">테스트 데이터</td><td><span class="a">못 맞춤</span></td><td>못 맞춤</td></tr><tr><td class="nm">해결</td><td><span class="a">규제</span> · 데이터 더 · 잡음 ↓ · 단순 모델</td><td>모델 <span class="a">깊게·크게</span> · 좋은 특징 · 제약 <span class="a">↓</span></td></tr></table></div>
<div class="blk"><div class="unit">손실 그래프 <span class="pg">p.27</span></div><table class="mt "><tr><th>손실 그래프</th><th>학습 손실</th><th>테스트 손실</th></tr><tr><td class="nm">왼쪽 (과소적합)</td><td>높음, ↓ 중</td><td>높음, ↓ 중</td></tr><tr><td class="nm">경계</td><td>낮음</td><td><span class="a">가장 낮음</span></td></tr><tr><td class="nm">오른쪽 (과적합)</td><td><span class="a">계속 ↓</span></td><td><span class="a">다시 ↑</span></td></tr></table></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li><b>1쪽 그림</b> 나올 것 같음 → 세 영역의 <span class="a">관계성</span> · <span class="a">포함 범위</span> (AI ⊃ ML ⊃ DL)</li><li><b>4쪽 그림</b> 나올 것 같음 → 전통적 = <span class="a">규칙 기반</span>, ML = 데이터 + 학습으로 <span class="a">패턴</span>을 찾음 → 분류 · 회귀</li><li>새 데이터에도 잘 맞음 = <span class="a">Generalization</span>(일반화) · 모델이 <span class="a">Robust</span>(강건)</li></ul></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>"기계학습 ⊂ 딥러닝" → <span class="a">X</span>. 딥러닝 ⊂ 기계학습 ⊂ AI</li><li>회귀는 <span class="a">지도</span> 학습(정답 y가 실수). 로지스틱 회귀는 <span class="a">분류</span>. k-means · DBSCAN은 <span class="a">비지도</span></li><li>"제약 줄이기"는 <span class="a">과소적합</span> 해결, "규제 · 데이터 더 모으기"는 <span class="a">과적합</span> 해결</li><li>학습 손실이 계속 줄어도 과적합일 수 있음 → <span class="a">테스트 손실</span>이 다시 커지는지 봄</li><li>철자: <span class="a">training</span> data (필기 "tranning"은 오기)</li></ul></div></div>
<div class="blk sh"><h2><span class="sn">Ⅱ</span>B. 회귀 Regression</h2><p class=lead>p.3–5, 7, 12–13, 23–25 · 안 나옴: 18쪽 Adjusted R², 19쪽 계수 해석, LSE 유도·계산</p></div>
<div class="blk"><div class="unit">핵심 용어 <span class="pg">p.3–7</span></div><table class="mt "><tr><th>용어</th><th>한 줄 정의</th></tr><tr><td class="nm">선형 회귀 모델</td><td>출력 Y를 입력 X들의 <span class="a">선형 결합</span>으로 나타냄</td></tr><tr><td class="nm">선형 결합</td><td>변수마다 <span class="a">계수</span>를 곱해 더한 형태</td></tr><tr><td class="nm">목적 두 가지</td><td>X–Y 관계 <span class="a">설명</span> · 미래 Y <span class="a">예측</span></td></tr><tr><td class="nm">Simple regression</td><td>독립변수 x <span class="a">1개</span> (단순 회귀)</td></tr><tr><td class="nm">Multiple regression</td><td>독립변수 x <span class="a">2개 이상</span> (다중 회귀)</td></tr><tr><td class="nm">β<sub>0</sub> · β<sub>1</sub></td><td><span class="a">절편</span><span class="en">intercept</span> · <span class="a">기울기</span><span class="en">slope</span></td></tr><tr><td class="nm">ε</td><td><span class="a">오차항</span><span class="en">error term</span></td></tr><tr><td class="nm">^ (햇)</td><td><span class="a">추정값</span> · ŷ = 예측값</td></tr></table></div>
<div class="blk"><div class="unit">회귀의 분류 <span class="pg">p.5</span> · x 3개 이상 → <span class="a">초평면</span></div><table class="mt "><tr><th></th><th>선형 Linear</th><th>비선형 Nonlinear</th></tr><tr><td class="nm">단순 (x 1개)</td><td><span class="a">직선</span></td><td><span class="a">곡선</span> (다항)</td></tr><tr><td class="nm">다중 (x 2개+)</td><td><span class="a">평면</span></td><td><span class="a">곡면</span></td></tr></table></div>
<div class="blk"><div class="unit">결정계수 <span class="en">Coefficient of Determination</span><span class="pg">p.12</span></div><div class="key"><div class="fx">R<sup>2</sup> = 1 − <span class="frac"><span class="num">SSE</span><span class="den">SST</span></span> = <span class="frac"><span class="num">SSR</span><span class="den">SST</span></span></div><p>뜻: 회귀 모델이 데이터의 <span class="a">변동</span>을 얼마나 잘 설명하는가 = 전체 변동 중 <span class="a">설명한 비율</span>. SST = SSR + SSE.</p></div></div>
<div class="blk"><div class="unit">13쪽 그래프 · ȳ = <span class="a">평균</span>, ŷ = 내 <span class="a">예측</span></div><table class="mt "><tr><th>이름</th><th>구간</th><th>뜻</th></tr><tr><td class="nm">SST</td><td>ȳ → y<sub>i</sub></td><td><span class="a">전체</span> 변동 (평균→정답)</td></tr><tr><td class="nm">SSR</td><td>ȳ → ŷ<sub>i</sub></td><td><span class="a">설명한</span> 변동 (평균→예측)</td></tr><tr><td class="nm">SSE</td><td>ŷ<sub>i</sub> → y<sub>i</sub></td><td><span class="a">틀린</span> 정도 (예측→정답)</td></tr></table></div>
<div class="blk"><div class="unit">방향 · 조건 — SSR은 <span class="a">높아져야</span></div><table class="mt "><tr><th>R² 값</th><th>뜻</th></tr><tr><td class="nm">1</td><td><span class="a">다 맞춤</span> (SSE = 0)</td></tr><tr><td class="nm">1에 가까움</td><td><span class="a">좋음</span> — SSR ↑, SSE ↓</td></tr><tr><td class="nm">0</td><td><span class="a">평균</span>으로 맞추는 수준 (ŷ = ȳ)</td></tr><tr><td class="nm">음수</td><td>평균보다 <span class="a">못함</span> (하한 −1 아님)</td></tr></table></div>
<div class="blk"><div class="unit">선형 vs 로지스틱 <span class="pg">p.23</span></div><table class="mt "><tr><th></th><th>선형 회귀</th><th>로지스틱 회귀</th></tr><tr><td class="nm">하는 일</td><td><span class="a">실수값</span> 예측</td><td><span class="a">분류</span></td></tr><tr><td class="nm">출력</td><td>연속값 (범위 없음)</td><td>Y = 1일 확률 (<span class="a">0~1</span>)</td></tr><tr><td class="nm">모양</td><td>직선</td><td><span class="a">S자</span> 곡선</td></tr></table></div>
<div class="blk"><div class="unit">Sigmoid <span class="pg">p.25</span></div><table class="mt "><tr><th>시그모이드 φ(z)</th><th>값</th></tr><tr><td class="nm">z = 0</td><td>정확히 <span class="a">0.5</span></td></tr><tr><td class="nm">z ↑</td><td><span class="a">1</span>에 가까워짐</td></tr><tr><td class="nm">z ↓</td><td><span class="a">0</span>에 가까워짐</td></tr></table></div>
<div class="blk"><div class="unit">로지스틱 회귀 순서 <span class="pg">p.24–25</span></div><ol class="pt"><li>β<sub>0</sub> + β<sub>1</sub>x 계산 (선형 회귀와 <span class="a">같은 직선</span>)</li><li><span class="a">시그모이드</span>에 넣음 → 0과 1 사이 값 = p(X) = Pr(Y = <span class="a">1</span> | X)</li><li>기준 <span class="a">0.5</span>로 가까운 쪽 0 또는 1로 분류 (규정에 따라 변경 가능, 예: 병원 <span class="a">민감도</span> ↑)</li></ol></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li>회귀의 <span class="a">정의</span>를 봐 둘 것 — Y와 X의 관계를 <span class="a">선형</span>으로</li><li>단순 · 다중 회귀 <span class="a">정의</span> 알아 둘 것 (푸는 수식은 안 냄)</li><li><span class="a">결정계수</span> 잘 봐야 함 — 식 암기보다 13쪽 <span class="a">그래프</span>로 이해</li></ul></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>"R² = −1이면 평균보다 못함" → 정확히는 R²가 <span class="a">음수</span>면 평균보다 못함. −1이 하한 <span class="a">아님</span>. R² = 0은 평균 <span class="a">수준</span>(못한 것 아님)</li><li>SSE = 예측→<span class="a">정답</span>, SSR = 평균→<span class="a">예측</span> (바꿔 쓴 문장 주의)</li><li>y = b<sub>0</sub> + b<sub>1</sub>x + b<sub>2</sub>x<sup>2</sup> → x 하나 → <span class="a">단순</span> 회귀 (항 수 아니라 <span class="a">x 개수</span>)</li><li>로지스틱 회귀 = 이름만 회귀, 실제는 <span class="a">분류</span>. 0.5 기준은 <span class="a">고정 아님</span></li><li>주관식 철자: "회기" X → <span class="a">회귀</span>(Regression)</li></ul></div></div>
<div class="blk"><div class="box"><p>(보충) SST = SSR + SSE와 0 ≤ R² ≤ 1은 학습 데이터에 최소제곱으로 맞춘 선형 회귀(절편 포함)에서 성립. 음수는 평균보다 나쁜 모델(예: 새 데이터에 적용)에서 나옴.</p></div></div>
<div class="blk sh"><h2><span class="sn">Ⅲ</span>C. SVM Support Vector Machine</h2><p class=lead>p.2, 7, 14–15, 18–19, 25, 28, 32 · 안 나옴: 8 수식, 11 스케일링, 29 커널 식, 33 SVR</p></div>

<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li>세 방법의 <span class="a">기준</span> 각각 알아 둘 것 — K-평균 · 계층 = 거리, DBSCAN = 밀도</li><li>K-평균 <span class="a">순서</span> 알아 둘 것 — 센트로이드 <span class="a">랜덤</span> 배정 → 결과가 바뀔 수 있음, 업데이트 반복. K-means++도 결국 랜덤</li><li>실루엣: b는 <span class="a">키우고</span> a는 <span class="a">줄이고</span>, 가장 높은 k 선택 (19쪽 k = 4)</li></ul></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>필기 "모든 애들이 하나의 클러스터" → 병합 군집화의 시작은 샘플마다 군집 <span class="a">하나</span>. 하나가 되는 것은 <span class="a">마지막</span></li><li>14쪽 한계 = "밀도가 높으면" X → 밀도가 <span class="a">서로 다른</span> 군집</li><li>K-means++ → "항상 같은 결과" X, <span class="a">무작위성 남음</span></li><li>18쪽 "(아마)" → 확실. 실루엣은 K를 고르는 방법 <span class="a">2번</span> (1번 = 엘보, within-cluster variation)</li><li>K를 미리 정하는 것은 <span class="a">K-평균뿐</span> · 실루엣은 가장 <span class="a">높은</span> k</li></ul></div></div>

<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li>불순도는 <span class="a">낮추고</span>, 감소량은 <span class="a">큰 것</span>을 찾음 (주의)</li><li>정보 이득은 <span class="a">높이고</span>, 엔트로피는 <span class="a">낮춤</span> · 지니 · 엔트로피 <span class="a">계산 안 나옴</span></li><li>새 테스트 데이터 → 만든 트리를 <span class="a">탐색</span> (청년 → 바로 가운데, 중년 → 오른쪽 → 신용 등급), 애매하면 <span class="a">다수</span> 쪽</li></ul></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>루트의 깊이 = 1 X → <span class="a">0</span></li><li>⅓ · ⅓ · ⅓ 노드가 80 · 10 · 10보다 불순도 <span class="a">높음</span></li><li>불순도 · 엔트로피 · MSE는 <span class="a">낮추고</span>, 감소량 · 정보 이득은 <span class="a">높임</span> (섞지 말 것)</li><li>회귀 트리 리프 = 다수 클래스 X → 샘플 값의 <span class="a">평균</span></li><li>필기 "가지치며 나가는" = 노드 <span class="a">분할</span>(split). 가지치기(pruning)와 다른 말</li></ul></div></div>

<div class="blk"><div class="unit">핵심 용어 <span class="pg">p.1–14</span></div><table class="mt "><tr><th>용어</th><th>한 줄 정의</th></tr><tr><td class="nm">Ensemble</td><td>여러 모델을 결합해 <span class="a">일반화</span> 성능 ↑</td></tr><tr><td class="nm">4가지 방법</td><td><span class="a">Voting</span> · <span class="a">Bagging</span> · <span class="a">Boosting</span> · Stacking(안 함)</td></tr><tr><td class="nm">Hard voting</td><td>예측 클래스의 <span class="a">다수결</span></td></tr><tr><td class="nm">Soft voting</td><td>클래스별 <span class="a">확률 평균</span>이 가장 높은 쪽 → 더 정교</td></tr><tr><td class="nm">Bagging</td><td><span class="a">Bootstrap</span> + <span class="a">Aggregating</span></td></tr><tr><td class="nm">Bootstrap</td><td><span class="a">복원 추출</span>로 부분 집합 여러 개</td></tr><tr><td class="nm">Random Forest</td><td><span class="a">결정 트리</span>의 배깅 + 특징 일부만 후보</td></tr><tr><td class="nm">OOB</td><td>복원 추출에서 <span class="a">한 번도 안 뽑힌</span> 샘플 → 테스트용</td></tr><tr><td class="nm">Boosting</td><td><span class="a">weak learner</span>를 <span class="a">순차</span> 보정 → <span class="a">strong learner</span></td></tr></table></div>
<div class="blk"><div class="unit">투표 vs 배깅 <span class="pg">p.2, 6</span></div><table class="mt "><tr><th></th><th>Voting</th><th>Bagging</th></tr><tr><td class="nm">알고리즘</td><td><span class="a">서로 다름</span></td><td><span class="a">같음</span></td></tr><tr><td class="nm">학습 데이터</td><td><span class="a">같음</span></td><td>복원 추출한 <span class="a">서로 다른</span> 부분 집합</td></tr></table></div>
<div class="blk"><div class="unit">배깅 vs 부스팅 <span class="pg">p.7, 14</span></div><table class="mt "><tr><th></th><th>Bagging</th><th>Boosting</th></tr><tr><td class="nm">학습 순서</td><td>독립 → <span class="a">병렬</span> 가능</td><td><span class="a">순차</span> → 병렬 불가</td></tr><tr><td class="nm">효과</td><td>편향 <span class="a">비슷</span>, 분산 <span class="a">↓</span></td><td>약한 → <span class="a">강한</span> 학습기</td></tr></table></div>
<div class="blk"><div class="unit">랜덤 포레스트의 "랜덤" 두 곳 (extra randomness) <span class="pg">p.10</span></div><table class="mt "><tr><th>무작위성</th><th>무엇을 · 언제</th></tr><tr><td class="nm">① 데이터</td><td><span class="a">부트스트랩</span> — 트리마다 다른 데이터</td></tr><tr><td class="nm">② 특징</td><td><span class="a">특징 일부</span>만 후보 — <span class="a">노드</span>를 나눌 때마다</td></tr><tr><td class="nm">결과</td><td>편향 조금 <span class="a">↑</span>, 분산 <span class="a">↓</span> → 대체로 더 좋음</td></tr></table></div>
<div class="blk"><div class="unit">배깅 순서 <span class="pg">p.6</span></div><ol class="pt"><li><span class="a">복원 추출</span>로 부분 집합 여러 개 (같은 샘플 반복 · 안 뽑힌 샘플 생김)</li><li>같은 알고리즘으로 각각 학습 (<span class="a">병렬</span>)</li><li><span class="a">집계</span> — 하드 · 소프트 투표 (회귀는 평균)</li></ol></div>
<div class="blk"><div class="unit">변수 중요도 <span class="en">Variable importance</span><span class="pg">p.12</span></div><ol class="pt"><li>원래 데이터로 <span class="a">OOB 오차</span></li><li>특징 x<sub>i</sub> 값만 <span class="a">섞어서</span>(permutation) OOB 오차</li><li>오차가 <span class="a">크게 늘면</span> x<sub>i</sub>는 <span class="a">중요한</span> 특징</li></ol></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li><span class="a">배깅</span>을 봐야 함 — Bootstrap 샘플링(복원 추출) + Aggregation. 전체 과정이 배깅, <span class="a">분산</span>을 낮춤</li><li>부스팅은 <span class="a">개념만</span> — 약한 학습기를 <span class="a">순차적</span>으로 보정해 강한 학습기로</li></ul></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>"begging" X → <span class="a">Bagging</span>(Bootstrap + Aggregating)</li><li>병렬 처리 가능한 쪽 = <span class="a">배깅</span>. 부스팅은 순차 → "부스팅 예측기는 서로 독립" <span class="a">X</span></li><li>확률을 평균 = <span class="a">소프트</span> 투표 · 투표는 <span class="a">다른</span> 알고리즘, 배깅은 <span class="a">같은</span> 알고리즘</li><li>RF 특징 무작위 선택은 트리마다 한 번 X → <span class="a">노드마다</span></li><li>특징을 섞었을 때 오차가 <span class="a">커져야</span> 중요 (작아지면 X)</li></ul></div></div>

<div class="blk sh"><h2><span class="sn">Ⅷ</span>시험 직전 30초 체크</h2><p class=lead>한 줄씩 소리 내어 확인</p></div>
<div class="blk"><ul class="pt"><li><b>A</b> AI ⊃ ML ⊃ <span class="a">DL</span> · 전통 = <span class="a">규칙 작성</span>, ML = <span class="a">알고리즘 학습</span> · y 있음 = <span class="a">지도</span></li><li><b>A</b> 복잡 → <span class="a">과적합</span>(테스트 손실 <span class="a">다시 ↑</span>) · 단순 → <span class="a">과소적합</span>(깊게·크게)</li><li><b>B</b> x 1개 = <span class="a">단순</span>, 2개+ = <span class="a">다중</span> · R² = 1 − <span class="frac"><span class="num">SSE</span><span class="den">SST</span></span>, <span class="a">1</span>에 가까울수록 좋음, 음수 = 평균보다 <span class="a">못함</span></li><li><b>B</b> SSR = 평균→<span class="a">예측</span> (높아져야) · 로지스틱 = <span class="a">시그모이드</span> + <span class="a">0.5</span> 기준 → 분류</li><li><b>C</b> 작은 C = 마진 <span class="a">넓음</span> · <span class="a">과소적합</span> · 고편향 / 큰 C = 마진 <span class="a">좁음</span> · <span class="a">과적합</span></li><li><b>C</b> 마진 = <span class="a">가장 가까운</span> 거리 · 2D → <span class="a">3D</span>로 선형 분리 · OvR · OvO</li><li><b>D</b> K-평균 · 계층 = <span class="a">거리</span>, DBSCAN = <span class="a">밀도</span> · 순서: 랜덤 → <span class="a">평균</span> 중심 → 재배정 → 반복</li><li><b>D</b> 실루엣 a <span class="a">↓</span> b <span class="a">↑</span>, 가장 높은 k(<span class="a">4</span>) · 병합은 샘플마다 <span class="a">군집 하나</span>로 시작</li><li><b>E</b> 루트 깊이 <span class="a">0</span> · 불순도 <span class="a">↓</span>, 감소량 · 정보 이득 <span class="a">↑</span> · 회귀 리프 = <span class="a">평균</span></li><li><b>F</b> Bagging = <span class="a">Bootstrap</span> + Aggregating, 분산 <span class="a">↓</span>, <span class="a">병렬</span> · 부스팅 = <span class="a">순차</span></li><li><b>F</b> RF = 데이터 + <span class="a">특징</span> 무작위 · OOB 섞어서 오차 <span class="a">↑</span> = 중요</li></ul></div>
</template>
<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const masthead=`<header class="masthead"><div class="mh-top"><span class="org">Kangwon National University CSE</span><span class="subj">인공지능</span></div><div class="mh-title"><div class="y">중간고사 10/29 (목) 15:00 · 시험 직전</div><h1>암기노트</h1></div><div class="scope"><span class="h">범 위</span><div class="b">10/26 복습 수업에서 교수님이 말한 쪽만 — A 기계학습 입문 · B 회귀 · C SVM · D 군집화 · E 결정 트리 · F 앙상블 (식·계산은 안 나옴). 「답 가리기」·「빈칸 연습지 인쇄」로 연습하세요.</div></div></header>`;
const running=`<div class="running"><span>인공지능 암기노트 · 중간고사</span><span><b>인공지능</b></span></div>`;
const blocks=[...$('#src').content.children].map(e=>e.outerHTML);
function paginate(){
  const PAGE_H=1180, PAD=40+70;
  const m=document.createElement('section'); m.className='page measure';
  m.innerHTML=masthead+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  document.body.appendChild(m);
  const capFirst=PAGE_H-PAD-m.querySelector('.masthead').offsetHeight-18-4;
  m.innerHTML=running+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  const capRest=PAGE_H-PAD-m.querySelector('.running').offsetHeight-18-4;
  const els=$$('#mcol>.blk',m), hs=els.map(e=>e.offsetHeight), sh=els.map(e=>e.classList.contains('sh'));
  m.remove();
  // 제목 블록은 바로 다음 블록과 묶어서 배치
  const units=[]; for(let i=0;i<blocks.length;i++){ if(sh[i]&&i+1<blocks.length){units.push({ids:[i,i+1],h:hs[i]+hs[i+1]});i++;} else units.push({ids:[i],h:hs[i]}); }
  const pages=[]; let p=null, side='R', used=0;
  const cap=()=>pages.length===1?capFirst:capRest;
  units.forEach(u=>{
    if(!p||used+u.h>cap()&&used>0){ if(!p||side==='R'){p={L:[],R:[]};pages.push(p);side='L';} else side='R'; used=0; }
    p[side].push(...u.ids); used+=u.h;
  });
  return pages;
}
function render(){
  const P=paginate(), total=P.length;
  $('#book').innerHTML=P.map((pg,i)=>`<section class="page">${i===0?masthead:running}<div class="cols"><div class="col">${pg.L.map(k=>blocks[k]).join('')}</div><div class="col">${pg.R.map(k=>blocks[k]).join('')}</div></div><div class="pno">${i+1} / ${total}</div></section>`).join('');
}
const A4W=793.7, A4H=1122.5, PW=860;
function preparePrint(){
  document.body.classList.add('printing');
  const pages=$$('#book .page'); const base=A4W/PW, sheet=A4H/base;
  pages.forEach(p=>{p.style.zoom='';p.style.height='';});
  pages.forEach(p=>{const h=p.scrollHeight; if(h<=sheet){p.style.zoom=base;p.style.height=sheet+'px';} else {p.style.zoom=A4H/h-0.0005;p.style.height=h+'px';}});
  if(pages.length) pages[pages.length-1].classList.add('lastprint');
}
function afterPrint(){ document.body.classList.remove('printing'); $$('#book .page').forEach(p=>{p.style.zoom='';p.style.height='';p.classList.remove('lastprint');}); }
window.addEventListener('beforeprint',preparePrint); window.addEventListener('afterprint',afterPrint);
window.__memoPrint={prepare:preparePrint,done:afterPrint};
function setQuiz(on){ document.body.classList.toggle('quiz',on); $('#quizBtn').classList.toggle('on',on); $('#quizBtn').textContent=on?'답 보이기':'답 가리기'; $$('.a.show').forEach(e=>e.classList.remove('show')); }
function boot(){
  render();
  $('#quizBtn').onclick=()=>setQuiz(!document.body.classList.contains('quiz'));
  document.addEventListener('click',e=>{const a=e.target.closest('.a'); if(a&&document.body.classList.contains('quiz')) a.classList.toggle('show');});
  $('#printBtn').onclick=()=>{ const q=document.body.classList.contains('quiz'); setQuiz(false); window.print(); if(q) setQuiz(true); };
  $('#printBlank').onclick=()=>{ setQuiz(true); document.body.classList.add('printblank'); window.print(); document.body.classList.remove('printblank'); };
}
const fams=['400 16px "Nanum Myeongjo"','800 16px "Nanum Myeongjo"','400 16px "Nanum Gothic"','700 16px "Nanum Gothic"'];
const wait=document.fonts?Promise.all(fams.map(f=>document.fonts.load(f,'가A1').catch(()=>{}))):Promise.resolve();
const start=()=>Promise.race([wait,new Promise(r=>setTimeout(r,2000))]).then(boot);
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
</body>
</html>
