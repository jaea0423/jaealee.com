{ type:'ox',
   lv:'기초',
   unit:"앙상블 · 투표",
   pts:30,
   q:`<p>Ensemble learning(앙상블 학습)과 Voting(투표)에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Ensemble learning(앙상블 학습)은 여러 개별 모델을 결합해 generalization(일반화) 성능이 더 좋은 모델을 만드는 방법이다.`,true],[`대표적인 앙상블 방법 네 가지는 Voting(투표), Bagging(배깅), Boosting(부스팅), Stacking(스태킹)이다.`,true],[`Voting classifier(투표 분류기)는 같은 알고리즘의 분류기들을 서로 다른 데이터로 학습시켜 만든다.`,false],[`Hard voting(하드 투표)은 각 분류기가 예측한 클래스를 모아 가장 많은 표를 받은 클래스를 최종 예측으로 낸다.`,true],[`Soft voting(소프트 투표)은 각 분류기의 클래스별 예측 확률 가운데 가장 큰 값 하나를 골라 그 클래스를 최종 예측으로 낸다.`,false],[`Soft voting은 각 분류기의 확률 출력을 이용하므로 Hard voting보다 더 정교한(more refined) 방법이다.`,true]],
   exp:`<b>ㄱ (O)</b> 교안 1쪽 정의입니다. 일반화는 학습에 쓰지 않은 새 데이터에서도 잘 맞히는 것입니다.<br><b>ㄴ (O)</b> 교안 1쪽 목록입니다. 교수님 10/26: 방식이 4가지이고 스태킹은 다루지 않습니다.<br><b>ㄷ (X)</b> 반대입니다. 투표 분류기는 <b>같은 학습 데이터</b>로 <b>서로 다른 알고리즘</b>(로지스틱 회귀, SVM, 랜덤 포레스트 등)의 분류기를 학습시킵니다(교안 2쪽). 같은 알고리즘에 서로 다른 데이터를 주는 것은 배깅입니다.<br><b>ㄹ (O)</b> 교안 3쪽 정의입니다. 교수님 10/26: 모델별로 클래스를 예측하고 그중 다수결로 뽑습니다.<br><b>ㅁ (X)</b> 최댓값 하나가 아니라 클래스별 확률을 <b>평균</b>하고, 평균 확률이 가장 높은 클래스를 고릅니다(교안 5쪽, 교수님 10/26 "확률값의 평균").<br><b>ㅂ (O)</b> 교안 5쪽입니다. 하드 투표는 51% 확신과 99% 확신을 똑같이 한 표로 세지만, 소프트 투표는 확신의 정도가 평균에 반영됩니다.`,
   src:[["F", "F2", "앙상블 학습이란"], ["F", "F3", "투표 분류기 · 하드 투표"], ["F", "F4", "소프트 투표"]] },

{ type:'ox',
   lv:'기초',
   unit:"Bagging(배깅)",
   pts:30,
   q:`<p>Bagging(배깅)에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Bagging(배깅)은 모든 예측기에 같은 학습 알고리즘을 쓰고, 학습 세트에서 무작위로 뽑은 서로 다른 부분 집합으로 각각 학습시킨다.`,true],[`Bagging은 Boost와 Aggregating을 합친 말이다.`,false],[`Bagging의 bootstrap sampling(부트스트랩 샘플링)은 sampling without replacement(비복원 추출)이다.`,false],[`복원 추출로 만든 부분 집합에는 같은 샘플이 여러 번 들어갈 수 있다.`,true],[`Bagging 앙상블은 원래 학습 세트로 학습한 예측기 하나와 비교해 bias(편향)는 크게 낮고 variance(분산)는 비슷하다.`,false],[`Bagging의 예측기들은 서로 독립으로 학습되므로 병렬로 학습할 수 있다.`,true]],
   exp:`<b>ㄱ (O)</b> 교안 6쪽 정의입니다. 알고리즘은 같고 데이터가 다르다는 점이 투표 분류기와 다릅니다.<br><b>ㄴ (X)</b> Bagging = <b>Bootstrap</b>(부트스트랩, 복원 추출) + <b>Agg</b>regat<b>ing</b>(집계)입니다(교수님 10/26). Boost는 부스팅으로 다른 방법입니다. 철자도 begging이 아니라 Bagging입니다.<br><b>ㄷ (X)</b> Bagging은 sampling <b>with</b> replacement(복원 추출)입니다(교안 6쪽). 비복원 추출은 Pasting(페이스팅)이고 시험 범위가 아닙니다.<br><b>ㄹ (O)</b> 뽑은 샘플을 다시 넣고 뽑으므로 중복이 생기고, 반대로 한 번도 뽑히지 않는 샘플도 생깁니다. 이 뽑히지 않은 샘플이 OOB입니다.<br><b>ㅁ (X)</b> 반대입니다. 편향은 <b>비슷하고</b> 분산이 <b>더 낮습니다</b>(교안 7쪽). 교수님 10/26: 배깅은 분산을 낮추는 효과가 있습니다. 독립인 예측 K개를 평균하면 기댓값은 그대로이고 분산만 줄어들기 때문입니다.<br><b>ㅂ (O)</b> 각 예측기는 자기 부분 집합만으로 학습하고 다른 예측기의 결과가 필요 없으므로 동시에 학습할 수 있습니다. 교수님 10/26: 병렬 처리가 가능한 쪽은 배깅입니다.`,
   src:[["F", "F5", "배깅"], ["F", "F6", "배깅은 분산을 낮춘다"]] },

{ type:'ox',
   lv:'기초',
   unit:"Random Forest · OOB",
   pts:25,
   q:`<p>Random Forest(랜덤 포레스트)와 변수 중요도에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Random Forest(랜덤 포레스트)는 decision tree(결정 트리)의 앙상블이며, 보통 Bagging으로 학습한다.`,true],[`Random Forest는 노드를 나눌 때 모든 특징 중에서 가장 좋은 특징을 찾는다.`,false],[`Random Forest의 extra randomness(추가 무작위성)는 트리를 더 다양하게 만들어, 편향이 조금 높아지는 대신 분산을 낮춘다.`,true],[`Random Forest는 테스트 샘플을 모든 트리에 넣고, 트리별 예측을 합쳐(회귀이면 평균) 최종 예측을 낸다.`,true],[`OOB 데이터에서 특징 하나의 값을 섞었을(permute) 때 예측 오차가 거의 변하지 않으면 그 특징은 중요한 특징이다.`,false]],
   exp:`<b>ㄱ (O)</b> 교안 10쪽 정의입니다(가끔 pasting). 그래서 트리마다 부트스트랩으로 뽑은 서로 다른 데이터를 씁니다.<br><b>ㄴ (X)</b> 모든 특징이 아니라 <b>무작위로 고른 특징 일부(random subset of features)</b> 중에서 가장 좋은 특징을 찾습니다(교안 10쪽 extra randomness). 모든 특징을 비교하는 것은 일반 결정 트리입니다.<br><b>ㄷ (O)</b> 교안 10쪽 "trades a higher bias for a lower variance"입니다. 각 트리가 최선의 특징을 못 쓸 때가 있어 편향은 조금 올라가지만, 트리가 다양해져 분산이 더 낮아집니다.<br><b>ㄹ (O)</b> 교안 11쪽 예측 과정입니다. 트리마다 루트에서 리프까지 내려가 리프 값이 그 트리의 예측이 되고, 이를 모두 합칩니다. 분류이면 투표로 합칩니다.<br><b>ㅁ (X)</b> 오차가 <b>크게 늘어날 때</b> 중요한 특징입니다. 섞으면 그 특징과 정답의 관계가 끊기는데, 오차가 그대로라면 모델이 그 특징에 거의 기대지 않았다는 뜻입니다(교안 12쪽, 교수님 10/26).`,
   src:[["F", "F7", "랜덤 포레스트"], ["F", "F8", "OOB 순열 변수 중요도"]] },

{ type:'ox',
   lv:'기초',
   unit:"Boosting(부스팅)",
   pts:15,
   q:`<p>Boosting(부스팅)에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Boosting(부스팅)은 여러 weak learner(약한 학습기)를 결합해 strong learner(강한 학습기)를 만드는 앙상블 방법을 통틀어 부르는 이름이다.`,true],[`Boosting은 예측기들을 서로 독립으로 학습하므로 병렬 처리가 가능하다.`,false],[`대부분의 Boosting은 예측기를 sequentially(순차적으로) 학습시키며, 각 예측기는 바로 앞 예측기의 잘못을 고치려 한다.`,true]],
   exp:`<b>ㄱ (O)</b> 교안 14쪽 정의입니다. 교수님 10/26: 부스팅은 개념만 알아 두면 됩니다.<br><b>ㄴ (X)</b> 병렬 처리가 가능한 것은 <b>배깅</b>입니다. 부스팅은 앞 예측기의 결과를 보고 다음 예측기를 학습하는 순차 방식이라 병렬 처리가 안 됩니다(교수님 10/26).<br><b>ㄷ (O)</b> 교안 14쪽 "train predictors sequentially, each trying to correct its predecessor"입니다.`,
   src:[["F", "F9", "부스팅"]] }
];
