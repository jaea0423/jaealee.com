{ type:'ox',
   lv:'기초',
   unit:"AI · ML · DL, 전통적 방식 vs ML",
   pts:35,
   q:`<p>인공지능·기계학습·딥러닝의 관계와 두 작업 방식에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Deep Learning(딥러닝)은 Machine Learning(기계학습)에 포함되고, 기계학습은 Artificial Intelligence(인공지능)에 포함된다.`,true],[`모든 인공지능 시스템은 기계학습 시스템이다.`,false],[`Machine Learning은 규칙을 명시적으로 프로그래밍하지 않아도 데이터에서 의사결정용 패턴을 학습하는 것이다.`,true],[`Deep Learning은 사람이 미리 뽑아 준 특징을 입력받아 의사결정만 수행하는 모델이다.`,false],[`Traditional approach(전통적 방식)에서는 데이터로 알고리즘을 학습시켜 규칙을 얻는다.`,false],[`전통적 방식과 ML 방식은 모두, 평가 결과가 나쁘면 오류를 분석(Analyze errors)하고 문제 연구 단계로 되돌아간다.`,true],[`ML 방식에서 학습은 데이터에서 패턴을 찾아내는 과정이며, 찾은 패턴으로 분류나 회귀 같은 작업(task)을 수행한다.`,true]],
   exp:`<b>ㄱ (O)</b> AI ⊃ ML ⊃ DL입니다. 원이 다른 원 안에 완전히 들어 있으므로 딥러닝은 모두 기계학습이고, 기계학습은 모두 인공지능입니다(교안 1쪽, 교수님 10/26 "관계성·포함 범위").<br><b>ㄴ (X)</b> 포함 관계는 거꾸로 성립하지 않습니다. 인공지능은 사람이 하던 일을 기계가 수행하는 <b>모든 자동화</b>이므로, 사람이 규칙을 직접 적은 시스템도 인공지능이지만 기계학습은 아닙니다(교안 1쪽).<br><b>ㄷ (O)</b> 교안 1쪽 정의 "learn patterns for decision-making from data without being explicitly programmed with rules"입니다.<br><b>ㄹ (X)</b> 딥러닝은 <b>신경망</b> 기반 모델로, 비정형 데이터에서 <b>특징 추출과 의사결정을 모두</b> end to end로 수행합니다(교안 1쪽).<br><b>ㅁ (X)</b> 전통적 방식은 <b>사람이 규칙을 작성</b>(Write rules)합니다. 데이터로 알고리즘을 학습(Train ML algorithm)하는 것은 ML 방식입니다(교안 4쪽, 교수님 10/26 "전통적 방식은 규칙 기반").<br><b>ㅂ (O)</b> 두 순서도는 가운데 칸(규칙 작성 ↔ 알고리즘 학습)만 다르고, 문제 연구 → 평가 → 출시 또는 오류 분석 후 되돌아가는 흐름은 같습니다(교안 4쪽).<br><b>ㅅ (O)</b> 교수님 10/26: "데이터를 주고 학습을 시킨다. 학습이 곧 패턴을 찾아내는 것이고, 그 패턴으로 분류를 할지 회귀를 할지 원하는 작업을 한다."`,
   src:[["A", "A2", "AI ⊃ 기계학습 ⊃ 딥러닝"], ["A", "A3", "전통적 방식 vs 기계학습 방식"]] },

{ type:'ox',
   lv:'기초',
   unit:"학습 유형 · 알고리즘 · 군집화",
   pts:30,
   q:`<p>학습 유형과 지도·비지도 학습에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Supervised Learning(지도 학습)에서는 관측값 x와 함께 목표 출력 y가 주어진다.`,true],[`Classification(분류)은 continuous number(연속적인 수)를, Regression(회귀)은 discrete label(이산 라벨)을 예측한다.`,false],[`Unsupervised Learning(비지도 학습)의 학습 데이터에는 목표 출력 y 없이 관측값 x만 있다.`,true],[`Regression(회귀)은 정답 y가 실수값이므로 비지도 학습에 속한다.`,false],[`Logistic regression(로지스틱 회귀)은 지도 학습 알고리즘에 속한다.`,true],[`Clustering(군집화)은 샘플마다 붙은 라벨을 보고 같은 라벨끼리 묶는 방법이다.`,false]],
   exp:`<b>ㄱ (O)</b> 교안 9쪽 "target outputs {y<sup>t</sup>} are provided along with the observations" → {(x<sup>t</sup>, y<sup>t</sup>)}입니다.<br><b>ㄴ (X)</b> 거꾸로입니다. 분류 = <b>이산 라벨</b>(0, 1 등), 회귀 = <b>연속적인 수</b>(실수값)입니다(교안 9쪽).<br><b>ㄷ (O)</b> 교안 9쪽 "no target outputs are provided ⇒ {x<sup>t</sup>}"입니다. 교수님 10/26: "지도가 없는, y가 없는 학습".<br><b>ㄹ (X)</b> 회귀는 정답 y(실수값)가 <b>주어지는</b> 학습이므로 <b>지도 학습</b>입니다. 비지도는 y 자체가 없는 경우입니다(교안 9쪽).<br><b>ㅁ (O)</b> 교안 12쪽 지도 학습 알고리즘 목록에 있습니다. 이름은 회귀지만 분류에 씁니다(B 회귀).<br><b>ㅂ (X)</b> 군집화는 비지도 학습이라 <b>라벨이 없습니다</b>. 특징 공간에서의 위치(거리)로 서로 비슷한 것끼리 묶습니다(교안 14쪽).`,
   src:[["A", "A4", "학습 유형"], ["A", "A5", "지도 학습 알고리즘 · 군집화"]] },

{ type:'ox',
   lv:'기초',
   unit:"어려움 · 과적합 · 과소적합 · 손실",
   pts:35,
   q:`<p>기계학습의 어려움과 과적합·과소적합에 대한 설명이다. 각 문장이 맞으면 O, 틀리면 X 를 고르시오.</p>`,
   items:[[`Poor quality data(품질이 낮은 데이터)는 데이터에 오류, 이상치, 잡음이 많은 것을 말한다.`,true],[`학습 데이터의 양만 충분하면, 그 데이터가 실제로 예측할 데이터를 잘 대표하지 못해도 학습에 문제가 없다.`,false],[`Overfitting(과적합)은 모델이 학습 데이터의 양과 잡음에 비해 너무 복잡할 때 일어난다.`,true],[`새 데이터가 들어와도 잘 맞는 모델을 두고 generalization(일반화)이 잘 된다, 또는 모델이 robust(강건)하다고 표현한다.`,true],[`과적합을 줄이는 방법에는 학습 데이터를 더 모으는 것과 학습 데이터의 잡음을 줄이는 것이 있다.`,true],[`Loss(손실)는 실제값과 예측값의 차이이며, 손실이 커질수록 성능이 높아진다.`,false],[`학습 초반처럼 학습 손실과 테스트 손실이 둘 다 높고 함께 줄어드는 구간은 과적합 구간이다.`,false]],
   exp:`<b>ㄱ (O)</b> 교안 24쪽 "Data is full of errors, outliers and noise"입니다.<br><b>ㄴ (X)</b> 양 부족과 <b>대표성 없음</b>(Nonrepresentative training data)은 서로 다른 어려움입니다. 데이터가 많아도 대표성이 없으면 학습에 문제가 됩니다(교안 24쪽, 교수님 10/26).<br><b>ㄷ (O)</b> 교안 25쪽 정의 "too complex relative to the amount and noise of the training data"입니다.<br><b>ㄹ (O)</b> 교수님 10/26: 학습 데이터에 너무 맞춘 과적합과 반대로, 어떤 데이터가 들어와도 잘 맞으면 일반화가 잘 된다·강건하다고 합니다.<br><b>ㅁ (O)</b> 교안 25쪽 해결책 세 가지: 모델 단순화(적은 파라미터·속성 수 줄이기·규제), 데이터 더 모으기, 잡음 줄이기입니다.<br><b>ㅂ (X)</b> 방향이 반대입니다. 손실이 <b>줄어들수록</b> 성능이 높아지고 학습이 잘 되고 있는 것입니다(교수님 10/26, 교안 27쪽).<br><b>ㅅ (X)</b> 둘 다 높고 함께 줄어드는 구간은 아직 덜 배운 <b>과소적합</b> 구간입니다. 과적합은 학습 손실은 계속 줄지만 <b>테스트 손실이 다시 커지는</b> 구간입니다(교안 27쪽).`,
   src:[["A", "A6", "기계학습의 주요 어려움"], ["A", "A7", "과적합 Overfitting"], ["A", "A8", "과소적합 Underfitting"], ["A", "A9", "과적합 vs 과소적합 그래프"]] }
];
