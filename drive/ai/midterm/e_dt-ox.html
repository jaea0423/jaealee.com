   items:[[`Root node(루트 노드)는 트리의 맨 위 노드이며, 그 depth(깊이)는 0이다.`,true],[`Leaf node(리프 노드)는 자식 노드가 없는 끝 노드이다.`,true],[`결정 트리는 학습 전에 feature scaling(특징 스케일링)을 반드시 해야 한다.`,false],[`Gini's diversity index(지니 다양성 지수)는 노드의 impurity(불순도)를 재는 척도이다.`,true],[`분산(MSE)은 주로 분류 트리의 분할 기준으로 쓰고, 지니와 엔트로피는 주로 회귀 트리에 쓴다.`,false],[`Child node(자식 노드)는 자식이 없는 끝 노드를 말한다.`,false]],
