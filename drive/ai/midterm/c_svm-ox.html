{ type:'ox',

   items:[[`SVM은 정답 라벨이 있는 데이터로 학습하는 Supervised learning(지도학습) 모델이다.`,true],[`Kernel SVM은 Linear(선형) SVM에 속하고, Hard Margin SVM은 Nonlinear(비선형) SVM에 속한다.`,false],[`마진은 학습 샘플과 초평면 사이의 거리 가운데 가장 작은 거리이다.`,true],[`Maximal margin hyperplane(최대 마진 초평면)은 분리 초평면 가운데 학습 샘플에서 가장 가까운 것이다.`,false],[`Support vector(서포트 벡터)는 결정 경계에서 가장 멀리 떨어진 학습 샘플이다.`,false]],

{ type:'ox',

   items:[[`선형 분리가 불가능한 데이터도 더 높은 차원의 공간으로 변환하면 선형 분리가 가능해질 수 있다.`,true],[`2차원에서 직선으로 나눌 수 없던 데이터를 새 특징을 더해 3차원으로 옮긴 뒤 평면 하나로 나누었다면, 이 평면은 원래 2차원 공간에서 보아도 직선 경계이다.`,false],[`커널 함수는 inner product(내적)를 일반화한 것이다.`,true],[`One versus one(하나 vs 하나) 방식은 클래스를 두 개씩 짝지어 이진 SVM을 만든다.`,true]],
