<div class="blk sh"><h2><span class="sn">Ⅰ</span>A. 규칙기반 AI · 기계학습 입문</h2><p class=lead>4주차 2차시 · 6장 규칙기반 인공지능 + Introduction to Machine Learning p.1–21</p></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li>교안 〈표 6.4〉 머리글 "~p → q"는 오류 → <span class="a">p → q</span>가 맞음</li><li>포함 관계: AI ⊃ 기계학습 ⊃ 딥러닝 ⊃ <span class="a">생성형 AI</span> (수업에서 덧붙임)</li><li>일반화(generalization) = <span class="a">새로 들어오는 데이터</span>를 처리할 수 있게 하는 것 — 쓰는 이유 ③ 변화하는 환경</li><li>Learning의 Induction = <span class="a">추론</span>(귀납)</li><li>온라인 학습이 배치보다 좋은 이유 = <span class="a">더 빠르다</span> (학습 단계 하나가 빠르고 저렴)</li></ul></div></div>
<div class="blk"><div class="unit">논리 · 추론</div><table class="mt "><tr><th>용어</th><th>한 줄 정의</th></tr><tr><td>명제 <span class="en">Proposition</span></td><td>참·거짓이 <span class="a">명확히 구분</span>되는 문장 (거짓 문장도 명제)</td></tr><tr><td>술어 논리 <span class="en">Predicate</span></td><td>문장을 <span class="a">주어와 술어</span>로 구분, 대상 간 관계도 표현</td></tr><tr><td>귀납 <span class="en">Induction</span></td><td><span class="a">개별 사실 → 일반 결론</span></td></tr><tr><td>연역 <span class="en">Deduction</span></td><td><span class="a">전제 → 결론</span>, 예: 삼단논법</td></tr><tr><td>유비 <span class="en">Analogy</span></td><td><span class="a">유사·일치</span> → 다른 현상도 유사 (유추)</td></tr><tr><td>추론 언어</td><td><span class="a">Prolog</span></td></tr></table></div>
<div class="blk"><div class="unit">진리표 <span class="pg">표 6.4</span></div><table class="mt "><tr><th>연산</th><th>외울 것 (예외 한 줄)</th></tr><tr><td>∨ 논리합</td><td><span class="a">둘 다 F</span>일 때만 F</td></tr><tr><td>∧ 논리곱</td><td><span class="a">둘 다 T</span>일 때만 T</td></tr><tr><td>→ 조건</td><td><span class="a">p = T, q = F</span>일 때만 F</td></tr><tr><td>가정 F</td><td>결론과 관계없이 <span class="a">항상 T</span></td></tr></table></div>
<div class="blk"><div class="unit">추론 3종</div><table class="mt "><tr><th></th><th>귀납</th><th>연역</th><th>유비</th></tr><tr><td>장점</td><td><span class="a">새 지식 발견·확장</span></td><td><span class="a">논리의 일관성</span></td><td>새 영역 이해</td></tr><tr><td>약점</td><td><span class="a">필연성 적음</span></td><td><span class="a">확장성 부족</span></td><td>—</td></tr><tr><td>예</td><td>까마귀 n마리</td><td>소크라테스</td><td>양말:발 = 장갑:손 (보충)</td></tr></table></div>
<div class="blk"><div class="unit">규칙기반 시스템의 추론 규칙</div><table class="mt "><tr><th>형태</th><th>이름</th></tr><tr><td>P ∴ P ∨ Q</td><td><span class="a">Addition</span> 가산</td></tr><tr><td>P, Q ∴ P ∧ Q</td><td><span class="a">Conjunction</span> 논리곱</td></tr><tr><td>P ∨ Q, ¬P ∴ Q</td><td><span class="a">Disjunctive</span> 선언적 삼단논법</td></tr><tr><td>P → Q, Q → R ∴ P → R</td><td><span class="a">Hypothetical</span> 가언적 삼단논법</td></tr></table></div>
<div class="blk"><div class="unit">탐색 · 지식 표현</div><table class="mt "><tr><th>용어</th><th>외울 것</th></tr><tr><td>순방향 추론</td><td><span class="a">출발 → 목표</span></td></tr><tr><td>역방향 추론</td><td><span class="a">목표 → 출발</span></td></tr><tr><td>DFS</td><td><span class="a">왼쪽 끝까지</span> 내려간 뒤 되돌아옴</td></tr><tr><td>BFS</td><td><span class="a">level 0 → 1 → 2</span>, 각 level 왼쪽부터</td></tr><tr><td>무정보 탐색</td><td>사전 정보 없이 일정 순서 = <span class="a">DFS · BFS</span></td></tr><tr><td>휴리스틱 탐색</td><td>탐색 과정에서 <span class="a">경험적 지식</span> 활용</td></tr><tr><td>휴리스틱</td><td>빠르고 실용적, 최적 <span class="a">보장 안 함</span></td></tr><tr><td>최소최대 탐색</td><td>나 <span class="a">최대</span> · 상대 <span class="a">최소</span> (2인 게임)</td></tr><tr><td>전지 작업</td><td>필요 없는 경로 자르기 = <span class="a">pruning</span></td></tr><tr><td>A*</td><td>평가 함수 <span class="a">f</span>로 <span class="a">최적 경로</span></td></tr><tr><td>8-Queens</td><td>약 <span class="a">44억</span> 가지, 해답 <span class="a">여러 개</span></td></tr><tr><td>의미 네트워크</td><td>개념 간 관계를 <span class="a">링크</span>로 연결</td></tr></table></div>
<div class="blk"><div class="unit">전문가 시스템 = <span class="a">지식베이스</span> + <span class="a">추론기구</span> <span class="pg">표 6.5</span></div><table class="mt "><tr><th>이름</th><th>기능</th></tr><tr><td>MYCIN</td><td><span class="a">백혈병 진단</span> (표 6.5)</td></tr><tr><td>DENDRAL</td><td><span class="a">질량 분석</span>의 해설</td></tr><tr><td>PROSPECTOR</td><td><span class="a">광맥 탐사</span></td></tr><tr><td>AIRPLAN</td><td>항공기 이착륙 관리</td></tr><tr><td>LOGOS</td><td><span class="a">자동 번역</span></td></tr><tr><td>ASK</td><td>자연어 DB 관리</td></tr></table></div>
<div class="blk"><div class="unit">기계학습 정의 <span class="pg">ML p.1–2</span></div><table class="mt "><tr><th>정의</th><th>핵심</th></tr><tr><td>Samuel (1959)</td><td><span class="a">명시적으로 프로그래밍</span>하지 않고도 학습하는 능력</td></tr><tr><td>Mitchell (1997)</td><td>경험 <span class="a">E</span>로 작업 <span class="a">T</span>의 성능 <span class="a">P</span>가 향상되면 학습</td></tr><tr><td>딥러닝</td><td>신경망, 특징 추출 + 결정을 <span class="a">end to end</span></td></tr></table></div>
<div class="blk"><div class="unit">학습 유형</div><table class="mt "><tr><th></th><th>데이터</th><th>대표 작업</th></tr><tr><td>지도</td><td><span class="a">{(x<sup>t</sup>, y<sup>t</sup>)}</span></td><td>분류(<span class="a">이산</span> 라벨), 회귀(<span class="a">연속</span> 수)</td></tr><tr><td>비지도</td><td><span class="a">{x<sup>t</sup>}</span></td><td><span class="a">군집화 · 시각화 · 차원 축소 · 이상치 탐지</span></td></tr><tr><td>강화</td><td>정답 없음</td><td><span class="a">지연된 보상</span>, <span class="a">정책</span> 학습</td></tr></table></div>
<div class="blk"><div class="unit">배치 vs 온라인 <span class="pg">ML p.19–21</span></div><table class="mt "><tr><th></th><th>배치 학습</th><th>온라인 학습</th></tr><tr><td>점진 학습</td><td><span class="a">불가</span> (전부로 훈련)</td><td><span class="a">가능</span> (미니배치 순차)</td></tr><tr><td>비용</td><td>시간·자원 많음, 오프라인</td><td>학습 단계가 <span class="a">빠르고 저렴</span></td></tr><tr><td>운영 후</td><td><span class="a">더 학습 안 함</span></td><td>새 데이터로 계속 갱신</td></tr></table></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>"2 × 7은 홀수다" = 거짓이지만 <span class="a">명제 O</span> · "사과는 맛있다" = 명제 X</li><li>삼단논법: 교안은 "대전제 = 소크라테스는 사람이다"로 표기, 일반 정의는 대전제 = 일반 규칙(사람은 모두 죽는다) → 답안에 <b>문장 내용을 함께</b> 적기</li><li>MYCIN: 6장 표 6.5 "백혈병 진단" vs 3장 "혈액감염 치료 진단·처방" → 6장 문제면 표 6.5 기준, 서술이면 둘 다 언급</li><li>온라인 학습 "빠르다" = 학습 <span class="a">단계 하나</span>가 빠름 (총 시간 X)</li><li>생성형 AI ⊂ 딥러닝 (딥러닝 ⊂ 생성형 AI는 <span class="a">X</span>)</li></ul></div></div>
<div class="blk sh"><h2><span class="sn">Ⅱ</span>B. 회귀 — 선형 · 로지스틱</h2><p class=lead>6주차 1차시 · 지도 학습, x → 모델 → y</p></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li>LSE 해 β̂₁, β̂₀: "직접 푸는 문제는 안 나올 것 같다, <b><span class="a">이런 식으로 푼다</span></b>까지 이해"</li><li>회귀계수 해석은 <span class="a">상관관계</span>로 — <span class="a">인과관계</span>로 단정 금지</li><li>잔차를 제곱하는 이유: +와 −가 <span class="a">상쇄</span>되어 오차가 없는 것처럼 계산되는 것 방지 (절댓값·루트도 씀, 공통 = 양수)</li><li>로지스틱: p(x) = y가 <span class="a">1</span>일 확률, 1 − p(x) = y가 <span class="a">0</span>일 확률</li><li>범위: linear만 · 비선형 회귀 X · 다항 회귀는 "차수 올리면 구불구불"까지 · 경사하강법은 뒤에서</li></ul></div></div>
<div class="blk"><div class="unit">핵심 용어</div><table class="mt "><tr><th>기호·용어</th><th>뜻</th></tr><tr><td>β₀ <span class="en">Intercept</span></td><td><span class="a">절편</span> = X = 0일 때 Y</td></tr><tr><td>β₁ <span class="en">Slope</span></td><td><span class="a">기울기</span> = X 1 증가 시 Y 변화</td></tr><tr><td>ε <span class="en">Error term</span></td><td><span class="a">오차항</span> (에러텀)</td></tr><tr><td>^ (hat)</td><td><span class="a">추정값</span> (예측값)</td></tr><tr><td>잔차 e<sub>i</sub></td><td><span class="a">y<sub>i</sub> − ŷ<sub>i</sub></span> (실제 − 예측)</td></tr><tr><td>RSS</td><td>잔차 <span class="a">제곱합</span> (= SSE)</td></tr><tr><td>arg min</td><td>최소로 만드는 <span class="a">변수 값</span> (최솟값 X)</td></tr><tr><td>단순 · 다중</td><td>독립변수 <span class="a">1개</span> · <span class="a">2개 이상</span></td></tr><tr><td>모양</td><td>선 → 면 → <span class="a">초평면</span></td></tr><tr><td>Multivariable</td><td><span class="a">x</span>(독립변수)가 여러 개</td></tr><tr><td>Multivariate</td><td><span class="a">y</span>(종속변수)가 여러 개</td></tr></table></div>
<div class="blk"><div class="unit">최소제곱 추정(LSE) 유도 순서 — 킬러 <span class="pg">p.8–10</span></div><div class="key"><p><b>Step 1 오차 제곱합을 식으로</b></p><div class="fx">Σ<sub>i=1</sub><sup>n</sup> {y<sub>i</sub> − (β<sub>0</sub> + β<sub>1</sub>x<sub>i</sub>)}<sup>2</sup></div><p><b>Step 2 최소화 문제로 정의 (목적·손실·비용함수 C)</b></p><div class="fx">(β̂<sub>0</sub>, β̂<sub>1</sub>) = arg min<sub>β₀, β₁</sub> C(β<sub>0</sub>, β<sub>1</sub>)</div><p><b>Step 3 각 계수로 편미분 = 0</b></p><div class="fx"><span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>0</sub></span></span> = −2Σ(y<sub>i</sub> − β<sub>0</sub> − β<sub>1</sub>x<sub>i</sub>) = 0</div><div class="fx"><span class="frac"><span class="num">∂C</span><span class="den">∂β<sub>1</sub></span></span> = −2Σ(y<sub>i</sub> − β<sub>0</sub> − β<sub>1</sub>x<sub>i</sub>)x<sub>i</sub> = 0</div><p>순서 암기: <span class="a">오차 제곱합 → arg min → 편미분 = 0 → 연립</span></p></div></div>
<div class="blk"><div class="unit">LSE 해 — 공식 그대로 외우기</div><div class="key"><div class="fx">β̂<sub>1</sub> = <span class="frac"><span class="num">Σ(x<sub>i</sub> − x̄)(y<sub>i</sub> − ȳ)</span><span class="den">Σ(x<sub>i</sub> − x̄)<sup>2</sup></span></span></div><div class="fx">β̂<sub>0</sub> = ȳ − β̂<sub>1</sub>x̄</div><p>x̄, ȳ = <span class="a">평균</span> · 분자 = x와 y가 함께 변하는 정도, 분모 = x의 퍼짐 (보충)</p><p>β̂₀ 식의 뜻: 회귀직선은 <span class="a">평균점 (x̄, ȳ)</span>을 지남 (보충) · Step 3 첫 식 = 잔차의 합 <span class="a">0</span></p></div></div>
<div class="blk"><div class="unit">결정계수 <span class="pg">p.12–13 · 18</span></div><div class="box"><div class="fx">R<sup>2</sup> = 1 − <span class="frac"><span class="num">SSE</span><span class="den">SST</span></span> = <span class="frac"><span class="num">SSR</span><span class="den">SST</span></span> ,  SST = SSR + SSE</div><div class="fx">Adjusted R<sup>2</sup> = 1 − <span class="frac"><span class="num">SSE ÷ (n − p − 1)</span><span class="den">SST ÷ (n − 1)</span></span></div><p>n 표본 크기 · p 예측변수 개수</p></div></div>
<div class="blk"><table class="mt "><tr><th>기호</th><th>식</th><th>뜻</th></tr><tr><td>SST</td><td>Σ(y<sub>i</sub> − ȳ)<sup>2</sup></td><td><span class="a">전체</span> 변동</td></tr><tr><td>SSR</td><td>Σ(ŷ<sub>i</sub> − ȳ)<sup>2</sup></td><td>모형이 <span class="a">설명한</span> 변동</td></tr><tr><td>SSE</td><td>Σ(y<sub>i</sub> − ŷ<sub>i</sub>)<sup>2</sup></td><td><span class="a">설명 안 된</span> 변동 (= RSS)</td></tr></table></div>
<div class="blk"><div class="unit">방향 · 조건</div><table class="mt "><tr><th>조건</th><th>결과</th></tr><tr><td>쓸모없는 변수 추가 → R²</td><td><span class="a">내려가지 않음</span> (보충)</td></tr><tr><td>쓸모없는 변수 추가 → Adj R²</td><td><span class="a">내려갈 수 있음</span> (벌점)</td></tr><tr><td>R² = 1 · 0</td><td><span class="a">잘 맞음</span> · <span class="a">못 맞음</span></td></tr><tr><td>모델이 매우 나쁘면 R²</td><td><span class="a">음수</span> 가능</td></tr><tr><td>βⱼ (다중)</td><td>다른 변수 <span class="a">고정</span> 시 Xⱼ 1 증가의 효과</td></tr><tr><td>예측변수끼리 상관 ↑</td><td>계수 분산 <span class="a">커짐</span>, 해석 위험</td></tr></table></div>
<div class="blk"><div class="unit">로지스틱 회귀 <span class="pg">p.22–27</span></div><div class="box"><div class="fx">p(X) = <span class="frac"><span class="num">1</span><span class="den">1 + e<sup>−(β₀ + β₁X)</sup></span></span>  ⇔  log<span class="frac"><span class="num">p(X)</span><span class="den">1 − p(X)</span></span> = β<sub>0</sub> + β<sub>1</sub>X</div><p>왼쪽 log 식 = <span class="a">로그 오즈</span>(로짓 변환) · 출력은 항상 <span class="a">0 ~ 1</span> (S자)</p><p>계수 추정 = <span class="a">최대우도</span> · 분류: p̂(X) <span class="a">> 0.5</span> → 1, ≤ 0.5 → 0</p></div></div>
<div class="blk"><div class="unit">선형 vs 로지스틱</div><table class="mt "><tr><th></th><th>선형 회귀</th><th>로지스틱 회귀</th></tr><tr><td>y</td><td>숫자</td><td><span class="a">0 · 1</span></td></tr><tr><td>출력 범위</td><td><span class="a">제한 없음</span></td><td><span class="a">0 ~ 1</span></td></tr><tr><td>직선이 나타내는 것</td><td>출력 그 자체</td><td><span class="a">로그 오즈</span></td></tr><tr><td>계수 추정</td><td><span class="a">RSS 최소</span></td><td><span class="a">우도 최대</span></td></tr><tr><td>과제</td><td>회귀</td><td><span class="a">분류</span> (이름만 회귀)</td></tr></table></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>잔차 = <span class="a">실제 − 예측</span> (ŷ − y 아님)</li><li>R² = SSE ÷ SST 는 X → R² = <span class="a">1 − SSE ÷ SST</span></li><li>광고비 3개 → 판매량 1개 = <span class="a">Multivariable</span> (Multivariate X)</li><li>최소제곱 = RSS <span class="a">최소</span> · 최대로 하는 것은 로지스틱의 <span class="a">우도</span></li><li>0·1 분류에 선형 회귀 부적절: 확률이 0 미만·1 초과로 나올 수 있음</li><li>교안 p.5 다항식 b₂x₁² 는 오타 → b₂x² 로 읽기</li></ul></div></div>
<div class="blk sh"><h2><span class="sn">Ⅲ</span>C. SVM — 서포트 벡터 머신</h2><p class=lead>6주차 2차시 · 마진을 최대로 하는 초평면</p></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li><b>벌점 매개변수 C는 시험에 잘 나온다</b> — C 크기 ↔ 마진 폭 ↔ 적합 ↔ 편향·분산 한 묶음</li><li>식은 시험에서 형태를 안내 → 식의 <b>각 부분의 뜻</b>을 말할 수 있으면 됨</li><li>p.8 제약: y = 1이면 f(x)가 M보다 <span class="a">커야</span>, −1이면 −M보다 <span class="a">작아야</span></li><li>범위: 21–23 힌지 손실 심화 · 24–25 특징 공간 확장은 그림으로 이해 · 28–30 커널 심화 · 31–32 <b>범위 아님</b> · 33 SVR 잘 안 씀</li></ul></div></div>
<div class="blk"><div class="unit">핵심 용어 <span class="pg">p.2–19</span></div><table class="mt "><tr><th>용어</th><th>한 줄 정의</th></tr><tr><td>초평면 <span class="en">Hyperplane</span></td><td>p차원 공간의 <span class="a">(p − 1)</span>차원 평평한 부분공간</td></tr><tr><td>Margin(마진)</td><td>초평면과 <span class="a">가장 가까운</span> 학습 점까지 거리 (평균 X)</td></tr><tr><td>Support vector</td><td>초평면까지 거리가 <span class="a">마진과 같은</span> 점 — <span class="a">이 점들만</span> 경계 결정</td></tr><tr><td>하드 마진</td><td>위반 <span class="a">전혀 불허</span>, <span class="a">선형 분리 가능</span>할 때만 해</td></tr><tr><td>소프트 마진</td><td>마진·초평면 반대쪽 <span class="a">허용</span>, 슬랙 ε<sub>i</sub></td></tr><tr><td>C</td><td>마진 폭 ↔ 오류 허용 <span class="a">trade-off</span> · <span class="a">하이퍼파라미터</span></td></tr><tr><td>C 고르는 법</td><td><span class="a">교차 검증</span>, <span class="a">음수 불가</span></td></tr></table></div>
<div class="blk"><div class="unit">하드 마진 SVM 식의 뜻 <span class="pg">p.8</span></div><div class="box"><div class="fx">max<sub>β</sub> M  subject to  Σ<sub>j=1</sub><sup>p</sup> β<sub>j</sub><sup>2</sup> = 1</div><div class="fx">y<sup>(i)</sup>(β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub><sup>(i)</sup> + ⋯ + β<sub>p</sub>x<sub>p</sub><sup>(i)</sup>) ≥ M,  ∀i</div><ul class="pt"><li>max M = 마진을 <span class="a">최대로</span></li><li>y ∈ <span class="a">{−1, +1}</span> → 두 조건이 y·f(x) ≥ M 한 줄로</li><li>Σβ² = 1 = β를 <span class="a">단위벡터</span>로 고정 → y·f(x)가 실제 거리 (보충)</li><li>단점: 개별 관측값에 <span class="a">민감</span>, 과적합 가능</li></ul></div></div>
<div class="blk"><div class="unit">소프트 마진 y·f(x) ≥ M(1 − ε<sub>i</sub>) <span class="pg">p.16–17</span></div><table class="mt "><tr><th>슬랙 ε<sub>i</sub></th><th>점의 위치</th></tr><tr><td>ε = 0</td><td><span class="a">마진의 맞는 쪽</span></td></tr><tr><td>0 < ε ≤ 1</td><td><span class="a">마진 위반</span> (초평면은 맞는 쪽)</td></tr><tr><td>ε > 1</td><td><span class="a">오분류</span> (초평면 반대쪽)</td></tr></table></div>
<div class="blk"><div class="unit">★ C 방향 (교안 p.19 벌점 기준) <span class="pg">p.19</span></div><table class="mt "><tr><th>벌점 C</th><th>작은 C</th><th>큰 C</th></tr><tr><td>마진</td><td><span class="a">넓음</span></td><td><span class="a">좁음</span></td></tr><tr><td>오류</td><td>어느 정도 허용</td><td>최소화, 빡빡하게</td></tr><tr><td>적합</td><td><span class="a">과소적합</span></td><td><span class="a">과적합</span></td></tr><tr><td>편향</td><td><span class="a">높음</span></td><td><span class="a">낮음</span></td></tr><tr><td>분산</td><td><span class="a">낮음</span></td><td><span class="a">높음</span></td></tr><tr><td>서포트 벡터 수 (보충)</td><td>많음</td><td>적음</td></tr></table></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p>교안에 C 정의가 두 가지 섞여 있음.</p><ul class="pt"><li><b>벌점 C</b> (p.19 표, p.22 min ½‖β‖² + CΣε): C ↑ → 마진 <b>좁음</b>, 하드 마진 = C → ∞</li><li><b>예산 C</b> (p.16 Σε<sub>i</sub> ≤ C, p.18 "C = 0이면 최대 마진 분류기"): C ↑ → 마진 <b>넓음</b>, 하드 마진 = C = 0</li><li>시험 판단: 기본은 <span class="a">벌점 기준</span>(작은 C = 넓은 마진). 문제에 Σε ≤ C가 주어질 때만 예산 기준으로 반대 · p.18 "C = 0 → 최대 마진 분류기"는 교안 그대로 O</li></ul></div></div>
<div class="blk"><div class="unit">특징 스케일링 — SVM은 <span class="a">거리</span> 기반이라 필요 <span class="pg">p.12</span></div><table class="mt "><tr><th></th><th>표준화</th><th>최소-최대</th></tr><tr><td>식</td><td>(x − μ) ÷ σ</td><td>(x − min) ÷ (max − min)</td></tr><tr><td>결과</td><td><span class="a">평균 0, 분산 1</span></td><td><span class="a">[0, 1]</span></td></tr><tr><td>통계값</td><td colspan="2"><span class="a">학습 데이터에서만</span> 계산 → 검증·테스트에 재사용</td></tr></table></div>
<div class="blk"><div class="unit">편향-분산 트레이드오프 — Total Error U자 <span class="pg">p.20</span></div><table class="mt "><tr><th>복잡도</th><th>편향²</th><th>분산</th><th>영역</th></tr><tr><td>단순</td><td><span class="a">큼</span></td><td><span class="a">작음</span></td><td><span class="a">과소적합</span></td></tr><tr><td>복잡</td><td><span class="a">작음</span></td><td><span class="a">큼</span></td><td><span class="a">과적합</span></td></tr></table></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>p차원 초평면은 <span class="a">(p − 1)</span>차원 (2차원이면 직선)</li><li>서포트 벡터는 사람이 고르지 않음 — <span class="a">최적화 결과</span>로 정해짐</li><li>소프트 마진 서포트 벡터 = 마진 위 점 + <span class="a">마진 반대쪽</span> 점(위반·오분류)</li><li>0 < ε ≤ 1 은 오분류 <span class="a">아님</span> (마진 위반)</li><li>y = −1 점 조건은 f(x) <span class="a">≤ −M</span></li></ul></div></div>
<div class="blk sh"><h2><span class="sn">Ⅳ</span>D. 군집화 — K-평균 · 계층적 · DBSCAN</h2><p class=lead>7주차 1차시 · 비지도 학습</p></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><ul class="pt"><li>비지도 = <span class="a">x만</span> 있고 y는 없음 · 용어는 "레이블" 말고 "라벨"</li><li>K-평균·계층적 = <span class="a">거리</span> 기반, DBSCAN = <span class="a">밀도</span> 기반</li><li>K가 바뀌면 같은 번호(cluster 1)라도 <b>같은 군집이 아님</b></li><li>평균으로 centroid를 옮기므로 K-<span class="a">means</span> · K-means++는 <span class="a">1번 단계</span>만 개선</li><li>실루엣: b는 <span class="a">커지고</span> a는 <span class="a">작아져야</span> · 덴드로그램은 <span class="a">어디서 끊느냐</span>로 군집 수</li><li>연결 방식(p.24)은 외울 것 없음 · DBSCAN 이름에서 중요한 것 = Density, Noise</li></ul></div></div>
<div class="blk"><div class="unit">세 방법 비교</div><table class="mt "><tr><th></th><th>K-평균</th><th>계층적</th><th>DBSCAN</th></tr><tr><td>기준</td><td><span class="a">거리</span></td><td><span class="a">거리</span></td><td><span class="a">밀도</span></td></tr><tr><td>군집 수 미리</td><td><span class="a">정함 (K)</span></td><td>안 정함</td><td>안 정함</td></tr><tr><td>사람이 정함</td><td>K</td><td>자르는 높이</td><td><span class="a">ε, MinPts</span></td></tr><tr><td>떨어진 점</td><td>반드시 소속</td><td>반드시 소속</td><td><span class="a">잡음</span></td></tr><tr><td>모양</td><td>둥근 덩어리</td><td>연결 방식 따라</td><td><span class="a">임의 모양</span></td></tr></table></div>
<div class="blk"><div class="unit">분할의 두 성질 · K-평균 목적 <span class="pg">p.6–8</span></div><div class="box"><div class="fx">C<sub>1</sub> ∪ ⋯ ∪ C<sub>K</sub> = {1, …, n}  ·  C<sub>k</sub> ∩ C<sub>k′</sub> = ∅ (k ≠ k′)</div><p>① 모든 점은 <span class="a">적어도 하나</span>에 속함 ② 두 군집에 <span class="a">동시에 속할 수 없음</span></p><div class="fx">min<sub>C₁, …, C_K</sub> Σ<sub>k=1</sub><sup>K</sup> WCV(C<sub>k</sub>)</div><p>WCV = 군집 <span class="a">내</span> 변동 (점 쌍 거리 제곱의 합 ÷ 군집 크기) — 합이 <span class="a">최소</span>인 분할</p></div></div>
<div class="blk"><div class="unit">K-평균 알고리즘 <span class="pg">p.10</span></div><ol class="pt"><li>각 관측치에 1~K 번호를 <span class="a">무작위</span>로 배정</li><li>군집마다 중심 = 특징별 <span class="a">평균</span> 벡터 계산</li><li>각 점을 <span class="a">가장 가까운</span> 중심(유클리드)의 군집에 재배정</li><li>배정이 <span class="a">더 이상 바뀌지 않을 때</span>까지 2–3 반복</li></ol></div>
<div class="blk"><div class="unit">초기화만 바꿈 <span class="pg">p.12</span></div><table class="mt "><tr><th>K-means++</th><th>내용</th></tr><tr><td>첫 중심</td><td>데이터 점 중 <span class="a">균등</span> 무작위</td></tr><tr><td>다음 중심</td><td>가장 가까운 중심까지 <span class="a">거리의 제곱</span>에 비례하는 확률</td></tr><tr><td>효과</td><td>고르게 퍼짐, 빠른 수렴, 나쁜 국소 최솟값 ↓</td></tr></table></div>
<div class="blk"><table class="mt "><tr><th>교안 쪽</th><th>K-평균의 한계</th></tr><tr><td>p.13</td><td><span class="a">크기</span>가 다른 군집</td></tr><tr><td>p.14</td><td><span class="a">밀도</span>가 다른 군집</td></tr><tr><td>p.15</td><td><span class="a">휘어진 모양</span> (local patterns)</td></tr><tr><td>p.16</td><td><span class="a">K</span> 정하기 어려움</td></tr></table></div>

<div class="blk"><div class="unit">AdaBoost <span class="pg">p.15–19</span></div><div class="box"><div class="fx">r<sub>j</sub> = <span class="frac"><span class="num">틀린 샘플 가중치 합</span><span class="den">전체 가중치 합</span></span>    α<sub>j</sub> = η log<span class="frac"><span class="num">1 − r<sub>j</sub></span><span class="den">r<sub>j</sub></span></span></div><ol class="pt"><li>모든 가중치 <span class="a">1 ÷ m</span></li><li>예측기 학습 → 가중 오차율 r<sub>j</sub></li><li>예측기 가중치 α<sub>j</sub></li><li><span class="a">틀린</span> 샘플만 × exp(α<sub>j</sub>) → 합 1로 정규화</li><li>최종 = α <span class="a">가중 다수결</span></li></ol></div></div>
<div class="blk"><table class="mt "><tr><th>r (η = 1, ln)</th><th>α</th><th>뜻</th></tr><tr><td>0.1</td><td>2.197</td><td><span class="a">정확</span> → 발언권 큼</td></tr><tr><td>0.5</td><td><span class="a">0</span></td><td>무작위 추측</td></tr><tr><td>0.5 초과</td><td><span class="a">음수</span></td><td>무작위보다 나쁨</td></tr></table></div>
<div class="blk"><div class="unit">부스팅 두 갈래 <span class="pg">p.14 · 20–22</span></div><table class="mt "><tr><th></th><th>AdaBoost</th><th>그래디언트 부스팅</th></tr><tr><td>공통</td><td>약한 → <span class="a">강한</span> 학습기</td><td><span class="a">순차</span>, 앞의 잘못 교정</td></tr><tr><td>다음 예측기</td><td>샘플 <span class="a">가중치</span> 변경</td><td><span class="a">잔차</span>에 학습</td></tr><tr><td>결합</td><td>α 가중 다수결</td><td>예측을 <span class="a">더함</span></td></tr></table></div>
<div class="blk"><div class="box"><div class="fx">F<sub>m</sub> = F<sub>m−1</sub> + h<sub>m</sub>   (h<sub>m</sub> = 잔차 y − F<sub>m−1</sub>에 학습한 트리)</div><p>XGBoost = 규제·병렬·가지치기·결측값 처리를 더한 <span class="a">그래디언트 부스팅</span> <span class="pg">p.23–24</span></p><p>스태킹: 예측 결합 자체를 <span class="a">블렌더</span>(메타 학습기)로 학습 · 첫 층은 Subset 1, 블렌더는 첫 층이 보지 않은 <span class="a">Subset 2</span>의 예측으로 학습 <span class="pg">p.25</span></p></div></div>
<div class="blk"><div class="unit">비교표 <span class="pg">p.26</span></div><table class="mt "><tr><th>방법</th><th>장점</th><th>한계</th></tr><tr><td>투표</td><td>서로 보완, 간단</td><td><span class="a">약한 모델</span>이 끌어내림</td></tr><tr><td>배깅</td><td><span class="a">분산</span> ↓, 병렬</td><td><span class="a">편향</span> 큰 학습기엔 제한</td></tr><tr><td>부스팅</td><td>높은 정확도</td><td><span class="a">잡음·이상치</span>에 민감</td></tr><tr><td>스태킹</td><td>메타 학습기로 일반화</td><td>구조 복잡</td></tr></table></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><ul class="pt"><li>확률 평균 = <span class="a">소프트</span> 투표 (하드 X)</li><li>배깅 = <span class="a">복원</span>, 페이스팅 = <span class="a">비복원</span> (반대로 내는 문제)</li><li>RF는 편향을 <span class="a">조금 높이고</span> 분산을 낮춤</li><li>AdaBoost는 <span class="a">틀린</span> 샘플의 가중치 ↑ · r 작을수록 α <span class="a">큼</span></li><li>부스팅은 <span class="a">순차</span> — 병렬 X (XGBoost의 병렬 = 트리 하나 내부 계산, 보충)</li><li>가중치 조정 = AdaBoost, 잔차 학습 = <span class="a">그래디언트</span></li></ul></div></div>
<div class="blk sh"><h2><span class="sn">Ⅶ</span>영어 키워드 ↔ 한국어</h2><p class=lead>영어로 나와도 바로 떠오르게 — 한국어 칸을 가리고 연습</p></div>
<div class="blk"><div class="unit">A. 규칙기반 AI · ML 입문</div><table class="mt "><tr><th>English</th><th>한국어</th></tr><tr><td>Proposition<br>Predicate logic</td><td><span class="a">명제</span><br><span class="a">술어 논리</span></td></tr><tr><td>Inference<br>Induction · Deduction</td><td><span class="a">추론</span><br><span class="a">귀납 · 연역</span></td></tr><tr><td>Analogy<br>Uninformed search</td><td><span class="a">유비 (유추)</span><br><span class="a">무정보 탐색</span></td></tr><tr><td>Heuristic<br>Pruning</td><td><span class="a">휴리스틱 (경험적 판단)</span><br><span class="a">전지 작업 (가지치기)</span></td></tr><tr><td>Semantic network<br>Inference engine</td><td><span class="a">의미 네트워크</span><br><span class="a">추론기구</span></td></tr><tr><td>Generalization<br>Delayed reward · Policy</td><td><span class="a">일반화</span><br><span class="a">지연된 보상 · 정책</span></td></tr><tr><td>Out-of-core learning</td><td><span class="a">외부 메모리 학습</span></td></tr></table></div>
<div class="blk"><div class="unit">B. 회귀</div><table class="mt "><tr><th>English</th><th>한국어</th></tr><tr><td>Intercept · Slope<br>Error term</td><td><span class="a">절편 · 기울기</span><br><span class="a">오차항</span></td></tr><tr><td>Residual<br>Least squares</td><td><span class="a">잔차</span><br><span class="a">최소제곱법</span></td></tr><tr><td>Coefficient of Determination<br>Predictor · Response</td><td><span class="a">결정계수 (R²)</span><br><span class="a">예측변수 · 반응변수</span></td></tr><tr><td>Log odds<br>Maximum likelihood</td><td><span class="a">로그 오즈</span><br><span class="a">최대우도</span></td></tr></table></div>
<div class="blk"><div class="unit">C. SVM</div><table class="mt "><tr><th>English</th><th>한국어</th></tr><tr><td>Hyperplane<br>Decision boundary</td><td><span class="a">초평면</span><br><span class="a">결정 경계</span></td></tr><tr><td>Linearly separable<br>Margin</td><td><span class="a">선형 분리 가능</span><br><span class="a">마진 (가장 작은 거리)</span></td></tr><tr><td>Support vectors<br>Slack variable</td><td><span class="a">서포트 벡터</span><br><span class="a">슬랙 변수</span></td></tr><tr><td>Penalty parameter<br>Cross-validation</td><td><span class="a">벌점 매개변수 (C)</span><br><span class="a">교차 검증</span></td></tr><tr><td>Underfitting · Overfitting<br>High bias, low variance</td><td><span class="a">과소적합 · 과적합</span><br><span class="a">편향 높음, 분산 낮음</span></td></tr></table></div>
<div class="blk"><div class="unit">D. 군집화</div><table class="mt "><tr><th>English</th><th>한국어</th></tr><tr><td>Partition<br>Within-cluster variation</td><td><span class="a">분할</span><br><span class="a">군집 내 변동</span></td></tr><tr><td>Centroid<br>Inertia</td><td><span class="a">중심 (평균 벡터)</span><br><span class="a">이너셔</span></td></tr><tr><td>Silhouette score<br>Agglomerative</td><td><span class="a">실루엣 점수</span><br><span class="a">병합형 (상향식)</span></td></tr><tr><td>Dendrogram<br>Core · Border point</td><td><span class="a">덴드로그램</span><br><span class="a">핵심점 · 경계점</span></td></tr><tr><td>Density-reachable<br>Density-connected</td><td><span class="a">밀도 도달</span><br><span class="a">밀도 연결</span></td></tr></table></div>
<div class="blk"><div class="unit">E. 결정 트리</div><table class="mt "><tr><th>English</th><th>한국어</th></tr><tr><td>Impurity<br>Leaf (terminal) node</td><td><span class="a">불순도</span><br><span class="a">리프 (끝) 노드</span></td></tr><tr><td>Pre-pruning · Regularization<br>Impurity reduction</td><td><span class="a">사전 가지치기 · 규제</span><br><span class="a">불순도 감소량 (ΔG)</span></td></tr><tr><td>Information gain<br>Orthogonal boundaries</td><td><span class="a">정보 이득</span><br><span class="a">직교 (축에 수직) 경계</span></td></tr></table></div>
<div class="blk"><div class="unit">F. 앙상블</div><table class="mt "><tr><th>English</th><th>한국어</th></tr><tr><td>Hard · Soft voting<br>Weak learner</td><td><span class="a">하드 · 소프트 투표</span><br><span class="a">약한 학습기</span></td></tr><tr><td>With replacement<br>Without replacement</td><td><span class="a">복원 추출 (배깅)</span><br><span class="a">비복원 추출 (페이스팅)</span></td></tr><tr><td>Out-of-Bag<br>Sequentially</td><td><span class="a">OOB (뽑히지 않은 샘플)</span><br><span class="a">순서대로</span></td></tr><tr><td>Weighted error rate<br>Weighted majority vote</td><td><span class="a">가중 오차율</span><br><span class="a">가중 다수결</span></td></tr><tr><td>Residual errors<br>Blender · Meta-learner</td><td><span class="a">잔차</span><br><span class="a">블렌더 · 메타 학습기</span></td></tr><tr><td>Inductive bias</td><td><span class="a">귀납적 편향</span></td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅷ</span>시험 직전 30초 체크</h2><p class=lead>한 줄씩 소리 내어 확인</p></div>
<div class="blk"><ul class="pt"><li><b>A</b> →는 <span class="a">T → F</span>만 F · 표 6.4 머리글은 <span class="a">p → q</span> · 귀납 = 필연성 ↓, 연역 = 확장성 ↓</li><li><b>A</b> AI ⊃ ML ⊃ DL ⊃ <span class="a">생성형 AI</span> · 지도 <span class="a">{(x, y)}</span> · 비지도 <span class="a">{x}</span> · 온라인 = <span class="a">빠름</span></li><li><b>B</b> LSE: 제곱합 → arg min → <span class="a">편미분 = 0</span> → β̂₁ = <span class="frac"><span class="num">Σ(x − x̄)(y − ȳ)</span><span class="den">Σ(x − x̄)<sup>2</sup></span></span>, β̂₀ = <span class="a">ȳ − β̂₁x̄</span></li><li><b>B</b> R² = <span class="a">1 − SSE ÷ SST</span> · 변수 ↑ → R² 안 내려감 → <span class="a">Adjusted R²</span> · 해석은 <span class="a">상관</span></li><li><b>B</b> 로지스틱: p(x) = y가 <span class="a">1</span>일 확률, <span class="a">최대우도</span>, 0.5 기준</li><li><b>C</b> 작은 C = <span class="a">넓은</span> 마진 · <span class="a">과소적합</span> · 고편향 / 큰 C = <span class="a">좁은</span> 마진 · <span class="a">과적합</span></li><li><b>C</b> 마진 = <span class="a">가장 가까운</span> 점까지 · 서포트 벡터만 경계 결정 · 스케일링은 <span class="a">학습 데이터</span> 통계</li><li><b>D</b> K-평균·계층 = <span class="a">거리</span>, DBSCAN = <span class="a">밀도</span> · ++는 <span class="a">초기화</span>만 · 엘보 = <span class="a">꺾이는 점</span></li><li><b>D</b> 핵심점 = ε-이웃 <span class="a">MinPts 이상</span>(자기 포함) · 밀도 연결 = <span class="a">대칭</span></li><li><b>E</b> 지니 0 = <span class="a">순수</span>, 2클래스 최대 <span class="a">0.5</span> · max_depth <span class="a">↓</span>, min_ <span class="a">↑</span> = 규제</li><li><b>E</b> CART = 지니·<span class="a">이진</span>·ΔG 최대 / ID3 = 엔트로피·정보 이득·<span class="a">범주 수만큼</span></li><li><b>F</b> 배깅 <span class="a">복원</span> · 분산 ↓ / 부스팅 <span class="a">순차</span> · 편향 ↓(보충) / RF = 특징 <span class="a">일부</span> 중 최선</li><li><b>F</b> AdaBoost <span class="a">틀린 샘플 가중치 ↑</span> · α = η log<span class="frac"><span class="num">1 − r</span><span class="den">r</span></span> / GB = <span class="a">잔차</span> 학습</li></ul></div>
</template>
<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const masthead=`<header class="masthead"><div class="mh-top"><span class="org">Kangwon National University CSE</span><span class="subj">인공지능</span></div><div class="mh-title"><div class="y">중간고사 10/29 (목) 직전 대비</div><h1>암기노트</h1></div><div class="scope"><span class="h">범 위</span><div class="b">4주차 2차시 ~ 8주차 1차시 (5주차 1차시 제외) — A 규칙기반 AI·기계학습 입문 · B 회귀 · C SVM · D 군집화 · E 결정 트리 · F 앙상블. 「답 가리기」를 켜면 답 칸이 가려지고 누르면 하나씩 보입니다. 「빈칸 연습지 인쇄」로 손으로 채워 보세요.</div></div></header>`;
const running=`<div class="running"><span>인공지능 암기노트</span><span><b>인공지능</b></span></div>`;
const blocks=[...$('#src').content.children].map(e=>e.outerHTML);
function paginate(){
  const PAGE_H=1180, PAD=40+70;
  const m=document.createElement('section'); m.className='page measure';
  m.innerHTML=masthead+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  document.body.appendChild(m);
  const capFirst=PAGE_H-PAD-m.querySelector('.masthead').offsetHeight-18-4;
  m.innerHTML=running+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  const capRest=PAGE_H-PAD-m.querySelector('.running').offsetHeight-18-4;
  const els=$$('#mcol>.blk',m), hs=els.map(e=>e.offsetHeight), sh=els.map(e=>e.classList.contains('sh'));
  m.remove();
  // 제목 블록은 바로 다음 블록과 묶어서 배치
  const units=[]; for(let i=0;i<blocks.length;i++){ if(sh[i]&&i+1<blocks.length){units.push({ids:[i,i+1],h:hs[i]+hs[i+1]});i++;} else units.push({ids:[i],h:hs[i]}); }
  const pages=[]; let p=null, side='R', used=0;
  const cap=()=>pages.length===1?capFirst:capRest;
  units.forEach(u=>{
    if(!p||used+u.h>cap()&&used>0){ if(!p||side==='R'){p={L:[],R:[]};pages.push(p);side='L';} else side='R'; used=0; }
    p[side].push(...u.ids); used+=u.h;
  });
  return pages;
}
function render(){
  const P=paginate(), total=P.length;
  $('#book').innerHTML=P.map((pg,i)=>`<section class="page">${i===0?masthead:running}<div class="cols"><div class="col">${pg.L.map(k=>blocks[k]).join('')}</div><div class="col">${pg.R.map(k=>blocks[k]).join('')}</div></div><div class="pno">${i+1} / ${total}</div></section>`).join('');
}
const A4W=793.7, A4H=1122.5, PW=860;
function preparePrint(){
  document.body.classList.add('printing');
  const pages=$$('#book .page'); const base=A4W/PW, sheet=A4H/base;
  pages.forEach(p=>{p.style.zoom='';p.style.height='';});
  pages.forEach(p=>{const h=p.scrollHeight; if(h<=sheet){p.style.zoom=base;p.style.height=sheet+'px';} else {p.style.zoom=A4H/h-0.0005;p.style.height=h+'px';}});
  if(pages.length) pages[pages.length-1].classList.add('lastprint');
}
function afterPrint(){ document.body.classList.remove('printing'); $$('#book .page').forEach(p=>{p.style.zoom='';p.style.height='';p.classList.remove('lastprint');}); }
window.addEventListener('beforeprint',preparePrint); window.addEventListener('afterprint',afterPrint);
window.__memoPrint={prepare:preparePrint,done:afterPrint};
function setQuiz(on){ document.body.classList.toggle('quiz',on); $('#quizBtn').classList.toggle('on',on); $('#quizBtn').textContent=on?'답 보이기':'답 가리기'; $$('.a.show').forEach(e=>e.classList.remove('show')); }
function boot(){
  render();
  $('#quizBtn').onclick=()=>setQuiz(!document.body.classList.contains('quiz'));
  document.addEventListener('click',e=>{const a=e.target.closest('.a'); if(a&&document.body.classList.contains('quiz')) a.classList.toggle('show');});
  $('#printBtn').onclick=()=>{ const q=document.body.classList.contains('quiz'); setQuiz(false); window.print(); if(q) setQuiz(true); };
  $('#printBlank').onclick=()=>{ setQuiz(true); document.body.classList.add('printblank'); window.print(); document.body.classList.remove('printblank'); };
}
const fams=['400 16px "Nanum Myeongjo"','800 16px "Nanum Myeongjo"','400 16px "Nanum Gothic"','700 16px "Nanum Gothic"'];
const wait=document.fonts?Promise.all(fams.map(f=>document.fonts.load(f,'가A1').catch(()=>{}))):Promise.resolve();
const start=()=>Promise.race([wait,new Promise(r=>setTimeout(r,2000))]).then(boot);
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
</body>
