<div class="blk sh"><h2><span class="sn">Ⅰ</span>한눈에 보기</h2><p class=lead>교안 1–33쪽 중 시험 핵심은 1–20쪽(선형 SVM)입니다.</p></div>
<div class="blk"><div class="key"><div class="blk"><ul class="pt"><li>SVM은 클래스 사이의 <span class="a">마진(Margin)</span>을 최대로 하는 초평면을 결정 경계로 찾는 <span class="a">지도 학습</span> 분류 모델입니다.</li><li>초평면 f(x) = 0의 <span class="a">부호</span>로 분류합니다. 레이블은 0·1이 아니라 <span class="a">−1·+1</span>입니다.</li><li>마진 = 초평면과 <span class="a">가장 가까운</span> 학습 점까지의 거리, 서포트 벡터 = 거리가 마진과 같은 점입니다.</li><li>하드 마진: 위반을 전혀 허용하지 않음 → 점 하나에 민감, <span class="a">과적합</span> 가능.</li><li>SVM은 거리로 판단하므로 <span class="a">특징 스케일링</span>이 필요합니다.</li><li>소프트 마진: <span class="a">슬랙 변수</span> ε<sub>i</sub>로 마진 위반·오분류를 일부 허용합니다.</li><li>★ 벌점 매개변수 C: 작은 C → 마진 <span class="a">넓음</span>·과소적합, 큰 C → 마진 <span class="a">좁음</span>·과적합.</li><li>직선으로 안 되면 특징 공간 확장·커널로 비선형 경계를 만듭니다(심화).</li></ul></div></div></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>"벌점 매개변수 C는 시험에 잘 나온다."</b></p><p>시험에 식 형태는 그대로 안내합니다(식 자체를 내지는 않음). 교안의 식은 이해를 위한 것이니 겁먹지 말 것.</p><p>이번 수업: SVM이 서포트 벡터를 어떻게 선정하며 마진을 어떻게 최대로 하는지. 커널 트릭은 심화라 짚고 넘어가는 수준.</p></div></div>
<div class="blk"><div class="unit">범위 구분</div><table class="mt "><tr><th>교안 쪽</th><th>내용</th><th>교수님 말씀</th></tr><tr><td>1–20</td><td>선형 SVM 전체</td><td><b>핵심</b> · C ★</td></tr><tr><td>21–23</td><td>힌지 손실</td><td>심화 (직접 안 나옴)</td></tr><tr><td>24–27</td><td>특징 공간 확장</td><td>그림으로 이해</td></tr><tr><td>28–30</td><td>커널</td><td>심화 (공부 안 해도 될 정도)</td></tr><tr><td>31–32</td><td>정리 · 다중 클래스</td><td>범위 아님</td></tr><tr><td>33</td><td>SVR</td><td>잘 안 씀</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅱ</span>SVM과 초평면</h2><p class=lead>교안 2–6쪽 <span class="pg">p.2–6</span></p></div>
<div class="blk"><div class="box"><p><b>SVM</b> <span class="en">Support Vector Machine</span>: 클래스 사이의 <span class="a">마진을 최대로</span> 하여 결정 경계를 만들고, <span class="a">서포트 벡터</span>를 사용하며, <span class="a">커널 트릭</span>으로 비선형 경계까지 확장되는 지도 학습 모델입니다. <span class="pg">p.2</span></p></div></div>
<div class="blk"><div class="unit">SVM의 종류 <span class="pg">p.2</span></div><table class="mt "><tr><th>구분</th><th>이름</th><th>특징</th></tr><tr><td>선형</td><td>Hard Margin SVM<span class="en">= Maximal margin classifier</span></td><td>위반 <span class="a">전혀 허용 안 함</span></td></tr><tr><td>선형</td><td>Soft Margin SVM<span class="en">= Linear SVM</span></td><td>위반 <span class="a">일부 허용</span></td></tr><tr><td>비선형</td><td>Kernel SVM</td><td><span class="a">커널</span>로 곡선 경계</td></tr></table></div>
<div class="blk"><div class="box"><p><b>Hyperplane(초평면)</b>: p차원 공간 안의 <span class="a">(p − 1)차원</span> 평평한 부분공간으로, 공간을 두 개의 <span class="a">반쪽 공간</span><span class="en">half-spaces</span>으로 나눕니다. 초평면이 곧 결정 경계<span class="en">decision boundary</span>입니다. <span class="pg">p.3</span></p><p>2차원에서는 <span class="a">직선</span>, 3차원에서는 <span class="a">평면</span>입니다.</p><div class="fx">f(x) = β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub> + ⋯ + β<sub>p</sub>x<sub>p</sub> = 0</div><p>f(x) > 0이면 한쪽 클래스, f(x) < 0이면 다른 클래스, f(x) = 0이면 초평면 위입니다. |f(x)|가 클수록 경계에서 멀어 분류를 더 믿을 수 있습니다(보충).</p></div></div>
<div class="blk"><div class="unit">교안 예시 <span class="pg">p.5</span></div><table class="mt "><tr><th>점</th><th>1 + 2X<sub>1</sub> + 3X<sub>2</sub></th><th>어느 쪽</th></tr><tr><td>(0, 0)</td><td>1</td><td><span class="a">> 0</span> 파란 영역</td></tr><tr><td>(−1, 0)</td><td>−1</td><td><span class="a">< 0</span> 보라 영역</td></tr><tr><td>(1, −1)</td><td>0</td><td><span class="a">직선 위</span></td></tr></table></div>
<div class="blk"><div class="box"><p><b>분리 초평면으로 분류</b>: 핵심 가정은 두 클래스가 선형 결정 경계로 나뉜다는 것, 즉 <span class="a">선형 분리 가능</span><span class="en">linearly separable</span>입니다. <span class="pg">p.6</span></p><p>선형 분리가 가능하면 나누는 초평면은 <span class="a">무한히 많습니다</span>. 그중 무엇을 고를지가 다음 장의 질문입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">Ⅲ</span>최대 마진 · 서포트 벡터 · 하드 마진</h2><p class=lead>교안 7–10쪽 <span class="pg">p.7–10</span></p></div>
<div class="blk"><div class="box"><p><b>Maximal margin hyperplane(최대 마진 초평면)</b>: 분리 초평면 중 학습 데이터에서 <span class="a">가장 멀리</span> 떨어진 초평면입니다. <span class="pg">p.7</span></p><p><b>Margin(마진)</b>: 학습 데이터와 초평면 사이 거리 중 <span class="a">가장 작은 거리</span>입니다(평균 아님).</p><p><b>Support vectors(서포트 벡터)</b>: 초평면까지의 거리가 <span class="a">마진과 같은</span> 학습 데이터입니다.</p></div></div>
<div class="blk"><div class="unit">서포트 벡터가 정해지는 방식</div><ul class="pt"><li>서포트 벡터만 경계를 결정합니다. 서포트 벡터가 아닌 점은 조금 옮기거나 지워도 경계가 <span class="a">바뀌지 않습니다</span>.</li><li>서포트 벡터는 사람이 미리 고르지 않습니다. 최적화 문제를 풀면 <span class="a">결과로</span> 정해집니다.</li><li>마진 M을 키우면 양쪽 띠가 넓어지다가 어떤 점에 닿아 멈춥니다. 그 띠 가장자리에 걸린 점(y·f(x) = M)이 서포트 벡터입니다.</li><li>경계가 양쪽에서 가장 멀어야 새 데이터에서도 잘 맞을 것(일반화)을 기대할 수 있습니다(보충).</li></ul></div>
<div class="blk"><div class="key"><div class="h">하드 마진 SVM의 최적화 문제 <span class="pg">p.8</span></div><div class="fx">max M &nbsp;<span class="en">over β<sub>0</sub>, …, β<sub>p</sub></span></div><div class="fx">subject to &nbsp;Σ<sub>j=1</sub><sup>p</sup> β<sub>j</sub><sup>2</sup> = 1</div><div class="fx">y<sup>(i)</sup>(β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub><sup>(i)</sup> + ⋯ + β<sub>p</sub>x<sub>p</sub><sup>(i)</sup>) ≥ M, &nbsp;∀i</div></div></div>
<div class="blk"><div class="unit">식의 각 부분</div><table class="mt "><tr><th>기호</th><th>뜻</th></tr><tr><td>y<sup>(i)</sup></td><td>i번째 데이터의 레이블, <span class="a">−1 또는 +1</span></td></tr><tr><td>M</td><td><span class="a">마진</span> — 가장 크게 만들 값</td></tr><tr><td>max M</td><td>마진을 최대로 하는 β를 찾음</td></tr><tr><td>Σ<sub>j=1</sub><sup>p</sup> β<sub>j</sub><sup>2</sup></td><td>β의 길이를 1로 고정(<span class="a">단위벡터</span>)</td></tr><tr><td>∀i</td><td><span class="a">모든</span> 학습 데이터에 대해</td></tr></table></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>8쪽 셋째 줄</b>: y가 1일 때는 f(x)가 <span class="a">M보다 커야</span> 하고, y가 −1일 때는 <span class="a">−M보다 작아야</span> 한다. 그걸 보여 주는 식입니다.</p></div></div>
<div class="blk"><div class="unit">두 조건이 한 줄 y·f(x) ≥ M이 되는 이유</div><table class="mt "><tr><th>레이블</th><th>조건</th><th>y를 곱하면</th></tr><tr><td>y = +1</td><td>f(x) ≥ M</td><td>(+1)·f ≥ M</td></tr><tr><td>y = −1</td><td>f(x) <span class="a">≤ −M</span></td><td>(−1)·f ≥ M</td></tr></table></div>
<div class="blk"><div class="box"><p>레이블을 −1·+1로 쓰기 때문에 두 조건이 y·f(x) ≥ M 하나로 합쳐집니다. 맞게 분류되면 y·f(x)가 <span class="a">양수</span>, 틀리면 음수입니다.</p><p>모든 점이 맞는 쪽에 있고 M 이상 떨어져야 하므로, 하드 마진은 <span class="a">선형 분리 가능</span>할 때만 해가 있습니다.</p></div></div>
<div class="blk"><div class="box"><p><b>Normal vector(법선벡터)</b>: 면에 <span class="a">수직</span>인 벡터입니다. 초평면의 β = (β<sub>1</sub>, …, β<sub>p</sub>)가 법선벡터입니다(11쪽 "법선벡터 왜곡"의 그 벡터). <span class="pg">p.9</span></p><p><b>Unit vector(단위벡터)</b>: 크기(길이)가 <span class="a">1</span>인 벡터입니다. 조건 Σβ<sub>j</sub><sup>2</sup> = 1이 β를 단위벡터로 고정합니다.</p></div></div>
<div class="blk"><div class="box"><div class="h">단위벡터 조건이 필요한 이유 <span class="pg">p.10</span></div><p>x<sub>1</sub> + x<sub>2</sub> − 5 = 0과 2x<sub>1</sub> + 2x<sub>2</sub> − 10 = 0은 <span class="a">같은 초평면</span>입니다.</p><p>점 (2, 2), y = +1에서 y(β<sup>⊤</sup>x + b)는 각각 −1, −2로 달라집니다. 초평면은 그대로인데 마진 값이 <span class="a">일관되지 않습니다</span>.</p><p>β의 길이를 1로 고정해야 y·f(x)가 점과 초평면 사이의 <span class="a">실제 거리</span>가 됩니다(보충).</p></div></div>
<div class="blk sh"><h2><span class="sn">Ⅳ</span>특징 스케일링</h2><p class=lead>교안 11–12쪽 <span class="pg">p.11–12</span></p></div>
<div class="blk"><div class="box"><p><b>왜</b>: 특징마다 범위가 다르면 <span class="a">법선벡터가 왜곡</span>되어 마진이 잘못 정해집니다. 스케일 후에는 노름(길이)이 의미를 갖고 올바른 최대 마진 초평면을 찾습니다. <span class="pg">p.11</span></p><p>교안 그림: 스케일 전에는 범위가 큰 특징이 거리를 거의 다 차지해 경계가 수평에 가깝고 마진이 좁습니다.</p></div></div>
<div class="blk"><div class="unit">스케일링 방법 두 가지 <span class="pg">p.12</span></div><table class="mt "><tr><th></th><th>Standardization(표준화)</th><th>Min–Max Normalization</th></tr><tr><td>식</td><td>x̃<sub>j</sub> = <span class="frac"><span class="num">x<sub>j</sub> − μ<sub>j</sub></span><span class="den">σ<sub>j</sub></span></span></td><td>x̃<sub>j</sub> = <span class="frac"><span class="num">x<sub>j</sub> − min<sub>j</sub></span><span class="den">max<sub>j</sub> − min<sub>j</sub></span></span></td></tr><tr><td>결과</td><td>평균 <span class="a">0</span>, 분산 <span class="a">1</span><span class="en">범위 고정 안 함</span></td><td><span class="a">[0, 1]</span>로 옮김<span class="en">상대 위치 유지</span></td></tr></table></div>
<div class="blk"><div class="box"><p>μ<sub>j</sub>·σ<sub>j</sub>: 특징 j의 학습 데이터 평균·표준편차, min<sub>j</sub>·max<sub>j</sub>: 학습 데이터 최솟값·최댓값.</p><p>스케일링 통계값은 <span class="a">학습 데이터에서만</span> 계산하고, 검증·테스트 데이터에 <span class="a">그대로 재사용</span>합니다. SVM에서는 <span class="a">표준화</span>가 흔한 출발점입니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">Ⅴ</span>소프트 마진과 슬랙 변수</h2><p class=lead>교안 13–17쪽 <span class="pg">p.13–17</span></p></div>
<div class="blk"><div class="box"><p><b>최대 마진 분류기의 단점</b> <span class="pg">p.13</span></p><ul class="pt"><li>개별 관측값 <span class="a">하나에 민감</span><span class="en">sensitive to individual observations</span></li><li>학습 데이터에 <span class="a">과적합</span>할 수 있음</li></ul><p>교안 그림: 점 하나가 추가되자 경계가 크게 기울고 마진이 훨씬 좁아졌습니다.</p></div></div>
<div class="blk"><div class="box"><p><b>Soft Margin SVM(소프트 마진)</b>: 초평면으로 분류하되, 학습 데이터가 <span class="a">마진이나 초평면의 반대쪽</span>에 있는 것을 허용합니다. 클래스를 "거의" 나눕니다. <span class="pg">p.14</span></p><p><b>서포트 벡터</b>: 마진 위에 정확히 있는 점 + 자기 클래스 기준 <span class="a">마진의 반대쪽</span>에 있는 점(위반·오분류 점)입니다. <span class="pg">p.15</span></p></div></div>
<div class="blk"><div class="key"><div class="h">소프트 마진의 최적화 문제 <span class="pg">p.16</span></div><div class="fx">max M &nbsp;<span class="en">over β<sub>0</sub>, …, β<sub>p</sub>, ε<sub>1</sub>, …, ε<sub>n</sub></span></div><div class="fx">subject to &nbsp;Σ<sub>j=1</sub><sup>p</sup> β<sub>j</sub><sup>2</sup> = 1</div><div class="fx">y<sup>(i)</sup>(β<sub>0</sub> + β<sub>1</sub>x<sub>1</sub><sup>(i)</sup> + ⋯ + β<sub>p</sub>x<sub>p</sub><sup>(i)</sup>) ≥ M(1 − ε<sub>i</sub>)</div><div class="fx">Σ<sub>i=1</sub><sup>n</sup> ε<sub>i</sub> ≤ C, &nbsp;ε<sub>i</sub> ≥ 0</div></div></div>
<div class="blk"><div class="unit">하드 마진과 달라진 곳</div><ul class="pt"><li>≥ M(1 − ε<sub>i</sub>): 점마다 ε<sub>i</sub>만큼 조건을 <span class="a">느슨하게</span> 합니다. ε<sub>i</sub> = 0이면 하드 마진과 같은 조건입니다.</li><li>Σε<sub>i</sub> ≤ C: 이 식의 C는 위반 총량의 <span class="a">상한(예산)</span>입니다. 벌점 C와 다른 정의입니다(Ⅵ 참고).</li><li>교안 16쪽 첫 제약의 합은 j = 0부터로 적혀 있으나, 8쪽과 같게 j = 1부터로 읽습니다.</li></ul></div>
<div class="blk"><div class="unit">Slack variable(슬랙 변수) ε<sub>i</sub> <span class="pg">p.17</span></div><table class="mt "><tr><th>ε<sub>i</sub></th><th>점의 위치</th></tr><tr><td>ε<sub>i</sub> = 0</td><td><span class="a">마진의 맞는 쪽</span><span class="en">correct side of the margin</span></td></tr><tr><td>0 < ε<sub>i</sub> ≤ 1</td><td><span class="a">마진 위반</span> (초평면은 맞는 쪽)</td></tr><tr><td>ε<sub>i</sub> > 1</td><td><span class="a">오분류</span> (초평면 반대쪽)</td></tr></table></div>
<div class="blk"><div class="box"><p>1이 기준인 이유: ε<sub>i</sub> = 1이면 M(1 − ε<sub>i</sub>) = 0이 되어 y·f(x) ≥ 0(초평면의 맞는 쪽)만 요구합니다. 1을 넘으면 y·f(x)가 음수, 즉 오분류여도 됩니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">Ⅵ</span>★ 벌점 매개변수 C와 편향-분산</h2><p class=lead>교안 18–20쪽 <span class="pg">p.18–20</span> — 시험에 잘 나오는 부분</p></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p><b>"벌점 매개변수 C는 시험에 잘 나온다."</b></p></div></div>
<div class="blk"><div class="box"><p><b>Penalty parameter C(벌점 매개변수)</b>: 마진 폭과 분류 오류 허용 사이의 <span class="a">균형(trade-off)</span>을 조절하는 값입니다. <span class="pg">p.18</span></p><ul class="pt"><li>C는 <span class="a">하이퍼파라미터</span>이며 <span class="a">교차 검증</span><span class="en">cross-validation</span>으로 고릅니다. β처럼 학습되는 값이 아닙니다.</li><li>C는 <span class="a">음수가 될 수 없습니다</span><span class="en">non-negative</span>.</li><li>C를 작은 값에서 큰 값으로 바꾸면 <span class="a">편향-분산 트레이드오프</span>가 생깁니다.</li></ul></div></div>
<div class="blk"><div class="unit">★ C의 크기에 따른 변화 <span class="pg">p.19</span></div><table class="mt "><tr><th></th><th>작은 C</th><th>큰 C</th></tr><tr><td>마진</td><td><span class="a">넓음</span></td><td><span class="a">좁음</span></td></tr><tr><td>오류</td><td><span class="a">어느 정도 허용</span></td><td><span class="a">최소화</span>하려고 빡빡하게</td></tr><tr><td>모델</td><td><span class="a">단순</span></td><td><span class="a">복잡</span></td></tr><tr><td>적합</td><td><span class="a">과소적합</span><span class="en">Underfitting</span></td><td><span class="a">과적합</span><span class="en">Overfitting</span></td></tr><tr><td>편향</td><td><span class="a">높음</span></td><td><span class="a">낮음</span></td></tr><tr><td>분산</td><td><span class="a">낮음</span></td><td><span class="a">높음</span></td></tr></table></div>
<div class="blk"><div class="box"><p><b>왜</b>: 벌점 C는 위반 1단위당 벌점입니다. C가 크면 위반이 비싸 마진을 좁혀서라도 덜 틀리고, C가 작으면 몇 개 틀리더라도 넓은 마진을 택합니다.</p><p>교안 19쪽 그림 4개: 마진(점선 간격)이 좁아지는 순서 = 벌점 C가 <span class="a">커지는</span> 순서입니다. 넓은 마진일수록 마진 안 점이 많아 서포트 벡터가 대체로 <span class="a">많습니다</span>(15쪽 서포트 벡터 정의에서 나옴).</p><p>C 크기 ↔ 마진 폭 ↔ 과소적합·과적합 ↔ 편향·분산을 한 묶음으로 말할 수 있어야 합니다.</p></div></div>
<div class="blk"><div class="unit">Bias-Variance Tradeoff <span class="pg">p.20</span> — 과녁 그림의 뜻</div><table class="mt "><tr><th>용어</th><th>뜻</th></tr><tr><td>Bias(편향)</td><td>예측이 평균적으로 정답에서 벗어난 정도. 모델이 <span class="a">너무 단순</span>하면 커짐</td></tr><tr><td>Variance(분산)</td><td>학습 데이터가 조금 바뀔 때 예측이 흔들리는 정도. <span class="a">너무 복잡</span>하면 커짐</td></tr></table></div>
<div class="blk"><div class="box"><p>과녁 그림: 점의 중심이 가운데에서 떨어짐 = <span class="a">편향</span>, 점이 넓게 흩어짐 = <span class="a">분산</span>. 목표는 저편향·저분산입니다.</p><p>오차 그래프: 복잡도가 커질수록 Bias<sup>2</sup>는 줄고 Variance는 늘어 Total Error가 <span class="a">U자</span>가 됩니다. 가운데 최솟값이 최적 복잡도입니다.</p><p>U자의 왼쪽 = 과소적합(작은 C), 오른쪽 = 과적합(큰 C). 적절한 C는 교차 검증으로 고릅니다.</p></div></div>
<div class="blk sh"><h2><span class="sn">Ⅶ</span>심화와 범위 밖 — 흐름만</h2><p class=lead>교안 21–33쪽 <span class="pg">p.21–33</span></p></div>
<div class="blk"><div class="prof"><div class="h">교수님 강조</div><p>21쪽부터 심화(시험에 직접 안 나옴). 24–25쪽은 어려우니 그림으로 이해. 28–30쪽 커널은 사실 공부 안 해도 되는 정도. 31–32쪽은 시험 범위 아님. 33쪽 SVR은 잘 안 씀.</p></div></div>
<div class="blk"><div class="unit">Part 2 요약</div><table class="mt "><tr><th>주제</th><th>한 줄 정리</th></tr><tr><td>힌지 손실<span class="pg">p.21–23</span></td><td>범위 아님(심화, 시험에 직접 안 나옴)</td></tr><tr><td>특징 공간 확장 (그림)<span class="pg">p.24–27</span></td><td>직선으로 안 되면 X<sup>2</sup> 같은 특징을 추가해 <span class="a">고차원</span>에서 선형으로 나눔 → 원래 공간에서는 <span class="a">비선형</span> 경계</td></tr><tr><td>커널<span class="pg">p.28–30</span></td><td>비선형 SVM은 <span class="a">커널 함수</span>로 비선형(곡선) 결정 경계를 만든다 — 이 한 줄만. 세부는 범위 아님</td></tr><tr><td>범위 아님<span class="pg">p.31–33</span></td><td>장단점 정리, 다중 클래스(일대다·일대일), SVR</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅷ</span>헷갈리는 것 정리</h2><p class=lead>함정 상자는 "시험에서 이렇게 판단"하는 기준입니다.</p></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>교안 안에 C의 정의가 두 가지 섞여 있습니다.</b> 정의에 따라 "C가 크면 마진이 넓다·좁다"가 정반대입니다.</p><p>· <b>벌점 C</b> <span class="pg">p.19, 22</span>: min ½‖β‖<sup>2</sup> + CΣε<sub>i</sub>. 위반 1단위당 벌점 → C ↑ = 마진 <span class="a">좁음</span>. 하드 마진은 C → <span class="a">∞</span>.</p><p>· <b>예산 C</b> <span class="pg">p.16, 18</span>: Σε<sub>i</sub> ≤ C. 위반 총량의 상한 → C ↑ = 마진 <span class="a">넓음</span>. 하드 마진은 C = <span class="a">0</span>.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>C 방향 — 시험 판단</b>: 기본은 <b>벌점 C</b>(교수님이 부른 이름 "벌점 매개변수"와 19쪽 표가 모두 벌점 기준) → 작은 C = 넓은 마진, 큰 C = 좁은 마진. 단 문제에 Σε<sub>i</sub> ≤ C가 주어진 경우에만 예산 기준으로 방향을 뒤집습니다. 18쪽 문장 "C = 0이면 최대 마진 분류기"는 <span class="a">예산 C</span>(Σε<sub>i</sub> ≤ C)에서만 맞습니다. 벌점 C에서는 C = 0이면 위반에 벌점이 없고, 하드 마진은 C → <span class="a">∞</span>입니다.</p></div></div>
<div class="blk"><div class="unit">C의 두 정의 비교</div><table class="mt "><tr><th></th><th>벌점 C (기본)</th><th>예산 C</th></tr><tr><td>교안</td><td>19 · 22쪽</td><td>16 · 18쪽</td></tr><tr><td>식</td><td>min ½‖β‖<sup>2</sup> + CΣε<sub>i</sub></td><td>Σε<sub>i</sub> ≤ C</td></tr><tr><td>C가 뜻하는 것</td><td>위반 1단위의 <span class="a">벌점</span></td><td>위반 총량의 <span class="a">상한</span></td></tr><tr><td>C ↑ 이면</td><td>마진 <span class="a">좁음</span> · 과적합</td><td>마진 <span class="a">넓음</span> · 과소적합</td></tr><tr><td>하드 마진</td><td>C → ∞</td><td>C = 0</td></tr></table></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>마진은 평균 거리가 아닙니다.</b> 초평면에 <span class="a">가장 가까운</span> 학습 점까지의 거리입니다.</p><p><b>p차원의 초평면은 p차원이 아닙니다.</b> <span class="a">(p − 1)차원</span>입니다.</p><p><b>y = −1 조건</b>은 f(x) ≥ −M이 아니라 f(x) <span class="a">≤ −M</span>입니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>0 < ε<sub>i</sub> ≤ 1은 오분류가 아닙니다.</b> 마진 위반이지만 초평면은 맞는 쪽입니다. 오분류는 ε<sub>i</sub> <span class="a">> 1</span>.</p><p><b>소프트 마진의 서포트 벡터</b>는 마진 위의 점만이 아닙니다. 마진 반대쪽에 있는 <span class="a">위반·오분류 점</span>도 포함합니다.</p><p><b>스케일링 통계값</b>을 테스트 데이터로 다시 구하지 않습니다. <span class="a">학습 데이터</span> 값을 재사용합니다.</p></div></div>
<div class="blk"><div class="trap"><div class="h">함정 · 헷갈리는 것</div><p><b>C는 학습되는 값이 아닙니다.</b> <span class="a">하이퍼파라미터</span>로 교차 검증으로 고르며, 음수가 될 수 없습니다.</p><p><b>작은 C = 편향 높음·분산 낮음</b>입니다. "작은 C는 편향이 낮다"는 X.</p></div></div>
<div class="blk"><div class="unit">하드 마진 vs 소프트 마진</div><table class="mt "><tr><th></th><th>하드 마진</th><th>소프트 마진</th></tr><tr><td>위반</td><td><span class="a">전혀 허용 안 함</span></td><td><span class="a">일부 허용</span></td></tr><tr><td>제약</td><td>y·f(x) ≥ M</td><td>y·f(x) ≥ M(1 − ε<sub>i</sub>)</td></tr><tr><td>해</td><td>선형 분리 <span class="a">가능할 때만</span></td><td>분리 안 돼도 사용</td></tr><tr><td>서포트 벡터</td><td>마진 위의 점</td><td>마진 위 + 위반·오분류 점</td></tr><tr><td>약점</td><td>한 점에 민감·과적합</td><td>C를 정해야 함</td></tr></table></div>
<div class="blk sh"><h2><span class="sn">Ⅸ</span>셀프 체크</h2><p class=lead>「답 가리기」를 켜고 답을 떠올려 보세요.</p></div>
<div class="blk"><div class="unit">①</div><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>SVM이 최대로 하는 것?</td><td><span class="a">Margin(마진)</span></td></tr><tr><td>p차원 초평면의 차원?</td><td><span class="a">p − 1차원</span></td></tr><tr><td>마진의 정의?</td><td><span class="a">초평면에 가장 가까운 점까지 거리</span></td></tr><tr><td>서포트 벡터의 정의?</td><td><span class="a">거리가 마진과 같은 학습 점</span></td></tr><tr><td>서포트 벡터 아닌 점을 옮기면?</td><td><span class="a">경계 그대로</span></td></tr><tr><td>y = −1 점의 하드 마진 조건?</td><td><span class="a">f(x) ≤ −M</span></td></tr><tr><td>Σβ<sub>j</sub><sup>2</sup> = 1이 필요한 이유?</td><td><span class="a">y·f(x)를 실제 거리로 (값 일관)</span></td></tr></table></div>
<div class="blk"><div class="unit">②</div><table class="mt "><tr><th>질문</th><th>답</th></tr><tr><td>하드 마진의 단점 두 가지?</td><td><span class="a">한 점에 민감, 과적합</span></td></tr><tr><td>스케일링 통계값은 어디서?</td><td><span class="a">학습 데이터에서만</span></td></tr><tr><td>ε<sub>i</sub> > 1인 점?</td><td><span class="a">오분류 (초평면 반대쪽)</span></td></tr><tr><td>★ 벌점 C ↑ → 마진·적합?</td><td><span class="a">좁음 · 과적합</span></td></tr><tr><td>★ 벌점 C ↑ → 편향·분산?</td><td><span class="a">편향 낮음 · 분산 높음</span></td></tr><tr><td>C를 정하는 방법?</td><td><span class="a">교차 검증 (하이퍼파라미터)</span></td></tr></table></div>
</template>
<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const masthead=`<header class="masthead"><div class="mh-top"><span class="org">Kangwon National University CSE</span><span class="subj">인공지능</span></div><div class="mh-title"><div class="y">C. 서포트 벡터 머신 (SVM)</div><h1>개념정리노트</h1></div><div class="scope"><span class="h">범 위</span><div class="b">6주차 2차시 — 초평면 · 최대 마진 · 서포트 벡터 · 하드·소프트 마진 · 스케일링 · ★ 벌점 매개변수 C · 편향-분산. 「답 가리기」로 핵심어를 가리고 떠올려 보세요.</div></div></header>`;
const running=`<div class="running"><span>인공지능 개념정리노트 · C. 서포트 벡터 머신 (SVM)</span><span><b>인공지능</b></span></div>`;
const blocks=[...$('#src').content.children].map(e=>e.outerHTML);
function paginate(){
  const PAGE_H=1180, PAD=40+70;
  const m=document.createElement('section'); m.className='page measure';
  m.innerHTML=masthead+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  document.body.appendChild(m);
  const capFirst=PAGE_H-PAD-m.querySelector('.masthead').offsetHeight-18-4;
  m.innerHTML=running+`<div class="cols"><div class="col" id="mcol">${blocks.join('')}</div><div class="col"></div></div>`;
  const capRest=PAGE_H-PAD-m.querySelector('.running').offsetHeight-18-4;
  const els=$$('#mcol>.blk',m), hs=els.map(e=>e.offsetHeight), sh=els.map(e=>e.classList.contains('sh'));
  m.remove();
  // 제목 블록은 바로 다음 블록과 묶어서 배치
  const units=[]; for(let i=0;i<blocks.length;i++){ if(sh[i]&&i+1<blocks.length){units.push({ids:[i,i+1],h:hs[i]+hs[i+1]});i++;} else units.push({ids:[i],h:hs[i]}); }
  const pages=[]; let p=null, side='R', used=0;
  const cap=()=>pages.length===1?capFirst:capRest;
  units.forEach(u=>{
    if(!p||used+u.h>cap()&&used>0){ if(!p||side==='R'){p={L:[],R:[]};pages.push(p);side='L';} else side='R'; used=0; }
    p[side].push(...u.ids); used+=u.h;
  });
  return pages;
}
function render(){
  const P=paginate(), total=P.length;
  $('#book').innerHTML=P.map((pg,i)=>`<section class="page">${i===0?masthead:running}<div class="cols"><div class="col">${pg.L.map(k=>blocks[k]).join('')}</div><div class="col">${pg.R.map(k=>blocks[k]).join('')}</div></div><div class="pno">${i+1} / ${total}</div></section>`).join('');
}
const A4W=793.7, A4H=1122.5, PW=860;
function preparePrint(){
  document.body.classList.add('printing');
  const pages=$$('#book .page'); const base=A4W/PW, sheet=A4H/base;
  pages.forEach(p=>{p.style.zoom='';p.style.height='';});
  pages.forEach(p=>{const h=p.scrollHeight; if(h<=sheet){p.style.zoom=base;p.style.height=sheet+'px';} else {p.style.zoom=A4H/h-0.0005;p.style.height=h+'px';}});
  if(pages.length) pages[pages.length-1].classList.add('lastprint');
}
function afterPrint(){ document.body.classList.remove('printing'); $$('#book .page').forEach(p=>{p.style.zoom='';p.style.height='';p.classList.remove('lastprint');}); }
window.addEventListener('beforeprint',preparePrint); window.addEventListener('afterprint',afterPrint);
window.__memoPrint={prepare:preparePrint,done:afterPrint};
function setQuiz(on){ document.body.classList.toggle('quiz',on); $('#quizBtn').classList.toggle('on',on); $('#quizBtn').textContent=on?'답 보이기':'답 가리기'; $$('.a.show').forEach(e=>e.classList.remove('show')); }
function boot(){
  render();
  $('#quizBtn').onclick=()=>setQuiz(!document.body.classList.contains('quiz'));
  document.addEventListener('click',e=>{const a=e.target.closest('.a'); if(a&&document.body.classList.contains('quiz')) a.classList.toggle('show');});
  $('#printBtn').onclick=()=>{ const q=document.body.classList.contains('quiz'); setQuiz(false); window.print(); if(q) setQuiz(true); };
  $('#printBlank').onclick=()=>{ setQuiz(true); document.body.classList.add('printblank'); window.print(); document.body.classList.remove('printblank'); };
}
const fams=['400 16px "Nanum Myeongjo"','800 16px "Nanum Myeongjo"','400 16px "Nanum Gothic"','700 16px "Nanum Gothic"'];
const wait=document.fonts?Promise.all(fams.map(f=>document.fonts.load(f,'가A1').catch(()=>{}))):Promise.resolve();
const start=()=>Promise.race([wait,new Promise(r=>setTimeout(r,2000))]).then(boot);
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
</body>
</html>
