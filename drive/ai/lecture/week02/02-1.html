<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인공지능 2주차 1차시 — 휴강</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --accent:#9333EA;
    --accent-deep:#6B21A8;
    --accent-soft:#F3E8FF;
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --ink:#15161B;
    --ink-2:#565C66;
    --line:#E5E7EC;
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-.012em;
  }
  .card{
    max-width:420px;width:100%;margin:24px;background:var(--surface);border:1px solid var(--line);
    border-radius:18px;padding:32px 30px;text-align:center;
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent-deep);
    font-size:12.5px;font-weight:800;padding:4px 12px;border-radius:99px;margin-bottom:14px;
  }
  h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
  p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:6px 0}
  .note{
    margin-top:18px;padding:13px 15px;border-radius:12px;background:var(--accent-soft);
    color:var(--accent-deep);font-size:13.5px;text-align:left;line-height:1.65;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="chip">2주차 · 1차시</span>
    <h1>휴강</h1>
    <p>2026.09.10 (목) — 이번 시간은 휴강입니다.</p>
    <div class="note">
      보충수업은 중간고사 즈음(정확한 날짜 미정) 진행 예정이며, 보강수업은 원래 출석 체크를 하지 않습니다.
    </div>
  </div>
</body>
</html>
