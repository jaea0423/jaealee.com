<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>축의지기 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 노트북 기준. 맨 위 반투명 막대(.gnav) 아래로, 왼쪽 칸은 신랑신부 그림, 오른쪽은 밝은 회색 바탕 위 흰 카드(apple.com 식).
   곡률: 애플식 연속 곡률(squircle). 지원 브라우저는 corner-shape: squircle, 미지원은 작은 반경으로 대체. 안쪽 반경 = 바깥 반경 − 여백(동심). */
:root {
  color-scheme: light;
  --night: #F5F5F7;            /* 바탕 회색 */
  --glass: #FFFFFF;            /* 카드 (이름은 유리 카드 때 것) */
  --glass-hi: #F5F5F7;         /* 카드 안 채움 */
  --glass-hi2: rgba(0, 0, 0, .06);
  --fill: #F5F5F7;
  --line: rgba(0, 0, 0, .08);
  --field-line: #D2D2D7;
  --ink: #1D1D1F;
  --sub: #6E6E73;
  --muted: #86868B;
  --gold: #D65F7D;             /* 장미 분홍 (강조) */
  --gold-d: #BF4567;
  --blossom: #BF4567;
  --sky: #0071E3;
  --leaf: #D65F7D;
  --warn-bg: #FFF4E0; --warn: #8F5E0E;
  --err-bg: #FDECEE; --err: #C4314B;
  --ok-bg: #E8F5EA; --ok: #2E7D3C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .03), 0 10px 30px -18px rgba(0, 0, 0, .12);
  --nav-h: 52px;
  --img: url("../bg/4.jpg");
  /* 곡률 토큰: 미지원 기본값 */
  --r-card: 20px; --r-ctl: 12px; --r-btn: 14px; --r-chip: 10px; --r-pill: 980px;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --ko: var(--sans);           /* 제목도 산세리프. 명조는 신랑신부 이름(--serif)에만 */
  --serif: "Gowun Batang", "Noto Serif KR", serif;
  --en: "Cormorant Garamond", "Times New Roman", serif;
}
@supports (corner-shape: squircle) {
  :root { --r-card: 34px; --r-ctl: 18px; --r-btn: 20px; --r-chip: 14px; }
  .card, .stats, .modal, .gbox, .inp, .search, .memo, .save, .adds button, .tkrow, .stepper button, .stepper input, .tbtn, .side, .sync,
  .item .ed, .tag, .close-day, .seg, .seg button, .reasons button, .danger, .total, .bill, .cmp, .verdict, .confirm-box, .confirm-box button,
  .pick button, .toast, kbd, .sample, .mh .x, .note { corner-shape: squircle; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; word-break: keep-all; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid rgba(214,95,125,.45); outline-offset: 2px; }
.n { font-family: var(--sans); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
kbd { display: inline-block; min-width: 22px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--glass-hi); font-family: var(--sans); font-size: 12px; font-weight: 700; color: var(--sub); text-align: center; }

/* ---------- 배경: 그림은 왼쪽 칸에만 ---------- */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--night); }
/* 화면 비율이 달라도 신랑신부가 왼쪽 칸에 들어오도록: 왼쪽 칸 폭을 화면 높이에 맞추고(60vh), 그림은 높이 기준으로 맞춘다 */
:root { --col: min(max(60vh, 300px), 42vw); }
.bg .art { position: absolute; left: 0; top: 0; bottom: 0; width: var(--col); background: var(--img) calc(-7vh) 0 / auto 100% no-repeat; }

/* ---------- 틀 ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--col) 1fr; height: 100%; padding-top: var(--nav-h); }
.photo { position: relative; }
.photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 90px 30px 64px; background: linear-gradient(0deg, rgba(255,255,255,.94) 0%, rgba(255,255,255,.82) 55%, rgba(255,255,255,0) 100%); text-align: center; }
.eb { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--gold-d); }
.photo .eb, .gbox .eb { font-family: var(--en); font-weight: 500; letter-spacing: .42em; }
.couple { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 10px 0 8px; }
.couple div { display: grid; }
.couple small { font-size: 12px; color: var(--sub); letter-spacing: .2em; }
.couple b { font-family: var(--serif); font-size: 28px; font-weight: 700; letter-spacing: .08em; line-height: 1.2; }
.couple .amp { font-family: var(--en); font-style: italic; font-size: 30px; color: var(--gold); line-height: 1.1; }
.when { font-size: 14px; color: var(--sub); }
.when b { color: var(--ink); font-weight: 700; }
.sample { display: inline-block; margin-top: 12px; font-size: 11.5px; color: var(--sub); background: rgba(0,0,0,.05); padding: 2px 10px; border-radius: var(--r-pill); }

.work { min-width: 0; overflow: auto; padding: 18px 36px 20px; display: flex; flex-direction: column; justify-content: safe center; gap: 16px; }

/* 유리 카드 공통 */
.card, .stats { background: var(--glass); border: 0; box-shadow: var(--shadow); }

/* ---------- 맨 위 막대 (apple.com 전역 막대처럼 반투명) ---------- */
.gnav { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: var(--nav-h); background: rgba(251,251,253,.8); border-bottom: 1px solid var(--line); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
.gin { height: 100%; display: grid; grid-template-columns: var(--col) minmax(0, 1fr); align-items: center; }
.brand { padding-left: 24px; font-size: 17px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; justify-self: start; }
.brand::before { content: ""; width: 18px; height: 18px; border-radius: 6px; background: var(--gold); box-shadow: inset 0 0 0 5px #fff, inset 0 0 0 7px var(--gold); }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0; padding: 0 36px; }
.top > * { flex: none; }
.side { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: var(--r-pill); background: var(--gold); color: #fff; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.side::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .7; }
.sync { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 0; border-radius: var(--r-pill); background: transparent; font-size: 13px; color: var(--sub); white-space: nowrap; }
.sync:hover { background: var(--glass-hi2); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: #34C759; }
.sync.off i { background: #FF9F0A; }
.top .sp { flex: 1 1 0; min-width: 0; }
.tbtn { height: 32px; padding: 0 14px; border-radius: var(--r-pill); border: 0; background: var(--glass-hi2); font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.tbtn:hover { background: rgba(0,0,0,.1); }
#topBtns { display: inline-flex; gap: 6px; }

/* ---------- 현황 숫자 ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: var(--r-card); }
.stats > div { padding: 14px 24px; }
.stats > div + div { border-left: 1px solid var(--line); }
.stats small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-size: 13px; color: var(--sub); font-weight: 500; }
.stats small .meta { font-weight: 400; color: var(--muted); font-size: 12px; }
.stats .n { font-size: 34px; line-height: 1.15; letter-spacing: -.03em; }
.stats .n span { font-size: 16px; font-weight: 600; color: var(--sub); margin-left: 3px; letter-spacing: 0; }
.stats .low .n { color: var(--err); }

/* ---------- 본문 2단 ---------- */
.desk { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.card { border-radius: var(--r-card); padding: 24px 26px; }
.ord { display: flex; align-items: baseline; gap: 6px; margin-bottom: 14px; }
.ord .n { font-size: 40px; line-height: 1; color: var(--gold); letter-spacing: -.04em; }
.ord .t { font-size: 19px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
@media (max-width: 1360px) { .ord .keys { display: none !important; } }
.ord .keys { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

.field { display: grid; gap: 8px; }
.field + .field { margin-top: 15px; }
.lab { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.lab .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.inp { width: 100%; height: 54px; border: 1px solid var(--field-line); border-radius: var(--r-ctl); background: #fff; padding: 0 16px; font-size: 20px; transition: border-color .15s, background .15s; }
.inp::placeholder { color: #A1A1A6; font-weight: 400; }
.inp:focus { outline: none; border-color: var(--gold); background: #fff; box-shadow: 0 0 0 4px rgba(214,95,125,.16); }
.inp:disabled { opacity: .45; }
.anon { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.anon input { width: 17px; height: 17px; accent-color: var(--gold-d); }

.amtrow { display: grid; gap: 8px; }
.amtbox { position: relative; }
.amtbox .inp { padding-right: 64px; font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
@supports (corner-shape: squircle) { .amtbox .clr { corner-shape: squircle; } }
.amtbox .clr { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); height: 34px; padding: 0 12px; border-radius: var(--r-pill); border: 0; background: var(--glass-hi2); color: var(--ink); font-size: 13px; font-weight: 600; }
.amtbox .clr:hover { background: rgba(0,0,0,.1); }
#amt { padding-right: 150px; }
#amt + .unit { right: 92px; }
.amtbox .unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--sub); }
.readout { font-size: 14.5px; font-weight: 700; color: var(--gold); }
.readout { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.readout.empty { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.adds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.adds button { height: 44px; padding: 0 6px; border-radius: var(--r-chip); border: 1px solid rgba(214,95,125,.32); background: rgba(214,95,125,.1); font-weight: 800; font-size: 15px; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.adds button:hover { background: rgba(214,95,125,.18); }
.adds .reset { border-color: var(--line); background: var(--glass-hi); color: var(--sub); font-weight: 500; }

.tkrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: var(--r-btn); background: var(--fill); }
.tkrow .l { font-size: 15px; font-weight: 600; }
.tkrow .l small { display: block; font-weight: 400; font-size: 12.5px; color: var(--sub); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); font-size: 22px; font-weight: 600; color: var(--ink); }
.stepper button:hover { color: var(--gold-d); }
.stepper input { width: 72px; height: 44px; text-align: center; border: 1px solid transparent; border-radius: var(--r-chip); background: transparent; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepper input:focus { outline: none; border-color: var(--gold); background: #fff; }

.memo-link { margin-top: 10px; border: 0; background: none; padding: 2px 0; font-size: 13.5px; font-weight: 600; color: var(--gold-d); }
.memo-link::after { content: " \203A"; }
.memo { width: 100%; margin-top: 8px; border: 1px solid var(--field-line); border-radius: var(--r-ctl); padding: 10px 14px; font-size: 15px; resize: none; background: #fff; }
.memo:focus { outline: none; border-color: var(--gold); }
.note { margin-top: 14px; padding: 10px 14px; border-radius: var(--r-ctl); font-size: 14px; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.err { background: var(--err-bg); color: var(--err); }
.save { margin-top: 16px; width: 100%; height: 56px; border: 0; border-radius: var(--r-btn); font-size: 17px; font-weight: 700; letter-spacing: 0; color: #fff; background: var(--gold); }
.save:hover { background: var(--gold-d); }
.save:active { transform: translateY(1px); }
#saveBtn:focus-visible { outline: none; background: var(--gold-d); box-shadow: 0 0 0 4px rgba(214,95,125,.35); }
.save.confirm { background: var(--gold-d); }

/* ---------- 최근 봉투 ---------- */
.sechead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sechead h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.linkbtn { border: 0; background: none; padding: 4px 2px; font-size: 13.5px; font-weight: 600; color: var(--gold-d); }
.item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 8px 0; }
.item + .item { border-top: 1px solid var(--line); }
.item .no { font-weight: 800; font-size: 16px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.item .who b { font-weight: 700; font-size: 16px; }
.item .who small { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .amt { font-weight: 800; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .ed { height: 30px; padding: 0 12px; border-radius: var(--r-pill); border: 0; background: var(--fill); font-size: 13px; font-weight: 600; color: var(--ink); }
.item .ed:hover { background: var(--glass-hi2); }
.item.x .who b, .item.x .amt { text-decoration: line-through; color: var(--muted); }
.tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 7px; font-size: 11px; font-weight: 700; vertical-align: 2px; background: rgba(246,186,203,.16); color: var(--blossom); }
.tag.x { background: var(--glass-hi2); color: var(--sub); }
.rsearch { position: relative; margin: 4px 0 6px; }
.rsearch svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.rsearch input { width: 100%; height: 40px; border: 1px solid transparent; border-radius: var(--r-ctl); background: var(--fill); padding: 0 38px 0 38px; font-size: 14.5px; }
.rsearch input:focus { outline: none; border-color: var(--gold); background: #fff; }
.rsearch button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--glass-hi2); color: var(--sub); font-size: 16px; }
#recent { min-height: 372px; }
#recent.searching { max-height: 372px; overflow: auto; }
@supports (corner-shape: squircle) { .rsearch input { corner-shape: squircle; } }
/* 방금 저장한 봉투: 깜빡이고 순번을 크게 */
.item.just { animation: justIn 1.6s ease-out; border-radius: var(--r-ctl); }
@keyframes justIn { 0%, 30%, 60% { background: rgba(214,95,125,.2); } 15%, 45% { background: rgba(214,95,125,.04); } 100% { background: transparent; } }
.item.just .no { color: #fff; background: var(--gold); border-radius: 10px; height: 34px; line-height: 34px; font-size: 17px; }
.wnote { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; font-weight: 800; vertical-align: 2px; background: var(--gold); color: #fff; }
.emptyl { padding: 20px 0; text-align: center; color: var(--muted); font-size: 14px; }
.close-day { margin-top: 16px; width: 100%; height: 52px; border-radius: var(--r-btn); border: 0; background: rgba(214,95,125,.1); color: var(--gold-d); font-weight: 700; font-size: 15.5px; }
.close-day:hover { background: rgba(214,95,125,.16); }

/* ---------- 모달 ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.32); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.modal { width: 100%; max-width: 560px; max-height: 100%; overflow: auto; background: #fff; border: 0; border-radius: var(--r-card); padding: 26px 28px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.35); animation: pop .18s ease-out; }
.modal.wide { max-width: 860px; }
@keyframes pop { from { transform: translateY(8px); opacity: .6; } }
.mh { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.mh h3 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.mh p { margin: 2px 0 0; font-size: 13.5px; color: var(--sub); }
.mh .x { margin-left: auto; border: 0; background: var(--glass-hi2); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--sub); flex: none; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: var(--r-btn); background: var(--glass-hi2); margin-bottom: 16px; }
.seg button { height: 42px; border: 0; border-radius: calc(var(--r-btn) - 4px); background: transparent; font-weight: 700; font-size: 14px; color: var(--sub); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 16px; }
.reasons button { min-height: 48px; border-radius: var(--r-ctl); border: 1px solid transparent; background: var(--fill); font-size: 14px; font-weight: 500; color: var(--sub); }
.reasons button[aria-pressed="true"] { border-color: var(--gold); background: rgba(214,95,125,.12); color: var(--gold); font-weight: 700; }
.log { margin-top: 18px; }
.tsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.tsum div { padding: 10px 12px; border-radius: var(--r-ctl); background: var(--glass-hi); }
.tsum small { display: block; font-size: 12px; color: var(--sub); }
.tsum b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tsum em { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); }
.log h4 { margin: 0 0 4px; font-size: 13px; color: var(--sub); }
.log div { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log b { font-variant-numeric: tabular-nums; }
.mbtns { display: flex; gap: 10px; margin-top: 18px; }
.modal.alert { max-width: 440px; }
.amsg { margin: 0; font-size: 15.5px; color: var(--sub); line-height: 1.65; }
.ghost2 { height: 56px; padding: 0 20px; border-radius: var(--r-btn); border: 0; background: var(--glass-hi2); color: var(--ink); font-weight: 600; }
@supports (corner-shape: squircle) { .ghost2 { corner-shape: squircle; } }
.mbtns .save { margin-top: 0; flex: 1; }
.danger { height: 56px; padding: 0 18px; border-radius: var(--r-btn); border: 1px solid rgba(255,168,153,.4); background: var(--err-bg); color: var(--err); font-weight: 700; }
.hist { margin-top: 16px; font-size: 13.5px; color: var(--sub); }
.hist div { padding: 6px 0; border-top: 1px solid var(--line); }
.total { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: var(--r-btn); background: var(--glass-hi); margin-bottom: 12px; }
.veil { border: 0; background: none; padding: 0; text-align: right; }
.veil .n { font-size: 26px; }
.veil.hide .n { filter: blur(10px); }
.veil em { display: block; font-style: normal; font-size: 12px; color: var(--gold); font-weight: 700; }
.search { width: 100%; height: 44px; border: 1px solid transparent; border-radius: var(--r-ctl); padding: 0 14px; font-size: 15px; background: var(--fill); }
.search:focus { outline: none; border-color: var(--gold); background: #fff; }
.tbl { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); font-size: 14.5px; vertical-align: middle; }
td.r, th.r { text-align: right; }
td.num { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.x td:not(:last-child) { text-decoration: line-through; color: var(--muted); }

/* ---------- 정산 ---------- */
.stitle { padding: 4px 4px 0; }
@supports (corner-shape: squircle) { .stitle { corner-shape: squircle; } }
.stitle h2 { margin: 2px 0 0; font-size: 32px; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; }
.stitle p { margin: 4px 0 0; color: var(--sub); font-size: 14px; }
.settle { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.denom { display: grid; grid-template-columns: 84px minmax(0, 1fr) 110px; align-items: center; gap: 12px; }
.denom + .denom { margin-top: 10px; }
.bill { height: 44px; border-radius: var(--r-chip); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.b50 { background: #F7ECD2; color: #7C5A18; } .b10 { background: #E3F0DE; color: #3F6B36; } .b5 { background: #F8E1DB; color: #93493A; } .b1 { background: #E1EAF5; color: #3E5C82; }
.denom .inp { height: 48px; font-size: 20px; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.denom.chk .amtbox .inp { padding-right: 52px; }
.bchk { background: #E8E8ED; color: var(--ink); }
.denom .sub { text-align: right; font-size: 14.5px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; }
.cmp { margin-top: 16px; border-radius: var(--r-btn); padding: 14px 16px; background: var(--glass-hi); }
.cmp .r { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; padding: 3px 0; }
.cmp .r b { font-weight: 800; font-variant-numeric: tabular-nums; }
.verdict { margin-top: 8px; padding: 9px 12px; border-radius: var(--r-chip); font-weight: 800; font-size: 14.5px; text-align: center; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.bad { background: var(--err-bg); color: var(--err); }
.verdict.wait { background: #fff; color: var(--muted); font-weight: 500; }
.sfoot { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: end; }
.confirm-box { padding: 14px 16px; border-radius: var(--r-btn); background: var(--warn-bg); border: 0; color: var(--warn); font-size: 14px; }
.confirm-box .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 10px; }
.confirm-box button { height: 46px; border-radius: var(--r-chip); border: 0; font-weight: 800; }
.confirm-box .no { background: var(--glass-hi2); color: var(--sub); }
.confirm-box .yes { background: var(--gold); color: #fff; }

/* ---------- 완료 ---------- */
.done { max-width: 560px; margin: 20px auto 0; text-align: center; }
.seal { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; color: #fff; background: #34C759; }
.done h2 { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin: 16px 0 4px; }
.done p { margin: 0; color: var(--sub); }
.handover { margin-top: 20px; text-align: left; }
.handover div { display: flex; justify-content: space-between; gap: 8px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 15px; }
.handover span { color: var(--sub); }
.handover b { font-variant-numeric: tabular-nums; }

/* ---------- PIN ---------- */
.gate { position: fixed; inset: 0; z-index: 60; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--night); }
.gate::before { content: ""; position: absolute; inset: 0; background: var(--img) center 25% / cover no-repeat; filter: none; }
.gate::after { content: ""; position: absolute; inset: 0; background: rgba(245,245,247,.35); }
.gbox { position: relative; z-index: 2; width: 100%; max-width: 380px; text-align: center; background: rgba(255,255,255,.82); border: 0; border-radius: var(--r-card); padding: 32px 28px; box-shadow: 0 30px 80px -24px rgba(0,0,0,.35); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); }
.gmsg { margin: 18px 0 14px; font-size: 14.5px; color: var(--sub); min-height: 22px; }
.pins { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
.pins i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--gold); }
.pins i.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.pad { display: grid; grid-template-columns: repeat(3, 66px); justify-content: center; gap: 12px 22px; }
.pad button { width: 66px; height: 66px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.9); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pad button:active { background: rgba(214,95,125,.2); }
.pad .fn { background: transparent; border: 0; font-size: 13.5px; color: var(--sub); font-weight: 500; }
.gskip { margin-top: 18px; border: 0; background: none; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.pick button { height: 120px; border-radius: var(--r-btn); border: 2px solid transparent; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: grid; place-content: center; gap: 4px; }
.pick button:hover { border-color: var(--gold); }
.pick b { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--gold-d); }
.pick small { font-size: 13px; color: var(--sub); }
.gnote { margin-top: 14px; font-size: 12.5px; color: var(--muted); }

.toast { position: fixed; left: 65%; bottom: 24px; transform: translateX(-50%); z-index: 80; max-width: min(560px, calc(100% - 32px)); padding: 12px 22px; border-radius: var(--r-pill); background: rgba(29,29,31,.92); color: #fff; font-size: 14.5px; font-weight: 600; text-align: center; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

/* 노트북보다 좁은 화면: 임시로 한 줄 쌓기 (태블릿·모바일 최적화는 다음 단계) */
@media (max-width: 1000px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .app { padding-top: 0; }
  .gnav { position: sticky; height: auto; }
  .gin { grid-template-columns: 1fr; padding: 10px 0; gap: 8px; }
  .brand { padding-left: 16px; }
  .top { padding: 0 16px; flex-wrap: wrap; }
  .top > * { flex: 0 1 auto; }
  .photo { height: 380px; background: var(--img) 20% 30% / cover no-repeat; }
  .bg .art { display: none; }
  .work { overflow: visible; padding: 20px 16px 28px; }
  .desk, .settle, .sfoot { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .toast { left: 50%; }
  .ord .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


/* ---------- 시안 페이지 이동 (시안 전용) ---------- */
.proto { position: fixed; left: 12px; bottom: 12px; z-index: 90; display: flex; align-items: center; gap: 1px; padding: 3px; border-radius: var(--r-pill); background: rgba(29,29,31,.78); box-shadow: 0 8px 24px -12px rgba(0,0,0,.5); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); font-size: 12px; }
.proto em { font-style: normal; color: rgba(255,255,255,.5); padding: 0 6px 0 8px; font-weight: 600; font-size: 11px; }
.proto a { min-width: 24px; height: 24px; display: inline-grid; place-items: center; padding: 0 7px; border-radius: var(--r-pill); color: rgba(255,255,255,.82); text-decoration: none; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.proto a[aria-current="page"] { padding: 0 10px; }
.proto a:hover { background: rgba(255,255,255,.14); color: #fff; }
.proto a[aria-current="page"] { background: #fff; color: var(--ink); }

/* ---------- 공통 보조 ---------- */
.flow { display: flex; align-items: center; gap: 0; flex-wrap: nowrap; }
.flow span { display: inline-flex; align-items: center; height: 24px; min-width: 24px; padding: 0; border-radius: 99px; background: var(--glass-hi2); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.flow span b { width: 24px; text-align: center; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.flow span em { font-style: normal; padding: 0 11px 0 0; font-size: 12.5px; font-weight: 700; }
.flow .f-done { color: var(--gold-d); background: rgba(214,95,125,.12); }
.flow .f-on { background: var(--ink); color: #fff; }
.flow i { width: 6px; height: 1px; background: transparent; flex: none; }
@supports (corner-shape: squircle) { .sidecard, .feed, .kpi, .thumb, .pinbox { corner-shape: squircle; } }
.role { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 2px; font-size: 14px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.role::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.ch h3 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.35; }
.ch > .chip, .ch > .pill { white-space: nowrap; flex: none; }
.ch p { margin: 4px 0 0; font-size: 13.5px; color: var(--sub); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.wait { background: var(--glass-hi2); color: var(--sub); }
.pill.live { background: rgba(214,95,125,.12); color: var(--gold-d); }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.muted { color: var(--muted); }
.big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1.15; }
.big span { font-size: 15px; color: var(--sub); margin-left: 2px; font-weight: 700; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.row:first-child { border-top: 0; }
.row span { color: var(--sub); }
.row b { font-variant-numeric: tabular-nums; }
.btn2 { height: 36px; padding: 0 16px; border-radius: var(--r-pill); border: 0; background: var(--glass-hi2); font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.btn2:hover { background: rgba(0,0,0,.1); }
.btn2.rose:hover { background: var(--gold-d); }
.btn2, .save, .tbtn, .switch, .tabs button, .reasons button, .seg button { transition: background .15s, border-color .15s, color .15s, transform .08s; }
.btn2:active, .tbtn:active { transform: translateY(1px); }
.btn2.rose { background: var(--gold); border-color: var(--gold); color: #fff; }

/* 스위치 */
.switch { position: relative; width: 51px; height: 31px; border-radius: 99px; border: 0; background: #E9E9EB; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .2s; }
.switch[aria-checked="true"] { background: #34C759; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* PIN 상자 */
.pinbox { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--fill); }
.pinbox + .pinbox { margin-top: 8px; }
.pinbox .who { min-width: 64px; font-weight: 800; font-size: 14px; }
.pinbox code { flex: 1; min-width: 0; font-family: var(--sans); font-size: 20px; font-weight: 800; letter-spacing: .2em; font-variant-numeric: tabular-nums; }
.pinbox code.hide { letter-spacing: .15em; color: var(--muted); }

/* 체크 목록 */
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(124px, 1fr)); gap: 8px; }
.checks small.req { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }
.checks div { padding: 12px 14px 11px; border-radius: var(--r-ctl); background: var(--fill); }
.checks b { display: block; font-size: 13.5px; }
.checks small { font-size: 12px; color: var(--muted); }
.checks .ok b::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: #34C759; vertical-align: 2px; }
.checks .ok small { color: var(--ok); font-weight: 700; }
.checks .todo small { color: var(--gold-d); font-weight: 700; }
.bar { height: 4px; border-radius: 4px; background: var(--glass-hi2); overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 6px; }

.thumb { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-ctl); background: var(--img) center / cover no-repeat; border: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: var(--r-pill); background: var(--fill); font-size: 13px; color: var(--sub); }

/* 현황 */
.sidecard { border-radius: var(--r-btn); padding: 18px 20px; background: var(--fill); }
.sidecard h4 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.kpi { padding: 10px 12px; border-radius: var(--r-ctl); background: #fff; }
.kpi small { display: block; font-size: 12px; color: var(--sub); }
.kpi b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi b span { font-size: 13px; color: var(--sub); margin-left: 1px; }
.feed { flex: 1; min-height: 0; max-height: 360px; overflow: auto; }
.fi { display: grid; grid-template-columns: 54px 62px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.fi:first-child { border-top: 0; }
.fi time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.fi .sd { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 7px; text-align: center; }
.sd.g { background: rgba(0,113,227,.08); color: #0066CC; }
.sd.b { background: rgba(214,95,125,.12); color: var(--gold-d); }
.fi b { font-variant-numeric: tabular-nums; }
.fi.new { animation: justIn 1.6s ease-out; }

/* 결과 */
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-ctl); background: var(--glass-hi2); }
.tabs button { height: 34px; padding: 0 16px; border: 0; border-radius: calc(var(--r-ctl) - 3px); background: transparent; font-weight: 600; font-size: 14px; color: var(--ink); }
.tabs button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }
@supports (corner-shape: squircle) { .tabs, .tabs button { corner-shape: squircle; } }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar .search { flex: 1; min-width: 180px; height: 40px; }
.mth { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 7px; background: var(--glass-hi2); color: var(--sub); white-space: nowrap; }
.mth.bank { background: rgba(0,113,227,.08); color: #0066CC; }
.resulttbl { max-height: min(52vh, 460px); overflow: auto; }
.resulttbl thead th { position: sticky; top: 0; background: #fff; z-index: 1; }

/* 요청 */
.hero h1 { margin: 6px 0 10px; font-size: 40px; font-weight: 700; line-height: 1.2; letter-spacing: -.035em; text-wrap: balance; }
.hero p { margin: 0; color: var(--sub); font-size: 17px; line-height: 1.6; max-width: 34em; }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.price b { font-size: 32px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.price span { color: var(--sub); }
.steps { display: grid; gap: 0; }
.steps div { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.steps div:first-child { border-top: 0; }
.steps .k { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--fill); color: var(--sub); }
.steps .k.paid { background: var(--gold); color: #fff; }
.steps b { font-size: 15px; }
.steps small { display: block; color: var(--muted); font-size: 12.5px; }
.form2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form2 .full { grid-column: 1 / -1; }
.form2 .field + .field { margin-top: 0; }
.inp.sm { height: 48px; font-size: 16px; }
.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--sub); cursor: pointer; }
.agree input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--gold-d); flex: none; }

@media (max-width: 1000px) {
  .grid2, .form2, .checks, .kpis, .grid3 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .stats > div { min-width: 0; }
  .stats > div:nth-child(2n+1) { border-left: 0; }
  .stats > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .stats small { white-space: normal; }
  .top .chip { white-space: normal; height: auto; min-height: 36px; padding-block: 6px; }
  .ch { flex-wrap: wrap; }
  .toolbar .search { min-width: 0; }
  .tbl { max-width: 100%; }
  .proto { position: relative; left: auto; bottom: auto; margin: 10px 16px; overflow-x: auto; width: max-content; max-width: calc(100% - 32px); }
  .flow span em { display: none; }
  .fi { grid-template-columns: 48px 56px minmax(0, 1fr) auto; }
}

/* ---------- 가이드 · 요청 ---------- */
.gp { margin: 6px 0 0; font-size: 14px; color: var(--sub); line-height: 1.65; }
.sidecard .gp { margin-top: 8px; }
.qa { display: grid; gap: 10px; }
.qa > div { padding: 14px 18px; border-radius: var(--r-ctl); background: var(--fill); }
.qa b { display: block; font-size: 15px; }
.qa p { margin: 4px 0 0; font-size: 14px; color: var(--sub); line-height: 1.65; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.toc a { height: 32px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: var(--r-pill); background: var(--fill); color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; }
.toc a:hover { background: var(--glass-hi2); }
.gsec { scroll-margin-top: 16px; }
.steps div { grid-template-columns: auto minmax(0, 1fr) auto; }
.steps .k { width: auto; min-width: 30px; padding: 0 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
@supports (corner-shape: squircle) { .qa > div, .navitem, .todolist div { corner-shape: squircle; } }

/* ---------- 개발용 목록 ---------- */
.navlist { display: grid; gap: 8px; }
.navitem { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--r-ctl); background: var(--fill); text-decoration: none; color: var(--ink); transition: background .15s; }
.navitem:hover { background: var(--glass-hi2); }
.navitem b { font-size: 16px; }
.navitem .who2 { font-size: 12.5px; color: var(--gold-d); font-weight: 700; margin-left: 4px; }
.navitem small { display: block; color: var(--sub); font-size: 13px; }
.navitem code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
.todolist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.todolist div { padding: 10px 14px; border-radius: var(--r-ctl); border: 1px dashed var(--field-line); }
.todolist b { font-size: 14.5px; }
.todolist small { display: block; color: var(--sub); font-size: 12.5px; }
@media (max-width: 1000px) { .todolist { grid-template-columns: 1fr; } }

/* 배경 위에 놓이는 상단 칩·알약: 흰 바탕으로 또렷하게 */
.top .chip { height: 28px; padding: 0 12px; font-size: 12.5px; background: transparent; color: var(--sub); }
.top .pill { height: 28px; padding: 0 12px; font-size: 12.5px; }
.top .btn2 { height: 32px; }

/* ---------- 블록 정렬: 같은 줄의 카드는 높이를 맞추고, 목록은 남는 공간을 채운다 ---------- */
.grid2, .grid3 { align-items: stretch; }

    [7, '방명록', '안내판과 같은 꽃 무늬의 하드커버 방명록.', 24900]
  ];
  var SHIP = 3000, SHIP_FREE = 20000;  // 2만 원 이상 무료배송, 아니면 3천 원
  var cart = {};
  function drawShop() {
    $('#shopGrid').innerHTML = SHOP.map(function (p) {
      var q = cart[p[0]] || 0;
      return '<div class="prod"><div class="pimg" style="background-image:url(' + $('#shopGrid').dataset.base + p[0] + '.webp)">' + (p[4] ? '<span class="pbadge">' + p[4] + '</span>' : '') + '</div>' +
        '<b>' + p[1] + '</b><small>' + p[2] + '</small><div class="pfoot"><span class="pprice">' + won(p[3]) + '</span>' +
        (q ? '<span class="pq"><button type="button" data-q="' + p[0] + '" data-d="-1" aria-label="하나 빼기">−</button><em>' + (p[5] ? q * p[5] + '매' : q) + '</em><button type="button" data-q="' + p[0] + '" data-d="1" aria-label="하나 더">+</button></span>'
           : '<button type="button" class="btn2 rose" data-q="' + p[0] + '" data-d="' + (p[6] || 1) + '">담기</button>') + '</div></div>';
    }).join('');
    var n = 0, sum = 0;
    SHOP.forEach(function (p) { var q = cart[p[0]] || 0; if (q) n++; sum += q * p[3]; });
    var ship = sum >= SHIP_FREE ? 0 : SHIP;
    $('#shopSum').innerHTML = n ? '<span>' + n + '가지 · 용품 ' + won(sum) + ' · 배송비 ' + (ship ? won(ship) : '무료') + '</span><b>' + won(sum + ship) + '</b>'
      : '<span>2만 원 이상 무료배송 (그 밖에는 배송비 3,000원)</span>';
    $('#shopBuy').disabled = !n;
  }
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-shop]');
    if (o) {
      openModal('축의대 용품', '축의대에 올려 두면 하객도 담당자도 덜 헷갈립니다. 필요한 것만 골라 담으세요.',
        '<div class="shop" id="shopGrid" data-base="' + o.dataset.shop + '"></div>' +
        '<div class="shopbar"><button type="button" class="linkbtn" id="shopAll">권하는 대로 전부 담기</button><div class="ssum" id="shopSum"></div><button type="button" class="save" id="shopBuy">주문하기</button></div>', true);
      $('#modal').classList.add('shopm');
      drawShop();
      $('#shopAll').onclick = function () { SHOP.forEach(function (p) { if (!cart[p[0]]) cart[p[0]] = p[6] || 1; }); drawShop(); };
      $('#shopBuy').onclick = function () { toast('시안에서는 주문이 되지 않습니다'); };
      return;
    }
    var b = e.target.closest('[data-q]');
    if (b && $('#shopGrid')) { var id = +b.dataset.q; cart[id] = Math.max(0, Math.min(20, (cart[id] || 0) + +b.dataset.d)); drawShop(); }
  });


  var R = { groom: seedRows('groom'), bride: seedRows('bride') };
  var submitted = { groom: false, bride: false };
  var START = { groom: 230, bride: 200 }, LEDGER = { groom: 3, bride: 0 };
  var live = function (s) { return R[s].filter(function (r) { return !r.x; }); };
  var cash = function (s) { return live(s).reduce(function (a, r) { return a + r.amt; }, 0); };
  var tk = function (s) { return live(s).reduce(function (a, r) { return a + r.tk; }, 0) + LEDGER[s]; };
  var shown = false, view = 'all';
  var sides = function () { return view === 'all' ? ['groom', 'bride'] : [view]; };
  function card(s) {
    var last = R[s][R[s].length - 1];
    return '<h4>' + (s === 'groom' ? '신랑측 · 이용범' : '신부측 · 김홍매') + (submitted[s] ? '<span class="pill ok">제출 완료</span>' : '<span class="pill live">접수 중</span>') + '</h4>' +
      '<p class="muted" style="margin:4px 0 0;font-size:13px">마지막 저장 ' + (last ? last.t : '-') + ' · 입력 기기 1대</p>' +
      '<div class="kpis"><div class="kpi"><small>접수</small><b>' + live(s).length + '<span>건</span></b></div>' +
      '<div class="kpi"><small>현금</small><b>' + (shown ? kor(cash(s)).replace(' 원', '') : '••••') + '<span>' + (shown ? '원' : '') + '</span></b></div>' +
      '<div class="kpi"><small>식권 남음</small><b>' + (START[s] - tk(s)) + '<span>장</span></b></div></div>' +
      '<div class="row" style="margin-top:12px;border-top:1px solid var(--line)"><span>마지막 봉투</span><b>' + (last ? (last.anon ? '무기명' : esc(last.name)) + ' · ' + kor(last.amt) + ' · ' + last.t : '-') + '</b></div>';
  }
  function feedHTML(r, isNew) {
    return '<div class="fi' + (isNew ? ' new' : '') + '"><time>' + r.t + '</time><span class="sd ' + (r.side === 'groom' ? 'g' : 'b') + '">' + (r.side === 'groom' ? '신랑측' : '신부측') + '</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (r.anon ? '무기명' : esc(r.name)) + (r.x ? ' <span class="tag x">취소</span>' : '') + '</span><b>' + kor(r.amt) + '</b></div>';
  }
  function draw(newRow) {
    $('#cardG').innerHTML = card('groom'); $('#cardB').innerHTML = card('bride');
    $('#cardG').hidden = view === 'bride'; $('#cardB').hidden = view === 'groom';
    document.querySelectorAll('.vlab').forEach(function (x) { x.textContent = { all: '전체', groom: '신랑측', bride: '신부측' }[view]; });
    var all = sides().reduce(function (a, s) { return a.concat(R[s]); }, []).sort(function (a, b) { return a.t < b.t ? 1 : -1; });
    $('#feed').innerHTML = all.map(function (r) { return feedHTML(r, r === newRow); }).join('');
    $('#allCount').innerHTML = sides().reduce(function (a, s) { return a + live(s).length; }, 0) + '<span>건</span>';
    $('#allCash').textContent = won(sides().reduce(function (a, s) { return a + cash(s); }, 0));
    $('#allLast').textContent = all[0] ? all[0].t : '-';
  }
  $('#viewTabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; view = b.dataset.v; this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); draw(); });
  $('#allVeil').addEventListener('click', function () { shown = !this.classList.toggle('hide'); draw(); });
  var NAMES = ['김도윤', '이하준', '박서윤', '최지안', '정민서', '강유나', '조현우', '윤시우'], ni = 0, clock = 12 * 60 + 47;
  setInterval(function () {
    var s = Math.random() < .5 ? 'groom' : 'bride';
    if (ni >= NAMES.length) return;
    clock += 1;
    var r = { side: s, no: R[s].length + 1, name: NAMES[ni++], anon: false, amt: [50000, 50000, 100000, 30000][Math.floor(Math.random() * 4)], tk: 1, x: false, t: ('0' + Math.floor(clock / 60)).slice(-2) + ':' + ('0' + clock % 60).slice(-2) };
    R[s].push(r); draw(r);
  }, 6000);
  draw();

})();
</script>
</body>
</html>
