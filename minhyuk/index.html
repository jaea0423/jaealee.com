<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FCF8F4">
<title>The Wedding · 2026.10.10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Gowun+Batang:wght@700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#FCF8F4;--blush:#F8ECE7;--blush-2:#EED8D0;--petal:#F4D4CC;--rose:#C48A7E;--rose-d:#A3685C;--gold:#B79A6B;--ink:#2F2622;--sub:#5E514C;--muted:#9A8E88;--line:#EFE6E0}
*{box-sizing:border-box;margin:0;padding:0}
html,body,button{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
.phone{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 28px;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 0%,#FFF3EE 0%,var(--bg) 60%)}
@media (max-height:700px){.rule{margin:18px 0}.pad{grid-template-columns:repeat(3,62px);gap:10px 20px}.pad button{width:62px;height:62px}}
@media (min-width:700px){
  body{height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 25% 30%,#F6E1D9,transparent 70%),radial-gradient(60% 60% at 80% 75%,#EEF0E2,transparent 70%),#EFE5DF}
  .phone{width:390px;height:min(844px,calc(100vh - 70px));min-height:0;border-radius:48px;transform:translateZ(0);
    box-shadow:0 0 0 9px #FFFDFB,0 0 0 10px rgba(0,0,0,.08),0 50px 90px -40px rgba(70,40,30,.55)}
}
.fall{position:absolute;inset:0;pointer-events:none}
.fall i{position:absolute;top:-4%;border-radius:70% 0 70% 0;opacity:.8;background:linear-gradient(135deg,#fff,var(--petal) 60%);animation:drift linear infinite}
@keyframes drift{0%{top:-4%;transform:translateX(0) rotate(0)}100%{top:104%;transform:translateX(30px) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fall{display:none}}
.box{position:relative;width:100%;max-width:330px;text-align:center}
.eyebrow{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:12px;letter-spacing:.38em;color:var(--rose)}
h1{font-family:'Gowun Batang',serif;font-size:25px;font-weight:700;letter-spacing:.12em;margin-top:14px}
h1 span{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;color:var(--gold);margin:0 .45em;letter-spacing:0}
.when{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:15px;letter-spacing:.24em;color:var(--sub);margin-top:10px}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:28px 0 30px;color:var(--gold)}
.rule::before,.rule::after{content:"";width:46px;height:1px;background:currentColor;opacity:.5}
.rule svg{width:14px;height:14px}
p.d{font-size:15px;color:var(--sub)}
.pins{display:flex;justify-content:center;gap:18px;margin:18px 0 6px}
.pins i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--blush-2);transition:background .15s,border-color .15s,transform .15s}
.pins i.on{background:var(--rose);border-color:var(--rose);transform:scale(1.08)}
.pins.wait i{animation:pulse 1s ease-in-out infinite}
.pins.wait i:nth-child(2){animation-delay:.12s}.pins.wait i:nth-child(3){animation-delay:.24s}.pins.wait i:nth-child(4){animation-delay:.36s}
@keyframes pulse{50%{opacity:.35}}
.msg{min-height:20px;font-size:13px;color:var(--rose-d)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px 22px;justify-content:center;margin-top:10px}
.pad button{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.85);
  font:inherit;font-size:26px;font-weight:500;color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:background .12s,transform .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pad button:active,.pad button.hit{background:var(--blush);transform:scale(.94)}
.pad button.fn{border-color:transparent;background:transparent;color:var(--muted)}
.pad button.fn:active,.pad button.fn.hit{background:var(--blush)}
.pad button svg{width:24px;height:24px}
.pad[aria-disabled=true] button{pointer-events:none}
.foot{font-size:12px;color:var(--muted);margin-top:22px}
.box.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="phone">
  <div class="fall" id="fall" aria-hidden="true"></div>
  <div class="box" id="box">
    <div class="eyebrow">THE WEDDING OF</div>
    <h1>민혁<span>&amp;</span>은지</h1>
    <div class="when">2026 · 10 · 10</div>
    <div class="rule"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.1-2.4 4.3-2.4 3.7 0 5.9 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
    <div id="gate">
      <p class="d">전화번호 뒷자리를 입력해주세요</p>
      <div class="pins" id="pins" aria-live="polite"><i></i><i></i><i></i><i></i></div>
      <div class="msg" id="msg"></div>
      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="fn" data-k="reset" aria-label="처음부터 다시 입력"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
        <button data-k="0">0</button>
        <button class="fn" data-k="del" aria-label="한 글자 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9.5-5 5M11 9.5l5 5"/></svg></button>
      </div>
    </div>
    <div class="foot">2026년 10월 31일까지 열람할 수 있습니다.</div>
  </div>
</div>
<script>
(() => {
// 이 파일에는 하객 정보가 없습니다. 번호를 Supabase 함수로 보내, 맞을 때만 본문을 받아 옵니다.
// (아래 두 값은 공개되어도 되는 주소와 '공개(anon/publishable) 키'입니다. 비밀 키(service_role)는 절대 넣지 마세요.)
const SB_URL = 'https://tequnppstugefkhilaqs.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlcXVucHBzdHVnZWZraGlsYXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMTM3MTIsImV4cCI6MjEwNDg4OTcxMn0.OTzk47tHUYmavOysPJ_vKsTjKkcX3gt7UiAC0kjntqE';
const EXPIRES = new Date('2026-11-01T00:00:00+09:00');
const $ = id => document.getElementById(id);
for (let i = 0; i < 10; i++) { const p = document.createElement('i'), k = .6 + Math.random()*.7;
  p.style.cssText = `left:${Math.random()*96}%;width:${10*k}px;height:${8*k}px;animation-duration:${10+Math.random()*9}s;animation-delay:${-Math.random()*18}s`;
  $('fall').appendChild(p); }

if (Date.now() >= EXPIRES.getTime()) {
  $('gate').innerHTML = '<p class="d">열람 기간이 종료되었습니다.<br>감사합니다.</p>';
  return;
}
let pin = '', busy = false;
const dots = [...$('pins').children];
const paint = () => dots.forEach((d,i)=>d.classList.toggle('on', i < pin.length));
async function check(){
  busy = true; $('pad').setAttribute('aria-disabled','true'); $('pins').classList.add('wait'); $('msg').textContent = '';
  let msg = '';
  try {
    const headers = {'Content-Type':'application/json', 'apikey': SB_KEY};
    if (SB_KEY.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + SB_KEY; // 예전 방식(JWT) 키일 때만
    const res = await fetch(SB_URL.replace(/\/$/,'') + '/rest/v1/rpc/wedding_unlock', {method:'POST', headers, body: JSON.stringify({p_pin: pin}), cache:'no-store'});
    if (!res.ok) throw new Error('http');
    const out = await res.json();
    if (out && out.ok && typeof out.payload === 'string') { document.open(); document.write(out.payload); document.close(); return; }
    if (out && out.reason === 'locked') msg = '시도가 많아 잠시 막혔습니다. 잠시 후 다시 입력해 주세요.';
    else if (out && out.reason === 'expired') { $('gate').innerHTML = '<p class="d">열람 기간이 종료되었습니다.<br>감사합니다.</p>'; return; }
    else msg = '번호가 맞지 않습니다.';
  } catch (err) {
    msg = '연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
  }
  $('msg').textContent = msg;
  $('box').classList.remove('shake'); void $('box').offsetWidth; $('box').classList.add('shake');
  pin = ''; paint(); $('pins').classList.remove('wait'); $('pad').removeAttribute('aria-disabled'); busy = false;
}
function press(k){
  if (busy) return;
  if (k === 'reset') pin = '';
  else if (k === 'del') pin = pin.slice(0, -1);
  else if (/^\d$/.test(k) && pin.length < 4) { pin += k; if (pin.length === 1) $('msg').textContent = ''; }
  paint();
  if (pin.length === 4) setTimeout(check, 120); // 마지막 점이 찍힌 걸 보여준 뒤 확인
}
$('pad').addEventListener('click', e => { const t = e.target.closest('button'); if (t) press(t.dataset.k); });
// PC 키보드 입력도 지원
document.addEventListener('keydown', e => {
  let k = e.key; if (k === 'Backspace') k = 'del'; else if (k === 'Escape') k = 'reset'; else if (!/^\d$/.test(k)) return;
  e.preventDefault(); press(k);
  const btn = $('pad').querySelector(`[data-k="${k}"]`); if (btn) { btn.classList.add('hit'); setTimeout(()=>btn.classList.remove('hit'),120); }
});
})();
</script>
</body>
</html>
