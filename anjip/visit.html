<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120E0B">
<title>오시는 길 — 안집</title>
<meta name="description" content="분당 새마을로 골목, 한옥반점 맞은편. 주차 발렛 포함 1,000원. 365일 연중무휴.">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className += " pending";</script>
</head>
<body data-page="visit">

<section class="page-head"><img class="pic" src="img/hansang.jpg" alt="" data-img="visit.head.img"><div class="wrap"><h1 data-t="visit.head.title">오시는 길</h1><p data-t="visit.head.sub"></p></div></section>

<section class="sec">
  <div class="wrap visit">
    <div class="visit-l">
      <address><b data-t="info.addr2"></b>전화 <a href="#" class="num" data-tel></a></address>
      <div class="map-links"><a class="btn" id="lnk-naver" target="_blank" rel="noopener">네이버 지도</a><a class="btn" id="lnk-kakao" target="_blank" rel="noopener">카카오맵</a></div>
      <h3 data-t="visit.hoursTitle">영업시간</h3>
      <div class="hours" id="hours"></div>
    </div>
    <div class="sketch">
      <!-- 약도: 한옥반점 것과 같은 골목. 안집이 주인공이라 안집을 흰색으로 -->
      <svg viewBox="0 0 600 420" role="img" aria-label="약도">
        <!-- 재아 스케치(09-20)대로: 새마을로가 아래를 가로지르고 가운데서 51번길이 오른쪽 위로 갈라짐.
             51번길 위쪽(왼편)에 주차장·안집, 두 길 사이 쐐기 안에 한옥반점·작은 주차장, 볼보는 새마을로 위쪽 왼편.
             건물·주차장은 각 길에 맞춰 돌린 묶음(g transform) 안에 두고, 글자는 돌리지 않고 따로 놓음 -->
        <defs><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#7A7268"/></pattern></defs>
        <!-- 새마을로: 왼쪽 (0,275) → 오른쪽 (600,355), 폭 64 -->
        <g transform="rotate(7.6 0 275)">
          <rect x="-20" y="243" width="660" height="64" fill="#26221E"/>
          <line x1="-20" y1="275" x2="640" y2="275" stroke="#5C554C" stroke-width="1.2" stroke-dasharray="10 12"/>
          <rect x="60" y="188" width="130" height="52" fill="#1C1917" stroke="#9A9186" stroke-width="1.2"/>   <!-- 볼보 -->
        </g>
        <!-- 새마을로51번길: 갈림점 (240,300) 에서 오른쪽 위로, 폭 26 -->
        <g transform="rotate(-30 240 300)">
          <rect x="228" y="287" width="420" height="26" fill="#26221E"/>
          <rect x="260" y="230" width="70" height="56" fill="url(#dots)" stroke="#7A7268" stroke-width="1"/>            <!-- 주차장(큰) — 51번길 위쪽 -->
          <polygon points="330,244 360,244 360,286 330,286" fill="url(#dots)" stroke="#7A7268" stroke-width="1"/>       <!-- 주차장 이어짐(ㄱ자) -->
          <rect x="330" y="240" width="60" height="46" fill="#FFFFFF" stroke="#9A9186" stroke-width="1.2"/>            <!-- 안집 -->
          <rect x="352" y="318" width="60" height="34" fill="#1C1917" stroke="#9A9186" stroke-width="1.2"/>            <!-- 한옥반점 — 51번길 아래쪽(두 길 사이) -->
          <rect x="284" y="318" width="56" height="22" fill="url(#dots)" stroke="#7A7268" stroke-width="1"/>             <!-- 주차장(작은) -->
        </g>
        <text x="128" y="222" class="lbl" text-anchor="middle">볼보</text>
        <text x="128" y="237" class="lbl mute" text-anchor="middle" font-size="10">에이치모터스</text>
        <text x="266" y="238" class="lbl mute" text-anchor="middle">주차장</text>
        <text x="325" y="207" class="lbl light" text-anchor="middle">안집</text>
        <text x="381" y="266" class="lbl" text-anchor="middle">한옥반점</text>
        <text x="314" y="295" class="lbl mute" text-anchor="middle" font-size="10">주차장</text>
        <text x="470" y="178" class="road" text-anchor="middle" transform="rotate(-30 470 178)">새마을로51번길</text>
        <text x="300" y="395" class="road" text-anchor="middle">새마을로</text>
      </svg>
      <p class="cap" style="margin-top:10px" data-t="visit.mapCaption"></p>
      <h3 data-t="visit.parkingTitle">주차</h3>
      <div class="prose-s" data-paras="visit.parking"></div>
      <h3>이용 안내</h3>
      <ul class="facts" data-list="info.services"></ul>
      <h3 data-t="visit.transitTitle">대중교통</h3>
      <ul class="plain" data-list="visit.transit"></ul>
    </div>
  </div>
</section>

<script src="data/site.js"></script>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
