<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120E0B">
<title>오시는 길 — 안집</title>
<meta name="description" content="분당 새마을로 골목, 한옥반점 맞은편. 주차 발렛 포함 1,000원. 365일 연중무휴.">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className += " pending";</script>
</head>
<body data-page="visit">

<section class="page-head"><img class="pic" src="img/hansang.jpg" alt="" data-img="visit.head.img"><div class="wrap"><h1 data-t="visit.head.title">오시는 길</h1><p data-t="visit.head.sub"></p></div></section>

<section class="sec">
  <div class="wrap visit">
    <div class="visit-l">
      <address><b data-t="info.addr2"></b>전화 <a href="#" class="num" data-tel></a></address>
      <div class="map-links"><a class="btn" id="lnk-naver" target="_blank" rel="noopener">네이버 지도</a><a class="btn" id="lnk-kakao" target="_blank" rel="noopener">카카오맵</a></div>
      <h3 data-t="visit.hoursTitle">영업시간</h3>
      <div class="hours" id="hours"></div>
    </div>
    <div class="sketch">
      <!-- 약도: 한옥반점 것과 같은 골목. 안집이 주인공이라 안집을 흰색으로 -->
      <svg viewBox="0 0 600 420" role="img" aria-label="약도">
        <!-- 재아 스케치(09-20)를 약도로 정리한 것. 비율보다 관계가 중요: 새마을로에서 새마을로51번길로 꺾어 들어가면
             왼편에 주차장과 안집, 오른편(두 길 사이)에 한옥반점. 볼보(에이치모터스)는 새마을로에서 갈림길 못 미쳐 왼쪽.
             도형은 51번길 기울기(-37.7°)에 맞춰 좌표를 미리 계산해 두었고(work 없이 여기 숫자만), 글자는 돌리지 않음 -->
        <defs>
          <pattern id="pk" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#6E665B"/></pattern>
        </defs>
        <rect x="0" y="0" width="600" height="420" fill="#161412"/>
        <!-- 새마을로: 가로로 -->
        <rect x="0" y="306" width="600" height="62" fill="#2A2622"/>
        <line x1="0" y1="337" x2="600" y2="337" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="12 12"/>
        <text x="300" y="398" class="road" text-anchor="middle">새마을로</text>
        <!-- 새마을로51번길: 갈림점에서 오른쪽 위로 -->
        <polygon points="239.6,292.5 571.9,35.7 592.7,62.6 260.4,319.5" fill="#2A2622"/>
        <text x="469.0" y="98.8" class="road" text-anchor="middle" transform="rotate(-37.7 469.0 98.8)">새마을로51번길</text>
        <!-- 볼보 — 새마을로 위, 갈림길 왼쪽 -->
        <rect x="52" y="236" width="136" height="56" rx="6" fill="none" stroke="#7A7268" stroke-width="1.5"/>
        <text x="120" y="261" class="lbl" text-anchor="middle">볼보</text>
        <text x="120" y="277" class="lbl mute" text-anchor="middle">에이치모터스</text>
        <!-- 주차장 둘 -->
        <polygon points="213.4,212.9 279.9,161.6 322.7,216.9 256.3,268.3" fill="url(#pk)" stroke="#7A7268" stroke-width="1"/>
        <polygon points="315.7,283.0 355.2,252.5 369.9,271.5 330.4,302.0" fill="url(#pk)" stroke="#7A7268" stroke-width="1"/>
        <text x="268.1" y="219.9" class="lbl mute" text-anchor="middle"><tspan class="pk">P</tspan> 주차장</text>
        <text x="342.8" y="281.3" class="lbl mute" text-anchor="middle" font-size="10.5">P</text>
        <!-- 가게 둘 -->
        <polygon points="286.2,156.7 343.2,112.6 383.6,164.9 326.6,208.9" fill="#FFFFFF" stroke="#9A9186" stroke-width="1.2"/>
        <text x="334.9" y="165.8" class="lbl" style="fill:#0E0D0C" text-anchor="middle">안집</text>
        <polygon points="361.2,250.4 426.1,200.2 457.9,241.4 393.0,291.5" fill="#3A3530" stroke="#9A9186" stroke-width="1.2"/>
        <text x="409.5" y="250.9" class="lbl" style="fill:#FFFFFF" text-anchor="middle">한옥반점</text>
      </svg>
      <p class="cap" style="margin-top:10px" data-t="visit.mapCaption"></p>
      <h3 data-t="visit.parkingTitle">주차</h3>
      <div class="prose-s" data-paras="visit.parking"></div>
      <h3>이용 안내</h3>
      <ul class="facts" data-list="info.services"></ul>
      <h3 data-t="visit.transitTitle">대중교통</h3>
      <ul class="plain" data-list="visit.transit"></ul>
    </div>
  </div>
</section>

<script src="data/site.js"></script>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
