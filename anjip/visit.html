<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120E0B">
<title>오시는 길 — 안집</title>
<meta name="description" content="분당 새마을로 골목, 한옥반점 맞은편. 주차 발렛 포함 1,000원. 365일 연중무휴.">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className += " pending";</script>
</head>
<body data-page="visit">

<section class="page-head"><img class="pic" src="img/hansang.jpg" alt="" data-img="visit.head.img"><div class="wrap"><h1 data-t="visit.head.title">오시는 길</h1><p data-t="visit.head.sub"></p></div></section>

<section class="sec">
  <div class="wrap visit">
    <div class="visit-l">
      <address><b data-t="info.addr2"></b>전화 <a href="#" class="num" data-tel></a></address>
      <div class="map-links"><a class="btn" id="lnk-naver" target="_blank" rel="noopener">네이버 지도</a><a class="btn" id="lnk-kakao" target="_blank" rel="noopener">카카오맵</a></div>
      <h3 data-t="visit.hoursTitle">영업시간</h3>
      <div class="hours" id="hours"></div>
    </div>
    <div class="sketch">
      <!-- 약도: 한옥반점 것과 같은 골목. 안집이 주인공이라 안집을 흰색으로 -->
      <svg viewBox="0 0 600 420" role="img" aria-label="약도">
        <defs><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#8A7A66"/></pattern></defs>
        <g transform="rotate(-18 380 190)">
          <rect x="-80" y="172" width="760" height="34" fill="#2A211A"/>
          <rect x="160" y="70" width="150" height="90" fill="url(#dots)" stroke="#8A7A66" stroke-width="1"/>
          <rect x="340" y="76" width="104" height="70" fill="#FFFFFF"/>
          <polygon points="196,220 322,220 322,262" fill="url(#dots)" stroke="#8A7A66" stroke-width="1"/>
          <polygon points="342,220 420,220 420,282 382,294 342,278" fill="#1E1712" stroke="#A89882" stroke-width="1.2"/>
        </g>
        <text x="219" y="168" class="lbl mute" text-anchor="middle">주차장</text>
        <text x="367" y="115" class="lbl light" text-anchor="middle">안집</text>
        <text x="296" y="270" class="lbl mute" text-anchor="middle" font-size="10">주차장</text>
        <text x="401" y="255" class="lbl" text-anchor="middle">한옥반점</text>
        <text x="520" y="150" class="road" text-anchor="middle" transform="rotate(-18 520 150)">새마을로51번길</text>
        <rect x="-10" y="306" width="620" height="100" fill="#2A211A"/>
        <line x1="-10" y1="356" x2="610" y2="356" stroke="#6A5D4E" stroke-width="1.2" stroke-dasharray="10 12"/>
        <text x="300" y="392" class="road" text-anchor="middle">새마을로</text>
        <g transform="rotate(-8 75 178)"><rect x="18" y="146" width="114" height="64" fill="#1E1712" stroke="#A89882" stroke-width="1.2"/></g>
        <text x="75" y="175" class="lbl" text-anchor="middle">볼보</text>
        <text x="75" y="191" class="lbl mute" text-anchor="middle" font-size="10">에이치모터스</text>
      </svg>
      <p class="cap" style="margin-top:10px" data-t="visit.mapCaption"></p>
      <h3 data-t="visit.parkingTitle">주차</h3>
      <div class="prose-s" data-paras="visit.parking"></div>
      <h3>이용 안내</h3>
      <ul class="facts" data-list="info.services"></ul>
      <h3 data-t="visit.transitTitle">대중교통</h3>
      <ul class="plain" data-list="visit.transit"></ul>
    </div>
  </div>
</section>

<script src="data/site.js"></script>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
