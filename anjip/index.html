<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120E0B">
<title>안집 — 분당 간장게장 · 한우</title>
<meta name="description" content="1996년부터 분당 한자리를 지켜 온 한정식집 안집. 연평도산 암꽃게로 주문 즉시 담그는 간장게장과 숙성하지 않은 한우 1++ 생고기. 365일 연중무휴, 예약·포장·단체.">
<meta name="keywords" content="간장게장맛집, 게장맛집, 분당맛집, 분당소고기, 분당안집, 안집, 양념게장, 한우 안창살, 육사시미">
<meta property="og:title" content="안집 — 분당 간장게장 · 한우">
<meta property="og:description" content="삼십 년, 한자리의 간장게장 · 분당 새마을로">
<meta property="og:image" content="img/gejang.jpg">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className += " pending";</script><!-- 내용이 정해질 때까지 잠깐 숨김(js/content.js 가 풂) -->
</head>
<body data-page="home">

<!-- 첫 화면: 사진 세 장이 천천히 바뀝니다 -->
<section class="hero">
  <div class="slides">
    <div class="slide on" style="background-image:url(img/gejang.jpg)"></div>
    <div class="slide" style="background-image:url(img/crab-hands.jpg)"></div>
    <div class="slide" style="background-image:url(img/hansang.jpg)"></div>
  </div>
  <div class="hero-t">
    <h1 data-t="home.heroTitle">삼십 년, 한자리의 간장게장</h1>
    <p data-t="home.heroSub">분당 · 연평도 꽃게와 한우 1++ · 365일 연중무휴</p>
  </div>
  <button class="arr prev" aria-label="이전 사진"><svg viewBox="0 0 30 56"><path d="M24 4 4 28l20 24"/></svg></button>
  <button class="arr next" aria-label="다음 사진"><svg viewBox="0 0 30 56"><path d="m6 4 20 24L6 52"/></svg></button>
  <div class="dots"></div>
</section>

<!-- 소개 -->
<section class="s">
  <div class="wrap two">
    <figure><img src="img/crab-hands.jpg" alt="알이 꽉 찬 연평도 암꽃게" data-img="home.intro.img" data-alt="home.intro.imgAlt"></figure>
    <div class="t">
      <h2 data-t="home.intro.title">삼십 년째<br>같은 자리에서 담급니다</h2>
      <div data-paras="home.intro.paras"></div>
      <ul class="facts" data-list="info.services"></ul>
      <a class="more" href="about.html" data-t="home.intro.more">이야기 전체</a>
    </div>
  </div>
</section>

<!-- 대표 셋 -->
<section class="s">
  <div class="wrap">
    <div class="hd"><div><h2 data-t="home.menuSec.title">차림</h2><p data-t="home.menuSec.lead"></p></div><a class="more" href="menu.html" data-t="home.menuSec.more">차림 전체</a></div>
    <div class="sig" id="home-sig"></div>
  </div>
</section>

<!-- 방송 -->
<section class="s">
  <div class="wrap two rev">
    <div class="t">
      <h2 data-t="home.tvSec.title">방송에 소개된 간장게장</h2>
      <p data-t="home.tvSec.lead"></p>
      <ul class="tvlist" id="home-tv"></ul>
    </div>
    <figure><img src="img/yangnyeom.jpg" alt="양념게장" data-img="home.menuSec.img" data-alt="home.menuSec.imgAlt"></figure>
  </div>
</section>

<!-- 공간 -->
<section class="s">
  <div class="wrap">
    <div class="hd"><div><h2 data-t="home.spaceSec.title">공간</h2><p data-t="home.spaceSec.lead"></p></div></div>
    <div class="tiles" id="home-tiles"></div>
  </div>
</section>

<!-- 오시는 길·영업시간·연락 -->
<section class="s">
  <div class="wrap">
    <div class="info">
      <div>
        <h3>오시는 길</h3>
        <div class="v" data-t="info.addr2"></div>
        <p data-t="info.parking"></p>
        <div class="lk"><a class="more" href="visit.html" data-t="home.infoSec.visitMore">오시는 길 전체</a></div>
      </div>
      <div>
        <h3>영업시간</h3>
        <div id="home-hours"></div>
      </div>
      <div>
        <h3>연락</h3>
        <div class="v"><a href="#" data-tel></a></div>
        <p data-t="home.infoSec.telNote"></p>
      </div>
    </div>
  </div>
</section>

<!-- 마지막 띠: 전화 예약·포장 -->
<section class="band">
  <img src="img/hansang-full.jpg" alt="" data-img="home.band.img">
  <div class="in">
    <h2 data-t="home.band.title">예약 · 포장</h2>
    <p></p>
    <a class="btn" href="#" data-tel-btn data-t="home.band.button">전화하기</a>
  </div>
</section>

<script src="data/site.js"></script>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
