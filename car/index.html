<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>차량 연락</title>
<!-- 외부 의존성: Pretendard 웹폰트(jsDelivr CDN). 연결 실패 시 시스템 폰트로 대체됨 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
  :root{
    --bg:#0a0a0b;
    --surface:#141416;
    --surface-2:#1b1b1e;
    --line:#26262a;
    --ink:#f4f3f0;
    --ink-2:#b4b2ab;
    --ink-3:#7c7a74;
    --ok:#5fd39a;
    --danger:#ff7a6b;
    --radius:6px;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:17px; line-height:1.5; letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all; /* 한글 단어 중간 줄바꿈 방지 */
  }
  /* 모바일 전용: 넓은 화면에서도 휴대폰 폭으로 가운데 정렬 */
  .page{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* 상단 */
  .top{display:flex;justify-content:space-between;align-items:center;padding:30px 28px 0;position:relative;z-index:1}
  .brand{font-size:13px;font-weight:600;letter-spacing:.42em;color:var(--ink-3)}

  /* 메인 사진: 차 뒤로 은은한 조명, 바닥에 빛 번짐 */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:16dvh}
  .hero{position:relative;padding:0 12px}
  .hero::before{
    content:"";position:absolute;left:50%;top:44%;width:120%;height:90%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(255,255,255,.13), rgba(255,255,255,0) 72%);
    pointer-events:none;
  }
  .hero::after{
    content:"";position:absolute;left:12%;right:12%;bottom:10%;height:26px;
    background:radial-gradient(closest-side, rgba(0,0,0,.95), rgba(0,0,0,0));
    filter:blur(4px);pointer-events:none;
  }
  .hero img{position:relative;z-index:1;display:block;width:100%;height:auto;aspect-ratio:1280/600;object-fit:contain}

  /* 차량명·번호 */
  .plate-wrap{display:flex;justify-content:center;padding:28px 20px 0}
  .ident{text-align:center}
  .model{display:flex;justify-content:center;align-items:baseline;gap:8px;color:var(--ink-3)}
  .model .mk, .model .md{font-size:14px;font-weight:400;letter-spacing:.06em}
  .reg{margin-top:10px;font-size:26px;font-weight:600;letter-spacing:.06em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
  .reg .gap{display:inline-block;width:.32em}

  /* 기능 영역 */
  .actions{padding:40px 28px calc(40px + var(--safe-b))}
  .btn-primary{
    width:100%;height:52px;border:0;border-radius:4px;background:var(--ink);color:#0a0a0b;
    font:inherit;font-size:17px;font-weight:700;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
    box-shadow:0 16px 34px -18px rgba(255,255,255,.35);
    transition:transform .12s ease, opacity .2s;
  }
  .btn-primary:active{transform:scale(.985)}
  .btn-primary svg{width:19px;height:19px}

  .item{
    margin-top:10px;width:100%;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;
    border:1px solid var(--line);border-radius:4px;background:var(--surface);
    font:inherit;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .item:active{background:var(--surface-2)}
  /* 메인 화면 버튼 3개만 작게(팝업의 보내기 버튼은 그대로) */
  .actions .btn-primary,.actions .item{height:44px;font-size:15px}
  .actions .item{margin-top:8px}
  .item svg{width:19px;height:19px}


  /* 바텀시트 팝업 */
  .backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:10;
  }
  .backdrop.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:50%;top:50%;z-index:11;
    width:calc(100% - 32px);max-width:420px;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
    background:#121214;border:1px solid var(--line);border-radius:10px;
    padding:22px 20px 20px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
    opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.94);
    transition:opacity .2s ease, transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .sheet h2{margin:4px 0 4px;font-size:23px;font-weight:700;letter-spacing:-.02em}
  .sheet .sub{margin:0;color:var(--ink-2);font-size:15px}
  .x{flex:none;width:38px;height:38px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .x svg{width:18px;height:18px}

  .field{margin-top:22px}
  .label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600;margin-bottom:10px}
  .label .req{font-size:13px;font-weight:500;color:var(--ink-3)}
  .chips{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .chip{
    border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:12px 4px;
    font:inherit;font-size:14px;font-weight:500;letter-spacing:-.02em;color:var(--ink);cursor:pointer;transition:all .15s;
    white-space:nowrap;text-align:center;
  }
  @media (max-width:389px){.chip{font-size:13px;letter-spacing:-.03em}}  /* 작은 휴대폰에서도 한 줄 유지 */
  @media (max-width:340px){.chip{font-size:12px;padding:12px 2px}.sheet{padding:18px 14px 16px}}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#0a0a0b}
  textarea,input[type="tel"]{
    width:100%;border:1px solid var(--line);border-radius:4px;background:#0a0a0b;
    font:inherit;font-size:17px;color:var(--ink);padding:14px 16px;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  textarea{min-height:92px;resize:none;margin-top:10px}
  input[type="tel"]{height:56px;font-size:19px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  textarea:focus,input:focus{border-color:#8a8882;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .hint{margin-top:8px;font-size:13px;color:var(--ink-3);min-height:18px}
  .hint.err{color:var(--danger)}
  .count{text-align:right;font-size:12px;color:var(--ink-3);margin-top:6px}

  .submit{margin-top:26px}
  .btn-primary:disabled{opacity:.22;box-shadow:none;cursor:default}
  .spinner{width:20px;height:20px;border:2.5px solid rgba(0,0,0,.2);border-top-color:#0a0a0b;border-radius:50%;animation:spin .8s linear infinite;display:none}
  .loading .spinner{display:block}
  .loading .btn-label{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 전송 완료 */
  .done{display:none;text-align:center;padding:24px 4px 6px}
  .done.show{display:block}
  .done .mark{margin:4px auto 14px;display:grid;place-items:center}
  .done .mark svg{width:44px;height:44px;color:var(--ok)}
  .done h2{margin:0 0 8px}
  .done p{margin:0;color:var(--ink-2);font-size:16px;line-height:1.6}
  .done .meta{margin-top:16px;font-size:13px;color:var(--ink-3)}
  .btn-ghost{
    margin-top:24px;width:100%;height:56px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
    font:inherit;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .form.hide{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <section class="plate-wrap">
    <div class="ident">
      <div class="model"><span class="mk">TESLA</span><span class="md">Model Y</span></div>
      <div class="reg" id="plateText"></div>
    </div>
  </section>
  </div>

  <main class="actions">
    <button class="btn-primary" type="button" data-open="move">
      이동 주차 요청
    </button>

    <button class="item" type="button" data-open="accident">
      사고·접촉 알림
    </button>

    <button class="item" type="button" data-open="other">
      기타
    </button>

  </main>
</div>

<!-- 팝업(바텀시트) -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

  <form class="form" id="form" novalidate>
    <div class="sheet-head">
      <div>
        <h2 id="sheetTitle"></h2>
      </div>
      <button class="x" type="button" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="field">
      <div class="label"><span id="reasonLabel">사유</span></div>
      <div class="chips" id="chips"></div>
      <textarea id="detail" maxlength="200" aria-label="상세 내용"></textarea>
      <div class="count"><span id="cnt">0</span>/200</div>
    </div>

    <div class="field">
      <label class="label" for="phone">연락받을 전화번호</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13">
      <div class="hint" id="phoneHint"></div>
    </div>

    <div class="submit">
      <button class="btn-primary" id="submitBtn" type="submit" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">차주에게 보내기</span>
      </button>
    </div>
  </form>

  <div class="done" id="done">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg></div>
    <h2 id="doneTitle">차주에게 전송되었습니다</h2>
    <p id="doneText"></p>
    <div class="meta" id="doneMeta"></div>
    <button class="btn-ghost" type="button" data-close>닫기</button>
  </div>
</div>

<script>
/* ===== 설정 ===== */
const CONFIG = {
  plate: "12호3456",
  // 텔레그램 연결 시 서버(예: Cloudflare Worker) 주소를 넣으세요.
  // 봇 토큰은 절대 이 HTML에 넣지 않습니다(누구나 소스를 볼 수 있음).
  endpoint: "",
  cooldownSec: 60 // 같은 기기에서 연속 전송 제한
};

/* 요청 종류별 문구·빠른 사유 */
const TYPES = {
  move: {
    title: "이동 주차 요청",
    chips: ["통행에 방해돼요", "급한 상황이에요"],
    done: ""
  },
  accident: {
    title: "사고·접촉 알림",
    chips: ["제 차와 접촉했어요", "접촉을 목격했어요"],
    done: "알려 주셔서 감사합니다.<br>확인 즉시 연락드리겠습니다."
  },
  other: {
    title: "기타 연락",
    chips: [],
    done: "내용을 전달했습니다.<br>확인 후 연락드리겠습니다."
  }
};

/* ===== 요소 ===== */
const $ = (id) => document.getElementById(id);
const sheet = $("sheet"), backdrop = $("backdrop"), form = $("form"), done = $("done");
const chipsEl = $("chips"), detail = $("detail"), phone = $("phone"), hint = $("phoneHint");
const submitBtn = $("submitBtn");
let current = "move", selected = "";

/* 차량 번호 표시: "12호3456" → "12호 3456" */
(function renderPlate(){
  const raw = CONFIG.plate.replace(/\s/g,"");
  const m = raw.match(/^(\d{2,3}[가-힣])(\d{4})$/);
  $("plateText").innerHTML = m ? `${m[1]}<span class="gap"></span>${m[2]}` : CONFIG.plate;
})();

/* ===== 팝업 열기/닫기 ===== */
function openSheet(type){
  current = type; selected = "";
  const t = TYPES[type];
  $("sheetTitle").textContent = t.title;
  chipsEl.innerHTML = "";
  chipsEl.style.display = t.chips.length ? "grid" : "none";
  $("reasonLabel").textContent = t.chips.length ? "사유" : "내용";
  detail.style.marginTop = t.chips.length ? "10px" : "0";
  t.chips.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = c;
    b.setAttribute("aria-pressed","false");
    b.onclick = () => {
      // 하나만 선택(다시 누르면 해제)
      selected = selected === c ? "" : c;
      [...chipsEl.children].forEach(x => x.setAttribute("aria-pressed", String(x.textContent === selected)));
      validate();
    };
    chipsEl.appendChild(b);
  });
  form.classList.remove("hide"); done.classList.remove("show");
  form.reset(); $("cnt").textContent = "0";
  setHint("", false);
  validate();
  backdrop.classList.add("open"); sheet.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  backdrop.classList.remove("open"); sheet.classList.remove("open");
  document.body.style.overflow = "";
  submitBtn.classList.remove("loading");
}
document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.open)));
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
backdrop.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ===== 입력 처리 ===== */
detail.addEventListener("input", () => { $("cnt").textContent = detail.value.length; validate(); });

// 숫자만 남기고 010-1234-5678 형태로 자동 하이픈
phone.addEventListener("input", () => {
  const d = phone.value.replace(/\D/g, "").slice(0, 11);
  phone.value = d.length < 4 ? d : d.length < 8 ? `${d.slice(0,3)}-${d.slice(3)}` : `${d.slice(0,3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`;
  validate();
});
phone.addEventListener("blur", () => {
  if (phone.value && !phoneOk()) setHint("휴대폰 번호를 다시 확인해 주세요.", true);
});

const phoneOk = () => /^01[016789]\d{7,8}$/.test(phone.value.replace(/\D/g, ""));
function setHint(msg, err){ hint.textContent = msg; hint.classList.toggle("err", err); }
function validate(){
  const reasonOk = selected || detail.value.trim().length > 0;
  if (phoneOk()) setHint("", false);
  submitBtn.disabled = !(reasonOk && phoneOk());
}

/* ===== 전송 ===== */
function cooldownLeft(){
  try {
    const last = Number(localStorage.getItem("car_req_last") || 0);
    return Math.max(0, Math.ceil(CONFIG.cooldownSec - (Date.now() - last) / 1000));
  } catch { return 0; }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (submitBtn.disabled) return;
  const left = cooldownLeft();
  if (left > 0) { setHint(`방금 보내셨어요. ${left}초 뒤에 다시 보낼 수 있습니다.`, true); return; }

  const payload = {
    type: current,
    typeLabel: TYPES[current].title,
    plate: CONFIG.plate,
    reason: selected,
    detail: detail.value.trim(),
    phone: phone.value,
    sentAt: new Date().toISOString()
  };

  submitBtn.classList.add("loading"); submitBtn.disabled = true;
  try {
    if (CONFIG.endpoint) {
      const res = await fetch(CONFIG.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    } else {
      // 미리보기: 실제 전송 없음
      console.log("[미리보기] 전송 데이터", payload);
      await new Promise(r => setTimeout(r, 700));
    }
    try { localStorage.setItem("car_req_last", String(Date.now())); } catch {}
    showDone();
  } catch (err) {
    submitBtn.classList.remove("loading"); validate();
    setHint("전송에 실패했습니다. 잠시 후 다시 시도해 주세요.", true);
  }
});

function showDone(){
  if (navigator.vibrate) navigator.vibrate(18);
  form.classList.add("hide");
  $("doneText").innerHTML = TYPES[current].done;
  $("doneText").style.display = TYPES[current].done ? "" : "none";
  const t = new Date();
  $("doneMeta").textContent = `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} 전송 · 연락처 ${phone.value}`;
  done.classList.add("show");
  sheet.scrollTop = 0;
}
</script>
</body>
</html>
