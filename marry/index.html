<!doctype html>
<html lang="ko">
<head>

<meta name="theme-color" content="#FCF8F4">
<title>The Wedding · 2026.10.10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Gowun+Batang:wght@700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#FCF8F4;--blush:#F8ECE7;--blush-2:#EED8D0;--petal:#F4D4CC;--rose:#C48A7E;--rose-d:#A3685C;--gold:#B79A6B;--ink:#2F2622;--sub:#5E514C;--muted:#9A8E88;--line:#EFE6E0}
*{box-sizing:border-box;margin:0;padding:0}
html,body,button{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
.phone{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 28px;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 0%,#FFF3EE 0%,var(--bg) 60%)}
@media (max-height:700px){.rule{margin:18px 0}.pad{grid-template-columns:repeat(3,62px);gap:10px 20px}.pad button{width:62px;height:62px}}
@media (min-width:700px){
  body{height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 25% 30%,#F6E1D9,transparent 70%),radial-gradient(60% 60% at 80% 75%,#EEF0E2,transparent 70%),#EFE5DF}
  .phone{width:390px;height:min(844px,calc(100vh - 70px));min-height:0;border-radius:48px;transform:translateZ(0);
    box-shadow:0 0 0 9px #FFFDFB,0 0 0 10px rgba(0,0,0,.08),0 50px 90px -40px rgba(70,40,30,.55)}
}
.fall{position:absolute;inset:0;pointer-events:none}
.fall i{position:absolute;top:-4%;border-radius:70% 0 70% 0;opacity:.8;background:linear-gradient(135deg,#fff,var(--petal) 60%);animation:drift linear infinite}
@keyframes drift{0%{top:-4%;transform:translateX(0) rotate(0)}100%{top:104%;transform:translateX(30px) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fall{display:none}}
.box{position:relative;width:100%;max-width:330px;text-align:center}
.eyebrow{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:12px;letter-spacing:.38em;color:var(--rose)}
h1{font-family:'Gowun Batang',serif;font-size:25px;font-weight:700;letter-spacing:.12em;margin-top:14px}
h1 span{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;color:var(--gold);margin:0 .45em;letter-spacing:0}
.when{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:15px;letter-spacing:.24em;color:var(--sub);margin-top:10px}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:28px 0 30px;color:var(--gold)}
.rule::before,.rule::after{content:"";width:46px;height:1px;background:currentColor;opacity:.5}
.rule svg{width:14px;height:14px}
p.d{font-size:15px;color:var(--sub)}
.pins{display:flex;justify-content:center;gap:18px;margin:18px 0 6px}
.pins i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--blush-2);transition:background .15s,border-color .15s,transform .15s}
.pins i.on{background:var(--rose);border-color:var(--rose);transform:scale(1.08)}
.pins.wait i{animation:pulse 1s ease-in-out infinite}
.pins.wait i:nth-child(2){animation-delay:.12s}.pins.wait i:nth-child(3){animation-delay:.24s}.pins.wait i:nth-child(4){animation-delay:.36s}
@keyframes pulse{50%{opacity:.35}}
.msg{min-height:20px;font-size:13px;color:var(--rose-d)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px 22px;justify-content:center;margin-top:10px}
.pad button{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.85);
  font:inherit;font-size:26px;font-weight:500;color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:background .12s,transform .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pad button:active,.pad button.hit{background:var(--blush);transform:scale(.94)}
.pad button.fn{border-color:transparent;background:transparent;color:var(--muted)}
.pad button.fn:active,.pad button.fn.hit{background:var(--blush)}
.pad button svg{width:24px;height:24px}
.pad[aria-disabled=true] button{pointer-events:none}
.foot{font-size:12px;color:var(--muted);margin-top:22px}
.box.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="phone">

      <p class="d">전화번호 뒷자리를 입력해주세요</p>

        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>

      </div>
    </div>
    <div class="foot">2026년 10월 31일까지 열람할 수 있습니다.</div>
  </div>
</div>
<script>
const DEMO="<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"robots\" content=\"noindex, nofollow, noarchive\">\n<meta name=\"theme-color\" content=\"#FCF8F4\">\n<title>민혁 · 은지 축의금 정산<\/title>\n<!-- 장식: Cormorant(영문)·고운바탕(한글) / 정보: Pretendard -->\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Gowun+Batang:wght@400;700&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css\" media=\"print\" onload=\"this.media='all'\">\n<style>\n:root{\n  --bg:#FCF8F4; --paper:#FFFFFF; --blush:#F8ECE7; --blush-2:#EED8D0; --petal:#F4D4CC;\n  --rose:#C48A7E; --rose-d:#A3685C; --gold:#B79A6B; --sage:#93A47E;\n  --ink:#2F2622; --sub:#5E514C; --muted:#9A8E88; --line:#EFE6E0;\n  --en:'Cormorant Garamond',serif; --ko:'Gowun Batang',serif;\n  --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%;touch-action:manipulation}\nbody,button,input{touch-action:manipulation}\nbody{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;\n  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}\n\n/* ── 기기 프레임: 모바일은 화면 그대로, 넓은 화면에서는 폰이 떠 있는 형태 ── */\n.backdrop{display:none}\n.phone{position:relative;background:var(--bg);overflow-x:hidden}\n@media (min-width:700px){\n  body{height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#EADFD8}\n  .backdrop{display:block;position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) saturate(1.1);opacity:.55}\n  .phone{width:390px;height:min(844px,calc(100vh - 70px));border-radius:48px;overflow:hidden;transform:translateZ(0);\n    box-shadow:0 0 0 9px #FFFDFB,0 0 0 10px rgba(0,0,0,.08),0 50px 90px -40px rgba(70,40,30,.55)}\n  .screen{height:100%;overflow-y:auto;scrollbar-width:none}\n  .screen::-webkit-scrollbar{display:none}\n}\n\n/* ── 인트로: 결혼… → 축하해! ── */\n.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(120% 70% at 50% 40%,#FFF6F1 0%,var(--bg) 70%);\n  transition:opacity .9s ease,visibility .9s}\n.intro.out{opacity:0;visibility:hidden}\n.intro .ln{position:absolute;z-index:2;font-family:var(--ko);font-weight:700;color:var(--ink);opacity:0;transition:opacity .7s,transform .7s}\n.intro .l1{font-size:34px;letter-spacing:.06em;transform:translateY(8px)}\n/* 형 → , → 결혼 → ... 순서로 하나씩 등장 (인트로가 시작된 뒤부터 재생) */\n.intro .l1 .dot{display:inline-block;opacity:0}\n.intro.s1 .dot{animation:dot .45s ease-out forwards}\n@keyframes dot{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.intro .l2{font-size:44px;color:var(--rose-d);transform:scale(.85)}\n.intro.s1 .l1{opacity:1;transform:none}\n/* 앞 문구가 완전히 사라진 뒤(.4s) 다음 문구 등장 → 겹침 방지 */\n.intro.s2 .l1{opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s}\n.intro.s2 .l2{opacity:1;transform:none;transition:opacity .5s .4s,transform .7s .4s cubic-bezier(.2,1.6,.4,1)}\n.intro .tap{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));font-size:12px;letter-spacing:.2em;color:var(--muted);font-family:var(--en);font-style:italic}\n.burst i{position:absolute;left:50%;top:50%;border-radius:70% 0 70% 0;opacity:0;background:var(--c)}\n.intro.s2 .burst i{animation:burst 2.2s cubic-bezier(.12,.75,.3,1) forwards;animation-delay:calc(.45s + var(--d))}\n@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.3)}10%{opacity:1}\n  75%{opacity:.9}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) + 60px)) rotate(var(--r)) scale(1)}}\n.intro .glow{position:absolute;width:260px;height:260px;border-radius:50%;opacity:0;transform:scale(.6);\n  background:radial-gradient(circle,rgba(248,214,204,.75),rgba(255,236,200,.35) 45%,transparent 70%);transition:opacity .9s .4s,transform 1.2s .4s ease-out}\n.intro.s2 .glow{opacity:1;transform:scale(1.25)}\n.intro .fall{z-index:0}\n\n/* ── 표지 ── */\n.hero{position:relative;overflow:hidden}\n.hero img{display:block;width:100%;height:auto}\n.hero::after{content:\"\";position:absolute;inset:auto 0 0;height:28%;background:linear-gradient(to bottom,rgba(252,248,244,0),var(--bg))}\n.fall{position:absolute;inset:0;pointer-events:none;z-index:1}\n.fall i{position:absolute;top:-4%;width:10px;height:8px;border-radius:70% 0 70% 0;opacity:.8;\n  background:linear-gradient(135deg,#fff,var(--petal) 60%);animation:drift linear infinite}\n@keyframes drift{0%{top:-4%;transform:translateX(0) rotate(0)}100%{top:100%;transform:translateX(30px) rotate(360deg)}}\n.cover{text-align:center;padding:6px 24px 0;position:relative;z-index:2}\n.eyebrow{font-family:var(--en);font-weight:500;font-size:12px;letter-spacing:.38em;color:var(--rose)}\n.names{font-family:var(--ko);font-size:26px;font-weight:700;letter-spacing:.12em;margin-top:12px;color:var(--ink)}\n.names .and{display:inline-block;font-family:var(--en);font-style:italic;font-weight:400;font-size:26px;color:var(--gold);margin:0 .45em;letter-spacing:0}\n.when{font-family:var(--en);font-size:15px;letter-spacing:.24em;color:var(--sub);margin-top:10px}\n.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:30px auto 0;color:var(--gold)}\n.rule::before,.rule::after{content:\"\";width:46px;height:1px;background:currentColor;opacity:.5}\n.rule svg{width:14px;height:14px}\n\nmain{padding:0 22px}\nsection{margin-top:60px}\n.hd{text-align:center;margin-bottom:20px;font-family:var(--en);font-weight:500;font-size:15px;letter-spacing:.34em;color:var(--rose-d);\n  display:flex;align-items:center;justify-content:center;gap:12px}\n.hd::before,.hd::after{content:\"\";width:22px;height:1px;background:var(--gold);opacity:.45}\n\n/* 축하 메시지 */\n.letter{text-align:center}\n.letter figure{margin:0 auto;width:220px;height:220px;border-radius:50%;overflow:hidden;background:var(--paper);\n  box-shadow:0 0 0 6px #fff,0 0 0 7px var(--blush-2),0 22px 40px -24px rgba(120,70,55,.6)}\n.letter figure img{display:block;width:100%;height:100%;object-fit:cover;object-position:28% 22%}\n.letter p{font-family:var(--ko);font-size:16px;line-height:2.05;color:var(--sub);margin-top:28px;word-break:keep-all}\n.letter p b{color:var(--ink)}\n.letter .sign{display:block;margin-top:16px;font-family:var(--en);font-style:italic;font-size:19px;color:var(--rose-d)}\n\n/* 요약 */\n.sum{background:var(--paper);border-radius:22px;padding:30px 22px 24px;text-align:center;border:1px solid var(--line)}\n.sum .lab{font-size:13px;color:var(--muted);letter-spacing:.06em}\n.sum .num{font-size:36px;font-weight:800;letter-spacing:-.015em;margin-top:4px}\n/* 총액은 기본 흐림(곁눈질 방지), 누르면 또렷하게 */\n.veil{position:relative;display:block;width:100%;cursor:pointer;border-radius:16px;padding:2px 0 6px}\n.veil .num,.veil .kor{transition:filter .5s ease,opacity .5s ease}\n.veil.hide .num{filter:blur(14px);opacity:.75}\n.veil.hide .kor{filter:blur(7px);opacity:.7}\n.veil .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--en);font-size:15px;font-weight:500;letter-spacing:.34em;padding-left:.34em;color:var(--rose-d);\n  opacity:0;transition:opacity .4s;pointer-events:none}\n.veil.hide .hint{opacity:1}\n.sum .num small{font-size:19px;font-weight:700;margin-left:2px}\n.sum .kor{font-size:12.5px;color:var(--rose-d);margin-top:2px}\n.sum .stats{display:grid;grid-template-columns:1fr 1fr;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}\n.sum .stats div+div{border-left:1px solid var(--line ); }\n}\nfunction go(p){\n  const np = Math.max(0, Math.min(PAGES-1, p)); if (np === page) return;\n  const dir = np > page ? 1 : -1; page = np; render(dir);\n  // 장부 머리가 화면 위로 지나갔으면 다시 보이게\n  const sc = scroller(), top = $('book').getBoundingClientRect().top - (desktop() ? $('screen').getBoundingClientRect().top : 0);\n  if (top < 0) sc.scrollBy({top: top - 16, behavior:'smooth'});\n}\n$('prev').onclick = () => go(page-1);\n$('next').onclick = () => go(page+1);\n$('q').addEventListener('input', () => render(0));\nlet sx=null, sy=0;\n$('list').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});\n$('list').addEventListener('touchend',e=>{ if(sx===null||$('q').value.trim()) return;\n  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;\n  if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) go(page+(dx<0?1:-1)); });\nrender(0);\n\n// ── 내려받기 ──\nfunction toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200); }\nfunction b64Blob(b64,type){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }\nfunction save(blob,name){\n  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;\n  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('저장했습니다');\n}\n$('dXlsx').onclick=()=>save(b64Blob(XLSX_B64,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),BASE+'.xlsx');\n$('dTxt').onclick=()=>save(b64Blob(TXT_B64,'text/plain;charset=utf-8'),BASE+'.txt');\n\n// 이미지는 외부 라이브러리 없이 Canvas로 직접 그림\nconst C={bg:'#FCF8F4',paper:'#FFFFFF',ink:'#2F2622',sub:'#5E514C',muted:'#9A8E88',rose:'#C48A7E',roseD:'#A3685C',gold:'#B79A6B',line:'#EFE6E0',blush:'#F8ECE7'};\nconst F={en:\"'Cormorant Garamond', serif\", ko:\"'Gowun Batang', serif\", sans:\"Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif\"};\nasync function ready(){ try{ await Promise.all(['italic 400 60px \"Cormorant Garamond\"','500 30px \"Cormorant Garamond\"','700 40px \"Gowun Batang\"','400 20px Pretendard','700 40px Pretendard','800 40px Pretendard'].map(f=>document.fonts.load(f))); }catch(e){} }\nfunction txt(x,s,px,py,font,color,align='left',ls=0){ x.font=font; x.fillStyle=color; x.textAlign=align; if('letterSpacing' in x) x.letterSpacing=ls+'px'; x.fillText(s,px,py); if('letterSpacing' in x) x.letterSpacing='0px'; }\nfunction rr(x,px,py,w,h,r,fill,stroke){ x.beginPath(); x.roundRect(px,py,w,h,r); if(fill){x.fillStyle=fill;x.fill();} if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke();} }\nconst canvasBlob = cv => new Promise(r=>cv.toBlob(r,'image/png'));\nconst loadImg = src => new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });\n\n$('dCard').onclick=async()=>{\n  const btn=$('dCard'); btn.disabled=true; await ready();\n  const W=1080,H=1660, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');\n  x.fillStyle=C.bg; x.fillRect(0,0,W,H);\n  const img=await loadImg(PHOTO), ph=900, sh=img.width*ph/W;\n  // 사진 하단을 투명하게 지워 배경과 경계 없이 섞이게 함\n  const pc=document.createElement('canvas'); pc.width=W; pc.height=ph; const px=pc.getContext('2d');\n  px.drawImage(img,0,img.height*0.05,img.width,sh,0,0,W,ph);\n  const m=px.createLinearGradient(0,ph-300,0,ph); m.addColorStop(0,'#000'); m.addColorStop(1,'rgba(0,0,0,0)');\n  px.globalCompositeOperation='destination-in'; px.fillStyle=m; px.fillRect(0,0,W,ph);\n  x.drawImage(pc,0,0);\n  txt(x,'THE WEDDING OF',W/2,ph-6,`500 28px ${F.en}`,C.rose,'center',10);\n  txt(x,'한민혁',W/2-120,ph+76,`700 54px ${F.ko}`,C.ink,'center',6);\n  txt(x,'&',W/2,ph+74,`italic 400 54px ${F.en}`,C.gold,'center');\n  txt(x,'현은지',W/2+120,ph+76,`700 54px ${F.ko}`,C.ink,'center',6);\n  txt(x,'2026 · 10 · 10 · SAT',W/2,ph+132,`500 30px ${F.en}`,C.sub,'center',6);\n  rr(x,90,ph+188,W-180,420,40,C.paper,C.line);\n  txt(x,'축의금 총액',W/2,ph+262,`400 28px ${F.sans}`,C.muted,'center');\n  txt(x,won(total)+'원',W/2,ph+356,`800 86px ${F.sans}`,C.ink,'center');\n  txt(x,korean(total),W/2,ph+404,`400 25px ${F.sans}`,C.roseD,'center');\n  x.strokeStyle=C.line; x.lineWidth=2; x.beginPath(); x.moveTo(150,ph+446); x.lineTo(W-150,ph+446); x.moveTo(W/2,ph+470); x.lineTo(W/2,ph+576); x.stroke();\n  txt(x,ROWS.length+'건',W/2-225,ph+528,`700 48px ${F.sans}`,C.ink,'center'); txt(x,'축의금 건수',W/2-225,ph+570,`400 25px ${F.sans}`,C.muted,'center');\n  txt(x,tickets+'매',W/2+225,ph+528,`700 48px ${F.sans}`,C.ink,'center'); txt(x,'식권 합계(장부기준)',W/2+225,ph+570,`400 25px ${F.sans}`,C.muted,'center');\n  txt(x,\"Written by Jaea\",W/2,H-62,`italic 500 34px ${F.en}`,C.roseD,'center');\n  save(await canvasBlob(cv),BASE+'_요약.png'); btn.disabled=false;\n};\n\n$('dList').onclick=async()=>{\n  const btn=$('dList'); btn.disabled=true; await ready();\n  const W=1080, rowH=52, secH=64, top=270, L=60, R=W-60;\n  const H=top+ROWS.length*rowH+PAGES*secH+190, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');\n  x.fillStyle=C.bg; x.fillRect(0,0,W,H);\n  txt(x,'GUEST BOOK',W/2,110,`500 30px ${F.en}`,C.rose,'center',12);\n  txt(x,'한민혁 · 현은지 축의금 명부',W/2,180,`700 44px ${F.ko}`,C.ink,'center');\n  txt(x,'2026 · 10 · 10',W/2,226,`500 28px ${F.en}`,C.sub,'center',6);\n  let y=top;\n  for(let p=0;p<PAGES;p++){\n    const rows=ROWS.slice(p*PER,p*PER+PER);\n    rr(x,L,y+8,R-L,secH-16,14,C.blush);\n    txt(x,`${p+1} page`,L+24,y+46,`600 26px ${F.sans}`,C.roseD,'left',2);\n    y+=secH;\n    rows.forEach((r,i)=>{\n      if(i%2){ x.fillStyle=C.paper; x.fillRect(L,y,R-L,rowH); }\n      txt(x,String(r[0]),L+36,y+34,`600 21px ${F.sans}`,C.rose,'center');\n      txt(x,r[1],L+90,y+34,`600 25px ${F.sans}`,C.ink);\n      txt(x,won(r[2])+'원',R-120,y+34,`700 25px ${F.sans}`,C.ink,'right');\n      txt(x,r[3]+'매',R-24,y+34,`400 22px ${F.sans}`,C.muted,'right'); y+=rowH; });\n  }\n  x.strokeStyle=C.gold; x.lineWidth=2; x.beginPath(); x.moveTo(L,y+8); x.lineTo(R,y+8); x.stroke();\n  txt(x,`합계 ${ROWS.length}건`,L+24,y+60,`800 28px ${F.sans}`,C.ink);\n  txt(x,won(total)+'원',R-120,y+60,`800 28px ${F.sans}`,C.ink,'right');\n  txt(x,tickets+'매',R-24,y+60,`700 24px ${F.sans}`,C.ink,'right');\n  txt(x,'성명·소속은 봉투 원본 기준으로 최종 확인해 주세요 · 작성 이재아',W/2,H-48,`400 22px ${F.sans}`,C.muted,'center');\n  save(await canvasBlob(cv),BASE+'_명부.png'); btn.disabled=false;\n};\n})();\n<\/script>\n<\/body>\n<\/html>\n";
