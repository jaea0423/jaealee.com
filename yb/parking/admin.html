<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대경빌 주차 관리자</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<!-- ============================================================
     화면 1. PIN 입력
     ============================================================ -->
<section id="view-login">
  <h1 class="title">관리자 모드</h1>
  <p class="subtitle">PIN 6자리를 입력하세요.</p>

  <div class="card">
    <div class="field">
      <label for="pin">PIN / 비밀번호</label>
      <input type="password" id="pin" inputmode="numeric" autocomplete="current-password"
             placeholder="● ● ● ● ● ●">
    </div>
    <button class="btn btn-primary" id="btn-login">확인</button>
    <div id="login-msg"></div>
  </div>

  <!-- 잘못 누르고 들어온 사람을 위한 탈출구 -->
  <p style="text-align:center">
    <a class="back-link" href="index.html">← 돌아가기</a>
  </p>
</section>

<!-- ============================================================
     화면 2. 메뉴 (버튼 3개)
     ============================================================ -->
<section id="view-menu" class="hidden">
  <h1 class="title">관리자 모드</h1>
  <p class="subtitle">무엇을 하시겠습니까?</p>

  <div class="card">
    <button class="btn btn-primary" id="btn-go-register" style="margin-bottom:10px">등록</button>
    <button class="btn" id="btn-go-manage" style="margin-bottom:10px">관리</button>
    <button class="btn" id="btn-go-pin">PIN 변경</button>
  </div>

  <p style="text-align:center">
    <a class="back-link" href="index.html">← 첫 화면으로</a>
    &nbsp;·&nbsp;
    <a class="back-link" href="#" id="btn-logout">로그아웃</a>
  </p>
</section>

<!-- ============================================================
     화면 3-1. 등록 - 1단계(필수)
     ============================================================ -->
<section id="view-reg1" class="hidden">
  <div class="section-head">
    <button class="btn btn-sm btn-ghost" data-back="menu">← 뒤로</button>
    <h2>등록 (1/2) 필수</h2>
  </div>

  <div class="card">
    <div class="field">
      <label for="r-room">호실 <span class="req">*</span></label>
      <input type="text" id="r-room" placeholder="예: 201호">
    </div>

    <div class="field">
      <label for="r-start">등록 기간 <span class="req">*</span></label>
      <input type="date" id="r-start">
      <div class="hint">시작일</div>
      <input type="date" id="r-end" style="margin-top:10px">
      <div class="hint">종료일 (아래 버튼으로 빠르게 채울 수 있습니다)</div>
      <div class="chips" id="r-chips">
        <button type="button" class="chip" data-m="1">1개월</button>
        <button type="button" class="chip" data-m="3">3개월</button>
        <button type="button" class="chip" data-m="6">6개월</button>
        <button type="button" class="chip" data-m="12">12개월</button>
      </div>
    </div>

    <div class="field">
      <label for="r-plate">차량 번호 <span class="req">*</span></label>
      <input type="text" id="r-plate" placeholder="예: 123가 6456">
    </div>

    <button class="btn btn-primary" id="btn-reg-next">다음</button>
    <div id="reg1-msg"></div>
  </div>
</section>

<!-- ============================================================
     화면 3-2. 등록 - 2단계(선택)
     ============================================================ -->
<section id="view-reg2" class="hidden">
  <div class="section-head">
    <button class="btn btn-sm btn-ghost" data-back="reg1">← 뒤로</button>
    <h2>등록 (2/2) 선택</h2>
  </div>

  <div class="card">
    <div class="field">
      <label for="r-type">차량 종류</label>
      <input type="text" id="r-type" placeholder="예: 흰색 아반떼">
    </div>

    <div class="field">
      <label for="r-memo">메모</label>
      <textarea id="r-memo" placeholder="예: 지하 2번 자리 사용"></textarea>
    </div>

    <button class="btn btn-primary" id="btn-reg-save">등록하기</button>
    <div id="reg2-msg"></div>
  </div>
</section>

<!-- ============================================================
     화면 4. 관리 (목록)
     ============================================================ -->
<section id="view-manage" class="hidden">
  <div class="section-head">
    <button class="btn btn-sm btn-ghost" data-back="menu">← 뒤로</button>
    <h2>관리</h2>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-s="active">등록 중</button>
    <button class="tab"    data-s="upcoming">등록 예정</button>
    <button class="tab"    data-s="expired">만료</button>
    <button class="tab"    data-s="deleted">삭제됨</button>
  </div>

  <div class="rows" id="rows"></div>
  <div class="empty hidden" id="rows-empty"></div>
</section>

<!-- ============================================================
     화면 5. 수정
     ============================================================ -->
<section id="view-edit" class="hidden">
  <div class="section-head">
    <button class="btn btn-sm btn-ghost" data-back="manage">← 뒤로</button>
    <h2>차량 정보 수정</h2>
  </div>

  <div class="card">
    <div class="field">
      <label for="e-room">호실 <span class="req">*</span></label>
      <input type="text" id="e-room">
    </div>

    <div class="field">
      <label for="e-plate">차량 번호 <span class="req">*</span></label>
      <input type="text" id="e-plate">
    </div>

    <div class="field">
      <label for="e-start">등록 기간 <span class="req">*</span></label>
      <input type="date" id="e-start">
      <div class="hint">시작일</div>
      <input type="date" id="e-end" style="margin-top:10px">
      <div class="hint">종료일</div>
      <div class="chips" id="e-chips">
        <button type="button" class="chip" data-ext="1">+1개월</button>
        <button type="button" class="chip" data-ext="3">+3개월</button>
        <button type="button" class="chip" data-ext="6">+6개월</button>
        <button type="button" class="chip" data-ext="12">+12개월</button>
      </div>
      <div class="hint">종료일 기준으로 기간을 늘립니다. 날짜를 직접 고쳐도 됩니다.</div>
    </div>

    <div class="field">
      <label for="e-type">차량 종류</label>
      <input type="text" id="e-type">
    </div>

    <div class="field">
      <label for="e-memo">메모</label>
      <textarea id="e-memo"></textarea>
    </div>

    <button class="btn btn-primary" id="btn-edit-save" style="margin-bottom:10px">저장</button>

    <!-- 삭제되지 않은 차량일 때 -->
    <button class="btn btn-danger hidden" id="btn-edit-delete">삭제 (삭제된 차량으로 이동)</button>

    <!-- 이미 삭제된 차량일 때 -->
    <div class="btn-row hidden" id="deleted-actions">
      <button class="btn" id="btn-edit-restore">복구</button>
      <button class="btn btn-danger" id="btn-edit-purge">영구 삭제</button>
    </div>

    <div id="edit-msg"></div>
  </div>
</section>

<!-- ============================================================
     화면 6. PIN 변경
     ============================================================ -->
<section id="view-pin" class="hidden">
  <div class="section-head">
    <button class="btn btn-sm btn-ghost" data-back="menu">← 뒤로</button>
    <h2>PIN 변경</h2>
  </div>

  <div class="card">
    <div class="field">
      <label for="p-new">새 PIN 또는 비밀번호</label>
      <input type="password" id="p-new" autocomplete="new-password">
      <div class="hint">
        · PIN: 숫자 6자리<br>
        · 비밀번호: 8자 이상, 대문자·숫자·특수문자를 모두 포함
      </div>
    </div>

    <div class="field">
      <label for="p-new2">한 번 더 입력</label>
      <input type="password" id="p-new2" autocomplete="new-password">
    </div>

    <button class="btn btn-primary" id="btn-pin-save">변경하기</button>
    <div id="pin-msg"></div>
  </div>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  /* =========================================================
     0. 공통 도구
     ========================================================= */
  var db = null;          // Supabase 클라이언트
  var cache = [];         // 서버에서 받아온 차량 전체 목록
  var curTab = "active";  // 관리 화면에서 지금 보고 있는 탭
  var editId = null;      // 수정 중인 차량 id
  var draft = {};         // 등록 1단계에서 입력한 값을 잠시 담아 두는 곳

  var $ = function (id) { return document.getElementById(id); };

  // 화면 전환: 이름 하나만 보이게 하고 나머지는 숨깁니다
  var VIEWS = ["login", "menu", "reg1", "reg2", "manage", "edit", "pin"];
  function show(name) {
    VIEWS.forEach(function (v) {
      $("view-" + v).classList.toggle("hidden", v !== name);
    });
    window.scrollTo(0, 0);
  }

  // 메시지 박스 출력
  function say(boxId, text, kind) {
    var box = $(boxId);
    if (!text) { box.innerHTML = ""; return; }
    box.innerHTML = "";
    var d = document.createElement("div");
    d.className = "msg " + (kind === "ok" ? "ok" : "err");
    d.textContent = text;
    box.appendChild(d);
  }

  // 뒤로 버튼들 (data-back 속성에 적힌 화면으로 이동)
  document.querySelectorAll("[data-back]").forEach(function (b) {
    b.addEventListener("click", function () {
      var to = b.getAttribute("data-back");
      if (to === "manage") { loadAll().then(function(){ show("manage"); }); }
      else { show(to); }
    });
  });

  /* =========================================================
     1. 로그인
     ========================================================= */
  if (!configReady()) {
    say("login-msg", "설정이 아직 되지 않았습니다. config.js 를 먼저 채워 주세요.");
    $("btn-login").disabled = true;
  } else {
    db = makeClient();

    // 이미 로그인되어 있으면 바로 메뉴로 (새로고침해도 풀리지 않게)
    db.auth.getSession().then(function (res) {
      if (res.data.session) { show("menu"); }
    });
  }

  function doLogin() {
    var pw = $("pin").value.trim();
    if (pw.length < 6) { say("login-msg", "6자리 이상 입력해 주세요."); return; }

    $("btn-login").disabled = true;
    say("login-msg", "");

    db.auth.signInWithPassword({ email: CONFIG.ADMIN_EMAIL, password: pw })
      .then(function (res) {
        $("btn-login").disabled = false;
        if (res.error) {
          say("login-msg", "PIN이 올바르지 않습니다.");
          $("pin").value = "";
          $("pin").focus();
          return;
        }
        $("pin").value = "";
        show("menu");
      });
  }

  $("btn-login").addEventListener("click", doLogin);
  $("pin").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { doLogin(); }
  });

  $("btn-logout").addEventListener("click", function (e) {
    e.preventDefault();
    db.auth.signOut().then(function () { location.href = "index.html"; });
  });

  /* =========================================================
     2. 메뉴 버튼
     ========================================================= */
  $("btn-go-register").addEventListener("click", function () {
    // 폼 비우고 시작일을 오늘로 채워 둡니다
    ["r-room", "r-plate", "r-type", "r-memo", "r-end"].forEach(function (id) { $(id).value = ""; });
    $("r-start").value = todayStr();
    document.querySelectorAll("#r-chips .chip").forEach(function (c) { c.classList.remove("on"); });
    say("reg1-msg", ""); say("reg2-msg", "");
    show("reg1");
  });

  $("btn-go-manage").addEventListener("click", function () {
    loadAll().then(function () { show("manage"); });
  });

  $("btn-go-pin").addEventListener("click", function () {
    $("p-new").value = ""; $("p-new2").value = "";
    say("pin-msg", "");
    show("pin");
  });

  /* =========================================================
     3. 등록
     ========================================================= */
  // 기간 빠른 선택 버튼
  document.querySelectorAll("#r-chips .chip").forEach(function (c) {
    c.addEventListener("click", function () {
      var start = $("r-start").value || todayStr();
      $("r-start").value = start;
      $("r-end").value = addMonths(start, Number(c.getAttribute("data-m")));
      document.querySelectorAll("#r-chips .chip").forEach(function (x) { x.classList.remove("on"); });
      c.classList.add("on");
    });
  });

  $("btn-reg-next").addEventListener("click", function () {
    var room  = $("r-room").value.trim();
    var plate = $("r-plate").value.trim();
    var s     = $("r-start").value;
    var e     = $("r-end").value;

    if (!room)  { say("reg1-msg", "호실을 입력해 주세요."); return; }
    if (!s || !e) { say("reg1-msg", "등록 기간(시작일·종료일)을 정해 주세요."); return; }
    if (e < s)  { say("reg1-msg", "종료일이 시작일보다 빠릅니다."); return; }
    if (!plate) { say("reg1-msg", "차량 번호를 입력해 주세요."); return; }

    draft = { room: room, plate: plate, start_date: s, end_date: e };
    say("reg1-msg", "");
    show("reg2");
  });

  $("btn-reg-save").addEventListener("click", function () {
    draft.car_type = $("r-type").value.trim() || null;
    draft.memo     = $("r-memo").value.trim() || null;

    $("btn-reg-save").disabled = true;
    say("reg2-msg", "");

    db.from("vehicles").insert(draft).then(function (res) {
      $("btn-reg-save").disabled = false;
      if (res.error) {
        console.error(res.error);
        say("reg2-msg", "저장하지 못했습니다: " + res.error.message);
        return;
      }
      // 등록이 끝나면 첫 화면으로 돌아갑니다
      location.href = "index.html";
    });
  });

  /* =========================================================
     4. 관리 - 목록
     ========================================================= */
  function loadAll() {
    return db.from("vehicles")
      .select("*")
      .order("room", { ascending: true })
      .then(function (res) {
        if (res.error) { console.error(res.error); cache = []; }
        else { cache = res.data; }
        renderRows();
      });
  }

  document.querySelectorAll("#tabs .tab").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll("#tabs .tab").forEach(function (x) { x.classList.remove("on"); });
      t.classList.add("on");
      curTab = t.getAttribute("data-s");
      renderRows();
    });
  });

  function renderRows() {
    var today = todayStr();
    var box = $("rows");
    var emptyBox = $("rows-empty");
    box.innerHTML = "";

    var list = cache.filter(function (v) { return statusOf(v, today) === curTab; });

    if (list.length === 0) {
      emptyBox.textContent = "해당하는 차량이 없습니다.";
      emptyBox.classList.remove("hidden");
      return;
    }
    emptyBox.classList.add("hidden");

    list.forEach(function (v) {
      var st = statusOf(v, today);

      var btn = document.createElement("button");
      btn.className = "row";

      var main = document.createElement("div");
      main.className = "row-main";

      var p = document.createElement("div");
      p.className = "row-plate";
      p.textContent = v.plate;

      var sub = document.createElement("div");
      sub.className = "row-sub";
      sub.textContent = v.room + " · " + v.start_date + " ~ " + v.end_date
                        + (v.car_type ? " · " + v.car_type : "");

      main.appendChild(p);
      main.appendChild(sub);

      var badge = document.createElement("span");
      badge.className = "badge " + st;
      badge.textContent = STATUS_LABEL[st];

      btn.appendChild(main);
      btn.appendChild(badge);
      btn.addEventListener("click", function () { openEdit(v); });

      box.appendChild(btn);
    });
  }

  /* =========================================================
     5. 수정 / 삭제
     ========================================================= */
  function openEdit(v) {
    editId = v.id;
    $("e-room").value  = v.room;
    $("e-plate").value = v.plate;
    $("e-start").value = v.start_date;
    $("e-end").value   = v.end_date;
    $("e-type").value  = v.car_type || "";
    $("e-memo").value  = v.memo || "";
    say("edit-msg", "");

    // 삭제 상태에 따라 아래 버튼들을 바꿔 보여 줍니다
    $("btn-edit-delete").classList.toggle("hidden", v.deleted === true);
    $("deleted-actions").classList.toggle("hidden", v.deleted !== true);

    show("edit");
  }

  // 종료일 연장 버튼
  document.querySelectorAll("#e-chips .chip").forEach(function (c) {
    c.addEventListener("click", function () {
      var base = $("e-end").value || todayStr();
      var m = Number(c.getAttribute("data-ext"));
      // 종료일 다음 날부터 m개월 => 결과적으로 m개월 연장
      var [y, mo, d] = base.split("-").map(Number);
      var dt = new Date(y, mo - 1, d);
      dt.setMonth(dt.getMonth() + m);
      $("e-end").value = fmt(dt);
    });
  });

  $("btn-edit-save").addEventListener("click", function () {
    var room  = $("e-room").value.trim();
    var plate = $("e-plate").value.trim();
    var s     = $("e-start").value;
    var e     = $("e-end").value;

    if (!room || !plate || !s || !e) { say("edit-msg", "호실·차량번호·기간은 비울 수 없습니다."); return; }
    if (e < s) { say("edit-msg", "종료일이 시작일보다 빠릅니다."); return; }

    update({
      room: room, plate: plate, start_date: s, end_date: e,
      car_type: $("e-type").value.trim() || null,
      memo:     $("e-memo").value.trim() || null
    }, "저장했습니다.");
  });

  $("btn-edit-delete").addEventListener("click", function () {
    update({ deleted: true }, "삭제된 차량으로 옮겼습니다.");
  });

  $("btn-edit-restore").addEventListener("click", function () {
    update({ deleted: false }, "복구했습니다.");
  });

  $("btn-edit-purge").addEventListener("click", function () {
    // confirm 은 브라우저 기본 확인창입니다. 되돌릴 수 없는 작업이라 한 번 묻습니다.
    if (!confirm("이 차량 정보를 완전히 지웁니다. 되돌릴 수 없습니다. 계속할까요?")) { return; }

    db.from("vehicles").delete().eq("id", editId).then(function (res) {
      if (res.error) { say("edit-msg", "삭제 실패: " + res.error.message); return; }
      loadAll().then(function () { show("manage"); });
    });
  });

  // 공통 수정 함수
  function update(patch, okText) {
    db.from("vehicles").update(patch).eq("id", editId).then(function (res) {
      if (res.error) {
        console.error(res.error);
        say("edit-msg", "실패: " + res.error.message);
        return;
      }
      loadAll().then(function () {
        say("edit-msg", okText, "ok");
        show("manage");
      });
    });
  }

  /* =========================================================
     6. PIN 변경
     ========================================================= */
  // 규칙에 맞는지 검사. 문제가 없으면 null 을 돌려줍니다.
  function checkSecret(s) {
    if (/^[0-9]{6}$/.test(s)) { return null; }               // 숫자 6자리 PIN
    var strong = s.length >= 8
              && /[A-Z]/.test(s)                              // 대문자
              && /[0-9]/.test(s)                              // 숫자
              && /[^A-Za-z0-9]/.test(s);                      // 특수문자
    if (strong) { return null; }
    return "숫자 6자리 PIN 이거나, 8자 이상이면서 대문자·숫자·특수문자를 모두 포함해야 합니다.";
  }

  $("btn-pin-save").addEventListener("click", function () {
    var a = $("p-new").value;
    var b = $("p-new2").value;

    if (a !== b) { say("pin-msg", "두 값이 서로 다릅니다."); return; }

    var bad = checkSecret(a);
    if (bad) { say("pin-msg", bad); return; }

    $("btn-pin-save").disabled = true;
    db.auth.updateUser({ password: a }).then(function (res) {
      $("btn-pin-save").disabled = false;
      if (res.error) {
        say("pin-msg", "변경 실패: " + res.error.message);
        return;
      }
      $("p-new").value = ""; $("p-new2").value = "";
