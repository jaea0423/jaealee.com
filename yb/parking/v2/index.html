<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>대경빌 안내</title>
<meta name="description" content="대경빌 생활 안내 및 등록 차량">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <!-- 여기(P 마크 / 건물 이름)를 5번 연속 누르면 관리자 모드로 갑니다 -->
  <div class="pmark tap" aria-hidden="true">P</div>
  <div class="topbar-title tap">
    <span id="bldg">대경빌</span> 안내
    <small>NOTICE</small>
  </div>
  <div class="topbar-meta" id="today"></div>
</header>

<div class="stage">

  <!-- ===== 위: 생활 안내 ===== -->
  <section class="notices">
    <div class="sec-head">
      <h2>생활 안내</h2>
      <span class="sub">모두가 편하게 지내기 위한 약속입니다</span>
    </div>

    <div class="notice-list" id="notice-list"></div>
    <div class="notice-footer" id="notice-footer"></div>
  </section>

  <!-- ===== 아래: 등록 차량 ===== -->
  <section class="cars">
    <div class="sec-head">
      <h2>등록 차량</h2>
      <span class="count" id="count">불러오는 중…</span>
    </div>

    <ul class="plates" id="plates"></ul>
    <div class="msg" id="plates-msg" hidden></div>

    <div class="ban">
      <span id="ban-head">대경빌 등록 차량 외 주차 불가</span>
      <small>위에 등록된 차량 외 외부차량은 이동주차 요청하시면 됩니다.</small>
    </div>
  </section>

</div>

<script src="../config.js"></script>
<script src="notices.js"></script>
<script>
/* 세로 게시용 화면. 스마트TV 내장 브라우저처럼 오래된 환경에서도 떠야 하므로
   라이브러리를 쓰지 않고 옛날 문법(ES5)으로만 작성했습니다. */
(function () {
  "use strict";

  var platesEl = document.getElementById("plates");
  var msgEl    = document.getElementById("plates-msg");
  var countEl  = document.getElementById("count");
  var current  = [];

  function setText(el, text) {
    el.innerHTML = "";
    el.appendChild(document.createTextNode(text));
  }

  /* ---------------- 0. 건물 이름 / 날짜 ---------------- */
  var B = CONFIG.BUILDING || "대경빌";
  setText(document.getElementById("bldg"), B);
  setText(document.getElementById("ban-head"), B + " 등록 차량 외 주차 불가");
  document.title = B + " 안내";

  (function () {
    var d = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      fmt(d) + "<br>" + days[d.getDay()] + "요일";
  })();

  /* ---------------- 1. 안내문 ---------------- */
  (function () {
    var box = document.getElementById("notice-list");

    for (var i = 0; i < NOTICES.length; i++) {
      var n = NOTICES[i];

      var card = document.createElement("div");
      card.className = "card t-" + n.tone;

      var tab = document.createElement("div");
      tab.className = "card-tab";
      setText(tab, n.title);

      var body = document.createElement("div");
      body.className = "card-body";

      var inner = document.createElement("div");
      inner.className = "card-inner";

      for (var j = 0; j < n.items.length; j++) {
        var p = document.createElement("p");
        // notices.js 는 우리가 쓰는 파일이라 <b> 같은 간단한 태그를 허용합니다
        p.innerHTML = n.items[j];
        inner.appendChild(p);
      }

      body.appendChild(inner);
      card.appendChild(tab);
      card.appendChild(body);
      box.appendChild(card);
    }

    fitNotices();

    var foot = document.getElementById("notice-footer");
    if (typeof NOTICE_FOOTER === "string" && NOTICE_FOOTER) {
      setText(foot, NOTICE_FOOTER);
    } else {
      foot.style.display = "none";
    }
  })();

  /* 안내 카드 글자가 칸을 넘치면 들어갈 때까지 줄입니다. */
  function fitNotices() {
    var bodies = document.querySelectorAll(".card-body");
    for (var i = 0; i < bodies.length; i++) {
      var body  = bodies[i];
      var inner = body.getElementsByClassName("card-inner")[0];
      if (!inner) { continue; }

      var size = window.innerHeight * 0.02;   // 2vh 에서 시작
      var min  = 11;
      body.style.fontSize = size.toFixed(1) + "px";

      var guard = 0;
      while (inner.offsetHeight > body.clientHeight && size > min && guard < 80) {
        size = size * 0.96;
        body.style.fontSize = size.toFixed(1) + "px";
        guard += 1;
      }
    }
  }

  /* ---------------- 2. 5번 눌러 관리자 모드 ---------------- */
  var clicks = 0, timer = null;
  function tap() {
    clicks += 1;
    if (timer) { clearTimeout(timer); }
    timer = setTimeout(function () { clicks = 0; }, 3000);
    if (clicks >= 5) {
      clicks = 0;
      clearTimeout(timer);
      location.href = "../admin.html";
    }
  }
  var taps = document.querySelectorAll(".tap");
  for (var ti = 0; ti < taps.length; ti++) { taps[ti].onclick = tap; }

  /* ---------------- 3. 번호판 글자 크기 ---------------- */
  var ruler = document.createElement("span");
  ruler.setAttribute("aria-hidden", "true");
  ruler.style.cssText =
    "position:absolute;left:-9999px;top:0;white-space:nowrap;" +
    "font-size:100px;font-weight:800;letter-spacing:.03em;visibility:hidden";
  document.body.appendChild(ruler);

  function widestRatio() {
    var max = 5.5;
    for (var i = 0; i < current.length; i++) {
      setText(ruler, formatPlate(current[i].plate));
      var r = ruler.offsetWidth / 100;
      if (r > max) { max = r; }
    }
    return max;
  }

  function numStyle(el, prop, fallback) {
    var v = 0;
    if (window.getComputedStyle) { v = parseFloat(window.getComputedStyle(el)[prop]); }
    return isNaN(v) ? fallback : v;
  }

  function fitFont() {
    var first = platesEl.firstChild;
    if (!first) { return; }

    var padX = numStyle(first, "paddingLeft", 6) + numStyle(first, "paddingRight", 6)
             + numStyle(first, "borderLeftWidth", 3) + numStyle(first, "borderRightWidth", 3);

    var byWidth  = (first.offsetWidth - padX - 4) / widestRatio();
    var byHeight = first.offsetHeight * 0.6;

    var size = Math.max(12, Math.min(byWidth, byHeight, 60));
    platesEl.style.fontSize = size.toFixed(1) + "px";
  }

  /* 2~5열 중 글자가 가장 크게 들어가는 배치를 고릅니다. */
  function gridPlan(n) {
    var w   = platesEl.offsetWidth;
    var h   = platesEl.offsetHeight;
    var gap = numStyle(platesEl, "gap", 8);
    if (!gap) { gap = 8; }
    var ratio = widestRatio();
    var padX  = window.innerHeight * 0.02;

    var best = null;
    for (var c = 2; c <= 5; c++) {
      var r    = Math.max(1, Math.ceil(Math.max(n, c) / c));
      var colW = (w - (c - 1) * gap) / c;
      var rowH = (h - (r - 1) * gap) / r;
      var f    = Math.min((colW - padX - 4) / ratio, rowH * 0.6);
      if (!best || f > best.f) { best = { cols: c, rows: r, total: c * r, f: f }; }
    }
    return best;
  }

  /* ---------------- 4. 목록 ---------------- */
  function showMsg(text) {
    setText(msgEl, text);
    msgEl.style.display = "";       // CSS 의 display:grid 를 그대로 씁니다
  }
  function hideMsg() { msgEl.style.display = "none"; }

  hideMsg();

  function render(list) {
    current = list;

    if (!list.length) {
      platesEl.innerHTML = "";
      setText(countEl, "");
      showMsg("현재 등록된 차량이 없습니다.");
      return;
    }
    hideMsg();

    var plan = gridPlan(list.length);
    platesEl.style.gridTemplateColumns = "repeat(" + plan.cols + ", minmax(0, 1fr))";
    platesEl.style.gridTemplateRows    = "repeat(" + plan.rows + ", minmax(0, 1fr))";
    platesEl.innerHTML = "";

    var i, li;
    for (i = 0; i < list.length; i++) {
      li = document.createElement("li");
      li.className = "plate";
      li.appendChild(document.createTextNode(formatPlate(list[i].plate)));
      platesEl.appendChild(li);
    }
    for (i = list.length; i < plan.total; i++) {
      li = document.createElement("li");
      li.className = "plate empty-slot";
      li.setAttribute("aria-hidden", "true");
      platesEl.appendChild(li);
    }

    setText(countEl, "총 " + list.length + "대");
    setTimeout(fitFont, 0);
  }

  var resizeTimer = null;
  window.onresize = function () {
    if (resizeTimer) { clearTimeout(resizeTimer); }
    resizeTimer = setTimeout(function () { fitNotices(); render(current); }, 200);
  };

  /* ---------------- 5. 불러오기 ---------------- */
  function load() {
    loadPlates(function (rows) {
      rows.sort(function (a, b) {
        var x = formatPlate(a.plate), y = formatPlate(b.plate);
        return x < y ? -1 : (x > y ? 1 : 0);
      });
      render(rows);
    }, function (why) {
      platesEl.innerHTML = "";
      setText(countEl, "");
      showMsg("목록을 불러오지 못했습니다.\n" + why);
    });
  }

  load();
  setInterval(load, 5 * 60 * 1000);   // 5분마다 차량 목록 갱신

  // 관리자 화면에서 "새로고침 신호"를 보내면 이 화면도 스스로 다시 열립니다
  watchReload();
})();
</script>

</body>
</html>
