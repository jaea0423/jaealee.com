<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>대경빌 등록 차량</title>
<meta name="description" content="대경빌 주차 등록 차량 목록">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="board">

<header class="topbar">
  <div class="topbar-in">
    <!-- 위쪽 "대경빌 주차"(P 마크 포함)를 5번 연속 누르면 관리자 모드로 갑니다 -->
    <div class="pmark tap" aria-hidden="true">P</div>
    <div class="topbar-title tap">
      <span id="bldg">대경빌</span> 주차
      <small>PARKING</small>
    </div>
    <div class="topbar-meta" id="today"></div>
  </div>
</header>

<div class="wrap">

  <div class="summary">
    <h1 id="title">등록 차량</h1>
    <span class="count" id="count">불러오는 중…</span>
  </div>

  <ul class="plates" id="plates"></ul>
  <div class="empty hidden" id="empty"></div>

  <div class="sign">
    <div class="sign-head" id="sign-head">대경빌 등록 차량 외 주차 불가</div>
    <div class="sign-body">
      위에 등록된 차량 외 외부차량은<br>
      이동주차 요청하시면 됩니다.
      <div id="contact-wrap"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  var platesEl = document.getElementById("plates");
  var emptyEl  = document.getElementById("empty");
  var countEl  = document.getElementById("count");
  var current  = [];        // 마지막으로 불러온 목록

  /* ---------------- 0. 건물 이름 / 오늘 날짜 ---------------- */
  var B = CONFIG.BUILDING || "대경빌";
  document.getElementById("bldg").textContent = B;
  document.getElementById("sign-head").textContent = B + " 등록 차량 외 주차 불가";
  document.title = B + " 등록 차량";

  (function () {
    var d = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      fmt(d) + "<br>" + days[d.getDay()] + "요일";
  })();

  if (CONFIG.CONTACT) {
    var a = document.createElement("a");
    a.className = "sign-contact";
    a.href = "tel:" + CONFIG.CONTACT.replace(/[^0-9+]/g, "");
    a.textContent = "이동주차 요청 " + CONFIG.CONTACT;
    document.getElementById("contact-wrap").appendChild(a);
  }

  /* ---------------- 1. 5번 클릭 -> 관리자모드 ----------------
     위쪽 "대경빌 주차"(P 마크 포함)를 3초 안에 5번 누르면 넘어갑니다.
     목록 제목("등록 차량")은 눌러도 아무 일도 일어나지 않습니다.
  ------------------------------------------------------------ */
  var clicks = 0;
  var timer  = null;

  function tap() {
    clicks += 1;
    clearTimeout(timer);
    timer = setTimeout(function () { clicks = 0; }, 3000);

    if (clicks >= 5) {
      clicks = 0;
      clearTimeout(timer);
      location.href = "admin.html";
    }
  }

  document.querySelectorAll(".tap").forEach(function (el) {
    el.addEventListener("click", tap);
  });

  /* ---------------- 2. 목록 ---------------- */
  function showEmpty(text) {
    emptyEl.textContent = text;
    emptyEl.classList.remove("hidden");
  }

  // 지금 그리드가 몇 열인지 읽어 옵니다 (화면 폭에 따라 달라집니다)
  function columnCount() {
    var t = getComputedStyle(platesEl).gridTemplateColumns;
    if (!t || t === "none") { return 1; }
    return t.split(" ").filter(function (x) { return x.trim() !== ""; }).length;
  }

  // 실제 차량 뒤에 빈 칸을 붙여 마지막 줄까지 꽉 차 보이게 합니다
  function padSlots(n) {
    var cols = columnCount();
    var target = Math.max(CONFIG.SLOTS || 0, n);
    target = Math.ceil(target / cols) * cols;     // 줄 단위로 올림

    for (var i = n; i < target; i++) {
      var li = document.createElement("li");
      li.className = "plate empty-slot";
      li.setAttribute("aria-hidden", "true");
      platesEl.appendChild(li);
    }
  }

  function render(list) {
    current = list;
    platesEl.innerHTML = "";
    emptyEl.classList.add("hidden");

    list.forEach(function (row) {
      var li = document.createElement("li");
      li.className = "plate";
      li.textContent = formatPlate(row.plate);   // textContent 라서 HTML 주입 걱정 없음
      platesEl.appendChild(li);
    });

    padSlots(list.length);

    countEl.textContent = list.length ? "총 " + list.length + "대" : "등록된 차량 없음";
  }

  // 창 크기가 바뀌면 열 수가 달라지므로 빈 칸을 다시 계산합니다
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { render(current); }, 200);
  });

  function load() {
    if (!configReady()) {
      countEl.textContent = "";
      showEmpty("설정이 아직 되지 않았습니다. config.js 를 채워 주세요.");
      return;
    }

    var db = makeClient();

    // vehicles_public 뷰에는 "지금 등록 기간 중인 차량의 번호"만 들어 있습니다
    db.from("vehicles_public").select("plate").then(function (res) {
      if (res.error) {
        console.error(res.error);
        countEl.textContent = "";
        showEmpty("목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.");
        return;
      }

      var list = res.data.slice().sort(function (a, b) {
        return formatPlate(a.plate).localeCompare(formatPlate(b.plate), "ko");
      });

      render(list);
    });
  }

  load();
  setInterval(load, 5 * 60 * 1000);   // 게시용으로 켜 둘 수 있게 5분마다 갱신
})();
</script>

</body>
</html>
