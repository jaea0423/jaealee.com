<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>대경빌 등록 차량</title>
<meta name="description" content="대경빌 주차 등록 차량 목록">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="pmark" aria-hidden="true">P</div>
    <div class="topbar-title">
      <span id="bldg">대경빌</span> 주차
      <small>PARKING</small>
    </div>
    <div class="topbar-meta" id="today"></div>
  </div>
</header>

<div class="wrap">

  <div class="summary">
    <!-- 이 제목을 5번 연속 누르면 관리자 모드로 넘어갑니다 -->
    <h1 id="title">등록 차량</h1>
    <span class="count" id="count">불러오는 중…</span>
  </div>

  <ul class="plates" id="plates"></ul>
  <div class="empty hidden" id="empty"></div>

  <div class="sign">
    <div class="sign-head" id="sign-head">대경빌 등록 차량 외 주차 불가</div>
    <div class="sign-body">
      위에 등록된 차량 외 외부차량은<br>
      이동주차 요청하시면 됩니다.
      <div id="contact-wrap"></div>
    </div>
  </div>

  <p class="foot-note">목록은 5분마다 자동으로 새로고침됩니다.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  var platesEl = document.getElementById("plates");
  var emptyEl  = document.getElementById("empty");
  var countEl  = document.getElementById("count");

  /* ---------------- 0. 건물 이름 / 오늘 날짜 ---------------- */
  var B = CONFIG.BUILDING || "대경빌";
  document.getElementById("bldg").textContent = B;
  document.getElementById("sign-head").textContent = B + " 등록 차량 외 주차 불가";
  document.title = B + " 등록 차량";

  (function () {
    var d = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      fmt(d) + "<br>" + days[d.getDay()] + "요일";
  })();

  // 연락처가 설정되어 있으면 버튼처럼 보여 줍니다
  if (CONFIG.CONTACT) {
    var a = document.createElement("a");
    a.className = "sign-contact";
    a.href = "tel:" + CONFIG.CONTACT.replace(/[^0-9+]/g, "");
    a.textContent = "이동주차 요청 " + CONFIG.CONTACT;
    document.getElementById("contact-wrap").appendChild(a);
  }

  /* ---------------- 1. 제목 5번 클릭 -> 관리자모드 ---------------- */
  var clicks = 0;
  var timer  = null;

  document.getElementById("title").addEventListener("click", function () {
    clicks += 1;
    clearTimeout(timer);
    timer = setTimeout(function () { clicks = 0; }, 1500);   // 1.5초 안에 5번

    if (clicks >= 5) {
      clicks = 0;
      clearTimeout(timer);
      location.href = "admin.html";
    }
  });

  /* ---------------- 2. 목록 ---------------- */
  function showEmpty(text) {
    emptyEl.textContent = text;
    emptyEl.classList.remove("hidden");
  }

  function render(list) {
    platesEl.innerHTML = "";
    emptyEl.classList.add("hidden");

    if (list.length === 0) {
      countEl.textContent = "";
      showEmpty("현재 등록된 차량이 없습니다.");
      return;
    }

    list.forEach(function (row) {
      var li = document.createElement("li");
      li.className = "plate";
      li.textContent = formatPlate(row.plate);  // textContent 라서 HTML 주입 걱정 없음
      platesEl.appendChild(li);
    });

    countEl.textContent = "총 " + list.length + "대";
  }

  function load() {
    if (!configReady()) {
      countEl.textContent = "";
      showEmpty("설정이 아직 되지 않았습니다. config.js 를 채워 주세요.");
      return;
    }

    var db = makeClient();

    // vehicles_public 뷰에는 "지금 등록 기간 중인 차량의 번호"만 들어 있습니다
    db.from("vehicles_public").select("plate").then(function (res) {
      if (res.error) {
        console.error(res.error);
        countEl.textContent = "";
        showEmpty("목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.");
        return;
      }

      var list = res.data.slice().sort(function (a, b) {
        return formatPlate(a.plate).localeCompare(formatPlate(b.plate), "ko");
      });

      render(list);
    });
  }

  load();
  setInterval(load, 5 * 60 * 1000);   // 게시용으로 켜 둘 수 있게 5분마다 갱신
})();
</script>

</body>
</html>
