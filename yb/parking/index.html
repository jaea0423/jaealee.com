<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>대경빌 등록 차량</title>
<meta name="description" content="대경빌 주차 등록 차량 목록">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="board">

<header class="topbar">
  <div class="topbar-in">
    <!-- 위쪽 "대경빌 주차"(P 마크 포함)를 5번 연속 누르면 관리자 모드로 갑니다 -->
    <div class="pmark tap" aria-hidden="true">P</div>
    <div class="topbar-title tap">
      <span id="bldg">대경빌</span> 주차
      <small>PARKING</small>
    </div>
    <div class="topbar-meta" id="today"></div>
  </div>
</header>

<div class="wrap">

  <div class="summary">
    <h1 id="title">등록 차량</h1>
    <span class="count" id="count">불러오는 중…</span>
  </div>

  <ul class="plates" id="plates"></ul>
  <div class="empty hidden" id="empty"></div>

  <div class="sign">
    <div class="sign-head" id="sign-head">대경빌 등록 차량 외 주차 불가</div>
    <div class="sign-body">
      위에 등록된 차량 외 외부차량은<br>
      이동주차 요청하시면 됩니다.
      <div id="contact-wrap"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  var platesEl = document.getElementById("plates");
  var emptyEl  = document.getElementById("empty");
  var countEl  = document.getElementById("count");
  var current  = [];        // 마지막으로 불러온 목록

  /* ---------------- 0. 건물 이름 / 오늘 날짜 ---------------- */
  var B = CONFIG.BUILDING || "대경빌";
  document.getElementById("bldg").textContent = B;
  document.getElementById("sign-head").textContent = B + " 등록 차량 외 주차 불가";
  document.title = B + " 등록 차량";

  (function () {
    var d = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      fmt(d) + "<br>" + days[d.getDay()] + "요일";
  })();

  if (CONFIG.CONTACT) {
    var a = document.createElement("a");
    a.className = "sign-contact";
    a.href = "tel:" + CONFIG.CONTACT.replace(/[^0-9+]/g, "");
    a.textContent = "이동주차 요청 " + CONFIG.CONTACT;
    document.getElementById("contact-wrap").appendChild(a);
  }

  /* ---------------- 1. 5번 클릭 -> 관리자모드 ----------------
     위쪽 "대경빌 주차"(P 마크 포함)를 3초 안에 5번 누르면 넘어갑니다.
     목록 제목("등록 차량")은 눌러도 아무 일도 일어나지 않습니다.
  ------------------------------------------------------------ */
  var clicks = 0;
  var timer  = null;

  function tap() {
    clicks += 1;
    clearTimeout(timer);
    timer = setTimeout(function () { clicks = 0; }, 3000);

    if (clicks >= 5) {
      clicks = 0;
      clearTimeout(timer);
      location.href = "admin.html";
    }
  }

  document.querySelectorAll(".tap").forEach(function (el) {
    el.addEventListener("click", tap);
  });

  /* ---------------- 2. 목록 ---------------- */
  function showEmpty(text) {
    emptyEl.textContent = text;
    emptyEl.classList.remove("hidden");
  }

  /* ---- 화면 크기에 맞춰 격자 모양을 정합니다 ----
     스크롤이 생기지 않도록, 남는 높이를 행 수로 나눠 씁니다. */
  function gridPlan(carCount) {
    var w = window.innerWidth;
    var cols, slots;

    if (w < 768)       { cols = 2; slots = CONFIG.SLOTS_MOBILE || 16; }  // 휴대폰
    else if (w < 1200) { cols = 4; slots = CONFIG.SLOTS || 20; }         // 태블릿
    else               { cols = 5; slots = CONFIG.SLOTS || 20; }         // PC / 모니터

    var total = Math.max(slots, carCount);
    var rows  = Math.max(1, Math.ceil(total / cols));
    return { cols: cols, rows: rows, total: rows * cols };
  }

  /* 칸 크기에 맞춰 번호판 글자 크기를 정합니다.
     글자 폭을 눈대중으로 계산하면 한글 폭 때문에 어긋나 두 줄로 접힙니다.
     그래서 화면 밖에 똑같은 모양의 글자를 하나 그려 놓고 실제 폭을 잽니다. */
  var ruler = document.createElement("span");
  ruler.setAttribute("aria-hidden", "true");
  ruler.style.cssText =
    "position:absolute;left:-9999px;top:0;white-space:nowrap;" +
    "font-size:100px;font-weight:800;letter-spacing:.03em;" +
    "font-variant-numeric:tabular-nums;visibility:hidden";
  document.body.appendChild(ruler);

  // 가장 긴 번호판이 글자 크기 100px 일 때 몇 px 인지 -> 배율
  function widestRatio() {
    ruler.style.fontFamily = getComputedStyle(platesEl).fontFamily;
    var max = 5.5;                       // 최소한 이 정도는 잡아 둡니다
    current.forEach(function (row) {
      ruler.textContent = formatPlate(row.plate);
      var r = ruler.getBoundingClientRect().width / 100;
      if (r > max) { max = r; }
    });
    return max;
  }

  /* 넓은 화면에서는 칸이 너무 두꺼워집니다.
     실제 번호판처럼 옆으로 긴 비율이 되도록 높이에 상한을 둡니다.
     남는 높이는 안내판이 아래로 내려가면서 자연스럽게 흡수합니다.
     (휴대폰은 세로가 빠듯하므로 그대로 꽉 채웁니다) */
  function capRowHeight(rows) {
    var first = platesEl.firstElementChild;
    if (!first) { return; }

    // 휴대폰은 손대지 않습니다
    if (window.innerWidth < 768) {
      platesEl.style.flex = "";
      platesEl.style.marginBottom = "";
      return;
    }

    var box = first.getBoundingClientRect();
    var cap = box.width / 3.7;          // 가로:세로 = 약 3.7 : 1

    if (box.height > cap) {
      platesEl.style.gridTemplateRows = "repeat(" + rows + ", " + cap.toFixed(1) + "px)";
      platesEl.style.flex = "0 1 auto";
      platesEl.style.marginBottom = "auto";   // 남는 높이를 아래로 몰아 줍니다
    } else {
      platesEl.style.flex = "";
      platesEl.style.marginBottom = "";
    }
  }

  function fitFont() {
    var first = platesEl.firstElementChild;
    if (!first) { return; }

    var cs   = getComputedStyle(first);
    var box  = first.getBoundingClientRect();
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
             + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);

    var byWidth  = (box.width - padX - 4) / widestRatio();
    var byHeight = box.height * 0.46;

    var size = Math.max(13, Math.min(byWidth, byHeight, 48));
    platesEl.style.fontSize = size.toFixed(1) + "px";
  }

  function render(list) {
    current = list;
    var plan = gridPlan(list.length);

    platesEl.style.gridTemplateColumns = "repeat(" + plan.cols + ", minmax(0, 1fr))";
    platesEl.style.gridTemplateRows    = "repeat(" + plan.rows + ", minmax(0, 1fr))";
    platesEl.innerHTML = "";
    emptyEl.classList.add("hidden");

    list.forEach(function (row) {
      var li = document.createElement("li");
      li.className = "plate";
      li.textContent = formatPlate(row.plate);   // textContent 라서 HTML 주입 걱정 없음
      platesEl.appendChild(li);
    });

    // 남는 자리는 빈 칸으로 채웁니다
    for (var i = list.length; i < plan.total; i++) {
      var e = document.createElement("li");
      e.className = "plate empty-slot";
      e.setAttribute("aria-hidden", "true");
      platesEl.appendChild(e);
    }

    countEl.textContent = list.length ? "총 " + list.length + "대" : "등록된 차량 없음";

    requestAnimationFrame(function () {
      capRowHeight(plan.rows);
      requestAnimationFrame(fitFont);
    });
  }

  // 창 크기가 바뀌면 다시 계산합니다
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { render(current); }, 150);
  });

  function load() {
    if (!configReady()) {
      countEl.textContent = "";
      showEmpty("설정이 아직 되지 않았습니다. config.js 를 채워 주세요.");
      return;
    }

    var db = makeClient();

    // vehicles_public 뷰에는 "지금 등록 기간 중인 차량의 번호"만 들어 있습니다
    db.from("vehicles_public").select("plate").then(function (res) {
      if (res.error) {
        console.error(res.error);
        countEl.textContent = "";
        showEmpty("목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.");
        return;
      }

      var list = res.data.slice().sort(function (a, b) {
        return formatPlate(a.plate).localeCompare(formatPlate(b.plate), "ko");
      });

      render(list);
    });
  }

  load();
  setInterval(load, 5 * 60 * 1000);   // 게시용으로 켜 둘 수 있게 5분마다 갱신
})();
</script>

</body>
</html>
