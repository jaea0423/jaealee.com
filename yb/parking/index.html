<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>대경빌 등록 차량</title>
<meta name="description" content="대경빌 주차 등록 차량 목록">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="board">

<header class="topbar">
  <div class="topbar-in">
    <!-- 위쪽 "대경빌 주차"(P 마크 포함)를 5번 연속 누르면 관리자 모드로 갑니다 -->
    <div class="pmark tap" aria-hidden="true">P</div>
    <div class="topbar-title tap">
      <span id="bldg">대경빌</span> 주차
      <small>PARKING</small>
    </div>
    <div class="topbar-meta" id="today"></div>
  </div>
</header>

<div class="wrap">

  <div class="summary">
    <h1 id="title">등록 차량</h1>
    <span class="count" id="count">불러오는 중…</span>
  </div>

  <ul class="plates" id="plates"></ul>
  <div class="empty hidden" id="empty"></div>

  <div class="sign">
    <div class="sign-head" id="sign-head">대경빌 등록 차량 외 주차 불가</div>
    <div class="sign-body">
      위에 등록된 차량 외 외부차량은<br class="br-narrow">
      이동주차 요청하시면 됩니다.
      <div id="contact-wrap"></div>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
/* 이 화면은 스마트TV 내장 브라우저처럼 오래된 환경에서도 떠야 합니다.
   그래서 라이브러리를 쓰지 않고, 옛날 문법(ES5)으로만 작성했습니다. */
(function () {
  "use strict";

  var platesEl = document.getElementById("plates");
  var emptyEl  = document.getElementById("empty");
  var countEl  = document.getElementById("count");
  var current  = [];

  /* ---------------- 0. 건물 이름 / 오늘 날짜 ---------------- */
  var B = CONFIG.BUILDING || "대경빌";
  document.getElementById("bldg").innerHTML = "";
  document.getElementById("bldg").appendChild(document.createTextNode(B));
  document.getElementById("sign-head").innerHTML = "";
  document.getElementById("sign-head").appendChild(
    document.createTextNode(B + " 등록 차량 외 주차 불가"));
  document.title = B + " 등록 차량";

  (function () {
    var d = new Date();
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("today").innerHTML =
      fmt(d) + "<br>" + days[d.getDay()] + "요일";
  })();

  if (CONFIG.CONTACT) {
    var a = document.createElement("a");
    a.className = "sign-contact";
    a.href = "tel:" + CONFIG.CONTACT.replace(/[^0-9+]/g, "");
    a.appendChild(document.createTextNode("이동주차 요청 " + CONFIG.CONTACT));
    document.getElementById("contact-wrap").appendChild(a);
  }

  /* ---------------- 1. 5번 눌러 관리자 모드 ---------------- */
  var clicks = 0, timer = null;

  function tap() {
    clicks += 1;
    if (timer) { clearTimeout(timer); }
    timer = setTimeout(function () { clicks = 0; }, 3000);
    if (clicks >= 5) {
      clicks = 0;
      clearTimeout(timer);
      location.href = "admin.html";
    }
  }

  var taps = document.querySelectorAll(".tap");
  for (var ti = 0; ti < taps.length; ti++) {
    taps[ti].onclick = tap;     // NodeList.forEach 는 옛 브라우저에 없습니다
  }

  /* ---------------- 2. 번호판 글자 크기 ---------------- */
  var ruler = document.createElement("span");
  ruler.setAttribute("aria-hidden", "true");
  ruler.style.cssText =
    "position:absolute;left:-9999px;top:0;white-space:nowrap;" +
    "font-size:100px;font-weight:800;letter-spacing:.03em;visibility:hidden";
  document.body.appendChild(ruler);

  function widestRatio() {
    var max = 5.5;
    for (var i = 0; i < current.length; i++) {
      ruler.innerHTML = "";
      ruler.appendChild(document.createTextNode(formatPlate(current[i].plate)));
      var r = ruler.offsetWidth / 100;
      if (r > max) { max = r; }
    }
    return max;
  }

  function numStyle(el, prop, fallback) {
    var v = 0;
    if (window.getComputedStyle) {
      v = parseFloat(window.getComputedStyle(el)[prop]);
    }
    return isNaN(v) ? fallback : v;
  }

  function capRowHeight(rows) {
    var first = platesEl.firstChild;
    if (!first || window.innerWidth < 768) {
      platesEl.style.flex = "";
      platesEl.style.marginBottom = "";
      return;
    }
    var w = first.offsetWidth, h = first.offsetHeight;
    var cap = w / 3.7;                  // 실제 번호판에 가까운 가로:세로 비율
    if (h > cap) {
      platesEl.style.gridTemplateRows = "repeat(" + rows + ", " + cap.toFixed(1) + "px)";
      platesEl.style.flex = "0 1 auto";
      platesEl.style.marginBottom = "auto";
    } else {
      platesEl.style.flex = "";
      platesEl.style.marginBottom = "";
    }
  }

  function fitFont() {
    var first = platesEl.firstChild;
    if (!first) { return; }

    var padX = numStyle(first, "paddingLeft", 8) + numStyle(first, "paddingRight", 8)
             + numStyle(first, "borderLeftWidth", 3) + numStyle(first, "borderRightWidth", 3);

    var byWidth  = (first.offsetWidth - padX - 4) / widestRatio();
    var byHeight = first.offsetHeight * 0.46;

    var size = Math.max(13, Math.min(byWidth, byHeight, 48));
    platesEl.style.fontSize = size.toFixed(1) + "px";
  }

  /* ---------------- 3. 화면 그리기 ---------------- */
  function gridPlan(carCount) {
    var w = window.innerWidth, cols, slots;

    if (w < 768)       { cols = 2; slots = CONFIG.SLOTS_MOBILE || 16; }
    else if (w < 1200) { cols = 4; slots = CONFIG.SLOTS || 20; }
    else               { cols = 5; slots = CONFIG.SLOTS || 20; }

    var total = Math.max(slots, carCount);
    var rows  = Math.max(1, Math.ceil(total / cols));
    return { cols: cols, rows: rows, total: rows * cols };
  }

  function showEmpty(text) {
    emptyEl.innerHTML = "";
    emptyEl.appendChild(document.createTextNode(text));
    emptyEl.className = "empty";
  }

  function hideEmpty() { emptyEl.className = "empty hidden"; }

  function render(list) {
    current = list;
    var plan = gridPlan(list.length);

    platesEl.style.gridTemplateColumns = "repeat(" + plan.cols + ", minmax(0, 1fr))";
    platesEl.style.gridTemplateRows    = "repeat(" + plan.rows + ", minmax(0, 1fr))";
    platesEl.innerHTML = "";
    hideEmpty();

    var i, li;
    for (i = 0; i < list.length; i++) {
      li = document.createElement("li");
      li.className = "plate";
      li.appendChild(document.createTextNode(formatPlate(list[i].plate)));
      platesEl.appendChild(li);
    }
    for (i = list.length; i < plan.total; i++) {
      li = document.createElement("li");
      li.className = "plate empty-slot";
      li.setAttribute("aria-hidden", "true");
      platesEl.appendChild(li);
    }

    countEl.innerHTML = "";
    countEl.appendChild(document.createTextNode(
      list.length ? "총 " + list.length + "대" : "등록된 차량 없음"));

    setTimeout(function () { capRowHeight(plan.rows); setTimeout(fitFont, 0); }, 0);
  }

  var resizeTimer = null;
  window.onresize = function () {
    if (resizeTimer) { clearTimeout(resizeTimer); }
    resizeTimer = setTimeout(function () { render(current); }, 200);
  };

  /* ---------------- 4. 불러오기 ---------------- */
  function load() {
    loadPlates(function (rows) {
      rows.sort(function (a, b) {
        var x = formatPlate(a.plate), y = formatPlate(b.plate);
        return x < y ? -1 : (x > y ? 1 : 0);
      });
      render(rows);
    }, function (why) {
      // 실패 이유를 화면에 그대로 보여 줍니다 (어디서 막혔는지 알 수 있게)
      countEl.innerHTML = "";
      platesEl.innerHTML = "";
      showEmpty("목록을 불러오지 못했습니다.\n" + why);
    });
  }

  load();
  setInterval(load, 5 * 60 * 1000);   // 5분마다 차량 목록 갱신

  // 관리자 화면에서 "새로고침 신호"를 보내면 이 화면도 스스로 다시 열립니다
  watchReload();
})();
</script>

</body>
</html>
