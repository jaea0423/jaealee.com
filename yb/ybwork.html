/* ── 색상 토큰: 로고 네이비를 사이드바에, 본문은 흰 바탕 + 옅은 회색 구분선 ── */
:root{
  --side:#10233f; --side-2:#1a3257; --side-text:#b8c4d6; --side-active:#ffffff;
  --primary:#1d4d8f; --primary-h:#173f76; --primary-soft:#edf2f9;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fa; --label-bg:#f6f7f9;
  --line:#e4e7eb; --line-2:#d1d6dc;
  --text:#191f28; --text-2:#4e5968; --text-3:#8b95a1;
  --ok:#1b7f4c; --warn:#b86e00; --bad:#c62828; --warn-bg:#fff6e5; --info-bg:#f0f4fa;
  --focus:#2f6fd0;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --side:#0b1628; --side-2:#15253f; --side-text:#9fb0c7;
    --primary:#5b93dd; --primary-h:#76a6e6; --primary-soft:#18263b;
    --bg:#0f141b; --surface:#161c25; --surface-2:#1b222c; --label-bg:#1b222c;
    --line:#262e3a; --line-2:#333d4b;
    --text:#e8ecf1; --text-2:#aeb8c5; --text-3:#7c8795;
    --ok:#5cc28b; --warn:#e8a64a; --bad:#ef7a73; --warn-bg:#2e2412; --info-bg:#162232;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --side:#0b1628; --side-2:#15253f; --side-text:#9fb0c7;
  --primary:#5b93dd; --primary-h:#76a6e6; --primary-soft:#18263b;
  --bg:#0f141b; --surface:#161c25; --surface-2:#1b222c; --label-bg:#1b222c;
  --line:#262e3a; --line-2:#333d4b;
  --text:#e8ecf1; --text-2:#aeb8c5; --text-3:#7c8795;
  --ok:#5cc28b; --warn:#e8a64a; --bad:#ef7a73; --warn-bg:#2e2412; --info-bg:#162232;
}

/* ── 기본 ── */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;line-height:1.35;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.t2{color:var(--text-2)} .t3{color:var(--text-3)} .sm{font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 버튼 / 입력 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.link{border:none;background:none;padding:0;cursor:pointer;color:var(--primary);font-size:14px;font-weight:500}
.input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-size:15px}
textarea.input{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input::placeholder{color:var(--text-3)}
.req::after{content:" *";color:var(--bad)}

/* 상태 표시: 점 + 글자 (색만으로 구분하지 않도록 글자를 항상 같이 씀) */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.st.ok{color:var(--ok)} .st.ok::before{background:var(--ok)}
.st.warn{color:var(--warn)} .st.warn::before{background:var(--warn)}
.st.off{color:var(--text-3)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--primary-soft);color:var(--primary)}

/* ── 로그인 ── */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-brand{background:var(--side);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-brand img{width:64px}
.login-brand h2{font-size:28px;font-weight:700;line-height:1.4;margin-bottom:10px}
.login-brand p{color:var(--side-text);font-size:15px}
.login-brand small{color:var(--side-text);font-size:13px}
.login-form-wrap{display:grid;place-items:center;padding-inline:24px;padding-block:48px;background:var(--surface)}
.login-form{width:100%;max-width:360px;display:grid;gap:18px}
.login-form h1{font-size:24px}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:500;color:var(--text-2)}
.login-form .input{height:48px}
.login-form .btn{height:48px;font-size:15px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-brand{padding:28px 24px;gap:24px}.login-brand h2{font-size:22px}}

/* ── 앱 레이아웃: 좌측 네이비 사이드바 + 상단 헤더 ── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-logo{display:flex;align-items:center;gap:10px;height:64px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-logo img{width:34px}
.side-logo b{color:#fff;font-size:16px;font-weight:700;letter-spacing:0}
.nav{padding:16px 12px;display:grid;gap:18px;overflow-y:auto;align-content:start}
.nav-group{display:grid;gap:2px}
.nav-group h4{margin:0 0 4px;padding:0 10px;font-size:12px;font-weight:600;color:#6e809c;letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border:none;border-radius:6px;background:none;color:var(--side-text);font-size:15px;font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:var(--side-2);color:#fff}
.nav button[aria-current="page"]{background:var(--side-2);color:var(--side-active);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:#e8a64a;color:#10233f;border-radius:10px;padding:0 7px;line-height:18px}

.body{min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:5}
.crumb{font-size:14px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--text);font-weight:600}
.search{margin-left:auto;position:relative;width:260px}
.search input{height:36px;padding-left:34px;background:var(--surface-2);border-color:var(--line);font-size:14px}
.search svg{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--text-3)}
.me{display:flex;align-items:center;gap:10px;border:none;background:none;cursor:pointer;padding:4px;border-radius:6px}
.me:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.me-txt{text-align:left;line-height:1.3}
.me-txt b{display:block;font-size:14px;font-weight:600}
.me-txt span{font-size:12px;color:var(--text-3)}

.main{padding-inline:28px;padding-block:28px 64px}
.page{max-width:1200px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px}
.page-head p{margin-top:4px;color:var(--text-2);font-size:14.5px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto}
  .side-logo{height:56px;padding:0 16px}
  .nav{display:flex;overflow-x:auto;padding:8px 12px;gap:4px;scrollbar-width:none}
  .nav-group{display:contents}.nav-group h4{display:none}
  .nav button{width:auto;white-space:nowrap;height:36px;font-size:14px}
  .nav .count{margin-left:4px}
  .top{padding:0 16px;height:56px;top:env(safe-area-inset-top,0px)}
  .search,.me-txt{display:none}
  .me{margin-left:auto}
  .main{padding-inline:16px;padding-block:20px 56px}
}

/* ── 박스 ── */
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.box-head h2{font-size:16px}
.box-body{padding:20px}

/* 홈 요약: 카드 4개 대신 한 줄 띠로 */
.summary{display:grid;grid-template-columns:repeat(4,1fr)}
.summary>div{padding:18px 22px;border-left:1px solid var(--line);display:grid;gap:4px}
.summary>div:first-child{border-left:none}
.summary .k{font-size:14px;color:var(--text-2)}
.summary .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.summary .v small{font-size:14px;font-weight:500;color:var(--text-2);margin-left:2px}
@media (max-width:900px){.summary{grid-template-columns:1fr 1fr}.summary>div:nth-child(3){border-left:none}.summary>div:nth-child(n+3){border-top:1px solid var(--line)}}

.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}

/* 간단한 목록 (일정·공지) */
.ul{list-style:none;margin:0;padding:0}
.ul li{display:flex;gap:14px;padding:13px 20px;border-top:1px solid var(--line);align-items:baseline}
.ul li:first-child{border-top:none}
.ul .d{width:78px;flex:none;font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums}

/* ── 표 ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:13px;font-weight:500;color:var(--text-3);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.r{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.sub{display:block;font-size:13.5px;color:var(--text-2);margin-top:2px}
tr.canceled td{color:var(--text-3)}
tr.canceled .strike{text-decoration:line-through}
tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line);border-bottom:none}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.filters select.input{width:auto;height:36px;font-size:14px}
.filters .input{height:36px;font-size:14px}
.chips{display:inline-flex;gap:4px}
.chips button{height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);cursor:pointer;font-size:14px;color:var(--text-2)}
.chips button[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);font-weight:600}

/* ── 결의서형 입력 폼: 왼쪽 회색 라벨칸 + 오른쪽 입력칸 (국내 업무 양식에서 흔한 구조) ── */
.sheet{display:grid;grid-template-columns:150px minmax(0,1fr) 150px minmax(0,1fr);border-top:2px solid var(--text);font-size:15px}
.sheet>.lb{background:var(--label-bg);padding:14px 16px;border-bottom:1px solid var(--line);font-weight:500;color:var(--text-2);display:flex;align-items:center}
.sheet>.fd{padding:10px 14px;border-bottom:1px solid var(--line);min-width:0;display:grid;gap:6px;align-content:center}
.sheet>.fd.wide{grid-column:span 3}
.sheet .help{font-size:13px;color:var(--text-3)}
@media (max-width:760px){
  .sheet{grid-template-columns:1fr}
  .sheet>.lb{padding:12px 12px 4px;border-bottom:none;background:none}
  .sheet>.fd,.sheet>.fd.wide{grid-column:auto;padding:0 12px 14px}
}
.money{display:flex;align-items:center;gap:8px}
.money .input{text-align:right;font-variant-numeric:tabular-nums}
.sum{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

.files{display:grid;gap:8px}
.file-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center}
.file-row .fname{font-size:14px;min-width:0}
.file-row .fname span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--text-3);overflow-wrap:anywhere}
@media (max-width:760px){.file-row{grid-template-columns:1fr}}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}

.note{display:flex;gap:8px;padding:12px 14px;border-radius:6px;font-size:14px;line-height:1.5}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}

.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line)}

/* ── 상세 보기 창 ── */
.dim{position:fixed;inset:0;background:rgba(10,18,30,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:21;overflow-y:auto;display:flex;flex-direction:column}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:0 24px;min-height:64px;border-bottom:1px solid var(--line);flex:none;padding-top:env(safe-area-inset-top,0px)}
.drawer-body{padding:24px;display:grid;gap:24px}
.drawer h3{font-size:15px;margin-bottom:10px}
.dl{display:grid;grid-template-columns:100px 1fr;gap:10px 16px;font-size:14.5px;margin:0}
.dl dt{color:var(--text-3)} .dl dd{margin:0}
.att{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.att:first-of-type{border-top:none}
.ext{width:34px;height:40px;border:1px solid var(--line-2);border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--text-2);flex:none}
.cmt{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.cmt:first-child{border-top:none}
.hist{font-size:13.5px;color:var(--text-2);display:grid;gap:6px}

/* ── 달력 ── */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal>div{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.cal>div:nth-child(7n){border-right:none}
.cal .dow{min-height:auto;padding:10px 8px;font-size:13px;color:var(--text-3);font-weight:500}
.cal .dn{font-size:14px;font-variant-numeric:tabular-nums;color:var(--text-2);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal .sun .dn,.cal .dow.sun{color:var(--bad)}
.cal .other .dn{opacity:.35}
.cal .today .dn{background:var(--primary);color:#fff;font-weight:700}
.ev{border-left:3px solid var(--primary);background:var(--primary-soft);padding:2px 6px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.ev.g{border-color:var(--ok)} .ev.o{border-color:var(--warn)}
@media (max-width:760px){.cal>div{min-height:66px;padding:4px;font-size:11px}.ev{font-size:10.5px;padding:1px 3px}}

/* ── 탭 ── */
.tabs{display:flex;gap:24px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{height:50px;border:none;background:none;cursor:pointer;font-size:15px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;padding:0}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:600}

/* ── 마이페이지 ── */
.pw-rules{list-style:none;margin:4px 0 0;padding:0;display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-3)}
.pw-rules li.pass{color:var(--ok)}
.pw-rules li::before{content:"· "}
.pw-rules li.pass::before{content:"✓ "}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#191f28;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
</style>

let fileRows = [];
AFTER['expense-new'] = () => {
  fileRows = [{type:'카드전표', file:null, hash:''}];
  const num = el => parseInt(el.value.replace(/[^\d]/g,''),10) || 0;   // 콤마 등을 지우고 숫자만 읽음
  const fmt = el => { const n = num(el); el.value = n ? won(n) : ''; }; // 입력 중에도 1,000 단위 콤마 표시
  const upd = () => { $('#xSum').textContent = won(num($('#xSupply')) + num($('#xVat'))) + '원'; check(); };
  ['#xSupply','#xVat'].forEach(s => $(s).oninput = e => { fmt(e.target); upd(); });
  $('#vatAuto').onclick = () => { $('#xVat').value = won(Math.round(num($('#xSupply')) * 0.1)); upd(); };
  $('#xPay').onchange = check;

  // 3만 원 초과 + 적격증빙 없음 → 경고만 표시 (불가피한 경우가 있어서 저장은 막지 않음)
  function check(){
    const total = num($('#xSupply')) + num($('#xVat'));
    const ok = fileRows.some(r => QUALIFIED.includes(r.type));
    $('#proofWarn').innerHTML = (total > 30000 && !ok && $('#xPay').value !== '해외송금')
      ? `<div class="note warn">${icon('warn')}<div>3만 원이 넘는 지출인데 세금계산서·카드전표·현금영수증이 없습니다. 받을 수 없었다면 메모에 사유를 남겨 주세요.</div></div>` : '';
  }
  function draw(){
    $('#files').innerHTML = fileRows.map((r,i) => `
      <div class="file-row">
        <select class="input" data-ft="${i}" aria-label="증빙 종류">${DOC_TYPES.map(t => `<option ${t===r.type?'selected':''}>${t}</option>`).join('')}</select>
        <div class="fname">${r.file ? `<span>${esc(r.file)}</span><div class="hash">SHA-256 ${r.hash}</div>` : '<span class="t3">사진 또는 PDF 파일</span>'}</div>
        <div style="display:flex;gap:6px"><label class="btn sm pick">${r.file ? '변경' : '파일 선택'}<input type="file" accept="image/*,.pdf" data-ff="${i}"></label>
        ${fileRows.length > 1 ? `<button type="button" class="btn sm" data-fd="${i}">삭제</button>` : ''}</div>
      </div>`).join('');
    $$('[data-ft]').forEach(s => s.onchange = () => { fileRows[s.dataset.ft].type = s.value; check(); });
    $$('[data-fd]').forEach(b => b.onclick = () => { fileRows.splice(b.dataset.fd,1); draw(); check(); });
    $$('[data-ff]').forEach(inp => inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      const row = fileRows[inp.dataset.ff]; row.file = f.name; row.hash = '계산 중…'; draw();
      // 브라우저 내장 암호 기능으로 해시 계산: 올리기 전 원본의 지문을 남겨 두기 위해
      try { const buf = await crypto.subtle.digest('SHA-256', await f.arrayBuffer());
            row.hash = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join(''); }
      catch { row.hash = '(이 환경에서는 계산할 수 없음)'; }
      draw();
    });
  }
  $('#addFile').onclick = () => { fileRows.push({type:'세금계산서', file:null, hash:''}); draw(); };
  draw();

  $('#expForm').onsubmit = ev => {
    ev.preventDefault(); // 시안이라 서버로 보내지 않고 화면 안에서만 저장
    const miss = [];
    if (!$('#xVendor').value.trim()) miss.push('거래처');
    if (!$('#xPurpose').value.trim()) miss.push('구매 목적');
    if (!num($('#xSupply'))) miss.push('공급가액');
    if (!fileRows.some(r => r.file)) miss.push('증빙 파일');
    const err = $('#formErr');
    if (miss.length){ err.hidden = false; err.textContent = `입력하지 않은 항목이 있습니다: ${miss.join(', ')}`; return; }
    expenses.unshift({ id:'EX-2609-0' + (expenses.length + 8), date:$('#xDate').value, vendor:$('#xVendor').value.trim(),
      supply:num($('#xSupply')), vat:num($('#xVat')), pay:$('#xPay').value, cat:$('#xCat').value,
      purpose:$('#xPurpose').value.trim(), use:$('#xUse').value.trim() || '-', agreed:$('#xAgreed').value, by:ME.name,
      receipts:fileRows.filter(r => r.file).map(r => ({type:r.type, name:r.file})), comments:[] });
    go('expense'); toast('지출 기록을 저장했습니다');
  };
};

  $('#newRep').onclick = () => toast('작성 양식은 DB 연결 단계에서 붙입니다');
};

// ================= 일정 =================
PAGES.calendar = () => {
  const first = new Date(2026,8,1).getDay(), cells = [];
  for (let i = first; i > 0; i--) cells.push({d:32-i, other:true, key:`2026-08-${32-i}`}); // 9월 1일 앞 칸을 8월 날짜로 채움
  for (let d = 1; d <= 30; d++) cells.push({d, key:`2026-09-${String(d).padStart(2,'0')}`});
  for (let d = 1; cells.length % 7; d++) cells.push({d, other:true, key:`2026-10-${String(d).padStart(2,'0')}`});
  return `
  <div class="page-head"><div><h1>2026년 9월</h1><p>공유 일정</p></div>
    <div style="display:flex;gap:8px"><button class="btn sm" aria-label="이전 달">‹</button><button class="btn sm">오늘</button><button class="btn sm" aria-label="다음 달">›</button><button class="btn primary sm" id="addEv">일정 추가</button></div></div>
  <section class="box" style="overflow:hidden"><div class="cal">
    ${DOW.map((d,i) => `<div class="dow ${i===0?'sun':''}">${d}</div>`).join('')}
    ${cells.map((c,i) => `<div class="${c.other?'other':''} ${i%7===0?'sun':''} ${c.key==='2026-09-28'?'today':''}"><span class="dn">${c.d}</span>
      ${events.filter(e => e.d === c.key).map(e => `<span class="ev ${e.c}" title="${esc(e.t)}">${esc(e.t)}</span>`).join('')}</div>`).join('')}
  </div></section>
  <p class="sm t3">실제 운영 시에는 Google 공유 캘린더를 연결하는 방식을 권장합니다. 반복 일정과 알림을 직접 만들 필요가 없습니다.</p>`;
};
AFTER.calendar = () => { $('#addEv').onclick = () => toast('일정 추가는 캘린더 연결 단계에서 붙입니다'); };

// ================= 마이페이지 =================
PAGES.my = () => `
  <div class="page-head"><div><h1>마이페이지</h1></div></div>
  <section class="box">
    <div class="box-head"><h2>내 정보</h2><span class="sm t3">부서·직책 변경은 관리자에게 요청하세요</span></div>
    <div class="box-body"><div class="sheet">
      <div class="lb">이름</div><div class="fd">${ME.name}</div>
      <div class="lb">권한</div><div class="fd">${ME.role}</div>
      <div class="lb">부서</div><div class="fd">${ME.dept} <span class="sm t3">(${ME.deptAlt})</span></div>
      <div class="lb">직책</div><div class="fd">${ME.title}<span class="sm t3">${ME.titleEn}</span></div>
      <div class="lb">아이디</div><div class="fd">${ME.email}</div>
      <div class="lb">연락처</div><div class="fd num">${ME.phone}</div>
    </div></div>
  </section>
  <form class="box" id="pwForm" novalidate>
    <div class="box-head"><h2>비밀번호 변경</h2></div>
    <div class="box-body"><div class="sheet">
      <div class="lb">현재 비밀번호</div><div class="fd wide"><input class="input" type="password" id="pwCur" autocomplete="current-password" style="max-width:360px"></div>
      <div class="lb">새 비밀번호</div><div class="fd wide"><input class="input" type="password" id="pwNew" autocomplete="new-password" style="max-width:360px">
        <ul class="pw-rules" id="pwRules"><li data-r="len">8자 이상</li><li data-r="mix">영문과 숫자 포함</li><li data-r="diff">현재 비밀번호와 다름</li></ul></div>
      <div class="lb">새 비밀번호 확인</div><div class="fd wide"><input class="input" type="password" id="pwNew2" autocomplete="new-password" style="max-width:360px"><span class="sm" id="pwMatch"></span></div>
    </div>
    <label class="sm t2" style="display:flex;gap:6px;align-items:center;margin-top:12px"><input type="checkbox" id="pwShow"> 입력한 비밀번호 보기</label>
    <p class="sm" id="pwErr" style="color:var(--bad);margin-top:8px" hidden></p>
    <p class="sm t3" style="margin-top:8px">시안의 현재 비밀번호: demo1234</p></div>
    <div class="actions"><button type="submit" class="btn primary">비밀번호 변경</button></div>
  </form>`;
AFTER.my = () => {
  const cur = $('#pwCur'), n1 = $('#pwNew'), n2 = $('#pwNew2');
  // 화면 검사는 편의용. 실제 운영에서는 서버(Supabase)에서 같은 규칙을 다시 검사해야 함 (화면 검사는 우회 가능)
  const rules = v => ({ len: v.length >= 8, mix: /[a-zA-Z]/.test(v) && /\d/.test(v), diff: v.length > 0 && v !== cur.value });
  function check(){
    const r = rules(n1.value);
    $$('#pwRules li').forEach(li => li.classList.toggle('pass', r[li.dataset.r]));
    const m = $('#pwMatch');
    m.textContent = n2.value ? (n1.value === n2.value ? '✓ 일치합니다' : '새 비밀번호와 다릅니다') : '';
    m.style.color = n1.value === n2.value ? 'var(--ok)' : 'var(--bad)';
    return Object.values(r).every(Boolean) && n1.value === n2.value;
  }
  [cur, n1, n2].forEach(i => i.oninput = check);
  $('#pwShow').onchange = e => [cur, n1, n2].forEach(i => i.type = e.target.checked ? 'text' : 'password');
  $('#pwForm').onsubmit = ev => {
    ev.preventDefault();
    const err = $('#pwErr'); err.hidden = true;
    if (cur.value !== myPassword){ err.hidden = false; err.textContent = '현재 비밀번호가 맞지 않습니다.'; return; }
    if (!check()){ err.hidden = false; err.textContent = '새 비밀번호 조건을 모두 채우고, 확인란에 같은 값을 입력해 주세요.'; return; }
    myPassword = n1.value; [cur, n1, n2].forEach(i => i.value = ''); check();
    toast('비밀번호를 변경했습니다. 다음 로그인부터 새 비밀번호를 사용하세요');
  };
};

  $('#loginView').hidden = true; $('#appView').hidden = false; go('home');
};
