<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 본문 + 숫자 모두 Pretendard (고정폭 숫자 기능 사용) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* ══════════════════════════════════════════════
   토큰
   ══════════════════════════════════════════════ */
:root{
  --paper:#E6E9E1;
  --card:#FCFDFA;
  --ink:#141815;
  --muted:#5A6159;
  --line:#C3C9BC;
  --line-strong:#A2AB9B;
  --moss:#4E6647;
  --rain:#1F4E85;

  --row:34px;                        /* 30분 한 칸 */

  /* 글꼴 — 바꾸고 싶으면 이 두 줄만 수정 */
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --num:var(--sans);            /* 숫자도 본문과 같은 글꼴 */
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  font-variant-numeric:tabular-nums;       /* 숫자 폭 고정 */
  font-feature-settings:"tnum" 1,"ss01" 1;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding:22px 18px 60px;
}
.wrap{max-width:1000px;margin:0 auto}

/* ══════════════════════════════════════════════
   헤더 + 날짜 팝업
   ══════════════════════════════════════════════ */
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding-bottom:13px;border-bottom:2px solid var(--ink);
}
.date-main{display:flex;align-items:baseline;gap:9px;min-width:0}
.date-num{font-family:var(--num);font-weight:700;font-size:clamp(26px,6.8vw,35px);letter-spacing:-.015em}
.date-dow{font-size:15px;color:var(--muted);font-weight:600}

.nav{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.nav button{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:17px;font-weight:500;
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;
  width:38px;height:38px;padding:0;cursor:pointer;
}
.nav button:hover{background:#fff;border-color:var(--muted)}
.nav button:focus-visible{outline:2px solid var(--moss);outline-offset:1px}

.cal-wrap{position:relative}
.cal-pop{
  position:absolute;right:0;top:44px;z-index:40;
  background:var(--card);border:1px solid var(--line-strong);
  border-radius:9px;padding:11px;
  box-shadow:0 8px 22px rgba(20,24,21,.16);
  display:flex;flex-direction:column;gap:8px;
}
.cal-pop[hidden]{display:none}
.cal-pop input{
  font-family:var(--num);font-size:15px;
  border:1px solid var(--line);border-radius:6px;
  padding:9px 10px;background:#fff;color:var(--ink);min-height:42px;
}
.cal-pop .go{
  font-family:var(--sans);font-size:14px;font-weight:600;
  background:var(--ink);color:var(--card);
  border:none;border-radius:6px;min-height:40px;width:100%;cursor:pointer;
}

/* ══════════════════════════════════════════════
   날씨
   ══════════════════════════════════════════════ */
.weather{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.chip{
  display:flex;flex-direction:column;gap:1px;
  background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:7px 13px;
}
.chip .k{font-size:10.5px;letter-spacing:.09em;color:var(--muted);font-weight:700}
.chip .v{font-family:var(--num);font-size:19px;font-weight:600;line-height:1.2}
.chip .v .lo{color:var(--muted);font-weight:400;font-size:16px}
.chip.cond{background:#DFE6EC;border-color:#B5C4D1;justify-content:center}
.chip.cond .v{font-family:var(--sans);font-size:17px;letter-spacing:-.01em}
.chip.wet{background:#DBE7F4;border-color:#9DBBD9}
.chip.wet .k,.chip.wet .v{color:var(--rain)}
.chip.hot{background:#F6E3D8;border-color:#DEB79E}
.w-loading{font-size:14px;color:var(--muted);padding:6px 0}

.rain-alert{
  display:flex;gap:10px;align-items:baseline;
  background:#DBE7F4;border:1px solid #9DBBD9;border-left:5px solid var(--rain);
  padding:10px 14px;margin-top:9px;border-radius:7px;font-size:14.5px;
}
.rain-alert b{color:var(--rain);font-family:var(--num);font-weight:700}

/* ══════════════════════════════════════════════
   본문
   ══════════════════════════════════════════════ */
.cols{display:grid;grid-template-columns:1fr 290px;gap:34px;margin-top:24px}
.col-title{
  font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;
  margin-bottom:11px;padding-bottom:6px;border-bottom:2px solid var(--line-strong);
}

/* 타임라인 */
.timeline{
  display:grid;
  grid-template-columns:44px 13px repeat(var(--lanes,1),minmax(0,1fr));
  column-gap:8px;position:relative;
}
.hr{
  grid-column:1;font-family:var(--num);font-size:13px;font-weight:600;
  color:var(--muted);text-align:right;padding-top:2px;letter-spacing:-.005em;
}
.hr.day2{color:var(--moss)}

.tick{
  grid-column:2;position:relative;
  border-top:1.5px solid var(--line-strong);
  background:rgba(20,24,21,.055);
}
.tick.alt{background:transparent}
.tick::after{
  content:"";position:absolute;top:50%;left:0;right:0;
  border-top:1px dotted var(--line-strong);
}
.tick.last{border-bottom:1.5px solid var(--line-strong)}

.blk{
  background:var(--bg,#F2F3EF);
  border:1px solid var(--bd,#D5D8D1);
  border-left:5px solid var(--bar,#9AA096);
  border-radius:5px;margin-bottom:3px;padding:3px 9px;
  display:flex;align-items:center;justify-content:center;   /* 중앙 정렬 */
  overflow:hidden;min-width:0;
}
.blk .t{
  display:block;max-width:100%;
  font-size:15px;font-weight:600;line-height:1.25;letter-spacing:-.015em;
  text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.blk.free{
  background:rgba(20,24,21,.042);
  border-color:rgba(20,24,21,.075);
  border-left-color:rgba(20,24,21,.12);
}
.blk.free .t{
  font-size:11px;font-weight:600;letter-spacing:.18em;
  color:var(--muted);opacity:.65;
}

.now{
  grid-column:2/-1;height:0;border-top:2px solid #B03A22;
  position:relative;z-index:5;pointer-events:none;
}
.now::before{
  content:"";position:absolute;left:-5px;top:-5px;
  width:9px;height:9px;border-radius:50%;background:#B03A22;
}

/* 사이드 */
.panel{margin-bottom:18px;break-inside:avoid}
.panel h3{font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;margin-bottom:8px}
.box{
  background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--moss);
  border-radius:0 7px 7px 0;padding:12px 15px;
}
.box ul{list-style:none}
.box li{
  padding:7px 0 7px 15px;position:relative;
  font-size:15.5px;line-height:1.45;border-bottom:1px dotted var(--line);
}
.box li:first-child{padding-top:0}
.box li:first-child::before{top:8px}
.box li:last-child{border-bottom:none;padding-bottom:0}
.box li::before{
  content:"";position:absolute;left:1px;top:15px;
  width:5px;height:5px;background:var(--moss);border-radius:50%;
}
.box p{font-size:15px;line-height:1.5;color:#2C332B}
.box p+p{margin-top:6px}
.box.reminder{border-left-color:#B0562A}
.box.reminder li::before{background:#B0562A}
.box.study{border-left-color:#2E5E8E}
.box.study li::before{background:#2E5E8E}
.box.workout{border-left-color:#B03A22}
.box.workout li::before{background:#B03A22}

/* 식사 — 다른 박스와 같은 껍데기, 안에서만 3분할 */
.meals{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--card);border:1px solid var(--line);
  border-left:5px solid #4A7A42;
  border-radius:0 7px 7px 0;overflow:hidden;
}
.meal{padding:11px 8px;text-align:center;border-left:1px dotted var(--line)}
.meal:first-child{border-left:none}
.meal b{
  display:block;font-family:var(--num);font-size:11px;letter-spacing:.1em;
  color:var(--muted);font-weight:700;margin-bottom:4px;
}
.meal span{font-size:15px;line-height:1.4;word-break:keep-all}

.empty{font-size:14.5px;color:var(--muted);padding:6px 0}

/* ══════════════════════════════════════════════
   반응형
   ══════════════════════════════════════════════ */
@media(max-width:820px){
  .cols{grid-template-columns:1fr;gap:26px}
  aside{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
}
@media(max-width:560px){
  :root{--row:40px}
  body{padding:15px 13px 60px}

  .date-num{font-weight:700}
  .nav button{width:36px;height:36px;font-size:16px}

  /* 날씨 압축 */
  .weather{gap:6px;margin-top:12px}
  .chip{flex:1 1 auto;padding:5px 10px;border-radius:6px;
        flex-direction:row;align-items:baseline;gap:6px}
  .chip .k{font-size:10px}
  .chip .v{font-size:15px}
  .chip .v .lo{font-size:13px}
  .chip.cond{padding:5px 12px}
  .chip.cond .v{font-size:14.5px}
  .rain-alert{font-size:13.5px;padding:9px 12px;margin-top:7px}

  .timeline{grid-template-columns:40px 12px repeat(var(--lanes,1),minmax(0,1fr));column-gap:7px}
  .blk{padding:4px 9px}
  .blk .t{font-size:15.5px}

  aside{grid-template-columns:1fr;gap:0}
  .box li{padding:9px 0 9px 15px;font-size:16px}
  .box li::before{top:17px}
}
@media(max-width:380px){
  .timeline{grid-template-columns:36px 11px repeat(var(--lanes,1),minmax(0,1fr));column-gap:6px}
  .blk{padding:3px 7px}
  .meals{grid-template-columns:1fr}
  .meal{border-left:none;border-top:1px dotted var(--line);text-align:left;padding:9px 13px}
  .meal:first-child{border-top:none}
  .meal b{display:inline-block;margin:0 9px 0 0;min-width:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="date-main">
      <span class="date-num" id="dateNum">—</span>
      <span class="date-dow" id="dateDow"></span>
    </div>
    <div class="nav">
      <button id="prev" aria-label="이전 날">‹</button>
      <div class="cal-wrap">
        <button id="calBtn" aria-label="날짜 선택" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="5" width="18" height="16" rx="2.5"/>
            <path d="M8 2.5v4M16 2.5v4M3 10.5h18"/>
          </svg>
        </button>
        <div class="cal-pop" id="calPop" hidden>
          <input type="date" id="picker" aria-label="날짜">
          <button class="go" id="today">오늘로</button>
        </div>
      </div>
      <button id="next" aria-label="다음 날">›</button>
    </div>
  </header>

  <section class="weather" id="weather"><span class="w-loading">날씨 불러오는 중</span></section>
  <div id="alertSlot"></div>

  <div class="cols">
    <div>
      <div class="col-title">시간표</div>
      <div class="timeline" id="timeline"></div>
    </div>
    <aside id="side"></aside>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════
   설정
   ══════════════════════════════════════════════ */
const CONFIG = {
  lat:37.8656, lon:127.7414,      // 춘천시 효자동
  tz:"Asia/Seoul",
  dataPath: d => `./data/${d}.json`,
  frameStart: 7*60,               // 표 기본 시작 07:00
  frameEnd  : 24*60,              // 표 기본 끝 24:00
  dayResetHour: 6                 // 하루 경계 06:00
};

const SAMPLE = {
  slots:[
    {t:"07:00",i:["기상","약 복용"]},
    {t:"07:30",i:["헬스장"]},{t:"08:00",i:["헬스장"]},{t:"08:30",i:["헬스장"]},
    {t:"09:00",i:["헬스장"]},{t:"09:30",i:["헬스장"]},
    {t:"10:00",i:["프로틴","샤워"]},
    {t:"11:00",i:["이동"]},
    {t:"11:30",i:["자료구조 수업"]},{t:"12:00",i:["자료구조 수업"]},
    {t:"12:30",i:["점심"]},
    {t:"13:00",i:["이산수학 수업"]},{t:"13:30",i:["이산수학 수업"]},
    {t:"14:00",i:["도서관 과제"]},{t:"14:30",i:["도서관 과제"]},
    {t:"15:00",i:["도서관 과제"]},{t:"15:30",i:["도서관 과제"]},
    {t:"16:00",i:["도서관 과제"]},{t:"16:30",i:["도서관 과제"]},
    {t:"17:30",i:["저녁"]},
    {t:"18:00",i:["러닝"]},
    {t:"19:00",i:["샤워"]},
    {t:"19:30",i:["공부"]},{t:"20:00",i:["공부"]},{t:"20:30",i:["공부"]},
    {t:"21:00",i:["공부 (예습)"]},{t:"21:30",i:["공부 (예습)"]},
    {t:"22:00",i:["공부 (예습)"]},{t:"22:30",i:["공부 (예습)"]},
    {t:"23:00",i:["정리","독서"]},{t:"23:30",i:["정리","독서"]},
    {t:"24:00",i:["취침 준비"]}
  ],
  reminders:["도서관 책 반납","교수님 메일 답장 (오후까지)"],
  study:["자료구조 3장 정리","이산수학 과제"],
  meals:{"아침":"프로틴","점심":"학식","저녁":"닭가슴살, 밥"},
  workout:["등 / 이두"],
  memo:["러닝은 우천시 생략"]
};

/* ══════════════════════════════════════════════
   유틸
   ══════════════════════════════════════════════ */
const DOW=["일","월","화","수","목","금","토"];
const ymd=d=>new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);

function toMin(s){const[h,m]=s.split(":").map(Number);return h*60+m;}
function fmt(min){return String(Math.floor(min/60)%24).padStart(2,"0")+":"+String(min%60).padStart(2,"0");}

/* 하루 경계 06:00 — 새벽 5시까지는 전날로 친다 */
function todayStr(){
  return ymd(new Date(Date.now()-CONFIG.dayResetHour*3600*1000));
}
/* 실제 벽시계 기준 날짜·시각 (현재 시각선 계산용) */
function clockNow(){
  const p=new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.tz,hour12:false,hour:"2-digit",minute:"2-digit"})
            .format(new Date()).split(":").map(Number);
  return {date:ymd(new Date()), min:p[0]*60+p[1]};
}
function shiftDate(d,delta){
  const dt=new Date(d+"T12:00:00Z");dt.setUTCDate(dt.getUTCDate()+delta);
  return dt.toISOString().slice(0,10);
}

/* 색 배분용 제목 정규화 — 괄호 안은 무시 */
function normTitle(t){
  return t.replace(/[（(][^）)]*[）)]/g,"").replace(/\s+/g," ").trim()||t.trim();
}
function hueBase(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360;}
function buildPalette(titles,dateStr){
  const keys=[...new Set(titles.map(normTitle))];
  const base=hueBase(dateStr),step=360/Math.max(keys.length,1),map={};
  keys.forEach((k,i)=>{
    const h=Math.round((base+i*step)%360);
    map[k]={bar:`hsl(${h} 52% 40%)`,bg:`hsl(${h} 58% 93%)`,bd:`hsl(${h} 40% 76%)`};
  });
  return map;
}

/* ══════════════════════════════════════════════
   블록 계산
   ══════════════════════════════════════════════ */
function buildBlocks(slots,startMin,stepCount){
  const grid=Array.from({length:stepCount},()=>[]);
  slots.forEach(s=>{
    const idx=(toMin(s.t)-startMin)/30;
    if(idx>=0&&idx<stepCount) grid[idx]=s.i;
  });

  const blocks=[],seen=grid.map(()=>new Set());
  for(let r=0;r<stepCount;r++){
    for(const title of grid[r]){
      if(seen[r].has(title))continue;
      let span=1;
      while(r+span<stepCount&&grid[r+span].includes(title)){seen[r+span].add(title);span++;}
      blocks.push({title,from:r,span});
    }
  }

  blocks.sort((a,b)=>a.from-b.from||b.span-a.span);
  const lanes=[];
  blocks.forEach(b=>{
    let l=0;
    while(true){
      if(!lanes[l])lanes[l]=[];
      if(!lanes[l].some(o=>b.from<o.from+o.span&&o.from<b.from+b.span)){lanes[l].push(b);b.lane=l;break;}
      l++;
    }
  });
  const laneCount=Math.max(1,lanes.filter(l=>l.length).length);

  blocks.forEach(b=>{
    let w=1;
    while(b.lane+w<laneCount){
      if(blocks.some(o=>o!==b&&o.lane===b.lane+w&&b.from<o.from+o.span&&o.from<b.from+b.span))break;
      w++;
    }
    b.width=w;
  });

  for(let r=0;r<stepCount;r++){
    if(grid[r].length)continue;
    let span=1;
    while(r+span<stepCount&&!grid[r+span].length)span++;
    blocks.push({title:span>=2?"자유":"",free:true,from:r,span,lane:0,width:laneCount});
    r+=span-1;
  }
  return {blocks,laneCount};
}

/* 넘치면 한 줄에 들어갈 때까지 축소 */
function fitText(el){
  const t=el.querySelector(".t");
  if(!t||!t.textContent)return;
  let size=parseFloat(getComputedStyle(t).fontSize),guard=0;
  while(size>9.5&&t.scrollWidth>t.clientWidth+1&&guard++<40){
    size-=0.5;t.style.fontSize=size+"px";
  }
}

/* ══════════════════════════════════════════════
   렌더 — 타임라인
   ══════════════════════════════════════════════ */
function renderTimeline(data){
  const el=document.getElementById("timeline");
  el.innerHTML="";
  if(!data.slots||!data.slots.length){
    el.innerHTML='<p class="empty">이 날짜의 시간표가 없습니다.</p>';return;
  }

  const mins=data.slots.map(s=>toMin(s.t));
  const startMin=Math.min(CONFIG.frameStart,...mins);
  const endMin  =Math.max(CONFIG.frameEnd,Math.max(...mins)+30);
  const stepCount=(endMin-startMin)/30;

  const {blocks,laneCount}=buildBlocks(data.slots,startMin,stepCount);
  const palette=buildPalette(data.slots.flatMap(s=>s.i),data.date);

  el.style.setProperty("--lanes",laneCount);
  el.style.gridTemplateRows=`repeat(${stepCount}, var(--row))`;

  let hourIdx=0;
  for(let r=0;r<stepCount;r++){
    const m=startMin+r*30;
    if(m%60)continue;
    const hr=document.createElement("div");
    hr.className="hr"+(m>=1440?" day2":"");
    hr.style.gridRow=`${r+1} / span 2`;
    hr.textContent=fmt(m);
    el.appendChild(hr);

    const tk=document.createElement("div");
    tk.className="tick"+(hourIdx%2?" alt":"")+(r+2>=stepCount?" last":"");
    tk.style.gridRow=`${r+1} / span 2`;
    el.appendChild(tk);
    hourIdx++;
  }

  blocks.forEach(b=>{
    const d=document.createElement("div");
    d.className=b.free?"blk free":"blk";
    d.style.gridRow=`${b.from+1} / span ${b.span}`;
    d.style.gridColumn=`${3+b.lane} / span ${b.width}`;
    if(!b.free){
      const c=palette[normTitle(b.title)];
      if(c){d.style.setProperty("--bar",c.bar);d.style.setProperty("--bg",c.bg);d.style.setProperty("--bd",c.bd);}
    }
    const s=startMin+b.from*30;
    d.title=`${fmt(s)}–${fmt(s+b.span*30)}  ${b.title||"자유"}`;
    d.innerHTML=`<span class="t">${b.title}</span>`;
    el.appendChild(d);
  });

  let nowLine=null;
  if(data.date===todayStr()){
    const c=clockNow();
    // 자정을 넘겼으면 전날 표의 24:00+ 위치로
    const cur=c.date===data.date? c.min : c.min+1440;
    if(cur>=startMin&&cur<=endMin){
      nowLine=document.createElement("div");
      nowLine.className="now";
      nowLine.style.gridRow=`${Math.floor((cur-startMin)/30)+1} / span 1`;
      nowLine.style.marginTop=`calc(var(--row) * ${((cur-startMin)%30)/30})`;
      el.appendChild(nowLine);
    }
  }

  requestAnimationFrame(()=>{
    el.querySelectorAll(".blk").forEach(fitText);
    if(nowLine) nowLine.scrollIntoView({block:"center",behavior:"instant"});
  });
}

/* ══════════════════════════════════════════════
   렌더 — 사이드
   ══════════════════════════════════════════════ */
function renderSide(d){
  const out=[];
  const boxList=(title,arr,cls)=>{
    if(!arr||!arr.length)return;
    out.push(`<div class="panel"><h3>${title}</h3><div class="box ${cls}"><ul>${
      arr.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`);
  };
  boxList("리마인더",d.reminders,"reminder");
  boxList("공부",d.study,"study");
  if(d.meals&&Object.keys(d.meals).length){
    out.push(`<div class="panel"><h3>식사</h3><div class="meals">${
      Object.entries(d.meals).map(([k,v])=>`<div class="meal"><b>${k}</b><span>${v}</span></div>`).join("")}</div></div>`);
  }
  boxList("운동",d.workout,"workout");
  if(d.memo&&d.memo.length){
    out.push(`<div class="panel"><h3>메모</h3><div class="box">${
      d.memo.map(m=>`<p>${m}</p>`).join("")}</div></div>`);
  }
  document.getElementById("side").innerHTML=out.join("")||'<p class="empty">기록된 항목이 없습니다.</p>';
}

/* ══════════════════════════════════════════════
   날씨
   ══════════════════════════════════════════════ */
const WMO={0:"맑음",1:"대체로 맑음",2:"구름 조금",3:"흐림",45:"안개",48:"짙은 안개",
  51:"약한 이슬비",53:"이슬비",55:"강한 이슬비",56:"어는 이슬비",57:"어는 이슬비",
  61:"약한 비",63:"비",65:"강한 비",66:"어는 비",67:"어는 비",
  71:"약한 눈",73:"눈",75:"강한 눈",77:"싸락눈",
  80:"소나기",81:"소나기",82:"강한 소나기",85:"눈 소나기",86:"강한 눈 소나기",
  95:"뇌우",96:"우박 뇌우",99:"우박 뇌우"};

function rainySpans(times,probs){
  const spans=[];let s=null;
  times.forEach((t,i)=>{
    const h=Number(t.slice(11,13));
    if((probs[i]??0)>=50){if(s===null)s=h;}
    else if(s!==null){spans.push([s,h]);s=null;}
  });
  if(s!==null)spans.push([s,24]);
  return spans.map(([a,b])=>a+1===b?`${a}시`:`${a}–${b}시`);
}

async function loadWeather(date){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`
    +`&hourly=precipitation_probability,relative_humidity_2m`
    +`&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    +`&timezone=${encodeURIComponent(CONFIG.tz)}&start_date=${date}&end_date=${date}`;
  const box=document.getElementById("weather"),alertSlot=document.getElementById("alertSlot");
  alertSlot.innerHTML="";
  try{
    const j=await (await fetch(url)).json();
    const dd=j.daily;
    if(!dd||dd.time?.length!==1||dd.temperature_2m_max[0]==null)throw new Error();
    const hi=Math.round(dd.temperature_2m_max[0]),lo=Math.round(dd.temperature_2m_min[0]);
    const pop=dd.precipitation_probability_max[0]??0,cond=WMO[dd.weather_code[0]]??"—";
    const hum=j.hourly?.relative_humidity_2m??[];
    const humAvg=hum.length?Math.round(hum.reduce((a,b)=>a+(b??0),0)/hum.length):null;

    box.innerHTML=`
      <div class="chip cond"><span class="v">${cond}</span></div>
      <div class="chip ${hi>=30?"hot":""}"><span class="k">기온</span>
        <span class="v">${hi}°<span class="lo"> / ${lo}°</span></span></div>
      ${humAvg!=null?`<div class="chip"><span class="k">습도</span><span class="v">${humAvg}%</span></div>`:""}
      <div class="chip ${pop>=50?"wet":""}"><span class="k">강수</span><span class="v">${pop}%</span></div>`;

    if(pop>=50){
      const spans=rainySpans(j.hourly?.time??[],j.hourly?.precipitation_probability??[]);
      alertSlot.innerHTML=`<div class="rain-alert"><b>${pop}%</b><span>${
        spans.length?spans.join(", ")+" 사이 비 예보입니다. 야외 일정을 확인하세요."
                    :"우천 예보입니다. 야외 일정을 확인하세요."}</span></div>`;
    }
  }catch(e){
    box.innerHTML=`<span class="w-loading">이 날짜의 날씨 정보는 없습니다</span>`;
  }
}

/* ══════════════════════════════════════════════
   메인
   ══════════════════════════════════════════════ */
async function load(date){
  document.getElementById("picker").value=date;
  const dt=new Date(date+"T12:00:00Z");
  document.getElementById("dateNum").textContent=date.replace(/-/g,".");
  document.getElementById("dateDow").textContent=`(${DOW[dt.getUTCDay()]})`;
  history.replaceState(null,"",`?date=${date}`);

  loadWeather(date);

  let data;
  try{
    const r=await fetch(CONFIG.dataPath(date));
    if(!r.ok)throw new Error();
    data=await r.json();
  }catch(e){
    data=JSON.parse(JSON.stringify(SAMPLE));
  }
  data.date=date;
  renderTimeline(data);
  renderSide(data);
}

let current=new URLSearchParams(location.search).get("date")||todayStr();

const pop=document.getElementById("calPop"),calBtn=document.getElementById("calBtn");
function togglePop(open){
  pop.hidden=!open;
  calBtn.setAttribute("aria-expanded",String(open));
}
calBtn.onclick=e=>{e.stopPropagation();togglePop(pop.hidden);};
document.addEventListener("click",e=>{if(!pop.hidden&&!pop.contains(e.target))togglePop(false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape")togglePop(false);});

document.getElementById("prev").onclick=()=>load(current=shiftDate(current,-1));
document.getElementById("next").onclick=()=>load(current=shiftDate(current,1));
document.getElementById("today").onclick=()=>{load(current=todayStr());togglePop(false);};
document.getElementById("picker").onchange=e=>{
  if(e.target.value){load(current=e.target.value);togglePop(false);}
};

window.addEventListener("resize",()=>{
  document.querySelectorAll(".blk .t").forEach(t=>t.style.fontSize="");
  document.querySelectorAll(".blk").forEach(fitText);
});

load(current);
</script>
