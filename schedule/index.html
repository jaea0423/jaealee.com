<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 기록</title>

<!-- 본문용 Pretendard -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<!-- 숫자·영문 라벨용 Space Grotesk -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════
   제목용 Gmarket Sans (굵은 한글 디스플레이)
   ══════════════════════════════════════════════ */
@font-face{
  font-family:'GmarketSans';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
  font-weight:700; font-display:swap;
}

/* ══════════════════════════════════════════════
   토큰 — 색·간격은 여기서 한 번에 관리
   ══════════════════════════════════════════════ */
:root{
  --paper:#EEF0F5;        /* 페이지 배경 (차가운 포슬린) */
  --surface:#FFFFFF;      /* 카드 배경 */
  --surface-2:#F7F8FB;    /* 카드 안쪽 옅은 면 */
  --ink:#171A24;          /* 본문 */
  --ink-2:#5D6478;        /* 보조 */
  --ink-3:#98A0B3;        /* 가장 흐림 */
  --line:#DCE0EA;         /* 테두리 */
  --line-2:#C6CCDA;       /* 강한 테두리 */
  --hl:#FFE86B;           /* 형광펜 노랑 (시그니처) */
  --focus:#3B5BFF;        /* 포커스 링 */

  --rain:#1E5AA8;         /* 비 관련 강조 */
  --rain-bg:#E4EDF9;
  --rain-bd:#AFC8E6;
  --hot:#B4501F;          /* 더위 강조 */
  --hot-bg:#FBEADF;
  --hot-bd:#E6C0A3;
  --now:#D63B22;          /* 현재 시각선 */

  /* 사이드 섹션 색 (참고 파일의 인덱스 탭 색) */
  --tab-remind:#FF8A6B;
  --tab-study:#6BC3FF;
  --tab-meal:#5FDCAF;
  --tab-workout:#FFC94D;
  --tab-memo:#B79BFF;

  --row:38px;             /* 30분 한 칸 높이 */
  --r:14px;               /* 기본 모서리 */
  --shadow:0 1px 2px rgba(23,26,36,.04), 0 8px 24px rgba(23,26,36,.06);

  /* 글꼴 — 바꾸고 싶으면 이 세 줄만 수정 */
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --display:'GmarketSans',"Pretendard Variable",Pretendard,sans-serif;
  --mono:'Space Grotesk',"Pretendard Variable",sans-serif;   /* 숫자·영문 라벨 */
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;line-height:1.6;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1,"ss01" 1;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding:22px 20px 80px;
  /* 아주 옅은 모눈 결 — 기록 페이지라는 신호 */
  background-image:
    linear-gradient(rgba(23,26,36,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23,26,36,.022) 1px, transparent 1px);
  background-size:28px 28px;
}
.wrap{max-width:1060px;margin:0 auto}
a{color:inherit;text-decoration:none}

:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}

/* ══════════════════════════════════════════════
   상단 바
   ══════════════════════════════════════════════ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{
  font-family:var(--mono);font-size:12px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
}
.today-badge{
  display:none;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;letter-spacing:.1em;
  background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:999px;
}
.today-badge.on{display:inline-flex}
.today-badge i{width:6px;height:6px;border-radius:50%;background:var(--hl)}

/* ══════════════════════════════════════════════
   히어로 — 날짜 + 이동 버튼
   ══════════════════════════════════════════════ */
.hero{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:18px;flex-wrap:wrap;
  padding-bottom:20px;margin-bottom:20px;
  border-bottom:1px solid var(--line-2);
}
.hero-l{min-width:0}
.title-row{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.title{
  position:relative;display:inline-block;
  font-family:var(--display);font-weight:700;
  font-size:clamp(34px,7vw,52px);line-height:1.06;letter-spacing:-.02em;
  padding:0 5px;
}
/* 제목 뒤 형광펜 자국 */
.title::before{
  content:'';position:absolute;left:0;right:0;bottom:7%;height:34%;
  background:var(--hl);border-radius:3px;z-index:-1;
  transform:scaleX(0);transform-origin:left center;
  animation:swipe .6s cubic-bezier(.22,1,.36,1) .15s forwards;
}
@keyframes swipe{to{transform:scaleX(1)}}
.title-dow{
  font-family:var(--sans);font-size:clamp(16px,3vw,20px);
  font-weight:700;color:var(--ink-2);letter-spacing:-.01em;
}
.subtitle{
  font-family:var(--mono);font-weight:500;
  font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);margin:13px 0 0 6px;
}

/* 날짜 이동 버튼 */
.nav{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.nav button{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:18px;font-weight:600;
  background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line);border-radius:11px;
  width:44px;height:44px;padding:0;cursor:pointer;
  box-shadow:0 1px 2px rgba(23,26,36,.04);
  transition:color .16s ease,border-color .16s ease,transform .16s ease;
}
.nav button:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-2px)}
.nav button svg{width:19px;height:19px}

.cal-wrap{position:relative}
.cal-pop{
  position:absolute;right:0;top:52px;z-index:40;
  background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r);padding:13px;
  box-shadow:0 16px 40px rgba(23,26,36,.18);
  display:flex;flex-direction:column;gap:9px;min-width:200px;
}
.cal-pop[hidden]{display:none}
.cal-pop input{
  font-family:var(--mono);font-size:15px;
  border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;background:var(--surface-2);color:var(--ink);min-height:44px;
}
.cal-pop .go{
  font-family:var(--sans);font-size:14px;font-weight:700;
  background:var(--ink);color:#fff;
  border:none;border-radius:9px;min-height:42px;width:100%;cursor:pointer;
}
.cal-pop .go:hover{background:#000}

/* ══════════════════════════════════════════════
   날씨 칩 줄 + 오늘의 뉴스 버튼
   ══════════════════════════════════════════════ */
.wxbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.weather{display:flex;gap:9px;flex-wrap:wrap;flex:1 1 auto;min-width:0}

.chip{
  display:flex;flex-direction:column;gap:2px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:9px 15px;min-width:78px;
  box-shadow:0 1px 2px rgba(23,26,36,.03);
}
.chip .k{
  font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.chip .v{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1.15}
.chip .v .lo{color:var(--ink-3);font-weight:400;font-size:16px}
.chip.cond{justify-content:center;background:var(--surface-2);border-color:var(--line-2)}
.chip.cond .v{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:-.01em}
.chip.wet{background:var(--rain-bg);border-color:var(--rain-bd)}
.chip.wet .k,.chip.wet .v{color:var(--rain)}
.chip.hot{background:var(--hot-bg);border-color:var(--hot-bd)}
.chip.hot .k,.chip.hot .v{color:var(--hot)}
.w-loading{font-size:14px;color:var(--ink-3);padding:9px 2px}

/* 오늘의 뉴스 버튼 */
.news-btn{
  display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:12px 20px;
  border:1.5px solid var(--ink);border-radius:999px;
  background:transparent;color:var(--ink);
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.news-btn:hover{background:var(--ink);color:#fff;transform:translateY(-2px)}
.news-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--hl);flex:0 0 auto}
.news-btn .arw{font-family:var(--mono);font-size:15px;font-weight:500}

/* 비 예보 띠 */
.rain-alert{
  display:flex;gap:11px;align-items:baseline;
  background:var(--rain-bg);border:1px solid var(--rain-bd);
  border-left:5px solid var(--rain);
  padding:12px 16px;margin-top:11px;border-radius:0 11px 11px 0;
  font-size:14.5px;line-height:1.5;
}
.rain-alert b{color:var(--rain);font-family:var(--mono);font-weight:700;flex:0 0 auto}

/* ══════════════════════════════════════════════
   본문 레이아웃
   ══════════════════════════════════════════════ */
.cols{display:grid;grid-template-columns:1fr 300px;gap:26px;margin-top:22px;align-items:start}

.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:22px 22px 26px;box-shadow:var(--shadow);
}
.panel-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:15px;margin-bottom:19px;border-bottom:1px solid var(--line);
}
.panel-head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.panel-head span{
  font-family:var(--mono);font-size:11.5px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}

/* ══════════════════════════════════════════════
   타임라인
   ══════════════════════════════════════════════ */
.timeline{
  display:grid;
  grid-template-columns:50px 14px repeat(var(--lanes,1),minmax(0,1fr));
  column-gap:9px;position:relative;
}
.hr{
  grid-column:1;
  font-family:var(--mono);font-size:13px;font-weight:600;
  color:var(--ink-2);text-align:right;padding-top:1px;
}
.hr.day2{color:var(--tab-memo);font-weight:700}

/* 시간 눈금자 */
.tick{
  grid-column:2;position:relative;
  border-top:1.5px solid var(--line-2);
  background:rgba(23,26,36,.035);
  border-radius:2px;
}
.tick.alt{background:transparent}
.tick::after{
  content:"";position:absolute;top:50%;left:0;right:0;
  border-top:1px dotted var(--line-2);
}
.tick.last{border-bottom:1.5px solid var(--line-2)}

/* 일정 블록 */
.blk{
  background:var(--bg,#F2F3F7);
  border:1px solid var(--bd,#D7DBE4);
  border-left:5px solid var(--bar,#9AA0AE);
  border-radius:4px 10px 10px 4px;
  margin-bottom:3px;padding:4px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;overflow:hidden;min-width:0;
}
.blk .t{
  display:block;max-width:100%;
  font-size:15.5px;font-weight:700;line-height:1.24;letter-spacing:-.015em;
  text-align:center;color:var(--tx,var(--ink));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 1시간 이상이면 제목 줄바꿈 허용 + 시간 표시 */
.blk.multi .t{white-space:normal;word-break:keep-all}
.blk .tm{
  font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.04em;color:var(--tx,var(--ink-2));opacity:.62;
  white-space:nowrap;
}

/* 자유 시간 — 화면을 덮지 않게 최대한 비운다 */
.blk.free{
  background:transparent;
  border:1px dashed var(--line-2);
  border-left:1px dashed var(--line-2);
  border-radius:8px;
}
.blk.free .t{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);opacity:.8;
}

/* 현재 시각선 */
.now{
  grid-column:2/-1;height:0;border-top:2px solid var(--now);
  position:relative;z-index:6;pointer-events:none;
}
.now::before{
  content:"";position:absolute;left:-4px;top:-5px;
  width:9px;height:9px;border-radius:50%;background:var(--now);
}
.now::after{
  content:attr(data-time);position:absolute;left:-59px;top:-10px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.02em;
  color:#fff;background:var(--now);padding:2px 6px;border-radius:5px;
}

/* 자정 경계 */
.daybreak{
  grid-column:2/-1;height:0;
  border-top:1.5px dashed var(--tab-memo);
  position:relative;z-index:5;pointer-events:none;
}
.daybreak::after{
  content:"다음 날";position:absolute;right:4px;top:-9px;
  background:var(--surface);padding:0 8px;
  font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  color:var(--tab-memo);
}

/* ══════════════════════════════════════════════
   사이드 — 인덱스 탭 카드
   ══════════════════════════════════════════════ */
aside{display:flex;flex-direction:column;gap:18px}

.card{
  position:relative;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:19px 17px 16px;
  box-shadow:0 1px 2px rgba(23,26,36,.04);
  break-inside:avoid;
}
/* 카드 위로 삐져나온 색 탭 */
.card::before{
  content:'';position:absolute;top:-7px;left:17px;
  width:46px;height:14px;border-radius:5px 5px 0 0;
  background:var(--tab,var(--ink-3));
}
.card h3{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid var(--line);
}
.card h3 em{
  font-family:var(--mono);font-style:normal;
  font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
}
.card ul{list-style:none}
.card li{
  position:relative;padding:9px 0 9px 17px;
  font-size:15.5px;line-height:1.5;word-break:keep-all;
  border-bottom:1px dotted var(--line);
}
.card li:first-child{padding-top:0}
.card li:first-child::before{top:7px}
.card li:last-child{border-bottom:none;padding-bottom:2px}
.card li::before{
  content:"";position:absolute;left:2px;top:16px;
  width:6px;height:6px;border-radius:50%;background:var(--tab,var(--ink-3));
}
.card p{font-size:15px;line-height:1.6;color:var(--ink-2);word-break:keep-all}
.card p+p{margin-top:8px}

/* 식사 — 카드 안에서만 3분할 */
.meals{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;
}
.meal{padding:12px 8px;text-align:center;border-left:1px dotted var(--line)}
.meal:first-child{border-left:none}
.meal b{
  display:block;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px;
}
.meal span{font-size:14.5px;font-weight:500;line-height:1.4;word-break:keep-all}

/* 데이터가 없는 날 */
.empty{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  border:1px dashed var(--line-2);border-radius:var(--r);
  padding:46px 20px;text-align:center;
}
.empty b{font-size:16px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em}
.empty span{font-size:13.5px;color:var(--ink-3);line-height:1.6;word-break:keep-all}
.side-empty{
  background:var(--surface);border:1px dashed var(--line-2);
  border-radius:var(--r);padding:20px;text-align:center;
  font-size:14px;color:var(--ink-3);
}

/* 하단 저장 시각 */
.stamp{
  display:flex;align-items:center;justify-content:flex-end;gap:9px;
  margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
}
.stamp[hidden]{display:none}
.stamp-k{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.stamp-v{
  font-family:var(--mono);font-size:13px;font-weight:500;
  letter-spacing:.02em;color:var(--ink-2);
}

/* ══════════════════════════════════════════════
   반응형
   ══════════════════════════════════════════════ */
@media(max-width:880px){
  .cols{grid-template-columns:1fr;gap:22px}
  aside{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
}
@media(max-width:620px){
  :root{--row:42px}
  body{padding:16px 14px 60px}
  .topbar{margin-bottom:18px}
  .hero{padding-bottom:16px;margin-bottom:16px;align-items:center}
  .subtitle{margin-top:10px;font-size:11.5px;letter-spacing:.18em}
  .nav button{width:41px;height:41px;border-radius:10px}

  /* 날씨 압축 — 가로 한 줄로 */
  .weather{gap:7px}
  .chip{
    flex:1 1 auto;min-width:0;padding:7px 12px;border-radius:10px;
    flex-direction:row;align-items:baseline;gap:7px;
  }
  .chip .k{font-size:9.5px}
  .chip .v{font-size:16px}
  .chip .v .lo{font-size:13.5px}
  .chip.cond .v{font-size:15px}
  .news-btn{width:100%;justify-content:center;padding:13px 18px}
  .rain-alert{font-size:13.5px;padding:11px 13px}

  .panel{padding:17px 15px 20px;border-radius:16px}
  .timeline{grid-template-columns:44px 12px repeat(var(--lanes,1),minmax(0,1fr));column-gap:8px}
  .now::after{left:-53px}
  .blk{padding:4px 9px}
  .blk .t{font-size:15.5px}

  aside{grid-template-columns:1fr;gap:16px}
  .card li{font-size:16px}
}
@media(max-width:400px){
  .timeline{grid-template-columns:40px 11px repeat(var(--lanes,1),minmax(0,1fr));column-gap:7px}
  .now::after{left:-48px;font-size:10px}
  .blk{padding:3px 7px}
  .meals{grid-template-columns:1fr}
  .meal{border-left:none;border-top:1px dotted var(--line);text-align:left;padding:10px 13px}
  .meal:first-child{border-top:none}
  .meal b{display:inline-block;margin:0 10px 0 0;min-width:36px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .title::before{transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ────────── 상단 바 ────────── -->
  <div class="topbar">
    <span class="brand">Haru Log</span>
    <span class="today-badge" id="todayBadge"><i></i>오늘</span>
  </div>

  <!-- ────────── 히어로: 날짜 + 이동 버튼 ────────── -->
  <header class="hero">
    <div class="hero-l">
      <div class="title-row">
        <h1 class="title" id="dateTitle">—</h1>
        <span class="title-dow" id="dateDow"></span>
      </div>
      <p class="subtitle" id="dateSub"></p>
    </div>

    <div class="nav">
      <button id="prev" aria-label="이전 날">‹</button>
      <div class="cal-wrap">
        <button id="calBtn" aria-label="날짜 선택" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <rect x="3" y="5" width="18" height="16" rx="2.5"/>
            <path d="M8 2.5v4M16 2.5v4M3 10.5h18"/>
          </svg>
        </button>
        <div class="cal-pop" id="calPop" hidden>
          <input type="date" id="picker" aria-label="날짜">
          <button class="go" id="today">오늘로</button>
        </div>
      </div>
      <button id="next" aria-label="다음 날">›</button>
    </div>
  </header>

  <!-- ────────── 날씨 칩 + 오늘의 뉴스 ────────── -->
  <section class="wxbar">
    <div class="weather" id="weather"><span class="w-loading">날씨 불러오는 중</span></div>
    <a class="news-btn" id="newsBtn" href="https://jaealee.com/news/view.html">
      <span class="dot"></span>오늘의 뉴스<span class="arw">→</span>
    </a>
  </section>
  <div id="alertSlot"></div>

  <!-- ────────── 본문 ────────── -->
  <div class="cols">
    <section class="panel">
      <div class="panel-head">
        <h2>시간표</h2>
        <span id="tlMeta">Timetable</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>
    <aside id="side"></aside>
  </div>

  <footer class="stamp" id="stamp" hidden></footer>

</div>

<script>
/* ══════════════════════════════════════════════
   설정
   ══════════════════════════════════════════════ */
const CONFIG = {
  lat:37.8656, lon:127.7414,      // 춘천시 효자동
  tz:"Asia/Seoul",
  dataPath: d => `./data/${d}.json`,
  newsUrl : d => `https://jaealee.com/news/view.html?date=${d}`,
  frameStart: 7*60,               // 표 기본 시작 07:00
  frameEnd  : 24*60,              // 표 기본 끝 24:00
  dayResetHour: 6                 // 하루 경계 06:00
};

/* ══════════════════════════════════════════════
   유틸
   ══════════════════════════════════════════════ */
const DOW=["일","월","화","수","목","금","토"];
const DOW_EN=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const ymd=d=>new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);

function toMin(s){const[h,m]=s.split(":").map(Number);return h*60+m;}
function fmt(min){return String(Math.floor(min/60)%24).padStart(2,"0")+":"+String(min%60).padStart(2,"0");}

/* 하루 경계 06:00 — 새벽 5시까지는 전날로 친다 */
function todayStr(){
  return ymd(new Date(Date.now()-CONFIG.dayResetHour*3600*1000));
}
/* 실제 벽시계 기준 날짜·시각 (현재 시각선 계산용) */
function clockNow(){
  const p=new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.tz,hour12:false,hour:"2-digit",minute:"2-digit"})
            .format(new Date()).split(":").map(Number);
  return {date:ymd(new Date()), min:p[0]*60+p[1]};
}
function shiftDate(d,delta){
  const dt=new Date(d+"T12:00:00Z");dt.setUTCDate(dt.getUTCDate()+delta);
  return dt.toISOString().slice(0,10);
}

/* 색 배분용 제목 정규화 — 괄호 안은 무시 */
function normTitle(t){
  return t.replace(/[（(][^）)]*[）)]/g,"").replace(/\s+/g," ").trim()||t.trim();
}
function hueBase(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360;}
function buildPalette(titles,dateStr){
  const keys=[...new Set(titles.map(normTitle))];
  const base=hueBase(dateStr),step=360/Math.max(keys.length,1),map={};
  keys.forEach((k,i)=>{
    const h=Math.round((base+i*step)%360);
    map[k]={
      bar:`hsl(${h} 54% 42%)`,
      bg :`hsl(${h} 62% 94%)`,
      bd :`hsl(${h} 44% 79%)`,
      tx :`hsl(${h} 48% 24%)`     /* 제목도 같은 계열로 — 스캔이 쉬워진다 */
    };
  });
  return map;
}

/* ══════════════════════════════════════════════
   블록 계산
   ══════════════════════════════════════════════ */
function buildBlocks(slots,startMin,stepCount){
  const grid=Array.from({length:stepCount},()=>[]);
  slots.forEach(s=>{
    const idx=(toMin(s.t)-startMin)/30;
    if(idx>=0&&idx<stepCount) grid[idx]=s.i;
  });

  const blocks=[],seen=grid.map(()=>new Set());
  for(let r=0;r<stepCount;r++){
    for(const title of grid[r]){
      if(seen[r].has(title))continue;
      let span=1;
      while(r+span<stepCount&&grid[r+span].includes(title)){seen[r+span].add(title);span++;}
      blocks.push({title,from:r,span});
    }
  }

  blocks.sort((a,b)=>a.from-b.from||b.span-a.span);
  const lanes=[];
  blocks.forEach(b=>{
    let l=0;
    while(true){
      if(!lanes[l])lanes[l]=[];
      if(!lanes[l].some(o=>b.from<o.from+o.span&&o.from<b.from+b.span)){lanes[l].push(b);b.lane=l;break;}
      l++;
    }
  });
  const laneCount=Math.max(1,lanes.filter(l=>l.length).length);

  blocks.forEach(b=>{
    let w=1;
    while(b.lane+w<laneCount){
      if(blocks.some(o=>o!==b&&o.lane===b.lane+w&&b.from<o.from+o.span&&o.from<b.from+b.span))break;
      w++;
    }
    b.width=w;
  });

  for(let r=0;r<stepCount;r++){
    if(grid[r].length)continue;
    let span=1;
    while(r+span<stepCount&&!grid[r+span].length)span++;
    blocks.push({title:span>=2?"자유":"",free:true,from:r,span,lane:0,width:laneCount});
    r+=span-1;
  }
  return {blocks,laneCount};
}

/* 넘치면 들어갈 때까지 축소
   — 한 줄 블록은 가로 넘침, 여러 줄 블록은 세로 넘침을 본다 */
function fitText(el){
  const t=el.querySelector(".t");
  if(!t||!t.textContent)return;
  t.style.fontSize="";
  let size=parseFloat(getComputedStyle(t).fontSize),guard=0;
  const over=()=>t.scrollWidth>t.clientWidth+1||el.scrollHeight>el.clientHeight+1;
  while(size>10&&over()&&guard++<40){
    size-=0.5;t.style.fontSize=size+"px";
  }
}

/* ══════════════════════════════════════════════
   렌더 — 타임라인
   ══════════════════════════════════════════════ */
function renderTimeline(data){
  const el=document.getElementById("timeline");
  const meta=document.getElementById("tlMeta");
  el.innerHTML="";
  if(!data.slots||!data.slots.length){
    el.style.gridTemplateRows="";
    el.style.gridTemplateColumns="1fr";
    el.innerHTML='<div class="empty"><b>기록이 없습니다</b>'
      +'<span>이 날짜의 시간표는 아직 작성되지 않았습니다.</span></div>';
    meta.textContent="No record";
    return;
  }
  el.style.gridTemplateColumns="";

  const mins=data.slots.map(s=>toMin(s.t));
  const startMin=Math.min(CONFIG.frameStart,...mins);
  const endMin  =Math.max(CONFIG.frameEnd,Math.max(...mins)+30);
  const stepCount=(endMin-startMin)/30;

  const {blocks,laneCount}=buildBlocks(data.slots,startMin,stepCount);
  const palette=buildPalette(data.slots.flatMap(s=>s.i),data.date);

  el.style.setProperty("--lanes",laneCount);
  el.style.gridTemplateRows=`repeat(${stepCount}, var(--row))`;

  /* 채워진 슬롯 시간 합계를 헤더에 표시 */
  const busy=data.slots.length*0.5;
  meta.textContent=`${fmt(startMin)}–${fmt(endMin)} · ${busy}H 기록`;

  let hourIdx=0;
  for(let r=0;r<stepCount;r++){
    const m=startMin+r*30;
    if(m%60)continue;
    const hr=document.createElement("div");
    hr.className="hr"+(m>=1440?" day2":"");
    hr.style.gridRow=`${r+1} / span 2`;
    hr.textContent=fmt(m);
    el.appendChild(hr);

    const tk=document.createElement("div");
    tk.className="tick"+(hourIdx%2?" alt":"")+(r+2>=stepCount?" last":"");
    tk.style.gridRow=`${r+1} / span 2`;
    el.appendChild(tk);
    hourIdx++;
  }

  blocks.forEach(b=>{
    const d=document.createElement("div");
    const multi=!b.free&&b.span>=2;
    d.className=(b.free?"blk free":"blk")+(multi?" multi":"");
    d.style.gridRow=`${b.from+1} / span ${b.span}`;
    d.style.gridColumn=`${3+b.lane} / span ${b.width}`;
    if(!b.free){
      const c=palette[normTitle(b.title)];
      if(c){
        d.style.setProperty("--bar",c.bar);
        d.style.setProperty("--bg",c.bg);
        d.style.setProperty("--bd",c.bd);
        d.style.setProperty("--tx",c.tx);
      }
    }
    const s=startMin+b.from*30, e=s+b.span*30;
    d.title=`${fmt(s)}–${fmt(e)}  ${b.title||"자유"}`;
    d.innerHTML=`<span class="t">${b.title}</span>`
      +(multi?`<span class="tm">${fmt(s)}–${fmt(e)}</span>`:"");
    el.appendChild(d);
  });

  /* 자정 경계선 */
  if(endMin>1440&&startMin<1440){
    const db=document.createElement("div");
    db.className="daybreak";
    db.style.gridRow=`${(1440-startMin)/30+1} / span 1`;
    el.appendChild(db);
  }

  /* 현재 시각선 */
  let nowLine=null;
  if(data.date===todayStr()){
    const c=clockNow();
    // 자정을 넘겼으면 전날 표의 24:00+ 위치로
    const cur=c.date===data.date? c.min : c.min+1440;
    if(cur>=startMin&&cur<=endMin){
      nowLine=document.createElement("div");
      nowLine.className="now";
      nowLine.dataset.time=fmt(cur);
      nowLine.style.gridRow=`${Math.floor((cur-startMin)/30)+1} / span 1`;
      nowLine.style.marginTop=`calc(var(--row) * ${((cur-startMin)%30)/30})`;
      el.appendChild(nowLine);
    }
  }

  requestAnimationFrame(()=>{
    el.querySelectorAll(".blk").forEach(fitText);
    if(nowLine) nowLine.scrollIntoView({block:"center",behavior:"instant"});
  });
}

/* ══════════════════════════════════════════════
   렌더 — 사이드
   ══════════════════════════════════════════════ */
const SECTIONS=[
  {key:"reminders",title:"리마인더",en:"Reminders",tab:"--tab-remind"},
  {key:"study",    title:"공부",    en:"Study",    tab:"--tab-study"},
  {key:"meals",    title:"식사",    en:"Meals",    tab:"--tab-meal"},
  {key:"workout",  title:"운동",    en:"Workout",  tab:"--tab-workout"},
  {key:"memo",     title:"메모",    en:"Memo",     tab:"--tab-memo"}
];

function renderSide(d){
  const out=[];
  SECTIONS.forEach(s=>{
    const v=d[s.key];
    if(!v)return;
    const head=`<h3>${s.title}<em>${s.en}</em></h3>`;
    const open=`<div class="card" style="--tab:var(${s.tab})">`;

    if(s.key==="meals"){
      const keys=Object.keys(v);
      if(!keys.length)return;
      out.push(open+head+`<div class="meals">${
        keys.map(k=>`<div class="meal"><b>${k}</b><span>${v[k]}</span></div>`).join("")
      }</div></div>`);
      return;
    }
    if(!v.length)return;
    if(s.key==="memo"){
      out.push(open+head+v.map(m=>`<p>${m}</p>`).join("")+`</div>`);
      return;
    }
    out.push(open+head+`<ul>${v.map(x=>`<li>${x}</li>`).join("")}</ul></div>`);
  });
  document.getElementById("side").innerHTML=
    out.join("")||'<div class="side-empty">기록된 항목이 없습니다.</div>';
}

/* ══════════════════════════════════════════════
   렌더 — 하단 저장 시각
   ══════════════════════════════════════════════ */
function renderStamp(d){
  const el=document.getElementById("stamp");
  if(!d.savedAt){el.hidden=true;el.innerHTML="";return;}
  el.hidden=false;
  let txt=d.savedAt;
  const t=new Date(d.savedAt);
  if(!isNaN(t)){
    const p=n=>String(n).padStart(2,"0");
    const f=new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.tz,
      year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(t);
    const g=k=>f.find(x=>x.type===k).value;
    txt=`${g("year")}.${g("month")}.${g("day")} ${p(g("hour"))}:${g("minute")}`;
  }
  el.innerHTML=`<span class="stamp-k">기록 저장</span><span class="stamp-v">${txt}</span>`;
}

/* ══════════════════════════════════════════════
   날씨
   ══════════════════════════════════════════════ */
const WMO={0:"맑음",1:"대체로 맑음",2:"구름 조금",3:"흐림",45:"안개",48:"짙은 안개",
  51:"약한 이슬비",53:"이슬비",55:"강한 이슬비",56:"어는 이슬비",57:"어는 이슬비",
  61:"약한 비",63:"비",65:"강한 비",66:"어는 비",67:"어는 비",
  71:"약한 눈",73:"눈",75:"강한 눈",77:"싸락눈",
  80:"소나기",81:"소나기",82:"강한 소나기",85:"눈 소나기",86:"강한 눈 소나기",
  95:"뇌우",96:"우박 뇌우",99:"우박 뇌우"};

function rainySpans(times,probs){
  const spans=[];let s=null;
  times.forEach((t,i)=>{
    const h=Number(t.slice(11,13));
    if((probs[i]??0)>=50){if(s===null)s=h;}
    else if(s!==null){spans.push([s,h]);s=null;}
  });
  if(s!==null)spans.push([s,24]);
  return spans.map(([a,b])=>a+1===b?`${a}시`:`${a}–${b}시`);
}

async function loadWeather(date){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`
    +`&hourly=precipitation_probability,relative_humidity_2m`
    +`&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    +`&timezone=${encodeURIComponent(CONFIG.tz)}&start_date=${date}&end_date=${date}`;
  const box=document.getElementById("weather"),alertSlot=document.getElementById("alertSlot");
  alertSlot.innerHTML="";
  try{
    const j=await (await fetch(url)).json();
    const dd=j.daily;
    if(!dd||dd.time?.length!==1||dd.temperature_2m_max[0]==null)throw new Error();
    const hi=Math.round(dd.temperature_2m_max[0]),lo=Math.round(dd.temperature_2m_min[0]);
    const pop=dd.precipitation_probability_max[0]??0,cond=WMO[dd.weather_code[0]]??"—";
    const hum=j.hourly?.relative_humidity_2m??[];
    const humAvg=hum.length?Math.round(hum.reduce((a,b)=>a+(b??0),0)/hum.length):null;

    box.innerHTML=`
      <div class="chip cond"><span class="v">${cond}</span></div>
      <div class="chip ${hi>=30?"hot":""}"><span class="k">기온</span>
        <span class="v">${hi}°<span class="lo"> / ${lo}°</span></span></div>
      ${humAvg!=null?`<div class="chip"><span class="k">습도</span><span class="v">${humAvg}%</span></div>`:""}
      <div class="chip ${pop>=50?"wet":""}"><span class="k">강수</span><span class="v">${pop}%</span></div>`;

    if(pop>=50){
      const spans=rainySpans(j.hourly?.time??[],j.hourly?.precipitation_probability??[]);
      alertSlot.innerHTML=`<div class="rain-alert"><b>${pop}%</b><span>${
        spans.length?spans.join(", ")+" 사이 비 예보입니다. 야외 일정을 확인하세요."
                    :"우천 예보입니다. 야외 일정을 확인하세요."}</span></div>`;
    }
  }catch(e){
    box.innerHTML=`<span class="w-loading">이 날짜의 날씨 정보는 없습니다</span>`;
  }
}

/* ══════════════════════════════════════════════
   메인
   ══════════════════════════════════════════════ */
async function load(date){
  document.getElementById("picker").value=date;

  const dt=new Date(date+"T12:00:00Z");
  const mo=dt.getUTCMonth()+1, dy=dt.getUTCDate(), dw=dt.getUTCDay();

  document.getElementById("dateTitle").textContent=`${mo}월 ${dy}일`;
  document.getElementById("dateDow").textContent=`(${DOW[dw]})`;
  document.getElementById("dateSub").textContent=`${date.replace(/-/g,".")} · ${DOW_EN[dw]}`;

  // 오늘 배지
  document.getElementById("todayBadge").classList.toggle("on",date===todayStr());

  // 오늘의 뉴스 버튼 — 보고 있는 날짜로 연결
  const nb=document.getElementById("newsBtn");
  nb.href=CONFIG.newsUrl(date);
  nb.title=`${date.replace(/-/g,".")} 뉴스`;

  history.replaceState(null,"",`?date=${date}`);

  loadWeather(date);

  // JSON이 없으면 빈 화면을 보여준다. 예시 데이터로 채우지 않는다.
  let data;
  try{
    const r=await fetch(CONFIG.dataPath(date));
    if(!r.ok)throw new Error();
    data=await r.json();
  }catch(e){
    data={missing:true};
  }
  data.date=date;
  renderTimeline(data);
  renderSide(data);
  renderStamp(data);
}

let current=new URLSearchParams(location.search).get("date")||todayStr();

const pop=document.getElementById("calPop"),calBtn=document.getElementById("calBtn");
function togglePop(open){
  pop.hidden=!open;
  calBtn.setAttribute("aria-expanded",String(open));
}
calBtn.onclick=e=>{e.stopPropagation();togglePop(pop.hidden);};
document.addEventListener("click",e=>{if(!pop.hidden&&!pop.contains(e.target))togglePop(false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape")togglePop(false);});

document.getElementById("prev").onclick=()=>load(current=shiftDate(current,-1));
document.getElementById("next").onclick=()=>load(current=shiftDate(current,1));
document.getElementById("today").onclick=()=>{load(current=todayStr());togglePop(false);};
document.getElementById("picker").onchange=e=>{
  if(e.target.value){load(current=e.target.value);togglePop(false);}
};

/* 좌우 방향키로 날짜 이동 */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowLeft") load(current=shiftDate(current,-1));
  if(e.key==="ArrowRight")load(current=shiftDate(current,1));
});

window.addEventListener("resize",()=>{
  document.querySelectorAll(".blk").forEach(fitText);
});

load(current);
</script>
