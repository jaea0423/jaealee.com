<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>박보영의 영어교실</title>
<!-- Pretendard 폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ===== 디자인 토큰 =====
     민트 테마 : 순수 민트(#3EB489 등)는 흰 배경에서 가독성이 떨어져서
     글자/버튼은 어두운 민트, 배경 포인트는 연한 민트로 타협 */
  :root{
    --accent:#0E9384;          /* 어두운 민트 (글자·버튼용, 대비 확보) */
    --accent-soft:#E4F6F1;     /* 연한 민트 (배경 포인트) */
    --ink:#1B1D1F;             /* 본문 글자 */
    --body:#3A3E44;            /* 긴 글 본문 */
    --sub:#8A8F98;             /* 보조 글자 */
    --faint:#C2C6CC;           /* 아주 흐린 글자 */
    --line:#EEF0F2;            /* 구분선·연회색 채움 */
    --card:#FFFFFF;            /* 카드 배경 */
    --bg:#FAFAFA;              /* 앱 내부 배경 */
    --desk:#ECEDEF;            /* 폰 프레임 바깥(PC) 배경 */
    --danger:#E5484D;
    --radius:18px;
  }
  /* 다크모드 토큰 */
  body.dark{
    --accent:#3BCBB0;
    --accent-soft:#12352F;
    --ink:#ECEEF0;
    --body:#C9CDD2;
    --sub:#9AA0A8;
    --faint:#5A6066;
    --line:#2A2E33;
    --card:#1E2225;
    --bg:#141719;
    --desk:#0B0C0E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;
    background:var(--desk);
    display:flex;justify-content:center;align-items:center;
    color:var(--ink);
  }

  /* ===== 폰 프레임 ===== */
  .phone{
    width:400px;height:min(860px,100dvh);
    background:var(--bg);
    display:flex;flex-direction:column;
    overflow:hidden;position:relative;
    border-radius:40px;
    box-shadow:0 24px 60px rgba(0,0,0,.18), 0 0 0 10px #1B1D1F;
  }
  @media (max-width:480px){
    body{background:var(--bg)}
    .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  }

  /* ===== 헤더 : 중앙 브랜드, 좌 마이페이지 / 우 로그아웃 ===== */
  header{padding:44px 20px 12px;text-align:center;position:relative}
  header .brand{font-size:20px;font-weight:800;letter-spacing:-.4px}
  header .brand em{font-style:normal;color:var(--accent)}
  header .tagline{font-size:12px;color:var(--sub);margin-top:3px}
  header .hbtn{
    position:absolute;top:46px;border:none;background:none;
    font-family:inherit;cursor:pointer;color:var(--sub);padding:2px;
  }
  header .hbtn svg{width:21px;height:21px;display:block}
  header .brand{cursor:pointer}
  header .hbtn.left{left:22px}
  header .hbtn.right{right:22px}

  /* ===== 본문 ===== */
  main{flex:1;overflow-y:auto;padding:4px 20px 24px;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .view{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ===== 공통 ===== */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:12px;
  }
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);margin:18px 2px 8px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent)}
  .badge.gray{background:var(--line);color:var(--sub)}
  .btn{
    display:block;width:100%;padding:13px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  body.dark .btn{color:#0B2A25}
  .btn.ghost{background:var(--accent-soft);color:var(--accent)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .txt{
    width:100%;padding:13px 16px;font-size:14px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:14px;background:var(--card);
    color:var(--ink);outline:none;
  }
  .txt:focus{border-color:var(--accent)}
  textarea.txt{resize:none;min-height:84px;line-height:1.6}

  /* ===== 로그인(게이트) ===== */
  .gate{padding-top:7vh;text-align:center}
  .gate .emoji{font-size:44px;margin-bottom:14px}
  .gate h2{font-size:19px;font-weight:800}
  .gate .desc{font-size:13px;color:var(--sub);margin-top:6px}
  .gate form{margin-top:22px;position:relative}
  .gate input{
    width:100%;padding:15px 48px 15px 18px;font-size:15px;font-family:inherit;text-align:center;
    border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);outline:none;
  }
  .gate input:focus{border-color:var(--accent)}
  .gate form button{
    position:absolute;right:7px;top:7px;bottom:7px;width:38px;
    border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;
  }
  .dots{display:flex;justify-content:center;gap:14px;margin:26px 0 8px}
  .dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:.15s}
  .dots i.fill{background:var(--accent);transform:scale(1.1)}
  .dots.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:250px;margin:18px auto 0}
  .pad button{
    height:58px;border:1px solid var(--line);border-radius:16px;background:var(--card);
    font-family:inherit;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .pad button:active{background:var(--accent-soft)}
  .pad button.fn{background:none;border:none;font-size:13px;font-weight:700;color:var(--sub)}
  .keyhint{font-size:11px;color:var(--faint);margin-top:16px}

  /* ===== 홈 ===== */
  .hello{margin:8px 2px 4px}
  .hello .date{font-size:12px;color:var(--sub)}
  .hello h1{font-size:21px;font-weight:800;margin-top:4px;line-height:1.4}
  .hello h1 b{color:var(--accent)}
  .next{background:var(--accent);color:#fff;border:none;cursor:pointer}
  body.dark .next{color:#0B2A25}
  .next .lbl{font-size:12px;opacity:.85;font-weight:600}
  .next .when{font-size:18px;font-weight:800;margin-top:5px}
  .next .place{font-size:12.5px;opacity:.9;margin-top:8px}
  .next .dday{
    float:right;background:rgba(255,255,255,.25);font-size:12px;font-weight:800;
    padding:4px 10px;border-radius:99px;
  }
  body.dark .next .dday{background:rgba(0,0,0,.18)}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quick .card{margin:0;cursor:pointer}
  .quick .num{font-size:22px;font-weight:800;color:var(--accent);margin-top:6px}
  .quick .lbl{font-size:12px;color:var(--sub)}
  .preview{cursor:pointer}
  .preview p{font-size:13px;line-height:1.65;color:var(--body);margin-top:8px}

  /* ===== 공통 행 ===== */
  .row-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row-head b{font-size:14px}
  .row-head .score{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap}
  .row-meta{font-size:12px;color:var(--sub);margin:4px 0 10px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--sub);white-space:nowrap}
  .kv b{font-weight:600;text-align:right}

  /* ===== 일정 : 캘린더 ===== */
  .cal .cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .cal .cal-top b{font-size:14px;font-weight:800}
  .cal .cal-top button{
    border:none;background:var(--line);width:28px;height:28px;border-radius:9px;
    font-family:inherit;font-size:14px;font-weight:800;color:var(--sub);cursor:pointer;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .cal-dow{font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
  .cal-day{font-size:13px;padding:7px 0;border-radius:10px;color:var(--ink)}
  .cal-day.out{color:transparent}
  .cal-day.past{color:var(--faint)}
  .cal-day.lesfut{background:var(--accent);color:#fff;font-weight:800}
  body.dark .cal-day.lesfut{color:#0B2A25}
  .cal-day.lespast{background:var(--line);color:var(--sub)}
  .cal-day.lesplan{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:700}

  .lesson{display:flex;align-items:center;gap:12px}
  .lesson .time{
    min-width:52px;text-align:center;background:var(--accent-soft);color:var(--accent);
    font-weight:800;font-size:13px;padding:10px 4px;border-radius:12px;line-height:1.4;
  }
  .lesson .who{flex:1}
  .lesson .who b{font-size:14px}
  .lesson .who span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
  details.fold{margin-top:6px}
  details.fold summary{
    list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--sub);padding:10px 2px;
  }
  details.fold summary::before{content:"▸ "}
  details.fold[open] summary::before{content:"▾ "}
  .lesson.gone{opacity:.55}
  .lesson.gone .time{background:var(--line);color:var(--sub)}

  /* ===== 요약 ===== */
  .note-card{cursor:pointer}
  .note-card .d{font-size:11px;font-weight:700;color:var(--accent)}
  .note-card h3{font-size:14.5px;font-weight:800;margin:5px 0 6px}
  .note-card p{font-size:13px;line-height:1.7;color:var(--body)}
  .note-card .go{font-size:12px;font-weight:700;color:var(--accent);margin-top:8px}

  /* ===== 퀴즈 ===== */
  .quiz-actions{display:flex;gap:8px;margin-top:12px}
  .quiz-actions .btn{padding:10px;font-size:13px}
  /* 안 풀어본 퀴즈 : 카드 자체를 민트로 강조 */
  .card.fresh{background:var(--accent);border-color:var(--accent)}
  .card.fresh .row-head b{color:#fff}
  .card.fresh .row-head .score{color:rgba(255,255,255,.85)}
  .card.fresh .row-meta{color:rgba(255,255,255,.75)}
  .card.fresh .btn{background:#fff;color:var(--accent)}
  body.dark .card.fresh .row-head b{color:#0B2A25}
  body.dark .card.fresh .row-head .score{color:rgba(11,42,37,.8)}
  body.dark .card.fresh .row-meta{color:rgba(11,42,37,.7)}
  body.dark .card.fresh .btn{background:#0B2A25;color:var(--accent)}

  /* 카카오톡 버튼 */
  .kakao-row{display:flex;align-items:center;gap:12px}
  .kakao-btn{
    display:flex;align-items:center;gap:6px;border:none;cursor:pointer;flex-shrink:0;
    background:#FEE500;color:#191919;font-family:inherit;font-size:12.5px;font-weight:800;
    padding:10px 14px;border-radius:12px;
  }
  .kakao-row p{font-size:12px;color:var(--sub);line-height:1.5}

  /* 팝업(모달) */
  .modal{
    position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:28px;
  }
  .modal[hidden]{display:none}
  .modal-box{background:var(--card);border-radius:20px;padding:20px;width:100%;animation:fade .18s ease}
  .modal-box h3{font-size:15px;font-weight:800;margin-bottom:12px}
  .modal-box p{font-size:13px;color:var(--body);line-height:1.6}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .modal-actions .btn{padding:11px;font-size:13px}
  .q-progress{font-size:12px;font-weight:700;color:var(--sub);margin:14px 2px 6px}
  .q-text{font-size:16px;font-weight:800;line-height:1.5;margin:6px 2px 16px}
  .choice{
    display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .choice:active{border-color:var(--accent);background:var(--accent-soft)}
  .result-score{text-align:center;padding:10px 0 4px}
  .result-score .big{font-size:34px;font-weight:800;color:var(--accent)}
  .result-score .msg{font-size:13px;color:var(--sub);margin-top:4px}
  .r-item{padding:12px 0;border-bottom:1px solid var(--line)}
  .r-item:last-child{border-bottom:none}
  .r-item .q{font-size:13.5px;font-weight:700;line-height:1.5}
  .r-item .a{font-size:12.5px;margin-top:5px;line-height:1.6;color:var(--body)}
  .r-item .a b{color:var(--accent)}
  .r-item .a .x{color:var(--danger);font-weight:700}

  /* ===== 숙제 ===== */
  .hw{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
  .hw .chk{
    width:22px;height:22px;border-radius:8px;border:2px solid var(--faint);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;margin-top:1px;
  }
  .hw.done .chk{background:var(--accent);border-color:var(--accent)}
  .hw .body{flex:1}
  .hw .body b{font-size:14px}
  .hw.done .body b{text-decoration:line-through;color:var(--sub)}
  .hw .body span{display:block;font-size:12px;color:var(--sub);margin-top:3px}

  /* ===== Q&A ===== */
  .qna{cursor:pointer}
  .qna .d{font-size:11px;color:var(--sub)}
  .qna .q{font-size:14px;font-weight:700;line-height:1.55;margin:5px 0 0}
  .qna .ans{
    display:none;margin-top:10px;
    background:var(--accent-soft);border-radius:12px;padding:11px 13px;
    font-size:13px;line-height:1.65;color:var(--body);
  }
  .qna.open .ans{display:block}
  .qna .ans-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
  .qna .ans-head b{color:var(--accent);font-size:12px}
  .qna .ans-head span{font-size:11px;color:var(--sub)}
  .qna .tap{text-align:center;font-size:10px;color:var(--faint);margin-top:8px}
  .qna.open .tap{display:none}

  /* ===== 마이페이지 ===== */
  .my-profile{display:flex;align-items:center;gap:14px}
  .my-profile .avatar{
    width:54px;height:54px;border-radius:20px;background:var(--accent);color:#fff;
    font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;
  }
  body.dark .my-profile .avatar{color:#0B2A25}
  .my-profile h2{font-size:17px;font-weight:800}
  .my-profile p{font-size:12px;color:var(--sub);margin-top:3px}
  .switch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .switch-row:last-child{border-bottom:none}
  .switch-row span{font-size:13.5px;font-weight:600}
  .switch{
    width:46px;height:26px;border-radius:99px;background:var(--line);border:none;cursor:pointer;
    position:relative;transition:.2s;flex-shrink:0;
  }
  .switch::after{
    content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .switch.on{background:var(--accent)}
  .switch.on::after{left:23px}
  .pin-form input{margin-bottom:10px;text-align:center;letter-spacing:6px;font-weight:700}

  /* ===== 하단 탭바 ===== */
  nav{
    display:flex;background:var(--card);border-top:1px solid var(--line);
    padding:8px 4px calc(10px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1;border:none;background:none;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:600;color:var(--faint);padding:4px 0;
  }
  nav button svg{width:21px;height:21px;stroke:currentColor}
  nav button.on{color:var(--accent)}

  /* ===== 토스트 ===== */
  #toast{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    background:#2A2D31;color:#fff;font-size:13px;font-weight:600;
    padding:11px 18px;border-radius:99px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:.25s;z-index:9;
  }
  #toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="phone">
  <header>
    <button class="hbtn left"  id="myBtn"     style="display:none" onclick="goMy()"></button>
    <div class="brand" id="brand" onclick="goHomeBrand()"></div>
    <div class="tagline" id="tagline"></div>
    <button class="hbtn right" id="logoutBtn" style="display:none" onclick="logout()"></button>
  </header>

  <main id="main"></main>
  <nav id="nav" style="display:none"></nav>
  <div class="modal" id="modal" hidden onclick="if(event.target===this)closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div id="toast"></div>
</div>

<script>

        brief: "to부정사 명사적 용법을 배우고, 예문 만들기 연습을 했어요.",

      { d: "6월 30일 (화)", title: "단어시험 + 독해 유형 3", place: "차지 강남점",

const today = new Date();

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), 2200);
}
function pct(a,b){ return Math.round(a/b*100); }
function parseD(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dayKey(d){ return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); }
function fmtDate(d){ return `${d.getMonth()+1}월 ${d.getDate()}일 (${STR.ko.dows[d.getDay()]})`; }
function placeFor(d){ return DB.placeChanges[iso(d)] || me.place; }

// 확정된 과외만 노출 (정규 요일이 있어도 매주 조율 후 확정되는 구조)
function upcoming(n = 2){
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const out = me.confirmed.map(parseD)
    .filter(d => dayKey(d) >= dayKey(today))
    .sort((a,b) => a - b)
    .slice(0, n)
    .map(d => {
      const diff = Math.round((d - t0) / 86400000);
      return { date: d, label: `${fmtDate(d)} ${T().fmtTime(me.lessonTime)}`,
               dday: diff === 0 ? T().today : diff === 1 ? T().tomorrow : `D-${diff}` };
    });
  // 확정 일정이 다 지났으면 정규 요일 기준으로 임시 생성 (화면이 비지 않게)
  if(out.length === 0){
    for(let i = 0; i < 28 && out.length < n; i++){
      const d = new Date(today); d.setDate(d.getDate() + i);
      if(me.lessonDows.includes(d.getDay()))
        out.push({ date: d, label: `${fmtDate(d)} ${T().fmtTime(me.lessonTime)}`,
                   dday: i === 0 ? T().today : i === 1 ? T().tomorrow : `D-${i}` });
    }
  }
  return out;
}
// 출생연도 기준 : 고등학생(한국나이 17~19)은 학년으로, 그 이후는 나이로 표시
function ageLabel(){
  const ka = today.getFullYear() - me.birthYear + 1;   // 한국나이
  if(ka >= 17 && ka <= 19) return `고${ka - 16}`;
  return `${ka}세`;
}
function fmtDateFull(d){ return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; }
// 지금까지 함께한 수업 횟수 (시작일부터 오늘까지의 수업 요일 수)
function lessonCount(){
  let c = 0;
  const d = parseD(me.started);
  while(dayKey(d) <= dayKey(today)){
    if(me.lessonDows.includes(d.getDay())) c++;
    d.setDate(d.getDate()+1);
  }
  return c;
}

const TEACHER = { id: "teacher", name: "박보영", pin: "1234" };

function submitName(e){
  e.preventDefault();
  const v = $("#q").value.trim();
  if(!v) return false;
  const stu = (v === TEACHER.name || v.includes(TEACHER.name))
    ? TEACHER
    : DB.students.find(s => s.name === v || v.includes(s.name));
  if(stu) renderGatePin(stu);
  else toast(T().unknown(v));
  return false;
}

function renderGatePin(stu){
  pinBuf = "";
  pinStu = stu;
  $("#main").innerHTML = `
  <div class="view gate">
    <div class="emoji">🔐</div>
    <h2>${stu.id === "teacher" ? `${stu.name} 선생님, Welcome!` : T().welcome(stu.name)}</h2>
    <div class="desc">${T().pinDesc}</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join("")}
      <button class="fn" onclick="renderGateName()">${T().back0}</button>
      <button onclick="pinPress('0')">0</button>
      <button class="fn" onclick="pinPress('del')">${T().del}</button>
    </div>
    <div class="keyhint">${T().keyhint}</div>
  </div>`;

  document.onkeydown = (e)=>{
    if(!pinStu) return;
    if(/^[0-9]$/.test(e.key)) pinPress(e.key);
    else if(e.key === "Backspace") pinPress("del");
    else if(e.key === "Escape") renderGateName();
  };
}

function pinPress(key){
  if(key === "del") pinBuf = pinBuf.slice(0, -1);
  else if(pinBuf.length < 4) pinBuf += key;

  document.querySelectorAll("#dots i").forEach((dot,i)=>
    dot.classList.toggle("fill", i < pinBuf.length));

  if(pinBuf.length === 4){
    if(pinBuf === pinStu.pin){
      if(pinStu.id === "teacher"){ setTimeout(()=>location.href = "teacher/index.html", 150); return; }
      me = pinStu;
      setTimeout(openApp, 150);
    }else{
      const dots = $("#dots");
      dots.classList.add("shake");
      toast(T().wrongPin);
      setTimeout(()=>{
        pinBuf = "";
        dots.classList.remove("shake");
        document.querySelectorAll("#dots i").forEach(d=>d.classList.remove("fill"));
      }, 350);
    }
  }
}

function calNav(diff){
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+diff, 1);
  go('schedule');
}
function renderCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const startDow = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const tKey = dayKey(today), sKey = dayKey(parseD(me.started));
  const confKeys = new Set(me.confirmed.map(s => dayKey(parseD(s))));
  // 마지막 확정일 + 6주까지의 정규 요일은 '예정(미확정)' = 민트 테두리
  const lastConf = me.confirmed.map(parseD).sort((a,b) => b - a)[0];
  const horizon = new Date(lastConf); horizon.setDate(horizon.getDate() + 42);
  const lastK = dayKey(lastConf), horizonK = dayKey(horizon);

  let cells = T().dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day out">.</div>`;
  for(let d=1;d<=days;d++){
    const date = new Date(y, m, d);
    const k = dayKey(date);
    const isDow = me.lessonDows.includes(date.getDay()) && k >= sKey;
    const cls = ["cal-day"];
    if(confKeys.has(k)) cls.push(k < tKey ? "lespast" : "lesfut");        // 확정 : 민트 칠
    else if(isDow && k < tKey) cls.push("lespast");                        // 지난 수업일 : 연회색
    else if(isDow && k > lastK && k <= horizonK) cls.push("lesplan");      // 예정(미확정) : 테두리
    else if(k < tKey) cls.push("past");
    cells += `<div class="${cls.join(" ")}">${d}</div>`;
  }
  return `
  <div class="card cal">
    <div class="cal-top">
      <button onclick="calNav(-1)">‹</button>
      <b>${T().calHead(y,m)}</b>
      <button onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

/* ----- 퀴즈 ----- */
let quizState = null;
let reviewQuiz = null;   // 오답노트에서 만든 임시 퀴즈
function getQuiz(qid){ return qid === "review" ? reviewQuiz : me.quizzes.find(q => q.id === qid); }

function quizCard(q){

function renderQuiz(){
  const tKey = dayKey(today);
  const active = me.quizzes.filter(q => dayKey(parseD(q.due)) >= tKey);
  const past   = me.quizzes.filter(q => dayKey(parseD(q.due)) <  tKey);

      ? `<div class="quiz-actions"><button class="btn" onclick="startReview()">${T().reviewStart(Math.min(10, wrongN))}</button></div>`
      : `<p style="font-size:13px;color:var(--sub);margin-top:6px">${T().reviewEmpty}</p>` }

function startQuiz(qid){
  quizState = { qid, idx: 0, answers: [] };
  renderQuestion();
}

// 오답노트 : 틀린 문제 풀에서 무작위 최대 10문제 뽑아 출제
function startReview(){
  const pool = me.wrongLog.map(wr => {
    const qz = me.quizzes.find(q => q.id === wr.quiz);
    return { ...qz.questions[wr.idx], ref: wr };   // ref로 원본 오답 항목 기억
  });
  const picked = pool.sort(() => Math.random() - .5).slice(0, 10);
  reviewQuiz = { id: "review", title: T().reviewT, questions: picked, attempts: [], last: null };
  startQuiz("review");
}

function renderQuestion(){
  const quiz = getQuiz(quizState.qid);
  const cur = quiz.questions[quizState.idx];
  let body;
  if(cur.type === "mc"){
    body = cur.c.map((c,i)=>`<button class="choice" onclick="answer(${i})">${c}</button>`).join("");
  }else{
    // 주관식/서술형 : 입력 후 제출
    const input = cur.type === "essay"
      ? `<textarea id="saIn" class="txt" placeholder="${T().saPh}"></textarea>`
      : `<input id="saIn" class="txt" placeholder="${T().saPh}" autocomplete="off">`;
    body = `
    <form onsubmit="event.preventDefault(); answer(document.getElementById('saIn').value)">
      ${input}
      <button class="btn" style="margin-top:10px" type="submit">${T().submit}</button>
    </form>`;
  }
  $("#main").innerHTML = `
  <div class="view">
    <div class="q-progress">${quiz.title} · ${quizState.idx+1} / ${quiz.questions.length}</div>
    <div class="q-text">Q${quizState.idx+1}. ${cur.q}</div>
    ${body}
    <button class="btn ghost" style="margin-top:8px" onclick="go('quiz')">${T().quit}</button>
  </div>`;
  $("#main").scrollTop = 0;
  const sa = document.getElementById("saIn");
  if(sa) sa.focus();
}

// 채점 : mc는 번호 비교, sa는 허용 답안과 비교, essay는 핵심 단어 포함 여부
function grade(qu, ans){
  if(qu.type === "mc") return ans === qu.a;
  const s = String(ans||"").trim().toLowerCase().replace(/\s+/g," ");
  if(qu.type === "sa") return qu.accept.some(a => s === a.toLowerCase());
  return qu.keys.every(k => s.includes(k.toLowerCase()));
}
function answerText(qu){
  if(qu.type === "mc") return qu.c[qu.a];
  if(qu.type === "sa") return qu.accept[0];
  return qu.sample;
}

function answer(v){
  const quiz = getQuiz(quizState.qid);
  quizState.answers.push(v);
  if(quizState.idx < quiz.questions.length - 1){
    quizState.idx++;
    renderQuestion();
  }else{
    const score = quiz.questions.reduce((s,qu,k)=> s + (grade(qu, quizState.answers[k]) ? 1 : 0), 0);
    quiz.attempts.push({ d: fmtDate(today), score });
    quiz.last = { answers: [...quizState.answers], score };
    // 오답노트 갱신 : 틀리면 추가, 맞히면 제거
    quiz.questions.forEach((qu,k)=>{
      const ok = grade(qu, quizState.answers[k]);
      if(quiz.id === "review"){
        if(ok) me.wrongLog = me.wrongLog.filter(w => w !== qu.ref);
      }else{
        const i = me.wrongLog.findIndex(w => w.quiz === quiz.id && w.idx === k);
        if(!ok && i === -1) me.wrongLog.push({ quiz: quiz.id, idx: k });
        if(ok  && i !== -1) me.wrongLog.splice(i, 1);
      }
    });
    if(quiz.id === "review"){
      me.lastReview = iso(today);
      me.reviewLog.push({ d: iso(today), score, total: quiz.questions.length });   // 선생 계정 로그용
    }
    pushLog(`퀴즈 '${quiz.title}' 풀기 — ${score}/${quiz.questions.length}점`);
    showResult(quiz.id);
  }
}

function showResult(qid){
  const quiz = getQuiz(qid);
  const total = quiz.questions.length;

  // 이번에 푼 기록(last)이 있으면 채점 표시까지, 없으면 문제와 정답만
  const detail = quiz.questions.map((qu,k)=>{
    const ansLabel = qu.type === "essay" ? T().sampleAns : T().ans;
    if(quiz.last){
      const mine = quiz.last.answers[k];
      const ok = grade(qu, mine);
      const mineTxt = qu.type === "mc" ? (qu.c[mine] ?? "-") : esc(String(mine||"-"));
      return `
    <div class="r-item">
      <div class="q">${ok ? "⭕" : "❌"} Q${k+1}. ${qu.q}</div>
      <div class="a">${ansLabel}: <b>${answerText(qu)}</b>${ok ? "" : ` · ${T().myAns}: <span class="x">${mineTxt}</span>`}</div>
    </div>`;
    }
    return `
    <div class="r-item">
      <div class="q">Q${k+1}. ${qu.q}</div>
      <div class="a">${ansLabel}: <b>${answerText(qu)}</b></div>
    </div>`;
  }).join("");

  const score = quiz.last ? quiz.last.score : quiz.attempts[quiz.attempts.length-1].score;
  const msg = score === total ? T().perfect : score >= total*0.6 ? T().good : T().again;

  $("#main").innerHTML = `
  <div class="view">
    <div class="sec-title" style="margin-top:10px">${quiz.title} · ${T().resultT}</div>
    <div class="card">
      <div class="result-score">
        <div class="big">${score} / ${total}</div>
        <div class="msg">${msg}</div>
      </div>
    </div>
    <div class="card">${detail}</div>
    ${ quiz.attempts.length > 1 ? `
    <div class="card">
      <div class="row-head"><b>${T().history}</b></div>
      ${quiz.attempts.map(a=>`<div class="kv"><span>${a.d}</span><b>${a.score}/${total}</b></div>`).join("")}
    </div>` : "" }
    <div class="quiz-actions">
      <button class="btn" onclick="startQuiz('${quiz.id}')">${T().retry}</button>
      <button class="btn ghost" onclick="go('quiz')">${T().toList}</button>
    </div>
  </div>`;
  $("#main").scrollTop = 0;
}

/* ----- 숙제 ----- */
function renderHomework(){
  const nextK = dayKey(upcoming(1)[0].date);
  const soon  = me.homework.filter(h => dayKey(parseD(h.due)) <= nextK);
  const later = me.homework.filter(h => dayKey(parseD(h.due)) >  nextK);
  const hwCard = h => `
    <div class="card hw ${h.done?"done":""}" onclick="toggleHw(${h.id})">
      <div class="chk">${h.done?"✓":""}</div>
      <div class="body"><b>${h.t}</b><span>${T().until(fmtDate(parseD(h.due)))}</span></div>
    </div>`;

  return `
  <div class="sec-title" style="margin-top:10px">${T().hwSoon}</div>
  ${ soon.length ? soon.map(hwCard).join("") : `<div class="card"><span style="font-size:13px;color:var(--sub)">${T().hwNone1}</span></div>` }

  <div class="sec-title">${T().hwLater}</div>
  ${ later.length ? later.map(hwCard).join("") : `<div class="card"><span style="font-size:13px;color:var(--sub)">${T().hwNone2}</span></div>` }

  <p style="font-size:12px;color:var(--sub);margin-top:12px">${T().hwHint(me.teacher)}</p>`;
}
function toggleHw(id){
  const h = me.homework.find(x=>x.id===id);
  h.done = !h.done;
  pushLog(`숙제 ${h.done ? "완료 체크" : "체크 해제"} — ${h.t}`);
  go("homework", true);
  if(h.done) toast(T().hwDone);
}

/* ----- 질문 & 메시지 (Q&A) ----- */
function renderQna(){
  return `
  <div class="sec-title" style="margin-top:10px">${T().qnaT}</div>
  <div class="card">
    <form onsubmit="event.preventDefault(); sendQna()">
      <textarea id="qnaIn" class="txt" placeholder="${T().qnaPh}"></textarea>
      <button class="btn" style="margin-top:10px" type="submit">${T().qnaSend}</button>
    </form>
    <p style="font-size:11.5px;color:var(--sub);margin-top:8px">${T().qnaHint}</p>
  </div>
  <div class="card kakao-row">
    <button class="kakao-btn" onclick="openKakao()"><svg width="15" height="15" viewBox="0 0 24 24" fill="#191919"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L6 21l3.8-2.2c.7.1 1.4.2 2.2.2 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>${T().kakaoBtn}</button>
    <p>${T().kakaoMsg}</p>
  </div>
  ${me.qna.map(item=>`
    <div class="card qna" onclick="this.classList.toggle('open')">
      <div class="row-head">
        <span class="d">${item.d}</span>
        <span class="badge ${item.a ? "" : "gray"}">${item.a ? T().answered : T().waiting}</span>
      </div>
      <div class="q">${esc(item.q)}</div>
      ${ item.a
        ? `<div class="ans"><div class="ans-head"><b>${me.teacher}</b><span>${item.ad}</span></div>${item.a}</div>`
        : `<div class="ans" style="opacity:.75"><div class="ans-head"><b>${me.teacher}</b></div>${T().willTell}</div>` }
      <div class="tap">▾</div>
    </div>`).join("")}`;
}
function sendQna(){
  const v = $("#qnaIn").value.trim();
  if(!v){ toast(T().qnaEmpty); return; }
  me.qna.unshift({ d: fmtDate(today), q: v, a: null, ad: null });
  // 교무실(선생님 페이지)에서도 보이도록 기록
  try{
    const sync = JSON.parse(localStorage.getItem("boyeoii-sync") || "{}");
    (sync.studentQuestions = sync.studentQuestions || []).push({ student: me.id, name: me.name, d: fmtDate(today), q: v });
    localStorage.setItem("boyeoii-sync", JSON.stringify(sync));
  }catch(e){}
  pushLog("질문 등록");
  toast(T().qnaSent);
  go("qna");
}

/* ----- 팝업(모달) ----- */
function openModal(html){ $("#modalBox").innerHTML = html; $("#modal").hidden = false; }
function closeModal(){ $("#modal").hidden = true; }
function openKakao(){
  openModal(`<h3>KakaoTalk</h3><p>${T().kakaoPop}</p>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">${T().close}</button></div>`);
}
function openPinModal(){
  openModal(`<h3>${T().pinT}</h3>
  <form onsubmit="event.preventDefault(); changePin()">
    <input id="curPin" class="txt" type="password" inputmode="numeric" maxlength="4" placeholder="${T().curPin}" style="margin-bottom:10px;text-align:center;letter-spacing:6px;font-weight:700">
    <input id="newPin" class="txt" type="password" inputmode="numeric" maxlength="4" placeholder="${T().newPin}" style="text-align:center;letter-spacing:6px;font-weight:700">
    <div class="modal-actions">
      <button class="btn" type="submit">${T().pinSave}</button>
      <button class="btn ghost" type="button" onclick="closeModal()">${T().cancel}</button>
    </div>
  </form>`);
  $("#curPin").focus();
}

/* ----- 마이페이지 ----- */
function goMy(){
  if(!me) return;
  const dark = document.body.classList.contains("dark");
  $("#main").innerHTML = `
  <div class="view">
    <div class="sec-title" style="margin-top:10px">${T().myT}</div>
    <div class="card my-profile">
      <div class="avatar"></div>
      <div><h2>${me.name}</h2><p>${ageLabel()}</p></div>
    </div>

    <div class="sec-title">${T().infoT}</div>
    <div class="card">
      <div class="kv"><span>${T().startedL}</span><b>${fmtDateFull(parseD(me.started))}</b></div>
      <div class="kv"><span>${T().cycleL}</span><b>${T().cycleV(STR.ko.dows[me.lessonDows[0]], T().fmtTime(me.lessonTime))}</b></div>
      <div class="kv"><span>${T().placeL}</span><b>${me.place}</b></div>
      <div class="kv"><span>${T().countL}</span><b>${T().times(lessonCount())}</b></div>
      <div class="kv"><span>${T().goalL}</span><b>${me.goal}</b></div>
    </div>
    <p style="font-size:11.5px;color:var(--sub);margin:-6px 2px 0">${T().infoNote}</p>

    <div class="sec-title">${T().emailT} ${myEmail() ? `<span class="badge">${T().emailOn}</span>` : ""}</div>
    <div class="card">
      <input id="emailIn" class="txt" type="email" placeholder="${T().emailPh}" value="${myEmail() || ""}">
      <button class="btn sm" style="margin-top:8px" onclick="saveEmail()">${myEmail() ? T().emailChange : T().emailSave}</button>
      <p style="font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:8px">${T().emailHint}</p>
    </div>

    <div class="sec-title">${T().settingsT}</div>
    <div class="card">
      <div class="switch-row">
        <span>${T().darkL}</span>
        <button class="switch ${dark?"on":""}" onclick="this.classList.toggle('on'); setDark(this.classList.contains('on'))"></button>
      </div>
      <div class="switch-row">
        <span>${T().engL}</span>
        <button class="switch ${lang==="en"?"on":""}" onclick="toggleLang()"></button>
      </div>
    </div>

    <div class="sec-title">${T().pinT}</div>
    <button class="btn ghost" onclick="openPinModal()">${T().pinT}</button>
  </div>`;
  // 마이페이지는 탭이 아니라서 탭 하이라이트 해제
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  $("#main").scrollTop = 0;
}

// 알림 이메일 (교무실에서 '수신 중' 표시로 확인 가능)
function myEmail(){
  try{ const s = JSON.parse(localStorage.getItem("boyeoii-sync") || "{}");
    return s.emails && s.emails[me.id] ? s.emails[me.id] : null; }catch(e){ return null; }
}
function saveEmail(){
  const v = $("#emailIn").value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast(T().emailBad); return; }
  try{
    const s = JSON.parse(localStorage.getItem("boyeoii-sync") || "{}");
    (s.emails = s.emails || {})[me.id] = v;
    localStorage.setItem("boyeoii-sync", JSON.stringify(s));
  }catch(e){}
  pushLog("알림 이메일 등록 · 변경");
  goMy(); toast(T().emailDone);
}

function changePin(){
  const cur = $("#curPin").value, nw = $("#newPin").value;
  if(cur !== me.pin){ toast(T().pinWrongCur); return; }
  if(!/^[0-9]{4}$/.test(nw)){ toast(T().pinBad); return; }
  me.pin = nw;   // 메모리에만 저장 (새로고침하면 1234로 초기화)
  closeModal();
  toast(T().pinChanged);
}

/* =========================================================
   탭 / 라우팅
   ========================================================= */
const TABS = [
  { id:"home",     render:renderHome,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>' },
  { id:"schedule", render:renderSchedule,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>' },
  { id:"notes",    render:renderNotes,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>' },
  { id:"quiz",     render:renderQuiz,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7M12 17h.01"/></svg>' },
  { id:"homework", render:renderHomework,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>' },
  { id:"qna",      render:renderQna,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>' }
];

function go(id, keep){
  const tab = TABS.find(t=>t.id===id);
  const main = $("#main");
  const top = keep ? main.scrollTop : 0;   // keep=true면 스크롤 위치 유지
  main.innerHTML = `<div class="view" ${keep?'style="animation:none"':''}>${tab.render()}</div>`;
  document.querySelectorAll("nav button").forEach(b=>
    b.classList.toggle("on", b.dataset.id===id));
  main.scrollTop = top;
}

/* ===== 활동 로그 : 교무실 '학생 로그 보기'에 쌓임 (프로토타입) ===== */
function pushLog(text){
  try{
    const sync = JSON.parse(localStorage.getItem("boyeoii-sync") || "{}");
    (sync.logs = sync.logs || []).push({ student: me ? me.id : "jaea",
      d: `${today.getMonth()+1}/${today.getDate()}`, text });
    if(sync.logs.length > 50) sync.logs = sync.logs.slice(-50);   // 최근 50개만
    localStorage.setItem("boyeoii-sync", JSON.stringify(sync));
  }catch(e){}
}

/* ===== 교무실(선생님 페이지)에서 등록한 내용 반영 — localStorage 연동 (프로토타입) ===== */
function applySync(){
  let sync;
  try{ sync = JSON.parse(localStorage.getItem("boyeoii-sync") || "{}"); }catch(e){ return; }
  const stu = DB.students[0];   // 이재아
  // 선생님이 단 Q&A 답변
  (sync.qnaAnswers || []).forEach(ans => {
    const item = stu.qna.find(x => x.q === ans.q);
    if(item && !item.a){ item.a = ans.a; item.ad = ans.ad; }
  });
  // 선생님이 등록한 새 퀴즈
  (sync.quizzes || []).forEach(q => {
    if(q.student === stu.id && !stu.quizzes.some(x => x.id === q.quiz.id))
      stu.quizzes.unshift(q.quiz);
  });
  // 선생님이 등록한 정리노트 (붙여넣은 HTML을 그대로 열 수 있음)
  (sync.notes || []).forEach((n, i) => {
    if(n.student === stu.id && !stu.notes.some(x => x.d === n.d && x.title === n.title))
      stu.notes.unshift({ d: n.d, title: n.title, brief: n.brief, t: n.t, page: "sync:" + i });
  });
  // 확정 일정
  if(sync.confirmed && sync.confirmed[stu.id] && sync.confirmed[stu.id].length)
    stu.confirmed = sync.confirmed[stu.id];
  // 선생님이 내준 새 숙제
  (sync.homework || []).forEach(h => {
    if(h.student === stu.id && !stu.homework.some(x => x.id === h.id))
      stu.homework.push({ id: h.id, t: h.t, due: h.due, done: false });
  });
}
applySync();

/* ===== 시작 ===== */
if(localStorage.getItem('boyeoii-theme') === 'dark') setDark(true);
applyHeader();
renderGateName();
