<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>박보영의 교무실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --accent:#0E9384; --accent-soft:#E4F6F1;
    --ink:#1B1D1F; --body:#3A3E44; --sub:#8A8F98; --faint:#C2C6CC;
    --line:#EEF0F2; --card:#FFFFFF; --bg:#FAFAFA; --desk:#ECEDEF;
    --danger:#E5484D; --radius:18px;
  }
  body.dark{
    --accent:#3BCBB0; --accent-soft:#12352F;
    --ink:#ECEEF0; --body:#C9CDD2; --sub:#9AA0A8; --faint:#5A6066;
    --line:#2A2E33; --card:#1E2225; --bg:#141719; --desk:#0B0C0E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;
    background:var(--desk);display:flex;justify-content:center;align-items:center;color:var(--ink)}
  .phone{width:400px;height:min(860px,100dvh);background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius:40px;
    box-shadow:0 24px 60px rgba(0,0,0,.25), 0 0 0 10px var(--accent)}
  @media (max-width:480px){
    body{background:var(--bg)}
    .phone{width:100%;height:100dvh;border-radius:0;box-shadow:inset 0 0 0 3px var(--accent)}
  }
  header{padding:44px 20px 12px;text-align:center;position:relative}
  header .brand{font-size:20px;font-weight:800;letter-spacing:-.4px;cursor:pointer}
  header .brand em{font-style:normal;color:var(--accent)}
  header .tagline{font-size:12px;color:var(--sub);margin-top:3px}
  header .admin{position:absolute;left:22px;top:48px;font-size:10px;font-weight:800;
    background:var(--accent);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:.5px}
  body.dark header .admin{color:#0B2A25}
  header .hbtn{position:absolute;right:22px;top:46px;border:none;background:none;cursor:pointer;
    font-family:inherit;color:var(--sub);padding:2px}
  header .hbtn svg{width:21px;height:21px;display:block}

  main{flex:1;overflow-y:auto;padding:4px 20px 24px;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .view{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);margin:18px 2px 8px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent)}
  .badge.gray{background:var(--line);color:var(--sub)}
  .badge.red{background:#FDF0F0;color:var(--danger)}
  body.dark .badge.red{background:#3A1B1C}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  body.dark .btn{color:#0B2A25}
  .btn.ghost{background:var(--accent-soft);color:var(--accent)}
  .btn.sm{padding:9px;font-size:13px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .txt{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none}
  .txt:focus{border-color:var(--accent)}
  textarea.txt{resize:none;min-height:80px;line-height:1.6}
  select.txt{appearance:auto}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}

  .row-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row-head b{font-size:14px}
  .row-head .score{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap}
  .row-meta{font-size:12px;color:var(--sub);margin:4px 0 10px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--sub);white-space:nowrap}
  .kv b{font-weight:600;text-align:right}

  .hello{margin:8px 2px 4px}
  .hello .date{font-size:12px;color:var(--sub)}
  .hello h1{font-size:21px;font-weight:800;margin-top:4px;line-height:1.4}
  .hello h1 b{color:var(--accent)}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .quick .card{margin:0;cursor:pointer}
  .quick .num{font-size:21px;font-weight:800;color:var(--accent);margin-top:6px}
  .quick .lbl{font-size:12px;color:var(--sub)}
  .quick .card.stat{background:var(--accent-soft);border-color:transparent}
  .quick .card.stat .lbl{color:var(--accent);opacity:.75}

  .stu{display:flex;align-items:center;gap:13px;cursor:pointer}
  .stu .avatar{width:44px;height:44px;border-radius:15px;background:var(--accent-soft);
    color:var(--accent);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stu .info{flex:1;min-width:0}
  .stu .info b{font-size:14.5px}
  .stu .info span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
  .stu .arrow{color:var(--faint);font-size:17px}
  .back{display:inline-flex;border:none;background:none;font-family:inherit;
    font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;margin:10px 0 2px;padding:4px 0}

  /* 수업 마무리 (홈) */
  .wbtn{flex:1;border:none;font-family:inherit;font-size:12px;font-weight:700;
    padding:10px 0;border-radius:11px;cursor:pointer}
  .wbtn.todo{background:#FDECEC;color:var(--danger)}
  .wbtn.done{background:#E7F6EC;color:#1B8A4C}
  .wbtn.skip{background:var(--line);color:var(--sub)}
  body.dark .wbtn.todo{background:#3A1B1C}
  body.dark .wbtn.done{background:#15301F;color:#5BD08B}

  /* 캘린더 */
  .cal .cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .cal .cal-top b{font-size:14px;font-weight:800}
  .cal .cal-top button{border:none;background:var(--line);width:28px;height:28px;border-radius:9px;
    font-family:inherit;font-size:14px;font-weight:800;color:var(--sub);cursor:pointer}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .cal-dow{font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
  .cal-day{font-size:13px;padding:5px 0 8px;border-radius:10px;color:var(--ink);position:relative}
  .cal-day.out{color:transparent}
  .cal-day.past{color:var(--faint)}
  .cal-day.today{background:var(--accent-soft);font-weight:800;color:var(--accent)}
  .cal-day .dts{display:flex;gap:2px;justify-content:center;margin-top:2px;height:4px}
  .cal-day .dts i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .cal-day.past .dts i{background:var(--faint)}

  .day-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .day-row:last-child{border-bottom:none}
  .day-row .d{min-width:82px;font-weight:800;color:var(--accent)}
  .day-row .d.off{color:var(--faint)}
  .day-row .who{flex:1;color:var(--body);line-height:1.7}
  .day-row .who a{color:var(--accent);font-weight:700;cursor:pointer}
  .day-row .who small{color:var(--sub)}
  details.fold{margin-top:2px;margin-bottom:8px}
  details.fold summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
    padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  details.fold summary::before{content:"▸ ";color:var(--accent)}
  details.fold[open] summary::before{content:"▾ ";color:var(--accent)}
  details.fold summary .cnt{color:var(--sub);font-weight:600;font-size:12px}
  details.fold .inner{padding-top:10px}
  details.plain summary{background:none;border:none;padding:10px 2px;font-size:13px;color:var(--sub)}

  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
    font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;margin:0 6px 6px 0;cursor:pointer}
  .chip button{border:none;background:none;color:var(--accent);font-weight:800;cursor:pointer;font-size:12px}
  .chip.gray{background:var(--line);color:var(--sub);cursor:default}

  .filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .filter::-webkit-scrollbar{display:none}
  .filter button{border:none;background:var(--line);color:var(--sub);font-family:inherit;
    font-size:12px;font-weight:700;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .filter button.on{background:var(--accent);color:#fff}
  body.dark .filter button.on{color:#0B2A25}
  .qna{cursor:pointer}
  .qna .d{font-size:11px;color:var(--sub)}
  .qna .q{font-size:14px;font-weight:700;line-height:1.55;margin:6px 0 0}
  .qna .body{display:none;margin-top:10px}
  .qna.open .body{display:block}
  .qna .ans{background:var(--accent-soft);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.6;color:var(--body)}
  .qna .tap{text-align:center;font-size:10px;color:var(--faint);margin-top:8px}
  .qna.open .tap{display:none}
  /* 미답변 질문 강조 */
  .qna.un{background:#FDF1F1;border-color:#F3C9CB}
  body.dark .qna.un{background:#2E1A1B;border-color:#5A2A2C}

  .seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin:10px 0 4px}
  .seg button{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;
    color:var(--sub);padding:9px 0;border-radius:11px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}

  .hint{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px}
  .fmt{background:var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.8;
    font-family:ui-monospace,Consolas,monospace;color:var(--body);white-space:pre-wrap;margin:8px 0}
  .staged{font-size:12.5px;color:var(--body);padding:7px 0;border-bottom:1px dashed var(--line);
    display:flex;justify-content:space-between;gap:8px}
  .staged button{border:none;background:none;color:var(--danger);cursor:pointer;font-weight:800}

  .hw{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .hw:last-child{border-bottom:none}
  .hw .chk{width:20px;height:20px;border-radius:7px;border:2px solid var(--faint);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-top:1px}
  .hw.done .chk{background:var(--accent);border-color:var(--accent)}
  .hw .b{flex:1;font-size:13.5px}
  .hw.done .b{text-decoration:line-through;color:var(--sub)}
  .hw .b span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;text-decoration:none}

  .slot-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .slot-row select{flex:1}
  .slot-row input{flex:1.2}
  .slot-row button{border:none;background:none;color:var(--danger);font-weight:800;cursor:pointer;font-size:15px}

  .log-row{display:flex;gap:10px;font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--line);line-height:1.5}
  .log-row:last-child{border-bottom:none}
  .log-row .d{min-width:38px;font-weight:800;color:var(--accent)}
  .log-row .t{color:var(--body)}

  .modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .modal[hidden]{display:none}
  .modal-box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-height:82%;overflow-y:auto;animation:fade .18s ease}
  .modal-box h3{font-size:15px;font-weight:800;margin-bottom:12px}
  .modal-box p{font-size:13px;color:var(--body);line-height:1.65}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .modal-actions .btn{padding:11px;font-size:13px}
  .memo-item{padding:11px 0;border-bottom:1px solid var(--line)}
  .memo-item:last-child{border-bottom:none}
  .memo-item .t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:800}
  .memo-item .t span{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap}
  .memo-item p{font-size:12.5px;color:var(--body);line-height:1.6;margin-top:4px;white-space:pre-wrap}
  .memo-item .acts{display:flex;gap:12px;margin-top:6px}
  .memo-item .acts button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .memo-item .acts .e{color:var(--accent)}
  .memo-item .acts .x{color:var(--danger)}

  nav{display:flex;background:var(--card);border-top:1px solid var(--line);
    padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
  nav button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:600;color:var(--faint);padding:4px 0}
  nav button svg{width:21px;height:21px;stroke:currentColor}
  nav button.on{color:var(--accent)}

  #toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    background:#2A2D31;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;
    white-space:nowrap;opacity:0;pointer-events:none;transition:.25s;z-index:30}
  #toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>

         {d:"7월 8일",dIso:"2026-07-08",q:"selfish랑 selfless 차이가 뭐예요? 둘 다 self가 들어가서 헷갈려요.",

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),2200); }
function parseD(s){ const[y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dayKey(d){ return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function fmtDate(d){ return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; }
function fmtDateFull(d){ return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; }
function fmtTime(t){ const[h,m]=t.split(":").map(Number); return `${h<12?"오전":"오후"} ${h%12||12}시 ${String(m).padStart(2,"0")}분`; }
function ageLabel(s){ const ka=today.getFullYear()-s.birthYear+1;
  if(ka>=14&&ka<=16) return `중${ka-13}`; if(ka>=17&&ka<=19) return `고${ka-16}`; return `${ka}세`; }
function stuOf(id){ return TDB.students.find(s=>s.id===id); }
function slotsLabel(s){ return s.slots.map(sl=>`${DOW[sl.dow]} ${sl.time}`).join(" · "); }
function posOf(b){ return `${b.unit}${b.now}`; }
function pctOf(b){ return b.total?Math.round(b.now/b.total*100):0; }
function won(n){ return n.toLocaleString("ko-KR")+"원"; }
function wonShort(n){ return n>=10000 ? `${Math.round(n/10000)}만원` : won(n); }
// 이번 달 정산 : 진행(오늘까지) / 예정 회수와 금액
function monthPay(s){
  const m0=today.getMonth(), y0=today.getFullYear(), tKey=dayKey(today);
  let done=0, plan=0;
  s.confirmed.forEach(c=>{ const d=parseD(c.date);
    if(d.getMonth()===m0 && d.getFullYear()===y0){ dayKey(d)<=tKey ? done++ : plan++; } });
  return { done, plan, doneSum:done*s.rate, sum:(done+plan)*s.rate };
}
function openPayList(){
  const rows=TDB.students.map(s=>{ const p=monthPay(s);
    return {s,p}; }).filter(x=>x.p.done+x.p.plan>0);
  const total=rows.reduce((n,x)=>n+x.p.sum,0), doneTotal=rows.reduce((n,x)=>n+x.p.doneSum,0);
  openModal(`
  <h3>${today.getMonth()+1}월 정산 요약</h3>
  ${rows.map(x=>`<div class="kv"><span>${x.s.name} (진행 ${x.p.done} · 예정 ${x.p.plan})</span><b>${won(x.p.sum)}</b></div>`).join("")}
  <div class="kv" style="border-top:2px solid var(--line)"><span>현재까지 확정</span><b>${won(doneTotal)}</b></div>
  <div class="kv"><span><b style="color:var(--accent)">이번 달 예상 수입</b></span><b style="color:var(--accent)">${won(total)}</b></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);
}
function daysAgo(dIso){
  const diff=Math.floor((dayKey(today)===dayKey(parseD(dIso))?0:(today-parseD(dIso))/86400000));
  return diff<=0?"오늘":diff===1?"1일 전":`${Math.floor(diff)}일 전`;
}

function lessonsOn(dateIso){
  const out=[];
  TDB.students.forEach(s=>s.confirmed.forEach(c=>{ if(c.date===dateIso) out.push({s,c}); }));
  return out.sort((a,b)=>a.c.time.localeCompare(b.c.time));
}
function lessonCards(list){
  return list.length===0
    ? `<div class="card"><span style="font-size:13px;color:var(--sub)">수업이 없어요</span></div>`
    : list.map(({s,c})=>`
      <div class="card stu" onclick="openPrep('${s.id}','${c.date}')">
        <div class="avatar">${s.name.slice(1,2)}</div>
        <div class="info"><b>${s.name}</b><span>${fmtTime(c.time)} · ${c.place}</span></div>
        <div class="arrow">›</div>
      </div>`).join("");
}
// 마무리 안 끝난 지난 수업들
function pendingWraps(){
  const tKey=dayKey(today), out=[];
  TDB.students.forEach(s=>s.confirmed.forEach(c=>{
    if(dayKey(parseD(c.date))<tKey && Object.values(c.wrap).some(v=>v==="todo")) out.push({s,c});
  }));
  return out.sort((a,b)=>a.c.date.localeCompare(b.c.date));
}
function wrapBtn(sid,date,key,label){
  const v=stuOf(sid).confirmed.find(c=>c.date===date).wrap[key];
  const cls=v==="done"?"done":v==="skip"?"skip":"todo";
  const sfx=v==="done"?" ✓":v==="skip"?" —":"";
  return `<button class="wbtn ${cls}" onclick="openWrapPop('${sid}','${date}','${key}','${label}')">${label}${sfx}</button>`;
}
function openWrapPop(sid,date,key,label){
  const s=stuOf(sid), v=s.confirmed.find(c=>c.date===date).wrap[key];
  const st=v==="done"?"✅ 완료 (등록됨)":v==="skip"?"➖ 이번 수업 없음":"⬜ 미완료";
  openModal(`
  <h3>${s.name} · ${label}</h3>
  <p>상태: <b>${st}</b></p>
  <div class="modal-actions" style="flex-direction:column">
    ${v!=="done"?`<button class="btn" onclick="closeModal(); openContent('${key}','${sid}')">등록하러 가기</button>`:""}
    ${v==="todo"?`<button class="btn ghost" onclick="wrapSet('${sid}','${date}','${key}','skip')">이번 수업 없음</button>`:""}
    ${v!=="todo"?`<button class="btn ghost" onclick="wrapSet('${sid}','${date}','${key}','todo')">미완료로 되돌리기</button>`:""}
    <button class="btn ghost" onclick="closeModal()">닫기</button>
  </div>
  <p class="hint">퀴즈·숙제는 실제로 등록해야 완료로 바뀌어요 (등록하면 자동 완료 처리).</p>`);
}
function wrapSet(sid,date,key,val){
  stuOf(sid).confirmed.find(c=>c.date===date).wrap[key]=val;
  closeModal(); go("home", true);
  toast(val==="skip"?"이번 수업 없음 처리":"미완료로 되돌렸어요");
}

function saveQuickMemo(editId){
  const title=$("#qmTitle").value.trim(), body=$("#qmBody").value.trim();
  if(!title){ toast("제목을 입력해 주세요"); return; }
  if(editId!=null){
    const m=memos.find(x=>x.id===editId); m.title=title; m.body=body;
    saveMemos(); closeModal(); openMemoList(); toast("메모 수정 완료");
  }else{
    memos.unshift({id:Date.now(),d:`${today.getMonth()+1}/${today.getDate()}`,title,body});
    saveMemos(); closeModal(); go("home"); toast("메모 등록!");
  }
}
function delMemo(id){ memos=memos.filter(m=>m.id!==id); saveMemos(); openMemoList(); toast("메모 삭제됨"); }
function openMemoList(){

/* --- 수업 추가(결제) / 내역 --- */
function openAddPay(){
  const s=stuOf(detailId);
  openModal(`
  <h3>수업 추가 — ${s.name}</h3>
  <div class="field"><label>결제일</label><input id="payDate" class="txt" type="date" value="${iso(today)}"></div>
  <div class="field"><label>결제방식</label><select id="payMethod" class="txt">
    ${["계좌이체","현금","카드","기타"].map(m=>`<option ${m===s.payMethod?"selected":""}>${m}</option>`).join("")}</select></div>
  <div class="field"><label>추가 회수</label><input id="payCount" class="txt" inputmode="numeric" placeholder="예) 8"></div>
  <div class="modal-actions">
    <button class="btn" onclick="savePay()">추가</button>
    <button class="btn ghost" onclick="closeModal()">취소</button>
  </div>
  <p class="hint">금액은 회수 × 수업당 요금(${won(s.rate)})으로 계산돼요.</p>`);
}
function savePay(){
  const s=stuOf(detailId);
  const d=$("#payDate").value, m=$("#payMethod").value, c=Number($("#payCount").value);
  if(!d||!c||c<1){ toast("결제일과 회수를 확인해 주세요"); return; }
  s.payments.push({d, method:m, count:c});
  s.payMethod=m;
  closeModal(); renderDetail(true);
  toast(`${c}회 추가! (${won(c*s.rate)})`);
}
function openPayHist(){
  const s=stuOf(detailId);
  const total=s.payments.reduce((n,p)=>n+p.count,0);
  openModal(`
  <h3>결제 내역 — ${s.name}</h3>
  ${s.payments.map(p=>`<div class="kv"><span>${fmtDateFull(parseD(p.d))} · ${p.method}</span><b>${p.count}회 · ${won(p.count*s.rate)}</b></div>`).join("") || '<p style="font-size:13px;color:var(--sub)">내역이 없어요</p>'}
  <div class="kv" style="border-top:2px solid var(--line)"><span><b>합계</b></span><b>${total}회 · ${won(total*s.rate)}</b></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);
}

/* 일정 추가 (기본 시간·장소 미리 채움) */
function openAddConf(){
  const s=stuOf(detailId);
  openModal(`
  <h3>과외 일정 추가 — ${s.name}</h3>
  <div class="field"><label>날짜</label><input id="confDate" class="txt" type="date"></div>
  <div class="field"><label>시간 (기본값: 정규 시간)</label><input id="confTime" class="txt" type="time" value="${s.slots[0]?s.slots[0].time:"19:00"}"></div>
  <div class="field"><label>장소 (기본값: 기본 장소)</label><input id="confPlace" class="txt" value="${esc(s.place)}"></div>
  <div class="modal-actions">
    <button class="btn" onclick="addConf()">추가</button>
    <button class="btn ghost" onclick="closeModal()">취소</button>
  </div>`);
}
function addConf(){
  const d=$("#confDate").value, t=$("#confTime").value, p=$("#confPlace").value.trim();
  if(!d||!t||!p){ toast("날짜·시간·장소를 채워 주세요"); return; }
  const s=stuOf(detailId);
  if(!s.confirmed.some(c=>c.date===d))
    s.confirmed.push({date:d,time:t,place:p,wrap:W("todo","todo","todo"),prep:""});
  s.confirmed.sort((a,b)=>a.date.localeCompare(b.date));
  pushConfSync(s); closeModal(); renderDetail(true); toast("과외 일정 추가!");
}
function delConf(d){
  const s=stuOf(detailId);
  s.confirmed=s.confirmed.filter(c=>c.date!==d);
  pushConfSync(s); renderDetail(true); toast("일정 삭제됨");
}
function pushConfSync(s){
  if(s.id!=="jaea") return;
  const sync=getSync(); (sync.confirmed=sync.confirmed||{})[s.id]=s.confirmed.map(c=>c.date); setSync(sync);
}
function saveMemo(){
  const s=stuOf(detailId);
  s.memo={level:$("#mLevel").value,weak:$("#mWeak").value,note:$("#mNote").value};
  toast("메모 저장 완료");
}

function warnHw(i){
  const s=stuOf(detailId), h=s.homework[i];
  openModal(`

  <p>숙제 완료 체크는 원래 <b>학생이 직접</b> 누르는 버튼이에요.<br>

    <button class="btn" onclick="doHw(${i})">그래도 변경</button>
    <button class="btn ghost" onclick="closeModal()">취소</button>

function calNav(d){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+d,1); go('schedule', true); }
function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const startDow=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  const tKey=dayKey(today);
  const cnt={};
  TDB.students.forEach(s=>s.confirmed.forEach(c=>{ cnt[c.date]=(cnt[c.date]||0)+1; }));
  let cells=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-day out">.</div>`;
  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d), k=dayKey(date);
    const n=cnt[iso(date)]||0;
    const cls=["cal-day"];
    if(k<tKey) cls.push("past");
    if(k===tKey) cls.push("today");
    cells+=`<div class="${cls.join(" ")}">${d}<div class="dts">${"<i></i>".repeat(Math.min(n,4))}</div></div>`;
  }
  return `
  <div class="card cal">
    <div class="cal-top"><button onclick="calNav(-1)">‹</button><b>${y}년 ${m+1}월</b><button onclick="calNav(1)">›</button></div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}
function dayRows(from,to){
  let rows="", any=false;
  for(let i=from;i<=to;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    const who=lessonsOn(iso(d));
    if(to-from>13 && who.length===0) continue;
    any=true;
    rows+=`
    <div class="day-row">
      <div class="d ${who.length?"":"off"}">${d.getMonth()+1}/${d.getDate()} ${DOW[d.getDay()]}${i===0?" (오늘)":""}</div>
      <div class="who">${who.length?who.map(({s,c})=>`<a onclick="openPrep('${s.id}','${c.date}')">${s.name}</a> ${fmtTime(c.time)} <small>· ${c.place}</small>`).join("<br>"):"—"}</div>
    </div>`;
  }
  return any?rows:`<div class="day-row"><div class="who" style="color:var(--sub)">예정된 수업이 없어요</div></div>`;
}
function renderSchedule(){
  const tKey=dayKey(today);
  const past=[];
  TDB.students.forEach(s=>s.confirmed.forEach(c=>{ if(dayKey(parseD(c.date))<tKey) past.push({s,c}); }));
  past.sort((a,b)=>b.c.date.localeCompare(a.c.date));
  return `
  <div style="height:10px"></div>
  ${renderCal()}
  <div class="sec-title">이번 주 <span style="font-weight:400">(수업을 누르면 수업 준비 화면)</span></div>
  <div class="card">${dayRows(0,6)}</div>
  <div class="sec-title">다음 주</div>
  <div class="card">${dayRows(7,13)}</div>
  <div class="sec-title">그 이후</div>
  <div class="card">${dayRows(14,42)}</div>
  <details class="fold plain">
    <summary>지난 과외 보기</summary>
    <div class="card">
      ${past.map(({s,c})=>`
      <div class="day-row">
        <div class="d off">${parseD(c.date).getMonth()+1}/${parseD(c.date).getDate()} ${DOW[parseD(c.date).getDay()]}</div>
        <div class="who" style="color:var(--sub)">${s.name} ${fmtTime(c.time)} <small>· ${c.place}</small></div>
      </div>`).join("") || "—"}
    </div>
  </details>`;
}

function parseQuizText(text){
  const qs=[];
  text.split("\n").map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const p=line.split("|").map(s=>s.trim());
    if(p[0].startsWith("객관식")&&p.length>=3){
      const c=p[2].split("/").map(s=>s.trim());
      const a=c.findIndex(s=>s.startsWith("*"));
      if(a>=0){ c[a]=c[a].slice(1).trim(); qs.push({type:"mc",q:p[1],c,a}); }
    }else if(p[0].startsWith("주관식")&&p.length>=3){
      qs.push({type:"sa",q:p[1],accept:p[2].split(",").map(s=>s.trim())});
    }else if(p[0].startsWith("서술형")&&p.length>=4){
      qs.push({type:"essay",q:p[1],keys:p[2].split(",").map(s=>s.trim()),sample:p[3]});
    }
  });
  return qs;
}
function stagedHtml(){
  if(!stagedQs.length) return "";
  const t={mc:"객관식",sa:"주관식",essay:"서술형"};
  return `<div style="margin-top:6px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px">등록 대기 ${stagedQs.length}문제</div>
    ${stagedQs.map((q,i)=>`<div class="staged"><span>[${t[q.type]}] ${esc(q.q)}</span><button onclick="delStaged(${i})">✕</button></div>`).join("")}
  </div>`;
}
function refreshStaged(){ $("#stagedBox").innerHTML=stagedHtml(); }
function parseStage(){
  const qs=parseQuizText($("#qzText").value);
  if(!qs.length){ toast("인식된 문제가 없어요. 양식을 확인해 주세요"); return; }
  stagedQs.push(...qs); $("#qzText").value="";
  refreshStaged(); toast(`${qs.length}문제 인식 완료!`);
}
function delStaged(i){ stagedQs.splice(i,1); refreshStaged(); }
function openAddQ(){
  openModal(`
  <h3>문항 직접 만들기</h3>
  <div class="field"><label>유형</label><select id="aqType" class="txt" onchange="aqSwap()">
    <option value="mc">객관식</option><option value="sa">주관식</option><option value="essay">서술형</option></select></div>

    <button class="btn ghost" onclick="closeModal()">닫기</button>
  </div>`);
  aqSwap();
}
function aqSwap(){
  const t=$("#aqType").value;
  $("#aqExtra").innerHTML = t==="mc"
    ? `<div class="field"><label>보기 4개 ( / 로 구분, 정답 앞에 * )</label><input id="aqC" class="txt" placeholder="보기1 / *보기2 / 보기3 / 보기4"></div>`
    : t==="sa"
    ? `<div class="field"><label>정답 (쉼표로 여러 개 가능)</label><input id="aqA" class="txt"></div>`
    : `<div class="field"><label>핵심단어 (쉼표 구분)</label><input id="aqK" class="txt"></div>
       <div class="field"><label>예시답안</label><input id="aqS" class="txt"></div>`;
}
function addQ(){
  const t=$("#aqType").value, q=$("#aqQ").value.trim();
  if(!q){ toast("문제를 입력해 주세요"); return; }
  if(t==="mc"){
    const c=$("#aqC").value.split("/").map(s=>s.trim());
    const a=c.findIndex(s=>s.startsWith("*"));
    if(c.length<2||a<0){ toast("보기와 정답(*)을 확인해 주세요"); return; }
    c[a]=c[a].slice(1).trim(); stagedQs.push({type:"mc",q,c,a});
  }else if(t==="sa"){
    const acc=$("#aqA").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!acc.length){ toast("정답을 입력해 주세요"); return; }
    stagedQs.push({type:"sa",q,accept:acc});
  }else{
    stagedQs.push({type:"essay",q,keys:$("#aqK").value.split(",").map(s=>s.trim()).filter(Boolean),sample:$("#aqS").value});
  }
  closeModal(); refreshStaged(); toast("문항 추가!");
}
/* 등록 시 수업 마무리(wrap) 자동 체크 : 가장 최근 지난 수업에 반영 */
function autoWrap(sid,key){
  const s=stuOf(sid), tKey=dayKey(today);
  const past=s.confirmed.filter(c=>dayKey(parseD(c.date))<=tKey).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(past && past.wrap[key]!=="done") past.wrap[key]="done";
}
function registerQuiz(){
  const sid=$("#qzStu").value, title=$("#qzTitle").value.trim(), due=$("#qzDue").value;
  if(!title||!due||!stagedQs.length){ toast("제목·기한·문제를 모두 채워 주세요"); return; }
  const s=stuOf(sid);
  s.quizzes.unshift({title,due,tries:0,best:"-"});
  autoWrap(sid,"quiz");
  if(sid==="jaea"){
    const sync=getSync();
    (sync.quizzes=sync.quizzes||[]).push({student:"jaea",
      quiz:{id:"t"+Date.now(),title,made:`${today.getMonth()+1}월 ${today.getDate()}일`,due,
            attempts:[],last:null,questions:stagedQs}});
    setSync(sync);
  }
  stagedQs=[]; go("content");
  toast(emailOf(s)?"퀴즈 등록! 학생에게 이메일 알림도 갔어요 ✉️":"퀴즈 등록 완료!");
}
function previewNote(){
  const html=$("#ntHtml").value.trim();
  if(!html){ toast("HTML을 붙여넣어 주세요"); return; }
  window.open(URL.createObjectURL(new Blob([html],{type:"text/html"})),"_blank");
}
function registerNote(){
  const sid=$("#ntStu").value, date=$("#ntDate").value,
        title=$("#ntTitle").value.trim(), brief=$("#ntBrief").value.trim(), html=$("#ntHtml").value.trim();
  if(!date||!title||!brief){ toast("날짜·제목·간략 요약을 채워 주세요"); return; }
  const s=stuOf(sid);
  autoWrap(sid,"note");
  if(sid==="jaea"){
    const d=parseD(date), sync=getSync();
    (sync.notes=sync.notes||[]).push({student:"jaea",
      d:`${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`,title,brief,t:brief,html});
    setSync(sync);
  }
  go("content");
  toast(emailOf(s)?"노트 등록! 학생에게 이메일 알림도 갔어요 ✉️":"노트 등록 완료!");
}
function registerHw(){
  const sid=$("#hwStu").value, t=$("#hwText").value.trim(), due=$("#hwDue").value;
  if(!t||!due){ toast("내용과 기한을 채워 주세요"); return; }
  const s=stuOf(sid);
  s.homework.push({t,due,done:false});
  autoWrap(sid,"hw");
  if(sid==="jaea"){
    const sync=getSync();
    (sync.homework=sync.homework||[]).push({student:"jaea",id:"h"+Date.now(),t,due});
    setSync(sync);
  }
  go("content");
  toast(emailOf(s)?"숙제 등록! 학생에게 이메일 알림도 갔어요 ✉️":"숙제 등록 완료!");
}

/* ===== 탭 ===== */
const TABS=[
  { id:"home", label:"홈", render:renderHome,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>' },
  { id:"students", label:"학생", render:renderStudents,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5 6.5-5s6.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15.2c2.8.3 5.5 1.6 5.5 4.8"/></svg>' },
  { id:"schedule", label:"일정", render:renderSchedule,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>' },
  { id:"qna", label:"Q&A", render:renderQna,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>' },
  { id:"content", label:"등록", render:renderContent,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>' }
];
function go(id, keep){
  const tab=TABS.find(t=>t.id===id);
  const main=$("#main");
  const top=keep?main.scrollTop:0;   // keep=true면 스크롤 위치 유지
  main.innerHTML=`<div class="view" ${keep?'style="animation:none"':''}>${tab.render()}</div>`;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  main.scrollTop=top;
}

/* ===== 시작 ===== */
if(localStorage.getItem('boyeoii-theme')==='dark') document.body.classList.add('dark');
$("#nav").innerHTML=TABS.map(t=>`<button data-id="${t.id}" onclick="go('${t.id}')">${t.icon}${t.label}</button>`).join("");
pullStudentQuestions();
go("home");
</script>
