<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Brief · JA</title>

<!-- 폰트: Syne(제목) + Pretendard(본문) + JetBrains Mono(숫자) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>

<style>
/* ══════════════════════════════════════════════════
   0) 디자인 토큰 — index.html / home 과 같은 팔레트
   ══════════════════════════════════════════════════ */
:root{
  --bg:#f5f4f0; --card:#fff; --txt:#1a1a1a; --txt-m:#6b6b6b; --txt-l:#a5a5a5;
  --brd:rgba(0,0,0,0.08); --brd-s:rgba(0,0,0,0.14);
  --lime:#b5e030;
  --up:#d94b4b; --down:#3d6fd9; --flat:#9a9a9a;
  --r:14px; --t:0.18s;
  /* 섹션별 악센트 — 채도를 낮춰 미니멀 톤 유지 */
  --c-tech:#3b5bdb; --c-business:#0b7a5b; --c-politics:#b03a3a; --c-extra:#a1690d;
}
body.dark{
  --bg:#1c1c26; --card:#26263340; --txt:#ededf0; --txt-m:#9a9ab5; --txt-l:#6e6e93;
  --brd:rgba(255,255,255,0.09); --brd-s:rgba(255,255,255,0.16);
  --up:#ff7b7b; --down:#7aa5ff; --flat:#8a8aa8;
  --c-tech:#8aa4ff; --c-business:#5fd3ac; --c-politics:#ff9a9a; --c-extra:#e0b35c;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Pretendard',sans-serif; font-weight:400;
  line-height:1.65; min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background var(--t),color var(--t);
}
body.dark{background:#1c1c26}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum" 1,"lnum" 1}

/* ══════════════════════════════════════════════════
   1) 상단 고정 바 — 날짜 이동 + 다크토글 + 읽기 진행바
   ══════════════════════════════════════════════════ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--brd);
}
.topbar-in{
  max-width:1080px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.logo{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;letter-spacing:-0.5px;flex-shrink:0}
.logo span{color:var(--lime)}

.datenav{display:flex;align-items:center;gap:6px}
.navbtn{
  width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--brd); background:transparent; border-radius:50%;
  color:var(--txt-m); cursor:pointer; transition:all var(--t);
}
.navbtn:hover{color:var(--txt);border-color:var(--brd-s);transform:translateY(-1px)}
.navbtn:disabled{opacity:.3;cursor:default;transform:none}
.datelabel{
  font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:500;
  letter-spacing:-0.2px; padding:0 6px; white-space:nowrap;
}
.datelabel .wd{color:var(--txt-l);margin-left:5px}

.toolbar{display:flex;align-items:center;gap:12px;flex-shrink:0}
.iconlink{
  font-size:12px;color:var(--txt-l);transition:color var(--t);
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.iconlink:hover{color:var(--txt)}
.dark-toggle{
  position:relative;display:inline-flex;align-items:center;
  width:28px;height:15px;background:#ccc;border:none;border-radius:8px;
  cursor:pointer;transition:background .3s;padding:0;flex-shrink:0;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
}
.dark-toggle::after{
  content:'';position:absolute;left:2px;width:11px;height:11px;border-radius:50%;
  background:#fff;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
body.dark .dark-toggle{background:#4a90d9}
body.dark .dark-toggle::after{transform:translateX(13px)}

/* 읽기 진행바 — 스크롤 비율만큼 라임색이 찬다 */
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--lime);width:0;transition:width .1s linear}

/* ══════════════════════════════════════════════════
   2) 레이아웃
   ══════════════════════════════════════════════════ */
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 100px}

/* ── 히어로 ── */
.hero{padding:64px 0 40px;border-bottom:1px solid var(--brd)}
.kicker{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.18em;color:var(--txt-l);margin-bottom:18px;
}
.hero h1{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(38px,7vw,68px);line-height:1.02;letter-spacing:-2.5px;
}
.hero h1 .dot{color:var(--lime)}
.hero-sub{
  margin-top:18px;font-size:15px;color:var(--txt-m);max-width:640px;line-height:1.75;
}

/* ── 섹션 이동 탭 (히어로 아래 고정) ── */
.tabs{
  position:sticky;top:57px;z-index:40;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:14px 0;margin-bottom:8px;
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font-size:12.5px;font-weight:500;white-space:nowrap;
  padding:6px 14px;border:1px solid var(--brd);border-radius:100px;
  color:var(--txt-m);cursor:pointer;transition:all var(--t);background:transparent;
  font-family:'Pretendard',sans-serif;
}
.tab:hover{color:var(--txt);border-color:var(--brd-s)}
.tab.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
body.dark .tab.on{background:var(--lime);color:#1a1a1a;border-color:var(--lime)}

/* ══════════════════════════════════════════════════
   3) 마켓 — 가로 스크롤 스트립
   ══════════════════════════════════════════════════ */
.market{padding:36px 0 12px}
.blocktitle{
  font-family:'Syne',sans-serif;font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;color:var(--txt-m);
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
}
.blocktitle::after{content:'';flex:1;height:1px;background:var(--brd)}

.strip{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(148px,1fr);
  gap:10px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin;
  scroll-snap-type:x proximity;
}
.strip::-webkit-scrollbar{height:5px}
.strip::-webkit-scrollbar-thumb{background:var(--brd-s);border-radius:3px}
.tile{
  scroll-snap-align:start;
  background:var(--card);border:1px solid var(--brd);border-radius:var(--r);
  padding:14px 15px;transition:transform var(--t),box-shadow var(--t);
  position:relative;overflow:hidden;
}
body.dark .tile{background:rgba(255,255,255,.03)}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--flat)}
.tile.up::before{background:var(--up)}
.tile.down::before{background:var(--down)}
.tile .tname{font-size:12px;font-weight:600;margin-bottom:1px}
.tile .ten{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-l);margin-bottom:9px}
.tile .tval{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;letter-spacing:-.5px;font-feature-settings:"tnum" 1}
.tile .tchg{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;margin-top:3px;color:var(--flat)}
.tile.up .tchg{color:var(--up)} .tile.down .tchg{color:var(--down)}
.tile .tfx{font-size:10px;color:var(--txt-l);margin-top:7px;line-height:1.4}
.tile .tas{font-size:9px;color:var(--txt-l);opacity:.75;margin-top:4px;line-height:1.35}

.market-note{
  margin-top:14px;padding:16px 18px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--brd);
  font-size:14px;line-height:1.8;color:var(--txt);
}
body.dark .market-note{background:rgba(255,255,255,.03)}
.market-note .disc{display:block;margin-top:10px;font-size:11px;color:var(--txt-l);line-height:1.6}

/* ══════════════════════════════════════════════════
   4) 뉴스 섹션
   ══════════════════════════════════════════════════ */
.section{padding:56px 0 8px;scroll-margin-top:110px}
.sechead{display:flex;gap:20px;align-items:flex-start;margin-bottom:26px}
.secnum{
  font-family:'Syne',sans-serif;font-size:44px;font-weight:800;line-height:.9;
  color:var(--accent);opacity:.22;letter-spacing:-2px;flex-shrink:0;
}
.sechead h2{
  font-family:'Syne',sans-serif;font-size:26px;font-weight:700;
  letter-spacing:-.8px;line-height:1.2;color:var(--accent);
}
.sechead .seckr{
  font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;
  color:var(--txt-l);margin-top:5px;
}
.sechead .secdesc{margin-top:10px;font-size:14px;color:var(--txt-m);line-height:1.7;max-width:620px}

/* ── 카드 그리드: 첫 카드는 리드(넓게) ── */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ncard{
  background:var(--card);border:1px solid var(--brd);border-radius:var(--r);
  padding:20px 22px;display:flex;flex-direction:column;
  transition:transform var(--t),box-shadow var(--t),border-color var(--t);
  position:relative;
}
body.dark .ncard{background:rgba(255,255,255,.03)}
.ncard:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,0,0,.08);border-color:var(--brd-s)}
.ncard.lead{grid-column:1 / -1;padding:26px 26px 24px}
.ncard .cmeta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--txt-l);margin-bottom:11px;
}
.ncard .ctag{
  color:var(--accent);border:1px solid currentColor;border-radius:3px;
  padding:1px 6px;font-weight:500;opacity:.85;
}
.ncard .csrc{font-weight:500;color:var(--txt-m)}
.ncard h3{
  font-size:17px;font-weight:700;line-height:1.42;letter-spacing:-.4px;
  margin-bottom:9px;
}
.ncard.lead h3{font-size:22px;line-height:1.35;letter-spacing:-.7px}
.ncard h3 a{
  background-image:linear-gradient(var(--accent),var(--accent));
  background-size:0 1.5px;background-position:0 100%;background-repeat:no-repeat;
  transition:background-size var(--t);
}
.ncard:hover h3 a{background-size:100% 1.5px}
.ncard p{font-size:13.5px;line-height:1.75;color:var(--txt-m);flex:1}
.ncard.lead p{font-size:14.5px}
.ncard .arrow{
  margin-top:14px;font-size:11px;color:var(--txt-l);
  display:inline-flex;align-items:center;gap:5px;transition:gap var(--t),color var(--t);
}
.ncard:hover .arrow{gap:9px;color:var(--accent)}

/* ── 키워드 pill ── */
.kw{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.kwpill{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
  padding:5px 11px;border-radius:100px;cursor:help;
  border:1px dashed var(--brd-s);color:var(--txt-m);transition:all var(--t);
}
.kwpill:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}

/* ── For You ── */
.foryou{
  margin-top:18px;padding:22px 24px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--brd);
  border-left:3px solid var(--accent);
}
body.dark .foryou{background:rgba(255,255,255,.04)}
.foryou .fyh{
  font-family:'Syne',sans-serif;font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.16em;color:var(--accent);margin-bottom:4px;
}
.foryou .fysub{font-size:12px;color:var(--txt-l);margin-bottom:12px}
.foryou p{font-size:14px;line-height:1.85;color:var(--txt)}

/* ── 푸터 ── */
.footer{
  margin-top:80px;padding-top:26px;border-top:1px solid var(--brd);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--txt-l);
}

/* ── 맨 위로 버튼 ── */
.totop{
  position:fixed;right:24px;bottom:24px;z-index:60;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--brd-s);
  background:var(--card);color:var(--txt-m);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t);
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
body.dark .totop{background:#2c2c3a}
.totop.on{opacity:1;pointer-events:auto}
.totop:hover{transform:translateY(-2px);color:var(--txt)}

/* ── 로딩 / 에러 상태 ── */
.state{
  min-height:70vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;
}
.state h2{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.5px}
.state p{font-size:13.5px;color:var(--txt-m);max-width:340px;line-height:1.7}
.state .btn{
  margin-top:8px;padding:11px 22px;border-radius:10px;
  background:var(--txt);color:var(--bg);border:none;cursor:pointer;
  font-family:'Pretendard',sans-serif;font-size:13px;font-weight:600;
  transition:transform var(--t),box-shadow var(--t);
}
body.dark .state .btn{background:var(--lime);color:#1a1a1a}
.state .btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.spinner{
  width:26px;height:26px;border:2px solid var(--brd);border-top-color:var(--lime);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 등장 애니메이션 ── */
.reveal{opacity:0;transform:translateY(14px)}
.reveal.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}

/* ── 반응형 ── */
@media (max-width:760px){
  .wrap{padding:0 18px 80px}
  .topbar-in{padding:12px 18px;gap:10px}
  .iconlink{display:none}
  .hero{padding:44px 0 30px}
  .cards{grid-template-columns:1fr}
  .ncard.lead h3{font-size:19px}
  .sechead{gap:14px}
  .secnum{font-size:34px}
  .sechead h2{font-size:21px}
  .tabs{top:53px}
}
</style>
</head>
<body>

<!-- ══ 상단 고정 바 ══ -->
<header class="topbar">
  <div class="topbar-in">
    <a href="index.html" class="logo">JA<span>.</span></a>

    <div class="datenav">
      <button class="navbtn" id="prevBtn" onclick="go(-1)" aria-label="이전 날짜">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="datelabel" id="dateLabel">—</span>
      <button class="navbtn" id="nextBtn" onclick="go(1)" aria-label="다음 날짜">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="toolbar">
      <a href="index.html" class="iconlink">날짜 선택</a>
      <button class="dark-toggle" onclick="toggleDark()" aria-label="다크모드 토글"></button>
    </div>
  </div>
  <div class="progress" id="progress"></div>
</header>

<!-- ══ 본문 (JS가 채움) ══ -->
<main class="wrap" id="app">
  <div class="state">
    <div class="spinner"></div>
    <p>브리핑을 불러오는 중…</p>
  </div>
</main>

<button class="totop" id="toTop" onclick="window.scrollTo({top:0})" aria-label="맨 위로">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<script>
/* ═══════════════════════════════════════════════════════════
   설계 요약
   - 데이터(JSON)와 화면(이 파일)을 완전히 분리했습니다.
   - data/YYYY-MM-DD.json 을 fetch → 렌더링
   - JSON이 없으면 예전 방식인 News Source/DailyNews_YYYYMMDD.html 로 폴백
   ═══════════════════════════════════════════════════════════ */

/* 섹션 id → CSS 변수에 들어갈 악센트 색 키 */
const ACCENT = {
  tech:'var(--c-tech)', business:'var(--c-business)',
  politics:'var(--c-politics)', extra:'var(--c-extra)'
};
const WD = ['일','월','화','수','목','금','토'];

/* ── 유틸: 날짜 변환 ───────────────────────────────── */
function pad(n){ return String(n).padStart(2,'0'); }
function toStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){
  const n=new Date();
  if(n.getHours()<7) n.setDate(n.getDate()-1); // 오전 7시 전이면 어제 판
  return toStr(n);
}
/* HTML 특수문자 이스케이프 — JSON 내용을 innerHTML로 넣기 전 안전 처리 */
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ── 현재 날짜 상태 ────────────────────────────────── */
let curDate = new URLSearchParams(location.search).get('date') || todayStr();
if(!/^\d{4}-\d{2}-\d{2}$/.test(curDate)) curDate = todayStr();

/* ── 날짜 이동 ─────────────────────────────────────── */
function go(delta){
  const d = parseDate(curDate);
  d.setDate(d.getDate()+delta);
  curDate = toStr(d);
  history.replaceState(null,'',`?date=${curDate}`); // 뒤로가기 스택 오염 방지
  load();
}
function updateNav(){
  const d = parseDate(curDate);
  document.getElementById('dateLabel').innerHTML =
    `${curDate}<span class="wd">${WD[d.getDay()]}</span>`;
  // 오늘(또는 최신 판) 이후로는 못 가게 막음
  document.getElementById('nextBtn').disabled = curDate >= todayStr();
  document.title = `Daily Brief · ${curDate}`;
}

/* ── 데이터 로드 ───────────────────────────────────── */
async function load(){
  updateNav();
  const app = document.getElementById('app');
  app.innerHTML = `<div class="state"><div class="spinner"></div><p>브리핑을 불러오는 중…</p></div>`;
  window.scrollTo({top:0});

  try{
    const res = await fetch(`data/${curDate}.json`, {cache:'no-store'});
    if(res.ok){
      render(await res.json());
      return;
    }
    // JSON이 없으면 → 예전 HTML이 있는지 확인 (폴백)
    await fallback();
  }catch(e){
    await fallback();
  }
}

/* ── 폴백: 구버전 HTML로 이동 ──────────────────────── */
async function fallback(){
  const legacy = encodeURI(`News Source/DailyNews_${curDate.replace(/-/g,'')}.html`);
  try{
    const r = await fetch(legacy, {method:'HEAD', cache:'no-store'});
    if(r.ok){ location.href = legacy; return; }
  }catch(e){ /* 무시하고 아래 안내 표시 */ }

  document.getElementById('app').innerHTML = `
    <div class="state">
      <h2>브리핑이 없습니다</h2>
      <p><strong>${esc(curDate)}</strong> 자 뉴스가 아직 없거나 발행되지 않은 날짜입니다.</p>
      <button class="btn" onclick="location.href='index.html'">다른 날짜 고르기</button>
    </div>`;
}

/* ── 렌더링 ────────────────────────────────────────── */
function render(d){
  const dt = parseDate(d.date);
  const en = dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  /* 마켓 타일 */
  const tiles = (d.market?.tiles||[]).map(t => `
    <div class="tile ${esc(t.dir||'flat')}">
      <div class="tname">${esc(t.name)}</div>
      <div class="ten">${esc(t.en)}</div>
      <div class="tval">${esc(t.value)}</div>
      <div class="tchg">${esc(t.change)}</div>
      ${t.fx ? `<div class="tfx">${esc(t.fx)}</div>` : ''}
      ${t.asof ? `<div class="tas">${esc(t.asof)}</div>` : ''}
    </div>`).join('');

  /* 섹션 */
  const secs = (d.sections||[]).map((s,i) => {
    const accent = ACCENT[s.id] || 'var(--txt)';

    const cards = (s.cards||[]).map((c,ci) => `
      <article class="ncard ${ci===0?'lead':''} reveal">
        <div class="cmeta">
          ${c.tag ? `<span class="ctag">${esc(c.tag)}</span>` : ''}
          <span>${esc(c.date)}</span>
          ${c.source ? `<span class="csrc">${esc(c.source)}</span>` : ''}
        </div>
        <h3><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title)}</a></h3>
        <p>${esc(c.summary)}</p>
        <a class="arrow" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">기사 읽기 →</a>
      </article>`).join('');

    const kws = (s.keywords||[]).map(k =>
      `<span class="kwpill" title="${esc(k.desc)}">${esc(k.word)}</span>`).join('');

    const fy = s.forYou ? `
      <div class="foryou reveal">
        <div class="fyh">⭐ For You</div>
        <div class="fysub">${esc(s.forYou.sub)}</div>
        <p>${esc(s.forYou.body)}</p>
      </div>` : '';

    return `
      <section class="section" id="sec-${esc(s.id)}" style="--accent:${accent}">
        <div class="sechead reveal">
          <div class="secnum">${pad(i+1)}</div>
          <div>
            <h2>${esc(s.label)}</h2>
            <div class="seckr">${esc(s.labelKr)}</div>
            <p class="secdesc">${esc(s.desc)}</p>
          </div>
        </div>
        <div class="cards">${cards}</div>
        ${kws ? `<div class="kw reveal">${kws}</div>` : ''}
        ${fy}
      </section>`;
  }).join('');

  /* 섹션 이동 탭 */
  const tabs = (d.sections||[]).map(s =>
    `<button class="tab" data-target="sec-${esc(s.id)}">${esc(s.labelKr)} · ${esc(s.label)}</button>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="kicker">${esc(en)} · Seoul · Morning Brief</div>
      <h1>Daily<br>Brief<span class="dot">.</span></h1>
      ${d.market?.oneliner ? `<p class="hero-sub">${esc(d.market.oneliner)}</p>` : ''}
    </div>

    <nav class="tabs">${tabs}</nav>

    <section class="market">
      <div class="blocktitle">Market</div>
      <div class="strip">${tiles}</div>
      ${d.market?.note ? `<div class="market-note reveal"><span class="disc">※ ${esc(d.market.note)}</span></div>` : ''}
    </section>

    ${secs}

    <footer class="footer">
      <span>${esc(d.title||'The Jaea Times')} · ${esc(d.date)}</span>
      <span>Auto-generated · All rights to source publishers</span>
    </footer>`;

  wireTabs();
  wireReveal();
}

/* ── 탭 클릭 → 해당 섹션으로 스크롤 ───────────────── */
function wireTabs(){
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => document.getElementById(t.dataset.target)
      ?.scrollIntoView({behavior:'smooth', block:'start'});
  });

  // 현재 화면에 보이는 섹션의 탭을 활성화
  const secs = [...document.querySelectorAll('.section')];
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(!e.isIntersecting) return;
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('on', t.dataset.target === e.target.id));
    });
  }, {rootMargin:'-120px 0px -65% 0px'});
  secs.forEach(s => io.observe(s));
}

/* ── 스크롤 시 요소 부드럽게 등장 ─────────────────── */
function wireReveal(){
  const io = new IntersectionObserver((entries,obs) => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); }
    });
  }, {rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

/* ── 스크롤 진행바 + 맨 위로 버튼 ─────────────────── */
addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  document.getElementById('progress').style.width = h>0 ? (scrollY/h*100)+'%' : '0';
  document.getElementById('toTop').classList.toggle('on', scrollY > 500);
}, {passive:true});

/* ── 키보드 ←/→ 로 날짜 이동 ──────────────────────── */
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft')  go(-1);
  if(e.key === 'ArrowRight' && !document.getElementById('nextBtn').disabled) go(1);
});

/* ── 다크모드 (index.html과 localStorage 공유) ────── */
function toggleDark(){
  localStorage.setItem('dark', document.body.classList.toggle('dark'));
}
if(localStorage.getItem('dark') === 'true') document.body.classList.add('dark');

/* ── 시작 ─────────────────────────────────────────── */
load();
</script>
