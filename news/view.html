<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뉴스</title></head><body><p><a href="/home/#news">뉴스 탭으로 이동</a></p><script>
// 기존 날짜별 주소를 같은 날짜의 통합 탭으로 연결합니다.
const date = new URLSearchParams(location.search).get('date');
location.replace('/home/#news' + (/^\d{4}-\d{2}-\d{2}$/.test(date || '') ? '/' + date : ''));
</script></body></html>
