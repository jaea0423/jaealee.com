<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaea Lee</title>

<!-- 폰트: Inter(영문) + Pretendard(한글) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
    /* 전체 페이지 기본 설정 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* 스크롤 방지 (명함만 보이게) */
    }

    body {
        /* 배경: 짙은 네이비 + 미세한 그라데이션 */
        background: radial-gradient(ellipse at center, #1a1d2e 0%, #0a0b14 100%);
        font-family: 'Pretendard', 'Inter', -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #fff;
        position: relative;
    }

    /* 배경 그리드 패턴 (아주 미세하게) */
    body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
    }

    /* 명함 컨테이너 (앞/뒤 플립용) */
    .card-wrapper {
        perspective: 1500px; /* 3D 효과 */
        position: relative;
        z-index: 1;
    }

    /* 실제 명함: 표준 규격 85.6mm × 53.98mm */
    .card {
        width: 85.6mm;
        height: 53.98mm;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
        cursor: pointer;
    }

    /* 클릭하면 뒤집힘 */
    .card.flipped {
        transform: rotateY(180deg);
    }

    /* 앞면/뒷면 공통 스타일 */
    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden; /* 뒤집힐 때 반대면 안 보이게 */
        border-radius: 6px;
        box-shadow: 
            0 20px 60px rgba(0,0,0,0.5),
            0 0 0 1px rgba(255,255,255,0.05);
        overflow: hidden;
    }

    /* === 앞면 === */
    .card-front {
        background: linear-gradient(135deg, #ffffff 0%, #f5f5f7 100%);
        color: #1a1d2e;
        padding: 6mm 7mm;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* 좌상단 로고/이니셜 */
    .logo {
        font-family: 'Inter', sans-serif;
        font-size: 11pt;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #1a1d2e;
    }

    .logo .dot {
        color: #5b6cff; /* 포인트 컬러 */
    }

    /* 가운데 이름 영역 */
    .name-section {
        margin-top: auto;
        margin-bottom: 2mm;
    }

    /* 메인: 한글 이름 (크게) */
    .name-kr {
        font-size: 22pt;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #1a1d2e;
    }

    /* 서브: 영문 이름 (작게) */
    .name-en {
        font-family: 'Inter', sans-serif;
        font-size: 8pt;
        font-weight: 500;
        letter-spacing: 0.15em;
        color: #6b7280;
        margin-top: 1.5mm;
        text-transform: uppercase;
    }

    /* 역할 / 소속 */
    .role {
        font-family: 'Inter', sans-serif;
        font-size: 7pt;
        font-weight: 500;
        color: #5b6cff;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-top: 1.5mm;
    }

    /* 우하단 클릭 안내 */
    .flip-hint {
        position: absolute;
        bottom: 3mm;
        right: 4mm;
        font-family: 'Inter', sans-serif;
        font-size: 6pt;
        color: #9ca3af;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    /* === 뒷면 === */
    .card-back {
        background: linear-gradient(135deg, #1a1d2e 0%, #0f1119 100%);
        color: #fff;
        padding: 6mm 7mm;
        transform: rotateY(180deg); /* 미리 뒤집어 둠 */
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* 연락처 리스트 */
    .contact-list {
        display: flex;
        flex-direction: column;
        gap: 2.5mm;
    }

    .contact-item {
        display: flex;
        align-items: center;
        gap: 3mm;
        font-family: 'Inter', sans-serif;
        font-size: 8pt;
        color: #e5e7eb;
        letter-spacing: 0.02em;
    }

    /* 라벨 (LOC, EDU 등) */
    .contact-label {
        font-size: 6.5pt;
        font-weight: 600;
        color: #5b6cff;
        letter-spacing: 0.15em;
        min-width: 12mm;
    }

    .contact-value {
        flex: 1;
        font-weight: 400;
    }

    /* 우상단 장식 라인 */
    .card-back::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 30mm;
        height: 1px;
        background: linear-gradient(90deg, transparent, #5b6cff);
    }

    /* 좌하단 작은 텍스트 */
    .back-footer {
        position: absolute;
        bottom: 3mm;
        left: 7mm;
        font-family: 'Inter', sans-serif;
        font-size: 5.5pt;
        color: #4b5563;
        letter-spacing: 0.15em;
        text-transform: uppercase;
    }

    /* 모바일 대응: 화면이 작으면 명함도 비율 유지하며 축소 */
    @media (max-width: 500px) {
        .card {
            transform: scale(0.85);
        }
        .card.flipped {
            transform: scale(0.85) rotateY(180deg);
        }
    }

    /* 호버 효과: 살짝 떠오르는 느낌 */
    .card:hover:not(.flipped) {
        transform: translateY(-2px);
    }
    .card.flipped:hover {
        transform: translateY(-2px) rotateY(180deg);
    }
</style>
</head>
<body>

<div class="card-wrapper">
    <!-- 명함 본체 (클릭하면 뒤집힘) -->
    <div class="card" id="businessCard" onclick="this.classList.toggle('flipped')">
        
        <!-- === 앞면 === -->
        <div class="card-face card-front">
            <div class="logo">JL<span class="dot">.</span></div>
            
            <div class="name-section">
                <div class="name-kr">이재아</div>
                <div class="name-en">Lee Jaea</div>
                <div class="role">CS Student · Developer</div>
            </div>

            <div class="flip-hint">CLICK TO FLIP →</div>
        </div>

        <!-- === 뒷면 === -->
        <div class="card-face card-back">
            <div class="contact-list">
                <div class="contact-item">
                    <span class="contact-label">EDU</span>
                    <span class="contact-value">Kangwon National Univ.</span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">FIELD</span>
                    <span class="contact-value">Computer Science</span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">WEB</span>
                    <span class="contact-value">jaealee.com</span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">EMAIL</span>
                    <span class="contact-value">hello@jaealee.com</span>
                </div>
            </div>

            <div class="back-footer">© Jaea Lee</div>
        </div>

    </div>
</div>

<script>
    // 키보드 스페이스/엔터로도 뒤집기 가능
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            document.getElementById('businessCard').classList.toggle('flipped');
        }
    });
</script>

</body>
</html>
