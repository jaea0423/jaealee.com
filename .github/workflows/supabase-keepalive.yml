# Supabase 무료 프로젝트 깨워 두기 (2026-09-24, 재아)
# 무료 요금제는 일주일 동안 요청이 없으면 프로젝트가 잠깁니다(일시 정지). 가게가 매일 쓰면 괜찮지만
# 긴 휴무·명절에 아무도 안 켜면 잠겨서, 다시 켜기 전까지 홈페이지 예약도 안 됩니다.
# 그래서 GitHub 가 사흘마다 공개 표(public_avail)를 한 줄 읽어 '요청이 있었다' 는 흔적을 남깁니다.
# - 키는 이미 공개된 anon 키(hanok/system/supabase.*.json) — 새 비밀값 없음. 읽기만, 아무것도 안 바꿈.
# - supabase.prod.json 이 생기면 저절로 같이 깨웁니다(파일마다 돌림).
# - 실패하면(이미 잠겼거나 주소가 바뀜) 이 작업이 빨간불 → GitHub 가 재아에게 메일. 그러면 Supabase 대시보드에서 다시 켜면 됩니다.
# - 손으로 돌리기: GitHub → Actions → 'Supabase 깨워 두기' → Run workflow
name: Supabase 깨워 두기

on:
  schedule:
    - cron: "0 18 */3 * *"   # 사흘마다 한국 시각 새벽 3시(UTC 18시)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            hanok/system
          sparse-checkout-cone-mode: true
      - name: 프로젝트마다 한 번씩 읽기
        run: |
          python3 - <<'PY'
          import glob, json, sys, urllib.request
          files = sorted(f for f in glob.glob("hanok/system/supabase.*.json") if not f.endswith(".example"))
          bad = 0
          for f in files:
              c = json.load(open(f, encoding="utf-8"))
              url = c["url"].rstrip("/") + "/rest/v1/public_avail?select=date&limit=1"
              req = urllib.request.Request(url, headers={"apikey": c["anonKey"], "Authorization": "Bearer " + c["anonKey"]})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(f, "->", r.status)
              except Exception as e:
                  bad += 1
                  print(f, "-> 실패:", e)
          if not files:
              print("supabase.*.json 이 없습니다"); sys.exit(1)
          sys.exit(1 if bad else 0)
          PY
