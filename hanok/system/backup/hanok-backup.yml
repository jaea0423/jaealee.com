# 한옥반점 예약 — Supabase 매일 백업 (GitHub Actions)
#
# 이 파일은 **비공개 저장소 `hanok-backup`** 의 `.github/workflows/hanok-backup.yml` 로 옮겨서 씁니다.
# jaealee.com 저장소(공개)에는 넣지 않습니다 — 백업에는 손님 이름·전화가 있습니다.
#
# 준비 (재아):
#   1. GitHub 에서 비공개 저장소 hanok-backup 생성 (README 하나만 있어도 됨)
#   2. Settings → Secrets and variables → Actions → New repository secret
#        SUPABASE_URL          = https://xxxx.supabase.co            (실서비스 프로젝트)
#        SUPABASE_SERVICE_KEY  = service_role 키 (Project Settings → API → service_role)
#      ★ service_role 키는 여기(GitHub Secrets)에만. 앱 파일·다른 저장소·메모 앱에 절대 붙여 넣지 않습니다.
#        RLS 를 무시하는 전체 권한이라, 새는 순간 DB 전체가 열립니다.
#   3. 이 파일을 .github/workflows/hanok-backup.yml 로, fetch.py 를 backup/fetch.py 로 커밋
#   4. Actions 탭 → hanok-backup → Run workflow 로 한 번 수동 실행 → data/*.json 이 생기는지 확인
#
# 동작: 매일 04:30 KST(19:30 UTC) 세 테이블을 JSON 으로 받아 data/ 에 저장하고, 바뀐 것이 있을 때만 커밋합니다.
#       실패하면 GitHub 가 메일을 보냅니다(Actions 기본). 별도 알림은 없습니다.
# 용량: 예약 1년 ≈ 몇 MB. 커밋이 쌓여도 git 이 차이만 저장하므로 수년은 문제 없습니다.

name: hanok-backup

on:
  schedule:
    - cron: "30 19 * * *"     # 19:30 UTC = 04:30 KST (영업 끝나고 아무도 안 쓰는 시각)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # 백업 파일을 이 저장소에 커밋하기 위해

concurrency:
  group: hanok-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5   # v4 는 Node 20 이라 러너가 경고를 냅니다

      - name: 설정 확인
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_KEY 시크릿이 없습니다"; exit 1
          fi
          mkdir -p data

      # 받기 — backup/fetch.py (표준 라이브러리만. 예약은 전체(삭제 포함 — 실수로 지운 것도 되살릴 수 있게), 로그는 최근 30일)
      - name: 받기
        run: python3 backup/fetch.py data

      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name  "hanok-backup"
          git config user.email "hanok-backup@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "backup $(date -u +%Y-%m-%d)"
          git push
