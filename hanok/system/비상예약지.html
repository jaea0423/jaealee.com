<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한옥반점 비상 예약지</title>
<style>
/* A4 한 장에 세 장(3행 × 1열, 가로로 길게 — 8차-X 재아). 시스템이 안 될 때 손으로 받는 예약지.
   순서는 마법사와 같습니다(경로 → 날짜·시각 → 인원 → 좌석 → 식사 → 예약자 → 요청).
   왼쪽은 고르는 것(동그라미), 오른쪽은 쓰는 것(줄) — 손으로 쓸 자리를 넉넉히 둡니다.
   인쇄: 크롬에서 Ctrl+P → 여백 '없음' 또는 '최소', 배경 그래픽 켜기. 점선을 따라 잘라 카운터에 비치 */
@page{size:A4; margin:8mm}
*{box-sizing:border-box}
body{margin:0; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#222; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.sheet{width:194mm; margin:0 auto; display:grid; grid-template-columns:1fr; grid-template-rows:repeat(3,93mm); gap:0}
.slip{border-bottom:1px dashed #999; padding:4mm 5mm 3mm; display:grid; grid-template-columns:86mm 1fr; grid-template-rows:auto 1fr auto; column-gap:6mm; row-gap:2mm; font-size:9.5pt; break-inside:avoid; height:93mm; overflow:hidden}
.slip:last-child{border-bottom:none}
.slip h2{grid-column:1 / -1; margin:0; font-size:12pt; display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #222; padding-bottom:1.2mm; letter-spacing:.02em}
.slip h2 small{font-weight:400; font-size:8pt; color:#666; letter-spacing:0}
.slip h2 .no{font-weight:400; font-size:8pt; color:#999}
.col{display:flex; flex-direction:column; gap:1.6mm; min-width:0}
.row{display:flex; align-items:center; gap:2mm; min-height:6.6mm}
.row .k{flex:none; width:17mm; font-weight:700; color:#444; white-space:nowrap}
.row .v{flex:1; border-bottom:1px solid #999; min-height:7mm}
.row .v.sm{flex:1 1 0; white-space:nowrap; font-size:9pt; color:#555}
.opts{display:flex; gap:1.5mm; flex-wrap:wrap}
.opt{border:1px solid #888; border-radius:3mm; padding:0.5mm 2.4mm; font-size:9pt; white-space:nowrap}
.opt.wide{letter-spacing:.06em}
.write .row{align-items:flex-start; min-height:0}
.write .row.tall{flex:1 1 0; align-items:stretch}
.write .row.tall .v{min-height:15mm; height:auto}
.write .row .k{padding-top:1.2mm}
.foot{grid-column:1 / -1; align-self:end; border-top:1px solid #222; padding-top:1.4mm; display:flex; justify-content:space-between; gap:3mm; font-size:8pt; white-space:nowrap; color:#444}
.foot b{color:#B0553F}
.box{display:inline-block; width:4mm; height:4mm; border:1.2px solid #444; vertical-align:middle; margin-right:1mm}
@media screen{ body{background:#eee; padding:10mm 0} .sheet{background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.15)} }
</style>
</head>
<body>
<div class="sheet">
<script>
/* 같은 전표 3장 — 번호만 다릅니다 */
function slip(n){
  return '<div class="slip">' +
  '<h2><span>한옥반점 예약지 <small>시스템이 안 될 때 · 받은 즉시 이대로 적기</small></span><span class="no">' + n + ' / 3</span></h2>' +
  '<div class="col">' +
    '<div class="row"><span class="k">경로</span><span class="opts"><span class="opt">전화</span><span class="opt">네이버</span><span class="opt">방문</span><span class="opt">기타(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span></span></div>' +
    '<div class="row"><span class="k">날짜·시각</span><span class="v sm">&nbsp;&nbsp;월 &nbsp;&nbsp;&nbsp;일 (&nbsp;&nbsp;&nbsp;)</span><span class="v sm">오전·오후 &nbsp;&nbsp;&nbsp;시 &nbsp;&nbsp;&nbsp;분</span></div>' +
    '<div class="row"><span class="k">인원</span><span class="v sm">총 &nbsp;&nbsp;&nbsp;&nbsp;명</span><span class="v sm">유아 &nbsp;&nbsp;&nbsp;명 · 의자 &nbsp;&nbsp;&nbsp;개</span></div>' +
    '<div class="row"><span class="k">좌석</span><span class="opts"><span class="opt wide">룸: 조조 유비 장비 관우 공명 주유 초선 동탁</span><span class="opt">1층 테이블</span><span class="opt">저층 테이블</span><span class="opt">미정</span></span></div>' +
    '<div class="row"><span class="k">식사</span><span class="opts"><span class="opt">코스 (&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span><span class="opt">미정</span><span class="opt">해당 없음</span></span></div>' +
  '</div>' +
  '<div class="col write">' +
    '<div class="row"><span class="k">예약자</span><span class="v"></span></div>' +
    '<div class="row"><span class="k">전화</span><span class="v"></span></div>' +
    '<div class="row tall"><span class="k">알러지·요청</span><span class="v"></span></div>' +
    '<div class="row tall"><span class="k">메모</span><span class="v"></span></div>' +
  '</div>' +
  '<div class="foot"><span>받은 사람 __________ · 받은 시각 ____ : ____</span><span><span class="box"></span><b>시스템 입력 완료</b> (입력한 사람 __________)</span></div>' +
  '</div>';
}
document.write(slip(1) + slip(2) + slip(3));
</script>
</div>
</body>
</html>
